    hf_repo: moonshotai/Kimi-K3.1-Pro
    released: 2026-11-02
    model_id: kimi-k3.1-pro
    status: recorded
    note: K3.1 系列的唯一档位 —— HF 上没有非 Pro 的 K3.1，moonshotai 全量 20 个仓核过。
          **「Pro」在本仓两家含义不同**：ds-v4-pro 判 side 是因为名族集合与 V4-Flash 完全相同，
          而这一份的名族是 K3 的严格超集（K3 独有 0 族），厂商自述 post-trained from K3。
          相对 K3 唯一的结构变化是**那 24 个全注意力层换成 Gated DSA**（+120 张量 = 24 层 × 5 个
          indexer 族），69 个 KDA 层一字未动，93 层 / 7168 / 896 专家 / top-16 全不变。
          索引缓存宽度取 wk 的**输出维 128**（32 个索引头 MQA 共享一条键），
          按 index_n_heads × index_head_dim 算会**高估 32 倍**。
          KV 27,648 → 33,792 B/token（+22.2%，1M 下 27.00 → 33.00 GiB，两侧同为 dtype_fallback）——
          而 index_topk 2048 降的是每 query 读取量，**不是容量，两件相反**。
          卡上 2.8T / 104B 与 K3 逐字相同，分辨这两代只能靠清单

