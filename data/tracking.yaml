# ─────────────────────────────────────────────────────────────────────
# 视频生成线。**policy 与上面那条并列，不是替换。**
#
# 语言模型线的「每个家族追最新旗舰」有个前提：家族内的代际差异可以靠 lineage 文字
# 讲清楚。视频线不成立 —— Wan2.2 的两个同代档位用两套 VAE（latent token 数差 4 倍）、
# LTX-2→2.3 的参数涨幅不在主干、HunyuanVideo 1.5 相对 13B 把 VAE 与注意力形态全换了。
# 这些差异落在**会进推导公式的数**上，写成一句 lineage，下游算 token 数就会错。
# 这是本仓第一次有两套选题标准，所以单写一条，不要默认沿用上面那条。
#
# 依据与逐条排除理由见 docs/video-gen-gate-a.md。
#
# 消费情况：site 的 data.ts 两张名册都读了（`roster()` / `familyGroups()`，
# 总览与家族演进各按线分表）。**refresh_check.py / kv_table.py 仍只读 `families`** ——
# 接进去是另一件事。
#
# 这里曾有九条 `status: planned` 对着已经落地的记录，一路陈旧到站点开始读它为止：
# **没有消费点的字段不会被发现写错了**，而「计划中」读起来和「还没排到」一样自然。
# 现在 validate.py 的 check_roster 按 model_id 有没有记录对账。

video_policy: >-
  每个 family 追最新旗舰，外加一个差分基线；
  VAE 或注意力形态变了的同代档位单独录；
  纯分辨率/时长/任务（i2v、s2v、animate）变体不录，进记录内的变体表。

