id: loop-transformer
name: 递归深度 / Loop Transformer
aliases: ["loop transformer", "recurrent depth", "layer reuse", "universal transformer", "depth recurrence"]
category: depth
question: >-
  同一套层权重被循环执行 N 次：**参数量与计算量解耦**。
  于是本仓三套参数口径（参数量 / 权重存储 / 激活参数）全都答不出「这个模型要多少算力」——
  权重存储按一份算，而 FLOPs 要乘 N，而 N 可能随输入变。
  infra 要准备的是一个现在没有的轴：每 token 的执行深度。

# 空数组是一种结论，不是漏填。schema 里没有能表达「层复用 / 循环深度」的字段，
# 所以这条范式**推不出 L1**：即便明天录进一份这样的模型，看板也认不出来。
match: []
match_note: >-
  **本仓 schema 表达不了这个范式。** arch 下现有 15 个块（layers / hidden / vocab / norm /
  norm_eps / activation / position / attention / ffn / moe / residual / retrieval / decoding /
  vision / audio），没有一个能说「这 N 层是同一份权重循环 M 次」。
  arch.layers 是个整数，它同时被读作「权重里有几层」与「一次前向过几层」——
  循环深度一出现，这两件事就不再相等，而**字段会悄悄地只说对一半**（坑 #7 的形状：
  一个字段压两件事，消费点会替你选一个含义）。
  要立判据得先加字段，建议形态：arch.depth.{unique_layers, executed_layers, adaptive}。
  在那之前这一行恒为「未录」，而这正是它该显示的。

watchlist: []

paper:
  title: Universal Transformers
  ref:
    kind: paper
    url: https://arxiv.org/abs/1807.03819
    locator: >-
      §2.1：递归不是对序列位置而是对「深度」，转移函数跨位置与跨步共享，
      于是层数可变（variable depth）；§2.2 Dynamic Halting：每个位置各自用 ACT
      预测停止概率，停了就把状态复制到下一步，直到全停或到达上限
    accessed: 2026-10-31
  note: >-
    **范式级。** §2.1 那句「转移函数跨位置与跨步共享、可以施加任意次」就是本条目说的
    参数量与计算量解耦；§2.2 的逐位置 ACT 正是本仓缺的那根轴 —— 每 token 的执行深度，
    而且它在这篇里是模型自己预测的，不是配置项。
    **刻意不引「Looped Transformers as Programmable Computers」（arXiv:2301.13196，
    2026-10-31 现查）**：那篇也把 transformer 放进循环，但问的是表达力
    （13 层循环能模拟一台指令集计算机），不是「同一套权重循环 N 次该怎么算算力」——
    同一个词，不是同一回事，而本条目的别名里恰好就有 loop transformer。
    这条引用有一个独立旁证：本看板 hybrid-attention 的 L0（arXiv:2006.16236）§3.4 自己写着
    「与 Universal Transformers 不同，我们的递归是对时间而不是对深度」——
    两条范式在文献里就是这么划开的，不是本仓自己划的。

production:
  state: unsurveyed
  note: 公开仓看不见这一档；实证归 data-private（P3）

infra_signals:
  - text: >-
      这是本看板上唯一一条「连判据都还立不起来」的范式，所以它排在待办里的位置和别的不同：
      别的范式缺的是数据，这一条缺的是字段。
    evidence: judgement
  - text: >-
      一旦有记录落地，本仓的推导链会在 derive.py 处断掉：每 token FLOPs 按 arch.layers
      线性折算，而循环深度让这个折算失效 —— 与 D1（算术强度按参数量比例折算，对混合精度不成立）
      同形，都是推导式里一个因子被当成常量。
    evidence: judgement

open_questions:
  - >-
      **L0 填上了不改这一条的状态：本仓 schema 仍表达不了这个范式**（见 match_note），
      所以这一行会是 L0「已录」而 L1 恒为「未录」。**两格不矛盾** —— 五档的事实来源不是一处，
      L0 是外部文献、L1 是本仓记录命不命中。看板上这一行正是「有论文、立不起判据」长什么样。
  - >-
      这篇是 2018 年的 encoder-decoder 时代，**它的 ACT 停止是训练出来的，而本条目要跟的
      那一代（若有）可能把深度做成推理期可调的配置项**。两者对 infra 不是同一个问题：
      前者让每 token 深度不可预测（批内长度不齐、调度要动），后者只是多一个常量因子。
      加 arch.depth 字段时这两种要分开表达（adaptive 那个布尔位就是为此留的），
      不要合成一个整数。
  - >-
      加字段之前不要先录模型：没有 arch.depth 这一块，录进来的记录会把循环深度写进散文，
      而散文上没有任何闸口。顺序是先 schema、再取数。

evidence:
