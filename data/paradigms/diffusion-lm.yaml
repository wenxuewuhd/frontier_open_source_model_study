id: diffusion-lm
name: 扩散语言模型（dLLM）
aliases: [dLLM, LLaDA, Dream, SDAR, "diffusion LM", "masked diffusion"]
category: decoding
question: >-
  自回归的 decode 是「权重带宽受限、每步一个 token」；扩散式解码是「每步刷一批位置、
  步数可调」。两者的瓶颈不在同一侧，**KV 缓存这个概念本身都可能不成立**。
  所以 infra 要问的不是「快多少」，而是「decode 的算术强度换了一个量级之后，
  现有的批调度、缓存管理、算子表还剩多少能复用」。

match:
  - test: { src: rec, op: eq, path: kind, values: [dllm] }
    why: >-
      本仓 schema 的 kind 枚举里**已经有 dllm 这一项**，所以这个范式是能被表达的 ——
      命中为零是「没录」，不是「录不了」。这两件事在看板上必须分得开。
match_note: >-
  判据能跑，命中 0 份（2026-10-31）。对照 loop-transformer 那条：那一条的 match 是空数组，
  因为 schema 里压根没有能表达它的字段。**同样是「看板上空一行」，成因不同、修法不同** ——
  这条要去录模型，那条要先加字段。

watchlist:
  # 名字取自 PLAN.md §2「dLLM（LLaDA、Dream、SDAR 等）」—— 那是本项目自己的选题清单，
  # 算在仓内来源。**仓名一律空着**：HF 仓 id 要现查才算数，凭印象写一个是把猜测存成事实。
  - name: LLaDA
    note: 仓名与规格未查
  - name: Dream
    note: 仓名与规格未查
  - name: SDAR
    note: 仓名与规格未查

paper:
  title: Structured Denoising Diffusion Models in Discrete State-Spaces
  ref:
    kind: paper
    url: https://arxiv.org/abs/2107.03006
    locator: >-
      §3.1 的「Absorbing state」一段：转移矩阵让每个 token 以概率 β_t 吸收到 [MASK]，
      平稳分布的全部质量落在 [MASK] 上；§4「Autoregressive models are (discrete) diffusion models」：
      一步揭一个 token 的确定性掩码过程恰好就是自回归
    accessed: 2026-10-31
  note: >-
    **范式级**：定义的是离散状态扩散这一类模型（D3PM），不绑任何一份权重 ——
    本条目 watchlist 里的 LLaDA / Dream / SDAR 是它 §3.1 吸收态（[MASK]）那一支的实例。
    **选它而不是同名的那篇**：「Diffusion-LM Improves Controllable Text Generation」
    （arXiv:2205.14217，2026-10-31 现查）走的是连续嵌入上的高斯扩散，与本条目跟的掩码路线不是一支；
    条目 id 叫 diffusion-lm，但它跟的是掩码扩散，这一点容易引错。
    **这篇支持 question 的哪一半要分开说**：「步数可调」有 §4 作依据（自回归是 T = N 那一端，
    步数少则每步揭的位置多，同一族里连续取值）；而「KV 缓存这个概念本身都可能不成立」
    **是本仓的 infra 判断** —— 2021 年这篇不谈 decode 侧，不要当成它说的。

production:
  state: unsurveyed
  note: 公开仓看不见这一档；实证归 data-private（P3 自测基准）

infra_signals:
  - text: >-
      本仓对这个范式的事实储备是零：0 份记录、0 条平台条目、0 个取过的权重清单。
      看板上这一行的价值就是把这个零显式化 —— D2（选题漂移没有任何闸口查）的实例之一。
    evidence: derived
  - text: >-
      扩散式解码与生成类多模态共用「步数」这根轴（PLAN §3.2 的最后一句）。
      本仓生成线已经有 9 份记录和一套采样口径字段，dLLM 落地时应当先看那套字段够不够用，
      而不是另起一套。
    evidence: judgement

open_questions:
  - >-
      **L0 引的是 2021 年那篇，而 watchlist 三个候选是近两年的权重**，中间隔着掩码扩散的
      若干轮细化（连续时间极限、简化的 ELBO 等），本轮一篇都没查、没引。
      所以这一格说的只是「这一类模型有范式级定义」，**说不了「本仓要跟的那三份按哪一版训的」**
      —— 后者得等 L1 真的录进来，从各自的技术报告里读。
  - >-
      L1 未录：watchlist 三个名字的仓名、参数量、许可都没查。
      这是一次定向取数的活，不是一次判断。

