id: sparse-attention
name: 稀疏注意力
# 别名只做展示。拿名字当判据会锚到别处同名词（坑 #2 已经撞过三次），
# 命中靠下面 match 里的字段路径。
aliases: [NSA, DSA, MoBA, MSA, QSA, "MiniMax Sparse Attention", "Qwen Sparse Attention"]
category: attention
question: >-
  打分器选出来的那批 token / 块，**数据还得在**。所以 KV 容量不会因为稀疏而降，
  降的是注意力的计算量 —— infra 要准备的是「全量 KV 驻留 + 每层一次 topk 选择」
  这个组合，而不是「缓存变小了」。

match:
  - test: { src: rec, op: truthy, path: arch.attention.sparse }
    why: >-
      本仓把稀疏注意力的全部参数收在 arch.attention.sparse 下（index_topk /
      index_head_dim / index_kv_source / mechanism）。这一块存在即这代做稀疏，
      与叫什么名字无关。
match_note: >-
  **只认 arch.attention.sparse 这一块，不认 mechanism 里的词。** 实测 13 份命中记录的
  mechanism 字段里出现过 DSA、MSA、Qwen Sparse Attention、「indexer 打分选块」四种写法，
  按词匹配会把同一件事切成四个范式。
  已知的匹配边界：**滑窗注意力不算在这里** —— 它也是「不看全部 token」，但它不打分、
  不选择，省的是另一种账（固定窗口缓冲 vs 全量驻留），归混合注意力那一条。

paper:
  title: Generating Long Sequences with Sparse Transformers
  ref:
    kind: paper
    url: https://arxiv.org/abs/1904.10509
    locator: >-
      §4.2 Factorized self-attention，式 2–4：把稀疏定义成连通模式 S_i ⊂ {j : j ≤ i}，
      即每个输出位置只看前文的一个子集；Figure 3 是 strided / fixed 两种二维方案
    accessed: 2026-10-31
  note: >-
    **范式级。** §4.2 定义的是「注意力的连通模式可以是一个子集」这件事本身，不绑任何一家实现 ——
    本仓 13 份命中记录各自引的厂商技术报告（DSA / MSA / Qwen Sparse Attention）是 L1 证据，不是这一档。
    **但这篇只覆盖本条目的一半，差在哪必须写出来**：它的子集是设计时固定的模式
    （Figure 3 的 strided / fixed），**不是打分器在运行时选出来的**；而且它要省的是训练期的
    O(n√n) 计算，2019 年这篇压根不谈 decode 期的 KV 驻留 —— 本条目 question 里
    「全量 KV 驻留 + 每层一次 topk」那句是本仓的 infra 判断，不要当成它说的。
    动态选块那一支的范式级来源见 open_questions 第一条。

infra_signals:
  - text: >-
      稀疏注意力降的是注意力算力，不降 KV 容量 —— 选中的 token 其 K/V 必须可取，
      所以全量 KV 仍要驻留。把它当「省显存」的手段排期会排错。
    evidence: judgement
  - text: >-
      每层一次 topk 是新增的常驻算子，而不是一次性开销：命中记录里绝大多数是逐层各算一次
      （只有少数代际做了跨层复用上游选择结果）。算子表上它和 attention 本体同量级地出现。
    evidence: judgement

open_questions:
  - >-
      **L0 只覆盖固定模式那一支，动态选块那一支还没有范式级来源。** 两个候选
      ——「Native Sparse Attention: Hardware-Aligned and Natively Trainable Sparse Attention」
      （arXiv:2502.11089）与「MoBA: Mixture of Block Attention for Long-Context LLMs」
      （arXiv:2502.13189），两篇的标题与作者表 2026-10-31 都现查过 ——
      **但作者表就是本仓跟踪的那两家**（前者 DeepSeek、后者 Moonshot）。
      于是「范式级文献」与「厂商侧实例报告」这条线在它们身上判不干脆，本轮没判。
      paper 块只放一篇，分不开时宁可少引：少引看得见，引错看不见。
  - >-
      本条目 L0 与 L1 的时间跨度是 6 年（2019 → 2025 的命中记录），中间掐掉了整条演化
      （KV 淘汰、块选择、可训练稀疏）。**所以 L0「已录」说的只是「这一类有范式级定义」**，
      说不了「本仓这 13 份按哪一支做的」—— 后者在各份记录的 mechanism 字段里，不在这一格。

evidence:
  question: judgement
  match: derived
  match_note: derived
  paper: official
  paper.note: judgement
  infra_signals: judgement
  open_questions: judgement
