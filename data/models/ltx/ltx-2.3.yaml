id: ltx-2.3
family: ltx
kind: video-gen
display_name: LTX-2.3 (22B distilled)
released: '2026-03-04'
license: ltx-2-community-license
visibility: public

# **录的是 `ltx-2.3-22b-distilled`**（8 步、CFG=1），不是 dev 档。两条理由：
#
# (a) **采样口径只有蒸馏档有一手来源。** 这份卡上没有任何运行配方
#     （diffusers 支持写的是 "coming soon"），唯一的采样数字是 checkpoint 表里
#     蒸馏档那一行「8 steps, CFG=1」。录 dev 的话 sampling 整块都只能靠
#     厂商参考实现（第三档来源），而 schema 要求 generation.sampling.cfg 必填。
# (b) **结构那一半与选哪档无关，这是验过的，不是假设。** dev 与 distilled 两个
#     单文件包逐张量比对：**5,947 个名字完全相同、形状与 dtype 零处不同、
#     内嵌 config 逐字节相同**。所以选择只决定 sampling 的口径，不动任何结构数字。
#
# 由此，**本记录的 8 步与前代 ltx-2 的 40 步不是代际差**：两代都发了
# 「全量 dev + 8 步蒸馏」两档，变的是卡把哪一档摆在前面。见 lineage 与 R2。
#
# 另有两条这一族的取数事实，与 tracking.yaml 的 note 不同，以实测为准：
#
# 1. **「仓里没有 config」只对文件系统成立。** 顶层与组件目录确实一份 config.json
#    都没有，但**完整的 config 在 safetensors 头的 `__metadata__.config` 里**
#    （transformer / vae / scheduler / audio_vae / vocoder 五块，另有
#    `model_version: "2.3.0"` 与 license 全文）。所以 Gate B 的双路对账是有的，
#    只是 `fetch_hf.py` 会丢掉 `__metadata__`，facts/ltx-2.3/cfg.json 因此是空的
#    —— 那是取数脚本的覆盖面问题，不是「这个仓没有 config」。
#    本记录的 config 侧依据就是这个内嵌 config，已上报脚本缺口。
# 2. **取数要 `--include`。** 顶层 8 个 .safetensors 是 8 个不同的模型，没有 index.json；
#    而 dev 与 distilled 形状完全相同，连 dtype 冲突都报不出来，
#    所以拦住它的是「没有 index 而顶层多文件」那道防线，不是冲突检测。
#
# 口径沿用 wan2.2-ti2v-5b 的三条（params 只算 DiT、不建 arch 块、没有 KV cache 这笔账）。

