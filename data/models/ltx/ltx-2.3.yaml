      但单文件包的 safetensors 头里有完整 config，分 transformer / vae /
      scheduler / audio_vae / vocoder 五块，另有 `model_version: "2.3.0"`。
      结构字段取自这里：transformer 48 层 / 32 heads × 128 / in_channels 128 /
      cross_attention_dim 4096 / caption_channels 3840 / audio 32 × 64 /
      audio_cross_attention_dim 2048 / `apply_gated_attention: true` /
      `use_embeddings_connector: true` / `connector_num_layers: 8` /
      `connector_num_attention_heads: 32` / `connector_attention_head_dim: 128` /
      `connector_num_learnable_registers: 128` / `caption_proj_before_connector: true` /
      `cross_attention_adaln: true` / `rope_type: "split"` /
      `frequencies_precision: "float64"`；
      vae `CausalVideoAutoencoder` latent_channels 128 / patch_size 4 /
      causal_decoder false / encoder_base_channels 128；
      audio_vae mel_bins 64 / z_channels 8 / sampling_rate 16000 /
      `downsample_time: false` / duration 5.12 s；
      vocoder upsample_rates [5,2,2,2,2,2] 另带一段 bwe
      （input 16000 → output 48000）。
      **dev 档的内嵌 config 与这份逐字节相同**，所以 config 侧也与选哪档无关
  - kind: modelcard
