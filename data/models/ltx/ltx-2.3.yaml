reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  method: >-
    **config 侧存在，但不在文件系统上。** tracking.yaml 的 note 说这一份
    「整个仓没有任何 config，Gate B 只剩清单一路」——
    前半句对（10 个文件里没有 config.json），后半句不对：
    完整 config 在 `__metadata__.config` 里（transformer / vae / scheduler /
    audio_vae / vocoder 五块）。所以 Gate B 的双路对账是齐的，
    只是 `fetch_hf.py` 丢掉 `__metadata__`，facts/ltx-2.3/cfg.json 因此是空的，
    derive 的「层数」一项显示为 skip 而不是 ok —— 这是 `fetch_hf.py` 的缺口，
    不是这个仓没有 config。
    **收尾条件**：`facts/ltx-2.3/cfg.json` 不再是 `{}` 的那天（现在实测是空对象），
    这两句删掉、重跑 derive，并确认「层数」从 skip 变 ok。
    判据是一条命令：`python -c "import json;print(json.load(open('facts/ltx-2.3/cfg.json'))=={})"`
    印出 False 就该收尾，不用来问人。

    Gate B 三路：内嵌 config × 权重清单（5,947 张量）× 厂商参考实现。
    结构字段逐项对读：num_layers 48 对 transformer_blocks.0–47；
    num_attention_heads 32 × attention_head_dim 128 = 4096 对
    `attn1.to_q.weight` [4096,4096]；audio 32 × 64 = 2048 对
    `audio_attn1.to_q.weight` [2048,2048]；
    `apply_gated_attention: true` 对清单里的 `to_gate_logits`；
    `connector_num_layers: 8` 对 `video_embeddings_connector.transformer_1d_blocks.0–7`；
    `connector_num_attention_heads: 32 × 128` 对
    `video_embeddings_connector.learnable_registers` [128, 4096]
    （前代是 30×128 = 3840，实测 [128, 3840]）；
    `caption_proj_before_connector: true` 对 DiT 里
    `caption_projection` / `audio_caption_projection` 两个模块的**消失**，
    也对参考实现那句「22B models: projection is in the text encoder」；
    vae `latent_channels` 128 对 `encoder.conv_out` [129,…]；
    audio_vae `downsample_time: false` 对 latent_hz 100 的推算。

    字节对账：清单按 dtype 算 46,148,472,534 B，文件 46,149,344,974 B，
    差 872,440 B（一个 safetensors 头，5,947 个张量的头大小量级吻合）。

    **checkpoint 等价性**：dev 与 distilled 两个头各读一次，
    5,947 个名字完全相同、形状与 dtype 零处不同、内嵌 config 逐字节相同。
    这是「选哪档不影响结构数字」这个说法的依据，不是假设。

    **跨代差分逐参数验**（本记录最值得报的一项）：
    48 块主干 +29,795,328，拆成每块 +620,736，再拆成
    六套 to_gate_logits 590,016 + 两张 prompt 调制表 12,288 +
    原有调制表 6 行扩 9 行 18,432 —— 三项相加正好 620,736，**没有剩余项**。
    另外逐组件比对了 VAE（−496,374,016，形状变了 51 处）、
    音频 VAE（逐字节相同）、声码器（+73,492,230，张量数 194 → 1,227）。

    外部锚：**这个仓没有** —— repoinfo.json 里没有 safetensors tally
    （HF 只对有 index.json 的仓统计）。所以参数量这一侧只有本仓一路，
    唯一的外部约束是文件大小与清单字节的对账。
    前代有逐位相同的 tally，可以反过来校准本仓的归类口径没问题。

    Gate C：判断类字段 17 处，逐条在 evidence 里标了 derived 或 judgement。

review:
  - id: R1
    field: '-'
    severity: miscategorized
    claim: 「整个仓没有任何 config，Gate B 只剩清单一路」（tracking.yaml 的 note）
    finding: >-
      文件系统上确实没有 config.json，但单文件包的 safetensors 头里有完整 config
      —— transformer / vae / scheduler / audio_vae / vocoder 五块，
      外加 `model_version: "2.3.0"` 和 license 全文。
      厂商自己的加载器就是从这里读的（`LTXModelConfigurator.from_metadata`
      取 `metadata["config"]`，`detect_model_version` 取 `model_version`
      来决定默认步数是 30 还是 40）。
      所以这是「config 换了位置」而不是「config 不存在」，
      而本仓的三态契约里这两种空不一样
    resolution: corrected
    changed_to: >-
      记录按双路写：config 侧用内嵌 config，清单侧用 5,947 张量，
      sources 里给了定位。tracking.yaml 的 note 与 fetch_hf.py 丢弃
      `__metadata__` 这两件事都已上报 —— 它们是共享文件，本记录不改
  - id: R2
    field: generation.sampling.steps
    severity: imprecise
    claim: 「LTX-2 要 40 步，LTX-2.3 只要 8 步，代际省了 5 倍」
    finding: >-
