        本记录录的就是这一档。单文件包，里面是 DiT + 连接器 + 文本投影 +
        视觉 VAE + 声码器 + 音频 VAE 六样（5,947 张量，清单总量 23,069,505,387）；
        **不含文本编码器**（这一代根本没发）、不含上采样器
    - name: ltx-2.3-22b-dev
