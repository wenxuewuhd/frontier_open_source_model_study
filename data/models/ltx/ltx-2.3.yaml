          装在 UINT8 容器里 —— numel 是容器数不是参数数，还原因子由 scale 形状逐张量复核过（权重还原后的逻辑长度必须等于 scale
          的组数乘组大小）。 块与 scale 由形状量出、不抄 config：注意力 [1,16]、稠密 FFN [1,16]。 落盘 21,699,921,462
