      本代的内嵌 vae config **没有这两个字段**，只有 encoder_blocks /
      decoder_blocks 的块表。所以本代的 32 与 8 是算出来的：
      四个压缩块里空间维被 ×2 三次、时间维被 ×2 三次，再乘 patch_size 4（仅空间）。
      这条读法先在前代上校准过（前代同时给了块表与两个 ratio，按同一读法得到
      32 与 8，与声明值一致），而且块表里 `multiplier` 是通道倍数的读法
      也被实测顶住了（按它算本代通道梯到 1024、前代到 2048，与清单一致）
    resolution: confirmed
