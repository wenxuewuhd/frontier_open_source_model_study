bottlenecks:
  - dimension: compute
    finding: >-
      代际增量跑在**文本 token 上**，不在视频 token 上。涨出来的 1.74B
      （连接器 +1.31B、文本投影 +0.43B）处理的是几十到几百个文本 token、
      每 prompt 一次；而每步要过的 48 块主干只涨了 0.161%
    quantified: >-
      主干 18,531,581,952 → 18,561,377,280（+29,795,328，+0.161%，逐参数对得上）；
      连接器 708,940,800 → 2,016,166,400；文本投影 722,534,400 → 1,156,061,184。
      默认档 768×512×121 帧的视频 token 是 16×16×24 = 6,144，
      音频 token 约 504（100 Hz × 5.04 s）—— 文本侧的 token 数比这两个都小一两个量级
    fix: >-
      按参数量外推单步成本会把这一代算高 9%，实际只高 0.6%。
      做容量规划要先按「每 prompt 一次」和「每步一次」分开两桶，
      再各自乘自己的次数
    visibility: public
  - dimension: compute
    finding: >-
      逐头门控给每套注意力加了一次 [n, d] × [d, 32] 的投影与一次按头缩放。
      参数量上微不足道，但它是六套注意力各一次，而且插在注意力输出之后 ——
      是个融合点而不是新的大矩阵乘
    quantified: >-
      每块 +590,016 参数（占该块的 0.153%），即 48 块共 28,320,768；
      六套分别是视频自/交叉 [32,4096]、音频自/交叉 [32,2048]、
      音→视 [32,4096]、视→音 [32,2048]，各带 [32] 的 bias
    fix: >-
      算子侧要的是「注意力输出 × 逐头标量」的融合（gate = sigmoid/softmax 后
      按头广播乘）。不融合的话 48 层 × 6 套 = 288 次小 kernel 调用，
      每次的计算量都不够摊开启动开销
    visibility: public
  - dimension: host-io
    finding: >-
      这一代**不发文本编码器**，但仍需要它。一次部署要凑：本仓的 46.15 GB
      单文件包 + 前代仓里的 Gemma-3-12B 48.75 GB（F32）+ 上采样器 ——
      **跨仓依赖，而前代那个仓是 157 GB 之外的另一个 314 GB**
    quantified: >-
      本仓 10 个文件、usedStorage 157,633,264,097 B；
      文本编码器要从 `Lightricks/LTX-2` 的 text_encoder/ 取
      （48,749,441,672 B 的 model-* 一套，或 51,612,415,096 B 含连接器的那一套
      —— 但本代的连接器在单文件包里，所以取前者）
    fix: >-
      取哪一套打包要先想清楚：前代那个仓把 Gemma 放了两份命名，
      其中一份捆着**前代的**连接器与聚合投影，而本代这两样已经在自己的包里、
      而且形状不同（投影 [3840,188160] → [4096,188160] / [2048,188160]）。
      拿错那一套会加载一套对不上的投影
    visibility: public

infra_signals:
  - text: >-
      代际差分必须按组件报，不能只报一个总参数量。这一代的名字涨了 16%、
      整包涨了 6.6%、每步要过的主干只涨了 0.161% —— 三个数都对，
      但只有第三个决定单步成本。把它们压成一个「参数量」字段，
      页面上就会显示成「主干变大了」，而事实相反
    evidence: derived
    horizon: now
  - text: >-
      生成类的权重账要按「跑几次」分桶，不是按大小排序。
      文本连接器 2.02B + 投影 1.16B 每 prompt 跑一次，DiT 18.99B 每步跑一次，
      VAE 0.73B 每次生成跑两三遍，声码器 0.13B 跑一遍。
      同一份 23.07B 的清单里，四类的调用频率差两个量级
    evidence: derived
    horizon: now
  - text: >-
      「仓里没有 config」这个判断要分清是文件系统上没有、还是真的没有。
      这一份 10 个文件里一份 config.json 都没有，但完整 config 在
      safetensors 头的 `__metadata__` 里，连 `model_version` 都有 ——
      厂商自己的加载器就是这么认代际的（`detect_model_version` 读这个字段
      来选 30 步还是 40 步的默认值）。按目录判存在性会把「换了位置」读成「不存在」
    evidence: derived
    horizon: now

