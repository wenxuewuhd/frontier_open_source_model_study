      `modulation`，所以 modulation 两代变成 234,010,624 → 340,373,504。
      **两行现在口径相同、可以横着读了**，而且 modulation + time_embed
      在两代上都逐位等于 `breakdown.adaln_modulation`（301,680,640 / 430,600,192）
      —— 这不是重新划线，是把记录自己已经在跟踪的那个量做了干净二分。
      期间**没有**在 per_subsystem 里手工补 `time_embed` 行去遮那句错话：
      桶空时补行会和 derived 的 `params_by_subsystem` 对不上，页面上是
      「有精度、无参数」的格子，而没有任何闸口查这个对账。
      这条规矩已写进 CLAUDE.md 的「改数据」一节

notes: >-
  **这个仓为什么必须用 `--include`，以及拦住它的是哪道防线。**

  顶层 8 个 .safetensors 是 8 个不同的模型（dev / distilled / distilled-1.1 /
  两个蒸馏 LoRA / 两个空间上采样器 / 一个时间上采样器），**没有任何 index.json**。
  而 dev 与 distilled 的形状和 dtype 完全相同 —— 所以「同名张量形状或 dtype 不同」
  那道冲突检测在这里**一条都报不出来**，合并出来的会是一个不存在的模型，
  而每个数看着都合理。真正拦住它的是另一道：「没有 index.json 而顶层有多个
  .safetensors，拒绝猜」。这两道防线守的不是同一件事，前代 LTX-2 撞的是冲突检测
  （distilled 与 distilled-fp8 同名不同 dtype，tracking.yaml 的 note 记的是 7,132 个名字；
  本轮没有重跑这一次撞车，两次取数都直接带了 --include），本代撞的是选分片。

  **仓的字节账**：8 个 safetensors 合计 156,006,863,212 B，加 README 与一张图
  约 156.0 GB；HF 的 usedStorage 报 157,633,264,097 B。
  三个 46.15 GB 的全量档（138,448,035,346 B）占 88.7%。前代主仓是 314 GB，差别主要在两处：
  前代把文本编码器放了两份打包（100 GB），本代根本不发文本编码器；
  前代的 fp8 / fp4 在主仓内，本代搬到两个独立仓。

  **「22b」这个名字的构成**（本记录最值得记住的一行）：
  整包 23,069,505,387 扣掉视觉 VAE 726,106,225、声码器 129,085,032、
  音频 VAE 53,248,402，得 22,161,065,728 —— 即「DiT + 连接器 + 文本投影」。
  按同一条规则算前代得 20,307,649,792，而前代叫「19b」（= 它的 DiT）。
  两代的名字用了两套规则。

