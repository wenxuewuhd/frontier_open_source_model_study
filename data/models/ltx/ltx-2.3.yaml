        method: >-
          **这个仓是五份 LTX 清单里唯一一份调制表不是 F32 的**：290 张
          `*scale_shift_table` 在主仓与 fp8 仓全是 F32，在这里全是 BF16，
          所以它的 modulation 桶报纯 BF16，而另外三档报 MIXED（F32 + BF16 并存）。
          **这是本批取数里唯一一条非量化桶的精度变化**，由 v2-ltx 逐条比名字核出；
          三档若都按多数值填 BF16，精度页横着读会是 MIXED → BF16 → BF16，
          读成「两个量化档都把调制表提到了 BF16」，而实际只有这一档动了。
          完整清单逐项统计（1 分片 8,939 条目，failed_shards 为空），非抽样。 **逐子系统参数量与主仓逐位相同，11 桶零例外**，合计同为
