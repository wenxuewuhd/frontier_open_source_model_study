      `video_a2v_cross_attn_scale_shift_table`、名字里有 `attn` 被 attention
      桶捞走，本代改名成 `scale_shift_table_a2v_ca_video` 后回到 modulation。
      按功能合计（params.breakdown 的 adaln_modulation）是
      301,680,640 → 430,600,192，+42.7% —— 真实增长在这里，
      来自新增的 `prompt_adaln_single` / `audio_prompt_adaln_single`
      与两个门控模块，不是那两行上看到的 ×296 与 −100%。
      **而 time_embed 桶空掉会让页面把那一格判成「这个子系统在这个模型里不存在」**，
      本代有 32 条时间步嵌入张量、90,226,688 参数，那句话是错的
    resolution: corrected
