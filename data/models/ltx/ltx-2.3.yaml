precision:
  weights_release: [BF16, FP32, FP8_E4M3, NVFP4]
  weights_release_scope:
    BF16:
      manifest_taken: true
      in_precision_table: true
      repo: Lightricks/LTX-2.3
      note: >-
        dev / distilled / distilled-1.1 三个全量档。清单里 5,657 个张量是 BF16
        （23,064,774,507 参数），占整包的 99.98%
    FP32:
      manifest_taken: true
      in_precision_table: true
      repo: Lightricks/LTX-2.3
      note: >-
        290 个 `scale_shift_table` 系调制表（4,730,880 参数，0.02%）。
        前代是 194 个 / 3,256,320 —— 涨的是本代新增的 prompt 调制表
        与 6 行扩成 9 行那部分，不是精度策略变了
    FP8_E4M3:
      manifest_taken: true
      in_precision_table: true
      repo: Lightricks/LTX-2.3-fp8
      note: >-
        独立仓，**2026-10-31 取了清单**（`ltx-2.3-22b-distilled-fp8.safetensors`
        8,871 条目，与本记录 BF16 侧取的 distilled 档同一个），逐子系统实测落在
        quantization.official_variants 里。
        原先这里写着「只有文件大小的旁证，不能当覆盖面的结论」—— 现在有实测了：
        参数量 23,069,505,387 与主仓逐位相同。
        **这个仓没有任何 config**，Gate B 的双路对账在它身上只剩清单一路
    NVFP4:
      manifest_taken: true
      in_precision_table: true
      repo: Lightricks/LTX-2.3-nvfp4
      note: >-
        独立仓，只有 dev 一档（`ltx-2.3-22b-dev-nvfp4.safetensors`）。
        **2026-10-31 取了清单**（8,939 条目），逐子系统实测落在
        quantization.official_variants 里；参数量 23,069,505,387 与主仓逐位相同，
        所以 dev 与 distilled 两档的形状一致这件事也顺带验了。
        **这个仓同样没有任何 config**，只剩清单一路。
        文件 21,701,367,310 B，比 BF16 档小 53.0%
  quantization:
    # 这一组值测自单文件整包的 BF16 全量档。逐子系统的桶只拆 DiT 一个组件，
    # 另外五个组件的 dtype 写在 subsystem_method 末段。fp8 与 nvfp4 在两个独立仓，
    # 清单已取（8,871 / 8,939 条），逐子系统实测记在同一层的 official_variants 里 ——
    # 两边都喂精度演进页，所以那两档的两个布尔都为真。
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      modulation: MIXED
      norm: BF16
      io_proj: BF16
      time_embed: BF16
    subsystem_method: >-
      来自完整权重清单（单文件整包 5,947 条目）**逐项穷举、非抽样**：
      每个条目都带 shape 与 dtype，5,657 条 BF16 + 290 条 F32，
      两者相加等于条目数，没有第三种 dtype、没有 scale 容器、没有打包容器。

      **只有 modulation 一桶是混的，其余五桶整格单一 dtype（全 BF16）。**
      modulation 里 8 个全局 AdaLN 模块的输出投影共 335,642,624（16 条 BF16），
      290 张 `*scale_shift_table` 共 4,730,880（**全部 F32**，占整包的 0.02%）。
      前代是 194 张 / 3,256,320 —— 涨的是本代新增的 prompt 调制表
      与 6 行扩成 9 行那部分，不是精度策略变了。

      **六个桶与本记录手写的 `params.breakdown` 逐位对上**，这是这组值最硬的支点
      —— 两套分桶是独立做的（一套由 `classify2()` 按张量名归类，
      一套是逐块数出来的功能分解），它们相等说明归类没有串桶：
      attention 10,500,547,584 = 六套注意力之和 10,502,120,448 − QK-norm 1,572,864；
      dense_ffn 8,054,538,240 = video_ffn 6,443,433,984 + audio_ffn 1,611,104,256
      （**与前代逐位相同**）；
      modulation 340,373,504 + time_embed 90,226,688 = 430,600,192 = adaln_modulation；
      io_proj 1,579,264 = patchify_and_proj_out（这一代没有 caption 投影，
      文本侧改走 `text_embedding_projection` 组件）；
      norm 1,572,864 = 六套注意力里的 QK-norm（它们在 breakdown 里算进各自的注意力）。

      **分桶按功能、不按流**：音频支路与视频支路的同类算子合在一桶，
      所以 `attention` 含六套注意力、`dense_ffn` 含两条支路的 FFN。
      音视频的分流看 `param_scaling`，不看子系统。
      **`audio` 这一桶判「不适用」是对的** —— 它的定义是音频**理解**编码器
      （见 `data/schema/components.json` 的 `audio_vae` 条），
      而本模型的音频张量住在和视频支路完全同一组 `transformer_blocks.0–47` 里、
      是块内并行支路不是一座塔，已按功能分进上面六桶。

      **modulation 与 time_embed 的二分口径**：8 个 AdaLN 模块各含两件东西，
      `.emb.timestep_embedder.*`（正弦→MLP 的时间步嵌入）归 time_embed、
      `.linear.*`（调制投影）归 modulation。所以 time_embed 的 32 条 = 8 × 4，
      modulation 的 16 条 BF16 = 8 × 2。前代是 6 个模块，
      两代**口径相同、可以横着读**：modulation 234,010,624 → 340,373,504、
      time_embed 67,670,016 → 90,226,688，合计 301,680,640 → 430,600,192（+42.7%），
      增量来自新增的 `prompt_adaln_single` 与 `audio_prompt_adaln_single`。

      未列出的 13 个桶（expert / shared_expert / compressor / indexer / retrieval /
      router / embed / lm_head / residual / draft / vision / audio / other）
      在这份清单里**一条张量都没有**，是穷举后的「不适用」：DiT 稠密无 MoE 与路由、
      无 KV 压缩与稀疏索引、文本从 cross-attn 进来所以无输入词表与输出头、
      无残差系数张量、无 MTP、无视觉塔、无音频理解编码器；
      other 为 0 表示每一条张量都归到了类。

      **逐子系统的桶只拆 DiT 一个组件**（`SPLIT_INSIDE` 只含 backbone / dit /
      refiner），所以另外五个组件不在上面任何一行里；它们**逐条都是 BF16**：
      连接器 258 条 2,016,166,400、文本嵌入投影 4 条 1,156,061,184、
      视觉 VAE 170 条 726,106,225、声码器 1,227 条 129,085,032、
      音频 VAE 102 条 53,248,402。整包里的 F32 一条都不在这五个组件里
    official_variants:
      - dtype: NVFP4
        repo: Lightricks/LTX-2.3-nvfp4
        rev: 56fc3df60582
        origin: post_quantized
        tensor_count: 8939
        params_total: 23069505387
        weight_bytes_total: 21699921462
        per_subsystem:
          attention: NVFP4
          dense_ffn: NVFP4
          modulation: BF16
