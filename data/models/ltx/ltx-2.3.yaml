      note: >-
        全量可训练档。与 distilled **逐张量同形同 dtype、内嵌 config 逐字节相同**，
        只有权重值不同 —— 所以本记录的全部结构数字对这一档同样成立，
        差别只在采样口径（dev 的默认步数 30 取自参考实现，卡上没有）
    - name: ltx-2.3-22b-distilled-1.1
