          声码器都在里面），而本记录的清单口径只收 `dit` 一个组件，所以这一条也收到同一个组件上 —— 两边量的不是同一个东西时，对账红了也说明不了什么。
          **逐子系统参数量与主仓逐位相同，6 桶零例外**，合计同为 18,876,174,592 —— 这是「同一份权重的两种存法」的硬证据，也是把 origin 判成
