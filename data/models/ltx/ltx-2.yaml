precision:
  weights_release: [BF16, FP32, FP8_E4M3, NVFP4]
  weights_release_scope:
    BF16:
      manifest_taken: true
      in_precision_table: true
      repo: Lightricks/LTX-2
      note: >-
        dev 与 distilled 的全量档。transformer/ 清单里 3,316 个张量是 BF16
        （18,872,918,272 参数），占 DiT 参数的 99.98%
    FP32:
      manifest_taken: true
