      repo: Lightricks/LTX-2
      note: >-
        两处：一是 BF16 包内的 194 个 `scale_shift_table` 调制表
        （3,256,320 参数，占 0.017%）—— 调制表是 F32 这件事在 wan 那份里也成立，
        看来是这一类模型的通例；二是**整个 Gemma-3-12B 文本编码器**
        （config 的 `dtype: "float32"`，index 的 total_size = total_parameters × 4）。
        后者不在 params 里，但它是部署时最大的一块
    FP8_E4M3:
      manifest_taken: true
      in_precision_table: true
      repo: Lightricks/LTX-2
      container: F8_E4M3
      note: >-
        **同仓不同文件**：这一档是主仓里的 `ltx-2-19b-dev-fp8.safetensors`，
        与 BF16 档同一个 repo、不同的权重文件。
        **2026-10-31 从「定向读头」升级成逐子系统实测**：清单落成了
        facts/ltx-2-fp8-pack，逐子系统精度进了 quantization.official_variants。
        口径收在 `dit` 组件上 —— 这个文件是整包（DiT + VAE + 文本编码器 + 声码器），
        而本记录的清单只收 `transformer/`，两边量的不是同一个东西时对账说明不了什么；
        收到同一个组件后 DiT 的 18,876,174,592 与主仓逐位相同。
        下面这段是升级前那次定向读头的原始记录，留着是因为它独立算过打包因子：

        `ltx-2-19b-dev-fp8.safetensors` 读头 6,404 张量：F8_E4M3 1,176 个
        （16,206,790,656 参数）、BF16 2,682 个、F32 2,546 个。
        **只量化 DiT**：1,176 个 F8 张量全部落在 model.diffusion_model. 前缀下，
        VAE / 连接器 / 文本投影 / 声码器 / 音频 VAE 的参数量与 BF16 档逐字相同。
        覆盖率是 DiT 参数的 85.9%（16.21B / 18.88B），其余仍是 BF16/F32。
        比 BF16 档多出的 2,352 个 F32 张量是 scale。
        文件 27,078,716,018 B，按清单算 27,077,673,866 B，差 1,042,152 B（头）
    NVFP4:
      manifest_taken: true
      in_precision_table: true
      repo: Lightricks/LTX-2
      container: UINT8
      note: >-
        同仓不同文件，理由同 FP8_E4M3 —— **2026-10-31 清单落成 facts/ltx-2-fp4-pack，
        逐子系统精度进了 official_variants**（口径同样收在 `dit` 组件上）。
        `ltx-2-19b-dev-fp4.safetensors` 读头 7,580 张量。**打包因子与块大小逐项验过**：
        1,176 个 U8 张量共 8,103,395,328 个容器元素，而 fp8 档同样的 1,176 个张量
        是 16,206,790,656 个参数 —— 正好 2 倍，即一字节两个 4 位值；
        另有 1,176 个 F8_E4M3 张量共 1,012,924,416 个元素，
        16,206,790,656 / 1,012,924,416 = **16**，即每 16 个值一个 E4M3 scale，
        这就是 nvfp4 的标准块。两个因子（2 和 16）各自独立算出，不是从一个数推的。
        **所以不要按这份清单读参数量**：按容器数会得到 11,785,706,032，
        少算 4.1B。文件 19,988,416,674 B，按清单算 19,987,202,954 B，差 1,213,720 B（头）
  quantization:
    # 这一组值只覆盖 BF16 全量档（`transformer/` 组件），测自 derived 的主仓直方图。
    # fp8 与 fp4 两档的逐子系统实测记在同一层的 official_variants 里
    # （同仓不同文件，口径同样收在 dit 组件上），两边都喂精度演进页 ——
    # 所以那两档的 in_precision_table 为真。
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      modulation: MIXED
      norm: BF16
      io_proj: BF16
      time_embed: BF16
    subsystem_method: >-
      来自完整权重清单（`transformer/` 8 分片 3,510 条目）**逐项穷举、非抽样**：
      每个条目都带 shape 与 dtype，failed_shards 为空，3,316 条 BF16 + 194 条 F32，
      两者相加等于条目数，没有第三种 dtype、没有 scale 容器、没有打包容器。

      **只有 modulation 一桶是混的，其余五桶整格单一 dtype（全 BF16）。**
      modulation 里 6 个全局 AdaLN 模块的输出投影共 230,754,304（12 条 BF16），
      194 张 `*scale_shift_table` 共 3,256,320（**全部 F32**，占 DiT 参数的 0.017%）。
      调制表是 F32 这件事在 wan 那几份里也成立，是这一类模型的通例。

      **六个桶与本记录手写的 `params.breakdown` 逐位对上**，这是这组值最硬的支点
      —— 两套分桶是独立做的（一套由 `classify2()` 按张量名归类，
      一套是逐块数出来的功能分解），它们相等说明归类没有串桶：
      attention 10,472,226,816 = 六套注意力之和 10,473,799,680 − QK-norm 1,572,864；
      dense_ffn 8,054,538,240 = video_ffn 6,443,433,984 + audio_ffn 1,611,104,256；
      modulation 234,010,624 + time_embed 67,670,016 = 301,680,640 = adaln_modulation；
      io_proj 46,156,032 = caption_projection 44,576,768 + patchify_and_proj_out 1,579,264；
      norm 1,572,864 = 六套注意力里的 QK-norm（它们在 breakdown 里算进各自的注意力）。

      **分桶按功能、不按流**：音频支路与视频支路的同类算子合在一桶，
      所以 `attention` 含六套注意力（视频自/交叉、音频自/交叉、a2v、v2a）、
      `dense_ffn` 含两条支路的 FFN。音视频的分流看 `param_scaling`
      （`per_video_token` / `per_sample` 那根轴），不看子系统。
      **`audio` 这一桶判「不适用」是对的** —— 它的定义是音频**理解**编码器
      （见 `data/schema/components.json` 的 `audio_vae` 条），
      而本模型的音频张量住在和视频支路完全同一组 `transformer_blocks.0–47` 里、
      是块内并行支路不是一座塔，已按功能分进上面六桶。

      **modulation 与 time_embed 的二分口径**：6 个 AdaLN 模块各含两件东西，
      `.emb.timestep_embedder.*`（正弦→MLP 的时间步嵌入）归 time_embed、
      `.linear.*`（调制投影，出口是 6 行 × hidden）归 modulation。
      所以 time_embed 的 24 条 = 6 × 4，modulation 的 12 条 BF16 = 6 × 2。
      下一代 ltx-2.3 的模块数是 8（新增 prompt 与 audio_prompt 两套），
      两代**口径相同、可以横着读**：modulation 234,010,624 → 340,373,504、
      time_embed 67,670,016 → 90,226,688。

      未列出的 13 个桶（expert / shared_expert / compressor / indexer / retrieval /
      router / embed / lm_head / residual / draft / vision / audio / other）
      在这份清单里**一条张量都没有**，是穷举后的「不适用」而不是没测：
      DiT 稠密无 MoE 与路由、无 KV 压缩与稀疏索引、文本从 cross-attn 进来
      所以无输入词表与输出头、无残差系数张量、无 MTP、无视觉塔、
      无音频理解编码器；other 为 0 表示每一条张量都归到了类。
    official_variants:
