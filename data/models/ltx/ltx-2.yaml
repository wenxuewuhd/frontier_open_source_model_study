  precision.quantization.official_variants: derived
  # 逐子系统精度是从 transformer/ 的 8 个 safetensors 头实测的，不是厂商声明值。
  # 不显式写这一条，它会落进上面 precision: official 的前缀继承里，
  # 于是不出现在 validate.py --list-judgements，绕过 Gate C 的人工复核
  precision.quantization: derived
  bottlenecks: judgement
  infra_signals: judgement
  notes: judgement
  open_questions: judgement

reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  method: >-
    Gate B 三路：组件 config（9 份）× 权重清单（transformer/ 8 分片 3,510 张量）
    × 厂商参考实现（ltx-pipelines / ltx-core）。

    结构字段三路交叉：48 层与 32×128 在 transformer/config.json、
    `LTXModelConfigurator` 的默认值、以及清单里 transformer_blocks.0–47
    三处一致；patch_size 1 / patch_size_t 1 与清单里 `proj_in.weight`
    [4096, 128]（128 = latent 通道，没有 patch 展开；下一代同一个张量叫
    `patchify_proj.weight`）一致；
    VAE 的 32/8 在 vae/config.json 的两个 ratio、transformer config 的
    vae_scale_factors [8,32,32]、以及块表的 2^3 × patch 4 三处一致；
    latent_channels 128 由 `encoder.conv_out` [129,…] 与 `decoder.conv_in`
    […,128,…] 实测。

    **跨布局对账**（这个仓两种布局装着同一批权重，是本记录最硬的一道）：
    单文件包按前缀分出的六个组件字节 vs 对应 diffusers 目录的 HTTP 大小 ——
    DiT 37,758,861,824 vs 37,759,286,096（+424,272）、
    VAE 2,444,960,482 vs 2,444,982,370（+21,888）、
    声码器 111,185,604 vs 111,204,124（+18,520）、
    音频 VAE 106,496,804 vs 106,507,972（+11,168）、
    连接器+文本投影 2,862,950,400 vs connectors/ 的 2,862,957,976（+7,576），
    每一项的差都只是该目录的 safetensors 头与 index；
    单文件包清单总量 43,284,455,114 B vs 文件 43,285,058,242 B 差 603,128 B（一个头）。

    外部锚：HF 自己的 safetensors tally 18,876,174,592 与本仓 transformer/
    清单**逐位相同**（这是 skill 规则 11 里最强的那一档，本仓的归类、
    打包还原与排 scale 全都被约束住）。注意它只覆盖 transformer/ 这一个索引，
    不覆盖 VAE / 连接器 / 声码器 —— 那几项的锚是上面的跨布局字节对账。

    量化档：fp8 与 fp4 两个头各读一次。nvfp4 的两个因子独立验过
    （容器 2 倍：1,176 个张量的 U8 容器数 × 2 = fp8 档同名张量的参数数；
    块 16：参数数 / E4M3 scale 元素数 = 16）。

    Gate C：判断类字段 13 处，逐条在 evidence 里标了 derived 或 judgement。

review:
  - id: R1
    field: params.total
    severity: imprecise
    claim: 「LTX-2 是 19B 模型，LTX-2.3 是 22B，所以涨了 3B」
    finding: >-
      两个名字不是同一个口径。本代的 19b 对得上 DiT 18,876,174,592
      （= `transformer/` 组件 = HF tally）；下一代的 22b 对得上
      DiT + 连接器 + 文本投影 22,161,065,728，而它的 DiT 只有 18,988,838,144。
      把本代按下一代的口径算是 20,307,649,792 —— 那会叫「20b」。
      所以 19→22 这个 +16% 里，真实的主干增长只有 +0.60%，剩下的是口径变化
      加上连接器与文本投影的增长
    resolution: corrected
    changed_to: >-
      本记录的 params.total 等于本记录清单的实测值（= DiT = HF tally）并在
      counting_note 写明覆盖什么；ltx-2.3 那份的清单是整包、total 留空，
      所以**跨代要比的是 params.active_decode**（两代都是 DiT）与 counting_note
      里点明的 48 块主干数；lineage 与 ltx-2.3 的记录两侧都写了这条
  - id: R2
    field: generation.sampling.cfg.forwards_per_step
    severity: imprecise
    claim: 每步 2 次前向
    finding: >-
      2 是模型卡 diffusers 路径的数。厂商自己的 ltx-pipelines
      默认档每步 4 次：`_guided_denoise` 收集 cond / uncond / ptb / mod 四条
      pass，判据分别是恒真、cfg_scale ≠ 1、stg_scale ≠ 0、modality_scale ≠ 1，
      而 LTX_2_PARAMS 给的 3.0 / 1.0 / 3.0 让后三条全部成立。
      四路拼成一个 batch 送进一次 transformer 调用，算力仍是 4 倍
    resolution: open
    changed_to: >-
      字段保留卡的口径 2（schema 的枚举只有 1 和 2，4 填不进去），
      4 这个数写在 sampling.note、bottlenecks 与 infra_signals 里，
      并标明由此得出的端到端是下界。这条同时是一个 schema 缺口，已上报
  - id: R3
    field: generation.text_encoders
    severity: missing
    claim: 文本编码器取最后一层 hidden state
    finding: >-
      取的是**全部 49 层的加权聚合**。connectors/config.json 的
      `text_proj_in_factor` 49，而 `text_embedding_projection.aggregate_embed.weight`
      形状 [3840, 188160]、188,160 = 49 × 3,840 —— 49 = Gemma 的 48 层加嵌入层。
      按「取某一层」读会漏掉这个 0.72B 的聚合投影，也会低估文本侧要保留的激活
    resolution: confirmed
    changed_to: >-
      hidden_layer_taken 留空（schema 的整数装不下「全部层」），口径写进 note。
      聚合投影的 722,534,400 参数单列在 counting_note 的「不含的三类」里
  - id: R4
    field: params.counting_note
    severity: imprecise
    claim: >-
      counting_note 里 adaln_modulation 的六个模块叫 adaln_single /
      av_ca_video_scale_shift / av_ca_a2v_gate / audio_adaln_single /
      av_ca_audio_scale_shift / av_ca_v2a_gate；reviewed.method 里
      patch 投影叫 `patchify_proj.weight`
    finding: >-
      **七个名字全是下一代（ltx-2.3）的写法，在本代清单里逐个零命中。**
      六个 adaLN 模块的参数量一个不差（118,521,856 / 84,959,232 / 34,615,296 /
      29,900,800 / 21,508,096 / 8,919,040，合 298,424,320，加顶层两张表 12,288
      与逐块调制表 3,244,032 = 301,680,640，等于 breakdown 里那一项），
      所以这不是算错，是**名字取自另一份清单**。本代的真名是 `time_embed` /
      `av_cross_attn_video_scale_shift` / `av_cross_attn_video_a2v_gate` /
      `audio_time_embed` / `av_cross_attn_audio_scale_shift` /
      `av_cross_attn_audio_v2a_gate`，patch 投影是 `proj_in.weight`。
      照记录去 grep 清单复核会得到零命中，而「每个数字都能追到源」要求的正是
      grep 得到 —— 数对而路标指错，复核的人只会以为自己取错了数
    resolution: corrected
    changed_to: >-
      counting_note 的六个模块名与 reviewed.method 的 `proj_in.weight` 都改成
      本代写法，并在两处写明下一代改成什么名字。
      **而 `time_embed` 这个真名本身是个陷阱**：这个模块 118,521,856 里
      100,687,872 是 AdaLN 的输出投影、只有 17,833,984 是时间步 MLP。
      按功能分桶落地（见 R5）之后这两半各归其位 —— 投影进 modulation、
      时间步 MLP 进 time_embed，所以**这个模块的参数量在逐子系统表上跨两个桶**，
      口径写在 precision.quantization.subsystem_method 里
  - id: R5
    field: precision.quantization.per_subsystem
    severity: imprecise
    claim: >-
      「逐子系统表上 `audio` 5,714,096,256 是这个模型的音频部分，
      `dense_ffn` 6,443,433,984 是它的 FFN」
    finding: >-
      两句都不对，而根因是同一个：**那张表原先按「流」分桶，而不是按功能。**
      `audio` 桶收的是整条音频支路（注意力 4,028,203,008、FFN 1,611,104,256、
      AdaLN 与时间步嵌入、norm、caption 投影、调制表全在里面），
      于是 `dense_ffn` 只剩视频侧那一半 —— 整模型的 FFN 是 8,054,538,240，
      表上那一行**少了 1,611,104,256，即真值的 20.0%**，
      而 `subsystems.json` 自己写着这张表「顺序按对带宽账的分量从大到小」。
      判据两条：`components.json` 的 `audio_vae` 条把 `audio` 子系统定义成
      音频**理解**编码器，而本代的音频张量住在和视频支路**完全同一组**
      `transformer_blocks.0–47`（两边层号集合逐个相同，实测），
      是块内并行支路不是一座塔；而「流」这根轴 `param_scaling` 已经单列了。
      同一次核查还查出另外三处串桶：48 张 `video_a2v_cross_attn_scale_shift_table`
      与两个 AdaLN 门控模块的投影共 120,557,568 被 `attn` 领进了 `attention`、
      `audio_ff.net.*` 的 1,611,104,256 连 `dense_ffn` 的 `(?:^|\.)ff\.` 都配不上
      （前面是下划线）、`audio_proj_in/out` 被 `attention` 的 `o_proj` 领走
      （那三个字符就在 audi`o_proj`_in 里面）
    resolution: corrected
    changed_to: >-
      归类改成按功能分桶（上游 `242e724`，六处正则加次序，
      全仓 64 个事实目录复跑、有记录的非生成类受影响数 0）。
      本记录的桶从七个变成六个：`audio` 与 `other` 都归零，
      attention 6,564,581,376 → **10,472,226,816**、
      dense_ffn 6,443,433,984 → **8,054,538,240**、
      modulation 1,187,840 → **234,010,624**、
      time_embed 118,521,856 → **67,670,016**、
      io_proj 1,052,800 → **46,156,032**、norm 786,432 → **1,572,864**，
      合计 18,876,174,592 不变。
      **六个桶现在与本记录手写的 `params.breakdown` 逐位对上**（逐项见
      subsystem_method），两套分桶独立做出而结果相等，是这组值最硬的支点

notes: >-
  **这个仓为什么取数会被拒绝，以及为什么拒绝是对的。**

  顶层有 8 个 .safetensors，它们是 8 个不同的模型（dev / dev-fp8 / dev-fp4 /
  distilled / distilled-fp8 / distilled-lora / 两个上采样器），不是一个模型的 8 片。
  而 `ltx-2-19b-distilled.safetensors`（BF16）与 `-distilled-fp8.safetensors`
  （F8_E4M3）**张量名完全相同、dtype 不同** —— 实测 7,132 个名字会这样撞。
  `fetch_hf.py` 现在会报错退出并印出两边的分片名；旧代码会按线程完成顺序静默覆盖，
  产出一个不对应任何真实模型的清单，而每个数看着都合理。
  所以本记录两次取数都带 `--include`：一次收到 `transformer/*`（params 的来源），
  一次收到 `ltx-2-19b-dev.safetensors`（非 DiT 组件与跨布局对账的来源）。

  仓的总字节 314,346,418,525 B（292.8 GiB）对一个 19B 模型来说大得异常，
  拆开看是三件事叠加：三个 dev 档（bf16 43.29 + fp8 27.08 + fp4 19.99 GB）、
  两个 distilled 档（43.29 + 27.08 GB）、以及**文本编码器放了两份打包**
  （48.75 + 51.61 = 100.36 GB，占整仓 32%）。
  diffusers 组件目录（44.28 GB）与单文件包装的是同一批权重，所以也是一份重复。
  HF 的 usedStorage 报 455,276,550,000 B，比逐文件之和还多 141 GB ——
  旧修订版的 LFS 对象仍计在内，这个字段在这条线上不能当「当前修订版的权重总字节」用。

open_questions:
  - >-
    ~~派生产物里的「文本编码器 62.02 MiB」是个归类假象。~~ **已修（上游 `ebfb3cd`），
    这一条留作案底。** 那 62.02 MiB 是 DiT 自己的 `caption_projection`
    （32,514,048 参数，把 Gemma 的 3840 维聚合特征转成 4096），
    被 components.json 给 text_encoder 组件的 `caption_` 前缀领走了；
    而它的兄弟 `audio_caption_projection`（12,062,720）名字以 `audio_` 开头没被匹配、
    留在主干里 —— **同一对模块分进了两个组件**。
    **定钉它的判据是同源对照**：`facts/ltx-2` 与 `facts/ltx-2-pack` 是同一个 repo
    同一个 revision 的两种布局，同一批 `caption_projection` 在前者归 text_encoder、
    在后者因为带 `model.diffusion_model.` 前缀归 dit —— 取数布局不该改变一个张量是什么。
    前缀去掉之后两者都落 backbone 并由 io_proj 的 `caption_proj` 接住，
    本记录的 `params_by_component` 现在只有 backbone 一个组件，
    io_proj 桶是 46,156,032（含这一对 44,576,768）。
    真正的文本编码器是 Gemma-3-12B 48.75 GB，见 generation.text_encoders。
  - >-
    `generation.sampling.cfg.forwards_per_step` 只填得下 1 或 2（schema 枚举），
    而厂商 CLI 的默认档是 4（见 R2）。所以 generation_workload 的端到端 FLOPs
    是**下界**，低估 2 倍。要修得扩 schema 的枚举，不是改记录
  - >-
    连接器（708,940,800）与文本投影（722,534,400）是每步跑还是每 prompt 跑一次，
    从清单看不出来。连接器块里只有自注意力（`transformer_1d_blocks.N.attn1`）、
    没有时间步输入，看着像每 prompt 一次；但 2.3 代的参考实现注释提到
    `use_prompt_adaln_single=false` 的 checkpoint 才能把交叉注意力的 K/V
    算一次复用，反过来说默认档的 K/V 是随时间步变的。
    这 1.43B 算不算进每步激活没定，所以 params.active_decode 只填了 DiT
  - >-
    训练精度无一手来源。dev 档落盘 BF16（调制表 F32）是实测，
    但那说的是发布格式不是训练格式。文本编码器落盘 F32 同理
  - >-
    fp8 档只量化了 DiT 参数的 85.9%，剩下 14.1% 仍是 BF16/F32 ——
    哪些张量被留下没有逐一分桶（1,176 个 F8 张量不是 48 的整数倍，
    说明覆盖面不是「每块固定几个」）。要答得逐块列张量名，本轮没做
  - >-
    模型卡与参考实现在 CFG 强度上不一致：卡的 diffusers 示例 `guidance_scale=4.0`，
    LTX_2_PARAMS 的 `cfg_scale` 3.0（另有 audio 侧 7.0）。
    两条是不同的 pipeline，不是同一个数的两种写法，所以没有取舍；
    但记录里 sampling.cfg.scale 只能填一个，填的是卡的 4.0
