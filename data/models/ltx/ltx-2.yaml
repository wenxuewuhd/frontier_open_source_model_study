lineage:
  track: main
  successor: ltx-2.3
  # ltx family 的名义旗舰是 LTX-2.5，但那个仓 gated、卡与 config 都取不到，
  # 所以 family 里实际最新的记录是 ltx-2.3。本记录是差分基线。
  # 前代（LTX-Video 0.9.x）没录，predecessor 暂缺

params:
  total: 18876174592
  # 扩散主干稠密，每一步都过全部 DiT 权重 —— 没有 MoE 路由、没有跨步复用。
  # 但 active_decode 不等于 total 的那种「全部权重」：这里 total 取的就是 DiT
  # 组件本身（transformer/），连接器与文本投影在另外的组件里、不在这个数内。
  # active_* 显式写出来，是为了让它成为**跨代可比的那个量**（见 counting_note）
  active_decode: 18876174592
  active_prefill: 18876174592
  breakdown:
    video_ffn: 6443433984
    video_self_attention: 3222405120
    video_cross_attention: 3222405120
    audio_ffn: 1611104256
    a2v_cross_attention: 1208647680
    v2a_cross_attention: 1208549376
    audio_self_attention: 805896192
    audio_cross_attention: 805896192
    adaln_modulation: 301680640
    caption_projection: 44576768
    patchify_and_proj_out: 1579264
  counting_note: >-
    **只含 DiT（diffusers 布局的 `transformer/` 组件）**，按完整权重清单
    （8 分片 3,510 张量）逐项统计：18,876,174,592，与 HF 自己的 safetensors tally
    **逐位相同**。BF16 18,872,918,272 + F32 3,256,320，无 scale 容器、无打包容器，
    所以 numel 即参数数；18,872,918,272 × 2 B + 3,256,320 × 4 B = 37,758,861,824 B，
    与 transformer/ 八个分片的 HTTP 实际大小合计 37,759,286,096 B 差 424,272 B
    （八个 safetensors 头）。

    分桶口径：八个注意力/FFN 桶都是「单块 × 48」—— 48 个 transformer_blocks
    **每块参数量完全相同**（386,074,624），逐块验过，所以这个乘式本身成立。
    video_self/cross_attention 各 67,133,440/块（q/k/v/o 四个 [4096,4096] 加 bias
    与两个 [4096] 的 QK-norm），audio 侧同构但宽 2048；a2v 与 v2a 是音视频互相的
    交叉注意力，q 或 k/v 一侧 4096、另一侧 2048，所以两者差 98,304（= 48 × 2,048）。
    adaln_modulation 含 6 个全局 adaLN 模块，**名字用本代的写法**
    （`time_embed` 118,521,856、`av_cross_attn_video_scale_shift` 84,959,232、
    `av_cross_attn_video_a2v_gate` 34,615,296、`audio_time_embed` 29,900,800、
    `av_cross_attn_audio_scale_shift` 21,508,096、
    `av_cross_attn_audio_v2a_gate` 8,919,040 = 298,424,320）、顶层两张表 12,288、
    以及逐块调制表 3,244,032（四种 `*scale_shift_table` × 48 块）。
    **下一代把这六个模块全部改名成 `*adaln_single`**，所以按 ltx-2.3 的名字
    grep 本代的清单是零命中（见 R4）—— 参数量一一对应，名字不对应。

    **不含的三类**，它们在同一次发布里但不在 transformer/ 组件内，规模见 generation.*：
    视觉 VAE 1,222,480,241、文本嵌入投影 722,534,400、文本与音频连接器 708,940,800、
    声码器 55,592,802、音频 VAE 53,248,402。五项与 DiT 相加 21,638,971,237，
    正是单文件包 `ltx-2-19b-dev.safetensors` 的清单总量。
    **也不含文本编码器** —— Gemma-3-12B 12,187,325,040 参数、落盘 F32 48.7 GB，
    随仓发布但在 text_encoder/ 下，见 generation.text_encoders。

    **跨代比较只能用 active_decode。** 本代的「19b」是 DiT 18.88B，
    而下一代 ltx-2.3 的「22b」是 DiT + 连接器 + 文本投影 22.16B（它的 DiT 只有 18.99B）
    —— 两个名字不是同一个口径。而两份记录的 params.total 也不对等：
    本记录的清单就是 DiT 组件，所以 total 填 18,876,174,592；
    ltx-2.3 只发单文件整包、清单含六个组件，那份的 total 留空（理由在它的 params 注释里）。
    **可比的是 active_decode**（18,876,174,592 → 18,988,838,144，+0.60%）
    与 48 块主干（18,531,581,952 → 18,561,377,280，+0.161%）。

generation:
  backbone:
    stream_design: single
    layers: 48
    double_blocks: 0
    single_blocks: 48
    hidden: 4096
    heads: 32
    head_dim: 128
    ffn: 16384
    text_conditioning: cross_attn
    patch_size: [1, 1, 1]
    position: 3D RoPE（rope_type "split"，双精度频率，max_pos [20, 2048, 2048]）
    note: >-
      **patch 是 (1,1,1)，一个 latent 体素就是一个 token** —— 全线压缩都压在 VAE 上
      （8×32×32），DiT 侧不再降采样。这和 wan 一族的 (1,2,2) 是两种分工：
      同样的有效压缩率下，LTX 的 VAE 要重得多（1.22B，是 DiT 的 6.5%），
      而 DiT 侧少一层形状变换。

      **音频与视频共用这 48 块，但不是一条序列。** 每块里有六套注意力：
      视频自注意力与交叉注意力（宽 4096）、音频自注意力与交叉注意力（宽 2048）、
      以及音→视 / 视→音两个方向的跨模态交叉注意力。所以 text_conditioning 记
      cross_attn 而不是 in_sequence，序列长度不含文本 token；
      但音频 token 和视频 token 是两条各自的序列，各自的注意力矩阵各算一遍。

      视频侧没有 GQA：k 与 v 都是 4096 宽，32 个 KV 头 = 32 个 Q 头，是 MHA。
      每块 FFN 134,238,208 参数，比视频两块注意力之和（134,266,880）少 0.02% ——
      两者几乎等量，这与 ffn 16384 = 4 × hidden 一致

  vae:
    spatial_compression: 32
    temporal_compression: 8
    latent_channels: 128
    causal: true
    params: 1222480241
    decoder_arch: conv3d
    name: LTX-2 CausalVideoAutoencoder（AutoencoderKLLTX2Video）
    note: >-
      压缩率 32×32×8 在三处一致：vae/config.json 的
      spatial_compression_ratio 32 / temporal_compression_ratio 8、
      transformer/config.json 的 vae_scale_factors [8,32,32]、
      以及 config 自己的块表（4 个下采样块 downsample_type
      [spatial, temporal, spatiotemporal, spatiotemporal]，空间维被 ×2 三次 = 8，
      再乘 patch_size 4 = 32；时间维被 ×2 三次 = 8）。

      latent_channels 128 是**权重实测**：`vae.encoder.conv_out.conv.weight` 形状
      [129, 2048, 3, 3, 3]，129 = 128 + 1（`latent_log_var: "uniform"` 多一个通道）；
      `vae.decoder.conv_in.conv.weight` 是 [1024, 128, …]，进出都是 128。
      输入输出端的 48 = 3 × 4 × 4 也实测到（`encoder.conv_in` [128, 48, …]、
      `decoder.conv_out` [48, 128, …]），即 patch_size 4 的 pixel-unshuffle。

      **causal 填 true 说的是编码器**：encoder_causal true 而 decoder_causal false，
      两端不同。derive 的 latent 帧数公式 (F−1)/t+1 取决于编码器，所以填 true；
      121 帧 → (121−1)/8+1 = 16 帧，整除，这也是帧数写成 8n+1 的原因。

      params 1,222,480,241 是实测（单文件包里 `vae.` 前缀 187 个张量），
      编码器 694,098,881 / 解码器 528,380,720 / per-channel 统计 640。
      ×2 B = 2,444,960,482 B，与 vae/ 目录的 2,444,982,370 B 差 21,888 B（头）。
      **这不是边角料**：1.22B 相当于 DiT 的 6.5%，而它每次生成只跑一遍

  audio:
    in_channels: 128
    vae: LTX-2 audio VAE（AutoencoderKLLTX2Audio，mel 域）
    vae_params: 53248402
    sample_rate_in: 16000
    sample_rate_out: 24000
    latent_hz: 100
    channels: 2
    vocoder: LTX2Vocoder（55,592,802 参数，upsample_factors [6,5,2,2,2]）
    note: >-
      **输入 16 kHz、输出 24 kHz 不是同一个数**：音频 VAE 收 16 kHz
      （audio_vae/config.json `sample_rate` 16000），声码器出 24 kHz
      （vocoder/config.json `output_sampling_rate` 24000）。

      latent_hz 100 是推算：mel hop_length 160（transformer config 的
      `audio_hop_length` 与 audio_vae 的 `mel_hop_length` 两处一致），
      16000 / 160 = 100 帧/秒，而音频 VAE 只在 mel 轴下采样
      （`ch_mult` [1,2,4] 作用在 `causality_axis: "height"` 即 mel 轴，
      64 mel bins / 4 = 16，16 × 8 个 latent 通道 = 128 = DiT 的
      `audio_in_channels`），时间轴不压。所以 latent 时间分辨率就是 100 Hz。
      ltx-2.3 单文件包里的 audio_vae config 写着 `downsample_time: false`，
      与这个推算一致；该档的音频片长 5.12 s × 100 Hz = 512 帧，是整数的 2 次幂。

      立体声：in_channels 2 / out_ch 2，左右声道进同一个编解码器
      （不是各跑一遍），所以 DiT 侧的音频 token 数不乘声道数

  text_encoders:
    - role: primary
      name: Gemma-3-12B（Gemma3ForConditionalGeneration，含 SigLIP 视觉塔）
      hidden: 3840
      shipped_with_weights: true
      release_dtype: FP32
      params: 12187325040
      note: >-
        **随仓发布，而且是 F32**：text_encoder/model.safetensors.index.json 的
        metadata 写着 total_parameters 12,187,325,040、total_size 48,749,300,160 B，
        两者正好差 4 倍，即整个 12.19B 文本编码器落盘 **48.7 GB**。
        这是部署时最容易漏算的一块 —— 它比 DiT 的 37.76 GB 还大。
        config 是 48 层 / hidden 3840 / head_dim 256 / inter 15360 /
        16 Q 头 8 KV 头 / 滑窗:全注意力 = 5:1（layer_types 48 项里 8 项是
        full_attention），另带 27 层 SigLIP 视觉塔（hidden 1152、patch 14）。

        **取的不是最后一层，是全部 49 层的加权聚合。** connectors/config.json 的
        `text_proj_in_factor` 49，而单文件包里 `text_embedding_projection.
        aggregate_embed.weight` 形状 [3840, 188160] 且 188,160 = 49 × 3,840 ——
        49 = 48 层 + 嵌入层。schema 的 hidden_layer_taken 装不下「全部层」，
        所以留空，口径写在这里。

        **这个仓把文本编码器放了两份**：`text_encoder/model-*-of-00011`
        （1,065 个张量、48,749,300,160 B，transformers 的
        `language_model.model.layers.*` 命名）与
        `text_encoder/diffusion_pytorch_model-*-of-00012`
        （1,124 个张量、51,612,250,560 B，LTX 自己的 `base_text_encoder.*` 命名）。
        多出的 59 个张量与 2,862,950,400 B 恰好等于 connectors/ 目录
        （58 个连接器张量 + 1 个 aggregate_embed），即后者是「Gemma + 连接器 +
        聚合投影」的整包。两份是同一批权重，所以 44 个文件 314 GB 的仓里
        有 100 GB 是文本编码器的两种打包

  sampling:
    steps: 40
    cfg:
      scale: 4.0
      distilled: false
      embedded: false
      forwards_per_step: 2
    step_distilled:
      available: true
      steps: 8
      checkpoint: ltx-2-19b-distilled
      note: >-
        官方步数蒸馏档，卡上写「8 steps, CFG=1」，即 8 步 × 1 次前向。
        另有 `ltx-2-19b-distilled-lora-384`，把蒸馏做成可挂在 dev 上的 LoRA ——
        卡上的两阶段配方 stage 2 用的就是它
    scheduler: flow matching（FlowMatchEulerDiscreteScheduler，use_dynamic_shifting true）
    shift: 1.0
    note: >-
      **这里的 40 步 × 2 次前向是模型卡 diffusers 路径的口径**，不是厂商 CLI 的。
      卡上的示例用 `guidance_scale=4.0` 跑真 CFG，条件与无条件各一遍 → 2 次。

      **厂商自己的 ltx-pipelines 默认档是每步 4 次前向。**
      `utils/denoisers.py` 的 `_guided_denoise` 按四个判据收集 passes：
      cond 恒有；cfg_scale ≠ 1 加 uncond；stg_scale ≠ 0 加 ptb（跳过第 29 块的
      自注意力）；modality_scale ≠ 1 加 mod（跳过音↔视两个方向的交叉注意力）。
      而 `utils/constants.py` 的 LTX_2_PARAMS 给的是 cfg_scale 3.0 /
      stg_scale 1.0 / modality_scale 3.0 —— 三个判据全部成立。
      四路被拼成一个 batch 送进一次 transformer 调用，但那是一次 batch 4 的前向，
      算力是 4 倍不是 1 倍。

      **forwards_per_step 只填得下 1 或 2**（schema 枚举），所以这一项记的是卡的
      口径；4 这个数进不了结构化字段，端到端推导因此是**下界**。
      步数两处一致（卡 40、LTX_2_PARAMS 40），这一项没有分歧

  pipeline_stages:
    - name: stage-1 低分辨率去噪
      model: same-backbone
      steps: 40
      cfg_scale: 4.0
      forwards_per_step: 2
      resolution: 768×512，121 帧 @24 fps
      open_source: true
      note: 卡的 diffusers 示例第一段。每步前向次数按卡的真 CFG 口径记 2，厂商 CLI 默认档是 4
    - name: latent 空间上采样 ×2
      model: latent_upsampler（995,743,482 B，rational_spatial_scale 2.0）
      resolution: latent 域 ×2 空间
      open_source: true
      note: >-
        不是去噪步，没有步数与 CFG，所以不计入端到端前向数。
        它是一个独立的 0.5B 级模型（in_channels 128、mid_channels 1024、
        num_blocks_per_stage 4），只跑一遍
    - name: stage-2 高分辨率精修
      model: same-backbone + ltx-2-19b-distilled-lora-384
      steps: 3
      cfg_scale: 1.0
      forwards_per_step: 1
      resolution: 1536×1024，121 帧 @24 fps
      open_source: true
      note: >-
        挂蒸馏 LoRA、CFG=1，所以每步 1 次前向。
        **但这一段的 token 数是 stage 1 的 4 倍**（分辨率翻倍 → latent 面积 ×4），
        而 derive 的端到端是按同一个单步 FLOPs 估的，所以它低估了这一段。
        逐段精确值要按各段自己的 token 数重算

