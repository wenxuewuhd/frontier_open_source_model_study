bottlenecks:
  - dimension: compute
    finding: >-
      端到端前向次数是这一族最容易算错的一项，而且**两条官方路径差 2 倍**：
      模型卡的 diffusers 配方是每步 2 次（真 CFG），厂商自己的 ltx-pipelines
      默认档是每步 4 次（CFG + STG + 跨模态隔离三路负样本）
    quantified: >-
      卡的口径：stage 1 40 步 × 2 + stage 2 3 步 × 1 = 83 次主干前向。
      厂商 CLI 口径：`_guided_denoise` 的四路判据（cfg_scale 3.0 ≠ 1、
      stg_scale 1.0 ≠ 0、modality_scale 3.0 ≠ 1）全部成立 → 每步 4 次，
      stage 1 即 160 次。两个数都是逐因子验的，差的是 pass 数不是步数
    fix: >-
      stg_scale 与 modality_scale 是可关的（HQ 预设就把 stg_scale 置 0，
      降到每步 3 次）；真要砍到 1 次得换蒸馏档。
      做容量规划时必须先问「跑的是哪条路径」—— 按卡的 2 次排产能会少一半
    visibility: public
  - dimension: host-io
    finding: >-
      「19B」只说 DiT。一次完整的两阶段生成要摸到的权重是 DiT 37.76 GB +
      文本编码器 48.75 GB + VAE 2.44 GB + 连接器与文本投影 2.86 GB +
      latent 上采样器 1.00 GB + stage 2 的蒸馏 LoRA 7.67 GB，
      **文本编码器比 DiT 还大**，而它每次生成只跑一遍
    quantified: >-
      按字节：Gemma-3-12B 48,749,300,160 B（F32）> DiT 37,758,861,824 B（BF16）。
      按参数：12.19B vs 18.88B —— 参数更少而字节更多，差别全在精度上
    fix: >-
      文本编码一次、DiT 跑几十到上百次，错峰收益最大的就是把文本编码器搬走或降精度：
      F32 → BF16 直接省 24.4 GB，而卡没有说它必须是 F32。
      卡的示例自己用的是 `enable_sequential_cpu_offload`
    visibility: public
  - dimension: compute
    finding: >-
      DiT patch 是 (1,1,1)，压缩全压在 VAE 上 —— 所以 VAE 不是边角料：
      1.22B 参数、编码器比解码器还大，而它跑在全分辨率像素上
    quantified: >-
      VAE 1,222,480,241 参数（编码器 694,098,881 / 解码器 528,380,720），
      是 DiT 的 6.5%；有效压缩 8×32×32 全部由它提供，DiT patch 1 不贡献
    fix: >-
      VAE 的编解码在两阶段流水线里要跑三次以上（stage 1 编码条件图、
      stage 2 后解码、中间 latent 上采样不过 VAE），而卡的示例要靠
      `vae.enable_tiling()` 才不 OOM —— 它值得独立的 kernel 工作
    visibility: public

infra_signals:
  - text: >-
      「参数量」这个名字在生成类发布里不是一个口径。同一家的两代，19b 指 DiT、
      22b 指 DiT + 连接器 + 文本投影；而一次部署真正要驻留的还要加上文本编码器与 VAE。
      记录里必须把「名字里的数」「清单实测」「每步激活」分三处存，
      任何跨代倍数都得先说清用的是哪一处
    evidence: derived
    horizon: now
  - text: >-
      每步前向次数不是 1 或 2 两种。LTX-2 的参考实现把 CFG、STG（扰动自注意力）
      与跨模态隔离三种负样本并列，每种都是一条独立的 pass，默认档四路全开。
      「步数 × 每步前向」这个乘式的第二个因子要按 guider 的判据逐条数，
      而不是看有没有开 CFG
    evidence: derived
    horizon: now

