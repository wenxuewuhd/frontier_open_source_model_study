id: ltx-2
family: ltx
kind: video-gen
display_name: LTX-2 (19B dev)
released: '2026-01-03'
license: ltx-2-community-license
visibility: public

# **录的是 `ltx-2-19b-dev`**（bf16 全量档），不是蒸馏档。理由：模型卡里唯一一条
# 端到端配方建在 dev 上（stage 1 用 dev 跑 40 步 CFG 4.0，stage 2 挂蒸馏 LoRA 跑 3 步），
# 所以 dev 是本代采样口径有一手来源的那一档；蒸馏档卡上只有「8 步 CFG=1」一行，
# 进 sampling.step_distilled 与 checkpoint_variants。
# 同族 ltx-2.3 录的是蒸馏档（那边卡上没有任何 dev 配方），**两份的步数不可直接比** ——
# 见 params.counting_note 与 lineage。
#
# 口径沿用 wan2.2-ti2v-5b 定下的三条（params 只算 DiT、不建 arch 块、没有 KV cache 这笔账），
# 另有两条这一族新增的：
#
# 4. **params.total 取 `transformer/` 这个组件**，不取顶层单文件包。这个仓两种布局都有：
#    diffusers 组件目录（transformer/ vae/ connectors/ …）与 ComfyUI 式单文件
#    `ltx-2-19b-dev.safetensors`。两者是同一批权重（逐组件字节对账见 reviewed.method），
#    但 HF 自己的 safetensors tally 只统计 transformer/ 这一个索引，取它才能拿到
#    **逐位相同**的外部锚（18,876,174,592）。VAE / 连接器 / 声码器 / 音频 VAE /
#    文本投影的规模来自单文件包的第二次读清单，落在 generation.* 里。
# 5. **「19b」说的是 DiT，「22b」（ltx-2.3）说的不是同一件事。** 本代 DiT 18.88B 就是 19b；
#    下一代的 22b 是 DiT + 连接器 + 文本投影 22.16B，而它的 DiT 只有 18.99B。
#    跨代可比的量是 params.active_decode，不是 params.total。

sources:
  - kind: modelcard
    url: https://huggingface.co/Lightricks/LTX-2
    locator: README.md §Model Checkpoints 与 §Use with diffusers 的两阶段示例 @ 64f65d09e0b7
    accessed: '2026-10-30'
    note: >-
      checkpoint 表（7 档：dev / dev-fp8 / dev-fp4 / distilled / distilled-lora-384 /
      spatial-upscaler-x2 / temporal-upscaler-x2）与蒸馏档的「8 steps, CFG=1」来自这里。
      两阶段配方也来自这里：stage 1 `num_inference_steps=40`、`guidance_scale=4.0`、
      121 帧、24 fps、768×512；latent 上采样 ×2；stage 2 挂
      `ltx-2-19b-distilled-lora-384`，`num_inference_steps=3`、`guidance_scale=1.0`、
      走 `STAGE_2_DISTILLED_SIGMA_VALUES`。约束「宽高被 32 整除、帧数 8n+1」也在卡上。
      **卡上没有任何结构数字** —— 层数、宽度、压缩率全部来自组件 config 与权重清单
  - kind: modelcard
    url: https://huggingface.co/Lightricks/LTX-2
    locator: transformer/ vae/ connectors/ audio_vae/ vocoder/ latent_upsampler/ text_encoder/ 七份组件 config @ 64f65d09e0b7
    accessed: '2026-10-30'
    note: >-
      这个仓**没有顶层 config.json**，有 9 份组件 config。结构字段全部取自这里：
      transformer 48 层 / 32 heads × 128 / in_out 128 / patch_size 1 与 patch_size_t 1 /
      cross_attention_dim 4096 / caption_channels 3840 / vae_scale_factors [8,32,32] /
      qk_norm "rms_norm_across_heads" / rope_type "split" / rope_double_precision true；
      vae spatial_compression_ratio 32 / temporal_compression_ratio 8 / latent_channels 128 /
      patch_size 4 / encoder_causal true / decoder_causal false；
      connectors 视频与音频各 2 层 30 heads × 128、各 128 个可学习 register、
      text_proj_in_factor 49；vocoder output_sampling_rate 24000；
      audio_vae latent_channels 8 / mel_bins 64 / sample_rate 16000；
      latent_upsampler rational_spatial_scale 2.0
  - kind: modelcard
    url: https://huggingface.co/Lightricks/LTX-2
    locator: transformer/diffusion_pytorch_model-0000{1..8}-of-00008.safetensors 的头 @ 64f65d09e0b7
    accessed: '2026-10-30'
    note: >-
      params 的来源：8 分片逐片读头取全，**3,510 个张量**，无读失败分片。
      BF16 18,872,918,272 + F32 3,256,320（F32 的 194 个全是 scale_shift_table 调制表）
      = 18,876,174,592，与 HF 自己的 safetensors tally **逐位相同**。
      48 个 transformer_blocks **每块参数量完全相同**（386,074,624），所以
      「每块 × 48」这个乘式成立
  - kind: modelcard
    url: https://huggingface.co/Lightricks/LTX-2
    locator: ltx-2-19b-dev.safetensors 的头（4,052 张量）与 -fp8 / -fp4 两档的头 @ 64f65d09e0b7
    accessed: '2026-10-30'
    note: >-
      第二次定向读清单，只回答两个问题：(1) 非 DiT 组件各多大
      —— 单文件包按前缀分成 model.diffusion_model. 18,876,174,592 /
      vae. 1,222,480,241 / {video,audio}_embeddings_connector 708,940,800 /
      text_embedding_projection. 722,534,400 / vocoder. 55,592,802 /
      audio_vae. 53,248,402，合计 21,638,971,237；
      (2) 官方量化档量化了什么 —— 见 precision.weights_release_scope。
      这份清单**不并入 facts/ltx-2 的 shapes.json**，不用于 params
  - kind: repo
    url: https://github.com/Lightricks/LTX-2
    locator: >-
      packages/ltx-pipelines/src/ltx_pipelines/utils/constants.py 的 LTX_2_PARAMS 与
      DISTILLED_SIGMA_VALUES；同包 utils/denoisers.py 的 _guided_denoise；
      packages/ltx-core/src/ltx_core/components/guiders.py 的 MultiModalGuider
    accessed: '2026-10-30'
    note: >-
      厂商参考实现（来源优先级第三档）。只用来回答模型卡不说的两件事：
      LTX_2_PARAMS 的默认档（num_inference_steps 40、stage_1 512×768、
      num_frames 121、frame_rate 24.0）与卡上的 40 步 / 121 帧 / 768×512 一致，
      所以它在采样口径上不是凭空写的；
      以及**每步前向次数的真实上界** —— `_guided_denoise` 按 cond / uncond / ptb / mod
      四路收集 passes，而 LTX_2_PARAMS 的 cfg_scale 3.0、stg_scale 1.0、
      modality_scale 3.0 三个判据全部成立，即厂商 CLI 的默认档是**每步 4 次前向**，
      不是卡上 diffusers 路径的 2 次。见 generation.sampling.note 与 bottlenecks

hf:
  repo: Lightricks/LTX-2
  sha: 64f65d09e0b76c96202b5bc09997673184cf9b5d
  last_modified: '2026-10-22T08:57:03.000Z'
