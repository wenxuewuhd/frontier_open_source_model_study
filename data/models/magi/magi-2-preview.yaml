reviewed:
  date: '2026-11-03'
  method: >-
    **Gate B 在 `derive.py` 眼里只剩清单一路**（`facts/magi-2-preview/cfg.json`
    是 `{}`，仓里 89 个文件没有 DiT 的 config），**但结构侧实际有三路**：
    权重清单 × 技术博客 §2.2 的配置表 × 厂商参考实现的 `configs/magi2_preview.json`。
    ltx-2.3 那条「config 藏在 `__metadata__` 里」的可能性专门查过并排除了
    （preview 首片无 `__metadata__`，refiner 只有 `{"format": "pt"}`）。

    **三路逐项对读，14 项逐字相同**：
    num_layers 40 对清单 `block.layers.0–39` 对博客「40 Transformer layers」；
    hidden_size 3072 对 `linear_qkv` 的 [9216, **3072**] 对博客「Model width 3,072」；
    head_dim 128 对 `q_norm` [128]；num_query_groups 24 对 k 的宽度 3072 / 128；
    `mm_layers: [0,1,38,39]` 对清单里 3 倍宽的那四层；
    `moe_layers: [2…37]` 对有 `moe_mlp.*` 的 36 层对博客「middle 36 layers」；
    `moe_config.num_heads: 12` 与 `num_experts: 256` 对博客「12 heads × 256
    dimensions」「256 experts per head」，乘积 3072 对 `router.expert_bias` 的 [3072]；
    `top_k: 6` 对博客「Top-6 per head」（**权重侧无证人，见下**）；
    `expert_intermediate_size: 1280` 对 `W_gate` 的 [3072, 256, **1280**]
    对博客「256 → 1,280 → 256」；
    `mhc_config.num_stream: 4` 对 `mhc_norm` [12288] = 4 × 3072；
    `attn_sinks.sink_token_num: 1` 对 `attention.sinks` [**1**, 24]；
    `video_in_channels: 48` 对 `video_embedder` [12288, **48**]；
    `audio_in_channels: 64` 对 `audio_embedder` [12288, **64**]；
    `text_in_channels: 5120` 对 `text_embedder` [12288, **5120**]。
    **一处要换算才对上**：`intermediate_factor: 4` 按 SwiGLU 折 2/3 得 8192，
    对 `up_gate_proj` 每模态 16384 = 2 × 8192。

    **参数量两路对账**：清单读头 113,934,953,536 参数 /
    228,107,858,176 B，与 `preview/model.safetensors.index.json` 的
    `total_size` **差 0**；与 56 个文件 HTTP 大小合计差 261,298 B（= 56 个头）。
    与卡的「114B」差 0.06%。repoinfo.json 无 HF tally（`safetensors: null`），
    外部锚由厂商的 index.json 承担。

    **每 token 激活 6,010,356,736 是算出来的，不是抄的**，逐因子见
    params.counting_note；与卡的「approximately 6B」差 0.17%，
    而不作模态划分会差 +29.4% —— 那个差额反过来证实了逐模态 1/3 的读法。

    **top-k 在落盘形状里没有证人**，这一点写在这里以免被当成已实测：
    它是运行时路由参数，权重里只能看到专家池的大小（首维 3072）
    和每个单元的形状，看不出一次选几个。6 这个数来自博客 §2.2 的配置表
    与参考实现的 config 两处一致，**但两者都不是权重**。
    所以 `top_k` 与 `routed_experts` 的证据强度不同：后者有清单作证
    （`expert_bias` 的 [3072] = 12 × 256），前者只有文档与代码。

    **从实现读的、强度随上游衰减的有三项**（skill 规则 12 要求写明）：
    mHC 的 `sinkhorn_iters: 20` 与 `eps: 1e-12`（只在 `MHCHandler.__init__`
    的默认值里，不在发布的 config 里）、`forwards_per_step: 2`
    （读 sampler.py 的 batch 拼接）、以及 buckets 的 `frames: 250`
    （读 `_resolve_lengths()` 里那个 `* 2`；**照 config 的 `fps: 12.5`
    字面读会得到 125，低一半**）。

    **「逐头输出门」这句话里两半证据强度不同**：`attention.linear_g`
    出口宽度 24 恰等于头数，这是形状结论；而 config 只说
    `attn_gating: {enable: true}`、博客只说「gating-related parameters」——
    **厂商从没说过「逐头」**。同理 mHC 的 4 条流是形状 + config 两路确认的，
    但「mHC」这个缩写厂商没有展开，机制描述博客一个字也没有。
  scope:
    - official
    - derived
    - judgement

notes: >-
  **这一份在本仓的位置：它是唯一一个 token 级 MoE 的视频 DiT，
  而它把「专家变细」做成了一件和语言模型线不同的事。**

  已录的细粒度化都在整宽 hidden 上做：专家数往上加、单专家 intermediate 往下压，
  一个 token 整条表示送给 top-k 个专家。MAGI-2 多了一刀 ——
  **先把表示切成 12 个 256 维子空间，每个子空间独立路由**。
  于是同一个 token 的不同表示子空间可以组合出不同的专家集合
  （博客 §2.2：「different representation subspaces of the same token can form
  different expert combinations」），而不是整体二选一。

  **这件事在指标上的后果是「专家数」分叉成两个口径**，
  必须说清是哪一个：每头池子 **256**（和别家同问法：一个 router 在多大池子里选）、
  每层单元总数 **3,072**（12 × 256）。本仓 `arch.moe.routed_experts` 填的是前者。
  后者会出现在 `derive.py` 产物的 `experts_seen` 里（堆叠张量的首维），
  那是 head × expert 压平的结果。
  **把 3,072 拿去和 kimi-k3 的 896 并排，是把两个口径当成一个轴**：
  那 896 个专家每个吃整宽 hidden，这 3,072 个单元每个只吃 1/12。

  三件结构上值得单独记的事：

  1. **没有 AdaLN。** 生成类主干里这一项通常是大头，这里是 0 ——
     噪声水平逐 token 送进去，不走逐样本调制。见
     generation.backbone.param_scaling。
  2. **两个阶段是两个不同架构的模型**，不是同一主干的两档：preview 稀疏 + mHC
     + attention sink + 满注意力 MHA；refiner 稠密 + 无 mHC + 无 sink
     + 全层窗口注意力 + GQA。**后者的序列长 9 倍**，所以它不能不稀疏注意力。
  3. **四个子系统是别人的权重，而且两个能做到字节级确认**：
     文本编码器与本仓 `qwen3.5-27b` 的清单两个数逐字节相同、
     视频 VAE 与 `wan2.2-ti2v-5b` 记的 `.pth` 字节数逐字节相同。
     **这比「卡上说用的是同一个」强一档** —— 后者只是声明。

  最后一件与数字无关但影响解读的：**采用度为 0**（HF downloads 0、likes 122，
  2026-11-03 实测）。入选理由是结构不是影响力，
  而「没有引擎支持、没有第三方复现、厂商自己也只给参考实现」这三件事
  合起来说明**这一份的每个数字都只有厂商一个来源**，
  本仓能做的最多是让清单与文档互相对账 —— 已经做到了十四项，
  但那十四项全部落在同一家的两份材料加一份权重上。

open_questions:
  - >-
      **top-k 在权重里没有证人，只有文档与代码两处一致。** 博客 §2.2 的配置表写
      「Top-6 per head」，参考实现 config 写 `top_k: 6`，两处都不是落盘事实。
      要钉死得读 kernel 或实测一次前向的专家命中数 —— 那是独立一轮的事。
      它也是「每 token 激活 6B」这个乘式里唯一没有权重作证的因子。
  - >-
      **音频 VAE 到底加载哪一部分没有确认。** `stable-audio-open-1.0/model.safetensors`
      里 87.1%（1,056,939,152 参数）是上游的文生音 diffusion 主干，
      MAGI-2 自己产音频 latent，按说用不上它 —— 但卡只说这个目录是
      「Audio VAE, decodes the generated audio latents」，没说只加载
      `pretransform.*`。要确认得读 `sa_audio_vae.py` 的加载路径。
      **如果确认只用 pretransform，那 4.85 GB 里有 4.2 GB 是不必下载也不必驻留的**，
      对部署的显存与下载账都是实数。
  - >-
      **音频 latent 的两个频率对不上。** stable-audio 的
      `model_config.json` 给 `downsampling_ratio: 2048` / `sample_rate: 44100`
      → 21.53 Hz，而 DiT 侧按 `audio_latent_fps: 25.0` 排 token（10 秒 250 个）。
      两个数差 16%，口径没对齐：可能是重采样、可能是 25 Hz 只是排 token 的网格
      而与 VAE 的真实 latent 率不同。`latent_hz` 现在填的是 DiT 侧那个
      （进序列长度的是它），但这个不一致没解释。
  - >-
      **「mHC」厂商没有展开，机制描述一个字也没有。** 博客 §3.3 只把它当优化器
      参数族点名。本记录的机制描述全部来自清单形状与参考实现
      （4 条流、4×4 混合、Sinkhorn-Knopp 20 轮）。
      与 DeepSeek V4 一代的 mHC、Qwen3.8-Flash-Next 的 Gated Residual
      是不是同一篇论文的实现，没有文献支点。
  - >-
      **文本编码器取第几层的 hidden state 不知道。** 卡与博客都没提，
      参考实现里也没找到层号。这件事影响实际要跑的层数 ——
      h3 那份明说取第 50 层（共 64 层），后 14 层可以不跑。
      这里 27B 的编码器如果也只用到中间某层，prefill 的账会小一截。
  - >-
      **没有任何性能、时延或显存实测数字。** 卡与博客都不给基准，
      也没有第三方复现（HF 下载量 0）。`performance` 因此整块为空 ——
      **这是「没有来源」不是「未录」**。卡只给了一条定性约束：
      8 张 Hopper，且 1080p 下两个主干不能同时驻留 80 GB 卡。
  - >-
      **`ep_size: 8` 与 `cp_size: 8` 是参考实现的配置，不是部署依据。**
      它说明厂商自己怎么跑，但「为什么是 8」「换成 4 或 16 行不行」
      没有说法。本仓 `ep_size` 一向不在证据链上，这里同理。
