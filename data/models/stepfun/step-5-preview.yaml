    缓存精度取自厂商参考实现：K/V 与滑窗的 torch.bfloat16 写死在 model.py 的 allocate_cache
    （参考实现内不可配置），区域摘要硬编码 float8_e4m3fn（无 scale）。
    vLLM / SGLang 的部署实现可能另用 FP8 KV，未读
  - >-
    厂商「27B active」：本仓带宽口径 26.58B、可比官方口径 27.11B（再含输入词表），后者与 27B 相符，
    但厂商口径没写
  - >-
    训练精度无一手声明，precision.training 不填
  - >-
    本记录沿用 deepseek-v41-flash 的分量键 global_kv / indexer（derive.py 的 measured_per_token
    分支只认这三个键），而 kv_table.py 的 COMPONENT_LABEL 把它们渲染成「全局压缩 KV」「index K」——
    两者对 Step-5 都不成立：全局分量是**未压缩**的 GQA K/V，索引分量是 8 token 一个**区域摘要**。
    于是 docs/kv-cache-accounting.md 的跨族系名册打出的正是本记录 bottlenecks 警告过的那种误读。
    需要改 COMPONENT_LABEL（global_kv 改中性「全局 KV」）或给 derive.py 加键（如 region_summary）；
    在那之前，跨族系名册这一行的**分量名**不可引用（数值可以）
