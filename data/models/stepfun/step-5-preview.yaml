notes: >-
  阶跃星辰家族的旗舰（Preview），model_type step5_vl。本仓第一份 StepFun 记录。
  层数、层集合、宽度、专家堆叠形状、量化覆盖与 FP32 分布对照完整权重清单核过；
  缓存形状与精度来自厂商随仓的参考实现（inference/），不是部署 kernel；
  top_k、topk 512、routed scaling 3.0、swiglu_limits 这类运行期标量只有 config 一个来源。
  另有 BF16 与 NVFP4 两个发布变体（见 tracking.yaml），本记录只覆盖 FP8 这个仓

open_questions:
  - >-
    HF 的 safetensors tally（604,339,504,832）比按 index 去重的清单多 1,366,577,536：
    F8_E4M3 逐位相同，BF16 +1,366,556,672、F32 +20,864。index 外的 model-mtp3-00001 能解释
    BF16 1,123,024,896 与 F32 24,576，剩余 BF16 243,531,776 / F32 −3,712 对不上任何张量组。
    derive.py 的外部参数量对账因此报 MISMATCH；本仓的 2704 条与 weight_map 逐名相同，
    差额在 HF 侧的统计口径（可能读的是更早的修订或别的文件集），未查清
  - >-
    缓存精度取自参考实现：K/V 按 Step5Cache 传入的 dtype（generate.py 传 torch.bfloat16）、
    摘要硬编码 float8_e4m3fn。vLLM / SGLang 的部署实现可能另用 FP8 KV，未读
  - >-
    厂商「27B active」：本仓带宽口径 26.58B、可比官方口径 27.11B（再含输入词表），后者与 27B 相符，
    但厂商口径没写
  - >-
    sparse_indexer_w [16, 4096] 是 FP32 而同组 q/k/z 是 BF16，ssmax_s [64] 在参考实现里是 buffer
    （按 64 个 query 头，不是 16 个 index 头）—— SSMax 作用在主注意力还是索引打分上，未细读
  - >-
    训练精度无一手声明，precision.training 不填
