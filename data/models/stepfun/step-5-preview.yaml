bottlenecks:
  - dimension: kv-capacity
    finding: >-
      三类缓存三种增长方式：23 个全局层的全量 K/V 随上下文线性增长，区域摘要按 1/8 增长，
      69 个滑窗层每序列固定。稀疏只省读、不省存 —— 全局层的 K/V 全部保留，
      摘要只是选区域用的索引
    quantified: >-
      元素口径（主干，不含 MTP）：35328 + 736 = 36064 元素/token，另 54,263,808 元素/序列。
      精度按参考实现（K/V 与滑窗 BF16、摘要 FP8_E4M3 无 scale）：
      35328 × 2 + 736 × 1 = 71392 B/token，滑窗 103.5 MiB/序列，1M 上下文约 69.8 GiB ——
      theoretical_floor 口径，不含 page_size 16 的分页粒度，精度是读实现得来的（judgement）。
      摘要占 per-token 字节的 1.0%，主体是全局层的 K/V。
      **以上是单份逻辑 KV 的下限。**厂商参考实现的生产布局是 TP=8 而 KV 组只有 4：
      每个 rank 持 1 组、两个 rank 共用同一组，全局 K/V 与滑窗整机 **2×**；
      区域摘要是单头 MQA、每个 rank 一整份，整机 **8×**。按该布局整机约 147,200 B/token、
      1M 上下文约 137 GiB。复制不属于分页粒度，不被上面的 theoretical_floor 免责覆盖
    visibility: public
  - dimension: operator-gap
    finding: >-
      区域摘要是一个新的写缓存算子：按 index_z 逐维 softmax 加权求 8 token 的均值、直接转 FP8，
      只在区域凑满时写；尾部 token 留在 pending 缓冲。按 DeepSeek 式「逐 token 存 index K」
      实现的索引器在这里对不上 —— 缓存条目数差 8 倍、精度也不同
    visibility: public
  - dimension: operator-gap
    finding: >-
      同一层 MoE 里 FP8 与 BF16 专家并存于不同层：L3–L87 与 L88–L90 的专家张量同形不同精度。
      grouped GEMM 要按层选内核，不能整模型一个专家精度
    visibility: public

infra_signals:
  - text: >-
      本代（Step-5）是第三种「稀疏 + 混合」组合：滑窗与全局 3:1，稀疏只挂在全局层上，
      索引按 8 token 一个摘要压缩存储。与 GLM-5.3（全层 DSA、逐 token index K）、
      DeepSeek V4.1（少数层产出 KV）三者的缓存形状各不相同，容量模型不能互套
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      仓里放了两份 index 外的同名副本（vit.safetensors、model-mtp3-00001），HF 的参数量 tally
      与 index 口径对不上 1.37B。按「下载全部 .safetensors 再加载」的流程会读到重复张量；
      按文件求和的显存估算会多算
    evidence: judgement
    horizon: now
    axis: scale

