  阶跃星辰家族的旗舰（Preview），model_type step5_vl。本仓第一份 StepFun 记录。
  层数、层集合、宽度、专家堆叠形状、量化覆盖与 FP32 分布对照完整权重清单核过；
  缓存形状与精度来自厂商随仓的参考实现（inference/），不是部署 kernel；
  top_k、topk 512、routed scaling 3.0、swiglu_limits 这类运行期标量只有 config 一个来源。
  另有 BF16 与 NVFP4 两个发布变体（见 tracking.yaml），本记录只覆盖 FP8 这个仓

