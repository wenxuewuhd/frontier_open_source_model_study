context:
  max: 1048576

arch:
  layers: 92
  hidden: 4096
  vocab: 128896
  norm: >-
    零中心 RMSNorm：x / rms(x) × (1 + w)，权重落盘 FP32、以 0 为中心（参考实现 Step5RMSNorm）；
    按常规 RMSNorm 读会把每层激活乘以约 0。config 另有 fp32_residual_connection=true
  norm_eps: 1.0e-05
  activation: SwiGLU，逐层 swiglu_limits 7.0 截断（路由专家与共享专家各一组，config 声明）
  position: >-
    逐层 RoPE：滑窗层 theta 1e4、全旋转；全局层 theta 1e7、partial_rotary 1/3（每头 192 维里 64 维），
    llama3 式 rope_scaling 只作用于全局层（yarn_only_types full_attention）

  attention:
    type: hybrid
    num_heads: 64
    num_kv_heads: 4
    head_dim: 192
    v_head_dim: 192
    sliding_window: 512
    head_dim_note: >-
      QK 与 V 每头都是 192：q_proj [12288, 4096] = 64×192，k_proj / v_proj [768, 4096] = 4×192，
      o_proj [4096, 12288]。q_norm / k_norm 是逐头 [192]，写缓存的 K 是 k_norm 之后的 4×192 = 768 维，
      与 k_proj 输出维相同（95/95 层一致）。g_proj [64, 4096] 是逐头的标量门（use_head_wise_attn_gate，
      sigmoid），不是逐通道门
    layer_pattern: >-
      主干 92 层里滑窗与全局 3:1：L3, L7, …, L91 共 23 层是全局层（config layer_types 的
      full_attention），其余 69 层是 sliding_window 512 的滑窗层。23 个全局层全部挂 DSA 稀疏索引器
      （sparse_config.apply_to_layer_types full_attention，清单上 sparse_indexer_* 恰在这 23 层）。
      3 个 MTP 层（L92–L94）在 layer_types 里都是滑窗层。
      作用域：滑窗与全局的投影形状完全相同（95 层一个签名，head_dim 两类都是 192），
      类型划分只能从 config 的 layer_types 读；权重能独立确认的是「这 23 层挂了索引器」，
      而 rope_theta 1e7 与 partial_rotary_factors 1/3 的下标集合与之逐一吻合，三者互证
    sparse:
      mechanism: >-
        DSA 式区域选择：索引器每 8 个 token（region_block_size）把 index K 压成一个 256 维摘要 ——
        按 index_z 在 token 轴上逐维 softmax 加权求均值（kernel.py 的 region summary），
        转成 FP8_E4M3 存入缓存（无 scale）；16 个 index 头分成 4 组（num_provider_groups，与 4 个 KV 组对齐），
        每组按摘要打分选 topk 512 个区域，再在选中区域上对全量 K/V 做注意力。只有凑满 8 个 token 的区域才写摘要，
        尾部 token 留在每序列固定的 pending 缓冲里。
        打分是**加权 ReLU、不是 softmax**：score[q,r] = Σ_h relu(q_qh · k_r) · w_qh，
        逐头权重 w 由 sparse_indexer_w [16, 4096] 逐 token 产出（带符号，故结果不恒非负），
        与 DeepSeek lightning indexer 是同一个函数；index_q / index_k 在打分 GEMM 之前
        先 round 到 E4M3 激活（round_activations_e4m3），参考实现把这一步算作语义而非优化。
        topk 512 选的是**区域**，即最多 512 × 8 = 4096 个 token
      index_n_heads: 16
      index_head_dim: 256
      index_kv_dim: 256
      index_kv_source: >-
        model.layers.N.self_attn.sparse_indexer_k.weight [256, 4096]（23 层），经 sparse_indexer_k_norm
        （LayerNorm，[256] 带 bias）后仍是 256 维；sparse_indexer_z [256, 4096] 产出加权用的 logits，
        不进缓存。sparse_indexer_q [4096, 4096] = 16 头 × 256，index K 只有 1 个头
        （sparse_indexer_num_k_heads 1），按 16 × 256 算会高估 16 倍；而且 K 不逐 token 存，
        按 8 token 一个摘要计，每 token 再摊 1/8
      block_size: 8
      index_topk: 512
    kv_sharing:
      index_kv_source_layers:
        [3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43, 47, 51, 55, 59, 63, 67, 71, 75, 79, 83, 87, 91]
      layer_coverage: >-
        三类缓存的覆盖面各不相同，以下层数都是**主干口径**（L0–L91）：全量 K/V（随上下文增长）只在
        23 个全局层；区域摘要也在这 23 层；滑窗 K/V（每序列固定 512 个位置）在其余 69 层。
        参考实现的 Step5Cache 只为 num_hidden_layers（92）层建缓存。MTP 3 层（L92–L94）各带一套同形的
        q/k/v/o/g 投影、layer_types 为滑窗，开草稿侧时滑窗层是 72 层（69 + 3），全局层与摘要层不变
      measured_per_token:
        global_kv: 35328
        indexer: 736
        local_window_elems_per_sequence: 54263808
        note: >-
          逐因子：全局 K/V 每层 2 × 4 组 × 192 = 1536 元素（k_proj / v_proj 输出 768，k_norm 逐头 [192]），
          × 23 层 = 35328；区域摘要每层 256 元素 / 8 token = 32 元素/token，× 23 层 = 736；
          滑窗 512 × 1536 × 69 层 = 54,263,808 元素/序列。主干口径，不含 MTP（开草稿侧滑窗再加
          3 × 786,432）。另有每个全局层的 pending key / z 缓冲 2 × 8 × 256 BF16（23 层共 94,208 元素、
          184 KiB/序列）没有计入

  ffn:
    type: moe
    layer_pattern: >-
      L0–L2 与 **L91** 稠密（mlp.gate_proj [13824, 4096]），L3–L90 共 88 层 MoE（config moe_layer_list）。
      主干最后一层不是 MoE —— 按 first_k_dense 3 推「其余都是 MoE」会多算一层 352 专家。
      3 个 MTP 层也是稠密 FFN

  moe:
    routed_experts: 352
    shared_experts: 1
    top_k: 8
    intermediate: 1536
    first_k_dense: 3
    dense_intermediate: 13824
    routing: >-
      router 打分在 FP32 里做（need_fp32_gate），router_bias [352] FP32 修正选路，
      moe_router_scaling_factor 3.0，norm_expert_weight；moe.gate.weight 落盘是 BF16
    balance: router_bias（config use_moe_router_bias）
    storage_note: >-
      堆叠存储：每层 moe.gate_proj / up_proj [352, 1536, 4096]、down_proj [352, 4096, 1536]，
      一个张量装一层全部 352 个专家，gate 与 up 分开不融合。名字里没有 experts，
      扩展 subsystems.py 之前这 264 个张量会被归成 dense_ffn。共享专家叫 share_expert（单数），
      中间维 1536 与路由专家同宽。
      352 取自 264 个堆叠张量的首维（穷举、0 例外），不取自 config.moe_num_experts ——
      derive.py 的 config 侧对账因键名不同被 skip，这一项不在 Gate B 的覆盖内

  decoding:
    mtp_layers: 3
    mtp_layers_note: >-
      config num_nextn_predict_layers 3，清单里 L92–L94 三个完整块，与声明一致。每块是滑窗注意力 +
      稠密 FFN（13824）+ eh_proj [4096, 8192] + 自带一份 shared_head.output [128896, 4096] 词表投影；
      三份 shared_head.output 合计 1.58B，占草稿侧 2.52B 的 63%。参考实现（inference/）不加载 MTP，
      模型卡给的 vLLM 命令用 --spec-method mtp

  vision:
    encoder: Perception Encoder（vision_config.model_type perception_encoder），LayerScale 0.1
    layers: 47
    hidden: 1536
    num_heads: 16
    patch_size: 14
    intermediate: 8960
    out_hidden: 4096
    params: 1981014784.0
    fusion: >-
      两级 3×3 卷积下采样（vit_downsampler1 1536 → 3072、vit_downsampler2 3072 → 6144），
      再经 vit_large_projector [4096, 6144] 投到主干宽度；image_token_len 169
    tokens:
      reference_resolution: 728x728
      patch_grid: 52x52
      encoder_tokens: 2704
      llm_tokens: 169
      compression_ratio: 16
      compression_stage: >-
        两级跨步卷积，不是拼接式 merger（与上一代 step-3 同一路子）。
        压缩全部在 vit_large_projector **之前**，那一层只跑 169 次；
        但**两级卷积自己落在不同的输出位置数上**：
        vit_downsampler1 [3072, 1536, 3, 3] 跑 676 次（26² 个输出位置）、
        vit_downsampler2 [6144, 3072, 3, 3] 跑 169 次。
        两级合计 2704 / 169 = **16:1，与上一代相同、全批最高**
        （DeepSeek 两档 9、其余九份 4）。
        把两级都按 169 算会少算第一级 4 倍
      dynamic_resolution: false
      scope_note: >-
        **169 只是全局视图，不是「一张图」。** config 另有
        patch_token_len 81，与上一代 step-3 两个值逐位相同；
        上一代的 R3 已判过「169 不是单图上限、单图是 169 + 81 × patch 数」，
        而本代 config 的这两项与上一代同值，所以同一个护栏在本代照用 ——
        但**本代的模型卡本轮没读**，「多 patch 预处理默认开启」这句
        是上一代卡上的话，没有本代的一手来源，所以本代只记
        「两个 config 值相同」这个事实，不替厂商声明默认行为。
        上面 tokens 与下面 prefill 的每一格都只覆盖全局视图那一路。
        另外本档是**固定分辨率**（vision_config.image_size 728），
        位置表 [2704, 1536] 把它钉死，
        所以**不能换算到本仓的 672×672 参考分辨率**——
        和那十份比 token 数是范畴错误，要比只能比压缩比与塔开销占比
      derivation: >-
        因子：
        (1) 输入 728×728 —— config.vision_config.image_size；
        (2) patch 14 —— config.vision_config.patch_size，并由
        vision_model.conv1.weight [1536, 3, 14, 14] 的后两维印证；
        (3) 728 / 14 = 52，52² = 2704，**没有 cls token**
        （config 的 use_cls_token 为 false），
        与位置表 vision_model.positional_embedding [2704, 1536] 的行数
        逐位相同 —— 这一致性同时闭合了 (1)(2)(3) 三项，
        也和上一代 step-3 的 2705 = 1 cls + 52² 形成对照；
        (4) 两级卷积的 **stride 是推出来的、不是读来的**：
        两端都有官方值（输入网格 52² 由位置表钉住、输出 169 =
        config 的 image_token_len），两个 3×3 卷积要把 52 变成 13
        只有「各 stride 2」一条路（52 → 26 → 13），所以 stride 2 是
        被两个官方端点逼出来的。通道数 1536 → 3072 → 6144 每级翻倍，
        与上一代 step-3 同一个模式，算旁证。
        **上一代的 stride 有实现行号可引**（modeling_step3.py 686–698），
        本代参考实现本轮没读，所以这里只能靠两端闭合 ——
        结论相同但依据弱一档，padding 也因此没有来源
    prefill:
      encoder_linear_gflops: 9399.8
      projector_linear_gflops: 123.34
      backbone_token_budget: 169
      backbone_linear_gflops_per_token: 52.11
      image_as_text_tokens: 352
      attention_excluded: >-
        被排除的是 encoder 自注意力的 QK^T 与 AV，形式
        4 × n² × hidden × layers。本档是固定分辨率，所以 n 恒为 2704。
        跨度没有一手来源：vision_config 里没有窗口一类的键，
        Perception Encoder 的参考实现本轮没读。
        按整图一段取 n = 2704 约 2704² × 4 × 1536 × 47 = 2.11 TFLOPs，
        是线性项 9.40 TFLOPs 的 22%。
        没有加进上面几格，因为主干那侧的分母也是线性项、不含注意力
      derivation: >-
        encoder 线性项 = 2 × 2704 × (conv1 903,168 + 47 层 ×
        每层 36,962,304 = 1,737,228,288) = 2 × 2704 × 1,738,131,456
        = 9,399,814,914,048 ≈ 9.40 **T**FLOPs。
        每层 36,962,304 逐因子核过：in_proj 3 × 1536² + out_proj 1536² +
        fc1 8960 × 1536 + fc2 1536 × 8960，四项相加与清单里 188 个
        transformer.resblocks 线性张量的求和逐位相同
        （注意本代 qkv 是**融合的 in_proj_weight**，不是三个分开的张量）。
        **这是 12 份里第二大的 encoder 线性项**，只有上一代 step-3 的
        23.1 TFLOPs 更大 —— 本代塔从 63 层 × 1792 降到 47 层 × 1536，
        线性项降到 41%。
        projector 线性项按各自的输出位置数分三项算（见
        tokens.compression_stage）：
        2 × 676 × (3072 × 1536 × 3²) = 57.42 +
        2 × 169 × (6144 × 3072 × 3²) = 57.42 +
        2 × 169 × (4096 × 6144) = 8.51，合计 123.34 GFLOPs。
        主干分母 = 2 × (active_params.total 26,583,227,840 −
        active_params.lm_head 527,958,016) = 52,110,539,648 ——
        **不能用 derived 里的 flops.linear_per_token 53,166,455,680**，
        那一项含 lm_head（decode 口径）。
        换算 = 169 + 9,523,153,047,552 / 52,110,539,648 = 169 + 182.7 = 352
        （分子 = encoder 9,399,814,914,048 + projector 123,338,133,504）。
        **塔开销占比 2.08，是 12 份里第二高**（只有上一代 step-3 的 2.86 更高）：
        一张图的 prefill 成本 52% 花在视觉塔上。
        **跨代看这是一次有意的再平衡**：压缩比没动（仍是 16:1、
        主干仍只收 169 个 token），塔砍到 41%，于是占比从 2.86 降到 2.08
        —— 塔和主干这两侧**只动了塔**，主干 73.99 → 52.11 反而也小了，
        所以降幅全部来自塔
    separability:
      weight_prefix: >-
        vision_model.（666 个张量，含两级 vit_downsampler）与
        vit_large_projector（1 个），共 667 个；主干在 model. / lm_head.。
        前缀不相交。
        **注意两级下采样在本代挪进了 vision_model. 之下**
        （vision_model.vit_downsampler1 / _2），而上一代 step-3 的
        vit_downsampler / vit_downsampler2 是顶层前缀 ——
        按上一代的前缀去筛本代会漏，反之会把下采样算成塔外
      shard_isolation: dedicated
      shard_note: >-
        实测 index 的 weight_map：667 个视觉张量全部落在
        **model-vit-00001.safetensors** 这一个分片里，非视觉张量 **0 个**，
        而主干的 26 个分片叫 model-000NN.safetensors。
        **这是本仓 12 份里唯一一个用文件名就标出视觉塔的发布**——
        不必读 index、不必按前缀筛，文件名本身就是边界。
        对比上一代 step-3：765 个视觉张量被切到前两个分片、
        两片都混着主干张量（mixed），塔还跨了文件边界。
        同族系一代之内从「最难分离」变成「最易分离」。
        另记：本仓另有 18 个跨文件重名张量的发布习惯（见 R8/R9），
        那是参数量对账的事，与这里的分片隔离无关
      cross_prefix_sharing: >-
        weight_map 的名字里没有任何一个同时匹配 vision_model. /
        vit_large_projector 与 model. / lm_head.，即没有重名共享；
        两侧连分片都不重合，所以也排除了同片内的加载期耦合。
        落盘层面的 tied weights 要看 safetensors 头的数据偏移是否重合，
        weight_map 答不了，本轮没读偏移 ——
        **本记录对重名张量尤其要当心**：R8/R9 已查明本仓有 18 个跨文件
        重名张量，不过那 18 个都在主干侧，没有一个跨视觉–主干边界

precision:
  weights_release: [FP8_E4M3, BF16, FP32, NVFP4]
  weights_release_scope:
    FP8_E4M3: { manifest_taken: true, in_precision_table: true }
    BF16: { manifest_taken: true, in_precision_table: true }
    FP32: { manifest_taken: true, in_precision_table: true }
