    local_window:
      dtype: BF16
    source: >-
      读参考实现（二手于部署 kernel）：DSALayerCache / DenseLayerCache 的 key / value 用构造时
      传入的 dtype，而参考实现里唯一的构造点 model.py 的 allocate_cache **无 dtype 形参、
      写死 torch.bfloat16**（不是 generate.py 传入，参考实现内不可配置）；
      区域摘要硬编码 torch.float8_e4m3fn（kernel.py，无 scale）
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size: [128, 128]
    weight_format: e4m3
    per_subsystem:
      expert: FP8_E4M3
      shared_expert: BF16
      attention: BF16
      indexer: BF16
      dense_ffn: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: FP32
      draft: BF16
      vision: BF16
    per_subsystem_scale:
      expert: FP32
    per_subsystem_block:
      expert: '[1,128,128]'
    block_size_note: >-
      实测：down_proj [352, 4096, 1536] 对 scale [352, 32, 12]、gate/up [352, 1536, 4096] 对 [352, 12, 32]，
      即每个专家内 [128, 128]（首维 1 是专家轴）—— 与 config 声明一致。
      FP8 只覆盖 85 层的路由专家：L88–L90 三层的专家是 BF16、不带 scale（config modules_to_not_convert
      逐层点名），注意力、共享专家、稠密 FFN、indexer 全部 BF16
    subsystem_method: >-
      代表精度由 fetch_dtypes.py 抽样（读 26 个分片里的 10 个）得出，按完整清单核过：
      F8_E4M3 只有 255 个张量（85 层 × gate/up/down），恰是全部 FP8 元素 564,721,090,560；
      expert 桶按元素数 96.6% 是 FP8，另 3.4% 是 L88–L90 的 BF16 专家 —— 假定「专家整体 FP8」的
      引擎会在这三层解错。FP32 真参数 2,413,120 个（各类 norm、router_bias、indexer 的
      sparse_indexer_w [16, 4096] 与 ssmax_s [64]），另有 34,467,840 个 FP32 scale 元素。
      indexer 桶里 sparse_indexer_w 是 FP32，其余 q/k/z 是 BF16 —— 但这**不是精度异常**：
      sparse_indexer_w [16, 4096] 的 FP32 是声明时就指定的（nn.Linear dtype=float32），
      计算前会 round 回激活 dtype，不要当成 FP32 算路；它是加权 ReLU 打分的逐头权重，
      对应 DeepSeek 的 indexer.weights_proj。ssmax_s [64] 23 层逐字节相同、64 个值全等于
      0.08495760 ≈ 1/ln(vocab)，是未训练的 SSMax 初值，参考实现不读它（索引打分用 ReLU、无 softmax），
      shape 按 64 个 query 头 replicate 只为 checkpoint 兼容

