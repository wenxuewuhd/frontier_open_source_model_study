    扣掉 MTP 层后 600.46B（+0.08%），口径没写。
    **外部对账对不上**：HF 的 safetensors tally 是 604,339,504,832，比本仓多 1,366,577,536。
    逐 dtype 看，F8_E4M3 逐位相同，差在 BF16（+1,366,556,672）与 F32（+20,864），scale 不在其中。
    index 外那份 model-mtp3-00001（10 个张量，BF16 1,123,024,896、F32 24,576）若被 HF 重复计入，
