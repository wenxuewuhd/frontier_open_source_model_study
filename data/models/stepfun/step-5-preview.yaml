review:
  - id: R14
    field: arch.vision.separability.shard_isolation
    severity: missing
    claim: >-
      视觉侧只有结构尺寸、params 与一句 fusion（「两级 3×3 卷积下采样…
      image_token_len 169」），infra 三组一格都没有
    finding: >-
      补 arch.vision 下 tokens / prefill / separability 三组，逐因子核过。
      三件事值得记：
      (1) **这是本仓 12 份里唯一一个用文件名就标出视觉塔的发布**：
      667 个视觉张量全在 **model-vit-00001.safetensors**、非视觉张量 0 个，
      而主干的 26 个分片叫 model-000NN.safetensors。
      不必读 index、不必按前缀筛，文件名本身就是边界。
      对比上一代 step-3：765 个视觉张量被切到前两片、两片都混主干，
      塔还跨文件边界 —— **同族系一代之内从「最难分离」变成「最易分离」**。
      (2) **跨代是一次有意的再平衡**：压缩比没动（仍 16:1、主干仍只收
      169 个 token），塔从 63 层 × 1792 砍到 47 层 × 1536、线性项降到 41%
      （23.1 → 9.40 TFLOPs），于是塔开销占比从 2.86 降到 2.08。
      主干那侧 73.99 → 52.11 反而也小了，**所以降幅全部来自塔**。
      一张图仍有 52% 的 prefill 成本在塔上，是 12 份里第二高。
      (3) **两级卷积的 stride 在本代是推出来的、不是读来的。**
      两端都有官方值（输入网格 52² 由位置表 [2704, 1536] 钉住、
      输出 169 = config 的 image_token_len），两个 3×3 卷积把 52 变成 13
      只有「各 stride 2」一条路，所以 stride 2 被两个官方端点逼出来；
      通道 1536 → 3072 → 6144 每级翻倍与上一代同模式，算旁证。
      但**上一代的 stride 有实现行号可引**（modeling_step3.py 686–698），
      本代参考实现本轮没读 —— 结论相同、依据弱一档，padding 没有来源。
      derivation 因此标 judgement 进 Gate C。
      两处护栏：**没有 cls token**（use_cls_token false，位置表 2704 行
      而不是上一代的 2705），所以 encoder_tokens 填 2704；
      169 只是全局视图 —— config 的 patch_token_len 81 与上一代逐位相同，
      上一代 R3 的护栏照用，但**本代模型卡本轮没读**，
      「多 patch 默认开启」是上一代卡上的话，所以本代只记
      「两个 config 值相同」这个事实，不替厂商声明默认行为。
      另：两级下采样在本代挪进了 vision_model. 之下，
      上一代是顶层前缀 —— 按上一代前缀筛本代会漏掉下采样链
    resolution: corrected
    changed_to: >-
      新增 arch.vision.tokens（2704 → 169，压缩比 16；derivation 写明
      stride 是两端闭合推出的、依据比上一代弱一档；scope_note 写明
      169 只是全局视图、固定分辨率不可换算到 672）、
      arch.vision.prefill（encoder 线性 9.40 TFLOPs、projector 123.34 GFLOPs
      分三项给出、一张图 ≈ 352 个文本 token，并写明跨代再平衡的归因）、
      arch.vision.separability（**dedicated**，model-vit-00001 专用文件，
      并与上一代的 mixed 对照；另注明 R8/R9 那 18 个重名张量都在主干侧、
      没有跨视觉边界）；evidence 加十条，五格判断类进 Gate C
