  counting_note: >-
    按完整权重清单（index 引用的 26 个分片 + 2 个 index 外副本，按名去重 2704 条目）逐项统计。
    2704 是 safetensors 条目数，其中 255 条是 weight_scale_inv（FP32，路由专家 FP8 的
    per-block scale）—— 不计入参数、只计入权重存储；真权重张量 2449 条。无打包容器，numel 即参数数。
    total 是本仓按清单求和的**实测值**，含视觉塔与投影（1.98B）和 3 个 MTP 层（2.52B）。
