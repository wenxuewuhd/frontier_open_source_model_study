notes: >-
  这一族结构上改动最大的一代：注意力、路由、归一化、位置编码、投机解码五条轴同时变。
  model_type step3p5、architectures Step3p5ForCausalLM。
  层数、层型集合、两型投影宽度、专家堆叠形状、dtype 分布对照完整权重清单穷举核过，
  层型划分有六条互相独立的证据给出同一个下标集合；
  两型头数的来源、q/k norm 与 RoPE 的先后、逐头门的作用点、路由偏置只用于选路、
  缓存精度与滑窗的实现方式来自厂商随仓的 remote-code 实现，不是部署 kernel。
  top_k 8、routed scaling 3.0、swiglu_limits、sliding_window 512 这类运行期标量只有 config 一个来源。
  **同代的多模态封装 Step-3.7-Flash 不另起记录**：它的文本侧 804 个张量与本记录
  名字集合相同、逐条同形同 dtype（0 处差异），视觉塔 667 个张量又与
  Step-5-Preview 的逐条相同（0 处差异）—— 两边都已被覆盖，它自己不贡献新的结构事实。
  文本侧 config 逐键比过，唯一的实质差异是 swiglu_limits_shared[43] 从 0 变成 16
  （L43 的共享专家也加了截断），其余差异是键的有无（auto_map / tie_word_embeddings /
  use_qk_norm / zero_centered 不在它的 text_config 里，另多一个 use_mfa: false）——
  都是运行期标量或装饰键，不改形状、层型、专家数或缓存账。
  同代的基座检查点 Step-3.5-Flash-Base 与 -Base-Midtrain 也不另起记录：同架构，
  差的都是训练阶段量，**但两份差的不是同一组**——
  Base：num_nextn_predict_layers 1、max_seq_len 32768、vocab 128815、全局层 rope_theta 1e6；
  Base-Midtrain：num_nextn_predict_layers 1，而 max_seq_len **131072**、vocab **128896**、
  全局层 rope_theta **5e6**（除了 MTP 层数，它已经和正式版一致）。
  两份都没有 rope_scaling。四项里只有 MTP 层数是两份共有的差异。
  另有 FP8 与两个 GGUF 量化变体，本记录只覆盖 BF16 这个仓

open_questions:
  - >-
    滑窗层的每序列固定量（`arch.attention.kv_sharing.measured_per_token`
    的 local_window_elems_per_sequence = 34,603,008 元素，核查 R11）是**结构下限**，
    不是任何公开实现的行为：
    滑窗靠 create_sliding_window_causal_mask 的掩码实现，而参考实现的缓存是无界的
    DynamicCache，滑窗层照样随上下文一直长。要真正拿到这个下限需要引擎侧的有界滑窗缓存
    （vLLM / SGLang 都有这类实现，但本轮没读它们对这一代的具体配置）。
    与后代 Step-5-Preview 的对照：那一代厂商另发了 inference/ 参考实现，
    里面的 DenseLayerCache 是按窗口大小预分配的
  - >-
    **KV 缓存精度没有任何厂商来源**：模型卡没有一处说过缓存精度，它给的 vLLM / SGLang
    命令都不设 --kv-cache-dtype。可读的参考实现里没有带格式的缓存分配
    （第 705 行唯一的 DynamicCache、无 dtype 形参、且不设上界），
    追数据流只能确认 k_norm 与 RoPE 之后的 K/V 是 BF16、路径上不量化 ——
    那是激活 dtype 不是落盘格式。所以 precision.kv_cache 不填、
    bytes_basis 留 `dtype_fallback`，字节列只当占位值。
    参照：同代多模态封装 Step-3.7-Flash 的 NVFP4 变体，厂商命令里明写
    --kv-cache-dtype fp8 / fp8_e4m3 —— 说明这家在需要时是会写的，而 BF16 发布这边没写
  - >-
    厂商「~11B 激活」与本仓带宽口径 11.46B 相差 4.2%，与扣掉 lm_head 的 10.93B 相差 0.6%，
    含输入词表是 11.99B。三个数都在 11B 附近，厂商口径没写是哪一个
  - >-
    模型卡的「196.81B（196B Backbone + 0.81B Head）」里，0.81B 已查清是**一个** MTP 块
    （实测 809,390,336，三块逐块等值）。但 196B 与本仓实测的主干 196,956,130,368 差 0.49%，
    而 196 + 0.81 = 196.81 与 196.96 + 0.81 = 197.77 对不上 —— 厂商怎么取整没写
  - >-
    context.train_native 记 131072，依据是 rope_scaling 的 original_max_position_embeddings，
    **不是厂商对原生训练长度的声明** —— 两者常常相同但不是一回事，标 judgement
  - >-
    训练精度无一手声明，precision.training 不填
  - >-
    本记录沿用 derive.py 的分量键 global_kv / local_window（measured_per_token 分支只认这三个键），
    而 kv_table.py 的 COMPONENT_LABEL 把 global_kv 渲染成「全局压缩 KV」——
    对本代不成立：这一代的全局分量是**未压缩**的 GQA K/V，没有任何压缩或索引结构。
    与 step-5-preview 记录里那条 open question 是同一个仓库级缺陷（需把 COMPONENT_LABEL 的
    global_kv 改成中性的「全局 KV」）。本记录不在 data/tracking.yaml 的名册里，
    所以不会出现在 docs 的跨族系表上；但 data/derived/step-3.5-flash.json 的分量键名
    照样不可直接当标签引用（数值可以）
