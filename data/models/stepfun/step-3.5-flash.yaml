sources:
  - kind: modelcard
    url: https://huggingface.co/stepfun-ai/Step-3.5-Flash
    locator: config.json / README.md @ ab446a3de5e1
    accessed: '2026-10-30'
    note: >-
      BF16 发布（另有 FP8 与两个 GGUF 量化变体，不另起记录）。44 个分片、804 个张量，
      逐分片读头取全、无读失败分片，按名去重后 804 = index 的 weight_map 条目数。
      模型卡规格表：45 层 / hidden 4096、256K 上下文、总参数 196.81B（原文
      「196B Backbone + 0.81B Head」）、激活约 11B、288 路由专家 + 1 共享、top-8、
      3:1 的滑窗与全局注意力比、MTP 头一次预测 4 个 token
  - kind: repo
    url: https://huggingface.co/stepfun-ai/Step-3.5-Flash/tree/ab446a3de5e171ea341227e24bb1f090e1b771f7
    locator: modeling_step3p5.py（Step3p5Attention / Step3p5RMSNorm / Step3p5MoEMLP / Step3p5RotaryEmbedding）、configuration_step3p5.py
    accessed: '2026-10-30'
    note: >-
      厂商随仓发布的 remote-code 实现，下载到本地只读、未执行。两型注意力的头数来源、
      q/k norm 与 RoPE 的先后、逐头门的作用点、路由偏置的用法、缓存精度与滑窗是靠掩码
      还是靠有界缓存实现，都从这里读

hf:
  repo: stepfun-ai/Step-3.5-Flash
  sha: ab446a3de5e171ea341227e24bb1f090e1b771f7
  last_modified: '2026-03-17T05:54:33.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: main
  predecessor: step-3
  successor: step-5-preview
  changed_from_predecessor:
    - axis: attention
      text: >-
        MFA 退场，回到 GQA 8 组 × 128，但改成**滑窗与全局 1:3 混合**：
        config layer_types 48 项里 full_attention 恰在 [0, 4, …, 44]（主干 12 层），
        其余 33 层主干是 sliding_window 512 的滑窗层。
        全局层随上下文线性增长、滑窗层每序列固定，两个分量
      benefit: >-
        每 token 随上下文增长的 KV 元素 31,232 → 24,576，而上下文从 65536 涨到 262144 ——
        同口径下单 token 更省，长上下文的总量由每序列固定的滑窗分量承担（34,603,008 元素/序列）
    - axis: attention
      text: >-
        **同一模型里两套注意力形状**：全局层 64 个 query 头、滑窗层 96 个 query 头
        （config 的 attention_other_setting 覆盖滑窗层），KV 都是 8 组 × 128。
        权重侧 q_proj [8192, 4096] 对 12 层、[12288, 4096] 对 36 层，0 例外
      benefit: 便宜的滑窗层多给头、贵的全局层少给头；KV 组数两型相同，所以缓存账不受头数影响
    - axis: attention
      text: 新增逐头注意力门 g_proj [64 或 96, 4096]（sigmoid，逐头一个标量乘在注意力输出上）与逐头 q_norm / k_norm [128]（RoPE 之前），前代两者都没有
    - axis: moe
      text: >-
        粗粒度 48 专家 top-3（中间维 5120）换成细粒度 288 专家 top-8（中间维 1280）；
        路由从前代硬编码的 FP32 softmax + top-k（不归一化、无偏置、无缩放）换成
        sigmoid 打分 + FP32 router_bias 选路 + 选中权重归一化 + routed scaling 3.0 ——
        后四件前代一件都没有
      benefit: 总参数 320.97B → 199.38B 而激活 37.92B → 11.46B（带宽口径）
    - axis: decoding
      text: 新增 3 个 MTP 层（各 809,390,336 参数，滑窗注意力 + 稠密 FFN + eh_proj + 自带一份词表投影），前代无投机解码模块
    - axis: residual
      text: RMSNorm 从常规（× w）改成零中心（× (1 + w)），且方差在 FP32 里算；config 新增 zero_centered true
    - axis: attention
      text: RoPE 从「逐层同一套 theta 500000」改成逐层两套：全局层 theta 5e6 + 只旋转一半维度（64/128）+ llama3 rope_scaling（factor 2.0）；滑窗层 theta 1e4 + 全旋转 + 不加 scaling（config yarn_only_types 只列 full_attention）
    - axis: context
      text: 65536 → 262144
    - axis: modality
      text: 退回纯语言：没有视觉塔。同代的多模态封装是 Step-3.7-Flash（文本侧 804 个张量与本记录逐条同形同 dtype，0 处差异），不另起记录
    - axis: scale
      text: hidden 7168 → 4096、层数 61 → 45、词表 128815 → 128896

params:
  total: 199384301376.0
  breakdown:
    expert: 190253629440.0
    attention: 4520804352.0
    draft: 2428171008.0
    shared_expert: 660602880.0
    embed: 527958016.0
    lm_head: 527958016.0
    dense_ffn: 415236096.0
    router: 49557312.0
    norm: 384256.0
  counting_note: >-
    按 index 的 weight_map 全量清单（44 个分片、804 个条目，逐分片读头取全）逐项统计，无读失败分片。
    无 scale 张量、无打包容器，numel 即参数数：BF16 199,384,289,280 个元素 +
    FP32 12,096 个元素（42 个 MoE 层 × 288 的 moe.router_bias，穷举 0 例外）。
    **与 HF 的 safetensors tally 199,384,301,376 逐位相同，逐 dtype 也相同。**
    total 含 3 个 MTP 块（draft 2,428,171,008 = 3 × 809,390,336，三块逐块等值）。
    **厂商声明值的口径由此查清**：模型卡写「196.81B（196B Backbone + 0.81B Head）」，
    而**一个** MTP 块恰是 809,390,336 = 0.81B —— 即声明值只算了一个 MTP 头。
    扣掉全部 3 块得主干 196,956,130,368（196.96B），比声明的「196B Backbone」高 0.49%；
    声明值自己的 196 + 0.81 与 196.96 + 0.81 对不上 0.96B，厂商没写 196B 是怎么取整的

context:
  max: 262144
  train_native: 131072
  extension_method: >-
    llama3 式 rope_scaling（factor 2.0、original_max_position_embeddings 131072、
    low_freq_factor 1.0、high_freq_factor 32.0），**只作用在全局层**
    （config yarn_only_types 只列 full_attention；参考实现 Step3p5Attention 在构造
    RotaryEmbedding 前按层型把 config.rope_parameters 置空或置成 rope_scaling）。
    131072 是 original_max_position_embeddings 的值，不是厂商对「原生训练长度」的声明

arch:
  layers: 45
  hidden: 4096
  vocab: 128896
  norm: >-
    零中心 RMSNorm：x / rms(x) × (1 + w)，方差与乘法都在 FP32 里算、最后 cast 回输入 dtype
    （参考实现 Step3p5RMSNorm.forward，`normed * (self.weight.float() + 1)` ——
    **无条件写死，不读任何开关**），权重落盘 BF16、以 0 为中心。
    config 里确实有 zero_centered: true，但 **modeling 与 configuration 两个文件里这个名字 0 次出现**，
    它是装饰性的；真正的依据是上面那行公式。同理 use_qk_norm: true 也没被读 ——
    q_norm / k_norm 是无条件建的。
    按常规 RMSNorm 读会把每层激活乘以约 0。
    **这是这一族第一次用零中心写法** —— 前两代（Step-1 / Step-3）都是常规 × w；
    后代 Step-5-Preview 沿用零中心但把 norm 权重落盘改成了 FP32
  norm_eps: 1.0e-05
  activation: >-
    SwiGLU，逐层 swiglu_limits 截断，但两组限值作用在不同模块上（参考实现 Step3p5DecoderLayer）：
    swiglu_limits 给**路由专家**，只有 L43 与 L44 两层非 0（值 7）；
    swiglu_limits_shared 给**共享专家**（MoE 层）或**稠密 FFN**（非 MoE 层），
    只有 L44 一层非 0（值 16）。其余 46 层不截断。
    config.json 里**没有 rms_norm_eps 这个键**，1e-5 取自 configuration_step3p5.py 的默认值
  position: >-
    逐层 RoPE，两套参数按层型分：滑窗层 theta 1e4、全旋转 128 维；
    全局层 theta 5e6、partial_rotary 0.5（每头 128 维里 64 维）、并且只有它们加
    llama3 rope_scaling。config 的 rope_theta 与 partial_rotary_factors 都是 48 项数组，
    其中非默认值的下标集合**与 layer_types 的 full_attention 逐一相同**（见 attention.layer_pattern）。
    参考实现给每层单独建一个 RotaryEmbedding，按 layer_idx 取数组里的那一项。
    部分旋转是在 apply_rotary_pos_emb 里按 `rotary_dim = cos.shape[-1]` 切出来的：
    前 rotary_dim 维旋转、其余维**原样拼回**（不是补零、不是跳过）。
    走 transformers 的 rope init，`dim = int(head_dim × partial_rotary_factor)` = 64、
    inv_freq 32 项、`cat((freqs, freqs))` 得 cos 宽 64 —— 即全局层每头 128 维里旋转前 64 维，
    滑窗层（factor 1.0）全旋转

  attention:
    type: hybrid
    num_heads: 64
    num_kv_heads: 8
    head_dim: 128
    v_head_dim: 128
    sliding_window: 512
    head_dim_note: >-
      **两型注意力，head_dim 与 KV 组数相同、query 头数不同**，权重侧逐层穷举 0 例外（48/48 层）：
      全局层 q_proj [8192, 4096] = 64 × 128、o_proj [4096, 8192]、g_proj [64, 4096]（12 层）；
      滑窗层 q_proj [12288, 4096] = 96 × 128、o_proj [4096, 12288]、g_proj [96, 4096]（36 层）。
      num_heads 这一栏记的是全局层的 64；滑窗层的 96 来自 config 的
      attention_other_setting.num_attention_heads，参考实现只在 layer_types 判定为
      sliding_attention 时才用它覆盖。
      K/V 两型都是 [1024, 4096] = **8 组 × 128**（attention_other_setting.num_attention_groups
      也是 8），所以缓存账与头数无关。
      q_norm / k_norm 是逐头 [128] 的零中心 RMSNorm，**在 RoPE 之前**；写缓存的 K 是
      k_norm 与 RoPE 之后的 8 × 128 = 1024 维，与 k_proj 输出维相同。
      QK 与 V 每头都是 128
    layer_pattern: >-
      config layer_types 共 48 项（主干 45 + 3 个 MTP 层），full_attention 恰在
      [0, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44] 共 **12 层**，全部在主干内；
      其余 33 个主干层与 3 个 MTP 层都是 sliding_window 512 的滑窗层。
      模型卡称之为「3:1 Sliding Window Attention ratio」。
      **这一代的层型划分是权重可观测的**（后代 Step-5-Preview 不是 —— 它两型的投影形状完全相同）：
      六条互相独立的证据给出同一个下标集合 —— layer_types 的 full_attention、
      q_proj 首维 8192、g_proj 首维 64、o_proj 第二维 8192、
      partial_rotary_factors 里 0.5 的下标、rope_theta 里 5e6 的下标，六者逐一相同。
      作用域：本代。注意全局层的下标是 ≡0 (mod 4)，而后代 Step-5-Preview 是 ≡3 (mod 4)
    output_gate:
      enabled: true
      type: >-
        逐头标量门：g_proj [num_heads, 4096] 产出每头一个标量，sigmoid 后乘在该头的
        注意力输出上（参考实现 use_head_wise_attn_gate 分支，在 o_proj **之前**）。
        不是逐通道门。前代无此结构，后代 Step-5-Preview 沿用
    hybrid:
      layer_types_count:
        full: 12
        sliding: 33
      interval: 4
      note: >-
        计数是**主干口径**（45 层）。另有 3 个 MTP 层也是滑窗层，开草稿侧时滑窗层是 36 层、
        全局层仍是 12 层。config 的 layer_types 数组已含这 3 层，共 48 项 ——
        按数组长度当主干层数会多算 3 层
    kv_sharing:
      layer_coverage: >-
        两类缓存覆盖面不同，以下层数都是**主干口径**（L0–L44）：
        全量 K/V（随上下文线性增长）只在 12 个全局层；
        滑窗 K/V（每序列固定 512 个位置）在其余 33 层。
        没有稀疏索引器、没有跨层共享、没有压缩 —— 这一代的缓存只有这两个分量。
        3 个 MTP 层（L45–L47）各带一套同形的 q/k/v/o/g 投影、layer_types 为滑窗，
        开草稿侧时滑窗层是 36 层（33 + 3），全局层不变
      measured_per_token:
        global_kv: 24576
        local_window_elems_per_sequence: 34603008
        note: >-
          逐因子：全局 K/V 每层 2（K 与 V）× 8 组 × 128 = 2048 元素
          （k_proj / v_proj 输出维 1024，k_norm 逐头 [128] 不改宽度；48/48 层穷举一致），
          × 12 个全局层 = 24,576；
          滑窗 512 个位置 × 2048 元素 × 33 个主干滑窗层 = 34,603,008 元素/序列
          （开草稿侧再加 3 × 1,048,576 = 3,145,728）。
          **滑窗那一侧是结构下限，不是参考实现的行为**：滑窗靠掩码实现
          （create_sliding_window_causal_mask，逐层 sliding_window=512），
          而参考实现的缓存是 transformers 的 DynamicCache —— 它不设上界，
          滑窗层也会随上下文一直长。512 个位置是「正确解码所需」的量，
          要靠引擎侧的有界滑窗缓存才拿得到（见 open_questions）

  ffn:
    type: moe
    intermediate: 11264
    layer_pattern: >-
      L0–L2 稠密（mlp.gate_proj [11264, 4096]），L3–L44 共 42 层 MoE
      （config moe_layers_enum "3,…,44"，权重侧 42 个 moe.* 与 3 个主干 mlp.* 逐一吻合）。
      **与前代和后代都不同：主干最后一层 L44 是 MoE**
      （Step-3 的 L60 稠密、Step-5-Preview 的 L91 稠密），
      所以这一份 first_k_dense 3 推出的 42 层恰好等于实测值，derive.py 的 EP 通信量不差那一层。
      3 个 MTP 层也是稠密 FFN（11264）

  moe:
    routed_experts: 288
    shared_experts: 1
    top_k: 8
    intermediate: 1280
    first_k_dense: 3
    dense_intermediate: 11264
    routing: >-
      sigmoid 门 + FP32 router_bias 选路：router 打分在 FP32 里做（config need_fp32_gate），
      prob = sigmoid(logits.float())，**bias 只参与 top-k 的选择**
      （topk 取自 prob + router_bias，而返回的权重是从未加 bias 的 prob 里 gather 的），
      再归一化、最后乘 moe_router_scaling_factor 3.0
      （参考实现 Step3p5MoEMLP.router_bias_func）。
      **归一化是写死的**：forward 里调用处是 `renormalize=True` 字面量，
      而 config 的 norm_expert_weight（true）在 modeling 里 0 次出现 ——
      行为与声明一致，但不是声明驱动的。
      moe.gate.weight [288, 4096] 落盘 BF16；moe.router_bias [288] 落盘 FP32、
      参考实现里 requires_grad=False
    balance: router_bias（config use_moe_router_bias；参考实现里它是不参与训练的选路偏置）
    routing_bias: 一套，只作用于 top-k 选择，不进入输出加权
    storage_note: >-
      堆叠存储：每层 moe.gate_proj / up_proj [288, 1280, 4096]、down_proj [288, 4096, 1280]，
      一个张量装一层全部 288 个专家，gate 与 up 分开不融合
      （参考实现 MoELinear 的 weight 形状就是 [num_experts, out_features, in_features]）。
      名字里没有 experts。共享专家叫 share_expert（单数），中间维 1280 与路由专家同宽。
      288 取自 126 个堆叠张量的首维（穷举、0 例外），不取自 config.moe_num_experts ——
      derive.py 的 config 侧对账因键名不同被 skip，这一项不在 Gate B 的覆盖内

  decoding:
    mtp_layers: 3
    mtp_layers_note: >-
      config num_nextn_predict_layers 3，清单里 L45–L47 三个完整块，与声明一致、三块逐块等值
      （各 809,390,336 参数）。每块恰 **17 个张量**，逐项加起来就是 809,390,336：
      滑窗注意力（96 头：q [12288, 4096]、k/v [1024, 4096]、o [4096, 12288]、g [96, 4096]、
      q_norm / k_norm [128]）+ 稠密 FFN（gate/up [11264, 4096]、down [4096, 11264]）+
      eh_proj [4096, 8192] + enorm / hnorm / input_layernorm / post_attention_layernorm
      / transformer.shared_head.norm（各 [4096]）+ 自带一份
      transformer.shared_head.output [128896, 4096] 词表投影。
      三份 shared_head.output 合计 1,583,874,048，占草稿侧 2,428,171,008 的 65.2%。
      模型卡说这个 MTP 头「一次预测 4 个 token」（1 主 + 3 草稿）
    speculative:
      method: MTP
      num_tokens: 4
      target_layers: [45, 46, 47]

precision:
  weights_release: [BF16, FP32]
  kv_cache: BF16
  kv_cache_components:
    global_kv:
      dtype: BF16
      note: 无 scale 张量
    local_window:
      dtype: BF16
      note: 无 scale 张量
    source: >-
      读参考实现（二手于部署 kernel）：Step3p5Attention 把 k_norm 与 RoPE 之后的
      key_states / value_states 交给 past_key_value.update()，缓存对象是 transformers 的
      DynamicCache（Step3p5Model.forward 里唯一的构造点，无 dtype 形参）——
      它原样保留传入 dtype，而 q/k/v 投影权重全是 BF16、路径上没有量化或 cast。
      参考实现里缓存精度不可配置；**它也不给滑窗层设上界**
  quantization:
    per_subsystem:
      expert: BF16
      shared_expert: BF16
      attention: BF16
      dense_ffn: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      draft: BF16
    subsystem_method: >-
      全量清单穷举（804/804 个张量），不是抽样：803 个条目 BF16，**1 类 42 个条目 FP32** ——
      moe.router_bias [288]，42 个 MoE 层各一个，共 12,096 个 FP32 元素，与 HF 的
      逐 dtype tally 逐位相同。router 这一桶因此是混的（gate BF16 + router_bias FP32），
      per_subsystem 记代表精度 BF16；FP32 占这一桶 49,557,312 个参数里的 0.024%。
      **router_bias 的 FP32 不是精度异常**：它是声明时就指定的（nn.Parameter(dtype=float32,
      requires_grad=False)），与 FP32 打分（need_fp32_gate）配套，不要当成 FP32 算路。
      norm 全是 BF16 —— 与前两代同，与后代 Step-5-Preview（norm FP32）不同。
      本代没有任何 FP8 或 scale 张量；FP8 发布在另一个仓（Step-3.5-Flash-FP8）

platforms:
  - engine: vLLM
    hardware: NVIDIA
    status: partial
    precision: BF16
    caveat: >-
      模型卡推荐 nightly 构建。**MTP3 在 vLLM 里还不支持** ——
      模型卡原文「Full MTP3 support is not yet available in vLLM」，给出的命令用
      `--hf-overrides '{"num_nextn_predict_layers": 1}'` 把草稿层压到 1 层。
      即开源引擎上这一代的投机解码只能跑三分之一的草稿深度
    ref:
      kind: modelcard
      url: https://huggingface.co/stepfun-ai/Step-3.5-Flash
    visibility: public
  - engine: SGLang
    hardware: NVIDIA
    status: partial
    precision: BF16
    caveat: >-
      模型卡给的安装来源是未合入主干的开发分支（docker lmsysorg/sglang:dev-pr-18084，
      或 git+https://github.com/sgl-project/sglang.git），不是正式 release；
      命令同样带 `--hf-overrides '{"num_nextn_predict_layers": 1}'`
    ref:
      kind: modelcard
      url: https://huggingface.co/stepfun-ai/Step-3.5-Flash
    visibility: public
  - engine: Transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    caveat: 模型卡把这条路径限定为「Debug / Verification」，并写明高吞吐要用 vLLM 或 SGLang；且参考实现的缓存无上界，滑窗层不省显存
    ref:
      kind: modelcard
      url: https://huggingface.co/stepfun-ai/Step-3.5-Flash
    visibility: public
  - engine: llama.cpp
    hardware: NVIDIA
    status: supported
    caveat: 模型卡指向官方 llama.cpp，并注明仓内 `llama.cpp` 目录已废弃；量化权重在 Step-3.5-Flash-GGUF-Q8_0 / -Q4_K_S 两个仓
    ref:
      kind: modelcard
      url: https://huggingface.co/stepfun-ai/Step-3.5-Flash
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      两类缓存两种增长方式：12 个全局层的全量 K/V 随上下文线性增长，
      33 个滑窗层每序列固定 512 个位置。合成一个数表达不了 ——
      256K 上下文下前者 12.00 GiB、后者只有 66.00 MiB
    quantified: >-
      元素口径（主干，不含 MTP）：**24,576 元素/token**，另 **34,603,008 元素/序列**。
      精度按参考实现（两类都 BF16、无 scale）：49,152 B/token、
      滑窗 66.00 MiB/序列，256K 上下文约 12.06 GiB —— theoretical_floor 口径，
      不含分页与对齐粒度。
      同口径对照：Step-1 180,224、Step-3 31,232、Step-5-Preview 36,064 元素/token。
      **这是这一族四代里随上下文增长那一项最小的一代**，而上下文是前代的 4 倍。
      滑窗那一侧是结构下限：参考实现用无界的 DynamicCache，拿不到这个数（见 open_questions）
    visibility: public
  - dimension: operator-gap
    finding: >-
      同一个模型里两套注意力形状：全局层 64 个 query 头、滑窗层 96 个 query 头
      （q_proj / o_proj / g_proj 三个张量的宽度都跟着变），KV 组数两型相同。
      按「整模型一个头数」做形状推断或 kernel 选择的实现会在其中一型上对不上 ——
      而且因为 KV 侧相同，缓存账看不出问题，错只会出现在 QKV 融合与 o_proj 上
    visibility: public
  - dimension: operator-gap
    finding: >-
      逐头注意力门是 o_proj 之前的一次 [num_heads] 广播乘：attn_out 先 reshape 成
      [..., num_heads, head_dim]、乘上 sigmoid(g_proj(x)) 再 flatten 回去。
      它在融合的 attention + o_proj 之间插了一步，且 g_proj 的输出宽度随层型变（64 或 96）
    visibility: public
  - dimension: ep-comm
    finding: >-
      细粒度 MoE 把专家数推到 288、单专家中间维压到 1280：grouped GEMM 的形状从前代的
      [48, 5120, 7168] 变成 [288, 1280, 4096]，同时 top-k 从 3 涨到 8 ——
      每 token 的 dispatch/combine 轮次翻了 2.67 倍
    quantified: >-
      EP 通信逐因子：2（dispatch + combine）× top_k 8 × hidden 4096 × 2 B（BF16）
      × 42 个 MoE 层 = 5,505,024 B/token。
      前代 Step-3：2 × 3 × 7168 × 2 × 56 = 4,816,896 B/token（derive.py 按
      first_k_dense 4 算成 57 层、4,902,912 B）。
      即专家细化之后 EP 通信量没降，而激活参数降了 3.3 倍 —— 通信在 decode 里的占比上升
    visibility: public

infra_signals:
  - text: >-
      滑窗 + 全局 1:3 在这一代定型，并被后代 Step-5-Preview 原样继承（比例相同、窗口同为 512）；
      Step-5 在它之上只加了稀疏索引器，而且只挂在全局层。
      即这一族的长上下文路线是「先用滑窗把绝大多数层的缓存钉成每序列固定，
      再对剩下那 1/4 全局层做稀疏」—— 两步分别落在两代上
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      两型注意力不同 query 头数（64 / 96）这件事在本仓目前是独一份：
      KV 组数相同而 query 头数不同，意味着两型的 attention GEMM 形状、
      o_proj 入口宽度、以及逐头门的宽度都不同，但 KV 缓存布局完全一致。
      图编译器若按首层形状推断整模型，会在第二层就错
    evidence: derived
    horizon: now
    axis: attention
  - text: >-
      投机解码在这一代是「模型给了、引擎还没给」：权重里 3 个完整 MTP 块，
      而模型卡自己给的 vLLM 与 SGLang 命令都用 `num_nextn_predict_layers: 1`
      把它压到 1 层，并注明 MTP3 尚未支持。
      模型侧的草稿深度与引擎侧可用深度要分开记，按权重里的块数估吞吐会高估
    evidence: official
    horizon: now
    axis: decoding

