reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 本会话复算（逐条读厂商实现源码 + 穷举全量权重清单），再加两个独立代理分片对抗式复核
  method: >-
    按 .claude/skills/model-audit 的取数与提问顺序过一遍，重点是「缓存账的提问顺序」七问。
    元素数与参数量一律**穷举全量清单**（facts/step-3.5-flash/shapes.json，44 个分片逐分片读头、
    804 个张量），不用抽样产物。
    本会话独立复核的是：804 条的 dtype 普查（762 BF16 + 42 FP32）与 HF 的逐 dtype tally 逐位相同；
    48/48 层的两型投影宽度与 KV 组宽；全局层下标集合的两类来源、六处取值（见 R9 与 R21）；
    一个 MTP 块的 17 个张量逐项求和 = 809,390,336（三块等值，解释了模型卡的「0.81B Head」）；
    KV 两个分量乘式的每个因子；MoE 层下标集合与 126 个堆叠张量的首维；
    以及**另起一轮 HTTP range 读全部 44 个分片的头、逐名计数**，确认跨文件重名张量 0 个。
    两型头数的来源、q/k norm 与 RoPE 的先后、逐头门的作用点、路由偏置只用于选路、
    部分旋转的实现方式、缓存对象与滑窗的实现方式，全部来自直接读厂商 remote-code 实现
    （modeling_step3p5.py / configuration_step3p5.py，只读未执行），行号记在各条 finding 里。
    另外**逐键查了 config 里的布尔/枚举键有没有被实现读**（R1、R2 就是这么抓出来的）。
    Gate B：derive.py --model 0 处不一致（层数、参数总量、外部 tally 三项全 ok；
    路由专家数因 config 键名是 moe_num_experts 而被 skip，这一项不在覆盖内）
    **第二轮**：两个独立代理分片对抗式复核（一个只看注意力与缓存账、一个只看参数量 / MoE / 精度 / 平台 / 排除依据），各自从权重清单与厂商源码重新验、不看本会话的结论。本记录因此新增 R13–R25 十三条 ——
    这一份改得最多，包括把比例写反（R13）、滑窗分量的量级说反（R14）、
    SGLang 的草稿深度写错且标成 official（R17），以及把 bytes_basis 从
    theoretical_floor 降回 dtype_fallback（R20）。

review:
  - id: R1
    field: arch.norm
    severity: unsupported
    claim: 零中心 RMSNorm，依据之一是「config zero_centered true」
    finding: >-
      公式本身对，但依据找错了：`zero_centered` 在 modeling_step3p5.py 与
      configuration_step3p5.py 两个文件里 **各 0 次出现**，它是装饰性的键。
      真正的依据是 Step3p5RMSNorm.forward 第 404 行
      `normed = normed * (self.weight.float() + 1)` —— **无条件写死**，不读任何开关。
      同类的还有 `use_qk_norm: true`（0 次出现，q_norm / k_norm 是无条件建的）、
      `sink: false`、`use_mfa`。把行为归因到一个没被读的键上，下一轮有人改了 config
      会以为行为跟着变；这也是 CLAUDE.md 那条「config 描述模块配置」的更强形态 ——
      有的键连模块配置都不描述
    resolution: corrected
    changed_to: >-
      norm 改成引用第 404 行那行公式，并写明 zero_centered 与 use_qk_norm 都是装饰性的键
  - id: R2
    field: arch.moe.routing
    severity: unsupported
    claim: 「再按 norm_expert_weight 归一化」
    finding: >-
      归一化确实发生，但不是 norm_expert_weight 驱动的：
      Step3p5MoEMLP.forward 第 345–346 行的调用处写的是
      `self.custom_routing_function(router_logits, self.top_k, renormalize=True)` ——
      **字面量 True**；而 `norm_expert_weight` 虽然在 configuration_step3p5.py 里有
      （默认 True），在 modeling 里 0 次出现。
      顺带核了 router_bias 的用法（router_bias_func，第 312–322 行）：
      `gate_prob = sigmoid(logits.float())`，topk 取自 `gate_prob + router_bias`，
      而返回的权重是从**未加 bias** 的 gate_prob 里 gather 的 —— 即偏置只参与选择、
      不进入输出加权。这一句记录原本就写对了
    resolution: corrected
    changed_to: routing 补「归一化是调用处的 renormalize=True 字面量，norm_expert_weight 没被读」
  - id: R3
    field: arch.activation
    severity: wrong
    claim: 「config 里 rms_norm_eps 是 null」
    finding: >-
      config.json 里**根本没有 rms_norm_eps 这个键**（不是有键而值为 null）。
      1e-5 来自 configuration_step3p5.py 的形参默认值。
      差别有实际后果：按「值是 null」去读，下一个人会以为 config 显式关掉了什么；
      按「键不存在」读，才会去看默认值
    resolution: corrected
    changed_to: 改成「config.json 里没有 rms_norm_eps 这个键」
  - id: R4
    field: arch.attention.layer_pattern
    severity: wrong
    claim: 「这一代的层型划分是权重可观测的（**前代** Step-5-Preview 不是）」
    finding: >-
      代际方向写反了：Step-5-Preview 是本代的**后代**（2026-10 对 2026-02），
      lineage 里也是 successor。结论本身成立（那一代两型投影形状完全相同，
      权重只能证「这 23 层挂了索引器」），但「前代」会把整条演进线读反
    resolution: corrected
    changed_to: 改成「后代 Step-5-Preview 不是 —— 它两型的投影形状完全相同」
  - id: R5
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: MoE 那一条写「…… + routed scaling 3.0，**前代三者**都没有」
    finding: >-
      列了四件新东西（sigmoid 打分、router_bias 选路、选中权重归一化、routed scaling 3.0）
      却说「三者」，而且没写前代那一侧是什么。前代 Step-3 是硬编码的 FP32 softmax + top-k，
      不归一化、无偏置、无缩放（见 step-3.yaml 的 R1）—— 四件全是新的
    resolution: corrected
    changed_to: 改写成「从前代硬编码的 FP32 softmax + top-k（不归一化、无偏置、无缩放）换成 ……，后四件前代一件都没有」
  - id: R6
    field: notes
    severity: missing
    claim: Step-3.7-Flash 不另起记录，依据是文本侧 804 个张量 0 处差异、视觉塔 667 个张量 0 处差异
    finding: >-
      权重侧的依据是实的（两边各自 set-equal 且逐条同形同 dtype），但只说权重、
      没说 config —— 读者无从判断「是不是 config 里藏了结构差异」。
      逐键比过之后，文本侧 config 唯一的**实质**差异是 swiglu_limits_shared[43] 从 0 变 16
      （L43 的共享专家也加了截断），其余是键的有无
      （auto_map / tie_word_embeddings / use_qk_norm / zero_centered 不在它的 text_config 里，
      另多一个 use_mfa: false）—— 都是运行期标量或装饰键，不改形状、层型、专家数或缓存账。
      排除依据因此成立，但原来的写法是不完整的
    resolution: corrected
    changed_to: notes 补上 config 逐键比对的结果与那一处实质差异
  - id: R7
    field: arch.decoding.mtp_layers_note
    severity: imprecise
    claim: 每块是「滑窗注意力 + 稠密 FFN + eh_proj + enorm/hnorm + 自带一份词表投影」
    finding: >-
      枚举不全，而记录同时声称每块 809,390,336 参数 —— 读者按这个列表加不出那个数。
      实际每块恰 **17 个张量**：q [12288, 4096]、k/v [1024, 4096]、o [4096, 12288]、
      g [96, 4096]、q_norm / k_norm [128]、mlp gate/up [11264, 4096] 与 down [4096, 11264]、
      eh_proj [4096, 8192]、enorm / hnorm / input_layernorm / post_attention_layernorm /
      transformer.shared_head.norm（各 [4096]）、transformer.shared_head.output [128896, 4096]。
      逐项求和正好 809,390,336，三块逐块等值，×3 = 2,428,171,008 = draft 桶
    resolution: corrected
    changed_to: mtp_layers_note 改成 17 个张量的完整枚举，并把 65.2% 的分子分母写成实数
  - id: R8
    field: arch.position
    severity: missing
    claim: 全局层 partial_rotary 0.5（每头 128 维里 64 维）
    finding: >-
      数对，但没写**怎么只旋转一半** —— 这正是算子层面会出错的地方。
      实现是 apply_rotary_pos_emb 第 125–134 行：`rotary_dim = cos.shape[-1]`，
      把前 rotary_dim 维旋转、其余维**原样 cat 回去**（不是补零、不是跳过）。
      宽度链：transformers 的 rope init 取 `dim = int(head_dim × partial_rotary_factor)` = 64、
