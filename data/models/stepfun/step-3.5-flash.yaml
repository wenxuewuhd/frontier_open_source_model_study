  - >-
    缓存精度取自参考实现：DynamicCache 原样保留 k_norm 与 RoPE 之后的 BF16，路径上没有量化。
    但这是 remote-code 实现，不是部署 kernel；vLLM / SGLang 是否给这一代开 FP8 KV，未读
  - >-
    厂商「~11B 激活」与本仓带宽口径 11.46B 相差 4.2%，与扣掉 lm_head 的 10.93B 相差 0.6%，
    含输入词表是 11.99B。三个数都在 11B 附近，厂商口径没写是哪一个
  - >-
    模型卡的「196.81B（196B Backbone + 0.81B Head）」里，0.81B 已查清是**一个** MTP 块
    （实测 809,390,336，三块逐块等值）。但 196B 与本仓实测的主干 196,956,130,368 差 0.49%，
    而 196 + 0.81 = 196.81 与 196.96 + 0.81 = 197.77 对不上 —— 厂商怎么取整没写
  - >-
    context.train_native 记 131072，依据是 rope_scaling 的 original_max_position_embeddings，
    **不是厂商对原生训练长度的声明** —— 两者常常相同但不是一回事，标 judgement
  - >-
    训练精度无一手声明，precision.training 不填
  - >-
    本记录沿用 derive.py 的分量键 global_kv / local_window（measured_per_token 分支只认这三个键），
    而 kv_table.py 的 COMPONENT_LABEL 把 global_kv 渲染成「全局压缩 KV」——
    对本代不成立：这一代的全局分量是**未压缩**的 GQA K/V，没有任何压缩或索引结构。
