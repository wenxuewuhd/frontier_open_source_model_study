sources:
  - kind: modelcard
    url: https://huggingface.co/stepfun-ai/Step-Audio-Chat
    locator: config.json / README.md @ e0335e2510b2
    accessed: '2026-10-30'
    note: >-
      模型卡自称「130 billion parameter multimodal LLM」，但仓里 27 个分片、795 个张量
      **全部是一个纯文本 Transformer**：embed_tokens / 88 层 (q,k,v,o + mlp.gate,up,down +
      input_layernorm + post_attention_layernorm) / model.norm / lm_head，没有任何音频
      编码器或适配器张量。音频前端在另一个仓（stepfun-ai/Step-Audio-Tokenizer），
      音频以离散 token 进 74752 的词表。本记录覆盖的是 Step-1 语言主干本身
  - kind: repo
    url: https://huggingface.co/stepfun-ai/Step-Audio-Chat/tree/e0335e2510b20d8b10e0ac1e07b159ef86681f14
    locator: modeling_step1.py（StepAttention / StepRMSNorm / build_alibi_cache）、configuration_step1.py
    accessed: '2026-10-30'
    note: >-
      厂商随仓发布的 remote-code 实现，下载到本地只读、未执行。head_dim、位置编码形态与
      缓存精度从这里读。仓里另有 lib/liboptimus_ths-torch{2.2,2.3,2.5}-cu12{1,4}.cpython-310-x86_64-linux-gnu.so
      三个预编译二进制，注意力快路径调它；**未执行、未反编译**

hf:
  repo: stepfun-ai/Step-Audio-Chat
  sha: e0335e2510b20d8b10e0ac1e07b159ef86681f14
  last_modified: '2025-02-17T15:51:26.000Z'
  pipeline_tag: audio-text-to-text
  gated: false

lineage:
  track: main
  successor: step-3

params:
  total: 131946590208.0
  breakdown:
    dense_ffn: 101317607424.0
    attention: 28789702656.0
    embed: 918552576.0
    lm_head: 918552576.0
    norm: 2174976.0
  counting_note: >-
    按 index 的 weight_map 全量清单（27 个分片、795 个条目，逐分片读头取全）逐项统计，无读失败分片。
    全部 BF16，无 scale 张量、无打包容器，numel 即参数数。
    **与 HF 的 safetensors tally 131,946,590,208 逐位相同** —— 这一族到 Step-3.5 都没有
    Step-5-Preview 那种跨文件重名张量（见 notes）。
    厂商声明值是模型卡原文「130 billion」，实测 131.95B 比它高 1.5%，口径没写。
    逐因子：dense_ffn = 88 层 × 3 × 12288 × 31232；attention = 88 层 ×
    (2 × 12288² + 2 × 1024 × 12288)；embed 与 lm_head 各 74752 × 12288（不共享，两份独立张量）

context:
  max: 32768

arch:
  layers: 88
  hidden: 12288
  vocab: 74752
  norm: >-
    常规 RMSNorm：x × rsqrt(mean(x²) + eps) × w，权重落盘 BF16、以 1 为中心
    （参考实现 StepRMSNorm，方差在 FP32 里算）。**不是**后两代的零中心写法
    （Step-3.5 / Step-5 是 × (1 + w)），按零中心读会把每层激活乘以约 2
  norm_eps: 1.0e-05
  activation: SwiGLU，无截断（参考实现 StepMLP：silu(gate) × up，无 clamp）
  position: >-
    **不是 RoPE** —— config 与参考实现里都没有 rope_theta、没有 rotary embedding 模块。
    Python 侧唯一的位置信号在 eager 回退路径：build_alibi_cache 造一个逐头斜率的加性偏置，
    斜率 2^(-8k/n)（n = 2^floor(log2(96)) = 64，96 > 64 所以另 32 头用 2^(-4/64) 的奇数次幂补齐），
    而衰减按距离的**平方根**：bias[q, k] = -m_h × √(q − k)，不是标准 ALiBi 的线性距离。
    快路径 torch.ops.Optimus.fwd(q, k, v, None, dropout, scale, causal, …) 签名里没有 bias 形参，
    偏置是否在算子内部加无法从可读源码判定（见 open_questions）

  attention:
    type: GQA
    num_heads: 96
    num_kv_heads: 8
    head_dim: 128
    head_dim_note: >-
      head_dim **不在 config 里**，参考实现按 hidden_size // num_heads = 12288 / 96 = 128 算；
      权重穷举一致：q_proj / o_proj 全 88 层都是 [12288, 12288]（96 × 128），
      k_proj / v_proj 全 88 层都是 [1024, 12288]（8 × 128），0 例外。
      没有 q_norm / k_norm，没有输出门 —— 写缓存的 K 就是 k_proj 的输出，8 × 128 = 1024 维
    layer_pattern: >-
      88 层全部同一种注意力：无滑窗、无稀疏、无跨层共享，层间投影形状完全相同（88 层一个签名）。
      config 里没有 layer_types，参考实现也不按层分型。作用域：本代
    kv_sharing:
      layer_coverage: >-
        88 层**全部**产出随上下文线性增长的全量 K/V，没有每序列固定的分量。
        这是这一族唯一一份不需要分两个分量记账的记录

  ffn:
    type: dense
    intermediate: 31232
    layer_pattern: 88 层全部稠密 SwiGLU（mlp.gate_proj / up_proj [31232, 12288]、down_proj [12288, 31232]），无 MoE、无共享专家

  decoding:
    mtp_layers: 0
    mtp_layers_note: >-
      config 没有 num_nextn_predict_layers，清单里也没有 eh_proj / enorm / hnorm / shared_head
      任何一类 MTP 胶水张量，层索引止于 87（= num_hidden_layers − 1）。无投机解码模块

precision:
  weights_release: [BF16]
  kv_cache: BF16
  kv_cache_components:
    global_kv:
      dtype: BF16
      note: 无 scale 张量
    source: >-
      读参考实现（二手于部署 kernel）：StepAttention 直接把 k_proj / v_proj 的输出交给
      past_key_value.update()，用的是 transformers 的 DynamicCache —— 它原样保留传入 dtype，
      而 q/k/v 投影权重全是 BF16、路径上没有任何量化或 cast。参考实现里缓存精度不可配置
  quantization:
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      全量清单穷举（795/795 个张量），不是抽样：**单一 dtype**，795 个条目全部 BF16，
      没有 FP32、没有 FP8、没有 scale。norm 也是 BF16 —— 与 Step-3.5（norm BF16）同、
      与 Step-5（norm FP32）不同

platforms:
  - engine: Transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    caveat: >-
      注意力快路径是随仓发布的预编译 torch.ops.Optimus.fwd，只有
      torch 2.2/2.3/2.5 × cu121/cu124 × cpython-310 × x86_64-linux 这几个组合的 .so；
      其余环境落到 eager 的 SDPA + ALiBi 回退路径。两条路径的位置偏置是否一致未验（见 open_questions）
    ref:
      kind: repo
      url: https://huggingface.co/stepfun-ai/Step-Audio-Chat/tree/e0335e2510b20d8b10e0ac1e07b159ef86681f14
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      88 层全部产出全量 GQA K/V，没有滑窗、没有压缩、没有跨层共享 ——
      这一族后面三代每一代都在削这一项，起点就在这里
    quantified: >-
      元素口径：每层 2 × 8 组 × 128 = 2048 元素（k_proj / v_proj 输出维，逐层穷举一致），
      × 88 层 = **180,224 元素/token**，无每序列固定分量。
      按参考实现的 BF16 折算 360,448 B/token，32K 上下文满长度 11.00 GiB/序列（单份逻辑 KV 的下限，
      不含分页与对齐粒度）。对照同口径的后代：Step-3 31,232、Step-3.5-Flash 24,576、
      Step-5-Preview 36,064 元素/token —— 元素口径跨代可比，与各代缓存精度无关
    visibility: public
  - dimension: weight-bandwidth
    finding: >-
      稠密 130B：每 token 搬运除输入词表以外的全部权重。MoE 之前这一项无从优化，
      只能靠量化或减层 —— 下一代（Step-3）用 48 专家 top-3 把它压到 38B 激活
    quantified: >-
      权重存储 245.77 GiB（全 BF16，实测自清单）。带宽口径激活 = 总量 − 输入词表 =
      131,028,037,632（dense_ffn + attention + lm_head + norm），即 99.3% 的权重每 token 都要过一遍
    visibility: public
  - dimension: operator-gap
    finding: >-
      位置编码既不是 RoPE 也不是标准 ALiBi：可读的回退路径按 **-m_h × √(距离)** 加偏置。
      按标准 ALiBi（线性距离）实现的 kernel 在这里分布会错，而且错得不报错。
      另一侧是快路径的预编译算子签名里根本没有 bias 形参，两条路径对不对得上无法从源码判定
    visibility: public

infra_signals:
  - text: >-
      这一族的起点是一个 88 层稠密 GQA，没有任何缓存侧设计 ——
      每 token 180,224 个 KV 元素是本仓目前所有记录里最高的一档。
      后三代（MFA 单 KV 组 / 滑窗混合 / DSA 稀疏）都可以读成对这一个数的连续攻击
    evidence: judgement
    horizon: settled
    axis: attention
  - text: >-
      快路径依赖随仓发布的预编译 .so（torch 版本 × CUDA 版本 × cp310 × x86_64 四重绑定），
      换硬件或换框架版本就只剩 eager 回退。这类「算子随模型发布」的做法在
      昇腾一侧没有对应物，适配时等于要从 Python 回退路径的语义重新实现一遍
    evidence: judgement
    horizon: settled
    axis: precision

