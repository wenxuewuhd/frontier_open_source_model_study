review:
  - id: R1
    field: arch.position
    severity: imprecise
    claim: 位置编码不是 RoPE，而是 ALiBi 式偏置、衰减按距离的平方根
    finding: >-
      两半都成立。(a) `rope`/`rotary` 在 modeling_step1.py 与 configuration_step1.py 里
      各 0 次出现，config.json 里也没有 rope_theta —— 这一族后三代全是 RoPE，只有本代不是。
      (b) build_alibi_cache（第 22–44 行）里 `bias = -torch.sqrt(bias_cols - bias_rows)`（第 39 行），
      bias_cols 是 dim 0、bias_rows 是 dim 1，在 SDPA 的 attn_mask 里 dim −2 是 query、
      dim −1 是 key，故元素 [q, k] = −m_h × √(q − k)，**不是**标准 ALiBi 的线性距离。
      斜率：m0 = 2^(−8/64)（n = 2^floor(log2 96) = 64）取 1…64 次幂，
      另 32 头用 m1 = 2^(−4/64) 取 1,3,…,63 次幂补齐，合计 96 个，与 96 个 query 头对齐
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R2
    field: arch.attention.head_dim
    severity: imprecise
    claim: head_dim 128，来源是 hidden_size // num_heads 而不是 config
    finding: >-
      config.json 里确实没有 head_dim；modeling_step1.py 第 66 行
      `self.head_dim = hidden_size // num_heads` = 12288 / 96 = 128。
      权重侧穷举 88 层、0 例外：q_proj 与 o_proj 全是 [12288, 12288]、
      k_proj 与 v_proj 全是 [1024, 12288]。1024 = 8 × 128 与 num_attention_groups 8 吻合，
      而这一代的 num_attention_groups **是被实现读的**
      （第 152 行 `num_groups=config.num_attention_groups`）—— 与下一代 Step-3 相反，
      那一份把 KV 头数写死成 1、完全不读这个键
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R3
    field: arch.attention.kv_sharing.layer_coverage
    severity: imprecise
    claim: 88 层全部产出随上下文线性增长的全量 K/V，每 token 180,224 个元素
    finding: >-
      三个因子各自独立找了来源，全部成立：条目宽 2 × 8 组 × 128 = 2048
      （k_proj / v_proj 的输出维 1024，88/88 层穷举一致，没有 q_norm / k_norm 改宽度）；
      层覆盖 88 层（config 无 layer_types，StepLayer 不按层分型，清单里 88 层一个签名）；
      一个条目覆盖 1 个 token（StepAttention 第 97 行把 k_proj / v_proj 的输出直接
      past_key_value.update，没有压缩、没有窗口、没有跨层共享）。
      2048 × 88 = 180,224，与 derive.py 的公式路一致
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R4
    field: arch.position
    severity: unsupported
    claim: 快路径与 eager 回退路径的位置偏置一致
    finding: >-
      **判不出来，所以记录里没有这么说。** 快路径是 modeling_step1.py 第 82 行
      `torch.ops.Optimus.fwd(q, k, v, None, dropout_p, softmax_scale, causal,
      return_attn_probs, None, tp_group_rank, tp_group_size)` —— 签名里没有 bias 形参，
      而 build_alibi_cache 只在 except 分支（第 112 行）被调用。
      两种可能（偏置烘在算子里 / 快路径不加偏置）都与可读源码相容。
      承载它的是三个预编译 .so（torch 2.2/2.3/2.5 × cu121/cu124 × cp310 × x86_64），
      **未执行、未反编译**，按 skill 规则 6 留二手、不关
    resolution: open
    changed_to: 作为第一条 open_question 保留，并在 platforms[0].caveat 里写明两条路径未验
  - id: R5
    field: precision.quantization.subsystem_method
    severity: imprecise
    claim: 全量清单穷举，795 个条目全部 BF16
    finding: >-
      穷举 facts/step-1/shapes.json 的 795 条，dtype 直方图是 {BF16: 795} ——
      单一 dtype，没有 FP32、没有 FP8、没有任何 scale 叶名。
      与 repoinfo.json 的 `safetensors.parameters` {BF16: 131,946,590,208} 逐位相同。
      norm 也是 BF16（177 个 norm 张量全 BF16），这一点与 Step-3.5 同、与 Step-5（norm FP32）不同，
      是跨代可查的差别而不是本记录的笔误
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R6
    field: kind
    severity: miscategorized
    claim: kind 记 llm，而模型卡自称「130 billion parameter multimodal LLM」
    finding: >-
      按仓里的东西判，llm 是对的：795 个张量的名字族只有 embed_tokens / 88 层
      (q,k,v,o + mlp.gate,up,down + input_layernorm + post_attention_layernorm) /
      model.norm / lm_head —— **没有任何音频编码器、适配器或 projector 张量**，
      arch.audio 一格都填不出来。音频以离散 token 进 74752 的词表，前端在
      stepfun-ai/Step-Audio-Tokenizer 另一个仓。记 omni 会让人期待一个不存在的编码器。
      措辞差异已写进 notes 与最后一条 open_question
    resolution: confirmed
    changed_to: kind 保持 llm，evidence 标 judgement（不是 official —— 这是本仓的判断，不是厂商的说法）
  - id: R7
    field: params.total
    severity: imprecise
    claim: 131,946,590,208，按 index 的 weight_map 去重后逐项求和
    finding: >-
      去重与不去重在本代**是同一个数**：另起一轮 HTTP range 读全部 27 个分片的头、
      按名计数，跨文件重名张量 **0 个**，per-file 求和 131,946,590,208 ==
      按 weight_map 去重 131,946,590,208 == HF tally 131,946,590,208，三者逐位相同；
      weight_map 795 条与 shapes.json 795 条名字集合相等，仓里只有 1 个 index 文件。
      即 Step-5-Preview 上那条「18 个跨文件重名张量」的发布习惯在本代不存在 ——
      这一条是**特意反向验的**，不是从「条目数相等」推的
    resolution: confirmed
    changed_to: 原值成立，不改；counting_note 里写明三者逐位相同

notes: >-
  阶跃星辰家族的公开起点，也是这一族唯一的稠密代。model_type step1、
  architectures Step1ForCausalLM。Step-1 本体从未单独开源，这份权重发布在
  Step-Audio-Chat 仓里 —— 仓名与模型名不同，但仓里的 795 个张量是纯语言主干，
  不含音频编码器（见 sources[0]）。kind 记 llm 而不是 omni，就是因为模态前端整个在记录之外。
  层数、层集合、投影宽度、单一 dtype 对照完整权重清单穷举核过；
  head_dim、位置编码形态、缓存精度来自厂商随仓的 remote-code 实现，不是部署 kernel。
  **同架构的小档位 Step-Audio-EditX（2025-10-29，32 层 / hidden 3072 / 同 74752 词表）
  按「参数量缩放」不另起记录。**
  这一族的发布习惯在 Step-5-Preview 变过：那一版有 18 个跨文件重名张量，而本代到
  Step-3.5-Flash 三代的 HF tally 与按 weight_map 去重后的数逐位相同

open_questions:
  - >-
    两条注意力路径的位置偏置是否一致，未定（arch.position，核查 R4）。eager 回退用 build_alibi_cache 的
    -m_h × √(q − k)；快路径 torch.ops.Optimus.fwd 的签名里没有 bias 形参，
    偏置要么烘在算子里、要么快路径根本不加。二进制 .so 未执行、未反编译，
    从可读源码判不出来 —— 要钉死得读 kernel 或做数值比对，那是独立一轮的事
  - >-
    缓存精度取自参考实现：DynamicCache 原样保留 k_proj / v_proj 的 BF16，
    路径上没有量化。但这是 remote-code 实现，不是部署 kernel；
    没有任何引擎给这一代做过官方 FP8 KV 配方，也没查
  - >-
    厂商「130 billion」与实测 131.95B 差 1.5%，口径没写（是否含词表、是否按 1 GiB 口径算，
    都解释不了 1.5%）
  - >-
    训练精度无一手声明，precision.training 不填。发布权重全 BF16，但这不能反推训练精度
  - >-
