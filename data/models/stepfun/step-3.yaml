reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 本会话复算（逐条读厂商实现源码 + 穷举全量权重清单）
  method: >-
    按 .claude/skills/model-audit 的取数与提问顺序过一遍。元素数与参数量一律**穷举全量清单**
    （facts/step-3/shapes.json，89 个分片逐分片读头、1663 个张量），不用抽样产物。
    本会话独立复核的是：1663 条的 dtype 普查与 HF 的逐 dtype tally 逐位相同；
    61/61 层的 MFA 五个投影宽度；168 个堆叠专家张量的首维；5 个稠密层与 56 个 MoE 层的下标集合；
    KV 乘式的每个因子；视觉塔边界（实测总量减塔 = 316,294,538,240，对上模型卡的 316B，
    而总量对上 321B，两个声明值同时闭合）；
    以及**另起一轮 HTTP range 读全部 89 个分片的头、逐名计数**，确认跨文件重名张量 0 个。
    MFA 的投影次序、KV 头数写死成 1、softmax 路由、缓存精度来自直接读厂商 remote-code 实现
    （modeling_step3.py / configuration_step3.py，只读未执行），行号记在各条 finding 里；
    AFD 与部署拓扑的结论来自模型卡与 docs/deploy_guidance.md 的原文。
    **arXiv 2507.19427 本轮没读**，所以记录里没有任何依据论文内容的数字。
    Gate B：derive.py --model 0 处不一致（层数、参数总量、外部 tally 三项全 ok；
    路由专家数因 config 键名是 moe_num_experts 而被 skip，这一项不在覆盖内）

review:
  - id: R1
    field: arch.moe.routing
    severity: imprecise
    claim: >-
      「softmax 路由（参考实现里 custom_routing_function 为 None 时走 F.softmax + topk；
      config 的 norm_expert_weight 为 false，即选中权重不再归一化）…… 打分精度无
      need_fp32_gate 之类的声明」
    finding: >-
      结论对，归因错，而且错在会误导下一个人的地方。(a) 这一代**没有**
      custom_routing_function 这个间接层 —— 那是下一代 Step-3.5 的结构；
      Step3vMoEMLP.forward 第 365–366 行直接 `F.softmax(router_logits, dim=1,
      dtype=torch.float)` 再 topk，然后 cast 回输入 dtype。(b) 打分**恒在 FP32 里做**
      （就是上面那个 `dtype=torch.float`），而我原话说「无 need_fp32_gate 之类的声明」，
      读起来像在说打分不是 FP32 —— 没有那个开关是对的，但精度结论反了。
      (c) `norm_expert_weight` 在 modeling_step3.py 里 **0 次出现**（`num_attention_groups`
      同样 0 次）：不归一化是因为实现里压根没有 renormalize 这一步，不是因为 config 写了 false。
      把行为归因到一个没被读的键上，正是 skill 规则 9 要防的那类
    resolution: corrected
    changed_to: >-
      routing 重写：说明 softmax 写死在实现里、打分恒 FP32、无 renormalize 这一步，
      并点明 norm_expert_weight 与 num_attention_groups 两个键都没被实现读
  - id: R2
    field: arch.activation
    severity: imprecise
    claim: SwiGLU，无截断（参考实现里 MoE 与稠密 FFN 都没有 clamp）
    finding: >-
      成立，但原话没给可复核的落点。实际是两处：Step3vMLP.forward（第 322–323 行）
      与 Step3vMoEMLP.get_expert_output（第 352–355 行）都是裸的
      `down_proj(silu(gate_proj(x)) * up_proj(x))`，没有 clamp 分支；
      config.json 里也没有 swiglu_limits / swiglu_limits_shared 两个键
    resolution: corrected
    changed_to: activation 补上两个函数名与「config 无这两个键」
  - id: R3
    field: arch.vision.max_image_tokens
    severity: wrong
    claim: max_image_tokens 169
    finding: >-
      169 是 config 的 `image_token_len`（全局视图的 token 数），**不是单图上限**。
      另有 `patch_token_len: 81`，而模型卡原文说多 patch 预处理默认开启
      （「multi-patch for image preprocessing is supported by default」），
      所以单图是 169 + 81 × patch 数。填进 max_image_tokens 会让下游按 169 做 prefill 预算
    resolution: corrected
    changed_to: 删掉 max_image_tokens 这一格，三个 token 数与多 patch 的关系写进 vision.fusion
  - id: R4
    field: arch.vision.params
    severity: imprecise
    claim: 视觉塔 4,675,374,592 参数
    finding: >-
      有两个厂商声明值同时闭合作为独立确认：实测总量 320,969,912,832 ≈ 模型卡
      「Total Parameters (VLM) 321B」；减去视觉塔（vision_model.* 与 vit_* 共 765 个张量、
      4,675,374,592）得 316,294,538,240 ≈ 模型卡「Total Parameters (LLM) 316B」。
      两侧同时对上，说明塔的边界（哪些张量算塔）划对了 —— 这比只核一侧强
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R5
    field: params.breakdown
    severity: miscategorized
    claim: breakdown 的 vision 是 4,675,374,592，与 derive.py 当前的分桶不一致
    finding: >-
      不一致是真的，而且根因在 lib/subsystems.py 不在本记录。两处：
      (a) `classify()` 的层号捷径在所有名字正则之前执行，而本代**视觉塔 63 层 > 主干 61 层**，
      于是 vision_model.transformer.layers.61/62 共 24 个张量（135,853,568）被判成 draft，
      并让 from_shapes 报出 mtp_layers_seen [61, 62] / draft_blocks_seen 2 ——
      一个**没有 MTP 的模型**上的假阳性；
      (b) vision 正则的 `vit\.` 要求字面点号，漏掉 bare `vit_downsampler` / `vit_downsampler2`
      共 4 个张量（331,362,304），落进 other，而 derive.py 的 active_params 把 other
      算进 always，带宽口径因此报 38,249,345,024 而不是 37,917,982,720（偏高 0.87%，
      而厂商声明 38B —— 错的那个反而更像对的）。
      两处改动已逐张量验过：只有本代受影响，28 个张量重新归类，
      step-1 / step-3.5-flash / step-5-preview 三份 0 变化。params.total 不受影响
    resolution: open
    changed_to: >-
      breakdown 写**修正值**（口径正确、且与两个厂商声明值闭合），
      counting_note 与最后一条 open_question 写明与当前 derive 分桶的差额；
      改法与行号报回主会话整合，属仓库级改动
  - id: R6
    field: arch.attention.head_dim_note
    severity: imprecise
    claim: q_proj 是降维、wq 是升维、inter_norm 在两者之间；KV 只有 1 组 × 256
    finding: >-
      逐行核过，全部成立，而且比记录原话更硬：
      第 412 行 `q_proj = nn.Linear(hidden_size, self.q_size)` 而 q_size = share_q_dim = 2048；
      第 417 行 `inter_norm = Step3vRMSNorm(self.q_size)`；
      第 419 行 `wq = nn.Linear(self.q_size, head_dim * num_attention_heads)` = 2048 → 16384。
      forward 第 433 / 437 / 438 行按 q_proj → inter_norm → wq 的次序走。
      第 403 行 `self.num_key_value_heads = 1` 是**字面量写死**，
      `num_attention_groups` 在整个 modeling 文件里 0 次出现 —— 把 config 那一项改掉也不改形状。
      权重侧 61/61 层穷举：q_proj [2048, 7168]、wq [16384, 2048]、k_proj / v_proj [256, 7168]、
      o_proj [7168, 16384]，0 例外。RoPE 是全旋转（apply_rotary_pos_emb 第 169–193 行
      对整条 head_dim 做 rotate_half，config 无 partial_rotary_factor）
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R7
    field: bottlenecks[0].quantified
    severity: imprecise
    claim: 31,232 元素/token，62,464 B/token，65536 上下文 3.81 GiB
    finding: >-
      三个因子各自独立找了来源：条目宽 2 × 1 组 × 256 = 512（k_proj / v_proj 输出维 256，
      61/61 层穷举一致，没有 q_norm / k_norm 改宽度）；层覆盖 61 层（config 无 layer_types、
      无滑窗、无稀疏，清单里 61 层一个签名）；一个条目覆盖 1 个 token
      （第 446 行把 RoPE 之后的 key/value 直接 update 进 DynamicCache，无压缩无窗口）。
      512 × 61 = 31,232，× 2 B = 62,464，× 65536 = 3.81 GiB，与 derive.py 的公式路一致。
      与前代 Step-1 的 5.77 倍是**元素口径对元素口径**（180,224 / 31,232），不跨 basis
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R8
    field: infra_signals[1].text
    severity: imprecise
    claim: AFD 在模型卡里与 MFA 并列，但开源部署路径里拿不到
    finding: >-
      两半都有原文。模型卡：「Through the co-design of Multi-Matrix Factorization Attention
      (MFA) and Attention-FFN Disaggregation (AFD), Step3 maintains exceptional efficiency」；
      docs/deploy_guidance.md 第 5 行：「our open-source deployment guide only includes TP and
      DP+TP deployment methods. The AFD (Attn-FFN Disaggregated) approach mentioned in our paper
      is still under joint development with the open-source community」。
      记录里没有任何依据 AFD 的量化数字，arXiv 2507.19427 只作名词出处 —— 论文本体没读，
      这一点在 sources[2] 与 notes 里都写了
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R9
    field: arch.ffn.layer_pattern
    severity: imprecise
    claim: 稠密层是 L0–L3 与 L60 共 5 层，MoE 是 L4–L59 共 56 层
    finding: >-
      权重侧穷举：带 `mlp.gate_proj` 的层下标恰 {0, 1, 2, 3, 60}，
      带 `moe.gate_proj` 的层下标恰 4…59（56 个），两集合不相交、并集 = 0…60，0 例外；
      与 config 的 moe_layers_enum 逐一相同，与模型卡「Number of Dense Layers 5」一致。
      顺带核了专家数：168 个堆叠张量（56 层 × gate/up/down）的首维**全是 48**（穷举 0 例外），
      56 个 moe.gate.weight 全是 [48, 7168]。
      **主干最后一层是稠密**这件事值得单列：按 first_k_dense 4 推「其余都是 MoE」会多算一层，
      derive.py 的 EP 通信量正是按 57 层算的（4,902,912 B/token 而非 4,816,896）
    resolution: confirmed
    changed_to: 原值成立，不改；layer_pattern 里已写明 derive.py 差那一层
  - id: R10
    field: bottlenecks[1].quantified
    severity: imprecise
    claim: TP16 下整机 16 份 KV，约 999,424 B/token、65536 上下文 61.0 GiB
    finding: >-
      1 个 KV 组在张量并行下切不开，所以复制倍数 = TP 度数：62,464 × 16 = 999,424 B/token，
      × 65536 = 65,498,222,592 B = 61.0 GiB，算术成立。
      TP16 这个档位不是假设出来的 —— 部署指南给的 BF16 最小部署单元就是 16×H20（约 642 GB），
      而同一份文档明说「Step3 only has single kv head, so attention data parallelism can be
      adopted to reduce the kv cache memory usage」，即厂商自己把 DP 当成这件事的解法。
      复制倍数来自并行布局，记录里写明了它不被「理论下限不含分页粒度」那条免责覆盖
    resolution: confirmed
    changed_to: 原值成立，不改

notes: >-
  这一族第一个 MoE、也是唯一一代用 MFA 的。model_type step3_vl，
  architectures Step3VLForConditionalGeneration。
  层数、层集合、投影宽度、专家堆叠形状、单一 dtype 对照完整权重清单穷举核过；
  视觉塔边界由「总量 321B / 扣塔 316B」两个声明值同时闭合独立确认。
  MFA 的投影次序、KV 头数写死成 1、缓存精度来自厂商随仓的 remote-code 实现，不是部署 kernel。
  top_k 3、rope_theta 500000、norm_expert_weight false、understand_projector_stride 2
  这类运行期标量只有 config 一个来源。
  **AFD 不在开源部署路径里**（见 infra_signals 第二条），本记录没有任何依据 AFD 的数字。
  arXiv 2507.19427 只当作 MFA / AFD 两个名词的出处引用，论文本体本轮没读。
  另有 stepfun-ai/step3-fp8 量化变体，本记录只覆盖 BF16 这个仓

open_questions:
  - >-
    缓存精度取自参考实现：DynamicCache 原样保留 k_proj / v_proj 的 BF16，路径上没有量化，
    模型卡也写了「currently only support bf16 inference」。但这是 remote-code 实现与模型卡措辞，
    不是部署 kernel；vLLM / SGLang 是否给这一代做了 FP8 KV，未读
  - >-
    MFA 的 latent 维 2048 只作用在 query 上 —— K 与 V 各自从 hidden 直接投到 256，
    没有 latent、没有上投影。这是「低秩 Q + MQA」的组合，与 MLA 的「低秩 KV + 上投影」
    是两件不同的事，本记录按 MQA + q_lora_rank 记。厂商用 MFA 这个名字把两者都概括进去了，
    论文里 MFA 的完整定义本轮没核（论文未读）
  - >-
    AFD 的具体切分方式（注意力与 FFN 各占多少设备、两段之间传什么、每 token 多少字节）
    全在论文与闭源栈里，开源部署指南明确说不提供。本记录不写任何 AFD 的量化数字
  - >-
    厂商「38B 激活」与本仓带宽口径 37.92B（= 常驻 19.42B + 专家 18.50B）相符到 0.2%，
    但厂商口径没写是否含 lm_head 与输入词表（含输入词表是 38.84B）
  - >-
    训练精度无一手声明，precision.training 不填
  - >-
    视觉塔的 2705 个位置（class token + 2704 个 patch = 52×52）与 image_token_len 169
    之间的下采样链本记录按卷积形状读出（2×2 再 3×3，stride 由 config 的
    understand_projector_stride 2 给），但 169 = 13² 与 2704 = 52² 之间是 4 倍边长，
    与两级卷积的具体 stride 组合没有逐步核对
  - >-
    lib/subsystems.py 在这一份上有两处归类命中不到（视觉塔层号 ≥ 主干层数被判成 draft；
    vision 正则漏掉 bare `vit_downsampler`），使 data/derived/step-3.json 的子系统分桶
    与本记录的 params.breakdown 不一致，且 active_params 把 331,362,304 个视觉下采样参数
    错当成常驻激活（带宽口径因此偏高 0.9%，报 38.25B 而非 37.92B）。
    params.total 与 Gate B 不受影响。修法与行号在交接笔记里，属仓库级改动
