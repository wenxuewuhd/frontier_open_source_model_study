lineage:
  track: main
  predecessor: step-1
  successor: step-3.5-flash
  changed_from_predecessor:
    - axis: attention
      text: >-
        稠密 GQA（8 KV 组 × 128）换成 MFA：KV 只剩 **1 组 × 256**，而 query 侧做低秩分解
        hidden 7168 → q_proj [2048, 7168] → inter_norm [2048] → wq [16384, 2048] = 64 头 × 256。
        每层每 token 的 KV 元素从 2048 降到 512
      benefit: >-
        每 token KV 元素 180,224 → 31,232（元素口径，5.77 倍）。代价是 o_proj 入口宽到 16384
        （64 × 256），注意力权重本身从 28.79B 降到 10.33B 但单层投影更宽
    - axis: moe
      text: 88 层全稠密（FFN 31232）换成 61 层里 56 层 MoE：48 路由专家 top-3 + 1 共享专家（各 5120 中间维），稠密层只剩 L0–L3 与 L60
      benefit: 总参数 131.95B → 320.97B，而每 token 激活 131.03B → 37.92B（带宽口径）
    - axis: attention
      text: 位置编码从 ALiBi 式加性偏置换成 RoPE（rope_theta 500000，逐层同一套，无 partial rotary、无 rope_scaling）
    - axis: modality
      text: 加视觉塔：CLIP 式 63 层 / width 1792（带 class token 与可学习位置表），两级卷积下采样后经 vit_large_projector [7168, 8192] 投到主干
    - axis: context
      text: 32768 → 65536
    - axis: scale
      text: hidden 12288 → 7168、层数 88 → 61、词表 74752 → 128815（模型卡注明 tokenizer 用 DeepSeek V3 的）

params:
  total: 320969912832.0
  breakdown:
    expert: 295950090240.0
    attention: 10330046464.0
    shared_expert: 6165626880.0
    vision: 4675374592.0
    dense_ffn: 1981808640.0
    embed: 923345920.0
    lm_head: 923345920.0
    router: 19267584.0
    norm: 1006592.0
  counting_note: >-
    按 index 的 weight_map 全量清单（89 个分片、1663 个条目，逐分片读头取全）逐项统计，无读失败分片。
    全部 BF16，无 scale 张量、无打包容器，numel 即参数数。
    **与 HF 的 safetensors tally 320,969,912,832 逐位相同。**
    两侧口径都对上了厂商声明：实测总量 320.97B ≈ 模型卡「Total Parameters (VLM) 321B」；
    扣掉视觉塔（vision_model.* 与 vit_* 共 765 个张量、4,675,374,592）得 316,294,538,240
    ≈ 模型卡「Total Parameters (LLM) 316B」。两个声明值同时成立，是塔边界的一条**弱**佐证：
    厂商两个值都取整到整数 B，差值 5B 对实测塔的 4.675B 相差 7%，
    凡是落在约 3.5B–5.5B 之间的塔边界都能同时满足这两个取整，所以它排除不了邻近的划法。
    塔边界真正的依据是名字前缀穷举（vision_model.* 与 vit_*，765 个张量，无交叉）。
    逐因子（每一项都能从形状复算）：
    expert = 56 层 × 3 × 48 × 5120 × 7168 = 295,950,090,240；
    attention = 61 层 × (2048×7168 + 16384×2048 + 2 × 256×7168 + 7168×16384) = 10,330,046,464；
    shared_expert = 56 层 × 3 × 5120 × 7168 = 6,165,626,880；
    vision = 4,675,374,592（765 个张量，见上）；
    dense_ffn = 5 层 × 3 × 18432 × 7168 = 1,981,808,640；
    embed = lm_head = 128815 × 7168 = 923,345,920（两份独立张量，不共享）；
    router = 56 层 × 48 × 7168 = 19,267,584；
    norm = (61 × 2 + 1) × 7168 + 61 × 2048 = 1,006,592 —— 每层三个 norm 张量里
    **inter_norm 只有 2048 宽**（它作用在 MFA 的低秩 latent 上，不是 hidden 宽），
    按 3 × 7168 算会多 437,248。九项相加 = 320,969,912,832 = total。
    **breakdown 与 data/derived/step-3.json 的分桶现已逐项相同**。
    原先不同：lib/subsystems.py 有两处命中不到这一份（视觉塔 63 层 > 主干 61 层，
    使 classify 的 mtp_from 层号捷径把 vision_model.transformer.layers.61/62
    共 24 个张量判成 draft；vision 正则的 `vit\.` 要求字面点号，
    漏掉 vit_downsampler / vit_downsampler2 共 4 个张量，落进 other），
    于是派生 JSON 显示 vision 4,208,158,720 + draft 135,853,568 + other 331,362,304。
    两处都已修（见 R5）：层号捷径加了视觉 / 音频塔旁路，vision 正则改成 `\bvit[._]`，
    28 个张量重新归类，**vision 回到 4,675,374,592，draft 与 other 两个桶消失**。
    params.total 两侧都不受影响（分桶不改总和），Gate B 的参数总量与外部对账一直是 0 差异

context:
  max: 65536

arch:
  layers: 61
  hidden: 7168
  vocab: 128815
  norm: >-
    常规 RMSNorm，以 1 为中心（参考实现 Step3vRMSNorm），权重落盘 BF16。
    与前代 Step-1 同；后两代（Step-3.5 / Step-5）改成零中心 × (1 + w)
  norm_eps: 1.0e-05
  activation: >-
    SwiGLU，无截断：参考实现的 Step3vMLP.forward 与 Step3vMoEMLP.get_expert_output
    都是裸的 `down_proj(silu(gate_proj(x)) * up_proj(x))`，没有 clamp；
    config 里也没有 swiglu_limits / swiglu_limits_shared，那是下一代 Step-3.5 才有的字段
  position: >-
    RoPE，rope_theta 500000，**逐层同一套**：config 里 rope_theta 是单个标量不是数组，
    没有 partial_rotary_factors、没有 rope_scaling、没有 layer_types。
    参考实现对 query（wq 之后的 64 × 256）与 key（1 × 256）全旋转 256 维

  attention:
    type: MQA
    num_heads: 64
    num_kv_heads: 1
    head_dim: 256
    v_head_dim: 256
    q_lora_rank: 2048
    head_dim_note: >-
      **MFA（Multi-Matrix Factorization Attention，模型卡原文）的落盘形状，逐层穷举 0 例外（61/61）**：
      q_proj [2048, 7168] 是**降维**（hidden → share_q_dim 2048）、
      wq [16384, 2048] 是**升维**（2048 → 64 头 × 256）—— 名字与直觉相反，
      按「q_proj 就是 query 投影」读会把 64 头 × 256 错当成 2048。
      两者之间是 inter_norm [2048]（RMSNorm，作用在低秩 latent 上）。
      k_proj / v_proj 都是 [256, 7168]，即 **1 个 KV 组 × 256**，不是 num_attention_groups × head_dim；
      o_proj [7168, 16384] 入口是 64 × 256。QK 与 V 每头都是 256。
      写缓存的 K 是 k_proj 的输出（RoPE 之后），256 维；没有 q_norm / k_norm、没有输出门。
      注意 **config 的 num_attention_groups: 1 并没有被实现读** ——
      参考实现 Step3vAttention 把 self.num_key_value_heads 写死成 1，
      config 那一项改成别的值也不会改变形状
    layer_pattern: >-
      61 层全部同一种注意力：无滑窗、无稀疏、无跨层共享，投影形状完全相同（61 层一个签名）。
      config 里没有 layer_types。作用域：本代 —— 下一代 Step-3.5-Flash 起按滑窗与全局 3:1 分了两型
    kv_sharing:
      layer_coverage: >-
        61 层**全部**产出随上下文线性增长的全量 K/V，没有每序列固定的分量。
        与前代 Step-1 一样只有一个分量，但条目宽度从 2048 降到 512

  ffn:
    type: moe
    intermediate: 18432
    layer_pattern: >-
      L0–L3 与 **L60** 稠密（mlp.gate_proj [18432, 7168]），L4–L59 共 56 层 MoE
      （config moe_layers_enum，权重侧 56 个 moe.* 与 5 个 mlp.* 逐一吻合）。
      模型卡的「Number of Dense Layers 5」指的就是这 5 层。
      **主干最后一层不是 MoE** —— 按 first_k_dense 4 推「其余都是 MoE」会多算一层 48 专家，
      derive.py 的 EP 通信量正是这么算的（57 层而非 56），差一层

  moe:
    routed_experts: 48
    shared_experts: 1
    top_k: 3
    intermediate: 5120
    first_k_dense: 4
    dense_intermediate: 18432
    routing: >-
      softmax 路由，**写死在参考实现里、没有任何可配项**：Step3vMoEMLP.forward 直接
      `F.softmax(router_logits, dim=1, dtype=torch.float)` 再 topk，然后把权重 cast 回输入 dtype。
      即打分恒在 FP32 里做（但不是靠 config 开关 —— 这一代没有 need_fp32_gate 这个字段），
      选中权重**不再归一化**（全 48 路 softmax 之后直接取 top-3，实现里没有 renormalize 这一步）。
      注意 **config 的 norm_expert_weight: false 并没有被实现读** ——
      modeling_step3.py 里这个名字 0 次出现（num_attention_groups 同样 0 次），
      行为与声明一致是巧合不是因果。
      没有 router_bias、没有 sigmoid 门、没有 routed scaling，三件都是下一代 Step-3.5 才加的。
      moe.gate.weight [48, 7168] 落盘 BF16
    balance: 无声明（config 里没有任何 aux-loss 或 bias 字段，权重里也没有 expert_bias / e_score_correction 一类张量）
    storage_note: >-
      堆叠存储：每层 moe.gate_proj / up_proj [48, 5120, 7168]、down_proj [48, 7168, 5120]，
      一个张量装一层全部 48 个专家，gate 与 up 分开不融合。共享专家叫 share_expert（单数），
      中间维 5120 与路由专家同宽。名字里没有 experts。
      48 取自 168 个堆叠张量的首维（穷举、0 例外），不取自 config.moe_num_experts ——
      derive.py 的 config 侧对账因键名不同被 skip，这一项不在 Gate B 的覆盖内

  decoding:
    mtp_layers: 0
    mtp_layers_note: >-
      config 没有 num_nextn_predict_layers，清单里也没有 eh_proj / enorm / hnorm / shared_head
      任何一类 MTP 胶水张量。主干层索引止于 60，本代没有 MTP ——
      它是下一代 Step-3.5-Flash 才有的。
      这份记录逼出过一个工具缺口：视觉塔有 **63 层**而语言主干只有 **61 层**
      （塔的张量名 vision_model.transformer.layers.N.* 和主干同形），于是塔的第 61、62 层
      被按层索引当成了主干之后的 MTP 层 —— `draft_blocks_seen` 报 2、
      `mtp_layers_seen` 报 [61, 62]，并让 24 个张量落进 draft 桶。
      **两处现已全部修掉**：`lib/subsystems.py` 新增 `is_tower()`，`classify()` 的层号捷径
      与 `derive.py` 的 layer_ids / mtp_layer_ids 统计都按它绕开塔，
      现在 `draft_blocks_seen: 0`、`mtp_layers_seen: []`、`layers_present` 仍是 61
      （见 params.counting_note 与 R5）。
      后代（Step-5-Preview / Step-3.7-Flash）本就免疫，只因为塔改叫 resblocks.N.

  vision:
    encoder: >-
      CLIP 式：带 class token（vision_model.embeddings.class_embedding [1, 1792]）
      与可学习位置表 [2705, 1792]，LayerNorm 与各投影都带 bias。以上实测自权重清单。
      参考实现把塔委托给 vision_encoder.py 的 StepCLIPVisionTransformer
      （modeling_step3.py 第 42 行只有 import），**那个文件本轮没下载、类体没读**；
      `step3_vision_encoder` 是 configuration_step3.py 里 Step3VisionEncoderConfig 的
      model_type **类属性**，不是仓内 config.json 的键（它的 vision_config 没有 model_type）
    layers: 63
    hidden: 1792
    num_heads: 16
    patch_size: 14
    intermediate: 15360
    out_hidden: 7168
    params: 4675374592.0
    fusion: >-
      QKV 融合成一个 [5376, 1792] 的投影（1792 × 3），注意力与 FFN 都带 bias，LayerNorm 带 bias
      —— 与下一代起用的 Perception Encoder（无 cls token、LayerScale、resblocks 命名）是两套不同的塔。
      两级卷积下采样：vit_downsampler [4096, 1792, 2, 2] 是 kernel 2、
      **stride 取自 config 的 understand_projector_stride（2）**；
      vit_downsampler2 [8192, 4096, 3, 3] 是 kernel 3、**stride 2 与 padding 1 都写死在实现里**
      （modeling_step3.py 第 686–698 行）—— 两级里只有第一级的 stride 可配。
      再经 vit_large_projector [7168, 8192] 投到主干宽度。
      **out_hidden 的 7168 不是 config 的 output_hidden_size**：那一项是 4096，
      是塔每 token 的输出宽度；两级下采样把通道推到 4096 → 8192，projector 才是
      Linear(output_hidden_size × 2 = 8192, text hidden = 7168)（第 700–704 行）。
      schema 的 out_hidden 问「投影到主干前的输出维度」，所以填 7168（实测自权重），
      但它与同名 config 键不是一个数 —— 照 config 读会把 projector 的出口当成 4096。
      token 数可以从这两行卷积推出来：位置表 2705 = 1 个 class token + 52²，
      52 →（k2, s2）→ 26 →（k3, s2, p1）→ 13，13² = **169** = config 的 image_token_len（全局视图）。
      另有 patch_token_len 81，而模型卡说多 patch 预处理默认开启，
      所以单图的 token 数是 169 + 81 × patch 数，**169 不是上限**，
      schema 的 max_image_tokens 因此不填。
      config 的 vision_config.intermediate_size 15360 与权重 mlp.fc1 [15360, 1792] 一致
      （注意 configuration_step3.py 里这一项的**默认值**写的是 3072，仓里的 config.json 覆盖成 15360，
      按默认值读会少算 5 倍）
    tokens:
      reference_resolution: 728x728
      patch_grid: 52x52
      encoder_tokens: 2705
      llm_tokens: 169
      compression_ratio: 16
      compression_stage: >-
        **两级跨步卷积，不是拼接式 merger** —— 这是本族系和另外十份的根本差别。
        vit_downsampler [4096, 1792, 2, 2] 是 kernel 2 / stride 2
        （stride 取自 config 的 understand_projector_stride 2）：52 → 26；
        vit_downsampler2 [8192, 4096, 3, 3] 是 kernel 3 / stride 2 / padding 1
        （两者都写死在 modeling_step3.py 第 686–698 行）：26 → 13。
        13² = 169。两级合计 2704 / 169 = **16:1，全批最高**
        （DeepSeek 两档 9、其余九份 4）。
        压缩全部在 vit_large_projector **之前**，所以那一层只跑 169 次；
        但**两级卷积自己的成本落在不同的 token 数上**：
        第一级跑 676 次（26² 个输出位置）、第二级跑 169 次 ——
        把两级都按 169 算会少算第一级 4 倍
      dynamic_resolution: false
      scope_note: >-
        **169 只是全局视图，不是「一张图」。** config 另有
        patch_token_len 81，而模型卡原文说多 patch 预处理默认开启
        （"multi-patch for image preprocessing is supported by default"），
        所以单图是 **169 + 81 × patch 数**（这正是 R3 删掉
        max_image_tokens 的理由）。
        上面 tokens 与下面 prefill 的每一格都**只覆盖全局视图那一路**，
        实际单图要按 patch 数加倍 —— 用它们做 prefill 预算会低估。
        81 背后的像素几何本轮没钉住（81 = 9²，但 9 反推到输入边长需要
        知道 crop 的尺寸，预处理器配置不在 facts/）。
        另外本档是**固定分辨率**（vision_config.image_size 728），
        位置表 [2705, 1792] = 1 个 cls + 52² 把它钉死了，
        所以**不能换算到本仓的 672×672 参考分辨率**——
        和另外十份比 token 数是范畴错误，要比只能比压缩比与塔开销占比
      derivation: >-
        因子：
        (1) 输入 728×728 —— config.vision_config.image_size；
        (2) patch 14 —— config.vision_config.patch_size，并由
        vision_model.embeddings.patch_embedding.weight [1792, 3, 14, 14]
        的后两维印证；
        (3) 728 / 14 = 52，52² = 2704，**加 1 个 cls token**
        （vision_model.embeddings.class_embedding [1, 1792]）= 2705，
        与位置表 vision_model.embeddings.position_embedding.weight
        [2705, 1792] 的行数逐位相同 —— 这一致性同时闭合了 (1)(2) 两项；
        (4) 两级卷积 52 →（k2, s2）→ 26 →（k3, s2, p1）→ 13，
        13² = 169 = config 的 image_token_len，逐位相同。
        cls token 进 encoder 堆叠（所以 encoder_tokens 填 2705），
        但不进卷积网格（卷积要 52×52 的方阵），所以它在下采样前被丢掉。
        **2705 对 2704 只差 0.037%**，对 FLOPs 结论无影响，
        这里填 2705 是为了和位置表对得上
    prefill:
      encoder_linear_gflops: 23146.5
      projector_linear_gflops: 161.61
      backbone_token_budget: 169
      backbone_linear_gflops_per_token: 73.99
      image_as_text_tokens: 484
      attention_excluded: >-
        被排除的是 encoder 自注意力的 QK^T 与 AV，形式
        4 × n² × hidden × layers。本档是固定分辨率，所以 n 至多 2705、
        不随输入变 —— 这是分析上的便利，别家动态分辨率没有。
        跨度没有一手来源：塔被委托给 vision_encoder.py 的
        StepCLIPVisionTransformer，而**那个文件至今没下载、类体没读**
        （见 arch.vision.encoder 与 R21）。
        按整图一段取 n = 2705 约 2705² × 4 × 1792 × 63 = 3.30 TFLOPs，
        是线性项 23.1 TFLOPs 的 14%。
        没有加进上面几格，因为主干那侧的分母也是线性项、不含注意力
      derivation: >-
        encoder 线性项 = 2 × 2705 × (patch_embedding 1,053,696 + 63 层 ×
        每层 67,895,296 = 4,277,403,648) = 2 × 2705 × 4,278,457,344
        = 23,146,454,231,040 ≈ 23.1 **T**FLOPs。
        每层 67,895,296 逐因子核过：qkv 3 × 1792² + o 1792² +
        fc1 15360 × 1792 + fc2 1792 × 15360，四项相加与清单里 252 个
        transformer.layers 线性张量的求和逐位相同。
        **这是 12 份里最大的 encoder 线性项，比第二位的 minimax-m3
        （2906.0 GFLOPs）还大 8 倍** —— 塔 63 层 × hidden 1792 × inter 15360，
        光塔就 4.3B 参数。
        projector 线性项按**各自的输出位置数**分三项算（见
        tokens.compression_stage）：
        2 × 676 × (4096 × 1792 × 2²) = 39.69 +
        2 × 169 × (8192 × 4096 × 3²) = 102.07 +
        2 × 169 × (7168 × 8192) = 19.85，合计 161.61 GFLOPs。
        主干分母 = 2 × (active_params.total 37,917,982,720 −
        active_params.lm_head 923,345,920) = 73,989,273,600 ——
        **不能用 derived 里的 flops.linear_per_token 75,835,965,440**，
        那一项含 lm_head（decode 口径）。
        换算 = 169 + 23,308,069,152,768 / 73,989,273,600 = 169 + 315.0 = 484
        （分子 = encoder 23,146,454,231,040 + projector 161,614,921,728）。
        **分母在 main 的 e394525 之后从 74.65 降到 73.99**（−0.89%）：
        两级 `vit_downsampler` 的 3.31 亿参数原先被 `subsystems.py` 归进
        `other`，而 `other` 在 `derive.py` 的常驻名单里 —— 等于把视觉塔的
        下采样算成了语言主干的激活权重。修正后它们进 `vision`、不计激活。
        换算值 481 → 484，占比 2.846 → 2.864，结论方向不变
        **这是 12 份里塔开销占比最高的一档**（484 / 169 = 2.86）：
        一张图的 prefill 成本有 **65% 花在视觉塔上**、只有 35% 在主干。
        根因是 16:1 压缩把主干位置预算压到了 169（全批最低），
        而买下这个预算的代价是一座 4.3B 参数、63 层的塔。
        **这是整批里 token 压缩比权衡最极端的一例**：
        和 kimi-k2.5（压缩比 4、主干 576 个 token、塔占 5.3%）比，
        主干位置少占 3.4 倍，塔的占比高 12 倍。
        所以本档是最该做 encoder 分离部署的一档之一
    separability:
      weight_prefix: >-
        vision_model.（760 个张量）、vit_downsampler / vit_downsampler2
        （各 2 个）与 vit_large_projector（1 个），共 765 个；
        主干在 model. / lm_head.。前缀不相交。
        注意三个 vit_* 是**顶层前缀**、不在 vision_model. 下 ——
        按单一前缀去筛会漏掉整条下采样链
      shard_isolation: mixed
      shard_note: >-
        实测 index 的 weight_map：765 个视觉张量**被切到两个分片，两片都混着主干**——
        model-00001 装 106 个（同片另有 103 个非视觉张量）、
        model-00002 装 659 个（同片另有 56 个）。
        没有纯视觉分片，而且塔本身跨了文件边界。
        **下一代 step-5-preview 彻底改了这件事**：那边有一个专门命名的
        model-vit-00001.safetensors，667 个视觉张量全在里面、
        非视觉张量 0 个，是本仓 12 份里唯一一个**用文件名就标出视觉塔**的发布
      cross_prefix_sharing: >-
        weight_map 的 1663 个名字里没有任何一个同时匹配四个视觉前缀与
        model. / lm_head.，即没有重名共享。落盘层面的 tied weights 要看
        safetensors 头的数据偏移是否重合，weight_map 答不了，本轮没读偏移

