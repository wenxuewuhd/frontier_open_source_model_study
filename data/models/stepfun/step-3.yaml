reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 本会话复算（逐条读厂商实现源码 + 穷举全量权重清单），再加两个独立代理分片对抗式复核
  method: >-
    按 .claude/skills/model-audit 的取数与提问顺序过一遍。元素数与参数量一律**穷举全量清单**
    （facts/step-3/shapes.json，89 个分片逐分片读头、1663 个张量），不用抽样产物。
    本会话独立复核的是：1663 条的 dtype 普查与 HF 的逐 dtype tally 逐位相同；
    61/61 层的 MFA 五个投影宽度；168 个堆叠专家张量的首维；5 个稠密层与 56 个 MoE 层的下标集合；
    KV 乘式的每个因子；视觉塔边界（实测总量减塔 = 316,294,538,240，对上模型卡的 316B，
    而总量对上 321B，两个声明值同时闭合）；
    以及**另起一轮 HTTP range 读全部 89 个分片的头、逐名计数**，确认跨文件重名张量 0 个。
    MFA 的投影次序、KV 头数写死成 1、softmax 路由、缓存精度来自直接读厂商 remote-code 实现
    （modeling_step3.py / configuration_step3.py，只读未执行），行号记在各条 finding 里；
    AFD 与部署拓扑的结论来自模型卡与 docs/deploy_guidance.md 的原文。
    **arXiv 2507.19427 本轮没读**，所以记录里没有任何依据论文内容的数字。
    Gate B：derive.py --model 0 处不一致（层数、参数总量、外部 tally 三项全 ok；
    路由专家数因 config 键名是 moe_num_experts 而被 skip，这一项不在覆盖内）
    **第二轮**：两个独立代理分片对抗式复核（一个只看注意力与缓存账、一个只看参数量 / MoE / 精度 / 平台 / 排除依据），各自从权重清单与厂商源码重新验、不看本会话的结论。本记录因此新增 R11–R21 十一条，
    其中 R18 把一条 open_question 解掉了（视觉塔的下采样链）。

review:
  - id: R23
    field: arch.vision.tokens.compression_ratio
    severity: missing
    claim: >-
      fusion 里已经有完整的 token 推导链（52 →(k2,s2)→ 26 →(k3,s2,p1)→ 13，
      13² = 169 = image_token_len），R3 也判过「169 不是单图上限」——
      但这些只活在一段散文里，没有可查的字段，infra 三组一格都没有
    finding: >-
      把 fusion 里那条链落成 tokens / prefill / separability 三组字段，
      逐因子核过，并补两件原来没算的事。
      (1) **两级卷积的成本落在不同的 token 数上。** 第一级
      vit_downsampler 跑 676 次（26² 个输出位置）、第二级跑 169 次，
      vit_large_projector 跑 169 次。三项分别是 39.69 / 102.07 / 19.85 GFLOPs。
      **把两级都按 169 算会少算第一级 4 倍** —— 这是跨步卷积式压缩
      特有的坑，拼接式 merger 没有（那种只有一个位置数）。
      (2) **塔开销占比是 12 份里最高的**：一张图（全局视图那一路）
      相当于 484 个文本 token（本条写时是 481，分母修正后见 R24），
      而它只占 169 个位置 —— prefill 成本 65% 花在视觉塔上、只有 35% 在主干。
      encoder 线性项 23.1 TFLOPs 是 12 份里最大的，
      比第二位 minimax-m3 的 2906.0 GFLOPs 还大 8 倍（塔 63 层 ×
      hidden 1792 × inter 15360，光塔 4.3B 参数）。
      **这是 token 压缩比权衡最极端的一例**：16:1 把主干位置预算压到 169
      （全批最低），代价是这座塔。和 kimi-k2.5（压缩比 4、576 个 token、
      塔占 5.3%）比，主干位置少占 3.4 倍、塔的占比高 12 倍。
      两处**口径护栏**写进了 scope_note：
      169 只是全局视图，单图是 169 + 81 × patch 数（R3 的结论），
      所以 prefill 那几格是全局视图一路的数、做预算会低估；
      以及本档是**固定分辨率**（image_size 728，位置表 [2705, 1792] =
      1 cls + 52² 钉死），**不能换算到本仓的 672×672 参考分辨率**——
      和另外十份比 token 数是范畴错误，只能比压缩比与占比。
      encoder_tokens 填 2705 而不是 2704：cls token 进 encoder 堆叠、
      不进卷积网格（卷积要 52×52 方阵），两者只差 0.037%，
      填 2705 是为了和位置表的行数对得上。
      分片是 mixed 且塔跨了文件边界（765 个视觉张量分在前两片、
      两片都混主干）；**下一代 step-5-preview 改成了一个专门命名的
      model-vit-00001.safetensors**，667 个视觉张量全在里面、非视觉 0 个 ——
