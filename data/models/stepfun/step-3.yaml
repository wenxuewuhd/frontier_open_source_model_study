    url: https://huggingface.co/stepfun-ai/step3
    locator: config.json / README.md @ e2d67fc936dc
    accessed: '2026-10-30'
    note: >-
      BF16 发布（另有 stepfun-ai/step3-fp8 量化变体，不另起记录）。89 个分片、1663 个张量，
      逐分片读头取全、无读失败分片，按名去重后 1663 = index 的 weight_map 条目数。
      模型卡给的规格表：61 层（含 5 个稠密层）、hidden 7168、注意力机制 MFA、
      低秩 query 维 2048、64 个 query 头、head_dim 256、48 专家 top-3 + 1 共享、
      65536 上下文、总参数 LLM 316B / VLM 321B、激活 38B
  - kind: repo
    url: https://huggingface.co/stepfun-ai/step3/tree/e2d67fc936dc60f8f606f2429728f1dea503e10d
    locator: modeling_step3.py（Step3vAttention / Step3vRMSNorm）、configuration_step3.py、docs/deploy_guidance.md
    accessed: '2026-10-30'
    note: >-
      厂商随仓发布的实现与部署指南，下载到本地只读、未执行。MFA 的投影次序、
      KV 头数、缓存精度、以及「AFD 未进开源部署路径」都从这里读
  - kind: paper
    url: https://arxiv.org/abs/2507.19427
    locator: Step3 System 论文（模型卡与部署指南都指向它作为 MFA / AFD 的出处）
    accessed: '2026-10-30'
    note: >-
      只作为 MFA / AFD 两个名词的官方出处引用。**论文本体本轮没读** ——
      本记录里凡与 AFD 有关的话都只依据模型卡与部署指南的原文，不依据论文内容

hf:
  repo: stepfun-ai/step3
  sha: e2d67fc936dc60f8f606f2429728f1dea503e10d
  last_modified: '2026-01-29T07:41:03.000Z'
  pipeline_tag: image-text-to-text
  gated: false

lineage:
  track: main
  predecessor: step-1
  successor: step-3.5-flash
  changed_from_predecessor:
    - axis: attention
      text: >-
        稠密 GQA（8 KV 组 × 128）换成 MFA：KV 只剩 **1 组 × 256**，而 query 侧做低秩分解
        hidden 7168 → q_proj [2048, 7168] → inter_norm [2048] → wq [16384, 2048] = 64 头 × 256。
        每层每 token 的 KV 元素从 2048 降到 512
      benefit: >-
        每 token KV 元素 180,224 → 31,232（元素口径，5.77 倍）。代价是 o_proj 入口宽到 16384
        （64 × 256），注意力权重本身从 28.79B 降到 10.33B 但单层投影更宽
    - axis: moe
      text: 88 层全稠密（FFN 31232）换成 61 层里 56 层 MoE：48 路由专家 top-3 + 1 共享专家（各 5120 中间维），稠密层只剩 L0–L3 与 L60
      benefit: 总参数 131.95B → 320.97B，而每 token 激活 131.03B → 37.92B（带宽口径）
    - axis: attention
      text: 位置编码从 ALiBi 式加性偏置换成 RoPE（rope_theta 500000，逐层同一套，无 partial rotary、无 rope_scaling）
    - axis: modality
      text: 加视觉塔：CLIP 式 63 层 / width 1792（带 class token 与可学习位置表），两级卷积下采样后经 vit_large_projector [7168, 8192] 投到主干
    - axis: context
      text: 32768 → 65536
    - axis: scale
      text: hidden 12288 → 7168、层数 88 → 61、词表 74752 → 128815（模型卡注明 tokenizer 用 DeepSeek V3 的）

params:
  total: 320969912832.0
  breakdown:
    expert: 295950090240.0
    attention: 10330046464.0
    shared_expert: 6165626880.0
    vision: 4675374592.0
    dense_ffn: 1981808640.0
    embed: 923345920.0
    lm_head: 923345920.0
    router: 19267584.0
    norm: 1006592.0
  counting_note: >-
    按 index 的 weight_map 全量清单（89 个分片、1663 个条目，逐分片读头取全）逐项统计，无读失败分片。
    全部 BF16，无 scale 张量、无打包容器，numel 即参数数。
    **与 HF 的 safetensors tally 320,969,912,832 逐位相同。**
    两侧口径都对上了厂商声明：实测总量 320.97B ≈ 模型卡「Total Parameters (VLM) 321B」；
    扣掉视觉塔（vision_model.* 与 vit_* 共 765 个张量、4,675,374,592）得 316,294,538,240
    ≈ 模型卡「Total Parameters (LLM) 316B」。两个声明值同时闭合，是视觉塔边界的独立确认。
    **breakdown 里的 vision 是修正值，不是 derive.py 当前的分桶**：lib/subsystems.py 有两处
    命中不到这一份（视觉塔 63 层 > 主干 61 层，使 classify 的 mtp_from 层号捷径把
    vision_model.transformer.layers.61/62 共 24 个张量判成 draft；vision 正则的 `vit\.`
    要求字面点号，漏掉 vit_downsampler / vit_downsampler2 共 4 个张量，落进 other）。
    于是 data/derived/step-3.json 里会显示 vision 4,208,158,720 + draft 135,853,568 +
    other 331,362,304，三者之和恰等于本记录的 vision 4,675,374,592。
    params.total 不受影响（分桶不改总和），Gate B 的参数总量与外部对账都是 0 差异。
    修法与行号写在交接笔记里，属仓库级改动，不在本记录内处理

context:
  max: 65536

arch:
  layers: 61
  hidden: 7168
  vocab: 128815
  norm: >-
    常规 RMSNorm，以 1 为中心（参考实现 Step3vRMSNorm），权重落盘 BF16。
    与前代 Step-1 同；后两代（Step-3.5 / Step-5）改成零中心 × (1 + w)
  norm_eps: 1.0e-05
  activation: >-
    SwiGLU，无截断：参考实现的 Step3vMLP.forward 与 Step3vMoEMLP.get_expert_output
    都是裸的 `down_proj(silu(gate_proj(x)) * up_proj(x))`，没有 clamp；
    config 里也没有 swiglu_limits / swiglu_limits_shared，那是下一代 Step-3.5 才有的字段
  position: >-
    RoPE，rope_theta 500000，**逐层同一套**：config 里 rope_theta 是单个标量不是数组，
    没有 partial_rotary_factors、没有 rope_scaling、没有 layer_types。
    参考实现对 query（wq 之后的 64 × 256）与 key（1 × 256）全旋转 256 维

  attention:
    type: MQA
    num_heads: 64
    num_kv_heads: 1
    head_dim: 256
    v_head_dim: 256
    q_lora_rank: 2048
    head_dim_note: >-
      **MFA（Multi-Matrix Factorization Attention，模型卡原文）的落盘形状，逐层穷举 0 例外（61/61）**：
      q_proj [2048, 7168] 是**降维**（hidden → share_q_dim 2048）、
      wq [16384, 2048] 是**升维**（2048 → 64 头 × 256）—— 名字与直觉相反，
      按「q_proj 就是 query 投影」读会把 64 头 × 256 错当成 2048。
      两者之间是 inter_norm [2048]（RMSNorm，作用在低秩 latent 上）。
      k_proj / v_proj 都是 [256, 7168]，即 **1 个 KV 组 × 256**，不是 num_attention_groups × head_dim；
      o_proj [7168, 16384] 入口是 64 × 256。QK 与 V 每头都是 256。
      写缓存的 K 是 k_proj 的输出（RoPE 之后），256 维；没有 q_norm / k_norm、没有输出门。
      注意 **config 的 num_attention_groups: 1 并没有被实现读** ——
      参考实现 Step3vAttention 把 self.num_key_value_heads 写死成 1，
      config 那一项改成别的值也不会改变形状
    layer_pattern: >-
      61 层全部同一种注意力：无滑窗、无稀疏、无跨层共享，投影形状完全相同（61 层一个签名）。
      config 里没有 layer_types。作用域：本代 —— 下一代 Step-3.5-Flash 就按 1:3 分了两型
    kv_sharing:
      layer_coverage: >-
        61 层**全部**产出随上下文线性增长的全量 K/V，没有每序列固定的分量。
        与前代 Step-1 一样只有一个分量，但条目宽度从 2048 降到 512

  ffn:
    type: moe
    intermediate: 18432
    layer_pattern: >-
      L0–L3 与 **L60** 稠密（mlp.gate_proj [18432, 7168]），L4–L59 共 56 层 MoE
      （config moe_layers_enum，权重侧 56 个 moe.* 与 5 个 mlp.* 逐一吻合）。
      模型卡的「Number of Dense Layers 5」指的就是这 5 层。
      **主干最后一层不是 MoE** —— 按 first_k_dense 4 推「其余都是 MoE」会多算一层 48 专家，
      derive.py 的 EP 通信量正是这么算的（57 层而非 56），差一层

  moe:
    routed_experts: 48
    shared_experts: 1
    top_k: 3
    intermediate: 5120
    first_k_dense: 4
    dense_intermediate: 18432
    routing: >-
      softmax 路由，**写死在参考实现里、没有任何可配项**：Step3vMoEMLP.forward 直接
      `F.softmax(router_logits, dim=1, dtype=torch.float)` 再 topk，然后把权重 cast 回输入 dtype。
      即打分恒在 FP32 里做（但不是靠 config 开关 —— 这一代没有 need_fp32_gate 这个字段），
      选中权重**不再归一化**（全 48 路 softmax 之后直接取 top-3，实现里没有 renormalize 这一步）。
      注意 **config 的 norm_expert_weight: false 并没有被实现读** ——
      modeling_step3.py 里这个名字 0 次出现（num_attention_groups 同样 0 次），
      行为与声明一致是巧合不是因果。
      没有 router_bias、没有 sigmoid 门、没有 routed scaling，三件都是下一代 Step-3.5 才加的。
      moe.gate.weight [48, 7168] 落盘 BF16
    balance: 无声明（config 里没有任何 aux-loss 或 bias 字段，权重里也没有 expert_bias / e_score_correction 一类张量）
    storage_note: >-
      堆叠存储：每层 moe.gate_proj / up_proj [48, 5120, 7168]、down_proj [48, 7168, 5120]，
      一个张量装一层全部 48 个专家，gate 与 up 分开不融合。共享专家叫 share_expert（单数），
      中间维 5120 与路由专家同宽。名字里没有 experts。
      48 取自 168 个堆叠张量的首维（穷举、0 例外），不取自 config.moe_num_experts ——
      derive.py 的 config 侧对账因键名不同被 skip，这一项不在 Gate B 的覆盖内

  decoding:
    mtp_layers: 0
    mtp_layers_note: >-
      config 没有 num_nextn_predict_layers，清单里也没有 eh_proj / enorm / hnorm / shared_head
      任何一类 MTP 胶水张量。主干层索引止于 60。
      **derived JSON 里的 mtp_layers_seen [61, 62] 与 draft_blocks_seen 2 是假阳性** ——
      那是视觉塔第 61、62 层被 classify 的层号捷径误判（见 params.counting_note）。
      MTP 是下一代 Step-3.5-Flash 才有的

  vision:
    encoder: CLIP 式（参考实现 StepCLIPVisionTransformer，config model_type step3_vision_encoder），带 class token 与可学习位置表 [2705, 1792]
    layers: 63
    hidden: 1792
    num_heads: 16
    patch_size: 14
    intermediate: 15360
    out_hidden: 7168
    params: 4675374592.0
    fusion: >-
      QKV 融合成一个 [5376, 1792] 的投影（1792 × 3），注意力与 FFN 都带 bias，LayerNorm 带 bias
      —— 与下一代起用的 Perception Encoder（无 cls token、LayerScale、resblocks 命名）是两套不同的塔。
      两级卷积下采样 vit_downsampler [4096, 1792, 2, 2]（2×2）→ vit_downsampler2 [8192, 4096, 3, 3]（3×3），
      再经 vit_large_projector [7168, 8192] 投到主干宽度。
      token 数：config 的 image_token_len 169（全局视图）、patch_token_len 81、
      understand_projector_stride 2；模型卡说多 patch 预处理默认开启，
      所以单图的 token 数是 169 + 81 × patch 数，**169 不是上限**，
      schema 的 max_image_tokens 因此不填。
      config 的 vision_config.intermediate_size 15360 与权重 mlp.fc1 [15360, 1792] 一致
      （注意 configuration_step3.py 里这一项的**默认值**写的是 3072，仓里的 config.json 覆盖成 15360，
      按默认值读会少算 5 倍）

precision:
  weights_release: [BF16]
  kv_cache: BF16
  kv_cache_components:
    global_kv:
      dtype: BF16
      note: 无 scale 张量
    source: >-
      读参考实现（二手于部署 kernel）：Step3vAttention 把 RoPE 之后的 key_states / value_states
      交给 past_key_value.update()，用的是 transformers 的 DynamicCache —— 原样保留传入 dtype，
      而 q/k/v 投影权重全是 BF16、路径上没有量化或 cast。参考实现里缓存精度不可配置。
      模型卡的 Transformers 用法一节原文「We currently only support bf16 inference」
  quantization:
    per_subsystem:
      expert: BF16
      shared_expert: BF16
      attention: BF16
      dense_ffn: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      vision: BF16
    subsystem_method: >-
      全量清单穷举（1663/1663 个张量），不是抽样：**单一 dtype**，1663 个条目全部 BF16，
      没有 FP32、没有 FP8、没有 scale。norm 与 router 也是 BF16。
      仓里另有 stepfun-ai/step3-fp8 是 FP8 量化变体，本记录不覆盖它

platforms:
  - engine: vLLM
    hardware: NVIDIA
    status: supported
    precision: BF16
    parallel: TP16 或 DP16/TP1
    caveat: >-
      需要 nightly（部署指南点名 vllm-project/vllm#21998 合入之后的版本）。
      BF16 版约需 642 GB 显存、最小部署单元 16×H20；FP8 版约 326 GB、8×H20。
      部署指南原文：「Step3 only has single kv head, so attention data parallelism can be
      adopted to reduce the kv cache memory usage」—— 即推荐 DP16/TP1 而不是 TP16
    ref:
      kind: doc
      url: https://huggingface.co/stepfun-ai/step3/blob/e2d67fc936dc60f8f606f2429728f1dea503e10d/docs/deploy_guidance.md
    visibility: public
  - engine: SGLang
    hardware: NVIDIA
    status: supported
    precision: BF16
    parallel: TP16
    ref:
      kind: doc
      url: https://huggingface.co/stepfun-ai/step3/blob/e2d67fc936dc60f8f606f2429728f1dea503e10d/docs/deploy_guidance.md
    visibility: public
  - engine: TensorRT-LLM
    hardware: NVIDIA
    status: unknown
    caveat: 部署指南里这一节只写了「Coming soon...」
    ref:
      kind: doc
      url: https://huggingface.co/stepfun-ai/step3/blob/e2d67fc936dc60f8f606f2429728f1dea503e10d/docs/deploy_guidance.md
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      MFA 把 KV 压到每层 1 组 × 256：61 层全部产出全量 K/V、无滑窗无稀疏，
      但单层条目只有 512 个元素。这一族四代里，这是唯一一代把 KV 组数压到 1 的
    quantified: >-
      元素口径逐因子：每层 2（K 与 V）× 1 组 × 256（k_proj / v_proj 输出维，61/61 层穷举一致）
      = 512 元素，× 61 层 = **31,232 元素/token**，无每序列固定分量。
      按参考实现的 BF16 折算 62,464 B/token，65536 上下文满长度 3.81 GiB/序列
      （单份逻辑 KV 的下限，不含分页与对齐粒度）。
      同口径对照：前代 Step-1 180,224（5.77 倍）、后代 Step-3.5-Flash 24,576、
      Step-5-Preview 36,064 元素/token
    visibility: public
  - dimension: tp-comm
    finding: >-
      只有 1 个 KV 组，TP 切不开它 —— TP=N 的每个 rank 都得持一整份全局 KV，整机 N 倍。
      厂商部署指南因此推荐 attention 侧走 DP（DP16/TP1）而不是 TP16。
      这是 Step-5-Preview 那条「TP=8 而 KV 组只有 4 → 整机 2×」的极端形态：
      组数降到 1，复制倍数就等于 TP 度数
    quantified: >-
      按 TP16 布局，31,232 元素/token 的逻辑 KV 在整机上是 16 份：
      约 999,424 B/token、65536 上下文 61.0 GiB。改 DP16/TP1 后每个 rank 只持自己那批序列的
      一份，整机不复制。复制倍数来自并行布局，不被「理论下限不含分页粒度」那条免责覆盖
    fix: 按部署指南走 DP+TP（DP16/TP1）而不是纯 TP
    visibility: public
  - dimension: operator-gap
    finding: >-
      MFA 的 query 路径是「降维 → RMSNorm → 升维」三段，比常规 q_proj 多一次 GEMM
      和一次归一化，而且 norm 作用在 2048 维的 latent 上（不是逐头）。
      按「q_proj 输出就是 64 头 × 256」实现的融合 QKV 算子在这里对不上：
      q_proj 的输出是 2048，中间还夹着一个 norm，三段不能并成一个 GEMM
    visibility: public

infra_signals:
  - text: >-
      MFA 是这一族唯一一次把 KV 组压到 1 的尝试，而且没有延续：下一代 Step-3.5-Flash
      回到 8 组 × 128，Step-5-Preview 用 4 组 × 192。单组的代价是 TP 切不开缓存、
      必须改走 DP attention，部署拓扑被结构绑死 —— 这大概是它没被继承的原因之一，
      但厂商没有公开说明，这一句是判断
    evidence: judgement
    horizon: settled
    axis: attention
  - text: >-
      AFD（Attention-FFN Disaggregation）在模型卡里与 MFA 并列为「co-design」的两半，
      但**开源侧拿不到它**：部署指南原文说只提供 TP 与 DP+TP，AFD「仍在与开源社区联合开发中」。
      即注意力与 FFN 分开部署这件事在这一代只是论文与闭源推理栈里的事实，
      公开权重配开源引擎复现不出来 —— 跟踪这条路线要盯引擎侧的 PR，不是模型仓
    evidence: official
    horizon: watch
    axis: attention
  - text: >-
      一个 321B 模型只用 48 个专家 top-3、中间维 5120（粗粒度），而下一代直接跳到
      288 专家 top-8、中间维 1280（细粒度）。同一家在半年内从粗粒度切到细粒度，
      grouped GEMM 的形状从 [48, 5120, 7168] 变成 [288, 1280, 4096] ——
      专家数涨 6 倍、单专家窄 4 倍，算子的 tile 选择与 EP 切分策略要重做
    evidence: derived
    horizon: settled
    axis: moe

