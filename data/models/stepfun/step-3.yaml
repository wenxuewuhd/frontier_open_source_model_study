  - id: R24
    field: arch.vision.params
    severity: miscategorized
    claim: >-
      arch.vision.params 4,675,374,592（本记录早先实测自权重清单）
    finding: >-
      **这个数现在有三路独立闭合，而且刚刚接住了一个 derive.py 侧的归类错。**
      本轮（R23）为算 encoder FLOPs 重做了视觉张量的分区，
      按 shapes.json 求和得 encoder 4,285,292,032 + projector 390,082,560
      = 4,675,374,592，与 YAML 里原有的值逐位相同 —— 这是第二路。
      而当时 `data/derived/step-3.json` 的
      `params_by_subsystem.vision` 是 **4,208,158,720**，少 4.67 亿，
      同时凭空多出 `draft` 1.36 亿与 `other` 3.31 亿两个桶 ——
      **本记录是一个没有 MTP 的模型，draft 桶本不该存在。**
      main 的 e394525 查清了根因（两处）：
      (1) `vision` 正则是 `vit\\.`，认不出 Step-3 裸的 `vit_downsampler` /
      `vit_downsampler2`（4 个张量、331,362,304 参数），它们落进了 `other`；
      (2) 层号捷径把塔自己的 `layers.N.` 判成 `draft` —— 本代塔有 **63 层**
      而语言主干只有 **61 层**，于是塔的第 61、62 层共 24 个张量被判成草稿块。
      修正后 `vision` 升到 4,675,374,592、`draft` 与 `other` 双双归零，
      与 YAML 和本轮的分区三方一致。
      **第三路是厂商声明**：总量 320,969,912,832 − 4,675,374,592
      = 316,294,538,240，对上模型卡的「Total Parameters (LLM) 316B」，
      而总量对上「Total Parameters (VLM) 321B」——
      两个公布值同时闭合，这一路完全不依赖本仓代码。
      **顺带被纠正的还有 prefill 的主干分母**：`other` 在 `derive.py` 的
      常驻名单里，所以那 3.31 亿下采样参数原先被算成语言主干的激活权重，
      分母虚高 0.89%（74.65 对 73.99）。见 R23 改后的 derivation。
      记一条方法上的话：本轮做 encoder 参数量时**没有去读 derived JSON 的
      vision 桶、而是自己从 shapes.json 重分区**，所以两边的差额才暴露出来。
      如果当时图省事引了那个桶，encoder FLOPs 会跟着少算 4.67 亿参数的塔，
      而 YAML 里那个正确的 params 就成了孤证、没人会发现它和 derived 不一致
    resolution: confirmed
    changed_to: >-
      params 原值成立、不改。prefill 的 backbone_linear_gflops_per_token
      74.65 → 73.99、image_as_text_tokens 481 → 484（占比 2.846 → 2.864，
      方向不变），derivation 里写明分母修正的根因
notes: >-
  这一族第一个 MoE、也是唯一一代用 MFA 的。model_type step3_vl，
  architectures Step3VLForConditionalGeneration。
  层数、层集合、投影宽度、专家堆叠形状、单一 dtype 对照完整权重清单穷举核过；
  视觉塔边界由「总量 321B / 扣塔 316B」两个声明值同时闭合独立确认。
  MFA 的投影次序、KV 头数写死成 1、缓存精度来自厂商随仓的 remote-code 实现，不是部署 kernel。
  top_k 3、rope_theta 500000、norm_expert_weight false、understand_projector_stride 2
  这类运行期标量只有 config 一个来源。
  **AFD 不在开源部署路径里**（见 infra_signals 第二条），本记录没有任何依据 AFD 的数字。
  arXiv 2507.19427 只当作 MFA / AFD 两个名词的出处引用，论文本体本轮没读。
  另有 stepfun-ai/step3-fp8 量化变体，本记录只覆盖 BF16 这个仓。
  **同期两个名字像阶跃、主干却不是阶跃结构的仓不另起记录**，依据记在这里免得只活在会话笔记里：
  Step3-VL-10B / -Base / -FP8（2026-01）的 text_config.architectures 是
  ["Qwen3ForCausalLM"]、model_type qwen3，36 层 / 4096 / 32 Q / 8 KV / vocab 151936
  即 Qwen3-8B 规格，1066 个张量里没有任何阶跃特征张量（它的 667 个视觉塔张量名
  与 Step-3.7-Flash 的同集合 —— PE 塔最早是在那一份上公开的）；
  Step-Audio-2-mini / -Base / -Think（2025-08 起）model_type step_audio_2，
  文本侧 28 层 / 3584 / 28 Q / 4 KV / inter 18944 / vocab 158720 即 Qwen2.5-7B 规格

open_questions:
  - >-
    **KV 缓存精度没有任何厂商来源。** 模型卡那句「We currently only support bf16 inference」
    讲的是推理与权重精度（下一句是「This behavior is aligned with vllm and sglang」），
    不是缓存精度；部署指南给的 vLLM / SGLang 命令都不设 --kv-cache-dtype。
    可读的参考实现里没有带格式的缓存分配（第 607 行唯一的 DynamicCache、无 dtype 形参），
    追数据流只能确认 RoPE 之后的 K/V 是 BF16、路径上不量化 —— 那是激活 dtype 不是落盘格式。
    所以 precision.kv_cache 不填、bytes_basis 留 `dtype_fallback`，字节列只当占位值
  - >-
    MFA 的 latent 维 2048 只作用在 query 上 —— K 与 V 各自从 hidden 直接投到 256，
    没有 latent、没有上投影。这是「低秩 Q + MQA」的组合，与 MLA 的「低秩 KV + 上投影」
    是两件不同的事，本记录按 MQA + q_lora_rank 记。厂商用 MFA 这个名字把两者都概括进去了，
    论文里 MFA 的完整定义本轮没核（论文未读）
  - >-
    AFD 的具体切分方式（注意力与 FFN 各占多少设备、两段之间传什么、每 token 多少字节）
    全在论文与闭源栈里，开源部署指南明确说不提供。本记录不写任何 AFD 的量化数字
  - >-
    厂商「38B 激活」与本仓带宽口径 37.92B（= 常驻 19.42B + 专家 18.50B）相符到 0.2%，
    但厂商口径没写是否含 lm_head 与输入词表（含输入词表是 38.84B）
  - >-
    训练精度无一手声明，precision.training 不填
  - >-
    （**已解掉，见 R18**）视觉塔的 2705 个位置与 image_token_len 169 之间的下采样链已逐步核对：
    52 →（kernel 2, stride 2）→ 26 →（kernel 3, stride 2, padding 1）→ 13，13² = 169。
    两级里只有第一级的 stride 取自 config 的 understand_projector_stride，
    第二级的 stride 2 与 padding 1 写死在 modeling_step3.py 第 692–698 行。
    结论搬进 arch.vision.fusion
