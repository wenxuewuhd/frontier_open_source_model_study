bottlenecks:
  - dimension: kv-capacity
    finding: >-
      MFA 把 KV 压到每层 1 组 × 256：61 层全部产出全量 K/V、无滑窗无稀疏，
      但单层条目只有 512 个元素。这一族四代里，这是唯一一代把 KV 组数压到 1 的
    quantified: >-
      元素口径逐因子：每层 2（K 与 V）× 1 组 × 256（k_proj / v_proj 输出维，61/61 层穷举一致）
      = 512 元素，× 61 层 = **31,232 元素/token**，无每序列固定分量。
      按 BF16 折算 62,464 B/token，65536 上下文满长度 3.81 GiB/序列。
      **字节那一列的口径是 `dtype_fallback`（按模型权重 dtype 兜底）**：
      厂商没有一处说过 KV 缓存精度 —— 模型卡那句「We currently only support bf16 inference」
      在 Transformers 用法一节里、下一句是「This behavior is aligned with vllm and sglang」，
      讲的是推理与权重精度，不是缓存；部署指南也只给引擎命令、不设 --kv-cache-dtype。
      可读的参考实现里又没有带格式的缓存分配（第 607 行唯一的 DynamicCache、无 dtype 形参），
      所以 basis 老实留兜底，**字节这一列不与任何别代比**。
      跨代比**只用元素那一列**：前代 Step-1 180,224（5.77 倍）、
      后代 Step-3.5-Flash 24,576、Step-5-Preview 36,064 元素/token。
      比之前先对齐账的形状：本代与 Step-1 只有一个分量，后两代是混合结构，
      那两个数**只是它们随上下文增长的那一个分量**，各自另有每序列固定的
      34,603,008 与 54,263,808 元素（Step-5 的 36,064 里还含 736 个按 1/8 摊的 FP8 区域摘要）
    visibility: public
  - dimension: kv-capacity
    finding: >-
      只有 1 个 KV 组，TP 切不开它 —— TP=N 的每个 rank 都得持一整份全局 KV，整机 N 倍。
      这是 Step-5-Preview 那条「TP=8 而 KV 组只有 4 → 整机 2×」的极端形态：
      组数降到 1，复制倍数就等于 TP 度数。
      厂商部署指南对此只说 attention 侧**可以**走 DP 来降 KV 显存（原文 can be adopted）；
      TP 与 DP+TP 在文档里是同一个最小部署单元下的两个并列选项，**没有表达偏好**。
      这一条记在 kv-capacity 而不是 tp-comm：内容与数字全是复制之后的**容量**，没有通信量
    quantified: >-
      按 TP16 布局（部署指南给的 BF16 最小部署单元就是 16×H20、约 642 GB），
      31,232 元素/token 的逻辑 KV 在整机上是 16 份：约 999,424 B/token、65536 上下文 61.0 GiB。
      改 DP16/TP1 后每个 rank 只持自己那批序列的一份，整机不复制。
      复制倍数来自并行布局，与分页粒度无关 —— 上面那条「字节口径是 declared_dtype」
      的说明也盖不住它（skill 规则 8：免责只免掉它点名的那件事）
    fix: 想避开这个倍数就把 attention 侧改成 DP（DP16/TP1）；文档把它列为可选，不是推荐
    visibility: public
  - dimension: operator-gap
    finding: >-
      MFA 的 query 路径是「降维 → RMSNorm → 升维」三段，比常规 q_proj 多一次 GEMM
      和一次归一化，而且 norm 作用在 2048 维的 latent 上（不是逐头）。
      按「q_proj 输出就是 64 头 × 256」实现的融合 QKV 算子在这里对不上：
      q_proj 的输出是 2048，中间还夹着一个 norm，三段不能并成一个 GEMM
    visibility: public

infra_signals:
  - text: >-
      MFA 是这一族唯一一次把 KV 组压到 1 的尝试，而且没有延续：下一代 Step-3.5-Flash
      回到 8 组 × 128，Step-5-Preview 用 4 组 × 192。单组的代价是 TP 切不开缓存、
      必须改走 DP attention，部署拓扑被结构绑死 —— 这大概是它没被继承的原因之一，
      但厂商没有公开说明，这一句是判断
    evidence: judgement
    horizon: settled
    axis: attention
  - text: >-
      AFD（Attention-FFN Disaggregation）在模型卡里与 MFA 并列为「co-design」的两半，
      但**开源侧拿不到它**：部署指南原文说只提供 TP 与 DP+TP，AFD「仍在与开源社区联合开发中」。
      即注意力与 FFN 分开部署这件事在这一代只是论文与闭源推理栈里的事实，
      公开权重配开源引擎复现不出来 —— 跟踪这条路线要盯引擎侧的 PR，不是模型仓
    evidence: official
    horizon: watch
    axis: attention
  - text: >-
      一个 321B 模型只用 48 个专家 top-3、中间维 5120（粗粒度），而下一代直接跳到
      288 专家 top-8、中间维 1280（细粒度）。同一家在半年内从粗粒度切到细粒度，
      grouped GEMM 的形状从 [48, 5120, 7168] 变成 [288, 1280, 4096] ——
      专家数涨 6 倍、单专家窄 4 倍，算子的 tile 选择与 EP 切分策略要重做
    evidence: derived
    horizon: settled
    axis: moe

