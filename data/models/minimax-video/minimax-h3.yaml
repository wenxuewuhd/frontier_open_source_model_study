reviewed:
  date: '2026-10-30'
  method: >-
    Gate B 三路：组件 config（17 份）、权重清单（按组件分开读 32 个分片头）、
    厂商可复现脚本 + 其官方输出样片的 moov。
    结构字段三路一致：patch (1,2,2) 既在 `transformer/config.json`、
    也在 `proj_in.weight [5376, 96]` 的 96 = 24×1×2×2 里；
    hidden 5376 / layers 50 / ffn 14336 / in_channels 24 / audio_in_channels 32 /
    text_dim 5120 五项 config 与清单逐项对上；
    VAE 的 16× / 4× 在卡、`vae/config.json` 的两个 downsample 数组连乘、
    `source/config.json` 的 `vae_ratio` / `vae_ratio_t` 三处一致。
    字节对账：四个组件的实测 numel×bpe 与各自 index.json 的 total_size **逐字相同**。
    卡的「约 13B 在 AdaLN」逐张量验到 13,055,204,736（占 39.41%）。
    另用 HF tree API 的 LFS sha256 做了布局去重判定（R1 / R2）。
    Gate C：判断类字段 6 处，逐条在 evidence 里标了 judgement。

review:
  - id: R1
    field: generation.checkpoint_variants
    severity: wrong
    claim: >-
      「Ref2VA 侧要同时驻留 transformer 与 transformer_ref 两套 33B，
      加上文本编码器与 VAE 共约 104B / 137 GB」—— 这是本线 Gate A 文档
      （docs/video-gen-gate-a.md §4.1）写下的结论
    finding: >-
      **错的，是把 diffusers 的模块化布局读成了「一次推理要两套」。**
      三条证据：(1) `FL2VA/model_index.json` 与 `Ref2VA/model_index.json` 各自带
      `_minimax_h3.partition: fl2va` / `ref2va`，`tasks` 分别是 ["t2va","fl2va"] 与 ["ref2va"]；
      (2) 两份自包含 checkpoint 下**各只有一个 transformer 目录**；
      (3) 卡说「released as two task-specific checkpoints」，sglang 启动参数是
      `--model-variant fl2va` 或 `ref2va`，一次只起一个。
      顶层 diffusers 把两者并列成 transformer + transformer_ref，是让一个
      ModularPipeline 能切任务，不是一次推理要同时加载
    resolution: corrected
    changed_to: >-
      两套都进 checkpoint_variants，FL2VA 那套 `resident: true`、
      Ref2VA 那套 `resident: false`。常驻账改为 69.24B / 134.13 GiB（四块），
      不是 104B / 137 GB。**Gate A 文档里那段需要同步更正**（见 open_questions）
  - id: R2
    field: params.counting_note
    severity: wrong
    claim: 把全仓 104 个分片合并成一份清单就能统计参数量
    finding: >-
      不能。`fetch_hf.py` 全仓取数得到 4421 个唯一张量名、并报了
      「6183 个张量在多个分片里有相同副本」。根因是仓里**两套并列布局**：
      同一个 DiT 在 diffusers 布局下叫 `transformer_blocks.N.*`（638 条）、
      在原始布局下叫 `blocks.N.*`（535 条），**合并后同一个模型被按两套命名各算一遍**；
      而 FL2VA 与 Ref2VA 的 DiT 张量名完全相同，合并时又被折成一份 ——
      两个不同权重的模型只剩一个。LFS sha256 比对坐实了后者：
      `FL2VA/transformer` 与 `Ref2VA/transformer` 13 个分片 **oid 无一重合**，
      而 `FL2VA/text_encoder` 与顶层 `text_encoder/` 14 个 oid **两两相同**
    resolution: corrected
    changed_to: >-
      按组件分开量，params 只取 diffusers 顶层 `transformer/`。
      facts/minimax-h3/shapes.json 是全仓合并的结果，**本记录没有用它**
  - id: R3
    field: generation.buckets
    severity: wrong
    claim: 时间因果 VAE 的 latent 帧数是 (F−1)/4+1，默认档 243 帧对应 61.5 帧 latent
    finding: >-
      **公式不对，真值也不在 61 与 62 之间，是 72。** 上一版把这条留成 open，
      说「正确的公式拿不到」—— 拿得到：厂商把 VAE 实现随仓发在
      `FL2VA/video_vae/klvae.py`，时间维算术整段都在里面。

      `setup_forward` 定了四个量：`tokens_chunk_size = ceil(17/4) = 5`、
      `frame_pre_padding = (−17) mod 4 = 3`、`token_overlap = (−3) mod 5 = 2`、
      `frame_overlap = max(2×4 − 3, 0) = 5`。
      `encode_temporal` 把帧数补齐到 17 的整数倍、每 17 帧一块各出 5 个 token，
      最后整体丢掉 `token_drop` 个：**T = ceil(F/17) × 5 − 3**。
      `decode_temporal` 反过来：`num_chunks = (T+3)/5 − 1`，每块输出
      `chunk_dec(20) − frame_pre_padding(3) = 17` 帧，末尾再补上 5 帧的 overlap 尾：
      **F = 17·C − 12，其中 C = (T+3)/5**。

      所以帧数的合法集合是 **F ≡ 5 (mod 17)**，而不是 4n+1。
      仓里 **14 个官方样片逐个验过，14/14 全部满足**，且 C = (F+12)/17 个个是整数：
      243 / 192 / 124 三种帧长，C 分别是 15 / 12 / 8，latent 帧数 **72 / 57 / 37**。

      **端到端的有效时间压缩率因此是 3.375 而不是 4**（243/72）。
      卡上那个「temporal compression factor of 4×」说的是块内卷积比 ——
      17 帧先补 3 帧到 20 再除以 4 得 5 —— 不是整段帧数与 token 数的比值。
      这正是本仓「不同口径之间不算倍数」的一个实例：
      `vae_ratio_t` 是模块参数，端到端比值是另一个量
    resolution: corrected
    changed_to: >-
      `constraints.frame_formula` 从留空改成 **17n+5**（n = C−1）；
      默认档的 note 写明 C=15、latent 帧数 72；vae.note 写明两个口径的差别。
      `causal: true` 与 `temporal_compression: 4` 都保留 —— 它们照
      `causal_encoder: true` 与 `vae_ratio_t: 4` 填，是一手事实，不该为了迁就
      端到端比值去改。**但 derive 现在算不出 72**，见 R6
  - id: R6
    field: '-'
    severity: wrong
    claim: >-
      `data/derived/minimax-h3.json` 里的 latent token 数 61,992、序列 62,397、
      单步 FLOPs 8.320e15 是对的
    finding: >-
      **都偏低。** `derive.py` 的 `gen_workload()` 只会按
      `causal` + `temporal_compression` 套 (F−1)/t+1 或 F/t，
      而 H3 的真实映射是分块的（R3），一个除数表达不了 ——
      三个档位的实际比值分别是 3.375 / 3.368 / 3.351，连常数都不是。

      按 R3 的真值重算：latent 帧数 72（不是 61.5），
      latent token 72 × 24 × 42 = **72,576**（derive 给 61,992，低 **17.1%**）；
      加音频 405 后序列 **72,981**；
      单步线性 2 × 33,122,992,896 × 72,981 = **4.835e15**；
      单步注意力 4 × 50 × 5376 × 72,981² = **5.727e15**；
      单步合计 **1.056e16**（derive 给 8.320e15，低 **26.9%**），
      注意力占比 **54.2%**（derive 给 50.3%）。
      注意力那一项是 O(n²)，所以 token 数低 17% 会让它低 31%。

      `derive.py` 与 `data/schema/` 是共享文件，本记录不改它们
    resolution: open
    changed_to: >-
      记录正文里的数按真值写（R3 与 notes），**derived JSON 暂时仍是偏低的那组**。
      建议的共享改法：让 `generation.buckets[]` 支持声明 `latent_frames`，
      `gen_workload()` 有声明就用声明值、没有才套公式 ——
      这对别的 family 同样有用（LTX 的 8n+1、Wan 与 HunyuanVideo-1.5 的 4n+1
      各有各的规矩）。已报给主会话
  - id: R4
    field: generation.vae.params
    severity: wrong
    claim: 「VAE 约 5.2B」—— Gate A §4.1 按 10.42 GB ÷ 2 B（BF16）估的
    finding: >-
      VAE 的 703 条张量**全是 F32**，不是 BF16。实测 2,603,868,984 参数。
      按 BF16 估会高一倍。这正是 model-audit 规则「config 与权重冲突时权重赢」的
      同一类问题 —— 这里连 config 都没说 dtype，是凭文件大小猜的
    resolution: corrected
    changed_to: generation.vae.params 填实测的 2,603,868,984，并在 precision 里记下两个 VAE 整体 F32
  - id: R5
    field: generation.sampling.steps
    severity: missing
    claim: 默认采样步数应该能填
    finding: >-
      填不了。模型卡没有，厂商可复现脚本的请求体也没有（只有 short_edge /
      aspect_ratio / duration_seconds，步数在服务端）。
      引擎文档（sglang cookbook）给 50，社区蒸馏 LoRA 做到 8 / 4 步 ——
      按本仓来源优先级前者是第四档、后者是第三方，都不足以进字段。
      **后果是端到端 FLOPs 在这份记录里算不出来**，`derive.py` 会明说缺这一项
    resolution: open
    changed_to: 留空并在 sampling.note 与 open_questions 写明是哪一种空

notes: >-
  **字节对账。** 四个组件的实测 numel × 每元素字节与各自 index.json 的
  `total_size` 逐字相同（audio_vae 是单文件无 index，直接读头）：
  transformer 66,280,430,080；text_encoder 66,714,780,128；vae 10,415,475,936；
  audio_vae 605,306,340。合计 144,015,992,484 B。

  **usedStorage 在这个仓上同样不能直接用。** HF 报 354,942,260,031 B，
  约是上面合计的 2.46 倍。原因不是旧修订版（wan 那份是那个原因），
  而是**两套布局并存**：原始 checkpoint 的 `FL2VA/` + `Ref2VA/` 又各放了一份
  transformer / text_encoder / video_vae / audio_vae。
  其中文本编码器三处 LFS oid 相同、只存一份；
  两个 VAE 在 FL2VA 与 Ref2VA 之间 oid 相同但与顶层 diffusers 版不同（重新打包过）。
  所以「仓有多大」和「一次部署要多少」在这条线上差一倍以上，必须分开说。

  **帧数与 latent token 的真实映射**（从厂商随仓的 `FL2VA/video_vae/klvae.py` 读出，
  再用仓里 14 个官方样片逐个验过，14/14 满足）：
  编码 `T = ceil(F/17) × 5 − 3`，解码 `F = 17·C − 12`（`C = (T+3)/5` 为块数），
  合法帧数 `F ≡ 5 (mod 17)`。
  243 / 192 / 124 三种帧长对应 C = 15 / 12 / 8、latent 帧数 72 / 57 / 37。
  默认档的 latent token 是 72 × 24 × 42 = **72,576**，序列 72,981，单步 FLOPs 1.056e16。
  **`data/derived/` 里的那组数偏低 17%–27%**，原因与修法见 R6。

  **取数提醒。** 这个仓**没有顶层 config.json**，有 17 份组件 config，
  104 个分片、12 个 index。`fetch_hf.py --id minimax-h3` 能取全，
  但产出的 `shapes.json` 是全仓合并的，**不能直接用于参数量**（见 R2）。
  本记录的数来自按组件分开的逐分片读头。

open_questions:
  - >-
    **`data/derived/minimax-h3.json` 里的 latent token 数与单步 FLOPs 偏低，已知未修（R6）。**
    真值：latent 帧数 72、latent token 72,576、序列 72,981、单步 FLOPs 1.056e16；
    derived 给的是 61,992 / 62,397 / 8.320e15，分别低 17.1% 与 26.9%。
    原因是 `derive.py` 的 `gen_workload()` 只能套单一除数，而 H3 的帧数→token 映射是分块的。
    要改 `derive.py` 与 schema，是共享文件，已报给主会话。
    **引用这份记录的负载数时以 R3 / R6 的真值为准，不要直接引 derived JSON**
  - >-
    `generation.sampling.steps` 填不了（R5）：默认采样步数卡与厂商脚本都没有，
    引擎文档说 50 但那是第四档来源。
    **端到端 FLOPs 因此算不出** —— derive 只能给出单步。
    若后续出技术报告，这一项要按报告补，并重算端到端
  - >-
    卡说 AdaLN 那 13.06B「输出可预计算并缓存、推理-only 部署不必加载」。
    **没有验证过。** 要按张量名分桶统计预计算之后实际还要驻留多少才能给数。
    在那之前**不要把 33.12B − 13.06B = 20.07B 写进任何字段** —— 那是两个口径相减，
    正是 CLAUDE.md 点名的范畴错误
  - >-
    立体声怎么占序列不知道。卡说左右声道共用编解码器各跑一遍，
    但 DiT 的 `audio_proj_in` 只有 32 通道（= 单声道 latent 宽度）。
    推导里音频 token 按单声道算（40 Hz × 时长），**是下界**；
    若两声道各占一份 token，音频那一路要翻倍
  - >-
    文本 token 数不知道，而 H3 是把文本拼进同一条注意力序列的（`in_sequence`）。
    所以推导给出的序列长度与注意力 FLOPs 都是**下界**，derive 会标出来。
    厂商脚本里的 prompt 是 H3-Context-IR 产出的长结构化文本，
    样例的 usage 显示 prompt_tokens 在 5,650–33,323 之间 ——
    那是 Context-IR 自己的 token 账，不一定等于喂进 DiT 的文本 token 数
  - >-
    H3-Context-IR 与 H3-Regenerate-2K 未开源，**端到端负载在公开仓里算不全**。
    本记录覆盖的只有中间那段 H3-Base（768p）
  - >-
