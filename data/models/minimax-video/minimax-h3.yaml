id: minimax-h3
family: minimax-video
kind: video-gen
display_name: MiniMax-H3
released: '2026-07-28'
license: other
license_restriction: >-
  MiniMax H3 Community License。美国 / 欧盟 / 英国 / 韩国的使用者需另行通过
  platform.minimax.io/h3-license 申请。这不是法务洁癖 —— 它决定这套权重能不能
  进某个部署区域，属于 infra 可行性
visibility: public

# 视频线第二份记录，口径沿用 wan2.2-ti2v-5b 定下的三条：
# params.total 只算 DiT；不建 arch 块；没有 KV cache 这笔账。
#
# 这一份和 wan 那份的差别在于**仓里有两套并列布局**：
#   原始 checkpoint  FL2VA/ 与 Ref2VA/（SGLang / vLLM 用）
#   diffusers 格式   顶层 transformer/ transformer_ref/ text_encoder/ vae/ audio_vae/
# 同一批权重按两套命名各放一份，所以 usedStorage 和「合并全部分片」都会重复计数。
# 本记录的数全部取自 **diffusers 顶层布局**，理由见 counting_note。

sources:
  - kind: modelcard
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3
    locator: README.md §System Overview / §H3-Encoder / §H3-VAE / §H3-Omni-Transformer @ 42ed227ee7df
    accessed: '2026-10-30'
    note: >-
      官方口径来源。卡上直接给出的：33B 稠密单流 Transformer、其中约 13B 在 AdaLN 分支
      且「推理时不需要加载」；文本编码器用 Qwen3-VL-32B 的**全部预训练权重**并取其
      **第 50 层** hidden state；VisualVAE 记作 **f16t4d24**（空间 16×、时间 4×、24 latent 通道），
      patchify 1×2×2 之后「有效空间下采样 32×、时间仍 4×」；AudioVAE 把 32 kHz 压到 **40 Hz**，
      左右声道共用同一套编解码器各跑一遍；**发布权重是 CFG 蒸馏过的**；
      输出 4–15 秒、24 fps、短边默认 768、音频 32 kHz 立体声。
      卡上**没有**默认采样步数 —— 见 open_questions
  - kind: modelcard
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3
    locator: README.md §Local Deployment of H3-Base 的 checkpoint 表 @ 42ed227ee7df
    accessed: '2026-10-30'
    note: >-
      两个任务 checkpoint（FL2VA 覆盖 t2va / fl2va，Ref2VA 覆盖 ref2va），
      Precision 一栏两行都写 BF16。H3-Context-IR 与 H3-Regenerate-2K **未开源**，
      卡上写明「not included in this open-source release」
  - kind: repo
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3/blob/main/FL2VA/model_index.json
    locator: FL2VA/model_index.json 与 Ref2VA/model_index.json 的 _minimax_h3.partition @ 42ed227ee7df
    accessed: '2026-10-30'
    note: >-
      定死了 transformer_ref 的性质：两份 model_index 各自带
      `_minimax_h3.partition: fl2va` / `ref2va`，`tasks` 分别是 ["t2va","fl2va"] 与 ["ref2va"]，
      而**每份自包含 checkpoint 下只有一个 transformer 目录**。
      顶层 diffusers 的 MiniMaxH3ModularPipeline 把两套并列成 transformer + transformer_ref，
      是为了一个 pipeline 能切任务，不是一次推理要同时加载两套。见 review R1
  - kind: repo
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3/blob/main/FL2VA/video_vae/source/config.json
    locator: AutoencoderKLLegacy 全量字段 @ 42ed227ee7df
    accessed: '2026-10-30'
    note: >-
      VAE 的一手结构（比顶层 vae/config.json 更完整）：
      `vae_ratio: 16` / `vae_ratio_t: 4` 与卡的 f16t4d24 一致；
      **`causal_encoder: true` 而 `causal_decoder: false`**；
      `use_vit_decoder: true` + `vit_decoder_kwargs.num_layers: 36` / `heads: 32` /
      `dim_head: 64` / `ffn_use_gated: true` / `norm_type: rms_norm` / `rope_theta: 100`，
      即**解码器是 36 层 Transformer 而不是卷积栈**；
      `space_down [2,2,2,2,1,1]` 连乘 16、`time_down [1,2,2,1,1,1]` 连乘 4，与 ratio 对上；
      `clip_length: 17` + `token_drop: 3` 说明编码是**按 17 帧一段切片、段间丢 3 帧重叠**，
      不是一次性对整段做 (F−1)/4+1 —— 见 review R3
  - kind: repo
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3/blob/main/scripts/readme/reproducible-768p-t2va-request.sh
    locator: scripts/readme/reproducible-768p-t2va-request.sh 的 target 块 @ 42ed227ee7df
    accessed: '2026-10-30'
    note: >-
      厂商随仓的可复现脚本（来源优先级第三档：技术报告 > 模型卡 > 厂商参考实现 > 引擎）。请求只给
      `short_edge: 768` / `aspect_ratio: "16:9"` / `duration_seconds: 10`，
      **像素网格与帧数由服务端对齐，脚本里没有**。步数、CFG 强度也都不在请求里
  - kind: repo
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3/blob/main/assets/t2va.mp4
    locator: assets/t2va.mp4 / i2va.mp4 / ref2va.mp4 的 moov（tkhd + mdhd + stts + stsz）@ 42ed227ee7df
    accessed: '2026-10-30'
    note: >-
      上一条脚本的**官方输出样片**，用来补上脚本里没有的像素网格。逐个解 moov 实测：
      t2va 视频轨 **1344×768、243 帧、timescale 12288 / 每样本 512 ticks = 精确 24 fps、
      10.125 秒**，音频轨 timescale **32000**（与卡的 32 kHz 一致）；
      i2va 1344×768 / 192 帧 / 8.000 秒；ref2va 1344×768 / 124 帧 / 5.167 秒；
      2K 档的 t2va_2k.mp4 是 2560×1440 / 243 帧。
      1344 与 768 都被 32 整除（= VAE 16 × patch 2），与「有效 32× 空间下采样」自洽
  - kind: modelcard
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3
    locator: transformer/ text_encoder/ vae/ audio_vae/ 的 index.json 与全部 32 个分片头 @ 42ed227ee7df
    accessed: '2026-10-30'
    note: >-
      权重清单逐分片读头取全，按组件分开统计（**不合并**，理由见 counting_note）：
      transformer 14 分片 638 张量、transformer_ref 14 分片 638 张量、
      text_encoder 14 分片 1058 张量、vae 3 分片 703 张量、audio_vae 单文件 1087 张量。
      另用 HF tree API 的 LFS sha256 比对了两套布局，结论见 review R1 / R2

hf:
  repo: MiniMaxAI/MiniMax-H3
  sha: 42ed227ee7df40d41602854ae760620d6eb651fe
  last_modified: '2026-08-13T01:46:29.000Z'
  pipeline_tag: image-text-to-video
  gated: false

lineage:
  track: main
  # minimax-video family 的第一份记录，也是目前唯一一份。
  # 和语言模型线的 minimax family（MiniMax-M3）是两条互不相干的技术路线，
  # 按视频线的 policy 单开 family，不挂在 minimax 下。
  # 文本编码器用的是 Qwen3-VL-32B 而不是自家 M 系列，所以两条线连组件都没共用。

params:
  total: 33122992896
  # 稠密单流主干，没有 MoE 路由、没有跨步复用，每一步对全部 token 过全部权重 ——
  # 激活参数恒等于总量。但注意卡说 AdaLN 那 13.06B 的调制输出可以预计算缓存，
  # 若真做了，每步搬运的权重会少 39%。本仓没有验证过那条路径，所以这里不扣。
  active_decode: 33122992896
  active_prefill: 33122992896
  breakdown:
    adaln_modulation: 13055204736
    ffn: 11560550400
    self_attention: 7707046400
    token_refiner: 770730752
    text_proj: 27530496
    patch_embed_video: 1037664
    norm: 542976
    patch_embed_audio: 349472
  # 不用 excludes：取数已经按组件收到 transformer/ 一个目录，shapes 里本来就没有
  # 另外三块，再声明「扣除」会让对账去减一个不存在的项。排除了什么写在 counting_note
  counting_note: >-
    **只含 DiT 主干（diffusers 顶层 `transformer/`）**，按完整权重清单
    （14 分片 638 张量）逐项统计。BF16 626 条 + F32 12 条，
    无 scale 容器、无打包容器，numel 即参数数：
    33,122,992,896 × 加权字节 = 66,280,430,080 B，与 index.json 的 total_size 逐字相同。

    **为什么只取 diffusers 布局**：这个仓把同一批权重按两套命名各放了一份 ——
    原始 checkpoint 在 `FL2VA/` 与 `Ref2VA/`，diffusers 格式在顶层。
    两套的张量名不同（原始 535 条 `blocks.N.*`，diffusers 638 条 `transformer_blocks.N.*`），
    **把全仓分片合并成一份清单会把同一个模型按两套命名各算一遍**；
    而 FL2VA 与 Ref2VA 的 DiT 张量名完全相同，合并时又会被折成一份。
    两头都错，所以按组件分开量。原始布局量出 33,122,992,912 参数，
    比 diffusers 的 33,122,992,896 多 16 —— 差在 535 vs 638 的拆分方式上，不是两个模型。

    **三块不在这个数里**：
    文本编码器 Qwen3-VL-32B 33,357,390,064 参数 / 66,714,780,128 B（全 BF16，**比 DiT 还大**）、
    视觉 VAE 2,603,868,984 参数 / 10,415,475,936 B（全 F32）、
    音频 VAE 151,326,585 参数 / 605,306,340 B（全 F32）。
    一次推理四块都要在，合计 **69,235,578,529 参数 / 144,015,992,484 B（134.13 GiB）** ——
    是「33B」按 BF16 算的 2.17 倍。对账见 notes。

    分桶口径：adaln_modulation 含逐层 `adaln_proj.linear`（[96768, 2688]，96768 = 18 × 5376）、
    `norm_out.linear` 与 `time_embedder`；self_attention 含 q/k/v 三个 [7168, 5376] 与
    o [5376, 7168] 以及 [128] 的 QK-norm；ffn 含 [28672, 5376] 的 gate+up 融合与
    [5376, 14336] 的 down；token_refiner 是入口那 2 层 refiner 的全部权重，
    它没有 adaln_proj，所以单列而不是并进上面三桶。

generation:
  backbone:
    stream_design: single
    layers: 50
    double_blocks: 0
    single_blocks: 50
    hidden: 5376
    heads: 56
    head_dim: 128
    head_dim_note: >-
      **heads × head_dim = 7168 ≠ hidden 5376。** 注意力内维比残差流宽 33%：
      q/k/v 是 [7168, 5376]、o 是 [5376, 7168]（权重实测）。
      拿 hidden 去推注意力投影的规模会低估三分之一
    ffn: 14336
    refiner_layers: 2
    text_conditioning: in_sequence
    patch_size: [1, 2, 2]
    position: 3D MM-RoPE (t, h, w)，rope_freq_dim 16、rope_theta 10000
    note: >-
      卡说「注意力层与 FFN 层都不含模态特定结构，模态特定参数只在输入/输出层与
      AdaLN 分支里」—— 权重清单对得上：每层只有一套 `attn.*`、一套 `ff.*`，
      模态入口是 `proj_in [5376, 96]`（视频，96 = 24 latent 通道 × 1×2×2 patch）、
      `audio_proj_in [5376, 32]`（音频）、`context_embedder [5376, 5120]`（文本，
      5120 正是 Qwen3-VL 的 hidden）。
      **AdaLN 是这份记录最反直觉的一块**：13.06B，占主干 39.41%，比 FFN（34.90%）
      和注意力（23.27%）都大。每层 `adaln_proj.linear` 是 [96768, 2688]，
      96768 = 18 × 5376 = 3 种模态 × 6 组调制，2688 = 5376 / 2 是时间步条件向量的宽度。
      卡说这部分「输出可预计算并缓存，推理-only 部署不必加载」——
      **本仓没有验证过那条路径**，所以 params 里没有扣除；
      要扣得先确认缓存后的驻留量，那是另一轮的事（见 open_questions）

  vae:
    spatial_compression: 16
    temporal_compression: 4
    latent_channels: 24
    causal: true
    decoder_arch: transformer
    params: 2603868984
    name: H3-VisualVAE（f16t4d24）
    note: >-
      **整条视频线里第一个解码器不是卷积栈的 VAE**：`use_vit_decoder: true`，
      36 层、32 头 × 64 dim_head、gated SiLU FFN、RMSNorm、RoPE theta 100。
      2.60B 参数 / 10,415,475,936 B **全 F32**（703 张量逐条实测）。
      卡说这个解码器是在编码器训完之后另训的，目的就是降低解码成本 ——
      即便如此它仍是一次独立的大计算，不是边角料。
      与 wan2.2-ti2v-5b 的对照：那一份的 VAE 是 .pth 读不了清单、decoder_arch 只能填 unknown。
      **causal 只对编码器成立**：`causal_encoder: true` / `causal_decoder: false`。
      latent_channels 24 三处一致：卡的 f16t4d24、`vae/config.json` 的
      `latent_channels: 24`、以及 DiT 的 `proj_in.weight [5376, 96]`（96 = 24 × 1×2×2）。
      **`temporal_compression: 4` 是块内卷积比，不是端到端比值。**
      17 帧一块先补 3 帧到 20 再除以 4 得 5 个 token，所以整段的帧数∶token 数
      是 3.375（243/72）而不是 4。两个数都对，但是两个口径 ——
      填进字段的是前者（照 `vae_ratio_t: 4`），算 token 数要用 R3 的分块公式

  audio:
    in_channels: 32
    vae: H3-AudioVAE（DAC 式）
    vae_params: 151326585
    sample_rate_in: 32000
    sample_rate_out: 32000
    latent_hz: 40
    channels: 2
    note: >-
      latent_hz 40 是**推导**：`encoder_rates [2,4,4,5,5]` 连乘 800，32000 / 800 = 40，
      与卡的「compresses 32 kHz audio into a sequence of latent tokens with a
      temporal rate of 40 Hz」一致（两路互相印证）。
      `latent_channels: 32` 与 DiT 的 `audio_proj_in [5376, 32]` 对得上。
      **立体声怎么进序列没定论**：卡说左右声道共用同一套编解码器、各自独立跑一遍再合成，
      但 DiT 入口只有 32 通道（= 单声道 latent 宽度），
      所以两条声道是拼成两倍 token 还是另有安排，公开材料回答不了。
      推导里音频 token 按**单声道**计，是下界 —— 见 open_questions

  text_encoders:
    - role: primary
      name: Qwen3-VL-32B（取第 50 层 hidden state）
      hf_repo: Qwen/Qwen3-VL-32B
      params: 33357390064
      hidden: 5120
      shipped_with_weights: true
      gated: false
      release_dtype: BF16
      hidden_layer_taken: 50
      substitutable: false
      note: >-
        **全部预训练权重随仓发布**，1058 张量全 BF16，实测 33,357,390,064 参数 /
        66,714,780,128 B —— **比 DiT 本体还大**（参数 1.007 倍、字节 1.007 倍）。
        config 实测：text 侧 64 层 / hidden 5120 / 64 头 / 8 个 KV 头（GQA）/
        intermediate 25600 / vocab 151936；vision 侧 27 层 / hidden 1152 / patch 16 /
        out_hidden 5120 / spatial_merge 2 / temporal_patch 2。
        卡明确说取的是**第 50 层**（共 64 层）的 hidden state，不是最后一层 ——
        所以推理时后 14 层可以不跑，但权重仍随仓发布。
        用 HF 的 LFS sha256 比对过：`FL2VA/text_encoder`、`Ref2VA/text_encoder`
        与顶层 `text_encoder/` **14 个分片的 oid 两两完全相同**，
        即两个任务 checkpoint 共用同一份文本编码器，仓里只存了一份。
        卡还要求必须用 H3 仓自带的 tokenizer（加了 `<d>` 等特殊 token），不能直接用上游的

  sampling:
    cfg:
      distilled: true
      embedded: false
      forwards_per_step: 1
    scheduler: MiniMaxH3Scheduler（flow matching）
    note: >-
      **发布权重已做 CFG 蒸馏**，卡原话「The released checkpoints are CFG-distilled
      Omni Transformer model weights」，所以每步只跑一次主干前向，没有无条件那一路。
      和 wan2.2-ti2v-5b 正好相反：那一份 CFG 未蒸馏，端到端是 50 步 × 2 = 100 次前向。
      **steps 没有填，因为模型卡与厂商脚本都没有给**：
      `reproducible-768p-t2va-request.sh` 的请求体只有 short_edge / aspect_ratio /
      duration_seconds，步数在服务端。引擎文档（sglang cookbook）给了 50，
      但按本仓的来源优先级那是第四档，不足以进字段。见 open_questions。
      视频与音频各有一套 scheduler，sigma shift 分别是 12.0 与 3.0
      （两份 model_index 的 `_minimax_h3.sigma_shift_scales` 一致）

  pipeline_stages:
    - name: H3-Context-IR
      model: 未开源（托管服务）
      open_source: false
      note: >-
        多模态输入的理解与改写，产出送进 H3-Base 的结构化中间表示。
        卡说它依赖多阶段工作流与多个托管模型，不在开源范围内，只提供 API。
        **所以端到端负载在公开仓里算不全**
    - name: H3-Base
      model: same-backbone
      resolution: 短边 768
      open_source: true
      note: 本记录覆盖的就是这一段。步数未知
    - name: H3-Regenerate-2K
      model: same-backbone（in-context 重生成）
      resolution: 2K
      open_source: false
      note: >-
        不是常规超分模块，而是把 768p 结果连同原始上下文再喂回 H3 本体重生成一遍。
        卡说「not yet open-sourced」。样片 t2va_2k.mp4 实测 2560×1440 / 243 帧

  buckets:
    - width: 1344
      height: 768
      frames: 243
      latent_frames: 72   # ceil(243/17)×5 − 3 = 72，见 R3
      fps: 24
      duration_s: 10.125
      default: true
      note: >-
        取自厂商可复现脚本（short_edge 768 / 16:9 / duration 10）**的官方输出样片**
        assets/t2va.mp4 实测。脚本本身不含像素网格，网格由服务端按 aspect_ratio 对齐 ——
        1344 与 768 都被 32 整除。243 帧 / 12288 timescale / 512 ticks 每样本 = 精确 24 fps。
        **latent 帧数 72**：C = (243+12)/17 = 15 块，T = 5×15 − 3 = 72（见 R3）。
        latent token 72 × 24 × 42 = 72,576 —— 注意 derived JSON 里是 61,992，偏低 17%，
        原因见 R6
    - width: 1344
      height: 768
      frames: 192
      latent_frames: 57   # ceil(192/17)×5 − 3 = 57，见 R3
      fps: 24
      duration_s: 8.0
      note: assets/i2va.mp4 实测（首帧图生视频，请求 8 秒）
    - width: 1344
      height: 768
      frames: 124
      latent_frames: 37   # ceil(124/17)×5 − 3 = 37，见 R3
      fps: 24
      duration_s: 5.1666667
      note: assets/ref2va.mp4 实测（多模态参考，请求 5 秒）
    - width: 2560
      height: 1440
      frames: 243
      latent_frames: 72   # ceil(243/17)×5 − 3 = 72，见 R3
      fps: 24
      duration_s: 10.125
      note: >-
        2K 档，由未开源的 H3-Regenerate-2K 产出（assets/t2va_2k.mp4 实测）。
        **不是 H3-Base 能直接出的档位**，列在这里是为了说明 2K 路径的像素量

  constraints:
    width_divisor: 32
    height_divisor: 32
    frame_formula: 17n+5
    note: >-
      除数 32 = VAE 空间压缩 16 × DiT patch 2，与卡的「有效空间下采样 32×」一致。
      1344/32 = 42、768/32 = 24，都整除。
      **帧数是 17n+5 而不是 4n+1**：VAE 按 17 帧一块编码、每块 5 个 token、
      整段末尾丢 3 个，解码时每块回 17 帧再补 5 帧 overlap 尾，
      所以 F = 17·C − 12（C 为块数）。仓里 14 个官方样片 14/14 满足，
      243 / 192 / 124 对应 C = 15 / 12 / 8。推导见 review R3

  checkpoint_variants:
    - name: transformer（FL2VA 分区）
      role: base
      bytes: 66280430080
      resident: true
      note: 覆盖 t2va 与 fl2va 两个任务。本记录的 params 量的就是它
    - name: transformer_ref（Ref2VA 分区）
      role: base
      bytes: 66280430080
      resident: false
      note: >-
        **另一个任务分区的主干，不是和上面那套同时驻留的第二个模块。**
        依据：FL2VA/ 与 Ref2VA/ 两份自包含 checkpoint 各自只有一个 transformer 目录，
        且 model_index 里 `_minimax_h3.partition` 分别是 fl2va / ref2va。
        顶层 diffusers 把两套并列成 transformer + transformer_ref，是让一个
        ModularPipeline 能切任务。实测两者张量名集合与 total_size 完全相同、
        **LFS sha256 无一重合**，即同架构不同权重的两次微调。详见 review R1
