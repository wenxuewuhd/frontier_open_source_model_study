precision:
  weights_release: [BF16, FP32]
  weights_release_scope:
    BF16:
      manifest_taken: true
      in_precision_table: true
      repo: MiniMaxAI/MiniMax-H3
      note: >-
        DiT 的 626 / 638 条是 BF16（全部注意力、FFN、AdaLN 投影、norm），
        文本编码器 1058 条**全部** BF16。卡的 checkpoint 表也写 BF16
    FP32:
      manifest_taken: true
      in_precision_table: true
      repo: MiniMaxAI/MiniMax-H3
      note: >-
        三处是 F32，卡上没提，是实测出来的：
        DiT 的 12 条模态进出口与时间步嵌入（`proj_in/out`、`audio_proj_in/out`、
        `time_embedder.linear_1/2` 的 weight 与 bias）；
        视觉 VAE 的 703 条**全部**；音频 VAE 的 1087 条**全部**。
        即「BF16 模型」说的是主干与文本编码器，两个 VAE 整体是 F32
  inference_default: BF16

bottlenecks:
  - dimension: host-io
    finding: >-
      「33B」只说 DiT。一次推理要同时驻留 DiT、Qwen3-VL-32B 文本编码器、
      视觉 VAE、音频 VAE 四套权重，而**文本编码器比 DiT 本体还大**。
      维度记 host-io 而不是容量，沿用 wan2.2-ti2v-5b 的同一判断：
      134 GiB 单卡放不下已是既成事实，真正要规划的是搬什么、什么时候搬
    quantified: >-
      DiT 66,280,430,080 B + 文本编码器 66,714,780,128 B + 视觉 VAE 10,415,475,936 B
      + 音频 VAE 605,306,340 B = 144,015,992,484 B（134.13 GiB）；
      参数合计 69,235,578,529。文本编码器 / DiT = 1.007（参数）
    fix: >-
      文本编码器每次生成只跑一遍且只取到第 50 层（共 64 层），DiT 要跑满步数 ——
      和 wan2.2-ti2v-5b 的 `--t5_cpu` 是同一类错峰机会，而且这里还能截断后 14 层。
      厂商给的部署基线是 4 卡 Ulysses 序列并行
    visibility: public
  - dimension: compute
    finding: >-
      AdaLN 调制分支占主干参数的 39.41%，比 FFN 和注意力都大。
      卡说它的输出可以预计算缓存、推理-only 部署不必加载 ——
      如果成立，这是一次性省掉近四成权重搬运的机会，但本仓没有验证过
    quantified: >-
      adaln_modulation 13,055,204,736 / 33,122,992,896 = 39.41%；
      每层 `adaln_proj.linear` [96768, 2688]，96768 = 18 × 5376 = 3 模态 × 6 组调制
    fix: >-
      先验「预计算后实际驻留多少」再谈收益。**不要用 33B − 13B = 20B 当结论** ——
      那是两个口径相减（见 open_questions）
    visibility: public
  - dimension: compute
    finding: >-
      CFG 已蒸馏，每步只跑一次前向。和同线 wan2.2-ti2v-5b 的 2 次相比，
      这一项直接省掉一半 —— 它是生成类负载账里最容易漏的因子
    quantified: forwards_per_step 1（卡：released checkpoints are CFG-distilled）
    fix: 无需再做；记在这里是为了跨记录对照时不要把两份的「步数」直接比
    visibility: public

infra_signals:
  - text: >-
      生成类系统的「模型大小」是个不完整的说法。H3 的 33B 指 DiT，
      而一次推理的常驻权重是 134 GiB，其中文本编码器比主干还大 ——
      这一代把一个完整的 32B VLM 塞进了文生视频流水线，
      文本编码器从「附属组件」变成了与主干同量级的部署对象
    evidence: derived
  - text: >-
      AdaLN 分支占去主干近四成参数，是这一代单流多模态 DiT 的结构代价：
      模态特定性不做在注意力和 FFN 里，而是集中到调制分支上。
      厂商声称它可预计算缓存，若成立则「参数量」与「每步搬运量」在生成类上
      会出现比 MoE 更大的背离
    evidence: judgement
  - text: >-
      **厂商声明的 VAE 时间压缩率不等于端到端的帧数∶token 比值。**
      H3 的卡与 config 都写 4×，那是块内卷积比；而 VAE 按 17 帧一块、每块 5 个 token，
      整段的实际比值是 3.375。差 17% 的 token 数，经 O(n²) 的注意力放大成 27% 的单步算力。
      生成类的负载规划必须拿端到端比值，而拿到它只能去读厂商的 VAE 实现 ——
      这不是 H3 一家的问题：各家的帧数约束（4n+1 / 8n+1 / 17n+5）都是这类分块规则的外在表现
    evidence: derived

