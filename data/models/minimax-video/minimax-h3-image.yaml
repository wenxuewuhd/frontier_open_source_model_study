reviewed:
  date: '2026-11-18'
  method: >-
    Gate B 两路半。**config 一路**：6 份组件 config（原生与 diffusers 各一套
    transformer / vae，外加 text_encoder、scheduler）＋ `model_index.json`、
    `modular_model_index.json`、`pdd_config.json`；顶层没有 config.json。
    **清单一路**：逐分片 Range 读 safetensors 头，按组件分开量
    （transformer_diffusers 644 / transformer 531 / vae 416 / vae_diffusers 511 /
    pdd_fused_heads 2），不下权重。
    **第三路是跨仓 oid 比对**（HF tree API 的 LFS sha256 与 git blob sha1），
    它顶的是「与 H3 同不同」这个问题，不是 config × 清单那种自校验，所以算半路。

    结构字段三路一致：patch (1,2,2) 在两份 config、在 `proj_in.weight [5376, 96]`
    的 96 = 24×1×2×2、也在卡的「each transformer token covers 32x32 pixels」里；
    hidden 5376 / layers 50 / ffn 14336 / latents_dim 24 / text_dim 5120 /
    refiner 2 / time_embed_dim 2688 / adaln_out_features 96768 八项
    config 与清单逐项对上，**且与已录 minimax-h3 逐项相同**。
    `num_pdd_heads: 6` 与 `pdd_proj_out.{0..5}` 12 条、
    `pdd_fused_heads` 的 [6, 96, 5376] 三路一致。
    `audio_enabled: false` 与「4 条音频投影消失」两路一致。

    字节对账：两套 DiT 布局的实测 numel×bpe 与各自 index.json 的 `total_size`
    **逐字相同**（66,289,356,032 / 66,279,032,256）；
    两套布局的差额按四个因子对平到字节（见 counting_note）；
    VAE 两套差额对平到一条张量（`decoder.mask_token` 1,024 参数）；
    首个提交的模型文件 68,651,473,216 B 与卡的 Model Zoo 68.65 GB 逐字相同。
    卡的「33.1B」落在 33,125,224,384（diffusers）与 33,122,643,440（原生）之间，
    两者都四舍五入到 33.1B，**所以这个数分辨不了布局**。

    Gate C：判断类字段逐条在 evidence 里标了。
    `--list-judgements` 新增项本轮逐条看过。

review:
  - id: R1
    field: generation.text_encoders
    severity: wrong
    claim: >-
      「模型卡写 Text encoder — Not in this repository，而 `text_encoder/` 的 14 个分片
      就在仓里 62.14 GiB；按本仓「权重赢」以文件树为准，**要在记录里写明卡这一句是错的**」
      —— 这是巡检交过来的结论
    finding: >-
      **结论的方向对（以文件树为准），但「卡是错的」这个说法不成立，而且会误导下一个人。**
      按提交史查到底了：卡那一句在写下时是**真的**。
      首个提交 `7b6142f879`（2026-11-10T14:50:23Z）的文件树里**没有 `text_encoder/`**
      —— 只有 model_index.json / pdd_config.json / pdd_fused_heads.safetensors /
      processor / tokenizer / transformer / vae，与卡 §Quick Start 里那张目录树
      **逐项相同**；那次提交的模型文件合计 68,651,473,216 B，
      与卡 Model Zoo 的 **68.65 GB 逐字相同**。
      同一天 16:21:40Z 的 `492fd8c4ec`「Add diffusers format weights (#2)」
      一次性加进 `text_encoder/` + `transformer_diffusers/` + `vae_diffusers/`
      + `scheduler/` + `modular_model_index.json`，仓从 68.65 GB 变成 **190.00 GiB**。
      README 此后又被改过两次（11-11 的 #8、11-12 的 #18），那一行一直没动。

      **而且「卡与文件树冲突」这个前提本身也不全对**：两条装载路径指向不同的仓 ——
      `model_index.json`（原生 / SGLang 走的那条）的 text_encoder 确实写
      `MiniMaxAI/MiniMax-H3` + `subfolder: text_encoder`，卡那一句说的就是它；
      `modular_model_index.json`（diffusers 那条）才指本仓。
      **所以卡描述的是一条真实存在的路径，只是仓里后来多了另一条。**
    resolution: corrected
    changed_to: >-
      记录里写成「卡这一行已过期，不是写错」，并把提交史、两条装载路径、
      68.65 GB 的逐字对账都落成 `sources` 里的两条与这一条 review。
      **结论不变**：参数量与驻留账按文件树算，`text_encoder/` 的 62.14 GiB 算在仓里；
      但读者被明确告知**按卡读会少 62 GiB、而卡自身是自洽的**，
      这比「卡错了」更能防住下一次误读。infra_signals 第四条把它抽成一条通则
  - id: R2
    field: params.counting_note
    severity: wrong
    claim: >-
      「`transformer/` 531 个张量名（原生，qkv 融合）与 `transformer_diffusers/` 644 个
      （拆开）—— 照 H3 的解法，取**顶层 `transformer/`**」
    finding: >-
      **两份记录的目录名正好相反，照搬 H3 的「取顶层 transformer/」会取到另一套命名。**
      H3 的顶层 `transformer/` 是 **diffusers** 命名（638 条 `transformer_blocks.N.*`），
      原生那套在 `FL2VA/` / `Ref2VA/`（535 条 `blocks.N.*`）；
      这个仓反过来 —— 顶层 `transformer/` 是**原生**（531 条 `blocks.N.*`、
      qkv 融合成一条、mlp 叫 `fc1/fc2`、出口叫 `final_layer.video_out`），
      diffusers 那套在 `transformer_diffusers/`（644 条）。
      H3 记录真正的判据不是「取顶层」而是「取 diffusers 布局」，
      而**只有在同一套命名下，与 H3 的逐条比对才做得出来**。
      两套名字集合交集只有 1 个（`token_refiner.final_norm.weight`），实测确认
    resolution: corrected
    changed_to: >-
      取 `--include 'transformer_diffusers/*'`。`facts/minimax-h3-image/shapes.json`
      装的就是这 644 条（`duplicate_tensors` 0、`failed_shards` 空）。
      并把两套布局的差额按**四个因子**对平到字节
      （+pdd 3,097,152 − `final_layer.video_out` 516,192 − `rope.inv_freq` 16），
      所以「不是两个模型」这件事有逐因子对账，不只是字节数相近
  - id: R3
    field: generation.backbone.note
    severity: wrong
    claim: >-
      「`audio_enabled: false` 且 **6 个音频张量消失**」
    finding: >-
      **是 4 条音频张量，另外 2 条是出口投影，两件事不该合成一句。**
      diffusers 命名下只 H3 有的 6 条实测是：
      `audio_proj_in.{weight,bias}`（177,408 参数）、
      `audio_proj_out.{weight,bias}`（172,064）、
      `proj_out.{weight,bias}`（516,192）。
      前 4 条是音频撤掉，后 2 条是被 6 个输出头取代 —— 后者与音频无关，
      它在原生布局里**还在**（`final_layer.video_out`）。
      合成一句的后果是参数差额算不平：+2,231,488 要四个因子才对得上
    resolution: corrected
    changed_to: >-
      lineage 的 modality 与 decoding 两条分开写；
      `params.counting_note` 给出四因子对账
  - id: R4
    field: generation.vae
    severity: missing
    claim: >-
      「DiT 与 VAE 不共享」—— 巡检按整文件 oid 得出的结论
    finding: >-
      **按整文件 oid 判「VAE 不共享」是不成立的推论，而逐张量比出来的结果更有意思。**
      整文件 oid 不同是事实，但那个文件里编码器与解码器打包在一起，
      **整文件不同推不出编码器不同**。改按张量比（diffusers 命名两侧对齐）：
      **编码器 116 条 116/116 同名同形同 dtype**，合计 180,335,536 参数 /
      721,342,144 B，`quant_conv.weight` 两侧都是 [48,48,1,1,1]（5 维 / 3D 卷积）；
      解码器才是换掉的那一半（403,889,920 对 2,423,530,496，**1/6**），
      且 391 条共有名字**没有一条形状相同**，`post_quant_conv` 从 5 维降到 4 维
      —— 解码入口由 3D 改 2D，编码侧没动
    resolution: corrected
    changed_to: >-
      `vae.note` 写成「编码器逐张量同形、解码器换掉」，并明确**权重是否逐位相同没有验到**
      （要下权重逐张量比，本次没做）。
      顺带记下 `temporal_downsample_factors` 与 `vae_clip_length: 17` 仍留在图像 VAE 的
      config 里、而 `vae_token_drop` 由 3 变 0
  - id: R5
    field: generation.backbone.note
    severity: missing
    claim: >-
      `adaln_out_features: 96768` = 18 × 5376 = 3 种模态 × 6 组调制 —— 照 H3 记录的读法
    finding: >-
      **音频撤掉之后这个数一字未改**（两份 config 相同、张量同形 [96768, 2688]）。
      如果 18 真是「3 模态 × 6 组」，少一个模态该掉到 12 × 5376 = 64512。
      所以要么图像档里第三条模态位空着（权重照分配、不参与），
      要么 18 的分解根本不是 3×6。**形状这条路到此为止** ——
      两种读法在权重上完全一样，钉死要读实现
    resolution: open
    changed_to: >-
      `generation.backbone.note` 写明「3 × 6」在这一代只是一种解释、不是权重能证明的事，
      并开 open question。**H3 那份记录里那句「96768 = 18 × 5376 = 3 种模态 × 6 组调制」
      同样只是解释** —— 本次没有改那份记录，列为待办
  - id: R6
    field: '-'
    severity: missing
    claim: >-
      卡说的 33.1B 可以照抄进 `params.total`（巡检已明确提醒不要抄，这里记下结果）
    finding: >-
      **抄不得，而且这次实测出来的两个候选值都四舍五入到 33.1B。**
      diffusers 布局 33,125,224,384、原生布局 33,122,643,440，差 2,580,944；
      卡那个数**分辨不了布局**。按 `fetch_hf.py --include` 实测之后
      `params` 标 `derived` 而不是 `official`
    resolution: corrected
    changed_to: >-
      `params.total` 填实测的 33,125,224,384，`evidence.params: derived`，
      `counting_note` 写明布局选择与四因子对账
  - id: R7
    field: released
    severity: missing
    claim: 按本仓惯例「createdAt 才是发布」，`released` 应填 2026-11-03
    finding: >-
      **那条惯例判的是 lastModified vs createdAt，这一份要判的是 createdAt
      vs 首个权重提交，不是同一道题。**
      HF `createdAt` 是 2026-11-03T06:34:36Z，而**首个提交是 11-10T14:50:23Z**
      —— 建仓早一周、那七天仓里没有权重。
      卡上没有发布日期，`lastModified` 是 11-16（最后一次是「add Diffsynth support」）。
      两次判断取的其实是同一条原则：**权重落地的那一刻**
    resolution: corrected
    changed_to: >-
      `released: '2026-11-10'`，`evidence.released: derived`（卡没给，是从提交史推的）。
      **名册那边要写同一个日期** —— `check_roster` 按 released 逐字对账

notes: >-
  **字节对账。** 三块的实测 numel × 每元素字节与各自 index.json 的 `total_size`
  逐字相同（VAE 是单文件无 index，直接读头）：
  transformer_diffusers 66,289,356,032；text_encoder 66,714,780,128（同一份权重，
  数字引自 minimax-h3）；vae_diffusers 2,336,913,632。
  一次 t2i 推理合计 135,341,049,792 B（126.05 GiB）/ 67,066,842,856 参数。

  **usedStorage 在这个仓上同样不能直接用。** HF 报 203,981,781,880 B，
  tree 逐文件合计 204,016,543,520 B（190.005 GiB），约是上面驻留账的 1.51 倍。
  原因与 H3 同类但不同形：H3 是 `FL2VA/` + `Ref2VA/` 两套任务 checkpoint，
  这一份是**同一批权重的两套命名**（原生 + diffusers）各放一份 ——
  DiT 61.73 + 61.74 GiB、VAE 2.18 + 2.18 GiB。
  **所以「仓有多大」和「一次部署要多少」在这条线上又差了一半以上，必须分开说。**

  **与 minimax-h3 的逐位同一性清单**（本次用 HF tree API 的 oid 比出来的，
  LFS 文件按 LFS sha256、文本文件按 git blob sha1）：
  `text_encoder/` 14 个分片（66,714,912,872 B）＋该目录下 9 个非 LFS 文件
  ＋`tokenizer/` 4 个 ＋`processor/` 7 个 = **34 个文件、66,749,500,959 B
  （62.165 GiB）逐位相同**；H3 侧三个路径（顶层、`FL2VA/`、`Ref2VA/`）
  oid 两两相同，即 H3 仓里本来也只存一份。
  **DiT 与 VAE 的权重文件 oid 无一重合** —— 但 VAE 的编码器是逐张量同形的（R4）。

  **H3-Image-PE 要澄清两件事**（卡把它列在 Model Zoo 里，容易误读）：
  (1) **它不是 MiniMax 的模型**。HF 标签 `base_model:quantized:Qwen/Qwen3.8-27B`、
  `model_type: qwen3_5`、`architectures: Qwen3_5ForConditionalGeneration`，
  `quantization_config` 实测 num_bits 4 / group_size 16 / modelopt（即 NVFP4，
  group_size 16 是 NVFP4 的特征，MXFP4 是 32），usedStorage 17,937,191,286 B。
  **即它是 Qwen3.8-27B 的一个由 MiniMax 发布的量化版**，与 MiniMax 自家的权重无关。
  **而本仓已录 `qwen3.8-27b`**，所以它与那份记录的 `official_variants` 有关系要判 ——
  判断与理由归 open_questions，这里只留可核的事实。
  (2) 它是**未开源的 H3-Image-Context-IR 的本地替代**，不是生成链里的必需件；
  跑完提示改写就可以卸，所以 `resident: false`。
  **H3 记录里「Context-IR 未开源」这个结论仍然成立** ——
  这个仓里的 `examples/context_ir.py` 是调 `/v1/h3_image_context_ir` 的
  客户端脚本（读 `MINIMAX_API_KEY` 与 `MINIMAX_API_BASE`），不是权重。

  **取数提醒。** 这个仓**没有顶层 config.json**，有 6 份组件 config、
  41 个 safetensors、3 个 index。`fetch_hf.py --id minimax-h3-image` 不加范围
  会把两套布局的 DiT 与 VAE **各算一遍**，而两套 DiT 的张量名集合交集只有 1 个，
  所以 `collect_shapes` 的形状冲突检查**一条都不会报**（它只在同名张量上比形状）。
  现在 `facts/minimax-h3-image/shapes.json` 装的是
  `--include 'transformer_diffusers/*'` 收窄之后的 644 条
  （`duplicate_tensors` 0、`failed_shards` 空），`derive.py` 读的就是它。

  **6 份组件 config 在 `facts/minimax-h3-image/cfg_components.json` 里**，
  而 `derive.py` 只看 `cfg.json`（这个仓那份是 `{}`），所以 derived 的 `gate_b`
  会报 `paths: 1`、说「config 侧的交叉核对整条跳过」。
  **那是取数脚本与 derive 之间的缺口，不是本记录只核过一路** ——
  `reviewed.method` 里的结构字段三路是人工逐项对的。共享文件本记录不改。
  **注意那条 `why` 的措辞不准**：它说「仓里没有任何 config（顶层与组件目录都没有）」，
  而这个仓有 6 份组件 config，只是 derive 读不到它们。
  措辞照字面读会让人以为取数时没取到 —— 取到了，在 `cfg_components.json` 里。
  **收尾条件**：`derive.py` 哪天开始读 `cfg_components.json`，
  本记录这一段与 `gate_b.paths: 1` 的说明一起删掉；判据是
  `.venv/bin/python -c "import json;print(json.load(open('data/derived/minimax-h3-image.json'))['gate_b']['paths'])"`
  输出 2 而不是 1。minimax-h3 那份撞的是同一个缺口。

open_questions:
  - >-
    **6 个输出头各管哪一步，没有钉死。** `num_pdd_heads: 6` 是 config 明写的、
    6 个头与 `pdd_config.json` 的 6 个 sigma 区间数目相同、原生那份把它们堆成
    `[6, 96, 5376]` 的首维 —— 这三件都是事实，而「第 i 个头对应第 i 步」
    是**从张量名与数目相同推的解释**，形状证明不了索引顺序。
    要钉死得读 SGLang / vLLM-Omni / diffusers 任一侧的实现（pipeline 怎么按
    step 取第几片）。**在那之前不要在页面上说「第 i 步用第 i 个头」。**
    下游影响很小（6 个头合计 12 MB），但它是这一份唯一的新 infra 形状，
    说法要准
  - >-
    `adaln_out_features: 96768 = 18 × 5376` 在音频撤掉之后**一字未改**（R5，
    说法落在 `generation.backbone.note` 里）。
    「18 = 3 模态 × 6 组调制」这个读法因此只是解释：
    要么图像档里第三条模态位空着（权重照分配、不参与计算），要么分解不是 3×6。
    两种读法在权重上完全一样。
    **收尾条件**：哪天有人读到实现、能说出这 18 组各对应什么，
    这一条连同 `generation.backbone.note` 里那段「只是一种解释」一起删掉；
    在那之前 minimax-h3 那份记录里的同一句话也只是解释，不要当成已证的事实引用
  - >-
    图像 VAE 的编码器与 H3 视频 VAE 的编码器**逐张量同形**（116/116），
    但**权重是否逐位相同没有验到**（R4）：整文件 oid 不同，而那个文件里
    编码器与解码器打包在一起。要判只能下权重逐张量比，那是独立一轮的事。
    若逐位相同，「跨模态复用」的证据就从「文本编码器一块」扩到「编码器两块」
  - >-
    diffusers 导出**丢了原生 VAE 的 `decoder.mask_token [1, 1, 1024]`**。
    原生侧它存在，说明解码器支持某种掩码 / 局部解码；
    diffusers 那条路少这一条，意味着那条路上这个能力用不了，
    或者它在 diffusers 实现里由别的方式提供。没有验证过
  - >-
    **`MiniMax-H3-Image-PE` 是 `Qwen/Qwen3.8-27B` 的量化版，而量化方是 MiniMax 不是通义**
    （标签 `base_model:quantized:Qwen/Qwen3.8-27B`、`model_type: qwen3_5`、
    NVFP4 / modelopt，事实见 notes）。本仓已录 `qwen3.8-27b`，
    于是有一道要判的题：**它不该进那份记录的 `official_variants`** ——
    按 model-audit 规则 13，那个字段的硬闸只查「params_total 与主仓相等」，
    而「形状对得上」证明不了「这就是你那份权重的官方量化」，
    这里连量化方都换了家。现成的记法是 `official_variants_excluded`
    （逐条写 `quantized_from` 与 `params_match`）。
    **本轮没有改 `qwen3.8-27b` 那份记录** —— 它不在本次范围内；
    收尾条件：那份记录里出现一条指向 `MiniMaxAI/MiniMax-H3-Image-PE` 的
    `official_variants_excluded` 条目之后，这一条删掉
  - >-
    **文本 token 数不知道**，而文本与图像 latent 拼在同一条序列里（`in_sequence`）。
    卡只说 prompt 截断到 4096 token。所以推导给出的序列长度与注意力 FLOPs
    都是**下界**，derive 会标出来。
    `buckets[].text_tokens` 留空就是这个原因
  - >-
    **编辑模式的序列长度算不出来，而它可能比 t2i 大一个量级。**
    卡说参考图既过文本编码器、也过图像 VAE，所有 token 拼进同一条序列，
    而参考图至多 **16 张**。一张 16 MP 参考图若按同样的 32×32 折算就是
    +16,384 token，16 张就把序列推到六位数以上 —— 而注意力是 O(n²)。
    但参考图是否按原分辨率编码、有没有降采样，公开材料不说。
    **本记录的 buckets 与 derived 只覆盖 t2i**
  - >-
    `min_generation_area` 默认 4,194,304（2048×2048）会把小图**先在大画布上生成
    再 LANCZOS 缩回**。所以负载下界是 4 MP 的 4,096 token 而不是请求尺寸 ——
    这是卡上的服务端行为，**本仓没有验证它在本地 SGLang / vLLM-Omni 部署里是否同样生效**
  - >-
    训练精度无一手来源。发布权重 BF16（主干与文本编码器）+ F32
    （VAE 整体、时间步嵌入、图像入口、6 个输出头）是实测，
    但那说的是落盘格式不是训练格式
  - >-
    **平台矩阵本轮一条都没填。** 卡列了 SGLang / vLLM-Omni / diffusers / LightX2V /
    DiffSynth-Studio / ComfyUI 六条部署路径，并说 vLLM-Omni recipe 带
    per-hardware 配置与**实测时延**（H200 / RTX PRO 6000 Blackwell / MI350X）。
    **那是公开 performance 数据，这条线目前一份都没有** ——
    逐条核版本号与支持状态是独立一轮的事。昇腾侧一条都没查
  - >-
    本仓的生成线名册键仍叫 `video_families`、`video_policy` 的措辞也只讲视频，
    而这一份是图像。**现在不改**（归类口径已定：记进 `minimax-video` 家族）。
    真正该触发改名或拆线的是录第一个与视频无关的图像家族（Flux / Qwen-Image / SD
    这类）—— 那时 `docs/video-gen-gate-a.md` §7 第 15 条点名「图像侧完全没看」的
    那次调研也要补上
