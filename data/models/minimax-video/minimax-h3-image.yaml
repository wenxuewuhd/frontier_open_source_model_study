hf:
  repo: MiniMaxAI/MiniMax-H3-Image
  sha: 8ced60068623def5b74b4d10558117cb61d6482d
  last_modified: '2026-11-16T10:00:08.000Z'
  pipeline_tag: text-to-image
  gated: false

lineage:
  track: side
  predecessor: minimax-h3
  # **不是「较小档位」那种 side，是同一主干的另一个模态档。**
  # H3 仍是本家族旗舰（视频 + 音频），这一份是它的图像微调：
  # HF 标签 `base_model:finetune:MiniMaxAI/MiniMax-H3`，卡说「from the MiniMax H3 family」。
  # 和语言模型线的 minimax family（MiniMax-M3）仍然毫无关系 —— 文本编码器用的是
  # Qwen3-VL 而不是自家 M 系列，两条线连组件都没共用。
  changed_from_predecessor:
    - axis: modality
      text: >-
        音频整条支路撤掉：原生 config 的 `audio_enabled` 由 true 变 **false**，
        清单侧 **4 条音频进出口投影消失**（`audio_proj_in` / `audio_proj_out`
        的 weight 与 bias，共 349,472 参数），音频 VAE（H3 那份 151,326,585 参数 /
        605,306,340 B）不再随仓发布。视觉 VAE 从 f16t4d24 的视频 VAE
        （2,603,868,984 参数 / 10,415,475,936 B）换成图像 VAE
        （584,228,408 / 2,336,913,632 B，**1/4.46 的参数**）
      benefit: >-
        一次部署的常驻权重从 134.13 GiB 降到 126.05 GiB，少掉的两块（音频 VAE 与
        大 VAE 的解码器）都在 DiT 之外。**而 DiT 本体一个字节没省** ——
        626 条 BF16 张量的字节数两份**完全相等**（66,211,541,504 B）
    - axis: decoding
      text: >-
        单个输出投影换成**按去噪步展开的 6 个输出头**：diffusers 布局里
        H3 的 `proj_out.{weight,bias}` 不见了，换成 `pdd_proj_out.{0..5}.{weight,bias}`
        12 条；原生布局里 `final_layer.video_out` 仍在，6 个头另装在根目录的
        `pdd_fused_heads.safetensors` 里、堆成 **2 条**张量
        （`video_out.weight [6, 96, 5376]` / `video_out.bias [6, 96]`）。
        步数由 6 个 sigma 区间钉死，`num_inference_steps` 只接受 6
      benefit: >-
        6 步、每步一次前向（无 CFG）—— H3 那份 CFG 已蒸馏但**步数未知**，
        所以这是本家族第一份端到端 FLOPs 算得出来的记录。
        代价是输出层不再是一套权重：**6 个头常驻，每步只用其中一个**
    - axis: precision
      text: >-
        F32 张量从 12 条变 18 条：H3 的 12 条是时间步嵌入 4 条 + 视频/音频进出口 8 条；
        这一份是时间步嵌入 4 条 + 图像入口 `proj_in` 2 条 + **6 个输出头 12 条**，
        合计 77,814,528 B（H3 68,888,576 B）。卡把这件事说成
        「the embedding, timestep and output layers are FP32」，与清单逐项对上
      benefit: >-
        输出头单独保持 F32 是**按步展开之后才有的新面**：H3 只有一个 F32 出口
        （516,192 参数），这一份有六个
    - axis: scale
      text: >-
        主干参数 33,122,992,896 → **33,125,224,384**（+2,231,488）。
        逐因子：+6 个输出头 3,097,152 − 原 `proj_out` 516,192
        − `audio_proj_in` 177,408 − `audio_proj_out` 172,064 = +2,231,488
      benefit: >-
        规模上这不是一次扩容（+0.0067%），而是一次**出入口换装**。
        六个子系统桶里有五个与 H3 **逐位相等**，只有 `io_proj` 变了
        （28,917,632 → 31,149,120）

params:
  total: 33125224384
  # 稠密单流，没有 MoE 路由、没有跨步复用，每步对全部 token 过全部权重。
  # 但**有一处例外，是 H3 那份没有的**：6 个输出头每步只用一个，
  # 所以严格说激活参数比总量少 5 个头（2,580,960）。
  # 这里仍按总量填，差 0.0078%，理由与量化见 counting_note。
  active_decode: 33125224384
  active_prefill: 33125224384
  breakdown:
    adaln_modulation: 13055204736
    ffn: 11560550400
    self_attention: 7707046400
    token_refiner: 770730752
    text_proj: 27530496
    pdd_heads: 3097152
    norm: 542976
    patch_embed_image: 521472
  counting_note: >-
    **只含 DiT 主干，取 diffusers 布局 `transformer_diffusers/`**（12 分片 644 张量），
    逐项统计：BF16 626 条 + F32 18 条，无 scale 容器、无打包容器，numel 即参数数；
    33,125,224,384 × 加权字节 = **66,289,356,032 B**，与该目录 index.json 的
    `total_size` 逐字相同。

    **这个仓有两套并列布局，按后缀 glob 会把 DiT 与 VAE 各算两遍。**
    原生 checkpoint 在顶层 `transformer/`（531 条 `blocks.N.*`，qkv 融合、mlp 叫
    `fc1/fc2`）与 `vae/`（416 条）；diffusers 导出在 `transformer_diffusers/`
    （644 条 `transformer_blocks.N.*`，qkv 拆成 to_q/to_k/to_v）与
    `vae_diffusers/`（511 条）。两套 DiT 的**张量名集合交集只有 1 个**
    （`token_refiner.final_norm.weight`），所以合并时**连形状冲突都报不出来** ——
    `fetch_hf.py` 见到 index.json 就取全部 safetensors，这正是 `collect_shapes`
    在 M3.1-Flash 的 `dspark/` 上踩过的形状。取数用
    `--include 'transformer_diffusers/*'` 把范围收到一个组件上。

    **为什么取 diffusers 而不是原生**：已录的 minimax-h3 量的是它的顶层
    `transformer/`，而那一套是 diffusers 命名 —— 只有在同一套命名下，
    「632 条共有张量逐条同形同 dtype、零差异」这个比对才做得出来。
    注意**两份记录的目录名正好相反**：H3 的顶层是 diffusers、原生在 `FL2VA/`；
    这一份的顶层是原生、diffusers 在 `_diffusers` 后缀下。

    **两套布局的差额逐因子对平，到字节**：
    原生 33,122,643,440 参数 / 66,279,032,256 B（= 其 index.json 的 total_size），
    加上 `pdd_fused_heads.safetensors` 的 3,097,152 / 12,388,608 B，
    减去原生里那条**被输出头取代的** `final_layer.video_out` 516,192 / 2,064,768 B，
    再减去 diffusers 不带的 `rope.inv_freq` 16 / 64 B，
    得 **33,125,224,384 / 66,289,356,032 B** —— 与 diffusers 布局逐位相同。
    **所以「两套不是两个模型」这件事这一份有四个因子的对账，不只是字节数相近。**

    **三块不在这个数里**（口径与 minimax-h3 一致）：
    文本编码器 Qwen3-VL-32B 33,357,390,064 参数 / 66,714,780,128 B
    （**与 H3 仓逐位相同的同一份权重**，见 generation.text_encoders）、
    图像 VAE 584,228,408 / 2,336,913,632 B（全 F32）。
    一次 t2i 推理三块都要在，合计 **67,066,842,856 参数 /
    135,341,049,792 B（126.05 GiB）**。H3 那份是四块 69,235,578,529 /
    144,015,992,484 B（134.13 GiB）—— 差的是音频 VAE 与大 VAE 的解码器。

    **6 个输出头与「激活参数」**：每个头 516,192 参数（[96, 5376] + [96]），
    每个去噪步只用其中一个，所以单步真正过数据的是
    33,125,224,384 − 5 × 516,192 = **33,122,643,424**。
    `params.active_*` 仍填总量，差 2,580,960（0.0078%）；
    `param_scaling.per_video_token` 同样把 6 个头全算进去，
    于是单步线性 FLOPs 高 2 × 2,580,960 × token 数 —— 默认档 16,384 token 下是
    8.457e10，占单步线性项的 **0.0128%**。**量级可忽略，口径要说明**：
    六个头是常驻权重（驻留账对），但不是每步都算（算力账偏高这一点点）。

    分桶口径（`breakdown` 按**部件**，沿用 H3 那份的切法以便逐项对照）：
    `adaln_modulation` 含逐层 `adaln_proj.linear`（[96768, 2688]，96768 = 18 × 5376）、
    `norm_out.linear`（[10752, 2688]）与 `time_embedder`；
    `self_attention` 含 q/k/v 三个 [7168, 5376]、o [5376, 7168] 与 [128] 的 QK-norm；
    `ffn` 含 [28672, 5376] 的 gate+up 融合与 [5376, 14336] 的 down；
    `token_refiner` 是入口那 2 层 refiner 的全部权重；
    `pdd_heads` 是 6 个按步展开的输出头；
    `patch_embed_image` 只有入口 `proj_in`（[5376, 96]，96 = 24 latent 通道 × 1×2×2），
    **出口不在这一桶里** —— H3 的 `patch_embed_video` 1,037,664 是入口 + 出口两条，
    这一份出口被 `pdd_heads` 取代，所以这一桶 521,472 只剩入口那一半。

    **`breakdown` 与页面「按子系统」表是两套分桶，逐项对账**（与 H3 同一套换算，
    五桶数值完全相同）：
    `modulation` 13,039,369,728 = `adaln_modulation` 13,055,204,736 − `time_embedder`
    15,835,008（后者另立 `time_embed` 桶）；
    `attention` 8,015,314,944 = `self_attention` 7,707,046,400 − QK-norm 12,800
    + refiner 注意力 308,281,344；
    `dense_ffn` 12,022,972,416 = `ffn` 11,560,550,400 + refiner FFN 462,422,016；
    `norm` 583,168 = 542,976 + 12,800 + 27,392；
    **`io_proj` 31,149,120 = `patch_embed_image` 521,472 + `text_proj` 27,530,496
    + `pdd_heads` 3,097,152** —— 这是六个桶里唯一与 H3 不同的一个
    （H3 28,917,632 = 入口+出口 1,037,664 + 文本 27,530,496 + 音频进出口 349,472）。
    `breakdown.token_refiner` 在子系统轴上不存在，被摊成 attention 308,281,344
    + dense_ffn 462,422,016 + norm 27,392。
    子系统轴上**没有 `other` 桶、也没有 `audio` 桶**：644 条全部归进词表，
    而音频塔这一份压根没有。`pdd_proj_out.N.*` 落 `io_proj` 是
    `(?:^|[._])proj_(?:in|out)\b` 命中的（下划线算 `[._]`），**归类正确、无需改共享词表**。

    **`modulation` + `time_embed` == `param_scaling.per_sample` 这条恒等在这一份也成立，
    而且是逐位相等**：13,039,369,728 + 15,835,008 = 13,055,204,736，两边张量集合完全相同
    （各 106 条：50 层 × 2 个 `adaln_proj.linear` + `norm_out.linear` 2 条
    + `time_embedder` 4 条），双向取差都是空集。前提仍是**单流**（见 H3 那份的作用域说明）。
    本仓这是第 **5** 份带 `param_scaling` 的记录，成立 4 份、
    hunyuanvideo-1.5 不成立（原因在 `scripts/lib/subsystems.py` 里拆清了）。
    占主干 **39.40%**（H3 39.41%，差的那一点是分母变大）。

generation:
  backbone:
    stream_design: single
    layers: 50
    double_blocks: 0
    single_blocks: 50
    hidden: 5376
    heads: 56
    head_dim: 128
    head_dim_note: >-
      **heads × head_dim = 7168 ≠ hidden 5376**，与 H3 逐字相同：
      q/k/v 是 [7168, 5376]、o 是 [5376, 7168]（权重实测）。
      注意力内维比残差流宽 33%，拿 hidden 去推注意力投影的规模会低估三分之一
    ffn: 14336
    refiner_layers: 2
    text_conditioning: in_sequence
    param_scaling:
      per_sample: 13055204736
      per_video_token: 20070019648
      note: >-
        **AdaLN 调制是逐样本的，占主干 39.40%。** 形状上就能断定，判据与 H3 同一条：
        `adaln_proj.linear` 是 [96768, **2688**] 而 hidden 5376 ——
        入口宽度不等于 token 宽度，不可能在吃 token 流；2688 正是
        `time_embedder.linear_2` 的出口（[2688, 5376]），
        两份 config 的 `time_embed_dim: 2688` 是第三路印证。
        **`per_sample` 与 H3 逐位相同**（13,055,204,736），
        因为那 106 条张量在两份里同名同形同 dtype。

        桶名沿用 `per_video_token`，但这一份**没有视频**：它实际是「逐序列 token」
        —— 图像 latent token 与文本 token 拼在同一条序列里
        （`text_conditioning: in_sequence`，卡原话「All tokens form one packed
        sequence」），编辑模式下还要加上参考图的 latent token。记录没给文本长度，
        所以推导出的序列长度是**下界**。

        `per_video_token` 比 H3 多 2,231,488，全部来自 `io_proj` 那一桶的换装
        （+6 头 3,097,152 − 原出口 516,192 − 音频进出口 349,472）。
        **其中 5 个头每步不算** —— 单步线性项因此高 0.0128%，
        量化与理由见 `params.counting_note`
    patch_size: [1, 2, 2]
    position: 3D MM-RoPE (t, h, w)，rope_freq_dim 16、rope_theta 10000
    note: >-
      **主干与已录 minimax-h3 的差异只有出入口**：diffusers 命名下两份清单
      644 vs 638 条，**共有 632 条逐条同形同 dtype、零差异**；
      只这一份有的 12 条全是 `pdd_proj_out.{0..5}`，只 H3 有的 6 条是
      `audio_proj_in/out` 与 `proj_out`。卡原话 "the same as the
      H3-Omni-Transformer" 与 "without the audio layers" 都对得上，
      而**清单比那句话更紧** —— 它说的是 50 层里的注意力、FFN、AdaLN、norm
      **一个字节都没动**（626 条 BF16 合计 66,211,541,504 B，两份相等）。

      patch 三路一致：两份 config 的 `patch_size` [1,2,2]、
      `proj_in.weight [5376, 96]`（96 = 24 × 1×2×2）、
      以及卡的「patchifies the latent with a 2x2 patch, so each transformer token
      covers 32x32 pixels」。时间维 1 是退化的 —— 图像只有一帧。

      AdaLN 那 96768 = 18 × 5376 在这一份仍然是 **18**，而不是降到 12：
      H3 的 96768 读作「3 种模态 × 6 组调制」，音频撤掉之后这个数**一字未改**
      （两份 config 的 `adaln_out_features` 相同、张量同形）。
      **所以「18 = 3 × 6」这个读法在这一代只是一种解释，不是权重能证明的事** ——
      要么第三条模态位在图像档里空着，要么分解根本不是 3×6。见 open_questions

  vae:
    spatial_compression: 16
    latent_channels: 24
    decoder_arch: transformer
    params: 584228408
    name: H3-Image VAE（CNN 编码器 + 24 层 2D ViT 解码器）
    note: >-
      **编码器与 minimax-h3 的视频 VAE 逐张量同形**：diffusers 命名下两侧各 116 条，
      **116/116 同名同形同 dtype**，合计 180,335,536 参数 / 721,342,144 B，
      `quant_conv.weight` 两侧都是 [48, 48, 1, 1, 1]（**5 维，仍是 3D 卷积**）。
      换掉的是解码器：403,889,920 参数 / 391 条（H3 2,423,530,496 / 583 条，
      **这一份是 1/6**），`vit_decoder_2d: true`、24 层 / 16 头 × 64 dim_head
      （H3 是 36 层 / 32 头），`post_quant_conv.weight` 从 [24,24,1,1,**1**]
      降成 [24,24,1,1] —— **解码入口由 3D 卷积改成 2D，编码侧没改**。

      **「编码器权重是否逐位相同」没有验到。** 整文件 LFS oid 不同，但那个文件里
      编码器和解码器打包在一起，**整文件不同推不出编码器不同** ——
      要判只能下权重逐张量比，本次没做。形状与 dtype 全同是目前的上限。

      `temporal_compression` **按 schema 留空**（image-gen），但要注意
      `vae_diffusers/config.json` **仍带 `temporal_downsample_factors: [1,2,2,1,1,1]`
      （连乘 4）与 `vae_clip_length: 17`** —— 编码器的时间栈原封不动留着，
      只是图像只有一帧、用不上。`vae_token_drop` 从 H3 的 3 变成 **0**，
      这正是 H3 那条 `T = ceil(F/17)×5 − 3` 里被减掉的那个 3。
      **所以这一份没有 H3 R3 那个「块内卷积比 ≠ 端到端比值」的坑** ——
      单帧没有分块。
      `causal` 留空：配置里没有 `causal_encoder` / `causal_decoder` 这两个键，
      而单帧上时间因果性不可判，不替它填。

      两套布局的 VAE 差 **1,024 个参数**，逐因子对平：原生 `vae/`
      584,229,432 / 416 条带一条 `decoder.mask_token [1, 1, 1024]`，
      **diffusers 导出把它丢了**（584,228,408 / 511 条）。
      其余全是改名（`to_qkv` 拆成 `to_q/to_k/to_v`、`ff.w1/w2` 换成
      `ff.net.0.proj/net.2`、`x_embedder` 换成 `proj_in`、
      `encoder.down.N.block` 换成 `encoder.down_blocks.N.resnets`）。
      本记录填 diffusers 那个数以与 params 同布局；
      **`mask_token` 掉了意味着 diffusers 这条路少一个能力**，见 open_questions

  text_encoders:
    - role: primary
      name: Qwen3-VL-32B（取第 50 层 hidden state，与 MiniMax-H3 同一份权重）
      hf_repo: Qwen/Qwen3-VL-32B
      ref_external: Qwen/Qwen3-VL-32B
      params: 33357390064
      hidden: 5120
      shipped_with_weights: true
      gated: false
      release_dtype: BF16
      hidden_layer_taken: 50
      substitutable: false
      note: >-
        **本仓第一份「同一主干跨模态复用」的逐位证据。**
        `text_encoder/` 的 14 个分片与 MiniMax-H3 仓的
        `text_encoder/`、`FL2VA/text_encoder/`、`Ref2VA/text_encoder/`
        **LFS sha256 两两相同**（14/14，合计 66,714,912,872 B）；
        连同 `text_encoder/` 下 9 个非 LFS 文件、`tokenizer/` 4 个、`processor/` 7 个
        （git blob sha1 逐个相同），**共 34 个文件、66,749,500,959 B（62.165 GiB）
        与 H3 仓逐位相同**。厂商自己在 `model_index.json` 里写明了这件事：
        原生那条装载路径直接从 `MiniMaxAI/MiniMax-H3` 的 `text_encoder/` 取。
        卡的说法是「the full Qwen3-VL text encoder of MiniMax-H3, **unchanged**」。

        参数量 33,357,390,064 / 66,714,780,128 B **不是在这一份上重测的** ——
        权重逐位相同，所以 numel 必然相同，数字引自 minimax-h3 那份记录的实测。
        config 侧本次复核过：text 64 层 / hidden 5120 / 64 头 / 8 KV 头 /
        intermediate 25600 / vocab 151936，vision 27 层 / hidden 1152 /
        patch 16 / out_hidden 5120 —— 与 H3 的 `text_encoder/config.json`
        **git blob oid 相同**，即同一份文件。

        **它仍然比 DiT 本体大**：参数 1.0070 倍、字节 1.0064 倍。
        取第 50 层（共 64 层）意味着后 14 层推理时可以不跑，但权重照发。
        编辑模式下参考图也由它编码（卡：「the reference images are encoded by
        the H3 text encoder」），所以这一侧的负载随参考图数量涨 —— 至多 16 张

  sampling:
    steps: 6
    cfg:
      scale: 1
      distilled: true
      embedded: false
      forwards_per_step: 1
    step_distilled:
      available: true
      steps: 6
      checkpoint: MiniMaxAI/MiniMax-H3-Image（就是这一份，没有未蒸馏版）
      note: >-
        **CFG 蒸馏与步数蒸馏两根轴在这一份上都拉满了，而且不可调。**
        卡原话「distilled to 6 sampling steps (6 NFEs) with no
        classifier-free guidance」；服务端把它做成硬约束：
        `num_inference_steps` 省略或 6、`guidance_scale` 省略或 1，
        其它值返回 HTTP 400，`negative_prompt` 直接拒收。
        `pdd_config.json` 与 `modular_model_index.json` 各存一份同样的 7 个 sigma
    scheduler: MiniMaxH3Scheduler（flow matching，euler / velocity 形式）
    note: >-
      **这是本家族第一份端到端 FLOPs 算得出来的记录** —— H3 那份卡与厂商脚本都不给步数
      （见它的 R5），这一份把步数钉成了常数表：6 个 sigma 区间
      [1.0, 0.9675, 0.8876, 0.75, 0.5328, 0.2320, 0.0]（7 个端点），
      两处文件逐值相同。`shift_provided_sigmas: false` 说明**没有 shift 折算**，
      与 H3 的视频 / 音频两套 sigma_shift（12.0 / 3.0）形成对照。
      每步一次前向（CFG 已蒸馏），所以端到端 = 6 × 单步

  pipeline_stages:
    - name: H3-Image-Context-IR
      model: 未开源（托管服务 /v1/h3_image_context_ir）
      open_source: false
      note: >-
        把任意语言的短提示改写成详细英文描述，并选定 size。
        **这一段未开源**，卡只给 API；仓里的 `examples/context_ir.py` 是调
        `/v1/h3_image_context_ir` 的客户端脚本（读 `MINIMAX_API_KEY`），
        **不是权重** —— 这一点与 H3 记录里「Context-IR 未开源」的结论一致，
        不要把那个脚本当成开源了。
        官方给的本地替代是 `MiniMaxAI/MiniMax-H3-Image-PE`（见 notes），
        **那不是 MiniMax 自己的模型**
    - name: H3-Image 生成 / 编辑
      model: same-backbone
      steps: 6
      forwards_per_step: 1
      out_width: 4096
      out_height: 4096
      open_source: true
      note: >-
        本记录覆盖的就是这一段，t2i 与 edit 同一个 checkpoint。
        **没有 upscaler 段** —— 卡明说 16 MP 是直出（「directly and without an
        upscaler」），与 H3 的 Regenerate-2K 那一段形成对照

  buckets:
    - width: 4096
      height: 4096
      default: true
      note: >-
        1:1 的 16 MP 档，卡 §Sizes 表第一行，也是 §Highlights 点名的
        「16 megapixel (4096 × 4096)」。16,777,216 像素 /（32×32）=
        **16,384 latent token**。官方 `examples/revised_size.edit.txt` 这一档
    - width: 4736
      height: 3552
      note: 4:3，16,822,272 像素 → 148 × 111 = 16,428 token。官方 `examples/request.t2i.json` 用的就是这一档
    - width: 5024
      height: 3360
      note: 3:2，16,880,640 像素 → 157 × 105 = 16,485 token（五档里 token 最多的一档）
    - width: 5472
      height: 3072
      note: 16:9，16,809,984 像素 → 171 × 96 = 16,416 token
    - width: 6272
      height: 2688
      note: 21:9，16,859,136 像素 → 196 × 84 = 16,464 token（卡上最宽的一档）

  constraints:
    width_divisor: 32
    height_divisor: 32
    note: >-
      除数 32 = VAE 空间压缩 16 × DiT patch 2，**卡自己把它写成了结论**
      （「each transformer token covers 32x32 pixels」），
      而不是像 H3 那样要从「有效 32× 空间下采样」推。
      卡 §Sizes 的五档 10 个边长**全部被 32 整除**，逐个验过。
      **没有帧数约束** —— 单帧，H3 那条 `17n+5` 在这一份上不存在。

      另有一条 H3 没有的服务端约束：`min_generation_area` 默认 **4,194,304**
      （2048×2048 = 4 MP），比它小的 `size` 会**先在更大的画布上生成、
      再用 LANCZOS 缩回**，传 1024 才关掉。
      所以「请求了小图」不等于「算得少」：**负载下界是 4 MP 的 token 数
      （4,096 token），不是请求的尺寸**。
      卡说有效工作区间约 4–20 MP、16 MP 附近最好

  checkpoint_variants:
    - name: transformer_diffusers（diffusers 导出）
      role: base
      bytes: 66289356032
      resident: true
      note: 本记录的 params 量的就是它。6 个输出头已折进这套清单
    - name: transformer + pdd_fused_heads.safetensors（原生）
      role: base
      bytes: 66291420864
      resident: false
      note: >-
        **同一份权重的另一种存法，不是第二个模型** —— 四因子对账见
        `params.counting_note`。66,279,032,256 + 12,388,608；
        其中 `final_layer.video_out`（2,064,768 B）被 6 个头取代、照卡的说法不再使用。
        SGLang / vLLM-Omni 走的是这一套（`model_index.json`），
        diffusers 走另一套（`modular_model_index.json`）。
        **两套都在仓里，但一次部署只用一套**
    - name: text_encoder（Qwen3-VL-32B）
      role: text-encoder
      bytes: 66714780128
      resident: true
      note: >-
        与 MiniMax-H3 仓逐位相同（14 个分片 LFS oid 两两相同）。
        原生那条装载路径从 H3 仓取，**已经有 H3 的人不会重复下载**
    - name: vae_diffusers
      role: vae
      bytes: 2336913632
      resident: true
      note: 原生 `vae/` 是 2,336,917,728 B，多一条 `decoder.mask_token`
    - name: MiniMax-H3-Image-PE
      role: prompt-expander
      bytes: 17937191286
      resident: false
      note: >-
        **不是 MiniMax 的模型** —— HF 标签 `base_model:quantized:Qwen/Qwen3.8-27B`、
        `model_type: qwen3_5`、NVFP4（`quantization_config` 实测
        num_bits 4 / group_size 16 / modelopt）。它是未开源的 Context-IR 的本地替代，
        卡把它列在 Model Zoo 里并归在同一份许可下。
        列在这里是为了把「它要不要常驻」说清楚：**不要**，提示改写跑完就可以卸。
        详见 notes

precision:
  weights_release: [BF16, FP32]
  weights_release_scope:
    BF16:
      manifest_taken: true
      in_precision_table: true
      repo: MiniMaxAI/MiniMax-H3-Image
      note: >-
        DiT 的 626 / 644 条是 BF16（注意力 208、FFN 104、调制 102、norm 210、
        文本入口 `context_embedder` 2 条 —— 加起来正好 626，**与 H3 那份逐桶相同、
        字节合计也相同：66,211,541,504 B**）。文本编码器 1058 条全 BF16
        （同一份权重，未重测）。卡的 Model Zoo 表写「BF16 (DiT)」
    FP32:
      manifest_taken: true
      in_precision_table: true
      repo: MiniMaxAI/MiniMax-H3-Image
      note: >-
        **这一份的 F32 是 18 条，比 H3 多 6 条，而卡这次自己说了**
        （「the embedding, timestep and output layers are FP32」，与清单逐项对上）：
        时间步嵌入 4 条（`time_embedder.linear_1/2` 的 weight 与 bias，15,835,008 参数）、
        图像入口 `proj_in` 2 条（521,472）、**6 个输出头 12 条（3,097,152）**。
        合计 77,814,528 B（H3 68,888,576 B）。
        图像 VAE 的 416 / 511 条**全部** F32（卡也写了「Image VAE, FP32」）。
        即「BF16 模型」说的是主干与文本编码器，**VAE 整体与进出口 / 时间步是 F32**
  quantization:
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      modulation: BF16
      norm: BF16
      io_proj: MIXED
      time_embed: FP32
    subsystem_method: >-
      **对 diffusers 布局的完整权重清单 644 条逐项穷举，不是抽样**：12 个分片的
      `weight_map` 全覆盖、`failed_shards` 为空、`duplicate_tensors` 为 0，
      626 BF16 + 18 F32，numel × 每元素字节 = 66,289,356,032 B 与
      `transformer_diffusers/` 的 index.json `total_size` 逐字相同。
      取数用 `fetch_hf.py --include 'transformer_diffusers/*'` 把范围收到一个组件上
      （不收窄会把两套布局各算一遍，见 `params.counting_note`）。

      **六个桶里仍然只有 `io_proj` 一个是混的，另外五个与 H3 逐位相同。**
      18 条 F32 落在两个桶：`time_embed`（4 条、15,835,008，**整格 100% F32**）、
      `io_proj`（`proj_in` 2 条 + `pdd_proj_out.{0..5}` 12 条，共 3,618,624 F32，
      与同桶 BF16 的 `context_embedder` 27,530,496 并存）。

      **`io_proj` 报 MIXED 的判据与 H3 同一条**：这一桶装齐了这份模型的全部进出口投影
      —— 图像入口 `proj_in`（F32）、文本入口 `context_embedder`（BF16，
      它接的正是 BF16 的文本编码器）、按步展开的 6 个出口（F32）——
      **每一半都货真价实属于这个桶**，所以是真混合，不是「多数值 + 异类」。
      而占比在这一格上仍然自相矛盾，这也是不能报代表值的理由：
      按元素数 88.38% 是 BF16（27,530,496 / 31,149,120），
      按条目数 87.5% 是 F32（14/16）—— 两套计数基各指一个「多数」。
      报 BF16 会让「图像入口与 6 个输出头是 F32」从表上消失，
      报 FP32 会让文本入口消失。

      没有 quantization_config、没有 scale 容器、没有低位打包，所以**本记录没有
      `per_subsystem_scale` / `per_subsystem_block` 两个字段**。

      **空桶不补行，理由与 H3 同**：`other` 空是因为 644 条没有一条归不进词表；
      `audio` 空是因为按功能分桶之后它量的是音频塔 / 音频编码器，
      **而这一份连 H3 那 32 通道的音频 latent 进出口都撤掉了**（`audio_enabled: false`）
      —— 这一格的「不适用」在这一份上比 H3 更彻底。
      `embed` / `lm_head` / `vision` 三行仍要当心：**仓里有，只是不在这张表的作用域内**
      —— 随仓的 Qwen3-VL-32B 自带 vocab 151936 的词表与 27 层视觉塔，
      那 1058 条属于 `generation.text_encoders`；图像 VAE 的 416 条同理。
      这正是「锚在内侧只守得住内侧」那条规矩的落点：**本表绿不代表这个仓的精度全查过**。

      **这张表的作用域是 `transformer_diffusers/` 一个组件。** 其上缺的桶的「不适用」
      说的是 DiT 主干里没有：稠密单流、没有 MoE（无 `expert` / `shared_expert` /
      `router`）、不建 KV 账（无 `compressor` / `indexer`）、没有检索表、
      没有残差系数张量、没有 MTP 块 —— 依据就是上面这次穷举。

      **按步展开的输出头不是 MTP、也不是草稿头。** 名字里没有 mtp / draft，
      `subsystems.py` 的 `draft` 词条一条都不命中（实跑确认落 `io_proj`）。
      它展开的轴是**去噪步**，不是未来 token；6 个头形状完全相同、
      每步只用一个，没有「用小模型猜、大模型验」那套结构。
      这件事要是标错，页面上会长出一个不存在的投机解码范式。
      **而「没命中」这一条是机械验过的，不只是这里的断言**：
      `derive_paradigms.py` 跑在 61 份记录上，speculative-decoding 那条**在场**
      （命中 25 份），而这一份五条范式一条都没命中 —— `paradigms.json` 里
      搜不到 `minimax-h3-image`。先有「断言在场」才轮到「断言缺席」
  inference_default: BF16

bottlenecks:
  - dimension: host-io
    finding: >-
      「33.1B」只说 DiT。一次 t2i 推理要同时驻留 DiT、Qwen3-VL-32B 文本编码器、
      图像 VAE 三套权重，而**文本编码器仍比 DiT 本体大**。
      相对 H3 省下的 8.08 GiB 全在 DiT 之外（音频 VAE 撤掉、VAE 解码器缩到 1/6），
      **主干一个字节没省**。维度记 host-io 而不是容量，沿用本线的同一判断
    quantified: >-
      DiT 66,289,356,032 B + 文本编码器 66,714,780,128 B + 图像 VAE 2,336,913,632 B
      = 135,341,049,792 B（**126.05 GiB**）；参数合计 67,066,842,856。
      文本编码器 / DiT = 1.0070（参数）、1.0064（字节）。
      H3 四块是 144,015,992,484 B（134.13 GiB）
    fix: >-
      文本编码器每次生成只跑一遍且只取到第 50 层（共 64 层），DiT 要跑满 6 步 ——
      错峰机会与 H3 相同，且这里还能截断后 14 层。
      **但编辑模式下这条机会变小**：参考图也要过文本编码器，至多 16 张。
      厂商给的部署基线是 4 卡 Ulysses 序列并行（`--usp 4 --text-encoder-tp-size 4`）
    visibility: public
  - dimension: compute
    finding: >-
      **16 MP 的图像比 10 秒 768p 视频「短」得多，所以瓶颈侧换边了。**
      H3 默认档序列 72,981 token、注意力占单步 **66.2%**；
      这一份默认档 16,384 token（不含文本），注意力占比掉到 **30.5%**，
      单步近七成是线性项。**同一个主干、同一套权重，两条产品线的瓶颈不在同一侧**
    quantified: >-
      序列 token 16,384（4096×4096 ÷ 32²）对 H3 的 72,981 —— **1/4.454**；
      注意力项随 n² 走，于是掉到 **1/19.84**（2.886e14 对 5.727e15），
      而线性项只掉到 1/4.454 的因子上（6.577e14 对 2.929e15）——
      于是单步合计 9.463e14 对 8.656e15、注意力占比 30.5% 对 66.2%。
      逐值见 `data/derived/minimax-h3-image.json`，
      两份的单步分解可直接并排比（口径同一套：同样的 `param_scaling` 两桶公式）
    fix: >-
      图像档上优先优化线性层与权重搬运（这一侧与语言模型 decode 同形），
      视频档上优先优化注意力。**不要拿一条线的 kernel 优先级套另一条**
    visibility: public
  - dimension: compute
    finding: >-
      AdaLN 调制分支占主干 39.40%，与 H3 几乎逐位相同（13,055,204,736）。
      卡在这一份上**没有**重复 H3「输出可预计算缓存」那句话，所以那条机会在这里
      连厂商声明都没有
    quantified: >-
      `params.breakdown.adaln_modulation` 13,055,204,736 / 33,125,224,384 = 39.40%，
      等于子系统轴 `modulation` 13,039,369,728 + `time_embed` 15,835,008（逐位相等）。
      每层 `adaln_proj.linear` [96768, 2688]
    fix: >-
      与 H3 同：先验「预计算后实际驻留多少」再谈收益。
      **不要用 33.13B − 13.06B = 20.07B 当驻留量** —— 那是把参数量与激活字节相减
    visibility: public
  - dimension: compute
    finding: >-
      **6 步、每步一次前向，是这一份相对整条线最大的结构性优势** ——
      步数不是默认值而是硬约束（其它值 HTTP 400），所以端到端算得出来、
      也没有「用户调高步数」这条尾部风险。代价是输出层变成 6 套常驻权重
    quantified: >-
      端到端 = 6 × 1 × 单步（见 derived 的 `end_to_end_terms`）。
      6 个头 3,097,152 参数 / 12,388,608 B 常驻，**每步只用 1 个**；
      多算的 5 个让单步线性项高 0.0128%
    fix: >-
      记在这里是为了跨记录对照时不要把两份的「步数」直接比 ——
      H3 的步数至今未知（它的 R5）
    visibility: public

infra_signals:
  - text: >-
      **同一套算子表可以覆盖两条产品线，这一份是本仓第一份逐位证据。**
      H3-Image 与 H3 的 DiT 在 diffusers 命名下 632 条共有张量**逐条同形同 dtype**，
      626 条 BF16 的字节合计两份完全相等；文本编码器与 tokenizer / processor
      共 34 个文件**逐位相同**（62.165 GiB）。
      跨模态复用在这一代不是「架构相似」，是同一批权重加换一个出入口
    evidence: derived
  - text: >-
      **「图像生成比视频便宜」在序列长度上成立，在驻留权重上不成立。**
      16 MP 图像的 latent 序列只有 10 秒 768p 视频的 1/4.45，
      而一次部署仍要 126.05 GiB（H3 134.13 GiB）—— 省下的 6% 全在 VAE 与音频侧，
      主干与文本编码器一个字节没动。生成类的「模型多大」和「一次算多少」
      是两根互不相关的轴
    evidence: derived
  - text: >-
      **把输出层按去噪步展开（PDD）是本仓没见过的 infra 形状，而它便宜得不像一个范式。**
      6 个头合计 3,097,152 参数 / 12 MB，占主干 0.0093%，却把采样步数从未知变成常数 6。
      它不是 MTP、不是草稿头：展开的轴是去噪步而不是未来 token，
      6 个头同形、每步只用一个。infra 侧要准备的是「按步选权重」这个访存形态，
      不是一套投机解码流程
    evidence: judgement
  - text: >-
      **模型卡的仓内账会过期，而过期的方向是「少算」。**
      这张卡的 68.65 GB 与「文本编码器不在本仓」与首个提交逐字对得上，
      同日第二个提交加进 text_encoder 与两套 diffusers 导出之后仓变成 190.00 GiB，
      卡又被改过两次都没跟上。**按卡读会少 62 GiB，而卡自身内部是自洽的** ——
      这类错读靠读卡读不出来，只能拿文件树当锚
    evidence: derived

