id: minimax-h3-image
family: minimax-video
kind: image-gen
display_name: MiniMax-H3-Image
released: '2026-11-10'
license: other
license_restriction: >-
  MiniMax-H3-Image Community License Agreement（与 H3 的那份不是同一个文件：
  18,208 B vs 17,604 B，git blob oid 不同）。卡写明 §IV 的单独书面授权走
  platform.minimax.io/console/license 申请。可选的 H3-Image-PE 也归在这同一份许可下
visibility: public

# **本家族第二份记录，也是本仓第一份 `kind: image-gen`。**
#
# 归类口径（2026-11-18 由用户定）：**记进现有 `minimax-video` 家族，不新开 family、
# 不把生成线按模态拆成两张名册。** 理由是这一份不是一条新产品线的开端 ——
# 它是 H3 这一个系统的图像档：transformer 的 632 条共有张量与已录 minimax-h3
# **逐条同形同 dtype、零差异**，文本编码器与 tokenizer / processor 共 34 个文件
# 与 H3 仓**逐位相同**。真正该触发「拆线」的是录第一个与视频无关的图像家族
# （Flux / Qwen-Image / SD 这类），那时 `video_families` 这个键名与
# `video_policy` 的措辞要一起改，见 open_questions。
#
# 取数口径沿用 minimax-h3：params.total 只算 DiT 主干、不建 arch 块、没有 KV 这笔账。
# **但「哪套布局算主干」这件事本仓要翻过来读**：H3 的顶层 `transformer/` 是
# diffusers 命名（638 条 `transformer_blocks.N.*`），而这个仓的顶层 `transformer/`
# 是**原生命名**（531 条 `blocks.N.*`、qkv 融合），diffusers 那套在
# `transformer_diffusers/`（644 条）。照后缀 glob 会把 DiT 与 VAE 各算两遍，
# 两套的张量名**交集只有 1 个**（`token_refiner.final_norm.weight`），
# 所以连形状冲突都报不出来。本记录取 **diffusers 布局**，理由见 counting_note。

sources:
  - kind: modelcard
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3-Image
    locator: README.md §Introduction / §Model Architecture / §Model Zoo @ 8ced60068623
    accessed: '2026-11-18'
    note: >-
      官方口径来源。卡上直接给出的：生成与编辑**统一在一个 checkpoint**
      （t2i + image editing，支持至多 16 张参考图）；直出约 16 MP、
      4096×4096(1:1) 到 6272×2688(21:9)、**不走 upscaler**；
      发布权重**蒸馏到 6 步（6 NFE）且无 CFG**；
      DiT 是「the H3 architecture without the audio layers」、
      33.1B 稠密单流、50 层 / hidden 5376 / 56 头 / FFN 14336 / 3D MM-RoPE，
      原话 **"the same as the H3-Omni-Transformer"**；
      文本编码器是「the full Qwen3-VL text encoder of MiniMax-H3, **unchanged**」、
      仍取**第 50 层** hidden state；图像 VAE 是「a CNN encoder and a 2D ViT
      decoder (24 layers)」、16× 空间下采样 / 24 latent 通道，
      **"each transformer token covers 32x32 pixels"**；
      权重 BF16，而「the embedding, timestep and output layers are FP32」
  - kind: modelcard
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3-Image
    locator: README.md §Quick Start 的 Download 表与目录树、§Request parameters、§Sizes @ 8ced60068623
    accessed: '2026-11-18'
    note: >-
      部署口径：`transformer/` 66.28 GB、`pdd_fused_heads.safetensors` + `pdd_config.json`
      12 MB（原话 **"the per-step output heads that replace the transformer's
      output layer, and the sampling schedule"**）、`vae/` 2.34 GB FP32、
      `tokenizer/` + `processor/` 23 MB「identical to MiniMax-H3」、
      文本编码器 66.7 GB 标注为 **"Not in this repository"**。
      **最后那一句与当前文件树冲突，但它不是写错了，是过期了** —— 见 review R1。
      请求参数侧：`num_inference_steps` 只接受省略或 **6**（其它值 HTTP 400）、
      `guidance_scale` 只接受省略或 **1**、`negative_prompt` 直接拒收、
      prompt 截断到 4096 token、`min_generation_area` 默认 4,194,304（2048×2048）
  - kind: repo
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3-Image/blob/main/transformer/config.json
    locator: transformer/config.json 与 transformer_diffusers/config.json 全量字段 @ 8ced60068623
    accessed: '2026-11-18'
    note: >-
      两份 config 互相印证且与已录 H3 逐项相同：`hidden_size` 5376 / `num_layers` 50 /
      `num_attention_heads` 56 / `attention_head_dim` 128 / `ffn_hidden_size` 14336 /
      `latents_dim` 24 / `patch_size` [1,2,2] / `text_dim` 5120 /
      `time_embed_dim` 2688 / `adaln_out_features` **96768** /
      `final_adaln_out_features` 10752 / `timestep_input_dim` 256。
      两处只有这一份有：原生那份的 **`audio_enabled: false`**（H3 的同名键为 true）、
      diffusers 那份的 **`num_pdd_heads: 6`** —— 即「6 个」是 config 明写的，
      不是从张量名数出来的
  - kind: repo
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3-Image/blob/main/pdd_config.json
    locator: pdd_config.json 与 modular_model_index.json 的 sample_sigmas @ 8ced60068623
    accessed: '2026-11-18'
    note: >-
      采样调度是**钉死的常数表**，两处逐值相同：`num_inference_steps: 6` 与 7 个
      sigma [1.0, 0.9675236940383911, 0.8875485062599182, 0.75, 0.5327739119529724,
      0.23200887441635132, 0.0]。`scheduler/scheduler_config.json` 给出
      `MiniMaxH3Scheduler` / `euler_update_form: velocity` /
      `shift_provided_sigmas: false` —— **没有 shift**，sigma 直接用表里的值
  - kind: repo
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3-Image/blob/main/model_index.json
    locator: model_index.json 与 modular_model_index.json 的 text_encoder 条目 @ 8ced60068623
    accessed: '2026-11-18'
    note: >-
      **两条装载路径指向不同的仓，这解释了为什么卡与文件树都没错**（R1）：
      `model_index.json`（`MiniMaxH3ImagePipeline`，原生布局）的 text_encoder 写
      `pretrained_model_name_or_path: MiniMaxAI/MiniMax-H3` + `subfolder: text_encoder`，
      即从 **H3 仓**取；而 `modular_model_index.json`
      （`MiniMaxH3ImageModularPipeline`，diffusers 布局）把**每个**组件都写成
      `MiniMaxAI/MiniMax-H3-Image` + 各自的 subfolder，text_encoder 指**本仓**。
      前者还带 `_minimax_h3.partition: image` 与 `tasks: ["t2i", "edit"]`，
      与 H3 的 `fl2va` / `ref2va` 两个分区同构
  - kind: repo
    url: https://huggingface.co/MiniMaxAI/MiniMax-H3-Image/tree/main
    locator: HF tree API（recursive + expand，三页游标）100 个文件的 size 与 LFS/git oid @ 8ced60068623
    accessed: '2026-11-18'
    note: >-
      权重清单与跨仓比对的一手来源，**没有下权重**：逐分片 Range 读 safetensors 头，
      跨仓同一性按 oid 判（LFS 文件按 LFS sha256、文本文件按 git blob sha1）。
      按组件分开统计：`transformer_diffusers/` 12 分片 644 张量、
      `transformer/` 12 分片 531 张量、`vae/` 单文件 416 张量、
      `vae_diffusers/` 单文件 511 张量、`pdd_fused_heads.safetensors` **2** 张量、
      `text_encoder/` 14 分片。全仓 100 个文件合计 204,016,543,520 B（190.005 GiB）
  - kind: repo
    url: https://huggingface.co/api/models/MiniMaxAI/MiniMax-H3-Image/commits/main
    locator: commits/main 全部 11 条，以及 7b6142f879 / 492fd8c4ec 两个修订的文件树 @ 2026-11-18
    accessed: '2026-11-18'
    note: >-
      提交史是 R1 与 `released` 这两条判断的依据：首个提交 **7b6142f879
      (2026-11-10T14:50:23Z)** 就带全部原生权重（transformer 12 分片 + vae + pdd heads，
      模型文件合计 68,651,473,216 B = 卡上 Model Zoo 的 **68.65 GB**，逐字对上）；
      同日 **492fd8c4ec (16:21:40Z)**「Add diffusers format weights (#2)」一次加进
      `text_encoder/` + `transformer_diffusers/` + `vae_diffusers/` + `scheduler/`
      + `modular_model_index.json`。之后 README 又被改过两次（#8 / #18），
