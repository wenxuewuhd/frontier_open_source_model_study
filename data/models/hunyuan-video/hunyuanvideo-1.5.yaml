id: hunyuanvideo-1.5
family: hunyuan-video
kind: video-gen
display_name: HunyuanVideo-1.5
released: '2025-11-20'
license: other
license_restriction: >-
  腾讯混元社区许可。模型卡的 front-matter 带 `extra_gated_eu_disallowed: true`，
  即欧盟不可用。和 minimax-h3 的「按地区申请」是两种不同的限制形态，
  但后果同类：决定这套权重能不能进某个部署区域
visibility: public

# 视频线第三份记录，口径沿用 wan2.2-ti2v-5b 定下的三条：
# params.total 只算 DiT；不建 arch 块；没有 KV cache 这笔账。
#
# 这一份的特点是**多 checkpoint 矩阵**：11 套各 33.3 GB 的 DiT（分辨率 × 任务 ×
# 蒸馏 × 稀疏 × 超分），LFS oid 两两不同，一套都没有复用。
# params 取 720p_t2v，理由见 counting_note。

sources:
  - kind: modelcard
    url: https://huggingface.co/tencent/HunyuanVideo-1.5
    locator: README.md §Introduction / §Key Features / §Optimal Inference Configurations @ 9b49404b3f5d
    accessed: '2026-10-31'
    note: >-
      官方口径来源。卡上直接给出的：8.3B DiT + 3D 因果 VAE，空间 16× / 时间 4×；
      SSTA（Selective and Sliding Tile Attention）「prunes redundant spatiotemporal
      kv blocks」，10 秒 720p 端到端相对 FlashAttention-3 加速 **1.87×**；
      另有少步超分网络把输出升到 1080p；训练用 Muon 优化器；最低显存 14 GB（开 offload）。
      §Optimal Inference Configurations 给了完整的采样表（CFG / flow shift / 步数），
      并加粗强调「the cfg distilled model we provided, must use 50 steps」。
      **加速比 1.87× 没有给基线配置，只作定性参照，没有写进 performance**
  - kind: paper
    url: https://arxiv.org/html/2511.18870v2
    locator: Table 1（架构超参）、§3.1（VAE / 文本编码器 / SSTA）、§3.2 与 §4.3（超分）、§6 Table 7–8（速度）
    accessed: '2026-10-31'
    note: >-
      **技术报告，本仓来源优先级最高的一档，2026-10-31 补读。**
      Table 1 的架构超参与权重清单逐项相同：双流块 54、Model Dimension 2048、
      FFN Dimension 8192、Attention Heads 16、Head dim 128
      （单流块数报告没列，与清单里一个单流张量都没有自洽）。
      §3.1 的 VAE：空间 16×、时间 4×、latent 32 通道。
      **§3.1 直接把 Qwen2.5-VL 写成模型用的编码器**（「This design leverages a
      visual-language multimodal encoder Qwen2.5-VL」，与 Glyph-ByT5 合成
      "dual-channel text encoder"），全文**没有出现 HunyuanMLLM** —— 见 R5。
      §6 Table 7/8 给了 SSTA 的速度，**而且有基线、有硬件、有配置** —— 见 R7。
      报告**没有**给主结果的采样步数与 CFG 强度（只有 Table 8 的 50 步），
      所以那两项仍以模型卡的采样表为准
  - kind: repo
    url: https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5/blob/main/hyvideo/pipelines/hunyuan_video_pipeline.py
    locator: get_latent_size()、target_size_config、get_closest_resolution_given_original_size() @ main
    accessed: '2026-10-31'
    note: >-
      厂商参考实现（第三档来源）。**latent 口径的一手依据**：
      `get_latent_size()` 整个函数就三行 ——
      `video_length = (video_length - 1) // temporal_compression_ratio + 1`、
      `height, width = height // spatial_compression_ratio, width // spatial_compression_ratio`，
      然后 `n_tokens = latent_target_length * latent_height * latent_width`。
      即**标准因果公式，没有分块**（与 minimax-h3 的 17 帧切片相反，见 notes 的对照）。

      分辨率不是固定表而是**分桶**：`target_size_config` 给
      480p → `bucket_hw_base_size 640`、720p → `960`、1080p → `1440`，stride 均 16；
      `generate_crop_size_list(base, 16)` 枚举面积约 base² 且两边都被 16 整除的档，
      再取与请求长宽比最近的一档。照这套算出 16:9 的结果见 generation.buckets
  - kind: repo
    url: https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5/blob/main/hyvideo/models/autoencoders/hunyuanvideo_15_vae.py
    locator: AutoencoderKLConv3D 全文，重点 encode() 与 temporal_tiled_encode() @ main
    accessed: '2026-10-31'
    note: >-
      **确认 VAE 没有分块编码**：`temporal_tiled_encode()` 第一行就是
      `raise RuntimeError('Temporal tiling is not supported for this VAE.')`，
      整个函数是死代码；`encode()` 走 `self.encoder(x)` 整段因果卷积。
      所以 (F−1)/4+1 在这一份上**真的成立** —— 这一条是专门去验的，
      因为同线 minimax-h3 的 VAE 按 17 帧切片，公式在那边不成立（见 notes）。
      `CausalConv3d` 带 `time_causal_padding`，`Downsample` 按
      `add_temporal_downsample` 逐级减半，与 config 的 ffactor_temporal 4 对上
  - kind: repo
    url: https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5/blob/main/generate.py
    locator: argparse 默认值 @ main
    accessed: '2026-10-31'
    note: >-
      默认档的依据：`--video_length` 默认 **121**（而且代码里 `if args.video_length != 121`
      会打 WARNING）、`--aspect_ratio` 默认 **16:9**、`--resolution` 只接受 480p/720p、
      `--dtype` 默认 **bf16**、`--sr` 默认 **true**、`--total_steps` 默认 50、
      导出 `imageio.mimwrite(path, vid, fps=24)`
  - kind: repo
    url: https://huggingface.co/tencent/HunyuanVideo-1.5/blob/main/checkpoints-download.md
    locator: §Downloading TextEncoders and Vision Encoders @ 9b49404b3f5d
    accessed: '2026-10-31'
    note: >-
      三个编码器**都不在本仓里**，要各自去别处取：MLLM（官方 HunyuanMLLM **未发布**，
      文档推荐 `Qwen/Qwen2.5-VL-7B-Instruct` 替代）、byT5（`google/byt5-small`
      + ModelScope 的 Glyph-SDXL-v2）、SigLIP（要从 **gated** 的
      `black-forest-labs/FLUX.1-Redux-dev` 取，需先申请）
  - kind: modelcard
    url: https://huggingface.co/tencent/HunyuanVideo-1.5
    locator: 11 个 transformer + vae + 2 个 upsampler 共 14 个 safetensors 的头 @ 9b49404b3f5d
    accessed: '2026-10-31'
    note: >-
      权重清单逐文件读头取全。11 套 DiT 里 **8 套逐字同形**
      （1793 张量 / 8,326,608,160 参数 / 33,306,432,640 B），
      另外 3 套各多 4 个张量（两个 SR 与 480p_i2v_step_distilled，都开 `use_meanflow`）。
      全部 F32，无 scale 容器、无打包容器。
      另用 HF tree API 的 LFS sha256 比对了 11 套的 oid，结论见 review R2

hf:
  repo: tencent/HunyuanVideo-1.5
  sha: 9b49404b3f5df2a8f0b31df27a0c7ab872e7b038
  last_modified: '2025-12-25T03:58:59.000Z'
  pipeline_tag: text-to-video
  gated: false

lineage:
  track: main
  # hunyuan-video family 的第二代。前代 hunyuanvideo-13b（2024-12）还没录 ——
  # 它的权重是 .pt（pickle），读不了清单，卡在取数上。
  # 所以 predecessor 暂缺，等那一份进来再补 changed_from_predecessor。
  # 跨代的三处主要变化（VAE 16×/4×/32ch、双流 54 层无单流段、SSTA）
  # 在录前代时要逐项对照，现在只在 notes 里留了线索。

params:
  total: 8326608160
  # 稠密主干，每一步对全部 token 过全部权重，没有路由、没有跨步复用
  active_decode: 8326608160
  active_prefill: 8326608160
  breakdown:
    adaln_modulation: 2723964928
    ffn_img: 1812492288
    ffn_txt: 1812492288
    self_attention_img: 906425856
    self_attention_txt: 906425856
    token_refiner: 141105152
    byt5_proj: 11412352
    patch_embed: 8593440
    vision_proj: 3696000
  counting_note: >-
    **只含 DiT 主干，且只含 11 套里的 `transformer/720p_t2v`**，
    按完整权重清单（单文件 1793 张量）逐项统计。全 F32，numel 即参数数：
    8,326,608,160 × 4 B = 33,306,432,640 B，与文件的 HTTP 大小差 199,552 B（= safetensors 头）。

    **为什么取 720p_t2v**：11 套里 8 套逐字同形（含 480p/720p × t2v/i2v ×
    基座/CFG 蒸馏，以及那套稀疏），参数量完全相同，取哪套都一样；
    另外 3 套（两个 SR 与 480p_i2v_step_distilled）各多 4 个张量、多约 4.7M 参数，
    都开了 `use_meanflow`。720p_t2v 是默认分辨率下的基座，拿它当代表。
    **11 套 LFS oid 两两不同**，不是同一批权重的多次打包（见 R2）。

    **三个编码器不在这个数里，而且不在仓里**：MLLM（官方未发布，文档推荐
    Qwen2.5-VL-7B-Instruct，8,292,166,656 参数 BF16 —— **与 DiT 几乎一样大**）、
    byT5（google/byt5-small + Glyph-SDXL-v2）、SigLIP（在 gated 的 FLUX.1-Redux-dev 里）。
    视觉 VAE 也单列：1,260,634,115 参数 / 5,042,536,460 B，全 F32。

    分桶口径：`adaln_modulation` 含逐层两路 `img_mod.linear` 与 `txt_mod.linear`
    （各 [12288, 2048]，12288 = 6 × 2048）加 `time_in` 与 `cond_type_embedding`；
    `*_img` / `*_txt` 按双流分开记 —— 两路**参数逐字节相同**，
    但处理的 token 数差三个量级，合在一起会掩盖这件事（见 bottlenecks）。

generation:
  backbone:
    stream_design: dual_stream
    layers: 54
    double_blocks: 54
    single_blocks: 0
    hidden: 2048
    heads: 16
    head_dim: 128
    ffn: 8192
    text_conditioning: dual_stream
    patch_size: [1, 1, 1]
    refiner_layers: 2
    position: 3D RoPE，rope_dim_list [16, 56, 56]（t/h/w），rope_theta 256
    note: >-
      **纯双流**：`mm_double_blocks_depth 54` / `mm_single_blocks_depth 0`，
      没有前代 HunyuanVideo 13B 那种「20 双流 + 40 单流」的单流段。
      每个双流块里 img 与 txt 各有一整套 q/k/v/proj（[2048,2048]）、
      各一套 FFN（fc1 [8192,2048] + fc2 [2048,8192]，**非门控**，
      `mlp_width_ratio 4`）、各一套 modulation（[12288,2048] = 6 组）。
      **patch_size 是 (1,1,1)** —— VAE 已经压到 16×/4×，DiT 不再 patchify，
      所以有效空间压缩就是 16×，而不是同线 minimax-h3 的 32×。
      这一条直接决定序列长度：同为 720p 档，这一份 111,600 个 token，
      h3 只有 72,576，而这一份的参数只有 h3 的 1/4。

      **`img_in.proj.weight` 的入口是 65 通道，config 写的 `in_channels` 是 32** ——
      权重赢。65 = 2×32+1，与 `concat_condition: true` 自洽（噪声 latent + 条件 latent
      + 1 个掩码通道）。两个 SR checkpoint 的 config 写 98，同理是 3×32+2。见 R3

  vae:
    spatial_compression: 16
    temporal_compression: 4
    latent_channels: 32
    causal: true
    decoder_arch: conv3d
    params: 1260634115
    name: HunyuanVideo-1.5 3D 因果 VAE（AutoencoderKLConv3D）
    note: >-
      1,260,634,115 参数 / 5,042,536,460 B，218 条张量**全 F32**（逐条实测）。
      `ffactor_spatial 16` / `ffactor_temporal 4` / `latent_channels 32` 三项
      config 与卡一致。解码器是卷积栈（`Upsample` 逐级 `add_temporal_upsample`），
      不是 minimax-h3 那种 36 层 ViT。

      **(F−1)/4+1 在这一份上成立，这是专门去验的**：厂商实现里
      `get_latent_size()` 原样就是这个式子，而 `temporal_tiled_encode()`
      第一行 `raise RuntimeError('Temporal tiling is not supported for this VAE.')`，
      没有任何分块路径。所以 `latent_frames` 没有声明，走公式路径
      （`latent_frames_source` 应为 `formula_causal`）。
      默认档 121 帧 → 31 个 latent 帧，端到端有效时间压缩率 3.903，
      与块内卷积比 4 差 2.4% —— **差额来自首帧单独编码，不是分块**，
      和 wan2.2-ti2v-5b 同一个形态

  text_encoders:
    - role: primary
      name: Qwen2.5-VL（报告称「dual-channel text encoder」的视觉-语言那一路）
      hf_repo: Qwen/Qwen2.5-VL-7B-Instruct
      params: 8292166656
      hidden: 3584
      shipped_with_weights: false
      gated: false
      release_dtype: BF16
      substitutable: false
      note: >-
        **这是模型本身用的编码器，不是替代品** —— 技术报告 §3.1 原话
        「This design leverages a visual-language multimodal encoder Qwen2.5-VL」，
        与 Glyph-ByT5 合成 dual-channel text encoder，全文没有出现 HunyuanMLLM。
        仓里的 `checkpoints-download.md` 说「尚未发布最新的 HunyuanMLLM，建议社区用
        Qwen2.5-VL-7B-Instruct 这类替代」—— 那是第三档来源，且说的是**更新的**内部模型，
        不改变已发布这一版用的是什么。按来源优先级以报告为准（见 R5）。
        params 8,292,166,656（HF 的 safetensors tally，BF16）、hidden 3584 与 DiT config
        的 `text_states_dim: 3584` 对得上 —— 后者是这条判断的第三路旁证。
        **它几乎和 DiT 一样大**（8.29B vs 8.33B），而 DiT 要跑满 50 步、它只跑一遍。
        注意报告只写「Qwen2.5-VL」没写档位，7B 这一档是从 `text_states_dim 3584` 反推的
    - role: glyph
      name: Glyph-ByT5（google/byt5-small + Glyph-SDXL-v2）
      hf_repo: google/byt5-small
      hidden: 1472
      shipped_with_weights: false
      gated: false
      substitutable: false
      note: >-
        字形编码器，`glyph_byT5_v2: true`、`byt5_max_length: 256`。
        hidden 1472 是**权重实测**：DiT 的 `byt5_in.fc1.weight` 形状 [2048, 1472]。
        要两处权重：`google/byt5-small` 与 ModelScope 的 `AI-ModelScope/Glyph-SDXL-v2`。
        params 未填 —— 没核实 Glyph-SDXL-v2 的规模
    - role: vision
      name: SigLIP（从 FLUX.1-Redux-dev 取）
      hf_repo: black-forest-labs/FLUX.1-Redux-dev
      hidden: 1152
      shipped_with_weights: false
      gated: true
      substitutable: false
      note: >-
        i2v 的语义编码器，`vision_states_dim: 1152`、`vision_num_semantic_tokens: 729`。
        **要先在 HF 上申请 FLUX.1-Redux-dev 的访问**（`gated: auto`）——
        一个腾讯的模型，视觉编码器要去 Black Forest Labs 的 gated 仓拿。
        params 未填：没有单独发布，混在 Redux 包里

  sampling:
    steps: 50
    cfg:
      scale: 6.0
      distilled: false
      embedded: false
      forwards_per_step: 2
    step_distilled:
      available: true
      steps: 8
      checkpoint: transformer/480p_i2v_step_distilled
      note: >-
        官方只对 **480p i2v** 发了步数蒸馏档，卡上写「8 或 12 步（推荐）」，
        这里填下限 8。4 步也能跑但卡说质量略降。
        **它和 CFG 蒸馏是两根独立的轴**：CFG 蒸馏档把每步前向从 2 砍到 1，
        但卡加粗强调「必须仍跑 50 步」
    scheduler: FlowMatchDiscreteScheduler（euler，num_train_timesteps 1000）
    shift: 9.0
    note: >-
      默认档（720p t2v 基座）：CFG 6.0、flow shift 9.0、50 步 → **100 次主干前向**。
      flow shift 逐档不同（480p 两任务 5、720p t2v 9、720p i2v 7），
      顶层 `config.json` 里的 `flow_shift: 7.0` 是 pipeline 缺省值，
      不是 720p t2v 的推荐值 —— 推荐值在卡的采样表里。
      `embedded_guidance_scale: None` 且各 checkpoint 的 `guidance_embed: false`，
      所以不是前代 13B 那种嵌入式引导，是真 CFG

  pipeline_stages:
    - name: DiT 去噪
      model: same-backbone
      steps: 50
      cfg_scale: 6.0
      forwards_per_step: 2
      resolution: 720p（1280×720）
      open_source: true
      note: 本记录的负载推导覆盖的就是这一段
    - name: 720p 超分
      model: transformer/720p_sr_distilled + upsampler/720p_sr_distilled
      steps: 6
      forwards_per_step: 1
      resolution: 480p → 720p
      open_source: true
      note: >-
        **SR 不是一个小模块**：`transformer/720p_sr_distilled` 是另一套
        8,331,398,432 参数 / 33.3 GB 的完整 DiT，`upsampler/` 那个只有
        21,461,152 参数（85.8 MB）。开 `--sr`（默认开）就要再驻留一套 33 GB
    - name: 1080p 超分
      model: transformer/1080p_sr_distilled + upsampler/1080p_sr_distilled
      steps: 8
      forwards_per_step: 1
      resolution: 720p → 1080p
      open_source: true
      note: transformer 8,331,398,432 参数，upsampler 50,350,112 参数

  buckets:
    - width: 1280
      height: 720
      frames: 121
      fps: 24
      duration_s: 5.0416667
      default: true
      note: >-
        **算出来的，不是抄的**：厂商的分桶逻辑 `target_size_config['720p']` 给
        base 960 / stride 16，`generate_crop_size_list(960, 16)` 枚举面积约 960²、
        两边被 16 整除的档，再取与 16:9 最近的一档 —— 结果比值恰好是 0.5625，
        正中 16:9。121 帧与 24 fps 取自 `generate.py` 的默认值。
        latent 31 × 45 × 80 = 111,600 token
    - width: 1280
      height: 720
      frames: 241
      fps: 24
      duration_s: 10.0416667
      note: >-
        **报告 §6 Table 7/8 的速度实验用的就是这一档**（720p / 241 帧）。
        241 = 4×60+1，满足 4n+1。latent 61 × 45 × 80 = 219,600 token，
        是默认档的 1.97 倍 —— 而注意力是 O(n²)，所以 SSTA 的收益在这一档
        明显高于 121 帧档（1.87× vs 1.28×，见 bottlenecks）
    - width: 848
      height: 480
      frames: 121
      fps: 24
      duration_s: 5.0416667
      note: >-
        480p 档（base 640 / stride 16）。16:9 最近档的比值 0.56604，
        不正中 16:9 —— 枚举里没有恰好 0.5625 的。latent 31 × 30 × 53 = 49,290 token
    - width: 1904
      height: 1072
      frames: 121
      fps: 24
      duration_s: 5.0416667
      note: >-
        1080p 是 SR 的**输出**档（base 1440 / stride 16，比值 0.56303），
        不是 DiT 能直接出的。latent 31 × 67 × 119 = 247,163 token

  constraints:
    width_divisor: 16
    height_divisor: 16
    frame_formula: 4n+1
    note: >-
      除数 16 = VAE 空间压缩 16 × DiT patch 1。分桶的 stride 也是 16，两者一致。
      帧数 4n+1 来自时间因果 VAE 的首帧单独编码：121 = 4×30+1；
      训练文档也要求 `pixel_values` 的时间维是 4n+1。
      **这一条与 minimax-h3 的 17n+5 形成对照** —— 同是「因果 VAE」，
      一个没有分块、公式成立，一个按 17 帧切片、公式不成立。
      看到帧数约束就该去读 VAE 实现，约束本身是分块规则的外在表现

  checkpoint_variants:
    - name: 720p_t2v
      role: base
      bytes: 33306432640
      resident: true
      note: 本记录的 params 量的就是它。默认分辨率下的文生视频基座
    - name: 480p_t2v / 480p_i2v / 720p_i2v
      role: base
      bytes: 33306432640
      resident: false
      note: 与 720p_t2v **逐字同形**（1793 张量 / 8,326,608,160 参数），config 只差 ideal_resolution 与 ideal_task
