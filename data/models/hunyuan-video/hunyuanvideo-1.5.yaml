    `generation_workload.flops_per_step.total` 与**同 token 数那两段**
    （「DiT 去噪」「720p 超分」，都是 111,600）的 `flops_per_step` ——
    **现在是 6.129684e15 对 6.118285e15，差 1.140e13**，而
    2 × `per_text_token` 2,871,435,648 × `text_tokens` 1,985 = 1.140e13，逐位相等。
    **这两个数相等的那天，这一条就该整段删掉。** 1080p SR 段不参与比较
    （它的 token 数是 247,163，单步本就不同）
  - >-
    官方 HunyuanMLLM 未发布，文本编码器那栏填的是社区替代品 Qwen2.5-VL-7B-Instruct 的数。
    官方 MLLM 多大、与替代品的 hidden 是否同为 3584，都不知道 ——
    只知道 DiT 的 `text_states_dim` 是 3584，替代品恰好对得上
  - >-
    `generation.text_encoders` 里只有一栏填得出 params（R5）：SigLIP 与 Glyph-SDXL-v2
    的参数量没填 —— 前者混在 gated 的 FLUX.1-Redux-dev 里没有单独发布，后者在 ModelScope。
    两者都影响「一次部署要驻留多少」这个账
  - >-
    SSTA 的实际稀疏率仍不知道。报告 §3.1 给了算法（按 Q–K 相似度减 K–K 冗余打分、
    取 top-k 块，再与滑动窗口掩码合并），config 给了 `tile_size [6,8,8]`、
    `win_size [[3,3,3]]`、`ssta_topk 64`、`ssta_lambda 0.7`、`win_ratio 10`，
    但两者都推不出默认档上实际省掉多少注意力计算。
    **所以本记录的单步注意力 FLOPs 是稠密口径**，对稀疏档位偏高。
    能反推的只有端到端：报告 Table 7 给 720p 241 帧 1.87×、121 帧 1.28×，
    而同档注意力占比是 94.7% 与 90.0% —— 若加速全部来自注意力，
    反推稀疏后注意力只剩约 46% 与 56% 的计算量，但这是**推算不是实测**，没有写进字段
  - >-
    **前代 `hunyuanvideo-13b` 缺什么才能录 —— 逐条查过了。**

    缺的是**清单**，不是数。官方仓 `tencent/HunyuanVideo` 一共 10 个文件、
    **零个 safetensors**，权重是 4 个 `.pt`：
    `transformers/mp_rank_00_model_states.pt` 25,642,314,002 B（主干）、
    同目录的 `_fp8.pt` 13,185,233,506 B 与 `_fp8_map.pt` 103,890 B、
    `vae/pytorch_model.pt` 986,000,558 B。HF 也因此没有 safetensors tally。
    读头拿清单这条路不成立，`derive.py` 的权重路整条走不了，**Gate B 少一路**。

    三条可能的路，代价与口径各不同：
    (1) 下载 25.6 GB 反序列化 —— pickle 有执行风险，代价也大；
    (2) 用社区 diffusers 镜像 `hunyuanvideo-community/HunyuanVideo`
    （12 个 safetensors，HF tally **12,821,012,544 全 BF16**）。
    它是**第三方转换**，按本仓来源优先级进不了厂商口径，
    **但可以当旁证**：12,821,012,544 × 2 B = 25,642,025,088 B，
    与官方 `.pt` 的 25,642,314,002 B 只差 288,914 B（pickle 开销），
    说明那次转换没有增删张量；
    (3) 等厂商发 safetensors。

    **真正要定的是口径，不是取数**：Gate B 的本质是「config 公式路 × 权重清单路」
    两路对账，只剩一路时这份记录算不算过闸、`params` 该标 `official`（厂商声明 13B）
    还是 `derived`、第三方转换的清单能不能降级使用并标出来。
    这是跨记录的决定（`sana-video` 同样标着 `blocked-no-safetensors`），
    **由主会话定，本记录不替它定**。

    顺带两条录 13B 时用得上的：官方仓里有**官方 FP8 权重**
    （`_fp8.pt` + 一个 103 KB 的 `_fp8_map.pt`），这在视频线是头一份；
    跨代的三处主要变化（VAE 从 8×/4×/16ch 到 16×/4×/32ch、
    从 20 双流 + 40 单流到 54 双流 + 0 单流、新增 SSTA）现在只有线索没有对账
  - >-
    卡上那句「10 秒 720p 端到端相对 FlashAttention-3 加速 1.87×」没有给基线配置
    （几卡、什么精度、开不开 cache），**不能当性能基准**，没有写进 performance
  - >-
    训练精度无一手来源。发布权重全 F32 是实测，`generate.py` 默认 bf16 也是实测，
    但那说的都是落盘与推理格式，不是训练格式
