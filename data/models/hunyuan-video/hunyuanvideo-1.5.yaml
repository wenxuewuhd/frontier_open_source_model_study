id: hunyuanvideo-1.5
family: hunyuan-video
kind: video-gen
display_name: HunyuanVideo-1.5
released: '2025-11-20'
license: other
license_restriction: >-
  腾讯混元社区许可。模型卡的 front-matter 带 `extra_gated_eu_disallowed: true`，
  即欧盟不可用。和 minimax-h3 的「按地区申请」是两种不同的限制形态，
  但后果同类：决定这套权重能不能进某个部署区域
visibility: public

# 视频线第三份记录，口径沿用 wan2.2-ti2v-5b 定下的三条：
# params.total 只算 DiT；不建 arch 块；没有 KV cache 这笔账。
#
# 这一份的特点是**多 checkpoint 矩阵**：11 套各 33.3 GB 的 DiT（分辨率 × 任务 ×
# 蒸馏 × 稀疏 × 超分），LFS oid 两两不同，一套都没有复用。
# params 取 720p_t2v，理由见 counting_note。

sources:
  - kind: modelcard
    url: https://huggingface.co/tencent/HunyuanVideo-1.5
    locator: README.md §Introduction / §Key Features / §Optimal Inference Configurations @ 9b49404b3f5d
    accessed: '2026-10-31'
    note: >-
      官方口径来源。卡上直接给出的：8.3B DiT + 3D 因果 VAE，空间 16× / 时间 4×；
      SSTA（Selective and Sliding Tile Attention）「prunes redundant spatiotemporal
      kv blocks」，10 秒 720p 端到端相对 FlashAttention-3 加速 **1.87×**；
      另有少步超分网络把输出升到 1080p；训练用 Muon 优化器；最低显存 14 GB（开 offload）。
      §Optimal Inference Configurations 给了完整的采样表（CFG / flow shift / 步数），
      并加粗强调「the cfg distilled model we provided, must use 50 steps」。
      **加速比 1.87× 没有给基线配置，只作定性参照，没有写进 performance**
  - kind: paper
    url: https://arxiv.org/html/2511.18870v2
    locator: Table 1（架构超参）、§3.1（VAE / 文本编码器 / SSTA）、§3.2 与 §4.3（超分）、§6 Table 7–8（速度）
    accessed: '2026-10-31'
    note: >-
      **技术报告，本仓来源优先级最高的一档，2026-10-31 补读。**
      Table 1 的架构超参与权重清单逐项相同：双流块 54、Model Dimension 2048、
      FFN Dimension 8192、Attention Heads 16、Head dim 128
      （单流块数报告没列，与清单里一个单流张量都没有自洽）。
      §3.1 的 VAE：空间 16×、时间 4×、latent 32 通道。
      **§3.1 直接把 Qwen2.5-VL 写成模型用的编码器**（「This design leverages a
      visual-language multimodal encoder Qwen2.5-VL」，与 Glyph-ByT5 合成
      "dual-channel text encoder"），全文**没有出现 HunyuanMLLM** —— 见 R5。
      §6 Table 7/8 给了 SSTA 的速度，**而且有基线、有硬件、有配置** —— 见 R7。
      报告**没有**给主结果的采样步数与 CFG 强度（只有 Table 8 的 50 步），
      所以那两项仍以模型卡的采样表为准
  - kind: repo
    url: https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5/blob/main/hyvideo/pipelines/hunyuan_video_pipeline.py
    locator: get_latent_size()、target_size_config、get_closest_resolution_given_original_size() @ main
    accessed: '2026-10-31'
    note: >-
      厂商参考实现（第三档来源）。**latent 口径的一手依据**：
      `get_latent_size()` 整个函数就三行 ——
      `video_length = (video_length - 1) // temporal_compression_ratio + 1`、
      `height, width = height // spatial_compression_ratio, width // spatial_compression_ratio`，
      然后 `n_tokens = latent_target_length * latent_height * latent_width`。
      即**标准因果公式，没有分块**（与 minimax-h3 的 17 帧切片相反，见 notes 的对照）。

      分辨率不是固定表而是**分桶**：`target_size_config` 给
      480p → `bucket_hw_base_size 640`、720p → `960`、1080p → `1440`，stride 均 16；
      `generate_crop_size_list(base, 16)` 枚举面积约 base² 且两边都被 16 整除的档，
      再取与请求长宽比最近的一档。照这套算出 16:9 的结果见 generation.buckets
  - kind: repo
    url: https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5/blob/main/hyvideo/models/autoencoders/hunyuanvideo_15_vae.py
    locator: AutoencoderKLConv3D 全文，重点 encode() 与 temporal_tiled_encode() @ main
    accessed: '2026-10-31'
    note: >-
      **确认 VAE 没有分块编码**：`temporal_tiled_encode()` 第一行就是
      `raise RuntimeError('Temporal tiling is not supported for this VAE.')`，
      整个函数是死代码；`encode()` 走 `self.encoder(x)` 整段因果卷积。
      所以 (F−1)/4+1 在这一份上**真的成立** —— 这一条是专门去验的，
      因为同线 minimax-h3 的 VAE 按 17 帧切片，公式在那边不成立（见 notes）。
      `CausalConv3d` 带 `time_causal_padding`，`Downsample` 按
      `add_temporal_downsample` 逐级减半，与 config 的 ffactor_temporal 4 对上
  - kind: repo
    url: https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5/blob/main/generate.py
    locator: argparse 默认值 @ main
    accessed: '2026-10-31'
    note: >-
      默认档的依据：`--video_length` 默认 **121**（而且代码里 `if args.video_length != 121`
      会打 WARNING）、`--aspect_ratio` 默认 **16:9**、`--resolution` 只接受 480p/720p、
      `--dtype` 默认 **bf16**、`--sr` 默认 **true**、`--total_steps` 默认 50、
      导出 `imageio.mimwrite(path, vid, fps=24)`
  - kind: repo
    url: https://huggingface.co/tencent/HunyuanVideo-1.5/blob/main/checkpoints-download.md
    locator: §Downloading TextEncoders and Vision Encoders @ 9b49404b3f5d
    accessed: '2026-10-31'
    note: >-
      三个编码器**都不在本仓里**，要各自去别处取：MLLM（官方 HunyuanMLLM **未发布**，
      文档推荐 `Qwen/Qwen2.5-VL-7B-Instruct` 替代）、byT5（`google/byt5-small`
      + ModelScope 的 Glyph-SDXL-v2）、SigLIP（要从 **gated** 的
      `black-forest-labs/FLUX.1-Redux-dev` 取，需先申请）
  - kind: modelcard
    url: https://huggingface.co/tencent/HunyuanVideo-1.5
    locator: 11 个 transformer + vae + 2 个 upsampler 共 14 个 safetensors 的头 @ 9b49404b3f5d
    accessed: '2026-10-31'
    note: >-
      权重清单逐文件读头取全。11 套 DiT 里 **8 套逐字同形**
      （1793 张量 / 8,326,608,160 参数 / 33,306,432,640 B），
      另外 3 套各多 4 个张量（两个 SR 与 480p_i2v_step_distilled，都开 `use_meanflow`）。
      全部 F32，无 scale 容器、无打包容器。
      另用 HF tree API 的 LFS sha256 比对了 11 套的 oid，结论见 review R2

hf:
  repo: tencent/HunyuanVideo-1.5
  sha: 9b49404b3f5df2a8f0b31df27a0c7ab872e7b038
  last_modified: '2025-12-25T03:58:59.000Z'
  pipeline_tag: text-to-video
  gated: false

lineage:
  track: main
  # hunyuan-video family 的第二代。前代 hunyuanvideo-13b（2024-12）还没录 ——
  # 它的权重是 .pt（pickle），读不了清单，卡在取数上。
  # 所以 predecessor 暂缺，等那一份进来再补 changed_from_predecessor。
  # 跨代的三处主要变化（VAE 16×/4×/32ch、双流 54 层无单流段、SSTA）
  # 在录前代时要逐项对照，现在只在 notes 里留了线索。

params:
  total: 8326608160
  # 稠密主干，每一步对全部 token 过全部权重，没有路由、没有跨步复用
  active_decode: 8326608160
  active_prefill: 8326608160
  breakdown:
    adaln_modulation: 2723964928
    ffn_img: 1812492288
    ffn_txt: 1812492288
    self_attention_img: 906425856
    self_attention_txt: 906425856
    token_refiner: 141105152
    byt5_proj: 11412352
    patch_embed: 8593440
    vision_proj: 3696000
  counting_note: >-
    **只含 DiT 主干，且只含 11 套里的 `transformer/720p_t2v`**，
    按完整权重清单（单文件 1793 张量）逐项统计。全 F32，numel 即参数数：
    8,326,608,160 × 4 B = 33,306,432,640 B，与文件的 HTTP 大小差 199,552 B（= safetensors 头）。

    **为什么取 720p_t2v**：11 套里 8 套逐字同形（含 480p/720p × t2v/i2v ×
    基座/CFG 蒸馏，以及那套稀疏），参数量完全相同，取哪套都一样；
    另外 3 套（两个 SR 与 480p_i2v_step_distilled）各多 4 个张量、多约 4.7M 参数，
    都开了 `use_meanflow`。720p_t2v 是默认分辨率下的基座，拿它当代表。
    **11 套 LFS oid 两两不同**，不是同一批权重的多次打包（见 R2）。

    **三个编码器不在这个数里，而且不在仓里**：MLLM（官方未发布，文档推荐
    Qwen2.5-VL-7B-Instruct，8,292,166,656 参数 BF16 —— **与 DiT 几乎一样大**）、
    byT5（google/byt5-small + Glyph-SDXL-v2）、SigLIP（在 gated 的 FLUX.1-Redux-dev 里）。
    视觉 VAE 也单列：1,260,634,115 参数 / 5,042,536,460 B，全 F32。

    分桶口径：`adaln_modulation` 含逐层两路 `img_mod.linear` 与 `txt_mod.linear`
    （各 [12288, 2048]，12288 = 6 × 2048）加 `time_in` 与 `cond_type_embedding`；
    `*_img` / `*_txt` 按双流分开记 —— 两路**参数逐字节相同**，
    但处理的 token 数差三个量级，合在一起会掩盖这件事（见 bottlenecks）。

    **这张 breakdown 有两个桶是按模块切的，不是按功能切的 —— 2026-10-31 补明（见 R11）。**
    原先只定义了 `adaln_modulation` 与 `*_img` / `*_txt` 三项，剩下的桶没写口径，
    于是下面两件事谁也看不出来：
    `token_refiner` 141,105,152 是 `txt_in.*` 整块，其中 **33,046,528（23.4%）
    是 AdaLN 调制与两个条件嵌入器**（`adaLN_modulation` 16,785,408 +
    `t_embedder.mlp` 4,722,688 + `c_embedder` 11,538,432）；
    `patch_embed` 8,593,440 是 `img_in.*` 加 `final_layer.*`，而其中
    **8,392,704（97.7%）是出口的 `final_layer.adaLN_modulation`** ——
    真的 patch 投影只有 `img_in.proj` 的 135,168。
    **所以「`patch_embed`」这个名字名不副实，而那 8,392,704 的 AdaLN 调制
    既不在 `adaln_modulation` 里、也没被任何地方记过。**
    桶值与总和都没错（九桶相加逐位等于 `params.total`），错的是名字与缺的那条定义；
    改键名会动引用它的地方，单独一轮。

generation:
  backbone:
    stream_design: dual_stream
    layers: 54
    double_blocks: 54
    single_blocks: 0
    hidden: 2048
    heads: 16
    head_dim: 128
    ffn: 8192
    text_conditioning: dual_stream
    param_scaling:
      per_sample: 2723964928
      per_video_token: 2727511584
      per_text_token: 2871435648
      note: >-
        AdaLN 调制（img_mod / txt_mod）吃的是条件向量 `vec` 不是 token 流
        （`hunyuanvideo_1_5_transformer.py:135` 的 `self.img_mod(vec).chunk(6, dim=-1)`，
        `modulate()` 里 `scale.unsqueeze(1)` 再广播到 token 维），
        每次前向只过一遍。它占主干 **32.71%** —— 按「每个参数过每个 token」算，
        线性项高 3.05 倍。
        per_text_token 是双流 txt 侧（attn_txt + ffn_txt + token_refiner + byt5_proj），
        只过文本 token。`buckets[].text_tokens` 已填 1985（= 1000 + 256 + 729，
        来源见默认档的 note），这一项已进推导。

        **但 1985 是个加权近似，不是精确值 —— 这里的参数并不都看同样多的 token。**
        逐项实测（`shapes.json`）：双流 txt 侧 attn + ffn + qk_norm **2,718,918,144**
        过全部 1985 个；`txt_in` token_refiner **108,058,624** 只过 LLM 那 1000 个；
        `byt5_in` **11,412,352** 只过 256 个；`vision_in` **3,696,000** 只过 729 个。
        精确的文本线性项是 2×(2.7189e9×1985 + 1.0806e8×1000 + 1.1412e7×256
        + 3.696e6×729) = **1.1021e13**，而按单一 1985 算得 1.1400e13，**高 3.43%**。
        文本项本身只占单步线性项的 1.8%，所以传到单步 FLOPs 上是 0.06%，可忽略 ——
        **但它是口径近似而不是测量误差，写在这里以免下一份照抄这个做法时量级不同**。

        另有两处 per_text_token 的分桶不纯，合计 1.15%，本次未改（会动已核过的数）：
        (1) 它含 token_refiner 自己的 `adaLN_modulation` + `t_embedder` + `c_embedder`
        共 **33,046,528**，这三项吃的是条件向量、每次前向只过一遍，口径上属 `per_sample`；
        (2) 它**不含** `vision_in` 的 **3,696,000**，而那 729 个 vision token 确实随 token 数走
    patch_size: [1, 1, 1]
    refiner_layers: 2
    position: 3D RoPE，rope_dim_list [16, 56, 56]（t/h/w），rope_theta 256
    note: >-
      **纯双流**：`mm_double_blocks_depth 54` / `mm_single_blocks_depth 0`，
      没有前代 HunyuanVideo 13B 那种「20 双流 + 40 单流」的单流段。
      每个双流块里 img 与 txt 各有一整套 q/k/v/proj（[2048,2048]）、
      各一套 FFN（fc1 [8192,2048] + fc2 [2048,8192]，**非门控**，
      `mlp_width_ratio 4`）、各一套 modulation（[12288,2048] = 6 组）。
      **patch_size 是 (1,1,1)** —— VAE 已经压到 16×/4×，DiT 不再 patchify，
      所以有效空间压缩就是 16×，而不是同线 minimax-h3 的 32×。
      这一条直接决定序列长度：同为 720p 档，这一份 111,600 个 token，
      h3 只有 72,576，而这一份的参数只有 h3 的 1/4。

      **`img_in.proj.weight` 的入口是 65 通道，config 写的 `in_channels` 是 32** ——
      权重赢。65 = 2×32+1，与 `concat_condition: true` 自洽（噪声 latent + 条件 latent
      + 1 个掩码通道）。两个 SR checkpoint 的 config 写 98，同理是 3×32+2。见 R3

  vae:
    spatial_compression: 16
    temporal_compression: 4
    latent_channels: 32
    causal: true
    decoder_arch: conv3d
    params: 1260634115
    name: HunyuanVideo-1.5 3D 因果 VAE（AutoencoderKLConv3D）
    note: >-
      1,260,634,115 参数 / 5,042,536,460 B，218 条张量**全 F32**（逐条实测）。
      `ffactor_spatial 16` / `ffactor_temporal 4` / `latent_channels 32` 三项
      config 与卡一致。解码器是卷积栈（`Upsample` 逐级 `add_temporal_upsample`），
      不是 minimax-h3 那种 36 层 ViT。

      **(F−1)/4+1 在这一份上成立，这是专门去验的**：厂商实现里
      `get_latent_size()` 原样就是这个式子，而 `temporal_tiled_encode()`
      第一行 `raise RuntimeError('Temporal tiling is not supported for this VAE.')`，
      没有任何分块路径。所以 `latent_frames` 没有声明，走公式路径
      （`latent_frames_source` 应为 `formula_causal`）。
      默认档 121 帧 → 31 个 latent 帧，端到端有效时间压缩率 3.903，
      与块内卷积比 4 差 2.4% —— **差额来自首帧单独编码，不是分块**，
      和 wan2.2-ti2v-5b 同一个形态

  text_encoders:
    - role: primary
      name: Qwen2.5-VL（报告称「dual-channel text encoder」的视觉-语言那一路）
      hf_repo: Qwen/Qwen2.5-VL-7B-Instruct
      params: 8292166656
      hidden: 3584
      shipped_with_weights: false
      gated: false
      release_dtype: BF16
      substitutable: false
      note: >-
        **这是模型本身用的编码器，不是替代品** —— 技术报告 §3.1 原话
        「This design leverages a visual-language multimodal encoder Qwen2.5-VL」，
        与 Glyph-ByT5 合成 dual-channel text encoder，全文没有出现 HunyuanMLLM。
        仓里的 `checkpoints-download.md` 说「尚未发布最新的 HunyuanMLLM，建议社区用
        Qwen2.5-VL-7B-Instruct 这类替代」—— 那是第三档来源，且说的是**更新的**内部模型，
        不改变已发布这一版用的是什么。按来源优先级以报告为准（见 R5）。
        params 8,292,166,656（HF 的 safetensors tally，BF16）、hidden 3584 与 DiT config
        的 `text_states_dim: 3584` 对得上 —— 后者是这条判断的第三路旁证。
        **它几乎和 DiT 一样大**（8.29B vs 8.33B），而 DiT 要跑满 50 步、它只跑一遍。
        注意报告只写「Qwen2.5-VL」没写档位，7B 这一档是从 `text_states_dim 3584` 反推的
    - role: glyph
      name: Glyph-ByT5（google/byt5-small + Glyph-SDXL-v2）
      hf_repo: google/byt5-small
      hidden: 1472
      shipped_with_weights: false
      gated: false
      substitutable: false
      note: >-
        字形编码器，`glyph_byT5_v2: true`、`byt5_max_length: 256`。
        hidden 1472 是**权重实测**：DiT 的 `byt5_in.fc1.weight` 形状 [2048, 1472]。
        要两处权重：`google/byt5-small` 与 ModelScope 的 `AI-ModelScope/Glyph-SDXL-v2`。
        params 未填 —— 没核实 Glyph-SDXL-v2 的规模
    - role: vision
      name: SigLIP（从 FLUX.1-Redux-dev 取）
      hf_repo: black-forest-labs/FLUX.1-Redux-dev
      hidden: 1152
      shipped_with_weights: false
      gated: true
      substitutable: false
      note: >-
        i2v 的语义编码器，`vision_states_dim: 1152`、`vision_num_semantic_tokens: 729`。
        **要先在 HF 上申请 FLUX.1-Redux-dev 的访问**（`gated: auto`）——
        一个腾讯的模型，视觉编码器要去 Black Forest Labs 的 gated 仓拿。
        params 未填：没有单独发布，混在 Redux 包里

  sampling:
    steps: 50
    cfg:
      scale: 6.0
      distilled: false
      embedded: false
      forwards_per_step: 2
    step_distilled:
      available: true
      steps: 8
      checkpoint: transformer/480p_i2v_step_distilled
      note: >-
        官方只对 **480p i2v** 发了步数蒸馏档，卡上写「8 或 12 步（推荐）」，
        这里填下限 8。4 步也能跑但卡说质量略降。
        **它和 CFG 蒸馏是两根独立的轴**：CFG 蒸馏档把每步前向从 2 砍到 1，
        但卡加粗强调「必须仍跑 50 步」
    scheduler: FlowMatchDiscreteScheduler（euler，num_train_timesteps 1000）
    shift: 9.0
    note: >-
      默认档（720p t2v 基座）：CFG 6.0、flow shift 9.0、50 步 → **100 次主干前向**。
      flow shift 逐档不同（480p 两任务 5、720p t2v 9、720p i2v 7），
      顶层 `config.json` 里的 `flow_shift: 7.0` 是 pipeline 缺省值，
      不是 720p t2v 的推荐值 —— 推荐值在卡的采样表里。
      `embedded_guidance_scale: None` 且各 checkpoint 的 `guidance_embed: false`，
      所以不是前代 13B 那种嵌入式引导，是真 CFG

  pipeline_stages:
    - name: DiT 去噪
      model: same-backbone
      out_width: 1280
      out_height: 720
      steps: 50
      cfg_scale: 6.0
      forwards_per_step: 2
      resolution: 720p（1280×720）
      open_source: true
      note: 本记录的负载推导覆盖的就是这一段
    - name: 720p 超分
      model: transformer/720p_sr_distilled + upsampler/720p_sr_distilled
      out_width: 1280
      out_height: 720
      steps: 6
      forwards_per_step: 1
      resolution: 480p → 720p
      open_source: true
      note: >-
        **SR 不是一个小模块**：`transformer/720p_sr_distilled` 是另一套
        8,331,398,432 参数 / 33.3 GB 的完整 DiT，`upsampler/` 那个只有
        21,461,152 参数（85.8 MB）。开 `--sr`（默认开）就要再驻留一套 33 GB
    - name: 1080p 超分
      model: transformer/1080p_sr_distilled + upsampler/1080p_sr_distilled
      out_width: 1904
      out_height: 1072
      steps: 8
      forwards_per_step: 1
      resolution: 720p → 1080p
      open_source: true
      note: transformer 8,331,398,432 参数，upsampler 50,350,112 参数

  buckets:
    - width: 1280
      height: 720
      frames: 121
      text_tokens: 1985
      fps: 24
      duration_s: 5.0416667
      default: true
      note: >-
        **算出来的，不是抄的**：厂商的分桶逻辑 `target_size_config['720p']` 给
        base 960 / stride 16，`generate_crop_size_list(960, 16)` 枚举面积约 960²、
        两边被 16 整除的档，再取与 16:9 最近的一档 —— 结果比值恰好是 0.5625，
        正中 16:9。121 帧与 24 fps 取自 `generate.py` 的默认值。
        latent 31 × 45 × 80 = 111,600 token。

        **`text_tokens` 1985 = 1000 + 256 + 729，三个因子各有各的来源**
        （逐因子验，不是一个总数）：
        **1000** —— `hyvideo/pipelines/hunyuan_video_pipeline.py:1592`
        `TextEncoder(max_length=1000)`，`:160` `self.text_len = text_encoder.max_length`，
        `:303` 按 `self.text_len` 分词。它是**定长**：`text2tokens` 先按
        `max_length + crop_start` 分词、`padding="max_length"`，
        再在 `encode()` 里 `last_hidden_state[:, crop_start:]` 把模板前缀切掉，
        正好剩 1000，与 prompt 实际长短无关。
        **256** —— `config.json` 的 `byt5_max_length`，glyph byT5 分支，同样 padding 到定长。
        **729** —— `config.json` 的 `vision_num_semantic_tokens`。
        **t2v 档也有这 729 个**：`_prepare_vision_states`（`:712`）在
        `reference_image is None` 时造的是 `torch.zeros(B, 729, 1152)` 而**不是 None**，
        于是它照样过 `vision_in` 并被 `reorder_txt_token` 拼进 txt 流 ——
        值是 0、注意力掩码是 0，但**序列长度与算力照付**。
        三者在 `hunyuanvideo_1_5_transformer.py:761 / :793` 两次
        `reorder_txt_token` 拼成同一条 txt 流，一起过 54 个双流块的 txt 侧
    - width: 1280
      height: 720
      frames: 241
      fps: 24
      duration_s: 10.0416667
      note: >-
        **报告 §6 Table 7/8 的速度实验用的就是这一档**（720p / 241 帧）。
        241 = 4×60+1，满足 4n+1。latent 61 × 45 × 80 = 219,600 token，
        是默认档的 1.97 倍 —— 而注意力是 O(n²)，所以 SSTA 的收益在这一档
        明显高于 121 帧档（1.87× vs 1.28×，见 bottlenecks）
    - width: 848
      height: 480
      frames: 121
      fps: 24
      duration_s: 5.0416667
      note: >-
        480p 档（base 640 / stride 16）。16:9 最近档的比值 0.56604，
        不正中 16:9 —— 枚举里没有恰好 0.5625 的。latent 31 × 30 × 53 = 49,290 token
    - width: 1904
      height: 1072
      frames: 121
      fps: 24
      duration_s: 5.0416667
      note: >-
        1080p 是 SR 的**输出**档（base 1440 / stride 16，比值 0.56303），
        不是 DiT 能直接出的。latent 31 × 67 × 119 = 247,163 token

  constraints:
    width_divisor: 16
    height_divisor: 16
    frame_formula: 4n+1
    note: >-
      除数 16 = VAE 空间压缩 16 × DiT patch 1。分桶的 stride 也是 16，两者一致。
      帧数 4n+1 来自时间因果 VAE 的首帧单独编码：121 = 4×30+1；
      训练文档也要求 `pixel_values` 的时间维是 4n+1。
      **这一条与 minimax-h3 的 17n+5 形成对照** —— 同是「因果 VAE」，
      一个没有分块、公式成立，一个按 17 帧切片、公式不成立。
      看到帧数约束就该去读 VAE 实现，约束本身是分块规则的外在表现

  checkpoint_variants:
    - name: 720p_t2v
      role: base
      bytes: 33306432640
      resident: true
      note: 本记录的 params 量的就是它。默认分辨率下的文生视频基座
    - name: 480p_t2v / 480p_i2v / 720p_i2v
      role: base
      bytes: 33306432640
      resident: false
      note: 与 720p_t2v **逐字同形**（1793 张量 / 8,326,608,160 参数），config 只差 ideal_resolution 与 ideal_task
    - name: 480p_t2v_distilled / 480p_i2v_distilled / 720p_i2v_distilled
      role: cfg-distilled
      bytes: 33306432640
      resident: false
      note: CFG 蒸馏档，同形。用它每步前向从 2 降到 1，但卡要求仍跑 50 步
    - name: 720p_i2v_distilled_sparse
      role: sparse
      bytes: 33306432640
      resident: false
      note: >-
        唯一开了 SSTA 的权重。架构与参数量和 `720p_i2v_distilled` 完全相同，
        config 只多 `attn_mode: flex-block-attn` 与 `attn_param`，
        **但 LFS oid 不同 —— 是单独微调过的，不是翻个开关**（见 R2）
    - name: 480p_i2v_step_distilled
      role: step-distilled
      bytes: 33325323392
      resident: false
      note: 8,331,330,848 参数，比基座多 4 个张量 / 约 4.7M，开 `use_meanflow`
    - name: 720p_sr_distilled
      role: sr
      bytes: 33325593728
      resident: true
      note: >-
        8,331,398,432 参数。`--sr` 默认开，所以**常规部署要同时有基座与这一套**，
        两套 F32 就是 66.6 GB
    - name: 1080p_sr_distilled
      role: sr
      bytes: 33325593728
      resident: false
      note: 参数量与 720p SR 相同（8,331,398,432），但 oid 不同，是另一批权重
    - name: vae
      role: vae
      bytes: 5042536460
      resident: true
    - name: upsampler/720p_sr_distilled + upsampler/1080p_sr_distilled
      role: sr
      bytes: 287245056
      resident: false
      note: 21,461,152 与 50,350,112 参数。SR 的重活在上面那两套 33 GB 的 DiT 里，不在这里

precision:
  weights_release: [FP32]
  weights_release_scope:
    FP32:
      manifest_taken: true
      in_precision_table: true
      repo: tencent/HunyuanVideo-1.5
      note: >-
        14 个 safetensors（11 套 DiT + VAE + 2 个 upsampler）**无一例外全是 F32**，
        逐文件读头确认。和 wan 全系一样，发布格式不是部署格式 ——
        `generate.py` 的 `--dtype` 默认就是 `bf16`
  inference_default: BF16
  # 这一份没有任何量化：15 份组件 config 一个 `quantization_config` 都没有，
  # 落盘也没有 scale 容器与打包容器。所以 method / weight_block_size /
  # scale_format / activation_scheme 一律**不填** —— 字段缺席在三态契约里判成
  # 「未声明」，填一个值等于凭空造出一次量化声明。
  # per_subsystem 照填：**「全 F32」是结论不是缺口**，而它恰恰是这一份最该被看见的
  # 那个事实 —— 一套 DiT 33.3 GB，而部署按 `--dtype bf16` 走，落盘与部署差一倍。
  quantization:
    per_subsystem:
      attention: FP32
      dense_ffn: FP32
      modulation: FP32
      time_embed: FP32
      io_proj: FP32
      norm: FP32
      vision: FP32
      other: FP32
    subsystem_method: >-
      **测自 `transformer/720p_t2v` 这一套 checkpoint**，对它的完整权重清单用
      `scripts/lib/subsystems.py` 的 `classify2()` 逐条分桶统计 ——
      **穷举，非抽样**：1793 条张量全部参与，`fetched.json` 的 `failed_shards` 为空，
      逐桶参数量相加 8,326,608,160 与 `params.total` 逐位相同。
      **1793 条里 1793 条是 F32，一条例外都没有**，所以每一格的 FP32 是全量结论
      而不是代表值；清单里没有任何 scale 容器、没有任何打包容器，
      `per_subsystem_scale` 与 `per_subsystem_block` 因此是「不存在」而不是「没测」。

      **为什么必须说明是哪一套**：这个仓有 11 套各 33.3 GB 的完整 DiT，
      本表与 `params` 量的都是 `720p_t2v`（理由见 `params.counting_note`）。
      「全 F32」这一句覆盖整个仓 —— 14 个 safetensors 逐文件读头确认，见
      `weights_release_scope`；**但逐子系统的分桶只在 720p_t2v 上做过**。
      其中 8 套（含唯一那套稀疏 `720p_i2v_distilled_sparse`）张量数、参数量、
      字节数三项逐字同形（1793 / 8,326,608,160 / 33,306,432,640），分桶可以照搬；
      另外 3 套（两个 SR 与 `480p_i2v_step_distilled`，都开 `use_meanflow`）
      各多 4 个张量 / 约 4.7M 参数，**那 4 条没有逐条取过名字**
      （4.7M 恰等于 `time_in.mlp` 整套 4,722,688，与 meanflow 要吃两个时间步自洽，
      但这是推断不是实测）。

      **逐桶实测**（条数 / 参数量，全 F32）：
      `dense_ffn` 440 / 3,692,113,920；`modulation` 222 / 2,744,414,208；
      `attention` 872 / 1,846,394,880；`time_embed` 12 / 20,983,808；
      `io_proj` 12 / 18,952,224；`vision` 8 / 3,696,000；
      `norm` 226 / 46,976；`other` 1 / 6,144。
      八个桶与 `per_subsystem` 的八个键**同集合**，且与
      `derived.from_shapes.params_by_subsystem` 逐位相同 ——
      **桶空就不补行**（CLAUDE.md 的约定），所以这里有几个键就有几个非空桶。

      **空桶 11 个，判「不适用」的依据逐条如下**（裸正则在这 1793 个名字上命中 0 次，
      不只是优先级被抢走）：`expert` / `shared_expert` / `router` —— 稠密 DiT，没有 MoE；
      `compressor` / `indexer` —— SSTA 的稀疏是从 Q·K 现算的、不带权重，判据是
      `720p_i2v_distilled_sparse` 与 `720p_i2v_distilled` 的张量数、参数量、字节数
      三项完全相同，多一个索引器必然同时改这三个数（见 R2）；`retrieval` —— 无检索表；
      `embed` / `lm_head` —— DiT 既没有 token 词表也没有输出头，出口是
      `final_layer.linear` [32, 2048]（回到 32 个 latent 通道），归入口/出口投影；
      `draft` —— 非自回归，没有 MTP / 草稿块；`audio` —— 不生成音频，
      15 份组件 config 里没有 audio VAE 也没有声码器。
      `residual` 这一格要读窄一点：**它只说「这个子系统没有权重」，不等于「残差是普通相加」**
      —— minimax 两份就是系数藏在 config 标量里的非常规残差，照「清单里没张量」
      推残差形态会推反（这是 `tracking` 侧 C7 那条的同一个坑）。

      **两个桶曾经与 derived 对不上，`fb35da8` 之后不再**（原委见 R10，这里只留口径）。
      (1) **时间步嵌入**：`time_embed` 现在是 12 条 / 20,983,808，三样东西 ——
      `time_in.mlp.*` 4,722,688 与 `txt_in.t_embedder.mlp.*` 4,722,688
      （两个真正的时间步嵌入器，入口都是 **256** = 正弦时间步特征），
      加 `txt_in.c_embedder.linear_1/2` 11,538,432。
      **`c_embedder` 按形状不是时间步嵌入** —— 入口 **3584** 正是文本编码器的 hidden，
      而这一份两个真的时间步嵌入器入口都是 **256**（正弦特征宽度）。
      这一刀纯靠形状，没读实现。

      **但「它是池化的」这半句形状判不出来，这一份是 `model-audit` 规则 12
      「形状判不出来」那一侧的样本，而且比规则里举的例子更刁**：
      `txt_in.c_embedder.linear_1` 是 [2048, 3584]，
      而 `txt_in.input_embedder` **也是 [2048, 3584]** —— 两个形状逐位相同，
      一个吃池化后的单条向量、一个吃逐 token 的文本流。
      所以「`c_embedder` 每次前向只过一遍」这个口径**不是形状结论**，
      它来自实现（本记录 `param_scaling.note` 早先那一轮记的
      「这三项吃的是条件向量、每次前向只过一遍」），
      **按规则 12 的要求在此写明用的是哪一种**：前半句形状、后半句实现。

      **决定：`c_embedder` 不从 `time_embed` 里切出去**（主会话把这一刀交给本线定）。
      三条理由，按强到弱：
      (a) **切不动** —— 要把它和 `input_embedder` 分开，形状给不出判据（两者同形），
      只能按 `c_embedder` 这个名字切，而那是往共享文件里加一条腾讯专用名；
      (b) **切了也不影响这张表** —— 这一格的用途是报精度，而两边都是 FP32，
      切与不切页面上的值一个字不变；
      (c) **按功能分桶反而支持合在一起** —— 喂给 AdaLN 的四处
      （`img_mod` / `txt_mod` / `final_layer.adaLN` / refiner 的 adaLN）入口全是 **2048**，
      而 `t_embedder` 与 `c_embedder` 的出口都正好是 2048：
      两者产出的是同一个条件向量的两个加数，功能上同一级。
      **所以不准的是桶的标签而不是桶的成员** —— 要精确该改显示层而不是归类正则。
      **已落地（`66b3b18`，主会话改的，本记录没碰那两个共享文件）**：
      `data/schema/subsystems.json` 里 `time_embed` 的 label 从「时间步嵌入」
      改成**「时间步与条件嵌入」**，正则一个字没动，分桶与本表的值都不变
      （复核过：`66b3b18` 之后逐桶与 `derived.from_shapes` 仍逐位相同）。
      所以精度页上这一行的列头现在读作「时间步与条件嵌入」，
      与这一格实际装的三样（两个时间步嵌入器 + 池化文本条件嵌入）对上了。

      **这个标签的实测作用域要钉住：全仓 `time_embed` 桶非空的九份记录里，
      只有这一份装着非时间步的成员。** 逐份扫过（2026-10-31）——
      另外八份（cogvideox-1.5-5b、ltx-2、ltx-2.3、minimax-h3、stepvideo-t2v-30b、
      wan 三份）这一桶 **100% 是时间步嵌入器**（`timestep_embedder` /
      `time_embedder` / `time_embed*` / `time_projection`）；
      本份的 `c_embedder` 11,538,432 占这一桶 **55%**。
      所以那个列头是**桶的定义**（「产出喂给 AdaLN 的那条条件向量」那一级）
      而不是逐份的内容描述 —— 它在另外八份页面上说的「与条件嵌入」目前无对应成员。
      定义级的标签是对的选择（按内容起名就得一份一个名），但**读者在页面上看不到这个比例**：
      改标签的理由只写在 `subsystems.json` 的顶层 `$comment` 里，
      而 `site/src/lib/data.ts` 只读 `key` 与 `label` 两个字段，那段注释没有消费点。
      前两样原先整批算在 `dense_ffn` 里（那时这一格只有 `c_embedder` 一样），
      现在由一条**只认「时间步嵌入器自己的 `mlp`」**的窄规则在 `dense_ffn` 之前截下。
      **那条窄规则现在只剩一个独有的活：`time_in.mlp.*`** ——
      实测逐个删它的 alternative，删 `time_in` 会让 4,722,688 静默退回 `dense_ffn`，
      删 `t_embedder` / `time_embedder` / `timestep_embedder` 全仓 0 处变动
      （它们已被排在 `dense_ffn` 之前的那条宽 `time_embed` 兜住）。
      **看见「重复」就删那三个 alternative 是安全的，删 `time_in` 不是。**
      (2) **入口/出口投影**：`io_proj` 现在是 12 条 / 18,952,224 ——
      `txt_in.input_embedder` 7,342,080 + `byt5_in.fc1/2/3` 11,409,408 +
      `img_in.proj` 135,168 + `final_layer.linear` 65,568。
      原先该词条的六个模式（patch_embed / proj_in / proj_out / text_proj /
      caption_proj / unpatchify）在腾讯这套名字上一条都不命中，这 12 条整批落在
      `other`，而这一格是手填的 —— **手填的理由是留空会被三态契约判成
      「这个子系统在这个模型里不存在」，而它占了 `other` 的 99.97%**。
      词条补上四个名字之后它由归类器兜住了，**不再是手填**，
      `other` 只剩 `cond_type_embedding` 6,144（条件类型查表，不是投影，
      有意留在 `other`：`embed` 这个桶的含义是输入词表，塞进去会让
      「输入词表」这一行在一个没有 token 词表的 DiT 上长出值）。
      **那 6,144 要留神一件事：它在桶里落 `other`，而 `params.breakdown` 把它
      算进了 `adaln_modulation`**（见 `counting_note` 的分桶口径）——
      同一个张量在两根轴上归属不同，不是哪一边错了，
      但它是 R11 那个 41,433,088 里唯一要**减**掉的一项，
      也正因为它在这两个桶之外，只在两桶内部做子集和永远凑不出那个差。

      两处归类都由主会话改在共享文件 `scripts/lib/subsystems.py` 上（`fb35da8`），
      **本记录从头到尾没碰过那个文件**；精度值一格都没变（1793 条全 F32）。

performance:
  # 技术报告 §6 Table 7/8。**这组数能进 performance 的理由是它带基线** ——
  # 厂商材料里的倍数十有八九没说对照的是什么，那种只能进 open_question。
  - source:
      type: official
      ref:
        kind: paper
        url: https://arxiv.org/abs/2511.18870
        locator: §6 Table 7（SSTA 对稠密注意力，无工程加速）
    hardware: H800
    device_count: 8
    engine: 官方实现（CFG 蒸馏档，未叠 SageAttention / torch.compile / 特征缓存）
    resolution: 720p
    frames: 241
    seconds_per_step: 2.9475
    speedup: 1.87
    baseline:
      what: 同配置下的稠密注意力（FlashAttention-3）
      seconds_per_step: 5.5070
    visibility: public
  - source:
      type: official
      ref:
        kind: paper
        url: https://arxiv.org/abs/2511.18870
        locator: §6 Table 7
    hardware: H800
    device_count: 8
    engine: 官方实现（CFG 蒸馏档，未叠工程加速）
    resolution: 720p
    frames: 121
    seconds_per_step: 1.5638
    speedup: 1.28
    baseline:
      what: 同配置下的稠密注意力（FlashAttention-3）
      seconds_per_step: 2.0084
    visibility: public

bottlenecks:
  - dimension: compute
    finding: >-
      **一半的参数在为 1.75% 的 token 服务。** 双流 MMDiT 的 txt 侧与 img 侧
      参数逐字节相同，但 img 侧处理 111,600 个视频 token，txt 侧只处理
      **1,985** 个（= LLM 1000 + byT5 256 + vision 729，来源见默认档的 note）
    quantified: >-
      `ffn_txt` 1,812,492,288 = `ffn_img`；`self_attention_txt` 906,425,856 =
      `self_attention_img`。两路合计占主干 65.3%，其中一半走文本。
      默认档 720p×121 帧 → latent 31×45×80 = 111,600 个视频 token，
      文本 1,985 个 —— 占两路 token 合计的 **1,985 / 113,585 = 1.75%**。
      初稿写的是「不到 1%」与「几百个」，**那是在没数过文本 token 时的印象**；
      填 `buckets[].text_tokens` 时实测出来是 1,985，差了一倍有余（见 R8）
    fix: >-
      按参数量分配 kernel 与量化预算会把一半力气投在 txt 侧。
      和 wan2.2-ti2v-5b 的 cross-attn 是同一类错误，但这一份更极端：
      那边 cross-attn 至少还对全部视频 token 做 query，这边 txt 流是独立的一路
    visibility: public
  - dimension: compute
    finding: >-
      注意力占单步算力的 **90%**，而模型只有 8.3B ——
      根因是 patch_size (1,1,1)：VAE 压到 16× 之后 DiT 不再 patchify，
      序列长度是同线 minimax-h3 的 1.54 倍，而参数只有它的 1/4
    quantified: >-
      默认档 111,600 token。单步注意力 4×54×2048×111,600² = **5.509e15**；
      单步线性只有 **6.088e14** —— 按真正逐视频 token 的那 2,727,511,584 参数算，
      不是按全部 8.33B（AdaLN 那 32.71% 是逐样本的，见 R4）。
      **注意力占 90.0%。** 对照 minimax-h3 同口径：72,576 token、注意力占 66.2%。
      **2026-10-31 复核：这一行原先还跟着一句「`data/derived/` 里的数是 74.8% 与
      54.2%，那是把 AdaLN 当逐 token 算出来的」—— 那句已经过期并删掉了。**
      `param_scaling` 落地之后 derive 自己算的就是 **89.9% 与 66.2%**（见 R9）。
      与本行 90.0% 差的那 0.1 个百分点是口径不是误差：本行的线性项 6.088e14
      只含逐视频 token 那一路，derive 的 6.202e14 另含逐文本 token
      （2,871,435,648 × 1,985）与逐样本两项。两种读法都对，引的时候说清是哪一种
    fix: >-
      SSTA 就是冲这里来的，**而且报告给了带基线的数**（§6 Table 7，8×H800、
      无工程加速、CFG 蒸馏档、每步秒）：
      720p 241 帧 5.5070 → 2.9475 s/step（**1.87×**）、
      720p 121 帧 2.0084 → 1.5638 s/step（**1.28×**）。
      Table 8 叠上 SageAttention + torch.compile + 特征缓存后跑 50 步：
      241 帧 96.78 → 58.39 s（1.66×）、121 帧 28.33 → 26.41 s（1.07×）。

      **加速比随序列长度走，正好印证注意力占比**：121 帧档注意力占 90.0%、
      241 帧档占 94.7%，对应 1.28× 与 1.87×。稀疏只能吃 O(n²) 那一项，
      所以短片段上它几乎白给 —— 这条对排产能比那个 1.87× 的标题数有用得多。

      但官方只发了 `720p_i2v_distilled_sparse` 一套稀疏权重，
      而且它是单独微调的（R2）—— 想在 t2v 或 480p 上用稀疏，现在没有权重
    visibility: public
  - dimension: host-io
    finding: >-
      「8.3B / 消费级显卡可跑」只说 DiT 一套。`--sr` 默认开，
      常规一次生成要串起基座 DiT、SR DiT、VAE 三套，
      再加三个**都不在仓里**的编码器，其中一个还在别家的 gated 仓
    quantified: >-
      基座 33,306,432,640 B + 720p SR 33,325,593,728 B + VAE 5,042,536,460 B
      = 71,674,562,828 B（66.75 GiB，F32）。外加 MLLM 替代品 8.29B。
      卡说最低 14 GB 显存 —— 那是开 offload 的数
    fix: >-
      文本编码器与 VAE 每次生成各跑一遍，两套 DiT 分属两个阶段、不必同时在显存里。
      厂商脚本给的就是 group offloading（`--group_offloading`、
      `--overlap_group_offloading` 默认开）
    visibility: public

infra_signals:
  - text: >-
      **生成类 DiT 的参数量里有三分之一完全不参与 token 计算。**
      AdaLN 调制吃掉主干 32.71%（同线 minimax-h3 39.41%），
      而它吃的是条件向量、每次前向只过一遍，再广播到全部 token ——
      实现里 `img_mod(vec)` 与 `scale.unsqueeze(1)` 两处坐实。
      所以「2 × 参数量 × token 数」这个常用的粗估，在这一代生成类上会把线性项
      高估 1.6–3 倍（这一份 3.05 倍、h3 1.65 倍）。
      **按参数量估算力，在生成类上不只是不准，是系统性偏高**
    evidence: derived
  - text: >-
      **VAE 压缩率与 DiT patch 的乘积决定一切，而两家的分法不同。**
      这一份 16×1 = 16，minimax-h3 是 16×2 = 32。
      结果是 8.3B 的模型要处理 111,600 个 token，而 33B 的模型只处理 72,576 个，
      前者的注意力占比反而更高（90.0% vs 66.2%，按 R4 的真口径）。
      **给生成类模型排产能，看参数量会得出相反的结论**
    evidence: derived
  - text: >-
      稀疏注意力这一代仍是「按 checkpoint 发」而不是「按开关开」。
      SSTA 的架构与参数量和稠密版完全相同，但权重是单独微调的，
      而且官方只发了 720p i2v 一套。引擎侧要支持稀疏，拿到的不是一个 flag，
      是一套额外的 33 GB 权重与一个只覆盖部分档位的矩阵
    evidence: judgement

