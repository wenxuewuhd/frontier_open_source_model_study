  - id: R10
    field: precision.quantization.per_subsystem
    severity: missing
    claim: >-
      逐子系统精度这一块在这一份上「没什么可填的」——
      反正全是 F32，而且 `precision.weights_release` 已经写了 FP32
    finding: >-
      **留空的后果不是少一格，是页面在说假话。** `precision.quantization` 整块缺席时，
      三态契约把 19 个子系统行**全部**判成「未录」（本仓 `validate.py --list-gaps`
      当时把这一份连同另外几份生成记录一起列着）—— 而「未录」的含义是
      **本仓没查过**，可事实一直在手边：`facts/hunyuanvideo-1.5/shapes.json`
      每个张量都带 dtype。于是精度演进页逐子系统那片全是 `?`、家族页整块 0 行，
      **一份实测得最彻底的记录在精度表上看起来像没取过数**。
      `weights_release: [FP32]` 补不上这件事：它是整仓一个值，答不出
      「哪个子系统是什么精度」，而 `weights_release_scope.FP32.in_precision_table`
      当时已经填着 `true` —— 那张表其实不存在。

      这次按 `classify2()` 对 `transformer/720p_t2v` 的完整清单 1793 条穷举
      （非抽样，逐桶参数量相加与 `params.total` 逐位相同），结论见
      `subsystem_method`：**1793 条全 F32，一条例外都没有**，当时 7 个桶有权重、
      11 个桶为空，另加一个「桶空而功能存在」的 `io_proj`（见下文 (2)，
      `fb35da8` 之后它有权重了，所以现在是 8 + 11）。
      「全 F32」是结论不是缺口 —— 一套 DiT 落盘 33.3 GB
      而 `generate.py` 按 `--dtype bf16` 跑，这一倍差正是这张表该让人看见的东西。

      **复核中查出的两处归类落点，都在共享文件 `scripts/lib/subsystems.py` 上。**
      (1) `time_embed` 在这一份上量到的只有 `txt_in.c_embedder.linear_1/2`
      （4 条 / 11,538,432），而 `c_embedder` 按形状就不是时间步嵌入 ——
      入口 3584 是文本编码器的 hidden，它是池化文本投影。真正的两个时间步嵌入器
      `time_in.mlp.*` 与 `txt_in.t_embedder.mlp.*`（**8 条 / 9,445,376**，
      入口都是 256 = 正弦时间步特征）**仍归在 `dense_ffn`**：新词条排在
      `dense_ffn` 之后，`mlp` 先匹配先得；而 `time_in` 连 `time_embed` 的裸正则
      都不命中（词条写的是 `time_embed` / `timestep_embed` / `\bt_embedder\b` /
      `c_embedder` / `time_projection`）。**派活时给的前提说是 4 条，实际是 8 条** ——
      少的那 4 条是 `time_in.mlp.*`，它不是被抢走的，是压根没被匹配。
      (2) `io_proj` 的六个模式在这一份上一条都不命中，入口与出口投影整批落在
      `other`：`txt_in.input_embedder` 7,342,080 + `byt5_in.fc1/2/3` 11,409,408
      + `img_in.proj` 135,168 + `final_layer.linear` 65,568 = **18,952,224**，
      `other` 剩下的 6,144 是 `cond_type_embedding`。
      **这一格因此不能留空** —— 留空会被判成「这个子系统在这个模型里不存在」，
      而它占了 `other` 的 99.97%。
      形状判据照 `model-audit` 规则 12 走，**没有去读实现**：
      256 入口 vs 3584 入口、65 通道 patch 投影、[32, 2048] 出口，
      这四个形状各自就定了性质。

      **以上两段写的是 `fb35da8` 之前的状态，留着是为了能对照看。**
      两处归类都已落地（见 `changed_to`），所以「仍归在 `dense_ffn`」
      「六个模式一条都不命中」「io_proj 是手填的」这三句**现在都不成立了**。

      **这一条自己还留下一个教训**：`time_embed` 那处我报给主会话时说
      「8 条」，而它先前的探针报的是「4 条」—— 差的 4 条是 `time_in.mlp.*`，
      它连宽 `time_embed` 的裸正则都配不上，于是**压根没出现在那个探针的结果里**。
      两头各自都只看见自己工具命中的那一半。
      **「我的工具没看见」不等于「只有这么多」**，而两种缺项（优先级被抢
      vs 词表没有这个写法）在结果里长得一模一样，都只是「这一格数小了」
      （本仓坑 #7 的同一张脸）。要分开它们只能逐条看裸正则命中数，
      这也是上面「空桶 11 个」那段为什么专门写了「裸正则命中 0 次」
    resolution: corrected
    changed_to: >-
      本记录填了 `per_subsystem` 八格与 `subsystem_method`。
      两处归类建议由主会话**原样采纳并落地在 `fb35da8`**：窄规则
      `(?:time_in|t_embedder|time_embedder|timestep_embedder)\.mlp\.`
      插在 `dense_ffn` 之前，`io_proj` 追加
      `input_embedder` / `\bimg_in\b` / `\bfinal_layer\b` / `\bbyt5_in\b`（位置不动，仍排最后）。
      落地后本记录逐桶数改成终态（`dense_ffn` 3,692,113,920、`time_embed` 20,983,808、
      `io_proj` 18,952,224、`other` 6,144），八个键与八个非空桶同集合、
      与 `derived.from_shapes.params_by_subsystem` 逐位相同，
      **`io_proj` 不再是手填**。精度值一格都没变（1793 条全 F32）。
      **`scripts/lib/subsystems.py` 本记录从头到尾没碰过。**
      当时建议的另一条「把宽 `time_embed` 整体前移」**被实测否掉了**：
      它会抢走 LTX 与 stepvideo 的 `adaln_single.emb.timestep_embedder.*`
      （ltx-2.3 76,058,624、stepvideo 39,333,888），而 ltx-2.3 的 `time_embed`
      当时判的正是「不适用」—— 那句假话会反向变成「桶里躺着 7,600 万」。
      改用键在 `\.mlp\.` 上的窄规则，全仓只动这一份 8 条。
      `c_embedder` 该不该切出去已经定了：**不切**，三条理由见 `subsystem_method`
  - id: R11
    field: generation.backbone.param_scaling
    severity: imprecise
    claim: >-
      `modulation + time_embed == param_scaling.per_sample` 是生成类的恒等式，
      可以当逐子系统归类的回归判据（主会话按 cogvideox 与 minimax-h3 两份下的结论，
      并在 `subsystems.py` 注释里称它是「本条规则最硬的回归判据」）
    finding: >-
      **这一份是反例，差 41,433,088 —— 而差额不是算错，是两根轴按设计切得不一样。**
      四份有 `per_sample` 的记录里三份成立（cogvideox 799,259,648、
      minimax-h3 13,055,204,736、stepvideo 267,644,928），这一份
      2,744,414,208 + 20,983,808 = 2,765,398,016 != 2,723,964,928。

      主会话报「那个差不是任何一组的干净子集，根因未查」。**它是三项的干净代数和**，
      逐项实测自 `shapes.json`：

      `+ adaLN_modulation 25,178,112` —— 在 `modulation` 桶里，不在 `per_sample` 里
      （`final_layer` 一套 8,392,704 + token refiner 两套 16,785,408）；
      `+ t_embedder.mlp 4,722,688 + c_embedder 11,538,432 = 16,261,120` ——
      在 `time_embed` 桶里，而本记录的轴把它们算进 `per_text_token`；
      `- cond_type_embedding 6,144` —— 在 `per_sample` 里，而它现在落 `other` 桶。
      25,178,112 + 16,261,120 − 6,144 = **41,433,088**，逐位相等。

      **根因早就写在本记录自己的 `param_scaling.note` 里，不是新缺陷。**
      那条 note 第三段原文就自曝了「两处 per_text_token 的分桶不纯，合计 1.15%，
      本次未改（会动已核过的数）」，其中第 (1) 条是
      「token_refiner 自己的 `adaLN_modulation` + `t_embedder` + `c_embedder`
      共 **33,046,528**，这三项吃的是条件向量、每次前向只过一遍，口径上属 `per_sample`」。
      而 33,046,528 + `final_layer` 的 adaLN 8,392,704 − 6,144 = 41,433,088 —— 同一个数。

      **这里我第一版写错了方向，按主会话 `9d3b5e6` 的更正改过来 ——
      记在这里因为那个错法很顺口。** 我原先写的是「`per_sample` 是负载轴、
      两个桶是功能桶，两根轴按设计切得不一样，所以不等是必然的，
      另三份相等只是它们结构简单」。**那个读法会把一个刚挣到位置的校验器讲成噪声。**
      正确的读法是：**这一份的 `per_sample` 本来就不纯，而且是记录自己认过的**，
      失配是判据在起作用。四项里 ——
      `token_refiner` 内的 modulation 16,785,408 与
      `t_embedder` + `c_embedder` 16,261,120 两项，是 `param_scaling.note`
      明文认过的不纯（它写了「本次未改」）；
      `cond_type_embedding` 6,144 是桶这边的归属（它落 `other`）；
      而 `final_layer.adaLN_modulation` **8,392,704 这一项，此前没有任何地方记过** ——
      它既不在 `adaln_modulation` 里，也没在任何 note 里被认领，
      是被这条判据揪出来的。**所以这次失配的净产出是一个新事实，不是一次误报。**
      已在 `params.counting_note` 里补明那两个按模块切的桶
      （`token_refiner` 23.4% 是调制与条件嵌入、`patch_embed` 97.7% 是出口的 AdaLN）。

      判据的正确用法因此是主会话最后定的那一条：**不等时先问「这份记录的
      `per_sample` 纯不纯」，答案在它自己的 `param_scaling.note` 里** ——
      而不是先怀疑归类。

      **三个占比数，各自自洽，别混着引**（分母都是 `params.total` 8,326,608,160）：
      `per_sample` 2,723,964,928 = **32.71%**（本记录散文里引的就是这个，对的）；
      `modulation` 桶 2,744,414,208 = **32.96%**；
      `modulation + time_embed` 2,765,398,016 = **33.21%**。
      要讲「这些参数每次前向只过一遍」用 32.71%，要讲「调制这个子系统有多大」
      用 32.96%，**两者不是同一个量，不要互相校验**
    resolution: confirmed
    changed_to: >-
      `param_scaling.per_sample` 2,723,964,928 **原值正确，一个字没改**；
      `modulation` / `time_embed` 两个桶的值、九个 `breakdown` 桶的值也都没改
      （九桶相加仍逐位等于 `params.total`）。
      补的是依据：差额的四项分解、三个占比各自的口径，以及
      `params.counting_note` 里原先缺的那两条桶定义 ——
      **`patch_embed` 97.7% 是出口的 `final_layer.adaLN_modulation`、
      `token_refiner` 23.4% 是调制与条件嵌入**，这两条此前谁也看不出来。
      **不要去「修」成相等** —— 要让它相等得改 `breakdown` 的切法，
      那会动已核过的数，且 `param_scaling.note` 原意就是不在这一轮改。
      **拿这个恒等式当回归判据只能对那三份用**，对这一份要先把
      `per_sample` 的分桶不纯修掉 —— 而那会动已核过的数，仍按 note 原意不在本轮改

notes: >-
  **字节对账。** 14 个 safetensors 实测 numel×4 B 之和 371,757,753,484 B，
  HF 的 usedStorage 371,771,397,110 B，差 13,643,626 B（README、assets 与
  14 个 safetensors 头）。**这个仓的 usedStorage 是干净的** ——
  没有旧修订版残留（wan2.2-ti2v-5b 多算了一份 DiT），
  也没有两套并列布局（minimax-h3 是实际的 2.46 倍）。视频线三份记录，
  usedStorage 三种行为，所以它**不能当成「当前修订版权重总字节」直接用**。

  **帧数→latent 的映射，与同线 minimax-h3 的对照。**
  这一份：`get_latent_size()` 就是 `(F−1)//4 + 1`，VAE 的
  `temporal_tiled_encode()` 直接 raise，没有分块路径 —— 公式成立，
  121 帧 → 31 个 latent 帧，端到端有效时间压缩率 3.903。
  minimax-h3：VAE 按 17 帧一块编码、每块 5 个 token、整段末尾丢 3 个，
  公式不成立，243 帧 → 72 个 latent 帧，有效比值 3.375。
  **两份都自称「时间因果、压缩 4×」，而端到端比值一个 3.903 一个 3.375。**
  看到帧数约束（这边 4n+1、那边 17n+5）就该去读 VAE 实现。

  **取数提醒。** 这个仓有顶层 config.json（pipeline 级，不含 DiT 形状），
  15 份组件 config，14 个 safetensors。
  `fetch_hf.py --include 'transformer/720p_t2v/*'` 取一套即可 ——
  11 套 DiT 的张量名完全相同，不收窄会撞名。

