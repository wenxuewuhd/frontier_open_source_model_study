precision:
  weights_release: [FP32]
  weights_release_scope:
    FP32:
      manifest_taken: true
      in_precision_table: true
      repo: tencent/HunyuanVideo-1.5
      note: >-
        14 个 safetensors（11 套 DiT + VAE + 2 个 upsampler）**无一例外全是 F32**，
        逐文件读头确认。和 wan 全系一样，发布格式不是部署格式 ——
        `generate.py` 的 `--dtype` 默认就是 `bf16`
  inference_default: BF16

bottlenecks:
  - dimension: compute
    finding: >-
      **一半的参数在为不到 1% 的 token 服务。** 双流 MMDiT 的 txt 侧与 img 侧
      参数逐字节相同，但 img 侧处理 111,600 个视频 token，txt 侧只处理
      几百个文本 token（byT5 那路上限 256）
    quantified: >-
      `ffn_txt` 1,812,492,288 = `ffn_img`；`self_attention_txt` 906,425,856 =
      `self_attention_img`。两路合计占主干 65.3%，其中一半走文本。
      默认档 720p×121 帧 → latent 31×45×80 = 111,600 个视频 token
    fix: >-
      按参数量分配 kernel 与量化预算会把一半力气投在 txt 侧。
      和 wan2.2-ti2v-5b 的 cross-attn 是同一类错误，但这一份更极端：
      那边 cross-attn 至少还对全部视频 token 做 query，这边 txt 流是独立的一路
    visibility: public
  - dimension: compute
    finding: >-
      注意力占单步算力的四分之三，而模型只有 8.3B ——
      根因是 patch_size (1,1,1)：VAE 压到 16× 之后 DiT 不再 patchify，
      序列长度是同线 minimax-h3 的 1.54 倍，而参数只有它的 1/4
    quantified: >-
      默认档 111,600 token。单步注意力 4×54×2048×111,600² = **5.509e15**；
      单步线性只有 **6.088e14** —— 按真正逐视频 token 的那 2,727,511,584 参数算，
      不是按全部 8.33B（AdaLN 那 32.71% 是逐样本的，见 R4）。
      **注意力占 90.0%。** 对照 minimax-h3 同口径：72,576 token、注意力占 66.2%。
      （`data/derived/` 里的数是 74.8% 与 54.2%，那是把 AdaLN 当逐 token 算出来的）
    fix: >-
      SSTA 就是冲这里来的，**而且报告给了带基线的数**（§6 Table 7，8×H800、
      无工程加速、CFG 蒸馏档、每步秒）：
      720p 241 帧 5.5070 → 2.9475 s/step（**1.87×**）、
      720p 121 帧 2.0084 → 1.5638 s/step（**1.28×**）。
      Table 8 叠上 SageAttention + torch.compile + 特征缓存后跑 50 步：
      241 帧 96.78 → 58.39 s（1.66×）、121 帧 28.33 → 26.41 s（1.07×）。

      **加速比随序列长度走，正好印证注意力占比**：121 帧档注意力占 90.0%、
      241 帧档占 94.7%，对应 1.28× 与 1.87×。稀疏只能吃 O(n²) 那一项，
      所以短片段上它几乎白给 —— 这条对排产能比那个 1.87× 的标题数有用得多。

      但官方只发了 `720p_i2v_distilled_sparse` 一套稀疏权重，
      而且它是单独微调的（R2）—— 想在 t2v 或 480p 上用稀疏，现在没有权重
    visibility: public
  - dimension: host-io
    finding: >-
      「8.3B / 消费级显卡可跑」只说 DiT 一套。`--sr` 默认开，
      常规一次生成要串起基座 DiT、SR DiT、VAE 三套，
      再加三个**都不在仓里**的编码器，其中一个还在别家的 gated 仓
    quantified: >-
      基座 33,306,432,640 B + 720p SR 33,325,593,728 B + VAE 5,042,536,460 B
      = 71,674,562,828 B（66.75 GiB，F32）。外加 MLLM 替代品 8.29B。
      卡说最低 14 GB 显存 —— 那是开 offload 的数
    fix: >-
      文本编码器与 VAE 每次生成各跑一遍，两套 DiT 分属两个阶段、不必同时在显存里。
      厂商脚本给的就是 group offloading（`--group_offloading`、
      `--overlap_group_offloading` 默认开）
    visibility: public

infra_signals:
  - text: >-
      **生成类 DiT 的参数量里有三分之一完全不参与 token 计算。**
      AdaLN 调制吃掉主干 32.71%（同线 minimax-h3 39.41%），
      而它吃的是条件向量、每次前向只过一遍，再广播到全部 token ——
      实现里 `img_mod(vec)` 与 `scale.unsqueeze(1)` 两处坐实。
      所以「2 × 参数量 × token 数」这个常用的粗估，在这一代生成类上会把线性项
      高估 1.6–3 倍（这一份 3.05 倍、h3 1.65 倍）。
      **按参数量估算力，在生成类上不只是不准，是系统性偏高**
    evidence: derived
  - text: >-
      **VAE 压缩率与 DiT patch 的乘积决定一切，而两家的分法不同。**
      这一份 16×1 = 16，minimax-h3 是 16×2 = 32。
      结果是 8.3B 的模型要处理 111,600 个 token，而 33B 的模型只处理 72,576 个，
      前者的注意力占比反而更高（90.0% vs 66.2%，按 R4 的真口径）。
      **给生成类模型排产能，看参数量会得出相反的结论**
    evidence: derived
  - text: >-
      稀疏注意力这一代仍是「按 checkpoint 发」而不是「按开关开」。
      SSTA 的架构与参数量和稠密版完全相同，但权重是单独微调的，
      而且官方只发了 720p i2v 一套。引擎侧要支持稀疏，拿到的不是一个 flag，
      是一套额外的 33 GB 权重与一个只覆盖部分档位的矩阵
    evidence: judgement

