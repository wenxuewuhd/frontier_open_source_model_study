reviewed:
  date: '2026-10-31'
  method: >-
    Gate B 三路：组件 config（15 份）、权重清单（14 个 safetensors 逐文件读头）、
    厂商参考实现（pipeline 的 `get_latent_size` / `target_size_config`、
    VAE 的 `encode` / `temporal_tiled_encode`、`generate.py` 的默认值）。
    结构字段三路一致：hidden 2048 / 54 双流 0 单流 / heads 16 /
    `mlp_width_ratio 4` 四项 config 与清单逐项对上（`img_mlp.fc1` 是 [8192, 2048]
    = 2048×4，`img_attn_q_norm` 是 [128] = 2048/16）；
    VAE 的 16×/4×/32ch 在卡与 config 两处一致，且与 `get_latent_size` 用的
    压缩率一致。字节对账：实测 numel×4 B 与文件 HTTP 大小差 199,552 B（= 头）。
    **专门验了两件**：(1) VAE 有没有分块编码 —— 没有，`temporal_tiled_encode` 直接 raise；
    (2) 11 套 checkpoint 是不是同一批权重的多次打包 —— 不是，LFS oid 两两不同。
    Gate C：判断类字段 6 处，逐条在 evidence 里标了 judgement。

review:
  - id: R1
    field: generation.buckets
    severity: unsupported
    claim: 480p / 720p 对应哪组像素，卡上有写
    finding: >-
      卡上没写，`generate.py` 也只接受 `--resolution 480p|720p` 这种字符串。
      像素是**算出来的**：`target_size_config` 给 base_size 与 stride，
      `generate_crop_size_list(base, 16)` 枚举候选，再取与长宽比最近的一档。
      照这套复现 16:9：720p → 1280×720（比值恰好 0.5625，正中）、
      480p → 848×480（0.56604）、1080p → 1904×1072（0.56303）。
      **720p 那档正中 16:9 是巧合而不是设计** —— 另两档都不正中
    resolution: confirmed
    changed_to: >-
      buckets 按复现结果填，每档的 note 写明是算出来的以及比值偏差。
      evidence 标 derived 而不是 official
  - id: R2
    field: generation.checkpoint_variants
    severity: unsupported
    claim: >-
      11 套 transformer 里参数量相同的那些，是同一批权重按不同名字放了多份
      （minimax-h3 就是那种情况）
    finding: >-
      **不是。** 用 HF tree API 取 11 套的 LFS sha256，**两两全不相同**，
      包括参数量逐字节相同的 8 套。
      最值得记的一条是 `720p_i2v_distilled` 与 `720p_i2v_distilled_sparse`：
      两者 config 只差 `attn_mode` 与 `attn_param`，张量数与参数量完全相同，
      **但 oid 不同** —— 说明 SSTA 不是推理期翻个开关，是重新微调过的。
      仓的 usedStorage 371,771,397,110 B 与我逐文件相加的 371,757,753,484 B
      只差 13.6 MB（= README 与 assets），**没有重复计数** ——
      这和 minimax-h3（两套布局，usedStorage 是实际的 2.46 倍）、
      wan2.2-ti2v-5b（旧修订版 LFS 对象，多算一份 DiT）都不同
    resolution: confirmed
    changed_to: >-
      checkpoint_variants 逐套列出并标 resident；
      infra_signals 里写明「稀疏是按 checkpoint 发不是按开关开」
  - id: R3
    field: generation.backbone
    severity: miscategorized
    claim: DiT 的输入通道是 32（config 的 `in_channels`）
    finding: >-
      **config 与权重冲突，权重赢。** `img_in.proj.weight` 的形状是
      [2048, 65, 1, 1, 1] —— 入口 65 通道，不是 32。
      65 = 2×32 + 1，与 `concat_condition: true` 自洽：噪声 latent 32 +
      条件 latent 32 + 1 个掩码通道。两个 SR checkpoint 的 config 写 98 = 3×32 + 2，
      同一套规律。config 的 `in_channels` 描述的是 latent 本身的通道数，
      不是投影层的入口宽度
    resolution: corrected
    changed_to: >-
      `generation.vae.latent_channels` 填 32（那确实是 latent 的通道数），
      入口 65 通道写进 backbone.note。两个数不矛盾，是两个位置
  - id: R4
    field: '-'
    severity: wrong
    claim: >-
      `derive.py` 给出的单步线性 FLOPs 对这一份成立；
      以及本记录初稿说的「偏高约一倍，单步真值约 6.42e15」
    finding: >-
      **偏高 3.05 倍，不是一倍 —— 初稿自己也错了，根因找浅了。**

      初稿只找到一层：双流的 txt 侧参数不过视频 token。那层是对的，但还有更大的一层 ——
      **AdaLN 调制是逐样本的，不是逐 token 的**，而它占这份模型的 32.71%。
      实现里坐实：`img_mod(vec)` / `txt_mod(vec)` 吃的是条件向量 `vec` 而不是 token 流，
      `modulate()` 里 `scale.unsqueeze(1)` 再广播到 token 维
      （`hyvideo/models/transformers/hunyuanvideo_1_5_transformer.py:135` 与
      `modules/modulate_layers.py`）。所以那 2,723,964,928 参数每次前向只过**一遍**，
      不是过 111,600 遍。

      三类参数按各自乘什么分开：
      逐样本（adaln）2,723,964,928；
      逐视频 token（`self_attention_img` + `ffn_img` + `patch_embed`）2,727,511,584；
      逐文本 token（`self_attention_txt` + `ffn_txt` + `token_refiner` + `byt5_proj`）2,871,435,648。

      线性真值 = 2 × 2,727,511,584 × 111,600 = **6.088e14**（文本那一路 token 数未知，另计）；
      derive 给 2 × 8,326,608,160 × 111,600 = 1.859e15，**高 3.05 倍**。
      注意力项 5.509e15 不受影响。
      **单步真值 6.118e15，derive 给 7.368e15，高 20.4%；
      注意力真实占比 90.0%，不是 74.8%。**

      **这不是这一份独有的。** 同线 minimax-h3 的 adaln 占 39.41%，
      而它的 `adaln_proj.linear` 是 [96768, **2688**] 而 hidden 是 5376 ——
      入口宽度就不等于 token 宽度，**从形状上就能断定是逐样本**。
      它的线性真值 2.929e15（derive 给 4.835e15，高 1.65 倍）、
      单步真值 8.656e15（derive 给 1.056e16，高 22.0%）、注意力真实占比 66.2% 而非 54.2%。
      wan2.2-ti2v-5b 的 adaln 只占 1.35%，几乎不受影响
    resolution: corrected
    changed_to: >-
      bottlenecks 与 infra_signals 里的注意力占比改成真值 90.0%，结论不但不变，而且更强。

      **2026-10-31 复核：本条原先标 `open`，而它两件待办都已经关掉了，
      对应的 open_question 也早写着「已解决」—— 条目与 open_question 自相矛盾。**
      (1) 共享改法已落地：`backbone.param_scaling` 被 `derive.gen_workload` 消费后，
      derive 自己算的线性项是 6.202e14、注意力占 89.9%，与逐桶手算逐位吻合（见 R9）。
      (2) 点名要连带更正的 **minimax-h3 已经改好了**：它的 R6 现在是 `corrected`，
      bottlenecks 里一个旧占比都不剩，derived 现值 `attention_share` 0.6616 = 66.2%。
      原文里「并标出 derive 的 74.8%」这半句也随之作废 —— derive 早就不给 74.8% 了，
      那句连同 bottlenecks 里的旧括注一起删掉了。
      `derive.py` 与 `data/schema/` 是共享文件，本记录从头到尾没碰过。
      **剩下的唯一一处在 R6 末尾**：逐段线性项漏 `per_text_token × text_tokens`，
      端到端占 0.15%，主会话已收、下一轮改
  - id: R6
    field: '-'
    severity: imprecise
    claim: 推导给的端到端 FLOPs 8.400e17 可以直接引
    finding: >-
      **低约 18%，而且页面上看不到这一点。** `gen_workload()` 把三个阶段按
      **同一个单步 FLOPs** 相加（50×2 + 6×1 + 8×1 = 114 次 × 7.368e15），
      但三个阶段的 token 数不同：DiT 与 720p SR 在 111,600，
      1080p SR 的输出是 1904×1072 → latent 31×67×119 = **247,163**，
      而注意力是 O(n²)，这一段的单步是 3.114e16 而不是 7.368e15。

      逐段算：DiT 100×7.368e15 = 7.368e17；720p SR 6×7.369e15 = 4.421e16；
      1080p SR 8×3.114e16 = 2.491e17；**合计 1.030e18**，derive 给 8.400e17，低 18.5%。

      derive 自己知道这件事 —— `end_to_end_terms.note` 写着「各阶段按同一个单步
      FLOPs 估算…这里是粗估，不要当精确值」。**但那条 note 没有渲染到页面上**，
      页面只显示 8.400e17 与求和公式。产物存在、没有消费点

      **2026-10-31 复核：共享改法已落地，而本条自己那三个数现在都不对了。**
      `gen_workload()` 现在逐段按该段自己的 `out_width` / `out_height` 算 token
      与单步（产物里每段带 `tokens_source: stage`），1080p SR 段记的是 247,163，
      结构性缺陷已消。而本条写的 7.368e15 / 1.030e18 / 低 18.5% **全是用那个
      偏高 3.05 倍的线性项算出来的**（见 R4）—— 换成正确的单步之后逐段是：
      DiT 100×6.118e15 = 6.118e17、720p SR 6×6.118e15 = 3.671e16、
      1080p SR 8×2.837e16 = 2.270e17，**合计 8.755e17**，与 derive 现值逐位相同。
      **所以「低 18%」与「真值 1.030e18」两句都要作废**：一句的根因已修，
      另一句本身是旧线性项的产物。这正是 R4 那个错数字的第二处落点 ——
      **一个错数字进了记录，会在引用它的地方各长出一份**

      顺带一处小的、未修的：逐段那条线性项只算
      `per_video_token × 本段 token + per_sample`，**漏了
      `per_text_token × text_tokens`** 这一项（每步 1.140e13），
      于是逐段之和比 `flops_per_step.total × 次数` 少 1.30e15，占端到端 0.15%。
      量级可忽略，但它是口径不一致不是测量误差。`derive.py` 是共享文件，本记录没碰，已报主会话
    resolution: corrected
    changed_to: >-
      本条的 `claim` 与前半段原文保留做对照，结论换成复核后的 **8.755e17**
      （derive 现值，逐段口径）。**引端到端请用这个数，不要再用本条原先写的 1.030e18**。
      对应的 open_question 已标为已解决。逐段线性项漏文本项那一处仍开着，已报主会话
  - id: R7
    field: '-'
    severity: missing
    claim: 报告 §6 Table 7/8 的速度数据可以进 `performance[]`
    finding: >-
      **进不去，schema 装不下。** 这组数据按本仓的标准是够格的 ——
      `source.type: official`（技术报告）、硬件 8×H800、分辨率与帧数、
      50 步、说明了开不开工程加速、而且**有基线**（FlashAttention-3），
      比模型卡那句没基线的「1.87×」强得多。

      但 `performance[]` 的字段全是自回归形状：`throughput_tok_s`、
      `throughput_per_device`、`ttft_ms`、`tpot_ms`、`input_len`、`output_len`。
      生成类要记的是**每去噪步秒数**与**端到端秒数**，一个都没有。
      硬塞进 `tpot_ms`（time per output token）是范畴错误 ——
      那正是本仓反复强调不能做的事。

      本记录因此没有 `performance` 块，数据放在 bottlenecks.quantified 里带出处

      **2026-10-31 复核：建议的字段已落地，所以上面那句话现在是错的 ——
      本记录有 2 条 `performance`。** schema 的 `performance[]` 现在带
      `seconds_per_step` / `seconds_end_to_end` / `steps` / `frames` /
      `resolution` / `speedup` 与 `baseline` 子块，并且 `speedup` 填了就必须填
      `baseline.what`（闸口查），正是本条要的那一套。
      Table 7 的两档（241 帧 5.5070→2.9475、121 帧 2.0084→1.5638）已经进字段。
      **留着原文是因为它记着为什么不能硬塞 `tpot_ms`**，那条理由没有过期；
      过期的只是「本记录因此没有 performance 块」这一句事实陈述
    resolution: corrected
    changed_to: >-
      schema 侧由主会话加了生成类字段，本记录随后填了 2 条 `performance`
      （Table 7 的 241 帧与 121 帧两档，各带 `baseline.what: FlashAttention-3`）。
      `finding` 末尾补了日期与「那句话已不成立」，原文保留做对照。
      `data/schema/` 是共享文件，本记录没碰过它
  - id: R5
    field: generation.text_encoders
    severity: miscategorized
    claim: >-
      主文本编码器是「官方未发布的 HunyuanMLLM，社区用 Qwen2.5-VL-7B-Instruct 替代」——
      本记录初稿按 `checkpoints-download.md` 这么写的
    finding: >-
      **口径标错了。技术报告 §3.1 直接把 Qwen2.5-VL 写成模型用的编码器**：
      「This design leverages a visual-language multimodal encoder Qwen2.5-VL」，
      与 Glyph-ByT5 合成 dual-channel text encoder，**全文没有出现 HunyuanMLLM**。
      仓里那句「尚未发布最新的 HunyuanMLLM，建议用 Qwen2.5-VL-7B-Instruct 这类替代」
      说的是**更新的**内部模型，不改变已发布这一版用的是什么。
      报告是第一档来源、下载文档是第三档，按优先级以报告为准。
      第三路旁证：DiT config 的 `text_states_dim` 是 3584，正是 Qwen2.5-VL-7B 的 hidden。

      参数量那一问仍然只答得出一个：Qwen2.5-VL-7B 8,292,166,656（HF tally）；
      Glyph-ByT5 要 `google/byt5-small` 加 ModelScope 的 Glyph-SDXL-v2 两处，没核实规模；
