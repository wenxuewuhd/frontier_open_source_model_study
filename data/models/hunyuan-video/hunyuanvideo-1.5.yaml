    **前代 `hunyuanvideo-13b` 缺什么才能录 —— 逐条查过了。**

    缺的是**清单**，不是数。官方仓 `tencent/HunyuanVideo` 一共 10 个文件、
    **零个 safetensors**，权重是 4 个 `.pt`：
    `transformers/mp_rank_00_model_states.pt` 25,642,314,002 B（主干）、
