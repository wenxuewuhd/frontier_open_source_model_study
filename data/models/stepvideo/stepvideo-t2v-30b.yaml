params:
  total: 29342478400
  # 稠密主干，每一步对全部 token 过全部权重，没有路由、没有跨步复用
  active_decode: 29342478400
  active_prefill: 29342478400
  breakdown:
    ffn: 14495514624
    self_attention: 7247769600
    cross_attention: 7247769600
    adaln_modulation: 267644928
    text_proj: 75509760
    clip_proj: 6297600
    norm: 1179648
    patch_embed: 792640
  counting_note: >-
    **只含 DiT 主干**，按完整权重清单（6 分片 785 张量）逐项统计。
    全 BF16，无 scale 容器、无打包容器：29,342,478,400 × 2 B = 58,684,956,800 B。
    **与 HF 自己的 safetensors tally 逐位相同**，那是不依赖本仓代码的外部锚。
    卡称「30B」，实测 29.34B。

    **三块不在这个数里，但都在同一个仓里**（与 wan / hunyuanvideo-1.5 不同，
    那两家的编码器要去别处取）：
    文本编码器 Step-LLM 19,579,600,896 参数 / 39,159,201,792 B（BF16，9 分片 289 张量）、
    HunyuanCLIP（`pytorch_model.bin`，pickle，读不了清单，文件 3.94 GB）、
    视觉 VAE 498,818,819 参数 / 1,995,275,276 B（`vae_v2.safetensors`，全 F32）。
    一次推理四块都要在，**但它们跑在三个独立进程里**（见 notes）。

    分桶口径：`self_attention` 是 `attn1`（`wqkv [18432,6144]` = 3×6144 融合、
    `wo [6144,6144]`、两个 [128] 的 QK-norm）；`cross_attention` 是 `attn2`
    （`wq` + `wkv [12288,6144]` = 2×6144 + `wo`，**同样含两个 [128] 的 QK-norm** ——
    两桶各 150,995,200/层正是这么来的，逐字节相同不是巧合而是两侧张量集同构）；
    `ffn` 是 `[24576,6144]` + `[6144,24576]`，24576 = 4×6144，**非门控**；
    `adaln_modulation` 含全局的 `adaln_single.linear [36864,6144]`（36864 = 6×6144）、
    时间步嵌入，以及每层一个 `[6, 6144]` 的 `scale_shift_table`。

    **`breakdown` 的桶与 `precision.quantization.per_subsystem` 的桶不是同一套切法，
    但 2026-10-31 的归类三修（`ebfb3cd`）之后只剩一点差了**，逐条核过、不是哪一边算错：
    **QK-norm** —— `breakdown` 把每层 4 个 [128] 的 QK-norm 算进注意力两桶，
    而 `classify2()` 按「带 norm 的就是归一化，没有例外」统一归 `norm`，
    于是注意力两桶合计少 48 × 4 × 128 = **24,576**（14,495,539,200 → 14,495,514,624）、
    `norm` 多同样的 24,576（1,179,648 → 1,204,224）。

    其余都对得上：`ffn` 与 `dense_ffn` 逐位相同；
    `adaln_modulation` 267,644,928 在词表里是**两桶** ——
    `modulation` 228,311,040 + `time_embed` 39,333,888（`242e724` 按功能分桶之后，
    时间步嵌入不再被 `adaln` 领走）；
    `patch_embed` 792,640 + `text_proj` 75,509,760 + `clip_proj` 6,297,600
    = **82,600,000** 正是 `io_proj` 那一桶（R8 修好前它只有 393,280，
    另三样散在 `other` 与 `text_encoder` 组件里）。
    `breakdown` 八桶合计与词表六桶合计都等于 29,342,478,400。

generation:
  backbone:
    stream_design: single
    layers: 48
    double_blocks: 0
    single_blocks: 48
    hidden: 6144
    heads: 48
    head_dim: 128
    ffn: 24576
    text_conditioning: cross_attn
    patch_size: [1, 1, 1]
    position: 3D RoPE
    param_scaling:
      per_sample: 267644928
      per_video_token: 25367967808
      per_text_token: 3705686016
      note: >-
        三桶相加 29,341,298,752，加上 `norm` 的 1,179,648 等于实测总量 29,342,478,400。

        **`per_sample` 在这一份只占 0.91%**，因为它用的是 **AdaLN-Single**：
        全局一个 `adaln_single.linear [36864, 6144]` 加每层一个 `[6, 6144]` 的
        `scale_shift_table`，而不是每层一套 `[6×hidden, hidden]` 的投影。
        对照同线：hunyuanvideo-1.5 的 AdaLN 占 32.71%、minimax-h3 占 39.41%。
        **这是 2025-02 与 2025-11 / 2026-07 之间最大的一处结构代价变化**，
        三份记录钉住各自的代际看就是一条线。

        `per_text_token` 是交叉注意力的 KV 侧（`attn2.wkv`，48 × 2×6144²）
        加 `caption_projection` 与 `clip_projection` —— 它们只过 512 个文本 token
        （参考实现的 `text_len` 512）。`attn2` 的 `wq` 与 `wo` 过视频 token，
        所以 `cross_attention` 这个子系统桶是**跨两个标度桶**的，两种切法正交。

        注意这一份是**单流但带独立交叉注意力**：文本不在主序列里，
        所以 `per_text_token` 用的是它本来的语义，而不是 schema 描述里说的
        「单流就并进 per_video_token」那种情形。
        **文本那一项现在进了推导。** 原话写的是「推导会提示『没给文本 token 数、
        线性项是下界』」—— 那个提示已经不会出现了：`buckets[].text_tokens` 字段有了、
        这一份填了 512，derive 的 `linear_terms.factors.text_tokens` 就是它
        （见 R6）。它贡献 2 × 3,705,686,016 × 512 = **3.79e12**，
        占单步 1.065e16 的 **0.04%** —— 进不进来都不影响任何结论。
        顺带一提，`sequence_tokens_is_lower_bound` 在这一份上**本来就不会是 true**：
        那个标记只对 `text_conditioning: in_sequence` 成立，而这一份是 `cross_attn`，
        文本不在主序列里，所以注意力项从来不缺这一截
    note: >-
      **单流 + 独立交叉注意力**，与 wan 同构、与 hunyuanvideo-1.5 的双流相反。
      卡称「DiT w/ 3D Full Attention」，48 层 × 48 头 × 128 维与 config 和清单三处一致。

      **`patch_size` 是 (1,1,1)** —— VAE 已经压到 16×16，DiT 不再 patchify。
      `pos_embed.proj` 的形状 [6144, 64, 1, 1] 同时坐实了两件事：
      latent 是 **64 通道**、空间 patch 是 **1×1**。

      **交叉注意力与自注意力的参数逐字节相同**（各 7,247,769,600，各占 24.70%），
      但自注意力跑在 75,888 个视频 token 上、交叉注意力的 KV 只有 512 个文本 token，
      **148:1**。这和 wan2.2-ti2v-5b 是同一个形态（那边 53:1），这一份更极端

  vae:
    spatial_compression: 16
    temporal_compression: 8
    latent_channels: 64
    causal: true
    decoder_arch: conv3d
    params: 498818819
    name: Step-Video Deep-Compression Video-VAE（v2）
    note: >-
      空间 16× / 时间 8× / 64 latent 通道。
      **原话写的是「压缩率在已录的五份里最激进」，那句写下来的那一刻就是错的** ——
      ltx-2 与 ltx-2.3 已录在先，它俩是 32× 空间 / 8× 时间，时间维持平、空间维高一倍；
      本份的 16× 空间在九份里**四份并列第三**（本份、hunyuanvideo-1.5、minimax-h3、
      wan2.2-ti2v-5b，只有 ltx 两份的 32× 在前；口径是 VAE 自己的空间压缩率，不含 patch）。
      而且那份自己的表头就把 ltx 两份
      列成了前序记录 —— 手边有全量数据却没去数（见 cogvideox 记录的 R4）。
      真正少见的是**两个维度都压到底而且全靠 VAE**：patch 的 t 与 h/w 都是 1，
      九份里**四份**做到 —— 本份、ltx 两份、**以及 hunyuanvideo-1.5**
      （截至 2026-10-31，九份逐份读过 `backbone.patch_size`）。
      **改正「最激进」那句时写的「只有本份与 ltx 两份」又漏了一份**，
      而 hunyuanvideo-1.5 自己的 `generation.backbone.note` 写的就是
      「patch_size 是 (1,1,1)，VAE 已经压到 16×/4×，DiT 不再 patchify」——
      同一种毛病连犯两次：改数的时候还是只数了一半。
      `params` 填的是 `vae_v2.safetensors`（498,818,819，262 张量全 F32）——
      仓里还有一个 `vae.safetensors`（258,828,195），**那是 16 通道的另一版，
      不是这个模型用的**，见 R1。

      **但 8× 是块内的比，不是端到端的比。** 厂商实现把输入按 **17 帧**切块、
      每块独立编码成 **3 个 latent 帧**（`frame_len 17` / `latent_len 3`），
      没有 token_drop 也没有重叠，解码时再按 3→17 解回去并用 `mix()` 混一下块边界。
      所以端到端 `T = (F/17) × 3`，帧数∶token 比是 **5.667**。
      8× 来自块内：17 帧因果编码 = 1 + 16/8 = 3，正好整除 —— 两个数都对，是两个口径。
      默认档 204 帧 = 12 块 → **36 个 latent 帧**，已填进 `buckets[].latent_frames`（见 R2）

  text_encoders:
    - role: primary
      name: Step-LLM（自家双语 LLM，仓内 `step_llm/`）
      params: 19579600896
      hidden: 6144
      shipped_with_weights: true
      gated: false
      release_dtype: BF16
      substitutable: false
      note: >-
        **随仓发布**，9 分片 289 张量全 BF16，实测 19,579,600,896 参数。
        config 实测：`Step1Model`，48 层 / hidden 6144 / 48 头 /
        `num_attention_groups` 8（GQA）/ `ffn_hidden_size` 16896 /
        `max_position_embeddings` 16384 / vocab 65536。
        hidden 6144 与 DiT 的 `caption_channels[0]` 一致，也与
        `caption_projection.linear_1.weight [6144, 6144]` 对得上。
        **它是 DiT 的 2/3 大**（19.58B vs 29.34B），而每次生成只跑一遍
    - role: pooled
      name: HunyuanCLIP（仓内 `hunyuan_clip/`）
      hidden: 1024
      shipped_with_weights: true
      gated: false
      substitutable: false
      note: >-
        第二路文本编码器，双语。hidden 1024 是**权重实测**：
        DiT 的 `clip_projection.weight` 形状 [6144, 1024]，
        与 config 的 `caption_channels[1]` 一致。
        **params 填不了**：权重是 `hunyuan_clip/clip_text_encoder/pytorch_model.bin`，
        pickle 不是 safetensors，读头拿不到清单；文件 3.94 GB，
        但 dtype 未声明，连「字节 ÷ 每元素字节」这条退路也没有 ——
        和 wan2.2-ti2v-5b 的 VAE 是同一种空

  sampling:
    steps: 50
    cfg:
      scale: 9.0
      distilled: false
      embedded: false
      forwards_per_step: 2
    scheduler: FlowMatchDiscreteScheduler（euler）
    shift: 7.0
    step_distilled:
      available: true
      checkpoint: stepfun-ai/stepvideo-t2v-turbo
      note: >-
        官方另发了 `stepvideo-t2v-turbo`（Inference Step Distillation），
        是**另一个仓**不是本仓的子目录，步数卡上没写。
        按视频线 policy 它不单开记录
    note: >-
      **端到端是 50 步 × 2 次前向 = 100 次 29.34B 主干前向。**
      CFG 9.0 是候选里最高的（wan 5.0、hunyuanvideo-1.5 6.0）。
      步数、CFG、shift、帧数、分辨率五项**模型卡一个都没写**，
      全部取自厂商参考实现 `stepvideo/config.py` 的 argparse 默认值

  buckets:
    - width: 992
      height: 544
      frames: 204
      latent_frames: 36
      text_tokens: 512   # 参考实现的 text_len
      fps: 25
      duration_s: 8.16
      default: true
      note: >-
        参考实现的默认值（`--width 992 --height 544 --num_frames 204`）。
        **`latent_frames` 是声明的不是公式算的**：204 / 17 = 12 块整，
        每块 3 个 latent 帧 → 36。按 `(F−1)/8+1` 会得 26.375，
        **比真值 36 低 26.7%**（见 R2）。
        992/16 = 62、544/16 = 34，都整除 → latent 36 × 34 × 62 = **75,888 token**。
        **fps 没有一手来源**：卡与参考实现都没写，25 是按卡上
        「204 帧」与常见口径填的占位 —— 见 open_questions
    - width: 992
      height: 544
      frames: 136
      latent_frames: 24
      fps: 25
      duration_s: 5.44
      note: >-
        卡的 §4.1 性能表里的第二档。136 / 17 = 8 块整 → 24 个 latent 帧。
        latent 24 × 34 × 62 = 50,592 token

  constraints:
    width_divisor: 16
    height_divisor: 16
    frame_formula: 17n
    note: >-
      除数 16 = VAE 空间压缩 16 × DiT patch 1。
      **帧数必须是 17 的整数倍**（不是 4n+1、也不是 17n+5）：
      `encode()` 直接 `x.split(17, dim=1)`，不补齐、不丢弃，
      余数那一块会少于 17 帧而编码器按 17 帧设计。
      卡与参考实现用的 204 与 136 都是 17 的整数倍（12 块与 8 块）。
      **视频线至此四种帧数约束**：wan / hunyuanvideo-1.5 的 4n+1、
      minimax-h3 的 17n+5、这一份的 17n ——
      每一种都是各自分块规则的外在表现

  checkpoint_variants:
    - name: transformer
      role: base
      bytes: 58684956800
      resident: true
    - name: step_llm
      role: text-encoder
      bytes: 39159201792
      resident: true
      note: 跑在独立进程里（`--caption_url`），与 DiT 不同卡也行
    - name: hunyuan_clip
      role: text-encoder
      bytes: 3942000000
      resident: true
      note: 文件大小约数（pickle，读不了清单）。同样走 `--caption_url` 那个服务
    - name: vae_v2.safetensors
      role: vae
      bytes: 1995275276
      resident: true
      note: 64 latent 通道，是这个模型用的那一版。跑在独立进程里（`--vae_url`）
    - name: vae.safetensors
      role: vae
      bytes: 1035312780
      resident: false
      note: >-
        **16 latent 通道的另一版，不是这个模型用的**。258 个张量名与 v2 相同，
        其中 4 个形状不同；v2 另有 4 个 patchify/unpatchify 张量。见 R1

precision:
  weights_release: [BF16, FP32]
  weights_release_scope:
    BF16:
      manifest_taken: true
      in_precision_table: true
      repo: stepfun-ai/stepvideo-t2v
      note: >-
        DiT 的 785 张量与 Step-LLM 的 289 张量**全部** BF16，无一例外。
        这和 wan 全系、hunyuanvideo-1.5 的全 F32 相反 ——
        **不写「第一份」** —— 原话写过「已录五份里第一份主干以 BF16 发布的」，
        而 cogvideox-1.5-5b（2024-11）比它早一年多，也是 BF16。
        这类「第一份」随下一份记录还会再变，只记事实：
        本份全 BF16，而 wan 全系与 hunyuanvideo-1.5 都是全 F32。
    FP32:
      manifest_taken: true
      in_precision_table: false
      repo: stepfun-ai/stepvideo-t2v
      note: >-
        两个 VAE 文件（`vae/vae.safetensors` 与 `vae/vae_v2.safetensors`）的
        258 / 262 张量**全部** F32，逐条读头实测过。
        **但它们不在本仓的 `shapes.json` 里**：取数用 `--include 'transformer/*'`
        收窄了，因为那两个文件有 258 个同名张量、合并会撞名并产出一个不存在的 VAE（R1）。
        所以 `in_precision_table: false` —— 精度表里只有 DiT 的 BF16，
        这一行说的是同一个仓里另外两个文件，是实测不是声明。
        与 h3、hunyuanvideo-1.5 的 VAE 同样是 F32
  quantization:
    # 这一代没有 quantization_config：清单里零 scale 张量、零打包容器
    # （derive 的 `scale_elements` 为 0），所以 per_subsystem_scale 与
    # per_subsystem_block 不是「留空待测」，是不适用 —— 没有块可量。
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      modulation: BF16
      norm: BF16
      io_proj: BF16
      time_embed: BF16
    subsystem_method: >-
      **逐项核对完整权重清单，非抽样。** `facts/stepvideo-t2v-30b/shapes.json` 的
      785 个条目（transformer 6 分片全量，每条都带 shape 与 dtype，failed_shards 为空）
      用 `scripts/lib/subsystems.py` 的 `classify2()` 逐条分桶，**785/785 全是 BF16** ——
      所以各子系统的 BF16 是全量结论，不是代表值。

      逐桶（张量数 / 参数量 / 占 29,342,478,400）：
      注意力 240 / 14,495,514,624 / **49.401%**、稠密 FFN 96 / 14,495,514,624 / **49.401%**、
      调制 51 / 228,311,040 / 0.778%、入口出口投影 10 / 82,600,000 / 0.282%、
      时间步嵌入 4 / 39,333,888 / 0.134%、归一化 384 / 1,204,224 / 0.004%。
      **六桶合计 785 条 / 29,342,478,400，一条不剩、一个参数不差** ——
      `other` 桶为 **0**，整份清单没有一条落在兜底桶里，所以 `other` 没有行。

      `io_proj` 那 10 条是：入口 `pos_embed.proj`（[6144, 64, 1, 1] 加 bias，399,360，
      把 64 通道 latent 投进 6144 维）、出口 `proj_out`（[64, 6144] 加 bias，393,280）、
      `caption_projection.linear_{1,2}`（两个 [6144, 6144] 加 bias，75,509,760，
      把 Step-LLM 的 6144 维嵌入投进主干）、`clip_projection`（[6144, 1024] 加 bias，
      6,297,600，HunyuanCLIP 那一路的 pooled 投影）。**四样合计 82,600,000。**
      这一桶原先只有出口 393,280，另三样散在 `other` 与 `text_encoder` 组件里 ——
      归类正则与组件前缀都已在 `ebfb3cd` 修好，见 R8。

      **这张表的作用域是 DiT，不是这个仓。** 真正的文本编码器 Step-LLM
      是另一个模型，289 张量 19,579,600,896 参数，**压根不在 `shapes.json` 里**
      （取数用 `--include 'transformer/*'` 收窄过，原因见 notes）；
      它全 BF16 这个事实来自逐文件读头，记在 `weights_release_scope` 里。
      所以 `io_proj` 里那 75,509,760 是 DiT 投它的那两层、不是它本身，
      两者差 **259 倍**；两个 VAE 文件的 F32 同样在作用域外
      （`weights_release_scope.FP32.in_precision_table: false`）。

      **`time_embed` 与 `modulation` 现在是两桶，合起来才是「调制分支」。**
      时间步嵌入是 `adaln_single.emb.timestep_embedder.linear_1`（[6144, 256] 加 bias）
      与 `linear_2`（[6144, 6144] 加 bias），4 条 **39,333,888**；
      `modulation` 剩下的 51 条 **228,311,040** 是全局的
      `adaln_single.linear [36864, 6144]` 加 bias（226,529,280）、
      每层一个 `[6, 6144]` 的 `scale_shift_table`（48 条 1,769,472）与顶层
      `[2, 6144]` 那一个（12,288）。
      **两桶相加 267,644,928 = `param_scaling.per_sample`** ——
      这不是巧合，`subsystems.py` 把它写成了排序约束（`time_embed` 必须在
      `modulation` 之前，否则 `adaln_single.emb.*` 被 `adaln` 先领走）。
      引调制占比时要用两桶之和，用单桶会得到 0.778% 而不是 0.912%。

      这一行此前是**手补的**（2026-10-31 前两轮）：那时 `modulation` 排在 `time_embed`
      之前，4 条被 `adaln` 先领走、`time_embed` 桶是空的，而缺值判据会把空格渲染成
      「不适用：这个子系统在这个模型里不存在」—— 那句话是错的，所以补行。
      `242e724` 的按功能分桶把次序倒过来之后，**这一行有了依据，不再是手补的**；
      cogvideox-1.5-5b 的 `modulation` 行同形（`ebfb3cd` 之后也有了依据）。
      本仓现在的约定是**桶空就不补行**（见 CLAUDE.md），而桶空且功能存在时先去看
      `subsystems.py` 的次序 —— 那是归类问题不是填表问题。留痕见 R7。

      **其余 13 格都站得住。** 12 格是真的没有这个子系统：稠密主干无路由专家、
      无共享专家，router 也就不存在；3D 全注意力不存 KV，所以无 compressor、无 indexer；
      无检索查表；输入是 latent 不是 token，所以无词表 embed、无 lm_head；
      残差是普通相加，清单里没有系数张量；无草稿模块；无视觉塔；T2V 无音频支路。
      第 13 格是 `other`，它的空是**另一种意思**：785 条全部落进具名桶，
      没有一条要靠兜底。**这不是本份独有的** —— 2026-10-31 逐份算过，
      九份里四份的 `other` 为 0（本份、cogvideox-1.5-5b、ltx-2、minimax-h3），
      另五份在 0.002%（ltx-2.3）到 0.452%（wan2.2-ti2v-5b）之间。
      （差点在这里写成「第一份 `other` 为 0 的记录」—— 这一份被这类句子栽过三次了，
      所以这个数是数完九份才写下的，不是推的。）
  inference_default: BF16

performance:
  # 模型卡 §4.1。**卡上没写 GPU 型号** —— 只说「four GPUs」「recommend 80GB」，
  # 所以 hardware 那栏只能如实写「未声明」，不替它猜一个 H800 或 A100。
  # 没有基线不填 speedup：flash-attn 开与不开是同一张表的两行，
  # 作为一对记在 baseline 里，倍数由读者自己看（1232 / 743 = 1.66×）
  - source:
      type: official
      ref:
        kind: modelcard
        url: https://huggingface.co/stepfun-ai/stepvideo-t2v
        locator: §4.1 推理性能表（544×992×204 帧那一行）
    hardware: 未声明（卡只说 four GPUs、建议单卡 80GB）
    device_count: 4
    engine: 官方实现 + flash-attn
    resolution: 544×992
    frames: 204
    steps: 50
    seconds_end_to_end: 743
    peak_memory_bytes: 83361205125
    baseline:
      what: 同配置不开 flash-attn
      seconds_end_to_end: 1232
    visibility: public

bottlenecks:
  - dimension: compute
    finding: >-
      交叉注意力与自注意力的参数**逐字节相同**，但前者的 KV 只有 512 个文本 token、
      后者跑在 75,888 个视频 token 上 —— **148:1**
    quantified: >-
      各 7,247,769,600 参数（各占主干 24.70%）。
      默认档 992×544×204 帧 → latent 36×34×62 = 75,888 token，`text_len` 512。
      单步自注意力 4×48×6144×75,888² = 6.794e15，
      交叉注意力那一项只有 4.58e13，差 148 倍
    fix: >-
      稀疏化与 kernel 工作全压在 `attn1`；`attn2` 走常规实现即可。
      与 wan2.2-ti2v-5b 同一类结论（那边 53:1），这一份更极端
    visibility: public
  - dimension: compute
    finding: >-
      **AdaLN 只占 0.91%，是九份里最低的** ——
      这一份用 AdaLN-Single（全局一套投影 + 每层一个 `[6, 6144]` 的**表**），
      而 cogvideox / hunyuanvideo-1.5 / minimax-h3 每层放的是**矩阵**
    quantified: >-
      `adaln_modulation` 267,644,928 / 29,342,478,400 = **0.91%**。
      九份分成两组，中间差 6.3 倍没有过渡带：
      **放矩阵**的 cogvideox 14.35%（入口 512）、hunyuanvideo-1.5 32.71%（2048）、
      minimax-h3 39.41%（2688）；**放表**的本份 0.91%、wan 三份 1.30–1.35%、
      ltx 两份 1.60 / 2.27%。
      **按发布时间排看不出规律** —— 放矩阵的最早（2024-11）与最晚（2026-07）各一份，
      中间夹着 2025-11；放表的横跨 2025-02 到 2026-03。

      **这九个百分比的口径是「调制分支整体 / `params.total`」，不是单个
      `modulation` 子系统桶。** 本份上 **`modulation` + `time_embed`
      = 228,311,040 + 39,333,888 = 267,644,928 = `param_scaling.per_sample`**
      才是那个 0.91%（单看 `modulation` 桶只有 0.778%）；
      两桶之和等于 `per_sample` 是 `subsystems.py` 写明的排序约束，不是巧合。

      **按功能分桶（`242e724`）之后这张对照表基本能从桶复算了** ——
      2026-10-31 逐份算过 `modulation` + `time_embed` 占 `params.total`：
      cogvideox 14.348%、ltx-2 1.598%、minimax-h3 39.414%、本份 0.912%、
      wan2.1 1.302%、wan2.2-ti2v-5b 1.349%，与引用值逐份对得上（此前只有本份对得上）。
      **两处例外要知道**：wan2.2-t2v-a14b 得 0.651%，因为它的 `params.total`
      是两套专家 28,576,983,168，按单套 14,288,491,584 算才是引用的 1.302%
      （口径差，不是算错）；hunyuanvideo-1.5 得 33.212%，而它声明的
      `per_sample` 是 2,723,964,928（引用 32.71%），两桶之和 2,765,398,016
      **多 41,433,088** —— 那一份自己的事，已报它那条线。
      九份全表与各自的取数口径仍以 cogvideox-1.5-5b 记录的 R4 为准
    fix: >-
      这不是一个要修的瓶颈，是一条**结构判据**（不是代际判据 —— 那一版已证伪）：
      看到「参数量」时先问逐层放的是表还是矩阵 ——
      放矩阵的那组调制不参与 token 计算，按参数量估算力会偏高 1.6–3 倍
      （见各记录的 `param_scaling`）
    visibility: public
  - dimension: host-io
    finding: >-
      四块权重分跑在**三个进程**里（DiT、VAE 服务、文本编码器服务），
      这在已录的九份里是唯一一个（截至 2026-10-31，九份已核过 —— 另外八份的
      文本编码器与 VAE 都在 pipeline 内，没有一份走独立服务）
    quantified: >-
      DiT 58,684,956,800 B + Step-LLM 39,159,201,792 B + HunyuanCLIP 约 3.94 GB
      + VAE 1,995,275,276 B ≈ 103.8 GB。
      参考实现用 `--vae_url` / `--caption_url` 指向两个独立服务
    fix: >-
      拆服务本身就是解法：文本编码器与 VAE 每次生成各跑一遍、DiT 要跑 100 遍，
      三者错峰。代价是跨进程传 latent 与 embedding 的带宽与延迟，
      卡上没有给这部分的数
  - dimension: compute
    finding: >-
      模型卡给了实测的峰值显存与端到端耗时，**但没写 GPU 型号**，
      所以算不出利用率，也不能跨硬件比
    quantified: >-
      卡 §4.1：544×992×204f 峰值 **77.64 GB**、50 步 flash-attn **743 s** /
      不开 **1232 s**；544×992×136f 峰值 72.48 GB、408 s / 605 s。
      测试用 **4 卡**，卡上只说「recommend 80GB」。
      按 743 s / 100 次前向 = 7.43 s 每次前向，而本记录推出的单步是 1.065e16 FLOPs
      （derive 的 `flops_per_step.total` 1.0648e16；**原话写 1.069e16，是笔误**，
      同一份记录里另两处写的是同一个量）—— 要换成利用率还差 GPU 型号这个因子
    fix: 读技术报告 arXiv 2502.10248 补硬件型号；在那之前这组数只能当量级参照
    visibility: public

infra_signals:
  - text: >-
      **调制分支的代价看一个结构问题就能判定：逐层放的是「表」还是「矩阵」。**
      原话写的是「一条清晰的代际线」，九份摆齐后**两个方向都破了** ——
      cogvideox（2024-11）就占 14.35%，而 ltx-2（2026-01）只占 1.60%，
      后者在那条趋势内部破。完整判据与九份全表见 cogvideox-1.5-5b 记录的 R4。

      本份属于「放表」那组：全局一套投影，每层只存一个 `[6, 6144]` 的表，
      调制占 **0.91%**，是九份里最低的。放矩阵的三份（cogvideox 14.35%、
      hunyuanvideo-1.5 32.71%、minimax-h3 39.41%）全是两位数，
      放表的六份全在 2.3% 以下 —— 中间差 6.3 倍，没有过渡带。
      （这九个百分比的口径是**调制分支整体占 `params.total`**，在词表里是
      `modulation` + `time_embed` **两桶之和**，不是单个 `modulation` 桶 ——
      本份单看 `modulation` 只有 0.778%。按功能分桶之后两桶之和已能复算出多数引用值，
      两处例外见上面那条 compute 瓶颈。）

      这一块不参与 token 计算，所以它的膨胀**只增显存与权重搬运、不增算力** ——
      按参数量排产能的人会在「放矩阵」那组上系统性高估
    evidence: derived
  - text: >-
      **「时间压缩 8×」在这一份上端到端只有 5.667。** VAE 按 17 帧一块、
      每块 3 个 latent 帧，块内 8× 整除（1 + 16/8 = 3），但块与块之间不共享上下文，
      每块都要重付一次因果编码的「+1」。**九份视频记录逐份算过，
      没有一份的声明值等于端到端值**（截至 2026-10-31），差幅 2.4% 到 29.2%，
      本份最大。
      规划 token 数必须拿端到端比值，而它只在厂商的 VAE 实现里
    evidence: derived
  - text: >-
      这一份把 VAE 与文本编码器拆成独立服务（`--vae_url` / `--caption_url`），
      在已录的九份里是唯一一个（截至 2026-10-31，九份逐份核过）。生成类的组件在时间上天然错峰 ——
      文本编码一次、DiT 一百次、VAE decode 一次 ——
      所以「一次部署要多少显存」这个问法本身在生成类上就不如
      「每个组件各要多少、能不能分开放」有用
    evidence: judgement

