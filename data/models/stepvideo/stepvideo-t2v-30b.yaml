      本轮复核确认那一条 `performance` 项与卡 §4.1 的 544×992×204 帧那一行逐项对上
    resolution: corrected
    changed_to: >-
      `performance[]` 填了一条（source.type official、`device_count: 4`、
      `seconds_end_to_end: 743`、`baseline` 装不开 flash-attn 的 1232 s、
      `peak_memory_bytes: 83361205125`），`hardware` 那一栏照实写「未声明」、
      不替卡猜一个型号；136 帧那一档与利用率仍留在 `bottlenecks.quantified` 里带出处。
      **resolution 本轮由 open 改成 corrected** —— 字段是主会话加的（`a4f59d4`），
      不是本记录改的
  - id: R6
    field: generation.backbone.param_scaling
    severity: missing
    claim: 填了 `per_text_token` 就能把文本那一路的线性 FLOPs 算进去
    finding: >-
      录入时算不进去 —— **schema 没有地方声明文本 token 数 m**。
      `param_scaling.per_text_token` 有了，但 `backbone` 与 `buckets` 下
      都没有对应的 `text_tokens` 字段，所以 `gen_workload()` 只能跳过这一项并
      标「线性项是下界」。

      这一份上漏掉的量可以手算：2 × 3,705,686,016 × 512 = **3.79e12**，
      占单步 1.065e16 的 **0.04%** —— 可忽略。
      但对 hunyuanvideo-1.5 那种双流模型不可忽略：它的 `per_text_token`
      是 2,871,435,648，文本 token 数若按 byT5 的 256 加 MLLM 的若干算，
      量级会到 1e15，占单步的百分之几。

      **这一条已经不是待办了，而原话一直挂着「open」。** 字段在 `a4f59d4`
      进了 `buckets[]`（连同 `performance` 的两个字段，见 R4），
      `bf509c9` 又补齐了 derive 侧只消费一半的那个洞。
      本轮复核确认：这一份的 `buckets[0].text_tokens` 是 512，
      derived 的 `linear_terms.factors.text_tokens` 就是它，线性项不再是下界。
      **本记录与 open_questions 里「没地方声明 m」那两处说法已过时，是这次改掉的**
    resolution: corrected
    changed_to: >-
      字段由主会话落地（`a4f59d4` 加 `buckets[].text_tokens`、
      `bf509c9` 修 derive 的半消费），本记录只做三处同步：
      `param_scaling.note` 改成「文本那一项现在进了推导」并给出它的量，
      原先那条 open question 换成 R7 / R8 的归类口径问题，
      resolution 从 open 改成 corrected。
      **仍然留着的一个坑**：`derive.py` 的 `gen_workload()` 里，
      算线性项那几行上方的注释还写着「文本 token 数本仓目前没有字段装」，
      而同一个函数在上面十几行处已经在读 `bucket.get("text_tokens")` ——
      注释不是证据（skill 规则 9），已报主会话
  - id: R5
    field: generation.text_encoders
    severity: missing
    claim: 两个文本编码器的参数量都能填
    finding: >-
      只填得出一个。Step-LLM 在 safetensors 里，实测 19,579,600,896；
      HunyuanCLIP 是 `pytorch_model.bin`（pickle），读头拿不到清单，
      文件 3.94 GB 但 dtype 未声明，连「字节 ÷ 每元素字节」这条退路也没有。
      hidden 1024 倒是能实测 —— DiT 的 `clip_projection.weight` 是 [6144, 1024]
    resolution: open
    changed_to: HunyuanCLIP 的 params 留空并在 note 写明是哪一种空
  - id: R7
    field: precision.quantization.per_subsystem
    severity: miscategorized
    claim: 穷举过完整清单之后，缺的那一格就表示「这个模型里没有这个子系统」
    finding: >-
      **对 `time_embed` 这一格不成立 —— 它的空是规则次序造成的，不是模型事实。**
      时间步嵌入在这一份里确实存在：`adaln_single.emb.timestep_embedder.linear_1`
      （[6144, 256] 加 bias）与 `linear_2`（[6144, 6144] 加 bias）共 4 条、
      **39,333,888 参数**。但 `scripts/lib/subsystems.py` 的 `SUBSYSTEM` 顺序即优先级，
      `modulation` 的 `adaln` 排在 `time_embed` 之前，而这 4 条的名字带 `adaln_single`，
      于是整块落进 `modulation` 的 267,644,928 里。
      参数量账上没有错 —— 这与 `params.breakdown.adaln_modulation`
      「含⋯⋯时间步嵌入」的口径本来就一致（见 counting_note）。
      错的是 `columns.json` 的 `$subsystem` 规则会把这一格渲染成
      「已对完整权重清单穷举过，这个子系统在这个模型里不存在」。

      **这不是本份的个例，cogvideox-1.5-5b 同一天独立撞上了同一个毛病**：
      它的逐层 AdaLN 矩阵（`norm1.linear` / `norm2.linear` / `norm_out.linear`）
      因为 `norm` 也排在 `modulation` 之前而整块落进 `norm` 桶，
      `modulation` 桶是 **0** —— 而它恰恰是本仓「放矩阵 AdaLN」那一组的代表（占 14.35%）。

      所以判据本身的毛病是：**「不适用」把「模型里没有这个子系统」与
      「被更靠前的规则领走了」合成了一句话**，而穷举说法越可信，那句话就越像结论。

      **两个实例后来都被归类修正消掉了**（cogvideox 在 `ebfb3cd`：
      给「名字带 norm 的调制投影」单开一条排在 `norm` 之前；本份在 `242e724`：
      `time_embed` 移到 `modulation` 之前）。实测现在 cogvideox 的 `modulation`
      是 797,423,616、本份的 `time_embed` 是 39,333,888，两格都有依据。

      **但判据一个字没改，而实例消失让它更危险不是更安全。**
      本份现在仍有 **13 格**靠那句「不适用」渲染，它们站得住的理由是
      `subsystem_method` 里逐条枚举出来的 —— **不是那道判据能分辨**。
      闸口绿着、页面上每一格也都对，而「对」这件事由散文担保、不由判据担保
      （规则 11 的同一张脸：锚在内侧只守得住内侧）。
      下一次词表调整若再造出一个被领走的空桶，这 13 格里会悄悄混进一句错话
    resolution: open
    changed_to: >-
      本份的 `time_embed` 不再需要手补 —— `242e724` 之后它有 4 条张量 39,333,888。
      `subsystem_method` 里改成陈述两桶关系（`modulation` + `time_embed`
      = `param_scaling.per_sample`），并把 13 格缺席的理由逐条留着：
      12 格是真的没有这个子系统，第 13 格 `other` 为 0 是因为 785 条全部归了具名桶。
      **判据本身仍未修**，拦路石是 `absence()` 的 `test.path` 两侧都没有 `$key` 代入
      （`scripts/lib/columns.py` 与 `site/src/lib/columns.ts`），
      加 op 还要同改两侧、第 5 道闸比对 op 词表。已报主会话，它确认留给后续；
      「桶空就不补行」这条约定与根因已写进 CLAUDE.md
  - id: R8
    field: precision.quantization.per_subsystem
    severity: imprecise
    claim: '`io_proj`（入口出口投影）这一桶装的是 DiT 的入口与出口投影'
    finding: >-
      **核查时这一份只装到了出口。** 出口 `proj_out`（[64, 6144] 加 bias，2 条 393,280）
      命中 `\bproj_out\b`；入口是 `pos_embed.proj`（[6144, 64, 1, 1] 加 bias，2 条 399,360，
      就是把 64 通道 latent 投进 6144 维的那一层），名字是 `pos_embed`
      而规则写的是 `patch_embed`，**一个词之差**，于是它和
      `clip_projection`（2 条 6,297,600）一起落进 `other` ——
      `other` 的 6,696,960 恰好就是这两样（399,360 + 6,297,600）。

      精度上没有影响（两桶都是 BF16，全模型只有 BF16 一档），但按桶读参数量的人
      会看到一个 393,280 的「入口出口投影」，比真实的入口加出口 792,640 少一半，
      而少掉的那一半在一个叫「其它」的桶里。
      **这和 `dense_ffn` 补 diffusers 的 `ff.` 之前是同一种毛病**：
      生成类的命名不在语言模型那套词表里，而落进 `other` 不会报错。

      **顺带一个同族的问题（本条一并记）**：`caption_projection.linear_{1,2}`
      那 4 条 75,509,760 更早一步就被分走了 —— `components.json` 的
      `text_encoder` 前缀表里有 `caption_`，于是它们在**组件层**就落进
      `text_encoder`，压根到不了子系统正则（`SPLIT_INSIDE` 不含 `text_encoder`）。
      它们是 DiT 内部投 Step-LLM 嵌入的那两层，不是编码器本体。
      **判据不靠论证，同一个仓的两种布局自己打起来了**：`facts/ltx-2` 与
      `facts/ltx-2-pack` 是同一个 repo 同一个 revision
      （`Lightricks/LTX-2` @ `64f65d09e0b7`）的两种布局，而同一批
      `caption_projection` 在前者归 `text_encoder`、在后者因为带
      `model.diffusion_model.` 前缀（最长前缀优先）而归 `dit`/`io_proj` ——
      **取数布局的差别不该改变一个张量是什么**
    resolution: corrected
    changed_to: >-
      两条都在 `ebfb3cd` 修好了（共享基建，主会话改的；候选正则的影响面由本会话
      在 64 份有清单的记录、3,014,489 条张量上实跑验过）：
      `io_proj` 的正则加了 `\bpos_embed\b|clip_proj`（**词界不是风格是判据** ——
      裸 `pos_embed` 会捞走 ltx-2.5 的 `keyframes_abs_pos_embedding`，
      那是位置嵌入表不是入口投影；带词界后全仓零抢占、非生成类受影响 0 份），
      `components.json` 去掉了 `caption_` 前缀。

      本份的结果：`io_proj` 从 2 条 393,280 变成 **10 条 82,600,000**
      （入口 399,360 + 出口 393,280 + caption 75,509,760 + clip 6,297,600），
      `other` 从 4 条 6,696,960 **归零**（那一行已从 `per_subsystem` 去掉）。
      组件侧更干净：785 条全落 `backbone`，而 derive 只在真跨组件时才输出组件拆分
      （`len(bytes_comp) > 1`），所以 `params_by_component` / `weight_bytes_by_component`
      **这两个键现在整个不出现了** —— 那个会被读成「文本编码器只有 0.08B」的
      `text_encoder: 75,509,760` 不是改对了数，是不再存在。
      derived 已重跑，五桶合计 785 条 / 29,342,478,400，与主会话 `ebfb3cd` 里
      提交的那份除 `generated_at` 外逐字节相同

notes: >-
  **字节对账。** transformer 58,684,956,800 + step_llm 39,159,201,792
  + vae_v2 1,995,275,276 + vae 1,035,312,780 + hunyuan_clip 约 3.94 GB
  + 三个 `.so` 与 tokenizer ≈ 104.8 GB，而 HF 的 usedStorage 是
  183,146,397,106 B（183.1 GB），**约为 1.75 倍**。
  视频线至此四种 usedStorage 行为：这一份偏高 75%（未查原因，可能是旧修订版）、
  minimax-h3 偏高 146%（两套并列布局）、wan2.2-ti2v-5b 多算一份 DiT（旧修订版）、
  hunyuanvideo-1.5 准确。**它始终不能当「当前修订版权重总字节」直接用。**

  **部署形态在已录的九份里是唯一的一种**（截至 2026-10-31，九份逐份核过）。 `model_index.json` 只列 scheduler 与 transformer，
  VAE 与文本编码器不在 pipeline 里，而是由参考实现用 `--vae_url` / `--caption_url`
  指向**两个独立服务**。所以「一次部署要多少显存」在这一份上没有单一答案 ——
  DiT 58.7 GB、文本编码器约 43 GB、VAE 2.0 GB，三者可以放在不同卡甚至不同机器上。

  **九份记录的时间压缩率对照**（声明值 → 端到端值，2026-10-31 逐份算过）：

  | 记录 | 声明 | 端到端 | 差 |
  |---|---|---|---|
  | stepvideo-t2v-30b | 8 | 5.667 | **29.2%** |
  | minimax-h3 | 4 | 3.375 | 15.6% |
  | cogvideox-1.5-5b | 4 | 3.682 | 8.0% |
  | ltx-2 / ltx-2.3 | 8 | 7.562 | 5.5% |
  | wan2.1-t2v-14b / wan2.2-t2v-a14b | 4 | 3.857 | 3.6% |
  | wan2.2-ti2v-5b / hunyuanvideo-1.5 | 4 | 3.903 | 2.4% |

  **九份里没有一份相等。** 分块的两份（本份与 h3）差得最多，因为每块都要
  重付一次因果编码的「+1」；整段因果的只差首帧那一下。
  原文写的是「五份」—— 录入时漏数了 wan 两份，而九份让这个结论更强不是更弱。

  **取数提醒。** 这个仓没有顶层 config.json，4 份组件 config。
  `vae/` 下**两个 safetensors 有 258 个同名张量**，合并取数会撞名并产出一个
  不存在的 VAE —— 用 `--include 'transformer/*'` 收窄，VAE 单独量（见 R1）。

