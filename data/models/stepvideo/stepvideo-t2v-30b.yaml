id: stepvideo-t2v-30b
family: stepvideo
kind: video-gen
display_name: Step-Video-T2V
released: '2025-02-14'
license: mit
visibility: public

# 视频线第八份记录（录入时漏数了 wan2.1-t2v-14b 与 wan2.2-t2v-a14b，原写「第五份」）。
# 全库现为九份 —— 本文件里凡「已录 N 份里唯一 / 最 X」都已按九份重核，
# 口径沿用 wan2.2-ti2v-5b：params.total 只算 DiT；不建 arch 块；没有 KV cache 这笔账。
#
# 但上面这句「都已按九份重核」自己就是待验证的：2026-10-31 第二轮又核出两处
# 计数错，而且都在上一轮改正后写下的句子里（「16× 空间并列第四」实为四份并列第三、
# 「patch 全 1 的只有本份与 ltx 两份」漏了 hunyuanvideo-1.5）。
# 改一句计数错的时候照样可以只数一半 —— 见 generation.vae.note 与 reviewed.method。
#
# 这一份的三个看点：空间 16× / 时间 8× / 64 通道且两维全靠 VAE（patch 都是 1）、
# AdaLN-Single（调制只占 0.91%，九份里最低；「放表」那组的代表）、
# 以及**模型卡上有实测性能**（峰值显存与端到端秒数，4 卡）。

sources:
  - kind: modelcard
    url: https://huggingface.co/stepfun-ai/stepvideo-t2v
    locator: README.md §1 Introduction / §2.1 Video-VAE / §2.2 DiT w/ 3D Full Attention / §4.1 Requirements @ 7a2b639ca268
    accessed: '2026-10-31'
    note: >-
      官方口径来源。卡上直接给出的：30B 参数、最长 204 帧；
      Video-VAE「achieving 16x16 spatial and 8x temporal compression ratios」；
      DiT「48 层，每层 48 个注意力头，每头 128 维」，用 AdaLN-Single 注入时间步条件、
      自注意力里加 QK-Norm、3D RoPE；双语双文本编码器；最后一阶段做了 Video-DPO。
      §4.1 给了**实测性能表**（峰值显存与 50 步耗时，4 卡），见 R4
  - kind: paper
    url: https://arxiv.org/abs/2502.10248
    locator: 卡上给的技术报告链接
    accessed: '2026-10-31'
    note: >-
      **本轮没有读。** 结构与采样取自模型卡、厂商实现与权重清单三路。
      按本仓来源优先级技术报告在模型卡之上，报告里若有冲突的数要以它为准 ——
      尤其是 VAE 的分块设计（见 R2，那是本记录最反直觉的一处）、
      DPO 配方、以及 §4.1 那张性能表的硬件型号（卡上只说「four GPUs」没说型号）
  - kind: repo
    url: https://github.com/stepfun-ai/Step-Video-T2V/blob/main/stepvideo/vae/vae.py
    locator: AutoencoderKL 的 __init__ / encode / decode / mix，以及 VideoEncoder.conv_patchify @ main
    accessed: '2026-10-31'
    note: >-
      **latent 口径的一手依据，而且推翻了「8× 时间压缩」的直觉读法。**
      `self.frame_len = 17` / `self.latent_len = 3 if version == 2 else 5`；
      `encode()` 把输入按 **17 帧**切块、每块独立编码成 **3 个 latent 帧**后拼接；
      `decode()` 反过来按 3 个 latent 帧一块解回 17 帧，再用 `mix()` 以
      0.6/0.4 的权重把块边界两帧混一下。**没有 token_drop、没有重叠**。
      所以 `T = (F / 17) × 3`，而端到端的帧数∶token 比是 **17/3 = 5.667**，不是 8。
      8× 是**块内**的比：17 帧因果编码 → 1 + 16/8 = 3，正好整除（见 R2）。

      同一份文件还定死了两版 VAE 的差别：`version == 2` 时 `base_group_norm.spatial = True`，
      编码器多一个 `conv_patchify`、解码器多一个 `conv_unpatchify`（`factor=2`），
      且 `channels = 4 * z_channels * 2**3`
  - kind: repo
    url: https://github.com/stepfun-ai/Step-Video-T2V/blob/main/stepvideo/config.py
    locator: add_denoise_schedule_args / add_inference_args 的默认值 @ main
    accessed: '2026-10-31'
    note: >-
      采样口径取自这里（厂商参考实现，第三档来源）：
      `--infer_steps` 50、`--cfg_scale` **9.0**、`--time_shift` 7.0、
      `--num_frames` 204、`--height` 544、`--width` 992。
      卡上这几项一个都没写。另有 `--vae_url` / `--caption_url` 两个参数 ——
      VAE 与文本编码器是**独立服务**，不与 DiT 同进程（见 notes）
  - kind: modelcard
    url: https://huggingface.co/stepfun-ai/stepvideo-t2v
    locator: transformer 6 分片 + step_llm 9 分片 + vae 两个单文件的头 @ 7a2b639ca268
    accessed: '2026-10-31'
    note: >-
      权重清单逐文件读头取全。transformer 785 张量 / 29,342,478,400 参数，
      **与 HF 自己的 safetensors tally 逐位相同**（29,342,478,400 BF16）——
      那个 tally 不依赖本仓代码，是外部锚。
      step_llm 289 张量 / 19,579,600,896 参数（BF16）。
      vae 目录下**两个文件**：`vae.safetensors` 258 张量 / 258,828,195 参数、
      `vae_v2.safetensors` 262 张量 / 498,818,819 参数，都是 F32。
      两者 258 个同名张量里有 4 个形状不同 —— 见 R1

