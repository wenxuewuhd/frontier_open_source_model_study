  track: main
  # stepvideo family 目前只有这一份。同厂的语言模型族系是 stepfun（Step-5-Preview 那条线），
  # 两者没有共用组件：这一份的文本编码器 Step-LLM 是自家的，但不是 Step-3/Step-5 那一代，
  # 仓里也没有它的族谱信息。
  # 另有 stepvideo-t2v-turbo（步数蒸馏档）与 stepvideo-ti2v（i2v 变体），
