reviewed:
  date: '2026-10-31'
  method: >-
    Gate B 三路：组件 config（4 份）、权重清单（transformer 6 分片 + step_llm 9 分片
    + 两个 VAE 单文件，逐文件读头）、厂商参考实现（`stepvideo/vae/vae.py` 的
    分块编解码、`stepvideo/config.py` 的 argparse 默认值）。
    结构字段三路一致：48 层 / 48 头 / head_dim 128 在卡、config 与清单三处相同；
    `wqkv [18432,6144]` = 3×6144、`attn2.wkv [12288,6144]` = 2×6144、
    `ff [24576,6144]` = 4×6144 都与 hidden 对得上；
    `pos_embed.proj [6144, 64, 1, 1]` 同时坐实 latent 64 通道与 patch 1×1，
    与 config 的 `in_channels: 64` 和 `patch_size: 1` 一致。
    外部对账：实测 29,342,478,400 与 **HF 自己的 safetensors tally 逐位相同**。
    专门验了两件：两个 VAE 文件哪一个在用（R1）、「8× 时间压缩」是不是端到端比值（R2）。
    Gate C：判断类字段 8 处，逐条在 evidence 里标了 judgement。

    **2026-10-31 第二轮（逐子系统精度 + 按新子系统词表复核）。**
    `precision.quantization.per_subsystem` 本轮补齐：对 `shapes.json` 的 785 条
    用 `classify2()` **穷举**分桶（不是抽样），六桶全 BF16，口径与逐桶数字见
    `subsystem_method`。按新词表重核了记录里的数字与散文，改掉五处：
    「16× 空间并列第四」（实为四份并列第三）、
    「patch 全 1 的只有本份与 ltx 两份」（漏了 hunyuanvideo-1.5，实为四份）、
    单步 FLOPs 的笔误 1.069e16（应为 1.065e16）、
    R2 的「低 36%」基数记反（应为公式值比真值低 26.7%）、
    以及 R4 / R6 两条已经落地却还挂着 `open` 的核查项。
    另补两条新发现 R7（`time_embed` 的「不适用」是规则次序造成的）与
    R8（`io_proj` 只装到出口），都在共享文件里，本记录没碰。

    **2026-10-31 第三轮（按归类三修后的词表重算）。** R8 报的两条已由主会话在
    `ebfb3cd` 修掉（`io_proj` 正则加 `\bpos_embed\b|clip_proj`、`components.json`
    去掉 `caption_` 前缀），本轮按新词表独立重算过逐桶并与主会话给的数逐位核对一致：
    五桶合计 **785 条 / 29,342,478,400**，`io_proj` 10 条 82,600,000、`other` 归零、
    785 条全落 `backbone`（于是 derived 不再输出组件拆分那两个键）。
    改了 `per_subsystem`（去掉 `other` 行）、
    `subsystem_method`、R8（→ corrected）、`counting_note` 的口径对照
    （两套切法现在只差 QK-norm 那 24,576）与那条 open question（只剩 R7）。
    R7 仍开着：判据的拦路石是 `absence()` 的 `test.path` 没有 `$key` 代入，主会话确认留给后续。
    顺带数完九份确认了一件没敢直接写的事：`other` 为 0 的**不止本份**，
    cogvideox-1.5-5b / ltx-2 / minimax-h3 也是 0。

    **2026-10-31 第四轮（按功能分桶 `242e724` 之后）。** 次序把 `time_embed`
    提到 `modulation` 之前，于是 `adaln_single.emb.timestep_embedder.*` 那
    4 条 39,333,888 不再被 `adaln` 领走 —— **上两轮手补的 `time_embed` 行现在有依据了**，
    `modulation` 相应降到 51 条 228,311,040。独立重算与主会话给的数逐位一致，
    六桶合计仍是 785 条 / 29,342,478,400。
    改了 `subsystem_method`（逐桶数字、两桶关系、手补那段改成留痕）、
    R7（实例消掉但判据未改，改成讲「实例消失让它更危险不是更安全」）、
    `counting_note` 的 `adaln_modulation` 对照（现在对两桶）、
    以及三处引调制占比的地方（口径是**两桶之和** 0.912%，单看 `modulation` 是 0.778%）。
    顺带逐份复算了那张九份对照表：按功能分桶之后**两桶之和已能复算出多数引用值**
    （此前只有本份对得上），两处例外是 wan2.2-t2v-a14b 的两套专家口径差与
    hunyuanvideo-1.5 多出的 41,433,088，后者已报它那条线。

review:
  - id: R1
    field: generation.vae.params
    severity: wrong
    claim: VAE 的参数量就是 `vae/` 目录下那个文件的量
    finding: >-
      **目录下有两个文件，而且选错会同时错参数量与 latent 通道数。**
      `vae.safetensors` 258 张量 / 258,828,195 参数，
      `vae_v2.safetensors` 262 张量 / 498,818,819 参数，都是 F32。
      258 个张量名完全相同，其中 **4 个形状不同**：
      `encoder.conv_out.conv.weight` 在 v1 是 [32, 512, 3,3,3]、v2 是 [128, 2048, 3,3,3]；
      `decoder.conv_in.conv.weight` 在 v1 是 [512, 16, 3,3,3]、v2 是 [2048, 64, 3,3,3]。
      32 = 2×16、128 = 2×64（均值与对数方差各一半），**所以 v1 是 16 通道、v2 是 64 通道**。
      v2 另有 4 个 v1 没有的张量：`encoder.conv_patchify` 与 `decoder.conv_unpatchify`。

      **DiT 的 `in_channels` 是 64**，而且 `pos_embed.proj` 的形状是 [6144, 64, 1, 1]，
      所以这个模型用的是 **v2**。厂商实现里 `version == 2` 这一支同时开
      `conv_patchify` 与 `base_group_norm.spatial = True`，与 v2 的张量集自洽
    resolution: corrected
    changed_to: >-
      `generation.vae.params` 填 v2 的 498,818,819，name 标明「（v2）」；
      v1 进 `checkpoint_variants` 并标 `resident: false` 与原因。
      **这是「同名不同形」这类陷阱在视频线上的第二个实例**
      （第一个是 minimax-h3 的两套并列布局）
  - id: R2
    field: generation.buckets
    severity: wrong
    claim: 时间压缩 8×，所以 204 帧的 latent 帧数是 (204−1)/8+1 ≈ 26
    finding: >-
      **端到端不是 8×，是 5.667；204 帧的 latent 帧数是 36，不是 26。**
      厂商实现 `stepvideo/vae/vae.py` 里 `self.frame_len = 17`、
      `self.latent_len = 3 if version == 2 else 5`；
      `encode()` 是 `x.split(17, dim=1)` 后每块独立编码，
      `decode()` 是 `z.split(3, dim=1)` 后每块解回 17 帧再 `mix()` 混块边界。
      **没有 token_drop、没有重叠**，所以 `T = (F/17) × 3`。

      8× 是**块内**的比：17 帧因果编码 = 1 + 16/8 = 3，正好整除。
      两个数都对，是两个口径 —— 与 minimax-h3 完全同一个形态
      （那边 17 帧 → 5 个 token 再整段丢 3，端到端 3.375 而声明 4）。
      **差距这一份更大：29% vs 16%**，因为块内比值越大，每块重付的「+1」占比越高。

      按 `(F−1)/8+1` 算会得 26.375（非整数，推导会报警告），真值 36 ——
      **公式值比真值低 26.7%**。原话写的是「低 36%」，那是**基数记反了**：
      36.5% 是以公式值 26.375 为基数算出来的（真值比它高 36.5%），
      而那个句子的主语是公式值。两个数描述同一个差，但只有一个配得上那个句子
    resolution: corrected
    changed_to: >-
      `buckets[].latent_frames` 直接声明 36（与 136 帧档的 24），
      `latent_frames_source` 因此是 `declared`；
      `vae.temporal_compression` 仍填 **8**（那是块内比，config 与卡的一手事实），
      不为了迁就端到端比值去改；`constraints.frame_formula` 填 **17n**
  - id: R3
    field: generation.sampling
    severity: unsupported
    claim: 步数 50、CFG 9.0、shift 7.0、204 帧、544×992 有官方依据
    finding: >-
      **模型卡这五项一个都没写**，全部取自厂商参考实现
      `stepvideo/config.py` 的 argparse 默认值，是来源优先级的第三档。
      但这一份的参考实现在**结构字段上与权重清单逐项对上了**
      （48 层、48 头、head_dim 128、latent 64 通道、patch 1），
      而且 204 与 136 这两个帧数与卡 §4.1 性能表里的两行完全一致 ——
      所以它至少不是凭空写的
    resolution: confirmed
    changed_to: >-
      保留，`evidence` 里 `generation.sampling` 与 `generation.buckets` 标
      `judgement` 而不是 `official`，并在 sampling.note 写明「卡上一个都没写」
  - id: R4
    field: '-'
    severity: missing
    claim: 模型卡 §4.1 的实测性能可以进 `performance[]`
    finding: >-
      **又一次装不下 —— 这是第二个实例**（第一个是 hunyuanvideo-1.5 的 R7）。
      这组数据按本仓标准是够格的：`source.type: official`、
