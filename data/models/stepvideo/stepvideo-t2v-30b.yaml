      步数（50）、分辨率与帧数、卡数（4）、以及开不开 flash-attn 这个对照。

      但 `performance[]` 的字段全是自回归形状（`throughput_tok_s` / `ttft_ms` /
      `tpot_ms` / `input_len` / `output_len`），**没有一个能装「端到端秒数」
      或「峰值显存」**。硬塞是范畴错误。

      而且这一组比 hunyuanvideo-1.5 那组多一个缺口：**卡上没写 GPU 型号**，
      只说「four GPUs」「recommend 80GB」。所以即便字段有了，
