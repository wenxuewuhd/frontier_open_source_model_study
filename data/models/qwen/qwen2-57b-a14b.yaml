notes: >-
  MoE 支线的第二代（2024-05，与稠密旗舰 Qwen2-72B 同日）。
  结构轴上的两件事：MoE 这一支第一次配 GQA，专家粒度相对稠密 FFN 收细一倍（1/4 → 1/7.4）。
  算子集合与前代相同，只换形状。Qwen 线此后到 Qwen3 才再发 MoE
  —— Qwen2.5 一代只有稠密档位（见 qwen2-72b 的 notes）。
  同代另有 Qwen2-57B-A14B-Instruct 与 GPTQ-Int4、GGUF 发布，都是同一份结构，不另录。

open_questions:
  - >-
    KV cache 的实际落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底，
    bytes_basis 是 dtype_fallback，不能和别人按落盘格式算出来的理论下限比倍数
  - >-
    训练精度没有一手来源：config 的 torch_dtype: bfloat16 说的是发布权重，
    而**模型卡正文本轮已读**（README.md @ f29d6a182178），Model Details 只讲结构，
    没有训练精度声明，故不填 precision.training
  - >-
    128K 上下文的扩展方式没有一手来源（config 的 rope_scaling 为 null、
    rope_theta 与前代同为 1e6），context.extension_method 不填
  - >-
    shared_expert_gate [1, 3584] 的激活函数在 config 里没有键，
    本仓按清单的形状只能确定它是单行投影，没有按实现核

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen2-57b-a14b 核：config 全部键、
    完整权重清单（5771 条目逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData /
    sha 与 safetensors tally。
    参数七项逐个按形状重算并三方比对；专家数由清单的 experts.N 下标集合定（0–63，28/28 层齐全）。
    缓存乘式的四个因子逐个落到张量形状上（宽度取 k_proj / v_proj 的输出维 512）。
    两个「专家粒度」的比值分别重算过分子分母（见 R2）。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致；EP 通信量按 --ep 4 另跑一次核对公式。
    **原理上核不了的**：128K 的扩展方式、shared_expert_gate 的激活函数、
    KV 落盘精度、训练精度，都在 open_questions 里。
review:
  - id: R1
    field: params.counting_note
    severity: unsupported
    claim: A14B 对得上的是含输入词表的口径
    finding: >-
      两个口径都算了：含输入词表 14,249,270,784（+1.78%，容差内）、
      带宽口径 13,704,732,160（−2.11%，出容差）。前代 qwen1.5-moe-a2.7b 的
      A2.7B 也是同一个规律（−0.40% 对 −11.9%）。两档同向成立，
      所以「Qwen 的激活参数声明含输入词表」这句话有两个样本支撑，
      不是从一个样本推广。做带宽估算必须用前者之外的那个数
    resolution: confirmed
  - id: R2
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: >-
      草稿里 moe 那条写「专家更细（1408 → 2560 相对稠密中间维的比值从 1/4 收到 1/7.4）」
    finding: >-
      只写比值会读成「专家变小了」，而**单个专家的绝对参数量大了 3.18 倍**：
      3 × 3584 × 2560 = 27,525,120 对前代 3 × 2048 × 1408 = 8,650,752。
      比值变细的原因是 hidden 从 2048 涨到 3584（稠密中间维跟着从 5632 到 18944），
      不是专家被切小。README 里 DeepSeek V3/V4.1 那条「专家更多更细 —— 单专家反而变大了」
      是同一个陷阱，本仓已经栽过一次
    resolution: corrected
    changed_to: >-
      moe 条同时给出比值（1/4 → 1/7.4）与绝对尺寸（×3.18），
      并把两者的因果（hidden 变宽）写出来
  - id: R3
    field: bottlenecks
    severity: wrong
    claim: >-
      草稿里「MoE 让容量与带宽的比继续拉大，这一代比前代更稀疏」
    finding: >-
      反了。同口径（两侧都扣输入词表）重算：本代 56,864,120,320 / 13,704,732,160
      = **4.15 倍**，前代 14,004,619,264 / 2,378,008,576 = 5.89 倍 ——
      这一代**不如前代稀疏**。根因是共享专家从 5632 涨到 20480（常驻部分
      1.55 GiB → 11.49 GiB），占了带宽口径激活参数的 45.0%。
      「稀疏度随代际单调变好」是没有验过的直觉
    resolution: corrected
    changed_to: >-
      bottleneck 改为 4.15 倍并写明比前代小、根因是共享专家长大；
      infra_signals 补一条「共享专家那一半是百分之百常驻」
  - id: R4
    field: arch.moe.shared_experts
    severity: miscategorized
    claim: >-
      草稿把 shared_experts / dense_intermediate / balance / storage_note
      留在 arch 的 official 前缀继承下
    finding: >-
      config 只有 shared_expert_intermediate_size，没有「共享专家个数」这个键；
      1 个是从清单数出来的（28/28 层各一套 mlp.shared_expert.* 加一张 shared_expert_gate）。
      dense_intermediate 18944 虽然来自 config 的 intermediate_size，
      但「它在 MoE 层里并不实际存在、只作为粒度对照」这个用法是本仓的判断。
      继承 official 会让这些绕过 Gate C
    resolution: corrected
    changed_to: 四项与 activation / norm / head_dim / position 一并标 derived
  - id: R5
    field: lineage.changed_from_predecessor
    severity: missing
    claim: >-
      草稿的 scale 那条只写「总量 ×4、激活 ×5.1」
    finding: >-
      两个倍数都对，但漏了结论：激活占比从 16.6%（2,378,008,576 / 14,004,619,264）
      升到 23.9%（13,704,732,160 / 56,864,120,320）—— 规模放大的同时稀疏度退了。
      这件事和 R3 是同一个事实的两种表述，而草稿两处都没说
    resolution: corrected
    changed_to: scale 条补上激活占比的变化与主因
  - id: R6
    field: license
    severity: unsupported
    claim: license apache-2.0
    finding: >-
      facts/qwen2-57b-a14b/repoinfo.json 的 tags 是 license:apache-2.0、
      cardData 是 license: apache-2.0，没有 license_name。
      **这是 Qwen 线第一个 apache-2.0**，而同日发布的 Qwen2-72B 仍是
      license:other / tongyi-qianwen —— 同一天两档不同。
      旗舰 qwen3.8-2.4t-a95b 的 R3 就是从别档抄许可抄错的
    resolution: confirmed
  - id: R7
    field: hf.sha
    severity: wrong
    claim: >-
      草稿里的 hf.sha 与 hf.last_modified 是按 12 位前缀「补全」的，不是从取数产物读的
    finding: >-
      本轮对全部新记录做了一次机械核对：把每份 YAML 的 hf.sha / hf.last_modified
