bottlenecks:
  - dimension: weight-bandwidth
    finding: >-
      专家权重占总参数 85.9%，而每 token 只激活 8/64。容量与带宽的比
      （两侧都扣掉输入词表）是 56,864,120,320 / 13,704,732,160 = **4.15 倍**，
      比前代的 5.89 倍反而小 —— 因为共享专家长到了 20480，常驻部分从
      1.55 GiB 涨到 11.49 GiB。**稀疏度不是随代际单调变好的**。
    quantified: >-
      权重存储 106.93 GiB（含输入词表）；带宽口径每 token 13,704,732,160 × 2 B
      = 25.52 GiB。共享专家 6,165,727,232 占带宽口径 45.0%，
      与被激活的路由专家 6,165,626,880 几乎等量
    visibility: public
  - dimension: ep-comm
    finding: >-
      top_k 从 4 翻到 8，hidden 从 2048 涨到 3584，MoE 层从 24 变 28 ——
      每 token 的 dispatch + combine 从 786,432 B 涨到 3,211,264 B，**4.08 倍**。
      专家数只从 60 涨到 64，所以这一代的通信增长几乎全部来自 top_k 与 hidden。
    quantified: >-
      2 × top_k 8 × hidden 3584 × 2 B × 28 层 = 3,211,264 B/token（EP>1，BF16 激活）
    visibility: public
  - dimension: operator-gap
    finding: >-
      与前代同样的三条 FFN 路径（router top-8、64 个独立张量上的 grouped GEMM、
      带门的常驻共享专家），形状都变了但算子集合没变。
      注意力侧从 MHA 换成 GQA 是标准改动。所以这一代对算子适配的要求是
      「同一套算子换形状」，不是新算子 —— 和后面 Qwen3-Next 引入线性注意力
      那种改动不是一类。
    visibility: public

infra_signals:
  - text: >-
      「专家更多更细」这句话在这一代要分两个口径讲：相对稠密 FFN 的比值从
      1/4 收到 1/7.4（更细），而单个专家的绝对参数量从 8,650,752 涨到 27,525,120
      （大了 3.18 倍，因为 hidden 从 2048 到 3584）。做 grouped GEMM 的 kernel
      规划看的是绝对尺寸，做负载均衡看的是比值 —— 两个数都要记。
      README 里 DeepSeek V3 那条「专家更多更细，但单专家反而变大了」是同一件事。
    evidence: judgement
    horizon: settled
    axis: moe
  - text: >-
      常驻共享专家在这一代长到了被激活路由专家的同等量级（各约 6.17B），
      占带宽口径激活参数的 45.0%。MoE 的「稀疏」只对路由那一半成立，
      共享那一半是百分之百常驻 —— 容量规划时把共享专家算进「稀疏部分」
      会低估 decode 的权重带宽近一半。
    evidence: judgement
    horizon: settled
    axis: moe

