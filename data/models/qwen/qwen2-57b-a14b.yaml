lineage:
  track: side
  predecessor: qwen1.5-moe-a2.7b
  successor: qwen3-235b-a22b
  changed_from_predecessor:
    - axis: attention
      text: >-
        **MoE 这一支第一次配 GQA**：28 query 头 / 4 KV 头 / head_dim 128。
        清单里 k_proj 与 v_proj 是 [512, 3584]（512 = 4 × 128），q_proj 与 o_proj
        是 [3584, 3584]。前代是 MHA（16 / 16），所以这一支的注意力形态是
        跟着同日的稠密旗舰一起换的
      benefit: >-
        每层缓存 2 × 4 × 128 = 1024 元素（前代 MHA 是 4096），28 层每 token
        28,672 元素。配上 128K 上下文是 7.00 GiB —— 在这一代里 KV 彻底不是矛盾，
        矛盾全在 49.3B 的专家权重上
    - axis: moe
      text: >-
        60 专家 top-4 → **64 专家 top-8**，专家中间维 1408 → 2560。
        相对稠密中间维的比值从 1/4 收到 **1/7.4**（2560 / 18944），而**单个专家
        反而大了 3.18 倍**（3 × 3584 × 2560 = 27,525,120 对前代
        3 × 2048 × 1408 = 8,650,752）—— hidden 从 2048 涨到 3584，细是相对稠密 FFN 细。
        共享专家仍是 1 个、仍自带 [1, 3584] 的门，中间维 5632 → 20480
        （= 8 × 2560，恰等于被激活的那 8 个专家之和，也是稠密 18944 的 1.08 倍）。
        专家仍逐个独立存张量（28 层 × 64 × 3 = 5376 条目）
      benefit: >-
        每 token 的 FFN 中间维 = 20480（路由 8 × 2560）+ 20480（共享）= 40960，
        是一份稠密 FFN（18944）的 2.16 倍 —— 和前代「两份稠密 FFN」的格局一样，
        但 top_k 从 4 翻到 8 让 grouped GEMM 的批量更大、kernel 效率更好，
        代价是 EP 通信量翻倍（2 × top_k × hidden）
    - axis: context
      text: 8192 → 131072，RoPE theta 仍 1e6
      benefit: >-
        MoE 这一支拿到和稠密旗舰同样的 128K。因为 GQA 同时进来，
        满上下文 KV 只有 7.00 GiB，占权重存储 106.93 GiB 的 6.5%
    - axis: scale
      text: 14.3B 总 / A2.7B → 57.4B 总 / A14B
      benefit: >-
        总量 ×4、激活量 ×5.1（2,378,008,576 → 13,704,732,160，带宽口径），
        **激活占比从 16.6% 升到 23.9%** —— 这一代并没有把稀疏度做得更稀，
        共享专家长到 20480 是主因（它常驻，占激活量的 45.0%）

params:
  total: 5.7e+10
  active_decode: 1.4e+10
  breakdown:
    expert: 49325000000.0
    shared_expert: 6165730000.0
    attention: 822213000.0
    embed: 544539000.0
    lm_head: 544539000.0
    router: 6422528.0
    norm: 204288.0
  counting_note: >-
    total 与 active_decode 都取自模型名（57B-A14B），属厂商声明；breakdown 是本仓按
    完整权重清单（29 分片 5771 条目，全 BF16、无量化 scale、无低位打包）实测的分项，
    取 6 位有效数字。实测全量 57,408,658,944，与 HF 平台自己从分片头统计的
    safetensors tally 逐位相同，对 57B 是 +0.72%（Gate B 的 2% 容差内）。
    没有草稿块、没有视觉塔，所以没有 excludes。
    **A14B 对得上的是可比官方口径**：含输入词表的激活参数 14,249,270,784 对 14B
    是 +1.78%（容差内）；带宽口径 13,704,732,160 是 −2.11%（出容差）。
    和前代 A2.7B 同样的规律 —— Qwen 的「激活参数」声明含输入词表。
    激活的专家部分 = 49,325,015,040 × 8/64 = 6,165,626,880，常驻部分 7,539,105,280
    （注意力 + 共享专家 + router + norm + lm_head），其中**共享专家一项就有
    6,165,727,232，与被激活的路由专家几乎等量**（占带宽口径 45.0%）。
    词表与输出层不共享权重（各 544,538,624）。权重存储 106.93 GiB。

context:
  max: 131072

arch:
  layers: 28
  hidden: 3584
  vocab: 151936
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU
  position: RoPE theta 1e6，作用在全部 head_dim 维（config 无 partial_rotary_factor）

  attention:
    type: GQA
    num_heads: 28
    num_kv_heads: 4
    head_dim: 128
    head_dim_note: >-
      head_dim 不是这一代的 config 字段，128 = hidden 3584 / num_attention_heads 28，
      由清单印证：q_proj 与 o_proj 是 [3584, 3584]，k_proj 与 v_proj 是 [512, 3584]
      —— 512 = num_key_value_heads 4 × 128。缓存宽度按后者的输出维算
      （每层 2 × 512 = 1024 元素），按 query 头数折算会得 7168，高估 7 倍。
      q/k/v 带 bias（q [3584]、k 与 v 各 [512]），o_proj 没有
    layer_pattern: 28 层同构，每层产出自己的 KV，无跨层共享、无滑窗、无稀疏

  ffn:
    type: moe
    layer_pattern: >-
      28 层全是 MoE 层（decoder_sparse_step: 1，清单里 28/28 层都有 experts 与
      shared_expert），没有「前 k 层走稠密」的安排

  moe:
    routed_experts: 64
    shared_experts: 1
    top_k: 8
    intermediate: 2560
    dense_intermediate: 18944
    routing: 带辅助损失（router_aux_loss_coef 0.001）
    balance: aux-loss
    storage_note: >-
      专家逐个独立存张量：每层 64 个专家 × 3 个投影（[2560, 3584] / [2560, 3584] /
      [3584, 2560]），28 层共 5376 个条目。grouped GEMM 吃 2 维张量的列表、
      EP 切分按张量切 —— 3 维堆叠布局要到 Qwen3.5 一代才出现。
      共享专家是另一套三张（[20480, 3584] ×2 / [3584, 20480]）加一张 [1, 3584] 的门，
      走旁路、不经 router

precision:
