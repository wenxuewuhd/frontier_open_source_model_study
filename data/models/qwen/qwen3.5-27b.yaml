  - id: R7
    field: sources
    severity: missing
    claim: 本记录原来只有 config.json 一个来源
    finding: >-
      本轮按 main 并入的来源优先级规则补读模型卡，四件事有了一手来源：
      (1) **Hybrid Layout: 16 × (3 × (Gated DeltaNet → FFN) → 1 × (Gated Attention → FFN))**
      —— 混合比例与 16 个重复单元是厂商写出来的，与 config 的 layer_types 和清单三方一致；
