notes: >-
  稠密 FFN 档的第四代（2026-02），也是 qwen3.8-27b 的直接前代。
  四件事同时进来：混合线性注意力、视觉前端、MTP 草稿块、248320 词表。
  **与 qwen3.8-27b 的清单除 96 个张量的 dtype 外逐条相同** ——
  所以那一档的结构字段与本档一致，两份之间唯一的变化是 A_log 与 linear_attn.norm
  由 F32 回到 BF16，而那一步发生在中间的 Qwen3.6-27B
  （3.6 与 3.8 的清单逐位相同、config 只差 transformers_version，故 3.6 不单独立记录）。
  同代的 Qwen3.5-9B 张量名族与本档逐族相同（只是档位缩放），不另录。

open_questions:
  - >-
    A_log 的 F32 在 attention 子系统里只占 2304 / 7,239,766,528，
    所以 per_subsystem 的 attention 报 BF16（带宽主体）。
    「衰减参数是 F32」这件事因此不在精度表的 attention 行里，
    只写在 lineage 的 precision 条与本列表 —— 站点的精度表读不到它
  - >-
    矩阵状态的实际存储是否就是一个 [48, 128, 128] 的 FP32 张量需按实现确认
    （两维都是 128，维序不影响容量）；状态头数与 conv 通道数已由权重清单确定
  - >-
    短卷积的状态按全窗 4 计是上界，实现若只存 k−1 = 3 个位置会低 1/4
  - >-
    KV cache 的实际落盘精度未披露，推导时按模型 dtype 兜底 ——
    所以缓存账的 per_token 分量是 dtype_fallback，而 per_sequence 分量的 FP32
    有 config 声明，**两个分量的 basis 不同，合计不能当单一口径用**
  - >-
    输出门的函数形式本代无声明（config 没有 output_gate_type），
    3.6 起声明为 swish；本档是否同为 swish 没有来源
  - >-
    （已关闭）同代 FP8 仓（Qwen3.5-27B-FP8）的清单本轮也取了（1,606 条目），
    不必再照搬旗舰 FP8 仓的结论：本档的 FP8 仓把**注意力 99.6%、草稿块 87.6%**
    也压到了 FP8，块 [128,128]、scale BF16，holdout 由 config 的
    modules_to_not_convert 逐条点名。
    Int4 仓的 config 与清单本轮都取了：**group_size 128 已是实测**
    （192 个张量零例外），scale 是 F16，只覆盖主干稠密 FFN。
    剩下的未知是 GPTQ 的 zero-point 与 g_idx 的实际内容（清单只有形状）
  - >-
    **视觉塔自注意力的跨度没有来源。** vision_config 里没有 window_size、
    也没有 fullatt_block_indexes（前代 Qwen2.5-VL 两个都有），所以一张图是
    整图一段注意力还是分窗，config 层面判不了，参考实现本轮没读。
    arch.vision.prefill 因此只装线性项；按整图一段算 O(n²) 那一项约 387 GFLOPs
    （n = 1764），占线性项 1456.5 的 1/4，不改变结论，但它是**假设了跨度**的数
  - >-
    **「一张图」的厂商默认分辨率未知。** arch.vision.tokens 钉在本仓选的参考
    分辨率 672×672 上，真正的动态分桶规则（min_pixels / max_pixels、
    长宽比上限）在 preprocessor_config.json 里，那个文件不在 facts/。
    所以 tokens 下的数**只能和同样钉在 672 的其它记录比**，
    不能当作这个模型实际部署时的单图 token 数
  - >-
    视觉塔与主干**落盘层面**是否有 tied weights 未查。weight_map 的 1199 个名字
    里两个前缀不重名，这只排除了重名；真正的存储共享要看 safetensors 头里的
    数据偏移是否重合，本轮没读偏移
  - >-
    训练精度没有一手来源：config 的 dtype: bfloat16 说的是发布权重，
    而**模型卡正文本轮已读**（README.md @ fc05daec18b0），Model Overview 只列结构与规模，
    没有训练精度声明，故不填 precision.training

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen3.5-27b 核：config 全部键
    （并与 facts/qwen3.6-27b、facts/qwen3.8-27b 做了三方逐键 diff，见 R1）、
    完整权重清单（1199 条目逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData /
    sha 与逐 dtype 的 safetensors tally（BF16 27,781,419,504 + F32 8448）。
    96 个 F32 张量逐条列出并按层核过（48 层 × A_log + norm）。
    混合层的两个集合由清单的层索引交并集定，并与 config 的 layer_types 列表逐项比对一致。
    conv 通道恒等式在 48/48 层上验过，并与前代的 z 融合布局做了对照（见 qwen3-next 的 R1）。
    参数七项逐项按形状重算并与清单求和、HF tally 三方比对；
    与 qwen3.8-27b 的分项逐位相同（两份清单只差 dtype），这给了 breakdown 一次独立对照。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致。
    **原理上核不了的**：输出门的函数形式、矩阵状态的实际布局、conv 窗长、
    KV 落盘精度、训练精度、量化发布的配置，都在 open_questions 里。
