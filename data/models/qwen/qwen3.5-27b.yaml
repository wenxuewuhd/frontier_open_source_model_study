    field: lineage.changed_from_predecessor
    severity: wrong
    claim: >-
      草稿里 attention 条的 benefit 写「满上下文的 KV 从 10.00 GiB 涨到 2.00 GiB」
    finding: >-
      涨/降写反了，而且这是两个方向相反的因子叠加的结果，必须把两个数都给：
      每 token 元素数 131,072 → 32,768（**降 4 倍**，层数 64 → 16、每层宽度不变），
      上下文 40960 → 262144（**涨 6.4 倍**），
      重算：本代 65,536 B/token × 262144 = 17,179,869,184 B = 16.00 GiB，
      前代 262,144 B/token × 40960 = 10,737,418,240 B = 10.00 GiB。
      **满上下文的 KV 其实是涨的（10.00 → 16.00 GiB，×1.6）**，因为上下文涨的 6.4 倍
      压过了每 token 降的 4 倍。草稿两处都错：方向反了，数也编了一个 2.00 GiB，
      而且句子里还留着一句写到一半的自我更正。
      skill 的「一个乘式逐因子验」在这里是「两个因子方向相反，必须各自算完再乘」
    resolution: corrected
    changed_to: >-
