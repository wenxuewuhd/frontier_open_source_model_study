  - id: R8
    field: arch.vision.tokens.llm_tokens
    severity: missing
    claim: >-
      结构侧（layers / hidden / patch_size / spatial_merge_size / out_hidden /
      params / fusion）都填了，但「一张图产出多少 token」一格都没有，
      于是 prefill 的计算量和主干的 token 预算都答不出来 ——
      PLAN §2 多模态·理解那一行点名要 prefill 负载
    finding: >-
      补 arch.vision 下的 tokens / prefill / separability 三组，逐因子核过。
      本条记两个**过程中抓出来的口径错**，它们都会让数字看着自洽而错：
      (1) **时间维不是 2 个 patch。** patch_embed.proj.weight
      [1152, 3, 2, 16, 16] 是 Conv3d、时间核 2，单张静态图要补成 2 帧才喂得进去，
      所以一张图是 **1** 个时间 patch。按「temporal_patch_size 2 所以乘 2」
      读会把 encoder token 数和 encoder FLOPs 同时高估一倍。
      (2) **主干分母不能用 data/derived 里的 flops.linear_per_token。**
      那一项是 2 × active_params.total，含 lm_head 的 1,271,398,400
      —— lm_head 每步对全词表做 GEMM 是 decode 口径，prefill 只在最后一个
      位置算 logits。拿 51,249,200,128 当分母而不是扣掉 lm_head 的
      48,706,403,328，会把「一张图相当于多少文本 token」低估 5%。
      这一条对每一份 vlm 记录都成立，不是本记录特有的。
      还有一件**没能钉住**的：encoder 自注意力的跨度。vision_config 里既没有
      window_size 也没有 fullatt_block_indexes（前代 Qwen2.5-VL 有这两个键），
      所以「整图一段」还是「分窗」在 config 层面判不了，参考实现本轮没读。
      按整图一段算那一项约 387 GFLOPs，只占线性项 1456.5 的 1/4，
      结论不受影响 —— 但那是假设了跨度之后的数，所以 prefill 下面每一格
      都只装线性项，跨度本身进 open_questions。
      另外 672×672 是**本仓为跨模型比较选的参考分辨率**（能被 14/16/28/32/42/48
      整除），不是厂商默认：默认分桶在 preprocessor_config.json 的
      min_pixels / max_pixels 里，那个文件不在 facts/
    resolution: corrected
    changed_to: >-
      新增 arch.vision.tokens（672² 下 1764 → 441，压缩比 4，压缩在 projector 之前）、
      arch.vision.prefill（encoder 线性 1456.5 GFLOPs、一张图 ≈ 472 个文本 token，
      即 441 个位置 + 31 个位置当量的塔开销）、
      arch.vision.separability（前缀 model.visual. 与主干不相交，
      但 333 个视觉张量全在第 11 个分片里与 503 个非视觉张量同片，shard_isolation: mixed）；
      evidence 另加五条，判断类的三格（scope_note / attention_excluded /
      cross_prefix_sharing）标 judgement 进 Gate C；
      encoder 注意力跨度与默认分辨率两件事进 open_questions
  - id: R9
    field: precision.weights_release
    severity: wrong
    claim: >-
      「Qwen3.5-27B-GPTQ-Int4 是 **Qwen 线第一次有 INT4 的官方发布**
      （前面各代只有社区 AWQ/GPTQ 或 FP8）」
    finding: >-
      **两头都错。** 把本轮拉到的 Qwen org 全名单（469 个仓）按发布形态归类：
      官方 GPTQ-Int4 从 **Qwen1.5 就有**（最早 Qwen1.5-0.5B-Chat-GPTQ-Int4，
      2024-02-04，共 37 个仓），AWQ 同样从 Qwen1.5 起（最早 2024-02-03，共 40 个），
      更早还有 **Qwen-7B/72B-Chat-Int4 / Int8（2023-08 ~ 2023-11，9 个仓）**；
      FP8 才是后来的，从 **Qwen3（2025-04-28）** 起全档位铺开（共 40 个）。
      所以 INT4 不是「第一次」，也不是「社区的」—— 它们都在 Qwen org 名下。
      本档真正的新鲜处只是「这一代的 Int4 仓覆盖到了 397B / 122B / 35B / 27B 四档」，
      而那不值得写成「第一次」。
      根因：写这句时只看了同代名单那几行，**没有回到已经拉到本地的 org 全名单去数** ——
      一条「第一次 / 零例外」类断言，手边就有全量数据却没查
    resolution: corrected
    changed_to: >-
      删掉那句断言，subsystem_method 改为列 FP8 与 Int4 两个仓的发布时间；
      另补取 Int4 仓的 config（sources[2]）：GPTQ / bits 4 / group_size 128 / sym /
      desc_act false，且逐 dtype tally 说明**只量化主干稠密 FFN**
      （I32 17,112,760,320 与本记录 dense_ffn 逐位相同），其余仍 BF16；
      open question 收窄为「清单没取，所以实测量化块仍未知」
  - id: R10
    field: precision.quantization
    severity: unsupported
    claim: >-
      Int4 仓的 group_size 128 只是 config 声明值（R8 时清单还没取）
    finding: >-
      本轮取了清单（1,775 个张量），**实测与声明一致**：192 个被量化的张量零例外，
      group_size = 128 沿 in 维 —— gate/up 的 qweight [640, 17408] 还原 int4 打包后
      逻辑 in = 5120 而 scales [40, 17408]，5120 / 40 = 128；
      down 的 qweight [2176, 5120] → 逻辑 in 17408 而 scales [136, 5120]，17408 / 136 = 128。
      scale 的 dtype 是 **F16**。被量化的恰是 64 层 × 3 = 192 个投影，
      **草稿块的 FFN 没量化**。
      **这与 DeepSeek 一代的教训是反例**：那边 config 声明 [128,128] 而 FP4 专家实测
      [1,32]（差 128 倍）；Qwen 这两个量化仓（本档 Int4 与旗舰 FP8）的声明都对上了。
      所以「config 的量化块不可信」要改成「**必须实测，但它也可能是对的**」——
      实测的价值在于把它从声明变成事实，不在于一定能抓到错
    resolution: confirmed
  - id: R11
    field: precision.quantization.official_variants
    severity: missing
    claim: >-
      精度页逐格画的是**主仓那一份权重**的落盘精度，而 `weights_release_scope` 的
      两个布尔对 FP8 / Int4 两档都填 false
    finding: >-
      **一·口径太窄，窄到把结论反过来。** Qwen 13 份记录逐子系统实测全是 BF16，
      精度页画出来是一面绿墙 —— 而厂商每一代旗舰都另发官方 FP8 仓、这一代还有 GPTQ-Int4。
      本档的两个官方量化仓逐张量读下来：Int4 仓把稠密 FFN（171 亿，占参数量 61.6%）
      压到 4 bit，FP8 仓把注意力（99.6%）与草稿块（87.6%）压到 8 bit。
      这是 model-audit 规则 11 那个盲区的实例：声明与实测完全自洽、闸全绿，
      而「厂商发了而记录压根没把它读进来」查不出来。
      **二·两个布尔在说反话。** R10 那一轮已经取过 Int4 仓的完整清单（1,775 个张量），
      而 `manifest_taken` 还是 false —— 散文更新了、字段没跟上。
      **三·HF 的汇总数不能当来源。** 原先 sources[2] 与 subsystem_method 都引
      `I32 17,112,760,320` 作为「只量化了稠密 FFN」的依据，而清单里 I32 的真实 numel
      是 2,157,576,192。那个 171 亿是 192 个 qweight 还原打包后的**逻辑参数数**
      （2,139,095,040 × 8），挂在容器 dtype 名下，同时折掉 qzeros、整类丢掉 F16 的
      scales。结论碰巧是对的（它确实等于 dense_ffn），但**依据是错的** ——
      既不是容器数也不是参数数，而本仓的坑恰恰叫「numel 是容器数不是参数数」，
      这是它的第三种变体
    resolution: corrected
    changed_to: >-
      新增 `precision.quantization.official_variants`：两个官方量化仓逐仓逐张量实测，
      各带 repo / rev / origin / 逐子系统精度 / 块 / scale / 对账数。
      **`per_subsystem` 一个字不动** —— 它是 derive.py 识别打包的承重件
      （`logical` → `packing_factor`），读的清单是 hf.repo 那一份，
      换成低精度仓的值就会按一份不存在的权重还原参数量。
      两档的 `manifest_taken` / `in_precision_table` 翻成 true，
      而 `scripts/validate.py` 的 `check_release_vs_measured` 随之收紧：
      翻布尔必须拿得出证据（official_variants 里有同 dtype 的一条、其 per_subsystem
      里真的出现了这个精度），光填 true 照旧报错。
      新增 `check_variants` 四查：dtype 要在 weights_release 里、repo 不能等于 hf.repo、
      **params_total 必须等于主仓 derived 的 params_total**、per_subsystem 的键要合法。
      取数由新脚本 `scripts/variant_precision.py` 做，对账不过就非零退出；
      `lib/dtypes.py` 补认 GPTQ 的三个叶名（scales / qzeros 归量化参数，g_idx 归元数据）——
      不排掉它们，参数量会比主仓多出 1.5 亿，而两个仓本该逐位相同。
      **原生发布与事后再量化分开**：每条变体带 `origin`，本档两档都是 post_quantized
      （判据：逐子系统参数量与主仓逐位相同 + 仓里带 quantization_config），
      精度页据此给这些色块画斜纹，不与 DeepSeek 主仓的 FP4 那类原生精度并列
