  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    ref:
      kind: modelcard
      url: https://huggingface.co/Qwen/Qwen3.5-27B
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      混合结构把长上下文的 KV 压力大幅转移：只有 1/4 的层累积 KV，
      其余层的状态与上下文长度无关。代价是引擎要同时管理两种生命周期不同的
      显存对象，而且线性层的状态无法像 KV 那样按 block 分页复用。
      与前代（64 层全累积、40960 上下文）相比：每 token 的元素数降 4 倍，
      而上下文放大 6.4 倍，所以满上下文的 KV 反而从 10.00 GiB 涨到 16.00 GiB。
      混合结构买到的是「同样的缓存预算能撑更长的上下文」，不是「缓存变小」。
    quantified: >-
      65,536 B/token（16 层 × 2048 元素 × 2 B 兜底）+ 151.50 MiB/序列
      （48 层 × (48×128×128 矩阵 + 4×10240 短卷积) × 4 B，FP32 有 config 声明）。
      262144 满上下文 16.15 GiB；4096 上下文 256.00 MiB + 151.50 MiB。
      **两个分量的 basis 不同**：per_token 是 dtype_fallback（KV 精度未披露），
      per_sequence 的 FP32 来自 config —— 合计因此不是单一口径
    visibility: public
  - dimension: operator-gap
    finding: >-
      线性注意力层需要递归状态更新与短卷积，和 full attention 完全不同的算子，
      一个模型内两套路径按层交替调度。这一代还多了视觉塔的四类算子
      （带 bias 的 LayerNorm、GELU、3D patch 卷积、patch merge）
      与草稿块的一次额外前向。
    visibility: public
  - dimension: compute
    finding: >-
      dense FFN 意味着每 token 都要搬运全部 FFN 权重，没有 MoE 的稀疏激活优势。
      带宽口径的激活参数 25,609,631,936 占语言主干（26,895,998,464）的 95.2%，
      decode 每 token 搬 47.70 GiB —— 同代旗舰 qwen3.5-397b-a17b 的激活占比
      只有 4.6%。这是这一档与旗舰最大的负载差别，而不是注意力。
    quantified: >-
      带宽口径 25,609,631,936 × 2 B = 47.70 GiB/token；权重存储 51.75 GiB
    visibility: public

infra_signals:
  - text: >-
      **Qwen 线唯一出现 F32 权重的一代**：48 层的 linear_attn.A_log 与
      linear_attn.norm 是 F32（dt_bias 仍 BF16），前代 Qwen3-Next 与下一代
      Qwen3.6/3.8 都是 BF16。张量名与形状逐条相同，**只有 dtype 看得见**。
      线性注意力的递归核因此在这一代是混合精度，按「衰减参数与权重同 dtype」
      写的核会读错。跟踪线性注意力时，衰减参数的精度要每代单独测。
    evidence: derived
    horizon: settled
    axis: precision
  - text: >-
      config 这一代第一次把三件事写出来：layer_types 列表（前代只有 interval）、
      attn_output_gate（前代门只在权重里）、mamba_ssm_dtype（前代状态精度无来源）。
      **而 output_gate_type 还要再等一代**。
      「config 声明了什么」本身是会随代际变的，所以跨代比较要比键集合，
      不能只比键值 —— 否则会把「这一代才声明」读成「这一代才有」。
    evidence: derived
    horizon: settled
    axis: attention

