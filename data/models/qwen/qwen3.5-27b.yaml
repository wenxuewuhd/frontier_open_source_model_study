# 机械字段来自 config（official）；形状、参数量、层分布、视觉塔与草稿块的构成、
# 以及 F32 的两类张量来自完整权重清单（11 分片 1199 条目，无读失败分片）。
# 本档与 qwen3.8-27b 的清单只差 96 个张量的 dtype（见 lineage 与 R1），
# 所以结构性字段两份记录一致，差异集中在 precision。
id: qwen3.5-27b
family: qwen
kind: vlm
display_name: Qwen3.5-27B
released: '2026-02-24'
license: apache-2.0
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen3.5-27B
    locator: config.json @ fc05daec18b0
    accessed: '2026-10-30'
    note: >-
      许可取自 HF tags license:apache-2.0 与 cardData license: apache-2.0
      （同代旗舰 Qwen3.5-397B-A17B 也是 apache-2.0；到 Qwen3.8 两档才各自变成
      license_name: qwen3.8-max 与 qwen-community-1.0）。
      11 分片 1199 个张量，逐分片读头取全，failed_shards 为空。
      **1103 条 BF16 + 96 条 F32**（F32 的是 48 层的 linear_attn.A_log [48]
      与 linear_attn.norm.weight [128]，共 8448 个元素）。
      config 这一代第一次有 layer_types 列表、attn_output_gate 与 mamba_ssm_dtype；
      **还没有** output_gate_type（3.6 起才有，值 swish）

  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen3.5-27B/blob/fc05daec18b0a78c049392ed2e771dde82bdf654/README.md
    locator: 'README.md @ fc05daec18b0 · Model Overview'
    accessed: '2026-10-30'
    note: >-
      按本仓「来源优先级：模型卡 / 技术报告 > 厂商参考实现 > 引擎实现」补的一手来源。
      Model Overview 的声明值（**全部嵌在「Language Model」这一级下**，
      与并列的 Vision Encoder 分开）：「Number of Parameters: **27B**」、
      「Hidden Dimension: 5120」、「Token Embedding: **248320 (Padded)**」、
      「Number of Layers: 64」、「Hidden Layout: **16 × (3 × (Gated DeltaNet → FFN)
      → 1 × (Gated Attention → FFN))**」、「**Gated DeltaNet**: 48 for V and 16 for QK,
      Head Dimension 128」、「**Gated Attention**: 24 for Q and 4 for KV,
      Head Dimension 256, **Rotary Position Embedding Dimension: 64**」、
      「Feed Forward Network: Intermediate Dimension 17408」、
      「LM Output: 248320 (Padded)」、「MTP: trained with multi-steps」、
      「Context Length: **262,144 natively and extensible up to 1,010,000 tokens**」。
      类型写成「Causal Language Model **with Vision Encoder**」。
      **卡里没有训练精度声明，也没有提 A_log / norm 的 F32**（那件事只有 dtype 看得见）

  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen3.5-27B-GPTQ-Int4
    locator: 'config.json @ 8f0c09f227ae · quantization_config'
    accessed: '2026-10-30'
    note: >-
      同代的官方 INT4 发布仓，本轮补取了它的 config 与元数据（没取清单）。
      quantization_config：**quant_method gptq、bits 4、group_size 128、sym true、
      desc_act false**，另有 damp_percent / static_groups / true_sequential / dynamic 四键，
      **modules_to_not_convert 为空**。
      HF 的逐 dtype tally 说明了它实际量化了哪一块：I32 **17,112,760,320**
      —— 与本记录主干稠密 FFN 的参数量**逐位相同**（草稿块的 FFN 不在内，
      含草稿块应是 17,380,147,200）；其余 10,668,659,184 仍是 BF16，F32 那 8,448 个也还在。
      所以 **GPTQ-Int4 只覆盖主干稠密 FFN**，注意力、视觉塔、草稿块与两份词表都没量化。
      usedStorage 51.76 → **28.17 GiB（1.84 倍）**，只有 1.84 倍是因为降到 4 bit 的
      只占参数量的 61.6%。
      **本轮又补取了它的完整清单**（1,775 个张量），两件事因此是实测而不是声明：
      (1) **量化组实测 group_size = 128，沿 in 维，192 个张量零例外** ——
      gate/up 的 qweight [640, 17408] 还原 int4 打包后逻辑 in = 5120、
      scales [40, 17408]，5120 / 40 = 128；down 的 qweight [2176, 5120] → 逻辑 in 17408、
      scales [136, 5120]，17408 / 136 = 128。与 config 声明的 group_size 一致；
      (2) **scale 的 dtype 是 F16**（不是 BF16，也不是主干权重的那套）。
      被量化的恰好是 192 = 64 层 × 3 个投影，**草稿块的那 3 个没量化**
      （含草稿块应是 195），与 tally 的结论一致。
      另两个 GPTQ 格式张量也在：qzeros 16,711,680 个元素（尽管 sym 为 true）、
      g_idx 1,769,472 个（尽管 desc_act 为 false）——
      本仓只看形状，不能说它们的内容是什么，但它们确实占存储（合计 0.07 GiB）。
      HF 的 I32 tally 17,112,760,320 = 容器 2,139,095,040 × 8，
      说明**HF 把 int4-in-int32 也还原了**（和它对 FP4 装 INT8 的处理一致）

hf:
  repo: Qwen/Qwen3.5-27B
  sha: fc05daec18b0a3ae0f7dd1a44d19b5a0c2a09d26
  last_modified: '2026-04-24T08:10:17.000Z'
  pipeline_tag: image-text-to-text
  gated: false

lineage:
  track: side
  predecessor: qwen3-32b
  successor: qwen3.8-27b
  changed_from_predecessor:
    - axis: attention
      text: >-
        **混合线性注意力进入稠密 FFN 档**：64 层按 3:1 分成 48 层线性 + 16 层 full
        attention，而且这一代 config **第一次给出 layer_types 列表**（不再只有
        full_attention_interval）。清单与列表一致：self_attn.q_proj 恰在
        3/7/…/63 这 16 层（外加草稿块），linear_attn.* 恰在其余 48 层。
        full 层的几何也换了：24 头 / 4 KV 头 / head_dim **256**（前代 64 / 8 / 128），
        q_proj [12288, 5120] = 2 × 24 × 256（**输出门，config 这一代有
        attn_output_gate: true**），o_proj 入口 6144 = 24 × 256。
        位置编码换成 **interleaved mRoPE**（mrope_section [11, 11, 10]，theta 1e7，
        partial_rotary_factor 0.25）
      benefit: >-
        累积 KV 的层数从 64 降到 16、每层宽度不变（都是 2048 元素：
        本代 2 × 4 × 256、前代 2 × 8 × 128），所以每 token 从 131,072 元素
        降到 **32,768 元素，整 4 倍**。
        **但满上下文的 KV 是涨的**：上下文同代从 40960 放到 262144（×6.4），
        两个方向相反的因子乘起来是 10.00 GiB → **16.00 GiB**（×1.6）。
        每 token 比与满上下文比说的不是一件事，两个都要给。
        另外新增一类显存对象：48 层各一份每序列固定的递归状态，
        合计 **151.50 MiB/序列**（FP32，config 声明 mamba_ssm_dtype: float32）
    - axis: modality
      text: >-
        **稠密档第一次带视觉前端**：model.visual.* 共 333 个张量、460,730,096 参数 ——
        27 个 ViT 块（qkv [3456, 1152] 带 bias、proj、两层非门控 MLP [4304]、
        两个带 bias 的 LayerNorm）、patch_embed.proj [1152, 3, 2, 16, 16]（3D 卷积）、
        pos_embed [2304, 1152]、merger（把 2×2 个 patch 拼成 4608 = 1152 × 4
        再投到主干 hidden 5120）。架构名也从 ForCausalLM 变成 ForConditionalGeneration
      benefit: >-
        视觉塔的算子与语言主干不同：带 bias 的 LayerNorm、GELU（hidden_act
        gelu_pytorch_tanh）、3D patch 卷积、patch merge。
        它只占参数量的 1.66%，但在 prefill 侧是独立的一段负载，
        而且可以分离部署 —— 容量规划要把它单列
    - axis: scale
      text: >-
        词表 151936 → **248320**（+63.4%），embed 与 lm_head 各从 777,912,320
        涨到 1,271,398,400；层数 64 不变、hidden 5120 不变、FFN 中间维 25600 → 17408
      benefit: >-
        lm_head 每步对 248320 行做全量 GEMM，这一项在带宽口径里从 777,912,320
        涨到 1,271,398,400（占带宽口径的 4.9%）。
        **输入词表那一份不进带宽口径**（只 gather 一行），但两份都要驻留
    - axis: decoding
      text: >-
        **稠密档第一次有 MTP 草稿块**：config 的 mtp_num_hidden_layers: 1，
        清单里 mtp.layers.0 带一套与主干 full attention 同名的 q/k/v/o（没有
        linear_attn）加一套稠密 FFN（中间维 17408），另有 mtp.fc [5120, 10240]、
        pre_fc_norm_embedding / pre_fc_norm_hidden、mtp.norm。共 15 条目、424,699,392 参数
      benefit: >-
        开草稿侧时累积 KV 的层数从 16 变 17（65536 → 69632 B/token，+6.25%），
        线性状态仍是 48 层。草稿块的 FFN 是稠密的 —— 和主干一致，
        所以草稿侧不需要额外的 MoE 算子
    - axis: precision
      text: >-
        **48 层的 linear_attn.A_log [48] 与 linear_attn.norm.weight [128] 是 F32**，
        其余 1103 条是 BF16（dt_bias [48] 也是 BF16）。
        这是 Qwen 线唯一出现 F32 权重的一代：前代 Qwen3-Next 这两类是 BF16，
        下一代（Qwen3.6-27B，与 qwen3.8-27b 清单逐位相同）又回到 BF16
      benefit: >-
        线性注意力的递归核在这一代是混合精度：F32 的衰减参数与输出 norm
        配 BF16 的激活。按「norm 与激活同 dtype」或「衰减参数与权重同 dtype」
        写的核在这一代会读错。**只有 dtype 看得见** ——
        张量名与形状逐条相同

params:
  total: 2.7e+10
  excludes: [vision, draft]
  breakdown:
    dense_ffn: 17112800000.0
    attention: 7239770000.0
    embed: 1271400000.0
    lm_head: 1271400000.0
    vision: 460730000.0
    draft: 424699000.0
    norm: 674816.0
  counting_note: >-
    total 取自模型名（27B），属厂商声明；breakdown 是本仓按完整权重清单
    （11 分片 1199 条目）实测的分项，取 6 位有效数字。
    实测全量 27,781,427,952，与 HF 平台自己从分片头统计的 safetensors tally
    逐位相同（含 8448 个 F32 元素）。
    **口径与 qwen3.8-27b 完全一致**（两份的清单除 96 个张量的 dtype 外逐条相同）：
    名字不按全量算 —— 全量对 27B 是 +2.89%、取整是 28B，都超出 Gate B 的 2% 容差；
    扣掉视觉塔（460,730,096）与草稿块（424,699,392）后是 26,895,998,464，−0.39%，
    偏差最小。只扣其中一项取整也是 27B（+1.19% / +1.32%），所以扣哪几项仍是判断。
    **模型卡给了一条旁证**：27B 这个数嵌在「Language Model」一级下、
    与并列的「Vision Encoder」分开，所以**扣掉视觉塔是厂商自己的分法**；
    MTP 那一行也在 Language Model 下，所以扣草稿块仍是本仓的判断。
    权重存储 51.75 GiB（55,562,872,800 B，比 qwen3.8-27b 多 16,896 B ——
    96 个 F32 张量的 8448 个元素每个多 2 字节，两档的 GiB 数在两位小数上相同）。
    激活参数两个口径：带宽口径 25,609,631,936、可比官方口径 26,881,030,336
    （含输入词表）—— 稠密模型的可比官方口径恰等于语言主干总量减草稿块与视觉塔后
    再加回输入词表那一份。

context:
  max: 262144
  train_native: 262144
  extension_method: >-
    模型卡写「262,144 natively and extensible up to 1,010,000 tokens」，
    没有说用什么方法扩（config 的 rope_parameters 里 rope_type 是 default、无 scaling）。
    按 1,010,000 部署时本记录的 per_token 数要乘 3.85（16.00 GiB → 61.65 GiB），
    每序列状态不变

arch:
  layers: 64
  hidden: 5120
  vocab: 248320  # 模型卡写「Token Embedding: 248320 (Padded)」——补齐过的词表
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU
  position: >-
    interleaved mRoPE，theta 1e7，partial_rotary_factor 0.25（只对 1/4 维度加 rope）：
    256 × 0.25 = 64 维即 32 个频率对，mrope_section [11, 11, 10] 正好分完 32 对

  attention:
    type: hybrid
    num_heads: 24
    num_kv_heads: 4
    head_dim: 256
    head_dim_note: >-
      full attention 层的 q_proj 是 [12288, 5120]，12288 = 2 × 24 头 × 256 ——
      输出维翻倍，一半是 query、一半是输出门（config 的 attn_output_gate: true）。
      o_proj 入口 6144 = 24 × 256 只对应 query 那一半。按 num_heads × head_dim
      推 q_proj 会低一半。k_proj 与 v_proj 都是 [1024, 5120]（1024 = 4 × 256），
      缓存宽度按它们的输出维算：每层 2 × 1024 = 2048 元素。
      线性层的输出门是另一个张量 in_proj_z [6144, 5120]（= 48 value 头 × 128），不在 q 里。
      另有每层 q_norm [256] 与 k_norm [256]，归 norm 子系统
    partial_rotary_factor: 0.25
    layer_pattern: >-
      3:1 linear:full，full attention 落在层号 ≡ 3 (mod 4) 上。
      **这一代 config 第一次给出 layer_types 列表**（64 项），
      与清单一致：self_attn.q_proj 在 3/7/…/63 共 16 层（外加草稿块 1 层），
      linear_attn.conv1d 在其余 48 层，两集合无交集
    output_gate:
      enabled: true
      type: >-
        未声明 —— 本代 config 有 attn_output_gate: true 但**没有 output_gate_type**
        这个键（Qwen3.6 起才有，值 swish）。门的存在由 q_proj 的输出维翻倍定
    hybrid:
      layer_types_count:
        linear: 48
        full: 16
      interval: 4
      note: >-
        16 层 full attention 的 KV 随上下文线性增长，48 层线性注意力只带每序列固定的
        递归状态，两者增长方式不同，容量规划必须分开算。
        以上层数都是主干口径（64 主干层 + 1 草稿块）：草稿块 mtp.layers.0 带一套与主干
        full attention 同名的 q/k/v/o 投影、没有 linear_attn，
        所以开草稿侧时累积 KV 的是 17 层、65536 → 69632 B/token，线性状态仍是 48 层。
        本记录与 data/derived/ 都按主干口径记账
    linear_state:
      mechanism: >-
        **Gated DeltaNet**（厂商名，模型卡 Model Overview）：门控线性注意力 + 短卷积。
        卡把这一支的头数写成「48 for V and 16 for QK」，与 config 一致
      num_key_heads: 16
      num_value_heads: 48
      key_head_dim: 128
      value_head_dim: 128
      conv_kernel_dim: 4
      state_dtype: FP32
      state_layout_note: >-
        四个因子都钉在清单的形状上。状态头数 48（= value 头数）：每层
        linear_attn.A_log [48] 与 dt_bias [48]，衰减参数每状态头一个；
        in_proj_a [48, 5120] 与 in_proj_b [48, 5120] 也是 48。
        投影这一代**拆成两张**：in_proj_qkv [10240, 5120]（= q 16×128 + k 16×128
        + v 48×128）与 in_proj_z [6144, 5120]（输出门）——
        前代 Qwen3-Next 是融合的 in_proj_qkvz，所以「conv1d 首维 = in_proj_qkv 输出维」
        这个恒等式**从这一代起**才成立（48/48 层 conv1d.weight 都是 [10240, 1, 4]）。
        跨代通用的写法是「conv 通道数 = q + k + v 三段之和」。
        状态精度有一手来源：config 的 mamba_ssm_dtype: float32。
        窗长按全窗 4 计是上界；矩阵状态的实际存储是否就是一个 [48, 128, 128]
        的 FP32 张量仍需按实现核（两维都是 128，维序不影响容量）

  ffn:
    type: dense
    intermediate: 17408
    layer_pattern: >-
      64 主干层与草稿块都是稠密 FFN（gate_proj / up_proj / down_proj 三张独立投影）。
      **线性层与 full 层的 FFN 形态相同** —— 混合只发生在注意力一侧。
      同代旗舰 qwen3.5-397b-a17b 这一档是 MoE（512 专家堆叠存储），
      两档的差别在 FFN 而不在注意力

  decoding:
    mtp_layers: 1
    mtp_layers_note: >-
      config 的 mtp_num_hidden_layers: 1 与清单一致（mtp.layers.0 一个块）。
      块内是一套 full attention（q/k/v/o + q_norm/k_norm，**没有 linear_attn**）
      加一套稠密 FFN（中间维 17408），块外有 mtp.fc [5120, 10240]、
      pre_fc_norm_embedding / pre_fc_norm_hidden、mtp.norm，共 15 条目、424,699,392 参数

  vision:
    encoder: Qwen3.5 vision tower
    layers: 27
    hidden: 1152
    num_heads: 16
    intermediate: 4304
    patch_size: 16
    spatial_merge_size: 2
    temporal_patch_size: 2
    out_hidden: 5120
    params: 460730096.0
    fusion: >-
      patch merge 后投影到主干 hidden：merger.linear_fc1 [4608, 4608]
      （4608 = 1152 × 4，即 2×2 个 patch 拼接）→ linear_fc2 [5120, 4608]。
      deepstack_visual_indexes 是空列表，所以没有多层注入，只在输入侧并入
    tokens:
      reference_resolution: 672x672
      patch_grid: 42x42
      encoder_tokens: 1764
      llm_tokens: 441
      compression_ratio: 4
      compression_stage: >-
        merger 入口一步到位：2×2 相邻 patch 在通道维拼接（linear_fc1 的输入维
        4608 = 1152 × 4 就是这个拼接），**压缩在 projector 之前**。
        所以两层 merger 的 GEMM 只跑 441 次而不是 1764 次 ——
        次序搞反会把 projector 的 FLOPs 高估 4 倍
      dynamic_resolution: true
      derivation: >-
        三个因子分别来自：
        (1) patch 16 —— config.vision_config.patch_size，并由
        model.visual.patch_embed.proj.weight [1152, 3, 2, 16, 16] 的后两维印证；
        (2) 2×2 空间合并 —— config 的 spatial_merge_size 2，并由
        merger.linear_fc1.weight 的输入维 4608 = 1152 × 4 印证；
        (3) 时间维 1 —— patch_embed 是 Conv3d、核的时间维是 2
        （权重形状第三维），单张静态图必须补成 2 帧才能喂进这个核，
        所以一张图恰好 1 个时间 patch，不是 2 个。
        于是 672 / 16 = 42，42² = 1764 个 encoder token；
        42 / 2 = 21，21² = 441 个主干 token。
        **672 是本仓为跨模型比较选的参考分辨率**（能被 14/16/28/32/42/48 整除），
        不是厂商默认值：真正的默认分桶由 preprocessor_config.json 的
        min_pixels / max_pixels 决定，那个文件不在 facts/ 里
      scope_note: >-
        只覆盖单张静态图。视频每 2 帧并成 1 个时间 patch
        （patch_embed 的时间核 2），所以 t 帧的 encoder token 数是
        1764 × ⌈t/2⌉ —— 与 Kimi K2.5 那种时间池化到 1 帧的做法不同，
        这里帧数会真的进主干 token 预算
    prefill:
      encoder_linear_gflops: 1456.5
      projector_linear_gflops: 39.54
      backbone_token_budget: 441
      backbone_linear_gflops_per_token: 48.71
      image_as_text_tokens: 472
      attention_excluded: >-
        被排除的是 encoder 自注意力的 QK^T 与 AV 两个 matmul，
        形式是 4 × n² × hidden × layers（n 是同一个注意力段内的 token 数）。
        排除的理由不是它小，而是 **n 定不下来**：vision_config 里没有
        window_size、也没有 fullatt_block_indexes 这类键
        （前代 Qwen2.5-VL 有），所以「整图一段」还是「分窗」在 config 层面
        无从判断，而参考实现本轮没读。按整图一段取 n = 1764 的话这一项约
        1764² × 4 × 1152 × 27 = 387 GFLOPs，和线性项不在一个量级上可以忽略 ——
        但那是**假设了跨度**之后的数，所以不写进上面任何一格
      derivation: >-
        encoder 线性项 = 2 × 1764 × (patch_embed 1,769,472 + 每层线性 15,224,832
        × 27 层 = 411,070,464) = 2 × 1764 × 412,839,936 = 1,456,499,294,208。
        每层 15,224,832 逐因子核过：qkv 3 × 1152² + o 1152² + fc1 4304 × 1152
        + fc2 1152 × 4304，四项相加与清单里 108 个 blocks 线性张量的求和逐位相同。
        projector 线性项 = 2 × 441 × (4608² + 5120 × 4608) = 39,537,082,368。
        主干分母 = 2 × (active_params.total 25,624,600,064 −
        active_params.lm_head 1,271,398,400) = 48,706,403,328 ——
        **扣掉 lm_head 是关键**：data/derived 里的 flops.linear_per_token
        51,249,200,128 含 lm_head，那是 decode 口径（每步对全词表做 GEMM），
        prefill 只在最后一个位置算 logits，拿它当分母会把下面这个换算低估 5%。
        换算 = 441 + (1,456,499,294,208 + 39,537,082,368) / 48,706,403,328
        = 441 + 30.7 = 472 个文本 token。
        **读法：一张 672² 的图，主干侧的成本 93% 来自它占的 441 个位置、
        只有 7% 来自视觉塔**（472 / 441 = 1.07）。视觉塔 4.6 亿参数看着不小，
        但它只跑 1764 个 token，而主干每 token 要搬 24.4B 激活权重
    separability:
      weight_prefix: >-
        model.visual.（333 个张量，含 merger）；主干在 model.language_model.
        与 mtp. / lm_head.。两个前缀不相交
      shard_isolation: mixed
      shard_note: >-
        实测 model.safetensors.index.json 的 weight_map：333 个 model.visual.
        张量**全部落在最后一个分片** model.safetensors-00011-of-00011，
        而同一个分片里还有 503 个非视觉张量。没有任何纯视觉分片 ——
        要把视觉塔单独加载必须读这个分片再按前缀筛，不能靠跳过文件
      cross_prefix_sharing: >-
        weight_map 的 1199 个名字里没有任何一个同时匹配 model.visual.
        与主干前缀，即**没有重名共享**。但这只排除了重名：落盘层面的
        tied weights 要看 safetensors 头里的数据偏移是否重合，
        weight_map 答不了这个问题，本轮没读偏移

precision:
  weights_release: [BF16, FP8_E4M3, INT4]
  weights_release_scope:
    BF16: { manifest_taken: true, in_precision_table: true }
    FP8_E4M3:
      manifest_taken: true
      in_precision_table: true
      repo: Qwen/Qwen3.5-27B-FP8
      note: >-
        厂商另发的独立仓，本轮取了完整清单（1,606 个张量），逐子系统实测落在
        quantization.official_variants 里 —— 精度表的第二个来源。
        **主仓的 per_subsystem 不受影响**：那个字段是 derive.py 识别打包用的承重件，
        口径只能是 hf.repo 那一份权重
    INT4:
      manifest_taken: true
      in_precision_table: true
      repo: Qwen/Qwen3.5-27B-GPTQ-Int4
      note: >-
        厂商另发的独立仓，清单已取（1,775 个张量，R10），本轮把逐子系统实测
        落进 quantization.official_variants。**这两个布尔原先都是 false，而 R10 那一轮
        早已取过清单** —— 字段落在了散文后面没跟上，正是「说反话的字段比留空更坏」那一条
  quantization:
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      draft: BF16
      vision: BF16
      embed: BF16
      lm_head: BF16
      norm: MIXED
    subsystem_method: >-
      来自完整权重清单（11 分片 1199 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空。1103 条 BF16 + 96 条 F32。
      **norm 一项标 MIXED**：48 层的 linear_attn.norm.weight 是 F32，
      而 input_layernorm / post_attention_layernorm / q_norm / k_norm / model.norm
      都是 BF16 —— 同一个子系统内两种精度，按元素数加权 F32 只占 6144 / 674,816 = 0.9%，
      但「少数异类」在这里恰恰是要说的事，所以不报多数值。
      attention 一项是 BF16：**A_log 虽然也是 F32，但它在 attention 桶里
      只占 2304 / 7,239,766,528**，报 BF16 是带宽主体的精度 ——
      A_log 的 F32 单独写在 lineage 的 precision 条与 open_questions 里。
      本仓没有量化块（无 quantization_config），所以 per_subsystem_block 不填。
      weights_release 的 FP8_E4M3 与 INT4 来自同代的 Qwen3.5-27B-FP8（2026-02-25）与
      Qwen3.5-27B-GPTQ-Int4（2026-03-03）两个仓。
      **本轮补取了 Int4 仓的 config（见 sources[2]）**：GPTQ、bits 4、group_size 128、
      sym、desc_act false，而它的逐 dtype tally 说明**只量化了主干稠密 FFN**
      （I32 17,112,760,320 与本记录的 dense_ffn 逐位相同），注意力 / 视觉塔 / 草稿块 /
      词表仍 BF16。
      **这一段的口径是主仓那一份权重。** 主仓没有 quantization_config，所以这里
      per_subsystem_block / per_subsystem_scale 不填 —— 不是没查，是主仓真没有量化块。
      厂商另发的 FP8 与 GPTQ-Int4 两个仓**逐仓实测在 official_variants 里**，
      块与 scale 记在各自那一条下面
    official_variants:
      # 按元素位宽升序列（最低的在前）。精度页逐格取「厂商官方发布过的最低精度」，
      # 所以这个顺序只是给人读的，页面不依赖它。
      - dtype: INT4
        repo: Qwen/Qwen3.5-27B-GPTQ-Int4
        rev: 8f0c09f227ae
        origin: post_quantized
        tensor_count: 1775
        params_total: 27781427952
        weight_bytes_total: 30235043808
        per_subsystem:
          attention: BF16
          dense_ffn: INT4
          draft: BF16
          vision: BF16
          embed: BF16
          lm_head: BF16
          norm: MIXED
        per_subsystem_block:
          dense_ffn: '[1,128]'
        per_subsystem_scale:
          dense_ffn: FP16
        method: >-
          完整清单逐项统计（11 分片 1,775 条目，failed_shards 为空），非抽样。
          **逐子系统参数量与主仓逐位相同，七桶零例外**，合计同为 27,781,427,952 ——
          这是「同一份权重的两种存法」的硬证据，也是把 origin 判成 post_quantized 的判据
          （另一半判据是仓里带 quantization_config）。
          **参数量不能照抄 HF 的 tally**：它报 `I32 17,112,760,320`，而清单里 I32 的
          真实 numel 是 2,157,576,192 —— 那个 171 亿是 192 个 `qweight` 还原打包后的
          逻辑参数数（2,139,095,040 × 8），挂在容器 dtype 的名下，同时把 `qzeros`
          （16,711,680 个 I32 零点）折掉、把 `scales`（133,693,440 个 **F16**）整类丢掉。
          所以那个数既不是容器数也不是参数数，两种读法都解释不通，只能逐张量读。
          量化只覆盖主干稠密 FFN 的 192 个投影（64 层 × 3），**草稿块的那 3 个没量化**；
          注意力 / 视觉塔 / 两份词表全留 BF16。
          块由形状量出、不抄 config：gate/up 的 qweight [640, 17408] 还原后逻辑 in = 5120
          而 scales [40, 17408]，5120 / 40 = 128；down 的 [2176, 5120] → 逻辑 in 17408
          而 scales [136, 5120]，17408 / 136 = 128。沿 in 单轴分组、每个 out 通道一组，
          所以写成 [1,128]。
          落盘 30,235,043,808 B（28.16 GiB），主仓 55,562,872,800 B（51.75 GiB），1.838×
          —— 只有 1.84 倍是因为降到 4 bit 的那 171 亿只占参数量的 61.6%。
          norm 一项标 MIXED 与主仓同口径（48 条 F32 + 161 条 BF16，这个仓没动它们）
      - dtype: FP8_E4M3
        repo: Qwen/Qwen3.5-27B-FP8
        rev: 97f5941bf617
        origin: post_quantized
        tensor_count: 1606
        params_total: 27781427952
        weight_bytes_total: 30866680160
        per_subsystem:
          attention: FP8_E4M3
          dense_ffn: FP8_E4M3
          draft: FP8_E4M3
          vision: BF16
          embed: BF16
          lm_head: BF16
          norm: MIXED
        per_subsystem_block:
          attention: '[128,128]'
          dense_ffn: '[128,128]'
          draft: '[128,128]'
        per_subsystem_scale:
          attention: BF16
          dense_ffn: BF16
          draft: BF16
        per_subsystem_schemes:
          attention:
            - { dtype: FP8_E4M3, block: '[128,128]', scale_dtype: BF16, tensors: 208, elements: 7214202880 }
            - { dtype: BF16, tensors: 192, elements: 25561344 }
            - { dtype: FP32, tensors: 48, elements: 2304 }
          draft:
            - { dtype: FP8_E4M3, block: '[128,128]', scale_dtype: BF16, tensors: 7, elements: 372244480 }
            - { dtype: BF16, tensors: 8, elements: 52454912 }
        method: >-
          完整清单逐项统计（11 分片 1,606 条目，failed_shards 为空），非抽样。
          **逐子系统参数量与主仓逐位相同，七桶零例外**，合计同为 27,781,427,952。
          这个仓的覆盖面**比 Int4 仓宽得多，而元素位宽更高** —— 两件事要一起看，
          否则「最低精度仓」会被读成「量化得最彻底的仓」：
          Int4 仓只碰稠密 FFN，这个仓把注意力（99.6%）与草稿块（87.6%）也压到了 FP8。
          attention 报 FP8_E4M3 而 per_subsystem_schemes 列全三档：FP8 的是 48 层线性
          注意力的 in_proj_qkv / in_proj_z / out_proj 与 16 层全注意力的 q/k/v/o
          （208 张，7,214,202,880），BF16 holdout 是 48 层的 conv1d / in_proj_a /
          in_proj_b / dt_bias（192 张，25,561,344），F32 仍是 A_log（48 张，2,304）。
          **holdout 不是推断，是 config 的 modules_to_not_convert 逐条点名的**，
          与清单逐张量对得上。draft 的 BF16 那一截是 mtp.fc（52,428,800）加五个 norm，
          同样在 modules_to_not_convert 里；embed_tokens / lm_head / 整个视觉塔也在那张名单上。
          块由形状量出：down_proj 权重 [5120, 17408] 配 weight_scale_inv [40, 136]，
          5120 / 40 = 17408 / 136 = 128，两维都分块，所以是 [128,128]（不是 Int4 那种单轴 group）。
          落盘 30,866,680,160 B（28.75 GiB），1.800× —— **比 Int4 仓还大 6.31 亿字节**：
          FP8 把 FFN 压到 8 bit 而 Int4 压到 4 bit，这一块的差（8.5 GB）盖过了
          FP8 在注意力上多省的那 7.2 GB。所以「最低位宽」与「最小落盘」在本档同向
          （Int4 仓两项都更低），但**不是同一个判据**，别处可能分叉

