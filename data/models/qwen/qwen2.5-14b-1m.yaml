notes: >-
  稠密支线上的长上下文支线（2025-01），`track: side`。
  收录理由只有一条：上下文长度机制这条轴在整个 Qwen 线只有这一份有东西 ——
  dual chunk attention + 1M 上下文，而且全部在 config 里、权重清单零线索。
  predecessor 取 qwen2-72b（本仓记录的 Qwen2 一代稠密节点），
  厂商自己标的 base_model 是 Qwen/Qwen2.5-14B —— 那一档与 Qwen2 一代同结构、本仓不录，
  所以变化矩阵里 layers / hidden / vocab 这几格的差读作档位，不是代际变化。
  同期还有 Qwen2.5-7B-Instruct-1M（同样的 DCA 配置、更小档位），不另录。

open_questions:
  - >-
    DCA 的实现细节没有读源码：本记录只写 config 声明的三个标量
    （chunk_size / local_size / original_max_position_embeddings），
    「262144 以内按常规、超出后分块 + 块内局部窗口」这个描述是从参数名推的，
    未按实现核
  - >-
    DCA 下缓存条目是否仍 1:1 计费未核。本记录按「不改变条目数」记账
    （即 48 层 × 2048 元素 × 上下文），如果实现对块外的条目做了丢弃或压缩，
    实际占用会低于 184.94 GiB —— 这是上界
  - >-
    KV cache 的实际落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底，
    bytes_basis 是 dtype_fallback
  - >-
    训练精度没有一手来源：config 的 torch_dtype: bfloat16 说的是发布权重，
    模型卡正文未核，故不填 precision.training
  - >-
    params.excludes 取 [embed] 是判断：名字里的 14B 对全量是 +5.50%、
    对扣掉输入词表后是 −0.06%，没有一手说明哪种才是厂商口径

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen2.5-14b-1m 核：config 全部键
    （含 dual_chunk_attention_config 三项与 rope_theta 的代际变化）、
    完整权重清单（579 条目逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData
    （含 base_model）/ sha 与 safetensors tally。
    「权重侧零新增」这一条是把本记录与 facts/qwen2-72b 的张量名族归一层号后比对得到的
    （见 R1），不是只看键名。
    参数五项逐项按形状重算并三方比对；两种声明口径的偏差各自重算（见 R2）。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致。
    **原理上核不了的**：DCA 的实现细节与它是否改变条目计费、KV 落盘精度、训练精度，
    都在 open_questions 里。
review:
  - id: R1
    field: lineage.changed_from_predecessor
    severity: unsupported
    claim: 权重侧零新增，579 个张量的名族与 Qwen2 一代逐个相同
    finding: >-
      把本记录与 facts/qwen2-72b 的张量名归一层号后比族：两边都是 15 个名族
      （embed_tokens / lm_head / 两个 layernorm / mlp 三张 / q·k·v·o 四张 +
      q·k·v 三张 bias / model.norm），集合完全相同，没有任何一方独有的族。
      条目数不同（579 对 963）只是层数差（48 对 80）。
      所以「1M 这件事在权重里看不出来」是比过的，不是推的
    resolution: confirmed
  - id: R2
    field: params.excludes
    severity: missing
    claim: >-
      草稿里 params 只有 total 14e+9，没有 excludes，Gate B 报 +5.50% MISMATCH
    finding: >-
      +5.50% 远超 2% 容差，而扣掉输入词表（778,567,680）后是 **−0.06%** ——
      两种读法的偏差差 90 倍。本档没有草稿块、没有视觉塔可扣，唯一能扣的就是输入词表，
      而它恰好让偏差落到千分之一以内。所以 excludes 取 [embed]，并把这件事
      写成判断（没有一手说明）。
      注意这与 Qwen3.8 两档的 excludes 语义不同：那两档扣草稿块与视觉塔、
      输入词表仍在 total 里。同一个字段在同一家族里有两种口径，必须逐份写明
    resolution: corrected
    changed_to: >-
      补 excludes [embed]（标 judgement）与两种读法的偏差；
      Gate B 的参数总量一项由 MISMATCH 变为 ok（−0.06%）
  - id: R3
    field: context.extension_method
    severity: overreach
    claim: >-
      草稿写「DCA 把注意力拆成块间 + 块内两级，等价于 262144 窗口的滑窗注意力」
    finding: >-
      后半句是编的。config 只给三个标量，本仓没有读 DCA 的实现，
      而「等价于滑窗」会直接改变缓存账 —— 滑窗意味着每序列固定的局部 KV
      （像 DeepSeek V4.1 的 2.77 MiB/序列那样），而本记录按 48 层 × 2048 元素 ×
      上下文全量计费。两种记法差的不是精度而是量级。
      skill 规则 6「二手来源标二手，不急着关」：实现没读就不要替它定缓存模型
    resolution: corrected
    changed_to: >-
      extension_method 只写 config 的三个标量加一句「推理期机制，未读实现」；
      arch.attention.layer_pattern 明写「DCA 不改变哪些层产出 KV、也不减少条目数，
      所以没有每序列固定的分量」；条目计费是否 1:1 留 open question，
      并在 bottleneck 里写明 184.94 GiB 是上界
  - id: R4
    field: bottlenecks
    severity: unsupported
    claim: KV 184.94 GiB 是权重存储 27.51 GiB 的 6.7 倍
    finding: >-
      两个数的口径都写明了：KV 是 dtype 兜底的理论量（98,304 元素/token ×
      1,010,000 × 2 B = 198,574,080,000 B = 184.94 GiB），
      权重存储是清单逐项求和的实测（29,540,067,328 B = 27.51 GiB）。
      比值 6.72。**两侧都是字节且都按 BF16**，所以这个倍数不犯
      「不同 basis 之间算倍数」那条 —— 它比的是同一种精度假设下的两类显存，
      不是跨代比 KV
    resolution: confirmed
  - id: R5
    field: platforms
    severity: imprecise
    claim: >-
      草稿里 status 写 supported
    finding: >-
      transformers 能加载并在 262144 以内正确推理，但 DCA 要引擎自己实现，
      而超出后不实现是**静默算错**不是报错。写 supported 会让平台矩阵显示成
      「这一档不需要额外工作」，而它恰恰是本记录唯一的收录理由
    resolution: corrected
    changed_to: >-
      status 改为 partial 并写 caveat。caveat 本身是判断，但 platforms 是列表、
      evidence 不展开到列表下标（validate.py 的 leaf_paths 把整个列表算一个归属点），
      所以只能整列表挂 official —— 这个粒度缺口记在这里
  - id: R6
    field: hf.sha
    severity: wrong
    claim: >-
      草稿里的 hf.sha 与 hf.last_modified 是按 12 位前缀「补全」的，不是从取数产物读的
    finding: >-
      本轮对全部新记录做了一次机械核对：把每份 YAML 的 hf.sha / hf.last_modified
      与 facts/<id>/repoinfo.json 逐字符比。本记录两项都对不上 ——
      sha 的后 28 位与 lastModified 的时分秒都是写记录时臆造的。
      sha 是整份记录的可复现锚点（sources 的 locator 也引它），
      错了之后「按 pinned sha 复现取数」这件事就断了，而**它不会被任何校验拦住**：
      validate.py 不核对 facts/，derive.py 也不读 hf 块
    resolution: corrected
    changed_to: >-
      两项都改为从 facts/<id>/repoinfo.json 直接读出的值；
      核对脚本已对全部 11 份新记录跑过，现在逐字符一致
