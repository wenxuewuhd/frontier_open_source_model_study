  repo: Qwen/Qwen2.5-14B-Instruct-1M
  sha: 620fad32de7bdd2293b3d99b39eba2fe63e97438
  last_modified: '2025-01-29T12:38:27.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: side
  predecessor: qwen2-72b
  changed_from_predecessor:
    - axis: context
      text: >-
        **这一代唯一的结构性变化，而且完全不在权重里**：config 多出
        dual_chunk_attention_config（chunk_size 262144 / local_size 8192 /
        original_max_position_embeddings 262144），max_position_embeddings
        131072 → **1,010,000**，rope_theta 1e6 → 1e7。
        权重侧零新增：579 个张量的名族与 Qwen2 一代逐个相同
        （q/k/v 带 bias 的 GQA + 稠密 FFN），没有任何多出来的投影、norm 或表
      benefit: >-
        1M 上下文的代价全在缓存上：98,304 元素/token × 1,010,000 = **184.94 GiB**，
        是权重存储 27.51 GiB 的 **6.7 倍** —— 这是本仓记录里第一个「KV 远远压过权重」
        的档位。而引擎侧必须自己实现 DCA（按 chunk 分块 + 块内 local 窗口的两级注意力），
        **权重清单里看不出任何线索**：拿到这份权重照常规 GQA 跑能跑通，
        只是超过 262144 之后位置编码失效。「能加载」不等于「实现对了」
    - axis: attention
      text: >-
        注意力几何相对 Qwen2-72B 只是档位差（40 query 头 / 8 KV 头 / head_dim 128，
        k_proj 与 v_proj 都是 [1024, 5120]），形态仍是 GQA 8 组、仍带 q/k/v bias
      benefit: >-
        KV 宽度与 Qwen2-72B 同为每层 2048 元素，层数 80 → 48，
        所以每 token 98,304 元素（对 163,840）。这一档的 KV 之所以成为瓶颈，
        是上下文从 128K 到 1M（×7.7），不是结构变差

params:
  total: 1.47e+10
  breakdown:
    dense_ffn: 10192200000.0
    attention: 3020240000.0
    embed: 778568000.0
    lm_head: 778568000.0
    norm: 496640.0
  counting_note: >-
    total 取自**模型卡**（「Number of Parameters: 14.7B」），不是模型名里的 14B ——
    两者差 5.5%，而模型卡才是厂商声明（见 R6）。breakdown 是本仓按完整权重清单
    （8 分片 579 条目，全 BF16、无量化 scale、无低位打包）实测的分项，取 6 位有效数字。
    实测全量 14,770,033,664，与 HF 平台自己从分片头统计的 safetensors tally 逐位相同，
    对声明的 14.7B 是 **+0.48%**（声明值取整到一位小数所致），所以**不需要任何 excludes**。
    卡上另有一个口径：「Number of Paramaters (Non-Embedding): 13.1B」——
    实测 total 减**两份**词表（输入 778,567,680 + lm_head 778,567,680）是
    13,212,898,304（+0.86%），只减一份是 13,991,465,984（+6.8%、对不上）。
    所以 **Qwen 的「Non-Embedding」把输入词表和输出头都扣掉了**，
    与本仓的「带宽口径」（含 lm_head，因为它每步对全词表做 GEMM）不是同一个量 ——
    三个数都在本记录里，引用时要看清是哪一个。
    词表与输出层不共享权重（各 778,567,680，tie_word_embeddings: false），
    lm_head 仍在 total 里（它每步对全词表做 GEMM，和只 gather 一行的输入词表不是一回事）。
    权重存储 27.51 GiB。激活参数两个口径：带宽口径 13,991,465,984
    （不含只 gather 一行的输入词表）、可比官方口径 14,770,033,664
    （含输入词表，稠密模型下恰等于声明的全量）。

context:
  max: 1010000
  train_native: 262144
  extension_method: >-
    dual chunk attention（config 的 dual_chunk_attention_config）：
    chunk_size 262144、local_size 8192、original_max_position_embeddings 262144。
    即 262144 以内按常规注意力，超出后按 262144 的块切分 + 块内 8192 的局部窗口
    重排位置关系。rope_theta 同时从 1e6 提到 1e7。
    **这是推理期机制，不是权重结构** —— 本仓只记 config 声明的三个参数，
    没有读实现，所以「两级注意力」这个说法的细节未核。
    技术报告的 Abstract 把长上下文说成一组推理期方法（length extrapolation +
    sparse attention + chunked prefill + sparsity refinement），
    **其中 dual chunk attention 这个名字没出现**，也没有给任何缓存容量数；
    唯一的量化声明是「3x to 7x prefill speedup」（1M 上下文，未给硬件与引擎）

arch:
  layers: 48
  hidden: 5120
  vocab: 152064
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: SwiGLU
  position: RoPE theta 1e7，作用在全部 head_dim 维（config 无 partial_rotary_factor）

  attention:
    type: GQA
    num_heads: 40
    num_kv_heads: 8
    head_dim: 128
    head_dim_note: >-
      head_dim 不是这一代的 config 字段，128 = hidden 5120 / num_attention_heads 40，
      由清单印证：q_proj 与 o_proj 是 [5120, 5120]，k_proj 与 v_proj 是 [1024, 5120]
      —— 1024 = num_key_value_heads 8 × 128。缓存宽度按后者的输出维算
      （每层 2 × 1024 = 2048 元素）。q/k/v 带 bias（q [5120]、k 与 v 各 [1024]）
    layer_pattern: >-
      48 层同构，每层产出自己的 KV。**DCA 不改变哪些层产出 KV，也不减少条目数** ——
      它改的是注意力怎么读这些条目（分块 + 块内局部窗口），
      所以缓存账仍按 48 层 × 2048 元素 × 上下文长度算，没有滑窗那种
      「每序列固定」的分量。config 的 sliding_window 1010000 配
      use_sliding_window: false，是惰性字段

  ffn:
    type: dense
    intermediate: 13824

precision:
  weights_release: [BF16]
  weights_release_scope:
    BF16: { measured: true }
  quantization:
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（8 分片 579 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空，579 条全是 BF16。这一代没有 quantization_config

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: partial
    precision: BF16
    caveat: >-
      transformers 能按常规 Qwen2 加载并在 262144 以内正确推理，
      但 dual chunk attention 需要引擎自己实现；超出 original_max_position_embeddings
      之后不实现 DCA 会静默算错位置关系，而不是报错
    ref:
      kind: modelcard
      url: https://huggingface.co/Qwen/Qwen2.5-14B-Instruct-1M
    visibility: public

bottlenecks:
  - dimension: long-context
    finding: >-
      1M 上下文把显存结构整个翻过来：KV 184.94 GiB 对权重存储 27.51 GiB，
      **KV 是权重的 6.7 倍**。本仓此前记录的所有档位都是权重主导
      （Qwen2-72B 在 128K 满上下文时 KV 只占权重的 30%）。
      这一档的部署形态因此完全不同：单卡放得下权重却放不下缓存，
      分页、卸载与跨卡切分缓存都成为前提而不是优化。
    quantified: >-
      2048 元素/层/token × 48 层 = 98,304 元素/token；按 config 的
      torch_dtype=bfloat16 兜底（2 B/元素）得 196,608 B/token，
      1,010,000 满上下文 184.94 GiB —— dtype_fallback 口径。
      权重存储 27.51 GiB
    visibility: public
  - dimension: operator-gap
    finding: >-
      DCA 是纯推理期机制：权重清单里没有任何对应张量，config 里只有三个标量。
      引擎要支持的是「按 262144 分块 + 块内 8192 局部窗口」的位置重排与注意力分解，
      这件事在适配清单上极易漏掉 —— 因为模型「能加载、能跑、短上下文结果也对」。
    fix: >-
      适配流程里把 config 的非标准键（这里是 dual_chunk_attention_config）
      单独列成一项检查，不要只比张量名集合
    visibility: public

infra_signals:
  - text: >-
      上下文长度机制这条轴在 Qwen 线只有这一份记录，而它的全部内容都在 config 里，
      权重清单零线索。本仓一贯的判据「先比张量名集合，相同就不必重走算子评估」
      在这一类改动上不成立 —— 张量名集合与 Qwen2 一代逐个相同，
      要做的工作却是实现一套新的注意力分解。**config 的非标准键要单独过一遍。**
    evidence: judgement
    horizon: settled
    axis: context
  - text: >-
      1M 上下文下 KV 是权重的 6.7 倍，这个比例决定了后面几代的方向：
      Qwen3-Next 起用 3:1 混合线性注意力把「累积 KV 的层数」压到 1/4，
      走的是减少缓存条目而不是延长常规注意力。
      两条路线的区别在容量模型上是定性的：DCA 不改变缓存条目数，混合结构改变。
    evidence: judgement
    horizon: settled
    axis: attention

