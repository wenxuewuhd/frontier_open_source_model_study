# 机械字段来自 config（official）；形状、参数量与子系统拆分来自完整权重清单
# （8 分片 579 条目，无读失败分片，全 BF16）。
# 本记录的收录理由全部在 config 一侧：权重结构与 Qwen2 一代逐条同形，
# 变化是 dual chunk attention 与 1M 上下文（见 lineage.context）。
id: qwen2.5-14b-1m
family: qwen
kind: llm
display_name: Qwen2.5-14B-Instruct-1M
released: '2025-01-23'
license: apache-2.0
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen2.5-14B-Instruct-1M
    locator: config.json @ 620fad32de7b
    accessed: '2026-10-30'
    note: >-
      许可取自 HF tags license:apache-2.0 与 cardData license: apache-2.0。
      cardData 的 base_model 是 Qwen/Qwen2.5-14B（那一档本仓不录，结构与 Qwen2 一代同类）。
      BF16 发布，8 分片 579 个张量，逐分片读头取全，failed_shards 为空。
      dual_chunk_attention_config 是这一代独有的键：chunk_size 262144、
      local_size 8192、original_max_position_embeddings 262144

  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen2.5-14B-Instruct-1M/blob/620fad32de7bdd2293b3d99b39eba2fe63e97438/README.md
    locator: 'README.md @ 620fad32de7b · 规格清单 / Processing Ultra-Long Texts'
    accessed: '2026-10-30'
    note: >-
      按本仓「来源优先级：模型卡 / 技术报告 > 厂商参考实现 > 引擎实现」补的一手来源，
      它改掉了本记录的参数量口径（见 R6）。卡上的声明值：
      「Architecture: transformers with **RoPE, SwiGLU, RMSNorm, and Attention QKV bias**」、
      「Number of Parameters: **14.7B**」、「Number of Paramaters (Non-Embedding): **13.1B**」、
      「Number of Layers: 48」、「Number of Attention Heads (GQA): 40 for Q and 8 for KV」、
      「Context Length: **Full 1,010,000 tokens** and generation 8192 tokens」。
      卡另建议用厂商自带的 vLLM 分支（「introduces sparse attention and length
      extrapolation methods」）—— 那是**引擎实现**，按来源优先级是最低一档，
      本记录只记它存在、不拿它定任何数。**卡里没有训练精度声明**

  - kind: paper
    url: https://arxiv.org/abs/2501.15383
    locator: arXiv:2501.15383（Qwen2.5-1M 技术报告）· Abstract
    accessed: '2026-10-30'
    note: >-
      模型卡指向的技术报告，按本仓来源优先级与模型卡同为第一档。本轮只读了 Abstract，
      为的是回答一个问题：**厂商有没有公布每 token 的缓存字节或缓存容量数** ——
      **没有**（Abstract 里没有任何 KV cache 大小、每 token 显存或缓存压缩倍数的说法）。
      所以本记录的 184.94 GiB 仍是本仓自己按元素 × 兜底精度算的上界，缓存侧没有外部锚。
      Abstract 把长上下文说成**一组推理期方法**：「a length extrapolation method」、
      「a sparse attention method」（原话「To reduce inference costs, we implement a
      sparse attention method」）、「chunked prefill optimization」与
      「a sparsity refinement method to improve precision」——
      **dual chunk attention 这个名字没有在 Abstract 里出现**（它只在 config 的键名里）。
      唯一的量化声明是速度：「achieve a remarkable **3x to 7x prefill speedup** in
      scenarios with 1 million tokens of context」，未给硬件与引擎，本仓不填进 performance。
      正文（含 DCA 的条目计费）本轮没读

