  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen3.8-27B
    locator: config.json @ 1d4bf0f2ff60
    accessed: 2026-10-28
    note: >-
      许可取自 HF tags license:apache-2.0 与 cardData license: apache-2.0。
      同代旗舰是 license:other（qwen3.8-max），两档许可不同

hf:
  repo: Qwen/Qwen3.8-27B
  pipeline_tag: image-text-to-text
  gated: false

lineage:
  track: side
  predecessor: qwen3.8-2.4t-a95b
  changed_from_predecessor:
    - axis: moe
      text: >-
        FFN 由 MoE 换成 dense：主干 64 层与草稿块都是 gate_proj / up_proj / down_proj 三个独立
        2 维投影（中间维 17408）。旗舰独有的 14 个张量名族 —— 堆叠的 experts.gate_up_proj
        [512, 4096, 8192] 与 experts.down_proj、router mlp.gate、shared_expert.* 与
        shared_expert_gate（主干与草稿块各一套）—— 这里一个都没有
      benefit: >-
        差的是机制不是规格：dense GEMM 对三维堆叠 grouped GEMM + router + 共享专家，
        算子集合不同，不是同一套算子换形状。这是收录这一档的主要理由，也是它和本仓删掉的
        五份 DeepSeek 刷新（config 逐字段相同、张量名集合相同）不是一类的原因
    - axis: modality
      text: >-
        多一整条视觉前端：visual.* 共 21 个张量名族 —— 27 个 ViT 块（qkv / proj / 两层非门控 MLP /
        两个带 bias 的 norm）、patch_embed（[1152, 3, 2, 16, 16]，3D 卷积）、pos_embed 与 merger，合计 460,730,096 参数。
        merger 把 2×2 个 patch 拼成 4608（= 1152 × 4）再投到主干 hidden 5120
      benefit: >-
        旗舰是纯文本，视觉塔的算子（带 bias 的 LayerNorm、GELU、3D patch 卷积、patch merge）
        在这一档才出现
    - axis: attention
      text: >-
        位置编码换成 interleaved mRoPE（mrope_section [11, 11, 10]，旗舰是普通 RoPE）。
        注意力与线性注意力的张量名族与旗舰完全相同（归一前缀后两档共有 32 族），只换形状：
        full 层 24 头（旗舰 64），线性层 value 头 48（旗舰 128），key:value 头数比 1:3 对 1:8
      benefit: >-
        注意力侧除 mRoPE 外不带来新算子。它在缓存账上的用处是给了第二个 key:value 比：
        「conv1d 通道数 = in_proj_qkv 输出维」在 1:8 与 1:3 两档同时成立，才能当规律用（R1）

params:
  total: 27.0e+9
  excludes: [vision, draft]
  breakdown:
    dense_ffn: 17112800000.0
    attention: 7239770000.0
    embed: 1271400000.0
    lm_head: 1271400000.0
    vision: 460730000.0
    draft: 424699000.0
    norm: 674816.0
  counting_note: >-
    total 取自模型名（27B），属厂商声明；breakdown 是本仓按完整权重清单（18 分片 1199 张量，
    全 BF16、无量化 scale）实测的分项，取 6 位有效数字。实测全量 27,781,427,952，与 HF 的
    safetensors tally 逐位相同，含视觉塔（460,730,096）与 1 个草稿块（424,699,392）。
    名字不按全量算：全量对 27B 是 +2.89%，取整是 28B，也超出 Gate B 的 2% 容差。
    扣哪几项是判断 —— 只扣视觉 27.32B（+1.19%）、只扣草稿 27.36B（+1.32%）取整也都是 27B；
    excludes 取两者都扣，即语言主干 26,895,998,464（−0.39%），偏差最小，也和「名字指语言模型」
    的读法一致。原来不填声明值，Gate B 的参数总量一项 skip，「名字不按全量算」这件事就一直看不见。
    权重存储 51.75 GiB。激活参数两个口径：带宽口径 25.6B、可比官方口径 26.9B（含输入词表）——
    dense 模型的可比官方口径恰等于语言主干总量。

context:
  max: 262144

arch:
  layers: 64
  hidden: 5120
  vocab: 248320
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU
  position: >-
    interleaved mRoPE，theta 1e7，partial_rotary_factor 0.25（只对 1/4 维度加 rope）：
    256 × 0.25 = 64 维即 32 个频率对，mrope_section [11, 11, 10] 正好分完 32 对

  attention:
    type: hybrid
    num_heads: 24
    num_kv_heads: 4
    head_dim: 256
    head_dim_note: >-
      full attention 层的 q_proj 是 [12288, 5120]，12288 = 2 × 24 头 × 256 —— 输出维翻倍，
      一半是 query、一半是输出门（config 的 attn_output_gate: true）。o_proj 入口
      6144 = 24 × 256 只对应 query 那一半。按 num_heads × head_dim 推 q_proj 会低一半。
      线性层的输出门是另一个张量 in_proj_z [6144, 5120]（= 48 value 头 × 128），不在 q 里
    partial_rotary_factor: 0.25
    layer_pattern: 3:1 linear:full，每 4 层一个 full attention
    hybrid:
      layer_types_count:
        linear: 48
        full: 16
      interval: 4
      note: >-
        这是本记录的关键结构。16 层 full attention 的 KV 随上下文线性增长，
        48 层线性注意力只带每序列固定的递归状态。两者增长方式不同，
        容量规划必须分开算。以上层数都是主干口径（64 主干层 + 1 草稿块）：
        草稿块 mtp.layers.0 带一套与主干 full attention 同名的 q/k/v/o 投影、没有 linear_attn，
        所以开草稿侧时累积 KV 的是 17 层、65536 → 69632 B/token，线性状态仍是 48 层。
        本记录与 data/derived/ 都按主干口径记账。
    output_gate:
      enabled: true
      type: swish
    linear_state:
      mechanism: 门控线性注意力 + 短卷积
      num_key_heads: 16
      num_value_heads: 48
      key_head_dim: 128
      value_head_dim: 128
      conv_kernel_dim: 4
      state_dtype: FP32
      state_layout_note: >-
        config 只给出头数与头维，不给矩阵状态的布局 —— 但这句只管矩阵状态一项，
        其余因子都在权重清单里：每层 linear_attn.A_log [48] 与 dt_bias [48]，衰减参数每状态头
        一个，故状态头数为 48（即 value 头数）；in_proj_qkv [10240, 5120] = q 16×128 + k 16×128
        + v 48×128；48/48 层 conv1d.weight 都是 [10240, 1, 4]，首维恒等于 in_proj_qkv 的输出维
        （短卷积是 depthwise、作用在整条 qkv 流上），每层 conv 状态 = 4 × 10240 × 4 B（FP32），
        窗长按全窗计是上界。推导脚本按 [num_value_heads, key_head_dim, value_head_dim] 估矩阵状态，
        key_head_dim 与 value_head_dim 都是 128，维序不影响容量；要按实现核的是实际存储
        是否就是这一个张量。

  ffn:
    type: dense
    intermediate: 17408

  decoding:
    mtp_layers: 1

  vision:
    encoder: Qwen3.8 vision tower
    layers: 27
    hidden: 1152
    num_heads: 16
    patch_size: 16
    spatial_merge_size: 2
    temporal_patch_size: 2
    out_hidden: 5120
    fusion: patch merge 后投影到主干 hidden

precision:
  weights_release: [BF16]

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    ref:
      kind: modelcard
      url: https://huggingface.co/Qwen/Qwen3.8-27B
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      混合结构把长上下文的 KV 压力大幅转移：只有 1/4 的层累积 KV cache，
      其余层的状态与上下文长度无关。代价是引擎要同时管理两种生命周期不同的
      显存对象，而且线性层的状态无法像 KV 那样按 block 分页复用。
    quantified: >-
      16 层累积 KV、48 层带固定状态（主干口径，64 主干层 + 1 草稿块；开草稿侧累积 KV 为 17 层）
    visibility: public
  - dimension: operator-gap
    finding: >-
      线性注意力层需要递归状态更新与短卷积，和 full attention 完全不同的算子。
      一个模型内两套注意力路径都要支持，且要按层交替调度。
    visibility: public
  - dimension: compute
    finding: >-
      dense FFN 意味着每 token 都要搬运全部 FFN 权重，没有 MoE 的稀疏激活优势。
      同参数规模下 decode 的权重带宽需求高于 MoE 模型。
    visibility: public

infra_signals:
  - text: >-
      混合线性注意力让「KV 容量 = 层数 × 每层 KV × 上下文」这个模型彻底失效：
      一部分显存随上下文增长，一部分是每序列常量。容量规划、分页管理和调度
      都要按两类对象分别建模。
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      线性注意力的递归状态每序列固定，所以长上下文下它便宜、大批量下它贵，
      与 KV cache 的代价结构正好相反。batch 与 context 的权衡点变了，
      需要重新测吞吐曲线而不能沿用纯注意力模型的经验。
    evidence: judgement
    horizon: next-gen
    axis: attention
  - text: >-
      同一模型内两套注意力路径按层交替，要求引擎支持异构层调度。
      这是比单一新算子更深的改动，影响图捕获与内存池的组织方式。
    evidence: judgement
    horizon: now
    axis: attention

