    locator: 'README.md @ 1d4bf0f2ff60 · Model Overview'
    accessed: '2026-10-30'
    note: >-
      P1 历史回溯时按本仓「来源优先级：模型卡 / 技术报告 > 厂商参考实现 > 引擎实现」
      补的一手来源（本记录原先只有 config.json，见 R13）。Model Overview 的声明值
      （**全部嵌在「Language Model」一级下**，与并列的 Vision Encoder 分开）：
      「Number of Parameters: **27B**」、「Hidden Dimension: 5120」、
      「Token Embedding: **248,320 (Padded)**」、「Number of Layers: 64」、
      「Hidden Layout: **16 × (3 × (Gated DeltaNet → FFN) → 1 × (Gated Attention → FFN))**」、
      「**Gated DeltaNet**: 48 for V and 16 for QK, Head Dimension 128」、
      「**Gated Attention**: 24 for Q and 4 for KV, Head Dimension 256,
      **Rotary Position Embedding Dimension: 64**」、
      「Feed Forward Network: Intermediate Dimension 17,408」、
      「MTP (Multi-Token Prediction): trained with multiple steps」、
      「Context Length: **262,144 natively and extensible up to 1,000,000 tokens**」。
      **卡里没有训练精度声明，也没有每 token 缓存字节数**

hf:
  repo: Qwen/Qwen3.8-27B
  pipeline_tag: image-text-to-text
  gated: false

lineage:
  track: side
  predecessor: qwen3.5-27b
  # 本轮（P1 通义千问历史回溯）把 predecessor 从同代旗舰改成同档位的前代 ——
  # 稠密 FFN 这一支与 MoE 旗舰那一支是两条链，按时间或按旗舰串会把两条混成一条假链
  # （见 R12）。与旗舰的差异（dense vs MoE、视觉前端、mRoPE）仍是本档的收录理由，
  # 已改写进 notes。
  changed_from_predecessor:
    - axis: precision
      text: >-
        **这是本档相对前代唯一的权重侧变化**：48 层的 linear_attn.A_log [48]
        与 linear_attn.norm.weight [128] 由 **F32 回到 BF16**（共 96 个张量、
        8448 个元素），dt_bias 两代都是 BF16。
        前代 qwen3.5-27b 的清单是 1103 条 BF16 + 96 条 F32，本档 1199 条全是 BF16；
        **张量名、形状与条目数逐条相同**，参数量也逐位相同（27,781,427,952）。
        这一步发生在中间的 **Qwen3.6-27B**：它与本档的 1199 条清单逐条
        shape + dtype 全同、config 只差 transformers_version，
        所以 Qwen3.6-27B 不单独立记录
      benefit: >-
        线性注意力的递归核不再是混合精度（前代是 F32 衰减参数 + F32 输出 norm
        配 BF16 激活）。**只有 dtype 看得见** —— 按前代写的核在本档上会读错，
        反之亦然。权重存储也差 16,896 B（8448 个元素各少 2 字节），
        两档的 GiB 数在两位小数上相同（51.75 GiB）
    - axis: training
      text: >-
        config 侧的差异全部是「把已有的东西显式声明出来」：新增
        output_gate_type: swish（门本来就在 q_proj 的后一半里）、
        partial_rotary_factor 提到 text_config 顶层、bos_token_id / pad_token_id /
        tie_word_embeddings 补齐、language_model_only: false，
        去掉 mlp_only_layers: []。**没有一项改变结构**
      benefit: >-
        能力变化来自训练与后训练，算子侧零工作量 —— 已经支持前代的平台，
        支持本档不需要任何算子改动。和 README 里 DeepSeek R1 对 V3 那条同类。
        跟踪时先比张量名集合与逐条 shape/dtype，相同就不必重走算子评估
params:
  total: 27.0e+9
  excludes: [vision, draft]
  breakdown:
    dense_ffn: 17112800000.0
    attention: 7239770000.0
    embed: 1271400000.0
    lm_head: 1271400000.0
    vision: 460730000.0
    draft: 424699000.0
    norm: 674816.0
  counting_note: >-
    total 取自模型名（27B），属厂商声明；breakdown 是本仓按完整权重清单（18 分片 1199 张量，
    全 BF16、无量化 scale）实测的分项，取 6 位有效数字。实测全量 27,781,427,952，与 HF 的
    safetensors tally 逐位相同，含视觉塔（460,730,096）与 1 个草稿块（424,699,392）。
    名字不按全量算：全量对 27B 是 +2.89%，取整是 28B，也超出 Gate B 的 2% 容差。
    扣哪几项是判断 —— 只扣视觉 27.32B（+1.19%）、只扣草稿 27.36B（+1.32%）取整也都是 27B；
    excludes 取两者都扣，即语言主干 26,895,998,464（−0.39%），偏差最小，也和「名字指语言模型」
    的读法一致 —— **模型卡给了这个读法一条旁证**：27B 这个数嵌在「Language Model」一级下、
    与并列的「Vision Encoder」分开，所以扣掉视觉塔是厂商自己的分法；
    MTP 那一行也在 Language Model 下，所以扣草稿块仍是本仓的判断。原来不填声明值，Gate B 的参数总量一项 skip，「名字不按全量算」这件事就一直看不见。
    权重存储 51.75 GiB。激活参数两个口径：带宽口径 25.6B、可比官方口径 26.9B（含输入词表）——
    dense 模型的可比官方口径恰等于语言主干总量。

context:
  max: 262144
  train_native: 262144
  extension_method: >-
    模型卡写「262,144 natively and extensible up to 1,000,000 tokens」
    （注意是 1,000,000；同代旗舰与 Qwen3.5 两档写的是 1,010,000），
    没有说用什么方法扩。按 1,000,000 部署时本记录的 per_token 数要乘 3.81
    （16.00 GiB → 61.04 GiB），每序列状态不变

arch:
  layers: 64
  hidden: 5120
  vocab: 248320
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU
  position: >-
    interleaved mRoPE，theta 1e7，partial_rotary_factor 0.25（只对 1/4 维度加 rope）：
    256 × 0.25 = 64 维即 32 个频率对，mrope_section [11, 11, 10] 正好分完 32 对

  attention:
    type: hybrid
    num_heads: 24
    num_kv_heads: 4
    head_dim: 256
    head_dim_note: >-
      full attention 层的 q_proj 是 [12288, 5120]，12288 = 2 × 24 头 × 256 —— 输出维翻倍，
      一半是 query、一半是输出门（config 的 attn_output_gate: true）。o_proj 入口
      6144 = 24 × 256 只对应 query 那一半。按 num_heads × head_dim 推 q_proj 会低一半。
      线性层的输出门是另一个张量 in_proj_z [6144, 5120]（= 48 value 头 × 128），不在 q 里
    partial_rotary_factor: 0.25
    layer_pattern: 3:1 linear:full，每 4 层一个 full attention
    hybrid:
      layer_types_count:
        linear: 48
        full: 16
      interval: 4
      note: >-
        这是本记录的关键结构。16 层 full attention 的 KV 随上下文线性增长，
        48 层线性注意力只带每序列固定的递归状态。两者增长方式不同，
        容量规划必须分开算。以上层数都是主干口径（64 主干层 + 1 草稿块）：
        草稿块 mtp.layers.0 带一套与主干 full attention 同名的 q/k/v/o 投影、没有 linear_attn，
        所以开草稿侧时累积 KV 的是 17 层、65536 → 69632 B/token，线性状态仍是 48 层。
        本记录与 data/derived/ 都按主干口径记账。
    output_gate:
      enabled: true
      type: swish
    linear_state:
      mechanism: >-
        **Gated DeltaNet**（厂商名，模型卡 Model Overview）：门控线性注意力 + 短卷积。
        卡把这一支的头数写成「48 for V and 16 for QK」，与 config 一致
      num_key_heads: 16
      num_value_heads: 48
      key_head_dim: 128
      value_head_dim: 128
      conv_kernel_dim: 4
      state_dtype: FP32
      state_layout_note: >-
        config 只给出头数与头维，不给矩阵状态的布局 —— 但这句只管矩阵状态一项，
        其余因子都在权重清单里：每层 linear_attn.A_log [48] 与 dt_bias [48]，衰减参数每状态头
        一个，故状态头数为 48（即 value 头数）；in_proj_qkv [10240, 5120] = q 16×128 + k 16×128
        + v 48×128；48/48 层 conv1d.weight 都是 [10240, 1, 4]，首维恒等于 in_proj_qkv 的输出维
        （短卷积是 depthwise、作用在整条 qkv 流上），每层 conv 状态 = 4 × 10240 × 4 B（FP32），
        窗长按全窗计是上界。推导脚本按 [num_value_heads, key_head_dim, value_head_dim] 估矩阵状态，
        key_head_dim 与 value_head_dim 都是 128，维序不影响容量；要按实现核的是实际存储
        是否就是这一个张量。

  ffn:
    type: dense
    intermediate: 17408

  decoding:
    mtp_layers: 1

  vision:
    encoder: Qwen3.8 vision tower
    layers: 27
    hidden: 1152
    num_heads: 16
    patch_size: 16
    spatial_merge_size: 2
    temporal_patch_size: 2
    out_hidden: 5120
    intermediate: 4304
    params: 460730096.0
    fusion: >-
      patch merge 后投影到主干 hidden：merger.linear_fc1 [4608, 4608]
      （4608 = 1152 × 4，即 2×2 个 patch 拼接）→ linear_fc2 [5120, 4608]，
      两层都带 bias，入口另有 merger.norm [1152]。
      deepstack_visual_indexes 是空列表，所以没有多层注入，只在输入侧并入。
      **这座塔与 qwen3.5-27b 的 333 个张量逐名、逐形状、逐 dtype 完全相同**
      （本轮按 shapes.json 比过，0 处差异），与 qwen3.5-397b-a17b /
      qwen3.8-flash-next 则只差 merger.linear_fc2 一项（出口宽度）
    tokens:
      reference_resolution: 672x672
      patch_grid: 42x42
      encoder_tokens: 1764
      llm_tokens: 441
      compression_ratio: 4
      compression_stage: >-
        merger 入口一步到位：2×2 相邻 patch 在通道维拼接（linear_fc1 的输入维
        4608 = 1152 × 4 就是这个拼接），**压缩在 projector 之前**，
        所以两层 merger 的 GEMM 只跑 441 次而不是 1764 次
      dynamic_resolution: true
      derivation: >-
        因子与 qwen3.5-27b 逐项相同，因为塔完全相同：
        patch 16（config.vision_config.patch_size，并由
        model.visual.patch_embed.proj.weight [1152, 3, 2, 16, 16] 的后两维印证）、
        2×2 空间合并（config 的 spatial_merge_size 2，由 merger.linear_fc1
        输入维 4608 = 1152 × 4 印证）、时间维 1（patch_embed 是 Conv3d、
        时间核 2，单张静态图补成 2 帧才喂得进去，所以一张图 1 个时间 patch）。
        672 / 16 = 42，42² = 1764；42 / 2 = 21，21² = 441。
        672×672 是本仓为跨模型比较选的参考分辨率，不是厂商默认值
      scope_note: >-
        只覆盖单张静态图。视频每 2 帧并成 1 个时间 patch，
        所以 t 帧的 encoder token 数是 1764 × ⌈t/2⌉ ——
        帧数会真的进主干 token 预算
    prefill:
      encoder_linear_gflops: 1456.5
      projector_linear_gflops: 39.54
      backbone_token_budget: 441
      backbone_linear_gflops_per_token: 48.71
      image_as_text_tokens: 472
      attention_excluded: >-
        被排除的是 encoder 自注意力的 QK^T 与 AV，形式
        4 × n² × hidden × layers。跨度定不下来：vision_config 里没有
        window_size、也没有 fullatt_block_indexes（前代 Qwen2.5-VL 有），
        参考实现本轮没读。按整图一段取 n = 1764 约 387 GFLOPs，
        是线性项的 1/4 —— 但那是假设了跨度之后的数，不写进上面任何一格
      derivation: >-
        encoder 线性项 = 2 × 1764 × (patch_embed 1,769,472 + 27 层 ×
        每层 15,224,832 = 411,070,464) = 1,456,499,294,208。
        每层 15,224,832 = qkv 3 × 1152² + o 1152² + fc1 4304 × 1152 +
        fc2 1152 × 4304，与清单里 108 个 blocks 线性张量的求和逐位相同。
        projector 线性项 = 2 × 441 × (4608² + 5120 × 4608) = 39,537,082,368。
        主干分母 = 2 × (active_params.total 25,624,600,064 −
        active_params.lm_head 1,271,398,400) = 48,706,403,328；
        **不能用 derived 里的 flops.linear_per_token 51,249,200,128**，
        那一项含 lm_head，是 decode 口径。
        换算 = 441 + 1,496,036,376,576 / 48,706,403,328 = 441 + 30.7 = 472。
        这三个数与 qwen3.5-27b 完全相同 —— 塔相同，且两档的
        active_params.total 与 lm_head 也逐位相同（两份清单只差 dtype）
    separability:
      weight_prefix: >-
        model.visual.（333 个张量，含 merger）；主干在 model.language_model.
        与 mtp. / lm_head.。两个前缀不相交
      shard_isolation: mixed
      shard_note: >-
        实测 index 的 weight_map：333 个 model.visual. 张量全部落在
        **第 1 个分片** model-00001-of-00018，同片另有 59 个非视觉张量
        （model.language_model.layers.0 的 linear_attn 与 norm、
        以及 hyper_connection 一类）。没有纯视觉分片，但同片的非视觉张量
        只有 59 个 —— 比 qwen3.5-27b（视觉在最后一片、同片 503 个非视觉张量）
        离「单文件装下一座塔」近得多，**这是同代四档里分片布局唯一的差别**
      cross_prefix_sharing: >-
        weight_map 的名字里没有任何一个同时匹配 model.visual. 与主干前缀，
        即没有重名共享。落盘层面的 tied weights 要看 safetensors 头的
        数据偏移是否重合，weight_map 答不了，本轮没读偏移

precision:
  weights_release: [BF16, FP8_E4M3]
  weights_release_scope:
    BF16: { manifest_taken: true, in_precision_table: true }
    FP8_E4M3:
      manifest_taken: true
      in_precision_table: true
      repo: Qwen/Qwen3.8-27B-FP8
      note: >-
        厂商另发的官方量化仓，本轮取了完整清单，逐子系统实测落在 quantization.official_variants 里 —— 精度表的第二个来源。**主仓的
        per_subsystem 不受影响**：那个字段是 derive.py 识别打包用的承重件，口径只能是 hf.repo 那一份权重
  quantization:
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      vision: BF16
      draft: BF16
    subsystem_method: >-
      来自完整权重清单（18 分片 1199 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      from_shapes.complete 为 true，**1199 条的 dtype 集合就是 {BF16} 一个值**，
      scale_elements 为 0、清单里没有任何含 scale 的叶名。
      所以七个子系统全是 BF16 是全量结论，不是代表值。
      config 没有 quantization_config，不存在量化块与 scale 容器。
      **判主体按张量参数量、不按名字**：各子系统里最大的那个张量分别是
      dense_ffn 的 down_proj（89,128,960）、attention 的 q_proj（62,914,560）、
      embed 与 lm_head（各 1,271,398,400）、vision 的 merger.linear_fc2（23,592,960）、
      draft 的 mtp down_proj（89,128,960）、norm 的 input_layernorm（5,120），
      全部 BF16；按 dtype 的参数量占比看七个桶都是 BF16 100.0%。
      本代单一 dtype，所以不存在「挑中一个 [64] 的小向量把子系统精度报错」那类风险，
      但统计口径仍按参数量加权做的。
      **空着和「全是 BF16」在页面上渲染成同一个 `—`**，而「这一代未量化」
      对 infra 是个结论、不是空白 —— 这是补这一格的理由

    official_variants:
      - dtype: FP8_E4M3
        repo: Qwen/Qwen3.8-27B-FP8
        rev: 017b9c7af6b5
        origin: post_quantized
        tensor_count: 1606
        params_total: 27781427952
        weight_bytes_total: 30866663264
        per_subsystem:
          attention: FP8_E4M3
          dense_ffn: FP8_E4M3
          embed: BF16
          lm_head: BF16
          norm: BF16
          draft: FP8_E4M3
          vision: BF16
        per_subsystem_block:
          attention: '[128,128]'
          dense_ffn: '[128,128]'
          draft: '[128,128]'
        per_subsystem_strategy:
          attention: block
          dense_ffn: block
          draft: block
        per_subsystem_scale:
          attention: BF16
          dense_ffn: BF16
          draft: BF16
        per_subsystem_schemes:
          attention:
            - { dtype: FP8_E4M3, block: '[128,128]', scale_dtype: BF16, tensors: 208, elements: 7214202880 }
            - { dtype: BF16, tensors: 240, elements: 25563648 }
          draft:
            - { dtype: FP8_E4M3, block: '[128,128]', scale_dtype: BF16, tensors: 7, elements: 372244480 }
            - { dtype: BF16, tensors: 8, elements: 52454912 }
        method: >-
          完整清单逐项统计（66 分片 1,606 条目，failed_shards 为空），非抽样。 **逐子系统参数量与主仓逐位相同，7 桶零例外**，合计同为
          27,781,427,952 —— 这是「同一份权重的两种存法」的硬证据，也是把 origin 判成 post_quantized 的判据之一。 FP8_E4M3
          覆盖注意力（7,214,202,880）、稠密 FFN（17,112,760,320）、草稿 / MTP（372,244,480），占参数量
          88.9%；其余桶原样留在高精度上。 块与 scale 由形状量出、不抄 config：注意力 [128,128]、稠密 FFN [128,128]、草稿 /
          MTP [128,128]。 config 的 modules_to_not_convert 点名了 882 条不量化的模块，与清单逐张量对得上。 落盘
          30,866,663,264 B（28.75 GiB）。
platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    ref:
      kind: modelcard
      url: https://huggingface.co/Qwen/Qwen3.8-27B
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      混合结构把长上下文的 KV 压力大幅转移：只有 1/4 的层累积 KV cache，
      其余层的状态与上下文长度无关。代价是引擎要同时管理两种生命周期不同的
      显存对象，而且线性层的状态无法像 KV 那样按 block 分页复用。
    quantified: >-
      16 层累积 KV、48 层带固定状态（主干口径，64 主干层 + 1 草稿块；开草稿侧累积 KV 为 17 层）
    visibility: public
  - dimension: operator-gap
    finding: >-
      线性注意力层需要递归状态更新与短卷积，和 full attention 完全不同的算子。
      一个模型内两套注意力路径都要支持，且要按层交替调度。
    visibility: public
  - dimension: compute
    finding: >-
      dense FFN 意味着每 token 都要搬运全部 FFN 权重，没有 MoE 的稀疏激活优势。
      同参数规模下 decode 的权重带宽需求高于 MoE 模型。
    visibility: public

infra_signals:
  - text: >-
      混合线性注意力让「KV 容量 = 层数 × 每层 KV × 上下文」这个模型彻底失效：
      一部分显存随上下文增长，一部分是每序列常量。容量规划、分页管理和调度
      都要按两类对象分别建模。
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      线性注意力的递归状态每序列固定，所以长上下文下它便宜、大批量下它贵，
      与 KV cache 的代价结构正好相反。batch 与 context 的权衡点变了，
      需要重新测吞吐曲线而不能沿用纯注意力模型的经验。
    evidence: judgement
    horizon: next-gen
    axis: attention
  - text: >-
      同一模型内两套注意力路径按层交替，要求引擎支持异构层调度。
      这是比单一新算子更深的改动，影响图捕获与内存池的组织方式。
    evidence: judgement
    horizon: now
    axis: attention

