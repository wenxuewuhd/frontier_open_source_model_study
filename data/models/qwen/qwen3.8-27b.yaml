notes: >-
  稠密 FFN 支线的最新一档（旗舰见 qwen3.8-2.4t-a95b），`track: side`。
  **predecessor 是同档位的前代 qwen3.5-27b，不是同代旗舰** —— 两条支线各自接通，
  按旗舰串会把稠密与 MoE 混成一条假链（见 R12）。
  相对前代只有一处权重变化（A_log 与 linear_attn.norm 由 F32 回到 BF16，
  发生在中间的 Qwen3.6-27B），结构字段与前代完全一致。
  **与同代旗舰的差异仍是本档的收录理由**，三条都在本仓核过：
  (1) FFN 由 MoE 换成 dense —— 主干 64 层与草稿块都是 gate_proj / up_proj / down_proj
  三个独立 2 维投影（中间维 17408），旗舰独有的 14 个张量名族（堆叠的
  experts.gate_up_proj [512, 4096, 8192] 与 experts.down_proj、router mlp.gate、
  shared_expert.* 与 shared_expert_gate，主干与草稿块各一套）这里一个都没有；
  差的是机制不是规格，dense GEMM 对三维堆叠 grouped GEMM + router + 共享专家，
  算子集合不同。
  (2) 多一整条视觉前端（visual.* 21 个张量名族、460,730,096 参数），
  旗舰是纯文本 —— 带 bias 的 LayerNorm、GELU、3D patch 卷积、patch merge
  这四类算子只在这一档出现。
  (3) 注意力与线性注意力的张量名族与旗舰完全相同（归一前缀后两档共有 32 族），
  只换形状：full 层 24 头对 64、线性层 value 头 48 对 128，key:value 头数比
  1:3 对 1:8 —— 它在缓存账上的用处是给了第二个比值，
  「conv 通道数 = q + k + v 三段之和」在 1:8 与 1:3 两档同时成立才能当规律用（R1）。
  本记录最初是 P0-D 的 schema 普适性测试用例：与 V4.1 在三个轴上都不同
  （dense FFN、混合线性注意力、视觉融合路径）。

open_questions:
  - >-
    矩阵状态的实际存储是否就是一个 [48, 128, 128] 的 FP32 张量需按实现确认
    （两维都是 128，维序不影响容量）；状态头数与 conv 通道数已由权重清单确定
  - >-
    27B 扣哪几项是判断：只扣视觉或只扣草稿取整也是 27B，excludes 取两者都扣（偏差最小），
    没有一手说明
  - KV cache 的实际存储精度未披露，推导时按模型 dtype 兜底
  - >-
    训练精度没有一手来源：config 的 dtype: bfloat16 说的是发布权重，
    而**模型卡正文已读**（README.md @ 1d4bf0f2ff60，P1 轮补取），Model Overview 只列结构与规模，
    没有训练精度声明，故不填 precision.training
  - >-
    config 的 output_gate_type: swish 只有一个键，而门在权重里有两处（full 层 q_proj 的
    后一半、线性层的 in_proj_z）。swish 作用在哪一处或两处，未按实现核

  - >-
    **视觉塔自注意力的跨度没有来源。** vision_config 里没有 window_size、
    也没有 fullatt_block_indexes（前代 Qwen2.5-VL 两个都有），所以一张图是
    整图一段注意力还是分窗，config 层面判不了，参考实现本轮没读。
    arch.vision.prefill 因此只装线性项
  - >-
    **「一张图」的厂商默认分辨率未知。** arch.vision.tokens 钉在本仓选的参考
    分辨率 672×672 上，真正的动态分桶规则在 preprocessor_config.json 里，
    那个文件不在 facts/。所以 tokens 下的数只能和同样钉在 672 的其它记录比
  - >-
    视觉塔与主干**落盘层面**是否有 tied weights 未查。weight_map 里两个前缀
    不重名，这只排除了重名；存储共享要看 safetensors 头的数据偏移，本轮没读

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 上一会话两个独立核查代理 + 本会话复算
  method: >-
    上一会话两个核查代理按 .claude/skills/model-audit 的提问顺序各自过两份 Qwen 记录，
    提出本块与 qwen3.8-2.4t-a95b 的 review 所列发现。进记录的每个数本会话都在 facts/ 上重算过：
    conv1d / in_proj_qkv 首维的逐层恒等（48/48）、A_log 形状（48/48）、q_proj 的形状
    （17/17，含草稿块）、参数分项与四种扣法的偏差、HF tags 与 cardData 里的许可字段、
    视觉塔的张量名族与块数（27）、full 层位置（权重里 self_attn 恰在 L3+4k，16 层）、
    以及与旗舰的归一化张量名族比对（R10）。
    derive.py 以默认 --ep 1 重跑，0 处不一致，外部 safetensors tally 逐位相同。

review:
  - id: R1
    field: arch.attention.linear_state
    severity: wrong
    claim: 每序列线性状态 145.50 MiB（derive.py 的 conv 项 = conv_kernel_dim × key 头数 × key_head_dim × 4 B）
    finding: >-
      短卷积是 depthwise、作用在整条 qkv 流上。48/48 层 conv1d.weight 都是 [10240, 1, 4]，
      首维恒等于 in_proj_qkv [10240, 5120] 的输出维 = 2×16×128 + 48×128。原公式只数了
      2048 通道，conv 项少算 5 倍（每层 32768 B → 163840 B）。旗舰在 key:value 1:8 下同一恒等式
      也成立（69/69 层），两档比值不同而同时成立
    resolution: corrected
    changed_to: >-
      derive.py 的 conv 项改按 qkv 通道数计。每层 3,309,568 B，48 层 158,859,264 B
      = 151.50 MiB/序列（+3.96%）。窗长仍按全窗 4 计，是上界
  - id: R2
    field: arch.attention.linear_state.state_layout_note
    severity: overreach
    claim: 「config 只给出头数与头维，不给状态张量布局……用于容量规划前需按实现核实」
    finding: >-
      「config 不给」被写成了「没有来源」。这份比旗舰那份更彻底：连旗舰引过的
      A_log / dt_bias 证状态头数都没有，整个线性状态都挂在「需按实现核实」下。
      而 conv 通道数与状态头数都直接写在权重清单的形状里，免责声明只该免掉矩阵状态的维序一项
    resolution: corrected
    changed_to: 注释改为逐因子列出清单来源（A_log [48]、in_proj_qkv、conv1d），只把矩阵状态的实际存储留给实现核
  - id: R3
    field: license
    severity: wrong
    claim: 交接说明称两份 Qwen 的 license apache-2.0 都与一手来源矛盾
    finding: >-
      对本记录不成立：facts/qwen3.8-27b/repoinfo.json 的 tags 是 license:apache-2.0、
      cardData 是 license: apache-2.0。矛盾只在旗舰（license:other，qwen3.8-max）。
      两档许可不同，不能从一档推另一档
    resolution: refuted
    changed_to: 原值保留，一手来源写进 sources[0].note
  - id: R4
    field: precision.training
    severity: unsupported
    claim: training BF16，继承 precision official
    finding: config 只有 dtype 一键（bfloat16），说的是发布权重；本仓读过的来源里没有训练精度
    resolution: corrected
    changed_to: 删掉 precision.training，加一条 open question 说明无一手来源
  - id: R5
    field: arch.attention.hybrid.note
    severity: imprecise
    claim: 「16 层 full attention 的 KV 随上下文线性增长」，未说明口径
    finding: >-
      清单里另有 1 个草稿块 mtp.layers.0，带着与主干 full attention 同名的 q/k/v/o 投影、
      没有 linear_attn，开草稿侧时它也累积 KV。16 来自 config 的 layer_types（主干 64 层）
    resolution: corrected
    changed_to: >-
      保留主干口径，在 hybrid.note 与 kv-capacity 的 quantified 里写明
      「64 主干层 + 1 草稿块，开草稿侧累积 KV 17 层、69632 B/token」
  - id: R6
    field: evidence
    severity: miscategorized
    claim: arch 的 official 前缀继承覆盖 activation / norm
    finding: >-
      SwiGLU 是 hidden_act: silu 配 gate/up 两路投影的推断，RMSNorm 是从 rms_norm_eps 与
      无 bias 的 norm 权重推的，都不是官方披露。继承 official 让它们绕过 Gate C
    resolution: corrected
    changed_to: >-
      两者与新增的 head_dim_note、params.breakdown、lineage.changed_from_predecessor 标 derived；
      params.excludes 与 counting_note 标 judgement
  - id: R7
    field: params.total
    severity: missing
    claim: 「模型卡未以单一数字披露总参数量，故 params 不填声明值，交叉核对相应跳过」
    finding: >-
      名字里的 27B 就是厂商声明值。不填它，Gate B 的参数总量一项 skip，于是一个口径事实
      一直看不见：全量 27,781,427,952 对 27B 是 +2.89%，超出 2% 容差，取整是 28B ——
      名字不按全量算。扣掉视觉（460,730,096）与草稿（424,699,392）是 26,895,998,464，−0.39%。
      只扣其中一项取整也是 27B（+1.19% / +1.32%），所以扣哪几项仍是判断
    resolution: corrected
    changed_to: >-
      补 total 27e9、excludes [vision, draft] 与七项 breakdown，counting_note 写明四种扣法的偏差。
      Gate B 的参数总量一项由 skip 变为 ok
  - id: R8
    field: arch.attention.output_gate
    severity: missing
    claim: output_gate enabled、type swish，没有形状说明
    finding: >-
      17/17 个 q_proj（16 主干 full 层 + 草稿块）都是 [12288, 5120] = 2 × 24 × 256，
      比 num_heads × head_dim 大一倍，o_proj 入口仍是 6144。线性层的门是 in_proj_z [6144, 5120]
    resolution: corrected
    changed_to: 新增 head_dim_note 写明 q_proj 的两半与线性层的 in_proj_z；swish 作用在哪一处留 open question
  - id: R9
    field: arch.position
    severity: missing
    claim: 「RoPE，partial_rotary_factor 0.25」
    finding: >-
      config 的 rope_parameters 是 mrope_interleaved: true、mrope_section [11, 11, 10]、
      rope_theta 1e7。旗舰是普通 RoPE，这是两档之间一处机制差异，记录里没有
    resolution: corrected
    changed_to: 改为 interleaved mRoPE，并写明 64 维 rope = 32 个频率对、恰被 [11, 11, 10] 分完
  - id: R10
    field: notes
    severity: unsupported
    claim: 「保留它是因为它是同代里下载量最高的一个」
    finding: >-
      下载量不是结构理由，也没有在本仓任何取数里核过。核查代理给了一个结构理由：
      「与旗舰共有的归一化张量名族只有 13 个（全是 MTP 胶水与 lm_head）」。复算不成立 ——
      13 是没把 model.language_model. 与 model. 两种前缀归一的产物。归一后旗舰 46 族、
      本档 59 族、共有 32 族：注意力、线性注意力、norm、embed 与 MTP 的注意力部分全部同名。
      差异只在 FFN（旗舰独有 14 族：堆叠 experts、router、shared_expert*）与视觉
      （本档独有 27 族：21 个 visual.* 加 6 个 dense FFN）。结论（该留）不变，论据换成这份清单
    resolution: corrected
    changed_to: >-
      收录理由改写进 lineage.changed_from_predecessor（三条：moe / modality / attention，
      predecessor 设为旗舰），notes 只留指针。删掉「下载量最高」
  - id: R11
    field: notes
    severity: overreach
    claim: 「Qwen3.8 全线是混合线性注意力」
    finding: 本仓只录了 Qwen3.8 的两档，其余档位没有核过
    resolution: corrected
    changed_to: 删掉这句，notes 只说本档与旗舰的关系
  - id: R12
    field: lineage.predecessor
    severity: wrong
    claim: predecessor 是 qwen3.8-2.4t-a95b（同代旗舰），changed_from_predecessor 三条都在和旗舰比
    finding: >-
      P1 的历史回溯把稠密支线补齐之后，本档的前代是 **qwen3.5-27b**
      （2026-02-24，同档位、同结构）。指向旗舰有两处问题：
      (1) **把两条支线串成了一条假链** —— 稠密 FFN 与 MoE 旗舰是两条独立演进线，
      README 的「和 lineage.predecessor 比，不和时间上的前一个比」正是为这件事写的；
      (2) 三条 changed_from_predecessor 描述的是「本档与旗舰的档位差异」，
      而站点的「逐维度演进」块读这个字段，于是稠密支线的演进在族谱页上
      显示成「相对旗舰少了 MoE、多了视觉塔」——读不出这一支自己走过什么。
      相对真正的前代，本档的权重侧**只有一处变化**：48 层的 A_log 与
      linear_attn.norm 由 F32 回到 BF16（96 个张量、8448 个元素），
      其余 1199 条逐条 shape 相同、参数量逐位相同；config 侧的差异全是
      把已有结构显式声明出来。这一步发生在中间的 Qwen3.6-27B，
      而 3.6 与本档的清单逐条 shape + dtype 全同，所以 3.6 不单独立记录
    resolution: corrected
    changed_to: >-
      predecessor 改为 qwen3.5-27b，changed_from_predecessor 改写成两条
      （precision：F32 → BF16，发生在 3.6；training：config 的差异全是显式声明）；
      与旗舰的三条差异改写进 notes，仍保留为本档的收录理由
  - id: R13
    field: sources
    severity: missing
    claim: 本记录只有 config.json 一个来源
    finding: >-
      按 main 并入的来源优先级规则补读模型卡，四件事有了一手来源：
      (1) 「Hidden Layout: 16 × (3 × (Gated DeltaNet → FFN) → 1 × (Gated Attention → FFN))」
      与 config 的 layer_types、清单的层集合三方一致；
      (2) 机制的厂商名是 **Gated DeltaNet** 与 **Gated Attention**；
      (3) 「Rotary Position Embedding Dimension: 64」= head_dim 256 × 0.25；
      (4) **27B 嵌在「Language Model」一级下、与 Vision Encoder 并列** ——
      excludes 里的 vision 由此有了厂商分法的旁证（draft 那一项仍是判断）。
      另外卡写「extensible up to **1,000,000**」，而同代旗舰与 Qwen3.5 两档写的是
      1,010,000 —— 同一代里两个数，各记录按自己的卡填。
      **卡里没有训练精度，也没有每 token 缓存字节数**（后者是 main 新加的
      kv_sharing.declared_per_token_bytes，本档填不了）
    resolution: corrected
    changed_to: >-
      新增 sources 的 modelcard 条目；linear_state.mechanism 写上厂商名；
      counting_note 补视觉塔的厂商分法旁证；补 context.train_native 与 extension_method；
      训练精度那条 open question 改为「卡已读、无声明」
  - id: R14
    field: arch.vision.params
    severity: missing
    claim: >-
      视觉塔只有结构尺寸，没有参数量、没有 intermediate、fusion 只有一句
      「patch merge 后投影到主干 hidden」，而同代的 qwen3.5-27b /
      qwen3.5-397b-a17b / qwen3.8-flash-next 三档都有 params
    finding: >-
      按 shapes.json 实测补齐，并顺手拿到一个**跨代判据**：
      本档 333 个 model.visual. 张量与 qwen3.5-27b 的 333 个
      **逐名、逐形状、逐 dtype 完全相同，0 处差异**；
      与 qwen3.5-397b-a17b / qwen3.8-flash-next 只差 merger.linear_fc2
      一项（出口宽度 5120 / 4096 / 2560）。
      即 Qwen3.5 与 Qwen3.8 两代共用同一座视觉塔，只换最后那层投影 ——
      按 model-audit 的取数顺序，张量名集合相同就不必重走算子评估，
      这是整个跟踪里最省力的判据。
      参数量 460,730,096 = encoder 415,891,440 + projector 44,838,656，
      与 derived JSON 的 params_by_subsystem.vision 一致。
      同时补 infra 侧三组。encoder / projector 的 FLOPs 与
      「一张图 ≈ 472 个文本 token」三个数与 qwen3.5-27b 逐位相同，
      因为塔相同、且两档的 active_params.total 与 lm_head 也逐位相同。
      **唯一真正不同的是分片布局**：本档 333 个视觉张量全在第 1 个分片
      （同片只有 59 个非视觉张量），而 qwen3.5-27b 的在最后一个分片
      （同片 503 个非视觉张量）—— 同代四档里只有这一处差别
    resolution: corrected
    changed_to: >-
      补 arch.vision.intermediate 4304（config）、params 460730096（实测）、
      fusion 展开到逐张量并写明与同代三档的塔比对结论；
      新增 arch.vision.tokens / prefill / separability 三组；
      evidence 加十条，四格判断类进 Gate C；
      encoder 注意力跨度、默认分辨率、落盘 tied weights 三件事进 open_questions
  - id: R15
    field: precision.quantization.per_subsystem
    severity: missing
    claim: >-
      这一格空着。全仓 47 份有 45 份填了，缺的只有本档与 qwen3.8-2.4t-a95b ——
      P1 那条通义线给自己新建的 11 份都填了，没回头补这两份 P0 时期的记录
    finding: >-
      **结论是「全 BF16」，不是「没查」。** 本会话独立重算过，没有引用他人给的列表：
      1199 条张量的 **dtype 集合就是 {BF16} 一个值**，`scale_elements` 为 0，
      清单里没有任何含 scale 的叶名，`from_shapes.complete` 为 true，
      config 里没有 `quantization_config`。
      七个子系统逐桶统计（按**参数量**加权，不按张量条数）都是 BF16 100.0%：
