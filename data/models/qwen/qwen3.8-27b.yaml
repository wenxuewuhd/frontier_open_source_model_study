notes: >-
  较小档位，不是家族旗舰（旗舰见 qwen3.8-2.4t-a95b）。保留它是因为它是
  同代里下载量最高的一个，且带视觉塔与 dense FFN，和旗舰形成结构对照。
  本记录是 P0-D 的 schema 普适性测试用例。原计划找一个「结构朴素」的旗舰作对照，
  但调研发现 2026 年的旗舰已无朴素结构：Qwen3.8 全线是混合线性注意力，
  GLM-5.3 是 MLA + DSA 稀疏。于是改选与 V4.1 差异最大的这一个，
  它在三个轴上都和 V4.1 不同：dense FFN（无 moe 块）、混合线性注意力、不同的视觉融合路径。

open_questions:
  - >-
    线性注意力的状态张量布局未在 config 中给出，推导值是按常见布局的估算。
    要用于容量规划需按实现核实
  - params.total 未在模型卡中以单一数字披露，当前以权重清单实测为准
  - >-
    full_attention_interval 为 4，但 layer_types 的首尾是否严格按周期排布
    需与实现确认（本记录按 config 的 layer_types 逐层统计，不依赖周期假设）
  - KV cache 的实际存储精度未披露，推导时按模型 dtype 兜底
