lineage:
  track: main
  predecessor: qwen2-57b-a14b
  successor: qwen3-next-80b-a3b
  # MoE 支线从这一代起变成旗舰线（同代稠密档 qwen3-32b 标 side）。
  changed_from_predecessor:
    - axis: moe
      text: >-
        **共享专家被去掉**：config 没有 shared_expert_intermediate_size，
        清单 36945 条里零个 shared_expert / shared_expert_gate 张量
        （前代每层一套三张加一个门）。路由专家 64 → **128**，top_k 仍 8，
        专家中间维 2560 → 1536（相对稠密 12288 是 **1/8**，前代是 1/7.4）。
        **单个专家反而小了**：3 × 4096 × 1536 = 18,874,368 对前代
        3 × 3584 × 2560 = 27,525,120（0.69 倍）。专家仍逐个独立存张量
        （94 层 × 128 × 3 = 36,096 条目）
      benefit: >-
        每 token 的 FFN 中间维从 40960（路由 20480 + 共享 20480）降到
        **12288**（8 × 1536，恰好一份稠密 FFN），常驻的那一半整个消失了。
        容量与带宽的比（两侧都扣输入词表）从 4.15 倍跳到 **10.87 倍** ——
        这是 Qwen 线稀疏度最大的一次改善，而它来自删掉共享专家、不是加专家。
        代价：没有常驻通路之后 router 的负载均衡更关键（仍只有 aux-loss），
        而且 grouped GEMM 的单专家更小（18.87M）、更依赖批量聚合
    - axis: attention
      text: >-
        与同代稠密档同步的三件事：**QK-Norm 进来**（94/94 层 q_norm [128] 与
        k_norm [128]，config 无开关）、**q/k/v 的 bias 整体去掉**
        （attention_bias: false，清单零命中）、**head_dim 与 hidden/heads 解耦**
        （config 显式 head_dim 128，而 4096 / 64 = 64，所以 q_proj 是 [8192, 4096]、
        o_proj 是 [4096, 8192]）。KV 头 4 → 4 不变，但 hidden 从 3584 到 4096
      benefit: >-
        每层缓存仍 2 × 4 × 128 = 1024 元素，层数 28 → 94 让每 token 从 28,672
        涨到 96,256 元素（3.36 倍）—— **这一代的 KV 增长全部来自层数**，
        注意力形态没有压缩任何东西。按 hidden² 估 q_proj / o_proj 会低 50%
        （4096² = 16,777,216 对实际 8192 × 4096 = 33,554,432）
    - axis: context
      text: 131072 → 40960（max_position_embeddings），rope_theta 仍 1e6、rope_scaling 为 null
      benefit: >-
        和同代稠密档一样，声明值是降的，长上下文做法不在 config 里。
        40960 满上下文的 KV 只有 7.34 GiB，对 437.90 GiB 的权重存储可忽略
    - axis: scale
      text: 57.4B 总 / A14B → 235.1B 总 / A22B，层数 28 → 94，hidden 3584 → 4096
      benefit: >-
        总量 ×4.1 而激活量只 ×1.57（13,704,732,160 → 21,568,433,664，带宽口径），
        **激活占比从 23.9% 降到 9.2%** —— 规模放大而 decode 带宽几乎没跟着涨，
        这正是删掉共享专家 + 专家数翻倍换来的

params:
  total: 2.35e+11
  active_decode: 2.2e+10
  breakdown:
    expert: 227096000000.0
    attention: 6702500000.0
    embed: 622330000.0
    lm_head: 622330000.0
    router: 49283072.0
    norm: 798208.0
  counting_note: >-
    total 与 active_decode 都取自模型名（235B-A22B），属厂商声明；breakdown 是本仓按
    完整权重清单（118 分片 36945 条目，全 BF16、无量化 scale、无低位打包）实测的分项，
    取 6 位有效数字。实测全量 235,093,634,560，与 HF 平台自己从分片头统计的
    safetensors tally 逐位相同，对 235B 是 **+0.04%** —— 本仓记录过的最接近的一次，
    所以这一档不需要 excludes 之类的口径判断（也没有草稿块或视觉塔可扣）。
    **A22B 两种口径都在容差内**：含输入词表 22,190,763,520（+0.87%）、
    带宽口径 21,568,433,664（−1.96%，贴着 2% 边）。前两代 MoE 都是含输入词表那一种
    明显更吻合，本代分不出来，所以这一档不作为那条规律的样本。
    激活的专家部分 = 227,096,395,776 × 8/128 = 14,193,524,736，常驻部分 7,374,908,928
    （注意力 + router + norm + lm_head）—— **这一代常驻部分里没有共享专家**。
    词表与输出层不共享权重（各 622,329,856）。权重存储 437.90 GiB。

context:
  max: 40960

arch:
  layers: 94
  hidden: 4096
  vocab: 151936
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU
  position: RoPE theta 1e6，作用在全部 head_dim 维（config 无 partial_rotary_factor）

  attention:
    type: GQA
    num_heads: 64
    num_kv_heads: 4
    head_dim: 128
    head_dim_note: >-
      head_dim 128 是 config 的显式字段，且**不等于 hidden / num_heads**（4096 / 64 = 64）。
      清单印证：q_proj [8192, 4096]（8192 = 64 × 128）、o_proj [4096, 8192]、
      k_proj 与 v_proj [512, 4096]（512 = 4 × 128）。按 hidden² 估 q/o 会低 50%。
      缓存宽度按 k_proj / v_proj 的输出维算：每层 2 × 512 = 1024 元素。
      **零 .bias**（attention_bias: false，36945 条清单里 self_attn 下零命中），
      另有每层 q_norm [128] 与 k_norm [128]（QK-Norm），它们归 norm 子系统
    layer_pattern: 94 层同构，每层产出自己的 KV，无跨层共享、无滑窗、无稀疏

  ffn:
    type: moe
    layer_pattern: >-
      94 层全是 MoE 层（decoder_sparse_step: 1，清单里 94/94 层都有 experts），
      没有「前 k 层走稠密」的安排。**也没有共享专家**，所以 FFN 侧每 token
      只有被选中的 8 个专家在算

  moe:
    routed_experts: 128
    shared_experts: 0
    top_k: 8
    intermediate: 1536
    dense_intermediate: 12288
    routing: 带辅助损失（router_aux_loss_coef 0.001）
    balance: aux-loss
    storage_note: >-
      专家逐个独立存张量：每层 128 个专家 × 3 个投影（[1536, 4096] / [1536, 4096] /
      [4096, 1536]），94 层共 36,096 个条目 —— 本仓记录里条目数最多的一份
      （36945 总条目中 97.7% 是专家）。grouped GEMM 吃 2 维张量的列表、
      EP 切分按张量切；3 维堆叠布局要到 Qwen3.5 一代才出现。
      **没有共享专家张量**，所以 FFN 侧没有旁路通道

