bottlenecks:
  - dimension: weight-bandwidth
    finding: >-
      删掉共享专家把稀疏度从 4.15 倍推到 10.87 倍（两侧都扣输入词表：
      234,471,304,704 / 21,568,433,664）。decode 每 token 搬 40.17 GiB，
      而权重存储 437.90 GiB —— 容量与带宽第一次差一个数量级。
      这对部署形态的影响是定性的：权重必须跨卡/跨机摊开，而 decode 的
      带宽需求只有总量的 9.2%，所以「装得下」比「搬得快」更先成为约束。
    quantified: >-
      权重存储 437.90 GiB（含输入词表）；带宽口径每 token 21,568,433,664 × 2 B
      = 40.17 GiB。专家占总参数 96.6%（227,096,395,776 / 235,093,634,560），
      激活占比 9.2%（21,568,433,664 / 234,471,304,704，两侧都扣输入词表）
    visibility: public
  - dimension: ep-comm
    finding: >-
      top_k 仍 8、hidden 4096、MoE 层 94 —— 每 token 的 dispatch + combine
      12,320,768 B，是前代的 3.84 倍，增长全部来自层数（28 → 94）。
      专家数翻倍不影响载荷（载荷是 2 × top_k × hidden），只影响目的地分布。
    quantified: 2 × top_k 8 × hidden 4096 × 2 B × 94 层 = 12,320,768 B/token（EP>1，BF16 激活）
    visibility: public
  - dimension: operator-gap
    finding: >-
      FFN 侧的算子集合**变简单了**：没有共享专家就没有旁路通道，
      每层只有 router 打分 + top-8 + grouped GEMM 三件事。
      注意力侧多了 QK-Norm 两个小算子。所以这一代对适配的要求是
      「去掉一条路径、加两个小算子」，不是新范式。
    visibility: public

infra_signals:
  - text: >-
      **共享专家被删掉了，而这件事在 config 里表现为「缺一个键」。**
      只比 config 的键值不比键集合，会把这一代读成「和前代一样有共享专家、
      只是没声明大小」。清单侧是硬证据：36945 条里零个 shared_expert。
      这条通路在下一代（qwen3-next-80b-a3b）又回来了 ——
      所以 Qwen 的共享专家是**反复出现**，不能按「某一代有就以后都有」规划算子。
    evidence: derived
    horizon: settled
    axis: moe
  - text: >-
      稀疏度的最大一次改善来自**删掉常驻通路**，不是加专家：
      专家数 64 → 128 只影响路由分布，而共享专家从 20480 的常驻中间维变成 0，
      直接把常驻部分砍掉 6.17B。规划 decode 带宽时，
      「专家数 × top_k」这个比值远不如「有没有常驻通路」重要。
    evidence: judgement
    horizon: settled
    axis: moe

