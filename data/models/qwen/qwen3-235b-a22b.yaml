notes: >-
  MoE 支线的第三代（2025-04），也是 Qwen 线旗舰第一次是 MoE ——
  此后到 Qwen3.8 旗舰一直是 MoE，稠密档位转为 side（见 qwen3-32b）。
  结构轴上最重的一件事是**共享专家被去掉**（下一代又加回来）；
  注意力侧的三件事（QK-Norm、去 bias、head_dim 解耦）与同代稠密档同步。
  同代的 Qwen3-30B-A3B 与 Qwen3-Coder-480B-A35B-Instruct 张量名族与本记录逐个相同
  （归一层号后），只是档位与专家数缩放，不另录 ——
  Coder-480B 的 config 里 use_qk_norm: true 是把本记录已有的结构显式声明出来，
  不是新增。

open_questions:
  - >-
    QK-Norm 作用在 rope 之前还是之后没有读实现，只知道它按 head_dim 归一（[128]）
  - >-
    40960 之上的长上下文做法不在 config 里（rope_scaling 为 null），
    context 只记声明值，不填 extension_method
  - >-
    KV cache 的实际落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底，
    bytes_basis 是 dtype_fallback
  - >-
    训练精度没有一手来源：config 的 torch_dtype: bfloat16 说的是发布权重，
    模型卡正文未核，故不填 precision.training
  - >-
    删掉共享专家之后负载均衡只剩 aux-loss（router_aux_loss_coef 0.001），
    有没有别的无损均衡手段（如 bias 纠偏）在 config 与清单里都看不到 ——
    清单里 router 只有一张 [128, 4096] 的 gate.weight，**没有 gate.bias**

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen3-235b-a22b 核：config 全部键
    （含「缺哪些键」——shared_expert_intermediate_size 与 use_qk_norm 都不存在）、
    完整权重清单（36945 条目逐项 numel / dtype / 层索引、experts.N 下标集合 0–127）、
    repoinfo 的 tags / cardData / sha 与 safetensors tally。
    「没有共享专家」「没有 .bias」「没有 gate.bias」三条否定结论都是对清单做名字扫描
    得到的零命中，不是从 config 的缺键推的（见 R1）。
    参数六项逐项按形状重算并三方比对；三个比值（稀疏度、激活占比、专家粒度）
    各自重算过分子分母（见 R2、R3）。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致；EP 通信量按 --ep 4 另跑核对公式。
    **原理上核不了的**：QK-Norm 与 rope 的先后、长上下文做法、KV 落盘精度、训练精度，
    都在 open_questions 里。
review:
  - id: R1
    field: arch.moe.shared_experts
    severity: unsupported
    claim: shared_experts 0
    finding: >-
      两边都查了：config 没有 shared_expert_intermediate_size 这个键
      （前两代都有），清单 36945 条里 shared_expert / shared_expert_gate 零命中。
      **缺键本身不是证据** —— 本仓在 attn_sink 上栽过反方向的同一个错
      （config 没开关而权重里有）。零命中才是证据。
      顺带扫出另两条否定事实：self_attn 下零个 .bias、router 只有 gate.weight
      而**没有 gate.bias**（DeepSeek 一代的 routing_bias 这一代没有）
    resolution: confirmed
  - id: R2
    field: bottlenecks
    severity: unsupported
    claim: 稀疏度 10.87 倍，激活占比 9.2%
    finding: >-
      两个数同口径重算：分子分母都扣掉只 gather 一行的输入词表 ——
      234,471,304,704 / 21,568,433,664 = 10.871。
      与前代 4.15 倍、前前代 5.89 倍是同一种算法，可以放在一条线上比。
      激活占比 9.2% 是它的倒数。
      专家占总参数 96.6% 用的是**含**输入词表的分母（235,093,634,560），
      和上面两个不是同一个分母，已在 quantified 里写明
    resolution: confirmed
  - id: R3
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: >-
      草稿里 moe 那条写「专家数翻倍、粒度更细（1/7.4 → 1/8）」
    finding: >-
      1/8 与 1/7.4 几乎没差别，真正变化的是两件别的事：
      (1) **单专家绝对尺寸反而小了**（18,874,368 对 27,525,120，0.69 倍）；
      (2) 每 token 的 FFN 中间维从 40960 降到 12288（共享专家那 20480 没了，
      路由那边也从 20480 降到 12288）。
      把「更多更细」当成这一代的主旨会完全错过共享专家被删这件事
    resolution: corrected
    changed_to: >-
      moe 条改为以「共享专家被去掉」开头，粒度比值与单专家绝对尺寸并列给出，
      benefit 写明每 token FFN 中间维 40960 → 12288
  - id: R4
    field: lineage.changed_from_predecessor
    severity: wrong
    claim: >-
      草稿里 attention 那条的 benefit 写「KV 每 token 从 28,672 降到 ……」
    finding: >-
      方向是反的：每 token 从 28,672 **涨到** 96,256 元素（3.36 倍），
      因为层数 28 → 94 而每层宽度不变（都是 2 × 4 × 128 = 1024）。
      这一代的注意力改动一个字节的缓存都没省。
      「每层宽度不变 + 层数涨」这件事在只看 num_kv_heads 时完全看不出来
    resolution: corrected
    changed_to: benefit 改为「涨 3.36 倍，增长全部来自层数，注意力形态没压缩任何东西」
  - id: R5
    field: params.counting_note
    severity: imprecise
    claim: >-
      草稿沿用前两代的说法：「A22B 对得上的是含输入词表的口径」
    finding: >-
      本代两种口径**都在容差内**：含输入词表 +0.87%、带宽口径 −1.96%。
      虽然前者更吻合，但 −1.96% 也在 2% 以内，所以这一档分不出来、
      不能当作「Qwen 的激活参数声明含输入词表」这条规律的样本。
      前两代（−0.40% 对 −11.9%、+1.78% 对 −2.11%）才是能分辨的样本
    resolution: corrected
    changed_to: counting_note 改为写明两种口径都在容差内、本档不作为那条规律的样本
  - id: R6
    field: arch.moe.storage_note
    severity: missing
    claim: 草稿只写「专家逐个独立存张量」
    finding: >-
      这一代的条目数是本仓最多的一份：36,096 个专家条目占 36945 总条目的 97.7%。
      这件事有实际后果 —— 加载时要开 36096 个张量视图，
      而 Qwen3.5 一代同样 512 专家只用每层 2 个堆叠张量。
      数量级差异值得写进 storage_note 而不是只说布局
    resolution: corrected
    changed_to: storage_note 补上条目数与占比，并点出与 Qwen3.5 堆叠布局的对比
  - id: R7
    field: hf.sha
    severity: wrong
    claim: >-
      草稿里的 hf.sha 与 hf.last_modified 是按 12 位前缀「补全」的，不是从取数产物读的
