hf:
  repo: Qwen/Qwen2-72B
  sha: 5f149cae83c1b4ce1a61bbdf48a24efccf1a4e5c
  last_modified: '2024-10-09T07:21:45.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: main
  predecessor: qwen1.5-72b
  successor: qwen3-32b
  changed_from_predecessor:
    - axis: attention
      text: >-
        **MHA → GQA**：64 query 头不变，KV 头 64 → 8（8 组），head_dim 仍 128。
        清单里 k_proj 与 v_proj 从 [8192, 8192] 变成 **[1024, 8192]**，
        输出维 1024 = 8 头 × 128；q_proj 与 o_proj 仍是 [8192, 8192]。
        q/k/v 的 bias 跟着缩：q 仍 [8192]，k 与 v 各 [1024]
      benefit: >-
        每层缓存从 2 × 64 × 128 = 16384 元素压到 2 × 8 × 128 = **2048 元素，8 倍**；
        每 token 从 1,310,720 元素降到 163,840。注意力参数也从 21,476,802,560
        降到 12,080,414,720（占总参数 29.7% → 16.6%）。
        **缓存宽度必须按 k_proj / v_proj 的输出维算**：按 num_attention_heads × head_dim
        折算得 16384，对实际 2048 是 8 倍高估
    - axis: context
      text: 32768 → 131072（max_position_embeddings），RoPE theta 仍 1e6
      benefit: >-
        上下文 ×4 与 GQA ÷8 是同一代的两件事，合起来满上下文的 KV 反而**减半**：
        前代 32K × 2,621,440 B = 80.00 GiB，本代 128K × 327,680 B = 40.00 GiB。
        只做其中一件都不成立 —— 128K 配 MHA 是 320 GiB
    - axis: moe
      text: 仍是稠密 FFN，中间维 24576 → 29568（+20.3%）
      benefit: >-
        注意力省下来的 9.40B 参数被 FFN 吃回去 9.81B，总量几乎不变
        （72,287,920,128 → 72,706,203,648，+0.58%）。带宽口径的激活参数
        从 71,042,211,840 涨到 71,460,495,360（+0.59%）——
        **GQA 省的是缓存不是带宽**，这一代把省下的参数预算挪给了 FFN
    - axis: precision
      text: 仍是 BF16 直接发布，963 个条目全 BF16，没有 quantization_config
      benefit: 精度这条轴在 Qwen 线一直到 Qwen3.5 才有 config 级的变化（见 qwen3.5-27b 的 F32 两项）

params:
  total: 7.2e+10
  breakdown:
    dense_ffn: 58133100000.0
    attention: 12080400000.0
    embed: 1245710000.0
    lm_head: 1245710000.0
    norm: 1318912.0
  counting_note: >-
    total 取自模型名（72B），属厂商声明；breakdown 是本仓按完整权重清单
    （37 分片 963 条目，全 BF16、无量化 scale、无低位打包）实测的分项，取 6 位有效数字。
    实测全量 72,706,203,648，与 HF 平台自己从分片头统计的 safetensors tally 逐位相同。
    对 72B 是 +0.98%，在 Gate B 的 2% 容差内。没有草稿块、没有视觉塔，所以没有 excludes。
    词表与输出层不共享权重（各 1,245,708,288，tie_word_embeddings: false）。
    Gate B 的「参数总量」一项拿的是声明值比实测值；真正不依赖本仓任何一行代码的
    外部核对是 HF 的 safetensors tally。
    权重存储 135.43 GiB。激活参数两个口径：带宽口径 71,460,495,360
    （不含只 gather 一行的输入词表）、可比官方口径 72,706,203,648（含输入词表）。
    与前代的参数量几乎相同（+0.58%）但构成变了：注意力 −43.8%、FFN +20.3%。

context:
  max: 131072

arch:
  layers: 80
  hidden: 8192
  vocab: 152064
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: SwiGLU
  position: RoPE theta 1e6，作用在全部 head_dim 维（config 无 partial_rotary_factor）

  attention:
    type: GQA
    num_heads: 64
    num_kv_heads: 8
    head_dim: 128
    head_dim_note: >-
      head_dim 不是这一代的 config 字段，128 = hidden 8192 / num_attention_heads 64，
      由清单印证：q_proj 与 o_proj 是 [8192, 8192]，而 k_proj 与 v_proj 是 [1024, 8192]
      —— 1024 = num_key_value_heads 8 × 128。缓存宽度按后者的输出维算
      （每层 2 × 1024 = 2048 元素），按 query 头数折算会高估 8 倍。
      q/k/v 带 bias（q [8192]、k 与 v 各 [1024]），o_proj 没有；Qwen3 起 bias 整体取消
    layer_pattern: 80 层同构，每层产出自己的 KV，无跨层共享、无滑窗、无稀疏

  ffn:
    type: dense
    intermediate: 29568

precision:
  weights_release: [BF16]
  quantization:
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（37 分片 963 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空，963 条全是 BF16。这一代没有 quantization_config，
      不存在 scale 张量与量化块。同一套统计在 facts/qwen2.5-72b（同样 963 条目）上
      逐条相同，是本仓少有的「两份独立取数逐条吻合」的样本

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    ref:
      kind: modelcard
      url: https://huggingface.co/Qwen/Qwen2-72B
    visibility: public

bottlenecks:
  - dimension: weight-bandwidth
    finding: >-
      GQA 把缓存压了 8 倍，但带宽一点没省：稠密 FFN 占总参数 80.0%，
      带宽口径的激活参数 71,460,495,360 比前代还高 0.59%。
      decode 每 token 要搬 133.11 GiB —— 这一代的瓶颈完全在权重带宽上，
      而 128K 满上下文的 KV 只有 40.00 GiB。MoE 这条路在同代的
      qwen2-57b-a14b 上才有，稠密线要到 Qwen3.5 才靠混合注意力改善 decode。
    quantified: >-
      带宽口径激活 71,460,495,360 × 2 B = 133.11 GiB/token；权重存储 135.43 GiB
      （含输入词表）。dense_ffn 占总参数 80.0%（58,133,053,440 / 72,706,203,648）、
      占带宽口径 81.3%（分母换成 71,460,495,360）—— 两个分母不同，引用时要带口径
    visibility: public
  - dimension: kv-capacity
    finding: >-
      8 组 GQA 下每层 2048 元素，80 层每 token 163,840 元素。128K 满上下文
      40.00 GiB，是权重存储的 30%，仍不是主要矛盾。没有跨层共享、滑窗或稀疏，
      所以 KV 随层数与上下文严格线性。
    quantified: >-
      2 × num_kv_heads 8 × head_dim 128 = 2048 元素/层/token × 80 层 = 163,840 元素/token；
      KV 落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底得 327,680 B/token、
      128K 满上下文 40.00 GiB —— dtype_fallback 口径
    visibility: public

infra_signals:
  - text: >-
      MHA → GQA 这一步在 Qwen 线是和「上下文 ×4」捆在一起发生的，
      两件事合起来让满上下文的 KV 反而减半。跟踪时把它们拆开看会得出相反结论：
      单看上下文是 ×4 的压力，单看 GQA 是 ÷8 的缓解。
      比较要用元素口径（1,310,720 → 163,840），本代与前代的字节都是 dtype 兜底值。
    evidence: judgement
    horizon: settled
    axis: attention
  - text: >-
      **Qwen2.5-72B 相对本记录在结构上零差异**：config 只差 transformers_version，
      963 个张量的名字、形状与 dtype 逐条相同，HF tally 逐位相同。
      一个被广泛当成「新一代」的发布，算子侧什么都不需要做 ——
      和 README 里 DeepSeek R1 对 V3 那条是同一类。
      跟踪新版本时先比张量名集合与逐条 shape/dtype，相同就不必重走算子评估。
      本仓因此不为 Qwen2.5 的常规档位单独立记录。
    evidence: judgement
    horizon: settled
    axis: training

