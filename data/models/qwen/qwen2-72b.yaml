# （37 分片 963 条目，无读失败分片，全 BF16）。GQA 的缓存宽度取自 k_proj / v_proj
# 的输出维，不是 config 的头数乘积（derived）。
id: qwen2-72b
family: qwen
kind: llm
display_name: Qwen2-72B
released: '2024-05-22'
license: other
visibility: public

