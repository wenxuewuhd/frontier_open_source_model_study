notes: >-
  稠密支线的第二代（2024-05），也是 Qwen 线 GQA 的起点。
  **Qwen2.5-72B（2024-09-15）与本记录零结构差异**，所以不单独立记录：
  config 逐键比对只差 transformers_version（4.40.1 → 4.43.1），
  963 个张量的名字集合、逐条 shape 与 dtype 全部相同，HF 的 safetensors tally
  也逐位相同（72,706,203,648）。两份清单都在 facts/ 下（qwen2-72b、qwen2.5-72b），
  随时可复核。同代的 Qwen2-7B 张量名族与本记录逐个相同，只是档位缩放，不另录；
  Qwen2.5 一代里**结构上确有新东西的是 Qwen2.5-14B-Instruct-1M**（dual chunk attention），
  单独记在 qwen2.5-14b-1m。

open_questions:
  - >-
    KV cache 的实际落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底，
    bytes_basis 是 dtype_fallback，不能和别人按落盘格式算出来的理论下限比倍数
  - >-
    训练精度没有一手来源：config 的 torch_dtype: bfloat16 说的是发布权重，
    模型卡正文未核，故不填 precision.training
  - >-
    128K 上下文是怎么扩出来的（YaRN / 长文继续训练 / 两者）没有一手来源：
    config 的 rope_scaling 是 null、rope_theta 与前代同为 1e6，
    所以扩展方式在 config 里看不出来，context.extension_method 不填

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen2-72b 核：config 全部键、
    完整权重清单（963 条目逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData /
    sha 与 safetensors tally。
    缓存乘式的四个因子逐个落到清单里的张量形状上（见 R1）。
    参数分项逐项按形状重算并与清单求和、HF tally 三方比对（见 R2）。
    「Qwen2.5-72B 零差异」这一条是对 facts/qwen2.5-72b 实际取了完整清单之后
    逐条比 shape 与 dtype 得到的，不是只比名字集合（见 R3）。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致。
    **原理上核不了的**：128K 的扩展方式、KV 落盘精度、训练精度，都在 open_questions 里。
review:
  - id: R1
    field: bottlenecks
    severity: unsupported
    claim: 每 token 163,840 个 KV 元素、327,680 B、128K 共 40.00 GiB
    finding: >-
      四个因子逐个验：(1) **哪些层** —— q_proj 恰在 0–79 全部 80 层，无草稿块；
      (2) **每层多宽** —— **从产出张量读**：k_proj 与 v_proj 都是 [1024, 8192]，
      输出维 1024，K 与 V 各一份故 2048 元素。按 num_attention_heads × head_dim
      折算会得 16384（8 倍高估），这正是本仓在 DeepSeek indexer 上栽过的那种错；
      (3) **条目覆盖** —— 无压缩、无滑窗、无跨层共享，1:1；
      (4) **每元素字节** —— 无一手来源，按 config 的 torch_dtype 兜底 2 B，
      标 dtype_fallback
    resolution: confirmed
  - id: R2
    field: params.breakdown
    severity: unsupported
    claim: 五项分项与合计 72,706,203,648
    finding: >-
      逐项按形状重算：dense_ffn 80 × 3 × 8192 × 29568 = 58,133,053,440；
      attention 80 × (8192² × 2 + 1024 × 8192 × 2 + 8192 + 1024 × 2) = 12,080,414,720
      —— 注意 q/o 是满方阵而 k/v 是 [1024, 8192]，bias 也跟着缩；
      embed 与 lm_head 各 152064 × 8192 = 1,245,708,288；
      norm 80 × 2 × 8192 + 8192 = 1,318,912。
      五项合计与清单求和、与 HF tally 三者逐位相同
    resolution: confirmed
  - id: R3
    field: infra_signals
    severity: unsupported
    claim: >-
      草稿里「Qwen2.5-72B 与本记录张量名集合相同，所以零结构差异」
    finding: >-
      名字集合相同**不足以**说零结构差异 —— 形状和 dtype 都可能变而名字不变，
      本仓的 Qwen3.5 → Qwen3.6 就是「名字逐个相同、96 个张量的 dtype 变了」。
      所以对 facts/qwen2.5-72b 取了完整清单（37 分片 963 条目）逐条比
      shape 与 dtype，全同；config 逐键比只差 transformers_version；
      HF tally 逐位相同。三条都成立，这一条才敢写
    resolution: confirmed
  - id: R4
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: >-
      草稿里 attention 那条的 benefit 写「GQA 把 KV 压了 8 倍，长上下文的压力因此缓解」
    finding: >-
      同一代上下文从 32768 涨到 131072（×4），只说 8 倍压缩会让读者以为
      满上下文的占用降到 1/8。两件事合起来是 80.00 GiB → 40.00 GiB，**减半**。
      skill 的「跨代比之前两侧 basis 是不是同一套」在这里不是精度问题而是
      上下文长度问题：比「每 token」是 8 倍，比「满上下文」是 2 倍，
      两个数都对但说的不是一件事
    resolution: corrected
    changed_to: >-
      attention 条给每 token 的 8 倍，context 条给满上下文的 2 倍，
      并写明「只做其中一件都不成立」
  - id: R5
    field: params.counting_note
    severity: missing
    claim: >-
      草稿只写了总量几乎不变（+0.58%）
    finding: >-
      总量不变掩盖了构成的大幅变化：注意力 21,476,802,560 → 12,080,414,720（−43.8%），
      FFN 48,318,382,080 → 58,133,053,440（+20.3%）。
      「GQA 省下来的参数被 FFN 吃回去了」是这一代真正的事实，
      而只看 total 看不出来 —— 也正因如此，**GQA 省的是缓存不是带宽**：
      带宽口径的激活参数还涨了 0.59%
    resolution: corrected
    changed_to: >-
      counting_note 与 lineage 的 moe 条都补上两项的变化量与「省缓存不省带宽」这句
