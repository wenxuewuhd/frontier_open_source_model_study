# 机械字段来自 config（official）；形状、参数量与子系统拆分来自完整权重清单
# （38 分片 963 条目，无读失败分片，全 BF16）。head_dim 与 KV 宽度不是 config 字段，
# 由清单的张量形状定（derived）。
id: qwen1.5-72b
family: qwen
kind: llm
display_name: Qwen1.5-72B
released: '2024-01-23'
license: other
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen1.5-72B
    locator: config.json @ 93bac0d1ae83
    accessed: '2026-10-30'
    note: >-
      许可取自 HF tags license:other 与 cardData license_name: tongyi-qianwen
      （不是 apache-2.0 —— Qwen 线到 Qwen2-57B-A14B 才开始发 apache-2.0，
      两者在同一家族里并存，不能从一档推另一档）。
      BF16 发布，38 分片 963 个张量，逐分片读头取全，failed_shards 为空

  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen1.5-72B/blob/93bac0d1ae83d50c43b1793e2d74a00dc43a4c36/README.md
    locator: 'README.md @ 93bac0d1ae83 · Introduction / Model Details'
    accessed: '2026-10-30'
    note: >-
      按本仓「来源优先级：模型卡 / 技术报告 > 厂商参考实现 > 引擎实现」补的一手来源。
      Model Details 一段写明「SwiGLU activation, attention QKV bias, group query
      attention, mixture of sliding window attention and full attention」是 Qwen1.5
      系列的设计面，紧接一句**「For the beta version, temporarily we did not include
      GQA (except for 32B) and the mixture of SWA and full attention」**——
      所以本档既不是 GQA 也没有滑窗，与清单（k/v 都是 [8192, 8192]、
      num_key_value_heads = num_attention_heads = 64）一致。
      Introduction 另写「Stable support of 32K context length for models of all sizes」
      与「an MoE model of 14B with 2.7B activated」（即同代的 qwen1.5-moe-a2.7b）。
      **这份卡没有参数量表、也没有训练精度声明**

hf:
  repo: Qwen/Qwen1.5-72B
  sha: 93bac0d1ae83d50c43b1793e2d74a00dc43a4c36
  last_modified: '2024-04-05T10:44:18.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: main
  successor: qwen2-72b
  # 家族链首，没有 predecessor。照 ds-v2 / glm-4-9b 的做法，这里写「起点带着什么」——
  # 站点的「逐维度演进」在起点要有东西可读。同代的 Qwen1.5-MoE-A2.7B 是从这里分出去的
  # 另一条支线（predecessor 指向本记录），所以 successor 只能写稠密那一支。
  changed_from_predecessor:
    - axis: attention
      text: >-
        **MHA**：64 query 头 / 64 KV 头 / head_dim 128，q/k/v/o 四张都是 [8192, 8192]，
        q/k/v 另各带一张 [8192] 的 bias。80 层同构，没有 GQA、没有共享、没有滑窗
        （config 的 sliding_window 32768 配 use_sliding_window: false，是惰性字段，
        不记进 arch）
      benefit: >-
        这是整条 Qwen 线的缓存基线：每层 2 × 64 × 128 = 16384 元素，
        80 层每 token 1,310,720 元素 —— 32K 满上下文 80 GiB（BF16 兜底口径）。
        后面每一代在注意力上的动作都是相对这个数在压：Qwen2 的 GQA 压 8 倍，
        Qwen3.5 的 3:1 混合把累积 KV 的层数再压到 1/4
    - axis: moe
      text: 没有 MoE，80 层全是稠密 FFN（gate/up/down 三张独立投影，中间维 24576）
      benefit: >-
        带宽口径的激活参数是 71,042,211,840（总量减输入词表），占总参数 98.3% ——
        decode 每 token 要搬 132.33 GiB。MoE 要到同代的 Qwen1.5-MoE-A2.7B 才出现，
        而在稠密这一支上一直到 Qwen3.5-27B 的 dense FFN 都没有变过形态
    - axis: context
      text: 32768（config 的 max_position_embeddings），RoPE theta 1e6
      benefit: >-
        这一代上下文短，所以 MHA 的 2.5 MiB/token 还撑得住（32K 共 80 GiB，
        和 134.65 GiB 的权重同量级）。Qwen2 把上下文放到 128K 的同时换了 GQA，
        两件事必须一起发生 —— 否则 128K × MHA 是 320 GiB
    - axis: precision
      text: BF16 直接发布，config 没有 quantization_config，963 个条目全是 BF16
      benefit: >-
        没有量化 scale 容器、没有低位打包，所以条目数即张量数、numel 即参数数。
        同代另有 AWQ / GPTQ-Int4/Int8 发布，但**量化对象不是这份权重** —— 那三个官方仓
        挂在 Qwen1.5-72B-Chat 下，而本记录跟的是 Base。AWQ 那一档的参数量与 Base 分毫不差，
        所以收进来逐位对账会通过、错误完全隐形；逐仓判据写在
        quantization.official_variants_excluded。GGUF 不在来源阶梯上
    - axis: decoding
      text: 没有 MTP 草稿块（config 无相关键，层号止于 79）
      benefit: >-
        没有草稿侧成本，也没有「草稿块要不要算进 KV 层数」这个口径问题 ——
        那件事从 Qwen3-Next 开始

params:
  total: 7.2e+10
  breakdown:
    dense_ffn: 48318400000.0
    attention: 21476800000.0
    embed: 1245710000.0
    lm_head: 1245710000.0
    norm: 1318912.0
  counting_note: >-
    total 取自模型名（72B），属厂商声明；breakdown 是本仓按完整权重清单
    （38 分片 963 条目，全 BF16、无量化 scale、无低位打包）实测的分项，取 6 位有效数字。
    实测全量 72,287,920,128，与 HF 平台自己从分片头统计的 safetensors tally 逐位相同。
    对 72B 是 +0.40%，在 Gate B 的 2% 容差内。没有草稿块、没有视觉塔，
    唯一的另一种读法是扣掉输入词表：71,042,211,840，对 72B 是 −1.33%，**同样在容差内**
    —— 两种读法都过关、这一档分不出来，所以本记录取全量、不设 excludes。
    同支线的 qwen3-32b 与 qwen2.5-14b-1m 只有「扣掉输入词表」那一种落在容差内，
    因此那两档设了 excludes: [embed]；Qwen3.8 两档扣的又是草稿块与视觉塔。
    **同一个字段在本家族里有三种口径，每份记录各写各的。**
    词表与输出层不共享权重（embed_tokens 与 lm_head 各 1,245,708,288，
    config tie_word_embeddings: false），两项都在 total 里。
    Gate B 的「参数总量」一项拿的是声明值比实测值，而真正不依赖本仓任何一行代码的
    外部核对是 HF 的 safetensors tally。
    权重存储 134.65 GiB。激活参数两个口径：带宽口径 71,042,211,840
    （不含只 gather 一行的输入词表）、可比官方口径 72,287,920,128（含输入词表，
    稠密模型下恰等于全量）。

context:
  max: 32768

arch:
  layers: 80
  hidden: 8192
  vocab: 152064
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: SwiGLU
  position: RoPE theta 1e6，作用在全部 head_dim 维（config 无 partial_rotary_factor）

  attention:
    type: MHA
    num_heads: 64
    num_kv_heads: 64
    head_dim: 128
    head_dim_note: >-
      head_dim 不是这一代的 config 字段，128 = hidden 8192 / num_attention_heads 64，
      由清单印证：q/k/v/o 四张都是 [8192, 8192]。num_key_value_heads 与
      num_attention_heads 同为 64，所以 KV 不做任何分组共享 —— 缓存宽度
      2 × 64 × 128 = 16384 元素/层，是后面所有代际的对照基线。
      q/k/v 各带一张 [8192] 的 bias，o_proj 没有 bias —— 模型卡的 Model Details
      把 attention QKV bias 列为系列设计面（一手来源）；Qwen3 起 bias 整体取消
      （attention_bias: false）
    layer_pattern: 80 层同构，每层产出自己的 KV，无跨层共享、无滑窗、无稀疏

  ffn:
    type: dense
    intermediate: 24576

precision:
  weights_release: [BF16]
  weights_release_scope:
    BF16: { manifest_taken: true, in_precision_table: true }
  quantization:
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（38 分片 963 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空，963 条全是 BF16。所以各子系统 BF16 是全量结论而不只是代表值。
      这一代没有 quantization_config，不存在 scale 张量与量化块

    # 厂商确实另发了官方量化仓，本仓**查过并故意不收** —— 理由逐条写在下面。
    # 不写的话，精度页上这一代是一面 BF16 的墙，而读者无从知道是「查过、量化对象不对」
    # 还是「根本没查」。查过而不收，比没查更需要写出来。
    official_variants_excluded:
      - repo: Qwen/Qwen1.5-72B-Chat-GPTQ-Int4
        dtype: INT4
        quantized_from: Qwen/Qwen1.5-72B-Chat
        params_match: true
        reason: >-
          厂商官方发的量化仓，但**量化对象是 Qwen/Qwen1.5-72B-Chat，不是本记录跟的 Qwen/Qwen1.5-72B** —— 它量化的是兄弟
          checkpoint，不是这份权重，所以精度页那几格照实留 BF16。 **对账闸在这里拦不住假话**：SFT 不改形状，两个仓的参数量逐位相同（都是
          72,287,920,128，HF 的 safetensors total 实测），收进来 `params_total` 那道闸会通过，而 `origin:
          post_quantized`（「同一份权重的事后再量化」）这句话是假的。**闸绿而话错比没有闸更危险，因为下一个人会拿闸当背书。** 要收的话得有第三个 origin
          值，且对账锚换成与 Qwen/Qwen1.5-72B-Chat 对账 —— 那个仓的清单也得取，工作量翻倍，本轮不做。
      - repo: Qwen/Qwen1.5-72B-Chat-AWQ
        dtype: INT4
        quantized_from: Qwen/Qwen1.5-72B-Chat
        params_match: true
        reason: >-
          同上。**这一档最危险**：它的 HF total 与 base 分毫不差（72,287,920,128，而两个 GPTQ 档是 72,293,163,008），收进来
          params_total 那道闸一个字都不会说。 量化对象同为 Qwen/Qwen1.5-72B-Chat，理由见本列表第一条。
      - repo: Qwen/Qwen1.5-72B-Chat-GPTQ-Int8
        dtype: INT8
        quantized_from: Qwen/Qwen1.5-72B-Chat
        params_match: true
        reason: >-
          同上，只是位宽是 8。 量化对象同为 Qwen/Qwen1.5-72B-Chat，理由见本列表第一条。

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    ref:
      kind: modelcard
      url: https://huggingface.co/Qwen/Qwen1.5-72B
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      MHA 下 KV 不做任何共享，每层每 token 2 × 64 头 × 128 = 16384 元素。
      这是本仓记录过的最高的每 token 缓存密度，比同期的 GQA 方案高一个量级。
      32K 上下文就要 80 GiB，和 134.65 GiB 的权重存储同量级 ——
      「长上下文的显存由 KV 主导」这件事在这一代已经成立，只是上下文还短。
    quantified: >-
      16384 元素/层/token × 80 层 = 1,310,720 元素/token；KV 落盘精度未披露，
      按 config 的 torch_dtype=bfloat16 兜底（2 B/元素）得 2,621,440 B/token、
      32K 满上下文 80.00 GiB —— dtype_fallback 口径，不能和按落盘格式算出的
      理论下限比倍数
    visibility: public
  - dimension: weight-bandwidth
    finding: >-
      稠密 72B，除输入词表以外的权重每 token 全部搬运。dense_ffn 一项占总参数 66.8%，
      注意力占 29.7% —— 注意力占比这么高是 MHA 的直接后果（四张 [8192, 8192]
      满方阵），换成 Qwen2 的 GQA 之后同规模下注意力参数掉到 16.6%。
    quantified: >-
      带宽口径激活 71,042,211,840 × 2 B = 132.33 GiB/token；权重存储 134.65 GiB
      （含输入词表）—— 两个口径差输入词表那一项，不要混用
    visibility: public

infra_signals:
  - text: >-
      Qwen 线的起点是常规 MHA + 稠密 FFN，算子侧不需要任何非标准支持
      （带 bias 的 q/k/v 投影 + MHA + SwiGLU + RMSNorm）。它的意义全在于当基线：
      每 token 1,310,720 个 KV 元素这个数，是后面 GQA（Qwen2，/8）、
      混合线性注意力（Qwen3.5，累积 KV 的层数再 /4）两步压缩的分母。
      比较时要用元素口径 —— 本记录与后面几代的 KV 字节都是 dtype 兜底，
      字节那一列互相之间也不可比。
    evidence: judgement
    horizon: settled
    axis: attention

