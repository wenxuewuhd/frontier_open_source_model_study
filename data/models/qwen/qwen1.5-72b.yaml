notes: >-
  Qwen 家族在本仓的谱系起点（2024-01），也是稠密支线的链首。
  同代的 Qwen1.5-MoE-A2.7B 从这里分出 MoE 支线，Qwen1.5-110B 是同结构的更大档位、不另录。
  结构是常规 MHA + 稠密 FFN，没有 MoE、没有 MTP、没有量化、没有混合层。
  层数、宽度、注意力几何、参数量与逐子系统精度都对照完整权重清单核过。
  config 的 sliding_window: 32768 配 use_sliding_window: false，是惰性字段，
  不记进 arch.attention.sliding_window —— 记了会在族谱页上显示成「有滑窗」。

open_questions:
  - >-
    KV cache 的实际落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底，
    bytes_basis 是 dtype_fallback，不能和别人按落盘格式算出来的理论下限比倍数
  - >-
    训练精度没有一手来源：config 的 torch_dtype: bfloat16 说的是发布权重，
    而**模型卡正文本轮已读**（README.md @ 93bac0d1ae83，见 sources[1]）——
    Introduction 与 Model Details 都只讲结构与上下文，没有任何训练精度声明，
    故不填 precision.training
  - >-
    同代的 Qwen1.5-110B（2024-04-25）没有取数核过。按名字是更大的同结构档位，
    若后面要讲 2024 年这一代的规模线，它是该补的一份

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen1.5-72b 核：config 全部键、
    完整权重清单（963 条目逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData /
    createdAt / lastModified / sha 与 safetensors tally。
    缓存乘式的四个因子逐个落到清单里的某个张量形状上（见 R1）。
    参数分项由清单逐项求和，与 breakdown 逐项、与 HF tally 三方比对。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致，外部 tally 逐位相同。
    **原理上核不了的**（清单只有名字、形状与 dtype）：运行期标量（norm_eps、rope_theta、
    attention_dropout）只有 config 一个来源；KV 的实际落盘精度；训练精度。
    后两项在 open_questions 里。
review:
  - id: R1
    field: bottlenecks
    severity: unsupported
    claim: 每 token 1,310,720 个 KV 元素、2,621,440 B、32K 共 80.00 GiB
    finding: >-
      四个因子逐个验过，没有一个是从 config 的头数乘积推的：
      (1) **哪些层** —— 清单里 self_attn.q_proj 恰在 0–79 全部 80 层，层号最大 79，
      没有任何 mtp.* 或借用层号的草稿块，所以 80 是 KV 层数而不只是总层数；
      (2) **每层多宽** —— k_proj 与 v_proj 都是 [8192, 8192]，输出维 8192 = 64 头 × 128，
      K 与 V 各一份故 2 × 8192 = 16384 元素，这是从产出张量的输出维读的，
      与 num_key_value_heads × head_dim 的乘积恰好相等（MHA 下两者本来就该相等）；
      (3) **一个条目覆盖几个 token** —— 无压缩、无滑窗、无跨层共享，1:1；
      (4) **每元素几字节** —— 无一手来源，按 config 的 torch_dtype 兜底 2 B，
      口径标 dtype_fallback 并留了 open question
    resolution: confirmed
  - id: R2
    field: arch.attention.sliding_window
    severity: imprecise
    claim: >-
      scaffold.py 生成的草稿里有 arch.attention.sliding_window，取值 32768
    finding: >-
      config 同时有 sliding_window 32768 与 use_sliding_window false —— 这个值是惰性的，
      Qwen1.5 / Qwen2 一代全线都带着它而从不启用（Qwen3 起 sliding_window 直接是 null）。
      **模型卡把这件事说死了**：「For the beta version, temporarily we did not include
      GQA (except for 32B) and the mixture of SWA and full attention」——
      滑窗与 GQA 都不在本档里，所以这不只是「config 字段惰性」的推断。
      记进 arch 会在族谱页的变化矩阵上显示成「有滑窗 → 取消」，
      而 Qwen 线从来没有用过滑窗局部 KV
    resolution: corrected
    changed_to: >-
      不记 arch.attention.sliding_window，改为在 lineage 的 attention 条与 notes 里
      写明这是惰性字段
  - id: R3
    field: precision.training
    severity: unsupported
    claim: >-
      scaffold 草稿里 precision.training 是 TODO，按 config 的 torch_dtype 填 BF16 很顺手
    finding: >-
      config 只有 torch_dtype bfloat16，说的是发布权重的落盘 dtype，不是训练精度；
      本仓读过的来源里没有这一代的训练精度。同类错在 qwen3.8-2.4t-a95b 的 R4
      与 glm-5.3 上各发生过一次
    resolution: corrected
    changed_to: 不填 precision.training，加一条 open question 说明无一手来源
  - id: R4
    field: license
    severity: unsupported
    claim: license other
    finding: >-
      facts/qwen1.5-72b/repoinfo.json 的 tags 是 license:other，cardData 是
      license other / license_name tongyi-qianwen。**Qwen 线的许可按档位不同**：
      本记录与 qwen1.5-moe-a2.7b、qwen2-72b 是 tongyi-qianwen，
      qwen2-57b-a14b 起到 qwen3.5 全线是 apache-2.0，qwen3.8-2.4t-a95b 又回到
      license_name qwen3.8-max。旗舰那份原先写 apache-2.0 就是从别档抄来的（其 R3），
      所以这个字段每份都单独查了一手
    resolution: confirmed
  - id: R5
    field: params.counting_note
    severity: unsupported
    claim: 实测 72,287,920,128 对声明 72B 是 +0.40%
    finding: >-
      分项逐个重算过：dense_ffn 80 × 3 × 8192 × 24576 = 48,318,382,080；
