  - id: R13
    field: arch.vision.prefill.backbone_linear_gflops_per_token
    severity: wrong
    claim: >-
      114.47 GFLOPs/token，并据此说本档「Qwen 同代四档里塔开销占比最低、
      跨族系 12 份里第二低」（一张图 ≈ 454 个文本 token，比值 1.029）
    finding: >-
      **错了 9.5 倍，而且结论整个反过来。**
      114.47 取的是 2 × (active_params.total 57,871,541,155 − lm_head)，
      而那个 active_params.total 把 **PLE 查表的 51,200,245,795 个参数
      当成了常驻** —— `subsystems.py` 的正则认不出 PLE，把它归进 `other`，
      而 `derive.py` 的常驻名单里有 `other`。
      main 的 e394525 修了两处：PLE 归进 `retrieval`（每 token 只 gather
      少数行、不计激活），`residual` 的 639,631,360 计进常驻。
      于是 active_params.total 从 578.7 亿掉到 **66.7 亿**，
      分母从 114.47 落到 **12.07**，一张图的文本 token 当量从 454 升到 **564**，
      占比从 1.029 升到 **1.279**。
      **方向是反的**：本档不是四档里塔最轻的，是四档里塔最**重**的
      （27B 两档 1.070、397B 档 1.110），12 份里从第 2 低变成第 8。
      塔占一张图 prefill 的 22%，不是 3%。
      两件事值得记在这里：
      (1) **这一条是 R12 自己预告的。** R12 当时把这个偏差写进了
      `open_questions`、并特意把 `prefill.derivation` 标成 `judgement`
      让它进 Gate C，理由就是「正则修好后这两格要重算」。
      偏差没有被当成精修放过去，所以正则一落地就被抓回来了 ——
      这是把已知不确定写成字段而不是埋在数里的直接收益。
      (2) **但预告的方向写错了。** R12 说「114.47 是上界、454 是下界」，
      意思是真值会小一点、换算会大一点 —— 幅度估成了「略」。
      实际是 9.5 倍。根因是当时只看到「PLE 被错分」这个事实，
      没有去看它的参数量占 active_params.total 多少
      （512 亿 / 578.7 亿 = **88%**）。
      **知道一个因子错了，不等于知道它错多少** —— 下次报「上界/下界」
      要同时给出幅度，否则读者会按「不影响结论」处理。
      分母变了之后，本档仍然成立的是 R12 那个判断本身：
      塔与同代三档只差 `merger.linear_fc2` 一项、encoder 侧 1456.5 GFLOPs
      四档相同，所以**占比描述的是主干、不是视觉塔**。
      这次的变化恰恰是最强的一次证明：塔一个字没动，占比从 1.029 跳到 1.279
    resolution: corrected
    changed_to: >-
      backbone_linear_gflops_per_token 114.47 → 12.07、
      image_as_text_tokens 454 → 564；prefill.derivation 重写（给出新的
      active_params 分解，并点明这一格被改过、幅度 9.5 倍）；
      R12 里被推翻的那段加了指向本条的提示、不再可被单独引用；
      对应的 open_question 从「待解」改成「已解 + 结论反转」，
      保留它是因为引过旧值的下游分析要跟着改
