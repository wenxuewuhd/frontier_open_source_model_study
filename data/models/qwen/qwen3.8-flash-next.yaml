    finding: >-
      **技术报告把条目覆盖定下来了，1:1 高估 4 倍。** §2.1 的 Eq. 14–16：
      indexer 的打分对象是**压缩块** k̄_b 而不是 token ——
      「Block-level importance scores I are then obtained through block-causal scoring」，
      「Given a token budget K, each query selects the highest-scoring compressed blocks.
      Since each block contains r tokens, the block budget is K_B = ⌈K/r⌉」，
      prefill 侧「compressing the key sequence by a factor r, reducing indexer cost
      from O(n²) to O(n²/r)」。r = 4（Implementation Details: 「a token budget of
      K = 2048 and a compression ratio of r = 4 ... selects up to 512 complete blocks」）。
      所以缓存里是**每 4 个 token 一个 128 维条目**，每 token 摊 32 个元素：
      index K 1,536 → **384 元素/token**，合计 13,824 → **12,672 元素/token**、
      27,648 → **25,344 B/token**，262144 满上下文 6.75 → **6.19 GiB**，
      索引占随上下文增长部分的比例 11.1% → **3.0%**。
      全局 KV 不变（选中的块要 expanded to original token indices，k/v 仍逐 token 存）。
      这正是 skill 提问顺序的第 4 问「一个条目覆盖几个 token」——
      本仓在 DeepSeek V4 一代靠 compressor.ape 的首维定过同一件事（R30），
      本代权重里没有对应张量，**所以只有厂商的公式能定**；
      当初记成上界没错，错的是后来没去读报告。
      按 main 新定的来源优先级（模型卡 / 技术报告 > 参考实现 > 引擎），这一改是该做的。
    resolution: corrected
    changed_to: >-
      index_kv_dim 由 128 改为 **32**（= 128 / 4，「每 token 摊到的元素数」，
      这样 derive 的「宽度 × 层数」公式得到正确的 384）；
      index_kv_source 把「条目宽度 128」与「每条目 4 个 token」两个因子分开写明，
      并点出填进字段的 32 不是张量宽度；
      kv_sharing.note、bottlenecks 的三处数字、context.extension_method 的 1M 折算、
      以及原 R3 对应的 open question 一并更新。
      **元素数这一改不属于「精度兜底改字节」那一类**：变的是条目覆盖这个结构因子，
      字节侧仍是 dtype_fallback、没有动
