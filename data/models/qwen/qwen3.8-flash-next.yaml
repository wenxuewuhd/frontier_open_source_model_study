    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      三类缓存要分开算：12 层 full attention 的 KV（12,288 元素/token）、
      同 12 层的 index K（**1,536 元素/token，上界**）、
      36 层线性注意力的递归状态（每序列固定 113.62 MiB）。
      索引只占随上下文增长那部分的 11.1% —— 和 DeepSeek V4.1 的结论同向
      （主要压力在主 KV 不在索引），而本仓在那一份上曾把结论写反过。
    quantified: >-
      27,648 B/token（全局 KV 24,576 + index K 3,072，均按模型 dtype 兜底 2 B/元素）
      + 113.62 MiB/序列（36 层 × (48×128×128 矩阵 + 4×10240 短卷积) × 4 B，
      FP32 有 config 声明）。元素口径 13,824 元素/token（可跨代比）。
      262144 满上下文 6.75 GiB + 113.62 MiB。
      **per_sequence 略低**：PLE 块自己那张 conv1d 的状态（163,840 B）没有计入
    visibility: public
  - dimension: weight-bandwidth
    finding: >-
      查表必须排除在带宽口径之外，否则结论会错 8.7 倍：带宽口径的激活参数是
      6,671,295,360（每 token 12.43 GiB），而把 51.2B 的查表算成常驻会得到
      57,871,541,155（107.79 GiB）。表每 token 只读 16 行 × 160 维 = 5,120 B。
      **这正是 data/derived/ 现在的状态** —— 子系统归类认不出 PLE（见 R1）。
    quantified: >-
      带宽口径 6,671,295,360 × 2 B = 12.43 GiB/token；权重存储 335.28 GiB
      （查表一项 95.37 GiB）；查表的每 token 读取 5,120 B（16 行 × 160 维 × 2 B）
    visibility: public
  - dimension: operator-gap
    finding: >-
      一代之内三类新算子：(1) 稀疏索引的打分与选块（融合的 index_qk_proj
      + 单头 index K + budget 2048）；(2) hyper-connections 的低秩混合
      （320 维瓶颈）与 block_inject，作用在 4 倍宽的残差流上；
      (3) n-gram 哈希查表 + 短卷积 + 两处投影。
      前两类有 DeepSeek V4 一代的对照（DSA 与 mHC），第三类在本仓是第一次出现。
    visibility: public
  - dimension: host-io
    finding: >-
      95.37 GiB 的 n-gram 查表每 token 只读 5,120 B，是典型的「大容量、极低带宽」
      对象 —— 可以放主存、放外置存储、或按分片懒加载，不必占 HBM。
      128 个分片的切分本身就便于这种放置。但每次查表是 16 次随机行读取，
      延迟敏感，放在哪一级存储要按 decode 的时延预算算。
    fix: 把查表与权重分开规划；128 片的分片粒度可直接用于放置与预取
    visibility: public

infra_signals:
  - text: >-
      **三类机制同时首发在一个「Flash」小档位上**（稀疏 indexer、hyper-connections、
      n-gram 查表），而同代旗舰 qwen3.8-2.4t-a95b 一个都没有、架构类还是 Qwen3.5 那一套。
      新结构在小档位先落地，所以跟踪下一代时要盯的是这一档而不是旗舰。
    evidence: derived
    horizon: watch
    axis: attention
  - text: >-
      **index K 的缓存宽度是产出张量的输出维（128），不是 index 头数乘积（512）。**
      本代把 index q 与 k 融合成一张 [640, 2560]，640 = 4×128 + 1×128 ——
      读这张张量的形状时要先按 indexer_kv_heads 把两段拆开，
      否则宽度会高估 4 倍（本仓在 DeepSeek V4.1 上按 32×128 算过，那次高估 32 倍）。
    evidence: derived
    horizon: now
    axis: attention
  - text: >-
      **一个占总参数 28.4% 的子系统可以几乎不占带宽。** PLE 查表 95.37 GiB
      而每 token 只读 5,120 B。参数量、权重存储、带宽这三个口径在这一档上
      第一次差到让「模型多大」这个问题没有单一答案：
      按参数量是 180B，按 decode 带宽是 6.67B，按容量要备 335 GiB。
      记录与算子表里凡是引用「模型大小」的地方都要带口径。
    evidence: judgement
    horizon: now
    axis: retrieval

