notes: >-
  Qwen3.8 一代的「Flash-Next」档（2026-08-24），`track: side`，predecessor 取同代旗舰。
  它是整个 Qwen 名单里结构最新的一份：model_type qwen4_exp、
  架构名 Qwen4ExpForConditionalGeneration，三类机制（稀疏 indexer、
  hyper-connections、PLE n-gram 查表）在 Qwen 线都是第一次出现，
  而同代旗舰 qwen3.8-2.4t-a95b 一个都没有（清单里 indexer / hyper_connection /
  ple / ngram 四个关键词全部零命中，架构类仍是 Qwen3_5MoeForCausalLM）。
  混合线性注意力、堆叠专家、MTP、mRoPE、248320 词表这些都沿用 Qwen3.5/3.8 主线。
  **params.breakdown 与 data/derived/ 的 params_by_subsystem 原先不一致**
  （归类正则认不出本代三类新张量名），正则修好后两边逐项相同，
  激活参数也从被高估的 57,871,541,155 回到 6,671,295,360，详见 counting_note 与 R1。

open_questions:
  - >-
    （已关闭）**index K 的条目覆盖由技术报告定下**：Eq. 14–16 的打分对象是压缩块 k̄_b、
    每块 r = 4 个 token，所以每 token 摊 32 个元素、12 层 384 元素/token。
    本记录原先按 1:1 计费得 1,536，是 4 倍上界（见 R10）。
    留在这里是为了说明它怎么关掉的：权重侧确实无从判断（本代没有 compressor.ape
    之类能定比值的张量），**只有厂商的公式能定**
  - >-
    稀疏选块的打分规则、块大小与 budget 2048 的语义（是选中的块数还是 token 数）
    都没有读实现，arch.attention.sparse 只记权重侧能定的三件事
  - >-
    **config 与模型卡都说 PLE 在 layer 2，而清单里它在 layers.1 下**，差一位。
    本记录按清单取 [1]（0 基），最可能的解释是计数起点不同（卡与 config 1 起），
    但没有读实现确认
  - >-
    PLE 块自己那张 conv1d [10240, 1, 4] 的状态（4 × 10240 × 4 B = 163,840 B/序列）
    没有计入 per_sequence —— derive 的公式只建模线性注意力层的 conv。
    这使每序列状态偏低 0.14%（113.62 MiB 对 113.78 MiB）
  - >-
    **模型卡的「4B MTP」与实测的草稿块对不上**：清单里 mtp.* 合计 2,607,150,848
    （−34.8%），加上它共享的两份词表（mtp_use_dedicated_embeddings: false，
    各 635,699,200）是 3,878,549,248（−3.0%），仍在 2% 容差之外。
    另两块（查表 +0.39%、主体 +0.95%）都吻合，而三块之和 180B 与实测只差 18,541
    —— 所以差额像是厂商把某些常驻项算进了 MTP 那一块，本仓没有依据去猜是哪些
  - >-
    n-gram 哈希的算法（怎么从 3-gram 映到 16 个头的行号）没有来源，
    arch.retrieval.mechanism 只写了权重与 config 能支撑的部分
  - >-
    hyper-connections 的混合是作用在 4 份残差流之间还是 4 份与主流之间，
    没有读实现；block_inject_weight [4, 10240] 的 4 对应 hc_count，
    但注入规则未核
  - >-
    KV 与 index K 的实际落盘精度未披露，按模型 dtype 兜底 ——
    **缓存账的两个分量 basis 不同**（per_token 兜底、per_sequence 的 FP32 有声明），
    合计不能当单一口径用
  - >-
    同代有 Qwen3.8-Flash-Next-FP8 仓，本仓没有取它的清单，
    weights_release 只写 BF16，量化配置未知
  - >-
    训练精度没有一手来源：config 的 dtype: bfloat16 说的是发布权重，
    而**模型卡正文本轮已读**（README.md @ de4b8e4d43b9），Model Overview 只列结构与规模，
    没有训练精度声明，故不填 precision.training

  - >-
    **视觉塔自注意力的跨度没有来源。** vision_config 里没有 window_size、
    也没有 fullatt_block_indexes（前代 Qwen2.5-VL 两个都有），所以一张图是
    整图一段注意力还是分窗，config 层面判不了，参考实现本轮没读。
    arch.vision.prefill 因此只装线性项
  - >-
    **「一张图」的厂商默认分辨率未知。** arch.vision.tokens 钉在本仓选的参考
    分辨率 672×672 上，真正的动态分桶规则在 preprocessor_config.json 里，
    那个文件不在 facts/。所以 tokens 下的数只能和同样钉在 672 的其它记录比
  - >-
    **（已解）arch.vision.prefill 的主干分母原先带着 PLE 的错分偏差。**
    上一版分母 114.47 GFLOPs/token 是把 PLE 查表的 512 亿参数当成常驻算进去的。
    main 的 e394525 把 PLE 归进 retrieval（每 token 只 gather 少数行、不计激活）、
    并把 residual 的 6.40 亿计进常驻，active_params.total 从 578.7 亿掉到 66.7 亿，
    分母落到 12.07。两格已按新值重算（564 / 1.279），见 R13。
    **留着这一条是因为结论反过来了**：本档从「四档里塔最轻」变成「四档里塔最重」，
    引过旧值的下游分析要跟着改
  - >-
    视觉塔与主干**落盘层面**是否有 tied weights 未查。weight_map 里两个前缀
    不重名，这只排除了重名；存储共享要看 safetensors 头的数据偏移，本轮没读

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen3.8-flash-next 核：config 全部键
    （含嵌套的 mtp 字典与三类新机制的 9 个键）、完整权重清单（1658 条目逐项
    numel / dtype / 层索引）、repoinfo 的 tags / cardData / sha 与逐 dtype 的
    safetensors tally（BF16 179,999,981,424 + I64 35）。
    缓存账按 skill 的六问逐问答：分三类（全局 KV / index K / 线性状态）、
    产出张量各自是谁、宽度逐层量（12/12 层一致）、条目覆盖（index K 按 1:1 是上界，
    已写明）、每元素字节（兜底 / config 声明两种 basis 分开记）、
    层覆盖（三类的层集合与 full attention 层逐个相同，线性层零命中）。
    参数十三项按**本仓实际子系统归属**手工归类并逐项按形状重算，
    合计与清单求和、与 HF tally 逐位相同；
    与 subsystems.py 归类的差异逐项对出来了（见 R1）。
    派生的激活参数按两种归类各算一遍，差 8.7 倍。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致。
    **原理上核不了的**：稀疏选块与 n-gram 哈希的规则、hyper-connections 的注入规则、
    index K 的条目覆盖、PLE 的层号口径、KV 落盘精度、训练精度，都在 open_questions 里。
review:
  - id: R1
    field: params.breakdown
    severity: miscategorized
    claim: >-
      breakdown 直接用 data/derived/qwen3.8-flash-next.json 的 params_by_subsystem
    finding: >-
      那份派生值有三处错归，第三处有量级实害。
      (1) **PLE 查表**（128 片 × [2500012, 160] = 51,200,245,760，加 3 条 I64 元数据）
      与 PLE 的投影（32,808,960）整块落进 other —— retrieval 正则是
      `engram|memory_table|retriev`，认不出 ngram_embedding / ple_embedding。
      (2) **hyper-connections** 的 attn_hyper_connection.*（316,538,880）落进 attention、
      mlp_hyper_connection.*（316,538,880）落进 dense_ffn，
      于是一个**没有任何稠密 FFN 的模型**显示出 316,538,880 的 dense_ffn ——
      和本仓在 DeepSeek V4-Flash 上修掉的是同一类（那次修完 dense_ffn 正确地消失了）。
      residual 正则是 `\bhc_[a-z]+_(base|fn|scale)\b|^hc_|residual|_res_proj\b`，
      认 V4 一代的 hc_attn_* 那套名字，认不出 *_hyper_connection.*。
      (3) **实害最重的一处**：other 在 active_params 的常驻名单里，
      所以 51.2B 的查表被算成每 token 常驻 —— 带宽口径从 6,671,295,360
      变成 57,871,541,155（**8.7 倍**），每 token 权重搬运量 12.43 → 107.79 GiB，
      arithmetic_intensity 一并失真。而查表每 token 只读 16 行 × 160 维 = 5,120 B
    resolution: corrected
    changed_to: >-
      breakdown 改用本仓实际子系统归属归类（13 项，合计与 HF tally 逐位相同），
      **scripts/lib/subsystems.py 随后也按同一归类修好了**：
      retrieval 正则加 `ngram_embedding|ple_embedding`，
      residual 正则加 `hyper_connection(?!.*norm)`
      （否定前瞻是为了让 *_hyper_connection.hc_norm.weight 继续归 norm），
      derive.py 的常驻名单补进 residual（mHC 与 hyper-connection 的系数每 token 都走）。
      **重跑后派生值与本记录的 breakdown 逐项相同**：
      retrieval 桶 0 → **51,200,245,795**（PLE 查表本体 51,200,245,760 加 3 条 I64 元数据）、
      residual 桶 0 → **639,631,360**、attention 3,000,733,056 → **2,684,194,176**、
      dense_ffn 316,538,880 → **桶消失**、other 51,233,054,755 → **32,808,960**
      （只剩 ple.key_proj / value_proj / conv1d 三张，本就该留在常驻）。
      激活参数 active_params.total **57,871,541,155 → 6,671,295,360**、
      total_with_embed → 7,306,994,560，
      decode_weight_bytes_per_token 115,743,082,377 → 13,342,590,728（107.79 → 12.43 GiB）。
      归类缺口消失后补上 params.total 1.25e+11 与 excludes [retrieval, draft]，
      Gate B 的参数总量 delta **+0.95%**（声明 125e9 对扣减后的实测 126,192,584,816），
      不再是原先那个 +41.9% 的假不一致
  - id: R2
    field: arch.attention.sparse.index_kv_dim
    severity: unsupported
    claim: index K 每层 128 个元素，不是 512
    finding: >-
      index_qk_proj 是**一张融合张量** [640, 2560]，而 640 = indexer_n_heads 4 ×
      indexer_head_dim 128（q 段 512）+ indexer_kv_heads 1 × 128（k 段 128）。
      落进缓存的只有 k 段，所以宽度 128。
      按 index_n_heads × index_head_dim = 512 折算会高估 4 倍；
      本仓在 DeepSeek V4.1 上按 32 × 128 = 4096 折算过，那次高估 32 倍（R27）。
      12/12 层的 index_qk_proj 形状一致，所以「宽度 × 层数」这个乘式成立
    resolution: confirmed
  - id: R3
    field: arch.attention.kv_sharing.note
    severity: imprecise
    claim: >-
      草稿按 1,536 元素/token 写 index K，没有说这是上界
    finding: >-
      config 里有 indexer_compress_ratio 4 与 indexer_budget 2048 两个键，
      任一个都可能让实际条目数低于 1:1：前者像 DeepSeek V4 一代的时序池化
      （那一代每 token 只摊 1/ratio 个条目），后者像固定预算的选块
      （那样 index K 就不是随上下文线性增长，而是每序列有上限）。
      **但本代权重里没有任何压缩器张量**（没有 compressor.ape 之类能定比值的东西），
      所以本仓不替公式折算，按 1:1 记为上界并写明。
      derived JSON 的 per_token_elems_bound 标 exact，那只说明宽度与层数两个因子
      是实测的 —— skill 提问顺序的第 4 问（一个条目覆盖几个 token）在本代没有答案
    resolution: corrected
    changed_to: >-
      kv_sharing.note 写明 1:1 是上界、两个 config 键各自可能的含义、
      以及 derived 的 exact 标记指的是哪两个因子；留 open question
  - id: R4
    field: arch.retrieval.placement
    severity: wrong
    claim: >-
      草稿按 config 的 ple_layer_ids 写「PLE 在主干第 2 层」
    finding: >-
      清单里这些张量的层索引是 **1**
      （model.language_model.layers.1.ple.*，9 个非表张量加 128 个表分片都在这一层下）。
      config 声明 [2]。按本仓约定「config 与权重冲突时权重赢」取 1，
      并写明差一位可能是 0/1 起点的口径差
    resolution: corrected
    changed_to: arch.retrieval.layers 取 [1]，placement 里写明与 config 的冲突
  - id: R5
    field: params.counting_note
    severity: imprecise
    claim: >-
      草稿把 179,999,981,459 当成「180B 声明值」填进了 params.total
    finding: >-
      **模型名里没有任何参数量**（Qwen3.8-Flash-Next），cardData 与 tags 里也没有。
      179,999,981,459 离 180e9 只差 18,541，看着像是按 180B 配的，
      但那是本仓的观察不是厂商声明 —— 填进 total 会让 Gate B 的
      「参数总量」显示成「声明值与实测吻合」，而那是自己比自己
      （glm-4-9b 的 R13 点过这件事）。
      所以 total 与 active_decode 都不填，Gate B 那一项 skip，
      把 180B 这个观察写进 counting_note
    resolution: corrected
    changed_to: 删掉 params.total 与 active_decode，counting_note 写明为什么不填
  - id: R6
    field: arch.attention.linear_state.state_layout_note
    severity: missing
    claim: >-
      草稿只写了线性注意力层的 conv 状态
    finding: >-
      PLE 块里**另有一张 conv1d [10240, 1, 4]**（config 的 ple_conv_kernel_size 4），
      作用在 4 倍宽的残差流上，它同样需要每序列保存一份状态：
      4 × 10240 × 4 B = 163,840 B。derive 的公式只建模线性注意力层的 conv，
      所以 per_sequence 偏低 0.14%（113.62 MiB 对 113.78 MiB）。
      量很小，但「缓存分几类」这一问漏了一类就是漏了 —— 写明比忽略好
    resolution: corrected
    changed_to: >-
      state_layout_note 与 bottleneck 的 quantified 都写明这一项未计入及其大小，
      并留 open question
  - id: R7
    field: platforms
    severity: unsupported
    claim: >-
      草稿里 status 写 supported、precision BF16
    finding: >-
      本仓没有核过任何引擎对 qwen4_exp 的支持状态。
      transformers_version 是 5.8.0.dev0（dev 版），而三类机制都需要对应实现。
      按「没核过就不写」，status 应是 unknown ——
      平台矩阵上一个假的 supported 比空格子更糟
    resolution: corrected
    changed_to: status 改为 unknown 并写 caveat
  - id: R8
    field: arch.attention.output_gate.type
    severity: unsupported
    claim: output_gate_type sigmoid
    finding: >-
      config 有 output_gate_type: sigmoid 这个键（一手来源，标 official）。
      **与同代其余档位不同**：Qwen3.6 / Qwen3.8 的 27B 与 2.4T 旗舰都是 swish，
      Qwen3.5 两档根本没有这个键。所以门的函数形式在 Qwen3.8 一代内部就不一致，
      不能从旗舰推本档
    resolution: confirmed
  - id: R9
    field: sources
    severity: missing
    claim: >-
      本记录原来只有 config.json 一个来源；三类新机制的名字是本仓自己起的
      （「稀疏 indexer」「hyper-connections」「PLE n-gram 查表」），
      budget 2048 的语义、index k 单头共享、MTP 层数、参数量口径全部只靠权重与 config 推
    finding: >-
      本轮按 main 并入的来源优先级规则补读模型卡，七件事有了一手来源：
      (1) **参数量的三块拆分**「125B with 6B activated, plus 51B n-gram embedding
      and 4B MTP」—— 原记录写的「模型名里没有参数量、180B 只是本仓的观察」**不成立**，
      声明值一直在卡上（逐块对照见 counting_note，其中草稿块那一块对不上，留了 open question）；
      (2) 机制的厂商名是 **Qwen Sparse Attention** / **Gated DeltaNet** /
      **Gated Residual**，本记录原来三个名字都是自己起的；
      (3) 「**Indexer Structure: MQA with 4 Query Heads and 1 Shared Key Head**」——
      R2 从张量形状读出的「index k 单头共享、宽度 128」由此有了厂商说法，
      从 derived 变成有卡可依；
      (4) 「**Budget: 512 blocks or 2048 tokens**」定下了 budget 的语义
      （2048 是 token 数、块大小 4），原记录把它列为未知；
      (5) 「**Gated Residual**: Branches 4, Bottleneck Rank 320」对上 hc_count / hc_lowrank；
      (6) 「MTP: **1 layer**」—— 层数不再只有权重一个来源；
      (7) 「N-gram Embedding: 20,000,000 (**bigrams/trigrams** at layer 2)」——
      bigram 与 trigram 都用这件事 config 的 ngram_size 3 看不出来；
      同时卡也说 layer 2，与清单的 layers.1 差一位（见 arch.retrieval.placement）。
      **卡里没有每 token 的缓存字节数**，所以 main 新加的
