notes: >-
  Qwen3.8 一代的「Flash-Next」档（2026-08-24），`track: side`，predecessor 取同代旗舰。
  它是整个 Qwen 名单里结构最新的一份：model_type qwen4_exp、
  架构名 Qwen4ExpForConditionalGeneration，三类机制（稀疏 indexer、
  hyper-connections、PLE n-gram 查表）在 Qwen 线都是第一次出现，
  而同代旗舰 qwen3.8-2.4t-a95b 一个都没有（清单里 indexer / hyper_connection /
  ple / ngram 四个关键词全部零命中，架构类仍是 Qwen3_5MoeForCausalLM）。
  混合线性注意力、堆叠专家、MTP、mRoPE、248320 词表这些都沿用 Qwen3.5/3.8 主线。
  **本记录的 params.breakdown 与 data/derived/ 的 params_by_subsystem 不一致**，
  原因与需要的改动见 counting_note、R1 与交接报告 —— 引用子系统拆分与激活参数时
  以本记录为准。

open_questions:
  - >-
    **index K 的条目覆盖没有核过**：本记录按 1:1 计费得 1,536 元素/token，是上界。
    模型卡把 budget 的语义定下来了（「512 blocks or 2048 tokens」，即块大小 4 个 token），
    而那说的是「选中多少」不是「存多少」；indexer_compress_ratio 4 仍可能让实际条目数更低，
    但权重侧没有任何压缩器张量能定这件事（DeepSeek V4 一代有 compressor.ape
    的首维可以定比值，本代没有对应物）。要钉死得读实现
  - >-
    稀疏选块的打分规则、块大小与 budget 2048 的语义（是选中的块数还是 token 数）
    都没有读实现，arch.attention.sparse 只记权重侧能定的三件事
  - >-
    **config 与模型卡都说 PLE 在 layer 2，而清单里它在 layers.1 下**，差一位。
    本记录按清单取 [1]（0 基），最可能的解释是计数起点不同（卡与 config 1 起），
    但没有读实现确认
  - >-
    PLE 块自己那张 conv1d [10240, 1, 4] 的状态（4 × 10240 × 4 B = 163,840 B/序列）
    没有计入 per_sequence —— derive 的公式只建模线性注意力层的 conv。
    这使每序列状态偏低 0.14%（113.62 MiB 对 113.78 MiB）
  - >-
    **模型卡的「4B MTP」与实测的草稿块对不上**：清单里 mtp.* 合计 2,607,150,848
    （−34.8%），加上它共享的两份词表（mtp_use_dedicated_embeddings: false，
    各 635,699,200）是 3,878,549,248（−3.0%），仍在 2% 容差之外。
    另两块（查表 +0.39%、主体 +0.95%）都吻合，而三块之和 180B 与实测只差 18,541
    —— 所以差额像是厂商把某些常驻项算进了 MTP 那一块，本仓没有依据去猜是哪些
  - >-
    n-gram 哈希的算法（怎么从 3-gram 映到 16 个头的行号）没有来源，
    arch.retrieval.mechanism 只写了权重与 config 能支撑的部分
  - >-
    hyper-connections 的混合是作用在 4 份残差流之间还是 4 份与主流之间，
    没有读实现；block_inject_weight [4, 10240] 的 4 对应 hc_count，
    但注入规则未核
  - >-
    KV 与 index K 的实际落盘精度未披露，按模型 dtype 兜底 ——
    **缓存账的两个分量 basis 不同**（per_token 兜底、per_sequence 的 FP32 有声明），
    合计不能当单一口径用
  - >-
    同代有 Qwen3.8-Flash-Next-FP8 仓，本仓没有取它的清单，
    weights_release 只写 BF16，量化配置未知
  - >-
    训练精度没有一手来源：config 的 dtype: bfloat16 说的是发布权重，
    而**模型卡正文本轮已读**（README.md @ de4b8e4d43b9），Model Overview 只列结构与规模，
    没有训练精度声明，故不填 precision.training
  - >-
    **params.breakdown 与 data/derived/qwen3.8-flash-next.json 的
    params_by_subsystem 不一致，且派生的激活参数偏高 8.7 倍**（见 R1）：
    scripts/lib/subsystems.py 的正则认不出 PLE 查表（落进 other，
    于是被算成常驻）与 hyper-connections（分别落进 attention 与 dense_ffn）。
    本轮按任务约定不改共享脚本（另有家族会话在并行跑），
    需要的最小改动已写进交接报告：retrieval 正则加 ngram_embedding|ple_embedding，
    residual 正则加 hyper_connection。改完要重跑本记录的 derive

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen3.8-flash-next 核：config 全部键
    （含嵌套的 mtp 字典与三类新机制的 9 个键）、完整权重清单（1658 条目逐项
    numel / dtype / 层索引）、repoinfo 的 tags / cardData / sha 与逐 dtype 的
    safetensors tally（BF16 179,999,981,424 + I64 35）。
    缓存账按 skill 的六问逐问答：分三类（全局 KV / index K / 线性状态）、
    产出张量各自是谁、宽度逐层量（12/12 层一致）、条目覆盖（index K 按 1:1 是上界，
    已写明）、每元素字节（兜底 / config 声明两种 basis 分开记）、
    层覆盖（三类的层集合与 full attention 层逐个相同，线性层零命中）。
    参数十三项按**本仓实际子系统归属**手工归类并逐项按形状重算，
    合计与清单求和、与 HF tally 逐位相同；
    与 subsystems.py 归类的差异逐项对出来了（见 R1）。
    派生的激活参数按两种归类各算一遍，差 8.7 倍。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致。
    **原理上核不了的**：稀疏选块与 n-gram 哈希的规则、hyper-connections 的注入规则、
    index K 的条目覆盖、PLE 的层号口径、KV 落盘精度、训练精度，都在 open_questions 里。
review:
  - id: R1
    field: params.breakdown
    severity: miscategorized
    claim: >-
      breakdown 直接用 data/derived/qwen3.8-flash-next.json 的 params_by_subsystem
    finding: >-
      那份派生值有三处错归，第三处有量级实害。
      (1) **PLE 查表**（128 片 × [2500012, 160] = 51,200,245,760，加 3 条 I64 元数据）
      与 PLE 的投影（32,808,960）整块落进 other —— retrieval 正则是
      `engram|memory_table|retriev`，认不出 ngram_embedding / ple_embedding。
      (2) **hyper-connections** 的 attn_hyper_connection.*（316,538,880）落进 attention、
      mlp_hyper_connection.*（316,538,880）落进 dense_ffn，
      于是一个**没有任何稠密 FFN 的模型**显示出 316,538,880 的 dense_ffn ——
      和本仓在 DeepSeek V4-Flash 上修掉的是同一类（那次修完 dense_ffn 正确地消失了）。
      residual 正则是 `\bhc_[a-z]+_(base|fn|scale)\b|^hc_|residual|_res_proj\b`，
      认 V4 一代的 hc_attn_* 那套名字，认不出 *_hyper_connection.*。
      (3) **实害最重的一处**：other 在 active_params 的常驻名单里，
      所以 51.2B 的查表被算成每 token 常驻 —— 带宽口径从 6,671,295,360
      变成 57,871,541,155（**8.7 倍**），每 token 权重搬运量 12.43 → 107.79 GiB，
      arithmetic_intensity 一并失真。而查表每 token 只读 16 行 × 160 维 = 5,120 B。
      本轮按任务约定不改共享脚本，改法写进交接报告
    resolution: open
    changed_to: >-
      breakdown 改用本仓实际子系统归属手工归类（13 项，合计与 HF tally 逐位相同），
      counting_note 与 open_questions 写明与派生值的差异及其两处实害；
      subsystems.py 的最小改动（retrieval 加 ngram_embedding|ple_embedding、
      residual 加 hyper_connection）在交接报告里
  - id: R2
    field: arch.attention.sparse.index_kv_dim
    severity: unsupported
    claim: index K 每层 128 个元素，不是 512
    finding: >-
      index_qk_proj 是**一张融合张量** [640, 2560]，而 640 = indexer_n_heads 4 ×
      indexer_head_dim 128（q 段 512）+ indexer_kv_heads 1 × 128（k 段 128）。
      落进缓存的只有 k 段，所以宽度 128。
      按 index_n_heads × index_head_dim = 512 折算会高估 4 倍；
      本仓在 DeepSeek V4.1 上按 32 × 128 = 4096 折算过，那次高估 32 倍（R27）。
      12/12 层的 index_qk_proj 形状一致，所以「宽度 × 层数」这个乘式成立
    resolution: confirmed
  - id: R3
    field: arch.attention.kv_sharing.note
    severity: imprecise
    claim: >-
      草稿按 1,536 元素/token 写 index K，没有说这是上界
    finding: >-
      config 里有 indexer_compress_ratio 4 与 indexer_budget 2048 两个键，
      任一个都可能让实际条目数低于 1:1：前者像 DeepSeek V4 一代的时序池化
      （那一代每 token 只摊 1/ratio 个条目），后者像固定预算的选块
      （那样 index K 就不是随上下文线性增长，而是每序列有上限）。
      **但本代权重里没有任何压缩器张量**（没有 compressor.ape 之类能定比值的东西），
      所以本仓不替公式折算，按 1:1 记为上界并写明。
      derived JSON 的 per_token_elems_bound 标 exact，那只说明宽度与层数两个因子
