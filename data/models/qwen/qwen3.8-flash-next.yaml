released: '2026-08-24'
license: other
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen3.8-Flash-Next
    locator: config.json @ de4b8e4d43b9
    accessed: '2026-10-30'
    note: >-
      许可取自 HF tags license:other 与 cardData license_name: qwen-community-1.0
      —— 与同代旗舰的 qwen3.8-max 不同，也不是 Qwen3.5 全线的 apache-2.0。
      131 分片 1658 个张量，逐分片读头取全，failed_shards 为空。
      1655 条 BF16 + 3 条 I64（PLE 的 layer_multipliers [3] 与
      ngram_heads_offsets / ngram_heads_vocab_sizes 各 [16]，共 35 个元素）。
      **model_type 是 qwen4_exp、架构名 Qwen4ExpForConditionalGeneration**，
      不是 Qwen3.5 那一套 —— 下一代的架构类在这一份上先落地

  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen3.8-Flash-Next/blob/de4b8e4d43b917e7706784d8bb445c9af86a3540/README.md
    locator: 'README.md @ de4b8e4d43b9 · Model Overview'
    accessed: '2026-10-30'
    note: >-
      按本仓「来源优先级：模型卡 / 技术报告 > 厂商参考实现 > 引擎实现」补的一手来源。
      这份卡给了本记录最多的东西 —— 三类新机制全部有厂商名与声明值（见 R9）：
      「Number of Parameters: **125B with 6B activated, plus 51B n-gram embedding
      and 4B MTP**」、「N-gram Embedding: **20,000,000 (bigrams/trigrams at layer 2)**」、
      「Hidden Layout: **12 × (3 × (Gated DeltaNet → MoE) → 1 × (Qwen Sparse Attention → MoE))**」、
      「**Qwen Sparse Attention**: 24 for Q and 2 for KV, Head Dimension 256,
      Rotary Position Embedding Dimension 64, **Indexer Structure: MQA with 4 Query
      Heads and 1 Shared Key Head**, Indexer Head Dimension 128,
      **Budget: 512 blocks or 2048 tokens**」、
      「Number of Activated Experts: 10 Routed + 1 Shared」「Expert Intermediate Dimension: 640」、
      「**Gated Residual**: Number of Branches **4**, Bottleneck Rank **320**」、
      「MTP: **1 layer**, trained with multi-steps」、
      「Context Length: 262,144 natively and extensible up to 1,000,000 tokens」。
      **卡里没有训练精度声明，也没有每 token 的缓存字节数**
      （所以 kv_sharing.declared_per_token_bytes 这个新字段本档填不了）

  - kind: paper
    url: https://github.com/QwenLM/Qwen3.8-Flash-Next/blob/main/tech_report.pdf
    locator: >-
      tech_report.pdf（28 页，2026-08-26，《On the Design of Qwen3.8-Next Architecture:
      Evaluation, Efficiency, and Training Stability》）· Abstract / Fig. 1 /
      §2.1 QSA（Eq. 14–16 与 Implementation Details）/ §2.2 GR 的 Inference Efficiency /
      §2.3 N-gram Embedding
    accessed: '2026-10-30'
    note: >-
      按本仓来源优先级，技术报告与模型卡同为第一档。这份报告定下了三件本记录原来
      只能当上界或判断的事（见 R10）：**index K 的条目覆盖**（Eq. 14–16：indexer 打分的是
      压缩块 k̄_b，每块 r = 4 个 token，所以缓存里是每 4 个 token 一个 128 维条目）、
      **n-gram 表确实放在加速器之外**（Abstract 的「held off the accelerator」与 Fig. 1 的
      「scales capacity off the accelerator via host-memory prefetching」）、
      **残差状态支持 FP8 存储**（§2.2：「Storing the branches in FP8 halves the bytes moved
      for the residual state relative to BF16」）。
      报告另给一条厂商性能声明：「At a context length of 1M, QSA is 7.6× faster than dense
      attention in prefill and 4.9× faster in decode **at the kernel level**」——
      kernel 级、未给硬件与引擎，本仓不填进 performance。
      **报告里没有任何每 token 缓存字节数**，所以缓存侧仍无外部锚

hf:
  repo: Qwen/Qwen3.8-Flash-Next
  sha: de4b8e4d43b9ed57f2d28f1e9a7d8e20fe6a14b2
  last_modified: '2026-08-27T06:08:11.000Z'
  pipeline_tag: image-text-to-text
  gated: false

lineage:
  track: side
  predecessor: qwen3.8-2.4t-a95b
  changed_from_predecessor:
    - axis: attention
      text: >-
        **稀疏 indexer 第一次进入 Qwen 家族**：12 层 full attention 各有一个
        self_attn.indexer.index_qk_proj [640, 2560] 与 q/k_layernorm [128]。
        640 是 **q 与 k 融合**：index q 4 头 × 128 = 512，index k **1 头** × 128 = 128
        （config 的 indexer_n_heads 4 / indexer_kv_heads 1 / indexer_head_dim 128）。
        config 另有 indexer_budget 2048 与 indexer_compress_ratio 4。
        混合比例仍 3:1（36 线性 + 12 full），线性注意力与旗舰同构
        （in_proj_qkv [10240, 2560] + in_proj_z [6144, 2560]，value 头 48）
      benefit: >-
        **index K 的缓存宽度是 128，不是 indexer_n_heads × indexer_head_dim = 512**
        —— 它在 4 个 index 头之间 MQA 共享，产出它的张量输出维只有 128。
        按头数乘积折算会高估 4 倍（本仓在 DeepSeek V4.1 上按 32×128 折算过，
        那次高估 32 倍）。每 token 的 index K 上界 = 128 × 12 层 = 1536 元素，
        占总缓存 13,824 元素的 11.1% —— 主要缓存压力仍在全局 KV，不在索引。
        compress_ratio 4 与 budget 2048 都可能让实际条目数更低，
        但权重侧没有任何张量能定这件事（见 open_questions）
    - axis: residual
      text: >-
        **hyper-connections**：config 的 hc_count 4 / hc_lowrank 320。
        残差流宽度变成 4 × hidden = **10240**，每层有两套混合权重
        （attn_hyper_connection 与 mlp_hyper_connection，各含
        block_inject_weight [4, 10240]、input_mix_weight_down [320, 10240]、
        input_mix_weight_up [10240, 320]、hc_norm [10240]），
        另有模型级的 model.hyper_connection_mixer。合计 639,631,360 参数（0.36%）
      benefit: >-
        **激活显存按 4 倍残差流算，不是按 hidden 算**：每 token 的残差流从
        2560 变成 10240 个元素，prefill 的峰值激活与所有逐层缓冲区都要跟着放大。
        参数量代价可以忽略（0.36%），算子代价是每层两次低秩混合（320 维瓶颈）
        加一次 block_inject。这与 DeepSeek V4 一代的 mHC 是同类机制
    - axis: retrieval
      text: >-
        **PLE n-gram 查表**：主干**第 1 层**（清单的层索引）挂一张分成 128 片的
        n-gram 嵌入表，每片 [2500012, 160]，共 320,001,536 行、
        **51,200,245,760 参数 —— 占总参数 28.4%**。
        另有 ple.key_proj [10240, 2560]、value_proj [2560, 2560]、
        conv1d [10240, 1, 4]、三张 [10240] 的 norm，以及 3 条 I64 的索引元数据。
        config: ngram_size 3、ngram_vocab_size_base 2e7、split_ngram_parts 128、
        heads_per_ngram 8、ple_embed_dim 2560、ple_conv_kernel_size 4。
        **config 的 ple_layer_ids 是 [2]，而清单里这些张量在 layers.1 下** ——
        config 与权重冲突，按本仓约定取权重
      benefit: >-
        每 token 只读 16 行 × 160 维（16 个 n-gram 头 × 160 = 2560 = ple_embed_dim），
        即 **5,120 B/token**（BF16），而表本身是 95.4 GiB。
        所以它在容量上是第三大项、在带宽上几乎为零 ——
        **必须排除在 decode 带宽口径之外**，否则激活参数会从 6.67B 变成 57.87B
        （8.7 倍高估，见 counting_note 与 R1）。
        部署上这是一张可以放在主存甚至外置 KV 存储里的表，与权重分开规划
    - axis: moe
      text: >-
        512 专家 top-10、共享专家 1 个、专家中间维 640（旗舰是 2048），
        **主干与草稿块都是堆叠存储**（mlp.experts.gate_up_proj [512, 1280, 2560]
        与 down_proj [512, 2560, 640]，1280 = 2 × 640）——
        与旗舰一致，而比 Qwen3.5-397B-A17B 的「主干堆叠、草稿逐专家」已经统一
      benefit: >-
        专家总量 120,795,955,200（占 67.1%）而每 token 只激活 10/512，
        激活的专家部分 2,359,296,000。grouped GEMM 吃 3 维权重，主干与草稿同一条路径
    - axis: scale
      text: >-
        2.45T 总 / A95B → 180.0B 总 / 本记录按带宽口径 6.67B。
        层数 92 → 48，hidden 8192 → 2560，词表 248320 不变
      benefit: >-
        这是「Flash」档：总量降到旗舰的 7.4%，而三类新机制（稀疏索引、
        hyper-connections、n-gram 查表）都在这一档上首发 ——
        新结构在小档位先落地，是跟踪下一代时要盯的信号

params:
  total: 1.25e+11
  excludes:
  - retrieval
  - draft
  breakdown:
    expert: 120796000000.0
    retrieval: 51200200000.0
    attention: 2684190000.0
    draft: 2607150000.0
    residual: 639631000.0
    embed: 635699000.0
    lm_head: 635699000.0
    vision: 448931000.0
    shared_expert: 236052000.0
    router: 62914560.0
    other: 32808960.0
    indexer: 19660800.0
    norm: 1037824.0
  counting_note: >-
    模型名里没有参数量，但**模型卡把它拆成三块写出来了**：
    「125B with 6B activated, **plus 51B n-gram embedding and 4B MTP**」。
    实测全量 **179,999,981,459**，与 HF 平台自己从分片头统计的 safetensors tally
    逐位相同，而 125 + 51 + 4 = 180 —— 三块之和与实测对得上（差 18,541）。
    逐块对照：**n-gram 查表** 实测 51,200,245,795 对 51B 是 **+0.39%**；
    **主体** 实测 total − 查表 − 草稿块 = 126,192,584,816 对 125B 是 **+0.95%**；
    **草稿块** 实测 2,607,150,848 对 4B 是 **−34.8%**，加上它共享的两份词表
    （输入 + lm_head 各 635,699,200）才是 3,878,549,248、对 4B 是 −3.0%，仍出容差
    —— 草稿块那一块的口径没对上，留了 open question。
    **params.total 填的是模型卡那一块的「125B」，配 excludes [retrieval, draft]** ——
    声明值只覆盖主体，不含 51B 的 n-gram 查表与 4B 的 MTP 草稿块。
    Gate B 按 excludes 扣减后得 126,192,584,816，delta **+0.95%**，在容差内。
    **原先这两个字段是空的**：那时 subsystems.py 的 retrieval 桶在本档是空的
    （查表落进 other，见 R1），填 125e9 会让 Gate B 算出 177,392,830,611、
    报 +41.9% 的假 MISMATCH。归类缺口已修（R1），所以这两个字段补上了。
    **「6B activated」对得上的是「带宽口径减 lm_head」**：
    6,671,295,360 − 635,699,200 = 6,035,596,160，对 6B 是 **+0.59%**；
    不减 lm_head 是 +11.2%、再含输入词表是 +21.8%。
    这与 Qwen 卡上「Non-Embedding」一贯扣两份词表的办法同向
    （见 qwen3-32b 与 qwen2.5-14b-1m 的 counting_note）。
    **breakdown 是本仓按实际子系统归属的归类，13 项，合计与清单求和、
    与 HF tally 逐位相同，且与 data/derived/qwen3.8-flash-next.json 的
    params_by_subsystem 逐项相同**。
    **原先两边不一致**：scripts/lib/subsystems.py 的正则认不出本代的三类新张量名，
    PLE 查表与 PLE 的投影（合计 51,233,054,755）整块落进 other、
    attn_hyper_connection.* 落进 attention、mlp_hyper_connection.* 落进 dense_ffn
    （于是一个没有稠密 FFN 的模型显示出 316,538,880 的 dense_ffn），
    派生的激活参数又把 51.2B 的查表算成常驻，带宽口径 6,671,295,360 被算成
    57,871,541,155（8.7 倍）。正则已修（见 R1），现在 dense_ffn 桶消失、
    retrieval 桶 51,200,245,795、residual 桶 639,631,360、
    other 只剩 PLE 的三张投影 32,808,960，激活参数两边一致。
    激活参数两个口径（按本记录的归类）：带宽口径 **6,671,295,360**
    = 激活专家 2,359,296,000 + 常驻 4,311,999,360
    （注意力 2,684,194,176 + 残差系数 639,631,360 + 共享专家 236,052,480
    + lm_head 635,699,200 + router 62,914,560 + indexer 19,660,800
    + PLE 投影 32,808,960 + norm 1,037,824）；
    可比官方口径 7,306,994,560（含输入词表）。
    **n-gram 查表、视觉塔与草稿块都不在带宽口径里**：查表每 token 只读 16 行
    （5,120 B），视觉塔与草稿块不在主路径上。
    权重存储 335.28 GiB（其中查表一项 95.37 GiB）。

context:
  max: 262144
  train_native: 262144
  extension_method: >-
    模型卡写「262,144 natively and extensible up to 1,000,000 tokens」
    （注意是 1,000,000，Qwen3.5 两档与 Qwen3-Next 写的是 1,010,000），
    没有说用什么方法扩。按 1,000,000 部署时本记录的 per_token 数要乘 3.81
    （6.19 GiB → 23.60 GiB），每序列状态不变。
    技术报告在 1M 这一档给的是速度而不是容量：
    「QSA is 7.6× faster than dense attention in prefill and 4.9× faster in decode
    at the kernel level」—— kernel 级、未给硬件与引擎，本仓不填进 performance

arch:
  layers: 48
  hidden: 2560
  vocab: 248320
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU
  position: >-
    interleaved mRoPE，theta 1e7，partial_rotary_factor 0.25（只对 1/4 维度加 rope）：
    256 × 0.25 = 64 维即 32 个频率对，mrope_section [11, 11, 10] 正好分完 32 对

  attention:
    type: hybrid
    num_heads: 24
    num_kv_heads: 2
    head_dim: 256
    head_dim_note: >-
      full attention 层的 q_proj 是 [12288, 2560]，12288 = 2 × 24 头 × 256 ——
      输出维翻倍，一半是 query、一半是输出门（config 的 output_gate_type: sigmoid，
      **本代是 sigmoid 而 Qwen3.6/3.8 的其余档位是 swish**）。
      o_proj 入口 6144 = 24 × 256 只对应 query 那一半。
      k_proj 与 v_proj 都是 [512, 2560]（512 = 2 × 256），
      全局 KV 宽度按它们的输出维算：每层 2 × 512 = 1024 元素。
      另有每层 q_norm [256] 与 k_norm [256]，以及 indexer 自己的
      q_layernorm / k_layernorm [128]，都归 norm 子系统
    partial_rotary_factor: 0.25
    layer_pattern: >-
      3:1 linear:full，full attention 落在层号 ≡ 3 (mod 4) 上（config 的 layer_types
      列表 48 项与清单一致：self_attn.q_proj 在 3/7/…/47 共 12 层，
      linear_attn.* 在其余 36 层）。**indexer 恰好只在这 12 层上**
      （index_qk_proj 的层集合与 full attention 的层集合逐个相同，
      线性层没有 indexer），另有草稿块 1 层也带 indexer
    output_gate:
      enabled: true
      type: sigmoid
    sparse:
      mechanism: >-
        **Qwen Sparse Attention**（厂商名，模型卡 Model Overview）。
        每个 full attention 层用一个融合的 index_qk_proj 产出 index q（4 头 × 128）
        与 index k（1 头 × 128）—— 卡把这个结构直接写成
        「**Indexer Structure: MQA with 4 Query Heads and 1 Shared Key Head**」，
        与本仓从张量形状读出的 640 = 4 × 128 + 1 × 128 一致。
        预算也有一手来源：「**Budget: 512 blocks or 2048 tokens**」，
        即 config 的 indexer_budget 2048 是 **token 数**、对应 512 个块
        （块大小 2048 / 512 = 4 个 token，与 indexer_compress_ratio 4 一致）。
        **选块规则取自技术报告 §2.1（Eq. 14–16）**：对查询 token i 与压缩块 b，
        把各 indexer 头的 ReLU(⟨q, k̄⟩) 相加得块级重要度 I_ib，只对「已完整观测」的块打分
        （block-causal）；给定 token 预算 K 取 top-K_B 个块（K_B = ⌈K/r⌉ = 512），
        再把选中的块展开回原 token 下标、截到 K 个，并**总是加上最后一个未满块的 tail token**。
        prefill 侧「compressing the key sequence by a factor r」把 indexer 的代价
        从 O(n²) 降到 O(n²/r)
      index_n_heads: 4
      index_head_dim: 128
      index_kv_dim: 32
      index_kv_source: >-
        条目宽 128（index_qk_proj 的 k 段输出维）÷ 每条目 4 个 token = 每 token 摊 32；
        **填的是摊到的元素数、不是张量宽度**，两个因子的来源见 kv_sharing.note
      block_size: 4
      selected_blocks: 512
      index_topk: 2048
    kv_sharing:
      index_kv_source_layers: [3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43, 47]
      layer_coverage: >-
        三类产出的层覆盖都是同一组 12 层（full attention 的 k/v、indexer 的 index k），
        线性注意力的 36 层不产出任何随上下文增长的缓存。
        主干口径 48 层 + 1 草稿块；草稿块带全套 full attention 与 indexer，
        开草稿侧时两类都要按 13 层算
      note: >-
        index K 的两个因子分开说。
        **(1) 条目宽度 128** —— index_qk_proj [640, 2560] 的 k 段输出维
        （640 = q 4 × 128 + k 1 × 128；技术报告 §2.1 的 Implementation Details 写成
        「an MQA structure with four query heads and one shared key head」）。
        按 index_n_heads × index_head_dim = 512 折算会高估 4 倍。
        **(2) 条目覆盖：每 4 个 token 一个条目**，由技术报告定下（Eq. 14–16，
        indexer 打分的对象是压缩块 k̄_b、块大小 r = 4）。
        两者合起来：每 token 摊 128 / 4 = 32 个元素、12 层合计 384 元素/token。
        **本记录原先按 1:1 计费得 1,536，是 4 倍上界**（见 R10）。
        另有一个有界余项：最后一个未满块的 token 级 index K（报告说这些 tail token
        「always included」），≤ 3 × 128 元素/层、12 层合计 ≤ 4,608 元素/序列，
        本记录未计入 per_sequence。
        模型卡的「Budget: 512 blocks or 2048 tokens」说的是「选中多少」而不是「存多少」，
        它不改变缓存条目数 —— 真正折算条目的是压缩比，而权重侧确实看不出它
        （本代没有 compressor.ape 之类的张量，这也是当初只能记上界的原因）。
        全局 KV 不受影响：QSA 选的是「注意哪些 token」，被选中的块要
        「expanded to their original token indices」，所以 k/v 仍按 token 逐个存
    hybrid:
      layer_types_count:
        linear: 36
        full: 12
      interval: 4
      note: >-
        12 层 full attention 的 KV 与 index K 随上下文线性增长，
        36 层线性注意力只带每序列固定的递归状态。
        以上层数都是主干口径（48 主干层 + 1 草稿块）：草稿块 mtp.layers.0 带一套与主干
        full attention 同名的 q/k/v/o 投影与 indexer、没有 linear_attn，
        所以开草稿侧时累积缓存的是 13 层，线性状态仍是 36 层。
        本记录与 data/derived/ 都按主干口径记账
    linear_state:
      mechanism: 门控线性注意力 + 短卷积
      num_key_heads: 16
      num_value_heads: 48
      key_head_dim: 128
      value_head_dim: 128
      conv_kernel_dim: 4
      state_dtype: FP32
      state_layout_note: >-
        与同代旗舰同构，四个因子都钉在清单的形状上：状态头数 48（= value 头数，
        每层 A_log [48] 与 dt_bias [48]）；conv 通道数 10240
        = 2 × 16 × 128 + 48 × 128，36/36 层 conv1d.weight 都是 [10240, 1, 4]，
        与 in_proj_qkv [10240, 2560] 的输出维相等。
        状态精度有一手来源：config 的 mamba_ssm_dtype: float32。
        **另有一处本代独有的 conv 状态**：PLE 块里还有一张 conv1d [10240, 1, 4]
        （ple_conv_kernel_size 4，作用在 4 × hidden 的残差流上），
        它也要每序列保存 4 × 10240 个位置 —— 一层 163,840 B（FP32），
        本记录的 per_sequence 没有把它计入（derive 的公式只建模线性注意力层），
        所以每序列状态是**略低的**，差 0.14%

  ffn:
    type: moe
    layer_pattern: >-
      48 层全是 MoE 层，线性层与 full 层的 FFN 形态相同。
      **这个模型没有任何稠密 FFN**。派生 JSON 里原先显示的 dense_ffn 316,538,880
      全部是被错归的 mlp_hyper_connection 残差系数，归类修好后该桶已消失（见 R1）

  moe:
    routed_experts: 512
    shared_experts: 1
    top_k: 10
    intermediate: 640
    routing: 带辅助损失（router_aux_loss_coef 0.001）
    balance: aux-loss
    storage_note: >-
      主干与草稿块都是堆叠存储：每层一个 mlp.experts.gate_up_proj [512, 1280, 2560]
      （1280 = 2 × 640，gate 与 up 融合）与一个 down_proj [512, 2560, 640]。
      草稿块同样是堆叠的 —— Qwen3.5-397B-A17B 那一代「主干堆叠、草稿逐专家」
      的过渡态到这里已经统一（Qwen3.6 起就是如此）。
      grouped GEMM 吃 3 维权重，EP 按首维切

  retrieval:
    mechanism: >-
      PLE n-gram 嵌入查表。模型卡写「N-gram Embedding: 20,000,000
      (**bigrams/trigrams** at layer 2)」——「bigram 与 trigram 都用」这件事
      config 只给 ngram_size 3 一个数，看不出来。
      按 n-gram 哈希到 16 个 n-gram 头上，
      每头查一行 160 维，拼成 ple_embed_dim 2560 后经 key_proj / value_proj
      与一张短卷积并入残差流。表按 split_ngram_parts 128 分片存放，
      每片 [2500012, 160]
    layers: [1]
    table_rows: [320001536]
    entry_dim: 160
    lookup_bytes_per_token: 5120.0
    projection: >-
      ple.key_proj [10240, 2560] 与 ple.value_proj [2560, 2560]，
      另有 ple.conv1d [10240, 1, 4] 与三张 [10240] 的 norm
      （norm_conv / norm_key / norm_query）。10240 = 4 × hidden，
      即投影作用在 hyper-connections 加宽后的残差流上
    placement: >-
      **放在加速器之外，靠主存预取** —— 这是厂商自己的设计，不是本仓的建议：
      技术报告 Abstract 写「additional 51B parameters of n-gram embedding tables
      **held off the accelerator**」，Fig. 1 的图注写「An n-gram embedding layer at Layer 2
      scales capacity **off the accelerator via host-memory prefetching**」，
      §2.3 给了理由「Because embedding tables are sparsely accessed and
      **deterministically addressed**, they can be scaled with negligible additional
      per-token computation and stored in off-accelerator storage」。
      所以这 95.37 GiB 不占 HBM，**也不该计进权重存储的显存预算** ——
      本记录的「权重存储 335.28 GiB」是清单全量，用于显存规划时要先减掉查表那 95.37 GiB。
      层号：**清单里这些张量在 layers.1 下，而 config 的 ple_layer_ids 与模型卡、
      报告 Fig. 1 都说 layer 2**。两边差一位，最可能是计数起点不同（那三处按第 2 层、
      1 起；清单按索引 1、0 起）。本记录的 layers 取清单的 [1]（0 基，
      与本仓其他层集合口径一致），没有读实现确认这个解释

  residual:
    type: >-
      **Gated Residual**（厂商名，模型卡写「Gated Residual: Number of Branches 4,
      Bottleneck Rank 320」）；权重里的名字是 *_hyper_connection.*，
      与 DeepSeek V4 一代的 mHC 是同类机制
    multiplier: 4
    coef_proj: >-
      每层两套：attn_hyper_connection 与 mlp_hyper_connection，各含
      block_inject_weight [4, 10240]、input_mix_weight_down [320, 10240]、
      input_mix_weight_up [10240, 320]、hc_norm [10240]；
      另有模型级 model.hyper_connection_mixer（hc_norm + down/up）。
      合计 639,631,360 参数
    note: >-
      残差流宽度 = hc_count 4 × hidden 2560 = **10240**。
      参数代价可以忽略（0.36%），真正的影响在**激活显存**：
      每 token 的残差流元素数是 hidden 的 4 倍，prefill 峰值与逐层缓冲区都要跟着放大。
      **厂商对此有两处 decode 侧的处理**（技术报告 §2.2 的 Inference Efficiency）：
      (1) 「the residual state supports **FP8 storage**」——「Storing the branches in FP8
      **halves the bytes moved** for the residual state relative to BF16, with almost no
      loss in quality」，理由是 GR / gated attention / GDN 的门都把写进残差流的量级限住了；
      (2) decode 时「the GR **drops the branch-mixing operator** H_res」，
      且读写各融合成一个 kernel、group RMSNorm 折进读，使加宽后的流每块每方向只走一遍。
      **这是激活侧的字节，不是缓存**，不进 kv_cache 账。
      这与 DeepSeek V4 一代的 mHC 是同类机制；本仓的子系统归类正则原先只认
      hc_attn_* / hc_ffn_* 那套名字，已补上 *_hyper_connection.*（见 R1）

  decoding:
    mtp_layers: 1
    mtp_layers_note: >-
      config 有两处声明且一致：mtp_num_hidden_layers: 1 与嵌套的 mtp 字典
      （hybrid: true、layer_types: ["full_attention"]、num_hidden_layers: 1、
      rope_theta 1e7）。清单一致：mtp.layers.0 一个块，块内是 full attention
      + indexer + 堆叠的 512 专家 MoE + 共享专家 + router + hyper_connection，
      块外有 mtp.fc_embedding / fc_hidden（**本代拆成两张**，旗舰那一代是一张 mtp.fc）、
      pre_fc_norm_embedding / pre_fc_norm_hidden、mtp.hyper_connection_mixer。
      共 31 条目、2,607,150,848 参数（主干的 1.4%）。
      技术报告 §2.1 的 Implementation Details 另给两件事：
      「all full-attention layers **in the backbone and MTP module** are replaced with QSA」
      （与清单一致 —— mtp 块下确实有 indexer 的三个张量），
      以及「multi-step MTP **reuses top-k indices across prediction steps**」
      （跟随 GLM-5 的做法），即草稿侧的多步不重跑 indexer 打分。
      报告 Tab. 4 给四步投机解码下的平均接受长度：带 QSA 4.07、全注意力 4.06

  vision:
    encoder: Qwen3.8 vision tower
    layers: 27
    hidden: 1152
    num_heads: 16
    intermediate: 4304
    patch_size: 16
    spatial_merge_size: 2
    temporal_patch_size: 2
    out_hidden: 2560
    params: 448931056.0
    fusion: >-
      patch merge 后投影到主干 hidden：merger.linear_fc1 [4608, 4608] →
      linear_fc2 [2560, 4608]。deepstack_visual_indexes 是空列表，
      只在输入侧并入。与 Qwen3.5 两档的视觉塔同构，只有 out_hidden 不同

    tokens:
      reference_resolution: 672x672
      patch_grid: 42x42
      encoder_tokens: 1764
      llm_tokens: 441
      compression_ratio: 4
      compression_stage: >-
        merger 入口一步到位：2×2 相邻 patch 在通道维拼接（linear_fc1 的输入维
        4608 = 1152 × 4 就是这个拼接），**压缩在 projector 之前**，
        所以两层 merger 的 GEMM 只跑 441 次而不是 1764 次
      dynamic_resolution: true
      derivation: >-
        patch 16（config.vision_config.patch_size，并由
        model.visual.patch_embed.proj.weight [1152, 3, 2, 16, 16] 的后两维印证）、
        2×2 空间合并（config 的 spatial_merge_size 2，由 merger.linear_fc1
        输入维 4608 = 1152 × 4 印证）、时间维 1（patch_embed 是 Conv3d、
        时间核 2，单张静态图补成 2 帧才喂得进去，所以一张图 1 个时间 patch）。
        672 / 16 = 42，42² = 1764；42 / 2 = 21，21² = 441。
        塔与 Qwen3.5 两档只差 merger.linear_fc2（本轮逐名逐形状比过 333 个张量），
        所以 encoder 侧的 token 数与 FLOPs 跨四档相同。
        672×672 是本仓为跨模型比较选的参考分辨率，不是厂商默认值
      scope_note: >-
        只覆盖单张静态图。视频每 2 帧并成 1 个时间 patch，
        所以 t 帧的 encoder token 数是 1764 × ⌈t/2⌉
    prefill:
      encoder_linear_gflops: 1456.5
      projector_linear_gflops: 29.13
      backbone_token_budget: 441
      backbone_linear_gflops_per_token: 12.07
      image_as_text_tokens: 564
      attention_excluded: >-
        被排除的是 encoder 自注意力的 QK^T 与 AV，形式
        4 × n² × hidden × layers。跨度定不下来：vision_config 里没有
        window_size、也没有 fullatt_block_indexes（前代 Qwen2.5-VL 有），
        参考实现本轮没读。按整图一段取 n = 1764 约 387 GFLOPs
      derivation: >-
        encoder 线性项 = 2 × 1764 × (patch_embed 1,769,472 + 27 层 ×
        每层 15,224,832 = 411,070,464) = 1,456,499,294,208，与同代三档相同。
        projector 线性项 = 2 × 441 × (4608² + 2560 × 4608) = 29,132,587,008
        —— 出口 2560 是四档里最窄的，这一项比 27B 档的 39.54 小 26%。
        主干分母 = 2 × (active_params.total 6,671,295,360 −
        active_params.lm_head 635,699,200) = 12,071,192,320；
        **不能用 flops.linear_per_token 13,342,590,720**，那一项含 lm_head。
        换算 = 441 + 1,485,631,881,216 / 12,071,192,320 = 441 + 123.1 = 564。
        **本档的塔开销占比是 1.279，在 12 份里排第 8**（塔值 123 个位置当量、
        占一张图 prefill 的 22%）—— 四档里**最高**的一档，不是最低。
        根因是主干小：扣掉 lm_head 后每 token 只有 12.07 GFLOPs，
        是四档里最小的（27B 两档 48.71、397B 档 30.63）。
        **这一格在 2026-10-30 被改过一次，改动幅度 9.5 倍，见 R13。**
        上一版把分母写成 114.47、换算写成 454，并据此说它是「四档最低、
        12 份里第二低」—— 那是因为 PLE 查表的 512 亿参数被
        `subsystems.py` 的正则归进 `other`、而 `other` 计进激活参数。
        main 的 e394525 把 PLE 归进 `retrieval`（每 token 只 gather 少数行、
        不计激活）、同时把 `residual` 的 6.40 亿计进常驻，
        于是 active_params.total 从 578.7 亿掉到 66.7 亿。
        **结论整个翻过来了**：它不是塔最轻的一档，是四档里塔最重的一档
    separability:
      weight_prefix: >-
        model.visual.（333 个张量，含 merger）；主干在 model.language_model.
        与 mtp. / lm_head.。两个前缀不相交
      shard_isolation: mixed
      shard_note: >-
        实测 index 的 weight_map：333 个视觉张量全部落在**第 1 个分片**
        model-00001-of-00131，同片只有 16 个非视觉张量
        （model.language_model 的 hyper_connection_mixer 与第 0 层的注入权重）。
        131 个分片里只有这一个含视觉张量，且混进来的只有 16 个 ——
        **同代四档里最接近「单文件装下一座塔」的一档**
        （对比：qwen3.8-27b 同片混 59 个、qwen3.5-27b 混 503 个、
        397B 档被切到两个分片）。但严格说仍是 mixed，不是 dedicated
      cross_prefix_sharing: >-
        weight_map 的名字里没有任何一个同时匹配 model.visual. 与主干前缀，
        即没有重名共享。落盘层面的 tied weights 要看数据偏移，本轮没读

precision:
  weights_release: [BF16, FP8_E4M3]
  weights_release_scope:
    BF16: { manifest_taken: true, in_precision_table: true }
    FP8_E4M3:
      manifest_taken: true
      in_precision_table: true
      repo: Qwen/Qwen3.8-Flash-Next-FP8
      note: >-
        厂商另发的官方量化仓，本轮取了完整清单，逐子系统实测落在 quantization.official_variants 里 —— 精度表的第二个来源。**主仓的
        per_subsystem 不受影响**：那个字段是 derive.py 识别打包用的承重件，口径只能是 hf.repo 那一份权重
  quantization:
    per_subsystem:
      attention: BF16
      expert: BF16
      shared_expert: BF16
      router: BF16
      indexer: BF16
      retrieval: BF16
      residual: BF16
      draft: BF16
      vision: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（131 分片 1658 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空。1655 条 BF16 + 3 条 I64（PLE 的索引元数据，共 35 个元素，
      是非训练缓冲区但被 HF 的 tally 算进了参数量，本仓也计入以保持逐位对账）。
      **A_log 与 linear_attn.norm 在本代是 BF16** —— Qwen3.5 一代那两类是 F32，
      3.6 起回到 BF16，本代延续。
      本记录的子系统键按实际归属写（retrieval / residual / indexer 各自成项），
      subsystems.py 的归类原先与它不同，现已一致，见 R1。
      没有 quantization_config，所以 per_subsystem_block 不填；
      同代没有看到本档的 FP8 或 INT4 发布仓（名单里只有 Qwen3.8-Flash-Next 与
      Qwen3.8-Flash-Next-FP8 两个 —— 后者存在，但本仓没有取它的清单，
      所以 weights_release 只写 BF16，FP8 那一项留 open question）

    official_variants:
      - dtype: FP8_E4M3
        repo: Qwen/Qwen3.8-Flash-Next-FP8
        rev: 236dfdf28582
        origin: post_quantized
        tensor_count: 152089
        params_total: 179999981459
        weight_bytes_total: 185502232570
        per_subsystem:
          expert: FP8_E4M3
          shared_expert: BF16
          attention: BF16
          indexer: BF16
          retrieval: FP8_E4M3
          router: BF16
          embed: BF16
          lm_head: BF16
          norm: BF16
          residual: BF16
          draft: FP8_E4M3
          vision: BF16
          other: BF16
        per_subsystem_block:
          expert: '[128,128]'
          draft: '[128,128]'
        per_subsystem_strategy:
          expert: block
          draft: block
        per_subsystem_scale:
          expert: BF16
          retrieval: BF16
          draft: BF16
        per_subsystem_schemes:
          retrieval:
            - { dtype: FP8_E4M3, tensors: 128, elements: 51200245760 }
            - { dtype: INT64, tensors: 3, elements: 35 }
          draft:
            - { dtype: FP8_E4M3, block: '[128,128]', scale_dtype: BF16, tensors: 1536, elements: 2516582400 }
            - { dtype: BF16, tensors: 29, elements: 90568448 }
        method: >-
          完整清单逐项统计（131 分片 152,089 条目，failed_shards 为空），非抽样。 **逐子系统参数量与主仓逐位相同，13 桶零例外**，合计同为
          179,999,981,459 —— 这是「同一份权重的两种存法」的硬证据，也是把 origin 判成 post_quantized 的判据之一。 FP8_E4M3
          覆盖路由专家（120,795,955,200）、检索表（51,200,245,760）、草稿 / MTP（2,516,582,400），占参数量
          97.0%；其余桶原样留在高精度上。 块与 scale 由形状量出、不抄 config：路由专家 [128,128]、草稿 / MTP [128,128]。
          config 的 modules_to_not_convert 点名了 943 条不量化的模块，与清单逐张量对得上。 落盘 185,502,232,570
          B（172.76 GiB）。
platforms:
  - engine: transformers
    hardware: NVIDIA
    status: unknown
    precision: BF16
    caveat: >-
      model_type 是 qwen4_exp、transformers_version 是 5.8.0.dev0，
      三类机制（稀疏 indexer、hyper-connections、PLE 查表）都需要对应实现；
      本仓没有核过任何引擎的支持状态，所以 status 填 unknown 而不是 supported
    ref:
      kind: modelcard
      url: https://huggingface.co/Qwen/Qwen3.8-Flash-Next
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      三类缓存要分开算：12 层 full attention 的 KV（12,288 元素/token）、
      同 12 层的 index K（**384 元素/token** —— 条目宽 128、每 4 个 token 一个条目，
      见 R10）、36 层线性注意力的递归状态（每序列固定 113.62 MiB）。
      索引只占随上下文增长那部分的 **3.0%** —— 和 DeepSeek V4.1 的结论同向
      （主要压力在主 KV 不在索引），而本仓在那一份上曾把结论写反过。
    quantified: >-
      25,344 B/token（全局 KV 24,576 + index K 768，均按模型 dtype 兜底 2 B/元素）
      + 113.62 MiB/序列（36 层 × (48×128×128 矩阵 + 4×10240 短卷积) × 4 B，
      FP32 有 config 声明）。元素口径 **12,672 元素/token**（可跨代比）。
      262144 满上下文 6.19 GiB + 113.62 MiB（合计 6.30 GiB）。
      **per_sequence 略低**：PLE 块自己那张 conv1d 的状态（163,840 B）与 indexer
      未满块的 tail token 条目（≤ 4,608 元素）都没有计入
    visibility: public
  - dimension: weight-bandwidth
    finding: >-
      查表必须排除在带宽口径之外，否则结论会错 8.7 倍：带宽口径的激活参数是
      6,671,295,360（每 token 12.43 GiB），而把 51.2B 的查表算成常驻会得到
      57,871,541,155（107.79 GiB）。表每 token 只读 16 行 × 160 维 = 5,120 B。
      **data/derived/ 一度正是那个错的状态**（子系统归类认不出 PLE），
      归类修好后派生值已是 6,671,295,360（见 R1）。
    quantified: >-
      带宽口径 6,671,295,360 × 2 B = 12.43 GiB/token；权重存储 335.28 GiB
      （查表一项 95.37 GiB）；查表的每 token 读取 5,120 B（16 行 × 160 维 × 2 B）
    visibility: public
  - dimension: operator-gap
    finding: >-
      一代之内三类新算子：(1) 稀疏索引的打分与选块（融合的 index_qk_proj
      + 单头 index K + budget 2048）；(2) hyper-connections 的低秩混合
      （320 维瓶颈）与 block_inject，作用在 4 倍宽的残差流上；
      (3) n-gram 哈希查表 + 短卷积 + 两处投影。
      前两类有 DeepSeek V4 一代的对照（DSA 与 mHC），第三类在本仓是第一次出现。
    visibility: public
  - dimension: host-io
    finding: >-
      95.37 GiB 的 n-gram 查表每 token 只读 5,120 B，是典型的「大容量、极低带宽」对象。
      **厂商就是这么部署的**：技术报告 Abstract 说这 51B 参数「held off the accelerator」，
      Fig. 1 说靠「host-memory prefetching」，§2.3 给的理由是表「sparsely accessed and
      deterministically addressed」—— 确定性寻址才能异步预取。
      128 个分片的切分便于这种放置。但每次查表是 16 次随机行读取，延迟敏感，
      放在哪一级存储要按 decode 的时延预算算。
      **直接后果**：显存预算不该把这 95.37 GiB 算进去（见 arch.retrieval.placement）。
    fix: 把查表与权重分开规划；128 片的分片粒度可直接用于放置与预取
    visibility: public

infra_signals:
  - text: >-
      **三类机制同时首发在一个「Flash」小档位上**（稀疏 indexer、hyper-connections、
      n-gram 查表），而同代旗舰 qwen3.8-2.4t-a95b 一个都没有、架构类还是 Qwen3.5 那一套。
      新结构在小档位先落地，所以跟踪下一代时要盯的是这一档而不是旗舰。
    evidence: derived
    horizon: watch
    axis: attention
  - text: >-
      **index K 的缓存宽度是产出张量的输出维（128），不是 index 头数乘积（512）。**
      本代把 index q 与 k 融合成一张 [640, 2560]，640 = 4×128 + 1×128 ——
      读这张张量的形状时要先按 indexer_kv_heads 把两段拆开，
      否则宽度会高估 4 倍（本仓在 DeepSeek V4.1 上按 32×128 算过，那次高估 32 倍）。
    evidence: derived
    horizon: now
    axis: attention
  - text: >-
      **一个占总参数 28.4% 的子系统可以几乎不占带宽。** PLE 查表 95.37 GiB
      而每 token 只读 5,120 B。参数量、权重存储、带宽这三个口径在这一档上
      第一次差到让「模型多大」这个问题没有单一答案：
      按参数量是 180B，按 decode 带宽是 6.67B，按容量要备 335 GiB。
      记录与算子表里凡是引用「模型大小」的地方都要带口径。
    evidence: judgement
    horizon: now
    axis: retrieval

