# 机械字段来自 config（official）；形状、参数量、层覆盖、三类新机制的构成
# 来自完整权重清单（131 分片 1658 条目，无读失败分片）。
# **本记录的 params.breakdown 用的归类与 scripts/lib/subsystems.py 不同**
# （PLE 查表落进 other、hyper-connections 落进 attention / dense_ffn），
# 实害与需要的改动写在 counting_note、R1 与交接报告里。
id: qwen3.8-flash-next
family: qwen
kind: vlm
display_name: Qwen3.8-Flash-Next
released: '2026-08-24'
license: other
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen3.8-Flash-Next
    locator: config.json @ de4b8e4d43b9
    accessed: '2026-10-30'
    note: >-
      许可取自 HF tags license:other 与 cardData license_name: qwen-community-1.0
      —— 与同代旗舰的 qwen3.8-max 不同，也不是 Qwen3.5 全线的 apache-2.0。
      131 分片 1658 个张量，逐分片读头取全，failed_shards 为空。
      1655 条 BF16 + 3 条 I64（PLE 的 layer_multipliers [3] 与
      ngram_heads_offsets / ngram_heads_vocab_sizes 各 [16]，共 35 个元素）。
      **model_type 是 qwen4_exp、架构名 Qwen4ExpForConditionalGeneration**，
      不是 Qwen3.5 那一套 —— 下一代的架构类在这一份上先落地

  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen3.8-Flash-Next/blob/de4b8e4d43b917e7706784d8bb445c9af86a3540/README.md
    locator: 'README.md @ de4b8e4d43b9 · Model Overview'
    accessed: '2026-10-30'
    note: >-
      按本仓「来源优先级：模型卡 / 技术报告 > 厂商参考实现 > 引擎实现」补的一手来源。
      这份卡给了本记录最多的东西 —— 三类新机制全部有厂商名与声明值（见 R9）：
      「Number of Parameters: **125B with 6B activated, plus 51B n-gram embedding
      and 4B MTP**」、「N-gram Embedding: **20,000,000 (bigrams/trigrams at layer 2)**」、
      「Hidden Layout: **12 × (3 × (Gated DeltaNet → MoE) → 1 × (Qwen Sparse Attention → MoE))**」、
      「**Qwen Sparse Attention**: 24 for Q and 2 for KV, Head Dimension 256,
      Rotary Position Embedding Dimension 64, **Indexer Structure: MQA with 4 Query
      Heads and 1 Shared Key Head**, Indexer Head Dimension 128,
      **Budget: 512 blocks or 2048 tokens**」、
      「Number of Activated Experts: 10 Routed + 1 Shared」「Expert Intermediate Dimension: 640」、
      「**Gated Residual**: Number of Branches **4**, Bottleneck Rank **320**」、
      「MTP: **1 layer**, trained with multi-steps」、
      「Context Length: 262,144 natively and extensible up to 1,000,000 tokens」。
      **卡里没有训练精度声明，也没有每 token 的缓存字节数**
      （所以 kv_sharing.declared_per_token_bytes 这个新字段本档填不了）

hf:
  repo: Qwen/Qwen3.8-Flash-Next
  sha: de4b8e4d43b9ed57f2d28f1e9a7d8e20fe6a14b2
  last_modified: '2026-08-27T06:08:11.000Z'
  pipeline_tag: image-text-to-text
  gated: false

lineage:
  track: side
  predecessor: qwen3.8-2.4t-a95b
  changed_from_predecessor:
    - axis: attention
      text: >-
        **稀疏 indexer 第一次进入 Qwen 家族**：12 层 full attention 各有一个
        self_attn.indexer.index_qk_proj [640, 2560] 与 q/k_layernorm [128]。
        640 是 **q 与 k 融合**：index q 4 头 × 128 = 512，index k **1 头** × 128 = 128
        （config 的 indexer_n_heads 4 / indexer_kv_heads 1 / indexer_head_dim 128）。
        config 另有 indexer_budget 2048 与 indexer_compress_ratio 4。
        混合比例仍 3:1（36 线性 + 12 full），线性注意力与旗舰同构
        （in_proj_qkv [10240, 2560] + in_proj_z [6144, 2560]，value 头 48）
      benefit: >-
        **index K 的缓存宽度是 128，不是 indexer_n_heads × indexer_head_dim = 512**
        —— 它在 4 个 index 头之间 MQA 共享，产出它的张量输出维只有 128。
        按头数乘积折算会高估 4 倍（本仓在 DeepSeek V4.1 上按 32×128 折算过，
        那次高估 32 倍）。每 token 的 index K 上界 = 128 × 12 层 = 1536 元素，
        占总缓存 13,824 元素的 11.1% —— 主要缓存压力仍在全局 KV，不在索引。
        compress_ratio 4 与 budget 2048 都可能让实际条目数更低，
        但权重侧没有任何张量能定这件事（见 open_questions）
    - axis: residual
      text: >-
        **hyper-connections**：config 的 hc_count 4 / hc_lowrank 320。
        残差流宽度变成 4 × hidden = **10240**，每层有两套混合权重
        （attn_hyper_connection 与 mlp_hyper_connection，各含
        block_inject_weight [4, 10240]、input_mix_weight_down [320, 10240]、
        input_mix_weight_up [10240, 320]、hc_norm [10240]），
        另有模型级的 model.hyper_connection_mixer。合计 639,631,360 参数（0.36%）
      benefit: >-
        **激活显存按 4 倍残差流算，不是按 hidden 算**：每 token 的残差流从
        2560 变成 10240 个元素，prefill 的峰值激活与所有逐层缓冲区都要跟着放大。
        参数量代价可以忽略（0.36%），算子代价是每层两次低秩混合（320 维瓶颈）
        加一次 block_inject。这与 DeepSeek V4 一代的 mHC 是同类机制
    - axis: retrieval
      text: >-
        **PLE n-gram 查表**：主干**第 1 层**（清单的层索引）挂一张分成 128 片的
        n-gram 嵌入表，每片 [2500012, 160]，共 320,001,536 行、
        **51,200,245,760 参数 —— 占总参数 28.4%**。
        另有 ple.key_proj [10240, 2560]、value_proj [2560, 2560]、
        conv1d [10240, 1, 4]、三张 [10240] 的 norm，以及 3 条 I64 的索引元数据。
        config: ngram_size 3、ngram_vocab_size_base 2e7、split_ngram_parts 128、
        heads_per_ngram 8、ple_embed_dim 2560、ple_conv_kernel_size 4。
        **config 的 ple_layer_ids 是 [2]，而清单里这些张量在 layers.1 下** ——
        config 与权重冲突，按本仓约定取权重
      benefit: >-
        每 token 只读 16 行 × 160 维（16 个 n-gram 头 × 160 = 2560 = ple_embed_dim），
        即 **5,120 B/token**（BF16），而表本身是 95.4 GiB。
        所以它在容量上是第三大项、在带宽上几乎为零 ——
        **必须排除在 decode 带宽口径之外**，否则激活参数会从 6.67B 变成 57.87B
        （8.7 倍高估，见 counting_note 与 R1）。
        部署上这是一张可以放在主存甚至外置 KV 存储里的表，与权重分开规划
    - axis: moe
      text: >-
        512 专家 top-10、共享专家 1 个、专家中间维 640（旗舰是 2048），
        **主干与草稿块都是堆叠存储**（mlp.experts.gate_up_proj [512, 1280, 2560]
        与 down_proj [512, 2560, 640]，1280 = 2 × 640）——
        与旗舰一致，而比 Qwen3.5-397B-A17B 的「主干堆叠、草稿逐专家」已经统一
      benefit: >-
        专家总量 120,795,955,200（占 67.1%）而每 token 只激活 10/512，
        激活的专家部分 2,359,296,000。grouped GEMM 吃 3 维权重，主干与草稿同一条路径
    - axis: scale
      text: >-
        2.45T 总 / A95B → 180.0B 总 / 本记录按带宽口径 6.67B。
        层数 92 → 48，hidden 8192 → 2560，词表 248320 不变
      benefit: >-
        这是「Flash」档：总量降到旗舰的 7.4%，而三类新机制（稀疏索引、
        hyper-connections、n-gram 查表）都在这一档上首发 ——
        新结构在小档位先落地，是跟踪下一代时要盯的信号

params:
  breakdown:
    expert: 120796000000.0
    retrieval: 51200200000.0
    attention: 2684190000.0
    draft: 2607150000.0
    residual: 639631000.0
    embed: 635699000.0
    lm_head: 635699000.0
    vision: 448931000.0
    shared_expert: 236052000.0
    router: 62914560.0
    other: 32808960.0
    indexer: 19660800.0
    norm: 1037824.0
  counting_note: >-
    模型名里没有参数量，但**模型卡把它拆成三块写出来了**：
    「125B with 6B activated, **plus 51B n-gram embedding and 4B MTP**」。
    实测全量 **179,999,981,459**，与 HF 平台自己从分片头统计的 safetensors tally
    逐位相同，而 125 + 51 + 4 = 180 —— 三块之和与实测对得上（差 18,541）。
    逐块对照：**n-gram 查表** 实测 51,200,245,795 对 51B 是 **+0.39%**；
    **主体** 实测 total − 查表 − 草稿块 = 126,192,584,816 对 125B 是 **+0.95%**；
    **草稿块** 实测 2,607,150,848 对 4B 是 **−34.8%**，加上它共享的两份词表
    （输入 + lm_head 各 635,699,200）才是 3,878,549,248、对 4B 是 −3.0%，仍出容差
    —— 草稿块那一块的口径没对上，留了 open question。
    **params.total 仍不填**，原因不是没有声明值而是闸口会报假不一致：
    填 125e9 要配 excludes [retrieval, draft]，而 derive.py 按 subsystems.py 归类，
    那边的 retrieval 桶在本档是空的（查表落进 other，见 R1），
    于是 Gate B 会算出 177,392,830,611、报 +41.9% 的 MISMATCH ——
    那是归类缺口造成的，不是数据问题。**subsystems.py 修好之后应当补上
    total 1.25e+11 与 excludes [retrieval, draft] 并重跑 derive**（已写进交接报告）。
    **「6B activated」对得上的是「带宽口径减 lm_head」**：
    6,671,295,360 − 635,699,200 = 6,035,596,160，对 6B 是 **+0.59%**；
    不减 lm_head 是 +11.2%、再含输入词表是 +21.8%。
    这与 Qwen 卡上「Non-Embedding」一贯扣两份词表的办法同向
    （见 qwen3-32b 与 qwen2.5-14b-1m 的 counting_note）。
    **breakdown 用的是本仓按实际子系统归属手工归类的结果，与
    data/derived/qwen3.8-flash-next.json 的 params_by_subsystem 不一致**，
    因为 scripts/lib/subsystems.py 的正则认不出本代的三类新张量名（见 R1）：
    PLE 查表与 PLE 的投影（合计 51,233,054,755）整块落进 other；
    attn_hyper_connection.* 落进 attention（多算 316,538,880）、
    mlp_hyper_connection.* 落进 dense_ffn（于是一个没有稠密 FFN 的模型
    显示出 316,538,880 的 dense_ffn，和本仓在 DeepSeek V4-Flash 上修掉的是同一类）。
    **第二处实害更重**：派生的激活参数把 51.2B 的查表算成常驻，
    带宽口径从 **6,671,295,360 变成 57,871,541,155（8.7 倍）**，
    每 token 的权重搬运量从 12.43 GiB 变成 107.79 GiB，arithmetic_intensity 一并失真。
    本记录的归类（13 项）合计与清单求和、与 HF tally 逐位相同。
    激活参数两个口径（按本记录的归类）：带宽口径 **6,671,295,360**
    = 激活专家 2,359,296,000 + 常驻 4,311,999,360
    （注意力 2,684,194,176 + 残差系数 639,631,360 + 共享专家 236,052,480
    + lm_head 635,699,200 + router 62,914,560 + indexer 19,660,800
    + PLE 投影 32,808,960 + norm 1,037,824）；
    可比官方口径 7,306,994,560（含输入词表）。
    **n-gram 查表、视觉塔与草稿块都不在带宽口径里**：查表每 token 只读 16 行
    （5,120 B），视觉塔与草稿块不在主路径上。
    权重存储 335.28 GiB（其中查表一项 95.37 GiB）。

context:
  max: 262144
  train_native: 262144
  extension_method: >-
    模型卡写「262,144 natively and extensible up to 1,000,000 tokens」
    （注意是 1,000,000，Qwen3.5 两档与 Qwen3-Next 写的是 1,010,000），
    没有说用什么方法扩。按 1,000,000 部署时本记录的 per_token 数要乘 3.81
    （6.75 GiB → 25.75 GiB），每序列状态不变

arch:
  layers: 48
  hidden: 2560
  vocab: 248320
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU
  position: >-
    interleaved mRoPE，theta 1e7，partial_rotary_factor 0.25（只对 1/4 维度加 rope）：
    256 × 0.25 = 64 维即 32 个频率对，mrope_section [11, 11, 10] 正好分完 32 对

  attention:
    type: hybrid
    num_heads: 24
    num_kv_heads: 2
    head_dim: 256
    head_dim_note: >-
      full attention 层的 q_proj 是 [12288, 2560]，12288 = 2 × 24 头 × 256 ——
      输出维翻倍，一半是 query、一半是输出门（config 的 output_gate_type: sigmoid，
      **本代是 sigmoid 而 Qwen3.6/3.8 的其余档位是 swish**）。
      o_proj 入口 6144 = 24 × 256 只对应 query 那一半。
      k_proj 与 v_proj 都是 [512, 2560]（512 = 2 × 256），
      全局 KV 宽度按它们的输出维算：每层 2 × 512 = 1024 元素。
      另有每层 q_norm [256] 与 k_norm [256]，以及 indexer 自己的
      q_layernorm / k_layernorm [128]，都归 norm 子系统
    partial_rotary_factor: 0.25
    layer_pattern: >-
      3:1 linear:full，full attention 落在层号 ≡ 3 (mod 4) 上（config 的 layer_types
      列表 48 项与清单一致：self_attn.q_proj 在 3/7/…/47 共 12 层，
      linear_attn.* 在其余 36 层）。**indexer 恰好只在这 12 层上**
      （index_qk_proj 的层集合与 full attention 的层集合逐个相同，
      线性层没有 indexer），另有草稿块 1 层也带 indexer
    output_gate:
      enabled: true
      type: sigmoid
    sparse:
      mechanism: >-
        **Qwen Sparse Attention**（厂商名，模型卡 Model Overview）。
        每个 full attention 层用一个融合的 index_qk_proj 产出 index q（4 头 × 128）
        与 index k（1 头 × 128）—— 卡把这个结构直接写成
        「**Indexer Structure: MQA with 4 Query Heads and 1 Shared Key Head**」，
        与本仓从张量形状读出的 640 = 4 × 128 + 1 × 128 一致。
        预算也有一手来源：「**Budget: 512 blocks or 2048 tokens**」，
        即 config 的 indexer_budget 2048 是 **token 数**、对应 512 个块
        （块大小 2048 / 512 = 4 个 token，与 indexer_compress_ratio 4 一致）。
        **打分与选块的具体规则仍没有读实现**，本记录只记卡与权重能定的部分
      index_n_heads: 4
      index_head_dim: 128
      index_kv_dim: 128
      index_kv_source: >-
        index_qk_proj [640, 2560] 的 k 段输出维 —— 640 = q 4 × 128 + k 1 × 128，
        所以落进缓存的 index K 每层只有 128 个元素，不是 4 × 128 = 512
      block_size: 4
      selected_blocks: 512
      index_topk: 2048
    kv_sharing:
      index_kv_source_layers: [3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43, 47]
      layer_coverage: >-
        三类产出的层覆盖都是同一组 12 层（full attention 的 k/v、indexer 的 index k），
        线性注意力的 36 层不产出任何随上下文增长的缓存。
        主干口径 48 层 + 1 草稿块；草稿块带全套 full attention 与 indexer，
        开草稿侧时两类都要按 13 层算
      note: >-
        **index K 的条目数按 1:1 计费，是上界。** 模型卡把预算写成
        「Budget: 512 blocks or 2048 tokens」—— 所以 2048 是 token 数、块大小 4 个 token，
        **这说的是「选中多少」而不是「存多少」**：被选中的块仍要从全量 index K 里挑，
        所以缓存侧该存的条目数并不因预算而减少。
        真正可能减少条目的是 indexer_compress_ratio 4（像 DeepSeek V4 一代的时序池化，
        每 4 个 token 摊一个条目），但本代权重里**没有任何压缩器张量**
        （没有 compressor.ape 之类能定比值的东西），所以本仓不替公式折算。
        derived JSON 里的 per_token_elems_bound 标的是 exact，
        那只说明「宽度 × 层数」这两个因子是实测的，不代表条目覆盖已经核过
    hybrid:
      layer_types_count:
        linear: 36
        full: 12
      interval: 4
      note: >-
        12 层 full attention 的 KV 与 index K 随上下文线性增长，
        36 层线性注意力只带每序列固定的递归状态。
        以上层数都是主干口径（48 主干层 + 1 草稿块）：草稿块 mtp.layers.0 带一套与主干
        full attention 同名的 q/k/v/o 投影与 indexer、没有 linear_attn，
        所以开草稿侧时累积缓存的是 13 层，线性状态仍是 36 层。
        本记录与 data/derived/ 都按主干口径记账
    linear_state:
      mechanism: 门控线性注意力 + 短卷积
      num_key_heads: 16
      num_value_heads: 48
      key_head_dim: 128
      value_head_dim: 128
      conv_kernel_dim: 4
      state_dtype: FP32
      state_layout_note: >-
        与同代旗舰同构，四个因子都钉在清单的形状上：状态头数 48（= value 头数，
        每层 A_log [48] 与 dt_bias [48]）；conv 通道数 10240
        = 2 × 16 × 128 + 48 × 128，36/36 层 conv1d.weight 都是 [10240, 1, 4]，
        与 in_proj_qkv [10240, 2560] 的输出维相等。
        状态精度有一手来源：config 的 mamba_ssm_dtype: float32。
        **另有一处本代独有的 conv 状态**：PLE 块里还有一张 conv1d [10240, 1, 4]
        （ple_conv_kernel_size 4，作用在 4 × hidden 的残差流上），
        它也要每序列保存 4 × 10240 个位置 —— 一层 163,840 B（FP32），
        本记录的 per_sequence 没有把它计入（derive 的公式只建模线性注意力层），
        所以每序列状态是**略低的**，差 0.14%

  ffn:
    type: moe
    layer_pattern: >-
      48 层全是 MoE 层，线性层与 full 层的 FFN 形态相同。
      **这个模型没有任何稠密 FFN** —— 派生 JSON 里的 dense_ffn 316,538,880
      全部是被错归的 mlp_hyper_connection 残差系数（见 R1）

  moe:
    routed_experts: 512
    shared_experts: 1
    top_k: 10
    intermediate: 640
    routing: 带辅助损失（router_aux_loss_coef 0.001）
    balance: aux-loss
    storage_note: >-
      主干与草稿块都是堆叠存储：每层一个 mlp.experts.gate_up_proj [512, 1280, 2560]
      （1280 = 2 × 640，gate 与 up 融合）与一个 down_proj [512, 2560, 640]。
      草稿块同样是堆叠的 —— Qwen3.5-397B-A17B 那一代「主干堆叠、草稿逐专家」
      的过渡态到这里已经统一（Qwen3.6 起就是如此）。
      grouped GEMM 吃 3 维权重，EP 按首维切

  retrieval:
    mechanism: >-
      PLE n-gram 嵌入查表。模型卡写「N-gram Embedding: 20,000,000
      (**bigrams/trigrams** at layer 2)」——「bigram 与 trigram 都用」这件事
      config 只给 ngram_size 3 一个数，看不出来。
      按 n-gram 哈希到 16 个 n-gram 头上，
      每头查一行 160 维，拼成 ple_embed_dim 2560 后经 key_proj / value_proj
      与一张短卷积并入残差流。表按 split_ngram_parts 128 分片存放，
      每片 [2500012, 160]
    layers: [1]
    table_rows: [320001536]
    entry_dim: 160
    lookup_bytes_per_token: 5120.0
    projection: >-
      ple.key_proj [10240, 2560] 与 ple.value_proj [2560, 2560]，
      另有 ple.conv1d [10240, 1, 4] 与三张 [10240] 的 norm
      （norm_conv / norm_key / norm_query）。10240 = 4 × hidden，
      即投影作用在 hyper-connections 加宽后的残差流上
    placement: >-
      **清单里这些张量在 layers.1 下，而 config 的 ple_layer_ids 与模型卡
      都说 layer 2**（卡的原话是「N-gram Embedding: 20,000,000
      (bigrams/trigrams at layer 2)」）。两边差一位，最可能是计数起点不同
      —— 卡与 config 按第 2 层（1 起），清单按索引 1（0 起）。
      本记录的 layers 取清单的 [1]（0 基，与本仓其他层集合口径一致），
      没有读实现确认这个解释

  residual:
    type: >-
      **Gated Residual**（厂商名，模型卡写「Gated Residual: Number of Branches 4,
      Bottleneck Rank 320」）；权重里的名字是 *_hyper_connection.*，
      与 DeepSeek V4 一代的 mHC 是同类机制
    multiplier: 4
    coef_proj: >-
      每层两套：attn_hyper_connection 与 mlp_hyper_connection，各含
      block_inject_weight [4, 10240]、input_mix_weight_down [320, 10240]、
      input_mix_weight_up [10240, 320]、hc_norm [10240]；
      另有模型级 model.hyper_connection_mixer（hc_norm + down/up）。
      合计 639,631,360 参数
    note: >-
      残差流宽度 = hc_count 4 × hidden 2560 = **10240**。
      参数代价可以忽略（0.36%），真正的影响在**激活显存**：
      每 token 的残差流元素数是 hidden 的 4 倍，prefill 峰值与逐层缓冲区都要跟着放大。
      这与 DeepSeek V4 一代的 mHC 是同类机制；本仓的子系统归类正则
      认 hc_attn_* / hc_ffn_* 那套名字，认不出本代的 *_hyper_connection.*（见 R1）

  decoding:
    mtp_layers: 1
    mtp_layers_note: >-
      config 有两处声明且一致：mtp_num_hidden_layers: 1 与嵌套的 mtp 字典
      （hybrid: true、layer_types: ["full_attention"]、num_hidden_layers: 1、
      rope_theta 1e7）。清单一致：mtp.layers.0 一个块，块内是 full attention
      + indexer + 堆叠的 512 专家 MoE + 共享专家 + router + hyper_connection，
      块外有 mtp.fc_embedding / fc_hidden（**本代拆成两张**，旗舰那一代是一张 mtp.fc）、
      pre_fc_norm_embedding / pre_fc_norm_hidden、mtp.hyper_connection_mixer。
      共 31 条目、2,607,150,848 参数（主干的 1.4%）

  vision:
    encoder: Qwen3.8 vision tower
    layers: 27
    hidden: 1152
    num_heads: 16
    intermediate: 4304
    patch_size: 16
    spatial_merge_size: 2
    temporal_patch_size: 2
    out_hidden: 2560
    params: 448931056.0
    fusion: >-
      patch merge 后投影到主干 hidden：merger.linear_fc1 [4608, 4608] →
      linear_fc2 [2560, 4608]。deepstack_visual_indexes 是空列表，
      只在输入侧并入。与 Qwen3.5 两档的视觉塔同构，只有 out_hidden 不同

precision:
  weights_release: [BF16]
  quantization:
    per_subsystem:
      attention: BF16
      expert: BF16
      shared_expert: BF16
      router: BF16
      indexer: BF16
      retrieval: BF16
      residual: BF16
      draft: BF16
      vision: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（131 分片 1658 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空。1655 条 BF16 + 3 条 I64（PLE 的索引元数据，共 35 个元素，
      是非训练缓冲区但被 HF 的 tally 算进了参数量，本仓也计入以保持逐位对账）。
      **A_log 与 linear_attn.norm 在本代是 BF16** —— Qwen3.5 一代那两类是 F32，
      3.6 起回到 BF16，本代延续。
      本记录的子系统键按实际归属写（retrieval / residual / indexer 各自成项），
      与 subsystems.py 的归类不同，见 R1。
      没有 quantization_config，所以 per_subsystem_block 不填；
      同代没有看到本档的 FP8 或 INT4 发布仓（名单里只有 Qwen3.8-Flash-Next 与
      Qwen3.8-Flash-Next-FP8 两个 —— 后者存在，但本仓没有取它的清单，
      所以 weights_release 只写 BF16，FP8 那一项留 open question）

