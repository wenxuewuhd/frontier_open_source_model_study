    locator: 'README.md @ 207bd685a7e3 · Model Overview'
    accessed: '2026-10-30'
    note: >-
      P1 历史回溯时按本仓「来源优先级：模型卡 / 技术报告 > 厂商参考实现 > 引擎实现」
      补的一手来源（本记录原先只有 config.json，见 R11）。Model Overview 的声明值：
      「Number of Parameters: **2.4T in total and 95B activated**」、
      「Hidden Dimension: 8192」、「Token Embedding: **248,320 (Padded)**」、
      「Number of Layers: 92」、「Hidden Layout: **23 × (3 × (Gated DeltaNet → MoE)
      → 1 × (Gated Attention → MoE))**」、
      「**Gated DeltaNet**: 128 for V and 16 for QK, Head Dimension 128」、
      「**Gated Attention**: 64 for Q and 4 for KV, Head Dimension 256,
      **Rotary Position Embedding Dimension: 64**」、
      「Number of Experts: 512」「Number of Activated Experts: **10 Routed + 1 Shared**」
      「Expert Intermediate Dimension: 2048」、「MTP: trained with multiple steps」、
      「Context Length: **262,144 natively and extensible up to 1,010,000 tokens**」。
      类型是「Causal Language Model」——**没有 Vision Encoder 那一级**，
      与清单里 visual.* 零命中一致。**卡里没有训练精度，也没有每 token 缓存字节数**

  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B-FP8
    locator: 'config.json @ d2dc35658bcf · quantization_config'
    accessed: '2026-10-30'
    note: >-
      同模型的官方 FP8 发布仓，本轮补取了它的 config 与元数据（没取清单），
      关掉了原来那条 open question（见 R12）。quantization_config：
      **quant_method fp8、activation_scheme dynamic、weight_block_size [128, 128]、
      weight_per_tensor false、act_per_tensor false** —— 即 block-wise 权重量化 +
      动态激活量化，与 DeepSeek V3 一代的 FP8 同一路数。
      关键在 **modules_to_not_convert 的 978 项**：router（mlp.gate，92 层）、
      共享专家四项（92 层）、线性注意力的 6 个投影（69 层）、
      full attention 的 q/k/v/o（23 层）、lm_head、embed_tokens、
      以及草稿块除专家以外的全部，**都留 BF16**。
      HF 的逐 dtype tally 把这件事钉死：F8_E4M3 **2,396,591,751,168**，
      与「主干路由专家 2,370,821,947,392 + 草稿块路由专家 25,769,803,776」之和
      **逐位相同**；BF16 那 49,590,974,336 与之相加又恰等于本记录的全量
      2,446,182,725,504。所以 **FP8 只覆盖路由专家（主干 + 草稿块），占参数量 97.97%**。
      usedStorage 4.45 → **2.27 TiB（1.96 倍）**。
      **本轮又补取了它的完整清单**（213 分片 **287,119** 个张量，无读失败分片），
      三件事因此是实测而不是声明：
      (1) **量化块实测 [128, 128]**，142,848 个 FP8 张量**零例外**
      （权重形状 ÷ 同名 weight_scale_inv 形状，逐维整除）——
      与 config 声明的 weight_block_size 一致。
      **这是本仓第一次遇到「config 的块声明是对的」**：DeepSeek V4 一代的 FP4 专家
      声明 [128,128] 而实测是 [1,32]，差 128 倍；
      (2) **scale 的 dtype 是 BF16**（叶名 weight_scale_inv，146,276,352 个元素、0.27 GiB），
      不是 FP32、也不是 DeepSeek V4 一代那种 FP8_E8M0；
      (3) **专家布局被拆回逐专家**（见 arch.moe.storage_note）。
      字节对账：F8 2,396,591,751,168 × 1 B + BF16（权重 49,590,974,336 + scale
      146,276,352）× 2 B = 2.27 TiB，与 usedStorage 一致。
      **HF 这个仓的 tally 不含 scale**（BF16 那一项 49,590,974,336 恰等于清单里
      非 scale 的 BF16 权重）—— 与 ds-v3.2-exp 那个含 scale 的 tally 相反，
      本仓 Gate B「两种口径都接受」的设计在这里又用上了一次

hf:
  repo: Qwen/Qwen3.8-2.4T-A95B
  pipeline_tag: text-generation
  gated: false

lineage:
  track: main
  predecessor: qwen3.5-397b-a17b
  # 本轮（P1 通义千问历史回溯）补上 predecessor 并把三条笼统的
  # changed_from_predecessor 改写成相对 Qwen3.5-397B-A17B 的实际差异（见 R10）。
  # 同代的 qwen3.8-flash-next 是支线，predecessor 指向本记录。
  changed_from_predecessor:
    - axis: scale
      text: >-
        403.4B 总 / A17B → 2.45T 总 / A95B：层数 60 → 92、hidden 4096 → 8192、
        专家中间维 1024 → 2048、注意力头 32 → 64、KV 头 2 → 4、
        线性注意力的 value 头 64 → 128。混合比例（3:1）、专家数（512）、
        top_k（10）、共享专家（1 个）、head_dim（256）、词表（248320）、
        上下文（262144）全部沿用
      benefit: >-
        单专家从 12,582,912 涨到 50,331,648（4 倍），grouped GEMM 的单个 M 维更大、
        kernel 效率更好而批量聚合的压力更小；权重存储 751.39 GiB → 4.45 TiB，
        单机彻底装不下。这一代是等比例放大，结构轴上没有新机制 ——
        新机制在同代的支线 qwen3.8-flash-next 上（稀疏索引 / hyper-connections /
        n-gram 查表）
    - axis: attention
      text: >-
        形态与前代相同（3:1 混合、门控线性注意力 + 短卷积、输出门在 q_proj 里、
        interleaved mRoPE），只换规模：full attention 层 15 → 23、
        线性层 45 → 69、每层 KV 宽度 1024 → 2048 元素（KV 头 2 → 4）、
        conv 通道 12288 → 20480（= 2 × 16 × 128 + 128 × 128）。
        **config 这一代多了 output_gate_type: swish**（前代只有
        attn_output_gate: true，没有函数形式）
      benefit: >-
        每 token 的 KV 从 15,360 元素涨到 47,104（3.07 倍 —— 层数 1.53 倍 ×
        宽度 2 倍），每序列线性状态从 188.44 MiB 涨到 573.56 MiB（3.04 倍）。
        **这两个倍数可以直接比**：两代的状态精度都有 config 的
        mamba_ssm_dtype: float32，basis 相同；KV 那一侧两代都是 dtype 兜底，
        也同口径。缓存压力随规模线性涨，混合比例没有继续往线性那边推
    - axis: moe
      text: >-
        专家数 512、top_k 10、共享专家 1 个都不变，专家中间维 1024 → 2048。
        **草稿块的专家存储从逐专家独立张量改成堆叠**，与主干一致 ——
        前代是「主干堆叠、草稿块 1536 个逐专家张量」的过渡态。
        这一步在 Qwen3.6-35B-A3B 的清单里已经出现
      benefit: >-
        同一个引擎里不再需要两条 grouped GEMM 路径，也不必在加载时转布局。
        条目数：前代主干 120 + 草稿 1536，本代主干 184 + 草稿 2
    - axis: modality
      text: >-
        **视觉前端被去掉**：前代旗舰是 Qwen3_5MoeForConditionalGeneration、
        带 333 个 visual.* 张量，本代是 Qwen3_5MoeForCausalLM、
        清单里 visual / vision 零命中，pipeline_tag 是 text-generation
      benefit: >-
        旗舰在 3.5 是 vlm、在 3.8 回到纯文本 —— **不是单调演进**。
        同代的 qwen3.8-27b 与 qwen3.8-flash-next 都带视觉塔，
        所以「这一代是不是多模态」要按档位分别回答
    - axis: precision
      text: >-
        **linear_attn.A_log 与 linear_attn.norm 从 F32 回到 BF16**
        （前代 45 层那两类是 F32，本代 69 层全是 BF16，dt_bias 两代都是 BF16）。
        这一步发生在中间的 Qwen3.6 两档
      benefit: >-
        线性注意力的递归核不再是混合精度。只有 dtype 看得见 ——
        张量名与形状都没变，所以跨代移植核时要单独测这两类的精度

params:
  total: 2.4e+12
  active_decode: 95.0e+9
  excludes: [draft]
  breakdown:
    expert: 2370820000000.0
    attention: 39895600000.0
    draft: 26378000000.0
    shared_expert: 4631270000.0
    embed: 2034240000.0
    lm_head: 2034240000.0
    router: 385876000.0
    norm: 1536130.0
  counting_note: >-
    total 与 active_decode 取自模型名（2.4T-A95B），属厂商声明；breakdown 是本仓按完整
    权重清单（213 分片 1609 张量，全 BF16、无打包容器、无 scale）实测的分项，取 6 位有效数字。
    实测全量 2,446,182,725,504，与 HF 的 safetensors tally 逐位相同；含 1 个草稿块
    （26,378,027,520）。名字没说 2.4T 含不含草稿块，两种读法都落在取整范围内：
    含草稿 +1.92%、扣草稿 2,419,804,697,984 即 +0.83%。excludes 取 draft 是判断，
    依据是同代 27B —— 那一档全量 27.78B 取整是 28B，名字肯定不按全量算，扣掉视觉与草稿的
    语言主干偏差最小。不写 excludes 时 Gate B 拿 +1.92% 对 2% 容差，过关是侥幸不是对上。
    激活参数两个口径：可比官方口径 95.29B（含输入词表，对 95B 是 +0.30%）、
    带宽口径 93.25B（不含只 gather 一行的输入词表），见 data/derived/，做带宽估算用后者。

context:
  max: 262144
  train_native: 262144
  extension_method: >-
    模型卡写「262,144 natively and extensible up to 1,010,000 tokens」，
    没有说用什么方法扩。按 1,010,000 部署时本记录的 per_token 数要乘 3.85
    （23.00 GiB → 88.62 GiB），每序列状态不变

arch:
  layers: 92
  hidden: 8192
  vocab: 248320
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU
  position: RoPE theta 1e7，partial_rotary_factor 0.25（只对 1/4 维度加 rope）

  attention:
    type: hybrid
    num_heads: 64
    num_kv_heads: 4
    head_dim: 256
    head_dim_note: >-
      full attention 层的 q_proj 是 [32768, 8192]，32768 = 2 × 64 头 × 256 —— 输出维
      翻倍，一半是 query、一半是输出门（config 的 attn_output_gate: true）。o_proj 入口
      16384 = 64 × 256 只对应 query 那一半。按 num_heads × head_dim 推 q_proj 会低一半，
      算子表里 q_proj 的 N 维要按 32768 写，门控是另一个逐元素乘。
      线性层的输出门是另一个张量 in_proj_z [16384, 8192]（= 128 value 头 × 128），不在 q 里
    partial_rotary_factor: 0.25
    layer_pattern: 3:1 linear:full，每 4 层一个 full attention
    hybrid:
      layer_types_count:
        linear: 69
        full: 23
      interval: 4
      note: >-
        只有 23 层累积 KV cache，其余 69 层携带每序列固定的递归状态。
        容量规划必须按两类对象分别建模。以上层数都是主干口径（92 主干层 + 1 草稿块）：
        草稿块 mtp.layers.0 带一套与主干 full attention 同名的 q/k/v/o 投影、没有 linear_attn，
        所以开草稿侧时累积 KV 的是 24 层、94208 → 98304 B/token，线性状态仍是 69 层。
        本记录与 data/derived/ 都按主干口径记账。
    output_gate:
      enabled: true
      type: swish
    linear_state:
      mechanism: >-
        **Gated DeltaNet**（厂商名，模型卡 Model Overview）：门控线性注意力 + 短卷积。
        卡把这一支的头数写成「128 for V and 16 for QK」，与 config 一致
      num_key_heads: 16
      num_value_heads: 128
      key_head_dim: 128
      value_head_dim: 128
      conv_kernel_dim: 4
      state_dtype: FP32
      state_layout_note: >-
        key 头数（16）与 value 头数（128）相差 8 倍，状态按哪个头数展开会带来
        8 倍差异。config 不给布局，但权重清单给出了答案：每层有
        linear_attn.A_log [128] 与 linear_attn.dt_bias [128] —— 衰减参数
        每状态头一个，故状态头数为 128（即 value 头数）。
        in_proj_qkv [20480, 8192] 也对得上：q 16×128 + k 16×128 + v 128×128。
        推导脚本按 value 头数估算，与此一致。
        conv 状态的通道数同样来自清单而不是估算：69/69 层 conv1d.weight 都是 [20480, 1, 4]，
        首维恒等于 in_proj_qkv 的输出维 —— 短卷积是 depthwise、作用在整条 qkv 流上，
        每层 conv 状态 = 4 × 20480 × 4 B（FP32）。窗长按全窗 4 计是上界，实现若只存 k−1
        个位置会略低。「config 不给布局」只针对矩阵状态 [128, 128, 128] 这一项：
        key_head_dim 与 value_head_dim 都是 128，两维谁前谁后不影响容量；要按实现核的是
        实际存储是否就是这一个张量。其余因子都钉在清单的形状上。

  ffn:
    type: moe

  moe:
    routed_experts: 512
    shared_experts: 1
    top_k: 10
    intermediate: 2048
    routing: 带辅助损失（router_aux_loss_coef 0.001）
    balance: aux-loss
    storage_note: >-
      **这条只对 BF16 发布成立。** BF16 仓里专家为堆叠存储：每层一个
      [512, 4096, 8192] 的 gate_up_proj 与一个 [512, 8192, 2048] 的 down_proj，
      gate 与 up 融合在一起；grouped GEMM 因此吃 3 维权重，
      算子签名与逐专家独立张量的布局不同。
      **而同模型的 FP8 仓把堆叠拆回了逐专家，fusion 也拆开**：
      92 层 × 512 专家 × 3 个投影 = 141,312 个 2 维张量（gate_proj / up_proj /
      down_proj 各自独立），草稿块另有 512 × 3 = 1,536 个，
      条目数 1,609 → **287,119**（见 sources[2] 与 R13）。
      所以「Qwen3.8 旗舰的专家是堆叠的」这句话要带发布形态 ——
      按 BF16 仓写的 grouped GEMM 路径在 FP8 仓上直接用不了。

  decoding:
    mtp_layers: 1

precision:
  weights_release: [BF16, FP8_E4M3]

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    ref:
      kind: modelcard
      url: https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      混合结构把 KV 压力降到 1/4 的层，但换来每序列固定的大块状态。
      与纯注意力模型相反：长上下文下状态便宜，大批量下状态贵。
    quantified: >-
      23 层累积 KV、69 层带固定状态（主干口径，92 主干层 + 1 草稿块；开草稿侧累积 KV 为 24 层）
    visibility: public
  - dimension: operator-gap
    finding: >-
      一个模型内两套注意力路径按 3:1 交替，引擎要支持异构层调度；
      线性层还需要递归状态更新与短卷积算子。
    visibility: public
  - dimension: operator-gap
    finding: >-
      专家堆叠成 3 维张量存储，grouped GEMM 的权重布局与逐专家独立张量不同。
      按逐专家布局写的算子无法直接复用，EP 切分也要按首维切而非按张量切。
    visibility: public
  - dimension: ep-comm
    finding: >-
      512 专家 top-10，每 token 的 dispatch/combine 通信量比常见的 top-8
      配置更高，且专家更细（中间维 2048），跨机 EP 下通信占比会上升。
    visibility: public

infra_signals:
  - text: >-
      旗舰规模已到 2.4T 总参数、万亿级权重存储（BF16 约 4.45 TiB，213 分片），
      单机已不可能装下。权重分片加载、分层 offload 与跨机参数服务
      从「可选优化」变成「部署前提」。
    evidence: judgement
    horizon: now
    axis: scale
  - text: >-
      Qwen3.8 这一代本仓录的两档（2.4T-A95B 与 27B）都是 3:1 混合线性注意力，
      在这一代里它已不是实验特性（其余档位与下一代未核）。
      KV 容量模型要改成「部分层随上下文增长 + 部分层每序列常量」两分量，
      分页管理、调度与吞吐曲线都要按此重做。
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      线性状态的张量布局不在 config 里，而它按 key 头数还是 value 头数展开
      会带来 8 倍差异。这类「容量关键参数只存在于实现中」的情况，
      要求适配流程把状态布局当作必须核实项，不能从配置推 —— 先查权重清单：
      状态头数（A_log / dt_bias）与 conv 通道数（conv1d 首维）都在那里。
    evidence: judgement
    horizon: now
    axis: attention

