notes: >-
  Qwen 家族的当前旗舰（2026-08-12）。同代另有 Qwen3.8-27B（dense、带视觉）
  作为较小档位，已单独记录。两者共享混合线性注意力结构，但 FFN 形态
  （MoE vs dense）和头数配置不同。

open_questions:
  - >-
    矩阵状态的实际存储是否就是一个 [128, 128, 128] 的 FP32 张量需按实现确认
    （key_head_dim 与 value_head_dim 都是 128，维序不影响容量）；
    状态头数与 conv 通道数已由权重清单确定，不再是开放问题
  - >-
    2.4T 是否含草稿块，名字未说明，两种读法都在取整范围内（含 +1.92%、扣 +0.83%）。
    excludes: draft 是按同代 27B 的口径做的判断，没有一手说明
  - KV cache 的实际存储精度未披露，推导时按模型 dtype 兜底
  - >-
    （已关闭）FP8 发布版的量化配置与清单本轮都取了（sources[2]）：
    block-wise + 动态激活量化，modules_to_not_convert 978 项说明**只有路由专家被量化**，
    **实测量化块 [128,128] 零例外（142,848 个张量）、scale 是 BF16**，
    专家布局被拆回逐专家。剩下的未知只有一项：**激活量化那一侧**
    （activation_scheme dynamic 是运行期行为，清单里看不到），以及
    FP8 仓是不是重训过而不只是转格式 —— 两者都要读实现或实测才知道
  - >-
    训练精度没有一手来源：config 的 dtype: bfloat16 说的是发布权重，
    而**模型卡正文已读**（README.md @ 207bd685a7e3，P1 轮补取），Model Overview 只列结构与规模，
    没有训练精度声明，故不填 precision.training
  - >-
    config 的 output_gate_type: swish 只有一个键，而门在权重里有两处（full 层 q_proj 的
    后一半、线性层的 in_proj_z）。swish 作用在哪一处或两处，未按实现核

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 上一会话两个独立核查代理 + 本会话复算
  method: >-
    上一会话两个核查代理按 .claude/skills/model-audit 的提问顺序各自过两份 Qwen 记录，
    提出本块与 qwen3.8-27b 的 review 所列发现。进记录的每个数本会话都在 facts/ 上重算过：
    conv1d / in_proj_qkv 首维的逐层恒等（69/69）、q_proj 的形状（24/24，含草稿块）、
    参数分项与扣草稿后的偏差、HF tags 与 cardData 里的许可字段、草稿块的张量名族
    （只有 self_attn、没有 linear_attn）。代理给出的「与 27B 共有张量名族只有 13 个」
    复算不成立（见 qwen3.8-27b 的 R10），没有采用。
    derive.py 以默认 --ep 1 重跑，0 处不一致，外部 safetensors tally 逐位相同。
review:
  - id: R1
    field: arch.attention.linear_state
    severity: wrong
    claim: 每序列线性状态 554.16 MiB（derive.py 的 conv 项 = conv_kernel_dim × key 头数 × key_head_dim × 4 B）
    finding: >-
      短卷积是 depthwise、作用在整条 qkv 流上，通道数是 in_proj_qkv 的输出维，不是 key 一段。
      清单里 69/69 层 conv1d.weight 都是 [20480, 1, 4]，首维恒等于 in_proj_qkv [20480, 8192]
      的输出维 = 2×16×128 + 128×128。原公式只数了 16×128 = 2048 通道，conv 项少算 10 倍
      （每层 32768 B → 327680 B）。27B 同一恒等式在 key:value 头数比 1:3 下也成立（48/48 层），
      两档比值不同而同时成立，所以按规律用。
    resolution: corrected
    changed_to: >-
      derive.py 的 conv 项改为 conv_kernel_dim × (2·num_key_heads·key_head_dim +
      num_value_heads·value_head_dim) × 4 B，terms.conv_state 印出通道数拆法。
      每层 8,716,288 B，69 层 601,423,872 B = 573.56 MiB/序列（+3.50%）。
      窗长仍按全窗 4 计，是上界
  - id: R2
    field: arch.attention.linear_state.state_layout_note
    severity: overreach
    claim: 「config 不给布局」，推导脚本按 value 头数估算
    finding: >-
      这句免责声明的本意是矩阵状态的维序，却被读成了整个线性状态「没有来源、只能估」，
      于是没人去清单里找 conv 的通道数 —— 而同一条注释已经引了 in_proj_qkv [20480, 8192]
      来证状态头数，conv1d [20480, 1, 4] 就在同一层。R1 的错数字是从这句话的覆盖面里漏过去的。
    resolution: corrected
    changed_to: >-
      注释补上 conv 通道数的清单来源，并写明「config 不给布局」只针对矩阵状态一项，
      且该项两维都是 128、维序不影响容量
  - id: R3
    field: license
    severity: wrong
    claim: license apache-2.0
    finding: >-
      facts/qwen3.8-2.4t-a95b/repoinfo.json 的 tags 是 license:other，cardData 是
      license: other、license_name: qwen3.8-max、license_link: LICENSE。该字段挂在
      顶层 license: official 下，从未进 --list-judgements，所以没人复核过取值。
      同代 27B 的一手来源确是 apache-2.0，两档许可不同，像是从 27B 抄过来的
    resolution: corrected
    changed_to: license 改为 other，许可名 qwen3.8-max 写进 sources[0].note
  - id: R4
    field: precision.training
    severity: unsupported
    claim: training BF16，继承 precision official
    finding: >-
      config 只有 dtype: bfloat16，说的是发布权重；本仓读过的来源里没有训练精度。
      与 glm-5.3 的同类问题原样复发
    resolution: corrected
    changed_to: 删掉 precision.training，加一条 open question 说明无一手来源
  - id: R5
    field: arch.attention.hybrid.note
    severity: imprecise
    claim: 「只有 23 层累积 KV cache」，未说明口径
    finding: >-
      清单里另有 1 个草稿块 mtp.layers.0，带着与主干 full attention 同名的 q/k/v/o 投影、
      没有 linear_attn，即开草稿侧时它也累积 KV。23 来自 config 的 layer_types（主干 92 层）。
      derive.py 原来对这件事的提示写「容量要按 93 层算」，对混合结构是误导：
      92 是总层数不是 KV 层数，草稿块加的是 full 层，23 → 24
    resolution: corrected
    changed_to: >-
      按 glm-5.3 已定的做法保留主干口径，在 hybrid.note 与 kv-capacity 的 quantified 里写明
      「92 主干层 + 1 草稿块，开草稿侧累积 KV 24 层、98304 B/token」。
      derive.py 的提示对混合结构改为按 full 层数报（23 → 24）
  - id: R6
    field: evidence
    severity: miscategorized
    claim: arch 的 official 前缀继承覆盖 shared_experts / activation / norm
    finding: >-
      config 没有共享专家个数的键（只有 shared_expert_intermediate_size），1 个是从清单的
      shared_expert.* 与 shared_expert_gate [1, 8192] 数出来的；SwiGLU 是 hidden_act: silu 配
      gate/up 两路投影的推断；RMSNorm 是从 rms_norm_eps 与无 bias 的 norm 权重推的。
      三者都不是官方披露，继承 official 让它们绕过 Gate C
    resolution: corrected
    changed_to: 三者与新增的 head_dim_note、params.breakdown 标 derived，params.excludes 标 judgement
  - id: R7
    field: params.total
    severity: imprecise
    claim: total 2.4T，是否含 MTP 未说明，「以交叉核对结果为准」
    finding: >-
      实测全量 2,446,182,725,504，对 2.4T 是 +1.92%，Gate B 的 2% 容差内侥幸过关 ——
      交叉核对过了，但它什么也没定下来。扣草稿块 26,378,027,520 后是 +0.83%。
      两种读法都在取整范围内，单靠这一档分不出来；同代 27B 至少排除了按全量算的读法（见其 R7）。
      记录里也没有 breakdown，分项只在 data/derived/
    resolution: corrected
    changed_to: >-
      补 excludes [draft]（判断，依据 27B）与八项 breakdown，counting_note 写明两种读法的偏差
      和选择理由。Gate B 的参数总量一项由 +1.92% 变为 +0.83%
  - id: R8
    field: arch.attention.output_gate
    severity: missing
    claim: output_gate enabled、type swish，没有形状说明
    finding: >-
      输出门的落点在 q_proj：24/24 个 q_proj（23 主干 full 层 + 草稿块）都是 [32768, 8192]，
      = 2 × 64 × 256，比 num_heads × head_dim 大一倍；o_proj 入口仍是 16384。
      按头数推 q_proj 的 N 维会低一半。线性层的门是另一个张量 in_proj_z [16384, 8192]
    resolution: corrected
    changed_to: 新增 head_dim_note 写明 q_proj 的两半与线性层的 in_proj_z；swish 作用在哪一处留 open question
  - id: R9
    field: infra_signals
    severity: overreach
    claim: 「混合线性注意力已是 Qwen 全线的默认结构」
    finding: >-
      本仓只录了 Qwen3.8 这一代的两档，没有核过其余档位，更没有核过别的代际。
      结构规律要钉代际（skill 规则 5）
    resolution: corrected
    changed_to: 收窄为「Qwen3.8 这一代本仓录的两档都是 3:1 混合线性注意力（其余档位与下一代未核）」
  - id: R10
    field: lineage
    severity: missing
    claim: >-
      lineage 只有 track: main 与三条笼统的 changed_from_predecessor
      （「混合线性注意力，92 层中 69 层线性」「512 路由专家 top-10」「2.4T 总参数 / 95B 激活」），
      没有 predecessor
    finding: >-
      P1 的历史回溯把 Qwen 线补齐之后，本记录的前代是 **qwen3.5-397b-a17b**
      （2026-02-16，同为 MoE 旗舰、同为 3:1 混合、同为 512 专家 top-10）。
      没有 predecessor 时站点的「变化矩阵」把本记录算作家族首录、整块不出 from→to，
      而那三条文字写的是「本代有什么」而不是「相对前代变了什么」——
      其中「混合线性注意力」「512 专家 top-10」「共享专家」三件事前代就有，
      放在 changed_from_predecessor 里会读成本代新增。
      相对前代真正变的是五件事：规模（层数 60 → 92、hidden 4096 → 8192、
      专家中间维 1024 → 2048）、草稿块专家改堆叠、视觉前端被去掉、
      A_log / linear_attn.norm 由 F32 回到 BF16、config 多了 output_gate_type。
      KV 每 token 15,360 → 47,104 元素（3.07 倍）、每序列状态 188.44 → 573.56 MiB
      （3.04 倍），两个倍数两侧 basis 相同、可以直接比
    resolution: corrected
    changed_to: >-
      补 predecessor: qwen3.5-397b-a17b，并把 changed_from_predecessor 改写成
      五条相对前代的实际差异（scale / attention / moe / modality / precision），
      每条带可核的形状或条目数
  - id: R11
    field: sources
    severity: missing
    claim: >-
      本记录只有 config.json 一个来源；R6 把 shared_experts 判成 derived
      （「config 没有共享专家个数的键，1 个是从清单数出来的」）
    finding: >-
      main 并入的新规则（CLAUDE.md「来源优先级：模型卡 / 技术报告 > 厂商参考实现 >
      引擎实现」与 skill 规则 10）要求精度与结构按厂商发布的说法填。
      本轮（P1 历史回溯）补读模型卡，四件事有了一手来源：
      (1) 「Number of Activated Experts: **10 Routed + 1 Shared**」——
      **shared_experts 由 derived 升为 official**，R6 的判断本身没错，只是当时没读卡；
      (2) 「Hidden Layout: 23 × (3 × (Gated DeltaNet → MoE) → 1 × (Gated Attention → MoE))」
      与 config 的 layer_types、清单的层集合三方一致；
      (3) 机制的厂商名是 **Gated DeltaNet** 与 **Gated Attention**；
      (4) 「Rotary Position Embedding Dimension: 64」= head_dim 256 × 0.25。
      另外卡的类型是「Causal Language Model」、**没有 Vision Encoder 那一级**，
      与前代 Qwen3.5-397B-A17B 的卡（有那一级）对照，
      「旗舰在 3.5 是 vlm、3.8 回到纯文本」这件事在卡上也看得出来。
      **卡里没有每 token 的缓存字节数**，所以 main 新加的
      kv_sharing.declared_per_token_bytes 本档填不了 —— 缓存侧仍无外部锚
    resolution: corrected
    changed_to: >-
      新增 sources 的 modelcard 条目；arch.moe.shared_experts 升 official；
      linear_state.mechanism 写上厂商名；补 context.train_native 与 extension_method；
      训练精度那条 open question 改为「卡已读、无声明」
  - id: R12
    field: precision.weights_release
    severity: missing
    claim: >-
      weights_release 列了 [BF16, FP8_E4M3]，而 FP8 那一项只有「同代有这个仓」做依据；
      open_questions 里挂着「FP8 发布版的量化配置与 BF16 版的差异未核对」
    finding: >-
      本轮补取了 Qwen3.8-2.4T-A95B-FP8 的 config，三件事定下来了：
      (1) 量化方案是 **block-wise FP8（weight_block_size [128,128]）+ 动态激活量化**
      （activation_scheme dynamic、weight_per_tensor 与 act_per_tensor 都是 false），
      与 DeepSeek V3 一代同路数；
      (2) **只有路由专家被量化** —— modules_to_not_convert 列了 978 项
      （router 92 层、共享专家 92 层各四项、线性注意力 6 个投影 × 69 层、
      full attention 的 q/k/v/o × 23 层、lm_head、embed_tokens、草稿块的非专家部分），
      而 HF 的 F8_E4M3 tally 2,396,591,751,168 与「主干路由专家 + 草稿块路由专家」
      之和**逐位相同**，BF16 的 49,590,974,336 与它相加又等于本记录全量 —— 三方闭合；
      (3) 占比与存储：97.97% 的参数是 FP8，usedStorage 4.45 → 2.27 TiB（1.96 倍）。
      **主仓仍是纯 BF16**（本记录的 config 没有 quantization_config，
      本轮核过的 24 份 Qwen 主仓 config 无一例外），所以这些数不改本记录的任何字段，
      只是把 weights_release 里 FP8 那一项的依据从「名单上有这个仓」换成了它自己的 config
    resolution: corrected
    changed_to: >-
      新增 sources 的 FP8 仓条目；原 open question 改为「已关闭」并收窄到
      「清单未取、所以实测量化块与 scale dtype 仍未知，[128,128] 只是声明值」
  - id: R13
    field: arch.moe.storage_note
    severity: imprecise
    claim: >-
      「专家为堆叠存储：每层一个 [512, 4096, 8192] 的 gate_up_proj 与一个
      [512, 8192, 2048] 的 down_proj……grouped GEMM 因此吃 3 维权重」——
      没有带发布形态
    finding: >-
      对 BF16 仓成立，**对同模型的 FP8 仓不成立**。本轮取了 FP8 仓的完整清单
      （213 分片 287,119 个张量）：那边的专家是
      **92 层 × 512 专家 × 3 个投影 = 141,312 个 2 维张量**
      （model.layers.N.mlp.experts.N.{gate,up,down}_proj.weight 各自独立），
      草稿块另有 1,536 个 —— **堆叠被拆回逐专家，gate/up 的 fusion 也拆开了**。
      两个仓的张量名族差异就这 6 对 4：FP8 仓独有 6 个逐专家族，
      BF16 仓独有 4 个堆叠族（主干与草稿块各 2）。
      条目数 1,609 → 287,119。
      实害很直接：**按 BF16 仓写的 3 维 grouped GEMM 在 FP8 仓上用不了**，
      EP 切分也从「按首维切」变回「按张量切」。
      本仓在 Qwen3.5-397B-A17B 上已经栽过一次近似的错
      （那次是「主干堆叠、草稿块逐专家」，一个模型内两种布局，见那份的 R1）——
      **这次是「同一个模型、两个发布，两种布局」**，比那次更容易漏：
      两个仓的 config 除 quantization_config 外完全相同
    resolution: corrected
    changed_to: >-
      storage_note 改为先声明「这条只对 BF16 发布成立」，再写 FP8 仓的逐专家布局
      与条目数，并点明按 BF16 写的 grouped GEMM 路径用不了；
      sources[2] 补实测量化块 [128,128]（零例外）、scale 的 BF16 dtype、
      字节与 tally 的对账，以及「HF 这个仓的 tally 不含 scale」
