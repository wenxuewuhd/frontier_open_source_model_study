    locator: config.json @ 8472618112ab
    accessed: '2026-10-30'
    note: >-
      许可取自 HF tags license:apache-2.0 与 cardData license: apache-2.0
      （下一代旗舰 qwen3.8-2.4t-a95b 变成 license_name: qwen3.8-max）。
      94 分片 2924 个张量，逐分片读头取全，failed_shards 为空。
      **2834 条 BF16 + 90 条 F32**（45 层的 linear_attn.A_log [64] 与
      linear_attn.norm.weight [128]，共 8640 个元素）。
      条目数只有 2924 是因为主干专家堆叠存储：每层两张 3 维张量装下 512 个专家

