notes: >-
  Qwen3.5 一代的旗舰（2026-02），qwen3.8-2.4t-a95b 的直接前代。
  相对前代旗舰 qwen3-next-80b-a3b 的四件事：主干专家改堆叠（草稿块没跟上）、
  线性注意力的投影拆分、视觉前端并入主线、A_log 与 linear_attn.norm 升 F32。
  混合比例（3:1）、专家数（512）、top_k（10）、共享专家（1 个）都沿用前代。
  同代另有 Qwen3.5-122B-A10B / 35B-A3B 两个 MoE 档与 27B / 9B / 4B / 2B / 0.8B
  等档位，张量名族与本记录或 qwen3.5-27b 逐族相同，只是缩放，不另录。
  下一代旗舰 qwen3.8-2.4t-a95b **又回到纯文本**（没有 visual.*），
  所以「主线从此多模态」这个说法只对这一代成立。

open_questions:
  - >-
    A_log 的 F32 在 attention 子系统里只占 2880 / 6,883,497,600，
    所以 per_subsystem 的 attention 报 BF16（带宽主体）。
    「衰减参数是 F32」这件事因此不在精度表的 attention 行里，
    只写在 lineage 的 precision 条与本列表
  - >-
    矩阵状态的实际存储是否就是一个 [64, 128, 128] 的 FP32 张量需按实现确认
    （两维都是 128，维序不影响容量）；状态头数与 conv 通道数已由权重清单确定
  - >-
    短卷积的状态按全窗 4 计是上界，实现若只存 k−1 = 3 个位置会低 1/4
  - >-
    KV cache 的实际落盘精度未披露，按模型 dtype 兜底 ——
    **缓存账的两个分量 basis 不同**（per_token 兜底、per_sequence 的 FP32 有声明），
    合计不能当单一口径用，跨代比也只能用元素口径
  - >-
    输出门的函数形式本代无声明（config 没有 output_gate_type），3.6 起声明为 swish
  - >-
    params.excludes 取 [draft, vision] 是判断：只扣草稿块的偏差更小（−0.05%
    对 −0.16%），取两项是为了与同代 qwen3.5-27b 同口径，没有一手说明
  - >-
    同代的 FP8 与 GPTQ-Int4 发布本仓没有取清单，weights_release 只记发布形态，
    量化配置未知
  - >-
    训练精度没有一手来源：config 的 dtype: bfloat16 说的是发布权重，
    模型卡正文未核，故不填 precision.training
  - >-
    **data/derived/ 里的 from_shapes.expert_storage 与本记录的 arch.moe.storage_note
    不一致**：派生值是 "individual"，而主干实际是堆叠、只有草稿块逐专家（见 R7）。
    derive.py 的 expert_storage 是单值字段，表达不了一个模型内两种布局，
    而它的 individual 判据（名字里有 experts.<数字>.）被草稿块的 1536 个张量命中。
    本轮按约定不改共享脚本，改动请求在交接报告里；
    引用专家布局时以本记录的 storage_note 为准

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen3.5-397b-a17b 核：config 全部键、
    完整权重清单（2924 条目逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData /
    sha 与逐 dtype 的 safetensors tally（BF16 403,397,920,304 + F32 8640）。
    两种专家布局是把主干与 mtp 的张量名族分开列出来比的（主干 2 族 × 60 层、
    草稿 3 族 × 512 专家），见 R1。
    混合层的两个集合由清单的层索引交并集定，并与 config 的 layer_types 逐项比对一致。
    conv 通道恒等式在 45/45 层上验过。
    参数九项逐项按形状重算并与清单求和、HF tally 三方比对；草稿块 6,595,568,128
    逐项重算过（512 专家 6,442,450,944 + full attention 104,857,600 + 共享 12,587,008
    + router 2,097,152 + fc 33,554,432 + 7 张 norm 20,992）。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致；EP 通信量按 --ep 4 核对公式。
    **原理上核不了的**：输出门的函数形式、矩阵状态的实际布局、conv 窗长、
    KV 落盘精度、量化发布的配置、训练精度，都在 open_questions 里。
review:
  - id: R1
    field: arch.moe.storage_note
    severity: wrong
    claim: >-
      草稿按同族 qwen3.8-2.4t-a95b 的写法写「专家为堆叠存储：每层一个 gate_up_proj
      与一个 down_proj」
    finding: >-
      对主干成立，**对草稿块不成立**。清单里主干是 120 个条目
      （60 层 × {gate_up_proj [512, 2048, 4096], down_proj [512, 4096, 1024]}），
      而 mtp.layers.0 下是 **1536 个逐专家独立张量**
      （mtp.layers.0.mlp.experts.N.{gate,up,down}_proj.weight，N 从 0 到 511）。
      一个模型内两种布局，grouped GEMM 的签名与 EP 切分方式对两者不同。
      查了三代才确定这是过渡态：Qwen3-Next 两边都是逐专家，
      本代主干堆叠而草稿逐专家，Qwen3.6-35B-A3B 起草稿块也变成堆叠
      （facts/qwen3.6-35b-a3b 的名族里是 mtp.layers.N.mlp.experts.{down_proj,gate_up_proj}），
      Qwen3.8 两档已经统一。
      「这个模型的专家是堆叠存储」在这一代是半句真话
    resolution: corrected
    changed_to: >-
      storage_note 分主干与草稿块两段写，并给出各自的条目数；
      infra_signals 加一条；bottleneck 里给出「加载时转布局」这个修法
  - id: R2
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: >-
      草稿里 attention 条的 benefit 写「每序列状态从 38.25 MiB 涨到 188.44 MiB，4.9 倍」
    finding: >-
      4.9 倍里混着两样东西：元素数（结构）与每元素字节（调研进度）。
      前代 config 没有 mamba_ssm_dtype，本仓按 BF16 兜底；本代声明 float32。
      属于结构的只有元素数之比：前代 36 × (32×128×128 + 4×8192) = 36 × 1,081,344，
      本代 45 × (64×128×128 + 4×12288) = 45 × 1,097,728，比值 **1.93 倍**；
      另外 2.5 倍是 basis 的差。
      docs/kv-cache-accounting.md 的「不同 basis 之间不算倍数」原本只针对
      per_token 那一列，**每序列状态这一列同样适用**，而本仓此前没有在任何记录里写过这句
    resolution: corrected
    changed_to: >-
      attention 条改为同时给元素口径的 1.93 倍与 basis 差；
      infra_signals 加一条把这条规则写到每序列状态上
  - id: R3
    field: params.counting_note
    severity: unsupported
    claim: A17B 对得上的是可比官方口径（含输入词表）
    finding: >-
      含输入词表 17,349,040,896 对 17B 是 +2.05%（取整 17B），
      带宽口径 16,331,922,176 是 −3.93%（取整 16B）。
      **两种都不在 2% 容差内**，但只有前者取整得到名字里的 17 —— 这是判据。
      同向的还有 A2.7B（−0.40% 对 −11.9%）与 A14B（+1.78% 对 −2.11%），
      三个样本一致，所以「Qwen 的激活参数声明含输入词表」这条有三份支撑；
      反例是 A3B（两种口径 +18.8% / +29.2% 都对不上，判为档位名）
      与 A22B（两种都在容差内、分不出来）。五份记录的证据合起来写在各自的 counting_note 里
    resolution: confirmed
  - id: R4
    field: lineage.changed_from_predecessor
    severity: missing
    claim: >-
      草稿的 modality 条只写「视觉前端并入主线，主线从此是多模态」
    finding: >-
      后半句在下一代就不成立：qwen3.8-2.4t-a95b 的清单里 visual.* 零命中、
      架构名是 Qwen3_5MoeForCausalLM、pipeline_tag 是 text-generation。
      旗舰在 3.5 是 vlm、在 3.8 又回到 llm。
      「从此」这种连续性断言正是 skill 规则 5 点名的那类
    resolution: corrected
    changed_to: modality 条与 notes 都写明下一代旗舰又回到纯文本
  - id: R5
    field: arch.moe.intermediate
    severity: imprecise
    claim: >-
      草稿把 gate_up_proj 的形状写成 [512, 1024, 4096]
    finding: >-
      实际是 [512, 2048, 4096]：中间维 1024 而 gate 与 up **融合在一起**，
      所以第二维是 2 × 1024 = 2048。按 1024 读会把主干专家参数量算少一半
      （真值 60 × 512 × (2048 × 4096 + 4096 × 1024) = 386,547,056,640）。
      同一个坑在旗舰那份记录里是对的（[512, 4096, 8192] 配中间维 2048），
      本记录的草稿照抄形状时漏了这一层
    resolution: corrected
    changed_to: storage_note 写明准确形状与 2048 = 2 × 1024 的来历
  - id: R6
    field: arch.decoding.mtp_layers_note
    severity: missing
    claim: 草稿只写「草稿块 1 层」
    finding: >-
      草稿块自带 512 专家的完整 MoE（6,442,450,944 参数，占它自身的 97.7%），
      所以它虽然只占主干的 1.66%，绝对量是 6.44B —— 开草稿侧时这些权重要驻留，
      而且它们是逐专家布局。只写「1 层」会让人以为是个轻量头
    resolution: corrected
    changed_to: mtp_layers_note 写明块内构成与 6.44B 的专家权重
  - id: R7
    field: arch.moe.storage_note
    severity: miscategorized
    claim: >-
      data/derived/qwen3.5-397b-a17b.json 的 from_shapes.expert_storage 报
      "individual（逐专家独立张量）"，Gate B 那一行也这么印
    finding: >-
      对本记录是**半错**：主干 60 层是堆叠的，只有草稿块是逐专家。
      根因在 derive.py 的判据 —— 它先用「张量名里有 experts.<数字>.」收集专家下标，
      有命中就报 individual；而本模型的命中全部来自 mtp.layers.0 的 1536 个
      逐专家张量（它们归 draft 子系统，但下标收集不分子系统）。
      主干的堆叠张量名是 experts.gate_up_proj（没有数字），走的是另一条分支，
      只写进 stacked_experts。两个集合同时非空时，expert_storage 这个**单值字段**
      表达不了，于是选了 individual。
      旗舰 qwen3.8-2.4t-a95b 两边都堆叠，所以那份报 stacked，是对的。
      **不是数据错，是字段的粒度不够** —— 本记录的 arch.moe.storage_note
      才是权威描述。按约定本轮不改共享脚本，改法写进交接报告
    resolution: open
    changed_to: >-
      storage_note 分两段写明布局，并在 open_questions 里记下派生字段与记录不一致
      及其原因；derive.py 的 expert_storage 建议支持 mixed，改动请求在交接报告里
