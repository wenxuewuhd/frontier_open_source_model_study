# 机械字段来自 config（official）；形状、参数量、专家存储布局、层分布、
# 视觉塔与草稿块的构成、以及 F32 的两类张量来自完整权重清单
# （94 分片 2924 条目，无读失败分片）。
# 主干专家堆叠而草稿块逐专家独立，这件事只有清单看得出来（见 R1）。
id: qwen3.5-397b-a17b
family: qwen
kind: vlm
display_name: Qwen3.5-397B-A17B
released: '2026-02-16'
