# 机械字段来自 config（official）；形状、参数量与子系统拆分来自完整权重清单
# （17 分片 707 条目，无读失败分片，全 BF16）。
# QK-Norm 的存在只在权重里（config 没有这个开关），所以标 derived。
id: qwen3-32b
family: qwen
kind: llm
display_name: Qwen3-32B
released: '2025-04-27'
license: apache-2.0
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/Qwen/Qwen3-32B
    locator: config.json @ 9216db5781bf
    accessed: '2026-10-30'
    note: >-
      许可取自 HF tags license:apache-2.0 与 cardData license: apache-2.0。
      BF16 发布，17 分片 707 个张量，逐分片读头取全，failed_shards 为空。
      **config 里没有 use_qk_norm 这个键**，而清单里 64/64 层都有
      self_attn.q_norm.weight [128] 与 k_norm.weight [128] —— QK-Norm 的存在
      是从权重读出来的（同代的 Qwen3-Coder-480B-A35B 的 config 才把
      use_qk_norm: true 显式写出来）

