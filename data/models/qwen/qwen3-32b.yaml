notes: >-
  稠密支线的第三代（2025-04）。Qwen3 起旗舰转到 MoE（qwen3-235b-a22b 同日发布），
  所以这一支从本记录开始标 side。
  三件结构变化（QK-Norm 进来、q/k/v bias 去掉、head_dim 解耦）与同代 MoE 旗舰同步，
  不是稠密档位独有 —— 两份记录的 lineage 里各写一遍，是因为两条链各自要读得通。
  缓存一侧这一代完全没动（仍 8 组 GQA、每层 2048 元素）。
  同代的 Qwen3-30B-A3B 与 Qwen3-14B/8B/4B/1.7B/0.6B 等档位不另录
  （张量名族与同代同形态记录逐个相同，只是缩放）。

open_questions:
  - >-
    QK-Norm 作用在 rope 之前还是之后没有读实现，只知道它按 head_dim 归一
    （张量形状 [128]）。这件事影响算子融合方式，但不影响参数量与缓存账
  - >-
    40960 之上的长上下文做法（官方文档提到的 YaRN 一类）不在 config 里
    （rope_scaling 为 null），所以 context 只记声明值 40960，不填 extension_method
  - >-
    KV cache 的实际落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底，
    bytes_basis 是 dtype_fallback
  - >-
    训练精度没有一手来源：config 的 torch_dtype: bfloat16 说的是发布权重，
    模型卡正文未核，故不填 precision.training
  - >-
    params.excludes 取 [embed] 是判断：名字里的 32B 对全量是 +2.38%（出容差）、
    对扣掉输入词表后是 −0.05%，没有一手说明哪种才是厂商口径

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen3-32b 核：config 全部键、
    完整权重清单（707 条目逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData /
    sha 与 safetensors tally。
    QK-Norm 与「零 bias」两条都是对清单做名字扫描得到的（q_norm / k_norm 各 64 命中、
    self_attn 下的 .bias 零命中），不是从 config 推的；
    同代 Qwen3-Coder-480B-A35B 的 config 里 use_qk_norm: true 也实际读了
    （facts/qwen3-coder-480b-a35b/cfg.json）。
    参数五项逐项按形状重算并与清单求和、HF tally 三方比对；
    两种声明口径的偏差各自重算。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致。
    **原理上核不了的**：QK-Norm 与 rope 的先后、长上下文做法、KV 落盘精度、训练精度，
    都在 open_questions 里。
review:
  - id: R1
    field: arch.attention.head_dim
    severity: unsupported
    claim: head_dim 128，而 hidden / num_heads = 80
    finding: >-
      config 第一次显式给 head_dim: 128，清单印证了它不是 hidden/heads：
      q_proj [8192, 5120] 的输出维 8192 = 64 × 128，o_proj [5120, 8192] 的入口同为 8192。
      若按 hidden² 估这两张，每层会少算 2 × (41,943,040 − 26,214,400) = 31,457,280，
      64 层共 2,013,265,920（整层注意力参数的 33%）。
      这是 Qwen 线第一次出现非方阵注意力投影
    resolution: confirmed
  - id: R2
    field: infra_signals
    severity: miscategorized
    claim: >-
      草稿把「QK-Norm 的存在只能从权重读」这条 infra_signal 标成 judgement
    finding: >-
      这一条的内容全部是可核事实：本记录 config 无 use_qk_norm 键（已逐键看过）、
      清单 64/64 层有 q_norm/k_norm、同代 Coder-480B 的 config 有这个键。
      没有前瞻也没有平台判断，所以口径是 derived 而不是 judgement。
      反过来第二条（算子表里按 hidden² 写的地方都要改、这个解耦一直保持到 Qwen3.8）
      含跨代断言与适配建议，确实是 judgement。
      glm-4-9b 的 R8 是反方向的同一个错（judgement 的东西标了 derived）
    resolution: corrected
    changed_to: 第一条标 derived，第二条留 judgement
  - id: R3
    field: params.excludes
    severity: missing
    claim: >-
      草稿里 params 只有 total 32e+9，Gate B 报 +2.38% MISMATCH
    finding: >-
      +2.38% 出容差、取整是 33B；扣掉输入词表后 31,984,210,944 对 32B 是 −0.05%。
      与同支线的 qwen2.5-14b-1m（+5.50% 对 −0.06%）是同一种吻合。
      **但不能把它当成 Qwen 全家族的规律**：qwen1.5-72b（+0.40% 对 −1.33%）与
      qwen2-72b（+0.98% 对 −0.75%）两种读法都在容差内、分不出来，
      而 qwen3.8 两档扣的是草稿块与视觉塔、输入词表仍在 total 里。
      同一个 excludes 字段在一个家族里有两种语义，所以逐份写明口径
    resolution: corrected
    changed_to: >-
      补 excludes [embed]（标 judgement）与两种读法的偏差，并点明家族内其他档位的口径不同；
      Gate B 的参数总量一项由 MISMATCH 变为 ok（−0.05%）
  - id: R4
    field: params.breakdown
    severity: unsupported
    claim: 五项分项与合计 32,762,123,264
    finding: >-
      逐项按形状重算：dense_ffn 64 × 3 × 5120 × 25600 = 25,165,824,000；
      attention 64 × (2 × 8192 × 5120 + 2 × 1024 × 5120) = 6,039,797,760（无 bias）；
      **norm 64 × (2 × 5120 + 128 + 128) + 5120 = 676,864** —— 比前代同类大，
      因为每层多了 q_norm 与 k_norm；embed 与 lm_head 各 151936 × 5120 = 777,912,320。
      五项合计与清单求和、与 HF tally 三者逐位相同。
      q_norm / k_norm 归 norm 不归 attention：lib/subsystems.py 的 norm 正则
      排在 attention 之前，「带 norm 的就是归一化」
    resolution: confirmed
  - id: R5
    field: lineage.changed_from_predecessor
    severity: overreach
    claim: >-
      草稿里 attention 那条的 benefit 写「这三件事让注意力更省」
    finding: >-
      三件事都不省缓存：KV 宽度前后同为每层 2048 元素（8 组 GQA 不变）。
      去 bias 省的是 64 × 3 × (5120 + 1024 + 1024)... 实际前代的 bias 在
      hidden 5120 这一档是每层 7168 个元素，整模型 458,752 —— 相对 32.76B 可忽略。
      head_dim 解耦反而让 q/o 投影**变大**（每层多 31,457,280）。
      正确的说法是「不动缓存、只动算子」
    resolution: corrected
    changed_to: benefit 改为「不动缓存、只动算子」，并给出 q_proj 按 hidden² 估会低 60%
  - id: R6
    field: context
    severity: imprecise
    claim: >-
      草稿里 context.max 40960 旁没有任何说明
    finding: >-
      这个值比前代的 131072 **更低**，不写出来会被读成漏填或笔误。
      config 的 rope_scaling 是 null、rope_theta 与前代同为 1e6，
      所以「实际能跑多长」在 config 里没有依据。本仓只记声明值，
      extension_method 留空并写进 open_questions
    resolution: corrected
    changed_to: lineage 的 context 条写明声明值是降的、长上下文做法不在 config 里
  - id: R7
    field: hf.sha
    severity: wrong
    claim: >-
      草稿里的 hf.sha 与 hf.last_modified 是按 12 位前缀「补全」的，不是从取数产物读的
    finding: >-
      本轮对全部新记录做了一次机械核对：把每份 YAML 的 hf.sha / hf.last_modified
      与 facts/<id>/repoinfo.json 逐字符比。本记录两项都对不上 ——
      sha 的后 28 位与 lastModified 的时分秒都是写记录时臆造的。
      sha 是整份记录的可复现锚点（sources 的 locator 也引它），
      错了之后「按 pinned sha 复现取数」这件事就断了，而**它不会被任何校验拦住**：
      validate.py 不核对 facts/，derive.py 也不读 hf 块
    resolution: corrected
    changed_to: >-
      两项都改为从 facts/<id>/repoinfo.json 直接读出的值；
      核对脚本已对全部 11 份新记录跑过，现在逐字符一致
