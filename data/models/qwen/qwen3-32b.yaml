  gated: false

lineage:
  track: side
  predecessor: qwen2-72b
  successor: qwen3.5-27b
  # Qwen3 起旗舰转到 MoE（见 qwen3-235b-a22b），所以稠密这一支从本记录开始是 side。
  # 本代的三件结构变化与同代 MoE 旗舰是同步发生的，不是稠密档位独有。
  changed_from_predecessor:
    - axis: attention
      text: >-
        三件事同时发生。(1) **QK-Norm 进来**：64/64 层新增 self_attn.q_norm.weight [128]
        与 k_norm.weight [128]，是按 head_dim 做的 RMSNorm，**config 里没有对应开关**。
        (2) **q/k/v 的 bias 整体去掉**（config attention_bias: false，清单 707 条里
        一个 self_attn 的 .bias 都没有；前代每层有三张）。
        (3) **head_dim 与 hidden/heads 解耦**：config 第一次显式给 head_dim: 128，
        而 hidden 5120 / 64 头 = 80 ≠ 128，所以 q_proj 是 **[8192, 5120]**
        （8192 = 64 × 128）、o_proj 是 [5120, 8192]，两张都不再是方阵
      benefit: >-
        KV 宽度不变（仍 2 × 8 × 128 = 2048 元素/层），所以这一代的注意力改动
        **不动缓存、只动算子**：QK-Norm 是每层两个新的小算子（可与 rope 融合），
        去 bias 让投影变成纯 GEMM，而 head_dim 解耦让 q/o 投影变成长方阵 ——
        **按 hidden² 估 q_proj 会低 60%**（5120² = 26,214,400 对实际
        8192 × 5120 = 41,943,040）。整层注意力参数 94,371,840
    - axis: context
      text: >-
        131072 → **40960**（max_position_embeddings），rope_theta 仍 1e6，
        rope_scaling 为 null
      benefit: >-
        声明值是降的。官方的长上下文做法（YaRN 一类）不在 config 里，
        所以本仓只记 40960 这个声明值，不记「实际能到多长」——
        40960 满上下文的 KV 是 10.00 GiB，对权重存储 61.02 GiB 只占 16.4%。
        Qwen 线的长上下文要到 Qwen3-Next 一代才靠 262144 的原生声明 + 混合注意力解决
    - axis: moe
      text: 仍是稠密 FFN，中间维 29568 → 25600（层数 80 → 64，档位从 72B 缩到 32B）
      benefit: >-
        稠密 FFN 占总参数 76.8%、占带宽口径 78.7%（分母 31,984,210,944）——
        与前代同样的格局。稠密这一支在 FFN 形态上一直到 Qwen3.5 才变

params:
  total: 3.2e+10
  excludes: [embed]
  breakdown:
    dense_ffn: 25165800000.0
    attention: 6039800000.0
    embed: 777912000.0
    lm_head: 777912000.0
    norm: 676864.0
  counting_note: >-
    total 取自模型名（32B），属厂商声明；breakdown 是本仓按完整权重清单
    （17 分片 707 条目，全 BF16、无量化 scale、无低位打包）实测的分项，取 6 位有效数字。
    实测全量 32,762,123,264，与 HF 平台自己从分片头统计的 safetensors tally 逐位相同。
    **名字不按全量算**：全量对 32B 是 +2.38%，超出 Gate B 的 2% 容差，取整是 33B；
    扣掉输入词表（777,912,320）后是 31,984,210,944，对 32B 是 **−0.05%**。
    所以 excludes 取 [embed]，和同在稠密支线的 qwen2.5-14b-1m 一致
    （那一档是 +5.50% 对 −0.06%）。**这是判断，没有一手说明。**
    两档都是「扣掉输入词表后千分之一以内吻合」，而 qwen1.5-72b / qwen2-72b
    两种读法都落在容差内、分不出来（见各自的 counting_note）。
    lm_head 仍在声明口径内（它每步对全词表做 GEMM，和只 gather 一行的输入词表不是一回事）。
    词表与输出层不共享权重（各 777,912,320，tie_word_embeddings: false）。
    权重存储 61.02 GiB。激活参数两个口径：带宽口径 31,984,210,944
    （恰等于本记录的声明口径）、可比官方口径 32,762,123,264。
    注意 norm 一项（676,864）比前代同类大：除两个 layernorm 外，
    每层多了 q_norm 与 k_norm 各 [128]。

context:
  max: 40960

arch:
  layers: 64
  hidden: 5120
  vocab: 151936
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU
  position: RoPE theta 1e6，作用在全部 head_dim 维（config 无 partial_rotary_factor）

  attention:
    type: GQA
    num_heads: 64
    num_kv_heads: 8
    head_dim: 128
    head_dim_note: >-
      head_dim 128 第一次是 config 的显式字段，而且**不等于 hidden / num_heads**
      （5120 / 64 = 80）。清单印证：q_proj [8192, 5120]（8192 = 64 × 128）、
      o_proj [5120, 8192]、k_proj 与 v_proj [1024, 5120]（1024 = 8 × 128）。
      四张投影里两张是长方阵 —— 按 hidden² 估 q_proj / o_proj 会低 60%。
      缓存宽度仍按 k_proj / v_proj 的输出维算：每层 2 × 1024 = 2048 元素。
      **这一代没有任何 .bias**（attention_bias: false，707 条清单里零命中），
      另有每层 q_norm [128] 与 k_norm [128]（QK-Norm，按 head_dim 归一），
      它们归 norm 子系统、不在 attention 的参数里
    layer_pattern: 64 层同构，每层产出自己的 KV，无跨层共享、无滑窗、无稀疏

  ffn:
    type: dense
    intermediate: 25600

precision:
  weights_release: [BF16]
  quantization:
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（17 分片 707 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空，707 条全是 BF16。这一代没有 quantization_config；
      同代另有 FP8 / AWQ / GPTQ / GGUF 发布，是同一份结构的再发布，本仓不另录

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    ref:
      kind: modelcard
      url: https://huggingface.co/Qwen/Qwen3-32B
    visibility: public

bottlenecks:
  - dimension: weight-bandwidth
    finding: >-
      稠密 32B，带宽口径的激活参数 31,984,210,944 占总参数 97.6%，
      decode 每 token 要搬 59.57 GiB。KV 在声明的 40960 上下文下只有 10.00 GiB。
      这一代的注意力改动（QK-Norm / 去 bias / head_dim 解耦）对这个格局毫无影响 ——
      它们改的是算子形状，不是量级。
    quantified: >-
      带宽口径激活 31,984,210,944 × 2 B = 59.57 GiB/token；权重存储 61.02 GiB
      （含输入词表）。dense_ffn 占总参数 76.8%、占带宽口径 78.7%
      （分母 31,984,210,944）—— 两个分母不同
    visibility: public
  - dimension: operator-gap
    finding: >-
      QK-Norm 是每层两个新算子（q 与 k 各一次按 head_dim 的 RMSNorm，
      作用在 rope 之前还是之后取决于实现，本仓未读）。
      它的参数量微乎其微（每层 256 个元素）但在 decode 的关键路径上，
      不与 rope 或投影融合会多两次 kernel 启动。
    fix: 与 rope / q·k 投影融合；本仓没有读实现确认 norm 与 rope 的先后顺序
    visibility: public

infra_signals:
  - text: >-
      **QK-Norm 的存在只能从权重读**：Qwen3 一代的 config 没有 use_qk_norm 这个键，
      而 64/64 层都有 q_norm / k_norm [128]。同代的 Qwen3-Coder-480B-A35B 的 config
      才把 use_qk_norm: true 显式写出来 —— 同一个结构，一代之内两种声明方式。
      照 config 判断「有没有 QK-Norm」会在本记录上得到错的答案。
      又一例「config 描述模块配置、不描述落盘形状」。
    evidence: derived
    horizon: settled
    axis: attention
  - text: >-
      head_dim 从「hidden / heads」解耦出来之后，注意力投影不再是方阵
      （q_proj [8192, 5120]、o_proj [5120, 8192]）。算子表与显存估算里
      凡是按 hidden² 写 q/o 投影的地方都要改成按 heads × head_dim 写 ——
      本记录这一档的差是 1.6 倍。这个解耦从 Qwen3 一代起在 Qwen 线一直保持
      （Qwen3.5 / Qwen3.8 的 head_dim 是 256，差得更远）。
    evidence: judgement
    horizon: settled
    axis: attention

