notes: >-
  Qwen 家族 MoE 支线的分叉点（2024-02），也是本仓记录的第一个「细粒度专家 + 共享专家」
  组合。注意力这一轴相对同代稠密旗舰没有动，所以这一代的新增算子全在 MoE 侧。
  档位比同代稠密旗舰小得多（14.3B 对 72B），收录理由不是档位而是 FFN 形态：
  变化矩阵里 layers / hidden / vocab 这几格的差读作档位，结构看 lineage 的 moe 那一条。
  同代另有 Qwen1.5-MoE-A2.7B-Chat 与 GPTQ-Int4 发布，都是同一份结构，不另录。

open_questions:
  - >-
    KV cache 的实际落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底，
    bytes_basis 是 dtype_fallback，不能和别人按落盘格式算出来的理论下限比倍数
  - >-
    训练精度没有一手来源：config 的 torch_dtype: bfloat16 说的是发布权重，
    模型卡正文未核，故不填 precision.training
  - >-
    这一代是否由更小的稠密模型 upcycle 而来（专家中间维 1408 恰为稠密 5632 的 1/4、
    hidden 2048 与 Qwen1.5-1.8B 同宽，两处都像），本仓没有一手来源，没有写进记录
  - >-
    shared_expert_gate [1, 2048] 的激活函数（sigmoid 还是别的）在 config 里没有键，
    本仓按清单的形状只能确定它是单行投影，没有按实现核

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen1.5-moe-a2.7b 核：config 全部键、
    完整权重清单（4659 条目逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData /
    sha 与 safetensors tally。
    参数分项逐个按形状重算（见 R2），与清单求和、与 HF tally 三方比对。
    专家数由清单的 experts.N 下标集合定（0–59，24/24 层齐全），不是只读 config。
    共享专家个数与它的门由清单的张量名族数出来。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致。
    **原理上核不了的**：运行期标量（top_k 的实际选择策略、norm_eps、rope_theta、
    aux loss 系数）只有 config 一个来源；shared_expert_gate 的激活函数；
    KV 落盘精度；训练精度。后三项在 open_questions 里。
review:
  - id: R1
    field: params.active_decode
    severity: missing
    claim: >-
      草稿里 params 只有 counting_note，没有任何声明值（名字里的 A2.7B 没有填进去）
    finding: >-
      Qwen3.8-27B 的 R7 已经定过规矩：名字里的数就是厂商声明值，不填它闸口就看不见口径
      问题。本档名字只声明激活参数，所以填 active_decode: 2.7e+9 而不是 total ——
      而填进去立刻能看出一件事：2.7B 对得上的是**含输入词表**的 2,689,173,504（−0.40%），
      不是带宽口径的 2,378,008,576（−11.9%）。
      reconcile() 不核 active_decode（只核 params_total / 层数 / 专家数 / 外部 tally），
      所以这个比对是本记录在 counting_note 里自己做的
    resolution: corrected
    changed_to: >-
      补 active_decode 2.7e+9 与七项 breakdown，counting_note 写明两个口径各自的偏差；
      total 仍不填（名字没有声明总量），并写明 Gate B 那一项因此 skip
  - id: R2
    field: params.breakdown
    severity: unsupported
    claim: 七项分项与合计 14,315,784,192
    finding: >-
      逐项按形状重算：expert 24 × 60 × 3 × 2048 × 1408 = 12,457,082,880；
      shared_expert 24 × (3 × 2048 × 5632 + 2048) = 830,521,344（含每层那张 [1, 2048] 的门）；
      attention 24 × (4 × 2048² + 3 × 2048) = 402,800,640；
      router 24 × 60 × 2048 = 2,949,120；norm 24 × 2 × 2048 + 2048 = 100,352；
      embed 与 lm_head 各 151936 × 2048 = 311,164,928。
      七项合计与清单求和、与 HF tally 三者逐位相同
    resolution: confirmed
  - id: R3
    field: arch.moe.shared_experts
    severity: miscategorized
    claim: >-
      草稿把 shared_experts 留在 arch 的 official 前缀继承下
    finding: >-
      config 没有「共享专家个数」这个键，只有 shared_expert_intermediate_size 5632。
      1 个是从清单数出来的（24/24 层各一套 mlp.shared_expert.* 加一张 shared_expert_gate）。
      继承 official 会让它绕过 Gate C —— 旗舰那份的 R6 就是这个错
    resolution: corrected
    changed_to: >-
      arch.moe.shared_experts 标 derived，同时把 dense_intermediate / balance /
      storage_note / activation / norm / head_dim 一并标 derived
  - id: R4
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: >-
      「专家中间维 1408 是稠密 5632 的 1/4」这句话单独拿出来像是在说专家变小了
    finding: >-
      1/4 这个比值要配上 top_k 才有意义：被激活的 4 个专家合起来的中间维
      4 × 1408 = 5632，**恰好等于一份稠密 FFN**，再加常驻共享专家的 5632，
      每 token 的 FFN 中间维是两份稠密 FFN 的量。只写 1/4 会让人以为计算量降了。
      README 里 DeepSeek 那条「专家更多更细，但单专家反而变大了」是同一类口径陷阱
    resolution: corrected
    changed_to: >-
      moe 那一条同时给出 4 × 1408 = 5632 与共享专家的 5632，并在 benefit 里
      写明每 token 的 FFN 中间维是两份稠密 FFN
  - id: R5
    field: bottlenecks
    severity: imprecise
    claim: >-
      草稿里「总量和每 token 搬运量拉开了 5.4 倍（14.32B / 2.65B）」
    finding: >-
      两处错叠在一起。(1) 分子分母口径不同：14.32B 含输入词表，激活量不含；
      (2) 2.65B 这个数在本记录里没有任何出处 —— 带宽口径是 2,378,008,576、
      可比官方口径是 2,689,173,504，草稿写的是两者之间一个不存在的中间值。
      同口径重算：两侧都扣输入词表是 14,004,619,264 / 2,378,008,576 = **5.89 倍**，
      两侧都含输入词表是 14,315,784,192 / 2,689,173,504 = 5.32 倍。
      CLAUDE.md 的「不同口径之间不算倍数」与「一个乘式逐因子验」点名的就是这件事
    resolution: corrected
    changed_to: >-
      finding 改为 5.89 倍并写明两侧分母都已扣掉输入词表；
      quantified 里补一句说明 87.0% 与 5.89 倍用的分母不同
  - id: R6
    field: infra_signals
    severity: overreach
    claim: >-
      草稿里「细粒度专家 + 共享专家这个组合在 Qwen 线此后一直延续」
    finding: >-
      Qwen3 一代（qwen3-235b-a22b / qwen3-32b 同代）**把共享专家去掉了**：
      config 没有 shared_expert_intermediate_size，清单里 36945 个条目一个
      shared_expert 都没有。到 qwen3-next-80b-a3b 又加回来。
      所以是「反复出现」而不是「一直延续」——「零例外」在下一代通常就不成立
      （skill 规则 5）
    resolution: corrected
    changed_to: 改成「此后每一代都还在，中间只有 Qwen3 一代去掉过，下一代又加回来」
  - id: R7
    field: hf.sha
    severity: wrong
    claim: >-
      草稿里的 hf.sha 与 hf.last_modified 是按 12 位前缀「补全」的，不是从取数产物读的
    finding: >-
      本轮对全部新记录做了一次机械核对：把每份 YAML 的 hf.sha / hf.last_modified
