bottlenecks:
  - dimension: weight-bandwidth
    finding: >-
      MoE 的第一次出现就把「总量」和「每 token 搬运量」拉开了 **5.89 倍**
      （14,004,619,264 / 2,378,008,576，两侧都已扣掉只 gather 一行的输入词表）：
      权重存储 26.67 GiB 要全部驻留，而每 token 真正搬运的只有 2,378,008,576 × 2 B
      = 4.43 GiB。这是 MoE 对 infra 的核心影响 —— 容量按总量规划、带宽按激活量规划，
      两个数从此不能互相替代。
    quantified: >-
      权重存储 26.67 GiB（含输入词表）；带宽口径每 token 4.43 GiB
      （2,378,008,576 × 2 B）。专家总量占 87.0%（12,457,082,880 / 14,315,784,192），
      而被激活的只有 4/60。两个比值的分母不同：87.0% 用的是含输入词表的总量，
      5.89 倍用的是两侧都扣掉输入词表后的量
    visibility: public
  - dimension: ep-comm
    finding: >-
      top-4 配 24 个 MoE 层，EP 部署下每 token 的 dispatch + combine 是
      2 × 4 × 2048 × 2 B × 24 层 = 786,432 B。这一代专家细
      （单专家 8,650,752 参数）而数量多，跨机 EP 下通信占比会压过计算。
    quantified: 786,432 B/token（EP>1，BF16 激活，公式见 data/derived/）
    visibility: public
  - dimension: operator-gap
    finding: >-
      三条 FFN 路径要同时支持：router 打分 + top-4 选择、60 个独立张量上的
      grouped GEMM、以及带自己门控的常驻共享专家旁路。共享专家的门是
      [1, 2048] 的单行投影接 sigmoid，和 router 的 softmax 打分不是同一个算子。
    visibility: public

infra_signals:
  - text: >-
      Qwen 的 MoE 从一开始就是「细粒度路由专家 + 常驻共享专家」这个组合，
      而不是粗粒度的 top-2 专家。细粒度（专家中间维 = 稠密的 1/4）意味着
      grouped GEMM 的单个 M 维更小、kernel 效率更依赖批量聚合；
      共享专家意味着每层有一条不经路由的常驻通路。
      这两件事在 Qwen 线此后的每一代都还在（qwen2-57b-a14b、qwen3-next-80b-a3b
      及其后），中间只有 Qwen3 一代把共享专家去掉过（见 qwen3-235b-a22b），
      下一代又加回来 —— 所以它是**反复出现**而不是「一直延续」。
    evidence: judgement
    horizon: settled
    axis: moe
  - text: >-
      专家逐个独立存张量这件事决定了算子签名。这一代 24 层 4320 个专家条目，
      grouped GEMM 要从 60 个 [1408, 2048] 上收集；到 Qwen3.5 一代改成每层一个
      [512, 2048, 4096] 的 3 维堆叠张量，算子签名和 EP 切分方式都变了。
      跟踪 MoE 时「专家数 × top_k」不足以描述负载，存储布局要单独记。
    evidence: judgement
    horizon: settled
    axis: moe

