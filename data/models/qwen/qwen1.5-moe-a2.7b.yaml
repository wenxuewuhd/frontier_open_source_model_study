hf:
  repo: Qwen/Qwen1.5-MoE-A2.7B
  sha: 1a758c50ecb6350748b9ce0a99d2352fd9fc11c9
  last_modified: '2024-04-18T11:58:22.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: side
  predecessor: qwen1.5-72b
  successor: qwen2-57b-a14b
  # MoE 支线的分叉点。predecessor 指同代的稠密旗舰而不是时间上的前一个 ——
  # 这条支线从 Qwen3 起才变成旗舰线（见 qwen3-235b-a22b）。
  # 档位差异（72B 稠密 vs 14.3B MoE）是分叉的一部分，不是「缩小」：
  # 变化矩阵里 layers / hidden 这几格的差读作档位，结构轴看下面三条。
  changed_from_predecessor:
    - axis: moe
      text: >-
        **家族首个 MoE**。60 个路由专家 top-4，专家中间维 1408 = 稠密中间维 5632 的 1/4
        —— 细粒度切分：被激活的 4 个专家合起来的中间维 4 × 1408 = 5632，
        恰好等于一份稠密 FFN。另有**一个常驻共享专家**（中间维 5632，整份稠密 FFN 大小），
        它自带一张 [1, 2048] 的门 shared_expert_gate —— config 没有「共享专家个数」这个键，
        1 个是从清单里 24/24 层各一套 mlp.shared_expert.{gate,up,down}_proj
        加一张 shared_expert_gate 数出来的。专家逐个独立存张量
        （24 层 × 60 专家 × 3 投影 = 4320 条目）
      benefit: >-
        每 token 的 FFN 中间维是 5632（路由）+ 5632（共享）= 两份稠密 FFN 的量，
        而专家权重总量是 12,457,082,880（占总参数 87.0%）—— 用 87% 的权重换
        2 份 FFN 的计算。代价在算子与通信：grouped GEMM 要从 60 个独立张量上收集
        （不是一个 3 维堆叠张量，那种布局要到 Qwen3.5 才出现），
        EP 切分按张量切；router 打分 + top-4 + 共享专家旁路三条路径要同时跑
    - axis: attention
      text: >-
        仍是 MHA（16 query 头 / 16 KV 头 / head_dim 128，q/k/v 带 bias），
        与 qwen1.5-72b 同形态、只换档位。24 层同构
      benefit: >-
        注意力这条轴在 Qwen1.5 一代没有动，所以这一代的新增算子全部在 MoE 侧。
        每层 2 × 16 × 128 = 4096 元素、24 层 98,304 元素/token，
        比 72B 那份低一个量级 —— 但那是档位小，不是结构改进
    - axis: context
      text: 8192（max_position_embeddings），比同代稠密旗舰的 32768 短
      benefit: >-
        上下文短 + 层数少，所以这一代的 KV 完全不是问题（8K 满上下文 1.50 GiB）。
        MoE 这一支要到 qwen2-57b-a14b 才拿到 128K

params:
  active_decode: 2.7e+9
  breakdown:
    expert: 12457100000.0
    shared_expert: 830521000.0
    attention: 402801000.0
    embed: 311165000.0
    lm_head: 311165000.0
    router: 2949120.0
    norm: 100352.0
  counting_note: >-
    **模型名只声明激活参数（A2.7B），不声明总量**，所以 params.total 不填 ——
    Gate B 的「参数总量」一项相应 skip，这是声明值缺失而不是本仓没算：
    实测全量 14,315,784,192，与 HF 平台自己从分片头统计的 safetensors tally 逐位相同。
    breakdown 是按完整权重清单（8 分片 4659 条目，全 BF16、无量化 scale、无低位打包）
    实测的分项，取 6 位有效数字。
    **A2.7B 对得上的是可比官方口径、不是带宽口径**：含输入词表的激活参数
    2,689,173,504 对 2.7B 是 −0.40%；不含输入词表的带宽口径是 2,378,008,576，
    对 2.7B 是 −11.9%。做带宽估算用后者，和别人公布的「激活参数」对比用前者。
    激活的专家部分 = 12,457,082,880 × 4/60 = 830,472,192，常驻部分
    1,547,536,384（注意力 + 共享专家 + router + norm + lm_head）。
    **共享专家与 router 都是常驻**，前者 830,521,344 几乎和被激活的专家部分等量 ——
    这一代「激活 2.7B」里有 31% 是共享专家。
    词表与输出层不共享权重（各 311,164,928，tie_word_embeddings: false）。
    权重存储 26.67 GiB。

context:
  max: 8192

arch:
  layers: 24
  hidden: 2048
  vocab: 151936
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU
  position: RoPE theta 1e6，作用在全部 head_dim 维（config 无 partial_rotary_factor）

  attention:
    type: MHA
    num_heads: 16
    num_kv_heads: 16
    head_dim: 128
    head_dim_note: >-
      head_dim 不是这一代的 config 字段，128 = hidden 2048 / num_attention_heads 16，
      由清单印证：q/k/v/o 四张都是 [2048, 2048]。num_key_value_heads 与
      num_attention_heads 同为 16，不做分组共享。q/k/v 各带一张 [2048] 的 bias，
      o_proj 没有
    layer_pattern: 24 层同构，每层产出自己的 KV，无跨层共享、无滑窗、无稀疏

  ffn:
    type: moe
    layer_pattern: >-
      24 层全是 MoE 层（decoder_sparse_step: 1，清单里 24/24 层都有 experts 与
      shared_expert），没有「前 k 层走稠密」的安排 —— first_k_dense 这件事
      Qwen 线从头到尾都没有用过

  moe:
    routed_experts: 60
    shared_experts: 1
    top_k: 4
    intermediate: 1408
    dense_intermediate: 5632
    routing: 带辅助损失（router_aux_loss_coef 0.001）
    balance: aux-loss
    storage_note: >-
      专家逐个独立存张量：每层 60 个专家 × 3 个投影（gate/up/down 各自一张
      [1408, 2048] / [1408, 2048] / [2048, 1408]），24 层共 4320 个条目。
      grouped GEMM 因此吃 2 维张量的列表而不是 3 维堆叠张量，EP 切分按张量切。
      共享专家是另一套三张 [5632, 2048] / [5632, 2048] / [2048, 5632] 加一张
      [1, 2048] 的门，走旁路、不经 router

precision:
  weights_release: [BF16]
  quantization:
    per_subsystem:
      attention: BF16
      expert: BF16
      shared_expert: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（8 分片 4659 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空，4659 条全是 BF16。所以各子系统 BF16 是全量结论而不只是代表值。
      这一代没有 quantization_config，不存在 scale 张量与量化块

