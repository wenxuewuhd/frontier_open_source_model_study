notes: >-
  Qwen 线的结构转折点（2025-09）：混合线性注意力、512 专家 top-10、首个 MTP 草稿块
  三件事同时进来。它在发布时不是旗舰（同期旗舰是 qwen3-235b-a22b），
  但 Qwen3.5 起的主线用的就是这一代的结构，所以本仓把它接在主链上
  （track: main，predecessor = qwen3-235b-a22b）。
  **本代 config 不声明的四件事**：混合层集合（只给 interval）、输出门、
  状态精度、MTP 层数 —— 全部只在权重里，Qwen3.5 的 config 才把前三件写出来。
  同代的 Qwen3-Coder-Next（2026-01）主干名族与本记录逐族相同、整块没有草稿块，
  rope_theta 1e7 → 5e6，是领域变体，不另录 —— 但它的 HF tally 给了本记录
  草稿块参数量一个独立的外部交叉验证（见 sources[1] 与 R2）。

open_questions:
  - >-
    **状态精度没有一手来源**：本代 config 没有 mamba_ssm_dtype 键，
    模型卡的 Gated DeltaNet 一节也只给头数与头维、不给精度
    （Qwen3.5 起才有且为 float32），清单里 A_log / dt_bias / linear_attn.norm
    三类权重都是 BF16，但「权重精度」不等于「运行期状态精度」。
    本记录不填 state_dtype，推导按模型 dtype 兜底；若实际是 FP32，
    每序列状态从 38.25 MiB 翻到 76.50 MiB
  - >-
    矩阵状态的实际存储是否就是一个 [32, 128, 128] 的张量需按实现确认
    （两维都是 128，维序不影响容量）；状态头数与 conv 通道数已由清单确定
  - >-
    短卷积的状态按全窗 4 计是上界，实现若只存 k−1 = 3 个位置会低 1/4
  - >-
    输出门的激活函数未知：本代 config 没有 output_gate_type 键
    （Qwen3.5 起是 swish、Qwen3.8-Flash-Next 是 sigmoid），门的存在由形状定、
    函数形式没有来源
  - >-
    KV cache 的实际落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底，
    bytes_basis 是 dtype_fallback
  - >-
    训练精度没有一手来源：config 的 torch_dtype: bfloat16 说的是发布权重，
    而**模型卡正文本轮已读**（README.md @ 9c7f2fbe8446）——
    Model Overview 给了训练**数据量**（Pretraining 15T tokens）但没有训练精度，
    故不填 precision.training

reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序对 facts/qwen3-next-80b-a3b 核：
    config 全部键（含「缺哪些键」—— layer_types / attn_output_gate / mamba_ssm_dtype /
    任何 MTP 键都不存在）、完整权重清单（75944 条目逐项 numel / dtype / 层索引、
    experts.N 下标集合 0–511）、repoinfo 的 tags / cardData / sha 与 safetensors tally，
    以及 facts/qwen3-coder-next 的名族与 tally（草稿块的外部核对，见 R2）。
    混合层的两个集合（full 12 层、linear 36 层）由清单的层索引交并集定，
    已验两集合无交集、并集为 0–47 全部 48 层。
    conv 通道恒等式在 36/36 层上逐层验过，并查出本代与 README 写法不符（见 R3）。
    参数八项逐项按形状重算并与清单求和、HF tally 三方比对；
    草稿块 1,650,471,424 由两条独立路径确认（见 R2）。
    derive.py 以默认 --ep 1 带 --model 重跑，0 处不一致。
    **原理上核不了的**：状态精度、矩阵状态的实际布局、conv 窗长、输出门的函数形式、
    KV 落盘精度、训练精度，都在 open_questions 里。
review:
  - id: R1
    field: arch.attention.linear_state.state_layout_note
    severity: wrong
    claim: >-
      草稿按 README「Qwen3.8 复核」一节的恒等式写「conv1d 首维 = in_proj_qkv 输出维」，
      于是 conv 通道数取 12288
    finding: >-
      本代没有 in_proj_qkv 这张张量 —— q/k/v **和 z 门**融合成一张
      in_proj_qkvz [12288, 2048]，而 conv1d.weight 是 [8192, 1, 4]。
      8192 = q 2048 + k 2048 + v 4096，**z 的 4096 不参与短卷积**。
      按 12288 算每层 conv 状态会高估 1.5 倍（98,304 B 对实际 65,536 B，BF16）。
      恒等式的正确形式是「q + k + v 三段之和」，即 derive.py 现在算的
      2 × num_key_heads × key_head_dim + num_value_heads × value_head_dim ——
      它在本代 36/36 层、Qwen3.5 两档、Qwen3.8 三档上都零例外。
      **README 那一节的写法钉的是 Qwen3.5 之后的布局**，用在本代会错
      （skill 规则 5：结构规律要钉代际）
    resolution: corrected
    changed_to: >-
      state_layout_note 改为按三段之和写并列出本代的 z 例外；
      infra_signals 加一条，交接笔记里也记了 README 该补的代际作用域
  - id: R2
    field: params.excludes
    severity: unsupported
    claim: excludes [draft]，草稿块 1,650,471,424
    finding: >-
      两条独立路径给同一个数。(1) 本仓按清单归类求和：mtp.* 的 1553 个条目
      合计 1,650,471,424（逐项按形状重算过：1 个 full attention 层 27,262,976
      + 512 专家 1,610,612,736 + 共享专家 3,147,776 + router 1,048,576
      + fc 8,388,608 + 7 张 norm 共 10,752）。
      (2) 外部：Qwen3-Coder-Next 的主干名族与本记录逐族相同但没有 mtp.*，
      HF 给它的 tally 是 79,674,391,296，与本记录 tally 之差恰为 1,650,471,424，
      **逐位相同**。第二条不依赖本仓任何一行代码，也不依赖本仓的子系统归类
    resolution: confirmed
  - id: R3
    field: arch.attention.hybrid.layer_types_count
    severity: unsupported
    claim: linear 36 / full 12
    finding: >-
      config 没有 layer_types（Qwen3.5 才有），只有 full_attention_interval: 4。
      所以两个数是从清单的层索引算的：trunk 的 self_attn.q_proj 恰在
      3/7/11/15/19/23/27/31/35/39/43/47（12 层，全部 ≡ 3 mod 4），
      linear_attn.conv1d 恰在其余 36 层，**两个集合交集为空、并集是 0–47 全部 48 层**。
      只按 48 / 4 = 12 推会得到同一个数但不知道落在哪些层，
      而层集合是缓存乘式的第一个因子
    resolution: confirmed
  - id: R4
    field: arch.decoding.mtp_layers
    severity: missing
    claim: >-
      草稿没有 arch.decoding —— config 里没有任何 MTP 键，很容易就漏了
    finding: >-
      清单里有一整套 mtp.*（1553 条目、1,650,471,424 参数），是个自带注意力与
      512 专家 MoE 的完整 transformer 块。config 既没有 num_nextn_predict_layers
      也没有 mtp_num_hidden_layers。
      DeepSeek 一代的错是「config 声明 1 而权重里 3 块」，这里是反方向：
      **config 零声明而权重里有 1 块**。漏掉它有两处实害：
      参数量口径（+1.66% 对 −0.41%）与 KV 层数（开草稿侧 12 → 13 层）
    resolution: corrected
    changed_to: >-
      补 arch.decoding.mtp_layers 1 与 mtp_layers_note（标 derived），
      hybrid.note 与 excludes 一并写明主干口径与草稿口径的差
  - id: R5
    field: arch.attention.output_gate
    severity: missing
    claim: 草稿没有 output_gate（config 本代没有这个键）
    finding: >-
      13/13 个 q_proj（12 主干 full 层 + 草稿块）都是 [8192, 2048] = 2 × 16 × 256，
      而 o_proj 入口是 4096 = 16 × 256 —— 输出维翻倍的那一半是门。
      Qwen3.5 起 config 才有 attn_output_gate: true。
      按 num_heads × head_dim 推 q_proj 会低一半（4096 对 8192），
      整模型少算 13 × 4096 × 2048 = 109,051,904
    resolution: corrected
    changed_to: >-
      补 output_gate（enabled true、type 写「未声明」）与 head_dim_note 里的两半说明，
      标 derived
  - id: R6
    field: arch.attention.linear_state.state_dtype
    severity: unsupported
    claim: >-
      草稿按同族 Qwen3.8 两档的写法填了 state_dtype: FP32
    finding: >-
      那两档的 FP32 来自 config 的 mamba_ssm_dtype: float32，而**本代 config 没有这个键**。
      清单里 A_log / dt_bias / linear_attn.norm 都是 BF16，但那是权重精度、
      不是运行期状态精度，两者不是一回事。
      从别代抄一个容量关键参数，正是 license 那一类错的同构版本
    resolution: corrected
    changed_to: >-
      不填 state_dtype，推导按模型 dtype 兜底（每序列 38.25 MiB），
      并在 open_questions 写明若实际是 FP32 要翻倍到 76.50 MiB
  - id: R7
    field: params.counting_note
    severity: unsupported
    claim: A3B 是档位名，不填 active_decode
    finding: >-
      两种口径都算了：带宽口径 3,563,858,230 对 3B 是 +18.8%、
      含输入词表 3,875,023,158 是 +29.2%，**都远超 2% 容差**。
      而同代 Qwen3-30B-A3B（30.5B 总）与 Qwen3.5-35B-A3B（35.9B 总）也都叫 A3B。
      所以这里按 glm-4-9b 的 R12 定下的做法：声明值与任何口径都对不上时，
      判成档位命名并把两个偏差写出来，而不是硬填一个会让 Gate B 显示 ok 的数
    resolution: confirmed
  - id: R8
    field: bottlenecks
    severity: imprecise
    claim: >-
      草稿里「混合结构把 KV 压了 7.83 倍」
    finding: >-
      7.83 倍是**每 token 元素数**的比（96,256 → 12,288），对；
      但它掩盖了同代上下文从 40960 涨到 262144。满上下文的占用
      7.34 GiB → 6.00 GiB，只降 18%。两个数都要给 ——
      和 qwen2-72b 的 R4 是同一类（每 token 比 vs 满上下文比）。
      另外这一代多出一个前代没有的分量（每序列 38.25 MiB），
      它在短上下文、大批量下才是主角（4096 上下文时占 28.9%）
    resolution: corrected
    changed_to: >-
      attention 条给每 token 的 7.83 倍，context 条给满上下文的「×6.4 上下文而缓存还略降」，
      bottleneck 里给两个上下文档位下状态的占比
  - id: R9
    field: sources
    severity: missing
    claim: >-
      本记录原来只有 config.json 一个来源，混合层集合、输出门、共享专家个数、
      草稿块的存在四件事全靠权重清单推，并且把 A3B 判成了纯档位名
    finding: >-
      本轮按 main 并入的来源优先级规则补读模型卡，五件事有了一手来源：
      (1) **Hybrid Layout: 12 × (3 × (Gated DeltaNet → MoE) → 1 × (Gated Attention → MoE))**
      —— 混合比例与 12 个重复单元是厂商写出来的，与本仓从清单读的层集合
      （full 在 3/7/…/47）一致，R3 的结论因此多了一条独立来源；
      (2) **Number of Shared Experts: 1** —— 共享专家个数从 derived 变成有卡可依
      （而上一代 qwen3-235b-a22b 的卡**没有这一行**，与它清单零命中同向）；
      (3) **Rotary Position Embedding Dimension: 64** —— 等于 head_dim 256 ×
      partial_rotary_factor 0.25，本记录原来只有 config 的比例；
      (4) 机制的厂商名是 **Gated DeltaNet** 与 **Gated Attention**，
      本记录原来只有本仓自己的描述「门控线性注意力 + 短卷积」；
      (5) **Non-Embedding: 79B** 把 excludes [draft] 这条链钉死了（见 counting_note）。
      反向的一条：**「3B activated」是卡上的声明值而不只是名字**，所以 active_decode
      该填 —— 但它对不上本仓任何一个口径（+18.8% / +29.2% / +8.4%），
      填上之后这个口径问题才看得见（Qwen3.8-27B 的 R7 定的就是这条规矩）。
      卡里仍然没有 MTP 层数（只有权重有）、没有状态精度、没有训练精度
    resolution: corrected
    changed_to: >-
      新增 sources 的 modelcard 条目；linear_state.mechanism 写上厂商名 Gated DeltaNet；
      补 active_decode 3.0e+9 并在 counting_note 写明四种口径的偏差；
      counting_note 补 Non-Embedding 的双重扣法验证；
      补 context.train_native 与 extension_method（厂商称可扩到 1,010,000、未说方法）
