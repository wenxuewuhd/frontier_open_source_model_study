hf:
  repo: Qwen/Qwen3-Next-80B-A3B-Instruct
  sha: 9c7f2fbe84461fa4198f2cbd522b1c1e4c4a2b94
  last_modified: '2025-09-17T04:31:04.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: main
  predecessor: qwen3-235b-a22b
  successor: qwen3.5-397b-a17b
  changed_from_predecessor:
    - axis: attention
      text: >-
        **混合线性注意力第一次出现**，这是整条 Qwen 线最大的一次结构转折。
        48 层按 3:1 分成 36 层线性 + 12 层 full attention
        （config 只给 full_attention_interval: 4，**没有 layer_types** ——
        层集合是从清单读的：trunk 的 self_attn.q_proj 恰在 3/7/11/…/47，
        linear_attn.conv1d 恰在其余 36 层，两个集合无交集）。
        线性层的张量是一张融合的 in_proj_qkvz [12288, 2048]
        （= q 16×128 + k 16×128 + v 32×128 + **z 32×128**）、
        in_proj_ba [64, 2048]（= b 32 + a 32，每状态头一个）、
        conv1d [8192, 1, 4]、A_log [32]、dt_bias [32]、norm [128]、
        out_proj [2048, 4096]。full 层仍是 GQA（16 头 / 2 KV 头）但 head_dim
        128 → **256**，且 q_proj 是 [8192, 2048] = **2 ×** 16 × 256 ——
        输出门已经在权重里，而 config 这一代没有 attn_output_gate 这个键
      benefit: >-
        累积 KV 的层数从 94 降到 12，每层宽度 1024 → 1024（2 × 2 × 256，
        KV 头减半而 head_dim 翻倍，正好抵消），每 token 从 96,256 元素
        降到 **12,288 元素，7.83 倍**。代价是多出一类显存对象：
        36 层各带一份与上下文无关的递归状态（矩阵 32×128×128 + 短卷积 4×8192），
        **每序列固定 38.25 MiB**（BF16 兜底口径）。
        容量模型从此必须写成「per_token × 上下文 + per_sequence」两个分量，
        262144 满上下文是 6.00 GiB + 38.25 MiB
    - axis: moe
      text: >-
        **共享专家回来了**（前代删掉的那条常驻通路）：每层一套
        mlp.shared_expert.{gate,up,down}_proj（中间维 512）加一张
        shared_expert_gate [1, 2048]。路由专家 128 → **512**，top_k 8 → **10**，
        专家中间维 1536 → 512（相对稠密 5120 是 1/10）。
        专家仍逐个独立存张量（48 层 × 512 × 3 = 73,728 条目，占总条目 97.1%）
      benefit: >-
        每 token 的 FFN 中间维 = 5120（路由 10 × 512）+ 512（共享）= 5632，
        仍是一份稠密 FFN 上下。**单专家缩到 3 × 2048 × 512 = 3,145,728**
        （前代 18,874,368，0.17 倍），grouped GEMM 的单个 M 维更小、
        更依赖批量聚合；而 512 个专家让 EP 的目的地分布更散
    - axis: decoding
      text: >-
        **家族首个 MTP 草稿块**，而且 **config 里没有任何 MTP 键** ——
        它只在权重里：mtp.fc [2048, 4096]、mtp.pre_fc_norm_embedding /
        pre_fc_norm_hidden、mtp.layers.0 的一整套 full attention +
        512 专家 MoE + 共享专家 + router、mtp.norm。共 1553 个条目、
        1,650,471,424 参数
      benefit: >-
        草稿块自带完整的注意力与 MoE，是个真正的 transformer 块而不是一个轻头 ——
        它的参数量相当于主干的 2.07%，但**开草稿侧时累积 KV 的层数从 12 变 13**
        （+8.3%）。外部交叉验证：Qwen3-Coder-Next 没有这个块，
        它的 HF tally 与本记录恰好差 1,650,471,424
    - axis: context
      text: 40960 → **262144**（max_position_embeddings），rope_theta 1e6 → 1e7，partial_rotary_factor 0.25
      benefit: >-
        上下文 ×6.4 与混合注意力是同一代的两件事：满上下文的 KV 从
        7.34 GiB（40960 × 94 层）变成 6.00 GiB（262144 × 12 层），
        **放大 6.4 倍上下文而缓存还略降**。partial_rotary_factor 0.25
        意味着 rope 只作用在 head_dim 256 的前 64 维
    - axis: scale
      text: 235.1B 总 / A22B → 81.3B 总 / A3B
      benefit: >-
        总量降到 1/2.9 而带宽口径的激活参数从 21,568,433,664 降到 3,563,858,230
        （1/6.1）—— 激活占比 9.2% → 4.5%。这一代是「小总量 + 更小激活」的档位，
        不是旗舰规模的继续放大

params:
  total: 8.0e+10
  active_decode: 3.0e+9
  excludes: [draft]
  breakdown:
    expert: 77309400000.0
    draft: 1650470000.0
    attention: 1541020000.0
    embed: 311165000.0
    lm_head: 311165000.0
    shared_expert: 151093000.0
    router: 50331648.0
    norm: 209408.0
  counting_note: >-
    total 取自模型名（80B），属厂商声明；breakdown 是本仓按完整权重清单
    （41 分片 75944 条目，全 BF16、无量化 scale、无低位打包）实测的分项，取 6 位有效数字。
    实测全量 81,324,862,720，与 HF 平台自己从分片头统计的 safetensors tally 逐位相同。
    对 80B 是 +1.66%（容差内）；扣掉草稿块（1,650,471,424）后是 79,674,391,296，
    对 80B 是 **−0.41%**，偏差更小，所以 excludes 取 [draft]。
    **模型卡的第二个口径把这个扣法钉死了**：「Non-Embedding: 79B」——
    79,674,391,296 再减两份词表（输入 311,164,928 + lm_head 311,164,928）是
    79,052,061,440，对 79B 是 **+0.07%**；若不先扣草稿块，
    减两份词表得 80,702,532,864、对 79B 是 +2.2%、出容差。
    即「先扣草稿块、再扣两份词表」这条链上两个声明值同时吻合，
    而任一步省掉都对不上 —— excludes [draft] 不再只是「偏差更小」的选择。
    **这个扣法有外部证据，不只是选偏差小的那个**：Qwen3-Coder-Next 的主干名族与本记录
    逐族相同而整块没有 mtp.*，它的 HF tally 恰好就是 79,674,391,296 ——
    即「本记录扣掉草稿块」与「另一个仓根本没有草稿块」两条路得到同一个数，逐位相同。
    **「3B activated」在本档是模型卡上的声明值**（不只是名字里的 A3B），
    所以 active_decode 填 3e+9 —— 但它对不上本仓的任何一个口径：
    带宽口径 3,563,858,230 是 +18.8%、含输入词表 3,875,023,158 是 +29.2%、
    照 Non-Embedding 的办法再扣掉 lm_head 得 3,252,693,302 是 +8.4%，
    **三种都远超 2% 容差**；只有「激活专家 + 注意力」两项 3,051,058,998（+1.7%）
    落在容差内，但那个组合没有任何来源支持（它恰好不含共享专家、router、norm 与 lm_head）。
    同一个「A3B」还同时用在 Qwen3-30B-A3B（总量 30.5B）与 Qwen3.5-35B-A3B（35.9B）上，
    所以本仓的判断是：**它更像档位命名，而不是一个可对账的激活参数口径**。
    reconcile() 不核 active_decode，这个比对是本记录自己做的。
    激活的专家部分 = 77,309,411,328 × 10/512 = 1,510,043,190，常驻部分 2,053,815,040
    （注意力 + 共享专家 + router + norm + lm_head）—— **常驻比激活的专家还多**，
    因为线性注意力层的投影（in_proj_qkvz 等）全部常驻、合计 1.21B。
    词表与输出层不共享权重（各 311,164,928）。权重存储 151.48 GiB。

context:
  max: 262144
  train_native: 262144
  extension_method: >-
    模型卡写「262,144 natively and extensible up to 1,010,000 tokens」，
    但**没有说用什么方法扩**（config 的 rope_scaling 为 null）。
    本记录只记这个事实：原生 262144、厂商称可扩到 1,010,000。
    按 1,010,000 部署时本记录的 per_token 数要乘 3.85（6.00 GiB → 23.11 GiB），
    每序列状态不变

arch:
  layers: 48
  hidden: 2048
  vocab: 151936
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU
  position: >-
    RoPE theta 1e7，partial_rotary_factor 0.25 —— 只对 head_dim 256 的 1/4
    即前 64 维加 rope。这一代还是普通 RoPE（mRoPE 要到 Qwen3.5 才进主线）

  attention:
    type: hybrid
    num_heads: 16
    num_kv_heads: 2
    head_dim: 256
    head_dim_note: >-
      head_dim 256 是 config 显式字段，而 hidden 2048 / 16 头 = 128，又一次不相等。
      **full attention 层的 q_proj 是 [8192, 2048] = 2 × 16 × 256** —— 输出维翻倍，
      一半是 query、一半是输出门，而**本代 config 没有 attn_output_gate 这个键**
      （Qwen3.5 起才有）。o_proj 入口 4096 = 16 × 256 只对应 query 那一半，
      按 num_heads × head_dim 推 q_proj 会低一半。
      k_proj 与 v_proj 都是 [512, 2048]（512 = 2 × 256），缓存宽度按它们的输出维算：
      每层 2 × 512 = 1024 元素。另有每层 q_norm [256] 与 k_norm [256]（QK-Norm），
      归 norm 子系统
    partial_rotary_factor: 0.25
    layer_pattern: >-
      3:1 linear:full，full attention 落在层号 ≡ 3 (mod 4) 上 ——
      清单里 trunk 的 self_attn.q_proj 恰在 3/7/11/15/19/23/27/31/35/39/43/47 这 12 层，
      linear_attn.conv1d 恰在其余 36 层，两个集合无交集、并集是全部 48 层。
      config 只给 full_attention_interval: 4，没有 layer_types 列表
    output_gate:
      enabled: true
      type: 未声明（config 本代没有 output_gate_type；门的存在由 q_proj 的输出维翻倍定）
    hybrid:
      layer_types_count:
        linear: 36
        full: 12
      interval: 4
      note: >-
        12 层 full attention 的 KV 随上下文线性增长，36 层线性注意力只带每序列固定的
        递归状态，两者增长方式不同，容量规划必须分开算。
        以上层数都是主干口径（48 主干层 + 1 草稿块）：草稿块 mtp.layers.0 带一套与主干
        full attention 同名的 q/k/v/o 投影、没有 linear_attn，
        所以开草稿侧时累积 KV 的是 13 层、24576 → 26624 B/token，线性状态仍是 36 层。
        本记录与 data/derived/ 都按主干口径记账。
    linear_state:
      mechanism: >-
        **Gated DeltaNet**（厂商名，模型卡 Model Overview）：门控线性注意力 + 短卷积。
        卡把这一支的头数写成「32 for V and 16 for QK」，与 config 的
        linear_num_value_heads / linear_num_key_heads 一致
      num_key_heads: 16
      num_value_heads: 32
      key_head_dim: 128
      value_head_dim: 128
      conv_kernel_dim: 4
      state_layout_note: >-
        状态头数 32（= value 头数）由清单定：每层 linear_attn.A_log [32] 与
        dt_bias [32]，衰减参数每状态头一个。in_proj_ba [64, 2048] = 32 + 32 也对得上。
        **conv 通道数这一代不能写成「= in_proj_qkv 输出维」**：本代 q/k/v **和 z 门
        融合在一张** in_proj_qkvz [12288, 2048] 里，而 conv1d.weight 是
        [8192, 1, 4] —— 8192 = q 2048 + k 2048 + v 4096，**不含 z 的 4096**。
        正确的说法是「conv 通道数 = q + k + v 三段之和」，
        即 2 × num_key_heads × key_head_dim + num_value_heads × value_head_dim
        = 2 × 16 × 128 + 32 × 128 = 8192，36/36 层零例外。
        Qwen3.5 起投影拆成 in_proj_qkv + in_proj_z 两张，那一代起首维才与
        in_proj_qkv 的输出维相等。
        **状态精度本代没有一手来源**：config 没有 mamba_ssm_dtype 这个键
        （Qwen3.5 起才有，值是 float32），所以本记录不填 state_dtype，
        推导按模型 dtype（BF16）兜底 —— 若实际是 FP32，每序列状态要翻倍到 76.50 MiB。
        矩阵状态的实际存储是否就是一个 [32, 128, 128] 的张量仍需按实现核
        （两维都是 128，维序不影响容量）

  ffn:
    type: moe
    layer_pattern: >-
      48 层全是 MoE 层（decoder_sparse_step: 1、mlp_only_layers: []，
      清单里 48/48 层都有 experts 与 shared_expert）。
      **线性注意力层与 full attention 层的 FFN 形态相同** —— 混合只发生在注意力一侧

  moe:
    routed_experts: 512
    shared_experts: 1
    top_k: 10
    intermediate: 512
    dense_intermediate: 5120
    routing: 带辅助损失（router_aux_loss_coef 0.001），norm_topk_prob 为 true
    balance: aux-loss
    storage_note: >-
      专家逐个独立存张量：每层 512 个专家 × 3 个投影（[512, 2048] / [512, 2048] /
      [2048, 512]），48 层共 73,728 个条目，占总条目 97.1%。
      单专家只有 3,145,728 参数（前代 18,874,368 的 0.17 倍）。
      grouped GEMM 吃 2 维张量的列表；3 维堆叠布局要到 Qwen3.5 一代才出现。
      草稿块自己也有一套 512 专家的逐专家张量（1536 条目）

  decoding:
    mtp_layers: 1
    mtp_layers_note: >-
      **config 里没有任何 MTP 键**（既没有 num_nextn_predict_layers 也没有
      mtp_num_hidden_layers），1 这个数是从清单数出来的：mtp.layers.0 一个块，
      外加 mtp.fc / mtp.pre_fc_norm_embedding / mtp.pre_fc_norm_hidden / mtp.norm
      这些块外胶水张量。草稿块自带完整的 full attention（q/k/v/o + q_norm/k_norm）
      与 512 专家 MoE + 共享专家 + router，共 1553 条目、1,650,471,424 参数。
      DeepSeek 一代是「config 声明 1 而权重里有 3 块」，这里是「config 什么都不声明
      而权重里有 1 块」—— 两个方向都出现过，所以 MTP 层数一律以清单为准

precision:
  weights_release: [BF16]
  quantization:
    per_subsystem:
      attention: BF16
      expert: BF16
      shared_expert: BF16
      router: BF16
      draft: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（41 分片 75944 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空，75944 条全是 BF16 —— **包括 A_log 与 linear_attn.norm**。
      这一点要记住：Qwen3.5 一代把这两类升成了 F32，Qwen3.6 又回到 BF16，
      所以「线性注意力的衰减参数是什么精度」每代都要重测。
      这一代没有 quantization_config；同代另有 FP8 与 GGUF 发布，本仓不另录

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    ref:
      kind: modelcard
      url: https://huggingface.co/Qwen/Qwen3-Next-80B-A3B-Instruct
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      混合结构把显存账拆成两类对象：12 层 full attention 的 KV 随上下文线性增长，
      36 层线性注意力的递归状态每序列固定、与上下文长度无关。
      合成一个数表达不了 —— 长上下文下状态便宜（262144 时状态只占 0.62%），
      大批量短序列下状态贵（4096 上下文时状态占 28.5%）。
      引擎要同时管理两种生命周期不同的显存对象，而且线性状态无法像 KV 那样按 block 分页复用。
    quantified: >-
      24,576 B/token（12 层 × 1024 元素 × 2 B 兜底）+ 38.25 MiB/序列
      （36 层 × (32×128×128 矩阵 + 4×8192 短卷积) × 2 B 兜底）。
      262144 满上下文 6.00 GiB + 38.25 MiB；4096 上下文 96.00 MiB + 38.25 MiB。
      两个分量都是 dtype_fallback 口径 —— 状态精度本代 config 没有声明
    visibility: public
  - dimension: operator-gap
    finding: >-
      一代之内新增三类算子：门控线性注意力的递归状态更新、作用在 qkv 流上的
      depthwise 短卷积（通道 8192、窗长 4）、以及异构层调度（3:1 交替，
      图捕获与内存池都要按两种层组织）。full attention 一侧还多了输出门
      （q_proj 的后一半与 query 那一半逐元素相乘）。
      这是 Qwen 线第一次「同一套算子换形状」解决不了的代际。
    visibility: public
  - dimension: weight-bandwidth
    finding: >-
      带宽口径的激活参数 3,563,858,230，其中**常驻部分 2,053,815,040 比被激活的
      专家 1,510,043,190 还多** —— 线性注意力层的投影（in_proj_qkvz / in_proj_ba /
      out_proj，36 层合计 1,213,860,096）全部常驻。
      MoE 做得越稀疏，常驻部分在激活参数里的占比就越高：这一代常驻占 57.6%
      （其中注意力一项占 43.2%），而前代（94 层 GQA）常驻占 34.2%、注意力占 31.1%。
    quantified: >-
      带宽口径 3,563,858,230 × 2 B = 6.64 GiB/token；权重存储 151.48 GiB。
      常驻 / 激活 = 2,053,815,040 / 3,563,858,230 = 57.6%
      （前代 7,374,908,928 / 21,568,433,664 = 34.2%）；
      只算注意力一项是 1,541,015,808 / 3,563,858,230 = 43.2%
      （前代 6,702,497,792 / 21,568,433,664 = 31.1%）
    visibility: public

infra_signals:
  - text: >-
      **混合线性注意力在 Qwen 线从这一代开始**，而层分布在 config 里只有一个
      full_attention_interval: 4 —— 没有 layer_types 列表（Qwen3.5 才加）。
      要知道哪 12 层产出 KV，只能去清单里看 self_attn.q_proj 出现在哪些层。
      缓存容量的第一个因子（哪些层）在这一代拿不到声明值，必须实测。
    evidence: derived
    horizon: settled
    axis: attention
  - text: >-
      conv 状态的通道数这一代**不能**按「= in_proj_qkv 输出维」算：
      本代 q/k/v 与 z 门融合在一张 in_proj_qkvz [12288, 2048] 里，
      而 conv1d 是 [8192, 1, 4]，差的正好是 z 的 4096。
      恒等式要写成「= q + k + v 三段之和」才跨代成立 ——
      Qwen3.5 起投影拆开，两种写法才又重合。
      本仓在 README 的「Qwen3.8 复核」一节里把它写成了前一种，
      用在这一代会高估 1.5 倍（12288 对 8192）。
    evidence: derived
    horizon: now
    axis: attention
  - text: >-
      输出门在这一代的权重里已经存在（q_proj 输出维是 2 × heads × head_dim），
      而 config 没有 attn_output_gate 这个键。照 config 判断门的存在，
      会把 q_proj 的 N 维算低一半 —— 又一例「config 描述模块配置、不描述落盘形状」。
    evidence: derived
    horizon: settled
    axis: attention

