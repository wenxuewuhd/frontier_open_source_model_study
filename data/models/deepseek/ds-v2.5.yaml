context:
  max: 163840
  train_native: 4096
arch:
  layers: 60
  hidden: 5120
  vocab: 102400
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MLA
    num_heads: 128
    num_kv_heads: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim: 192
  ffn:
    type: moe
  moe:
    routed_experts: 160
    top_k: 6
    shared_experts: 2
    intermediate: 1536
    first_k_dense: 1
    expert_groups: 8
    routing: softmax 打分 / group_limited_greedy 选路
