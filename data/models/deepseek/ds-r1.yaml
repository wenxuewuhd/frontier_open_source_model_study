# 由 scripts/scaffold.py 从 config 生成，再按权重张量名清单校正。
# 机械字段来自 config（official），跨版本差异来自 facts/*/names.json 的比对（derived）。
id: ds-r1
family: deepseek
kind: llm
display_name: DeepSeek-R1
released: '2025-01-20'
license: mit
visibility: public
sources:
- kind: modelcard
  url: https://huggingface.co/deepseek-ai/DeepSeek-R1
  locator: config.json @ 56d4cbbb4d29
  accessed: '2026-10-29'
hf:
  repo: deepseek-ai/DeepSeek-R1
  sha: 56d4cbbb4d29f4355bab4b9a39ccb717a14ad5ad
  last_modified: '2025-03-27T04:01:59.000Z'
  pipeline_tag: text-generation
  gated: false
lineage:
  track: side
  predecessor: ds-v3
  successor: ds-v3.1
  changed_from_predecessor:
  - axis: training
    text: 与 V3 架构完全一致：张量名逐个相同，config 只差一个 transformers_version。推理能力来自后训练，对 infra 零新增算子
    benefit: 对 infra 零成本：算子清单、EP 切分、量化配置都不用动。这类版本值得在流程里尽早识别出来 —— 先比张量名集合，相同就不必重走评估。能力跃迁与 infra 工作量解耦得最彻底的一个例子：已经支持
      V3 的平台，支持 R1 不需要任何算子工作
params:
  counting_note: 未单独取全量权重清单：本版张量名集合与 ds-v3 逐个相同、逐子系统 dtype 也一致，参数量必然相同，见该记录。重复取一遍只是把同一个数算两遍。
context:
  max: 163840
  train_native: 4096
arch:
  layers: 61
  hidden: 7168
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MLA
    num_heads: 128
    num_kv_heads: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim: 192
    v_head_dim: 128
    head_dim_note: head_dim 192 = qk_nope 128 + qk_rope 64，**只适用于 QK 路径**。V 的每头维度是 v_head_dim 128，所以
      o_proj 入口宽度是 128 头 × 128 = 16384（权重实测 [hidden, 16384]），不是 128 × 192 = 24576。按单一 head_dim 推 o_proj
      会高 50%
  ffn:
    type: moe
    layer_pattern: 第 0–2 层稠密（intermediate 18432），其余为 MoE。稠密层的 FFN 比单个专家宽 9 倍，是全模型最宽的单个 GEMM
  moe:
    routed_experts: 256
    top_k: 8
    shared_experts: 1
    intermediate: 2048
    first_k_dense: 3
    expert_groups: 8
    routing: sigmoid 打分 / noaux_tc 选路
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 无辅助损失，靠逐专家偏置 mlp.gate.e_score_correction_bias 调节（第 3 层起，59 个）
    dense_intermediate: 18432
  decoding:
    mtp_layers: 1
precision:
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    per_subsystem:
      expert: FP8_E4M3
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      dense_ffn: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      draft: FP8_E4M3
    per_subsystem_scale:
      expert: FP32
      shared_expert: FP32
      attention: FP32
      dense_ffn: FP32
      draft: FP32
    subsystem_method: 抽样：每个子系统 6 个代表张量，共读 10 个分片头
    per_subsystem_block:
      expert: '[128,128]'
      shared_expert: '[128,128]'
      attention: '[128,128]+[128ceil,128]'
      dense_ffn: '[128,128]'
      draft: '[128,128]+[128ceil,128]'
