  gated: false
lineage:
  track: side
  predecessor: ds-v3
  successor: ds-v3.1
  changed_from_predecessor:
  - axis: training
    text: 与 V3 架构完全一致：张量名逐个相同，config 只差一个 transformers_version。推理能力来自后训练，对 infra 零新增算子
    benefit: 对 infra 零成本：算子清单、EP 切分、量化配置都不用动。这类版本值得在流程里尽早识别出来 —— 先比张量名集合，相同就不必重走评估。能力跃迁与 infra 工作量解耦得最彻底的一个例子：已经支持
      V3 的平台，支持 R1 不需要任何算子工作
params:
  counting_note: 本记录未取权重清单（facts 下只有张量名、没有形状与 dtype），所以不报参数量。DeepSeek 自 V3 起以 FP8 块量化发布、V4 起路由专家再降到
    FP4 两个一字节打包，按 safetensors 的 numel 直接求和会把参数量少算一半 —— 没有 dtype 就没有可信总量。要出总量需用 scripts/fetch_hf.py
    不带 --names-only 重取。
context:
  max: 163840
  train_native: 4096
arch:
  layers: 61
  hidden: 7168
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MLA
    num_heads: 128
    num_kv_heads: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim: 192
  ffn:
    type: moe
  moe:
    routed_experts: 256
    top_k: 8
    shared_experts: 1
    intermediate: 2048
    first_k_dense: 3
    expert_groups: 8
    routing: sigmoid 打分 / noaux_tc 选路
  decoding:
    mtp_layers: 1
precision:
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    per_subsystem:
      expert: FP8_E4M3
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      dense_ffn: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      draft: BF16
    per_subsystem_scale:
      expert: FP32
      shared_expert: FP32
      attention: FP32
      dense_ffn: FP32
    subsystem_method: 抽样：每个子系统 6 个代表张量，共读 9 个分片头
