context:
  max: 1048576
  train_native: 65536
arch:
  layers: 43
  hidden: 4096
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，w1/w3/w2 三件套），带截断 swiglu_limit 10.0
  position: RoPE theta 10000 + YaRN 外推；压缩条目另用 compress_rope_theta 160000
  attention:
    type: MQA-latent
    num_heads: 64
    num_kv_heads: 1
    qk_rope_head_dim: 64
    q_lora_rank: 1024
    o_lora_rank: 1024
    o_groups: 8
    sliding_window: 128
    head_dim: 512
    head_dim_note: >-
      head_dim 512 同时是 KV 条目宽（attn.wkv 与 compressor.norm 都是 512）、query 每头宽（wq_b [32768, 1024] = 64 × 512）
      与 V 每头宽（wo_a 每组输入 4096 = 8 头 × 512）。64 维 rope 在 512 之内（清单里 K 侧没有独立的 rope 投影）。
      num_kv_heads 1 × 512 是一个条目的宽度，不是每 token 的缓存 —— 每 token 见 measured_per_token
    sparse:
      mechanism: indexer 打分取 topk 后在选中 token 上做全注意力。只在 21 / 43 层上有 indexer —— 权重里的规律是 indexer 存在 ⟺
        compress_ratios[l] == 4，零例外。这一代没有独立的 indexer.wk，index K 由 attn.indexer.compressor.wkv 产出
      index_n_heads: 64
      index_head_dim: 128
      index_topk: 512
      index_kv_dim: 32
      index_kv_source: >-
        layers.N.attn.indexer.compressor.wkv.weight 输出维 256，但这是比值 4 的重叠窗口带来的 2 倍（参考实现 Compressor 的
        coff = 1 + overlap，压缩时前一半取重叠窗口、后一半取当前窗口，合成一个 head_dim 宽的条目）；条目宽以
        indexer.compressor.norm.weight [128] 为准，参考实现的 Indexer.kv_cache 是 [B, max_seq_len // 4, 128]。
        4 个 token 一个 128 维条目，每 token 32 元素。index_kv_dim 记的是每 token 值，不是条目宽度
    kv_sharing:
      declared_per_token_bytes:
        value: 3514
        tier: tech_report
        covers: per_token
        basis: >-
          全局 KV（随上下文线性增长的那一半）。本代另有滑窗缓冲区 5,636,096 B/序列，每序列固定，图上那个数不含它。上下文长度与批大小图注未给，但每
          token 量与这两者无关
        source: >-
          DeepSeek-V4.1-Flash 技术报告 Figure 1(b)「Global KV Cache Per Token (Bytes)」的数据标签
          （图文件 assets/dsv41_kv_cache.png @ 314113f8，2026-10-30 读）：DeepSeek-V1 389,120 /
          DeepSeek-V3.2 48,068 / DeepSeek-V4-Flash 3,514 / DeepSeek-V4.1-Flash 890。
          图注给的四个比值 8.1× / 13.7× / 3.9× / 437× 与这四个数逐个自洽，报告摘要与结论
          也两处复述 890 与「roughly 1/4 of DeepSeek-V4-Flash」
        note: >-
          与本仓按分量算的数对不上：元素 3440 个（global 2768 + indexer 672），公布值折合
          每元素 1.0215 B，而本仓 main KV 那一半按 BF16 兜底算 2 B。公布值采信，差额的根因
          写在 open_questions —— 本代 main KV 的落盘格式厂商没公布。
          注意本代缓存是异构的（比值 4 的层与比值 128 的层并存），本来就不该有单一每元素速率，
          所以不要拿 1.0215 去反推格式
      compress_ratios:
      - 0
      - 0
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 0
      note: 权重清单里 kv_b_proj / k_b_proj / v_b_proj 零命中，config 也不声明 kv_lora_rank：这一代没有 KV 上投影，不是 MLA。compress_ratios
        的项数 = 主干层数 + MTP 层数。
      measured_per_token:
        global_kv: 2768
        indexer: 672
        local_window_elems_per_sequence: 2818048
        note: >-
          元素口径，主干 43 层。每 token 元素 = 条目宽 / 压缩比，条目宽取 compressor.norm 的宽度，不取 wkv 输出宽度：
          比值 4 的 21 层 compressor.wkv / wgate / ape 宽 1024，但 compressor.norm [512] —— 参考实现在 ratio == 4 时用重叠窗口
          （coff = 2），压缩后合成一个 head_dim 512 的条目，Attention.kv_cache 是 [B, window + max_seq_len // ratio, 512]。
          全局 KV = 21 × 512/4 + 20 × 512/128 = 2688 + 80 = 2768；indexer = 21 × 128/4 = 672。
          attn.wkv 那一份是 sliding_window 的局部 KV，每序列固定、不随上下文增长：43 × 128 × 512 = 2818048 元素/序列，
          开草稿侧加 mtp.0 为 44 层 2883584。按未压缩宽度乘总层数会高估五倍以上；按 wkv 输出宽度算条目会再高估一倍（R1）
      layer_coverage: >-
        主干口径（43 层，另有 1 个 MTP 块 mtp.0）：compressor 在 L2–L42 共 41 层（存在 ⟺ compress_ratios[l] != 0）；
        indexer 在 L2, L4, …, L42 共 21 层（存在 ⟺ compress_ratios[l] == 4）；attn.wkv 与 attn_sink 在 L0–L42 全部 43 层，
        mtp.0 也有一份。mtp.0 没有 compressor 与 indexer（compress_ratios[43] = 0），开草稿侧只多一层滑窗 KV、per_token 不变。
        四类覆盖面不同，不能混着说「逐层」。这两条 ⟺ 规律只在本清单的 43 层 + mtp.0 上验过
    attn_sink: 每头一个可学习 sink（layers.N.attn.attn_sink，全部层及 MTP 层）。它进 softmax 分母，改变算子签名；config 里没有这个开关，只能从权重清单发现
  ffn:
    type: moe
  moe:
    routed_experts: 256
    top_k: 6
    shared_experts: 1
    intermediate: 2048
    routing: sqrtsoftplus 打分 / noaux_tc 选路
    hash_layers:
      count: 3
      mapping_tensor: layers.{0,1,2}.ffn.gate.tid2eid
      note: config 的 num_hash_layers=3 对应第 0/1/2 层各一张 ffn.gate.tid2eid [129280, 6]（词表大小 × top_k），即每个
        token id 映到 6 个专家。但这三层同时还有和其余层一样的完整打分投影 gate.weight [256, 4096]，缺的是 gate.bias（第 3 层起才有）。所以不能说它们「不算
        router」——查表与打分各自承担什么，形状定不了，需看实现。V4.1 起 tid2eid 退场
    storage_note: 逐专家独立张量（layers.N.ffn.experts.<n>.w{1,2,3}），不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP
      切分是切张量列表
    balance: 无辅助损失，靠逐专家可学习偏置 ffn.gate.bias 调节。41 个 = 主干 L3–L42 的 40 个 + mtp.0 的 1 个；hash 层 L0–L2 没有
  residual:
    type: mHC
    multiplier: 4
    sinkhorn_iters: 20
    eps: 1.0e-06
    coef_proj: 每层 hc_attn_fn 与 hc_ffn_fn 各一个 [24, 16384] F32（16384 = 4 × hidden），43 层合计每步读 135,266,304 B，不切分
    note: 残差流扩成 hc_mult 份并行拷贝，每层带 hc_attn_* / hc_ffn_* 系数张量；V4 到 V4-Flash-Vision-Exp 在 lm_head 前还有一组
      hc_head_*，V4.1 起撤掉。残差宽度乘 4 会改掉所有逐元素算子与 norm 的形状
  decoding:
    mtp_layers: 1
precision:
  # indexer 缓存的格式由厂商公布（见下 source）；main KV 这一代还不是 FP4，格式未公布。
  # 两半可信度不同，合计因此是 mixed 口径 —— 见核查 R15
  kv_cache_components:
    indexer:
      dtype: FP4
      block: 32
      scale_dtype: FP8_E8M0
      note: OCP MXFP4，E2M1 + 每 32 通道一个 E8M0 scale，每元素 0.5 + 1/32 = 0.53125 B
    source: >-
      indexer 的格式由厂商公布，出处是后继者的技术报告：DeepSeek-V4.1-Flash 技术报告 §2.4.4
      「FP4 Main KV Cache」开篇说 "DeepSeek-V4 already uses quantization-aware training (QAT)
      for FP4 indexer queries and keys, accelerating index computation and reducing the indexer
      cache size. We adopt the OCP-standard MXFP4 format"，讲的就是本代。
      同一段接着说 "We now extend QAT to the main KV cache" —— 所以 main KV 在本代还不是 FP4，
      而本代自己的模型卡只给权重精度（FP4 + FP8 Mixed，脚注限定为「专家 FP4、其余多为 FP8」），
      不给 KV 的格式或字节数，引用块没有报告 URL，仓里也没有报告 PDF。
      不要照厂商随仓 inference/ 的 act_quant / fp4_act_quant 调用读落盘格式：那些是 inplace 伪量化
      （原 dtype 回写、scale 不返回），只给 QAT 网格（判定依据见 deepseek-v41-flash 的 R36）
    note: >-
      global_kv 不在这里：main KV 的落盘格式本代未公布，derive.py 对这一半按模型 dtype 兜底，
      所以合计字节是 mixed 口径 —— indexer 那一半有一手依据，global 那一半是占位值。
      两半不能当成同一档，合计也不能和别代的 theoretical_floor 相比
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    scale_format: ue8m0
    # **FP4 这个名字是厂商的，块格式名不是。** 模型卡下载表写「FP4 + FP8 Mixed*」，脚注
    # "MoE expert parameters use FP4 precision; most other parameters use FP8"，
    # config 的 expert_dtype 也写 "fp4"。但块格式厂商一处都没命名 —— V4.1 的技术报告
    # §2.4.4 点名 "OCP-standard MXFP4" 的是 indexer 缓存，不是权重。实测签名
    # （[1,32] + E8M0 scale）与 OCP MXFP4 同构，那是本仓的判断，不写进这个字段（见核查 R17）
    expert_dtype: FP4
    per_subsystem:
      expert: FP4
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      compressor: BF16
      indexer: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      residual: FP32
      draft: FP4
    per_subsystem_block:
      expert: '[1,32]'
      shared_expert: '[128,128]'
      attention: '[128,128]'
      indexer: '[128,128]'
      draft: '[1,32]+[128,128]'
    # **这一格的口径是落盘容器 dtype**，逐分片读头读出来的：清单里 .scale 张量的 dtype
    # 字面就是 F8_E8M0，所以容器与逻辑精度在这份权重上重合。不是从上面的 scale_format
    # ue8m0 推的 —— 那只约束取值不约束容器，V3.1 声明了 ue8m0 而 scale 张量实测仍是 FP32。
    # Kimi-K3 的同类 scale 落盘是 U8 容器（config 的 scale_dtype 就写 torch.uint8），
    # 与这里的 FP8_E8M0 是厂商存法之差，不是口径之差（见核查 R17）
    per_subsystem_scale:
      expert: FP8_E8M0
      shared_expert: FP8_E8M0
      attention: FP8_E8M0
      indexer: FP8_E8M0
      draft: FP8_E8M0
    subsystem_method: >-
      早先按抽样填（每个子系统 6 个代表张量，读 14 个分片头）。已用完整清单按 lib/subsystems.py（mtp_from=43）按元素数复核
      （I8 按 FP4 ×2 还原、不计 scale）：代表值都不变，但有几个子系统是混的 —— indexer 78.0% FP8_E4M3 / 22.0% BF16
      （indexer.compressor 与 weights_proj 未量化）、router 95.1% BF16 / 4.9% I64（3 张 tid2eid 查表）、compressor 99.5% BF16、
      draft 97.5% FP4 / 2.5% FP8。抽样时 router 的 I64 占 16.8%，是因为只抽到第 0–5 层 —— 覆盖面不是占比
