review:
- id: R1
  field: arch.attention.kv_sharing.measured_per_token
  severity: wrong
  claim: 「每 token 元素 = wkv 输出宽度 / 比值（比值 4：21 层，wkv 宽 1024 → 256 元素/token）」，global_kv 5456、indexer 1344（来自 V4.1 记录的 R28）
  finding: >-
    R28 改了三个因子（层集合、除以比值、滑窗不计 per_token），漏了第四个：一个条目多宽。比值 4 的 21 层 compressor.wkv / wgate / ape
    是 1024 宽，但 compressor.norm 是 [512]；indexer.compressor.wkv 是 256，norm 是 [128]。比值 128 的层 wkv = norm = 512，
    翻倍只跟着比值 4 走。厂商参考实现把它说死了：Compressor 里 overlap = (compress_ratio == 4)、coff = 1 + overlap，wkv / ape /
    kv_state 都是 coff × head_dim 宽，压缩时前一半取上一窗口、后一半取当前窗口，合成一个 head_dim 宽的条目再过 RMSNorm(head_dim)；
    Attention.kv_cache 是 [B, window + max_seq_len // ratio, head_dim]，Indexer.kv_cache 是 [B, max_seq_len // ratio, 128]。
    所以全局 KV = 21 × 512/4 + 20 × 512/128 = 2768，indexer = 21 × 128/4 = 672，合计 3440 元素 / 6880 B（BF16 兜底），
    原值 13600 B 高一倍。四个 V4 一代仓（Flash / Pro / DSpark / Vision-Exp）形状模式相同；V4.1 没有比值 4 的层、wkv = norm = 512，不受影响
  resolution: corrected
  changed_to: >-
