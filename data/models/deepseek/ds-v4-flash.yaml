lineage:
  track: main
  predecessor: ds-v3.2-exp
  successor: ds-v4-flash-dspark
  changed_from_predecessor:
  - axis: attention
    text: 放弃 MLA 的 KV 上投影 —— 权重清单里 kv_b_proj / k_b_proj / v_b_proj 零命中，config 也不再声明 kv_lora_rank。改为
      1 个 KV 头直接在 512 维 latent 上做注意力，即 MQA-on-latent：省掉每步的上投影，代价是 Q 要先投到 latent 空间
    benefit: >-
      去掉的是 V3.2 的 kv_b_proj [32768, 512]（128 头 × (nope 128 + v 128)，rope 64 维不经它）。按参考写法它每步把 latent
      升回逐头 KV；按吸收式写法（把它并进 Q 与 O）decode 本来就不逐步上投影 —— 所以对吸收式实现，V4 是把吸收形态直接固化进了
      权重，而不是新省出一次矩阵乘（judgement，V3.2 的实现没读）。KV 仍只存 latent。代价是 Q 必须先投到 latent 空间，q 路径变宽
  - axis: attention
    text: 新增 attn_sink（每层一个可学习 sink 进 softmax 分母，config 里没有这个开关）；输出投影低秩化为 wo_a / wo_b（o_lora_rank
      1024，分 8 组）；新增滑窗 128；新增 KV 压缩器 attn.compressor.*（41 / 43 层，Flash 的 L0/L1 没有），压缩比沿层交替 4 / 128，compressor.ape
      的第一维就是该层比值
    benefit: sink 给 softmax 一个固定出口，长序列下避免注意力被迫摊到无关 token；输出投影低秩化：满秩的 [4096, 32768] 是 134.2M 参数/层，wo_a [8192, 4096] + wo_b [4096, 8192] 合计 67.1M，省一半（不是「一个 hidden×hidden」，那只有 16.8M）；滑窗 128 让每层都有不随上下文增长的局部
      KV；逐层压缩比交替 4/128 把大部分层的全局 KV 压到很小
  - axis: attention
    text: indexer 保留，但 K 的产出方式变了：没有独立的 indexer.wk，改由 attn.indexer.compressor.wkv [256, hidden] + ape
      [4, 256] 产出，且只在 21 / 43 层上（compress_ratios == 4 的层）。topk 2048→512
    benefit: >-
      K 投影没有消失，是换了形态并被压过：条目宽 128（indexer.compressor.norm [128]；wkv 输出 256 是比值 4 的重叠窗口带来的 2 倍，
      见 index_kv_source）、4 个 token 一个条目，每 token 32 元素。主干口径对比：V3.2-Exp 61 层 × 128 = 7808 元素/token，
      V4-Flash 21 层 × 32 = 672。真正省下来的是「层数减半 + 条目聚合」两件事，不是「不再自带 K 投影」
  - axis: moe
    text: 打分 sigmoid→sqrtsoftplus；top-k 8→6；routed_scaling_factor 2.5→1.5；取消专家分组（n_group/topk_group 不再声明，noaux_tc 少了 group 维度，已不是同一个算子）；config
      不再有 first_k_dense_replace，43 层每一层都有完整的 ffn.experts.*；第 0/1/2 层额外带一张 ffn.gate.tid2eid [129280,
      6] 查表，但打分投影仍在
    benefit: >-
      dense 前缀不是被「取消」而是被原地换掉：3 个查表层正好落在 V3 一代 first_k_dense_replace=3 占的那三个槽位。
      每 token 的 all-to-all 载荷 2·top_k·hidden·bytes·MoE 层数（BF16 口径）从 13,303,808 B 降到 4,227,072 B（3.15 倍），
      拆开是 top_k 8/6 = 1.33 × hidden 7168/4096 = 1.75 × MoE 层 58/43 = 1.35 —— top-k 是三个因子里最小的，分组不在公式里，
      hidden 与层数是 Flash 的档位不是 V4 的机制。同代同规模的 V4-Pro（top_k 6、hidden 7168、61 层）是 10,493,952 B，只比 V3.2 低 1.27 倍
  - axis: residual
    text: 新增 mHC 残差：残差流扩成 4 份并行拷贝（hc_mult 4），每层带 hc_attn_* / hc_ffn_* 系数，lm_head 前另有一组 hc_head_*
    benefit: 残差流变 4 份，等效加深信息通路而不加层数。代价对 infra 非常直接：所有逐元素算子、norm、残差加法的形状都乘 4，激活显存同步放大
  - axis: precision
    text: 路由专家权重降到 FP4（expert_dtype fp4），非专家仍 FP8_E4M3；scale 张量后缀由 weight_scale_inv 改为 scale，存储也真的换成了
      8 bit 的 F8_E8M0（V3.1 起声明 ue8m0，但那几代的 scale 张量实测仍是 FP32 —— V3.2-Exp 是完整清单上的全量结论，V3.1 是抽样）
    benefit: >-
      专家占了绝大部分权重，降到 FP4 把权重存储与带宽再砍近一半：含 [1,32] 的 E8M0 scale 每参数 0.53125 B（0.5 + 1/32）。
      scale 换成 8 bit 只抵消了一部分：块从 [128,128] 变成专家的 [1,32] 后 scale 个数涨了 512 倍，scale 总字节反而从
      V3.2-Exp 的 166,366,336 B 涨到 8,858,737,664 B（约 53 倍，8.25 GiB）。代价是 FP4 两个一字节打包，参数量、带宽账、EP 切分三处都要先解包
  - axis: context
    text: 163840 → 1048576，原生训练长度 65536
    benefit: 原生 64K 外推到 1M。这个长度只有配合稀疏注意力与逐层压缩才算得动，三件事是一套而不是三件独立的改动
  - axis: decoding
    text: >-
      MTP 独立成 mtp.* 命名空间，不再借用层索引。拼接胶水由 eh_proj 换成 e_proj + h_proj（各 [4096, 4096]），
      不再有 shared_head —— mtp.0 只带 norm 与 hc_head_*，embed / head 与主干共用
    benefit: MTP 从「第 61 层」变成独立命名空间，加载与切分不再和主干层混在一起
  - axis: scale
    text: Flash 定位：层数 61→43，hidden 7168→4096，专家数仍 256 但中间维保持 2048
    benefit: 43 层 / hidden 4096 的小号主干配 1M 上下文，定位在吞吐侧
