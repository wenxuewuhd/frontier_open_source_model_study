reviewed_elsewhere:
  record: deepseek-v41-flash
  findings:
  - R28
  - R23
  scope: >-
    R28 推翻了本记录原先的每 token 注意力显存 71552 B：三处独立错因叠加、高估 5.2 倍
    （indexer 按总层数 43 算而实测只在比值为 4 的 21 层；indexer 宽度没除压缩比；
    把 sliding_window=128 的局部 KV 当全局 KV 逐 token 计费）。改出来的
    arch.attention.kv_sharing.measured_per_token（global_kv 5456 + indexer 1344）
    就在本记录里（其后被本记录自己的 R1 改正：比值 4 层的条目宽按 wkv 输出算高了一倍，现为 2768 + 672）。R23 顺带实测了本记录的 FP4 路由专家块是 [1,32]
    （w1 [2048,2048] I8 对 scale [2048,128]，还原打包后 4096/128=32、2048/2048=1），
    不是 config 声明的 [128,128]。
    只覆盖这两处：注意力显存口径与路由专家的量化块。本记录其余字段的核查见本记录自己的 reviewed / review
notes: 谱系里最大的一次不连续，几乎每个维度都动了。对 infra 最要紧的是三件：KV 上投影消失（注意力算子换签名）、专家降到 FP4（打包存储，参数量不能直接求和）、mHC 把残差流宽度乘
  4（所有逐元素算子的形状都变）。另外 attn_sink 不在 config 里，只能从权重清单发现；hash 层的数量在 config 里（num_hash_layers=3），但它的张量形态与所在层要靠权重清单。
  另有一件不是结构变化、但会让加载直接失败的事：权重命名整体换了一套 —— model.layers.N.self_attn.* / mlp.* → layers.N.attn.* / ffn.*，
  gate/up/down_proj → w1/w3/w2，e_score_correction_bias → ffn.gate.bias，embed_tokens / lm_head → embed / head，
  input_layernorm → attn_norm，kv_a_layernorm → kv_norm，weight_scale_inv → scale。按旧名字匹配的工具（scale 判据、子系统归类）也要跟着改。
open_questions:
- >-
  **main KV 的落盘格式本代未公布**（核查 R15）。厂商模型卡只给权重精度，没有技术报告；
  后继者 V4.1 的报告只说本代已对 indexer 做 FP4 MXFP4、main KV 是「now extend」的下一步。
  所以 global_kv 那一半仍按模型 dtype 兜底，合计字节是 mixed 口径，不能和别代的
  theoretical_floor 相比。要钉死得等厂商公布或读生产 kernel
- 参考实现在写缓存前对非 rope 维做 act_quant、压缩器另有 fp4_act_quant 分支，但那些是 inplace 伪量化，只给 QAT 网格、不给落盘宽度（判定依据见 deepseek-v41-flash 的 R36）
- >-
  参考实现的 Compressor 还带每序列固定的 FP32 状态 kv_state / score_state [B, coff·ratio, coff·head_dim]（攒够 ratio 个 token 才出一个条目）。
  按这个形状：比值 4 层 2 × 8 × 1024 + indexer 侧 2 × 8 × 256、比值 128 层 2 × 128 × 512，主干合计 3,051,520 元素 / 12.2 MB 每序列。
  这是参考实现的写法，生产实现可以重算而不存，所以只记在这里、不进 measured_per_token
- 训练精度没有一手来源，故不填 precision.training
- context.train_native 65536 取自 rope_scaling.original_max_position_embeddings，那是 YaRN 的原始长度，是否等于训练长度未见说明
- tid2eid [129280, 6] 与同层的 gate.weight 如何配合（查表定专家集、打分定组合权重？）形状定不了，需看上游实现
