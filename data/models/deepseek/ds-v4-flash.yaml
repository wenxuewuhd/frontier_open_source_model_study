lineage:
  track: main
  predecessor: ds-v3.2
  successor: ds-v4-flash-dspark
  changed_from_predecessor:
  - axis: attention
    text: 放弃 MLA 的 KV 上投影 —— 权重清单里 kv_b_proj / k_b_proj / v_b_proj 零命中，config 也不再声明 kv_lora_rank。改为
      1 个 KV 头直接在 512 维 latent 上做注意力，即 MQA-on-latent：省掉每步的上投影，代价是 Q 要先投到 latent 空间
    benefit: decode 每步省掉一次把 512 维 latent 还原成 128×192 KV 的大矩阵乘，注意力权重本身也小一截，而 KV 仍只存 latent —— 带宽优势保留、算力代价去掉。代价是
      Q 必须先投到 latent 空间，q 路径变宽
  - axis: attention
    text: 新增 attn_sink（每层一个可学习 sink 进 softmax 分母，config 里没有这个开关）；输出投影低秩化为 wo_a / wo_b（o_lora_rank
      1024，分 8 组）；新增滑窗 128；新增逐层 KV 压缩器 attn.compressor.*，压缩比沿层交替 4 / 128
    benefit: sink 给 softmax 一个固定出口，长序列下避免注意力被迫摊到无关 token；输出投影低秩化省掉一个 hidden×hidden 的大矩阵；滑窗 128 让每层都有不随上下文增长的局部
      KV；逐层压缩比交替 4/128 把大部分层的全局 KV 压到很小
  - axis: attention
    text: indexer 保留但 K 改由 compressor 路供给（没有独立的 indexer.wk），topk 2048→512
    benefit: indexer 不再自带 K 投影，省掉每层一份独立的 index K 权重与缓存；topk 2048→512 进一步把 gather 量降到四分之一
  - axis: moe
    text: 打分 sigmoid→sqrtsoftplus；**top-k 8→6**；取消专家分组（n_group/topk_group 不再声明，noaux_tc 少了 group 维度，已不是同一个算子）；config
      不再有 first_k_dense_replace，43 层每一层都有完整的 ffn.experts.*；第 0/1/2 层额外带一张 ffn.gate.tid2eid [129280,
      6] 查表，但打分投影仍在
    benefit: dense 前缀不是被「取消」而是被原地换掉：3 个查表层正好落在 V3 一代 first_k_dense_replace=3 占的那三个槽位。top-k 8→6 配合分组取消，每
      token 的 all-to-all 载荷从 13.30 MB 降到 4.23 MB（2·top_k·hidden·bytes·层数，BF16 口径）—— 这是 V4 对 EP 通信最大的一笔节省，比任何路由机制改动都直接
  - axis: residual
    text: 新增 mHC 残差：残差流扩成 4 份并行拷贝（hc_mult 4），每层带 hc_attn_* / hc_ffn_* 系数，lm_head 前另有一组 hc_head_*
    benefit: 残差流变 4 份，等效加深信息通路而不加层数。代价对 infra 非常直接：所有逐元素算子、norm、残差加法的形状都乘 4，激活显存同步放大
  - axis: precision
    text: 路由专家权重降到 FP4（expert_dtype fp4），非专家仍 FP8_E4M3；scale 张量后缀由 weight_scale_inv 改为 scale，存储也真的换成了
      8 bit 的 F8_E8M0（V3.1 起声明 ue8m0，但那几代的 scale 张量实测仍是 FP32）
    benefit: 专家占了绝大部分权重，降到 FP4 把权重存储与带宽再砍一半；scale 同时从 FP32 收到 8 bit，省掉的 scale 带宽在块变小的时候尤其值钱。代价是 FP4
      两个一字节打包，参数量、带宽账、EP 切分三处都要先解包
  - axis: context
    text: 163840 → 1048576，原生训练长度 65536
    benefit: 原生 64K 外推到 1M。这个长度只有配合稀疏注意力与逐层压缩才算得动，三件事是一套而不是三件独立的改动
  - axis: decoding
    text: MTP 独立成 mtp.* 命名空间，不再借用层索引
    benefit: MTP 从「第 61 层」变成独立命名空间，加载与切分不再和主干层混在一起
  - axis: scale
    text: Flash 定位：层数 61→43，hidden 7168→4096，专家数仍 256 但中间维保持 2048
    benefit: 43 层 / hidden 4096 的小号主干配 1M 上下文，定位在吞吐侧
