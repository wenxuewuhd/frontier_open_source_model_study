reviewed:
  date: 2026-10-28
  scope: [official, derived, judgement]
  reviewer: 两个独立核查代理交叉验证，全部结论由本会话按权重清单复算后才采纳
  method: >-
    一路核查 official/derived 字段是否能在 config、权重清单与 HF 元数据里复现；
    另一路挑战 judgement 内容是否过度推论。两路各自独立，结论互不可见。
    代理产出不直接采信 —— 每条改动前都用 facts/ 下的事实重算过一遍。

review:
  - id: R1
    field: arch.attention.kv_sharing.index_kv_source_layers
    severity: wrong
    claim: index_source_layers 列了 8 层，indexer 缓存按 8 层算得 65536 B/token
    finding: >-
      权重清单显示 indexer.wk 与 indexer.k_norm 只存在于 L2/8/14/20；
      L24/28/32/36 只有 wq_b 与 weights_proj，即只复用已有 K 重新打分、不产出 K。
      按 8 层算把 indexer 缓存高估一倍。
    resolution: corrected
    changed_to: 拆成 index_kv_source_layers(4 层) 与 index_rescore_layers(4 层)；每 token 注意力显存由 70144 修正为 37376 B
  - id: R2
    field: arch.attention.type
    severity: miscategorized
    claim: type 标为 MLA
    finding: >-
      在 96085 个张量里搜 kv_b/k_b/v_b/kv_up 全部零命中：每层只有 wkv[512,5120] 下投影，
      没有把 latent 升回逐头 K/V 的上投影，config 里也没有 kv_lora_rank。
      发布形态是 64 个 query 头共读一个 512 维 latent，与 MLA 同构但不是 MLA。
    resolution: corrected
    changed_to: type 改为 MQA-latent，并在 schema 里新增该枚举值与对应的 KV 公式
  - id: R3
    field: arch.attention.kv_sharing.note
    severity: wrong
    claim: 按总层数乘 KV 会高估约十倍
    finding: >-
      十倍只对主 KV 这一个分量成立（40/4）。对读者真正要用的每 token 总量，
      错误值 111616 对正确值 70144 是 1.59 倍。而且「只有 4 层产出 KV」本身也不准确：
      attn.wkv 与 kv_norm 在全部 40 层都存在，配合 sliding_window=128，每层都有局部窗口 KV。
    resolution: corrected
    changed_to: note 改为区分全局/压缩 KV、indexer K 与滑窗 KV 三类，删去「十倍」
  - id: R4
    field: bottlenecks[0]
    severity: unsupported
    claim: decode 权重搬运由注意力投影主导而非 MoE 主导，前提写的是「不切 TP」
    finding: >-
      按权重清单实算，EP=1 时 MoE 侧 6.09 GB 反而大于注意力侧 5.15 GB（比值 1.18）；
      只有 EP=4 把路由专家摊薄后比值才翻转为 0.52。原结论来自一份 EP=4 的每 rank 数据，
      搬过来时丢掉了 EP 这个决定性前提。
    resolution: corrected
    changed_to: 改写为按并行度分情况，并给出 EP=1 与 EP=4 两组实算值
  - id: R5
    field: bottlenecks[0].finding
    severity: imprecise
    claim: head_dim 512 × 64 头让 q 的上投影矩阵异常大
    finding: >-
      实算输出路径 wo_b 1.68 + wo_a 1.34 = 3.02 GB，大于 q 路径的 1.94 GB；
      lm_head 单项 1.32 GB 也超过 wq_a+wq_b 之外的任何单项。
      且 wo_b 的宽度由 o_groups × o_lora_rank 决定，与 head_dim 无关。
      只点 q 会让人去优化错的矩阵。
    resolution: corrected
    changed_to: 列出 wo_b/wo_a/wq_b/lm_head 的实际 GB/token，并说明 o_groups=8 是 TP 硬上限
  - id: R6
    field: bottlenecks[1]
    severity: unsupported
    claim: 跨层 KV 共享叠加逐层压缩把 1M 上下文的 KV 压到可接受范围
    finding: >-
      功劳归错对象。修正后每 token 37376 B 里，indexer K 占 32768 B（88%），
      而它既不受 kv_source_layers 影响也不在 compress_ratios 作用域内。
      另外「可接受范围」没有数值，是把需要前提的判断写成了结论。
    resolution: corrected
    changed_to: 改为指出容量瓶颈在 index_kv_source_layers，并给出 1M 下约 36.5 GiB 的数
  - id: R7
    field: bottlenecks[2]
    severity: unsupported
    claim: norm_eps 1e-20 落在「常见图编译器融合 pass 的 epsilon 白名单」外，属一行改动
    finding: >-
      该说法的唯一依据是某个厂商插件某个版本里的一个硬编码常量列表，
      既不在本记录的 sources 里，也不能泛化成「常见图编译器」；
      而且该依据属内部材料，不应写进公开记录。
      更重要的是主要风险被说反了：eps 被算子默认值覆盖会静默改变数值结果，
      不只是掉性能。
    resolution: corrected
    changed_to: 收窄为「带 eps 的算子需逐个核对默认值」，并把主要风险改为静默算错
  - id: R8
    field: params.counting_note
    severity: wrong
    claim: draft 侧 7.4B 不计入声明值
    finding: >-
      7.4 是 GiB 存储不是参数量。draft 子树按 FP4 打包还原后是 14.2B 参数、7.39 GiB 存储。
      这恰好是同一段 note 自己警告过的打包错误。
    resolution: corrected
    changed_to: 改为 14.2B 参数（7.39 GiB 存储）
  - id: R9
    field: params.breakdown.retrieval_table
    severity: imprecise
    claim: retrieval_table 196.0e9，并称与声明的 0.13% 差异是整体缺口
    finding: 实测 196.93B；0.13% 的缺口几乎全部集中在 Engram 表这一项，主干侧只差 0.009%
    resolution: corrected
    changed_to: 改为 196.9e9，并在 counting_note 说明缺口集中在表
  - id: R10
    field: precision.quantization.weight_block_size
    severity: imprecise
    claim: weight_block_size [32, 32] 作为全模型单一取值
    finding: >-
      权重清单实测两档：路由专家 w1[2304,2560] 对 scale[2304,160] 是沿 K 的 1×32，
      Engram 表同样是 1×32；注意力 wq_b[32768,1280] 对 scale[1024,40] 才是 32×32。
      按 config 的单一值实现会解错专家权重。
    resolution: corrected
    changed_to: 保留 config 原值并新增 block_size_note 说明两档粒度
  - id: R11
    field: arch.attention.attn_sink
    severity: missing
    claim: 注意力段没有 sink 相关字段
    finding: >-
