notes: >-
  本记录是 P0-A 的 schema 压力测试用例：选它是因为它同时带有 MLA、细粒度 MoE、
  跨层 KV 共享、稀疏选块、残差流改造、外置查表、自带草稿模型和混合精度，
  字段覆盖最宽。schema 撑不住的地方会先在这里暴露。

open_questions:
  - 训练精度未在 config 或模型卡中披露，暂不填 precision.training
  - >-
    KV cache 的实际存储精度与 scale 容器精度需查实现确认。未填时推导脚本按模型
    dtype（BF16）兜底，并在输出里标注「精度兜底」—— 该值直接决定容量结论
  - released 取自 HF lastModified，不等于正式发布日，待查技术报告
  - >-
    逐层 compress_ratios 的折算方式未建模，推导脚本给出的 KV 是未压缩上界
    （70144 B/token）。真实值需以官方披露或实测为准
  - hash_cols 24 由 (max_ngram 4 - 1) × n_heads 8 推得，需与实现确认
