- id: R40
  field: arch.vision.tokens.compression_ratio
  severity: missing
  claim: >-
    这份记录是本仓做得最深的一份，但视觉侧只有结构尺寸，
    fusion 一整句就是「aligner MLP 投影到主干 hidden」，连 3×3 合并都没写出来；
    params 也空着。一张图几个 token、encoder 多少 FLOPs、能不能分离部署，
    三件事都答不上来
  finding: >-
    补 arch.vision 下 tokens / prefill / separability 三组，逐因子核过，
    另补 params 与展开的 fusion。本档有三个值得单独记的点：
    (1) **max_image_tokens 1024 独立闭合了压缩比**：
    1024 × 3² = 9216 个 patch，× 14² = 1,806,336 像素 = 恰好 1344²。
    即这一项是**主干侧 token 的上限**、不是 encoder patch 的上限，
    且与 downsample_ratio 3、patch 14 三者自洽。
    把它当 encoder patch 上限读会把可用分辨率低估 3 倍。
    (2) **压缩比 9 是全批第二高**（只有 StepFun 两档的 16 更高，其余九份都是 4），
    它把主干位置预算压到 256 —— 同分辨率下 kimi-k2.5 是 576，
    一张图少占 320 个位置。代价是塔的相对占比升到 1.25
    （塔值 64 个位置当量、占 20%）：塔的绝对 FLOPs 和 Kimi / Qwen 那几档
    差不多（1896.9 对 1897.3 / 1456.5），分母小了所以占比高。
    **这是压缩比的真实权衡，不是哪家做得更好。**
    (3) patch_embed 是 **Linear [1024, 588]**（588 = 3 × 14 × 14）而不是
    别家的 Conv2d/Conv3d —— patch 先拉平再投影。不影响 FLOPs 口径
    （仍是每 token 一次），但判型时容易按 Conv 去找形状而找不到。
    分片上记 **partial**：48 个分片的第 1 个是纯视觉分片
    （263 个张量 = 259 vision. + 4 aligner.，非视觉 0 个），
    但 3 个标记向量 image_start / image_end / image_newline 溢到第 2 片、
    与 embed.weight 同片。归置本身合理（序列标记和词表一起用），
    可是「只读第 1 个文件」就拿不到完整视觉入口，还差 15,360 个参数 ——
    所以不是 dedicated
  resolution: corrected
  changed_to: >-
    补 arch.vision.params 485,268,480（= encoder 411,842,560 +
    aligner 与标记向量 73,425,920，实测自清单）；
    fusion 展开到逐张量并写出 9216 = 1024 × 3² 与 Linear patch_embed；
    新增 arch.vision.tokens（2304 → 256，压缩比 9，并写出 max_image_tokens
    的闭合式与 min_pixels 544²）、arch.vision.prefill（encoder 线性
    1896.9 GFLOPs、一张图 ≈ 320 个文本 token，并写明压缩比的权衡）、
    arch.vision.separability（partial，第 1 片纯视觉但 3 个标记向量溢到第 2 片）；
    evidence 加十条，四格判断类进 Gate C

