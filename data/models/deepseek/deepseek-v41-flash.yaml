reviewed:
  date: '2026-10-29'
  scope:
  - official
  - derived
  - judgement
  reviewer: 两个独立核查代理交叉验证，全部结论由本会话按权重清单复算后才采纳
  method: 第一轮（10-28）：一路核查 official/derived 字段是否能在 config、权重清单与 HF 元数据里复现；另一路挑战 judgement 内容是否过度推论。两路各自独立，结论互不可见。
    第二轮（10-29）量化精度专项：一路从张量形状逐对相除重算量化块， 一路挑战 dtype 结论与抽样方法本身。两轮的发现都由本会话独立复算后才采纳。 代理产出不直接采信 —— 每条改动前都用
    facts/ 下的事实重算过一遍。
review:
- id: R1
  field: arch.attention.kv_sharing.index_kv_source_layers
  severity: wrong
  claim: index_source_layers 列了 8 层，indexer 缓存按 8 层算得 65536 B/token
  finding: 权重清单显示 indexer.wk 与 indexer.k_norm 只存在于 L2/8/14/20； L24/28/32/36 只有 wq_b 与 weights_proj，即只复用已有
    K 重新打分、不产出 K。 按 8 层算把 indexer 缓存高估一倍。
  resolution: corrected
  changed_to: 拆成 index_kv_source_layers(4 层) 与 index_rescore_layers(4 层)；每 token 注意力显存由 70144 修正为
    37376 B
- id: R2
  field: arch.attention.type
  severity: miscategorized
  claim: type 标为 MLA
  finding: 在 96085 个张量里搜 kv_b/k_b/v_b/kv_up 全部零命中：每层只有 wkv[512,5120] 下投影， 没有把 latent 升回逐头 K/V 的上投影，config
    里也没有 kv_lora_rank。 发布形态是 64 个 query 头共读一个 512 维 latent，与 MLA 同构但不是 MLA。
  resolution: corrected
  changed_to: type 改为 MQA-latent，并在 schema 里新增该枚举值与对应的 KV 公式
- id: R3
  field: arch.attention.kv_sharing.note
  severity: wrong
  claim: 按总层数乘 KV 会高估约十倍
  finding: 十倍只对主 KV 这一个分量成立（40/4）。对读者真正要用的每 token 总量， 错误值 111616 对正确值 70144 是 1.59 倍。而且「只有 4 层产出 KV」本身也不准确：
    attn.wkv 与 kv_norm 在全部 40 层都存在，配合 sliding_window=128，每层都有局部窗口 KV。
  resolution: corrected
  changed_to: note 改为区分全局/压缩 KV、indexer K 与滑窗 KV 三类，删去「十倍」
- id: R4
  field: bottlenecks[0]
  severity: unsupported
  claim: decode 权重搬运由注意力投影主导而非 MoE 主导，前提写的是「不切 TP」
  finding: 按权重清单实算，EP=1 时 MoE 侧 6.09 GB 反而大于注意力侧 5.15 GB（比值 1.18）； 只有 EP=4 把路由专家摊薄后比值才翻转为 0.52。原结论来自一份
    EP=4 的每 rank 数据， 搬过来时丢掉了 EP 这个决定性前提。
  resolution: corrected
  changed_to: 改写为按并行度分情况，并给出 EP=1 与 EP=4 两组实算值
- id: R5
  field: bottlenecks[0].finding
  severity: imprecise
