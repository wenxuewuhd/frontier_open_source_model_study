- id: R28
  field: arch.attention.kv_sharing.measured_per_token
  severity: wrong
  claim: V4 一代每 token 注意力显存 71552 B（Flash）/ 101504 B（Pro）
  finding: 这两个数由本会话在拿到全量清单后生成，三处独立错因叠加，高估 5.2 倍： (1) indexer 按总层数算（Flash 43、Pro 61），实测只在比值为 4 的层上
    （Flash 21/43、Pro 30/61）； (2) indexer 宽度用了 compressor.wkv 的输出 256，没除压缩比 —— indexer.compressor.ape
    是 [4, 256]，4 个 token 共用一个条目，每 token 实为 64； (3) 把 attn.wkv 的 512 维当成全局 KV 逐 token 计费，而它是 sliding_window=128
    的局部 KV（每序列固定），全局 KV 由 attn.compressor.* 产出且已压缩。 结构规律在权重里是确定的，零例外：compressor 存在 ⟺ compress_ratios[l]
    != 0， indexer 存在 ⟺ compress_ratios[l] == 4，而 compressor.ape 的第一维就是该层压缩比。 Flash 实为 13600 B/token（全局
    5456 + indexer 1344 元素），Pro 19448。 「存在逐层压缩比、本公式未建模」这句免责声明盖不住 (1)(3) —— 层数用错和 把窗口 KV 当全局 KV，跟压缩比无关，是两个独立的错。
  resolution: corrected
  changed_to: 新增 kv_sharing.measured_per_token（逐层量出来的元素数），derive.py 一旦有它就接管公式，status 标 measured
