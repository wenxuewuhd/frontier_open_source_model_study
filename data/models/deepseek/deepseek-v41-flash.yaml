- released 取自 HF lastModified，不等于正式发布日，待查技术报告
- >-
  measured_per_token 的「一个条目 = 一个 token」是假设，不是实测（核查 R30）。
  本代 compressor 没有 ape 张量、wkv 输出恒 512 不随比值变，所以权重里看不出
  compress_ratios（1 与 2）在折算什么。当前按 1:1 记账，5120 B/token 是上界。
  两条迹象支持「条目按比值聚合」：比值为 1 的 L20 恰好没有 compressor.wgate
  （单 token 无须加权汇聚），而 indexer.wk 的输入维 512 等于压缩器输出维
  （说明 index K 也按条目生成，要折就得和全局 KV 一起折）。
  若成立，应为 global_kv 1280 + indexer 320 = 3200 B/token，1M 下 3.1 GiB。
  但 n=4 层的结构相关不足以定论，需查上游实现或实测。
  V4 一代不存在这个问题 —— 那一代 compressor.ape 的第一维就是比值（见 R28）
- hash_cols 24 由 (max_ngram 4 - 1) × n_heads 8 推得，需与实现确认
