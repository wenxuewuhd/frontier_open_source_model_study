lineage:
  track: main
  predecessor: ds-v2
  successor: ds-v3.1
  changed_from_predecessor:
  - axis: scale
    text: 61 层 / hidden 7168；专家 160→256，共享 2→1，top-6→8，专家中间维 1536→2048，词表 102400→129280；dense 前缀层
      1→3
    benefit: 专家数 160→256，但单专家也变大了：3×1536×5120 = 23.6M → 3×2048×7168 = 44.0M（1.87 倍）。所谓「更细」只在「中间维 /
      hidden」这个比值上成立（0.300→0.286），绝对尺寸是变粗的。代价要说清楚：每层激活的 FFN 参数 188.7M→396.4M（2.10 倍），主干路由容量 222.7B→653.9B（2.94
      倍），稀疏度仅由 3.75% 改善到 3.12% ——激活几乎跟着容量一起涨，不是「增幅可控」
  - axis: moe
    text: 打分 softmax→sigmoid，选路 group_limited_greedy→noaux_tc，新增逐专家偏置 gate.e_score_correction_bias
      —— 无辅助损失的负载均衡
    benefit: 去掉辅助损失后不再有「均衡 vs 质量」的梯度冲突，负载均衡改由一个不参与梯度的偏置在线调节。对 infra 的意义是 router 多一条逐专家偏置加法。注意这个偏置只参与
      top-k 选择，组合权重用的是未加偏置的分数 —— 把它折进 gating weight 会让输出错，这是融合 router 最容易做错的一处。（此条为实现层面的判断，权重清单只能证明偏置张量存在，不含语义）
  - axis: precision
    text: 首次以 FP8 块量化发布，块 [128,128]，每个量化张量配一个 weight_scale_inv
    benefit: 权重带宽与显存对半砍（BF16→FP8），块量化把 scale 粒度限制在 128×128，比逐张量更抗离群值。代价是每个 GEMM 都要带 scale，反量化进了内循环
  - axis: decoding
    text: 首次带 MTP 模块（1 层）。权重借用层索引 61：eh_proj / enorm / hnorm / shared_head，没有独立命名空间 —— V4 才改掉
    benefit: 训练时多预测一个 token 提升主干质量，推理时这一层可以直接当草稿头做投机解码。但权重借用层索引 61，加载时容易被当成第 62 层误载
