  counting_note: >-
    total 与 breakdown 都是本仓按完整权重清单逐项求和的实测值（取 6 位有效数字），不是厂商声明值。
    清单 91991 个条目，其中 45808 条是 weight_scale_inv（FP8 的 per-block scale 容器）—— 不计入参数、只计入权重存储；
    真权重张量 46183 条（FP8_E4M3 45808、BF16 316、F32 的 e_score_correction_bias 59）。
    total 扣掉草稿侧 13.46B（layers.61.* 整块，含它自己的 embed_tokens 与 shared_head.head），含在内的实测总量
    684,489,845,504，与 HF 的 safetensors tally 逐位相同。因为 total 本身是实测值，Gate B 的参数总量一项（delta 0.0）
    是实测比实测，不构成核对。权重存储 641.3 GiB。激活参数两个口径见 data/derived/：带宽口径 36.63B、含输入词表 37.55B
context:
  max: 163840
  train_native: 4096
arch:
  layers: 61
  hidden: 7168
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MLA
    num_heads: 128
    num_kv_heads: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim: 192
    v_head_dim: 128
    head_dim_note: num_kv_heads 128 是 query 侧可见的 KV 头数，不是缓存宽度：落盘缓存是 kv_a_proj_with_mqa 的 576 维
      （latent 512 + rope 64），按 2 × 128 × 192 折算会高估 42.7 倍。head_dim 192 不是 config 字段，
      是 qk_nope 128 + qk_rope 64，只适用于 QK 路径。V 的每头维度是 v_head_dim 128，所以 o_proj
      入口宽度是 128 头 × 128 = 16384（权重实测 [hidden, 16384]），不是 128 × 192 = 24576。按单一 head_dim 推 o_proj 会高
      50%
  ffn:
    type: moe
    layer_pattern: 第 0–2 层稠密（intermediate 18432），第 3–60 层为 MoE（58 层）。稠密层的 FFN 中间维是单个专家（2048）的 9 倍
  moe:
    routed_experts: 256
    top_k: 8
    shared_experts: 1
    intermediate: 2048
    first_k_dense: 3
    expert_groups: 8
    routing: sigmoid 打分 / noaux_tc 选路
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 无辅助损失，靠逐专家偏置 mlp.gate.e_score_correction_bias 调节。清单里 59 个 = 主干 MoE 层 3–60 的 58 个 + MTP 块（layers.61）1 个
    dense_intermediate: 18432
  decoding:
    mtp_layers: 1
    mtp_layers_note: >-
      config 的 num_nextn_predict_layers 1 与清单一致（只有 layers.61 一块）。KV 层覆盖按主干口径记：data/derived/ 的 KV
      是 61 层、70272 B/token（BF16 兜底）。MTP 块带着与主干同名的整套 MLA 投影，开草稿侧时它也产出 KV，
      按 62 层算（61 主干 + 1 草稿块），+1152 B/token
precision:
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    per_subsystem:
      expert: FP8_E4M3
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      dense_ffn: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      draft: FP8_E4M3
    per_subsystem_scale:
      expert: FP32
      shared_expert: FP32
      attention: FP32
      dense_ffn: FP32
      draft: FP32
    subsystem_method: >-
      早先按抽样填（每个子系统 6 个代表张量，读 10 个分片头）。已用完整清单按 lib/subsystems.py 归类（mtp_from=61）
      按元素数复核：expert / shared_expert / attention / dense_ffn 100% F8_E4M3，embed / lm_head / norm 100% BF16，
      router 99.99% BF16（余下是 F32 偏置），draft 85.5% F8_E4M3 / 14.5% BF16（它自带的 embed 与 head），代表值都不变
    per_subsystem_block:
      expert: '[128,128]'
      shared_expert: '[128,128]'
      attention: '[128,128]+[128ceil,128]'
      dense_ffn: '[128,128]'
      draft: '[128,128]+[128ceil,128]'
infra_signals:
- text: >-
    FP8 块量化 [128,128] + 逐张量 FP32 scale（weight_scale_inv）从这一代开始，V3.1 / V3.2-Exp 沿用。之后变的不止一处：
    V3.1 起 config 声明 scale_fmt ue8m0，但 scale 张量实测仍是 FP32，到 V4-Flash 才真换成 FP8_E8M0；V4 起后缀改为 .scale、
    路由专家改为 FP4 块 [1,32]；FP8 子系统的块到 V4.1 才从 [128,128] 收到 [32,32]
  evidence: judgement
  horizon: now
  axis: precision
