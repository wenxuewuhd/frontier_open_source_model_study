open_questions:
- KV cache 的实际存储精度未披露，derive.py 按模型 dtype（BF16）兜底，bytes_basis 是 dtype_fallback
- 训练精度没有一手来源，故不填 precision.training
- HF 元数据里没有 license 标签（tags 与 cardData 都没有），故 license 不填
reviewed:
  date: '2026-10-30'
  scope:
  - official
  - derived
  - judgement
  reviewer: 本会话逐字段复算（派出的核查代理因连接错误中途退出，未产出结论）
  method: >-
    按 .claude/skills/model-audit 的顺序逐字段对 facts/ds-v3 核：config 全部键、完整清单 91991 条目（dtype 计数、
    scale 判据命中数、layers.61.* 的构成、e_score_correction_bias 的层号）、repoinfo 的 tags / cardData / createdAt /
    safetensors tally、data/derived/ds-v3.json 的分项与 KV 公式路。逐子系统精度用 lib/subsystems.py 在完整清单上
    按元素数重算。lineage 的乘式逐因子复算：单专家 3×1536×5120 = 23,592,960 → 3×2048×7168 = 44,040,192（1.87 倍）、
    中间维/hidden 0.300 → 0.286、每层激活 FFN (6+2)×23.59M = 188.7M → (8+1)×44.04M = 396.4M（2.10 倍）、
    路由容量 222.7B → 653.9B（2.94 倍）、稀疏度 6/160 = 3.75% → 8/256 = 3.125%，都成立。
