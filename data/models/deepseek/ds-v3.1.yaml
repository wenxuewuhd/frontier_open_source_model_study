  gated: false
lineage:
  track: main
  predecessor: ds-r1
  successor: ds-v3.2-exp
  changed_from_predecessor:
  - axis: precision
    text: config 声明 FP8 的 scale 格式为 ue8m0（2 的幂次 scale）。块仍 [128,128]，张量名与 R1 完全一致。但实测 scale 张量仍以 FP32
      存放 —— ue8m0 在这一代约束的是取值不是容器
    benefit: scale 是纯 2 的幂次，反量化从浮点乘退化成指数加。但要注意声明与存储是两步走的：这一代 scale 张量还是 FP32，到 V4 才真的换成 8 bit 的 F8_E8M0。按「声明
      ue8m0 就是 8 bit 存储」去算 scale 张量大小，这一代会算小 4 倍
params:
  counting_note: 未单独取全量权重清单：本版张量名集合与 ds-v3 逐个相同、逐子系统 dtype 也一致，参数量必然相同，见该记录。重复取一遍只是把同一个数算两遍。
context:
  max: 163840
  train_native: 4096
arch:
  layers: 61
  hidden: 7168
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MLA
    num_heads: 128
    num_kv_heads: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim: 192
  ffn:
    type: moe
  moe:
    routed_experts: 256
    top_k: 8
    shared_experts: 1
    intermediate: 2048
    first_k_dense: 3
    expert_groups: 8
    routing: sigmoid 打分 / noaux_tc 选路
  decoding:
    mtp_layers: 1
precision:
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    scale_format: ue8m0
    per_subsystem:
      expert: FP8_E4M3
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      dense_ffn: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      draft: FP8_E4M3
    per_subsystem_scale:
      expert: FP32
      shared_expert: FP32
      attention: FP32
      dense_ffn: FP32
      draft: FP32
    subsystem_method: 抽样：每个子系统 6 个代表张量，共读 10 个分片头
    per_subsystem_block:
      expert: '[128,128]'
      shared_expert: '[128,128]'
      attention: '[128,128] / [128ceil,128]'
      dense_ffn: '[128,128]'
      draft: '[128,128] / [128ceil,128]'
