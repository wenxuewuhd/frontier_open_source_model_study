lineage:
  track: main
  predecessor: ds-v3
  successor: ds-v3.2-exp
  changed_from_predecessor:
  - axis: precision
    text: >-
      config 声明 FP8 的 scale 格式为 ue8m0（2 的幂次 scale）。块仍 [128,128]，张量名与 V3 完全一致。但实测 scale 张量仍以 FP32
      存放 —— ue8m0 在这一代约束的是取值不是容器。取值这一半是 range 读数值抽样核过的：
      layers.0.self_attn.kv_a_proj_with_mqa.weight_scale_inv [5,56] 与 layers.10.mlp.experts.7.down_proj.weight_scale_inv [56,16]
      在 V3.1 是 280/280、896/896 个 2 的幂次，同名张量在 V3 是 0/280、0/896。只读了这两个张量，不是全部
    benefit: scale 是纯 2 的幂次，反量化可以从浮点乘退化成指数加。但要注意声明与存储是两步走的：这一代 scale 张量还是 FP32，到 V4-Flash 才真的换成 8 bit 的 F8_E8M0。按「声明
      ue8m0 就是 8 bit 存储」去算 scale 张量大小，这一代会算小 4 倍。「指数加」是实现上可以利用的性质，不是这一代权重本身做了什么
params:
  counting_note: >-
    没有取全量形状（facts/ds-v3.1/shapes.json 是空的，只有 names.json），所以 derive.py 整体 skip，本记录不填 total。
    参数量与 ds-v3 相同，依据是三条独立的证据，而不是「名字相同所以必然相同」：(1) config 与 V3 只差 quantization_config.scale_fmt
    与 transformers_version；(2) 91991 个张量名逐个相同；(3) HF 的 safetensors tally 按 dtype 拆开，BF16 3,918,786,560 与
    F8_E4M3 680,571,043,840 与 V3 逐位相同，F32 多出的 41,540,496 恰等于 V3 的 scale 元素数 —— 这个仓的 tally 把 scale 算进了
    参数量（总数 684,531,386,000），V3 的没算。另有抽样读到的 74 个张量形状与 dtype 与 V3 全量清单逐个一致。
    所以按本仓口径（排 scale）全量是 684,489,845,504，扣草稿侧后 671.03B，见 ds-v3
context:
  max: 163840
  train_native: 4096
arch:
  layers: 61
  hidden: 7168
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MLA
    num_heads: 128
    num_kv_heads: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim: 192
    v_head_dim: 128
    head_dim_note: num_kv_heads 128 是 query 侧可见的 KV 头数，不是缓存宽度：落盘缓存是 kv_a_proj_with_mqa 的 576 维
      （latent 512 + rope 64），按 2 × 128 × 192 折算会高估 42.7 倍。head_dim 192 不是 config 字段，
      是 qk_nope 128 + qk_rope 64，只适用于 QK 路径。V 的每头维度是 v_head_dim 128，所以 o_proj
      入口宽度是 128 头 × 128 = 16384（权重实测 [hidden, 16384]），不是 128 × 192 = 24576。按单一 head_dim 推 o_proj 会高
      50%
  ffn:
    type: moe
    layer_pattern: 第 0–2 层稠密（intermediate 18432），第 3–60 层为 MoE（58 层）。稠密层的 FFN 中间维是单个专家（2048）的 9 倍
  moe:
    routed_experts: 256
    top_k: 8
    shared_experts: 1
    intermediate: 2048
    first_k_dense: 3
    expert_groups: 8
    routing: sigmoid 打分 / noaux_tc 选路
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 无辅助损失，靠逐专家偏置 mlp.gate.e_score_correction_bias 调节。清单里 59 个 = 主干 MoE 层 3–60 的 58 个 + MTP 块（layers.61）1 个
    dense_intermediate: 18432
  decoding:
    mtp_layers: 1
    mtp_layers_note: >-
      config 的 num_nextn_predict_layers 1 与名字清单一致（只有 layers.61 一块，名字集合与 V3 相同）。没有形状，derive.py 不出 KV；
      按名字与 config 都与 V3 相同，KV 层覆盖同 ds-v3：主干口径 61 层，开草稿侧 62 层（61 主干 + 1 草稿块）
precision:
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    scale_format: ue8m0
    per_subsystem:
      expert: FP8_E4M3
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      dense_ffn: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      draft: FP8_E4M3
    per_subsystem_scale:
      expert: FP32
      shared_expert: FP32
      attention: FP32
      dense_ffn: FP32
      draft: FP32
    subsystem_method: >-
      抽样：每个子系统 6 个代表张量，共读 10 个分片头（facts/ds-v3.1/subsystem_dtypes.json）。抽到的 74 个张量形状与 dtype
      与 ds-v3 的完整清单逐个一致；本版没有完整清单，所以这些值是代表值，全量占比引 ds-v3
    per_subsystem_block:
      expert: '[128,128]'
      shared_expert: '[128,128]'
      attention: '[128,128]+[128ceil,128]'
      dense_ffn: '[128,128]'
      draft: '[128,128]+[128ceil,128]'
