notes: 唯一的改动是 scale 格式。它不改张量形状，却改反量化算子的实现：ue8m0 的 scale 是纯指数，乘 scale 可以变成加指数。容易被当成元数据忽略过去。
open_questions:
- 训练精度没有一手来源，故不填 precision.training
- >-
  ue8m0 的取值约束只在两个 scale 张量上读数值核过（全部是 2 的幂次），其余张量未读。要钉死得扫全部 45808 个 scale
- scale_fmt 的 ue8m0 管不管激活 scale，config 没说。它和 fmt、weight_block_size 并列， 字面像是只管权重侧；但激活用 dynamic 量化、scale
  是运行时现算的，如果不同样取 2 的幂次， 「反量化退化成指数加」这条优化就只能用在权重一边。权重清单查不到运行时产物， 要看上游实现（vLLM / SGLang 的 per_token_group_quant_fp8
  有没有做 pow2 对齐）才能定。 这个口径决定反量化要不要留浮点乘，对算子表是实的
reviewed:
  date: '2026-10-30'
  scope:
  - official
  - derived
  - judgement
  reviewer: 本会话逐字段复算
  method: >-
    按 .claude/skills/model-audit 的顺序逐字段核。本版只有名字清单，所以核法是对照 ds-v3：config 逐键 diff、
    91991 个张量名的集合差（0）、subsystem_dtypes.json 里 74 个抽样张量的形状与 dtype 对 ds-v3 完整清单逐个比（0 处不同）、
    repoinfo 的 tags / cardData / createdAt / 按 dtype 拆开的 safetensors tally。ue8m0 的取值约束用 range 请求读了
    V3 与 V3.1 两个同名 scale 张量的 FP32 数值（scratchpad 里的 probe_scale.py，只读该张量的字节区间）。
    继承自 V3 模板的几处（最宽 GEMM、59 个偏置、num_kv_heads）按 ds-v3 的 R2 / R6 / R8 同样改掉。
