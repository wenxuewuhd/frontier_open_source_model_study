context:
  max: 1048576
  train_native: 65536
arch:
  layers: 43
  hidden: 4096
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-20
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MQA-latent
    num_heads: 64
    num_kv_heads: 1
    qk_rope_head_dim: 64
    q_lora_rank: 1024
    o_lora_rank: 1024
    o_groups: 8
    sliding_window: 128
    head_dim: 512
    sparse:
      mechanism: indexer 打分取 topk 后在选中 token 上做全注意力。只在 21 / 43 层上有 indexer —— 权重里的规律是 indexer 存在 ⟺
        compress_ratios[l] == 4，零例外。这一代没有独立的 indexer.wk，index K 由 attn.indexer.compressor.wkv 产出
      index_n_heads: 64
      index_head_dim: 128
      index_topk: 512
      index_kv_dim: 64
      index_kv_source: layers.N.attn.indexer.compressor.wkv.weight 输出维 256，但 indexer.compressor.ape
        是 [4, 256] —— 4 个 token 共用一个 256 维条目，每 token 实为 64 元素。index_kv_dim 记的是每 token 值，不是条目宽度
    kv_sharing:
      compress_ratios:
      - 0
      - 0
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 0
      - 0
      - 0
      note: 权重清单里 kv_b_proj / k_b_proj / v_b_proj 零命中，config 也不声明 kv_lora_rank：这一代没有 KV 上投影，不是 MLA。compress_ratios
        的项数 = 主干层数 + MTP 层数。
      measured_per_token:
        global_kv: 5456
        indexer: 1344
        local_window_bytes_per_sequence: 5636096
        note: '按完整权重清单逐层量出来的每 token 元素数。compressor.ape 的第一维就是该层压缩比，每 token 元素 = wkv 输出宽度 / 比值（比值 4:
          21 层, wkv 宽 1024, ape 有 -> 256 元素/token；比值 128: 20 层, wkv 宽 512, ape 有 -> 4 元素/token）。attn.wkv
          那一份是 sliding_window 的局部 KV，每序列固定、不随上下文增长，单列在 local_window_bytes_per_sequence，不计入 per_token。按未压缩宽度乘总层数会高估五倍以上'
      layer_coverage: compressor 在 41 / 43 层（存在 ⟺ compress_ratios[l] != 0）；indexer 在 21 / 43 层（存在
        ⟺ compress_ratios[l] == 4）。attn.wkv 与 attn_sink 则在全部 43 层。三者覆盖面不同，不能混着说「逐层」
    attn_sink: 每头一个可学习 sink（layers.N.attn.attn_sink，全部层及 MTP 层）。它进 softmax 分母，改变算子签名；config 里没有这个开关，只能从权重清单发现
  ffn:
    type: moe
  moe:
    routed_experts: 256
    top_k: 6
    shared_experts: 1
    intermediate: 2048
    routing: sqrtsoftplus 打分 / noaux_tc 选路
    hash_layers:
      count: 3
      mapping_tensor: layers.N.ffn.gate.tid2eid
      note: 与 V4-Flash 相同 本版起这三层也有了 ffn.gate.bias（前代没有）。
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 无辅助损失，靠逐专家偏置 ffn.gate.bias 调节
  residual:
    type: mHC
    multiplier: 4
    note: 残差流扩成 hc_mult 份并行拷贝，每层带 hc_attn_* / hc_ffn_* 系数张量；V4 到 V4-Flash-Vision-Exp 在 lm_head 前还有一组
      hc_head_*，V4.1 起撤掉。残差宽度乘 4 会改掉所有逐元素算子与 norm 的形状
  decoding:
    mtp_layers: 3
    speculative:
      method: DSpark
      num_tokens: 5
      target_layers:
      - 40
      - 41
      - 42
      own_moe:
        routed_experts: 256
        top_k: 6
    mtp_layers_note: 每个 MTP 块自带一套与主干同尺寸的 256 专家 MoE（权重实测 mtp.N.ffn.experts.0..255），草稿侧路由专家合计 3×256
      = 768 —— 对 EP 切分与权重账都是大项。V4.1 起缩到 128 专家 / top-3。
  vision:
    encoder: 自研 ViT：vision.blocks.* 用融合 wqkv 且带 bias，与主干注意力不同构
    layers: 32
    hidden: 1024
    num_heads: 16
    patch_size: 14
    downsample_ratio: 3
    max_image_tokens: 384
    fusion: 两层 MLP aligner（aligner.w1/w2，带 bias）把视觉特征投到主干 hidden，再以 image_start / image_end / image_newline
      特殊 token 拼进文本序列
