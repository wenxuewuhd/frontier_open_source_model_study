  layers: 43
  hidden: 4096
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-20
  activation: SwiGLU（hidden_act silu，w1/w3/w2 三件套），带截断 swiglu_limit 10.0
  position: RoPE theta 10000 + YaRN 外推；压缩条目另用 compress_rope_theta 160000
  attention:
    type: MQA-latent
    num_heads: 64
    num_kv_heads: 1
    qk_rope_head_dim: 64
    q_lora_rank: 1024
    o_lora_rank: 1024
    o_groups: 8
    sliding_window: 128
    head_dim: 512
