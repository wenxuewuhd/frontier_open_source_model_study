- id: R11
  field: arch.vision.tokens.max_llm_tokens_declared
  severity: missing
  claim: >-
    视觉侧结构写得很细（融合 wqkv 带 bias、门控 MLP、4 个标记向量都点了名），
    但 infra 那一维一格都没有，而且 vision_max_n_token 384 这个 config 键
    从未落进记录
  finding: >-
    补 arch.vision 下 tokens / prefill / separability 三组，逐因子核过。
    三件事值得记：
    (1) **vision_max_n_token 384 是主干侧 token 的上限、而且是面积上限**：
    384 × 3² = 3456 个 patch × 14² = 677,376 像素，
    √677,376 ≈ 823.0 **不是整数边长**，而 config 另有
    vision_max_wh_ratio 8 —— 所以它是「面积上限 + 长宽比上限」的组合，
    不是边长上限。按正方形边长去读会得到一个不存在的分辨率。
    下一代 deepseek-v41-flash 把它提到 1024，那边 1024 × 3² × 14² =
    1,806,336 恰好是 1344²，所以**两代口径一致、只是数变了**，可以放一起比。
    (2) **encoder 线性项与下一代逐位相同**（1,896,855,109,632）：
    两代视觉塔的 259 个张量形状完全一致，只有 aligner 出口从 4096 变 5120。
    但一张图的文本 token 当量是 332 对 320 —— 塔一个字没改、占比却变了，
    差的是主干（25.4 对 30.2 GFLOPs/token）。本档塔占 23%，
    是 12 份里第三高。
    (3) 分片上**和下一代正好相反**：本代 267 个视觉张量全在第 1 片，
    但同片还有 embed.weight [129280, 4096] —— 只混进来 1 个张量，
    它却是 5.3 亿参数的整张输入词表，比整座塔还大，
    所以「只读第 1 个文件」会多搬一倍多的参数，记 mixed。
    下一代把 4 个标记向量里的 3 个挪去第 2 片和 embed 同住，
    第 1 片于是成了纯视觉分片（partial）。两代差别只在那 3 个 [5120] 向量的归置
  resolution: corrected
  changed_to: >-
    新增 arch.vision.tokens（2304 → 256，压缩比 9；并写明
    vision_max_n_token 384 是主干侧面积上限、不是边长上限，
