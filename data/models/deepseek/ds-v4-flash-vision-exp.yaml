lineage:
  track: main
  predecessor: ds-v4-flash-dspark
  successor: deepseek-v41-flash
  changed_from_predecessor:
  - axis: modality
    text: 加视觉塔：vision.blocks.* 的 ViT（wqkv 融合 QKV、带 bias）+ patch_embed + 两层 aligner，并引入 image_start
      / image_end / image_newline / image_pad 特殊 token
    benefit: 多模态入口。代价是视觉塔的注意力用融合 wqkv 且带 bias，与主干不同构，要单独一套算子，不能复用主干的注意力实现
  - axis: moe
    text: 新增第二套路由偏置 ffn.gate.bias_vl，视觉 token 走独立偏置 —— 融合 router 的算子签名因此改变，config 里看不到；同时给第 0/1/2
      层（hash 路由层）补上了此前缺失的 ffn.gate.bias —— gate.bias 的层数由 40 增至 43，这三层此前只有 gate.weight 没有偏置
    benefit: 视觉与文本 token 走不同的路由偏置，避免两种模态抢同一批专家。代价是融合 router 要多带一个模态输入，算子签名因此改变
  - axis: decoding
    text: config 的 num_nextn_predict_layers 由 1 改为 3 —— 追认 dspark 那一代权重里就已经存在的 3 个 MTP 块。本版草稿侧实际只多了
      3 个张量（mtp.{0,1,2}.ffn.gate.bias_vl），4705→4708
    benefit: 对 infra 没有新增成本：3 块 MTP 在前一代就已经在算了，这一版只是 config 追上权重
