lineage:
  track: main
  predecessor: ds-v4-flash-dspark
  successor: deepseek-v41-flash
  changed_from_predecessor:
  - axis: modality
    text: >-
      加视觉塔：vision.blocks.0–31 的 ViT（wqkv [3072, 1024] 融合 QKV、带 bias；mlp.w1 [5632, 1024] = 2 × 2816 与 w2 [1024, 2816]
      无 bias；norm 只有 weight；没有位置嵌入张量，config 有 vision_rope_theta）+ patch_embed [1024, 588]（588 = 3 × 14²）
      + 两层 aligner（w1 [4096, 9216]，9216 = 1024 × 3²），以及 4 个可学习的 [4096] BF16 顶层向量 image_start / image_end /
      image_newline / image_pad（不在 embed 表里）。合计 466,393,088 参数
    benefit: 多模态入口。代价是视觉塔的注意力用融合 wqkv 且带 bias，与主干不同构，要单独一套算子，不能复用主干的注意力实现
  - axis: moe
    text: >-
      新增第二套路由偏置 ffn.gate.bias_vl：46 个 [256] F32，主干 43 层（含 hash 层 L0–L2）+ 3 个 MTP 块各一个。按名字推测是按 token
      模态选用，没有一手说明，config 里也看不到。同时给 hash 层 L0/L1/L2 补上了此前缺失的 ffn.gate.bias —— 主干 gate.bias 由 40 层增至 43 层
      （V4-Flash 与 DSpark 的这三层只有 gate.weight + tid2eid）
    benefit: 融合 router 要多带一个偏置输入（若真按模态选，还要多一个模态标记），算子签名因此改变。「避免两种模态抢同一批专家」是对动机的推测，没有来源
  - axis: decoding
    text: config 的 num_nextn_predict_layers 由 1 改为 3 —— 追认 dspark 那一代权重里就已经存在的 3 个 MTP 块。本版草稿侧实际只多了
      3 个张量（mtp.{0,1,2}.ffn.gate.bias_vl），4705→4708
    benefit: 对 infra 没有新增成本：3 块 MTP 在前一代就已经在算了，这一版只是 HF config 追上权重（DSpark 同 rev 的 inference/config.json 早已写 3）
  - axis: precision
    text: config 的 rms_norm_eps 由 1e-6 改为 1e-20（V4.1 沿用 1e-20），norm 权重本身不变
    benefit: 改的是 kernel 常数，不改形状。权重定不了哪个值是实际推理用的；1e-20 低于 BF16 的最小正规数，按 BF16 精度算 eps 等于没有
