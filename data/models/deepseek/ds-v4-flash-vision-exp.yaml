  ffn:
    type: moe
  moe:
    routed_experts: 256
    top_k: 6
    shared_experts: 1
    intermediate: 2048
    routing: sqrtsoftplus 打分 / noaux_tc 选路
    hash_layers:
      count: 3
      mapping_tensor: layers.N.ffn.gate.tid2eid
      note: count 3、tid2eid [129280, 6] 与 V4-Flash 相同；本版起 L0–L2 也有了 ffn.gate.bias 与 gate.bias_vl（V4-Flash、DSpark 的这三层只有 gate.weight + tid2eid）
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 无辅助损失，靠逐专家偏置 ffn.gate.bias 调节：主干 43 层 + 3 个 MTP 块各一个，另有同样分布的 gate.bias_vl
  residual:
    type: mHC
    multiplier: 4
    sinkhorn_iters: 20
    eps: 1.0e-06
    note: 残差流扩成 hc_mult 份并行拷贝，每层带 hc_attn_* / hc_ffn_* 系数张量；V4 到 V4-Flash-Vision-Exp 在 lm_head 前还有一组
      hc_head_*，V4.1 起撤掉。残差宽度乘 4 会改掉所有逐元素算子与 norm 的形状
  decoding:
    mtp_layers: 3
    speculative:
      method: DSpark
      num_tokens: 5
      target_layers:
      - 40
      - 41
      - 42
      own_moe:
        routed_experts: 256
        top_k: 6
    mtp_layers_note: 每个 MTP 块自带一套与主干同尺寸的 256 专家 MoE（权重实测 mtp.N.ffn.experts.0..255），草稿侧路由专家合计 3×256
      = 768 —— 对 EP 切分与权重账都是大项。V4.1 起缩到 128 专家 / top-3。
  vision:
    encoder: >-
      ViT 32 块：attn.wqkv [3072, 1024] 融合且带 bias、wo 带 bias；mlp.w1 [5632, 1024]（2 × 2816，按 w2 的输入维推是门控 MLP）+
      w2 [1024, 2816]，无 bias；norm 只有 weight；没有位置嵌入张量（config 有 vision_rope_theta 10000）。与主干注意力不同构
    intermediate: 2816
    params: 466393088
    layers: 32
    hidden: 1024
    num_heads: 16
    patch_size: 14
    downsample_ratio: 3
    max_image_tokens: 384
    fusion: >-
      两层 MLP aligner（aligner.w1 [4096, 9216] / w2 [4096, 4096]，带 bias；9216 = 1024 × 3²，即 3 × 3 合并）把视觉特征投到主干
      hidden，再以 4 个可学习的 [4096] 向量 image_start / image_end / image_newline / image_pad（顶层张量，不在 embed 表里）拼进序列。
      它们是否同时是 tokenizer 的特殊 token，facts/ 里没有
    tokens:
      reference_resolution: 672x672
      patch_grid: 48x48
      encoder_tokens: 2304
      llm_tokens: 256
      compression_ratio: 9
      compression_stage: >-
        aligner 入口一步到位：3×3 相邻 patch 在通道维拼接
        （w1 的输入维 9216 = 1024 × 9 就是这个拼接），**压缩在两层 MLP 之前**，
        所以 aligner 的两个 GEMM 只跑 256 次而不是 2304 次
      dynamic_resolution: true
      max_llm_tokens_declared: 384
      derivation: >-
        两个因子：
        (1) patch 14 —— config 的 vision_patch_size（本代是顶层扁平键，
        不是 vision_config 子对象），并由
        vision.patch_embed.proj.weight [1024, 588] 的 588 = 3 × 14 × 14 印证；
        (2) 3×3 空间合并 —— config 的 vision_downsample_ratio 3，
        并由 aligner.w1.weight 的输入维 9216 = 1024 × 9 印证。
        672 / 14 = 48，48² = 2304 个 encoder token；
        48 / 3 = 16，16² = 256 个主干 token。
        **vision_max_n_token 384 是主干侧 token 的上限**，换算过去是
        384 × 3² = 3456 个 patch × 14² = 677,376 像素。
        注意它**不对应一个整数边长的正方形**（√677,376 ≈ 823.0），
        而 config 另有 vision_max_wh_ratio 8 ——
        所以这是一个**面积上限 + 长宽比上限**的组合，不是边长上限。
        下界 vision_min_pixels 147,456 = 384²。
        **下一代把这个上限从 384 提到 1024**（deepseek-v41-flash 的
        max_image_tokens），即单图可用面积放大 2.67 倍；
        那一代的 1024 × 3² × 14² = 1,806,336 恰好是 1344²，
        两代的上限口径一致（都是主干侧 token），只是数变了。
        672×672 是本仓为跨模型比较选的参考分辨率，不是厂商默认值
      scope_note: >-
        只覆盖单张静态图。config 里没有任何时间维的键
        （没有 temporal patch、没有帧数上限），patch_embed 是 2D 的 Linear，
        所以本记录不涉及视频 token 账
    prefill:
      encoder_linear_gflops: 1896.9
      projector_linear_gflops: 27.92
      backbone_token_budget: 256
      backbone_linear_gflops_per_token: 25.49
      image_as_text_tokens: 332
      attention_excluded: >-
        被排除的是 encoder 自注意力的 QK^T 与 AV，形式
        4 × n² × hidden × layers。跨度没有一手来源：config 里没有
        窗口一类的键，厂商参考实现的视觉部分本轮没读
        （而按 model-audit 规则 10，这一族的 inference/ 自称 demo，
        即便读了也只能回答布局、不能推翻卡上的数）。
        按整图一段取 n = 2304 约 2304² × 4 × 1024 × 32 = 696 GFLOPs。
        没有加进上面几格，因为主干那侧的分母也是线性项、不含注意力
      derivation: >-
        encoder 线性项 = 2 × 2304 × (patch_embed 602,112 + 32 层 ×
        每层 12,845,056 = 411,041,792) = 2 × 2304 × 411,643,904
        = 1,896,855,109,632 —— **与下一代 deepseek-v41-flash 逐位相同**，
        因为两代的视觉塔 259 个张量形状完全一致（塔没动，只有 aligner
        的出口从 4096 变到 5120）。
        每层 12,845,056 = wqkv [3072, 1024] + wo [1024, 1024] +
        w1 [5632, 1024] + w2 [1024, 2816]（w1 是门控 MLP 两支合并，
        5632 = 2 × 2816），四项相加与清单里 128 个 blocks 线性张量的
        求和逐位相同。
        aligner 线性项 = 2 × 256 × (4096 × 9216 + 4096²) = 27,917,287,424。
        主干分母 = 2 × (active_params.total 13,272,440,407 −
        active_params.lm_head 529,530,880) = 25,485,819,054 ——
        **不能用 derived 里的 flops.linear_per_token 26,544,880,814**，
        那一项含 lm_head（decode 口径）。
        换算 = 256 + 1,924,772,397,056 / 25,485,819,054 = 256 + 75.5 = 332。
        （分母在 main 的 e394525 之后从 25.42 升到 25.49：residual
        系数计进常驻，+0.27%，换算值取整后不变。）
        **这是 12 份里塔占比第三高的一档**（332 / 256 = 1.30，塔占 23%）：
        同样的塔、同样的 9:1 压缩，而主干是全批第二小的
        （25.4 GFLOPs/token，只有 kimi-vl-a3b 的 4.49 更小）。
        下一代 deepseek-v41-flash 的主干涨到 30.3，占比随之降到 1.25 ——
        塔一个字没改，占比却变了，差的是主干
    separability:
      weight_prefix: >-
        vision.（259 个张量）与 aligner.（4 个），另有 4 个顶层标记向量
        image_start / image_end / image_newline / image_pad；
        主干在 layers. / mtp. / embed. / head. / norm.。前缀不相交
      shard_isolation: mixed
      shard_note: >-
        实测 index 的 weight_map：48 个分片里只有**第 1 个**含视觉张量，
        267 个视觉张量（259 vision. + 4 aligner. + 4 个标记向量）全在里面 ——
        但同片还有 **embed.weight [129280, 4096]**，一个 5.3 亿参数的词表。
        所以虽然只混进来 1 个张量，它却是整张输入词表，
        「只读第 1 个文件」会多搬 529,530,880 个参数（比整座塔还大）。
        **这一条和下一代正好相反**：deepseek-v41-flash 把 4 个标记向量里的
        3 个挪到第 2 片去和 embed.weight 同住，于是第 1 片成了纯视觉分片
        （partial）。两代的差别只在这 3 个 [5120] 向量的归置上 ——
        本代是 embed 进了视觉片，下一代是标记向量进了 embed 片
      cross_prefix_sharing: >-
        weight_map 的 72,633 个名字里没有任何一个同时匹配 vision. / aligner. /
        标记向量与主干前缀，即没有重名共享。落盘层面的 tied weights 要看
        safetensors 头的数据偏移是否重合，weight_map 答不了，本轮没读偏移
precision:
  # indexer 缓存的格式由厂商公布（见下 source）；main KV 这一代还不是 FP4，格式未公布。
  # 两半可信度不同，合计因此是 mixed 口径 —— 见核查 R10
  kv_cache_components:
    indexer:
      dtype: FP4
      block: 32
      scale_dtype: FP8_E8M0
      note: OCP MXFP4，E2M1 + 每 32 通道一个 E8M0 scale，每元素 0.5 + 1/32 = 0.53125 B
    source: >-
      indexer 的格式由厂商公布，出处是后继者的技术报告：DeepSeek-V4.1-Flash 技术报告 §2.4.4
      「FP4 Main KV Cache」开篇说 "DeepSeek-V4 already uses quantization-aware training (QAT)
      for FP4 indexer queries and keys, accelerating index computation and reducing the indexer
      cache size. We adopt the OCP-standard MXFP4 format"，讲的就是本代。
      同一段接着说 "We now extend QAT to the main KV cache" —— 所以 main KV 在本代还不是 FP4，
      而本代自己的模型卡只给权重精度（FP4 + FP8 Mixed，脚注限定为「专家 FP4、其余多为 FP8」），
      不给 KV 的格式或字节数，引用块没有报告 URL，仓里也没有报告 PDF。
      不要照厂商随仓 inference/ 的 act_quant / fp4_act_quant 调用读落盘格式：那些是 inplace 伪量化
      （原 dtype 回写、scale 不返回），只给 QAT 网格（判定依据见 deepseek-v41-flash 的 R36）
    note: >-
      global_kv 不在这里：main KV 的落盘格式本代未公布，derive.py 对这一半按模型 dtype 兜底，
      所以合计字节是 mixed 口径 —— indexer 那一半有一手依据，global 那一半是占位值。
      两半不能当成同一档，合计也不能和别代的 theoretical_floor 相比
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    scale_format: ue8m0
    # **FP4 这个名字是厂商的，块格式名不是。** 模型卡下载表写「FP4 + FP8 Mixed*」，脚注
    # "MoE expert parameters use FP4 precision; most other parameters use FP8"，
    # config 的 expert_dtype 也写 "fp4"。但块格式厂商一处都没命名 —— V4.1 的技术报告
    # §2.4.4 点名 "OCP-standard MXFP4" 的是 indexer 缓存，不是权重。实测签名
    # （[1,32] + E8M0 scale）与 OCP MXFP4 同构，那是本仓的判断，不写进这个字段（见核查 R12）
    expert_dtype: FP4
    per_subsystem:
      expert: FP4
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      compressor: BF16
      indexer: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      residual: FP32
      # **draft 这一格跨两种量化元素格式，而 FP4 这个值是承重的，不能改成 MIXED。**
      # 清单实测草稿侧：I8 2304 条（打包 FP4 专家，块 [1,32]）+ F8_E4M3 25 条
      # （attn 投影与共享专家，块 [32,32]），另有 BF16 20 条与 F32 30 条未量化；
      # 还原后元素数 97.4% FP4 / 2.3% FP8_E4M3 / 0.3% BF16。per_subsystem_block 的 '[1,32]+[128,128]' 披露的就是这两套。
      # **不记 MIXED 的原因**：derive.py 拿这一格当打包因子的声明
      # （dtypes.packing_factor），而 dtypes.BITS 里没有 MIXED 这个键 —— 实测改成 MIXED 后
      # 草稿侧参数量从 19,845,851,751 掉到 10,182,175,335（少 9,663,676,416），
      # 全模型从 304,646,824,126 掉到 294,983,147,710；而且 packing_suspect 只在
      # `sub not in logical` 时触发，填了 MIXED 等于有值但无用，少算是静默的。
      # 对照 minimax-m3.1-flash 的 draft 能记 MIXED：那边草稿侧没有打包容器。
      # **判据是「这个子系统里有没有打包的亚字节权重」，不是记法风格**（见核查 R13）
      draft: FP4
      vision: BF16
    per_subsystem_block:
      expert: '[1,32]'
      shared_expert: '[128,128]'
      attention: '[128,128]'
      indexer: '[128,128]'
      draft: '[1,32]+[128,128]'
    subsystem_method: >-
      早先按抽样填（每个子系统 6 个代表张量，读 16 个分片头）。与 DSpark 同名的 72317 个张量形状与 dtype 逐个相同，按元素数的全量复核
      同 ds-v4-flash / dspark；新增的视觉侧 100% BF16，代表值都不变。
      **有一格是混的：draft 跨两种量化元素格式** —— 还原后元素数 97.4% FP4
      （2304 条 I8 打包专家，块 [1,32]）/ 2.3% FP8_E4M3（25 条 attn 投影与共享专家，
      块 [128,128]）/ 0.3% BF16。这一格**不记 MIXED 是有原因的**，见该字段上方的注释与核查 R13
    # **这一格的口径是落盘容器 dtype**，逐分片读头读出来的：清单里 .scale 张量的 dtype
    # 字面就是 F8_E8M0，所以容器与逻辑精度在这份权重上重合。不是从上面的 scale_format
    # ue8m0 推的 —— 那只约束取值不约束容器，V3.1 声明了 ue8m0 而 scale 张量实测仍是 FP32。
    # Kimi-K3 的同类 scale 落盘是 U8 容器（config 的 scale_dtype 就写 torch.uint8），
    # 与这里的 FP8_E8M0 是厂商存法之差，不是口径之差（见核查 R12）
    per_subsystem_scale:
      expert: FP8_E8M0
      shared_expert: FP8_E8M0
      attention: FP8_E8M0
      indexer: FP8_E8M0
      draft: FP8_E8M0
