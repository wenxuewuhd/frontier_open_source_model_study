      note: 权重清单里 kv_b_proj / k_b_proj / v_b_proj 零命中，config 也不声明 kv_lora_rank：这一代没有 KV 上投影，不是 MLA。compress_ratios
        的项数 = 主干层数 + MTP 层数。
      measured_per_token:
        global_kv: 2768
        indexer: 672
        local_window_elems_per_sequence: 2818048
        note: >-
          注意力侧与 ds-v4-flash-dspark 逐个相同，数也相同（依据见 ds-v4-flash 的 R1）：条目宽取 compressor.norm（512 / 128），
          全局 KV = 21 × 512/4 + 20 × 512/128 = 2768，indexer = 21 × 128/4 = 672。滑窗主干 43 × 128 × 512 = 2818048 元素/序列；
          开草稿侧 3 个 MTP 块各有一份滑窗，46 层 3014656
      layer_coverage: >-
        主干口径（43 层，另有 3 个 MTP 块）：compressor 在 L2–L42 共 41 层，indexer 在比值 4 的 21 层，attn.wkv 与 attn_sink 在
        43 层 + 3 个 MTP 块。MTP 块没有 compressor 与 indexer（compress_ratios[43..45] = 0），开草稿侧只多 3 层滑窗、per_token 不变
    attn_sink: 每头一个可学习 sink（layers.N.attn.attn_sink，全部层及 MTP 层）。它进 softmax 分母，改变算子签名；config 里没有这个开关，只能从权重清单发现
  ffn:
    type: moe
  moe:
    routed_experts: 256
    top_k: 6
    shared_experts: 1
    intermediate: 2048
    routing: sqrtsoftplus 打分 / noaux_tc 选路
    hash_layers:
      count: 3
      mapping_tensor: layers.N.ffn.gate.tid2eid
      note: count 3、tid2eid [129280, 6] 与 V4-Flash 相同；本版起 L0–L2 也有了 ffn.gate.bias 与 gate.bias_vl（V4-Flash、DSpark 的这三层只有 gate.weight + tid2eid）
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 无辅助损失，靠逐专家偏置 ffn.gate.bias 调节：主干 43 层 + 3 个 MTP 块各一个，另有同样分布的 gate.bias_vl
  residual:
    type: mHC
    multiplier: 4
    sinkhorn_iters: 20
    eps: 1.0e-06
    note: 残差流扩成 hc_mult 份并行拷贝，每层带 hc_attn_* / hc_ffn_* 系数张量；V4 到 V4-Flash-Vision-Exp 在 lm_head 前还有一组
      hc_head_*，V4.1 起撤掉。残差宽度乘 4 会改掉所有逐元素算子与 norm 的形状
  decoding:
    mtp_layers: 3
    speculative:
      method: DSpark
      num_tokens: 5
      target_layers:
      - 40
      - 41
      - 42
      own_moe:
        routed_experts: 256
        top_k: 6
    mtp_layers_note: 每个 MTP 块自带一套与主干同尺寸的 256 专家 MoE（权重实测 mtp.N.ffn.experts.0..255），草稿侧路由专家合计 3×256
      = 768 —— 对 EP 切分与权重账都是大项。V4.1 起缩到 128 专家 / top-3。
  vision:
    encoder: >-
      ViT 32 块：attn.wqkv [3072, 1024] 融合且带 bias、wo 带 bias；mlp.w1 [5632, 1024]（2 × 2816，按 w2 的输入维推是门控 MLP）+
      w2 [1024, 2816]，无 bias；norm 只有 weight；没有位置嵌入张量（config 有 vision_rope_theta 10000）。与主干注意力不同构
    intermediate: 2816
    params: 466393088
    layers: 32
    hidden: 1024
    num_heads: 16
    patch_size: 14
    downsample_ratio: 3
    max_image_tokens: 384
    fusion: >-
      两层 MLP aligner（aligner.w1 [4096, 9216] / w2 [4096, 4096]，带 bias；9216 = 1024 × 3²，即 3 × 3 合并）把视觉特征投到主干
      hidden，再以 4 个可学习的 [4096] 向量 image_start / image_end / image_newline / image_pad（顶层张量，不在 embed 表里）拼进序列。
      它们是否同时是 tokenizer 的特殊 token，facts/ 里没有
precision:
  # indexer 缓存的格式由厂商公布（见下 source）；main KV 这一代还不是 FP4，格式未公布。
  # 两半可信度不同，合计因此是 mixed 口径 —— 见核查 R10
  kv_cache_components:
    indexer:
      dtype: FP4
      block: 32
      scale_dtype: FP8_E8M0
      note: OCP MXFP4，E2M1 + 每 32 通道一个 E8M0 scale，每元素 0.5 + 1/32 = 0.53125 B
    source: >-
      indexer 的格式由厂商公布，出处是后继者的技术报告：DeepSeek-V4.1-Flash 技术报告 §2.4.4
      「FP4 Main KV Cache」开篇说 "DeepSeek-V4 already uses quantization-aware training (QAT)
      for FP4 indexer queries and keys, accelerating index computation and reducing the indexer
      cache size. We adopt the OCP-standard MXFP4 format"，讲的就是本代。
      同一段接着说 "We now extend QAT to the main KV cache" —— 所以 main KV 在本代还不是 FP4，
      而本代自己的模型卡只给权重精度（FP4 + FP8 Mixed，脚注限定为「专家 FP4、其余多为 FP8」），
      不给 KV 的格式或字节数，引用块没有报告 URL，仓里也没有报告 PDF。
      不要照厂商随仓 inference/ 的 act_quant / fp4_act_quant 调用读落盘格式：那些是 inplace 伪量化
      （原 dtype 回写、scale 不返回），只给 QAT 网格（判定依据见 deepseek-v41-flash 的 R36）
    note: >-
      global_kv 不在这里：main KV 的落盘格式本代未公布，derive.py 对这一半按模型 dtype 兜底，
      所以合计字节是 mixed 口径 —— indexer 那一半有一手依据，global 那一半是占位值。
      两半不能当成同一档，合计也不能和别代的 theoretical_floor 相比
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    scale_format: ue8m0
    expert_dtype: FP4
    per_subsystem:
      expert: FP4
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      compressor: BF16
      indexer: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      residual: FP32
      draft: FP4
      vision: BF16
    per_subsystem_block:
      expert: '[1,32]'
      shared_expert: '[128,128]'
      attention: '[128,128]'
      indexer: '[128,128]'
      draft: '[1,32]+[128,128]'
    subsystem_method: >-
      早先按抽样填（每个子系统 6 个代表张量，读 16 个分片头）。与 DSpark 同名的 72317 个张量形状与 dtype 逐个相同，按元素数的全量复核
      同 ds-v4-flash / dspark；新增的视觉侧 100% BF16，代表值都不变
    per_subsystem_scale:
      expert: FP8_E8M0
      shared_expert: FP8_E8M0
      attention: FP8_E8M0
      indexer: FP8_E8M0
      draft: FP8_E8M0
