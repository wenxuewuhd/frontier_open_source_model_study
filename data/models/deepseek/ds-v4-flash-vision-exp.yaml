  reviewer: 一个只读核查代理找候选，本会话在 facts/ 上逐条复算后写入
  method: >-
    核查代理过完整清单（72633 条目）、config、repoinfo、derived，并与 ds-v4-flash-dspark 逐名比对。写进本记录的都由本会话重跑：
