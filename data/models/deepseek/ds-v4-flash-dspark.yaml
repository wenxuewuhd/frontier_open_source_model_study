notes: >-
  主干与 ds-v4-flash 逐个相同（67612 个张量名与形状），改动全在草稿侧，三件事：MTP 块 1 → 3、拼接胶水换成 main_proj、
  mtp.2 上加 markov_head 与 confidence_head。后两者从这一版起一路带到 V4.1 旗舰（V4.1 的 MTP 专家缩到 128 / top-3）。
open_questions:
- DSpark 的接受率没有公开数据，草稿收益待实测
- >-
  **main KV 的落盘格式本代未公布**（核查 R10）。厂商模型卡只给权重精度，没有技术报告；
  后继者 V4.1 的报告只说本代已对 indexer 做 FP4 MXFP4、main KV 是「now extend」的下一步。
  所以 global_kv 那一半仍按模型 dtype 兜底，合计字节是 mixed 口径，不能和别代的
  theoretical_floor 相比。要钉死得等厂商公布或读生产 kernel
- 参考实现在写缓存前对非 rope 维做 act_quant、压缩器另有 fp4_act_quant 分支，但那些是 inplace 伪量化，只给 QAT 网格、不给落盘宽度（判定依据见 deepseek-v41-flash 的 R36）
- >-
  本记录的每 token 字节仍是 mixed 兜底值。同代主线 ds-v4-flash 有厂商公布值 3,514 B/token
  （V4.1 技术报告 Figure 1(b)），而本记录的缓存元素数与它逐项相同（global 2768 + indexer 672）——
  但图上只点名了 DeepSeek-V4-Flash，没点名本档，所以不替厂商外推。
  要用的话按 ds-v4-flash 那一行读，并记住那是外推不是公布
- 训练精度没有一手来源，故不填 precision.training
reviewed:
  date: '2026-10-30'
  scope:
  - official
  - derived
  - judgement
  reviewer: 一个只读核查代理找候选，本会话在 facts/ 与厂商仓文件上逐条复算后写入
  method: >-
    核查代理过完整清单（72317 条目）、config、repoinfo、derived，并读了厂商仓的 inference/model.py 与 inference/config.json。
    写进本记录的都由本会话重跑：主干与 ds-v4-flash 的名字与形状逐个比（67612 个，0 处不同）、三个 MTP 块的条目 / 权重张量 / 专家数 /
    独有张量与有无 compressor、indexer、main_proj 与 markov / confidence 头的形状、草稿侧按元素数的精度、gate.bias 的分布；
    inference/config.json 用 curl 下到 scratchpad 后 grep 出 n_mtp_layers。条目宽度一条沿用 ds-v4-flash 的 R1。
review:
- id: R1
  field: arch.attention.kv_sharing.measured_per_token
  severity: wrong
  claim: global_kv 5456、indexer 1344、index_kv_dim 64
  finding: 主干与 ds-v4-flash 逐个相同，同一个条目宽度错（比值 4 层按 wkv 输出 1024 / 256 算，条目实为 compressor.norm 的 512 / 128）。应为 2768 + 672
  resolution: corrected
  changed_to: 同 ds-v4-flash 的 R1 / R2；滑窗改为元素口径
- id: R2
  field: lineage.changed_from_predecessor
  severity: imprecise
  claim: 「每块都是完整的 transformer + 256 专家 MoE」；「张量数 1575→4705」
  finding: >-
