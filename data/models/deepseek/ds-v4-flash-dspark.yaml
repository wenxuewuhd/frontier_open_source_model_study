lineage:
  track: main
  predecessor: ds-v4-flash
  successor: ds-v4-flash-vision-exp
  changed_from_predecessor:
  - axis: decoding
    text: >-
      草稿侧从 1 个 MTP 块扩到 3 个（mtp.0/1/2，条目 1575 → 4705、其中权重张量 797 → 2376）。每块是主干 L0/L1 那种纯滑窗层的形状
      （wq_a / wq_b / wkv / wo_a / wo_b / sink，没有 compressor 与 indexer，compress_ratios[43..45] = 0）+ 256 专家 MoE + 共享专家。
      拼接胶水换了：前代的 e_proj / h_proj / enorm / hnorm 换成 mtp.0 上的 main_norm + main_proj [4096, 12288]（12288 = 3 × 4096，
      对应 dspark_target_layer_ids 40/41/42 三层的 hidden）；mtp.2 上另加 markov_head（markov_w1 / markov_w2 各 [129280, 256]）、
      confidence_head.proj [1, 4352]（4352 = 4096 + 256）以及 hc_head_* 与 norm。三块都没有自己的 embed / head。
      一次出 5 个 token（dspark_block_size 5）。HF 的 config.json 里 num_nextn_predict_layers 仍写 1，与权重不符；
      同 rev 的 inference/config.json 已写 n_mtp_layers 3
    benefit: 草稿更长，投机的接受窗口更大。代价是草稿侧权重涨到约 3 倍（6.61B → 19.85B），而且每块都带自己的 MoE —— 对 EP 切分是实打实的大项。markov_head
      与 confidence_head 是附加头，不是对 transformer 块的替换
