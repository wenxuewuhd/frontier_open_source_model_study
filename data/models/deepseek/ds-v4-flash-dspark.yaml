      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 0
      - 0
      - 0
      note: 权重清单里 kv_b_proj / k_b_proj / v_b_proj 零命中，config 也不声明 kv_lora_rank：这一代没有 KV 上投影，不是 MLA。compress_ratios
        的项数 = 主干层数 + MTP 层数。
      measured_per_token:
        global_kv: 2768
        indexer: 672
        local_window_elems_per_sequence: 2818048
        note: >-
          主干与 ds-v4-flash 逐个相同，数也相同（依据见那份的 R1）：条目宽取 compressor.norm（512 / 128），
          全局 KV = 21 × 512/4 + 20 × 512/128 = 2768，indexer = 21 × 128/4 = 672。滑窗主干 43 × 128 × 512 = 2818048 元素/序列；
          开草稿侧 3 个 MTP 块各有一份滑窗，46 层 3014656
      layer_coverage: >-
        主干口径（43 层，另有 3 个 MTP 块）：compressor 在 L2–L42 共 41 层，indexer 在比值 4 的 21 层，attn.wkv 与 attn_sink 在
        43 层 + 3 个 MTP 块。MTP 块没有 compressor 与 indexer（compress_ratios[43..45] = 0），开草稿侧只多 3 层滑窗、per_token 不变
    attn_sink: 每头一个可学习 sink（layers.N.attn.attn_sink，全部层及 MTP 层）。它进 softmax 分母，改变算子签名；config 里没有这个开关，只能从权重清单发现
  ffn:
    type: moe
  moe:
    routed_experts: 256
    top_k: 6
    shared_experts: 1
    intermediate: 2048
    routing: sqrtsoftplus 打分 / noaux_tc 选路
    hash_layers:
      count: 3
      mapping_tensor: layers.N.ffn.gate.tid2eid
      note: 与 V4-Flash 相同：L0/L1/L2 各一张 gate.tid2eid [129280, 6]，同时保留 gate.weight，没有 gate.bias
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 无辅助损失，靠逐专家偏置 ffn.gate.bias 调节。主干 L3–L42 的 40 个 + 3 个 MTP 块各 1 个；hash 层 L0–L2 没有
  residual:
    type: mHC
    multiplier: 4
    sinkhorn_iters: 20
    eps: 1.0e-06
    note: 残差流扩成 hc_mult 份并行拷贝，每层带 hc_attn_* / hc_ffn_* 系数张量；V4 到 V4-Flash-Vision-Exp 在 lm_head 前还有一组
      hc_head_*，V4.1 起撤掉。残差宽度乘 4 会改掉所有逐元素算子与 norm 的形状
  decoding:
    mtp_layers: 3
    speculative:
      method: DSpark
      num_tokens: 5
      target_layers:
      - 40
      - 41
      - 42
      own_moe:
        routed_experts: 256
        top_k: 6
    mtp_layers_note: HF 的 config.json 里 num_nextn_predict_layers 声明 1，但权重里有 3 个 MTP 块（mtp.0/1/2，各带纯滑窗注意力
      与 256 专家的 MoE，没有 compressor / indexer），compress_ratios 也是 46 = 43+3，同 rev 的 inference/config.json 写 n_mtp_layers 3。
      以权重为准。到 vision-exp 那一版 HF config 才跟着改成 3。每个
      MTP 块自带一套与主干同尺寸的 256 专家 MoE（权重实测 mtp.N.ffn.experts.0..255），草稿侧路由专家合计 3×256 = 768 —— 对 EP 切分与权重账都是大项。V4.1
      起缩到 128 专家 / top-3。
precision:
  # indexer 缓存的格式由厂商公布（见下 source）；main KV 这一代还不是 FP4，格式未公布。
  # 两半可信度不同，合计因此是 mixed 口径 —— 见核查 R10
  kv_cache_components:
    indexer:
      dtype: FP4
      block: 32
      scale_dtype: FP8_E8M0
      note: OCP MXFP4，E2M1 + 每 32 通道一个 E8M0 scale，每元素 0.5 + 1/32 = 0.53125 B
    source: >-
      indexer 的格式由厂商公布，出处是后继者的技术报告：DeepSeek-V4.1-Flash 技术报告 §2.4.4
      「FP4 Main KV Cache」开篇说 "DeepSeek-V4 already uses quantization-aware training (QAT)
      for FP4 indexer queries and keys, accelerating index computation and reducing the indexer
      cache size. We adopt the OCP-standard MXFP4 format"，讲的就是本代。
      同一段接着说 "We now extend QAT to the main KV cache" —— 所以 main KV 在本代还不是 FP4，
      而本代自己的模型卡只给权重精度（FP4 + FP8 Mixed，脚注限定为「专家 FP4、其余多为 FP8」），
      不给 KV 的格式或字节数，引用块没有报告 URL，仓里也没有报告 PDF。
      不要照厂商随仓 inference/ 的 act_quant / fp4_act_quant 调用读落盘格式：那些是 inplace 伪量化
      （原 dtype 回写、scale 不返回），只给 QAT 网格（判定依据见 deepseek-v41-flash 的 R36）
    note: >-
      global_kv 不在这里：main KV 的落盘格式本代未公布，derive.py 对这一半按模型 dtype 兜底，
      所以合计字节是 mixed 口径 —— indexer 那一半有一手依据，global 那一半是占位值。
      两半不能当成同一档，合计也不能和别代的 theoretical_floor 相比
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    scale_format: ue8m0
    # **FP4 这个名字是厂商的，块格式名不是。** 模型卡下载表写「FP4 + FP8 Mixed*」，脚注
    # "MoE expert parameters use FP4 precision; most other parameters use FP8"，
    # config 的 expert_dtype 也写 "fp4"。但块格式厂商一处都没命名 —— V4.1 的技术报告
    # §2.4.4 点名 "OCP-standard MXFP4" 的是 indexer 缓存，不是权重。实测签名
    # （[1,32] + E8M0 scale）与 OCP MXFP4 同构，那是本仓的判断，不写进这个字段（见核查 R11）
    expert_dtype: FP4
    per_subsystem:
      expert: FP4
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      compressor: BF16
      indexer: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      residual: FP32
      # **draft 这一格跨两种量化元素格式，而 FP4 这个值是承重的，不能改成 MIXED。**
      # 清单实测草稿侧：I8 2304 条（打包 FP4 专家，块 [1,32]）+ F8_E4M3 25 条
      # （attn 投影与共享专家，块 [32,32]），另有 BF16 20 条与 F32 27 条未量化；
      # 还原后元素数 97.4% FP4 / 2.3% FP8_E4M3 / 0.3% BF16。per_subsystem_block 的 '[1,32]+[128,128]' 披露的就是这两套。
      # **不记 MIXED 的原因**：derive.py 拿这一格当打包因子的声明
      # （dtypes.packing_factor），而 dtypes.BITS 里没有 MIXED 这个键 —— 实测改成 MIXED 后
      # 草稿侧参数量从 19,845,850,983 掉到 10,182,174,567（少 9,663,676,416），
      # 全模型从 304,180,418,494 掉到 294,516,742,078；而且 packing_suspect 只在
      # `sub not in logical` 时触发，填了 MIXED 等于有值但无用，少算是静默的。
      # 对照 minimax-m3.1-flash 的 draft 能记 MIXED：那边草稿侧没有打包容器。
      # **判据是「这个子系统里有没有打包的亚字节权重」，不是记法风格**（见核查 R12）
      draft: FP4
    per_subsystem_block:
      expert: '[1,32]'
      shared_expert: '[128,128]'
      attention: '[128,128]'
      indexer: '[128,128]'
      draft: '[1,32]+[128,128]'
    subsystem_method: >-
      早先按抽样填（每个子系统 6 个代表张量，读 16 个分片头）。主干与 ds-v4-flash 逐个相同，按元素数的全量复核同那份；
      草稿侧按完整清单是 97.4% FP4 / 2.3% FP8 / 0.4% BF16（markov / confidence 头是 BF16），代表值不变
    # **这一格的口径是落盘容器 dtype**，逐分片读头读出来的：清单里 .scale 张量的 dtype
    # 字面就是 F8_E8M0，所以容器与逻辑精度在这份权重上重合。不是从上面的 scale_format
    # ue8m0 推的 —— 那只约束取值不约束容器，V3.1 声明了 ue8m0 而 scale 张量实测仍是 FP32。
    # Kimi-K3 的同类 scale 落盘是 U8 容器（config 的 scale_dtype 就写 torch.uint8），
    # 与这里的 FP8_E8M0 是厂商存法之差，不是口径之差（见核查 R11）
    per_subsystem_scale:
      expert: FP8_E8M0
      shared_expert: FP8_E8M0
      attention: FP8_E8M0
      indexer: FP8_E8M0
      draft: FP8_E8M0
infra_signals:
- text: >-
    草稿侧仍是 transformer：3 个块与主干的纯滑窗层（L0/L1）同构，用同一套注意力与 MoE 算子。新增要排的只有 mtp.0 的 main_proj
    （12288 → 4096 GEMM）与 mtp.2 的 markov_head（词表 × 256 的 gather + GEMM）/ confidence_head（4352 → 1 GEMV）。一次出 5 个 token
