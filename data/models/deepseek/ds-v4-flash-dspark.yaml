arch:
  layers: 43
  hidden: 4096
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，w1/w3/w2 三件套），带截断 swiglu_limit 10.0
  position: RoPE theta 10000 + YaRN 外推；压缩条目另用 compress_rope_theta 160000
  attention:
    type: MQA-latent
    num_heads: 64
    num_kv_heads: 1
    qk_rope_head_dim: 64
    q_lora_rank: 1024
    o_lora_rank: 1024
    o_groups: 8
    sliding_window: 128
    head_dim: 512
    head_dim_note: num_kv_heads 1 × head_dim 512 是一个条目的宽度（attn.wkv 与 compressor.norm 都是 512，64 维 rope 在内），不是每 token 的缓存 —— 每 token 见 measured_per_token
    sparse:
      mechanism: indexer 打分取 topk 后在选中 token 上做全注意力。只在 21 / 43 层上有 indexer —— 权重里的规律是 indexer 存在 ⟺
        compress_ratios[l] == 4，零例外。这一代没有独立的 indexer.wk，index K 由 attn.indexer.compressor.wkv 产出
      index_n_heads: 64
      index_head_dim: 128
      index_topk: 512
      index_kv_dim: 32
      index_kv_source: >-
        layers.N.attn.indexer.compressor.wkv.weight 输出维 256，是比值 4 的重叠窗口带来的 2 倍；条目宽以
        indexer.compressor.norm.weight [128] 为准，4 个 token 一个条目，每 token 32 元素（同 ds-v4-flash 的 R2）
    kv_sharing:
      compress_ratios:
      - 0
      - 0
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 0
      - 0
      - 0
      note: 权重清单里 kv_b_proj / k_b_proj / v_b_proj 零命中，config 也不声明 kv_lora_rank：这一代没有 KV 上投影，不是 MLA。compress_ratios
        的项数 = 主干层数 + MTP 层数。
      measured_per_token:
        global_kv: 2768
        indexer: 672
        local_window_elems_per_sequence: 2818048
        note: >-
          主干与 ds-v4-flash 逐个相同，数也相同（依据见那份的 R1）：条目宽取 compressor.norm（512 / 128），
          全局 KV = 21 × 512/4 + 20 × 512/128 = 2768，indexer = 21 × 128/4 = 672。滑窗主干 43 × 128 × 512 = 2818048 元素/序列；
          开草稿侧 3 个 MTP 块各有一份滑窗，46 层 3014656
      layer_coverage: >-
        主干口径（43 层，另有 3 个 MTP 块）：compressor 在 L2–L42 共 41 层，indexer 在比值 4 的 21 层，attn.wkv 与 attn_sink 在
        43 层 + 3 个 MTP 块。MTP 块没有 compressor 与 indexer（compress_ratios[43..45] = 0），开草稿侧只多 3 层滑窗、per_token 不变
    attn_sink: 每头一个可学习 sink（layers.N.attn.attn_sink，全部层及 MTP 层）。它进 softmax 分母，改变算子签名；config 里没有这个开关，只能从权重清单发现
  ffn:
    type: moe
  moe:
    routed_experts: 256
    top_k: 6
    shared_experts: 1
    intermediate: 2048
    routing: sqrtsoftplus 打分 / noaux_tc 选路
    hash_layers:
      count: 3
      mapping_tensor: layers.N.ffn.gate.tid2eid
      note: 与 V4-Flash 相同：L0/L1/L2 各一张 gate.tid2eid [129280, 6]，同时保留 gate.weight，没有 gate.bias
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 无辅助损失，靠逐专家偏置 ffn.gate.bias 调节。主干 L3–L42 的 40 个 + 3 个 MTP 块各 1 个；hash 层 L0–L2 没有
  residual:
    type: mHC
    multiplier: 4
    sinkhorn_iters: 20
    eps: 1.0e-06
    note: 残差流扩成 hc_mult 份并行拷贝，每层带 hc_attn_* / hc_ffn_* 系数张量；V4 到 V4-Flash-Vision-Exp 在 lm_head 前还有一组
      hc_head_*，V4.1 起撤掉。残差宽度乘 4 会改掉所有逐元素算子与 norm 的形状
  decoding:
    mtp_layers: 3
    speculative:
      method: DSpark
      num_tokens: 5
      target_layers:
      - 40
      - 41
      - 42
      own_moe:
        routed_experts: 256
        top_k: 6
    mtp_layers_note: HF 的 config.json 里 num_nextn_predict_layers 声明 1，但权重里有 3 个 MTP 块（mtp.0/1/2，各带纯滑窗注意力
      与 256 专家的 MoE，没有 compressor / indexer），compress_ratios 也是 46 = 43+3，同 rev 的 inference/config.json 写 n_mtp_layers 3。
      以权重为准。到 vision-exp 那一版 HF config 才跟着改成 3。每个
      MTP 块自带一套与主干同尺寸的 256 专家 MoE（权重实测 mtp.N.ffn.experts.0..255），草稿侧路由专家合计 3×256 = 768 —— 对 EP 切分与权重账都是大项。V4.1
      起缩到 128 专家 / top-3。
