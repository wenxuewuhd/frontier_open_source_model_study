    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    scale_format: ue8m0
    expert_dtype: FP4
    per_subsystem:
      expert: FP4
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      compressor: BF16
      indexer: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      residual: FP32
      draft: FP4
    per_subsystem_block:
      expert: '[1,32]'
      shared_expert: '[128,128]'
      attention: '[128,128]'
      indexer: '[128,128]'
      draft: '[1,32]+[128,128]'
    subsystem_method: >-
      早先按抽样填（每个子系统 6 个代表张量，读 16 个分片头）。主干与 ds-v4-flash 逐个相同，按元素数的全量复核同那份；
      草稿侧按完整清单是 97.4% FP4 / 2.3% FP8 / 0.4% BF16（markov / confidence 头是 BF16），代表值不变
