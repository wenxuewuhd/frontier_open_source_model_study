lineage:
  track: main
  predecessor: ds-v4-flash
  successor: ds-v4-flash-0731
  changed_from_predecessor:
  - axis: decoding
    text: MTP 头换成 DSpark：e_proj / h_proj / enorm / hnorm 退场，改为 main_proj / main_norm + markov_head.markov_w1,w2
      + confidence_head.proj，一次出 5 个 token（dspark_block_size 5）。主干 43 层与 V4-Flash 完全一致
    benefit: 草稿头不再是「再跑一层 transformer」：markov head 加置信度门控一次出 5 个 token，草稿成本远低于主干层。代价是草稿侧算子与主干不同构，要单独排一套
params:
  counting_note: 本记录未取权重清单（facts 下只有张量名、没有形状与 dtype），所以不报参数量。DeepSeek 自 V3 起以 FP8 块量化发布、V4 起路由专家再降到
    FP4 两个一字节打包，按 safetensors 的 numel 直接求和会把参数量少算一半 —— 没有 dtype 就没有可信总量。要出总量需用 scripts/fetch_hf.py
    不带 --names-only 重取。
context:
  max: 1048576
  train_native: 65536
arch:
  layers: 43
  hidden: 4096
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MQA-latent
    num_heads: 64
    num_kv_heads: 1
    qk_rope_head_dim: 64
    q_lora_rank: 1024
    o_lora_rank: 1024
    o_groups: 8
    sliding_window: 128
    head_dim: 512
    sparse:
      mechanism: indexer 打分取 topk 后在选中 token 上做全注意力。与 V3.2 不同，这一代 indexer 没有独立的 wk，index K 由 attn.indexer.compressor.*
        供给
      index_n_heads: 64
      index_head_dim: 128
      index_topk: 512
    kv_sharing:
      compress_ratios:
      - 0
      - 0
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
