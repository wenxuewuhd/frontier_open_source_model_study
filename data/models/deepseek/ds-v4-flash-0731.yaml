params:
  counting_note: 未单独取全量权重清单：本版张量名集合与 ds-v4-flash-dspark 逐个相同、逐子系统 dtype 也一致，参数量必然相同，见该记录。重复取一遍只是把同一个数算两遍。
context:
  max: 1048576
  train_native: 65536
arch:
  layers: 43
  hidden: 4096
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MQA-latent
    num_heads: 64
    num_kv_heads: 1
    qk_rope_head_dim: 64
    q_lora_rank: 1024
    o_lora_rank: 1024
    o_groups: 8
    sliding_window: 128
    head_dim: 512
    sparse:
      mechanism: indexer 打分取 topk 后在选中 token 上做全注意力。与 V3.2 不同，这一代 indexer 没有独立的 wk，index K 由 attn.indexer.compressor.*
        供给
      index_n_heads: 64
      index_head_dim: 128
      index_topk: 512
      index_kv_dim: 256
      index_kv_source: layers.N.attn.indexer.compressor.wkv.weight [256, 4096]，输出维 256（无独立 indexer.wk）
    kv_sharing:
      compress_ratios:
      - 0
      - 0
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 0
      - 0
      - 0
      note: 权重清单里 kv_b_proj / k_b_proj / v_b_proj 零命中，config 也不声明 kv_lora_rank：这一代没有 KV 上投影，不是 MLA。compress_ratios
        的项数 = 主干层数 + MTP 层数。
      measured_per_token:
        global_kv: 5456
        indexer: 1344
        local_window_bytes_per_sequence: 5636096
        note: '按完整权重清单逐层量出来的每 token 元素数。compressor.ape 的第一维就是该层压缩比，每 token 元素 = wkv 输出宽度 / 比值（比值 4:
          21 层, wkv 宽 1024, ape 有 -> 256 元素/token；比值 128: 20 层, wkv 宽 512, ape 有 -> 4 元素/token）。attn.wkv
          那一份是 sliding_window 的局部 KV，每序列固定、不随上下文增长，单列在 local_window_bytes_per_sequence，不计入 per_token。按未压缩宽度乘总层数会高估五倍以上'
    attn_sink: 每头一个可学习 sink（layers.N.attn.attn_sink，全部层及 MTP 层）。它进 softmax 分母，改变算子签名；config 里没有这个开关，只能从权重清单发现
  ffn:
    type: moe
  moe:
    routed_experts: 256
    top_k: 6
    shared_experts: 1
    intermediate: 2048
    routing: sqrtsoftplus 打分 / noaux_tc 选路
    hash_layers:
      count: 3
      mapping_tensor: layers.N.ffn.gate.tid2eid
      note: 与 V4-Flash 相同
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 无辅助损失，靠逐专家偏置 ffn.gate.bias 调节
  residual:
    type: mHC
    multiplier: 4
    note: 残差流扩成 hc_mult 份并行拷贝，每层带 hc_attn_* / hc_ffn_* 系数张量；V4 到 V4-Flash-Vision-Exp 在 lm_head 前还有一组
      hc_head_*，V4.1 起撤掉。残差宽度乘 4 会改掉所有逐元素算子与 norm 的形状
  decoding:
    mtp_layers: 3
    speculative:
      method: DSpark
      num_tokens: 5
      target_layers:
      - 40
      - 41
      - 42
    mtp_layers_note: config 的 num_nextn_predict_layers 声明 1，但权重里有 3 个完整 MTP 块 （mtp.0/1/2，各带完整 attn.*
      与 256 专家的 MoE），compress_ratios 也是 46 = 43+3。以权重为准。vision-exp 那一代 config 才把这个字段改成 3，追认既有权重
precision:
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    scale_format: ue8m0
    expert_dtype: FP4
    per_subsystem:
      expert: FP4
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      residual: FP32
      draft: FP4
    per_subsystem_block:
      expert: '[1,32]'
      shared_expert: '[128,128]'
      attention: '[128,128]'
      draft: '[1,32]+[128,128]'
    subsystem_method: 抽样：每个子系统 6 个代表张量，共读 14 个分片头
    per_subsystem_scale:
      expert: FP8_E8M0
      shared_expert: FP8_E8M0
      attention: FP8_E8M0
      draft: FP8_E8M0
