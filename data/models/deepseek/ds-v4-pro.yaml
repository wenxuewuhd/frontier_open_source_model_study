lineage:
  track: side
  predecessor: ds-v4-flash
  changed_from_predecessor:
  - axis: scale
    text: 与 V4-Flash 同架构同算子的放大版：61 层 / hidden 7168 / 384 专家 / 专家中间维 3072 / 128 头 / o_groups 16 / q_lora
      1536；index topk 512→1024，routed_scaling_factor 1.5→2.5
    benefit: 同一套算子直接放大，算子表可共用、只换形状参数 —— 对 infra 是最省事的一类变化，值得和「机制变化」分开记
  - axis: attention
    text: >-
      首两层的压缩比由 0 改为 128：Flash 的 L0/L1 只有 128 token 的滑窗 KV、没有全局 KV（没有 compressor）；
      Pro 的 L0/L1 带 attn.compressor.*（ape [128, 512]），建 128 倍压缩的全局 KV，但没有 indexer
    benefit: >-
      前两层由「只有滑窗」变成「滑窗 + 重压缩的全局 KV」，每层每 token 多 512/128 = 4 元素。比值 0 不是「留全量」——
      参考实现里比值 0 的层缓存只有 window 那一段。为什么 Flash 不建、Pro 建，没有公开说明
