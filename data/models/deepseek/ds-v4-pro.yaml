      - 4
      - 0
      note: 权重清单里 kv_b_proj / k_b_proj / v_b_proj 零命中，config 也不声明 kv_lora_rank：这一代没有 KV 上投影，不是 MLA。compress_ratios
        的项数 = 主干层数 + MTP 层数。
      measured_per_token:
        global_kv: 7804
        indexer: 1920
        local_window_bytes_per_sequence: 7995392
        note: '按完整权重清单逐层量出来的每 token 元素数。compressor.ape 的第一维就是该层压缩比，每 token 元素 = wkv 输出宽度 / 比值（比值 4:
          30 层, wkv 宽 1024, ape 有 -> 256 元素/token；比值 128: 31 层, wkv 宽 512, ape 有 -> 4 元素/token）。attn.wkv
          那一份是 sliding_window 的局部 KV，每序列固定、不随上下文增长，单列在 local_window_bytes_per_sequence，不计入 per_token。按未压缩宽度乘总层数会高估五倍以上'
      layer_coverage: compressor 在 61 / 61 层（存在 ⟺ compress_ratios[l] != 0）；indexer 在 30 / 61 层（存在
        ⟺ compress_ratios[l] == 4）。attn.wkv 与 attn_sink 则在全部 61 层。三者覆盖面不同，不能混着说「逐层」
    attn_sink: 每头一个可学习 sink（layers.N.attn.attn_sink [128] F32，= num_attention_heads 128；Flash 系是 [64]）。全部
      61 层及 MTP 层都有。它进 softmax 分母，改变算子签名；config 里没有这个开关，只能从权重清单发现
  ffn:
    type: moe
  moe:
    routed_experts: 384
    top_k: 6
    shared_experts: 1
    intermediate: 3072
    routing: sqrtsoftplus 打分 / noaux_tc 选路
    hash_layers:
      count: 3
      mapping_tensor: layers.N.ffn.gate.tid2eid
      note: 与 V4-Flash 相同
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 无辅助损失，靠逐专家偏置 ffn.gate.bias 调节
  residual:
    type: mHC
    multiplier: 4
    note: 残差流扩成 hc_mult 份并行拷贝，每层带 hc_attn_* / hc_ffn_* 系数张量；V4 到 V4-Flash-Vision-Exp 在 lm_head 前还有一组
      hc_head_*，V4.1 起撤掉。残差宽度乘 4 会改掉所有逐元素算子与 norm 的形状
  decoding:
    mtp_layers: 1
