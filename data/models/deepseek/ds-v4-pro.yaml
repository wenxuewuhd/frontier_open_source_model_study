    （delta 0.0）是实测比实测。清单 145116 个条目 = 73164 个权重张量 + 71952 个 F8_E8M0 的 .scale 容器（不计参数、计存储）。
    路由专家以 FP4 两个一字节打包存放，numel 是容器数，已按逻辑精度还原。total 不含草稿侧 25.8B；含在内的实测总量
