context:
  max: 1048576
  train_native: 65536
arch:
  layers: 61
  hidden: 7168
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，w1/w3/w2 三件套），带截断 swiglu_limit 10.0
  position: RoPE theta 10000 + YaRN 外推；压缩条目另用 compress_rope_theta 160000
  attention:
    type: MQA-latent
    num_heads: 128
    num_kv_heads: 1
    qk_rope_head_dim: 64
    q_lora_rank: 1536
    o_lora_rank: 1024
    o_groups: 16
    sliding_window: 128
    head_dim: 512
    head_dim_note: >-
      head_dim 512 同时是 KV 条目宽（attn.wkv 与 compressor.norm 都是 512）与 query 每头宽（wq_b [65536, 1536] = 128 × 512），
      64 维 rope 在 512 之内。num_kv_heads 1 × 512 是一个条目的宽度，不是每 token 的缓存 —— 每 token 见 measured_per_token
    sparse:
      mechanism: indexer 打分取 topk 后在选中 token 上做全注意力。只在 30 / 61 层上有 indexer —— 权重里的规律是 indexer 存在 ⟺
        compress_ratios[l] == 4，零例外。这一代没有独立的 indexer.wk，index K 由 attn.indexer.compressor.wkv 产出
      index_n_heads: 64
      index_head_dim: 128
      index_topk: 1024
      index_kv_dim: 32
      index_kv_source: >-
        layers.N.attn.indexer.compressor.wkv.weight 输出维 256，是比值 4 的重叠窗口带来的 2 倍；条目宽以
        indexer.compressor.norm.weight [128] 为准（30 层都是），4 个 token 一个 128 维条目，每 token 32 元素。
        index_kv_dim 记的是每 token 值，不是条目宽度
    kv_sharing:
      compress_ratios:
      - 128
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
