reviewed_elsewhere:
  record: deepseek-v41-flash
  findings:
  - R28
  - R23
  scope: >-
    R28 推翻了本记录原先的每 token 注意力显存 101504 B：三处独立错因叠加、高估 5.2 倍
    （indexer 按总层数 61 算而实测只在比值为 4 的 30 层；indexer 宽度没除压缩比；
    把 sliding_window=128 的局部 KV 当全局 KV 逐 token 计费）。改出来的
    arch.attention.kv_sharing.measured_per_token（global_kv 7804 + indexer 1920）
    就在本记录里（其后由本记录的 R1 改正为 3964 + 960：比值 4 层的条目宽按 wkv 输出算高了一倍）。R23 顺带实测了本记录的 FP4 路由专家块是 [1,32]
    （w1 [3072,3584] 对 scale [3072,224]），不是 config 声明的 [128,128]。
    只覆盖这两处：注意力显存口径与路由专家的量化块。本记录其余字段的核查见本记录自己的 reviewed / review
notes: 归一化后（层号、专家号）张量名族集合与 V4-Flash 完全相同（98 族，两边都没有独有族）；原始名是它的超集：层 43→61、专家 256→384，另加 L0/L1 的 attn.compressor.*。无新增算子类型。同日发布的大号版本，适合用来区分「规格变化」与「机制变化」。
open_questions:
- KV 的实际落盘精度未进记录，derive.py 按 BF16 兜底（dtype_fallback）；参考实现在写缓存前另做量化，生产 kernel 的落盘格式没有核（同 ds-v4-flash）
- 参考实现的压缩器另有每序列 FP32 状态 kv_state / score_state，未计入（形状与算法见 ds-v4-flash 的 open question）
- 训练精度没有一手来源，故不填 precision.training
- context.train_native 65536 取自 rope_scaling.original_max_position_embeddings，是否等于训练长度未见说明
reviewed:
  date: '2026-10-30'
  scope:
  - official
  - derived
  - judgement
  reviewer: 一个只读核查代理找候选，本会话在 facts/、厂商 README 与参考实现上逐条复算后写入
  method: >-
    核查代理过完整清单（145116 条目）、config、repoinfo、derived，并读了厂商仓的 inference/model.py 与 README。写进本记录的都由
    本会话重跑：逐层 compressor.wkv / norm / ape 与 indexer.compressor 形状（比值 128 的 31 层、比值 4 的 30 层）、
    L0/L1 的 compressor 与 Flash 对应层的有无、mtp.0 的构成、归一化名字族集合差（0）、scale 条目、HF tally 口径、
    gate.bias 层号、config 键、按元素数的逐子系统精度；README 用 curl 下到 scratchpad 后 grep 出原句。
    参考实现取自 V4-Flash 仓（同代、同一套 Compressor），本仓 Pro 的形状与之一致。
