lineage:
  track: side
  predecessor: ds-v4-flash
  changed_from_predecessor:
  - axis: scale
    text: 与 V4-Flash 同架构同算子的放大版：61 层 / hidden 7168 / 384 专家 / 专家中间维 3072 / 128 头 / o_groups 16 / q_lora
      1536；index topk 512→1024，routed_scaling_factor 1.5→2.5
    benefit: 同一套算子直接放大，算子表可共用、只换形状参数 —— 对 infra 是最省事的一类变化，值得和「机制变化」分开记
  - axis: attention
    text: 首两层的压缩比由 0 改为 128 —— Flash 的前两层不建压缩 KV，Pro 建
    benefit: Pro 层数多，前两层也建压缩 KV 才划算；Flash 层少，前两层留全量换精度
