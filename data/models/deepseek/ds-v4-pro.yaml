    indexer.compressor.norm [128]，条目宽是后者（参考实现在比值 4 时用重叠窗口，coff = 2 只是中间宽度）。
    全局 KV = 30 × 128 + 31 × 4 = 3964，indexer = 30 × 32 = 960，合计 4924 元素 / 9848 B（BF16 兜底），原值 19448 B 高约一倍
