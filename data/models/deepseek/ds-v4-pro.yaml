      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 128
      - 4
      - 0
      note: 权重清单里 kv_b_proj / k_b_proj / v_b_proj 零命中，config 也不声明 kv_lora_rank：这一代没有 KV 上投影，不是 MLA。compress_ratios
        的项数 = 主干层数 + MTP 层数。
      measured_per_token:
        global_kv: 3964
        indexer: 960
        local_window_elems_per_sequence: 3997696
        note: >-
          元素口径，主干 61 层。每 token 元素 = 条目宽 / 压缩比，条目宽取 compressor.norm 的宽度：比值 4 的 30 层
          compressor.wkv / ape 宽 1024，但 compressor.norm [512]（重叠窗口，依据见 ds-v4-flash 的 R1）。
          全局 KV = 30 × 512/4 + 31 × 512/128 = 3840 + 124 = 3964；indexer = 30 × 128/4 = 960。
          attn.wkv 那一份是滑窗局部 KV，每序列固定：61 × 128 × 512 = 3997696 元素/序列，开草稿侧加 mtp.0 为 62 层 4063232
      layer_coverage: >-
        主干口径（61 层，另有 1 个 MTP 块 mtp.0）：compressor 在全部 61 层（存在 ⟺ compress_ratios[l] != 0，主干没有比值 0 的层，
        这条只由 mtp.0 一项检验到）；indexer 在比值 4 的 30 层；attn.wkv 与 attn_sink 在 61 层 + mtp.0。mtp.0 没有 compressor 与
        indexer（compress_ratios[61] = 0），开草稿侧只多一层滑窗 KV、per_token 不变。这两条 ⟺ 规律只在本清单上验过
    attn_sink: 每头一个可学习 sink（layers.N.attn.attn_sink [128] F32，= num_attention_heads 128；Flash 系是 [64]）。全部
      61 层及 MTP 层都有。它进 softmax 分母，改变算子签名；config 里没有这个开关，只能从权重清单发现
  ffn:
    type: moe
  moe:
    routed_experts: 384
    top_k: 6
    shared_experts: 1
    intermediate: 3072
    routing: sqrtsoftplus 打分 / noaux_tc 选路
    hash_layers:
      count: 3
      mapping_tensor: layers.N.ffn.gate.tid2eid
      note: 与 V4-Flash 相同：L0/L1/L2 各一张 gate.tid2eid [129280, 6]，同时保留 gate.weight，没有 gate.bias
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 无辅助损失，靠逐专家偏置 ffn.gate.bias [384] 调节。59 个 = 主干 L3–L60 的 58 个 + mtp.0 的 1 个；hash 层 L0–L2 没有
  residual:
    type: mHC
    multiplier: 4
    sinkhorn_iters: 20
    eps: 1.0e-06
    coef_proj: 每层 hc_attn_fn 与 hc_ffn_fn 各一个 [24, 28672] F32（28672 = 4 × hidden）
    note: 残差流扩成 hc_mult 份并行拷贝，每层带 hc_attn_* / hc_ffn_* 系数张量；V4 到 V4-Flash-Vision-Exp 在 lm_head 前还有一组
      hc_head_*，V4.1 起撤掉。残差宽度乘 4 会改掉所有逐元素算子与 norm 的形状
  decoding:
    mtp_layers: 1
precision:
  # indexer 缓存的格式由厂商公布（见下 source）；main KV 这一代还不是 FP4，格式未公布。
  # 两半可信度不同，合计因此是 mixed 口径 —— 见核查 R10
  kv_cache_components:
    indexer:
      dtype: FP4
      block: 32
      scale_dtype: FP8_E8M0
      note: OCP MXFP4，E2M1 + 每 32 通道一个 E8M0 scale，每元素 0.5 + 1/32 = 0.53125 B
    source: >-
      indexer 的格式由厂商公布，出处是后继者的技术报告：DeepSeek-V4.1-Flash 技术报告 §2.4.4
      「FP4 Main KV Cache」开篇说 "DeepSeek-V4 already uses quantization-aware training (QAT)
      for FP4 indexer queries and keys, accelerating index computation and reducing the indexer
      cache size. We adopt the OCP-standard MXFP4 format"，讲的就是本代。
      同一段接着说 "We now extend QAT to the main KV cache" —— 所以 main KV 在本代还不是 FP4，
      而本代自己的模型卡只给权重精度（FP4 + FP8 Mixed，脚注限定为「专家 FP4、其余多为 FP8」），
      不给 KV 的格式或字节数，引用块没有报告 URL，仓里也没有报告 PDF。
      不要照厂商随仓 inference/ 的 act_quant / fp4_act_quant 调用读落盘格式：那些是 inplace 伪量化
      （原 dtype 回写、scale 不返回），只给 QAT 网格（判定依据见 deepseek-v41-flash 的 R36）
    note: >-
      global_kv 不在这里：main KV 的落盘格式本代未公布，derive.py 对这一半按模型 dtype 兜底，
      所以合计字节是 mixed 口径 —— indexer 那一半有一手依据，global 那一半是占位值。
      两半不能当成同一档，合计也不能和别代的 theoretical_floor 相比
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    scale_format: ue8m0
    # **FP4 这个名字是厂商的，块格式名不是。** 模型卡下载表写「FP4 + FP8 Mixed*」，脚注
    # "MoE expert parameters use FP4 precision; most other parameters use FP8"，
    # config 的 expert_dtype 也写 "fp4"。但块格式厂商一处都没命名 —— V4.1 的技术报告
    # §2.4.4 点名 "OCP-standard MXFP4" 的是 indexer 缓存，不是权重。实测签名
    # （[1,32] + E8M0 scale）与 OCP MXFP4 同构，那是本仓的判断，不写进这个字段（见核查 R11）
    expert_dtype: FP4
    per_subsystem:
      expert: FP4
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      compressor: BF16
      indexer: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      residual: FP32
      # **draft 这一格跨两种量化元素格式，而 FP4 这个值是承重的，不能改成 MIXED。**
      # 清单实测草稿侧：I8 1152 条（打包 FP4 专家，块 [1,32]）+ F8_E4M3 10 条
      # （attn 投影与共享专家，块 [32,32]），另有 BF16 8 条与 F32 11 条未量化；
      # 还原后元素数 98.2% FP4 / 1.8% FP8_E4M3，BF16 与 FP32 各不足 0.05%。per_subsystem_block 的 '[1,32]+[128,128]' 披露的就是这两套。
      # **不记 MIXED 的原因**：derive.py 拿这一格当打包因子的声明
      # （dtypes.packing_factor），而 dtypes.BITS 里没有 MIXED 这个键 —— 实测改成 MIXED 后
      # 草稿侧参数量从 25,840,145,979 掉到 13,156,570,683（少 12,683,575,296），
      # 全模型从 1,598,839,674,782 掉到 1,586,156,099,486；而且 packing_suspect 只在
      # `sub not in logical` 时触发，填了 MIXED 等于有值但无用，少算是静默的。
      # 对照 minimax-m3.1-flash 的 draft 能记 MIXED：那边草稿侧没有打包容器。
      # **判据是「这个子系统里有没有打包的亚字节权重」，不是记法风格**（见核查 R12）
      draft: FP4
    per_subsystem_block:
      expert: '[1,32]'
      shared_expert: '[128,128]'
      attention: '[128,128]'
      indexer: '[128,128]'
      draft: '[1,32]+[128,128]'
    # **这一格的口径是落盘容器 dtype**，逐分片读头读出来的：清单里 .scale 张量的 dtype
    # 字面就是 F8_E8M0，所以容器与逻辑精度在这份权重上重合。不是从上面的 scale_format
    # ue8m0 推的 —— 那只约束取值不约束容器，V3.1 声明了 ue8m0 而 scale 张量实测仍是 FP32。
    # Kimi-K3 的同类 scale 落盘是 U8 容器（config 的 scale_dtype 就写 torch.uint8），
    # 与这里的 FP8_E8M0 是厂商存法之差，不是口径之差（见核查 R11）
    per_subsystem_scale:
      expert: FP8_E8M0
      shared_expert: FP8_E8M0
      attention: FP8_E8M0
      indexer: FP8_E8M0
      draft: FP8_E8M0
    subsystem_method: >-
      早先按抽样填（每个子系统 6 个代表张量，读 14 个分片头）。已用完整清单按 lib/subsystems.py（mtp_from=61）按元素数复核
      （I8 按 FP4 ×2 还原、不计 scale）：代表值都不变；indexer 75.3% FP8_E4M3 / 24.7% BF16（indexer.compressor 与 weights_proj 未量化）、
      router 98.6% BF16 / 1.4% I64（tid2eid）、compressor 99.7% BF16、draft 98.2% FP4 / 1.8% FP8
