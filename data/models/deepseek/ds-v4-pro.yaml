  finding: >-
    混是真的，**但不能改成 MIXED —— 这一格是承重的。** 清单实测草稿侧 I8 1152 条
    （打包 FP4 专家，块 [1,32]）+ F8_E4M3 10 条（attn 投影与共享专家，块 [32,32]）
    + BF16 8 条 + F32 11 条，还原后元素数 98.2% FP4 / 1.8% FP8_E4M3，BF16 与 FP32 各不足 0.05%。
    derive.py 把这一格当打包因子的声明（dtypes.packing_factor），而 dtypes.BITS 里没有
    MIXED 这个键：实测改成 MIXED 后草稿侧参数量从 25,840,145,979 掉到 13,156,570,683，
    少 12,683,575,296；全模型从 1,598,839,674,782 掉到 1,586,156,099,486。
    **而且不会报警** —— packing_suspect 只在 `sub not in logical` 时触发，填了 MIXED
    等于这一格有值但无用，少算是静默的。
    minimax-m3.1-flash 的 draft 能记 MIXED，是因为那边草稿侧没有打包容器
    （35 条 U8 全是 weight_scale_inv，counts_as_param 为 False）。
    **所以判据是「这个子系统里有没有打包的亚字节权重」，不是记法风格。**
    全仓带 '+' 的格子普查过（14 格）：真正跨两种**量化**元素格式的是 V4 一代五份的
    draft（deepseek-v41-flash + ds-v4-flash / -dspark / -vision-exp / ds-v4-pro），
    不是一处；其余那些桶内虽有多种 dtype，但量化过的只有一种元素格式、
    剩下的是未量化的 norm 与投影，那几格不动
  resolution: confirmed
  changed_to: 原值保留；per_subsystem 的 draft 上方补注释，写明逐 dtype 条数、占比、为什么不记 MIXED 与 minimax 能记 MIXED 的差别
