    FP4 两个一字节打包存放，safetensors 的 numel 是容器数，已按 per_subsystem 的逻辑精度还原；直接求和会把专家参数少算一半。
context:
  max: 1048576
  train_native: 65536
arch:
  layers: 61
  hidden: 7168
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MQA-latent
    num_heads: 128
    num_kv_heads: 1
    qk_rope_head_dim: 64
    q_lora_rank: 1536
    o_lora_rank: 1024
    o_groups: 16
    sliding_window: 128
    head_dim: 512
    sparse:
      mechanism: indexer 打分取 topk 后在选中 token 上做全注意力。只在 30 / 61 层上有 indexer —— 权重里的规律是 indexer 存在 ⟺
        compress_ratios[l] == 4，零例外。这一代没有独立的 indexer.wk，index K 由 attn.indexer.compressor.wkv 产出
      index_n_heads: 64
      index_head_dim: 128
      index_topk: 1024
      index_kv_dim: 64
      index_kv_source: layers.N.attn.indexer.compressor.wkv.weight 输出维 256，但 indexer.compressor.ape
        是 [4, 256] —— 4 个 token 共用一个 256 维条目，每 token 实为 64 元素。index_kv_dim 记的是每 token 值，不是条目宽度
    kv_sharing:
      compress_ratios:
