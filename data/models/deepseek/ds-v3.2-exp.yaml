  reviewer: 一个只读核查代理找候选，本会话在 facts/ 上逐条复算后写入
  method: >-
    核查代理按 .claude/skills/model-audit 的顺序过完整清单（92425 条目）、config、repoinfo 与 derived，给出候选与复现片段。
