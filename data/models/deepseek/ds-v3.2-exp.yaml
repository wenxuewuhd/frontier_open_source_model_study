    7 种 × 62 层）、indexer.wk / kv_a_proj_with_mqa 的层号（0–61）、scale 条目与真权重张量数及 dtype 构成、HF tally 按 dtype
    拆开的口径、e_score_correction_bias 层号（3–61）、按元素数的逐子系统精度。代理另指出本会话在 ds-v2 / v3 / v3.1 里把
    glm-5.3 的「42.7 倍」照抄成了 128 头的倍数（应为 85.3），已在那三份里单独改正。
