lineage:
  track: main
  predecessor: ds-v3.1
  successor: ds-v3.2
  changed_from_predecessor:
  - axis: attention
    text: 首次引入稀疏注意力 indexer（DSA）：每层新增 indexer.wk / wq_b / k_norm / weights_proj，64 个 index 头 × 128
      维，topk 2048。注意力第一次变成两段式 —— 先打分选 token，再在选中的上面做全注意力
    benefit: 长上下文下注意力从 O(L²) 降到 O(L·topk)。但 topk 2048 要到 128K 以上才真正省，短序列反而是净亏 —— 多一条打分 + topk + gather
      的旁路，indexer 自己还要一份缓存
  - axis: precision
    text: layernorm 权重由 BF16 变成 FP32。抽样读到的第 0–8 层里，input_layernorm 与 post_attention_layernorm 全部是
      F32，而 V3.1 的同名张量全部是 BF16；第 9–60 层未抽到，不能断言「全部层」。config 没有这个信息，张量名也与 V3.1 逐个相同 —— 只有 dtype 看得出来
    benefit: 稀疏注意力把注意力拆成打分、选块、稠密三段，中间结果的数值范围比原来宽，norm 用 FP32 权重更稳（这一步是推断，公开材料没有说明动机）。对实现的影响是实测到的那些层上
      RMSNorm 变成混合精度算子：FP32 权重配 BF16 激活。按「norm 权重与激活同 dtype」写的核会直接读错
params:
  counting_note: 本记录未取权重清单（facts 下只有张量名、没有形状与 dtype），所以不报参数量。DeepSeek 自 V3 起以 FP8 块量化发布、V4 起路由专家再降到
    FP4 两个一字节打包，按 safetensors 的 numel 直接求和会把参数量少算一半 —— 没有 dtype 就没有可信总量。要出总量需用 scripts/fetch_hf.py
    不带 --names-only 重取。
context:
  max: 163840
  train_native: 4096
arch:
  layers: 61
  hidden: 7168
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MLA
    num_heads: 128
    num_kv_heads: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim: 192
    sparse:
      mechanism: indexer 逐 token 打分后取 topk，再在选中的 token 上做全注意力。indexer 自带 wk / wq_b / k_norm / weights_proj，每层都有，K
        独立产出
      index_n_heads: 64
      index_head_dim: 128
      index_topk: 2048
  ffn:
    type: moe
  moe:
    routed_experts: 256
    top_k: 8
    shared_experts: 1
    intermediate: 2048
    first_k_dense: 3
    expert_groups: 8
    routing: sigmoid 打分 / noaux_tc 选路
  decoding:
    mtp_layers: 1
precision:
  quantization:
    method: fp8
    activation_scheme: dynamic
    weight_block_size:
    - 128
    - 128
    weight_format: e4m3
    scale_format: ue8m0
    per_subsystem:
      expert: FP8_E4M3
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      dense_ffn: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: FP32
      draft: FP8_E4M3
    per_subsystem_scale:
      expert: FP32
      shared_expert: FP32
      attention: FP32
      dense_ffn: FP32
      draft: FP32
    subsystem_method: 抽样：每个子系统 6 个代表张量，共读 10 个分片头
    per_subsystem_block:
      expert: '[128,128]'
      shared_expert: '[128,128]'
      attention: '[128,128] / [128ceil,128]'
      dense_ffn: '[128,128]'
      draft: '[128,128] / [128ceil,128]'
infra_signals:
- text: 稀疏注意力把单个 FA 算子拆成「indexer 打分 → topk → gather → 稠密 FA」四段，每段的形状都随 topk 变。这条旁路在 V4、V4.1 又各改一次
