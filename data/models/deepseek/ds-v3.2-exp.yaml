lineage:
  track: main
  predecessor: ds-v3.1
  successor: ds-v4-flash
  changed_from_predecessor:
  - axis: attention
    text: >-
      首次引入稀疏注意力 indexer（DSA）：第 0–60 层与 MTP 块 layers.61 共 62 层，每层新增 7 个条目 ——
      indexer.wq_b [8192, 1536] 与 wk [128, 7168]（FP8，各带 weight_scale_inv）、k_norm.weight 与 k_norm.bias [128]（F32）、
      weights_proj [64, 7168]（BF16），共 434 个。64 个 index 头 × 128 维（wq_b 的输入 1536 是 q_lora_rank，
      index query 复用 q_a 的 latent），topk 2048。注意力第一次变成两段式 —— 先打分选 token，再在选中的上面做全注意力
    benefit: >-
      长上下文下主注意力从 O(L²) 降到 O(L·topk)；indexer 打分本身仍是 O(L²)（每个 query 对全部历史打分，只是常数小：
      64 头 × 128 维、FP8）。L ≤ topk 2048 时选 token 不省任何主注意力计算，只多一条打分 + topk + gather 的旁路，
      indexer 自己还要一份缓存。从多长开始净省取决于两段的实际开销，本仓没有测过
  - axis: precision
    text: >-
      归一化权重由 BF16 变成 FP32，完整清单上是全部层：与 ds-v3 的完整清单（V3.1 与 V3 张量名逐个相同、config 同形）比，
      同名张量里恰有 252 个变了，全部是 BF16 → F32、形状不变 —— input_layernorm / post_attention_layernorm /
      q_a_layernorm / kv_a_layernorm 各 62 个（第 0–61 层，含 MTP 块）+ model.norm + MTP 的 enorm / hnorm / shared_head.norm。
      新增的 indexer.k_norm 也是 F32。config 没有这个信息，这 252 个张量名也与前代相同 —— 只有 dtype 看得出来
    benefit: 稀疏注意力把注意力拆成打分、选块、稠密三段，中间结果的数值范围比原来宽，norm 用 FP32 权重更稳（这一步是推断，公开材料没有说明动机）。对实现的影响是全部层上
      RMSNorm 变成混合精度算子：FP32 权重配 BF16 激活。按「norm 权重与激活同 dtype」写的核会直接读错
