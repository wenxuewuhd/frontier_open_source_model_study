params:
  counting_note: 本记录未取权重清单（facts 下只有张量名、没有形状与 dtype），所以不报参数量。DeepSeek 自 V3 起以 FP8 块量化发布、V4 起路由专家再降到
    FP4 两个一字节打包，按 safetensors 的 numel 直接求和会把参数量少算一半 —— 没有 dtype 就没有可信总量。要出总量需用 scripts/fetch_hf.py
    不带 --names-only 重取。
context:
  max: 1048576
  train_native: 65536
  extension_method: yarn, factor 16
arch:
  layers: 40
  hidden: 5120
  vocab: 129280
  norm: RMSNorm
  norm_eps: 1.0e-20
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MQA-latent
    num_heads: 64
    num_kv_heads: 1
    qk_rope_head_dim: 64
    q_lora_rank: 1280
    o_lora_rank: 1024
    o_groups: 8
    sliding_window: 128
    head_dim: 512
    sparse:
      mechanism: indexer 打分选块，再在选中的块上做全注意力。产出 index K 的只有 4 层（有 indexer.wk 权重），另 4 层只复用已有 K 重新打分 ——
        与 deepseek-v41-flash 同，详见该记录
      index_n_heads: 32
      index_head_dim: 128
      index_topk: 512
      candidate_source_layer: 20
      candidate_topk_blocks: 2048
      candidate_block_size: 8
    kv_sharing:
      source_layers:
      - 2
      - 8
      - 14
      - 20
      index_kv_source_layers:
      - 2
      - 8
      - 14
      - 20
      index_rescore_layers:
      - 24
      - 28
      - 32
      - 36
      compress_ratios:
      - 0
