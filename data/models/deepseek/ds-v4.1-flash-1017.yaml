notes: V4.1-Flash 的日期版。架构零差异，算子表可直接套用旗舰那份。
open_questions:
- >-
  precision.kv_cache 的三个分量格式沿用旗舰那份参考实现读取（deepseek-v41-flash 核查 R21），
  未经原始 kernel 或显存实测确认。按它算的 890 B/token、1M 下 0.87 GiB 是理论下限，不是部署占用
- >-
  理论下限与实际部署的缺口只有旗舰记录里的一个数据点（核查 R31：一套部署栈 1224 B/token，下限的 1.38 倍），
  本版没有单独测过；同一份代码路径下应当相同，但没有数
