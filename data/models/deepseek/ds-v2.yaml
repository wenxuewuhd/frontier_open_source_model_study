lineage:
  track: historical
  successor: ds-v3
  changed_from_predecessor:
  - axis: attention
    text: 家族首次用 MLA：KV 压到 512 维 latent（kv_a_proj_with_mqa 下投影 + kv_b_proj 上投影），128 头，head_dim 192
      = nope 128 + rope 64
    benefit: KV 缓存每层每 token 从 MHA 的 40960 个元素（K 128×192 + V 128×128）压到 576 个（latent 512 + 解耦 RoPE
      64），约 71 倍。代价在算力侧：参考实现每步用 kv_b_proj 把 latent 升回 128 头（也可以把它吸收进 Q 与 O 两侧、不显式复原，
      取决于实现，本仓未读实现）。TP 下 kv_b_proj [32768, 512] 按头切（32768 = 128 头 × (nope 128 + v 128)），
      不能按头切的是 latent 缓存本身 —— 576 维只有一份，每个 TP rank 都要存全量
  - axis: moe
    text: 160 路由专家 + 2 共享，top-6，专家分 8 组取 3 组（group_limited_greedy），softmax 打分
    benefit: group-limited routing 约束的是目的地设备数的上界：不分组时一个 token 最多落到 min(top_k 6, n_group 8) = 6 组，分组后最多
      topk_group = 3 组，2 倍。载荷字节数不变 —— 每 token 的 all-to-all 量 = 2·top_k·hidden·bytes，与分组无关（59 个 MoE
      层、BF16 下恒为 7.25 MB/token）。省的是连接数与同步面，不是带宽。共享专家承接通用能力，省得每个路由专家都学一遍
  - axis: precision
    text: BF16 直接发布，config 里没有 quantization_config
    benefit: 不量化，部署最简单，但权重带宽按 BF16 全额付 —— 这是后面几代持续压缩的起点
  - axis: context
    text: 163840，YaRN 自 4096 原生长度外推 40 倍
    benefit: 不重训就把 4K 原生长度外推 40 倍。代价是外推段质量和 mscale 调参强相关，上游随后的 V2.5 刷新改的正是这个参数（零结构差异，本仓不单独立记录）
params:
  total: 235741000000.0
  breakdown:
    expert: 222718000000.0
    attention: 8953530000.0
    shared_expert: 2783970000.0
    embed: 524288000.0
    lm_head: 524288000.0
    dense_ffn: 188744000.0
    router: 48332800.0
    norm: 742400.0
  counting_note: >-
    total 与 breakdown 都是本仓按完整权重清单逐项求和的实测值（取 6 位有效数字），不是厂商声明值 ——
    所以 Gate B 的参数总量一项（delta 0.0）是拿实测比实测，不构成核对；真正的外部核对是 HF 的
    safetensors tally，与实测 235,741,434,880 逐位相同。清单 29102 个条目全是 BF16 权重张量：
    这一版没有量化 scale 容器、没有低位打包，条目数即张量数、numel 即参数数。
    V2 没有 MTP 草稿块（config 无 num_nextn_predict_layers，清单层号止于 59），所以没有 excludes。
    权重存储 439.1 GiB。激活参数两个口径见 data/derived/：带宽口径 20.85B、含输入词表 21.38B
context:
  max: 163840
  train_native: 4096
arch:
  layers: 60
  hidden: 5120
  vocab: 102400
  norm: RMSNorm
  norm_eps: 1.0e-06
  activation: SwiGLU（hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 10000 + YaRN 外推
  attention:
    type: MLA
    num_heads: 128
    num_kv_heads: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim: 192
    v_head_dim: 128
    head_dim_note: num_kv_heads 128 是 query 侧可见的 KV 头数，不是缓存宽度：落盘缓存是 kv_a_proj_with_mqa [576, 5120] 的
      576 维（latent 512 + rope 64），按 2 × 128 × 192 = 49152 折算会高估 85.3 倍。head_dim 192 不是 config 字段，
      是 qk_nope 128 + qk_rope 64，只适用于 QK 路径。V 的每头维度是 v_head_dim 128，所以 o_proj
      入口宽度是 128 头 × 128 = 16384（权重实测 [hidden, 16384]），不是 128 × 192 = 24576。按单一 head_dim 推 o_proj 会高
      50%
  ffn:
    type: moe
    layer_pattern: 第 0 层稠密（intermediate 12288），其余 59 层为 MoE。稠密层的 FFN 中间维是单个专家（1536）的 8 倍
  moe:
    routed_experts: 160
    top_k: 6
    shared_experts: 2
    intermediate: 1536
    first_k_dense: 1
    expert_groups: 8
    routing: softmax 打分 / group_limited_greedy 选路
    storage_note: 逐专家独立张量，不是堆叠。grouped GEMM 因此吃 2 维权重列表而非 3 维张量，EP 切分是切张量列表
    balance: 辅助损失（aux_loss_alpha 0.001，seq_aux）
    dense_intermediate: 12288
infra_signals:
- text: MLA 的 kv_b_proj 让 KV 缓存只存 576 维（latent 512 + rope 64），代价是上投影的算力（或吸收进 Q/O 后的等价开销）——
    算子上是「省带宽换算力」。kv_b_proj 在 V3.2 / V3.2-Exp 的清单里仍在（各 124 个），V4 起零命中，这个结构在 V4 被去掉
