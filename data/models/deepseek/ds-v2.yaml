    gate/up [12288, 5120] 的 62,914,560；lm_head [102400, 5120] 是 524,288,000。按输出维比也不成立
    （kv_b_proj 32768、q_b_proj 24576 都大于 12288）。另「第 0–0 层」应为第 0 层
  resolution: corrected
  changed_to: 删掉「最宽 GEMM」，只留中间维是单个专家的 8 倍
