review:
- id: R1
  field: lineage.changed_from_predecessor
  severity: wrong
  claim: MLA 的代价是「每步要做一次上投影复原 KV …… 而且上投影在 TP 下不能跟着 KV 切，要全量复制」
  finding: >-
    方向反了。kv_b_proj [32768, 512] 是逐头的（32768 = 128 头 × (qk_nope 128 + v 128)），TP 下按头切；
    不能按头切的是 latent 缓存本身 —— 576 维只有一份，每个 TP rank 都存全量。「每步复原」也只对参考实现的写法成立，
    把 kv_b_proj 吸收进 Q 与 O 两侧时不显式复原，本仓没有读过实现，不能写成定论
  resolution: corrected
  changed_to: 改为「kv_b_proj 按头切、latent 缓存每个 TP rank 存全量」，复原与否注明取决于实现
