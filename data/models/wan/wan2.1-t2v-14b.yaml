reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  method: >-
    Gate B 三路：config.json（12 个字段）、权重清单（6 分片 1,095 张量）与
    模型卡的结构表逐项对读，厂商参考实现 wan_t2v_14B.py 作第四路。
    结构字段四路一致：dim 5120 / ffn 13824 / heads 40 / layers 40 / in 16 / out 16
    / freq 256 这七项在卡的表、config、参考实现三处逐字相同，
    其中 in/out 16 与 patch (1,2,2) 另在 `patch_embedding.weight`
    [5120,16,1,2,2] 与 `head.head.weight` [64,5120] 里实测到。
    外部对账：HF 自己的 safetensors tally 14,288,491,584 与本仓实测**逐位相同**。
    字节对账：实测 numel × 4 B 与六个分片的 HTTP Content-Length 差 111,056 B（= 头）。
    卡上那句「adaLN 的 MLP 全层共用、逐层只学偏置」用参数量复核过
    （157,317,120 + 40×30,720 = adaln 桶的全部）。
    Gate C：判断类字段逐条在 evidence 里标了 judgement 或 derived。

review:
  - id: R1
    field: params.total
    severity: imprecise
    claim: 「Wan2.1-T2V-14B 是 14B 模型」
    finding: >-
      14B 说的是 DiT，而且这一代连「按 BF16 驻留」都做不到。
      一次推理要驻留三套权重共 64.28 GiB，其中 DiT 自己就是 53.23 GiB，
      因为发布格式是 F32 而参考实现只用 autocast 降计算精度、不转参数。
      按字节总量是 DiT 单独的 1.21 倍
    resolution: corrected
    changed_to: >-
      params.total 只填 DiT 并在 counting_note 写明排除了什么、为什么；
      另外两块的规模进 generation.vae 与 generation.text_encoders；
      bottlenecks 里单列一条 host-io，并写明「没有转精度的开关」这一半
  - id: R2
    field: generation.constraints.width_divisor
    severity: unsupported
    claim: 宽高必须被 16 整除
    finding: >-
      厂商没有断言过整除性。参考实现只拿 `SUPPORTED_SIZES` 做白名单
      （四个档都被 16 整除），而 `size[1] // vae_stride[1]` 是地板除 ——
      传一个不整除的尺寸会**静默截断**，不报错也不拒绝。
      所以 16 是「VAE 8 × patch 2」推出来的有效压缩率，
      不是一条厂商声明的约束
    resolution: confirmed
    changed_to: >-
      保留 16，但在 constraints.note 写明它是推出来的、厂商的实际机制是白名单，
      并指出地板除会静默截断。evidence 标 derived 而不是 official
  - id: R3
    field: generation.vae
    severity: unsupported
    claim: VAE 的压缩率与通道数有官方依据
    finding: >-
      模型卡对 VAE 只有定性描述（3D causal VAE、能编解码任意长度 1080P），
      **压缩率、z_dim、层数一个数都没给**。
      4×8×8 与 z_dim 16 取自厂商参考实现（第三档来源），
      其中 16 另有权重实测佐证（in/out 投影都是 16 通道），
      压缩率的 4 另有 temperal_downsample 两次下采样佐证，
      但空间的 8 只有 `vae_stride` 一处来源
    resolution: open
    changed_to: >-
      generation.vae 整块标 derived；在 note 里逐项写清哪个数有几路佐证。
      空间压缩 8 只有一路，留一条 open question

notes: >-
  **这份是 wan 线的差分基线**，录它的价值在对侧：Wan2.2 相对它改了什么，
  在 lineage.changed_from_predecessor 里逐轴写着，每一条都能对回这份的字段。

  一条值得记的实测：Wan2.2-T2V-A14B 的两套专家，**张量名到形状的映射与这一份
  逐项相同**（1,095 个名字、形状与 dtype 全同），两边的 config 除
  `_diffusers_version` 外逐字相同。即那一代的「MoE」没有动主干形状 ——
  它是把这份主干复制成两套、按去噪时间步整体换入换出。
  同族系跨版本比张量名集合是本仓最省力的判据（见 model-audit skill 的取数顺序 1），
  这次它直接回答了「A14B 的专家是不是改过结构」。

  字节对账（三块相加对 usedStorage）：
  DiT 57,154,077,392（六分片 HTTP 实际大小）+ VAE 507,609,880
  + T5 11,361,920,418 + tokenizer 21,454,081 + 其余小文件 6,342,999
  = 69,051,934,770 B，与 HF tree API 逐文件求和一致。
  而 HF 的 usedStorage 是 149,464,228,510 B，**差 80,412,293,740 B** ——
  仓里有三个相邻的 `init upload` 提交（2025-02-25 的 07:59、12:58、16:22），
  旧修订版的 LFS 对象仍计进 usedStorage。
  所以 usedStorage 在这条线上**不是**「当前修订版的权重总字节」，
  这是 ti2v-5b 那份记下的同一个坑（差额在那边约等于一份 DiT）在本份的复现。
  这里的差额不是某一个文件的整数倍，所以**没有逐项拆解它**，
  只确认它的方向与成因；要拆得准得逐修订版列 LFS 对象，那是另一轮取数。

  取数提醒：这个仓是视频线里最规整的两个之一（顶层 config.json 只含 DiT 的
  12 个字段、1 个 index、6 个分片），不需要 `--include`。
  HF 还给了它的 safetensors tally，视频线里目前只有这一份有这个外部锚 ——
  同族的 T2V-A14B 那个仓，HF 自己也没算出 tally。

