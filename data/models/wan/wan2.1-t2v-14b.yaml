    读头拿不到清单，dtype 也没声明。本份连 decoder_arch 都是从参考实现的类定义
    读出来的（conv3d），不是实测。参考实现的默认 cfg（dim 96、dim_mult [1,2,4,4]、
    num_res_blocks 2）给了算参数量的全部输入，但那是**按代码默认值算**不是实测，
    而仓里 507,609,880 B 这个文件大小在 dtype 未知时无法反推元素数去校验
  - >-
    VAE 的空间压缩 8 只有 `vae_stride` 一处来源（见 R3）。
    时间的 4 有 temperal_downsample 佐证、通道的 16 有权重佐证，空间的 8 没有。
    要钉死得数 `Decoder3d` 的 Resample 层，那要先能读 pickle
  - >-
    umT5-XXL 的层数与头数不知道：仓里只放了 tokenizer 四件套，没有它的 config。
    params 5,680,960,209 是按文件大小 ÷ 2 推的，不是实测
  - >-
    训练精度无一手来源。发布权重全 F32 是实测，`shared_config.param_dtype`
    是 bfloat16 也是实测，但那两个说的都是推理侧，不是训练格式
  - >-
    单卡峰值显存与端到端耗时只在卡的 `assets/comp_effic.png` 图里，
    正文没有数字。图没有解析，所以 performance 一项没填 ——
