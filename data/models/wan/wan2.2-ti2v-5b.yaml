reviewed:
  date: '2026-10-30'
  method: >-
    Gate B 双路：config.json（12 个字段）与权重清单（3 分片 825 张量）逐项对读，
    再与厂商参考实现 wan_ti2v_5B.py 第三路交叉。
    结构字段三路一致：patch (1,2,2) 既在 patch_embedding.weight 的后三维里、
    也在参考实现里；dim/ffn/heads/layers 四项 config 与参考实现逐字相同；
    qk_norm 与 cross_attn_norm 两个布尔在清单里有对应张量。
    字节对账：实测 numel × 4 B 与三个分片的 HTTP Content-Length 差 83,536 B（= 头）。
    Gate C：判断类字段 7 处，逐条在 evidence 里标了 judgement 或 derived。

review:
  - id: R1
    field: params.total
    severity: imprecise
    claim: 「Wan2.2-TI2V-5B 是 5B 模型」
    finding: >-
      5B 说的是 DiT。一次推理要驻留三套权重，按参数 DiT 5.0B、
      文本编码器 umT5-XXL 约 5.68B（**比 DiT 还大**）、VAE 未知。
      按字节 34,179,904,370 B，是 DiT 单独的 1.71 倍。
      这不是厂商说错，是「模型大小」这个说法在生成类系统上本来就不完整
    resolution: corrected
    changed_to: >-
      params.total 只填 DiT 并在 counting_note 写明排除了什么、为什么；
      另外两块的规模进 generation.vae 与 generation.text_encoders；
      bottlenecks 里单列一条 memory
  - id: R2
    field: generation.vae.params
    severity: missing
    claim: VAE 的参数量应该能填
    finding: >-
      填不了。`Wan2.2_VAE.pth` 是 pickle 不是 safetensors，读头拿不到清单；
      文件大小 2,818,839,170 B 知道，但**dtype 未声明**，
      所以连「字节 ÷ 每元素字节」这条退路也没有。
      文本编码器那边能推是因为文件名自称 `bf16`，VAE 没有这个线索。
      **这是整条视频线的通例不是例外**：DiT 在 safetensors 里，
      VAE 与文本编码器往往是 .pth
    resolution: open
    changed_to: >-
      留空并在 note 写明是哪一种空（读不了清单，不是没查）。
      要填只能下载整包反序列化，而那是 pickle，代价与风险都不小
  - id: R3
    field: generation.sampling
    severity: unsupported
    claim: 步数 50、CFG 5.0、帧数 121 有官方依据
    finding: >-
      模型卡这三项**一个都没写**，全部取自厂商参考实现
      `wan/configs/wan_ti2v_5B.py`，是来源优先级的第三档。
      本仓规则说参考实现可能是 demo 而非部署口径。
      但这一份的参考实现在**结构字段上与权重清单逐项对上了**
      （patch、dim、ffn、heads、layers、qk_norm、cross_attn_norm 七项），
      所以它至少不是凭空写的
    resolution: confirmed
    changed_to: >-
      保留，但在 sources 里标明档位、在 sampling.note 写明「模型卡两者都没写」。
      若后续出技术报告，这三项要按报告重核

notes: >-
  **本仓第一份生成类记录，几个口径在这里定下。**

  字节对账（三块相加对 usedStorage）：
  DiT 19,999,234,384 + VAE 2,818,839,170 + T5 11,361,920,418 + tokenizer 21,454,081
  + 其余小文件 1,406,444 = 34,203,123,497 B，
  而 HF 的 usedStorage 是 54,202,656,185 B，**差 19,999,532,688 B**。
  这个差额与 DiT 三分片的大小（19,999,234,384 B）只差 298,304 B ——
  即 usedStorage 多算了约一份 DiT。仓有 8 个提交，其中两次是
  `Upload folder using huggingface_hub`（2025-07-24 与 2025-07-27），
  **旧修订版的 LFS 对象仍计进 usedStorage**。
  所以 usedStorage 在这条线上**不是**「当前修订版的权重总字节」，
  不能直接拿来对账 —— 要逐文件取 HTTP 大小。

  取数提醒：这个仓有顶层 config.json（只含 DiT 的 12 个字段）、一个 index、
  3 个分片，是视频线里最规整的一个。
  同族 ltx-2 / ltx-2.3 要带 `--include` 才能取，见 tracking.yaml 的 note。

open_questions:
  - >-
    VAE 的参数量、层数与解码器形态都不知道（见 R2）。`Wan2.2_VAE.pth` 是 pickle，
    读头拿不到清单，dtype 也没声明。这会影响「VAE decode 是不是边角料」这个判断 ——
    同族 MiniMax-H3 的解码器是 36 层 Transformer（5.2B），那就完全不是边角料了
  - >-
    umT5-XXL 的层数与头数不知道：仓里只放了 tokenizer 四件套，没有它的 config。
    params 5,680,960,209 是按文件大小 ÷ 2 推的，不是实测
  - >-
    模型卡那句「单张 4090 生成 5 秒 720P under 9 minutes」没给步数与精度，
    **不能当性能基准**。若按本记录的 50 步 × 2 次前向，那是 100 次 5B F32 前向，
    9 分钟意味着每次前向 5.4 秒 —— 量级上说得通，但没有一手依据，没有写进 performance
  - >-
    训练精度无一手来源。发布权重全 F32 是实测，但那说的是落盘格式不是训练格式
