# 机械字段来自 config（official）；注意力几何、层集合、参数量与子系统拆分来自完整权重清单（derived）。
# 这一份是支线，收录理由是结构对照：MLA 第一次进入 GLM 家族就在这里。
id: glm-4.7-flash
family: glm
kind: llm
display_name: GLM-4.7-Flash
released: '2026-01-19'
license: mit
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/zai-org/GLM-4.7-Flash
    locator: config.json @ 7dd20894a642
    accessed: '2026-10-30'
    note: >-
      BF16 发布，48 分片。权重清单逐分片读头取全，9703 个张量，无读失败分片。
      model_type 是 glm4_moe_lite，不是主干旗舰的 glm4_moe —— 换了架构，不是档位缩小
  - kind: modelcard
    url: https://huggingface.co/zai-org/GLM-4.7-Flash/blob/7dd20894a642a0aa287e9827cb1a1f7f91386b67/README.md
    locator: README.md 第 27 行（"a 30B-A3B MoE model"）、第 18 行（技术报告指向 GLM-4.5 的 arXiv 2508.06471）
    accessed: '2026-10-30'
    note: >-
      卡正文（8156 字节 / 172 行）。第 27 行是厂商的参数量声明；
      全文搜 kv.?cache / per-token byte / cache size|capacity|memory|footprint 命中 0，
      **没有每 token KV 字节**，也没有训练精度。
