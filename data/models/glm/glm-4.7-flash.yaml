hf:
  repo: zai-org/GLM-4.7-Flash
  sha: 7dd20894a642a0aa287e9827cb1a1f7f91386b67
  last_modified: '2026-01-29T08:06:19.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: side
  predecessor: glm-4.7
  changed_from_predecessor:
    - axis: attention
      text: >-
        **MLA 第一次进入 GLM 家族**：GQA（96 头 / 8 KV 头 / head_dim 128）换成
        MLA（kv_lora_rank 512 + qk_rope_head_dim 64），落盘缓存是
        kv_a_proj_with_mqa [576, 2048] 的 576 维 latent。上投影 kv_b_proj [8960, 512]
        把 latent 升回 20 头，8960 = 20 × (K-nope 192 + V 256)；
        K 的 rope 64 维由 kv_a_proj_with_mqa 的尾段直接产出、不经 kv_b_proj。
        Q 侧也走两段（q_a_proj [768, 2048] + q_b_proj [5120, 768]，5120 = 20 × 256，
        其中 256 = qk_nope 192 + qk_rope 64 —— **本代 config 没有 qk_head_dim 这个键**，
        那是 GLM-5 一代才有的，这里是自己加出来的）。
        QK-Norm 去掉了，换成 MLA 自己的 kv_a_layernorm [512] 与 q_a_layernorm [768]；
        q/k/v 的 bias 也一并去掉（config attention_bias true → false，
        清单里 9703 条一个 .bias 都没有）；partial_rotary_factor 从 0.5 变成 1.0
      benefit: >-
        每层缓存从 2 × 8 × 128 = 2048 元素压到 576，**3.56 倍**；
        本档只有 47 主干层，所以每 token 从（按主干 92 层算的）188416 元素降到 27072，
        6.96 倍。代价是算力：每步要用 kv_b_proj 把 512 维 latent 升回
        20 × 448 = 8960 维（或把它吸收进 Q 与 O 两侧、不显式复原，取决于实现，本仓未读实现）。
        TP 下 kv_b_proj 按头切（8960 = 20 头 × 448），不能按头切的是 latent 缓存本身 ——
        576 维只有一份，每个 TP rank 都要存全量。
        **注意 config 的 num_kv_heads=20 是 query 侧可见的头数，不是缓存宽度**：
        按 2 × 20 × 256 折算得 10240，对实际 576 是 17.8 倍高估
    - axis: moe
      text: >-
        160 专家 top-8 → 64 专家 top-4，专家中间维仍 1536；稠密层从 3 层变 1 层
        （first_k_dense_replace 3 → 1），稠密中间维 12288 → 10240。
        config 第一次显式声明 topk_method=noaux_tc，routed_scaling_factor 2.5 → 1.8
      benefit: >-
        带宽口径激活参数 32,856,319,904 → 3,579,571,840 是 **9.18 倍**，
        但 top_k 8 → 4 只占其中 2 倍，不能把整个降幅挂在它旁边。逐因子拆：
        专家那一半 expert_active 16,798,187,520 → 1,736,441,856 = **9.67 倍**
        = 单层激活专家 5.0 倍（top_k 2 倍 × hidden 2.5 倍）× 主干 MoE 层数 89/46 = 1.935 倍；
        常驻那一半 always_active 16,058,132,384 → 1,843,129,984 = **8.71 倍**。
        两半合起来才是 9.18 倍 —— 专家与常驻两侧的降幅不同，所以总比值既不是 9.67 也不是 8.71。
        EP 侧每 token 每 MoE 层 2 × top_k 4 × hidden 2048 × 2 B = 32,768 B，
        46 个主干 MoE 层合计 1,507,328 B/token，是主干旗舰（14,581,760 B）的 1/9.7。
        topk_method 从「config 不声明、只能从 e_score_correction_bias 推」
        变成显式写明，是口径上的收益：GLM-4.5–4.7 三代的打分方式一直没有一手来源
    - axis: scale
      text: >-
        358B → 31.2B（总参数 1/11.5），层数 92 → 47、hidden 5120 → 2048、
        词表 151552 → 154880
      benefit: >-
        这是「小档位」的部分，但它和前代不是同一个架构（model_type glm4_moe_lite
        vs glm4_moe），所以本仓按支线收录的理由是结构对照而不是档位：
        它是 GLM 线上第一份 MLA 记录，而 GLM-5 的 MLA 几何（kv_lora 512 /
        rope 64 / v_head_dim 256 / 两段式 Q）与词表 154880 全部沿用自这里
    - axis: context
      text: 202752（与 GLM-4.7 相同），rope base 仍 1,000,000
      benefit: >-
        上下文没变而每 token 缓存降到 1/6.96，所以同样 202752 的上下文下
        KV 从 71.16 GiB 降到 10.2 GiB（都是 BF16 兜底口径，同一套 basis，可比）

params:
  # 厂商声明值（模型卡第 27 行 "30B-A3B"）。breakdown 是清单实测，见 counting_note。
  total: 30000000000.0
  excludes:
    - draft
  breakdown:
    expert: 27783069696.0
    draft: 1278094656.0
    attention: 1022623744.0
    shared_expert: 434110464.0
    embed: 317194240.0
    lm_head: 317194240.0
    dense_ffn: 62914560.0
    router: 6032256.0
    norm: 254720.0
  counting_note: >-
    按完整权重清单（48 分片 9703 条目）逐项求和，与 HF 平台自己从分片头统计的
    safetensors tally（31,221,488,576）逐位相同。清单 dtype 只有 BF16（9656）与
    F32（e_score_correction_bias [64]，清单里 47 份、共 3,008 元素 ——
    主干 46 个 MoE 层各一份加 MTP 块一份），
    没有量化 scale 容器、没有低位打包，条目数即张量数、numel 即参数数。
    **total 是厂商声明值，不是实测值**：模型卡（README.md @ 7dd20894a642 第 27 行）写
    「GLM-4.7-Flash is a 30B-A3B MoE model」。
    清单实测 31,221,488,576，比声明高 **+4.072%，超出 Gate B 的 2% 容差**；
    **扣掉 draft（第 47 层整块 1,278,094,656）后是 29,943,393,920，对声明的 30B 是
    −0.189%** —— 所以 excludes 填 [draft]。
    本份是这个「声明值不含 MTP 块」口径最硬的一个判例：不扣就超容差、扣了就几乎逐位，
    而同口径在 glm-5（−0.012%）与 glm-4.5（−0.620%）上同时成立。
    **激活那一半对不上，照实记**：名字里的 A3B 即声明激活 3B，而本仓带宽口径
    3,579,571,840 对它是 +19.3%、带宽口径再扣 lm_head 的 3,262,377,600 是 +8.7% ——
    两套口径都差得远。glm-4.5 / glm-5 的 active 声明值都能对到千分之几
    （见那两份的 counting_note），本份对不上，所以「A3B」更像档位命名的取整
    而不是参数量声明。本记录因此**不填** active_decode / active_prefill，
    也不把 3B 当可对账的声明值。
    draft 一项是第 47 层整块（1,278,094,656），按层索引归类；主干是 0–46，total 含草稿侧。
    逐因子核过：注意力 21,757,952/层 = q_a 768×2048 + q_b 5120×768 + kv_a 576×2048
    + kv_b 8960×512 + o 2048×5120，× 47 主干层 = 1,022,623,744；
    专家 603,979,776/层 = 64 × 3 × 1536×2048，× 46 个主干 MoE 层（L1–L46）= 27,783,069,696；
    共享专家 9,437,184/层 × 46 = 434,110,464；稠密 FFN 1 层 × 3 × 10240×2048 = 62,914,560；
    router 46 × (64×2048 + 64) = 6,032,256。
    kv_a_layernorm [512] 与 q_a_layernorm [768] 按 subsystems.py 的优先级归在 norm 桶，
    不在 attention 桶的乘式里

context:
  max: 202752

arch:
  layers: 47
  hidden: 2048
  vocab: 154880
  norm: RMSNorm（每层 2 处：input / post_attention；另有 MLA 内的 kv_a_layernorm [512] 与 q_a_layernorm [768]）
  norm_eps: 1.0e-05
  activation: SwiGLU（hidden_act silu；gate / up / down 三张独立张量）
  position: RoPE theta 1,000,000，partial_rotary_factor 1.0（作用在解耦出来的 64 维 rope 段上，不再是前代的半维）

  attention:
    type: MLA
    num_heads: 20
    num_kv_heads: 20
    head_dim: 256
    v_head_dim: 256
    qk_rope_head_dim: 64
    qk_nope_head_dim: 192
    kv_lora_rank: 512
    q_lora_rank: 768
    head_dim_note: >-
      **config 的 num_kv_heads=20 是 query 侧可见的 KV 头数，不是缓存宽度**：
      落盘缓存是 kv_a_proj_with_mqa [576, 2048] 的 576 维 latent
      （kv_lora_rank 512 + qk_rope_head_dim 64）。
      按本家族其它记录的同一公式 2 × num_kv_heads 20 × head_dim 256 = 10240 折算，
      对实际 576 是 **17.8 倍**高估（glm-5 / glm-5.2 / glm-5.3 用同一公式得 32768、
      56.9 倍，两者可以直接比 —— 差别只来自 KV 头数 20 与 64）。
      本代 QK 全宽与 V 每头都是 256，所以这里不再有「按 QK 算还是按 V 算」两个版本。
      两个都是错算，列出来是为了说明「头数乘积当缓存宽度」这个 skill 规则 2
      点名的坑有多大，不是两套结论。
      本记录的 head_dim 256 不是 config 字段（本代 config 根本没有 qk_head_dim 这个键，
      只给 qk_nope_head_dim 192 与 qk_rope_head_dim 64），是两段相加得来的 QK 全宽，
      与 V 的每头 256 相等。
      不对称只在 kv_b_proj [8960, 512] 内部：8960 = 20 × (K-nope 192 + V 256)，
      K 的 rope 64 维由 kv_a_proj_with_mqa 的尾段直接产出、不经 kv_b_proj。
      o_proj 入口是 20 × v_head_dim 256 = 5120（权重实测 [2048, 5120]）；
      **拿 nope 段 192 去推会得 3840、低 25%** —— 这是本族系最容易犯的那一步，
      也正是本仓一度把 head_dim 填成 192 的后果（见 R12）
    kv_sharing:
      layer_coverage: >-
        **主干口径**（0–46）：47/47 层每层都有自己的 kv_a_proj_with_mqa，
        无跨层共享、无滑窗、无稀疏索引（清单里没有任何 indexer / compressor 张量，
        按全名正则穷举过）。另有 MTP 块（第 47 层）自带自己的 kv_a_proj_with_mqa，
        **也产出自己的 KV**；config 的 num_hidden_layers=47 不含它。
        所以清单里产出 KV 的层共 48 个，开 MTP 时按这个数算（+576 元素/token，+2.13%）
    layer_pattern: 47 层同构 MLA，无混合、无稀疏 —— DSA 要到 GLM-5 才加

  ffn:
    type: moe
    layer_pattern: >-
      第 0 层稠密（中间维 10240），其余 46 层为 MoE；MTP 块（第 47 层）也是 MoE。
      稠密层的 FFN 比单个专家宽 6.67 倍（10240 / 1536），单层 62,914,560 参数，
      是一层注意力 21,757,952 的 2.89 倍

  moe:
    routed_experts: 64
    shared_experts: 1
    top_k: 4
    intermediate: 1536
    first_k_dense: 1
    dense_intermediate: 10240
    routing: >-
      topk_method=noaux_tc（config 第一次显式声明）、norm_topk_prob=true、
      routed_scaling_factor 1.8。n_group=1 且 topk_group=1，分组路由未启用。
      scoring_func 这一代仍不声明（GLM-5 起才写 sigmoid）
    balance: e_score_correction_bias [64]（F32；清单里 47 份 —— 主干 46 个 MoE 层各一份加 MTP 块一份）—— 偏置纠偏、无辅助损失，与 noaux_tc 一致
    storage_note: 逐专家独立张量，不是堆叠的 3 维权重；grouped GEMM 吃 2 维张量列表，EP 切分按张量分配

  decoding:
    mtp_layers: 1
    mtp_layers_note: >-
      config 声明 1，权重里确实只有 1 块（第 47 层，层索引 0–47 连续）。
      这一块自带 embed_tokens [154880, 2048] 与 shared_head.head [154880, 2048]
      （与 GLM-4.5 / GLM-4.7 的做法相同、与 GLM-4.6 相反），
      外加 eh_proj [2048, 4096]、enorm、hnorm、shared_head.norm，
      以及完整的 MLA 注意力与 64 专家 MoE

precision:
  weights_release: [BF16, FP32]
  weights_release_scope:
    BF16: { manifest_taken: true, in_precision_table: true }
    FP32: { manifest_taken: true, in_precision_table: true }
  quantization:
    per_subsystem:
      expert: BF16
      shared_expert: BF16
      attention: BF16
      dense_ffn: BF16
      draft: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（48 分片 9703 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空。9656 个 BF16 + 47 个 F32。
      router 桶内部不同质：主干 46 层（L1–L46）的 mlp.gate.weight [64, 2048] 是 BF16，
      同样 46 份 e_score_correction_bias [64] 是 F32 真参数（不是 scale 容器，
      所以**本代根本没有 per_subsystem_scale 这个字段** —— 不量化，不存在 scale 张量），按元素数 router 桶 99.95% 是 BF16。
      清单里这两种各有 47 份，第 47 份在 MTP 块（L47）、按层索引归在 draft 桶 ——
      所以 **draft 桶也不同质**：{BF16 1,278,094,592, F32 64}，那 64 个元素就是
      model.layers.47.mlp.gate.e_score_correction_bias [64]。代表值报 BF16 没问题，
      但按「MTP 块整体 BF16」做名字精确匹配的流程要知道有这一张。
      这一代没有 quantization_config，不存在 scale 张量与量化块

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    caveat: architectures 是 Glm4MoeLiteForCausalLM（transformers 5.0.0rc0），与主干旗舰的 Glm4MoeForCausalLM 不是同一套实现
    ref:
      kind: modelcard
      url: https://huggingface.co/zai-org/GLM-4.7-Flash
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      MLA 把每层缓存压到 576 元素。和主干旗舰 GLM-4.7 的每层 2048 相比是 3.56 倍 ——
      **但那是跨档比较**（31.2B 支线对 358B 旗舰）：2048 来自旗舰的 8 KV 头 × 128，
      本档若仍走 GQA 会用几个 KV 头没有来源，所以这个倍数衡量的是
      「这一档选了 MLA 而旗舰选了 GQA」，不是「同档位换 MLA 省了 3.56 倍」。
      这是 GLM 线上第一次在结构上改缓存账。但省的是「每层多宽」这根轴 ——
      层覆盖面一点没省：47/47 层逐层全量存，无跨层共享、无滑窗。
      与 DeepSeek V4.1 那条「只有 4 层产出 KV」的路线相比，
      GLM 这一代走的是压宽度而不是减层数。
    quantified: >-
      口径为**主干 47 层，不含 MTP 块**：576 元素/层/token（kv_lora 512 + rope 64）
      × 47 层 = 27072 元素/token。开 MTP 时 48 层、27648 元素/token（+576，+2.13%）。
      KV 落盘精度未披露，按 config 的 dtype=bfloat16 兜底（2 B/元素）得
      54144 B/token、202752 上下文 10.22 GiB —— dtype_fallback 兜底口径，
      不是实测落盘量
    visibility: public
  - dimension: compute
    finding: >-
      MLA 用算力换带宽：latent 512 维每步要经 kv_b_proj [8960, 512] 升回
      20 × 448 维（或吸收进 Q / O 两侧，取决于实现）。
      本档 kv_b_proj 占注意力参数的 21.1%（4,587,520 / 21,757,952），
      是单层注意力里第二大的投影（最大的是 o_proj 的 10,485,760）。
      按 GQA 的算子图排 MLA 会缺两段式 Q 与 latent 上投影这两类算子。
    quantified: >-
      每层 kv_b_proj 4,587,520 参数 = 8960 × 512；
      Q 侧两段 q_a 1,572,864 + q_b 3,932,160 = 5,505,024，占 25.3%
    visibility: public

infra_signals:
  - text: >-
      **MLA 进入 GLM 家族是在这个支线档位上，不是在主干旗舰上。**
      GLM-5 的 MLA 几何（kv_lora_rank 512、qk_rope_head_dim 64、qk_nope_head_dim 192、
      v_head_dim 256、两段式 Q、kv_a_layernorm / q_a_layernorm）与新词表 154880
      全部沿用自这里。放大的是另外四个因子：头数 20 → 64、层数 47 → 78、
      hidden 2048 → 6144、q_lora_rank 768 → 2048（所以 q_a_proj / q_a_layernorm /
      q_b_proj 三张的形状都跟着变）—— **latent 宽度 576 这一项逐代不变**，
      那才是「沿用」的那部分。
      所以跟踪一个家族的架构转折点时，不能只看主干旗舰 ——
      小档位常常是新结构的首发位置，而算子适配的工作量在首发那一代就已经发生。
    evidence: derived
    horizon: now
    axis: attention
  - text: >-
      同一代里 MLA 省了 3.56 倍缓存宽度、却一层都没省层覆盖面。
      「稀疏注意力 / 压缩注意力省 KV」这句话要分成两根轴问清楚：
      省的是每层多宽，还是哪些层产出。GLM 这一代省前者，
      DeepSeek V4.1 省后者，GLM-5.2 省的又是第三根轴（哪些层算 topk）。
      三者不能互相代入。
    evidence: judgement
    horizon: now
    axis: attention

