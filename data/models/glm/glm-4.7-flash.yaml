reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算，另派四路独立核查代理分管互不重叠的因子组
  method: >-
    按 .claude/skills/model-audit 的提问顺序逐字段对 facts/glm-4.7-flash 核：config 全部键、
    完整权重清单（9703 条目，逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData /
    createdAt / lastModified / sha 与逐 dtype 的 safetensors tally，以及
    data/derived/glm-4.7-flash.json 的分项与 KV 公式路。
    本会话另做了两遍机械扫描：(1) 把记录里**每一个带逗号的数字**与从清单重算的集合比对
    （张量 numel、逐层分组求和、各子系统求和、derived 的每一项、跨版本差值），未匹配的逐个手算；
    (2) 同样扫 4–6 位纯数字，核出的口径错已改（留痕见下）。
    记录里每一个「X 倍」「X%」都逐个重算过分子分母。
    「没有任何 indexer / compressor 张量」是在 9703 条清单上用全名正则穷举过的
    （index|compress|sparse|topk 四个词，命中 0），不是抽样；self_attn 下只有 7 个族
    （kv_a_layernorm / kv_a_proj_with_mqa / kv_b_proj / o_proj / q_a_layernorm /
    q_a_proj / q_b_proj），K 侧没有任何独立的 rope 投影。
    **哪些是实际重跑过的、哪些不是**，按本仓约定分开写明。
    本会话实际重跑/重算：清单逐项求和得 params.total 与 breakdown，并与 breakdown
    逐项求和、HF 的 safetensors tally 三方比对（逐 dtype 的元素数也比了）；
    derive.py 的 reconciliation 与 active_params；缓存账公式路的四个因子
    （宽度 / 层集合 / 条目覆盖 / 每元素字节）各自落到某个张量形状上；
    cfg.json 的逐键 diff 与张量名集合的对称差、shape+dtype 字典的逐条相等；
    dtype 的逐条计数。
    **未逐项复跑、依据核查代理枚举的**：各子系统桶内的元素占比（99.9x% 这类分母的
    归类优先级链没有逐张量重判）。
    **原理上核不了的**（清单只有名字、形状与 dtype，所以不在 reviewed.scope 的覆盖内）：
    运行期标量（top_k / index_topk / routed_scaling_factor / norm_eps / rope 参数 /
    scoring_func / topk_method / attention_bias 等）只有 config 一个来源；
    MTP 块自带的词表副本与主干那份是不是同值；KV 条目是 1:1 计费还是选存；
    KV 的实际落盘精度。后三项都挂在 open_questions 里。
    **第二轮（卡正文）**：按新定的来源优先级把九份模型卡 README.md 按 pinned sha 全抓下来
    逐行读过，并全文搜了 kv.?cache / per-token byte / cache size|capacity|memory|footprint
    与参数量、训练精度、上下文数字。KV 字节九份全部命中 0；参数量声明在
    glm-4.5 / glm-5 / glm-4.7-flash / glm-4-32b-0414 四份卡里有、另五份没有。
    技术报告（arXiv 2602.15763 / 2603.12201 / 2508.06471）与 z.ai 博客**均未读**，
    所以「厂商从未公布每 token KV 字节」这个结论的作用域只到卡正文，不含报告。
review:
  - id: R1
    field: precision.quantization.subsystem_method
    severity: imprecise
    claim: >-
      router 桶用「47 个」描述
    finding: >-
      47 是全清单份数（层 1–47，含 MTP 块那一份）；router 桶里只有 46 份（主干 L1–L46），
      桶的参数量 6,032,256 = 46 × (64×2048 + 64) 自己就证明了。同 glm-4.5 的 R3。
    resolution: corrected
    changed_to: >-
      区分「清单里 47 份」与「router 桶里 46 份」
  - id: R2
    field: evidence.lineage
    severity: miscategorized
    claim: >-
      lineage 标 derived
    finding: >-
      同 glm-4-9b 的 R3。
    resolution: corrected
    changed_to: >-
      evidence 的 lineage 改为 judgement
  - id: R3
    field: arch.attention
    severity: imprecise
    claim: >-
      MLA 几何：latent 576、kv_b_proj 8960 = 20 × (192 + 256)、o_proj 入口 5120 = 20 × 256
    finding: >-
      逐张量核过：kv_a_proj_with_mqa [576, 2048]、kv_b_proj [8960, 512]、
      o_proj [2048, 5120]、q_a_proj [768, 2048]、q_b_proj [5120, 768]。
      8960 = 20 × 448、5120 = 20 × 256 都成立；K 侧无独立 rope 投影，
      所以「rope 的 64 维在 kv_a_proj_with_mqa 输出的 576 之内」在清单上成立
      （与 glm-5.3 的 R22 关闭依据同型）。
      num_kv_heads 20 当缓存宽度会得 2 × 20 × 256 = 10240，对 576 是 17.8 倍高估。
    resolution: confirmed
  - id: R4
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: >-
      attention 轴写「q_b_proj [5120, 768]，5120 = 20 × qk_head_dim 256」
    finding: >-
      facts/glm-4.7-flash/cfg.json **没有 qk_head_dim 这个键**（只有 qk_nope_head_dim 192
      与 qk_rope_head_dim 64）。那个键是 GLM-5 / 5.1 / 5.2 才有的，措辞从那边搬了过来。
      同一份记录的 head_dim_note 写对了（「QK 全宽是 192 + 64 = 256」）。
    resolution: corrected
    changed_to: >-
      改成「5120 = 20 × 256，其中 256 = qk_nope 192 + qk_rope 64」并点明本代 config 没有这个键
  - id: R5
    field: arch.attention.head_dim_note
    severity: imprecise
    claim: >-
      「按 2 × 20 × 256 折算得 10240，对实际 576 是 17.8 倍高估」
    finding: >-
      本家族其它三份（glm-5 / glm-5.2 / glm-5.3）一律用 2 × num_kv_heads × head_dim(192)，
      得 24576、42.7 倍。按同一公式本份应是 2 × 20 × 192 = 7680 → 13.3 倍。
      两个都是「头数乘积当缓存宽度」这个错算，但同一族系用两套公式会让
      17.8 与 42.7 不可比 —— 读者会以为支线的坑比旗舰小一半。
    resolution: corrected
    changed_to: >-
      两个都给出并说明用的是哪个公式，点明 13.3 倍才与 42.7 倍可比。
      **后续（见 R12）四份 GLM 的 head_dim 统一改成 QK 全宽 256 之后，这条自然消解了**：
      同一公式对本份得 2 × 20 × 256 = 10240、17.8 倍，对 glm-5 / glm-5.2 / glm-5.3 得
      2 × 64 × 256 = 32768、56.9 倍，差别只剩 KV 头数 20 与 64，本就可比。
      note 已按新值重写，不再并列两套公式 —— 当初那个「不可比」的根因不是写法，
      是同一个字段在四份里存的不是同一个量
  - id: R6
    field: infra_signals
    severity: imprecise
    claim: >-
      「GLM-5 的 MLA 几何……全部沿用自这里，只是把头数从 20 放到 64、层数从 47 放到 78」
    finding: >-
      「只是」漏了两个因子：hidden 2048 → 6144、q_lora_rank 768 → 2048
      （后者让 q_a_proj / q_a_layernorm / q_b_proj 三张的形状都跟着变）。
      glm-5 自己的 lineage 文字把 q_lora_rank 列了。
      真正逐代不变的是 latent 宽度 576 这一项，那才是「沿用」的那部分。
    resolution: corrected
    changed_to: >-
      列齐四个变化的因子，并点明 576 是不变的那一项
  - id: R7
    field: bottlenecks
    severity: overreach
    claim: >-
      kv-capacity 一条写「MLA 把每层缓存从 2048 元素压到 576（3.56 倍）」
    finding: >-
      算术成立，但 2048 是主干旗舰 GLM-4.7 的每层宽度（8 KV 头 × 128 × 2），
      而本份是 31.2B 支线。同一块的每 token 数字标了跨档（「本档只有 47 主干层」），
      这个每层数字没标 —— 把它整笔归给 MLA 隐含了「2048-hidden 的档位仍会用
      8 KV 头 × 128」这个没有来源的前提。
    resolution: corrected
    changed_to: >-
      写明这是跨档比较，倍数衡量的是「这一档选了 MLA 而旗舰选了 GQA」
  - id: R8
    field: precision.quantization.per_subsystem
    severity: missing
    claim: >-
      draft 标 BF16，subsystem_method 只点名 router 桶内部不同质
    finding: >-
      draft 桶实测 {BF16 1,278,094,592, F32 64}，那 64 个元素是
      model.layers.47.mlp.gate.e_score_correction_bias [64]（第 47 份，前 46 份在 router 桶）。
      量级极小，但 glm-5.3 的 R8 立的规矩是「桶内异质要写出来」，
      同族的 glm-5 / glm-5.2 都写了 draft 桶那 256 个元素。
    resolution: corrected
    changed_to: >-
      subsystem_method 补上 draft 桶的构成
  - id: R9
    field: evidence.arch.moe.first_k_dense
    severity: miscategorized
    claim: >-
      first_k_dense 标 official
    finding: >-
      glm-5.3 的 R12 已经判定这个字段须标 derived（skill 规则 2 点名要用权重验的字段），
      glm-5 / glm-5.2 / glm-5.3 三份都是 derived，只有本份退回 official，
      于是不进 --list-judgements。值本身对：清单里只有 L0 有 mlp.gate_proj [10240, 2048]。
    resolution: corrected
    changed_to: >-
      改 derived
  - id: R10
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: >-
      moe 轴写「这一档的激活专家从 8 个降到 4 个，带宽口径激活参数 32.86B → 3.58B」
    finding: >-
      两个数都对，但并列的因果不成立：9.18 倍的降幅里 top_k 8 → 4 只占 2 倍。
      逐因子拆（都取自 derived 的 active_params）：
      专家那一半 expert_active 16,798,187,520 → 1,736,441,856 = **9.67 倍**
      = 单层激活专家 5.0 倍（top_k 2 倍 × hidden 2.5 倍）× 主干 MoE 层数 89/46 = 1.935 倍；
      常驻那一半 always_active 16,058,132,384 → 1,843,129,984 = **8.71 倍**；
      两半合起来才是 total 的 9.18 倍。
      注意 9.67 × 不等于 9.18 —— 只拆专家那一侧同样不闭合，这正是 skill 规则 1。
    resolution: corrected
    changed_to: >-
      把 9.18 倍拆成 expert_active 9.67 倍与 always_active 8.71 倍两侧，并给出专家侧的两个子因子
  - id: R11
    field: lineage.changed_from_predecessor
    severity: missing
    claim: >-
      attention 轴列了 QK-Norm 去掉、partial_rotary 0.5 → 1.0，没列 q/k/v bias 的消失
    finding: >-
      config attention_bias 从 true 变 false，清单里 9703 条一个 .bias 都没有
      （GLM-4.7 有 q/k/v 各一份 bias）。glm-5 的同轴条目把它显式写了
      （「QK-Norm 与 q/k/v 的 bias 都去掉了」），两份口径不齐。
    resolution: corrected
    changed_to: >-
      attention 轴补上 bias 这一项与清单依据
  - id: R12
    field: arch.attention.head_dim
    severity: imprecise
    claim: >-
      head_dim 存 192
    finding: >-
      schema 对 v_head_dim 的描述把本仓口径写死了：「MLA 一代的 head_dim（nope+rope）
      只管 QK」—— ds-v3 照此存 192 = qk_nope 128 + qk_rope 64，即 **QK 全宽**。
      本份（以及 glm-5 / glm-5.2 / glm-5.3）存的 192 只是 **nope 段**，QK 全宽是 256。
      同一个字段在两个族系里是两个量，站点的 head_dim 行会把它们并排显示。
      数值上目前无害（derive.py 对有 kv_lora_rank 的 MLA 走 latent + rope，
      head_dim 不参与），但同一函数在无 kv_lora_rank 时会拿 num_kv_heads × head_dim
      当 latent 宽度。
    resolution: corrected
    changed_to: >-
      **head_dim 192 → 256**（= qk_nope 192 + qk_rope 64），本代与 glm-5 / glm-5.2 /
      glm-5.3 四份一起改，统一到 ds-v3 那套「QK 全宽」的语义。
      仲裁依据是本仓自己的 schema：它早就把口径写死了，只是写在 v_head_dim 的描述里，
      而 head_dim 字段本身**没有任何描述** —— 根因是规则没放在它约束的那个字段上。
      已给 head_dim / qk_nope_head_dim / qk_rope_head_dim 三个字段补上描述，
      并写明**不要照抄 config 的 head_dim 键**：GLM 自己在 glm-5 填 64、glm-5.2 填 192，
      而两代的 qk_nope 192 / qk_rope 64 完全相同，厂商那个键在同族内就不是一个量。
      改完四份重跑 derive 全部 0 处不一致、derived JSON 逐字未变 ——
      head_dim 对有 kv_lora_rank 的 MLA 不参与任何推导，是纯展示字段，
      所以这次改的是「读表的人看到什么」，不是任何算出来的数
  - id: R13
    field: precision.quantization.subsystem_method
    severity: imprecise
    claim: >-
      「per_subsystem_scale 里没有 router 项」
    finding: >-
      同 glm-4.5 的 R11：本代不量化，没有这个字段。
    resolution: corrected
    changed_to: >-
      改成「本代不量化，没有 per_subsystem_scale 这个字段」
  - id: R14
    field: params.counting_note
    severity: missing
    claim: >-
      没说 Gate B 的参数总量一项是实测比实测
    finding: >-
      同 glm-4-9b 的 R13。
    resolution: corrected
    changed_to: >-
      补上这一句
  - id: R15
    field: params
    severity: wrong
    claim: >-
      counting_note 写「厂商未声明总参数或激活参数；名字里的「Flash」不含数字，所以没有可对账的声明值」
    finding: >-
      本轮按新定的来源优先级（模型卡 / 技术报告 > 厂商参考实现 > 引擎实现）
      回头去读卡正文时查出来的。原来九份记录的 sources 里每条 locator 都是
      `config.json @ <sha>`，读的只有 config、repoinfo 与权重清单，卡正文一行没读 ——
      `glm-4-9b` 的 open_question 甚至明写着「模型卡正文未读」。
      模型卡 README.md @ 7dd20894a642 **第 27 行**写着
      「GLM-4.7-Flash is a **30B-A3B** MoE model」—— 总参数与激活参数都声明了。
      总参数这一侧是本家族最硬的判例：实测 31,221,488,576 对 30B 是 **+4.072%，超 2% 容差**；
      扣掉 draft 后 29,943,393,920 是 **−0.189%**，不扣就超、扣了就几乎逐位。
      **激活那一侧对不上**：A3B 即 3B，而带宽口径 +19.3%、带宽口径扣 lm_head 后 +8.7%，
      两套都差得远（glm-4.5 / glm-5 的 active 声明值都能对到千分之几）。
      所以 A3B 更像档位命名的取整而不是参数量声明 —— 照实记，不当可对账的声明值。
    resolution: corrected
    changed_to: >-
      params.total 改 30000000000 + excludes: [draft]，counting_note 写明总参数这一侧对上了、激活那一侧对不上及其理由，sources 补卡正文，evidence 补三项
notes: >-
  支线（lineage.track: side），收录理由是结构对照：**MLA 第一次进入 GLM 家族就在这一份**，
  而且 GLM-5 的 MLA 几何与新词表全部沿用自它。model_type 是 glm4_moe_lite，
  不是主干旗舰的 glm4_moe —— 它不是 GLM-4.7 的档位缩小版，是另一套架构。
  没有任何 indexer / compressor 张量（按全名正则在 9703 条清单上穷举过），
  所以 DSA 不在这一代。
  层数、宽度、MLA 几何、层集合、专家分布、MTP 块构成、参数量与逐子系统精度
  都对照完整权重清单核过；top_k / routed_scaling_factor / rope 参数这类运行期标量
  只有 config 一个来源。

open_questions:
  - >-
    KV cache 的实际落盘精度未披露，按 config 的 dtype=bfloat16 兜底，
    bytes_basis 是 dtype_fallback，不能和按落盘格式算出来的理论下限比倍数
  - 训练精度无一手声明，config 只有 dtype=bfloat16，所以 precision.training 不填
  - >-
    kv_b_proj 在推理时是否被吸收进 Q 与 O 两侧（从而不显式复原 KV），
    本仓没有读实现，所以「每步升回 8960 维」这一句只对参考写法成立。
    这件事决定了 MLA 的算力代价到底有多大
  - >-
    scoring_func 仍不声明（topk_method 这一代写了 noaux_tc，但打分函数是
    sigmoid 还是 softmax 没有一手来源）。GLM-5 的 config 才写 scoring_func=sigmoid，
    不能回填到这一代
  - >-
    这一代为什么把 QK-Norm 去掉没有一手来源。MLA 自带 kv_a_layernorm / q_a_layernorm
    是结构要求，但那是作用在 latent 上的，和 QK-Norm 作用在每头 QK 上不是同一件事
