      另有 TokenSpeed / KTransformers / Unsloth 三条也在同一节里 ——
      **本仓的 platforms 只收能定位到一手清单的条目**，那三条的链接本轮没读，
      故不登记，不是「不支持」
    ref:
      kind: modelcard
      url: https://huggingface.co/zai-org/GLM-5.3-Flash
      locator: README.md「Serve GLM-5.3-Flash Locally」一节，vLLM 一条
      accessed: '2026-11-18'
    visibility: public
  - engine: vllm-ascend
    hardware: 昇腾
    status: unknown
    caveat: >-
      **未查**，不是不支持。GLM-5.3 那份记录的两条昇腾条目来自
      vllm-ascend 的 supported_models.md 行级定位（2026-11-02 访问），
      本轮没有重读那份清单，所以这一档留在「未查」而不是写成 none ——
      本仓三态契约要求「未录」与「确认无」分得开
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      **这一代把缓存账拆成了两个互不相干的量，而 GLM-5.3 只有一个。**
      45 层里 34 层走 KDA（线性注意力），缓存是每序列固定的递归状态，
      与上下文长度无关；只有 11 层走 DSA 全注意力，缓存随上下文线性增长。
      前代 GLM-5.3 是 78 层全部产出 MLA KV、逐层随上下文长。
      所以长上下文下的硬开销从「78 层 × 576」降到「11 层 × 512」——
      省的不是宽度（576 → 512 只有 1.125 倍），是**层数**（78 → 11，7.09 倍）。
      稀疏那一侧仍只作用在「读哪些 token」，不作用在「存多少」。
    quantified: >-
      口径为**主干 45 层，不含 MTP 块**，字节按 BF16 兜底（见 open_questions）。
      **随上下文线性增长的那一半**：MLA latent 512 元素/层/token
      （kv_a_proj_with_mqa [512, 4096] 的输出维，12 张逐张相同）× 11 层
      （layer_types 里 deepseek_sparse_attention 的位置）= 5,632，
      加 index K 128 元素/层/token（indexer.wk [128, 4096] 的输出维）× 同样 11 层
      = 1,408，合计 **7,040 元素/token → 14,080 B/token → 1M 上下文 13.750 GiB**
      （这是**只算这一半**的值；两半合计 13.822 GiB，data/derived 里的
      kv_at 那一行给的是合计）。
      开 MTP 时各 ×12/11，为 7,680 元素/token（+640，+9.1%）。
      **每序列固定的那一半**：KDA 状态 = 矩阵状态 64 头 × 128 × 128
      = 1,048,576 元素/层 加短卷积状态 4 × 24,576 通道 = 98,304 元素/层，
      合计 1,146,880 元素/层 × 34 层 = 38,993,920 元素 → **77,987,840 B
      = 74.375 MiB/序列**，不随上下文增长。矩阵状态的布局依实现而定（上界），
      卷积通道数由清单钉死（三条 conv1d 首维之和 24,576 逐位等于
      2×64×128 + 64×128）。
      **两半不能相加成一个数**：在 1M 上下文下第二半只占 0.53%，
      在 4K 上下文下却占 58.3%（4K：7,040 × 2 × 4,096 = 57.7 MiB
      vs 74.375 MiB）—— 哪一半是大头取决于上下文长度。
      **与 GLM-5.3 的倍数只能比第一半，两侧同为元素口径 + dtype_fallback 兜底、
      同为主干口径**：47,616 → 7,040 元素/token 是 **6.764 倍**，
      1M 下 93.0 GiB → 13.750 GiB。
      index K 那一半按 1:1 计费，而 config 声明了 index_kpool 4 ——
      若池化作用在落盘上，第一半降到 5,984 元素/token（−15.0%），见 open_questions
    visibility: public
  - dimension: operator-gap
    finding: >-
      **一份权重里装了三套完全不同的注意力算子，而且层级交替。**
      34 层 KDA（门控增量规则 + 三条独立 depthwise 短卷积 + 两组低秩门 +
      逐头衰减 A_log）、11 层 NoPE MLA + DSA indexer、24 层 ViT 自注意力。
      调度单元不是「一种注意力重复 45 次」，而是 3:1 的交替图：
      L0–L2 KDA、L3 DSA、L4–L6 KDA、L7 DSA……严格间隔 4。
      按单一注意力实现排算子表会漏掉其中两套；
      按「每 4 层一个全注意力」建 KV 池的实现要能处理 11 个全注意力层
      与 34 个状态层共存、且两者的生命周期不同（一个随上下文长、一个每序列固定）。
    quantified: >-
      34 层 KDA × 12 个张量 + 11 层 DSA × 11 个张量（4 个 FP8 投影 + kv_b_proj +
      5 个 indexer + kv_a_layernorm / q_a_layernorm）+ 24 个 ViT 块 × 14 个张量。
      KDA 侧 BF16 4,682,897,792 参数、DSA 侧 1,291,868,160 —— 层数比 34:11、
      参数比 3.62:1，即单层 KDA 比单层 DSA 还重 1.17 倍
      （137,732,288 vs 117,442,560）
    visibility: public
  - dimension: operator-gap
    finding: >-
      **mHC 是参数量看不见的负载。** 逐层 6 个张量、45 层零例外，
      合计只占总参数的 0.011%（35,391,870），而 config 的
      hc_sinkhorn_iters 20 说明每层每 token 要跑 20 次 Sinkhorn 归一化迭代，
      hc_mult 4 说明残差流是四路、每层进出都要在四路之间混合
      （hc_attn_fn 入口 16,384 = 4 × 4096 正是四路拼接）。
      按参数量给算子表排优先级会把它排到最后，而它在算子图上是逐层逐 token 的。
      本仓第一次在 DeepSeek 以外看到 mHC —— 同机制在 Qwen3.8-Flash-Next
      叫 hyper_connection、在 MAGI-2 叫 mhc_*，三套命名、同一件事。
    quantified: >-
      45 层 × 2 组（attn / ffn）× 3 个张量 = 270 条，hc_mult 4、sinkhorn 20 次/层/组。
      decode 下 fn 的常驻权重读 = 45 × 2 × 24 × 16,384 × 2 B = 70,778,880 B
      = **67.50 MiB/token**（BF16）。**这一代把 fn 从 FP32 降到了 BF16** ——
      五份 DeepSeek V4 记录与 MAGI-2 的同名张量全是 FP32，同一个式子在 V4.1 上
      是 150 MiB/token。两侧 dtype、层数、宽度三样都不同，**不要算倍数**；
      能说的是 dtype 这一个因子自己贡献 2 倍。
      MTP 块（第 45 层）**没有** mHC，五份 DeepSeek 的 mtp 块都有
    visibility: public
  - dimension: ep-comm
    finding: >-
      288 专家 top-8、专家中间维 2048，逐专家独立张量存放。
      **288 不是 2 的幂**：EP 8 / 16 / 32 都整除（每 rank 36 / 18 / 9 个专家），
      EP 64 不整除 —— GLM-5.3 的 256 专家任意 2 的幂都整除，
      按那一代的切分脚本直接套会在 EP 64 上剩 32 个专家没地方放。
      MoE 层只有 42 个（45 层里 3 层稠密），比 GLM-5.3 的 75 层少一半。
    visibility: public
  - dimension: compute
    finding: >-
      **视觉塔的 prefill 开销在本仓 vlm 里占比偏低，原因不在塔而在主干。**
      压缩比只有 4（2×2 空间合并），比 DeepSeek 一代的 9 弱，
      但主干每 token 的 prefill 线性负载是 32.22 GFLOPs（激活 16.74B 的两倍，
      扣掉 lm_head），于是一张 448×448 的图只相当于 284 个文本 token，
      比它自己占的 256 个位置只多 11%。
      反过来说，**这一代的塔分离部署收益小**：分出去也只省掉 11% 的主干等效量，
      而 347 个视觉张量恰好全在第 62 个分片里（partial 隔离，同片另有 4 个主干张量、
      6,715 万参数），分离的工程成本反倒比收益显眼。
    quantified: >-
      encoder 827.1 GFLOPs + projector 81.6 GFLOPs = 908.7 GFLOPs/图，
      主干 32.22 GFLOPs/token，换算 256 + 28.2 = 284 个等效文本 token。
      逐因子推导见 arch.vision.prefill.derivation
    visibility: public

infra_signals:
  - text: >-
      **「混合注意力」这个词现在盖着两种互不相容的容量模型，规划时必须先问是哪一种。**
      一种是「线性 + 全注意力」（通义 Qwen3.5 起、Kimi-K3、本记录的 34:11）：
      线性层的状态每序列固定，容量账分成两个量；另一种是「稀疏 + 全注意力」
      （GLM-5.3 的 78 层全存 + topk 选读）：仍是一个量，只是带宽变了。
      GLM 这一代把两种**叠在同一份权重里** —— 34 层线性、11 层稀疏全注意力，
      于是三类缓存（递归状态 / MLA latent / index K）同时存在，
      覆盖面三套、增长方式两种。按任一种单一模型写的 KV 规划在这里都会错，
      而错的方式不是差一个系数：在 4K 上下文下每序列固定那一半占 58%，
      在 1M 下只占 0.53%。
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      **NoPE 把一个已经踩了两代的量化对齐坑直接结构性地消掉了。**
      kv_a_proj_with_mqa 的输出维 = kv_lora_rank + qk_rope_head_dim：
      DeepSeek V3 与 GLM-5.3 都是 512 + 64 = 576，而 576 对 128 的块不整除，
      末块只有 64 行，本仓两份记录都为此记了 128ceil，按「block 一律整除」
      写的反量化会在这一张上错位。这一代 qk_rope_head_dim 是 0，
      输出维恰好 512 = 4 × 128，全清单一个不满块都没有。
      **但这是这一代的性质，不是这条线的性质** —— 下一代只要 rope 段回来，
      坑就回来；块对齐这件事要逐张量量，不能从「上一代整除」推。
    evidence: judgement
    horizon: now
    axis: precision
  - text: >-
      **这一代的 FP8 量化面避开了整条线性注意力路径，和同代旗舰方向相反。**
      GLM-5.3 把注意力整桶量化成 FP8；本记录的 attention 桶按元素数 81.46% 是 BF16
      —— 34 个 KDA 层的 408 张投影与 11 个稀疏层的 kv_b_proj 全部保持 BF16，
      只有 q_a / q_b / kv_a / o_proj 这 44 张是 FP8。
      对 infra 的含义是：**同一个模型里「注意力算子要不要 FP8 GEMM」没有统一答案**，
      而按桶级精度标签生成的加载器会在 419 张张量上解错。
      为什么避开没有来源（可能是增量规则对数值范围敏感，也可能只是量化脚本的
      排除清单这么写的），见 open_questions。
    evidence: judgement
    horizon: now
    axis: precision
  - text: >-
      **config 的层类型清单这一代出现了「声明覆盖面比实测宽」的新形态，
      而上一代是反的。** GLM-5.3 的 indexer_types 长度 78、其中 21 项是 full，
      与实测 21 层逐个相等 —— 声明是准的，陷阱在「每 4 层」那句散文。
      本记录的 indexer_types 是 **45 项全 full**，而清单里有 indexer 张量的只有 11 层，
      照它数会高估 4.09 倍（index K 从 1,408 变成 5,760 元素/token）。
      真正可信的是 layer_types 与 linear_attn_config.full_attn_layers，
      两者与清单逐个相等。**同一份 config 里两个描述层集合的键，一个准一个不准**
      —— 所以「层集合」这类字段一律要对权重清单验，不能挑一个顺手的键读。
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      **index K 这一代第一次带了池化比，而缓存账的「一个条目覆盖几个 token」
      这一问在本仓第一次有了非 1 的候选值。** config 的
      index_kpool 4 / index_kpool_compress true / index_kpool_always_select_tail true，
      权重侧 index_kpool_compress_ape [4, 128] 与 index_kpool_compress_gate [128, 4096]
      坐实了「窗口 4、压缩后宽度 128」。
      但**清单只能定宽度与窗口，定不了存的是池化前还是池化后** ——
      前者 1,408 元素/token、后者 352，差 4 倍。
      本仓此前所有记录这一问的答案都是 1（或滑窗那种整段 per-sequence），
      所以这是一根新轴：引擎侧要能表达「index K 的条目粒度 ≠ token 粒度」，
      而 topk 2048 选的也随之变成 2048 个池化单元 ≈ 8,192 个 token。
    evidence: judgement
    horizon: now
    axis: attention

