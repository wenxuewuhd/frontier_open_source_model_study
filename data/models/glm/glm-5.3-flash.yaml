  total: 321323031390
  breakdown:
    expert: 304405807104
    draft: 7432592416
    attention: 5974739072
    shared_expert: 1056964608
    lm_head: 634388480
    embed: 634388480
    vision: 563627008
    dense_ffn: 452984832
    indexer: 82187776
    router: 49557312
    residual: 35391870
    norm: 402432
  counting_note: >-
    按完整权重清单（62 分片 76,108 条目）逐项统计。76,108 是 safetensors 条目数，
    其中 37,338 条是 weight_scale_inv（FP8 的 per-block scale 容器）—— 不计入参数、
    只计入权重存储；真权重张量 38,770 条。
    **total 与 breakdown 都是精确值，不取有效数字**（十二项求和逐位等于 total
    321,323,031,390）—— glm-5.3 存 6 位有效数字那种写法会让「逐位相同」这句话
    无处可说，见那份记录的 R22。
    它与 HF 平台自己从 62 个分片头统计的 safetensors tally 逐 dtype 逐位相同：
    BF16 6,926,096,640 / F8_E4M3 314,396,639,232 / F32 295,518，合计 321,323,031,390。
    全清单 dtype 只有 F8_E4M3 / BF16 / F32 三种，无 INT8/UINT8/INT32 打包容器，
    numel 即参数数，不需还原。
    **厂商声明 320B**（模型卡 Introduction 第 1 段「320B total parameters」），
    对实测 321,323,031,390 是 **+0.41%** —— 声明值是整数档位的约数，
    本记录的 total 用实测值。
    **total 含草稿侧**：breakdown 的 draft 一项（第 45 层整块，7,432,592,416）在 total 之内，
    没有 excludes；也含视觉塔（563,627,008）。厂商没说 320B 的口径覆盖什么，
    所以无法填 params.excludes —— 这是「厂商没说」，不是「含/不含草稿侧」。
    激活参数见 data/derived/glm-5.3-flash.json（带宽口径与可比官方口径两套），
    这里不写单一值；与卡上 18B 的对账见 notes。

context:
  max: 1048576

arch:
  layers: 45
  hidden: 4096
  vocab: 154880
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: SwiGLU（config swiglu_limit 10.0，带截断）
  position: >-
    **主干注意力路径上没有 rotary**：config qk_rope_head_dim 0 + mla_use_nope true，
    权重侧 kv_a_proj_with_mqa 输出维恰好 512 = kv_lora_rank，没有 rope 尾段
    （对照 GLM-5.3 是 576 = 512 + 64）。位置信息由 34 层 KDA 的短卷积与递归衰减承担。
    indexer 侧另有 indexer_rope_interleave true，即 index 打分那一路仍带旋转 ——
    「整个模型没有位置编码」是错读，没有的是**全注意力层的 QK**

  attention:
    type: hybrid
    num_heads: 64
    num_kv_heads: 64
    head_dim: 256
    v_head_dim: 256
    head_dim_note: >-
      **这一代有三个 config 键会把 head_dim 读错，而且方向各不相同。**
      (1) `head_dim: 0` —— config 字面就是 0。照抄得 0；而 derive.py 在 head_dim
      为假值时会退到 hidden/num_heads = 4096/64 = **64**，比真值低 4 倍。
      (2) `qk_head_dim: 256` 是 QK 全宽，与 qk_nope_head_dim 256 相等 ——
      因为 qk_rope_head_dim 是 0（NoPE），nope 段就是全宽。本记录的 head_dim 填 256。
      (3) `num_kv_heads: 64` 是 query 侧可见的 KV 头数，**不是缓存宽度**：
      落盘缓存是 kv_a_proj_with_mqa 的 512 维 latent，按 2×64×256 = 32,768 折算
      会高估 **64 倍**（GLM-5.3 那一代同一个错算是 56.9 倍，因为它的 latent 是 576）。
      V 每头也是 256，与 QK 全宽相等。不对称只在 kv_b_proj [32768, 512] 内部：
      32,768 = 64 × (K-nope 256 + V 256)，**这一代 K 没有 rope 段**，
      所以 kv_b_proj 把 latent 全额升回 K 与 V 两侧，而 GLM-5.3 的 K-rope 64 维
      是由 kv_a_proj_with_mqa 尾段直接产出的。o_proj 入口 16,384 = 64 × 256，
      与 q_b_proj 出口逐位相同。
      以上只覆盖 11 个 `deepseek_sparse_attention` 层与 MTP 块；
      34 个 `linear_attention` 层的几何在 linear_state 里，两套不要混
    qk_rope_head_dim: 0
    qk_nope_head_dim: 256
    kv_lora_rank: 512
    q_lora_rank: 1536
    layer_pattern: >-
      3:1 linear:full —— config layer_types 45 项为 34 个 `linear_attention`
      + 11 个 `deepseek_sparse_attention`，稀疏层在 L3/L7/…/L43（间隔严格 4，
      与 linear_attn_config.full_attn_layers 逐个相等），其余 34 层是 KDA
      （与 linear_attn_config.kda_layers 逐个相等）。MTP 块（第 45 层）是稀疏层
    hybrid:
      layer_types_count: { linear: 34, full: 11 }
      interval: 4
      note: >-
        config 的 layer_types 用 `deepseek_sparse_attention` 而不是 `full_attention`
        这个词。**它在容量模型上属 full**：DSA 选的是「读哪些 token」，
        全历史的 latent 与 index K 仍逐 token 存。按字面匹配 "full" 会数出 0 层
        —— derive.py 的词表为此扩过（见该函数注释）
    sparse:
      mechanism: >-
        DSA indexer 选 token，**11 个稀疏层每层各算一次**（加 MTP 块共 12 套 indexer 权重），
        没有 GLM-5.3 那种「每 N 层算一次、其余层复用选择结果」的跨层复用 ——
        这一代根本没有「shared indexer 层」这个概念，因为非稀疏层走的是线性注意力。
        **config 的 `indexer_types` 是 45 项全 `full`，照它数会得 45 层**，
        对实测的 11 层是 4.09 倍高估；清单里有 indexer 张量的层只有
        [3,7,11,15,19,23,27,31,35,39,43] 加第 45 层（MTP），
        与 layer_types 里 `deepseek_sparse_attention` 的位置逐个相等。
        index_topk 2048，index_skip_topk_offset 这个键本代没有
      index_n_heads: 32
      index_head_dim: 128
      index_topk: 2048
      index_kv_dim: 128
      index_kv_source: >-
        model.layers.N.self_attn.indexer.wk.weight [128, 4096]，输出维 128。
        index_n_heads × index_head_dim = 32 × 128 = 4096 是 32 倍的上界：
        index K 在 32 个 index 头之间 MQA 共享，不是逐头
    kv_sharing:
      source_layers: [3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43]
      index_kv_source_layers: [3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43]
      layer_coverage: >-
        **四种缓存，覆盖面三套，互不相同。** 以下层数都是**主干口径**（0–44）：
        全局 MLA latent 在 11 层（L3/L7/…/L43 各有 kv_a_proj_with_mqa [512, 4096]，
        无跨层共享）；index K 在同样这 11 层（indexer.wk [128, 4096]）；
        KDA 的递归状态与短卷积状态在另外 34 层（与前 11 层**互斥**，34 + 11 = 45）。
        另有 MTP 块（第 45 层）自带一整套 MLA 与一整套 indexer，
        所以权重清单里产出 MLA latent 的层共 12 个、产出 index K 的共 12 个 ——
        config 的 indexer_types 与 layer_types 长度都只有 45、只覆盖主干 0–44，
        按它们数会漏掉这一套。开 MTP 时按 12 / 12 / 34 算。
        **三类的增长方式不同**：前两类随上下文线性增长，第三类每序列固定 ——
        不能统称「逐层」，也不能相加
      measured_per_token:
        global_kv: 5632
        indexer: 1408
        note: >-
          口径为**主干 11 层、不含 MTP 块**，与 glm-5.3 的记法一致（那份也只记主干）。
          逐因子：global_kv = kv_a_proj_with_mqa 输出维 512（实测，12 张逐张相同）
          × 11 层（layer_types 的 deepseek_sparse_attention 位置，与清单里
          kv_a_proj_with_mqa 的层集合逐个相等）；
          indexer = indexer.wk 输出维 128（实测，12 张逐张相同）× 同样 11 层。
          开 MTP 时各 ×12/11，合计 7,680 元素/token（+640，+9.1%）。
          **index K 这一半按「一个条目一个 token」计费，而 config 声明了
          `index_kpool: 4` + `index_kpool_compress: true`** —— 若池化作用在落盘上，
          这一半应除以 4（1408 → 352，合计 7,040 → 5,984 元素/token，−15.0%）。
          清单只能告诉我们池化窗口是 4（index_kpool_compress_ape [4, 128]）与
          压缩后的宽度是 128（index_kpool_compress_gate [128, 4096] 的输出维），
          **定不了「缓存里存的是池化前还是池化后」**，所以这里取不折算的上界
          并留 open question。**KDA 的递归状态不在这两个数里** ——
          它每序列固定，由 linear_state 那一侧算
    linear_state:
      mechanism: >-
        KDA（Kimi Delta Attention 式的门控增量规则），config 的
        linear_attn_config：num_heads 64 / head_dim 128 / short_conv_kernel_size 4 /
        gate_lower_bound −5.0。权重侧逐层 12 个张量：q/k/v_proj 各 [8192, 4096]
        （8192 = 64 × 128）、o_proj [4096, 8192]、q/k/v_conv1d 各 [8192, 1, 4]
        （三条独立的 depthwise 短卷积，不是一条融合的）、b_proj [64, 4096]（逐头标量）、
        f_a_proj [128, 4096] + f_b_proj [8192, 128] 与 g_a_proj [128, 4096] +
        g_b_proj [8192, 128]（两组低秩门，出口都是 64 × 128），
        另有 FP32 的 A_log [64] 与 dt_bias [8192]、BF16 的 o_norm [128]。
        **config 的 `fused_qkvbfg_a_proj` 在权重里不存在** ——
        modules_to_not_convert 里有 34 条这个名字，清单命中 0；
        真实张量是分开的 q_proj / k_proj / v_proj / b_proj / f_a_proj / g_a_proj。
        本代它们恰好全是 BF16，所以排除清单写错名字没出事（与 GLM-5.3 的
        `indexers_proj` 同一个形状）
      num_heads: 64
      num_key_heads: 64
      num_value_heads: 64
      key_head_dim: 128
      value_head_dim: 128
      conv_kernel_dim: 4
      state_layout_note: >-
        矩阵状态按 [num_value_heads 64, key_head_dim 128, value_head_dim 128] =
        1,048,576 元素/层估算，这一侧**依实现而定、本轮未读实现**。
        短卷积状态那一侧有权重清单给的恒等式钉住通道数：
        三条 conv1d 的首维之和 8192 × 3 = **24,576**，
        逐位等于 2 × num_key_heads(64) × key_head_dim(128) +
        num_value_heads(64) × value_head_dim(128) = 24,576 ——
        即 q/k/v 三段全展开，不是只数 key 一段（derive.py 的
        conv_state 公式正是这个式子）。窗长按 4 全窗计，是上界：
        实现若只存 k−1 = 3 个位置会低 25%。
        state_dtype 没有一手来源，不填，按模型 dtype 兜底，见 open_questions

  ffn:
    type: moe
    layer_pattern: >-
      第 0–2 层稠密（intermediate 12288），其余 42 层为 MoE；MTP 块（第 45 层）也是 MoE。
      与 config 的 mlp_layer_types（3 个 dense + 42 个 sparse）逐项相等。
      稠密层的 FFN 比单个专家宽 6 倍，单层 150,994,944 参数 ——
      而一层稀疏注意力只有 117,442,560，稠密 FFN 是它的 1.29 倍；
      但一层 KDA 是 137,732,288，所以「稠密层最宽」在这一代**只对注意力那一侧的 11 层成立**

  moe:
    routed_experts: 288
    shared_experts: 1
    top_k: 8
    intermediate: 2048
    first_k_dense: 3
    dense_intermediate: 12288
    routing: >-
      sigmoid 打分、noaux_tc 选路，routed_scaling_factor 2.5，norm_topk_prob true，
      打分走 FP32（config moe_router_dtype=float32，而 gate 权重实测 BF16 ——
      两者不矛盾：一个是计算精度、一个是存储精度）
    balance: >-
      e_score_correction_bias（无辅助损失）。config 另有 router_aux_loss_coef 0.001
      与 output_router_logits false —— 系数存在不等于启用，这一代的判据是
      topk_method=noaux_tc，而清单里 43 份 e_score_correction_bias [288] 全是 FP32 真参数
    storage_note: >-
      逐专家独立张量（mlp.experts.N.{gate,up,down}_proj），不是堆叠的 3 维权重。
      grouped GEMM 因此吃 2 维张量列表；EP 切分按张量分配，不按首维切。
      n_group=1 且 topk_group=1，分组路由实际未启用。
      **288 不是 2 的幂**：EP 切分成 8 / 16 / 32 份都整除（36 / 18 / 9），
      切 64 份不整除 —— 与 GLM-5.3 的 256 不同，那个任意 2 的幂都整除

  decoding:
    mtp_layers: 1

  vision:
    encoder: >-
      ViT 24 块，hidden 1024 / 16 头（head_dim 64）/ intermediate 4096：
      attn.qkv [3072, 1024] 带 bias、attn.proj [1024, 1024] 带 bias、
      q_norm / k_norm [64]（逐头维，不是逐 token 维）、
      门控 MLP gate_proj / up_proj [4096, 1024] + down_proj [1024, 4096] 三张全带 bias、
      norm1 / norm2 [1024]。**没有位置嵌入张量**。
      入口 patch_embed.proj.weight [1024, 3, 2, 14, 14] 是 3D 卷积核：
      3 通道 × 时间 2 × 空间 14×14，与 config 的 patch_size 14 /
      temporal_patch_size 2 逐个对上
    layers: 24
    hidden: 1024
    num_heads: 16
    patch_size: 14
    intermediate: 4096
    spatial_merge_size: 2
    temporal_patch_size: 2
    out_hidden: 4096
    params: 563627008
    max_image_tokens: 8000
    fusion: >-
      两步：先 `visual.downsample` [4096, 1024, 2, 2]（2×2 跨步卷积，
      把 1024 宽的 encoder 输出合并 4 个 patch 并同时升到 4096 = out_hidden_size，
      带 bias），再 `visual.merger`（proj [4096, 4096] → 门控 MLP
      gate_proj / up_proj [10240, 4096] + down_proj [4096, 10240]，
      10240 = config 的 projection_intermediate_size，另有
      post_projection_norm [4096] 带 bias）。
      **压缩在 merger 之前**，所以 merger 的四个 GEMM 只跑 256 次而不是 1024 次。
      清单里没有 image_start / image_newline 这类可学习标记向量 ——
      config 的 image_token_id 154854 / video_token_id 154855 /
      image_start_token_id 154830 等六个 id 都落在 vocab 154880 之内，
      即标记走的是词表里的普通 token，不是顶层独立张量
    tokens:
      reference_resolution: 448x448
      patch_grid: 32x32
      encoder_tokens: 1024
      llm_tokens: 256
      compression_ratio: 4
      compression_stage: >-
        `visual.downsample` 的 2×2 跨步卷积，**在 merger（projector）之前**。
        与 config 的 spatial_merge_size 2 和 processor_config 的 merge_size 2 一致，
        三处同一个 2。注意它和 Qwen/DeepSeek 那种「通道维拼接再过 MLP」不同：
        这里压缩与升维由同一个卷积一次做完（1024 × 2 × 2 = 4096 恰好等于出口宽度，
        所以这个卷积在参数量上等价于一次 4096×4096 的 GEMM）
      dynamic_resolution: true
      max_llm_tokens_declared: 8000
      derivation: >-
        三个因子：
        (1) patch 14 —— config vision_config.patch_size 与 processor_config
        image_processor.patch_size 都是 14，并由
        visual.patch_embed.proj.weight 的后两维 14 × 14 印证；
        (2) 空间 2×2 合并 —— config spatial_merge_size 2 / processor merge_size 2，
        并由 visual.downsample.weight [4096, 1024, 2, 2] 的后两维印证；
        (3) 参考分辨率 448 —— config vision_config.image_size 448。
        448 / 14 = 32，32² = **1024** 个 encoder token；
        32 / 2 = 16，16² = **256** 个主干 token。
        **448 是本仓选的参考分辨率，不是固定输入尺寸**：processor_config 给的是
        min_image_tokens 16 / max_image_tokens 8000，即按 token 数分桶、
        分辨率随图变，所以 dynamic_resolution 为 true。
        **8000 这个上限的口径（池化后的主干 token 数，还是池化前的 patch 数）
        processor_config 里没写**，字段名 `max_image_tokens` 配 merge_size 2 同处一段，
        按前者填进 max_llm_tokens_declared；若其实是后者，上限应是 2000，
        见 open_questions。processor_config 另有 `patch_expand_factor: 1` 这个键，
        含义无来源
      scope_note: >-
        这组数只覆盖**单张静态图**在 448×448 这一档上的 token 账。
        视频另有一套：processor_config.video_processor 的 fps 2 与
        max_image_tokens 240000，而 patch_embed 的时间维是 2，
        即每 2 帧合成一个时间 patch —— 按 fps 2 采样、时间 patch 2，
        一秒视频产出 1 个时间步的 patch 网格。**视频那一侧本记录没有算 token 账**：
        240000 的口径与 8000 同样没写明，而帧数到 patch 的换算还要知道分桶策略
    prefill:
      encoder_linear_gflops: 827.1
      projector_linear_gflops: 81.6
      backbone_token_budget: 256
      backbone_linear_gflops_per_token: 32.22
      image_as_text_tokens: 284
      attention_excluded: >-
        被排除的是 encoder 自注意力的 QK^T 与 AV，形式 4 × n² × hidden × layers。
        跨度没有一手来源：vision_config 里没有窗口一类的键，厂商参考实现本轮没读。
        按整图一段取 n = 1024：1024² × 4 × 1024 × 24 ≈ 103 GFLOPs。
        没有加进上面几格，因为主干那侧的分母也是线性项、不含注意力
      derivation: >-
        encoder 线性项 = 2 × 1024 token × (patch_embed 每 token
        1024 × (3 × 2 × 14 × 14) = 1,204,224 MAC + 24 层 × 每层 16,777,216 MAC
        = 402,653,184) = 2 × 1024 × 403,857,408 = **827,099,971,584**。
        每层 16,777,216 = qkv [3072,1024] 3,145,728 + proj [1024,1024] 1,048,576 +
        gate_proj [4096,1024] 4,194,304 + up_proj [4096,1024] 4,194,304 +
        down_proj [1024,4096] 4,194,304，五项相加；bias 不计（口径只算 GEMM）。
        projector 线性项 = downsample 2 × 256 × (4096 × 1024 × 2 × 2)
        = 8,589,934,592 加 merger 2 × 256 × (4096² + 2 × 10240 × 4096 + 4096 × 10240)
        = 73,014,444,032，合计 **81,604,378,624**。
        主干分母 = 2 × (active_params.total 16,742,333,246 −
        active_params.lm_head 634,388,480) = **32,215,889,532**
        —— **不能用 derived 里的 flops.linear_per_token 33,484,666,492**，
        那一项含 lm_head（decode 口径），prefill 只在最后一个位置算 logits。
        换算 = 256 + (827,099,971,584 + 81,604,378,624) / 32,215,889,532
        = 256 + 28.2 = **284**。
        塔占比 284 / 256 = 1.11，是本仓 vlm 里最低的一档之一 ——
        压缩比只有 4（DeepSeek 一代是 9），但主干每 token 32.2 GFLOPs 很厚，
        两个因子方向相反而主干那个赢了
    separability:
      weight_prefix: >-
        `model.visual.`（347 个张量）与主干的 `model.language_model.`（75,760 条）
        加顶层 `lm_head.weight`（1 条）。三者前缀不相交，合计 76,108 = 清单总条目数。
        **本代主干前缀多一层 `language_model.`** ——
        这是 `Glm5NextForConditionalGeneration` 的包装，GLM-5.3 那边是裸的
        `model.layers.`；按 GLM-5.3 的前缀写的加载器在这一代一个张量都匹配不上
      shard_isolation: partial
      shard_note: >-
        实测 shard_map：62 个分片里只有**第 62 个**含视觉张量，347 个全在里面；
        但同片还有 4 个非视觉张量 —— model.language_model.layers.9 的
        self_attn.{q_proj, v_proj, v_conv1d} 与 model.language_model.norm.weight，
        合计 67,145,728 个参数。
        所以「只读第 62 个文件」会多搬 6,715 万参数，**只有视觉塔本身
        （563,627,008）的 11.9%** —— 与 ds-v4-flash-vision-exp 那份正好相反：
        那边混进来的单张 embed 表（5.3 亿）比整座塔还大
      cross_prefix_sharing: >-
        清单的 76,108 个名字里没有任何一个同时匹配 `model.visual.` 与主干前缀，
        即没有重名共享；config 的 tie_word_embeddings 两处都是 false，
        而 embed_tokens 与 lm_head 两张 [154880, 4096] 在清单里各自独立落盘。
        落盘层面的 tied weights 要看 safetensors 头的数据偏移是否重合，
        本轮没读偏移

  # mHC（Manifold-Constrained Hyper-Connections）—— 卡上点名的机制，
  # **本仓第一次在 DeepSeek 以外见到**
  residual:
    type: mHC
    multiplier: 4
    sinkhorn_iters: 20
    eps: 1.0e-06
    coef_proj: >-
      每层 hc_attn_fn 与 hc_ffn_fn 各一个 [24, 16384] **BF16**，
      配 hc_attn_base / hc_ffn_base [24] 与 hc_attn_scale / hc_ffn_scale [3] 四个 FP32。
      16,384 = hc_mult(4) × hidden(4096)，即 fn 的入口是四路残差流拼起来
    note: >-
      厂商卡原话「adopts **Manifold-Constrained Hyper-Connections (mHC)**
      to further improve scaling efficiency」；config mhc true / hc_mult 4 /
      hc_sinkhorn_iters 20 / hc_eps 1e-06。
      逐层 6 个张量、主干 45 层零例外，**注意力与 FFN 各一套**（attn / ffn 两组前缀），
      不是整层一套。合计 35,391,870 个参数（总量的 0.011%）：
      BF16 35,389,440 = 45 × 2 × 24 × 16,384，FP32 2,430 = 45 × 2 × (24 + 3)。
      **[24, hc_mult × hidden] + [24] + [3] 这组形状跨厂商跨宽度不变**：
      本仓五份 DeepSeek V4 记录（hidden 4096 / 5120 / 7168 → fn 的第二维
      16384 / 20480 / 28672）第一维全是 24、scale 全是 3，MAGI-2 的
      mhc_phi_fused_* 是 [hidden, 24] —— 同一个 24，只是转置。
      所以 24 与 3 是 mHC 这个公式自带的常数，不是从 hidden 或 hc_mult 推出来的
      （为什么是 24 仍无来源，见 open_questions）。
      **三处与 DeepSeek 一代不同，都是实测**：
      (1) **精度** —— 这一代 fn 是 BF16，而五份 DeepSeek 记录的 hc_*_fn 全是 FP32
      （MAGI-2 的也是 FP32）。decode 下 fn 是逐层逐 token 的常驻读：
      45 层 × 2 组 × 24 × 16,384 × 2 B = **70,778,880 B = 67.50 MiB/token**；
      同一个式子在 V4.1 上是 40 × 2 × 24 × 20,480 × 4 B = 150 MiB/token，
      **两侧 dtype 不同、层数与宽度也不同，不要拿这两个数算倍数**。
      (2) **MTP 块没有 mHC** —— 第 45 层一个 hc_* 张量都没有，而五份 DeepSeek 记录
      的 mtp 块都自带整套。按主干层的算子集合去排 MTP 块在这里反而是对的。
      (3) **没有 hc_head_*** —— ds-v4-flash 一族有一组 hc_head_{base,fn,scale}
      （[4, hidden×4] / [4] / [1]），这一代和 deepseek-v41-flash 一样没有。
      **`hc_sinkhorn_iters: 20` 是参数量看不见的那种负载**：每层每组要跑 20 次
      Sinkhorn 归一化迭代，一个权重都不占，算子表要单列。
      占参数量只有 0.011% 而**不能不算进激活** —— 它每层每 token 都走一遍，
      derive.py 的常驻名单里有 residual（同类机制在 Qwen3.8-Flash-Next 占激活 9.6%，
      这一代占 0.21%，口径一样）

precision:
  weights_release: [FP8_E4M3, BF16, FP32]
  # 三项都逐项写 repo。**不写的后果是 glm-5.3 踩过的那个**：三项全是
  # manifest_taken: true 且都没有 repo，读起来像「三种精度都来自主仓」——
  # 字面为真（那就是主仓内部的三种 dtype），但厂商另发了一个全 BF16 的仓之后，
  # 「BF16」这个键就有了两个所指。兄弟仓记在同级的 sibling_repos 里，
  # 由 validate.py 的 check_sibling_repos 卡住这两件事的区分
  weights_release_scope:
    FP8_E4M3: { repo: zai-org/GLM-5.3-Flash, manifest_taken: true, in_precision_table: true }
    BF16:
      repo: zai-org/GLM-5.3-Flash
      manifest_taken: true
      in_precision_table: true
      note: >-
        主仓**内部**的 BF16：1,141 个未量化张量、6,926,096,640 个元素（12.90 GiB），
        占参数量的 2.16%。**不要和同级 sibling_repos 里那个全 BF16 的
        zai-org/GLM-5.3-Flash-BF16 混为一谈** —— 那是另一个仓、38,479 个 BF16 张量
    FP32: { repo: zai-org/GLM-5.3-Flash, manifest_taken: true, in_precision_table: true }
  sibling_repos:
    - repo: zai-org/GLM-5.3-Flash-BF16
      rev: f9fed3bbc822
      dtype: BF16
      relation: undetermined
      name_set_identical: true
      shards: 120
      tensor_count: 38770
      params_total: 321323031390
      weight_bytes_total: 642646653816
      relation_evidence: >-
        **清单层面分不出方向，两条证据各指一边。**
        指向「它是主仓量化前的源」：主仓的 config 带
        quantization_config（quant_method fp8 / fmt e4m3 /
        weight_block_size [128,128] / activation_scheme dynamic /
        modules_to_not_convert 1,509 条），而这个仓的 config **没有**
        quantization_config —— 「convert」这个词预设了一个被转换的源；
        而且逐 dtype 的条数对得上：主仓 BF16 1,141 + F8_E4M3 37,338 = 38,479，
        逐位等于这个仓的 BF16 张量数，即主仓恰好量化了它的 38,479 个 BF16 张量中的 37,338 个。
        指向「分不出」：排 scale 后两仓的张量名集合逐条相同、逐张量形状逐位相同、
        HF 的 safetensors tally 逐位相同（321,323,031,390）。
        **上采假设在清单上留不下任何痕迹**：反量化 FP8 → BF16 得到的张量
        名字、形状、dtype、元素数全部与未量化源一致。
        两个仓的 createdAt 相差 1 分 51 秒（2026-08-25T06:43:14Z 与 06:45:05Z），
        是同一批建仓，不含信息；lastModified 这个仓晚 20 分钟
        （06:32:52Z → 06:53:11Z），而 1.5 TB 比 300 GB 上传更久，
        **推不出派生方向**。模型卡也答不了：这个仓的 README 与主仓的 diff
        只有一行 H1（`# GLM-5.3-Flash` → `# GLM-5.3-Flash-BF16`，+5 字节）
        加一个空行，关于它和主仓的关系一个字没有。
        **怎样才能定下来**：读张量数值。若它是上采，那么对主仓里被量化的任一张量，
        这个仓的每个元素都应恰好落在 E4M3 × 对应 block scale 的可表示集合上；
        有一个落不上就排除上采。只读分片头读不到数值，本轮没做
      method: >-
        逐分片读头取全：120 分片、38,770 个条目，failed_shards 为空、
        duplicate_tensors 为 0。**没有 weight_scale_inv**（未量化，不存在 scale 容器），
        所以条目数 38,770 逐位等于主仓的真权重张量数。
        逐 dtype：BF16 38,479 张 / 321,322,735,872 元素，F32 291 张 / 295,518 元素，
        合计 321,323,031,390 —— 与 HF 自己的 safetensors tally 逐 dtype 逐位相同，
        也与主仓排 scale 后的求和逐位相同。
        **F32 的 291 张两仓完全相同**（hc_*_base / hc_*_scale 180 张、
        A_log 与 dt_bias 68 张、e_score_correction_bias 43 张）——
        量化只动了 BF16 那一侧。
        落盘 642,646,653,816 B（598.51 GiB），是主仓 328,326,771,576 B
        （305.78 GiB）的 **1.957 倍**（不到整 2 倍：主仓多了 19,189,248 个 FP32
        scale 元素，少了 37,338 张张量的一半字节）
      note: >-
        **这个仓没有进逐子系统精度表**，也不该进：精度表的口径是 hf.repo 那一份权重
        （derive.py 拿 per_subsystem 当识别打包的承重件）。
        它也**不是** official_variants 的一条 —— 那个字段写的是「官方另发的量化**仓**」，
        origin 只有 native / post_quantized 两个值，对一个不是任何东西的量化结果的
        BF16 仓两句都是假的。填进去 check_variants 一个字都不会说
        （参数量逐位相同），而记录里那句 origin 会是假话
  quantization:
    method: fp8
    weight_format: e4m3
    weight_block_size: [128, 128]
    activation_scheme: dynamic
    per_subsystem:
      expert: FP8_E4M3
      shared_expert: FP8_E4M3
      dense_ffn: FP8_E4M3
      draft: FP8_E4M3
      # **attention 这一格记 MIXED，而且在这一代是安全的。**
      # 它跨 BF16（81.46%）与 FP8_E4M3（18.53%）两档，单值哪一边都是假的。
      # deepseek-v41-flash 的 draft 格明写「不能改成 MIXED」，理由是 derive.py
      # 拿这一格当打包因子的声明而 dtypes.BITS 里没有 MIXED 这个键 ——
      # **那条顾虑在这一代不成立**：全清单只有 F8_E4M3 / BF16 / F32 三种 dtype，
      # 没有任何打包容器（INT8/UINT8/INT32 零条，packing_applied 为空），
      # 所以这一格填什么都不参与还原，不丢数。与 minimax-m3.1-flash 的 draft
      # 能记 MIXED 同一个理由
      attention: MIXED
      indexer: BF16
      vision: BF16
      router: BF16
      residual: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    per_subsystem_scale:
      expert: FP32
      shared_expert: FP32
      dense_ffn: FP32
      attention: FP32
      draft: FP32
    per_subsystem_block:
      expert: '[128,128]'
      shared_expert: '[128,128]'
      dense_ffn: '[128,128]'
      attention: '[128,128]'
      draft: '[128,128]'
    per_subsystem_schemes:
      attention:
        - { dtype: BF16, tensors: 419, elements: 4867162112 }
        - { dtype: FP8_E4M3, block: '[128,128]', scale_dtype: FP32, tensors: 44, elements: 1107296256 }
        - { dtype: FP32, tensors: 68, elements: 280704 }
      draft:
        - { dtype: FP8_E4M3, block: '[128,128]', scale_dtype: FP32, tensors: 871, elements: 7373586432 }
        - { dtype: BF16, tensors: 17, elements: 59005696 }
        - { dtype: FP32, tensors: 1, elements: 288 }
      router:
        - { dtype: BF16, tensors: 42, elements: 49545216 }
        - { dtype: FP32, tensors: 42, elements: 12096 }
      residual:
        - { dtype: BF16, tensors: 90, elements: 35389440 }
        - { dtype: FP32, tensors: 180, elements: 2430 }
    block_size_note: >-
      config 声明的 [128,128] 与实测一致，**而且这一代一个不满块都没有** ——
      与 GLM-5.3 / DeepSeek V3 相反。判据是逐张量相除：
      kv_a_proj_with_mqa [512, 4096] 的 scale 是 [4, 32]，512 / 4 = 128 整除；
      q_a_proj [1536, 4096] → [12, 32]、q_b_proj [16384, 1536] → [128, 12]、
      o_proj [4096, 16384] → [32, 128]、专家 [2048, 4096] → [16, 32] 与
      [4096, 2048] → [32, 16]、稠密 [12288, 4096] → [96, 32]，全部整除。
      **根因就是 NoPE**：GLM-5.3 的 kv_a_proj_with_mqa 输出维 576 = 4×128 + 64
      （latent 512 + rope 64），末块只有 64 行、scale 是 5 条、本仓记作 128ceil；
      这一代 rope 段是 0，输出维恰好 512 = 4×128，那个坑**结构上消失了**。
      按「block 一律整除」写的反量化在这一代不会错位 —— 但这是这一代的性质，
      不是这条线的性质，下一代仍要逐张量量一遍。
      scale 容器实测全是 FP32，config 没有声明 scale 格式
    subsystem_method: >-
      全部来自完整权重清单（62 分片 76,108 条目）逐项统计，非抽样：每个条目都带
      shape 与 dtype，无缺失、无读失败分片（fetched.json 的 failed_shards 为空、
      duplicate_tensors 为 0），层索引 0–45 连续。
      归类用 scripts/lib/subsystems.py，与参数量口径同一份。
      发布权重不是纯 FP8：按元素数 FP8_E4M3 314,396,639,232（97.85%，292.80 GiB）、
      BF16 6,926,096,640（2.16%，12.90 GiB）、FP32 295,518 个真参数 +
      19,189,248 个 scale 元素（合计 74.33 MiB）。
      **这一代的量化面比 GLM-5.3 窄得多，而且窄在注意力上。**
      FP8 只覆盖 37,338 张：路由专家 36,288 张（304,405,807,104 元素）、
      MTP 块 871 张（7,373,586,432）、共享专家 126 张（1,056,964,608）、
      稠密 FFN 9 张（452,984,832），以及 11 个稀疏层各 4 张投影
      （q_a_proj / q_b_proj / kv_a_proj_with_mqa / o_proj，共 44 张 /
      1,107,296,256）。**没被量化的是整条线性注意力路径**：
      34 个 KDA 层的 408 张投影（q/k/v/o_proj、三条 conv1d、b_proj、
      两组低秩门）全是 BF16，加上 11 个稀疏层的 kv_b_proj [32768, 512]
      也全是 BF16 —— 于是 attention 桶按元素数 **81.46% 是 BF16、
      只有 18.53% 是 FP8**，和 GLM-5.3 那份（attention 整桶 FP8）方向相反。
      config 的 modules_to_not_convert 1,509 条与此一致（34 条 ×12 种 KDA 投影名、
      12 条 kv_b_proj、24 条 ×14 种视觉塔模块名等）。
      **三个桶内部不同质，整桶一个精度看不见：**
      attention 见上；draft 按元素数 99.21% 是 FP8_E4M3，但 17 个张量共
      59,005,696 元素是 BF16，其中 eh_proj [4096, 8192] 33,554,432 与
      kv_b_proj [32768, 512] 16,777,216 两张占 85.3% —— 假定「MTP 块整体 FP8」
      的引擎会在这两张上直接解错；
      residual（mHC）90 张 BF16 的 fn 矩阵配 180 张 FP32 的 base 与 scale，
      FP32 那 2,430 个元素是真参数不是 scale 容器，所以 per_subsystem_scale
      里没有 residual 项。
      router 桶的 42 个 mlp.gate.weight [288, 4096] 是 BF16，而 42 个
      e_score_correction_bias [288] 是 FP32 真参数；
      与 GLM-5.3 一样，indexer.k_norm.{weight,bias} 按 subsystems.py 的优先级
      （norm 在 indexer 之前）归在 norm 桶，不在 indexer 桶里 ——
      indexer 桶是 55 张纯 BF16（11 层 × 5 种：wk / wq_b / weights_proj /
      index_kpool_compress_ape / index_kpool_compress_gate）。
      视觉塔 347 张全 BF16，一张都没量化

