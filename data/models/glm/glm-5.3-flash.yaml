sources:
  - kind: modelcard
    url: https://huggingface.co/zai-org/GLM-5.3-Flash
    locator: config.json @ 46a050bec130
    accessed: '2026-11-18'
    note: >-
      FP8 发布（tags 带 fp8），62 分片。权重清单逐分片读头取全，76,108 个条目，
      failed_shards 为空、duplicate_tensors 为 0。
      **model_type 是 `glm5_next`，不是同代旗舰 GLM-5.3 的 `glm_moe_dsa`**；
      architectures 为 `Glm5NextForConditionalGeneration`，
      config 分 `text_config`（model_type `glm5_next_text`）与
      `vision_config`（`glm5_next_vision`）两段
  - kind: modelcard
    url: https://huggingface.co/zai-org/GLM-5.3-Flash/blob/46a050bec13002ad29ee795c16e61cf4fa3c4a9c/README.md
    locator: README.md 全文（73 行），Introduction 一节前两段
    accessed: '2026-11-18'
    note: >-
      卡正文原话（Introduction 第 1 段）：「the **first natively multimodal** model in the
      GLM-5 series」「With **320B total parameters and just 18B active parameters**」；
      第 2 段：「GLM-5.3-Flash **starts from a newly trained base model**, with its
      architecture and training recipe redesigned around capability and efficiency」
      「**For the first time in the GLM series**, we introduce a **hybrid architecture
      combining sparse and linear attention**」「also adopts **Manifold-Constrained
      Hyper-Connections (mHC)**」「latest **30T-token** multimodal pre-training corpus」。
      **没有每 token KV 字节、没有训练精度声明**（全文搜 kv.?cache / per-token /
      cache size|capacity|memory|footprint 命中 0；FP8 只出现在 tags 与
      quantization_config，正文一个字没提）。
      卡引了 z.ai/blog/glm-5.3-flash 与 arXiv 2602.15763（GLM-5 技术报告，
      同代 GLM-5.2 的卡也引了这一篇）—— **两篇本轮都没读**，见 open_questions
  - kind: repo
    url: https://huggingface.co/zai-org/GLM-5.3-Flash/blob/46a050bec13002ad29ee795c16e61cf4fa3c4a9c/processor_config.json
    locator: processor_config.json 全文（image_processor / video_processor 两段）
    accessed: '2026-11-18'
    note: >-
      视觉侧 token 预算的唯一一手来源：image_processor 的
      patch_size 14 / merge_size 2 / temporal_patch_size 2 /
      min_image_tokens 16 / max_image_tokens 8000；
      video_processor 另有 fps 2 与 max_image_tokens 240000。
      仓里**没有** preprocessor_config.json（取 404），所以分辨率分桶的细节只有这一份

