lineage:
  track: side
  # **故意不填 predecessor。** 判据两条，都不是印象：
  # (1) 厂商卡原话「starts from a newly trained base model, with its architecture and
  #     training recipe redesigned」；
  # (2) 清单实测 —— 排 scale 之后本记录 38,770 条、同代旗舰 GLM-5.3 59,585 条，
  #     **张量名集合的交集只有 1 条**（lm_head.weight），其余互不相干。
  # 给它挂 predecessor: glm-5.3 会让家族页的变化矩阵逐字段比两份记录，
  # 印出一条「78 层 → 45 层、6144 → 4096、MLA → hybrid」的演进链 ——
  # 而那不是演进，是两条线。本仓「和 lineage.predecessor 比，不和时间上的前一个比」
  # 这条规矩正是为此立的（支线按时间比会串出假链）。
  # 代价是它在家族页上是个孤点（glm-5.3 的 R20 记过这个形状）：
  # **这里是有意为之，不是漏填** —— 家族页要不要长出「另起一条线」这个概念，
  # 是站点侧的决定，不是这份记录能单方面定的，见 open_questions

