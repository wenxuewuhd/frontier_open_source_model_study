reviewed:
  date: '2026-11-18'
  scope:
    - official
    - derived
  reviewer: 单会话首录，未经独立核查代理
  method: >-
    **这份记录还没过 Gate C 的独立核查**，scope 里没有 judgement 就是这个意思 ——
    下面说的只是首录时自己做过的事，不是第二双眼睛看过。
    结构与精度全部对照完整权重清单（62 分片 76,108 条目，failed_shards 为空）
    穷举，不抽样：层集合（34 KDA / 11 DSA / 24 ViT / 1 MTP）、
    MLA 与 KDA 两套几何、indexer 的 12 层、逐子系统 dtype 与元素数、
    量化块逐张量相除、视觉塔的 347 张与分片隔离，都是在全清单上枚举出来的。
    参数量有一个独立外部支点：HF 平台自己从 62 个分片头统计的 safetensors tally
    逐 dtype 逐位相同（321,323,031,390）。
    两个 BF16 兄弟仓各自取了全量清单（120 / 282 分片）并与主仓逐张量对了名字与形状。
    mHC 的 [24, ·] 形状不变这一条是在全部 64 个 facts 目录上实扫出来的
    （命中 DeepSeek 五份 + MAGI-2 + Qwen 两份 + 本份）。
    **没做的**：没读 z.ai 博客与 arXiv 2602.15763、没读 transformers 的 glm5_next
    实现、没读任何张量数值（于是 index K 的条目粒度与 BF16 兄弟仓的派生方向
    两件都悬着）、昇腾侧引擎清单没重读。全部挂在 open_questions 上。
    缓存账按 .claude/skills/model-audit 的七问重走了一遍，
    第 2 问（缓存宽度取产出张量输出维，不是 config 头数乘积）与第 4 问
    （一个条目覆盖几个 token）是这一份的两个关口，后者没有答案

notes: >-
  GLM 家族的**原生多模态线首作**（2026-10-15），model_type `glm5_next`、
  pipeline_tag `image-text-to-text`、license mit。
  **它不是 GLM-5.3 的小档位**：排 scale 后两份清单的张量名集合交集只有 1 条
  （lm_head.weight），本记录 38,770 条、GLM-5.3 59,585 条；厂商卡也说它
  「starts from a newly trained base model」。所以 lineage 没有 predecessor
  （理由写在那个块的注释里），tracking.yaml 的「较小档位」条款不适用。
  下载量 638 万，是同代旗舰 GLM-5.3 的 3.7 倍。
  **本仓第一次同时见到四根轴**：NoPE MLA（qk_rope_head_dim 0 + mla_use_nope）、
  index K 池化（index_kpool 4 + index_kpool_compress）、
  mHC 出现在 DeepSeek 以外（hc_mult 4 / hc_sinkhorn_iters 20）、
  线性与稀疏混合在同一份权重里（34 层 KDA + 11 层 DSA + 24 层 ViT）。
  **激活参数与卡上「18B active」的对账**：本仓按清单实测，带宽口径
  16,742,333,246（−6.99%）、含输入词表的可比官方口径 17,376,721,726（−3.46%）、
  再加视觉塔 17,940,348,734（−0.33%）。最后一档最接近，**但「18B 的口径含视觉塔」
  是推论不是读到的** —— 卡没有定义它的口径，所以本记录不写 params.active_decode，
  三个数都在 data/derived/ 里，哪一个与 18B 可比是开着的问题。
  层数、宽度、注意力几何、层集合、专家分布、MTP 块构成、视觉塔结构与逐子系统精度
  全部对照完整权重清单核过，不是从模型卡抄的；
  top_k / index_topk / index_kpool / hc_sinkhorn_iters / routed_scaling_factor
  这类运行期标量只有 config 一个来源，清单只有名字、形状与 dtype，交叉验证不了。

open_questions:
  - >-
    **index K 的条目粒度定不下来，这是本轮最大的一个口径缺口。**
    config 的 index_kpool 4 / index_kpool_compress true /
    index_kpool_always_select_tail true 与权重侧的
    index_kpool_compress_ape [4, 128]、index_kpool_compress_gate [128, 4096]
    一起只能定两件事：池化窗口是 4、压缩后宽度是 128。
    **定不了缓存里存的是池化前（1,408 元素/token）还是池化后（352）** ——
    差 4 倍，而这一半占随上下文增长那部分的 20%。
    本记录取不折算的上界，与 glm-5.3 的 index K 口径保持一致（那份也是 1:1），
    这样两代的 6.764 倍才是同一套 basis 算出来的。
    要钉死得读实现（transformers 的 glm5_next 或 SGLang / vLLM 的 recipe），
    或读技术报告里 kpool 那一节。
    本仓 V4.1 的条目数因子错过一次（2.5 倍），所以这一条挂着
  - >-
    KV cache 与 KDA 递归状态的实际落盘精度都未披露。推导按 config
    text_config.dtype=bfloat16 兜底（2 B/元素；这是未被量化那些模块的落盘/计算
    dtype，不是权重存储的 FP8_E4M3），所以 14,080 B/token 与 74.375 MiB/序列
    都是 dtype_fallback 兜底口径。**递归状态尤其可疑**：线性注意力的状态常以 FP32
    保存（本仓 11 份 linear_state 记录里多数留着这条 open question），
    若实际是 FP32，那一半翻倍到 148.75 MiB/序列。
    与 DeepSeek V4.1 那个按落盘格式算出来的理论下限不能直接比倍数
  - >-
    **KDA 矩阵状态的布局没有一手来源。** 本记录按
    [num_value_heads 64, key_head_dim 128, value_head_dim 128] 估，
    这是 derive.py 的通用假设。短卷积那一侧有清单给的恒等式钉住
    （三条 conv1d 首维之和 24,576 逐位等于 2×64×128 + 64×128），
    矩阵状态这一侧没有任何张量能印证 —— 要读实现或实测显存
  - >-
    **mHC 的 24 与 3 这两个常数「是什么」已经定了，「为什么是它」还没有。**
    定了的那一半是实测：[24, hc_mult × hidden] + [24] + [3] 这组形状在本仓
    五份 DeepSeek V4 记录（hidden 4096 / 5120 / 7168）与本份上完全一致，
    MAGI-2 的 mhc_phi_fused_* 是 [hidden, 24] —— 同一个 24。
    所以它们是 mHC 公式自带的常数，不随宽度或 hc_mult 变。
    没定的那一半：config 里 mhc / hc_mult 4 / hc_sinkhorn_iters 20 / hc_eps 1e-06
    四个键没有哪一个等于 24 或 3，**不要去凑**（4×4 混合矩阵 16 项加 4 加 4 等于 24
    是一种讲得通的拆法，但那是编出来的，不是读到的）。
    要钉死得读 Manifold-Constrained Hyper-Connections 的定义（卡点名了这个全称）
    或技术报告的对应节。
    **另一半更该先查的是精度**：GLM 这一代 fn 是 BF16，五份 DeepSeek 与 MAGI-2 全是 FP32。
    mHC 的 Sinkhorn 迭代在低精度下是否稳定、BF16 是厂商的选择还是量化脚本的副作用，
    config 的 modules_to_not_convert 把 hc_* 逐条列了出来（即它没被 FP8 量化），
    但「为什么不是 FP32」没有来源
  - >-
    **FP8 量化为什么避开整条线性注意力路径，没有来源。**
    34 个 KDA 层的 408 张投影与 11 个稀疏层的 kv_b_proj 全是 BF16，
    config 的 modules_to_not_convert 把它们逐名列了出来（1,509 条），
    所以这是量化脚本的有意选择而不是遗漏。可能是增量规则对数值范围敏感、
    也可能只是那份排除清单的写法。要钉死得看量化脚本或技术报告
  - >-
    **config 的 `fused_qkvbfg_a_proj` 在权重里不存在**：
    modules_to_not_convert 里有 34 条这个名字，清单命中 0，
    真实张量是分开的 q_proj / k_proj / v_proj / b_proj / f_a_proj / g_a_proj。
    与 GLM-5.3 的 `indexers_proj` 同一个形状，本次同样没出事（那些张量恰好全是 BF16）。
    但还有一层**本代独有**的：modules_to_not_convert 的全限定名前缀是
    `model.layers.N.`，而清单里每个主干张量都是 `model.language_model.layers.N.`
    —— 前缀对不上。同一份清单里另有裸模块名（`attn_mha` / `attn_mqa` /
    `router` / `weights_proj` / `visual` / `lm_head` / `dt_bias` /
    `hyper_connection` / `mapping_proj`），那几条按子串是能匹配上的。
    所以「排除清单到底靠哪一类条目生效」取决于 transformers FP8 量化器的匹配规则
    （前缀还是子串），本轮没读那段代码。**实测结果是对的**（该不量化的 1,141 张
    确实没被量化），所以这只影响「照这份 config 做再量化会不会一样」这个问题
  - >-
    视觉侧 `max_image_tokens: 8000` 的口径没写明：是池化后的主干 token 数，
    还是池化前的 patch 数？本记录按前者填进
    arch.vision.tokens.max_llm_tokens_declared；若是后者，上限应是 2,000。
    同一份 processor_config 的 video_processor 另有 max_image_tokens 240000
    与 fps 2，视频那一侧的 token 账本记录没有算。
    另有 `patch_expand_factor: 1` 这个键含义无来源
  - >-
    **两篇一手材料本轮都没读**：z.ai/blog/glm-5.3-flash 与
    arXiv 2602.15763（GLM-5 技术报告，卡的 Citation 一节给了 bibtex）。
    上面挂着的 index K 池化语义、mHC 的 24/3 宽度、FP8 排除线性路径的理由、
    以及每 token KV 字节有没有官方公布值，都该先在这两篇里找。
    按本仓的来源优先级（技术报告 > 模型卡），读了之后要按节号回填并关掉对应条目
  - >-
    本记录在 GLM 家族页上没有前代连线（lineage 没有 predecessor，理由见那个块的注释）。
    **家族页要不要长出「另起一条线」这个概念**，是站点侧的决定：
    现在的 changesFor 只认 lineage.predecessor，一条线的首作必然是孤点，
    而「孤点」与「还没补 predecessor」在页面上长得一样 ——
    glm-5.3 的 R20 正是后者。这一条留给名册与站点那一侧定
  - >-
    昇腾侧的引擎支持未查（platforms 里那一条是 status: unknown）。
    GLM-5.3 的两条昇腾条目来自 vllm-ascend 的 supported_models.md
    行级定位，本轮没有重读那份清单
