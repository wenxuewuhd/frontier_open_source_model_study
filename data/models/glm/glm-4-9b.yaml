hf:
  repo: zai-org/glm-4-9b-chat
  sha: bd8234fe5e0c09c48637a92abb0c797cb5fa0e73
  last_modified: '2025-03-13T15:48:14.000Z'
  gated: false

lineage:
  track: historical
  successor: glm-4-32b-0414
  # 家族链首，没有 predecessor。照 ds-v2 的做法，这里写的是「起点带着什么」——
  # 站点的「逐维度演进」在起点要有东西可读，否则这条线从第二份才开始。
  changed_from_predecessor:
    - axis: attention
      text: >-
        GQA 2 组（32 query 头 / 2 KV 头 / head_dim 128），QKV 融合成一张
        query_key_value [4608, 4096] 并带 bias，o_proj 叫 self_attention.dense。
        没有 MLA、没有稀疏、没有滑窗、没有跨层共享 —— 40 层逐层全量存
      benefit: >-
        这是整条 GLM 线的缓存基线：每层 2 × 2 × 128 = 512 元素，
        每 token 20480 元素。后面三代（GLM-4.5 把 KV 头加到 8、
        GLM-4.7-Flash 换 MLA、GLM-5 叠 DSA）都是相对这个基线在动。
        GQA 2 组在 2024 年已经是很激进的压缩（MHA 同配置是 32 组、8192 元素/层），
        所以这一代的 KV 不是瓶颈，瓶颈在稠密 FFN 的权重带宽
    - axis: moe
      text: 没有 MoE，40 层全是稠密 FFN（中间维 13696，gate 与 up 融合成一张 [27392, 4096]）
      benefit: >-
        激活参数等于除输入词表以外的全部权重（8,779,194,400），
        decode 每 token 要搬 16.35 GiB —— MoE 要到 GLM-4.5 才进来，
        在那之前放大规模就是等比例加重带宽
    - axis: precision
      text: BF16 直接发布，config 没有 quantization_config，284 个张量全是 BF16
      benefit: >-
        不量化、没有 scale 容器、没有低位打包，所以条目数即张量数、numel 即参数数。
        这一代是整条线的精度起点：FP8 到 GLM-4.5 才有单独的 FP8 仓，
        到 GLM-5.3 才变成主仓
    - axis: decoding
      text: 没有 MTP 草稿块（config 无 num_nextn_predict_layers，层号止于 39）
      benefit: >-
        没有草稿侧成本，也没有「草稿块要不要算进 KV 层数」这个口径问题 ——
        那两件事从 GLM-4.5 开始，而且在 4.5 / 4.6 / 4.7 / GLM-5 四代里变过两次

params:
  total: 9399951392.0
  breakdown:
    dense_ffn: 6731857920.0
    attention: 1426247680.0
    embed: 620756992.0
    lm_head: 620756992.0
    norm: 331776.0
    other: 32.0
  counting_note: >-
    按完整权重清单（10 分片 284 条目）逐项求和，与 HF 平台自己从分片头统计的
    safetensors tally（9,399,951,392）逐位相同。清单 284 个条目全是 BF16：
    没有量化 scale 容器、没有低位打包，条目数即张量数、numel 即参数数。
    没有 MTP 草稿块（config 无 num_nextn_predict_layers，层号止于 39），所以没有 excludes。
    **名字里的 9B 是唯一可对账的声明值（模型卡正文没有参数量数字，已逐行核过），而它对不上**：实测 9.40B 对 9B 是 +4.44%，
    超出 Gate B 的 2% 容差。扣掉输入词表（620,756,992）后的语言主干是 8.78B，
    对 9B 是 −2.45%，同样超出 —— 两种口径都不落在容差内，所以这个 9B
    更可能是档位命名而不是参数量声明。本记录不填 params 之外的声明值，
    把这件事写在这里。
    词表与输出层不共享权重（word_embeddings 与 output_layer 各 620,756,992），两项都在 total 里。
    Gate B 的「参数总量」一项（delta 0.0）因此是**拿实测比实测，不构成核对** ——
    真正的外部核对是 HF 的 safetensors tally，它不依赖本仓任何一行代码。
    other 一项是 rotary_pos_emb.inv_freq [32]：非训练缓冲区，被打包进了 safetensors，
    所以计进了 total —— 32 个元素，不影响任何口径。
    **这里的 breakdown 与 data/derived/glm-4-9b.json 的 params_by_subsystem 现已逐项相同，
    两边的 other 都只有 inv_freq 一张（32 元素）。**
    **原先不是这样**：scripts/lib/subsystems.py 的归类正则认不出 chatglm 这一代的张量名
    （self_attention.query_key_value / self_attention.dense / word_embeddings），
    把注意力 1,426,247,680 + 输入词表 620,756,992 + inv_freq 32 共 2,047,004,704
    整块归进了 other 桶，于是派生 JSON 的 other 这个键和本记录的指的不是同一批张量。
    同一个缺口还让派生的激活参数偏高：输入词表被算成常驻，
    total_with_embed 与 total 相等且都报 9,399,951,392（偏高 620,756,992，+7.07%）。
    正则已修（attention 加 self_attention|query_key_value、embed 加 word_embeddings，见 R14），
    重跑后派生分桶是 embed 620,756,992 + attention 1,426,247,680 + other 32，
    带宽口径 active_params.total **9,399,951,392 → 8,779,194,400**
    （不再等于 total_with_embed 9,399,951,392），excluded.embed_tokens 0 → 620,756,992

context:
  max: 131072

arch:
  layers: 40
  hidden: 4096
  vocab: 151552
  norm: RMSNorm
  norm_eps: 1.5625e-07
  activation: SwiGLU（dense_h_to_4h 把 gate 与 up 融合成一张 [27392, 4096]，27392 = 2 × 13696）
  position: >-
    RoPE，base 5,000,000 = 10000 × config.rope_ratio 500（乘子语义取自仓内
    modeling_chatglm.py 的 RotaryEmbedding.forward_impl: `base = base * self.rope_ratio`）。
    只作用在每头前 64 维、剩下 64 维直通（rotary_dim = kv_channels 128，
    RotaryEmbedding 取 128 // 2 = 64），等价于后来 GLM-4-0414 显式声明的
    partial_rotary_factor 0.5 —— 清单里的 rotary_pos_emb.inv_freq [32] 正是 64 // 2，
    独立印证了这个维数。成对交错旋转（reshape 成 [..., 32, 2]），不是前后半分，
    GLM-5 一代 config 里的 rope_interleave=true 延续的就是这个约定

  attention:
    type: GQA
    num_heads: 32
    num_kv_heads: 2
    head_dim: 128
    head_dim_note: >-
      head_dim 不是 config 字段，128 来自 kv_channels；config 的 multi_query_group_num=2
      就是 num_kv_heads。QKV 融合成一张 query_key_value [4608, 4096]：
      4608 = 32 头 × 128（Q）+ 2 × 128（K）+ 2 × 128（V），与实现里
      `qkv_hidden_size = projection_size + 2 * head_dim * multi_query_group_num` 逐项对上。
      Q、K、V 都带 bias（add_qkv_bias=true 而 add_bias_linear=false，所以只有这一处有 bias）；
      o_proj 在这一代叫 self_attention.dense [4096, 4096]，没有 bias。
      缓存宽度按 KV 头算：2 × 2 头 × 128 = 512 元素/层/token，不是按 32 个 query 头算
      （那会得 8192，高估 16 倍）
    layer_pattern: 40 层同构，每层都产出自己的 KV，无跨层共享、无滑窗、无稀疏

  ffn:
    type: dense
    intermediate: 13696
    layer_pattern: >-
      40 层全是稠密 FFN，没有 MoE。单层 FFN 168,296,448 参数，是单层注意力
      35,656,192 的 4.72 倍 —— 权重几乎全在 FFN 上：
      占总参数 71.6%（6,731,857,920 / 9,399,951,392），占带宽口径 76.7%
      （分母换成 8,779,194,400，即扣掉输入词表）

precision:
  weights_release: [BF16]
  weights_release_scope:
    BF16: { manifest_taken: true, in_precision_table: true }
  quantization:
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（10 分片 284 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空。284 个条目的 dtype 全是 BF16，所以各子系统 BF16 是全量结论，
      不只是代表值。这一代没有 quantization_config，不存在 scale 张量与量化块

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    caveat: custom_code 仓，需 trust_remote_code；不走 transformers 主干的 GlmForCausalLM 实现
    ref:
      kind: modelcard
      url: https://huggingface.co/zai-org/glm-4-9b-chat
    visibility: public

bottlenecks:
  - dimension: weight-bandwidth
    finding: >-
      稠密 9.4B、无 MoE，除输入词表以外的权重每 token 全部搬运 ——
      带宽口径的激活参数是 8,779,194,400（total 9,399,951,392 减输入词表 620,756,992），
      占总参数 93.4%。**派生 JSON 一度把这个数报成 9,399,951,392**，
      因为归类缺口让输入词表被算成常驻；缺口已修，派生值现在也是 8,779,194,400
      （见 params.counting_note 与 R14）。
      decode 的瓶颈完全在权重带宽上，而不在 KV 容量：BF16 下每 token 要搬运
      16.35 GiB 的权重（带宽口径 8,779,194,400 × 2 B；**权重存储是 17.51 GiB，
      两个口径差输入词表那一项，不要混用**），对 128K 上下文的 KV
      （40960 B/token、总 5.0 GiB）是绝对主导。
      这是后面几代改 MoE 的起点动机。
    quantified: >-
      权重存储 17.51 GiB（BF16，含输入词表）；带宽口径每 token 16.35 GiB。
      dense_ffn 占总参数 71.6%（6,731,857,920 / 9,399,951,392）、
      占带宽口径 76.7%（/ 8,779,194,400）—— 两个分母不同，引用时要带口径
    visibility: public
  - dimension: kv-capacity
    finding: >-
      GQA 2 组把 KV 压到每层 512 元素，按 query 头数（32）算会高估 16 倍。
      这一代没有任何跨层共享、滑窗或稀疏结构，40 层逐层全量存，
      所以 KV 随层数与上下文线性增长，但基数小。
    quantified: >-
      2 × num_kv_heads 2 × head_dim 128 = 512 元素/层/token × 40 层 = 20480 元素/token。
      KV 落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底（2 B/元素）得
      40960 B/token、128K 上下文 5.0 GiB —— dtype_fallback 兜底口径，不是实测落盘量
    visibility: public

infra_signals:
  - text: >-
      GLM 家族的注意力起点是常规 GQA（32 query 头 / 2 KV 组、head_dim 128），
      FFN 全稠密。整条 2024–2026 的演进线（GQA → MLA → MLA+DSA）就从这里开始，
      算子侧这一代不需要任何非标准支持：融合 QKV + GQA + SwiGLU + RMSNorm。
      唯一需要注意的是 rope 只作用在每头前 64 维且成对交错 ——
      按全维或按前后半分实现都会算错位置编码。
      成对交错这个约定在 GLM-5 一代的 config 里又被显式声明了一次
      （rope_interleave=true，GLM-5 / 5.1 / 5.2 / 5.3 四份都有）；
      中间的 GLM-4.5–4.7 与 GLM-4.7-Flash 的 config **没有这个键**，
      所以本仓只能说两个端点一致，说不了「一直延续」—— 中间几代要读实现才知道。
    evidence: derived
    horizon: settled
    axis: attention

