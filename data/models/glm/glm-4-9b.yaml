  - >-
    KV cache 的实际落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底，
    bytes_basis 是 dtype_fallback，不能和别人按落盘格式算出来的理论下限比倍数
  - >-
    训练精度无一手声明。config 只有 torch_dtype=bfloat16（落盘/计算 dtype）；
    **模型卡正文已读（173 行），里面没有任何训练精度的说法**，所以 precision.training 不填
  - >-
    同期还有 glm-4-9b-chat-1m（同一天发布，HF sha f8579ac09698，config 已取到
    facts/glm-4-9b-chat-1m/）：逐键比对只差三项加一个元字段 ——
    multi_query_group_num 2 → 4、rope_ratio 500 → 10000、seq_length 131072 → 1048576
    （另有 _name_or_path）。
    KV 头数翻倍意味着它的缓存宽度是本记录的 2 倍（1024 元素/层/token），
    不是同一份权重的再标注。本仓按「较小档位只在有结构对照价值时才录」没有收它 ——
    若后面要讲 GLM 的长上下文路线，它是该补的一份
