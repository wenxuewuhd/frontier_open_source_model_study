notes: >-
  GLM 家族在本仓的谱系起点，也是 2024 年这一代的开放权重代表（当期的 GLM-4 旗舰只有 API，
  没有公开权重）。结构是常规 GQA + 稠密 FFN，没有 MoE、没有 MTP、没有量化。
  层数、宽度、注意力几何、QKV 融合宽度、参数量与逐子系统精度都对照完整权重清单核过；
  rope 的 base 乘子与作用维数读的是仓内 modeling_chatglm.py；
  清单里的 inv_freq [32] 只能独立印证**作用维数**（32 = 64 // 2），
  **印证不了 base = 5,000,000** —— 清单只有名字、形状与 dtype，没有张量数值，
  而 inv_freq 在实现里是用硬编码 10000 建的、不带 rope_ratio。
  config 的 apply_query_key_layer_scaling / attention_softmax_in_fp32 这类运行期开关
  只有 config 与实现两个来源，清单核不了（清单只有名字、形状与 dtype）。

