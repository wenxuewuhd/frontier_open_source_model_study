reviewed:
  date: '2026-10-29'
  scope:
    - official
    - derived
    - judgement
  reviewer: 三个独立核查代理分管互不重叠的因子组，结论互不可见
  method: >-
    按 .claude/skills/model-audit 的提问顺序分三路，各管一组因子、结论互不可见：
    一路核结构几何与层集合（对 118629 条清单穷举，不抽样），
    一路独立重算缓存账（代替当时还没跑过的 Gate B），
    一路核逐子系统精度与记账卫生（含 Gate C 的 evidence 继承链解析）。
    三路在重叠处互相印证：MTP 块的层覆盖、modules_to_not_convert 的 22 条、
    indexer 的 21 层集合三处都由两路以上各自算出同一结果。
    本会话独立复算的部分是：scale 判据在全部 11 份 facts 上的新旧分类差异、
    ds-v3 / ds-v3.2-exp / glm-5.3 的参数总量与子系统拆分、以及 derive.py 的
    KV 公式路输出。其余计数（量化块的逐对相除、97.9% 的分母、
    排除清单的逐条比对）依据的是代理在完整清单上的枚举，未逐项重跑。
review:
  - id: R1
