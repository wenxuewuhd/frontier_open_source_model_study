notes: >-
  GLM 家族的当前旗舰（2026-10-14），model_type 为 glm_moe_dsa：MLA 配
  DeepSeek 式 DSA 稀疏选择。本仓第一份非 DeepSeek 的稀疏注意力记录，
  用来和 DeepSeek 线做对照 —— 两家都叫「稀疏注意力」，省的却不是同一笔账
  （见 bottlenecks 的 kv-capacity 一条）。
  层数、宽度、注意力几何、indexer 层集合、专家分布、MTP 块构成与逐子系统精度
  全部对照完整权重清单核过，不是从模型卡抄的；top_k / index_topk /
  routed_scaling_factor 这类运行期标量只有 config 一个来源，
  清单只有名字、形状与 dtype，交叉验证不了。

open_questions:
  - >-
    KV cache 的实际落盘精度未披露。推导按 config 声明的 dtype=bfloat16 兜底
    （2 B/元素；这是未量化模块的落盘/计算 dtype，不是权重存储的 FP8_E4M3），
    所以 95232 B/token 是 dtype_fallback 兜底口径，不能和 DeepSeek V4.1 那个
    按落盘格式算出来的理论下限（890 B/token）直接比倍数 —— 两种口径不同。
    若实际落盘是 FP8_E4M3，1M 上下文的真值是 46.5 GiB，差整整 2 倍
  - >-
    DSA 的 topk 是「选读」还是「选存」，config 的 index_topk / index_topk_freq /
    index_skip_topk_offset 三个字段都定不了，要读实现。当前按 1:1 逐 token 计费，
    依据是本仓对 V4.1 的既有口径（那份同样有 index_topk，全局 KV 仍按 per-token
    线性计费）加机制推理（跨层复用选择要求全历史的 latent 与 index K 都在）。
    若其实是「只存 topk 个」，这笔账要整个搬到 per_sequence 口径 ——
    那不是折算，是账的形状变了。本仓 V4.1 的条目数因子错过一次（2.5 倍），
    所以这一条挂着
  - >-
    weights_proj 为什么保持 BF16 没有来源。config 的 modules_to_not_convert 里
    那一项拼成了 indexers_proj、匹配不上任何真实张量（见 infra_signals），
    那就不是它保护下来的。可能是厂商量化脚本走另一套规则（比如 [32, 6144] 的
    首维 32 不足一个 128 块），也可能这份 config 是量化之后补写的。
    要钉死得看量化脚本或 transformers 的 FP8 量化器行为
  - >-
    训练精度无一手声明。config 只有 dtype=bfloat16，它描述的是未被量化的那些
    模块的落盘 dtype（本次就是那 2.1B BF16 张量），不是训练精度；模型卡 tags
    只有 fp8。所以 precision.training 这个字段不写，要补得读模型卡正文或论文
  - >-
    config 的 index_share_for_mtp_iteration=true 声称 MTP 迭代共享 index，
    但 MTP 块（第 78 层）权重里自带一整套 indexer（wk/wq_b/weights_proj/k_norm）。
    共享的到底是选择结果还是 K 本身，config 定不了，要读实现
  - >-
    shared 层复用的是哪一个 full 层的选择（最近的上游、还是固定映射），
    以及 index_skip_topk_offset=3 在其中的作用，config 不足以确定
  - >-
    激活参数无任何外部值可对账，只有本仓按权重清单的统计，而且带宽口径与
    可比官方口径是两个数（见 data/derived/）。总参数那一半已经不是孤证：
    厂商没声明，但 HF 平台自己从 141 个分片头统计的 safetensors tally
    （753,329,940,480，同样排 scale）与本仓逐 dtype 逐位相同
  - >-
    另有 FP8 之外的发布变体与否未核（模型卡 tags 只有 fp8），
    若存在 BF16 版，其量化配置差异未对照
