hf:
  repo: zai-org/GLM-5.3
  sha: ba32f8c19c8738e2c57c71798c601d477a7bf844
  last_modified: '2026-10-14T12:22:48.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: main
  predecessor: glm-5.2
  changed_from_predecessor:
    - axis: precision
      text: >-
        主仓的发布精度从 BF16 换成 FP8_E4M3。**结构轴（层数、宽度、层集合、
        专家分布、MTP 构成）零差异，但两份清单的条目数不同**：
        本记录的清单是 118629 条、GLM-5.2 是 59585 条 —— 多出的 59044 条是新增的
        weight_scale_inv 容器（见 counting_note），加载器要多读这一批。
        真权重那 59585 条与 GLM-5.2 的名字、形状逐个相同（逐条比对过，不是抽样），
        59044 个从 BF16 换成 F8_E4M3，其余 541 个（embed / lm_head / router gate /
        draft 的 eh_proj / indexer 的 weights_proj / norm / e_score_correction_bias）
        保持 BF16 或 F32。config 新增 quantization_config
        （quant_method fp8 / fmt e4m3 / weight_block_size [128,128] /
        activation_scheme dynamic / **modules_to_not_convert 541 条** ——
        与那 541 个未量化张量一一对应，逐模式计数是 norm 四类各 79 +
        mlp.gate 76 + e_score_correction_bias 76 + indexers_proj 22 +
        indexer.k_norm 22 + k_norm.bias 22 + 单例 7；
        本记录 infra_signals 与 R15 说的「22 个」只是其中 indexers_proj 那一种的份数，
        不是整张清单的长度），
        其余字段只差 transformers_version（5.12.0 → 5.15.0）
      benefit: >-
        权重存储 1403.19 GiB → 703.72 GiB（1.99 倍），而**按清单实测的参数量**
        两代逐项逐位相同（都是 753,329,940,480）—— 省的是存储与带宽，
        不是容量口径下的「模型多大」。
        注意本记录 params 里存的是 6 位有效数字的取整值（total 753,330,000,000，
        breakdown 十项求和 753,330,181,660），所以「逐位相同」说的是清单实测值，
        不是两份记录的存值；glm-5.2 存的是精确值。
        这 1.99 倍不到整 2 倍，差额来自 45,853,104 个 FP32 的 per-block scale 元素
        （175 MiB）与 541 个未量化张量（3.92 GiB BF16 + 19,456 个 F32 真参数）。
        代价有两笔：反量化要按 [128,128] 的块走，而 kv_a_proj_with_mqa 的输出维
        576 = 4×128 + 64 末块不满（记作 128ceil）；以及两个桶内部不同质
        （indexer 的 weights_proj、draft 的 eh_proj 仍是 BF16），
        按「整桶 FP8」写的加载器会在这两处解错 —— 见 precision.quantization.subsystem_method
    - axis: training
      text: >-
        许可从 mit 换成 other（repoinfo 的 tags 由 license:mit 变 license:other，
        cardData 另有 license_name: glm-5.3）。GLM-4-32B-0414 起整条线一直是 mit，
        到本代才换回自有条款
      benefit: >-
        与结构和负载无关，但它决定下游能不能直接商用分发 ——
        而 license 挂在顶层、容易继承 official 而不进人工复核
        （Qwen 一轮的教训三就是这个字段）
    - axis: context
      text: 1048576（与 GLM-5.2 相同），rope theta 8,000,000 也相同
      benefit: >-
        上下文与位置编码一个字没动。KV 每 token 47616 元素 / 95232 B
        （BF16 兜底口径）与 GLM-5.2 逐位相同 —— 发布权重换成 FP8
        **不推定 KV 也存 FP8**，缓存属激活侧，没有一手来源（见 open_questions）

params:
  total: 753330000000.0
  breakdown:
    expert: 724776000000.0
    attention: 12871500000.0
    draft: 9952920000.0
    shared_expert: 2831160000.0
    embed: 951583000.0
    lm_head: 951583000.0
    dense_ffn: 679477000.0
    indexer: 196805000.0
    router: 117984000.0
    norm: 1169660.0
  counting_note: >-
    按完整权重清单（141 分片 118629 条目）逐项统计。118629 是 safetensors 条目数，
    其中 59044 条是 weight_scale_inv（FP8 的 per-block scale 容器）—— 不计入参数、
    只计入权重存储；真权重张量 59585 条。厂商未在 config 或模型卡里声明总参数或
    激活参数（**模型卡正文已逐行核过，90 行里没有参数量数字**），
    total 是本仓按清单求和的实测值，不是声明值；它与 HF 平台自己从分片头
    统计的 safetensors tally（753,329,940,480，同样排 scale）逐 dtype 逐位相同。
    前代 GLM-5 的卡声明过 744B / 40B，且那个声明值的口径是「不含 MTP 块」
    （见 glm-5 的 counting_note）；本代与 GLM-5.2 的卡都没有再声明，
    所以本记录没有可填的 params.excludes —— 这是「厂商没说」，不是「含草稿侧」。
    全清单 dtype 只有 F8_E4M3 / BF16 / F32 三种，无 INT8/UINT8 打包容器，
    numel 即参数数，不需还原。
    total 与 breakdown 取 6 位有效数字，所以 breakdown 十项求和（753,330,181,660）
    与 total（753,330,000,000）并不相等，两者都不等于清单实测的 753,329,940,480 ——
    精确值在 data/derived/glm-5.3.json 里。也因此 Gate B 的「参数总量」一项
    （delta_pct −0.0、status ok）是**拿取整的实测值比实测值，不构成核对**；
    真正的外部核对是 HF 的 safetensors tally。
    **total 含草稿侧**：breakdown 的 draft 一项（第 78 层整块）在 total 之内，
    没有 excludes。激活参数有带宽口径与可比官方口径两套，见 data/derived/，
    这里不写单一值 —— 两者不是同一个量。

context:
  max: 1048576

arch:
  layers: 78
  hidden: 6144
  vocab: 154880
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: SwiGLU
  position: RoPE theta 8e6，interleave

  attention:
    type: MLA
    num_heads: 64
    num_kv_heads: 64
    head_dim: 256
    v_head_dim: 256
    head_dim_note: >-
      每头 QK 全宽 256（config 的 qk_head_dim，= qk_nope 192 + qk_rope 64），V 每头
      也是 256，两者相等。不对称只在 kv_b_proj [28672, 512] 内部：28672 = 64 ×
      (K-nope 192 + V 256)，K 的 rope 64 维由 kv_a_proj_with_mqa 的尾段直接产出、
      不经 kv_b_proj。**config 的 head_dim=192 等于 qk_nope 段，不是 QK 全宽** ——
      拿它推 o_proj 入口会得 64×192=12288，比实测的 16384 低 25%。
      本记录的 head_dim 填 256（两段相加），不抄 config 这个键。
      方向与 DeepSeek 一代相反：那边 v_head_dim 比 head_dim 小，按 head_dim 推是高 50%。
      另外 num_kv_heads=64 是 query 侧可见的 KV 头数，不是缓存宽度：落盘缓存是
      kv_a_proj_with_mqa 的 576 维 latent（kv_lora 512 + rope 64），
      按 2×64×256=32768 折算会高估 56.9 倍
    qk_rope_head_dim: 64
    qk_nope_head_dim: 192
    kv_lora_rank: 512
    q_lora_rank: 2048
    sparse:
      mechanism: >-
        DSA indexer 选 token。L0 / L1 / L2 各自算一次 topk，之后每 4 层一次
        （L2+4k，止于 L74），主干共 21 层产出；其余 57 层复用上游那一次的选择结果。
        间隔序列是 1,1,4,4,… 而不是均匀的 4 —— 按「每 4 层」从 L0 起推会得到
        0,4,…,76 共 20 层，层数和层号都错（config index_topk_freq=4，
        前三层的例外疑与 index_skip_topk_offset=3 有关，见 open_questions）。
        MTP 块（L78）另有完整一套
      index_n_heads: 32
      index_head_dim: 128
      index_topk: 2048
      index_kv_dim: 128
      index_kv_source: >-
        model.layers.N.self_attn.indexer.wk.weight [128, 6144]，输出维 128。
        index_n_heads × index_head_dim = 32 × 128 = 4096 是 32 倍的上界：
        index K 在 32 个 index 头之间共享，不是逐头
    kv_sharing:
      index_kv_source_layers:
        [0, 1, 2, 6, 10, 14, 18, 22, 26, 30, 34, 38, 42, 46, 50, 54, 58, 62, 66, 70, 74]
      layer_coverage: >-
        三种覆盖面各不相同，不能统称「逐层」。以下层数都是**主干口径**（0–77）：
        全量 MLA KV 在 78/78 层（每层都有 kv_a_proj_with_mqa [576, 6144]，无跨层共享）；
        indexer 整套（wk / wq_b / weights_proj / k_norm）只在 21 层，即 config
        indexer_types 里的 full；其余 57 个 shared 层**连一个 indexer 张量都没有**
        （按全名正则穷举过，不是抽样）。
        另有 MTP 块（第 78 层）自带一整套 indexer，也自带自己的 kv_a_proj_with_mqa；
        indexer_types 长度只有 78、只覆盖主干 0–77，按它数会漏掉这一套。
        所以权重清单里产出 MLA KV 的层共 79 个、产出 index K 的共 22 个，
        开 MTP 时要按这两个数算
      note: >-
        GLM 的 shared 层与 DeepSeek V4.1 的「重打分层」不是一回事，schema 的
        index_rescore_layers 在这里不适用，故留空：V4.1 的重打分层有 wq_b/weights_proj、
        只是不产出 K，仍要逐层算一次打分；GLM 的 shared 层一个 indexer 张量都没有，
        复用的是上一个 full 层的 **topk 选择结果**本身（config index_topk_freq=4）。
        前者是「K 共享、打分不共享」，后者是「选择共享」—— 算子图与访存都不同

  ffn:
    type: moe
    layer_pattern: >-
      第 0–2 层稠密（intermediate 12288），其余 75 层为 MoE；MTP 块（第 78 层）也是 MoE。
      稠密层的 FFN 比单个专家宽 6 倍，是全模型最宽的单个 GEMM —— 单层 226,492,416 参数，
      是一层注意力 165,019,648 的 1.37 倍

  moe:
    routed_experts: 256
    shared_experts: 1
    top_k: 8
    intermediate: 2048
    first_k_dense: 3
    dense_intermediate: 12288
    routing: sigmoid 打分、noaux_tc 选路，routed_scaling_factor 2.5，打分走 FP32
      （config moe_router_dtype=float32，而 gate 权重是 BF16）
    balance: e_score_correction_bias（无辅助损失）
    storage_note: >-
      逐专家独立张量（mlp.experts.N.{gate,up,down}_proj），不是堆叠的 3 维权重。
      grouped GEMM 因此吃 2 维张量列表；EP 切分按张量分配，不按首维切。
      n_group=1 且 topk_group=1，分组路由实际未启用

  decoding:
    mtp_layers: 1

precision:
  weights_release: [FP8_E4M3, BF16, FP32]
  weights_release_scope:
    FP8_E4M3: { manifest_taken: true, in_precision_table: true }
    BF16: { manifest_taken: true, in_precision_table: true }
    FP32: { manifest_taken: true, in_precision_table: true }
  quantization:
    method: fp8
    weight_format: e4m3
    weight_block_size: [128, 128]
    activation_scheme: dynamic
    per_subsystem:
      expert: FP8_E4M3
      shared_expert: FP8_E4M3
      attention: FP8_E4M3
      indexer: FP8_E4M3
      dense_ffn: FP8_E4M3
      draft: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    per_subsystem_scale:
      expert: FP32
      shared_expert: FP32
      attention: FP32
      indexer: FP32
      dense_ffn: FP32
      draft: FP32
    per_subsystem_block:
      expert: '[128,128]'
      shared_expert: '[128,128]'
      attention: '[128,128]+[128ceil,128]'
      indexer: '[128,128]'
      dense_ffn: '[128,128]'
      draft: '[128,128]+[128ceil,128]'
    block_size_note: >-
      config 声明的 [128,128] 与实测一致 —— 这一代没有 DeepSeek V4 那种
      「声明 [128,128]、FP4 专家实为 [1,32]」的分歧。但 kv_a_proj_with_mqa
      输出维 576 = 4×128 + 64，scale 是 5 条，末块不满（记作 128ceil）。
      按「block 一律整除」写的反量化会在这个张量上错位 —— 和 DeepSeek V3
      同一个张量、同一个坑。
      scale 容器实测全是 FP32，config 没有声明 scale 格式
    subsystem_method: >-
      全部来自完整权重清单（141 分片 118629 条目）逐项统计，非抽样：每个条目都带
      shape 与 dtype，无缺失、无读失败分片（fetched.json 的 failed_shards 为空）。
      归类用 scripts/lib/subsystems.py，与参数量口径同一份。
      发布权重不是纯 FP8：按元素数 FP8_E4M3 751,226,191,872（699.63 GiB）、
      BF16 2,103,729,152（3.92 GiB）、FP32 19,456 个真参数 + 45,853,104 个 scale 元素
      （合计 175 MiB）—— 只报 FP8 会被误读成纯 FP8 模型。
      两个桶内部不同质，整桶一个精度看不见：
      indexer 按元素数 97.9% 是 FP8_E4M3（wk / wq_b），但 weights_proj [32, 6144]
      的 21 份是 BF16；注意 indexer.k_norm.{weight,bias} 按 subsystems.py 的优先级
      （norm 在 indexer 之前）归在 norm 桶，不在这个 97.9% 的分母里。
      draft 按元素数 99.22% 是 FP8_E4M3，但 12 个张量共 77,300,480 元素是 BF16，
      其中 eh_proj [6144, 12288] 一张占 97.7% —— 这一截是 indexer 那截 BF16 的 18.7 倍，
      假定「MTP 块整体 FP8」的引擎会在它上面直接解错。
      router 桶的 75 个 mlp.gate.weight 是 BF16，而 75 个 e_score_correction_bias [256]
      是 FP32 真参数（不是 scale，所以 per_subsystem_scale 里没有 router 项）；
      config 的 moe_router_dtype=float32 与此一致

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: FP8_E4M3
    ref:
      kind: modelcard
      url: https://huggingface.co/zai-org/GLM-5.3
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      与 DeepSeek V4.1 那条「少数层产出 KV」的路线相反：GLM-5.3 的主干 78 层
      每层都产出自己的 MLA KV，跨层共享一处都没有。稀疏只作用在
      「读哪些 token」（DSA 选 topk），不作用在「存多少层」。
      所以它的 KV 容量仍随层数线性增长，长上下文下是硬开销。
    quantified: >-
      口径为**主干 78 层，不含 MTP 块**：MLA 576 元素/层/token × 78 层 = 44928，
      加 index K 128 × 21 层 = 2688，合计 47616 元素/token。
      开 MTP 时第 78 层另有一层 576 宽 MLA KV 和一份 128 宽 index K，
      即 79 / 22 层、48320 元素/token（+704，+1.5%）；index K 那一侧还要看
      index_share_for_mtp_iteration 共享的是选择还是 K（见 open_questions）。
      每条目按 1:1 计费 —— DSA 的 topk 选的是「读哪些 token」而非「存哪些」，
      这一点没有一手来源，见 open_questions。
      KV 存储精度未披露，按 config 声明的 dtype=bfloat16 兜底（2 B/元素，
      不是权重落盘的 FP8_E4M3）得 95232 B/token、1M 上下文 93.0 GiB ——
      这是 dtype_fallback 兜底口径，不是实测落盘量
    visibility: public
  - dimension: operator-gap
    finding: >-
      indexer 只在 21 层存在，另 57 层复用上游的 topk 选择结果。
      调度上这不是「每层一次稀疏注意力」，而是「产出层算一次选择、其后的层
      拿着同一份索引做 gather」—— 产出层是 L0/L1/L2 与 L2+4k，间隔 1,1,4,4,…，
      不是均匀的每 4 层（见 arch.attention.sparse.mechanism）。
      按逐层建 indexer 的实现会多算 57 次选择，也会多留 57 份 index K 缓存。
    quantified: 21 层有 indexer（另 MTP 块 1 套），57 层无任何 indexer 张量
    visibility: public
  - dimension: operator-gap
    finding: >-
      MTP 块（第 78 层）是个完整 transformer 层：自带注意力、自带 indexer、
      自带 256 专家与共享专家。草稿侧成本不是「再跑一个投影头」，
      而是接近一层主干的全量开销 —— 实测 9.95B 参数，比主干 MoE 层的均值
      9.87B 还高 0.8%。另有主干根本没有的算子：eh_proj [6144, 12288]
      把两路 hidden 拼接后降维，以及 enorm / hnorm / shared_head.norm。
      按主干层的算子集合去排 MTP 块，会少掉 eh_proj 这一张最宽的投影。
    visibility: public
  - dimension: ep-comm
    finding: >-
      256 专家 top-8、专家中间维 2048，逐专家独立张量存放。
      EP 切分按张量分配而非按堆叠首维切，与 Qwen 那类 3 维堆叠权重的
      切分方式和算子签名都不同。
    visibility: public

infra_signals:
  - text: >-
      稀疏注意力正在分化成两条不同的路线，容量模型不能混用：
      DeepSeek V4.1 省的是「存多少层 KV」（4/40 层产出），
      GLM-5.3 省的是「每层读多少 token」（78 层全量存、topk 选读）。
      前者改容量，后者改带宽与算子图。按一条路线写的 KV 规划套到另一条上会差一个量级。
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      「每 N 层算一次 topk、其余层复用选择」把稀疏选择从逐层算子变成了跨层共享状态。
      引擎要能在层之间传递并复用索引，调度单元不再是单层。
      这类「跨层复用」在 KV（V4.1）和选择（GLM-5.3）两侧同时出现，
      适配流程要把「这一层到底复用了什么」当作必问项。
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      config 的 modules_to_not_convert 列了 22 个
      model.layers.N.self_attn.indexers_proj，而权重里根本没有这个名字 ——
      真实张量叫 self_attn.indexer.weights_proj。22 这个数是精确的：
      21 个 full indexer 层加 MTP 块（第 78 层），正好对上权重里有 indexer 的 22 层，
      所以不是 config 多写了一个。而同一份清单里 indexer.k_norm 与 k_norm.bias
      的拼写都是对的 —— 错的只有 weights_proj 这一项（indexer + weights_proj
      粘成了 indexers_proj），不是「这份清单用了另一套命名」。
      本次发布它恰好是 BF16，所以没出事；但任何按这份清单做名字精确匹配的
      再量化流程，都会把它当成不存在而照常量化。
      排除清单要对着权重清单验，不能只读 config。
    evidence: judgement
    horizon: now
    axis: precision

