      num_hidden_layers 和 indexer_types（长度 78，只覆盖主干 0–77），
      两个都是主干口径。同一份记录的 operator-gap 一条已经把 MTP 块数了进去
      （「21 层有 indexer（另 MTP 块 1 套）」），kv-capacity 一条没有 ——
      两条口径不一致是这个问题的内部指纹。本仓 V4.1 的滑窗 KV 按 43 层
      （40 主干 + 3 MTP 块）记并在括号里另给主干值，GLM 这份缺同样的括号。
