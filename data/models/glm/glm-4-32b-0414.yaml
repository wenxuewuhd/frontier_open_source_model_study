reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算，另派四路独立核查代理分管互不重叠的因子组
  method: >-
    按 .claude/skills/model-audit 的提问顺序逐字段对 facts/glm-4-32b-0414 核：config 全部键、
    完整权重清单（613 条目，逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData /
    createdAt / lastModified / sha 与逐 dtype 的 safetensors tally，以及
    data/derived/glm-4-32b-0414.json 的分项与 KV 公式路。
    本会话另做了两遍机械扫描：(1) 把记录里**每一个带逗号的数字**与从清单重算的集合比对
    （张量 numel、逐层分组求和、各子系统求和、derived 的每一项、跨版本差值），未匹配的逐个手算；
    (2) 同样扫 4–6 位纯数字，核出的口径错已改（留痕见下）。
    记录里每一个「X 倍」「X%」都逐个重算过分子分母。
    GLM-Z1-32B-0414 的「零结构差异」是本会话独立重做的：config 逐键比对差异为空、
    613 个张量名集合逐个相同（facts/glm-z1-32b-0414/names.json）、HF 的 safetensors tally
    同为 32,566,081,536。
    **哪些是实际重跑过的、哪些不是**，按本仓约定分开写明。
    本会话实际重跑/重算：清单逐项求和得 params.total 与 breakdown，并与 breakdown
    逐项求和、HF 的 safetensors tally 三方比对（逐 dtype 的元素数也比了）；
    derive.py 的 reconciliation 与 active_params；缓存账公式路的四个因子
    （宽度 / 层集合 / 条目覆盖 / 每元素字节）各自落到某个张量形状上；
    cfg.json 的逐键 diff 与张量名集合的对称差、shape+dtype 字典的逐条相等；
    dtype 的逐条计数。
    **未逐项复跑、依据核查代理枚举的**：各子系统桶内的元素占比（99.9x% 这类分母的
    归类优先级链没有逐张量重判）。
    **原理上核不了的**（清单只有名字、形状与 dtype，所以不在 reviewed.scope 的覆盖内）：
    运行期标量（top_k / index_topk / routed_scaling_factor / norm_eps / rope 参数 /
    scoring_func / topk_method / attention_bias 等）只有 config 一个来源；
    MTP 块自带的词表副本与主干那份是不是同值；KV 条目是 1:1 计费还是选存；
    KV 的实际落盘精度。后三项都挂在 open_questions 里。
    **第二轮（卡正文）**：按新定的来源优先级把九份模型卡 README.md 按 pinned sha 全抓下来
    逐行读过，并全文搜了 kv.?cache / per-token byte / cache size|capacity|memory|footprint
    与参数量、训练精度、上下文数字。KV 字节九份全部命中 0；参数量声明在
    glm-4.5 / glm-5 / glm-4.7-flash / glm-4-32b-0414 四份卡里有、另五份没有。
    技术报告（arXiv 2602.15763 / 2603.12201 / 2508.06471）与 z.ai 博客**均未读**，
    所以「厂商从未公布每 token KV 字节」这个结论的作用域只到卡正文，不含报告。
review:
  - id: R1
    field: bottlenecks
    severity: wrong
    claim: >-
      「激活参数等于总参数（dense）」
    finding: >-
      输入词表每 token 只 gather 一行，不进带宽口径。derive.py 报的带宽口径激活参数是
      31,634,946,048 = total 32,566,081,536 − embed 931,135,488，与总参数差 2.86%。
      本仓在 Qwen 一轮已经把「官方激活参数」与「带宽相关的激活参数」分开报过，
      这里把两个口径写成相等是同一类错。
    resolution: corrected
    changed_to: >-
      quantified 改为带宽口径 31,634,946,048 并写明扣的是哪一项
  - id: R2
    field: evidence.lineage
    severity: miscategorized
    claim: >-
      lineage 标 derived
    finding: >-
      同 glm-4-9b 的 R3：changed_from_predecessor 的 benefit 是推论，标 derived 会绕过 Gate C。
    resolution: corrected
    changed_to: >-
      evidence 的 lineage 改为 judgement
  - id: R3
    field: infra_signals
    severity: imprecise
    claim: >-
      GLM-Z1-32B-0414 相对本记录零结构差异
    finding: >-
      独立重做三组比对，三条判据全中：config 逐键差异为空（不只是关键字段）、
      613 个张量名逐个相同、tally 同为 32,566,081,536。
      这是本仓「能力跃迁 ≠ infra 工作量」的第三个实例（前两个是 DeepSeek R1、MiniMax M1）。
    resolution: confirmed
  - id: R4
    field: bottlenecks
    severity: imprecise
    claim: >-
      「仍是稠密模型，每 token 搬运全部权重」，quantified 给「权重存储 60.66 GiB」
    finding: >-
      60.66 GiB 作为存储口径正确、quantified 也标了「权重存储」，
      但 finding 的「每 token 搬运全部权重」把它读成了逐 token 搬运量。
      带宽口径是 31,634,946,048 × 2 B = 58.92 GiB（也正是 derived 的
      arithmetic_intensity.decode_weight_bytes_per_token）。比 glm-4-9b 的 R5 轻
      （那条直接把存储数写成了搬运量），但同一个病。
    resolution: corrected
    changed_to: >-
      finding 里两个口径都给出并写明差的是输入词表
  - id: R5
    field: bottlenecks
    severity: imprecise
    claim: >-
      「权重涨 3.46 倍而 KV 只涨 1.53 倍」
    finding: >-
      数值都对（元素/token 31232/20480 = 1.525；存储 60.66/17.51 = 3.465），
      但这一处没写口径，而同一份记录的 lineage 里写明了是元素/token。
      少了这个限定会误导：按各自最大上下文算，KV 总量反而是**降的**
      （9b @131072 5.0 GiB → 本代 @32768 1.91 GiB，0.38 倍），因为本代把上下文缩了 4 倍。
    resolution: corrected
    changed_to: >-
      补「KV 每 token 的元素数」这个限定，并补上「各自最大上下文下总量反而降」
  - id: R6
    field: bottlenecks
    severity: miscategorized
    claim: >-
      「61 层 × 4 处 = 244 次 RMSNorm，比 glm-4-9b 的 80 次多 3.05 倍」；infra_signals 与 lineage 写「GLM-4.5 又回到每层 2 处」
    finding: >-
