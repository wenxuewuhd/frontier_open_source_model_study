# 机械字段来自 config（official）；形状、参数量、子系统拆分与层内 norm 布局来自完整权重清单（derived）。
id: glm-4-32b-0414
family: glm
kind: llm
display_name: GLM-4-32B-0414
released: '2025-04-07'
license: mit
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/zai-org/GLM-4-32B-0414
    locator: config.json @ 077b5c2f5c43
    accessed: '2026-10-30'
    note: >-
      BF16 发布，14 分片。权重清单逐分片读头取全，613 个张量，无读失败分片。
      与 glm-4-9b 的 custom_code 不同，这一代走 transformers 主干的 Glm4ForCausalLM
  - kind: modelcard
    url: https://huggingface.co/zai-org/GLM-4-32B-0414/blob/077b5c2f5c43bd3239fd605a0600229e8facbd4a/README.md
    locator: README.md 第 14 行（"featuring 32 billion parameters"）
    accessed: '2026-10-30'
    note: >-
      卡正文（42936 字节 / 397 行，大半是生成样例）。第 14 行是厂商的参数量声明；
      全文搜 kv.?cache / per-token byte / cache size|capacity|memory|footprint 命中 0，
      **没有每 token KV 字节**，也没有训练精度。本代没有技术报告链接

hf:
  repo: zai-org/GLM-4-32B-0414
  sha: 077b5c2f5c43bd3239fd605a0600229e8facbd4a
  last_modified: '2025-05-01T15:42:37.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: main
  predecessor: glm-4-9b
  successor: glm-4.5
  changed_from_predecessor:
    - axis: scale
      text: >-
        9.4B → 32.6B：层数 40 → 61、hidden 4096 → 6144、query 头 32 → 48、
        稠密 FFN 中间维 13696 → 23040。KV 头数仍是 2，head_dim 仍是 128 —— 放大的是
        query 侧与 FFN，不是缓存侧
      benefit: >-
        KV 每层仍是 2 × 2 × 128 = 512 元素，只因层数从 40 涨到 61 而增加 52.5%
        （20480 → 31232 元素/token）；而权重从 17.51 GiB 涨到 60.66 GiB，3.46 倍。
        decode 的权重带宽压力涨得远比 KV 快，这是这一档仍然全稠密的直接后果
    - axis: attention
      text: >-
        融合 QKV 拆成独立的 q_proj / k_proj / v_proj，并去掉 QKV 的 bias
        （config attention_bias=false，而 glm-4-9b 是 add_qkv_bias=true）。
        partial rotary 从「实现里隐含的 128 // 2」变成 config 显式声明的
        partial_rotary_factor=0.5，rope base 从 5e6（10000 × rope_ratio 500）回到 10000
      benefit: >-
        拆开之后 TP 切分与权重重排不再需要先按 [Q|K|V] 段切一刀，但一次 GEMM 变三次 ——
        要靠引擎侧自己再融合回去才能拿回原来的访存效率。rope 语义从「读实现才知道」
        变成「config 写明」，这一项是纯粹的可移植性收益
    - axis: training
      text: >-
        每层从 2 处 RMSNorm 变成 4 处：新增 post_self_attn_layernorm 与
        post_mlp_layernorm，即 sandwich norm（注意力与 FFN 的输出各再归一化一次）
      benefit: >-
        训练稳定性的改造，推理侧的代价是每层多两次 RMSNorm —— 纯 Vector 负载、
        无法与相邻 GEMM 融合成一次读写，在 Cube/Vector 配比上把天平往 Vector 推。
        参数量代价可以忽略（norm 合计 1,505,280，占 0.0046%）。
        这是 0414 这一代独有的 —— 但独有的是**位置**不是数量：
        GLM-4.5 的残差流 norm 回到每层 2 处，另加注意力内的 q_norm / k_norm 两处
        （各 [128]，沿 head_dim），层内 norm 张量数仍是 4（主干 92 层共 368 张，
        比本代的 244 张更多）。差别在于 QK-Norm 作用在每头 QK 上、
        可以和 QKV 投影的 epilogue 一起做，而 sandwich norm 的两处夹在残差加法之间、
        两头都融合不了
    - axis: context
      text: >-
        131072 → 32768。两侧的字段名不同：glm-4-9b 的 131072 来自 config.seq_length
        （那一代没有 max_position_embeddings 这个键），本代是 config.max_position_embeddings。
        rope base 5e6 → 10000
      benefit: >-
        上下文反而缩短了 4 倍。放在演进线上看，这一代把预算花在参数规模与训练稳定性上，
        长上下文在 GLM-4.5 之后才重新拉回来（131072 → 202752 → 1048576）
    - axis: precision
      text: 仍是 BF16 直接发布，config 无 quantization_config
      benefit: 部署最简单，但 60.66 GiB 的权重带宽按 BF16 全额付

params:
  # 厂商声明值（模型卡第 14 行）。breakdown 是清单实测，见 counting_note。
  # 本代没有 MTP 草稿块，所以没有 excludes —— 声明值与实测是同一组张量。
  total: 32000000000.0
  breakdown:
    dense_ffn: 25905070080.0
    attention: 4797235200.0
    embed: 931135488.0
    lm_head: 931135488.0
    norm: 1505280.0
  counting_note: >-
    按完整权重清单（14 分片 613 条目）逐项求和，与 HF 平台自己从分片头统计的
    safetensors tally（32,566,081,536）逐位相同。613 个条目全是 BF16：
    没有 scale 容器、没有低位打包，条目数即张量数、numel 即参数数。
    没有 MTP 草稿块（config 无 num_nextn_predict_layers，层号止于 60），所以没有 excludes。
    词表与输出层不共享（tie_word_embeddings=false，各 931,135,488）。
    **total 是厂商声明值**：模型卡（README.md @ 077b5c2f5c43 第 14 行）写
    「featuring 32 billion parameters」，与名字里的 32B 同一个数 ——
    所以「名字是唯一可对账的声明值」那句不成立，卡正文里也有。
    实测 32,566,081,536 对声明的 32B 是 **+1.77%**，在 Gate B 的 2% 容差内。
    本代**没有 MTP 草稿块**（config 无 num_nextn_predict_layers，层号止于 60），
    所以不像 glm-4.5 / glm-5 / glm-4.7-flash 那样要扣 draft ——
    声明值与实测是同一组张量，+1.77% 就是厂商那边的取整幅度。
    卡正文没有激活参数声明（本代是稠密模型，没有这个概念）。
    Gate B 的「参数总量」一项（delta 0.0）因此是**拿实测比实测，不构成核对** ——
    真正的外部核对是 HF 的 safetensors tally，它不依赖本仓任何一行代码。
    逐因子核过：注意力 78,643,200/层 = q 6144×6144 + k 256×6144 + v 256×6144 + o 6144×6144，
    × 61 层 = 4,797,235,200；FFN 424,673,280/层 = gate_up 46080×6144 + down 6144×23040，
    × 61 = 25,905,070,080；norm 4 × 6144 × 61 + 最终 6144 = 1,505,280

context:
  max: 32768

arch:
  layers: 61
  hidden: 6144
  vocab: 151552
  norm: RMSNorm（每层 4 处：input / post_self_attn / post_attention / post_mlp，即 sandwich norm）
  norm_eps: 1.0e-05
  activation: SwiGLU（hidden_act silu；gate 与 up 融合成一张 gate_up_proj [46080, 6144]，46080 = 2 × 23040）
  position: RoPE theta 10000，partial_rotary_factor 0.5（只作用在每头前 64 维）

  attention:
    type: GQA
    num_heads: 48
    num_kv_heads: 2
    head_dim: 128
    head_dim_note: >-
      q_proj [6144, 6144] = 48 头 × 128，k_proj / v_proj [256, 6144] = 2 头 × 128，
      o_proj [6144, 6144]。三个投影各自独立，没有融合的 query_key_value，也都没有 bias。
      缓存宽度按 KV 头算：2 × 2 头 × 128 = 512 元素/层/token；按 query 头数 48 折算会得
      12288，高估 24 倍。本代没有 QK-Norm（config 无 use_qk_norm，清单里也没有
      q_norm / k_norm 张量）—— 那是 GLM-4.5 才加的
    layer_pattern: 61 层同构，每层都产出自己的 KV，无跨层共享、无滑窗、无稀疏

  ffn:
    type: dense
    intermediate: 23040
    layer_pattern: >-
      61 层全是稠密 FFN，没有 MoE。单层 FFN 424,673,280 参数，是单层注意力
      78,643,200 的 5.40 倍（glm-4-9b 是 4.72 倍）—— 权重带宽进一步向 FFN 倾斜，
      dense_ffn 占总参数 79.5%

precision:
  weights_release: [BF16]
  quantization:
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（14 分片 613 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空。613 个条目的 dtype 全是 BF16，所以各子系统 BF16 是全量结论。
      这一代没有 quantization_config，不存在 scale 张量与量化块

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    caveat: 走主干 Glm4ForCausalLM，不需要 trust_remote_code（与 glm-4-9b 一代不同）
    ref:
      kind: modelcard
      url: https://huggingface.co/zai-org/GLM-4-32B-0414
    visibility: public

bottlenecks:
  - dimension: weight-bandwidth
    finding: >-
      仍是稠密模型，除输入词表以外的权重每 token 全部搬运（带宽口径
      每 token 58.92 GiB = 31,634,946,048 × 2 B；权重存储 60.66 GiB 是另一个口径）。
      相对 glm-4-9b，权重存储涨 3.46 倍而 KV **每 token 的元素数**只涨 1.53 倍 ——
      稠密路线下放大规模几乎只在加重带宽压力。
      注意这两个倍数都是「同一口径两代相比」，不是容量总量：各自最大上下文下的
      KV 总量反而是降的（9b @131072 5.0 GiB → 本代 @32768 1.91 GiB），
      因为本代把上下文缩了 4 倍。
      这是 GLM-4.5 转 MoE 的直接动机：同样的 decode 带宽预算下，
      MoE 让 32.9B 的激活参数撑起 358B 的总容量。
    quantified: >-
      权重存储 60.66 GiB（BF16），dense_ffn 占 79.5%
      （25,905,070,080 / 32,566,081,536）；带宽口径的激活参数 31,634,946,048
      （= total 减输入词表 931,135,488），dense 模型下其余权重每 token 全部常驻
    visibility: public
  - dimension: cube-vector-balance
    finding: >-
      sandwich norm 让每层的残差流 RMSNorm 从 2 处变成 4 处。RMSNorm 是纯 Vector 负载，
      而新增的两处（post_self_attn / post_mlp）夹在残差加法之间，
      既不能和前一个 GEMM 的 epilogue 融合、也不能和后一个的 prologue 融合。
      按「每层 2 次 norm」排的算子图会漏掉一半。
    quantified: >-
      61 层 × 4 处 = 244 张层内 RMSNorm 权重，是 glm-4-9b 的 80 张的 3.05 倍；
      参数量代价只有 1,505,280（0.0046%）。
      **这个倍数只在「层内 norm 张量数」这根尺上成立**：GLM-4.5 的层内 norm 也是
      每层 4 张（input / post_attention 加注意力内的 q_norm / k_norm），
      主干 92 层共 368 张，比本代**更多**。本代独有的不是 norm 的数量，
      而是那两处的**位置** —— 见 finding
    visibility: public

infra_signals:
  - text: >-
      这一代是 GLM 稠密路线的终点，也是「结构改造花在训练稳定性上」的一个样本：
      sandwich norm（4 处 norm/层）与去掉 QKV bias 都不改变容量账，只改算子图与 Vector 负载。
      而且它只活了一代 —— GLM-4.5 回到 2 处 norm、改用 QK-Norm。
      按这一代排的 norm 算子图不能直接套到 GLM-4.5 上。
    evidence: derived
    horizon: settled
    axis: training
  - text: >-
      GLM-Z1-32B-0414（2025-04-08，推理增强版）相对本记录**零结构差异**：
      config 逐字段相同、613 个张量名逐个相同、HF 的 safetensors tally
      也是同一个值（32,566,081,536）。已经支持 GLM-4-32B-0414 的平台，
      支持 GLM-Z1 不需要任何算子工作 —— 跟踪新版本时先比张量名集合，
      相同就不必重走算子评估。
    evidence: derived
    horizon: settled
    axis: decoding

