notes: >-
  GLM-4 的 0414 一代，当期最大的 GLM 开放权重（32.6B 稠密）。结构仍是 GQA + 稠密 FFN，
  没有 MoE、没有 MTP、没有量化，但两处改动值得记：每层 4 处 norm 的 sandwich norm
  （只在这一代出现），以及 QKV 从融合单张拆成三张独立投影。
  层数、宽度、注意力几何、每层 norm 数量、参数量与逐子系统精度都对照完整权重清单核过；
  rope 与 partial_rotary_factor 这类运行期标量只有 config 一个来源。
  许可从 glm-4-9b 的 license:other（glm-4 自有条款）换成 mit，这条一直到 GLM-5.2 都是 mit，
  GLM-5.3 才又回到 other。

