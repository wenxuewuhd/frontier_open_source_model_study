notes: >-
  GLM-5 一代的第二次结构改动，也是这条线上「省缓存」的第三根轴：
  indexer 从每层一套收到 21 层一套，其余 57 层复用上游的 topk 选择。
  这一项在 config（indexer_types / index_topk_freq / index_skip_topk_offset）与
  权重清单（indexer.wk 的层集合从 78 缩到 21）两侧各自独立成立，两边逐层对齐，
  参数差 534,198,528 与 HF 两代 tally 之差逐位相同。
  同代还把上下文拉到 1048576（rope base 1e6 → 8e6）并声明 moe_router_dtype=float32。
  **本代与 GLM-5.3 的真权重张量名、形状完全一致**（59585 条逐个相同），
  参数量逐项逐位相同。GLM-5.3 的差别是：59044 条真权重从 BF16 换成 F8_E4M3
  （主仓改为 FP8 发布）、因此新增 59044 条 weight_scale_inv 容器
  （清单条目 59585 → 118629，所以**两份清单不是同一个条目数**）、
  config 新增 quantization_config、权重存储 1403.19 GiB → 703.72 GiB、
  许可从 mit 换成 other。
  **结构轴（层数、宽度、层集合、专家分布、MTP 构成）是零差异。**
  层数、宽度、MLA 几何、indexer 层集合、index K 宽度、专家分布、MTP 块构成、
  参数量与逐子系统精度都对照完整权重清单核过；top_k / index_topk /
  routed_scaling_factor / norm_eps 这类运行期标量只有 config 一个来源。

open_questions:
  - >-
    模型卡第 36 行给的是「per-token **FLOPs** 降 2.9×（1M 上下文）」，不是缓存口径，
    所以它**不能**当 KV 的外部锚：本仓算出来的 index K 元素 9984 → 2688 是 3.71×、
    KV 元素总数 54912 → 47616 是 1.133×，与 2.9× 是三个不同的量，按本仓规矩不能互相代入。
    而且卡上没点名分母是哪一代（按内容应是 GLM-5 / 5.1 的逐层 indexer）。
    厂商若公布过每 token KV 字节，只可能在 arXiv 2602.15763（GLM-5 技术报告）
    或 2603.12201（IndexShare）里 —— 两份本仓都没读
  - >-
    KV cache 的实际落盘精度未披露。推导按 config 声明的 dtype=bfloat16 兜底
    （2 B/元素），所以 95232 B/token 是 dtype_fallback 兜底口径，
    不能和 DeepSeek V4.1 那个按落盘格式算出来的理论下限（890 B/token）直接比倍数
  - >-
    DSA 的 topk 是「选读」还是「选存」，config 的 index_topk / index_topk_freq /
    index_skip_topk_offset 三个字段都定不了，要读实现。当前按 1:1 逐 token 计费，
    依据是本仓对 DeepSeek V4.1 与 glm-5.3 的既有口径加机制推理
    （跨层复用选择要求全历史的 latent 与 index K 都在）。
    若其实是「只存 topk 个」，这笔账要整个搬到 per_sequence 口径 ——
    那不是折算，是账的形状变了
  - >-
    为什么前三层（L0/L1/L2）各算一次 topk 而之后才每 4 层一次，没有一手来源。
    index_skip_topk_offset=3 的数值与「前 3 层例外」对得上，但 config 不足以确定
    它是否就是这个作用；按「每 4 层」从 L0 起推会得到 20 层而不是 21 层
  - >-
    shared 层复用的是哪一个 full 层的选择（最近的上游、还是固定映射），config 定不了
  - >-
    config 的 index_share_for_mtp_iteration=true 声称 MTP 迭代共享 index，
    但 MTP 块（第 78 层）权重里自带一整套 indexer。共享的到底是选择结果还是 K 本身，
    config 定不了，要读实现 —— 这一条与 glm-5.3 的同名问题是同一个
  - 训练精度无一手声明，config 只有 dtype=bfloat16，所以 precision.training 不填
  - >-
    moe_router_dtype=float32 是本代第一次声明，但 GLM-5 / GLM-5.1 的打分是否也走 FP32
    没有来源：那两代 config 没有这个键，权重侧（gate BF16 + e_score F32）三代完全相同，
    所以清单区分不了。「本代开始走 FP32」不能从这个键的出现推出来
  - >-
    GLM-5.2-FP8 仓未取数（它的存在来自 HF API 的 author=zai-org 模型列表，
    2026-10-30 拉取，createdAt 同为 2026-06-16；本仓 repoinfo.json 里没有指向它的字段）。
    主仓是 BF16，而下一代 GLM-5.3 把 FP8 做成主仓 —— 这个发布策略的变化
    是否从 GLM-5.2-FP8 的量化配置延续而来，未对照
  - >-
    本仓 facts/glm-5.2/repoinfo.json 的 cardData 里有
    **new_version = "zai-org/GLM-5.3-BF16"** —— HF 自己给本仓标的后继指针指向一个
    **BF16** 版 GLM-5.3，而不是本仓录的那个 FP8 主仓。
    所以「下一代把 FP8 做成主仓」在 HF 的元数据口径上不是唯一读法：
    GLM-5.3 线同时存在 FP8 主仓与 GLM-5.3-BF16，两者的量化配置差异未对照。
    这条正是 glm-5.3 最后一条 open question（「若存在 BF16 版，其量化配置差异未对照」）
    要的那个线索，而它一直就在本仓自己的 facts 里
