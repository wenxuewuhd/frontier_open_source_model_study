          dense_ffn: block
          draft: block
        per_subsystem_scale:
          expert: FP32
          shared_expert: FP32
          attention: FP32
          indexer: FP32
          dense_ffn: FP32
          draft: FP32
        per_subsystem_schemes:
          indexer:
            - { dtype: FP8_E4M3, block: '[128,128]', scale_dtype: FP32, tensors: 42, elements: 192675840 }
            - { dtype: BF16, tensors: 21, elements: 4128768 }
          router:
            - { dtype: BF16, tensors: 75, elements: 117964800 }
            - { dtype: FP32, tensors: 75, elements: 19200 }
          draft:
            - { dtype: FP8_E4M3, block: '[116ceil,128]', scale_dtype: FP32, tensors: 778, elements: 9875619840 }
            - { dtype: BF16, tensors: 12, elements: 77300480 }
            - { dtype: FP32, tensors: 1, elements: 256 }
        method: >-
          完整清单逐项统计（141 分片 118,629 条目，failed_shards 为空），非抽样。 **逐子系统参数量与主仓逐位相同，10 桶零例外**，合计同为
          753,329,940,480 —— 这是「同一份权重的两种存法」的硬证据，也是把 origin 判成 post_quantized 的判据之一。 FP8_E4M3
          覆盖路由专家（724,775,731,200）、共享专家（2,831,155,200）、注意力（12,871,532,544）、稀疏索引器（192,675,840）、稠密
          FFN（679,477,248）、草稿 / MTP（9,875,619,840），占参数量 99.7%；其余桶原样留在高精度上。 块与 scale 由形状量出、不抄
          config：路由专家 [128,128]、共享专家 [128,128]、稀疏索引器 [128,128]、注意力
          [116ceil,128]+[128,128]、稠密 FFN [128,128]、草稿 / MTP [116ceil,128]+[128,128]。 config
          的 modules_to_not_convert 点名了 541 条不量化的模块，与清单逐张量对得上。 落盘 755,617,140,416 B（703.72
          GiB）。
