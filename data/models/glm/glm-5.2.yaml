      旁边的 93.0 GiB 是对的（95,232 × 1,048,576 = 99,857,989,632 B = 93.0 GiB，
      与 derive.py 逐位相同），所以错的只有元素那一个绝对值 ——
      同一个乘式里字节那一半验过、元素那一半没验。
    resolution: corrected
    changed_to: >-
