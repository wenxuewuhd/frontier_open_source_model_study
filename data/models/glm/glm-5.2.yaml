bottlenecks:
  - dimension: kv-capacity
    finding: >-
      本代省的是第三根轴：不是「每层多宽」（MLA 在 GLM-4.7-Flash 已经做了），
      也不是「哪些层产出全量 KV」（78/78 层逐层全量存，一处共享都没有），
      而是「哪些层算 topk 并存 index K」—— 从 78 层收到 21 层。
      全量 MLA KV 这一项一点没动，所以总的改善只有 13.3%；
      同一代把上下文拉到 5.17 倍，缓存总量净涨 4.48 倍。
    quantified: >-
      口径为**主干 78 层，不含 MTP 块**：MLA 576 元素/层/token × 78 层 = 44928，
      加 index K 128 × 21 层 = 2688，合计 47616 元素/token
      （index K 占 5.6%，GLM-5 是 18.2%）。
      开 MTP 时第 78 层另有一层 576 宽 MLA KV 和一份 128 宽 index K，
      即 79 / 22 层、48320 元素/token（+704，+1.5%）；index K 那一侧还要看
      index_share_for_mtp_iteration 共享的是选择还是 K（见 open_questions）。
      每条目按 1:1 计费 —— DSA 的 topk 选的是「读哪些 token」而非「存哪些」，
      这一点没有一手来源，见 open_questions。
      KV 存储精度未披露，按 config 声明的 dtype=bfloat16 兜底（2 B/元素）得
      95232 B/token、1M 上下文 93.0 GiB —— 这是 dtype_fallback 兜底口径，
      不是实测落盘量
    visibility: public
  - dimension: operator-gap
    finding: >-
      indexer 只在 21 层存在，另 57 层复用上游的 topk 选择结果。
      调度上这不是「每层一次稀疏注意力」，而是「产出层算一次选择、其后的层
      拿着同一份索引做 gather」—— 产出层是 L0/L1/L2 与 L2+4k，间隔 1,1,4,4,…，
      不是均匀的每 4 层。按逐层建 indexer 的实现（即 GLM-5 / GLM-5.1 的做法）
      会多算 57 次选择，也会多留 57 份 index K 缓存。
      反过来，把本代的 21 层读回 GLM-5 会少算 57 层的 index K。
    quantified: 21 层有 indexer（另 MTP 块 1 套），57 层无任何 indexer 张量；GLM-5 是 78 层全有
    visibility: public
  - dimension: long-context
    finding: >-
      上下文 1048576 下单序列的 KV 是 93.0 GiB（BF16 兜底口径）。
      这个数超过本仓关注的昇腾 910 / 950 与 H100/H200 各机型的单卡 HBM，
      但「超过单卡 HBM」随硬件代际变化、本仓没有硬件来源，
      所以这句**只作用于当前这一代硬件**。
      结构上确定的那一半是：MLA 的 latent 缓存**不能按头切** ——
      576 维只有一份，每个 TP rank 都要存全量，所以 TP 不减少单卡的 KV 占用。
      长上下文下真正能切的只有序列维（SP / 分页到多卡）。
    quantified: >-
      47616 元素/token × 1048576 token = 49,928,994,816 元素；
      BF16 兜底下 93.0 GiB（99,857,989,632 B）。
      **两条口径限定跟着这个数走，不靠 kv-capacity 那条代为声明**：
      (1) 每条目按 1:1 逐 token 计费，而 DSA 的 topk 是「选读」还是「选存」
      没有一手来源（见 open_questions）；
      (2) 字节是 dtype_fallback 兜底（config dtype=bfloat16），不是实测落盘量 ——
      若实际落盘是 FP8_E4M3，这个数要折一半
    visibility: public
  - dimension: ep-comm
    finding: >-
      256 专家 top-8、专家中间维 2048，逐专家独立张量存放，与 GLM-5 逐项相同。
      EP 切分按张量分配而非按堆叠首维切。
    quantified: >-
      每 token 每 MoE 层 2 × top_k 8 × hidden 6144 × 2 B（BF16）= 196,608 B，
      75 个主干 MoE 层合计 14,745,600 B/token，与 GLM-5 相同
    visibility: public

infra_signals:
  - text: >-
      「每 N 层算一次 topk、其余层复用选择」是本代引入的，不是 DSA 自带的。
      同一个 model_type（glm_moe_dsa）在 GLM-5 / GLM-5.1 是 78 层逐层 indexer、
      在 GLM-5.2 / GLM-5.3 是 21 层 + 57 层复用 —— **层覆盖面差 3.7 倍**。
      按 model_type 判定算子需求会判错；判据只能是 config 的 indexer_types
      加权重清单里 indexer.wk 的层集合，两边逐层对齐。
    evidence: derived
    horizon: now
    axis: attention
  - text: >-
      这一代把稀疏选择从逐层算子变成了跨层共享状态：引擎要能在层之间传递并复用索引，
      调度单元不再是单层。同时它暴露了一个更一般的问题 ——
      「跨层复用」在 KV（DeepSeek V4.1 的 4/40 层产出）和选择（GLM-5.2 的 21/78 层算）
      两侧各自出现过，适配流程要把「这一层到底复用了什么」当作必问项，
      而不是只问「是不是稀疏注意力」。
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      indexer 收层省了 534,198,528 参数与 73% 的 index K 缓存，
      而同一代把上下文从 202752 拉到 1048576。两件事合起来缓存总量**净涨 4.48 倍**
      （20.74 → 93.0 GiB，同一套 BF16 兜底口径）。
      结构优化的收益被上下文的增长吃掉是常态 ——
      报「省了多少」时要把同代的其它变化一起算，否则会读成净改善。
    evidence: derived
    horizon: now
    axis: context

