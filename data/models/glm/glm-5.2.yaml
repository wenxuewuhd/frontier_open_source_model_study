      按子系统桶拆也对得上：indexer 桶差 534,183,936 = 57 × 9,371,648、
      norm 桶差 14,592 = 57 × 256（k_norm 按 subsystems.py 的优先级归 norm，
      与 glm-5.3 的 R7 同口径），两项之和正是 534,198,528。
