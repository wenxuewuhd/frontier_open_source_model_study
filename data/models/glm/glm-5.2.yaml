    finding: >-
      四个因子逐个重算：(1) 层数 57 —— 清单里失去 indexer 的层集合
      [3,4,5,7,8,9,…,77] 恰 57 个，等于 78 − 21；(2) 每层 9,371,904 =
      wk 128×6144 786,432 + wq_b 4096×2048 8,388,608 + weights_proj 32×6144 196,608
      + k_norm 2×128 256；(3) 乘积 57 × 9,371,904 = 534,198,528；
