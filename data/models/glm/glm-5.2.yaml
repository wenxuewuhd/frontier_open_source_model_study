  gated: false

lineage:
  track: main
  predecessor: glm-5
  successor: glm-5.3
  changed_from_predecessor:
    - axis: attention
      text: >-
        DSA 的 indexer 从**每层一套**收到**21 层一套**，其余 57 层复用上游那一次的
        topk 选择结果。两侧证据各自独立成立且逐层对齐：
        config 新增 indexer_types（长度 78，21 个 full、57 个 shared）、
        index_topk_freq=4、index_skip_topk_offset=3、index_share_for_mtp_iteration=true；
        权重清单里 indexer.wk / wq_b / weights_proj / k_norm 从 L0–L77 全部 78 层
        缩到 21 层 —— 恰是 config 里 full 的那 21 个位置
        （[0, 1, 2, 6, 10, 14, …, 74]，间隔序列 1,1,4,4,…）。
        其余 57 层**连一个 indexer 张量都没有**（按全名正则在 59585 条清单上穷举过）。
        清单 59870 → 59585，少掉的 285 = 57 层 × 5 个张量
      benefit: >-
        两笔账同时省。参数：indexer 每层 9,371,904 元素
        （wk 128×6144 + wq_b 4096×2048 + weights_proj 32×6144 + k_norm 2×128），
        × 57 层 = 534,198,528，与 HF 两代 tally 之差
        （753,864,139,008 − 753,329,940,480）**逐位相同**。
        缓存：index K 从 128 × 78 = 9984 元素/token 降到 128 × 21 = 2688，
        3.71 倍；合计从 54912 降到 47616 元素/token（−13.3%），
        index K 在合计里的占比从 18.2% 降到 5.6%。
        算力：topk-2048 的选择从每 token 78 次降到 21 次。
        代价是算子图变复杂：调度单元不再是单层，引擎要能在层之间传递并复用索引
    - axis: context
      text: 202752 → 1048576（config max_position_embeddings），rope base 1,000,000 → 8,000,000
      benefit: >-
        5.17 倍上下文，靠 rope base 放大 8 倍配合。
        叠上 KV 每 token 降 13.3%，缓存总量仍涨 4.48 倍：
        20.74 GiB @ 202752 → 93.0 GiB @ 1048576（两侧都是 BF16 兜底口径，可比）。
        **indexer 收层省下的 13.3% 远不足以覆盖上下文的 5.17 倍** ——
        这一代的长上下文仍然是硬开销
    - axis: precision
      text: >-
        config 新增 moe_router_dtype=float32（本代第一次声明）。
        gate 权重实测仍是 BF16，e_score_correction_bias 仍是 F32 ——
        清单的 dtype 分布与 GLM-5 逐项相同（除了少掉的 285 个 indexer 张量）
      benefit: >-
        把「打分走 FP32」这件事从实现约定变成 config 声明。
        对算子表是实的：router 的 GEMM 输入是 BF16 权重、输出要按 FP32 累加与 topk，
        按全程 BF16 写的 router 核会在 256 个专家的打分上损失精度。
        本代仍不量化（主仓无 quantization_config），FP8 走单独的仓
    - axis: moe
      text: >-
        专家数、top-k、中间维、稠密层数都没变（256 / 8 / 2048 / 3）。
        config 新增 mlp_layer_types（长度 78，L0–L2 是 dense、其余 sparse），
        把原来靠 first_k_dense_replace 推的层型变成逐层显式声明
      benefit: >-
        逐层显式声明比「前 k 层稠密」这个规则更不容易读错 ——
        本仓在 DeepSeek 一代踩过「从文字推层集合推错」的坑。
        权重侧没有任何变化：75 个 MoE 层、3 个稠密层，与 GLM-5 逐项相同

params:
  total: 753329940480.0
  breakdown:
    expert: 724775731200.0
    attention: 12871532544.0
    draft: 9952920576.0
    shared_expert: 2831155200.0
    embed: 951582720.0
    lm_head: 951582720.0
    dense_ffn: 679477248.0
    indexer: 196804608.0
    router: 117984000.0
    norm: 1169664.0
  counting_note: >-
    按完整权重清单（282 分片 59585 条目）逐项求和，与 HF 平台自己从分片头统计的
    safetensors tally（753,329,940,480）逐位相同。清单 dtype 只有 BF16（59509）与
    F32（76 个 e_score_correction_bias [256]，共 19,456 元素 —— 主干 75 层各一份加
    MTP 块一份），没有量化 scale 容器、没有低位打包，条目数即张量数、numel 即参数数。
    厂商未声明总参数或激活参数，total 是本仓按清单求和的实测值。
    Gate B 的「参数总量」一项（delta 0.0）因此是**拿实测比实测，不构成核对** ——
    真正的外部核对是 HF 的 safetensors tally，它不依赖本仓任何一行代码。
    draft 一项是第 78 层整块（9,952,920,576），按层索引归类；主干是 0–77，total 含草稿侧。
    除 indexer 与 norm 两项外，每一项都与 GLM-5 **逐位相同**：
    indexer 730,988,544 → 196,804,608（少 534,183,936 = 57 层 × 9,371,648），
    norm 1,184,256 → 1,169,664（少 14,592 = 57 层 × 2 × 128，即 indexer.k_norm 的
    weight 与 bias —— 它们按 subsystems.py 的优先级归在 norm 桶，不在 indexer 桶，
    和 glm-5.3 的 R7 是同一个口径）。两项之和 534,198,528 正是两代 tally 之差。
    **本代与 GLM-5.3 按清单实测的参数量逐项逐位相同**
    （注意 glm-5.3 记录里 params 存的是 6 位有效数字的取整值，
    total 753,330,000,000、breakdown 十项求和 753,330,181,660，
    与实测的 753,329,940,480 都不相等；本记录存的是精确值 ——
    所以「逐位相同」说的是清单实测值，不是两份记录的存值）。
    两份的**真权重**张量（59585 条）
    名字与形状逐个相同，其中 59044 条的 dtype 从 BF16 变成 F8_E4M3，
    余下 541 条（465 BF16 + 76 F32）不变。
    **但两份清单的条目数不同** —— GLM-5.3 是 118629 条，多出的 59044 条是新增的
    weight_scale_inv（F32 容器，45,853,104 个元素，不计入参数、只计入权重存储；
    例如 indexer.wk.weight_scale_inv [1, 48]）。所以「张量名完全一致」只对真权重成立，
    不要读成「两份清单相同」—— glm-5.3 的 R6 就是把 118629 当成参数条目数才出的错

context:
  max: 1048576

arch:
  layers: 78
  hidden: 6144
  vocab: 154880
  norm: RMSNorm（每层 2 处：input / post_attention；另有 kv_a_layernorm [512]、q_a_layernorm [2048]，以及 21 个 full indexer 层的 indexer.k_norm.{weight,bias} [128]）
  norm_eps: 1.0e-05
  activation: SwiGLU（hidden_act silu；gate / up / down 三张独立张量）
  position: RoPE theta 8,000,000（config.rope_parameters.rope_theta），成对交错（rope_interleave=true，indexer 侧另有 indexer_rope_interleave=true）

  attention:
    type: MLA
    num_heads: 64
    num_kv_heads: 64
    head_dim: 256
    v_head_dim: 256
    qk_rope_head_dim: 64
    qk_nope_head_dim: 192
    kv_lora_rank: 512
    q_lora_rank: 2048
    head_dim_note: >-
      **config 的 num_kv_heads=64 是 query 侧可见的 KV 头数，不是缓存宽度**：
      落盘缓存是 kv_a_proj_with_mqa [576, 6144] 的 576 维 latent
      （kv_lora_rank 512 + qk_rope_head_dim 64），按 2 × num_kv_heads 64 × head_dim 256
      折算得 32768，对实际 576 是 **56.9 倍**高估。
      每头 QK 全宽 256（config 的 qk_head_dim，= qk_nope 192 + qk_rope 64），V 每头也是 256；
      不对称只在 kv_b_proj [28672, 512] 内部：28672 = 64 × (K-nope 192 + V 256)，
      K 的 rope 64 维由 kv_a_proj_with_mqa 的尾段直接产出、不经 kv_b_proj。
      o_proj 入口是 64 × v_head_dim 256 = 16384（权重实测 [6144, 16384]）；
      **拿 nope 段 192 去推会得 12288、低 25%**。
      config 的 head_dim 本代从 GLM-5 / GLM-5.1 的 64 改成 192，
      而注意力权重形状一个字节没差 —— 它与落盘形状无关，两代都不能拿它推宽度。
      本记录的 head_dim 256 是 qk_nope 192 + qk_rope 64 算出来的，不是抄 config 的
    sparse:
      mechanism: >-
        DSA indexer 选 token。L0 / L1 / L2 各自算一次 topk，之后每 4 层一次
        （L2+4k，止于 L74），主干共 21 层产出；其余 57 层复用上游那一次的选择结果。
        间隔序列是 1,1,4,4,… 而不是均匀的 4 —— 按「每 4 层」从 L0 起推会得到
        0,4,…,76 共 20 层，层数和层号都错（config index_topk_freq=4，
        前三层的例外疑与 index_skip_topk_offset=3 有关，见 open_questions）。
        MTP 块（L78）另有完整一套。
        **这套层间复用是本代新加的** —— GLM-5 / GLM-5.1 是每层一套 indexer、
        每层各算一次 topk，config 里连 index_topk_freq / indexer_types 这两个键都没有。
        厂商侧有对应说法：模型卡第 36 行「We propose IndexShare, which **reuses the same
        indexer across every four sparse attention layers**」—— 与本仓从 config
        indexer_types 和清单 indexer.wk 层集合两路推出的机制一致，是第三路独立印证。
        但注意卡上说的是「every four」，而实测层集合是 [0,1,2,6,10,…,74]、
        间隔 1,1,4,4,…，**前三层的例外卡上没提** —— 按卡上这句字面推仍会得到 20 层
      index_n_heads: 32
      index_head_dim: 128
      index_topk: 2048
      index_kv_dim: 128
      index_kv_source: >-
        model.layers.N.self_attn.indexer.wk.weight [128, 6144]，输出维 128。
        index_n_heads × index_head_dim = 32 × 128 = 4096 是 32 倍的上界：
        index K 在 32 个 index 头之间共享，不是逐头
    kv_sharing:
      index_kv_source_layers:
        [0, 1, 2, 6, 10, 14, 18, 22, 26, 30, 34, 38, 42, 46, 50, 54, 58, 62, 66, 70, 74]
      layer_coverage: >-
        三种覆盖面各不相同，不能统称「逐层」。以下层数都是**主干口径**（0–77）：
        全量 MLA KV 在 78/78 层（每层都有 kv_a_proj_with_mqa [576, 6144]，无跨层共享）；
        indexer 整套（wk / wq_b / weights_proj / k_norm）只在 21 层，即 config
        indexer_types 里的 full；其余 57 个 shared 层**连一个 indexer 张量都没有**
        （按全名正则在 59585 条清单上穷举过，不是抽样）。
        另有 MTP 块（第 78 层）自带一整套 indexer，也自带自己的 kv_a_proj_with_mqa；
        indexer_types 长度只有 78、只覆盖主干 0–77，按它数会漏掉这一套。
        所以权重清单里产出 MLA KV 的层共 79 个、产出 index K 的共 22 个，
        开 MTP 时要按这两个数算
      note: >-
        shared 层复用的是上一个 full 层的 **topk 选择结果**本身（config index_topk_freq=4），
        一个 indexer 张量都没有 —— 这和 DeepSeek V4.1 的「重打分层」不是一回事
        （那边的层有 wq_b / weights_proj、只是不产出 K，仍要逐层算一次打分）。
        前者是「选择共享」，后者是「K 共享、打分不共享」，算子图与访存都不同。
        schema 的 index_rescore_layers 在这里不适用，故留空

  ffn:
    type: moe
    layer_pattern: >-
      第 0–2 层稠密（中间维 12288），其余 75 层为 MoE；MTP 块（第 78 层）也是 MoE。
      本代 config 新增 mlp_layer_types（长度 78）逐层显式声明层型，与权重清单逐层一致。
      稠密层的 FFN 比单个专家宽 6 倍，单层 226,492,416 参数，
      是一层注意力 165,019,648 的 1.37 倍

  moe:
    routed_experts: 256
    shared_experts: 1
    top_k: 8
    intermediate: 2048
    first_k_dense: 3
    dense_intermediate: 12288
    routing: >-
      sigmoid 打分、noaux_tc 选路、norm_topk_prob=true、routed_scaling_factor 2.5，
      打分走 FP32（config moe_router_dtype=float32，本代第一次声明，而 gate 权重实测是 BF16）。
      n_group=1 且 topk_group=1，分组路由实际未启用
    balance: e_score_correction_bias [256]（F32；清单里 76 份 —— 主干 75 个 MoE 层各一份加 MTP 块一份）—— 偏置纠偏、无辅助损失
    storage_note: >-
      逐专家独立张量（mlp.experts.N.{gate,up,down}_proj），不是堆叠的 3 维权重。
      grouped GEMM 因此吃 2 维张量列表；EP 切分按张量分配，不按首维切

  decoding:
    mtp_layers: 1
    mtp_layers_note: >-
      config 声明 1，权重里确实只有 1 块（第 78 层，层索引 0–78 连续）。
      构成与 GLM-5 相同：不自带 embed_tokens / shared_head.head（复用主干的），
      但自带完整的 MLA 注意力、**一整套 indexer**、256 专家 MoE、共享专家、router，
      以及 eh_proj [6144, 12288] / enorm / hnorm / shared_head.norm。
      config 的 index_share_for_mtp_iteration=true 声称 MTP 迭代共享 index，
      而权重里它自带 indexer —— 共享的是选择结果还是 K 本身，config 定不了，见 open_questions

precision:
  weights_release: [BF16, FP32, FP8_E4M3]
  weights_release_scope:
    BF16: { manifest_taken: true, in_precision_table: true }
    FP32: { manifest_taken: true, in_precision_table: true }
    FP8_E4M3:
      manifest_taken: true
      in_precision_table: true
      repo: zai-org/GLM-5.2-FP8
      note: >-
        厂商另发的官方量化仓，本轮取了完整清单，逐子系统实测落在 quantization.official_variants 里 —— 精度表的第二个来源。**主仓的
        per_subsystem 不受影响**：那个字段是 derive.py 识别打包用的承重件，口径只能是 hf.repo 那一份权重
  quantization:
    per_subsystem:
      expert: BF16
      shared_expert: BF16
      attention: BF16
      indexer: BF16
      dense_ffn: BF16
      draft: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（282 分片 59585 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空，层索引 0–78 连续。59509 个 BF16 + 76 个 F32。
      router 桶内部不同质：主干 75 层（L3–L77）的 mlp.gate.weight [256, 6144] 是 BF16，
      同样 75 份 e_score_correction_bias [256] 是 F32 真参数（不是 scale 容器，
      所以**本代根本没有 per_subsystem_scale 这个字段** —— 不量化，不存在 scale 张量），按元素数 router 桶 99.98% 是 BF16。
      清单里这两种各有 76 份，第 76 份在 MTP 块（L78），按层索引归在 draft 桶 ——
      所以全清单的 19,456 个 F32 元素里，19,200 在 router 桶、256 在 draft 桶。
      config 的 moe_router_dtype=float32 说的是打分的计算精度，不是 gate 权重的存储精度：
      权重实测 BF16，两者不矛盾。
      本代主仓没有 quantization_config，所以不存在 scale 张量与量化块，
      也没有 GLM-5.3 那种「indexer 桶里 weights_proj 是 BF16 而其余是 FP8」的桶内异质

    official_variants:
      - dtype: FP8_E4M3
        repo: zai-org/GLM-5.2-FP8
        rev: f33c6dc501ee
        origin: post_quantized
        tensor_count: 118629
        params_total: 753329940480
        weight_bytes_total: 755617140416
        per_subsystem:
          expert: FP8_E4M3
          shared_expert: FP8_E4M3
          attention: FP8_E4M3
          indexer: FP8_E4M3
          dense_ffn: FP8_E4M3
          router: BF16
          embed: BF16
          lm_head: BF16
          norm: BF16
          draft: FP8_E4M3
