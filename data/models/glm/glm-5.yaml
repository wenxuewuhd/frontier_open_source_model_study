      第 76 份 e_score_correction_bias 在 MTP 块（第 78 层）—— 层范围是 3–78 而不是 3–77。
      HF 的逐 dtype tally 给的也是 F32 19,456，所以这一处本来就有外部对账可以撞上，
      只是没去撞。subsystem_method 里的同一组数字一并错。
    resolution: corrected
    changed_to: >-
      改为 59794 / 76 / 19,456，并写明第 76 份在 MTP 块、按层索引归 draft 桶（router 桶里 19,200、draft 桶里 256）
