            - { dtype: FP32, tensors: 75, elements: 19200 }
          draft:
            - { dtype: FP8_E4M3, block: '[116ceil,128]', scale_dtype: FP32, tensors: 778, elements: 9875619840 }
            - { dtype: BF16, tensors: 12, elements: 77300480 }
            - { dtype: FP32, tensors: 1, elements: 256 }
        method: >-
          完整清单逐项统计（142 分片 119,028 条目，failed_shards 为空），非抽样。 **逐子系统参数量与主仓逐位相同，10 桶零例外**，合计同为
          753,864,139,008 —— 这是「同一份权重的两种存法」的硬证据，也是把 origin 判成 post_quantized 的判据之一。 FP8_E4M3
          覆盖路由专家（724,775,731,200）、共享专家（2,831,155,200）、注意力（12,871,532,544）、稀疏索引器（715,653,120）、稠密
          FFN（679,477,248）、草稿 / MTP（9,875,619,840），占参数量 99.7%；其余桶原样留在高精度上。 块与 scale 由形状量出、不抄
          config：路由专家 [128,128]、稠密 FFN [128,128]、稀疏索引器 [128,128]、注意力
          [116ceil,128]+[128,128]、共享专家 [128,128]、草稿 / MTP [116ceil,128]+[128,128]。 config 的
          modules_to_not_convert 点名了 712 条不量化的模块，与清单逐张量对得上。 落盘 756,162,687,872 B（704.23
          GiB）。
