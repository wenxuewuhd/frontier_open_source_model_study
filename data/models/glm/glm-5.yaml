bottlenecks:
  - dimension: kv-capacity
    finding: >-
      本代同时付两笔缓存：MLA 的 576 维 latent 逐层全量存（78/78 层），
      以及 DSA 的 index K 也逐层全量存（78/78 层）。
      稀疏只作用在「读哪些 token」，不作用在「存多少层」—— 跨层共享一处都没有。
      所以 index K 不是小附加项：它占合计元素数的 18.2%，
      而 GLM-5.2 把 indexer 收到 21 层之后这一项降到 5.6%。
    quantified: >-
      口径为**主干 78 层，不含 MTP 块**：MLA 576 元素/层/token × 78 层 = 44928，
      加 index K 128 × 78 层 = 9984，合计 54912 元素/token
      （index K 占 9984 / 54912 = 18.2%）。
      开 MTP 时第 78 层另有一层 576 宽 MLA KV 和一份 128 宽 index K，
      即 79 / 79 层、55616 元素/token（+704，+1.28%）。
      每条目按 1:1 计费 —— DSA 的 topk 选的是「读哪些 token」而非「存哪些」，
      这一点没有一手来源，见 open_questions。
      KV 存储精度未披露，按 config 声明的 dtype=bfloat16 兜底（2 B/元素，
      不是任何量化格式）得 109824 B/token、202752 上下文 20.74 GiB ——
      这是 dtype_fallback 兜底口径，不是实测落盘量
    visibility: public
  - dimension: operator-gap
    finding: >-
      每层一套 indexer、每层各算一次 topk-2048。调度上这是「78 次独立的稀疏选择」，
      没有任何层间复用 —— 与 GLM-5.2 / GLM-5.3 的「21 层算、57 层复用」
      是完全不同的算子图。按 GLM-5.3 的实现去跑本代会少建 57 套 indexer；
      反过来按本代去排 GLM-5.3 会多算 57 次选择。
    quantified: 78/78 主干层有 indexer（另 MTP 块 1 套，共 79 套）；GLM-5.2 起降到 21 套（+MTP 1 套）
    visibility: public
  - dimension: ep-comm
    finding: >-
      256 专家 top-8、专家中间维 2048，逐专家独立张量存放。
      EP 切分按张量分配而非按堆叠首维切。
      all-to-all 载荷取决于 top_k × hidden × bytes，与专家总数无关 ——
      专家数 160 → 256 这一项确实不进载荷。但「只多 1.1%」不是这句话的功劳：
      每层载荷实际**涨了 20%**（163,840 → 196,608 B，来自 hidden 5120 → 6144），
      被主干 MoE 层数**少 16%**（89 → 75）抵掉，两个变化相消才得 +1.1%。
      换个 hidden 或层数组合，结论就不同。
    quantified: >-
      每 token 每 MoE 层 2 × top_k 8 × hidden 6144 × 2 B（BF16）= 196,608 B，
      75 个主干 MoE 层合计 14,745,600 B/token；GLM-4.7 是 14,581,760 B，只多 1.1%
    visibility: public

infra_signals:
  - text: >-
      DSA 进入 GLM 主干旗舰是在本代，而且一上来是**逐层 indexer**：
      78 层各一套、各算一次 topk。它的 index K 占缓存元素数的 18.2%，
      是必须单独立一个分量的量，不能并进全量 KV 里说。
      下一代（GLM-5.2）把 indexer 收到 21 层 —— 同一个「DSA」在两代里
      层覆盖面差 3.7 倍，按哪一代写的容量模型都不能直接套到另一代。
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      config 的 head_dim 在本代是 64，GLM-5.1 仍是 64，GLM-5.2 改成 192，
      而三代的注意力权重形状一个字节没差（kv_a 576、kv_b 28672、o_proj 16384 逐代相同）。
      所以它是一个与落盘形状无关的残留字段，按它推任何宽度都会错
      （推 o_proj 得 4096，是实测 16384 的 1/4）。
      判型与宽度一律从权重清单取 —— config 与权重冲突时权重赢。
    evidence: judgement
    horizon: now
    axis: attention

