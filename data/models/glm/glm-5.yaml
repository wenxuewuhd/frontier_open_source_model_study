notes: >-
  GLM-5 一代的起点：主干旗舰第一次用 MLA，也第一次叠 DSA（model_type glm_moe_dsa）。
  MLA 几何与新词表沿用支线 GLM-4.7-Flash，DSA 是新的。
  本代的 DSA 是**逐层**的：78/78 主干层各一套 indexer、各算一次 topk，
  config 里没有 index_topk_freq / indexer_types / index_skip_topk_offset 这三个键，
  「每 4 层算一次、其余层复用」要到 GLM-5.2 才出现。
  层数、宽度、MLA 几何、indexer 层集合（穷举 59870 条清单、零例外）、index K 宽度、
  专家分布、MTP 块构成、参数量与逐子系统精度都对照完整权重清单核过；
  top_k / index_topk / routed_scaling_factor / norm_eps 这类运行期标量只有 config
  一个来源，清单只有名字、形状与 dtype，交叉验证不了。
  GLM-5.1（2026-04-03）相对本代**零结构差异**：config 只差 transformers_version
  （5.0.2.dev0 → 5.4.0）、59870 个张量名逐个相同、HF 的 safetensors tally 也是同一个值
  （753,864,139,008），所以本仓不单独立记录。

