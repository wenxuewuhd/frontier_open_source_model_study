      9.87B 是本代**含注意力与 indexer** 的整层值。按同一口径（整层）重算：
      GLM-4.7 的第 50 层 3,935,625,632、本代第 50 层 9,877,404,672，2.51 倍
      （两个数都直接取该层全部张量之和核过）。
      口径不同的两个数之间算倍数是范畴错误，不是精度误差。
    resolution: corrected
    changed_to: >-
      两侧统一成整层口径，给出 3,935,625,632 → 9,877,404,672 与 2.51 倍
