reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算，另派四路独立核查代理分管互不重叠的因子组
  method: >-
    按 .claude/skills/model-audit 的提问顺序逐字段对 facts/glm-5 核：config 全部键、
    完整权重清单（59870 条目，逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData /
    createdAt / lastModified / sha 与逐 dtype 的 safetensors tally，以及
    data/derived/glm-5.json 的分项与 KV 公式路。
    本会话另做了两遍机械扫描：(1) 把记录里**每一个带逗号的数字**与从清单重算的集合比对
    （张量 numel、逐层分组求和、各子系统求和、derived 的每一项、跨版本差值），未匹配的逐个手算；
    (2) 同样扫 4–6 位纯数字，核出的口径错已改（留痕见下）。
    记录里每一个「X 倍」「X%」都逐个重算过分子分母。
    indexer 的层覆盖（78/78 主干层 + MTP 块一套）是在 59870 条清单上按全名正则穷举的，
    层号 0–78 连续、零例外；GLM-5.1 的「零结构差异」用 facts/glm-5.1/names.json
    独立重做过（59870 个名字逐个相同、config 只差 transformers_version、tally 同值）。
    **哪些是实际重跑过的、哪些不是**，按本仓约定分开写明。
    本会话实际重跑/重算：清单逐项求和得 params.total 与 breakdown，并与 breakdown
    逐项求和、HF 的 safetensors tally 三方比对（逐 dtype 的元素数也比了）；
    derive.py 的 reconciliation 与 active_params；缓存账公式路的四个因子
    （宽度 / 层集合 / 条目覆盖 / 每元素字节）各自落到某个张量形状上；
    cfg.json 的逐键 diff 与张量名集合的对称差、shape+dtype 字典的逐条相等；
    dtype 的逐条计数。
    **未逐项复跑、依据核查代理枚举的**：各子系统桶内的元素占比（99.9x% 这类分母的
    归类优先级链没有逐张量重判）。
    **原理上核不了的**（清单只有名字、形状与 dtype，所以不在 reviewed.scope 的覆盖内）：
    运行期标量（top_k / index_topk / routed_scaling_factor / norm_eps / rope 参数 /
    scoring_func / topk_method / attention_bias 等）只有 config 一个来源；
    MTP 块自带的词表副本与主干那份是不是同值；KV 条目是 1:1 计费还是选存；
    KV 的实际落盘精度。后三项都挂在 open_questions 里。
    **第二轮（卡正文）**：按新定的来源优先级把九份模型卡 README.md 按 pinned sha 全抓下来
    逐行读过，并全文搜了 kv.?cache / per-token byte / cache size|capacity|memory|footprint
    与参数量、训练精度、上下文数字。KV 字节九份全部命中 0；参数量声明在
    glm-4.5 / glm-5 / glm-4.7-flash / glm-4-32b-0414 四份卡里有、另五份没有。
    技术报告（arXiv 2602.15763 / 2603.12201 / 2508.06471）与 z.ai 博客**均未读**，
    所以「厂商从未公布每 token KV 字节」这个结论的作用域只到卡正文，不含报告。
review:
  - id: R1
    field: params.counting_note
    severity: wrong
    claim: >-
