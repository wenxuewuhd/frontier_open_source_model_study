reviewed:
  date: '2026-10-30'
  scope:
    - official
    - derived
    - judgement
  reviewer: 本会话逐字段复算，另派四路独立核查代理分管互不重叠的因子组
  method: >-
    按 .claude/skills/model-audit 的提问顺序逐字段对 facts/glm-4.5 核：config 全部键、
    完整权重清单（44691 条目，逐项 numel / dtype / 层索引）、repoinfo 的 tags / cardData /
    createdAt / lastModified / sha 与逐 dtype 的 safetensors tally，以及
    data/derived/glm-4.5.json 的分项与 KV 公式路。
    本会话另做了两遍机械扫描：(1) 把记录里**每一个带逗号的数字**与从清单重算的集合比对
    （张量 numel、逐层分组求和、各子系统求和、derived 的每一项、跨版本差值），未匹配的逐个手算；
    (2) 同样扫 4–6 位纯数字，核出的口径错已改（留痕见下）。
    记录里每一个「X 倍」「X%」都逐个重算过分子分母。
    与 GLM-4.6 / GLM-4.7 的三组比对是本会话逐张量重做的（名字 + 形状 + dtype 三者都比），
    不只比名字集合。
    **哪些是实际重跑过的、哪些不是**，按本仓约定分开写明。
    本会话实际重跑/重算：清单逐项求和得 params.total 与 breakdown，并与 breakdown
    逐项求和、HF 的 safetensors tally 三方比对（逐 dtype 的元素数也比了）；
    derive.py 的 reconciliation 与 active_params；缓存账公式路的四个因子
    （宽度 / 层集合 / 条目覆盖 / 每元素字节）各自落到某个张量形状上；
    cfg.json 的逐键 diff 与张量名集合的对称差、shape+dtype 字典的逐条相等；
    dtype 的逐条计数。
    **未逐项复跑、依据核查代理枚举的**：各子系统桶内的元素占比（99.9x% 这类分母的
    归类优先级链没有逐张量重判）。
    **原理上核不了的**（清单只有名字、形状与 dtype，所以不在 reviewed.scope 的覆盖内）：
    运行期标量（top_k / index_topk / routed_scaling_factor / norm_eps / rope 参数 /
    scoring_func / topk_method / attention_bias 等）只有 config 一个来源；
    MTP 块自带的词表副本与主干那份是不是同值；KV 条目是 1:1 计费还是选存；
    KV 的实际落盘精度。后三项都挂在 open_questions 里。
review:
  - id: R1
    field: lineage.changed_from_predecessor
    severity: wrong
    claim: >-
      EP all-to-all「89 个 MoE 层合计 14.26 MB/token」
    finding: >-
      逐因子重算：2 × top_k 8 × hidden 5120 × 2 B = 163,840 B/层，× 89 个主干 MoE 层
      = 14,581,760 B，即 14.58 MB（13.91 MiB）。14.26 不对应任何一种单位换算。
      **同一份记录的 bottleneck ep-comm 一条写的是 14.58 MB —— 两处自相矛盾**，
      这是本仓反复出现的「文件内部不一致」指纹。
    resolution: corrected
    changed_to: >-
      改为 14,581,760 B/token（14.58 MB），两处口径统一
  - id: R2
    field: bottlenecks
    severity: wrong
    claim: >-
      「131072 上下文 33.07 GiB」
    finding: >-
      376,832 B/token × 131,072 = 49,392,123,904 B = **46.0 GiB**，与 derive.py 的
      kv_capacity_bytes_at_context['131072'] 逐位相同。33.07 这个数在任何因子组合下都算不出来。
      同一处的「24 倍」反而是对的（46.0 / 1.91），所以错的只是这一个绝对值 ——
      一个乘式里只验了比值没验绝对值。
    resolution: corrected
    changed_to: >-
      改为 46.0 GiB，并补上「两侧同为 dtype_fallback 口径才可以这样比」
  - id: R3
    field: precision.quantization.subsystem_method
    severity: imprecise
    claim: >-
      「90 个 mlp.gate.weight 是 BF16，而 90 个 e_score_correction_bias 是 F32」—— 用来说明 router 桶内部不同质
    finding: >-
      90 是**全清单**的份数（层 3–92，含 MTP 块那一份）；router **桶**里只有 89 份
      （主干 L3–L91），第 90 份在第 92 层、按层索引归在 draft 桶。
      桶的参数量 72,923,040 = 89 × (160×5120 + 160) 自己就证明了这一点。
      拿清单口径的份数去解释桶的构成，是混了两个口径 —— 与 glm-5.3 的 R7 同类。
    resolution: corrected
    changed_to: >-
      区分「清单里 90 份」与「router 桶里 89 份」，并说明第 90 份归在哪
  - id: R4
    field: evidence.lineage
    severity: miscategorized
    claim: >-
      lineage 标 derived
    finding: >-
      同 glm-4-9b 的 R3。
    resolution: corrected
    changed_to: >-
      evidence 的 lineage 改为 judgement
  - id: R5
    field: params
    severity: imprecise
    claim: >-
      breakdown 九项与 total
    finding: >-
      每一项逐因子重算并与清单求和、derived JSON、HF 的逐 dtype tally 三方对齐：
      注意力 136,329,216/层 × 92、专家 3,774,873,600/层 × 89、共享专家 23,592,960 × 89、
      稠密 FFN 3 × 188,743,680、router 89 × 819,360、draft 第 92 层整块 5,539,962,272
      （直接取该层全部张量之和核过）。total 753→358,337,791,296 与 tally 逐位相同。
      q_norm / k_norm 落在 norm 桶而不在 attention 桶这一条也按 subsystems.py 的顺序验过。
    resolution: confirmed
  - id: R6
    field: arch.moe.balance
    severity: unsupported
    claim: >-
      「e_score_correction_bias（F32，90 层各一份）—— 偏置纠偏、无辅助损失。config 没有 aux_loss 相关字段，这个结论来自权重清单里这张张量的存在」
    finding: >-
      「所以无辅助损失」这半句不成立：偏置纠偏与辅助损失可以共存 ——
      本仓的 facts/minimax-m2 同时有 62 份 e_score_correction_bias 和 config 里的
      router_aux_loss_coef 0.001、scoring_func sigmoid。张量存在只能说明走偏置纠偏，
      定不了训练目标函数。另一条论据「config 没有 aux_loss 字段」在本代也弱：
      这一代的 config 连 topk_method / scoring_func 都不写，缺字段不构成否证。
      同一份记录的 open_questions 对 scoring_func 守了这条纪律，对 aux loss 没守。
      evidence 把整条标 derived 也不对 —— 字段正文自己承认是推论。
    resolution: corrected
    changed_to: >-
      删掉「无辅助损失」，改为「偏置纠偏（noaux_tc 族形态）」；aux loss 有无进 open_questions；evidence 的 arch.moe.balance 改 judgement
  - id: R7
    field: lineage.changed_from_predecessor
    severity: wrong
    claim: >-
      「QK-Norm 的推理代价是每层两次小 RMSNorm（各 128 维），但它替掉了 sandwich norm 的两处全宽 norm（各 5120 维），Vector 负载实际是降的」
    finding: >-
      两个因子都错，结论反了。(1) 被去掉的 post_self_attn_layernorm 与
      post_mlp_layernorm 在 glm-4-32b-0414 的清单里形状都是 **[6144]**（0414 的 hidden），
      不是本代的 5120 —— 把两代的宽度串了。
      (2) Vector 负载要按「每层被归一化的元素数」算：0414 那两处是 2 × 6144 = 12,288；
      QK-Norm 的参数虽各 [128]，但各头共用一份参数、所有头都要过
      （本记录自己的 head_dim_note 就写了「沿 head_dim 归一化、各头共用一份参数」），
      所以实际是 q 96 × 128 + k 8 × 128 = **13,312**，比 12,288 **高 8.3%**。
      只按参数宽度（2×128 vs 2×5120）比，正是 skill 规则 1 的「只验了一个因子」——
      漏掉的因子是「每个 norm 作用在多少个头上」。
    resolution: corrected
    changed_to: >-
      宽度改 6144；结论改为「元素吞吐略升（12,288 → 13,312，+8.3%），省下来的是参数量与两次全宽 reduce 的同步面」
  - id: R8
    field: bottlenecks
    severity: wrong
    claim: >-
      ep-comm 一条写「一个 token 的 8 个专家可以落到任意 8 个 EP 组上，目的地设备数没有上界约束」
    finding: >-
      上界是 min(top_k 8, EP size)，不是无界。n_group=1 / topk_group=1 取消的是
      **分组**约束（DeepSeek V2 那种「目的地组数 ≤ topk_group」），
      不是目的地数量本身的上界 —— 本仓 ds-v2 的记录对分组上界的描述是对的，
      这里把「取消分组」读成了「取消上界」。
    resolution: corrected
    changed_to: >-
      改为「取消的是分组约束，上界仍是 min(top_k 8, EP size)」
  - id: R9
    field: precision.quantization.subsystem_method
    severity: imprecise
    claim: >-
      「同样 89 份 e_score_correction_bias 是 F32 真参数……那 14,400 个 F32 元素是 weights_release 里 FP32 的唯一来源」
    finding: >-
      一句话里混了两个口径。router 桶（classify 的 mtp_from=92）实测 F32 是
      89 × 160 = **14,240** 个元素（BF16 72,908,800，占 99.9805%）；
      **14,400** 是整份清单的 90 份。承接「89 份」的「那 14,400 个」差 160 个元素，
      差的那一份在 draft 桶。同时 draft 桶因此也不同质
      （502 个张量里 501 BF16 + 1 个 F32），而原文只点名了 router 一个桶 ——
      glm-5.3 的 R8 是同型。
    resolution: corrected
    changed_to: >-
      拆开 router 桶 14,240 与全清单 14,400，并补上 draft 桶也不同质
  - id: R10
    field: infra_signals
    severity: overreach
    claim: >-
      「适配流程要把「草稿块有没有自己的 KV / 自己的词表」当作必问项 —— 这两项在 GLM-4.6 与 GLM-5 又各变过一次」
    finding: >-
      只有「自己的词表」这一项变过（4.5 有 → 4.6 无 → 4.7 又有 → GLM-5 无）。
      「自己的 KV」四代都没变：facts/glm-5 的 model.layers.78.* 带整套 MLA 投影
      （kv_a_proj_with_mqa [576, 6144]、kv_b_proj [28672, 512]、q_a_proj、q_b_proj），
      即 GLM-5 的 MTP 块仍然自产 KV —— 形态从 GQA 换成 MLA latent，
      但「有没有」这件事没动。两项并在一句里说「各变过一次」会让读者以为 KV 那一项也变过。
    resolution: corrected
    changed_to: >-
      拆成两句：词表这一项变过，自带 KV 这一项四代未变；item 级 evidence 从 derived 改 judgement
  - id: R11
    field: precision.quantization.subsystem_method
    severity: imprecise
    claim: >-
      「不是 scale，所以 per_subsystem_scale 里没有 router 项」
    finding: >-
      本代不量化，**根本没有 per_subsystem_scale 这个字段** —— 这句话指向空气。
      原句来自 glm-5.3（那份确实有 per_subsystem_scale，是 R9 写的），
      复制到不量化的记录里就不成立。glm-4.6 / 4.7 / 4.7-flash / 5 / 5.2 同病。
    resolution: corrected
    changed_to: >-
      改为「不是 scale 容器；本代不量化，没有 per_subsystem_scale 这个字段」，六份一起改
  - id: R12
    field: params.counting_note
    severity: missing
    claim: >-
      counting_note 没说 Gate B 的参数总量一项是实测比实测
    finding: >-
      同 glm-4-9b 的 R13，照 ds-v2 的写法补。
    resolution: corrected
    changed_to: >-
      补上这一句
notes: >-
  GLM 家族的 MoE 起点，也是第一代带 MTP 的 GLM。注意力仍是 GQA（96/8），
  MLA 要到 GLM-4.7-Flash 才进来，DSA 要到 GLM-5。
  层数、宽度、注意力几何、每层 norm 构成、专家分布与层集合、MTP 块构成、参数量与逐子系统精度
  都对照完整权重清单核过；top_k / routed_scaling_factor / norm_topk_prob / rope 参数
  这类运行期标量只有 config 一个来源，清单只有名字、形状与 dtype，交叉验证不了。
  打分函数（sigmoid 还是 softmax）这一代 config 不声明，故未写进 routing 的断言里。

open_questions:
  - >-
    MoE 是否用辅助损失没有一手来源。权重里有 e_score_correction_bias 只能说明
    走偏置纠偏（noaux_tc 族形态），两者可以共存 —— 本仓的 minimax-m2 同时有
    62 份 e_score_correction_bias 和 config 里的 router_aux_loss_coef 0.001。
    而「config 没有 aux_loss 字段」在这一代也不构成否证：这一代的 config
    连 topk_method / scoring_func 都不写
  - >-
    KV cache 的实际落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底
    （2 B/元素），所以 376832 B/token 是 dtype_fallback 兜底口径，
    不能和按落盘格式算出来的理论下限（如 DeepSeek V4.1 的 890 B/token）直接比倍数
  - 训练精度无一手声明，config 只有 torch_dtype=bfloat16，所以 precision.training 不填
  - >-
    MoE 的打分函数没有一手来源。config 这一代不写 scoring_func / topk_method，
    只有 norm_topk_prob 与 routed_scaling_factor；权重里的 e_score_correction_bias
    只能说明走偏置纠偏（noaux_tc 族），定不了 sigmoid 还是 softmax。
    GLM-4.7-Flash 的 config 才开始显式写 topk_method=noaux_tc，GLM-5 再加 scoring_func=sigmoid ——
    但「后面声明了」不能回填到这一代
  - >-
    MTP 块自带的 embed_tokens / shared_head.head 与主干的 embed_tokens / lm_head
    是不是数值相同的副本，清单定不了（只有形状与 dtype）。
    这件事有实害：若是同值副本，加载时可以共享一份显存；若是独立训练的权重，不能。
    GLM-4.6 去掉这两张（必然复用主干的）、GLM-4.7 又加回来，更说明这一项要读实现或比数值
  - >-
    较小档位 GLM-4.5-Air（同日发布，47 层含 MTP / hidden 4096 / 128 专家 top-8 /
    first_k_dense 1 / use_qk_norm=false / routed_scaling_factor 1.0）未收录：
    结构轴与本记录重合，没有新的对照价值。它的 MTP 块同样自带 embed_tokens 与
    shared_head.head（已按张量名清单核过）
