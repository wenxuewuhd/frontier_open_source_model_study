# 机械字段来自 config（official）；形状、参数量、子系统拆分、MTP 块构成与层集合来自完整权重清单（derived）。
id: glm-4.5
family: glm
kind: llm
display_name: GLM-4.5
released: '2025-07-20'
license: mit
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/zai-org/GLM-4.5
    locator: config.json @ cbb2c7cfb52f
    accessed: '2026-10-30'
    note: >-
      BF16 发布，93 分片。权重清单逐分片读头取全，44691 个张量，无读失败分片。
      另有同期的 GLM-4.5-FP8 与较小档位 GLM-4.5-Air（46 层 / 128 专家），均未收录

hf:
  repo: zai-org/GLM-4.5
  sha: cbb2c7cfb52fa128a9660cb1a7a78e017899e115
  last_modified: '2025-08-11T13:27:03.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: main
  predecessor: glm-4-32b-0414
  successor: glm-4.6
  changed_from_predecessor:
    - axis: moe
      text: >-
        家族首次从稠密转 MoE：160 个路由专家 + 1 个共享专家、top-8、专家中间维 1536，
        前 3 层仍稠密（中间维 12288）。逐专家独立张量存放，不是堆叠的 3 维权重。
        路由带 e_score_correction_bias [160]（F32），即偏置纠偏（noaux_tc 族形态）
      benefit: >-
        总参数 32.6B → 358B（11.0 倍），而带宽口径的激活参数只从 31.6B 变到 32.9B
        （+3.9%）—— decode 的权重带宽几乎没涨，容量涨了一个数量级。
        代价有三笔：(1) 权重存储 60.66 GiB → 667.46 GiB，HBM 容量成为首要约束；
        (2) 多出 EP all-to-all，每 token 2 × top_k 8 × hidden 5120 × 2 B = 163,840 B/层，
        89 个主干 MoE 层合计 14,581,760 B/token（14.58 MB）；(3) grouped GEMM 吃 2 维张量列表，
        EP 切分按张量分配而不是按堆叠首维切。n_group=1 且 topk_group=1，
        所以分组路由这条路实际未启用，不存在 DeepSeek V2 那种「组数约束目的地设备数」的收益
    - axis: attention
      text: >-
        KV 头数 2 → 8、query 头数 48 → 96，head_dim 仍 128；QKV 的 bias 回来了
        （attention_bias=true，但只在 q/k/v 上，o_proj 没有）；新增 QK-Norm
        （q_norm / k_norm，各 [128]，逐 head_dim 归一化）；
        每层 norm 从 4 处回到 2 处，0414 一代的 sandwich norm 去掉了
      benefit: >-
        KV 头数翻两番，每层缓存从 512 元素涨到 2048；叠上层数 61 → 92，
        每 token 从 31232 元素涨到 188416，**6.03 倍**。这是整条 GLM 线上
        KV 压力最重的一代 —— 32K 上下文就要 11.50 GiB（BF16 兜底口径），
        而权重里能省的（MoE）和缓存里要付的（更多 KV 头 × 更多层）正好反向。
        后面 GLM-4.7-Flash 转 MLA、GLM-5 叠 DSA，都是在还这笔账。
        QK-Norm 的推理代价不能只看参数宽度。被去掉的 sandwich norm 两处是
        post_self_attn_layernorm 与 post_mlp_layernorm，形状都是 **[6144]**
        （0414 的 hidden 是 6144，不是本代的 5120），每层归一化 2 × 6144 = 12,288 个元素；
        QK-Norm 的参数虽然各 [128]，但**各头共用一份参数、所有头都要过**，
        每层实际是 q 96 头 × 128 + k 8 头 × 128 = **13,312** 个元素，比 12,288 高 8.3%。
        所以 Vector 的**元素吞吐是略升的**；省下来的是参数量，以及两次全宽 reduce
        夹在残差加法之间带来的同步面（QK-Norm 可以跟 QKV 投影的 epilogue 一起做）
    - axis: decoding
      text: >-
        首次带 MTP 草稿块：config num_nextn_predict_layers=1，权重里第 92 层是一个
        完整 transformer 块 —— 自带注意力（与主干同名的 7 张投影张量：q/k/v 的 weight 与 bias 共 6 张加 o_proj，另有 q_norm / k_norm 两张）、160 专家 MoE、
        共享专家、router，外加主干没有的 eh_proj [5120, 10240]、enorm、hnorm、
        shared_head.norm，以及自己独立的 embed_tokens 与 shared_head.head
        （各 [151552, 5120]）
      benefit: >-
        投机解码把 decode 从「每步一个 token」变成「每步验证多个」，
        但草稿侧成本不是「再跑一个投影头」：实测 5,539,962,272 参数，
        占总量 1.55%，其中两张词表大小的张量（embed_tokens + shared_head.head）
        就占 1,551,892,480，是草稿块的 28.0%。
        **它也产出自己的 KV** —— 开草稿侧时 KV 层数要按 93 算，不是 92
    - axis: context
      text: 32768 → 131072（config max_position_embeddings），rope base 10000 → 1,000,000
      benefit: >-
        4 倍上下文，但叠上 KV 每 token 涨 6.03 倍，缓存总量涨 24 倍
        （同样 32K 下 1.91 GiB → 11.50 GiB；各自的最大上下文下 1.91 GiB @ 32768 → 46.0 GiB @ 131072，24.1 倍。
        两侧都是 BF16 兜底口径（bytes_basis: dtype_fallback），同一套 basis 才可以这样比）。
        长上下文这一代是靠 rope base 放大 100 倍换来的，结构上没有任何省缓存的改造
    - axis: precision
      text: 仍是 BF16 直接发布（另有独立的 GLM-4.5-FP8 仓，未收录）
      benefit: 主仓不量化，部署最简单；FP8 走单独的仓，与 GLM-5.3 把 FP8 做成主仓的做法不同

params:
  total: 358337791296.0
  breakdown:
    expert: 335963750400.0
    attention: 12542287872.0
    draft: 5539962272.0
    shared_expert: 2099773440.0
    embed: 775946240.0
    lm_head: 775946240.0
    dense_ffn: 566231040.0
    router: 72923040.0
    norm: 970752.0
  counting_note: >-
    按完整权重清单（93 分片 44691 条目）逐项求和，与 HF 平台自己从分片头统计的
    safetensors tally（358,337,791,296）逐位相同。清单 dtype 只有 BF16 与 F32 两种
    （F32 只有 e_score_correction_bias [160]，清单里 90 份、共 14,400 个元素 ——
    主干 89 层各一份加 MTP 块一份），
    没有量化 scale 容器、没有低位打包，条目数即张量数、numel 即参数数。
    厂商未在 config 或模型卡里声明总参数或激活参数，total 是本仓按清单求和的实测值。
    Gate B 的「参数总量」一项（delta 0.0）因此是**拿实测比实测，不构成核对** ——
    真正的外部核对是 HF 的 safetensors tally，它不依赖本仓任何一行代码。
    **draft 一项是第 92 层整块**（5,539,962,272），按层索引归类（classify 的 mtp_from=92）；
    主干是 0–91。total 含草稿侧，没有 excludes。
    逐因子核过：注意力 136,329,216/层 = q 12288×5120 + q.bias 12288 + k 1024×5120
    + k.bias 1024 + v 1024×5120 + v.bias 1024 + o 5120×12288，× 92 主干层 = 12,542,287,872；
    专家 3,774,873,600/层 = 160 × 3 × 1536×5120，× 89 个主干 MoE 层（L3–L91）= 335,963,750,400；
    共享专家 23,592,960/层 × 89 = 2,099,773,440；稠密 FFN 3 层 × 3 × 12288×5120 = 566,231,040；
    router 89 × (160×5120 + 160) = 72,923,040。
    q_norm / k_norm（各 [128]）按 scripts/lib/subsystems.py 的优先级归在 norm 桶，
    不在 attention 桶里 —— 所以 attention 的逐层乘式里没有它们

context:
  max: 131072

arch:
  layers: 92
  hidden: 5120
  vocab: 151552
  norm: RMSNorm（每层 2 处：input / post_attention；另有注意力内的 q_norm / k_norm，各 [128]）
  norm_eps: 1.0e-05
  activation: SwiGLU（hidden_act silu；gate / up / down 三张独立张量，专家与共享专家同）
  position: RoPE theta 1,000,000，partial_rotary_factor 0.5（只作用在每头前 64 维）

  attention:
    type: GQA
    num_heads: 96
    num_kv_heads: 8
    head_dim: 128
    head_dim_note: >-
      q_proj [12288, 5120] = 96 头 × 128，k_proj / v_proj [1024, 5120] = 8 头 × 128，
      o_proj [5120, 12288] = 入口 96 × 128。q/k/v 各带 bias，o_proj 没有。
      缓存宽度按 KV 头算：2 × 8 头 × 128 = 2048 元素/层/token；
      按 query 头数 96 折算会得 24576，高估 12 倍。
      QK-Norm 的 q_norm / k_norm 都是 [128]，即沿 head_dim 归一化、各头共用一份参数
    kv_sharing:
      layer_coverage: >-
        以下层数都是**主干口径**（0–91）：每层都有自己的 k_proj / v_proj，
        92/92 层产出 KV，无跨层共享、无滑窗、无稀疏。
        另有 MTP 块（第 92 层）自带与主干同名的 7 张注意力投影张量（q/k/v 的 weight 与 bias 共 6 张加 o_proj，另有 q_norm / k_norm），**也产出自己的 KV**；
        config 的 num_hidden_layers=92 不含它。所以清单里产出 KV 的层共 93 个，
        开 MTP 时要按这个数算（+2048 元素/token，+1.09%）
    layer_pattern: 92 层同构 GQA，无混合、无稀疏

  ffn:
    type: moe
    layer_pattern: >-
      第 0–2 层稠密（中间维 12288），其余 89 层为 MoE；MTP 块（第 92 层）也是 MoE。
      稠密层的 FFN 比单个专家宽 8 倍，单层 188,743,680 参数，
      是一层注意力 136,329,216 的 1.38 倍

  moe:
    routed_experts: 160
    shared_experts: 1
    top_k: 8
    intermediate: 1536
    first_k_dense: 3
    dense_intermediate: 12288
    routing: >-
      top-8 选路、norm_topk_prob=true 归一化、routed_scaling_factor 2.5。
      n_group=1 且 topk_group=1，分组路由实际未启用。
      config 这一代不声明 scoring_func 与 topk_method（GLM-4.7-Flash 起才显式写
      noaux_tc），所以打分函数本身没有一手来源，见 open_questions
    balance: >-
      e_score_correction_bias [160]（F32；清单里 90 份 —— 主干 89 个 MoE 层各一份加
      MTP 块一份）—— **偏置纠偏（noaux_tc 族形态）**。
      「所以无辅助损失」这半句**不成立，已删**：本仓的 minimax-m2 同时有 62 份
      e_score_correction_bias 和 config 里的 router_aux_loss_coef 0.001，
      两者可以共存，张量存在定不了 aux loss 的有无；而「config 没有 aux_loss 字段」
      在本代也不构成否证 —— 这一代的 config 连 topk_method / scoring_func 都不写。
      aux loss 有无见 open_questions
    storage_note: >-
      逐专家独立张量（mlp.experts.N.{gate,up,down}_proj），不是堆叠的 3 维权重。
      grouped GEMM 因此吃 2 维张量列表；EP 切分按张量分配，不按首维切

  decoding:
    mtp_layers: 1
    mtp_layers_note: >-
      config 声明 1，权重里确实只有 1 块（第 92 层，层索引 0–92 连续）——
      本代没有踩 DeepSeek「声明 1、权重里 3 块」那个坑。
      这一块自带 embed_tokens 与 shared_head.head 各 [151552, 5120]；
      GLM-4.6 把这两张去掉了（见该记录），GLM-4.7 又加回来

precision:
  weights_release: [BF16, FP32]
  quantization:
    per_subsystem:
      expert: BF16
      shared_expert: BF16
      attention: BF16
      dense_ffn: BF16
      draft: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（93 分片 44691 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空。44691 个条目里 44601 是 BF16、90 是 F32。
      **router 桶内部不同质**：主干 89 层（L3–L91）的 mlp.gate.weight [160, 5120] 是 BF16，
      同样 89 份 e_score_correction_bias [160] 是 F32 真参数（不是 scale 容器，
      所以**本代根本没有 per_subsystem_scale 这个字段** —— 不量化，不存在 scale 张量）。按元素数 router 桶 99.98% 是 BF16
      （BF16 72,908,800 / F32 14,240 = 89 × 160），代表值报 BF16。
      清单里这两种各有 90 份，第 90 份在 MTP 块（L92）、按层索引归在 draft 桶 ——
      所以全清单的 90 × 160 = 14,400 个 F32 元素是 weights_release 里 FP32 的唯一来源，
      其中 14,240 在 router 桶、160 在 draft 桶。
      **draft 桶因此也不同质**：502 个张量里 501 个 BF16 加这 1 个 F32；
      代表值报 BF16 没问题，但按「MTP 块整体 BF16」做名字精确匹配的流程要知道有这一张。
      这一代没有 quantization_config，不存在 scale 张量与量化块

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    ref:
      kind: modelcard
      url: https://huggingface.co/zai-org/GLM-4.5
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      这是整条 GLM 线上 KV 最重的一代：KV 头数 8（前代 2）× 92 层（前代 61），
      每 token 188416 元素。没有任何省缓存的结构 —— 无跨层共享、无滑窗、无稀疏、
      无 latent 压缩。长上下文的代价直接按「层数 × KV 头数 × head_dim」全额付。
      后面三代（GLM-4.7-Flash 的 MLA、GLM-5 的 DSA、GLM-5.2 的 indexer 分层）
      都在还这笔账。
    quantified: >-
      口径为**主干 92 层，不含 MTP 块**：2 × num_kv_heads 8 × head_dim 128 = 2048
      元素/层/token × 92 层 = 188416 元素/token。开 MTP 时第 92 层另有一层，
      即 93 层、190464 元素/token（+2048，+1.09%）。
      KV 落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底（2 B/元素）得
      376832 B/token、131072 上下文 46.0 GiB —— dtype_fallback 兜底口径，
      不是实测落盘量
    visibility: public
  - dimension: ep-comm
    finding: >-
      160 专家 top-8、专家中间维 1536，逐专家独立张量存放。
      EP 切分按张量分配而非按堆叠首维切，与 Qwen 那类 3 维堆叠权重的
      切分方式和算子签名都不同。n_group=1 / topk_group=1 意味着分组路由未启用，
      一个 token 的 8 个专家可以落到任意 8 个 EP 组上 —— 取消的是**分组**约束
      （DeepSeek V2 那种「目的地组数 ≤ topk_group」），不是目的地数量本身的上界：
      上界仍是 min(top_k 8, EP size)。
    quantified: >-
      每 token 每 MoE 层 2 × top_k 8 × hidden 5120 × 2 B（BF16）= 163,840 B，
      89 个主干 MoE 层合计 14,581,760 B/token（14.58 MB）
    visibility: public
  - dimension: operator-gap
    finding: >-
      MTP 块（第 92 层）是个完整 transformer 层：自带注意力、160 专家与共享专家、
      router，并带主干根本没有的 eh_proj [5120, 10240]（把两路 hidden 拼接后降维）
      与 enorm / hnorm / shared_head.norm。按主干层的算子集合去排 MTP 块，
      会少掉 eh_proj 这一张最宽的投影，也会漏掉它自己的 KV。
    quantified: 草稿块实测 5,539,962,272 参数（总量的 1.55%），其中 embed_tokens + shared_head.head 占 1,551,892,480（28.0%）
    visibility: public

infra_signals:
  - text: >-
      GLM 的 MoE 转型把容量和带宽解耦（总参数 ×11.0，带宽口径激活参数 +3.9%），
      但同一代把 KV 头数从 2 加到 8、层数从 61 加到 92，KV 每 token 涨 6.03 倍。
      **一代之内两笔账反向走**：权重侧省下来的，缓存侧又花出去了。
      排 infra 预算时这两笔要分开看 —— 按「MoE 省带宽」一句话推不出这一代的真实压力点。
    evidence: judgement
    horizon: settled
    axis: moe
  - text: >-
      MTP 草稿块在 GLM 家族从这一代开始，且一上来就是「完整 transformer 层 + 独立词表副本」
      的形态，不是轻量投影头。它自带 KV，所以缓存账的层数要按 93 而不是 config 的 92 算；
      适配流程要把「草稿块有没有自己的词表」当作必问项 ——
      **这一项在 GLM-4.6（去掉）与 GLM-5（同样没有）各出现过一次变化**。
      而「有没有自己的 KV」这一项四代都没变：GLM-5 的 MTP 块同样自带整套
      kv_a_proj_with_mqa / kv_b_proj / q_a_proj / q_b_proj，形态从 GQA 换成 MLA latent，
      但「自产 KV」这件事没动 —— 两项不要并在一句里说「各变过一次」。
    evidence: judgement
    horizon: now
    axis: decoding

