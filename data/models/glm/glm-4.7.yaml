# 机械字段来自 config（official）；「相对前代多了哪两张张量」与参数量来自完整权重清单（derived）。
# 这一份的全部价值在于：config 与前代逐字段相同，差异只有权重清单看得见。
id: glm-4.7
family: glm
kind: llm
display_name: GLM-4.7
released: '2025-12-22'
license: mit
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/zai-org/GLM-4.7
    locator: config.json @ 602d01efcdd3
    accessed: '2026-10-30'
    note: >-
      BF16 发布，93 分片。权重清单逐分片读头取全，44691 个张量，无读失败分片。
      另有同期的 GLM-4.7-FP8 仓，未收录；较小档位 GLM-4.7-Flash 单独立记录
      （它换了架构，不是档位缩小）

hf:
  repo: zai-org/GLM-4.7
  sha: 602d01efcdd332c5238ca4bcede555defbe83eb7
  last_modified: '2026-01-29T08:05:58.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: main
  predecessor: glm-4.6
  successor: glm-5
  changed_from_predecessor:
    - axis: decoding
      text: >-
        MTP 块（第 92 层）重新自带 embed_tokens 与 shared_head.head（各 [151552, 5120]），
        即 GLM-4.6 去掉的那两张回来了。清单 44689 → 44691，多的恰是这两张；
        与 GLM-4.5 比则是**名字、形状、dtype 逐个相同**，一个张量不差。
        config 与 GLM-4.6 **逐字段相同**（连 transformers_version 都一样），
        所以这个差异只有权重清单看得见
      benefit: >-
        草稿块从 3,988,069,792 回到 5,539,962,272 参数，总量
        356,785,898,816 → 358,337,791,296（+1,551,892,480，+0.43%），
        权重存储 664.57 → 667.46 GiB。收益在调度侧：草稿块不再和主干抢同一份
        词表与输出头的读带宽，两条路径可以各读各的；代价是多 2.89 GiB 显存。
        **这不是一条单向演进** —— 4.5 有、4.6 没有、4.7 又有，
        所以它更像是一个在两种实现之间来回的工程选择，而不是改进方向

params:
  total: 358337791296.0
  breakdown:
    expert: 335963750400.0
    attention: 12542287872.0
    draft: 5539962272.0
    shared_expert: 2099773440.0
    embed: 775946240.0
    lm_head: 775946240.0
    dense_ffn: 566231040.0
    router: 72923040.0
    norm: 970752.0
  counting_note: >-
    按完整权重清单（93 分片 44691 条目）逐项求和，与 HF 平台自己从分片头统计的
    safetensors tally（358,337,791,296）逐位相同。清单 dtype 只有 BF16（44601）与
    F32（e_score_correction_bias [160]，清单里 90 份、共 14,400 元素 ——
    主干 89 层各一份加 MTP 块一份），
    没有量化 scale 容器、没有低位打包，条目数即张量数、numel 即参数数。
    厂商未声明总参数或激活参数，total 是本仓按清单求和的实测值。
    Gate B 的「参数总量」一项（delta 0.0）因此是**拿实测比实测，不构成核对** ——
    真正的外部核对是 HF 的 safetensors tally，它不依赖本仓任何一行代码。
    draft 一项是第 92 层整块，按层索引归类；主干是 0–91，total 含草稿侧。
    **每一项都与 GLM-4.5 逐位相同**（含 draft），因为两代的张量集合完全一致；
    与 GLM-4.6 只差 draft 一项的 1,551,892,480 = 2 × 151552 × 5120

context:
  max: 202752

arch:
  layers: 92
  hidden: 5120
  vocab: 151552
  norm: RMSNorm（每层 2 处：input / post_attention；另有注意力内的 q_norm / k_norm，各 [128]）
  norm_eps: 1.0e-05
  activation: SwiGLU（hidden_act silu；gate / up / down 三张独立张量）
  position: RoPE theta 1,000,000，partial_rotary_factor 0.5（只作用在每头前 64 维）

  attention:
    type: GQA
    num_heads: 96
    num_kv_heads: 8
    head_dim: 128
    head_dim_note: >-
      与 GLM-4.5 / GLM-4.6 逐个张量相同：q_proj [12288, 5120]、k_proj / v_proj [1024, 5120]、
      o_proj [5120, 12288]，q/k/v 带 bias、o_proj 没有，QK-Norm 的 q_norm / k_norm 各 [128]。
      缓存宽度按 KV 头算：2 × 8 × 128 = 2048 元素/层/token；按 query 头数 96 折算高估 12 倍
    kv_sharing:
      layer_coverage: >-
        **主干口径**（0–91）：92/92 层产出 KV，无跨层共享、无滑窗、无稀疏。
        MTP 块（第 92 层）自带与主干同名的 7 张注意力投影张量（另有 q_norm / k_norm），**也产出自己的 KV**。
        所以清单里产出 KV 的层共 93 个，开 MTP 时按这个数算（+2048 元素/token，+1.09%）
    layer_pattern: 92 层同构 GQA，无混合、无稀疏

  ffn:
    type: moe
    layer_pattern: 第 0–2 层稠密（中间维 12288），其余 89 层为 MoE；MTP 块（第 92 层）也是 MoE

  moe:
    routed_experts: 160
    shared_experts: 1
    top_k: 8
    intermediate: 1536
    first_k_dense: 3
    dense_intermediate: 12288
    routing: >-
      top-8 选路、norm_topk_prob=true、routed_scaling_factor 2.5；n_group=1 且 topk_group=1，
      分组路由未启用。config 这一代仍不声明 scoring_func 与 topk_method
    balance: e_score_correction_bias [160]（F32；清单里 90 份 —— 主干 89 个 MoE 层各一份加 MTP 块一份）—— **偏置纠偏（noaux_tc 族形态）**；「无辅助损失」这半句不成立，
      见 glm-4.5 的 R6（本代 config 不声明 topk_method / scoring_func，
      而偏置纠偏与 aux loss 可以共存，minimax-m2 两者俱有）
    storage_note: 逐专家独立张量，不是堆叠的 3 维权重；grouped GEMM 吃 2 维张量列表，EP 切分按张量分配

  decoding:
    mtp_layers: 1
    mtp_layers_note: >-
      config 声明 1，权重里确实只有 1 块（第 92 层，层索引 0–92 连续）。
      这一块自带 embed_tokens [151552, 5120] 与 shared_head.head [151552, 5120]，
      外加 eh_proj [5120, 10240]、enorm、hnorm、shared_head.norm，构成与 GLM-4.5 相同

precision:
  weights_release: [BF16, FP32]
  quantization:
    per_subsystem:
      expert: BF16
      shared_expert: BF16
      attention: BF16
      dense_ffn: BF16
      draft: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      来自完整权重清单（93 分片 44691 条目）逐项统计，非抽样：每个条目都带 shape 与 dtype，
      failed_shards 为空。44601 个 BF16 + 90 个 F32，与 GLM-4.5 的 dtype 分布逐项相同。
      router 桶内部不同质：主干 89 层的 mlp.gate.weight 是 BF16，同样 89 份 e_score_correction_bias [160]
      是 F32 真参数（不是 scale 容器；本代不量化，没有 per_subsystem_scale 字段），按元素数 router 桶 99.98% 是 BF16。
      这一代没有 quantization_config，不存在 scale 张量与量化块

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    ref:
      kind: modelcard
      url: https://huggingface.co/zai-org/GLM-4.7
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      KV 结构与 GLM-4.5 / GLM-4.6 完全一致，仍是 92 层 × 8 KV 头 × 128 全量存。
      这一代也没有任何省缓存的改造 —— GLM 线上的缓存结构从 4.5 到 4.7 三代未动，
      要到 GLM-4.7-Flash 的 MLA 才第一次改。
    quantified: >-
      口径为**主干 92 层，不含 MTP 块**：2 × 8 × 128 = 2048 元素/层/token × 92 = 188416
      元素/token。开 MTP 时 93 层、190464 元素/token。
      KV 落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底（2 B/元素）得
      376832 B/token、202752 上下文 71.16 GiB —— dtype_fallback 兜底口径，不是实测落盘量
    visibility: public
  - dimension: weight-bandwidth
    finding: >-
      草稿块重新自带词表副本，多出 2.89 GiB 常驻显存。
      **在本仓 active_params 的带宽口径下**（derive.py 把 draft 整块排除，
      excluded.draft = 5,539,962,272）这 0.43% 是纯容量代价：
      带宽口径的激活参数与 GLM-4.6 逐位相同。
      但那是口径选择不是硬件事实 —— 真开 MTP 时，草稿侧的
      shared_head.head [151552, 5120]（775,946,240 参数）每个草稿步要对全词表做一次 GEMM，
      那是真实带宽。同一份记录在缓存账上把 MTP 块算了进来（93 层）、
      在权重带宽上把它整块排除，两处口径不同，这里写明。
    quantified: >-
      +1,551,892,480 参数 / +2.89 GiB 权重存储；带宽口径的激活参数
      与 GLM-4.6 逐位相同（32,856,319,904）
    visibility: public

infra_signals:
  - text: >-
      本代是「config 看不出差异、权重清单才看得出来」的一个干净样本：
      config 与 GLM-4.6 逐字段相同（连 transformers_version 都没动），
      而清单多了两张词表大小的张量。
      反过来和 GLM-4.5 比则是张量级完全一致、config 只差 max_position_embeddings。
      跟踪时只读 config 会得出「4.6 与 4.7 零差异」的结论，
      只读 HF 的参数总量会得出「4.7 等于 4.5」—— 两个都不对。
      **结构差异要在 config 与清单两侧都比一遍**。
    evidence: derived
    horizon: now
    axis: decoding

