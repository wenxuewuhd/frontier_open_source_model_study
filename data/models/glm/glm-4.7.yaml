notes: >-
  GLM-4 线的最后一代主干旗舰。能力上是大版本，结构上相对 GLM-4.6 只有一处：
  MTP 块重新自带词表副本与输出头。这一处 config 里看不见 ——
  GLM-4.6 与本代的 config 逐字段相同，差异完全来自权重清单的逐张量比对。
  和 GLM-4.5 比则是张量集合完全一致（44691 个名字、形状、dtype 逐个相同），
  参数量逐项逐位相同，config 只差 max_position_embeddings（131072 → 202752）。
  层数、宽度、注意力几何、专家分布、MTP 块构成与逐子系统精度都对照完整权重清单核过。

open_questions:
  - >-
    MoE 是否用辅助损失没有一手来源。权重里有 e_score_correction_bias 只能说明
    走偏置纠偏（noaux_tc 族形态），两者可以共存 —— 本仓的 minimax-m2 同时有
    62 份 e_score_correction_bias 和 config 里的 router_aux_loss_coef 0.001。
    而「config 没有 aux_loss 字段」在这一代也不构成否证：这一代的 config
    连 topk_method / scoring_func 都不写
  - >-
    KV cache 的实际落盘精度未披露，按 config 的 torch_dtype=bfloat16 兜底，
    bytes_basis 是 dtype_fallback
  - 训练精度无一手声明，config 只有 torch_dtype=bfloat16，所以 precision.training 不填
  - >-
    MTP 块自带的 embed_tokens / shared_head.head 与主干那两份是不是同值副本，
    清单定不了（只有形状与 dtype）。这件事决定了加载时能不能共享显存，
    而 4.5 有 / 4.6 没有 / 4.7 又有的来回更说明要读实现或直接比数值
  - >-
    为什么要把 GLM-4.6 去掉的两张加回来，没有一手来源。
    记录里给的收益（草稿侧与主干不再抢同一份词表的读带宽）是推论，不是厂商说法
  - >-
    MoE 的打分函数仍无一手来源（见 glm-4.5 的同一条）
