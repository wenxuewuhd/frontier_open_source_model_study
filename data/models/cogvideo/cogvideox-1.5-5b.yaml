      于是 512 × 3072/5120 = 307.2 才是两个数之间的真实比值。
      **两个因子（入口宽度与 hidden）被压进了一个倍数里**，
      正是 CLAUDE.md「不同口径之间不算倍数」与「一个乘式逐因子验」说的那回事 ——
      而这一段的全部论点恰恰就是「倍数来自入口宽度」，
      所以读者越相信这一段，越会把 307.2 读成 512。
