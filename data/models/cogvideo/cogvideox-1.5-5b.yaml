reviewed:
  date: '2026-10-31'
  method: >-
    Gate B 三路：组件 config（4 份）、权重清单（transformer 3 分片 + text_encoder
    4 分片 + vae 单文件，逐文件读头）、以及 diffusers pipeline 的补齐逻辑。
    结构字段三路一致：42 层 / 48 头 / head_dim 64（48×64 = 3072 = hidden）
    在 config 与清单两处相同；`patch_embed.proj.weight [3072, 128]` 里
    128 = 16×2×2×2 同时坐实 latent 16 通道与三维各 2 的 patch，与 config 的
    `in_channels: 16` / `patch_size: 2` / `patch_size_t: 2` 对上；
    `ff [12288,3072]` = 4×hidden；`norm1.linear [18432, 512]` 里
    18432 = 6×3072 而入口 512 = `time_embedding` 出口，**不等于 hidden**，
    据此断定调制是逐样本的（与 h3 同一个判法，不依赖读实现）。
    外部对账：实测 5,570,676,352 与 **HF 自己的 safetensors tally 逐位相同**。
    专门验了一件：`patch_size_t` 为 2 而因果 VAE 给奇数 latent 帧时怎么办（R2）。
    Gate C：判断类字段 7 处，逐条在 evidence 里标了 judgement。

review:
  - id: R1
    field: generation.backbone.stream_design
    severity: miscategorized
    claim: >-
      CogVideoX 的文本条件和别家一样走 cross-attention
    finding: >-
      **不是。文本与视频拼进同一条自注意力序列。**
      权重上的判据很干净：每层**只有 `attn1`**，没有 `attn2`；
      而 `CogVideoXPatchEmbed.forward` 里
      `torch.cat([text_embeds, image_embeds], dim=1)`。
      `max_text_seq_length` 226。

      后果有两个：注意力序列是 n+226 而不是 n（文本也吃 O(n²)）；
      以及 `param_scaling.per_text_token` 在这一份上只剩
      `patch_embed.text_proj` 一项 —— 文本进序列之后与视频 token 共用
      同一套注意力与 FFN，没有专属参数。
      **同一个字段在三种流设计下语义不同**：这一份 in_sequence、
      stepvideo 是 cross-attn、hunyuanvideo-1.5 是双流
    resolution: corrected
    changed_to: >-
      `stream_design` 与 `text_conditioning` 都填 `in_sequence`，
      `param_scaling.note` 里写明三种流设计下这个桶的语义差别
  - id: R2
    field: generation.buckets.0.latent_frames
    severity: wrong
    claim: 81 帧的 latent 帧数是 (81−1)/4+1 = 21，DiT 在 21 个 latent 帧上工作
    finding: >-
      **21 是 VAE 的输出，但 DiT 工作在 22 个上。**
      `patch_size_t` 是 2，要求 latent 帧数是偶数，而因果 VAE 给的是奇数。
      pipeline 的做法（`pipeline_cogvideox.py` 680–687 行）是**补**：
      `additional_frames = patch_size_t - latent_frames % patch_size_t` = 1，
      `num_frames += 1 × 4`，于是按 85 帧去生成、latent 22；
      去噪跑完再 `latents = latents[:, additional_frames:]` 把补的那段丢掉，
      解码出 81 帧。

      **所以进 token 数的是 22 不是 21**，时间位置 22/2 = 11。
      按 21 算会得 10.5（非整数，推导会报警告）或被整除成 10，
      两种都比真值低 —— token 数差 9%。
      而且端到端的时间压缩比因此不是 8 而是 81/11 = **7.364**
    resolution: corrected
    changed_to: >-
      `buckets[0].latent_frames` 声明 **22** 并在 note 与本条写明 21 与 22 的区别；
      `vae.temporal_compression` 仍填 4、`patch_size` 的 t 仍填 2（都是一手事实），
      不为了凑端到端比值去改
  - id: R3
    field: generation.constraints.frame_formula
    severity: unsupported
    claim: 帧数约束 16N+1 可以从结构推出来
    finding: >-
      **推不出来，只能照抄卡。** 结构上的要求是：
      因果 VAE 的 (F−1)/4+1 要能被 `patch_size_t` 2 整除 ⇒ F = 8N+1。
      而卡上写的是 **16N+1（N ≤ 10）**，因子比结构要求的大一倍。
      多出来的那个 2 卡上没有解释 —— 可能与 VAE 的分块、位置编码表的预生成
      或训练时的档位有关，但都是猜
    resolution: open
    changed_to: >-
      `frame_formula` 照卡填 16n+1 并在 note 写明「比结构要求的 8N+1 严一倍，
      原因卡上没说」。**没有去填结构推出来的 8N+1** ——
      卡是第二档来源，而这里只有卡说了话
  - id: R4
    field: '-'
    severity: stale
    claim: >-
      stepvideo-t2v-30b 的 infra_signal：「AdaLN 的代价是一条清晰的代际线，
      按发布时间排 2025-02 与 2025-07 在 1% 上下、2025-11 与 2026-07 在三分之一」
    finding: >-
      **把九份摆齐之后这条线两个方向都破了。**
      这一份 2024-11 发布，比那两个「1% 上下」的都早，AdaLN 却占 **14.35%**；
      而 ltx-2（2026-01）比那两个「三分之一」里早的那个还晚，却只有 **1.60%**。
      完整序列（九份里七份可算）：14.35%（2024-11）→ 0.91%（2025-02）
      → 1.30%（2025-02）→ 1.35%（2025-07）→ 32.71%（2025-11）
      → **1.60%（2026-01，ltx-2）** → 39.41%（2026-07），**两个方向都不单调**。
      ltx-2 比早它两个月的 hunyuanvideo-1.5 低 20 倍，这一条比「更早的一代偏高」更致命。

      真正的驱动不是年份，是**「是否逐层」× 「条件向量入口宽度」**：
      stepvideo 用 AdaLN-Single（全局一套）所以最便宜；
      这一份逐层但入口只有 512；hunyuanvideo-1.5 逐层、入口 2048（= hidden）；
      h3 逐层、入口 2688。

      这正是 CLAUDE.md 「结构规律写进记录时钉住代际，零例外在下一代通常就不成立」
      说的那回事 —— 只是这次失效的方向是**更早的一代**，不是更晚的
    resolution: open
    changed_to: >-
      本记录的 bottlenecks 与 infra_signals 按「设计决定而非年代决定」写。
      **stepvideo 那份的 infra_signal 需要同步更正** —— 本次只写本记录，
      已报主会话（那份已在 main 上）
  - id: R5
    field: '-'
    severity: wrong
    claim: >-
      stepvideo-t2v-30b 的 VAE note：「压缩率在已录的五份里最激进 ——
      16×16 空间 / 8× 时间 / 64 latent 通道」
    finding: >-
      **这一条在写下它的那一刻就是错的，不是过期。** 它自己的表头就列了
      ltx-2 与 ltx-2.3 已录在先，而这两份的 VAE 是 **32× 空间 / 8× 时间** ——
      时间维持平、空间维高一倍。stepvideo 的 16×16 空间在九份里只排到并列第四。
      它还把计数写成「已录 5 份」，而连它自己的表头都列了 5 个前序记录
      （所以至少是第 6 份）；真实数字是第 8 份 ——
      wan2.1-t2v-14b 与 wan2.2-t2v-a14b 没被数进去。

      与 R4 不同：R4 那条是**后来被新数据推翻**（severity `stale`），
      这一条是**当时手边就有全量数据却没去数**（severity `wrong`）。
      后者更坏，因为它不需要发生任何事就已经是错的
    resolution: open
    changed_to: >-
      本记录只在自己的字段里给出核过的九份对照（见 notes 的压缩率表）。
      **stepvideo 那份要改的是三处**：VAE note 的「最激进」、
      全文的「五份」计数、以及 R6 那条 BF16 的说法 —— 那份已在 main 上，已报主会话
  - id: R6
    field: '-'
    severity: stale
    claim: >-
      stepvideo-t2v-30b 的 precision note：「已录五份里第一份主干以 BF16 发布的」
    finding: >-
      **写的时候成立，现在不成立。** 当时已录的五份里带 BF16 的
      （minimax-h3 2026-07、ltx-2 2026-01、ltx-2.3 2026-03）都晚于
      stepvideo 的 2025-02，所以那句话当时是对的。
      这一份 2024-11 发布、`weights_release: [BF16, FP32]`、
      `inference_default: BF16`，比它早一年多 —— 现在最早的那份是这一份
    resolution: open
    changed_to: >-
      本记录不去抢「第一份」这个说法（它随下一份记录就会再变一次），
      只记事实：主干 BF16、VAE 与文本编码器 F32。已报主会话

notes: >-
  **字节对账。** transformer 11,141,352,704 + text_encoder 19,049,242,624
  + vae 862,335,628 = 31,052,930,956 B，而 HF 的 usedStorage 是
  31,053,918,980 B，**差 988,024 B** —— 就是 tokenizer 的 spiece.model、
  各 config 与 README。**这是我亲手核过 usedStorage 的四份里最干净的一个仓**
  （hunyuanvideo-1.5 差 13.6 MB 也算干净；stepvideo 高 75%、minimax-h3 高 146%。
  wan 与 ltx 那几份不是我录的，没核过它们的 usedStorage，所以不参与这个比较）。

  **九份记录的有效压缩率与分法对照**（空间 / 时间，括号内是 VAE 与 patch 各担多少）：
  这一份 16×（8 VAE × 2 patch）/ 8×（4 × 2）；stepvideo 16×（16 × 1）/ 8×（8 × 1）；
  wan2.1-t2v-14b 16×（8 × 2）/ 4×（4 × 1）；wan2.2-t2v-a14b 16×（8 × 2）/ 4×（4 × 1）；
  wan2.2-ti2v-5b 32×（16 × 2）/ 4×（4 × 1）；hunyuanvideo-1.5 16×（16 × 1）/ 4×（4 × 1）；
  ltx-2 与 ltx-2.3 32×（32 × 1）/ 8×（8 × 1）；minimax-h3 32×（16 × 2）/ 4×（4 × 1）。
  **这一份与 stepvideo 的有效压缩完全相同而分法相反** —— 见 infra_signals 第一条。
  空间压缩最高的是 ltx 两份与 wan2.2-ti2v-5b、h3（32×）；时间维到 8× 的只有
  这一份、stepvideo 与 ltx 两份。

  **卡上的「推理精度」不是发布格式。** 规格表写「BF16（推荐）、FP16、FP32、
  FP8、INT8，**不支持 INT4**」—— 那是**支持跑**的精度，不是仓里有的权重。
  仓里只有 BF16 的 DiT 与 F32 的两个附属组件，没有任何量化权重，
  所以本记录没有 `precision.quantization` 块。
  「不支持 INT4」是卡上少见的否定式声明，值得记一笔：它说明厂商试过。

  **取数提醒。** 这个仓是视频线九份里最规整的：标准 diffusers 布局、
  `model_index.json` 列全四个组件、三块权重都是 safetensors 都能实测、
  没有并列布局也没有同名不同形的文件。
  `fetch_hf.py --include 'transformer/*'` 取 DiT 即可；
  文本编码器与 VAE 要单独量（本记录就是这么做的）。

open_questions:
  - >-
    **技术报告 arXiv 2408.06072 没读**，而且那是 CogVideoX 初代（2024-08）的报告，
    1.5 代是否另有报告未确认。3D 全注意力、expert-adaLN、3D VAE 这三处设计的
    原始论证要以报告为准
  - >-
    **官方 SAT 实现（THUDM/CogVideo）没对照。** 本记录的 latent 补齐逻辑（R2）
    取自 diffusers 的 pipeline，按本仓来源优先级那是**第四档「引擎实现」**。
    引它是因为补齐逻辑只在这条链上写着、模型卡没有提；
    但 SAT 那边是否同样处理、或者根本是另一套，没有核对。
    **这是本记录证据链上最弱的一环**
  - >-
    `generation.constraints.frame_formula` 的 16N+1 比结构要求的 8N+1 严一倍（R3），
    多出来的那个因子 2 卡上没有解释
  - >-
    `stepvideo-t2v-30b` 的 infra_signal 被本记录证伪（R4），**那份记录需要同步更正**。
    本次只写本记录，已报主会话
  - >-
    前代 CogVideoX-5b / -2b 没录，所以 `lineage.changed_from_predecessor` 为空。
    与它们的差分（加 `patch_size_t` 2、分辨率档从 720×480 到 1360×768、
    帧数从 8N+1 到 16N+1）现在只有线索没有对账
  - >-
    训练精度无一手来源。发布权重 DiT 全 BF16、文本编码器与 VAE 全 F32 是实测，
    卡上「BF16（推荐）…不支持 INT4」说的是**支持的推理精度**，不是训练格式
  - >-
    **推导给的序列长度与 FLOPs 都是下界**，因为 schema 没有地方声明文本 token 数
    （与 stepvideo 的 R6 同一个缺口，但这一份影响更大）：
    这一份是 in-sequence，226 个文本 token 既进线性项也进注意力的平方项。
    手算真值：序列 44,880 + 226 = 45,106，注意力因此比推导给的高 **1.01%**，
    线性项高 2×12,585,984×226 = 5.7e9（可忽略）。
    `max_text_seq_length` 是 226，已写在 backbone.note 里 ——
    等 schema 有了 `text_tokens` 就能填
  - >-
    没有任何性能数据。卡上既没有耗时也没有显存，
    `performance[]` 因此是空的 —— 这与 stepvideo（卡上有两行实测）
    和 hunyuanvideo-1.5（报告有 Table 7/8）不同
