id: cogvideox-1.5-5b
family: cogvideo
kind: video-gen
display_name: CogVideoX1.5-5B
released: '2024-11-08'
license: other
visibility: public

# 视频线第九份记录（录入次序），但**发布最早**（2024-11）。
# 口径沿用 wan2.2-ti2v-5b：params.total 只算 DiT；不建 arch 块；没有 KV cache 这笔账。
#
# 下面这三条都是**对着已录的九份逐字段核过的**，不是印象：
#   1. **时间维 patchify**（patch_size_t 2）—— 九份里唯一一个，其余八份 patch 的 t 都是 1
#   2. 调度器是 **DDIM + v_prediction** —— 九份里唯一一个，其余八份全是 flow matching
#   3. 文本与视频拼进同一条注意力序列 —— **不是唯一**，minimax-h3 也是这样
#      （其余七份走 cross-attn 或双流）

sources:
  - kind: modelcard
    url: https://huggingface.co/zai-org/CogVideoX1.5-5B
    locator: README.md §Model Introduction 的规格表与 §Quick Start 的 diffusers 示例 @ fdc5267c90b5
    accessed: '2026-10-31'
    note: >-
      官方口径来源。规格表给出：发布日期 **2024-11-08**、
      分辨率 **1360×768**、帧数 **16N+1（N ≤ 10）**、帧率 **16 fps**、
      推理精度「BF16（推荐）、FP16、FP32、FP8、INT8，不支持 INT4」。
      §Quick Start 的示例给了 `num_inference_steps=50` / `num_frames=81` /
      `guidance_scale=6` —— **采样参数来自模型卡自己的代码块**（第二档来源），
      不是厂商参考实现。九份里 ltx-2 的卡也有同类代码块；
      wan、stepvideo 那几份的步数与 CFG 则只能取自参考实现。
      注意 HF 的 `createdAt` 是 2024-11-02，比卡上的发布日期早 6 天，本记录用卡上的
  - kind: paper
    url: https://arxiv.org/abs/2408.06072
    locator: 卡上给的 arxiv 链接
    accessed: '2026-10-31'
    note: >-
      **本轮没有读。** 那是 CogVideoX 初代（2024-08）的报告，1.5 代是否另有报告未确认。
      按本仓来源优先级技术报告在模型卡之上，所以 3D 全注意力、expert-adaLN、
      3D VAE 这三处设计的原始论证要以报告为准，届时需重核
  - kind: repo
    url: https://github.com/huggingface/diffusers/blob/main/src/diffusers/pipelines/cogvideo/pipeline_cogvideox.py
    locator: CogVideoXPipeline.__call__ 第 680–687 行与第 786 行 @ main
    accessed: '2026-10-31'
    note: >-
      **latent 口径的一手依据，而且它解释了 `patch_size_t` 的一个坑。**
      `latent_frames = (num_frames - 1) // vae_scale_factor_temporal + 1`；
      紧接着：
      `if patch_size_t is not None and latent_frames % patch_size_t != 0:`
      `    additional_frames = patch_size_t - latent_frames % patch_size_t`
      `    num_frames += additional_frames * vae_scale_factor_temporal`，
      去噪跑完之后 `latents = latents[:, additional_frames:]` 把补的那段丢掉。

      默认档 81 帧：latent 21（奇数）→ 补 1 → **DiT 实际在 22 个 latent 帧上工作**
      → 时间维 patch 2 → **11 个时间位置**。见 R2。

      **来源档位**：CogVideoX 以 diffusers 格式发布（仓里就是 `model_index.json`
      加组件目录），但按本仓的优先级 diffusers 仍是第四档「引擎实现」。
      这里引它是因为补齐逻辑**只在这条链上写着** —— 模型卡没有提。
      官方 SAT 实现（THUDM/CogVideo）本轮没对照，见 open_questions
  - kind: modelcard
    url: https://huggingface.co/zai-org/CogVideoX1.5-5B
    locator: transformer 3 分片 + text_encoder 4 分片 + vae 单文件的头 @ fdc5267c90b5
    accessed: '2026-10-31'
    note: >-
      权重清单逐文件读头取全。transformer 1024 张量 / 5,570,676,352 参数（全 BF16），
      **与 HF 自己的 safetensors tally 逐位相同**。
      text_encoder（T5-XXL）219 张量 / 4,762,310,656 参数，**全 F32**。
      vae 436 张量 / 215,583,907 参数，全 F32。
      三者都在同一个仓、都是 safetensors。
      九份里能把 DiT、文本编码器、VAE **三块都实测**的有三份：这一份、
      minimax-h3 与 ltx-2；wan 三份的 VAE 与 T5 是 `.pth`、
      hunyuanvideo-1.5 的三个编码器要去别处取、stepvideo 的 HunyuanCLIP 是 pickle

hf:
  repo: zai-org/CogVideoX1.5-5B
  sha: fdc5267c90b5c06492985b966e43aae984e189e0
  last_modified: '2025-03-28T06:00:10.000Z'
  pipeline_tag: text-to-video
  gated: false

lineage:
  track: main
  # cogvideo family 的最新也是最后一份：zai-org 的视频线自 2024-11 之后
  # 没有新的 CogVideoX（2026-06 的 SCAIL-2 是姿态驱动角色动画，
  # 2025-12 的 RealVideo 是 Wan2.2-S2V 微调），所以这条线停在这里。
  # 前代 CogVideoX-5b / -2b 按视频线 policy 不单开记录：
  # 相对它们，这一份的差分是「加时间维 patchify（patch_size_t 2）+ 分辨率档变大」，
  # 主干与 VAE 的形态未变。那条差分等 changed_from_predecessor 有对象时再补。
  #
  # 与同厂语言模型 family `glm` 没有任何共用组件 —— 文本编码器是 T5-XXL。

params:
  total: 5570676352
  active_decode: 5570676352
  active_prefill: 5570676352
  breakdown:
    ffn: 3171538944
    self_attention: 1585973760
    adaln_modulation: 799259648
    text_proj: 12585984
    patch_embed: 789632
    norm: 528384
  counting_note: >-
    **只含 DiT 主干**，按完整权重清单（3 分片 1024 张量）逐项统计。
    全 BF16，无 scale 容器、无打包容器：5,570,676,352 × 2 B = 11,141,352,704 B。
    **与 HF 自己的 safetensors tally 逐位相同**，那是不依赖本仓代码的外部锚。

    **两块不在这个数里，但都在同一个仓、都是 safetensors**：
    文本编码器 T5-XXL 4,762,310,656 参数 / 19,049,242,624 B（**全 F32**）、
    VAE 215,583,907 参数 / 862,335,628 B（全 F32）。
    三者相加 31,052,930,956 B（28.92 GiB）——
    **文本编码器按字节是 DiT 的 1.71 倍**，因为它是 F32 而 DiT 是 BF16；
    按参数则是 0.85 倍。这两个比值方向相反，是「不同口径之间不算倍数」的一个小例子。

    分桶口径：`self_attention` 是每层一套 q/k/v/o（各 [3072,3072] 带 bias）
    加两对 [64] 的 QK-norm；**没有 attn2** —— 文本与视频在同一条序列里，
    只有一套自注意力（见 backbone.note）；
    `ffn` 是 [12288,3072] + [3072,12288]，12288 = 4×3072，非门控；
    `adaln_modulation` 含每层**两套** `norm1.linear` / `norm2.linear`
    （各 [18432, 512]，18432 = 6×3072）、`time_embedding` 与 `norm_out.linear`。

generation:
  backbone:
    stream_design: in_sequence
    layers: 42
    double_blocks: 0
    single_blocks: 42
    hidden: 3072
    heads: 48
    head_dim: 64
    ffn: 12288
    text_conditioning: in_sequence
    patch_size: [2, 2, 2]
    position: "3D RoPE（config 的 use_rotary_positional_embeddings 为 true）"
    param_scaling:
      per_sample: 799259648
      per_video_token: 4758830720
      per_text_token: 12585984
      note: >-
        三桶相加等于实测总量 5,570,676,352。

        **`per_sample` 占 14.35%，而这一份是九份里发布最早的（2024-11）** ——
        所以 AdaLN 的占比**不是一条随时间单调上升的线**，见 bottlenecks 第二条。
        它之所以比 hunyuanvideo-1.5（32.71%）和 h3（39.41%）低得多，
        不是因为早，而是因为**条件向量只有 512 维**：
        `norm1.linear` 是 [18432, **512**]，入口是 `time_embedding` 的出口宽度，
        不是 hidden 3072。h3 那边入口 2688、hy15 那边 2048（= hidden），所以贵得多。

        **入口 512 ≠ hidden 3072，所以光凭形状就能断定它吃的是条件向量、
        每次前向只过一遍** —— 和 h3 的判法相同，不用读实现。

        `per_text_token` 只有 `patch_embed.text_proj`（[3072, 4096]）：
        文本进序列之后与视频 token 走同一套注意力和 FFN，
        所以除了这个投影，文本不再有专属参数。
        **这与 stepvideo 的 cross-attn 和 hunyuanvideo-1.5 的双流都不同** ——
        同一个字段在三种流设计下语义不同，填的时候要看 `stream_design`
    note: >-
      **文本与视频拼进同一条注意力序列。** 九份里还有 minimax-h3 也这样
      （其余七份走 cross-attn 或双流），但那一份是文本+视频+音频三模态 packed，
      这一份只有文本+视频。权重上的判据很干净：每层**只有 `attn1`**，
      没有 `attn2`，而 `patch_embed` 里把 `text_proj` 的输出与 patch 后的视频
      token `torch.cat` 起来。`max_text_seq_length` 226。
      后果是注意力序列是 n+226 而不是 n，且文本 token 也吃 O(n²) 那一项。

      **`patch_size` 是 (2,2,2) —— 九份里唯一在时间维也 patchify 的**
      （其余八份 patch 的 t 都是 1，逐份核过）。
      判据：`patch_embed.proj.weight` 是 [3072, **128**]，
      而 128 = 16（latent 通道）× 2 × 2 × 2，三个维度各 2。
      所以有效压缩是空间 8×2 = 16、时间 4×2 = 8。
      时间维 patchify 带来一个别家没有的麻烦：latent 帧数必须是偶数，
      而因果 VAE 给出的是奇数，于是要补一帧再丢掉（见 R2）

  vae:
    spatial_compression: 8
    temporal_compression: 4
    latent_channels: 16
    causal: true
    decoder_arch: conv3d
    params: 215583907
    name: AutoencoderKLCogVideoX（3D 因果 VAE）
    note: >-
      215,583,907 参数 / 862,335,628 B，436 张量全 F32（逐条实测）。
      **在 VAE 参数量已知的六份里最小**（215.6M，其次 stepvideo 498.8M、
      ltx-2.3 726.1M、ltx-2 1222.5M、hunyuanvideo-1.5 1260.6M、h3 2603.9M；
      wan 三份的 VAE 是 `.pth` 量不到）。
      VAE 自身的压缩率 8×/4× **与 wan2.1-t2v-14b、wan2.2-t2v-a14b 并列最低**，
      不是独自最低。16 latent 通道。
      `use_quant_conv` 与 `use_post_quant_conv` 都是 false。

      **压缩率低的代价由 DiT 的时间维 patchify 补回来一半**：
      VAE 只压 8×8×4，但 DiT 的 patch 是 (2,2,2)，
      所以有效压缩 16×16×8 —— 和 stepvideo 的 16×16×8 **正好相同**，
      只是一个全压在 VAE 里、一个 VAE 与 DiT 各压一半。
      两种分法的差别在 VAE 的大小（0.22B vs 0.50B）与 latent 通道数（16 vs 64）

  text_encoders:
    - role: primary
      name: T5-XXL（encoder-only）
      params: 4762310656
      hidden: 4096
      shipped_with_weights: true
      gated: false
      release_dtype: FP32
      substitutable: false
      note: >-
        **随仓发布且是 safetensors，所以参数量是实测不是推算** ——
        4,762,310,656，219 张量**全 F32**。
        九份里文本编码器参数能实测的有这一份、minimax-h3 与 ltx-2；
        wan 的 umT5 是 .pth 只能按文件大小推、
        hunyuanvideo-1.5 的三个编码器全要去别处取（其中一个在 gated 仓）、
        stepvideo 的 HunyuanCLIP 是 pickle、ltx-2.3 的没单独量。
        hidden 4096 与 DiT config 的 `text_embed_dim` 以及
        `patch_embed.text_proj.weight` 的 [3072, 4096] 三处一致。

        **它按字节比 DiT 还大**（19.05 GB vs 11.14 GB），因为 F32 对 BF16；
        按参数则小（4.76B vs 5.57B）。两个方向相反的比值，别混用

  sampling:
    steps: 50
    cfg:
      scale: 6.0
      distilled: false
      embedded: false
      forwards_per_step: 2
    scheduler: CogVideoXDDIMScheduler（DDIM，v_prediction，zero-SNR rescale，trailing spacing）
    note: >-
      **调度器是 DDIM + v_prediction，不是 flow matching** ——
      九份里唯一一个（截至 2026-10-31，逐份核过），其余八份全是 flow matching。
      config 里 `prediction_type: v_prediction`、`rescale_betas_zero_snr: true`、
      `timestep_spacing: trailing`、`beta_schedule: scaled_linear`。
      这一条影响的是**步数能压到多少**：v-prediction + zero-SNR 是 2023–2024 的做法，
      与后来各家普遍转向 flow matching 的理由（少步采样更稳）直接相关。

      步数 50 与 CFG 6 取自**模型卡自己的代码块**（第二档来源），不是参考实现。
      端到端是 50 步 × 2 次前向 = **100 次 5.57B 主干前向**

  buckets:
    - width: 1360
      height: 768
      frames: 81
      text_tokens: 226
      latent_frames: 22
      fps: 16
      duration_s: 5.0625
      default: true
      note: >-
        卡的规格表给分辨率 1360×768、帧率 16 fps，§Quick Start 的示例给 `num_frames=81`。
        **`latent_frames` 声明 22 而不是 21**：因果 VAE 给的是
        (81−1)/4+1 = **21**，但 `patch_size_t` 是 2 要求偶数，
        pipeline 补一帧到 **22** 再在解码前丢掉。
        DiT 实际工作在 22 个 latent 帧上，所以进 token 数的是 22（见 R2）。
        latent 空间 768/8 × 1360/8 = 96×170，patch 2 → 48×85；
        时间 22/2 = 11 → 视频 token **44,880**，加文本 226 → 序列 **45,106**。
        `text_tokens` 填 226 是 `max_text_seq_length` 这个**定长**值：
        这一份把 prompt 补齐 / 截断到 226，不是实际 prompt 长度随输入变 ——
        所以它是档位的属性而不是某次调用的属性

  constraints:
    width_divisor: 16
    height_divisor: 16
    frame_formula: 16n+1
    note: >-
      除数 16 = VAE 空间压缩 8 × DiT patch 2。卡的规格表也写
      「Max(W, H) % 16 = 0」，两处一致。
      **帧数 16N+1（N ≤ 10）是卡上写的**，上限 161 帧。
      但 16 这个因子**比结构要求的大一倍**：VAE 时间 4 × patch_t 2 = 8，
      按结构只需 8N+1。多出来的那个 2 卡上没有解释 —— 见 open_questions。
      **视频线至此五种帧数约束**：这一份 16n+1、wan 与 hunyuanvideo-1.5 的 4n+1、
      minimax-h3 的 17n+5、stepvideo 的 17n

precision:
  weights_release: [BF16, FP32]
  weights_release_scope:
    BF16:
      manifest_taken: true
      in_precision_table: true
      repo: zai-org/CogVideoX1.5-5B
      note: DiT 的 1024 张量全部 BF16，无一例外
    FP32:
      manifest_taken: true
      in_precision_table: false
      repo: zai-org/CogVideoX1.5-5B
      note: >-
        文本编码器 219 张量与 VAE 436 张量**全部** F32，逐条读头实测过。
        **不在本仓的 `shapes.json` 里**：取数用 `--include 'transformer/*'` 收窄了，
        所以 `in_precision_table: false` —— 精度表里只有 DiT 的 BF16。
        这与 wan（主干 F32）、stepvideo（主干 BF16 / VAE F32）
        构成三种不同的发布精度组合
  inference_default: BF16
  quantization:
    per_subsystem:
      attention: BF16
      dense_ffn: BF16
      modulation: BF16
      norm: BF16
      io_proj: BF16
      time_embed: BF16
    subsystem_method: >-
      **穷举，不是抽样**：对本记录 `shapes.json` 的全部 **1024 个条目**逐条跑
      `lib/subsystems.py` 的 `classify2()`，每条都带 shape 与 dtype，
      `fetched.json` 的 `failed_shards` 为空。
      **1024 条全部 BF16，零例外**（作用域：本仓 2026-10-31 实测的这一个修订版）。
      所以没有 `per_subsystem_scale`、没有 `per_subsystem_block`、没有
      `method` —— 组件 config 里没有 `quantization_config`，清单里也没有任何
      scale 张量或打包容器（derived 的 `scale_elements` 为 0、
      `weight_dtype_containers` 为空）。

      逐桶参数量（五桶相加 = 5,570,676,352，`other` 桶为 **0**）：
      `dense_ffn` 3,171,538,944（168 条）、`attention` 1,585,963,008（336 条）、
      `norm` 797,962,752（510 条）、`io_proj` 13,375,616（6 条）、
      `time_embed` 1,836,032（4 条）。

      **口径与 `params.total` 同一套：只含 DiT。** 同仓的 T5-XXL（219 条）与
      VAE（436 条）全 F32，取数时 `include_globs` 是 `transformer/*`，
      不在这份清单里 —— 见 `weights_release_scope.FP32.in_precision_table: false`。
      所以这张表上**缺席的子系统读作「DiT 里没有」，不是「这个仓里没有」**：
      `embed` 就是例子，DiT 没有词表，而 T5-XXL 有。

      **`modulation` 这一行是手工补的，它不来自 `classify2()`。**
      CogVideoX 的 AdaLN 叫 `norm1.linear` / `norm2.linear` / `norm_out.linear`，
      `norm` 那条正则先命中（SUBSYSTEM 里 norm 排在 modulation 之前，而 modulation
      认的是 `adaln` / `ada_ln` / `_mod.linear` / `modulation` / `scale_shift`，
      一个都配不上），于是调制参数整块落在 `norm` 桶里、`modulation` 桶是空的。
      **空的原因是命名，不是这个模型没有 AdaLN** —— bottlenecks 与 infra_signals
      整整两段都在讲这一份的调制有多贵（14.35%）。不补这一行，缺值判据会把它
      渲染成「不适用：这个子系统在这个模型里不存在」，而那句话是错的。
      代价是两张表对不齐：derived 的 `params_by_subsystem` 只有五桶
      （`norm` 含调制），这张精度表有六行。归类正则是共用基建，已报主会话。

      `norm` 桶的 797,962,752 拆开是：**调制 797,423,616**
      （42 套 `norm1.linear` + 42 套 `norm2.linear`，各 [18432, 512] 带 bias；
      加 `norm_out.linear` [6144, 512] 带 bias）
      **+ 真正的归一化 539,136**（42 层各两组 LayerNorm 的 weight/bias [3072]
      共 516,096、42 层 QK-norm 的 [64] 共 10,752、`norm_final` 与
      `norm_out.norm` 共 12,288）。
      797,423,616 与 `params.breakdown.adaln_modulation` 799,259,648 差的
      1,836,032 就是 `time_embedding` —— 它在这张表里单列为 `time_embed` 桶。

      `io_proj` 的 13,375,616 横跨 `param_scaling` 的两个桶：
      `patch_embed.text_proj` 12,585,984 是 `per_text_token`，
      `patch_embed.proj` + `proj_out` 789,632 是 `per_video_token`。
      **子系统轴与 param_scaling 轴不是同一刀**，两张表的格子不要互相代入

bottlenecks:
  - dimension: compute
    finding: >-
      文本 token 进了同一条注意力序列，所以它们也吃 O(n²) 那一项 ——
      与 cross-attn 的设计（wan、stepvideo）相比，这是把 226 个文本 token
      的代价从 O(n·m) 抬到了 O((n+m)²) 里
    quantified: >-
      默认档视频 token 44,880、文本 226，序列 45,106。
      文本占序列的 0.50%，但因为是平方项，它让注意力多出
      (45,106² − 44,880²) / 44,880² = **1.01%** 的计算。
      量很小，**但它说明「文本便宜」这个直觉在 in-sequence 设计下不成立** ——
      文本长度一旦上去（这一份上限只有 226），代价是平方增长的
    fix: >-
      这一份的 226 上限把问题压住了。真正要留意的是同类设计里文本更长的模型 ——
      minimax-h3 也是 in-sequence，而它的文本来自 Context-IR 的长结构化 prompt
    visibility: public
  - dimension: compute
    finding: >-
      **AdaLN 的占比与年份无关 —— 判据是「逐层放的是表还是矩阵」。**
      放表的六份全在 2.3% 以下，放矩阵的三份全是两位数，中间差 6.3 倍没有过渡带。
      这一份 2024-11 最早发布却占 14.35%（放矩阵），
      而 ltx-2（2026-01）只有 1.60%（放表），比早它两个月的
      hunyuanvideo-1.5（32.71%）低 20 倍 —— 时间轴上两组是交错的
    quantified: >-
      **九份全部可算**，分母统一取 `params.active_decode`（每步真正跑的那部分），
      数值取各记录 `params.breakdown.adaln_modulation` 的实测值：
      cogvideox-1.5-5b（2024-11）**14.35%**、stepvideo-t2v-30b（2025-02）0.91%、
      wan2.1-t2v-14b（2025-02）1.30%、wan2.2-ti2v-5b（2025-07）1.35%、
      wan2.2-t2v-a14b（2025-07）1.30%、hunyuanvideo-1.5（2025-11）**32.71%**、
      ltx-2（2026-01）1.60%、ltx-2.3（2026-03）2.27%、minimax-h3（2026-07）**39.41%**。
      （初稿在这里写「两份算不出」—— 错了：wan2.2-t2v-a14b 的 counting_note
      给了每套专家 186,081,280，ltx-2.3 的 `params.total` 虽为空但
      `active_decode` 是 18,988,838,144。**又一次是手边有数没去取**，见 R7。）

      **按结构分组则一刀两断**：放逐层矩阵的三份 14.35 / 32.71 / 39.41%，
      放逐层表的六份 0.91 / 1.30 / 1.30 / 1.35 / 1.60 / 2.27% ——
      最贵的表与最便宜的矩阵之间差 **6.3 倍**，没有一份落在中间。
      矩阵组内部由入口宽度定序：512 → 14.35%、2048 → 32.71%、2688 → 39.41%。
      这一份逐层但入口只有 **512**（不是 hidden 3072），所以是矩阵组里最便宜的
    fix: >-
      看到「参数量」时要问的不是「哪一代」，而是
      「调制是不是逐层的、条件向量多宽」。两个问题的答案就决定了
      参数量里有多大一块不参与 token 计算。
      **本条修正了 stepvideo 记录里「按发布时间排是一条干净的代际线」那句**——
      那句话只在它当时数到的那几份里成立；把九份摆齐之后，两个方向都破了
    visibility: public
  - dimension: weight-bandwidth
    finding: >-
      文本编码器以 **F32** 发布，按字节比 BF16 的 DiT 还大 —— 而它每次生成只跑一遍。
      记 weight-bandwidth 而不是容量，是因为真正的代价在载入与搬运：
      28.92 GiB 本身放得下 80 GB 的卡
    quantified: >-
      T5-XXL 19,049,242,624 B vs DiT 11,141,352,704 B，**1.71 倍**；
      按参数则是 4,762,310,656 vs 5,570,676,352，**0.85 倍**。
      两个方向相反的比值，三块相加 31,052,930,956 B（28.92 GiB）
    fix: >-
      载入时转 BF16 可以把文本编码器那一块减半（9.5 GB），
      代价是卡上没有说这样做是否影响质量（规格表把 BF16 列为推荐精度，
      但那说的是 DiT 的推理精度，没有单独讲文本编码器）
    visibility: public

infra_signals:
  - text: >-
      **「有效压缩率」可以由 VAE 与 DiT patch 按不同比例分担，而分法会改变别的账。**
      这一份与 stepvideo 的有效压缩**完全相同**（空间 16×、时间 8× —— 九份里
      只有这两份是 16×8，另有 ltx-2 / ltx-2.3 是 32×8，其余五份时间维都只有 4×），
      但这一份是 VAE 8×4 + patch (2,2,2)、stepvideo 是 VAE 16×8 + patch 1。
      后果：VAE 大小差 2.3 倍（0.22B vs 0.50B）、latent 通道差 4 倍（16 vs 64）、
      而且时间维 patchify 逼出了「latent 帧数必须是偶数」这个约束。
      **token 数相同不等于系统相同**
    evidence: derived
  - text: >-
      **调制分支的开销看一个结构问题就能判定：逐层放的是「表」还是「矩阵」。**
      放表的，每层每份调制只要 `k × hidden` 个参数；放矩阵的，每层每份要
      `k × hidden × 入口宽度` —— **入口宽度就是倍数本身**。
      已录九份在这一刀下完全分开，中间没有过渡带：

      | 发布 | 记录 | 逐层放什么 | 入口宽度 | 调制占比 |
      |---|---|---|---|---|
      | 2024-11-08 | cogvideox-1.5-5b | **矩阵**（norm1 + norm2 两套） | 512 | **14.35%** |
      | 2025-02-14 | stepvideo-t2v-30b | 表 | 全局一套 | 0.91% |
      | 2025-02-25 | wan2.1-t2v-14b | 表 | 全局一套 | 1.30% |
      | 2025-07-18 | wan2.2-ti2v-5b | 表 | 全局一套 | 1.35% |
      | 2025-07-24 | wan2.2-t2v-a14b | 表 | 全局一套 | 1.30% |
      | 2025-11-20 | hunyuanvideo-1.5 | **矩阵**（img_mod + txt_mod 两套） | 2048 | **32.71%** |
      | 2026-01-03 | ltx-2 | 表 | 全局六套 | 1.60% |
      | 2026-03-04 | ltx-2.3 | 表 | 全局六套 | 2.27% |
      | 2026-07-28 | minimax-h3 | **矩阵**（adaln_proj 一套） | 2688 | **39.41%** |

      放矩阵的三份全是两位数（14.35 / 32.71 / 39.41），放表的六份全在 2.3% 以下
      （0.91～2.27）。**最贵的「表」与最便宜的「矩阵」之间还差 6.3 倍**，
      九份里没有一份落在中间。而**时间轴上这两组是交错的**：
      放矩阵的最早（2024-11）和最晚（2026-07）各一份，中间夹着 2025-11；
      放表的横跨 2025-02 到 2026-03。所以按发布时间排看不出规律，按结构排一刀两断。

      矩阵组内部由入口宽度定序：512 → 14.35%、2048 → 32.71%、2688 → 39.41%。
      这一份是其中最便宜的，**正因为它的入口只有 512 而不是 hidden（3072）**——
      「逐层」本身不贵，「逐层且入口宽」才贵。

      **逐层那一项占各自调制总量的 99.4% 以上，所以这个结构判据不是近似**
      （主项 / 记录实测值）：
      cogvideox 2×42×(18432×512+18432) = 794,271,744 / 799,259,648 = **99.38%**；
      hunyuanvideo-1.5 2×54×(12288×2048+12288) = 2,719,236,096 / 2,723,964,928 = **99.83%**；
      minimax-h3 50×(96768×2688+96768) = 13,010,457,600 / 13,055,204,736 = **99.66%**。

      放表那一组反过来，全量能**逐位重建**：
      stepvideo (36864×6144+36864) + timestep_embedder + 48×6×6144 + 2×6144
      = 267,644,928，与记录**完全相等**；
      wan2.1 40×6×5120 + (30720×5120+30720) + time_embedding
      = 186,081,280，**完全相等**；
      ltx-2 六个全局模块 298,424,320 + 顶层表 12,288 + 逐块表 3,244,032
      = 301,680,640，**完全相等**。

      每层每份的单价对比最直观，**但倍数只在同一个 hidden 里成立**：
      这一份若改放表是 6×3072 = **18,432**，实际放矩阵是 (6×3072)×512 =
      **9,437,184**，正好贵 **512 倍 —— 就是入口宽度**。
      跨模型比就不是这个数：wan2.1 的逐层表是 6×5120 = **30,720**，
      而 9,437,184 / 30,720 = **307.2 倍**，因为两边 hidden 不同（3072 vs 5120），
      512 被 3072/5120 冲掉了一截。见 R8。
      hunyuanvideo-1.5 是 25,165,824（= 6×2048 × 2048）、
      minimax-h3 是 260,112,384（= 18×5376 × 2688）。
      分母统一取 `params.active_decode`（每步真正跑的那部分）：
      wan2.2-t2v-a14b 只算一套专家 14,288,491,584，
      ltx-2.3 的 `params.total` 为空但 active_decode 是 18,988,838,144
    evidence: derived
  - text: >-
      这一份是九份里唯一还用 DDIM + v-prediction 的，其余八份全是 flow matching。
      它也是唯一一个步数压不下去的 —— 没有官方蒸馏档，而同期之后的几家
      都发了 CFG 蒸馏或步数蒸馏。**采样范式的迁移与「步数能压到几步」
      是同一件事的两面**，排产能时要把它和架构分开看
    evidence: judgement

