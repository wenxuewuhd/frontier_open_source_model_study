bottlenecks:
  - dimension: kv-capacity
    finding: >-
      去掉线性注意力之后，缓存只剩一类、覆盖全部 62 层，随上下文线性增长，
      没有任何压缩、共享或选读机制在上面。模型比上一代小一半，
      每 token 的 KV 反而大 6.2 倍 —— 因为 KV 只由「层数 × KV 头数 × head_dim」决定，
      而这一代只减了 hidden 和 q 头数，KV 头数与 head_dim 一个没动
    quantified: >-
      逐因子：每层 2（K、V）× 8 KV 头 × 128 = 2048 元素（k_proj / v_proj 输出维
      都是 1024；k_norm 是作用在整条 1024 上的 RMSNorm，不改宽度），
      × 62 层 = **126976 元素/token**。这一种 shape 在 62/62 层上零例外
      （96103 条全量穷举，非抽样）。条目按 1:1 逐 token 计，依据是参考实现走标准
      Cache.update。落盘精度无一手声明，按 config 推得的 BF16 兜底 2 B/元素得
      253952 B/token；config 上限 196,608 token 单序列 = 46.50 GiB。
      对照同族：M1 是 20480 元素/token（只有 10 个 softmax 层）+ 280.0 MiB/序列，
      M3 是 68736（60 层 × 4 KV 头 + index K）。
      口径边界：bytes_basis 是 dtype_fallback，字节那一列不能跨记录比；
      另外 derive.py 的 full_attention 分量只走 config 公式、不读实测宽度，
      本例两者恰好都是 1024，Gate B 的「0 处不一致」没有覆盖这一项
    visibility: public
  - dimension: ep-comm
    finding: >-
      专家细粒度化（32 取 2 → 256 取 8）把每 token 的 all-to-all 落点数翻了 4 倍。
      载荷字节 = 2 · top_k · hidden · bytes 逐层算，hidden 同时减半，
      两个因子方向相反，净效果要算而不能猜
    quantified: >-
      每层每 token：M1 是 2 × 2 × 6144 × 2 B = 49,152 B，M2 是 2 × 8 × 3072 × 2 B
      = 98,304 B，正好 2 倍；乘层数（80 → 62）后全模型是 3,932,160 → 6,094,848 B/token，
      1.55 倍。但「落点数」这个与带宽无关的量涨了 4 倍（2 → 8），
      它约束的是连接数与同步面，不是字节数。两者分开看，见 data/derived/ 的 ep_communication
    visibility: public
  - dimension: operator-gap
    finding: >-
      相对上一代，算子侧是**大幅简化**而不是新增：一套标准 GQA + RoPE(partial 0.5)
      + 标准 Cache，lightning attention 的两个专用核（分块衰减 prefill、
      递归 decode）、输出门、逐层衰减表全部不再需要。新增的只有两个小项
    quantified: >-
      新增项一：逐层 qk-norm 作用在**展平后的整条 q / k** 上
      （RMSNorm(48×128) 与 RMSNorm(8×128)），在 view 成多头与 RoPE 之前 ——
      按「逐头 RMSNorm」写的融合核会在归一化的规约轴上算错（M3 那一代才是 per_head）。
      新增项二：FP8 blockwise 反量化，块 [128, 128]、scale 为 FP32，
      每个 FP8 张量都配一份，无例外
    visibility: public

infra_signals:
  - text: >-
      这一代是一次**路线回撤**：MiniMax 在 Text-01 / M1 上做了两代线性混合之后，
      M2 把线性注意力整条去掉，回到 62 层全量 GQA。
      对 infra 的直接含义是「线性注意力的算子投入在这一代没有回报」——
      但它换来的不是更小的缓存：KV 元素/token 从 20480 涨到 126976，
      只是形状从「两个分量」变回「一个分量」，容量帐全额付、工程复杂度大降
    evidence: judgement
    horizon: settled
    axis: attention
  - text: >-
      模型缩小不等于 KV 缩小。hidden 与层数都降了而 num_kv_heads × head_dim 没动，
      所以每层 KV 宽度两代相同，KV/token 只随「全量 KV 层数」走。
      给一个新模型做容量规划时，先看 KV 头数与产出 KV 的层集合，不要先看参数量
    evidence: judgement
    horizon: settled
    axis: attention
  - text: >-
      config 声明 MTP 而权重里没有，从本代开始，到 M3 仍是如此
      （那边声明 7 个模块）。引擎按 config 开投机解码会落空 ——
      MTP 的有无要以权重清单为准
    evidence: judgement
    horizon: now
    axis: decoding

