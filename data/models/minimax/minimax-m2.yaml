notes: >-
  MiniMax 这条线的拐点：两代线性混合之后回到全量 softmax GQA，同时把模型缩到一半、
  专家细化 8 倍、首次 FP8 发布。层数、层形态、投影形状、专家分布、量化块与各子系统精度
  都对照完整清单穿过一遍，「零例外」一类的说法都是对 96103 条穷举出来的。
  top_k、rope_theta、activation_scheme 这类运行期标量只有 config 一个来源。
  released 取 HF 仓的 createdAt 2025-10-22（lastModified 2026-10-26 是后来的元数据刷新，
  不是发布日）。
  M2 之后到 M3 之前还有三个发布：M2.1（2025-12-20）、M2.5（2026-02-12）、
  M2.7（2026-04-09）。三者的张量名集合与本记录**逐条相同**（各 96103 条），
  HF safetensors tally 三项 dtype 的元素数也**逐位相同**。config 的差别只有两处：
  M2.1 起删掉 13 个键并把 transformers_version 写回 4.46.1 —— 13 个里 6 个
  （attention_dropout / initializer_range / output_router_logits /
  router_aux_loss_coef / router_jitter_noise / sliding_window）与 MiniMaxM2Config
  的类默认值相同，bos_token_id / eos_token_id 在 M2 里是 null 而类默认是 1 / 2，
  其余 5 个（mlp_intermediate_size / shared_moe_mode 与三个 layernorm_*_beta）
  **根本不是这个 config 类的参数**、走 kwargs，所以「删掉的都是默认值」并不成立；
  M2.7 把 max_position_embeddings 从 196,608 改成 204,800（+4%）并加了一个 dtype 键。按仓内「零结构差异的权重刷新
  不单独立记录」的办法，三者都折叠进本记录；能力变化全部来自后训练

open_questions:
  - >-
    KV 落盘精度无一手声明。config 的 quantization_config 只说权重量化，
    没有 kv_cache 相关键，也没有 torch_dtype；本仓按未量化子系统的落盘 dtype（BF16）
    兜底，253952 B/token 与 46.50 GiB 都是**上界**，basis 记 dtype_fallback。
    若部署按 FP8 存 KV 则减半。跨代或跨族系比结构请用元素口径（126976 元素/token）
  - >-
    M2.7 把 max_position_embeddings 从 196,608 提到 204,800，而权重与张量名
    与 M2 逐条相同、模型卡没有提到上下文变化。这个 +4% 是真的服务窗口变化、
    还是只改了一个声明，没有一手来源；本记录的 context.max 取 M2 自己的 196,608
  - >-
    config 的 mlp_intermediate_size 8192 是个死键：权重里没有任何对应张量
    （62/62 层都是 MoE，mlp.* 零命中），参考实现 modeling_minimax_m2.py 全文也
    **零引用**它（唯一的 MiniMaxM2MLP 类是逐专家 FFN，读的是 intermediate_size 1536），
    M2.1 起这个键从 config 消失。它为什么出现在 M2 的 config 里没有一手说明 ——
    「没有被读」是核过的，「是训练侧遗留」只是猜测，不写进记录
  - >-
    厂商「230B / 10B」两个数都与实测不同口径：总量实测 228,689,764,864（−0.57%），
    激活两套口径见 data/derived/。10B 这个数更接近带宽口径而不是含输入词表的口径，
    但厂商没有说明扣了什么，不细推
  - 训练精度无一手声明（config 只有权重量化配置），precision.training 不填

reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 一个独立核查代理 + 本会话复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序，对判断类字段与全部 open_questions 逐条过。
    代理穷举了 facts/minimax-m2/shapes.json 全部 96103 条（非抽样）核层覆盖、
    条目宽度、专家下标分布、量化块（逐张量算 weight.shape ÷ scale.shape）与 dtype 分布，
    并与 facts/minimax-m2.1 / m2.5 / m2.7 的名单和 repoinfo 比对。
    本会话独立复核（不只是读代理的结论）的是：写进缓存的 K 是什么 —— 直接读
    modeling_minimax_m2.py:276-289，q_norm / k_norm 是
    RMSNorm(head_dim × 头数) 作用在**展平后的整条 q / k** 上、在 view 成多头与
    RoPE 之前，之后走标准 Cache.update，所以条目宽度仍是 k_proj 的输出维 1024；
    全文没有任何 MTP 模块的类定义；唯一的 MiniMaxM2MLP 类只被
    MiniMaxM2Experts 用作逐专家 FFN、读的是 intermediate_size 1536，
    mlp_intermediate_size 全文零引用。层集合、宽度唯一性、126976 元素/token
    与 46.50 GiB 也在本会话独立穷举复算过。
    Gate B：derive.py 0 处不一致，外部 safetensors tally 逐位相同（HF 那边这一次
    与本仓一样排了 scale）；专家数那一项是 skip（derive 找 n_routed_experts /
    num_experts，MiniMax 写的是 num_local_experts），不在覆盖内

review:
  - id: R1
    field: notes
    severity: imprecise
    claim: 「M2.1 删掉了一批**与默认值相同的键**」
    finding: >-
      逐键对照 configuration_minimax_m2.py 的 __init__ 签名：删掉的 13 个键里只有 6 个
      （attention_dropout / initializer_range / output_router_logits /
      router_aux_loss_coef / router_jitter_noise / sliding_window）与类默认值相同；
      bos_token_id / eos_token_id 在 M2 里是 null 而类默认是 1 / 2；
      其余 5 个（mlp_intermediate_size / shared_moe_mode 与三个 layernorm_*_beta）
      根本不是这个 config 类的参数、走 kwargs。
      而且 mlp_intermediate_size 8192 与 shared_moe_mode "sigmoid" 不是平凡默认值 ——
      同一份记录的 open_questions 正是拿它的消失当线索，两处口径不一致
    resolution: corrected
    changed_to: 把 13 个键按三类分开写明，并说明「删掉的都是默认值」不成立
  - id: R2
    field: evidence
    severity: miscategorized
    claim: precision.quantization.weight_block_size 继承 precision.official 前缀
    finding: >-
      这个字段的值虽然 config 里也声明了，但记录对它的**断言**是实测的
      （block_size_note 说的就是「与实测逐张量一致」），而它恰是 DeepSeek V4 一代
      对 FP4 专家错了 128 倍的那个字段。挂在 official 前缀下，它永远不会被单独看一眼
    resolution: corrected
    changed_to: 单列 precision.quantization.weight_block_size 为 derived（与 m3 的 R6 同一处理）
  - id: R3
    field: lineage.changed_from_predecessor
    severity: wrong
    claim: 起草时写「带宽口径激活参数 47.17B → 11.25B」
    finding: 11.25B 是起草时估的，derive 的实际值是 10,415,956,480（10.42B）；11.25B 更接近含输入词表的 11,030,553,088 但也不等于它
    resolution: corrected
    changed_to: 改成 47,174,113,280 → 10,415,956,480（4.53 倍），两侧都写整数
  - id: R4
    field: open_questions
    severity: imprecise
    claim: 「mlp_intermediate_size 8192 ……推测是训练代码里稠密分支的遗留」
    finding: >-
      「没有被读」可以从两处钉死（权重清单 mlp.* 零命中；参考实现全文零引用，
      唯一的 MiniMaxM2MLP 读的是 intermediate_size），是事实；
      「是训练侧遗留」没有任何来源，是猜测，两者并列会让猜测借事实的信用
    resolution: corrected
    changed_to: 把「零引用」写成事实，明说动机未知、不写进记录
  - id: R5
