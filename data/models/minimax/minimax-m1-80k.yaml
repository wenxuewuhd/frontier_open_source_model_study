notes: >-
  MiniMax 的第一个推理（long-CoT）模型，结构原样沿用 Text-01。
  本记录之所以单独立，不是因为结构变了，而是因为**精度变了**：仓内的判据是
  「config 逐字段相同 + 张量名集合相同 + 逐子系统精度一致」三条齐备才折叠，
  而这里第三条不成立（输入词表 FP32 → BF16），license 也从 MiniMax 自有许可
  换成 apache-2.0。另有 MiniMax-M1-40k：config 与本仓逐字节相同、
  HF safetensors tally 逐位相同，只是思考预算档不同，不单独立记录。
  released 取 HF 仓的 createdAt 2025-06-13（技术报告 arXiv 2506.13585 同期）

open_questions:
  - >-
    递归状态记 FP32，依据是厂商随仓参考实现（prefill 把状态建成 float32）。
    部署侧（vLLM / LASP）若按 BF16 存，每序列 280.0 MiB 减半为 140.0 MiB，
    与 KV 的两个交点（容量 7168、带宽 14336）都减半。未读部署 kernel、未实测，本条开着
  - >-
    softmax 层的 KV 落盘精度无一手声明，按 config 的 BF16 兜底（dtype_fallback），
    40960 B/token 是上界。跨代比结构请用元素口径 20480 元素/token
  - >-
    厂商「45.9B activated」与本仓两套口径都不等：带宽口径 47,174,113,280、
    可比官方口径 48,403,306,496。扣掉 lm_head 后是 45,944,920,064（45.94B），
    是三者里最接近 45.9B 的 —— 与 Text-01 同一个口径差，厂商没有说明，记成推测
  - >-
    40k 与 80k 两个仓：config 逐字节相同（md5 相同）、张量名集合逐条相同（各 8243 条）、
    HF safetensors tally 逐位相同。**没有取过 40k 的形状与 dtype**，
    所以不说「权重完全相同」；差异在后训练与推荐生成长度。
    本记录取 80k 作代表（模型卡的主评测用的是 80K 档）；40k 没有单独立记录，
    也没有任何规格字段能把两者区分开
  - 训练精度无一手声明，precision.training 不填

reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 一个独立核查代理 + 本会话复算
  method: >-
    与 minimax-text-01 同一轮。代理穷举了 facts/minimax-m1-80k/shapes.json 全部
    8243 条（非抽样）并与 facts/minimax-text-01 逐条比对名字、形状与 dtype。
    本会话独立复核的是：两份清单的名集合相等、形状零差异、dtype 差异恰好一条
    （model.embed_tokens.weight F32 → BF16），以及参考实现 ——
    把 MiniMaxText01→MiniMaxM1、minimax_text_01→minimax_m1 两处标识符替换后，
    modeling_minimax_m1.py 与 modeling_minimax_text_01.py **逐字节相同**
    （unified diff 0 行），所以 Text-01 那一侧对递归状态形状与 FP32 的源码复核
    对本记录同样成立，不是「同名文件大概一样」的推定。
    另按代理提示补取了 facts/minimax-m1-40k 的名单：与 80k 的 8243 条逐条相同、
    config 逐字节相同、HF tally 逐位相同（形状与 dtype 仍未取）。
    Gate B：derive.py 0 处不一致，外部 safetensors tally 逐位相同；
    专家数那一项是 skip（键名不匹配），不在覆盖内

review:
  - id: R1
    field: open_questions
    severity: unsupported
    claim: 「40k 与 80k 两个仓在**权重**和 config 上完全相同」
    finding: >-
      同一份记录里另外两处写的是「config 逐字节相同、HF safetensors tally 逐位相同」，
      那两处成立；而「权重完全相同」要的是名字与形状，当时 facts 下**没有** 40k 的任何
      清单。逐 dtype 的元素总数相同不足以推出逐张量相同
    resolution: corrected
    changed_to: >-
      补取 facts/minimax-m1-40k 的 --names-only 名单（8243 条，与 80k 逐条相同），
      把这一条改写成「config 逐字节 + 名集合逐条 + tally 逐位，三样相同；
      形状与 dtype 没取，所以不说权重完全相同」
  - id: R2
    field: bottlenecks
    severity: wrong
    claim: 交点 7168 / 14336 与「softmax KV 只读不写」
    finding: 与 minimax-text-01 的 R1、R2 同源：交点是跨 basis 的比值（状态 FP32 取自参考实现、KV BF16 是兜底），且每步有 40960 B 的 KV 追加写
    resolution: corrected
    changed_to: 两条按 text-01 的同样写法改：合计口径标 mixed、交点给三种精度组合、写量写明并注明可忽略
  - id: R3
    field: hf
    severity: wrong
    claim: 起草时 sha 写成 8d1494b1a2607d1e5c2db71d3fdc9a2e4b4f1b64、last_modified 写成 2025-07-07T11:50:11.000Z
    finding: >-
      两个都是起草时按记忆补全的，不是读出来的。facts/minimax-m1-80k/repoinfo.json
      的 sha 是 8d1494b1a260e22040d5b9b2eb332eb44500b34d、lastModified 是
      2025-07-07T07:51:42.000Z。sha 错了整条记录就不可复现
    resolution: corrected
    changed_to: 两个字段按 repoinfo.json 改正；其余记录的 hf 块也逐字段对过一遍
  - id: R4
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: 「输入词表 F32 → BF16 是两版之间唯一的权重级差异」
    finding: >-
      独立穷举成立：8243 个名字集合相等、8243 个形状逐条相等、dtype 只有
      model.embed_tokens.weight [200064, 6144] 一条不同。
      省下的 1,229,193,216 × 2 B = 2,458,386,432 B = 2.29 GiB 与 derive 的
      权重存储差（851.85 → 849.56 GiB）一致。数值不改
    resolution: confirmed
  - id: R5
    field: bottlenecks
    severity: imprecise
    claim: 「跑满 80K 思考预算」没有说清 80K 是多少 token
    finding: 起草时自查：80K 可能是 80,000 也可能是 81,920，而后面直接报了 40960 × 81920 这个乘积
    resolution: corrected
    changed_to: 写明「下面一律按 80 × 1024 = 81,920 token 计」，并把乘积写成完整字节数
