lineage:
  track: side
  predecessor: minimax-m3
  # 每条都对照过 facts/minimax-m3 与 facts/minimax-m3.1-flash 的 config 差异与
  # 张量名差异，再与模型卡「What's New」一节逐条核对，不是单靠其中一侧
  changed_from_predecessor:
    - axis: attention
      text: >-
        稀疏铺到第 0 层：config 的 sparse_attention_freq 从 `[0,0,0,1,1,…]` 变成 60 个 1，
        权重侧 index_k_proj / index_q_proj 的层覆盖从 57 层（L3–L59）变成 **60/60 层**，
        宽度仍是 [128, 6144] 与 [512, 6144]。模型卡原话是
        「the first three full-attention layers are replaced with sparse attention」。
        rope_theta 同时从 5e6 提到 1e7
      benefit: >-
        这一步**不省容量，反而加**：index K 多覆盖 3 层，KV 元素/token 从 68736 涨到
        **69120**（+384 = 3 × 128），1Mi 上下文 BF16 兜底下是 135.0 GiB
        （字节那一列两代同为 dtype_fallback，倍数就是元素数的倍数，不另报）。
        省的是读，但要连新增的代价一起算：M3 的 L0–L2 是全量层，每步读满
        3 × 2 GiB = 6.00 GiB；换成稀疏后这三层的主 KV 降到 3 × 4 MiB，
        **同时多出 3 × 1048576 × 128 × 2 B = 0.75 GiB 的 index 全扫**，
        这三层合计 6.00 → 0.762 GiB，是 7.88 倍而不是几百倍。代价是剩下的读量几乎全是 indexer 全扫
        （见 bottlenecks：占比从 69.6% 升到 98.5%），省读的上限从此完全由 indexer 决定
    - axis: precision
      text: >-
        从不量化变成**两套量化并存**，而 config 把这两套写在了不同的键里：
        `quant_method: mxfp8` / `weight_block_size: [1, 32]` 描述的是非专家那一半，
        专家那一半由 `moe_quant_algo: NVFP4` / `group_size: 16` /
        `moe_quant_format: nvfp4-pack-quantized` 三个键描述。
        逐张量实测与这两套声明逐项吻合：路由专家是 **NVFP4**
        （4 bit 两个一字节装进 U8 的 `weight_packed`，
        块 [1, 16]，`weight_scale` 是 FP8_E4M3，另配每张量的 FP32
        `weight_global_scale` / `input_global_scale`），注意力 / indexer / 共享专家 /
        稠密 FFN / 草稿块才是 **MXFP8**（FP8_E4M3，块 [1, 32]，scale 是 U8 容器）。
        模型卡说的是「the routed MoE experts **and** the attention paths are quantized
        during training」—— 两条路径，卡没说它们用的不是同一种格式；
        说清楚的是 config，但要读到 `weight_block_size` 以外的三个键才看得到
      benefit: >-
        权重存储 795.51 → **235.07 GiB**（3.38 倍）。要紧的是**别只读
        `weight_block_size`**：只看那一个键会把专家也按 [1, 32] 的 MXFP8 处理，
        于是在三个轴上同时错 —— 位宽（8 vs 4）、块（32 vs 16）、
        scale 格式（E8M0 vs E4M3），而专家占主干参数量的 96.7%
        （413,122,166,784 / 427,051,937,408）。
        与 DeepSeek V4 一代不同的是，那边 config 对 FP4 专家**什么都没说**、
        声明的块直接是错的；这边 config 说全了，只是分在两组键里
    - axis: decoding
      text: >-
        MTP 不是被去掉了，是**被换掉并且这次真的发了权重**。config 里
        num_mtp_modules / num_nextn_predict_layers 两个键消失，而 `dspark/` 子目录
        带来一个 97 条张量、1.96B 参数的草稿模块：5 个完整 decoder 层
        （自注意力 + 12288 中间维的稠密 FFN）、一张 fc [6144, 30720]（30720 = 5 × 6144）、
        hidden_norm / final_norm、markov_head 两张 [200064, 256]、
        confidence_head [1, 6400]。模型卡原话：「DSpark replaces the earlier
        EAGLE-like MTP approach. The release includes the draft head」
      benefit: >-
        M2 与 M3 连续两代「config 声明 MTP、权重里零个」的落差到这一代反过来了：
        config 不声明，权重里有。**只看 config 判断投机解码能力，这一族连错三代、
        而且第三代错的方向和前两代相反**。对 infra 的具体含义有两条：
        草稿侧 1,958,493,697 参数要常驻，而主干带宽口径激活是 24,745,077,888，
        草稿是它的 7.9%；
        草稿的 5 层**没有 indexer**（dspark 下 index_* 零命中），是全量 GQA ——
        主干已经全层块稀疏，草稿反而是语言侧唯一还做全量注意力的部分
        （视觉塔的 32 层自注意力同样不稀疏，但它只在 prefill 跑一次）
    - axis: modality
      text: vision_config.image_size 2016 → 672，其余视觉字段（32 层、hidden 1280、patch 14、3D RoPE、spatial_merge 2）与 image_grid_pinpoints 都不变
      benefit: >-
        视觉塔的参数量与形状一个没动（865,567,232，逐张量同形），
        变的是位置编码覆盖的原生分辨率。image_seq_length 仍是 576，
        所以每图 token 数不变 —— 这一条不改 prefill 的 token 账
    - axis: scale
      text: >-
        主干参数量基本没动：扣掉草稿侧后 427,040,140,160 → **427,051,937,408**，
        只多 11,797,248，恰好是新增的 3 个 indexer 层
        （3 × (512 + 128) × 6144 = 11,796,480，加 3 × 2 × 128 的 index_q_norm /
        index_k_norm = 768）。层数、hidden、专家数、top_k、共享专家、
        稠密层数全部不变
      benefit: >-
        所以这一代不是「小一号的 M3」：它是同一副骨架上换了量化方案、
        把稀疏铺满、再挂一个草稿头。规格对照表里几乎每一行都和 M3 相同，
        真正变的三件事都不在参数量上

params:
