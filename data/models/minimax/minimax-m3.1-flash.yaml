bottlenecks:
  - dimension: kv-capacity
    finding: >-
      把稀疏铺到第 0 层**不省缓存，反而多存**：MSA 省的是读、不是存，而每多一个稀疏层
      就多一份 index K。这一代 60 层全部既存完整 GQA KV、又存 index K，
      两类缓存的层覆盖第一次完全重合
    quantified: >-
      逐因子：GQA 每层 2（K、V）× 4 KV 头 × 128 = 1024 元素
      （k_proj / v_proj 输出维都是 512，写缓存前的 k_norm 是逐头 [128]，宽度不变），
      × 60 层 = 61440；index K 每层 128（index_k_proj 输出 128、index_k_norm [128]）
      × 60 层 = 7680；合计 **69120 元素/token**。两类在各自的全部层里都只有一种 shape
      （89729 条全量穷举，非抽样）。对 M3 的 68736 多 384，恰是多出来的 3 层 index K。
      条目数按 1:1 逐 token 计。落盘精度无一手声明，按 config 的 torch_dtype bfloat16
      兜底（2 B/元素）得 138240 B/token、1Mi 上下文 135.0 GiB —— dtype_fallback 口径，
      是**上界**不是实测，与 M3 两侧同口径所以可以比。
      口径边界：derive.py 的 full_attention 分量只走 config 公式、不读实测宽度，
      本例两者恰好都是 512，Gate B 的「0 处不一致」没有覆盖占 88.9% 的这一项。
      开草稿侧时 KV 层数是 60 + 5 = 65，上面的数不含那 5 层
    visibility: public
  - dimension: kv-bandwidth
    finding: >-
      取消 L0–L2 的全量层确实把读量压下去了，但同时把 indexer 全扫从「大头」变成了
      「几乎是全部」。省读的上限这一代**完全**由 indexer 决定，topk 块数再调也没用
    quantified: >-
      1Mi 上下文、单序列、BF16 两侧同口径，一个 decode step 的注意力侧读量逐项：
      index K 全量扫描 60 层 × 1048576 × 128 × 2 B = 16,106,127,360 B = 15.00 GiB；
      全量 GQA 层 0 个（M3 有 3 个，6.00 GiB）；60 个稀疏层真正选中的主 KV
      = 60 层 × 4 个 KV 组 × 2048 token × 2 × 128 × 2 B = 251,658,240 B = 240.0 MiB
      （「每个 index 头的选择各自管一个 KV 组」这一步来自 M3 记录的 R8，在那一代
      对着参考实现核过；本代没有参考实现，是继承的假设。自洽性旁证：
      1048576 / 2048 = 512，恰是每层全读 2 GiB 与选读 4 MiB 的比值）；
      合计 16,357,785,600 B = **15.23 GiB**。对比全量 GQA 的 128,849,018,880 B
      = 120.0 GiB，省 **7.88 倍**（M3 是 5.86 倍），其中 indexer 扫描占
      **98.5%**（M3 是 69.6%）。
      按参考实现的算法推导、非实测；换 FP8 落盘两侧等比例缩小，倍数不变。
      草稿侧另算，而且**带一个权重答不了的前提**：dspark 的 5 层有自己的
      k_proj / v_proj [512, 6144] 却没有 index_k_proj，所以它做的是全量注意力；
      但它缓存多长的历史，权重里看不出来。**若**它和主干一样缓存全部 1Mi 上下文，
      每个草稿步要读 5 × 2 GiB = 10.0 GiB，已是主干 15.23 GiB 的 66% ——
      那样投机解码在这个模型上就是拿带宽换步数。缓存策略见 open_questions
    visibility: public
  - dimension: operator-gap
    finding: >-
      一个 checkpoint 里要同时支持两套量化格式：路由专家 NVFP4 pack-quantized
      （4 bit 打包 + 块 16 的 E4M3 scale + 两个 FP32 全局 scale），
      其余量化路径 MXFP8（8 bit + 块 32 + U8 scale）。
      config 只声明了后者，按它去反量化专家会同时错位宽、块与 scale 格式
    quantified: >-
      专家侧每个 w 要读四个张量：weight_packed [3072, 3072] U8、
      weight_scale [3072, 384] FP8_E4M3、weight_global_scale 标量 FP32、
      input_global_scale 标量 FP32。按 config 的 mxfp8 [1, 32] 去读会期望
      scale 的列数是逻辑列数的 1/32（即 192），实际是 1/16（384），差 2 倍；
      且会把 4 bit 当 8 bit 读，权重整体错位。专家那一半的正确参数在
      `moe_quant_algo` / `group_size` / `moe_quant_format` 三个键里，
      不在 `weight_block_size` 里。
      影响面：21888 条专家张量占主干参数量的 96.7%。
      另一条核契约与 M3 相同：index K 单头、index Q 4 头，每个 index 头独立选块、
      **选块结果再映射到 4 个 KV 组上**（kv-bandwidth 里那个「4 个 KV 组」的因子
      就出自这条，来源是 M3 记录对参考实现的核查），块索引左对齐、-1 右填充
    visibility: public

infra_signals:
  - text: >-
      「稀疏铺满」在容量账上是**加法不是减法**。M3 → M3.1-Flash 把最后 3 个全量层
      也换成稀疏，KV 元素/token 从 68736 升到 69120 —— 每多一个稀疏层就多一份 index K。
      真正变化的是读：全量层清零之后，注意力读量从 20.47 GiB/step 降到 15.23 GiB/step
      （1Mi、BF16），但 indexer 全扫占到 98.5%。
      给这一代做容量规划不能按「稀疏 = 少存」推，做带宽规划则要盯 indexer 而不是 topk
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      同一个 checkpoint 里两套量化格式并存：专家 NVFP4 块 16、
      其余量化路径 MXFP8 块 32。引擎与算子库要按「逐子系统各有格式」准备，
      不能按单一 quant_method 套。config 两套都声明了，但 `quant_method` 与
      `weight_block_size` 只管非专家那一半，专家的算法、块与落盘布局在
      `moe_quant_algo` / `group_size` / `moe_quant_format` 三个键上 ——
      只读前两个键就会把 96.7% 的参数按错误格式反量化
    evidence: judgement
    horizon: now
    axis: precision
  - text: >-
      MiniMax 这一族在「投机解码」上连错三代方向：M2 声明 3 个 MTP 模块、M3 声明 7 个，
      权重里都是 0 个；M3.1-Flash 不声明，权重里却有一个 1.96B 的 DSpark 草稿模块，
      而且它落在 `dspark/` 子目录、有自己的索引文件 ——
      只读主索引的取数脚本会整块漏掉它。
      判断一个发布有没有草稿侧，既不能只读 config，也不能只读主索引
    evidence: judgement
    horizon: now
    axis: decoding

