notes: >-
  M3 的支线发布（`lineage.track: side`）：旗舰仍是 M3 ——
  `MiniMaxAI` 名下含 M3 的仓只有 MiniMax-M3、MiniMax-M3-MXFP8 与本记录三个，
  **没有完整的 M3.1**，所以 `data/tracking.yaml` 的名册不动。
  三件真正的变化（稀疏铺满、QAT 量化、DSpark 草稿头）都在模型卡
  「What's New in M3.1-Flash」一节里有一手说法，再由完整清单独立证实；
  但「两套格式」这一层卡上没有，是 config 的三个 moe_* 键加清单实测给出的；
  层覆盖、条目宽度、专家分布、量化块与各子系统精度都对 89729 条穷举过。
  与 **MiniMax-M3-MXFP8 不是同一批权重**：那一个是 M3 的纯量化版
  （专家是未打包的 `experts.N.w1.weight` [3072, 6144] FP8_E4M3 配 weight_scale_inv，
  HF tally 总量 427,040,140,160 与 M3 的参数量逐位相同），而本记录的专家是
  NVFP4 打包、另有草稿模块、rope_theta 与稀疏层集合都变了 ——
  后两项不是量化能做出来的，模型卡也写明是 quantization-aware **training**。
  released 取 HF 仓的 createdAt 2026-10-17；lastModified 2026-10-30 是取数当天，
  本记录钉的 rev 是 2f33a8b9ae49

open_questions:
  - >-
    KV 落盘精度无一手声明。模型卡说的是权重侧的 QAT，没提缓存；config 也没有
    kv_cache 相关键。本仓按 torch_dtype bfloat16 兜底，138240 B/token 与 135.0 GiB
    都是**上界**，basis 记 dtype_fallback。考虑到这一代权重已经做到 NVFP4，
    缓存按 FP8 甚至更低存的可能性比 M3 那一代更大，但没有来源。
    跨代比结构请用元素口径（69120 元素/token）
  - >-
    DSpark 的接受率、每步草稿 token 数、以及草稿层与主干的对齐方式都没有一手来源。
    `dspark/config.json` 本仓没有单独取（取数脚本只落了权重头），
    `arch.decoding.speculative` 因此只填 method 与 target_layers，不填 accept_rate / num_tokens。
    能从权重确定的只有：5 个完整 decoder 层、fc [6144, 30720] 的首维是 5 × 6144、
    markov_head 两张 [200064, 256] 是词表宽、confidence_head 输出 1 维，
    以及这 5 层有 k_proj / v_proj [512, 6144] 而没有 index_k_proj（即做全量注意力）。
    **草稿侧缓存多长的历史权重答不了**，所以 bottlenecks 里那条 10.0 GiB/步
    是「若缓存全部 1Mi 上下文」的条件值，不是实测也不是必然
  - >-
    厂商「Approximately 428B total; 23B activated per token」与 M3 卡上是同一句话、
    同一组数，而两代的实测值并不相同（M3 主干 427.04B、本代主干 427.05B，
    本代另有 1.96B 草稿侧）。本仓带宽口径激活 24,745,077,888（24.75B）、
    可比官方口径 25,974,271,104（25.97B），两套都不等于 23B
    （M3 的对应两个数是 24,733,280,640 与 25,962,473,856，本代只多 11,797,248 ——
    与参数增量**逐位相同**，因为新增的 3 个 indexer 层每步都用，增的参数全是常驻激活的）。M3 那份记录对同一个「23B」也没能对上口径，
    这一代沿用了同一句宣传语，所以口径差也原样继承，没有新增信息
  - >-
    `weight_global_scale` 与 `input_global_scale` 两个叶名确实不在
    `lib/dtypes.py` 的 scale 白名单里（`_SCALE_LEAVES` 只收 scale / scale_inv /
    weight_scale / weight_scale_inv），但它们**没有**被算进参数量 ——
    这 43776 个张量都是 0 维的（`"shape": []`），而 `derive.py` 的
    `numel()` 对空 shape 返回 0.0。两处错正好抵消，params_total
    429,010,431,105 因此是对的（扣掉草稿侧 1,958,493,697 得 427,051,937,408，
    恰等于 M3 的 427,040,140,160 加新增 3 个 indexer 层的 11,797,248，逐位吻合）。
    真正留下的问题是**字节那一列**：0 维张量同样被记成 0 字节，
    权重存储因此少算 43776 × 4 B = 175,104 B（235.07 GiB 那个数）。
    量级 1e-6，不触发任何容差。抵消是运气不是设计 ——
    哪天出现 0 维的真参数，就会被静默漏掉。两件事（白名单该不该扩、
    `numel([])` 该不该是 0）都是仓库级决定，本记录只登记，不改共享文件
  - >-
    MSA 的算法语义（块 max-pool、局部块占名额、每 index 头独立 topk、选择映射到 KV 组）
    在本代**没有可读的参考实现**：模型卡把 Transformers 列在
    「Additional integrations in progress」，仓里也没有 modeling 代码。
    本记录沿用 M3 那一代从 transformers 参考实现核出来的语义，依据是 config 的
    sparse_* 七个键逐位相同、indexer 张量名与形状逐层相同。
    这是「同参数同结构所以同语义」的推断，不是读到的 —— bottlenecks 里按它算出的
    240.0 MiB 与 7.88 倍都带着这个前提。要钉死得等 SGLang / vLLM 的实现或厂商 kernel
  - >-
    训练精度无一手声明（模型卡只说 quantization-aware training，没说主干训练精度），
    precision.training 不填

reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 一个独立核查代理 + 本会话复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序，对判断类字段与全部 open_questions 逐条过。
    代理穷举了 facts/minimax-m3.1-flash/shapes.json 全部 89729 条（非抽样）核层覆盖、
    条目宽度、量化块（逐张量算逻辑形状 ÷ scale 形状）、专家下标分布与 dtype 分布，
    并与 facts/minimax-m3（23416 条）、facts/minimax-m3-mxfp8（45838 条）逐条比对，
    另外拉了模型卡与 HF 的 org 列表作外部核对。
    本会话独立复核（不只是读代理的结论）的是：config 的 quantization_config 全部七个键
    —— 这是本轮最重的一处，起草时只看了被截断的前三个键就断言「config 只声明了 mxfp8」，
    实际还有 group_size 16 / moe_quant_algo NVFP4 / moe_quant_format nvfp4-pack-quantized
    （R1）；叶名分布 89729 = 23490 权重 + 22463 scale 容器 + 43776 个 0 维全局 scale（R2）；
    derive.py 的 numel() 对空 shape 返回 0.0，所以那 43776 个标量既没进参数量、
    也没进字节数（R3）；dspark/ 子目录自带索引、主索引 89632 条不含它；
    以及把 packing_factor 改成 4 / 8 跑 reconcile，确认容器口径那一档确实不约束打包因子（R7）。
    层集合、条目宽度、69120 元素/token 与读量四项也在本会话独立穷举复算过。
    Gate B：derive.py --ep 4 返回 0、0 处不一致；外部 tally 在「容器数且不含 draft」
    这一档逐位相同，但那一档不约束打包因子，依据另见 precision.quantization.packing_note。
    专家数那一项是 skip（derive 找 n_routed_experts，MiniMax 写 num_local_experts），
    不在「0 处不一致」覆盖内

review:
  - id: R1
    field: lineage.changed_from_predecessor
    severity: wrong
    claim: 「config 只写了 quant_method mxfp8 / weight_block_size [1,32]，两套量化都不是 config 声明的那一套」，并据此类比 DeepSeek V4 的 weight_block_size 坑
    finding: >-
      起草时把 config 的 quantization_config 打印截断在 1200 字符，ignored_layers
      那张长表把后面三个键挤掉了，于是只看到前三个键就下了结论。实际七个键：
      quant_method mxfp8、activation_scheme dynamic、weight_block_size [1,32]、
      ignored_layers、**group_size 16**、**moe_quant_algo NVFP4**、
      **moe_quant_format nvfp4-pack-quantized**。专家的算法、块与落盘布局 config
      全说了，只是写在另外三个键上。DeepSeek V4 那边是 config 对 FP4 专家什么都没说、
      声明的块直接是错的，两件事不是同一类 —— 类比必须删。
