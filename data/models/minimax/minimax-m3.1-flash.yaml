    accessed: '2026-10-30'
    note: >-
      卡上三句原话。三条主线结论里，第一条与第三条由卡直接支持、再由权重清单独立证实；
      第二条卡只说了「哪些路径被量化」，**没说它们用的是两种不同格式**，
      那一层来自 config 的三个 moe_* 键与清单实测（见 precision 段）：
      「the first three full-attention layers are replaced with sparse attention」、
      「quantization-aware training: the routed MoE experts and the attention paths are
