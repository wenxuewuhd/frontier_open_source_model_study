notes: >-
  MiniMax 家族的旗舰，model_type minimax_m3_vl，原生多模态。本仓最先录的一份
  MiniMax 记录（历史线 Text-01 → M1 → M2 后补），也是第三种「稀疏注意力」：GQA 主干 + 块级选读（MSA），与 GLM-5.3 的 DSA 同属
  「全存、选读」一类，但选的是 128-token 块而不是单 token。
  层数、宽度、注意力几何、indexer 层集合、专家分布与 FP32 分布对照完整权重清单核过；
  top_k、routed_scaling_factor、topk 块数、swiglu 参数这类运行期标量只有 config 一个来源。
  released 取 tracking.yaml 的 2026-10-26（= 仓的 lastModified）。仓的 createdAt 是
  2026-06-02、技术报告是 arXiv 2606.13392，发布日可能更早，见 open_questions

open_questions:
  - >-
    KV 落盘精度无一手声明，137472 B/token 是按 config torch_dtype=bfloat16 的兜底
    （dtype_fallback），是**上界**：厂商自己的部署 kernel 仓（MiniMax-AI/MSA，模型卡点名链接）
    README 里列了 paged FP8 decode wrapper、NVFP4 K/V（仅 sparse prefill）与 FP4
    block-score indexer，若 decode 按 FP8 走则约 68736 B/token、1M 约 67.1 GiB。
    这是 README 措辞，未读 kernel 源码也未实测，basis 维持 dtype_fallback，本条继续开着。
    不能与 DeepSeek V4.1 的理论下限（890 B/token）比倍数；跨族系比结构用元素口径
    （68736 元素/token）
  - >-
    缓存形状取自 transformers 参考实现，不是厂商部署 kernel。**块粒度不会改变条目数**：
    块分数是对 per-key 点积取 max（sparse_score_type=max，参考实现 amax over block），
    max 不可预先池化成单条 K —— 要那么做就是换算法（变成 compressed-key 分支），输出会变；
    厂商 kernel 仓 MSA 的 proxy pass 也是 page_size=128 的**分页**而非压缩。
    真正未定的是 index K 的落盘精度，见上一条
  - >-
    config 的 sparse_disable_index_value 与 sparse_attention_freq 逐位相同（L0–L2 为 0、
    L3–L59 为 1），逐层这一维不带额外信息。语义可从三处旁证定到「该层 indexer 只做选择、
    没有 index-V 通路」：参考实现的 indexer 只有 q/k 投影与 norm（没有 v_proj）、其 docstring
    明说上游 checkpoint 在每个稀疏层关掉了 index-value 通路、权重清单里 index_v* 零命中
    （23416 条穷举），厂商 kernel 的 proxy pass 也只出 maxscore。
    所以它不引入第三类缓存、不增加激活参数。仍未钉死的只是这个**键名**没有任何公开实现
    读取（transformers 的 legacy 映射表只收 5 个键，不含它），叫法与行为的对应是推断
  - >-
    厂商「~23B activated」口径未说明。本仓两套口径都更高：带宽口径 24,733,280,640
    （24.73B，含 lm_head、不含输入词表）、可比官方口径 25,962,473,856（25.96B，再含
    输入词表）。两张 200064×6144 词表矩阵都不计时为 23,504,087,424（23.50B），是三者里
    最接近 23B 的 —— 但 23.50 本身也不等于 23，这是推测，不是读到的
  - >-
    厂商「~428B」比实测 427.04B 高约 0.96B（0.23%），口径没有一手说明。差值不太可能是
    未发布的 MTP：config 声明 7 个 MTP 模块，按一层主干 MoE 层实测 7.42B 估，7 个约 52B、
