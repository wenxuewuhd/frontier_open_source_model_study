review:
  - id: R17
    field: arch.vision.tokens.compression_stage
    severity: missing
    claim: >-
      fusion 已经写出「先投到主干宽度，再由 patch_merge_mlp 把 2×2 相邻
      token 拼成 24576 维降回 6144」—— 次序是对的，但**没有人算过这个次序
      值多少钱**，infra 三组也一格没有
    finding: >-
      补 arch.vision 下 tokens / prefill / separability 三组，逐因子核过。
      本档最重要的一条是**压缩位置的代价**：
      本档是 12 份里唯一「先投后压」的一份，张量形状逼出这个次序
      （multi_modal_projector.linear_1 [6144, 1280] 的输入维 1280 是
      encoder hidden，跑在未合并的 token 上；patch_merge_mlp.linear_1
      [6144, 24576] 的 24576 = 4 × 6144，合并的是已投影过的 token），
      于是两层 projector 的 GEMM 跑 2304 次而不是 576 次。
      projector 线性项因此是 **427.62 GFLOPs，Qwen 同口径 39.54 的 10.8 倍**；
      **按别家「先压后投」的口径算本档只有 106.9，会少算 4 倍**。
      次序这件事原来只是 fusion 里的一句描述，现在它是一个能复算的数。
      另外两件：
      (1) **image_seq_length 576 是「每块」而不是「每图」**：
      336 / 14 = 24，24² = 576 与它逐位相同。当成每图读，
      在多块输入上会少算块数倍（672² 是 2×2 块、2016² 是 6×6 = 36 块）。
      (2) **encoder 线性项 2906.0 GFLOPs 是 12 份里最大的**
      （塔 32 层 × hidden 1280，比 Kimi/Qwen 的 27 层 × 1152 大 53%），
      但塔只占一张图 prefill 的 11% —— 主干 47.0 GFLOPs/token 够大。
      两件**没钉住**的进了 scope_note 与 attention_excluded：
      有没有额外的全局缩略视图（LLaVA-NeXT 一系通常有，config 判不出，
      预处理器配置不在 facts/），所以 2304 / 576 是下界；
      以及注意力分段方式 —— 每块各成一段是 217 GFLOPs、四块连一段是
      869 GFLOPs，差 4 倍，36 块时差 36 倍。参考实现本仓读过注意力与路由
      （见 R1），但视觉塔的分段本轮没读。
      分片上本档是 **12 份里分离加载代价最高的一档**：523 个视觉张量被切到
      两个分片、两片都混着主干，而且 projector 链整条在第 26 片
      （和该层 MoE 专家同住）、塔在第 59 片。要凑齐视觉入口得读两个混合分片
    resolution: corrected
    changed_to: >-
      新增 arch.vision.tokens（672² 是 2×2 块、2304 → 576，压缩比 4；
      compression_stage 写明「压在 projector 之后」及其张量形状依据；
      scope_note 写明不含可能的缩略视图、是下界）、
      arch.vision.prefill（encoder 线性 2906.0、projector 427.62 GFLOPs
      并给出四项分别的 token 数、一张图 ≈ 647 个文本 token）、
      arch.vision.separability（mixed，塔与 projector 分家各自与主干同片，
      并点明 patch_merge_mlp 是顶层前缀、按单一 projector 前缀筛会漏）；
      evidence 加八条，四格判断类进 Gate C
  - id: R1
    field: arch.attention.sparse.mechanism
    severity: wrong
    claim: 「每个 index 头独立选 topk 16 块，另加查询所在块之前的 1 个局部块」
    finding: >-
      「另加」与「之前的」两处都错。modeling_minimax_m3_vl.py:574-578：
      local_blocks=1 时 local=arange(1)=[0]，local_idx=(q_block−0).clamp(min=0)，
      即**查询自己所在**的那一块；:578 把它的块分数 scatter_ 成 +inf 之后，
      :583-584 才做 topk(min(topk_blocks, num_key_blocks)) —— 局部块是**挤进** 16 个名额，
      不是额外加。所以每 index 头每步读 16 块 = 2048 token，不是 17 块 2176。
      记录跟的是类 docstring（:485-486 写的是 "plus"），而 docstring 与其下方代码不一致
      —— skill 的「注释不是证据」。另：config 的 sparse_init_block 在 transformers 的
      legacy 映射表里根本不被读取
    resolution: corrected
    changed_to: >-
      按源码重写 mechanism，点明局部块是查询自己所在那块、占用 16 个名额之一；
      并补 index_topk: 2048（GLM-5.3 同字段也是 2048，补上才能直接比）
  - id: R2
    field: bottlenecks
    severity: missing
    claim: bottlenecks 与 infra_signals 都说「省读」，却一个读量数字都没有
    finding: >-
      indexer 每步要拿当前 query 跟整段 index K 历史做全长 matmul（:556 update_index
      返回全历史，:562 全长 matmul，:570 才 amax），这一项 O(S) 每层每步，没被选块省掉。
      1M / BF16 / 单序列，一个 decode step：index K 扫描 14.25 GiB、L0–L2 三个全量层
      6.00 GiB、57 个稀疏层选中的主 KV 仅 228 MiB，合计约 20.47 GiB；对比全量 GQA 的
      120.0 GiB 只省 5.86 倍，其中 indexer 扫描占 69.6%，是选中主 KV 的 64 倍
    resolution: corrected
    changed_to: >-
      新增一条 dimension: kv-bandwidth 的 bottleneck 写上这组逐项数字（标明按参考实现
      算法推导、非实测），并在 infra_signals[0] 补「省读的上限由 indexer 全扫与 3 个
      全量层决定，不由 topk 块数决定」
  - id: R3
    field: open_questions
    severity: wrong
    claim: 「部署侧若按块压缩存 index K（块 max-pool 后只存每块一份），index K 一项会降到 1/128」
    finding: >-
      这个假设与打分的定义冲突，不是「未读所以不知道」。块分数是先算完每个 key 的点积
      再在块内取 max（:562 先 matmul、:568-570 才 amax；cfg 的 sparse_score_type="max"
      说的也是这个）。max_i(q·k_i) 不是任何「池化后单条 k」与 q 的点积，所以在 query
      未知之前无法把一块 128 条 index K 压成一条还保持同样打分 —— 那样就是换算法。
