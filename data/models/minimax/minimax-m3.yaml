notes: >-
  MiniMax 家族的旗舰，model_type minimax_m3_vl，原生多模态。本仓第一份 MiniMax 记录，
  也是第三种「稀疏注意力」：GQA 主干 + 块级选读（MSA），与 GLM-5.3 的 DSA 同属
  「全存、选读」一类，但选的是 128-token 块而不是单 token。
  层数、宽度、注意力几何、indexer 层集合、专家分布与 FP32 分布对照完整权重清单核过；
  top_k、routed_scaling_factor、topk 块数、swiglu 参数这类运行期标量只有 config 一个来源。
  released 取 HF 仓的 createdAt（2026-06-02，与 arXiv 2606.13392 吻合）；
  tracking.yaml 写的 2026-10-26 是仓的 lastModified

open_questions:
  - >-
    KV 落盘精度未披露，137472 B/token 是 BF16 兜底口径，不能与 DeepSeek V4.1 的理论下限
    （890 B/token）比倍数。跨族系比结构用元素口径（68736 元素/token）
  - >-
    缓存形状取自 transformers 参考实现，不是厂商部署 kernel（MiniMax topk_sparse / MSA 仓）。
    部署侧若按块压缩存 index K（块 max-pool 后只存每块一份），index K 一项会降到 1/128 ——
    参考实现没这么做，部署实现未读
  - >-
    config 的 sparse_disable_index_value（逐层 0/1，与稀疏层位置相同）语义不明，
    参考实现里没找到用处
  - >-
    厂商「~23B activated」的口径未说明。本仓带宽口径 24.7B（含 lm_head）、
    可比官方口径 26.0B（再含输入词表），两者都比 23B 高；扣掉 lm_head 与输入词表
    两张词表矩阵约 23.5B，最接近 —— 这是推测，不是读到的
  - >-
    厂商「~428B」比实测 427.04B 高约 0.96B（0.23%），口径没有一手说明。
    若差值是未发布的 MTP，它比一层主干 MoE 层（实测约 7.4B：专家 413.12B / 57 层
    加注意力与共享专家）小得多，不是「再一层 transformer」；也可能只是取整
  - >-
    训练精度无一手声明（config 只有 torch_dtype bfloat16），precision.training 不填
