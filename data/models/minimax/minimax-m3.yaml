bottlenecks:
  - dimension: kv-capacity
    finding: >-
      MSA 省的是读，不是存：60 层全部存完整 GQA KV，57 个稀疏层另存一份 index K。
      和 GLM-5.3 是同一条路线（每层都存、topk 选读），与 DeepSeek V4.1 的「少数层产出
      KV」相反。缓存随层数与上下文线性增长。
      模型卡称 MSA 降低 attention 的 compute 与 memory footprint —— 从权重与参考实现看，
      降的是 compute、读带宽与注意力中间态，KV **容量**一点没降
    quantified: >-
      逐因子：GQA 每层 2（K、V）× 4 KV 头 × 128 = 1024 元素（k_proj / v_proj 输出 512，
      写缓存前的 k_norm 是逐头 [128]，宽度不变），× 60 层 = 61440；index K 每层 128
      （index_k_proj 输出 128、index_k_norm [128]）× 57 层 = 7296；合计 68736 元素/token。
      两类在各自的全部层里都只有这一种 shape（kv_widths.json uniform=true，60/60 与 57/57
      全读，不是抽查）。条目数按 1:1 逐 token 计，依据是参考实现的 update / update_index
      逐 token 拼接，块 max-pool 只在打分时做。无 MTP 块，没有主干口径与开草稿口径之分。
      落盘精度无一手声明，按 config torch_dtype=bfloat16 兜底（2 B/元素）得 137472 B/token、
      1M 上下文 134.25 GiB —— dtype_fallback 口径，是**上界**不是实测，见 open_questions。
      口径边界：full attention 那一项的 512 由 fetch_kv_widths 逐层实测，与 config 的
      num_kv_heads × head_dim 巧合相等；derive.py 的该分量只走 config 公式、不读
      kv_widths.json，所以 Gate B 的「0 处不一致」没有覆盖占 89.4% 的这一项
    visibility: public
  - dimension: kv-bandwidth
    finding: >-
      选块省的是**主 KV 的读**，省不掉 indexer 自己的全量打分：参考实现每层每步都拿
      当前 query 跟整段 index K 历史做一次全长 matmul（update_index 返回全历史，
      matmul 之后才 amax 成块分数），这一项是 O(S) 每层每步。省读的上限由 indexer 全扫
      与 3 个全量 GQA 层决定，不由 topk 块数决定
    quantified: >-
      1M 上下文、单序列、BF16 两侧同口径，一个 decode step 的注意力侧读量逐项：
      index K 全量扫描 57 层 × 1048576 × 128 × 2 B = 14.25 GiB；L0–L2 三个全量 GQA 层
      读完整 KV = 6.00 GiB；57 个稀疏层真正选中的主 KV（每 index 头 16 块 × 128 token）
      = 228 MiB；合计约 20.47 GiB。对比全量 GQA 的 120.0 GiB 只省 **5.86 倍**，
      其中 indexer 扫描占 69.6%，是选中主 KV 的 64 倍。
      按参考实现的算法推导、非实测；换 FP8 落盘两侧等比例缩小，倍数不变
    visibility: public
  - dimension: operator-gap
    finding: >-
      index K 只有 1 个头、index Q 4 个头，每个 index 头独立选块（参考实现输出
      [B, H_idx, S_q, topk]），选块结果再映射到 4 个 KV 组上。按「每层一份选择、
      所有头共用」写的块稀疏核对不上这个形状。
      核契约：块索引左对齐、-1 右填充，局部块的强制保留顺带保证了去重 —— 核按有效项数
      顺序读，索引重复会被重复计数
    visibility: public

infra_signals:
  - text: >-
      本代（M3）的「1M 上下文」与 DeepSeek V4.1 是两种做法：M3 全层全量存 KV、
      靠选块省读带宽，单序列 1M 时 BF16 兜底下约 134 GiB 的 KV；
      容量规划不能按「稀疏注意力 = 少存」去推。
      省读这一侧也有上限：选块把 1M 下的注意力读量从约 120 GiB/step 压到约 20 GiB/step
      （5.9 倍），但其中七成是 indexer 的全量扫描 —— 上限由 indexer 与 3 个全量层决定，
      不由 topk 块数决定
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      config 声明的 MTP（7 个模块）在发布权重里不存在。要用 MTP 投机解码的引擎
      拿不到草稿权重 —— 读 config 判断「支持 MTP」会落空
    evidence: judgement
    horizon: now
    axis: decoding

