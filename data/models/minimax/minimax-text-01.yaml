family: minimax
kind: llm
display_name: MiniMax-Text-01
released: '2025-01-12'
license: other
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/MiniMaxAI/MiniMax-Text-01
    locator: config.json / README.md @ a7351bf2bee0
    accessed: '2026-10-30'
    note: >-
      BF16 发布（输入词表是 FP32），413 分片。权重清单逐分片读头取全，8243 个张量，
      无读失败分片。模型卡原文：456B 总参数 / 45.9B 激活、训练上下文 1M、推理可达 4M、
      「a softmax attention is positioned after every 7 lightning attention」
  - kind: repo
    url: https://huggingface.co/MiniMaxAI/MiniMax-Text-01/blob/main/modeling_minimax_text_01.py
    locator: MiniMaxText01LightningAttention.inference / MiniMaxText01Model._build_slope_tensor
    accessed: '2026-10-30'
    note: >-
      厂商随仓发布的参考实现（非部署 kernel），只读未执行。递归状态的形状与精度从这里核：
      prefill 路径 kv = torch.zeros(b, h, d, e).to(torch.float32)，decode 路径
      kv = ratio * kv + einsum(k, v) 逐 token 更新

