params:
  total: 456089655296.0
  breakdown:
    expert: 434865438720.0
    attention: 18748538880.0
    embed: 1229193216.0
    lm_head: 1229193216.0
    router: 15728640.0
    norm: 1562624.0
  counting_note: >-
    按完整权重清单（413 分片 8243 条目）逐项统计。无量化、无打包、无 scale 容器，
    numel 即参数数，条目数即张量数。total 是本仓按清单求和的**实测值**而不是厂商声明值，
    所以 Gate B 的「参数总量」一项（YAML 声明 vs shapes 实测，delta 0）是实测比实测、
    不构成核对；真正不依赖本仓代码的那一路是 HF 平台自己从分片头统计的 safetensors tally，
    与实测 456,089,655,296 逐位相同。厂商声明「456 billion」，与实测差 0.02%。清单层号 0–79 连续，没有 MTP 块，所以没有 excludes。
    激活参数有带宽口径与可比官方口径两套，见 data/derived/；厂商的「45.9B」
    两套都不等于，口径差见 open_questions

context:
  max: 10240000
  train_native: 1000000

arch:
  layers: 80
  hidden: 6144
  vocab: 200064
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: >-
    SwiGLU（hidden_act silu，专家是 w1 门 / w3 上投 / w2 下投三件套）。
    lightning 层的 qkv 在投影后也过一次同一个 silu（参考实现 self.act(self.qkv_proj(x))），
    这一步不在 FFN 里
  position: >-
    RoPE theta 1e7，rotary_dim 64 —— head_dim 128 的一半，即 partial rotary 0.5。
    **只作用在 10 个 softmax 层**；70 个 lightning 层不带任何位置编码，
    位置信息来自逐头的指数衰减斜率（参考实现 _build_slope_tensor 按 ALiBi 式几何级数
    生成，再按层号缩放 slope_rate × (1 − idx/(L−1))，是运行期常量不是权重）

  attention:
    type: hybrid
    num_heads: 64
    num_kv_heads: 8
    head_dim: 128
    partial_rotary_factor: 0.5
    head_dim_note: >-
      两类层的每头维度都是 128，但投影形态完全不同。softmax 层：q_proj [8192, 6144]
      = 64×128、k_proj / v_proj [1024, 6144] = 8×128、o_proj [6144, 8192]，
      写进缓存的 K/V 条目各 8×128 = 1024 维。lightning 层：qkv_proj [24576, 6144]
      = 3 × 64 × 128 融合成一张，**q/k/v 都是 64 头**（没有 GQA 收缩），
      out_proj [6144, 8192]，另有 output_gate [8192, 6144] 与 norm [8192]。
      num_kv_heads=8 只对 softmax 层成立，按它去推 lightning 层的状态宽度会小 8 倍
    layer_pattern: >-
      config 的 attn_type_list 共 80 项，0 = lightning、1 = softmax：L7, L15, …, L79
      共 10 层是 softmax，其余 70 层是 lightning，即每 7 个 lightning 后接 1 个 softmax
      （模型卡原话）。权重清单零例外地证实了这个层集合：70 个 lightning 层**每层都有**
      qkv_proj / out_proj / output_gate / norm 且**都没有** q_proj，10 个 softmax 层
      反之（全量穷举 8243 条，不是抽样）。两类层的 FFN 都是 MoE，无跨层 KV 共享
    output_gate:
      enabled: true
      type: >-
        只在 70 个 lightning 层上：output_gate [8192, 6144]，参考实现是
        sigmoid(output_gate(x)) 逐通道乘在 RMSNorm 之后、out_proj 之前。
        10 个 softmax 层没有这张权重
    hybrid:
      layer_types_count:
        linear: 70
        full: 10
      interval: 8
      note: >-
        只有 10 个 softmax 层累积随上下文增长的 KV，70 个 lightning 层携带每序列固定的
        递归状态。无 MTP 块，主干口径就是全部口径
    linear_state:
      mechanism: >-
        lightning attention：TransNormer 式的衰减线性注意力，状态按
        S ← exp(−slope) · S + kᵀv 逐 token 递推，读出是 q·S。
        没有短卷积（清单里零 conv1d 命中），也没有 delta rule
      num_heads: 64
      num_value_heads: 64
      key_head_dim: 128
      value_head_dim: 128
      state_dtype: FP32
      state_layout_note: >-
        状态每层一个 [h, d, e] 张量，三个维度都由权重清单钉死：qkv_proj 输出维 24576
        = 3 × 64 × 128，三段同宽，所以 h = 64、d = e = 128，没有 Qwen3.8 那种
        「按 key 头数还是 value 头数展开」的歧义。每层 64 × 128 × 128 = 1,048,576 元素。
        FP32 来自参考实现：prefill 里状态显式 `torch.zeros(b, h, d, e).to(torch.float32)`，
        衰减因子也在 FP32 下算，decode 路径继续在这个张量上累加。这是厂商参考实现的选择，
        不是部署 kernel 或实测显存，evidence 记 judgement，见 open_questions

  ffn:
    type: moe
    layer_pattern: >-
      80/80 层都是 MoE（block_sparse_moe），没有稠密层、也没有共享专家
      （config shared_intermediate_size 0，清单里零 shared_expert 命中）

  moe:
    routed_experts: 32
    shared_experts: 0
    top_k: 2
    intermediate: 9216
    routing: >-
      softmax 打分（参考实现 SparseMoeBlock 对 router_logits 取 softmax 后 topk）。
      gate.weight [32, 6144] 落盘是 FP32（80 份），不是 BF16
    balance: 辅助损失（router_aux_loss_coef 0.001），无 e_score 式偏置
    storage_note: >-
      逐专家独立张量（block_sparse_moe.experts.N.w1/w2/w3），不是堆叠的 3 维权重；
      grouped GEMM 因此吃 2 维权重列表。32 这个数在清单里独立成立：
      `.experts.` 张量 7680 条 = 80 层 × 32 × 3，每层的专家下标集合都恰为 {0..31}，
      零例外（全量穷举）。derive.py 的对账把专家数这一项报成「skip / config 缺失」，
      是因为它找 n_routed_experts / num_experts 而 MiniMax 写的是 num_local_experts ——
      Gate B 的「0 处不一致」不含专家数这一项，上面的穷举才是依据。单专家 3 × 9216 × 6144 = 169,869,312 参数，
      是 M2 单专家（3 × 1536 × 3072 = 14,155,776）的 12.0 倍 —— 这一代走的是
      「少而粗」：32 个专家取 2，M2 是 256 个取 8

  residual:
    type: postnorm + 固定系数残差
    note: >-
      config postnorm true，每层有**两处**带固定系数的残差（参考实现
      modeling_minimax_text_01.py:1038 注意力侧、:1057 MLP 侧）：
      hidden = residual × alpha + branch × beta。config 里有三组系数键
      （layernorm_{linear_attention,full_attention,mlp}_{alpha,beta}），
      注意力那一处按层型在前两组里二选一（:964-967），所以一层只会用到两组。
      三个 alpha 同为 3.5565588200778455、三个 beta 同为 1.0。
      系数是 config 标量，不是权重，清单里没有对应张量 ——
      按「残差直加」写的融合 add+norm 核会漏掉这个缩放

precision:
  weights_release: [BF16, FP32]
  quantization:
    per_subsystem:
      expert: BF16
      attention: BF16
      embed: FP32
      lm_head: BF16
      router: FP32
      norm: BF16
    subsystem_method: >-
      不是抽样：完整清单 8243 条逐项统计，FP32 只有两类 —— 80 个
      block_sparse_moe.gate.weight [32, 6144]（15,728,640 元素）与输入词表
      model.embed_tokens.weight [200064, 6144]（1,229,193,216 元素），
      合计 1,244,921,856，与 HF tally 的 F32 一项逐位相同；其余 454,844,733,440
      全是 BF16。**输入词表 FP32 而 lm_head BF16** 是这一版独有的（M1 把它改成 BF16），
      权重存储因此比全 BF16 多 2.29 GiB

platforms:
  - engine: transformers
    hardware: NVIDIA
    status: supported
    precision: BF16
    ref:
      kind: modelcard
      url: https://huggingface.co/MiniMaxAI/MiniMax-Text-01
    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      7:1 的混合比把随上下文增长的那一半**正好压掉 8 倍**：只有 10 个 softmax 层
      累积 KV，另外 70 层换成每序列固定的递归状态。代价不是消失而是换了增长轴 ——
      状态与上下文无关，却与**并发序列数**成正比，而且每层都不小
    quantified: >-
      逐因子：softmax 侧每层 2（K、V）× 8 KV 头 × 128 = 2048 元素
      （k_proj / v_proj 输出维都是 1024，10/10 层只有这一种 shape，全量穷举非抽样），
      × 10 层 = 20480 元素/token；若 80 层全是同样的 GQA 则是 163840，正好 8 倍。
      lightning 侧每层 64 × 128 × 128 = 1,048,576 元素（三个因子都取自
      qkv_proj 输出维 24576 = 3 × 64 × 128），× 70 层 = 73,400,320 元素/序列。
      字节：两个分量的来源不同，**不是同一套 basis**。softmax KV 无一手精度声明，
      按 config 的 BF16 兜底 2 B/元素得 40960 B/token（dtype_fallback，是上界）；
      状态按厂商参考实现的 FP32 4 B/元素得 293,601,280 B = 280.0 MiB/序列
      （judgement，不是兜底）。所以合计的口径是 **mixed** ——
      derive.py 的 bytes_basis 只按 KV 那一侧的 kv_dtype_assumed 打标，
      这里按 docs/kv-cache-accounting.md 的定义改写（工具侧的缺口见 review R4）。
      「两分量相等的上下文长度」= 状态字节 ÷ 每 token KV 字节，因此也随两侧精度变：
      FP32 状态 + BF16 KV 是 293,601,280 / 40960 = **7168 token**；
      BF16 状态 + BF16 KV 是 3584；FP32 状态 + FP8 KV 是 14336。
      本组合下超过约 7K 之后容量由 softmax 那一侧主导，低于它则由状态主导，
      但这个阈值落在 3584–14336 区间内，两侧精度都没钉死。
      1Mi（1,048,576）token 单序列：40.0 GiB + 280.0 MiB。
      与别族系比结构请用元素口径（20480 元素/token），不要比字节
    visibility: public
  - dimension: kv-bandwidth
    finding: >-
      递归状态在 decode 时**每步都要整读整写**，而 softmax KV 每步只追加一条、
      其余全是读。状态流量与上下文无关、与 batch 成正比，KV 流量与两者都成正比 ——
      所以短上下文大 batch 的场景里，省下来的不是带宽而是容量
    quantified: >-
      一个 decode step、单序列、FP32 状态：70 层 × 1,048,576 × 4 B 读 + 同样大小的写
      = 560.0 MiB 的状态流量（下界，不含中间量）。同一 step 的 softmax KV 读
      10 × 2048 × 2 B × S = 40960·S B（S 为已有 token 数），写只有一条新条目
      10 × 2048 × 2 B = 40960 B，对下面的比较可忽略。
      两者在 S = 587,202,560 / 40960 = 14336 持平 —— 这同样是跨 basis 的比值
      （状态 FP32 取自参考实现、KV BF16 是兜底），两侧精度变了这个点就变。
      batch B 时状态流量线性放大为 B × 560 MiB，而权重侧的激活参数搬运量
      （45.9B 级，见 data/derived/）在 batch 之间共享不放大。
      按参考实现的算法推导、非实测
    visibility: public
  - dimension: operator-gap
    finding: >-
      一个模型里交替跑两套互不相同的注意力算子，7:1 分布，且 lightning 侧的
      prefill 与 decode 是两个不同的核：prefill 走分块（块内衰减矩阵 diag_decay
      + 块间状态递推），decode 走逐 token 的 rank-1 状态更新。
      softmax 侧另需 RoPE 与 GQA 展开，而 lightning 侧**不带位置编码、不做 GQA 收缩**，
      还多一条 sigmoid 输出门与一次 head-concat 后的 RMSNorm [8192]
    quantified: >-
      核契约：衰减斜率逐头不同（64 个值，ALiBi 式几何级数），且再按层号缩放
      slope_rate × (1 − idx/79 + 1e-5)，所以**每层的衰减表都不一样**，
      不能跨层复用一张常量表；斜率是运行期算出来的，清单里没有对应权重。
      状态张量 [64, 128, 128] 在参考实现里是 FP32，与 BF16 的 q/k/v 混算 ——
      按「状态与激活同 dtype」写的核会读错
    visibility: public

infra_signals:
  - text: >-
      混合线性注意力把显存账的增长轴拆成两根：10 个 softmax 层的 KV 随上下文长，
      70 个 lightning 层的状态随并发序列数长。容量规划要同时给两根轴留预算，
      本代的交点在 3.6K–14K token 区间（取决于两侧落盘精度，本仓取到的组合是 7168）。
      交点以上由 softmax KV 主导 —— 线性那一侧真正省掉的，是「80 层全存」里的 7/8
    evidence: judgement
    horizon: settled
    axis: attention
  - text: >-
      两套注意力算子交替 7:1 出现在同一张图里，且 lightning 侧 prefill / decode
      是两个核、衰减表逐层不同。图模式与算子库要按「一个模型两种 attention」准备，
      不能按单一 attention 模板套
    evidence: judgement
    horizon: settled
    axis: attention

