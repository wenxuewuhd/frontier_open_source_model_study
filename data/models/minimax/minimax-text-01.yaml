notes: >-
  MiniMax 家族的谱系起点，也是本仓最早的一份「线性/softmax 混合」记录（2025-01）。
  这条线的主线就是注意力形态：Text-01 的 7:1 lightning 混合 → M1 结构原样沿用
  → M2 把线性注意力整条去掉、回到全量 GQA → M3 再用块稀疏（MSA）在全量 KV 之上省读。
  层数、两类层的层集合、投影形状、专家分布与 FP32 分布都对照完整清单穿过一遍。
  top_k、aux_loss 系数、alpha/beta、rope_theta 这类运行期标量只有 config 一个来源
  （Text-01 的 config 里没有 routed_scaling_factor，那个键到 M3 才出现）。
  released 取 HF 仓的 createdAt 2025-01-12（技术报告 arXiv 2501.08313 同期），
  不是厂商公告日。license 记 other 是判断：HF 的 tags 与 cardData 都**没有** license 项，
  依据是仓里同时有 LICENSE-MODEL 与 LICENSE-CODE 两份自有许可文件（M1 起换成 apache-2.0，
  那边有 license:apache-2.0 标签）。同日另发 MiniMax-VL-01：语言主干与本记录**逐张量同名**
  （把 language_model. 前缀去掉后 8243 条名字逐条相同，双向无差集），
  只多一个 24 层 CLIP 式 ViT、一个两层 projector 与 image_newline，共 394 条。
  **只比了名字**：VL-01 那边只取了 names.json，形状与 dtype 没取，所以不说「同形」。
  注意力这条线上不增加信息，故不单独立记录

open_questions:
  - >-
    递归状态的落盘精度记 FP32，依据是厂商随仓参考实现
    （modeling_minimax_text_01.py 的 prefill 路径把状态显式建成 float32、
    衰减因子也在 FP32 下算）。这是参考实现的选择，不是部署 kernel 或实测显存：
    若部署侧按 BF16 存，每序列 280.0 MiB 减半为 140.0 MiB，与 KV 的容量交点
    从 7168 token 移到 3584。本条继续开着
  - >-
    softmax 层的 KV 落盘精度无一手声明，按 config 的 BF16 兜底（dtype_fallback），
    40960 B/token 是**上界**；按 FP8 存则交点移到 14336。
    所以这份账的两个分量 basis 不同（per_token 兜底、per_sequence 取自参考实现），
    合计的口径是 mixed。跨代或跨族系比结构请用元素口径（20480 元素/token），
    不要拿这个兜底字节去和别人的精确值比倍数
  - >-
    上下文有三个互不相等的数：config 的 max_position_embeddings 10,240,000、
    模型卡的「训练上下文 1M」、模型卡的「推理可达 4M」。本记录 context.max 取 config 值
    （与仓内其它记录同口径），train_native 取 1M。4M 这个数没有对应的 config 字段，
    未进记录
  - >-
    厂商「45.9B activated」与本仓两套口径都不相等（见 data/derived/）。
    带宽口径 47,174,113,280（47.17B，含 lm_head、不含输入词表）、可比官方口径
    48,403,306,496（48.40B，再含输入词表）。按清单复算，45.9B 最接近的是
    「带宽口径再扣掉 lm_head」那一档：47,174,113,280 − 1,229,193,216 =
    **45,944,920,064**（45.94B），即输入词表与输出头都不计。这是从数字反推出来的对齐，
    厂商没有说明口径，所以记成推测而不是读到的
  - >-
    输入词表存 FP32 而 lm_head 存 BF16，厂商没有说明原因；M1 把输入词表改成 BF16
    而其余 8242 条张量的形状与 dtype 全部不变。这是两版之间**唯一**的权重级差异
  - 训练精度无一手声明（config 只有张量 dtype，没有 torch_dtype 键），precision.training 不填

reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 一个独立核查代理 + 本会话复算
  method: >-
    按 .claude/skills/model-audit 的提问顺序，对判断类字段与全部 open_questions 逐条过。
    代理穷举了 facts/minimax-text-01/shapes.json 全部 8243 条（非抽样）核层覆盖、
    条目宽度、专家分布与 dtype 分布，并逐条与 facts/minimax-m1-80k、
    facts/minimax-vl-01 的名单比对。
    本会话独立复核（不只是读代理的结论）的是：lightning attention 的递归状态形状与精度
    —— 直接读 modeling_minimax_text_01.py，prefill 在 :297 把状态建成
    torch.zeros(b, h, d, e).to(torch.float32)（b,h,n,d = q.shape、e = v.shape[-1]），
    decode 在 :316-324 用 float32 的 ratio 继续累加，所以状态在参考实现里全程 FP32；
    衰减斜率在 :1235-1256 按 ALiBi 式几何级数生成、:1348 再按层号缩放，是运行期常量；
    lightning 路径全程不碰 rotary。层集合与宽度也在本会话独立穷举过一遍
    （70 个 lightning 层的 self_attn 叶名集合与 10 个 softmax 层的交集为空，
    各自宽度在层内唯一），以及 KV 20480、状态 73,400,320、两个交点 7168 / 14336
    的逐因子复算。
    Gate B：derive.py --id minimax-text-01 --model ... 0 处不一致，
    外部 safetensors tally 逐位相同；但专家数那一项是 skip（derive 找
    n_routed_experts / num_experts，MiniMax 写的是 num_local_experts），
    不在「0 处不一致」覆盖内，依据是清单穷举

review:
  - id: R1
    field: bottlenecks
    severity: wrong
    claim: 「两者相等的上下文长度是 293,601,280 / 40960 = 7168 token」，并把整份账标成 dtype_fallback
    finding: >-
      两个因子都复算无误，但这个比值**跨了两套 basis**：分子的 FP32 取自厂商参考实现
      （evidence judgement，不是按模型 dtype 兜底），分母的 BF16 才是 dtype_fallback。
      按 docs/kv-cache-accounting.md，两种 basis 之间不算倍数，合计口径应是 mixed。
      而且原来的免责声明只变了状态那一侧（FP32→BF16 得 3584），没变 KV 那一侧
      —— 若 KV 按 FP8 存则是 14336。「免责声明只免掉它点名的那件事」
    resolution: corrected
    changed_to: >-
      bottlenecks 里把合计口径写成 mixed 并说明 derive.py 为何仍标 dtype_fallback；
      交点改写成「状态字节 ÷ 每 token KV 字节」的函数，给出三种精度组合
      （7168 / 3584 / 14336）并说明两侧都没钉死；open_questions 同步
  - id: R2
    field: bottlenecks
    severity: imprecise
    claim: 「同一 step 的 softmax KV 只读不写」
    finding: >-
      每个 decode step 每个 softmax 层都要追加一条 K 与一条 V：
      10 × 2048 × 2 B = 40960 B/step。相对 3 GiB 级的读量可忽略，
      但整段论证正是「读 vs 读+写」，把写说成零是一个没有来源的因子
    resolution: corrected
    changed_to: 写量按 40960 B/step 写明，并注明对交点的影响可忽略
  - id: R3
    field: arch.residual.note
    severity: wrong
    claim: 「三处残差都带固定系数……六个键取值相同」
    finding: >-
      两处错。(1) 参考实现每层只有**两处**残差（:1038 注意力侧、:1057 MLP 侧）；
      config 里是三组系数键，注意力那一处按层型在 linear / full 两组里二选一
      （:964-967），一层最多用到两组。(2) 六个键不是一个值：
      三个 alpha 同为 3.5565588200778455、三个 beta 同为 1.0
    resolution: corrected
    changed_to: 改成「两处残差、三组系数键按层型选用」，alpha 与 beta 分开说
  - id: R4
    field: bottlenecks
    severity: imprecise
    claim: 依赖 derive.py 的 bytes_basis 作为这份账的口径标签
    finding: >-
      derive.py 的公式路只按 kv_dtype_assumed 打一个全局 basis（scripts/derive.py:746-748），
      看不见 linear_state 的 state_dtype —— 本记录显式给了 FP32（judgement），
      产物里 linear_state.dtype 确实是 FP32，而整份账仍标 dtype_fallback。
      这不是 MiniMax 独有：Qwen3.8 两档同样显式给了 state_dtype FP32、同样被标成
      dtype_fallback。混合结构应该走 mixed（measured 分支已有这个逻辑，公式路没有）
    resolution: deferred
    changed_to: >-
      记录正文按 mixed 写并点明工具侧的差异。让 derive.py 的公式路在各分量
      dtype 来源不同时标 mixed，是仓库级改进项（波及 qwen3.8 两档），本期不改脚本
  - id: R5
    field: notes
    severity: unsupported
    claim: 「MiniMax-VL-01 语言主干与本记录逐张量同名同形」
    finding: >-
      facts/minimax-vl-01 是 --names-only 取的：fetched.json 的 tensor_count 为 0、
      shapes.json 为空。名集合的结论成立（8637 = 8243 个 language_model. 前缀条目
      去前缀后与本记录逐条相同、双向无差集 + 394 条视觉侧），
      但**形状与 dtype 一个都没读过**，「同形」没有来源
    resolution: corrected
    changed_to: 改成「逐张量同名」，并写明 VL-01 只取了名单
  - id: R6
    field: infra_signals
    severity: unsupported
    claim: 「本代的交点在约 7K token —— 比绝大多数实际请求都短」
    finding: >-
      记录里没有任何请求长度分布的来源，而且 7K 这个数本身带着 R1 的两侧精度不确定性
      （3584–14336）
    resolution: corrected
    changed_to: 删掉「比绝大多数实际请求都短」，改写成区间
  - id: R7
    field: notes
    severity: wrong
    claim: 「top_k、routed_scaling、aux_loss 系数……只有 config 一个来源」
    finding: >-
      Text-01 的 config 里根本没有 routed_scaling / routed_scaling_factor 这个键
      （逐键核过），它到 M3 的 text_config 才出现。把一个不存在的键列进「来源单一」清单，
      会让读者以为它有值
    resolution: corrected
    changed_to: 删掉 routed_scaling，换成实际存在的 rope_theta，并注明这个键到 M3 才有
  - id: R8
    field: params.counting_note
    severity: imprecise
    claim: 「Gate B 的外部参数量对账是实测比实测之外的那一路」
    finding: 一句话里混了两件事，读不通。total 是实测值，所以 Gate B 的「参数总量」项（delta 0）是实测比实测、不构成核对；外部那一路是 HF 的 tally
    resolution: corrected
    changed_to: 按 ds-v2 的写法拆成两句
  - id: R9
    field: bottlenecks
    severity: wrong
    claim: 起草时写「1M 上下文单序列 39.06 GiB」与「单专家是 M2 的 36 倍」
    finding: >-
      两处起草期算错，提交前自查出来：40960 B/token × 1,048,576 = 42,949,672,960 B
      恰是 **40.0 GiB**；单专家 169,869,312 ÷ 14,155,776 = **12.0** 倍不是 36
    resolution: corrected
    changed_to: 改为 40.0 GiB 与 12.0 倍，并把 1Mi 的口径写进括号
  - id: R10
    field: bottlenecks
    severity: imprecise
    claim: 「68736 一类的乘式只验了一个因子」—— 对层集合、条目宽度、参数量与 dtype 分布的全量复核
    finding: >-
      四个因子逐个独立穷举（8243 条全量，非抽样）：(1) 70 个 lightning 层的
      self_attn 叶名集合 {qkv_proj, out_proj, output_gate, norm} 与 10 个 softmax 层的
      {q,k,v,o_proj} 交集为空，层集合与 attn_type_list 逐位一致；
      (2) 每类叶名在各自层内只有一种 shape（70/70、10/10）；
      (3) 条目 1:1 逐 token，依据是参考实现走标准 Cache；
      (4) BF16 兜底 2 B/元素。KV 20480、全 80 层反事实 163840（正好 8 倍）、
      状态 73,400,320 / 280.0 MiB 逐位复算一致。
      params.total 与全部 6 个 breakdown 桶按清单求和逐位吻合，且等于 HF tally。
      四个因子都成立，数值不改
    resolution: confirmed
