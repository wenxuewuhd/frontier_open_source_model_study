reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 本会话逐字段复算 + 一个独立核查代理
  method: >-
    按 .claude/skills/model-audit 的「缓存账七问」与「读证据九条」对 facts/kimi-linear-48b
    逐字段核：config 全部键（含 linear_attn_config 的两个层列表）、完整清单 20,493 个张量
    （逐张量形状与 dtype、层号 0–26、KDA 与 MLA 两套投影各自的层集合）、repoinfo 的 tally、
    derived 的两个缓存分量。参考实现 modeling_kimi.py / configuration_kimi.py 本会话亲自读过：
    KimiDeltaAttention 的 A_log 声明与 view、三路 ShortConvolution、低秩 f/g 门、
    KimiMLAAttention 的 assert use_nope 与 KimiDynamicCache 存解压 K/V、
    KimiBlockSparseMLP 的 w1/w2/w3 语义、is_kda_layer 的 1 起计。
    本会话独立复算：MLA 7 层 × 576 = 4,032 元素/token、KDA 每层 32×128×128 + 4×12,288、
    20 层合计 11,468,800 元素 / 21.88 MiB（BF16）、解压缓存 10,240 / 576 = 17.8 倍、
    F32 元素 20 × (32 + 4096) = 82,560 与 tally 逐位相同、
    all-to-all 2 × 8 × 2304 × 2 B × 26 = 1,916,928。
    另派一个独立核查代理做对抗式复核（它重算了两分量缓存账的每个因子、解压缓存的 17.8 倍、
    参数分项与 dtype 分布，并把 A_log 的含义在两代的实现与清单上双向验了一遍），
    五条发现见 R7–R11；它报的每个数本会话复算过（单专家那一条确为本记录算错）。
review:
  - id: R1
    field: lineage.changed_from_predecessor
    severity: wrong
    claim: 「1M 上下文下两项合计 7.90 GiB，而纯 MLA 的前代按同样宽度要 15.19 GiB」
    finding: >-
      15.19 GiB 漏了「每元素几字节」这一个因子：15,552 元素/token × 1,048,576 token
      得到的是 16.3G 个**元素**，折 BF16 是 **30.37 GiB**，不是 15.19。
      这正是 skill 第 1 条点名的失败模式 —— 乘式里一个因子没验，数就错一个倍数。
      本记录自己那一侧（7.90 GiB）是 derive.py 算的，没有这个问题
    resolution: corrected
    changed_to: 改成「同样宽度的 27 层纯 MLA 要 30.37 GiB」，并注明这是结构对照而非前代真实上限（前代只支持 8K）
  - id: R2
    field: bottlenecks
    severity: wrong
    claim: 「conv 项的窗长按 conv_kernel_dim 4 全窗计，是上界；实现若只存 k−1 个位置少 3.75 MiB」
    finding: >-
      3.75 MiB 是从 kimi-k3 那份记录的同一句话搬过来的，没有按本模型重算：
      本模型 conv 状态是 20 层 × 4 × 12,288 = 983,040 个元素、BF16 1,966,080 B = 1.875 MiB，
      少存一个位置省四分之一 = **0.47 MiB**（K3 是 69 层 × 4 × 36,864，19.4 MiB，四分之一才是 4.85）。
      跨记录搬句子时数字必须跟着重算
    resolution: corrected
    changed_to: 改成「这一项从 1.875 MiB 降到 1.41 MiB（少 0.47 MiB）」
  - id: R3
    field: arch.attention.linear_state.state_layout_note
    severity: imprecise
    claim: 「A_log 的首维在本代是头数（[1, 1, 32, 1]，32 = num_heads），逐头衰减；K3 的 [128] = head_dim 是逐通道」
    finding: >-
      两代都自己读过源码与清单，结论成立且必须带作用域：
      本代参考实现写 `torch.log(torch.empty(self.num_heads, dtype=float32)).view(1, 1, -1, 1)`，
      落盘恰是 [1, 1, 32, 1] F32，而 num_heads 32 ≠ head_dim 128，**声明与权重一致**；
      K3 的参考实现写的是 `torch.empty(self.num_heads)`（= [96]）而落盘是 [128]，
      **声明与权重冲突、按权重为准**，且 128 = linear_attn_config.head_dim，
      96 走 b_proj [96, 7168]、96×128 走 dt_bias [12288]。
      所以 qwen3.8-27b 那条「A_log 首维 = 状态头数」的读法在本代成立、在 K3 不成立 ——
      套到 K3 会把每序列状态算错 1.33 倍（96 vs 128）。这是 skill 第 5 条要求的代际钉死
    resolution: confirmed
    changed_to: 原值成立；作用域与反例都写在同一字段里
  - id: R4
    field: bottlenecks
    severity: imprecise
    claim: KDA 的 conv 通道数 12,288 与矩阵状态 32×128×128
    finding: >-
      逐因子核过：20/20 个 KDA 层的 q/k/v_conv1d 都是 [4096, 1, 4]，三者之和
      3 × 4096 = 12,288，与 derive.py 的 qkv 通道公式 2 × 32 × 128 + 32 × 128 逐位相等，
      也等于三个 in_proj（q/k/v_proj 各 [4096, 2304]）的输出维之和 ——
      与 README 里 Qwen3.8 那条「conv1d 首维恒等于 in_proj_qkv 输出维」的恒等式同形，
      但本代 key:value 头数是 1:1，所以这个样本**不能**用来验证那条恒等式对不同头数比仍成立。
      矩阵状态 [32, 128, 128] 取自参考实现的 recurrent_state 布局（二手，依实现而定）
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R5
    field: arch.activation
    severity: imprecise
    claim: 「SwiGLU（config hidden_act silu；专家权重名是 w1/w3 门控 + w2 下投影）」
    finding: >-
      w1/w3 的分工写含糊了。参考实现 KimiBlockSparseMLP 是
      `w2(act_fn(w1(x)) * w3(x))`，即 w1 是过 SiLU 的那一路（gate）、w3 是不过激活的那一路（up）、
      w2 是下投影（down）。另外**同一层里两套命名并存**：路由专家走 KimiBlockSparseMLP（w1/w2/w3），
      共享专家走 KimiMLP（gate_proj/up_proj/down_proj），清单里两种名字都有 ——
      按名字匹配权重的工具要同时认，否则会漏掉一半
    resolution: corrected
    changed_to: activation 字段写出 w1 = gate / w3 = up / w2 = down 与两套命名并存这件事
  - id: R6
    field: arch.ffn.layer_pattern
    severity: imprecise
    claim: 「专家吃的是 hidden 2304 本身，没有 latent 降维」
    finding: >-
      零命中验过：清单里 routed_expert_down_proj / routed_expert_up_proj / routed_expert_norm
      三个名字**一个都没有**（K3 各 92 个），专家 w1 [1024, 2304] 的输入维就是 hidden。
      同理 AttnRes 的 *_res_proj / *_res_norm 也零命中。
      所以 K3 的三样新结构里，本代只有「KDA + MLA 混合」这一样，
      latent MoE 与 AttnRes 都是 K3 才出现的 —— 这是「某个张量存不存在」这类问题，
      零结果与「真的没有」在这里能分清：清单是完整的（20,493 条、20/20 分片、层号 0–26 连续）
    resolution: confirmed
    changed_to: 原值成立，不改

  - id: R7
    field: lineage.changed_from_predecessor
    severity: wrong
    claim: 「单专家从 8.65M 缩到 3.54M（3 × 1024 × 2304）—— 本代是真的在细化」
    finding: >-
      写出来的乘式自己就否定了结论值：3 × 1024 × 2304 = **7,077,888**（7.08M），不是 3.54M。
      清单独立闭合：expert 分项 47,110,422,528 ÷ 256 专家 ÷ 26 层 = 7,077,888 逐位整除。
      所以单专家只缩 **1.22 倍**（8,650,752 / 7,077,888），而专家数涨 4 倍 ——
      **专家总容量是涨的**（14.39B → 47.11B）。
      「真的在细化」这句被错数字撑着：方向上确实与 K2 把单专家做大相反，
      但要按比值说（单专家/hidden 从 0.69 降到 0.44、激活占比 9.4% → 3.1%），
      不能说成总量变细
    resolution: corrected
    changed_to: 改成 7,077,888 与 1.22 倍，并把「细化」限定到比值与激活占比两项
  - id: R8
    field: infra_signals
    severity: overreach
    claim: 「差别在三处且都在 K3 侧：衰减逐头→逐通道、门低秩→满秩、MLA 的 Q 侧改回两段式」
    finding: >-
      「三处」是个封闭集，而 KDA 这条路径上至少还有两处，都在参考实现里：
      (4) K3 把门与 beta 的计算挪进 kernel（给 chunk_kda 传 use_gate_in_kernel /
      use_beta_sigmoid_in_kernel 与 A_log / dt_bias），而本代走的外置 fused_kda_gate
      在 K3 的实现里已被注释标成 deprecated；
      (5) K3 多传 transpose_state_layout=True 与 safe_gate / lower_bound
      （对应 config 新增的 gate_lower_bound −5.0，本代没有这个键），
      其中 transpose_state_layout 直接动的就是递归状态布局。
      另外落盘精度也不同（本代 q/k/v_conv1d 与 o_norm 是 BF16，K3 这四类是 F32）。
      这两条恰好**强化**原结论（按本代写的 kernel 不能直接跑 K3），漏掉它们是自我削弱
    resolution: corrected
    changed_to: 改成「至少五处」并逐条列出，附落盘精度那一项
  - id: R9
    field: arch.attention.linear_state.mechanism
    severity: missing
    claim: KDA 的描述里没有 b_proj
    finding: >-
      20/20 个 KDA 层都有 self_attn.b_proj.weight [32, 2304]（共 1,474,560 参数），
      参考实现是 Linear(hidden, num_heads) 后接 sigmoid，给出 delta rule 的写入强度 β ——
      逐头一个标量。记录的机制描述、counting_note 的 attention 拆解与 operator-gap
      三处都没提它，而算子侧它是一个独立的窄 GEMM 加一次 sigmoid（K3 侧同样有，[96, 7168]）
    resolution: corrected
    changed_to: mechanism 里补 b_proj 的形状、层覆盖、语义与算子含义
  - id: R10
    field: arch.attention.head_dim_note
    severity: missing
    claim: 记录写 head_dim 192（derived），通篇没提 config 顶层那个值为 72 的 head_dim 键
    finding: >-
      这正是 skill 规则 2 点名的「config 已知会错的判型字段」：
      config 顶层有 head_dim 72，而 72 × 32 = 2304 = hidden，看起来很自洽，
      照它推会得到一套完全错的注意力形状 —— 真实值是 MLA 每头 QK 192
      （q_proj [6144, 2304] = 32 × 192、kv_b_proj [8192, 512] = 32 × (128+128)）
      与 KDA 每头 128（linear_attn_config.head_dim）。
      记录判对了值却没留下这个坑的痕迹，下一个人会重踩
    resolution: corrected
    changed_to: head_dim_note 里点名 72 这个值、它是怎么来的、以及为什么不能用
  - id: R11
    field: arch.attention.linear_state.num_key_heads
    severity: miscategorized
    claim: num_key_heads / num_value_heads / value_head_dim 继承 arch 的 official
    finding: >-
      config 的 linear_attn_config 只有 num_heads / head_dim / short_conv_kernel_size
      与两个层列表 —— **没有** key/value 头数、也没有 value_head_dim。
      这三个值是从 k_proj / v_proj [4096, 2304] = 32 × 128 推出来的，属实测自权重，
      按 CLAUDE.md 应标 derived（同族的 mechanism / state_layout_note 已经单独标过）
    resolution: corrected
    changed_to: evidence 里补这三条标 derived

notes: >-
  混合线性注意力这条线的起点，本仓按支线收录（track: side）：档位比同期旗舰
  （K2-0905，1T）小两个量级，但**它是 K3 语言主干的原型**，而且是整条 Kimi 线上
  唯一一个能用 20 个分片验完 KDA 全套算子的版本。
  predecessor 取 kimi-moonlight-16b 而不是时间上的前一版（kimi-k2-0905）：它与 Moonlight
  同属 27 层 / A3B 这一档，MLA 的 Q 侧同样不降维（q_proj 单段），
  而 K2 线是 61 层 / q_lora_rank 1536 的另一条线 —— 按时间比会把一次放大再缩小当成变化。
  同日发布的 Kimi-Linear-48B-A3B-Base 是同架构的基座版，本仓不单独立记录。
  released 取 HF 仓的 createdAt 2025-10-30。

open_questions:
  - >-
    递归状态与 KV 的落盘精度都未披露，两个分量都按 config dtype（bfloat16）兜底，
    bytes_basis 是 dtype_fallback。旁证在本代是**混的**：A_log 与 dt_bias 是 F32，
    但 o_norm 与三个 conv1d 都是 BF16（K3 这四类全是 F32）。
    没读 fla kernel，不填 state_dtype；与 qwen3.8-27b（state_dtype FP32、conv 也按 FP32 计）
    比之前要先对齐这一条
  - >-
    预训练数值格式无一手声明，precision.training 不填
  - >-
    MLA 层的「rope」64 维不旋转（NoPE），能否并进 latent 压缩要看部署 kernel，
    参考实现定不了 —— 与 kimi-k3 的同一条疑问是同一个问题
  - >-
    模型卡的「KV 省 75%」没写基线。本仓按「同宽度的 27 层纯 MLA」算是 3.86 倍
    （15,552 → 4,032 元素/token），与 75% 同阶但不是同一个口径，不要互相引用
