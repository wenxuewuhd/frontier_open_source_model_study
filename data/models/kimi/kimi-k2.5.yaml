reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 本会话逐字段复算 + 一个独立核查代理
  method: >-
    按 .claude/skills/model-audit 的顺序对 facts/kimi-k2.5 逐字段核：config（text_config /
    vision_config 两段全部键，含 quantization_config 的 ignore 列表）、完整清单 208,550 个张量、
    repoinfo 的 tally，并做三组清单比对：与 kimi-k2-thinking（剥 language_model. 前缀）、
    与 kimi-vl-a3b 的 vision_tower、与 kimi-k2.6 / kimi-k2.7-code 的名字清单。
    视频路径本会话亲自读了参考实现 modeling_kimi_k25.py：
    Learnable2DInterpPosEmbDivided_fixed 的 time_weight（register_buffer persistent=False、
    get_1d_sincos_pos_embed）与 forward 里的 assert t <= num_frames、
    tpool_patch_merger 的 mean(dim=0)、MoonViT3dEncoder 按 t×h×w 切 cu_seqlens
    与 video_attn_type 的 assert。
    本会话独立复算：×8 还原与 HF tally 逐位相同、视觉两段求和、
    与 kimi-k2-thinking 的差额 +471,136,112、projector 54,277,888 的逐项、
    decode 每 token 字节与 KV 两项（与 kimi-k2-thinking 相同）。
    另派一个独立核查代理做对抗式复核（它重算了三组同一性、×8 还原链、
    并逐键比了 K2.5 / K2.6 / K2.7 三份 config），三条发现见 R5–R7
review:
  - id: R1
    field: params
    severity: wrong
    claim: derive.py 的 shapes 路给出参数总量 139,029,243,888（专家按 I32 容器数计）
    finding: >-
      与 kimi-k2-thinking 的 R1 同一个根因：lib/dtypes.py 的 _CONTAINERS 不含 INT32，
      pack-quantized 的「8 个 INT4 / 一个 I32 容器」不会被还原，专家少算 8 倍，
      Gate B 的「参数总量」与「外部参数量对账」两项都报 MISMATCH，
      derived 里的分项与激活参数（13.2B，还原后真值 31,687,095,808）也跟着偏小。
      本记录这一侧另有一条独立闭合：还原后 1,026,879,376,368
      = kimi-k2-thinking 的 1,026,408,240,256 加视觉 471,143,920 减 61 个 inv_freq buffer 7,808，
      与 HF tally 逐位相同
    resolution: corrected
    changed_to: >-
      params 填还原后的值、counting_note 写明三条量纲闭合；脚本缺口随后由主会话修掉
      （lib/dtypes.py 的 _CONTAINERS 改成「容器 -> 位宽」映射并纳入 INT32，还原因子按
      「容器位宽 / 逻辑位宽」算，新增 is_metadata_tensor() 把 weight_shape 排除在参数之外）。
      修完 derive.py 直接给出 1,026,879,376,368，与 YAML 声明和 HF tally 三方逐位相同，
      两条 MISMATCH 都报 delta_pct=0.0，激活参数也从 13.2B 纠正到 31.69B
  - id: R2
    field: arch.vision.fusion
    severity: missing
    claim: 「视频是无参的……时间维应当落在 sd2_tpool 的无参时间池化上」（只有推测，没读实现）
    finding: >-
      读了参考实现之后这件事可以钉死，而且比原来的说法多三件有 infra 含义的事：
      (1) 时间位置编码是 register_buffer('time_weight', get_1d_sincos_pos_embed(dim,
      num_frames), persistent=False) —— 固定 sin-cos、**不进 checkpoint**，
      这正是清单里看不到时间维权重的原因（所以「没有时间维权重」不等于「没有时间位置编码」，
      skill 第 7 条：空结果和真的没有在代码里长得一样）；
      (2) init_pos_emb_time 4 是硬上限，forward 里 assert t <= self.num_frames；
      (3) tpool_patch_merger 对时间轴做 mean(dim=0)，t 帧被平均成一张 ——
      **进语言主干的视觉 token 数与帧数无关**；而编码器侧相反，
      cu_seqlens 按 t×h×w 一段切（video_attn_type 只允许 spatial_temporal，参考实现直接 assert），
      注意力成本随 t 平方增长。prefill 两段的增长率完全不同
    resolution: corrected
    changed_to: >-
      fusion 字段写出三条机制与两段成本的不同增长率，open_questions 改成「机制已核实，
      但那是参考实现的选择，engine 侧与 4 帧上限如何切 chunk 未核」
  - id: R3
    field: bottlenecks
    severity: wrong
    claim: 「权重存储 553.84 GiB（含视觉塔的 0.88 GiB）」
    finding: >-
      553.84 是手算时把视觉塔那一项的小数位丢了：derive 给的是 **554.27 GiB**，
      与 kimi-k2-thinking 的 553.40 GiB 相差 0.87 GiB = 471,143,920 × 2 B，
      正是视觉塔与 projector 的 BF16 字节。小数位错不改变结论，但它是会被引用的数
    resolution: corrected
    changed_to: 改成 554.27 GiB
  - id: R4
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: 「语言侧零结构改动（只差 61 个 inv_freq）；vision_tower 与 kimi-vl-a3b 逐张量相同」
    finding: >-
      三组比对自己重算过，全部闭合：
      (1) 剥掉 language_model. 前缀后与 kimi-k2-thinking 比，208,215 : 208,276，
      只少 61 个 rotary_emb.inv_freq，交集里形状与 dtype 零差异；
      (2) vision_tower.* 与 kimi-vl-a3b 名字集合相同、形状与 dtype 零差异，各 416,866,032 参数；
      (3) 与 kimi-k2.6 / kimi-k2.7-code 的名字清单三者各 208,550 条、两两差集为空，
      HF tally 三者逐位相同（1,026,879,376,368），config 在所有规格字段上相同
      （K2.7 只把 ignore 列表的两条正则从 re:vision_tower.* 写成 re:.*vision_tower.*）。
      所以那两版按本仓惯例不单独立记录、K3 的 predecessor 直接接到本版，判据是充分的
    resolution: confirmed
    changed_to: 原值成立，不改

  - id: R5
    field: lineage.changed_from_predecessor
    severity: wrong
    claim: 「ignore 列表扩了两项：新增 re:.*vision_tower.* 与 re:.*mm_projector.*」
    finding: >-
      写成了 K2.7-Code 的那种写法。本版 config 的 ignore 列表里这两条**没有前导 .***：
      `["re:.*self_attn.*", "re:.*shared_experts.*", "re:.*mlp\\.(gate|up|gate_up|down)_proj.*",
      "re:.*lm_head.*", "re:vision_tower.*", "re:mm_projector.*"]`。
      而本记录自己的 infra_signal 正确地写着「K2.7 只把 re:vision_tower.* 写成
      re:.*vision_tower.*」—— 同一份记录里两处自相矛盾
    resolution: corrected
    changed_to: lineage 里改成本版的原文并点明 K2.7 才加前导 .*
  - id: R6
    field: infra_signals
    severity: missing
    claim: 「K2.6 / K2.7-Code 与本版……config 在所有规格字段上相同（K2.7 只把两条正则…）」
    finding: >-
      括号里的「只」把差异集合说成了封闭的，而逐键比对还有一处：
      **eos_token_id（与 text_config.eos_token_id）163585 → 163586**，2.6 与 2.7 都改了。
      它不是结构规格（结构侧确实零差异，这一半成立），但停止符是部署要跟的硬项，
      漏掉它会让「完全一致」这个结论被一个反例推翻
    resolution: corrected
    changed_to: 改成「结构规格字段零差异」，并把 eos_token_id 与正则这两处差异都列出来
  - id: R7
    field: bottlenecks
    severity: imprecise
    claim: 「decode 侧与 kimi-k2-thinking 逐项相同」
    finding: >-
      差一项：attention 的权重字节 12,336,889,856（本版）vs 12,336,905,472（K2-Thinking），
      差 15,616 B = 61 × 128 × 2 —— 正是本记录自己在别处强调的那 61 个 inv_freq buffer。
      合计 32,986,516,736 vs 32,986,532,352，舍入到 32.987 GB/token 才相同。
      「逐项相同」这个说法比实际强
    resolution: corrected
    changed_to: 改成「几乎逐项相同，唯一的差是 attention 少 15,616 B，舍入后相同」

  - id: R8
    field: arch.vision.tokens.llm_tokens
    severity: missing
    claim: >-
      视频路径的机制已按参考实现核实（固定 sin-cos 时间位置编码、
      tpool 的 mean、cu_seqlens 按 t×h×w 切），结论「进语言主干的视觉 token 数
      与帧数无关」也写在 fusion 里 —— 但**没有一个具体的 token 数**，
      所以 prefill 的计算量和主干的位置预算仍然答不出来
    finding: >-
      补 arch.vision 下 tokens / prefill / separability 三组，逐因子核过。
      本档把前一轮读出来的机制落成了可复算的数：
      672² 单图 2304 → 576（压缩比 4）；4 帧视频主干**仍是 576**，
      而 encoder 要跑 9216 个 token 且在同一个变长注意力段内。
      一张图相当于 608 个文本 token，即 prefill 成本 94.7% 来自位置预算、
      只有 5.3% 来自视觉塔。
      **本档的 attention_excluded 和其它记录不同**：这里跨度是钉住的
      （参考实现读过，整图一段 n = 2304，约 660 GFLOPs），
      排除它的理由因此不是「钉不住」而是**口径**——
      主干那侧的分母也是线性项、不含注意力，只在分子加注意力两侧就不是
      一套口径了。这一点单独写进了 attention_excluded，免得读者以为
      和别的记录是同一个原因。
      分片上本档是本仓三份 dedicated 之一：64 个分片的**最后两个是纯视觉分片**
      （第 63 片 6 个 projector、第 64 片 329 个塔，非视觉张量都是 0），
      只读这两个文件就能单独加载整座塔。上一代 kimi-vl-a3b 是 mixed
      （335 个视觉张量塞在第 1 片、同片还有 583 个主干张量）——
      **发布习惯的代际变化**，直接决定分离加载的工程成本。
      顺带：因为两侧连分片都不重合，本档还能额外排除「同片内共享缓冲区」
      这类加载期耦合，这是别的 mixed 记录排除不掉的
    resolution: corrected
    changed_to: >-
      新增 arch.vision.tokens（单图 2304 → 576；scope_note 写明视频主干
      token 数与帧数无关、而 encoder 侧是 2304 × t 且注意力随 t 平方增长、
      帧数上限 4）、arch.vision.prefill（encoder 线性 1897.3 GFLOPs、
      一张图 ≈ 608 个文本 token，并与同塔的 kimi-vl-a3b 对照）、
      arch.vision.separability（dedicated，最后两片纯视觉，
      并记上一代是 mixed）；evidence 加八条，四格判断类进 Gate C

notes: >-
  旗舰线与视觉线在这一代合流：语言主干 = kimi-k2-thinking（剥前缀后只差 61 个
  inv_freq buffer），视觉前端 = kimi-vl-a3b 的 MoonViT 原样复用 + 换出口维的 projector。
  model_type 改成 kimi_k25，但 text_config 的 model_type 仍是 kimi_k2。
  它也是 kimi-k3 的 predecessor：K2.6 与 K2.7-Code 相对本版**一个规格字段都没动**
  （张量名集合与 tally 逐位相同），按本仓惯例不单独立记录，所以 K3 的前代直接接到这里。
  released 取 HF 仓的 createdAt 2026-01-01。

open_questions:
  - >-
    KV cache 的实际存储精度未披露（kv_cache_scheme 为 null），按模型 dtype（BF16）兜底，
    bytes_basis 是 dtype_fallback
  - >-
    视频路径的机制已按参考实现核实（见 arch.vision.fusion：固定 sin-cos 时间位置编码
    + 时间轴 mean 池化 + 最多 4 帧），**但那是参考实现的选择**，engine 侧是否照这个做、
    4 帧上限是不是硬限制（更长视频如何切 chunk），没有一手说明。
    另：video_attn_type 只有 spatial_temporal 一个合法值（参考实现直接 assert），
    所以「还能不能按逐帧空间注意力跑以换掉 O(t²)」在这一版没有开关
  - >-
    预训练数值格式无一手声明（模型卡只说在 Kimi-K2-Base 上继续预训练 15T 混合 token），
    precision.training 不填
