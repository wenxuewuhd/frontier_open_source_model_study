  - text: >-
      量化覆盖面在多模态这一代必须单独说清：ignore 列表把 vision_tower 与 mm_projector
      明确排除，它们是 BF16。按「模型是 INT4」统一规划显存会把视觉塔算小 4 倍，
      而视觉塔是常驻的
    evidence: derived
    horizon: now
    axis: precision
  - text: >-
      K2.6（2026-04-14）与 K2.7-Code（2026-06-11）与本版**结构完全一致**：
      张量名集合三者逐个相同（各 208550），HF 的 safetensors tally 逐位相同，
      **结构规格字段零差异**。config 的全部差异只有两处、都不是结构：
      eos_token_id（与 text_config.eos_token_id）163585 → 163586（2.6 与 2.7 都改了，
      是停止符、部署要跟上），以及 K2.7 把 ignore 列表里那两条正则从
      re:vision_tower.* 写成 re:.*vision_tower.*。
      能力变化全部来自后训练与权重刷新 —— 跟踪这一族时先比张量名集合，
      相同就不必重走算子评估
    evidence: derived
    horizon: settled
    axis: scale

