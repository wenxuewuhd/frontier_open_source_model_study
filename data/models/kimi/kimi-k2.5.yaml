# 手写记录。与 kimi-k2-thinking 的同一性、与 kimi-vl-a3b 的视觉塔同一性都来自
# 完整清单的逐条比对；量化形态与参数分项来自 facts/kimi-k2.5/shapes.json
# （208550 个张量，64/64 分片无读失败）。
# 注意：params 是**还原 INT4 打包后**的参数量。derive.py 曾因不认 I32 容器少算 8 倍，
# 已修（_CONTAINERS 纳入 INT32），现在两路逐位相同 —— 见 review R1。
id: kimi-k2.5
family: kimi
kind: vlm
display_name: Kimi-K2.5
released: '2026-01-01'
license: other
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/moonshotai/Kimi-K2.5
    locator: config.json / README.md @ 4d01dfe0332d
    accessed: '2026-10-30'
    note: >-
      compressed-tensors（pack-quantized INT4）发布，64 分片、208550 个张量，逐分片读头取全，
      无读失败分片。模型卡自述「continual pretraining on approximately 15 trillion mixed
      visual and text tokens atop Kimi-K2-Base」，规格表给 1T / 32B / 256K，
      并单列「Vision Encoder MoonViT / Parameters of Vision Encoder 400M」
  - kind: repo
