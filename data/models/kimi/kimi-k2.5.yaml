hf:
  repo: moonshotai/Kimi-K2.5
  sha: 4d01dfe0332d63057c186e0b262165819efb6611
  last_modified: '2026-04-30T03:56:40.000Z'
  pipeline_tag: image-text-to-text
  gated: false

lineage:
  track: historical
  predecessor: kimi-k2-thinking
  successor: kimi-k3
  changed_from_predecessor:
    - axis: modality
      text: >-
        旗舰线第一次原生多模态：语言主干外挂 MoonViT 视觉塔（27 层、hidden 1152、
        416.87M）与一个 2×2 patch merge 的 patchmerger（pre_norm LayerNorm [1152] →
        proj.0 [4608, 4608] → GELU → proj.2 [7168, 4608]，54.28M），合计 471.14M。
        视觉塔与 2025 年 4 月的 kimi-vl-a3b **逐张量相同**（名字集合相同、形状与 dtype
        零差异，各 416,866,032 参数），只有 projector 的出口维从 2048 改到 7168
      benefit: >-
        语言侧零结构改动：剥掉 language_model. 前缀后，与 kimi-k2-thinking 的清单
        逐条比对只差 61 个 rotary_emb.inv_freq 遗留 buffer（本代不再保存），
        其余 208,215 个张量名与形状逐个相同。
        视觉前端是现成的 —— 已经为 Kimi-VL 做过的视觉算子适配可以原样复用，
        新增的只有 projector 那两个 GEMM 的出口维。
        代价在 prefill：原生分辨率 + 变长打包，图像 token 数不可预先定容
    - axis: precision
      text: >-
        量化方案与 kimi-k2-thinking 一致（pack-quantized INT4、group 32、只量化路由专家），
        但 ignore 列表扩了两项：新增 **re:vision_tower.*** 与 **re:mm_projector.***
        （本代这两条没有前导 .*，K2.7-Code 才改成 re:.*vision_tower.* 那种写法），
        lm_head 的写法也从字面量改成正则 re:.*lm_head.*
      benefit: >-
        视觉塔与 projector 明确留在 BF16 —— 清单穷举也证实了这一点（它们没有
        weight_packed）。所以「4 bit 模型」在这一代覆盖的仍只有路由专家那 98.8%，
        而视觉前端是全精度的：按 INT4 规划视觉塔的显存会算小 4 倍
    - axis: context
      text: >-
        上下文仍是 262144，但 YaRN 的 beta_fast 从 1.0 调到 32.0
        （beta_slow、factor 64.0、original 4096、mscale 1.0 都不变）
      benefit: >-
        这一个标量把 YaRN 的插值斜坡从退化状态改了回来：按参考实现的
        yarn_find_correction_range，dim = qk_rope_head_dim 64、base = rope_theta 50000、
        原生长度 4096 时，前两代的 beta_fast = beta_slow = 1 给出 low 19 / high 20
        （32 个频率维上只有 1 维宽，等于在第 20 维硬切），本代的 32 / 1 给出 low 8 / high 20
        （12 维宽的线性斜坡，与 DeepSeek 一代同一取值）。
        容量与算子都不受影响，但外推行为与前两代不同 —— 长文本评测不能跨这三代直接比

params:
  total: 1026879376368.0
  breakdown:
    expert: 1014686023680.0
    attention: 6168444928.0
    shared_expert: 2642411520.0
    embed: 1174405120.0
    lm_head: 1174405120.0
    vision: 471143920.0
    dense_ffn: 396361728.0
    router: 165173760.0
    norm: 1006592.0
  counting_note: >-
    **total 与 breakdown 是本仓按完整清单（208550 条）逐项求和、并把 INT4 打包还原（×8）
    之后的值。** 这个数曾经只能手算：lib/dtypes.py 的打包还原原先只认 INT8 / UINT8 容器、
    不认 INT32，于是专家一项按容器数记成 126,835,891,200，参数总量少算 8 倍，
    Gate B 的「参数总量」与「外部参数量对账」两项都报 MISMATCH，
    按子系统分项与**激活参数**也跟着偏小（derived 当时报 13.2B，真值
    31,687,095,808 = 激活专家 21,139,292,160 + 常驻 10,547,803,648）。
    那是工具缺口不是数据分歧，**现已修复**（留痕见 review R1），derive.py 现在直接
    算出这些数、两项都报 delta_pct=0.0。字节口径自始不受影响。
    还原后 1,026,879,376,368 与 HF 的 safetensors tally 逐位相同；
    tally 的 I32 一项（1,014,686,023,680）同样是还原后的专家数，
    BF16 一项（12,193,329,648）等于本仓非专家各项之和加视觉。
    三条独立的量纲闭合：(1) weight_packed [2048, 896] × 8 = 7168 = hidden；
    (2) weight_scale [2048, 224] × group 32 = 7168；
    (3) 与 kimi-k2-thinking 的差额恰好 = 视觉 471,143,920 − 61 个 inv_freq buffer 7,808
    = +471,136,112，而 1,026,408,240,256 + 471,136,112 = 1,026,879,376,368。
    vision 一项 = vision_tower 416,866,032 + mm_projector 54,277,888，
    前者对得上模型卡的「Vision Encoder 400M」。
    厂商声明「1T / 32B」是取整标签：还原后总量 1.027T（+2.7%），
    激活（带宽口径，含 lm_head、不含输入词表与视觉塔）31.69B

context:
  max: 262144
  train_native: 4096
  extension_method: >-
    YaRN（type yarn、factor 64.0、original_max_position_embeddings 4096、
    mscale 与 mscale_all_dim 1.0、beta_slow 1.0），**beta_fast 从前两代的 1.0 改成 32.0** ——
    这一代唯一动过的位置编码参数，效果是插值斜坡从 1 维宽（硬切）变成 12 维宽
    （low 8 / high 20，算式见 lineage）

arch:
  layers: 61
  hidden: 7168
  vocab: 163840
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: SwiGLU（text_config hidden_act silu）
  position: 文本侧 RoPE theta 50000 + YaRN；视觉侧 2D RoPE 叠学习式绝对位置（[64, 64, 1152] 插值）

  attention:
    type: MLA
    num_heads: 64
    num_kv_heads: 64
    head_dim: 192
    v_head_dim: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim_note: >-
      与 kimi-k2-thinking 逐张量相同，唯一差别是本代不再保存 rotary_emb.inv_freq：
      缓存是 kv_a_proj_with_mqa [576, 7168] 的 576 维/层（按 2 × 64 × 192 = 24576
      折算高估 42.7 倍），o_proj [7168, 8192] 按 v_head_dim 128 展开（按 head_dim 192
      推会高 50%），Q 侧两段 q_a_proj [1536, 7168] / q_b_proj [12288, 1536]。
      注意力整体是 BF16，没有被 INT4 覆盖
    layer_pattern: 61/61 层都是 MLA；视觉塔内部另有 27 层 MHA（head_dim 72），两套权重不共享

  ffn:
    type: moe
    layer_pattern: L0 稠密（mlp.gate_proj [18432, 7168]，BF16 未量化），L1–L60 共 60 层 MoE

  moe:
    routed_experts: 384
    shared_experts: 1
    top_k: 8
    intermediate: 2048
    dense_intermediate: 18432
    first_k_dense: 1
    expert_groups: 1
    routing: sigmoid 打分、noaux_tc 选路，routed_scaling_factor 2.827，n_group / topk_group 均为 1（分组未启用）
    balance: e_score_correction_bias（每 MoE 层一个 [384] FP32）
    storage_note: >-
      与 kimi-k2-thinking 相同：逐专家独立张量，每个投影三个张量
      （weight_packed I32 容器 / weight_scale BF16 / weight_shape I32 [2] 元数据）

  decoding:
    mtp_layers: 0
    mtp_layers_note: text_config num_nextn_predict_layers 0，清单里没有草稿块

  vision:
    encoder: MoonViT（vision_tower.encoder.blocks，与 kimi-vl-a3b 逐张量相同，实测 416.87M）
    layers: 27
    hidden: 1152
    num_heads: 16
    patch_size: 14
    intermediate: 4304
    spatial_merge_size: 2
    out_hidden: 7168
    params: 471143920.0
    fusion: >-
      mm_projector（mm_projector_type patchmerger，merge_type sd2_tpool）：
      pre_norm 是 LayerNorm [1152]（带 bias，eps 1e-5）→ proj.0 [4608, 4608]
      （4608 = 4 × 1152，2×2 patch merge）→ GELU → proj.2 [7168, 4608]，两层都带 bias。
      与 kimi-vl-a3b 的 multi_modal_projector 同构，只是出口 2048 → 7168、张量改名。
      **视频路径不带任何参数**，三条都读过参考实现：
      (1) 位置编码的空间部分是学习式的 weight [64, 64, 1152]（插值到实际网格），
      时间部分是 `register_buffer('time_weight', get_1d_sincos_pos_embed(dim, num_frames),
      persistent=False)` —— 固定 sin-cos、**不进 checkpoint**，这正是清单里看不到时间维权重的原因
      （vision_tower 与纯图像的 kimi-vl-a3b 逐张量相同）；
      (2) `init_pos_emb_time 4` 是**帧数上限**：forward 里 `assert t <= self.num_frames`，
      所以一个媒体单元最多 4 帧（对应 config 的 use_unified_vision_chunk）；
      (3) merge_type sd2_tpool 的 `tpool_patch_merger` 在 2×2 空间合并之后对时间轴做
      `.mean(dim=0)` —— **t 帧被平均成一张**，所以进语言主干的视觉 token 数与帧数无关，
      只与 h×w 有关。
      而编码器侧相反：`video_attn_type: spatial_temporal`（参考实现 assert 只允许这个值）
      的效果是 cu_seqlens 按 **t×h×w 一段**切，即一个媒体单元的全部帧在同一个变长注意力
      段内互相可见，注意力成本随 t 平方增长（2D RoPE 则是逐帧重复的
      Rope2DPosEmbRepeated，时间轴只由那条固定 sin-cos 承担）。
      所以 prefill 的两段成本随帧数的增长率完全不同（编码器 O(t²) 注意力 + O(t) MLP，
      语言侧 O(1) token），不能用一个 token 数推全程

    tokens:
      reference_resolution: 672x672
      patch_grid: 48x48
      encoder_tokens: 2304
      llm_tokens: 576
      compression_ratio: 4
      compression_stage: >-
        projector 入口一步到位：2×2 相邻 patch 在通道维拼接
        （proj.0 的输入维 4608 = 4 × 1152 就是这个拼接，config 的
        merge_kernel_size [2, 2] 是同一件事），**压缩在两层 MLP 之前**，
        所以 projector 的两个 GEMM 只跑 576 次而不是 2304 次。
        **视频另有第二级压缩**：merge_type sd2_tpool 在 2×2 空间合并之后
        对时间轴取 mean，t 帧被平均成一张 —— 这一级的压缩比是 t 本身，
        它作用在 token 数上而不是宽度上
      dynamic_resolution: true
      derivation: >-
        静态图两个因子：
        (1) patch 14 —— config.vision_config.patch_size，并由
        vision_tower.patch_embed.proj.weight [1152, 3, 14, 14] 的后两维印证。
        这是 Conv2d、没有时间维，时间轴由那条固定 sin-cos 的 time_weight
        承担（不进 checkpoint，见 fusion）；
        (2) 2×2 空间合并 —— config 的 merge_kernel_size [2, 2]，
        并由 mm_projector.proj.0.weight 的输入维 4608 = 1152 × 4 印证。
        672 / 14 = 48，48² = 2304 个 encoder token；
        48 / 2 = 24，24² = 576 个主干 token。
        672×672 是本仓为跨模型比较选的参考分辨率，不是厂商默认值
      scope_note: >-
        上面的数覆盖单张静态图。**视频的主干 token 数与帧数无关** ——
        tpool 对时间轴取 mean，t 帧合成一张，所以仍是 576（见 fusion，
        这一条来自本仓读过的参考实现）。
        但 encoder 侧随帧数增长：t 帧是 2304 × t 个 encoder token，
        且它们在**同一个变长注意力段内**（cu_seqlens 按 t×h×w 切），
        注意力成本随 t 平方增长。帧数上限 4（init_pos_emb_time，
        forward 里 assert t <= num_frames）。
        所以一个 4 帧媒体单元：主干仍只收 576 个 token，
        encoder 要跑 9216 个 —— **不能用主干那个 token 数推 encoder 负载**
    prefill:
      encoder_linear_gflops: 1897.3
      projector_linear_gflops: 62.51
      backbone_token_budget: 576
      backbone_linear_gflops_per_token: 61.03
      image_as_text_tokens: 608
      attention_excluded: >-
        被排除的是 encoder 自注意力的 QK^T 与 AV，形式
        4 × n² × hidden × layers。本档的跨度**有一手来源**：
        参考实现 modeling_kimi_k25.py 的 MoonViT3dEncoder 按 t×h×w 切
        cu_seqlens、且 video_attn_type 只允许 spatial_temporal
        （记录里原有的结论，本仓读过），即一张静态图是整图一段、
        n = 2304。按这个跨度算约 2304² × 4 × 1152 × 27 = 660 GFLOPs，
        是线性项 1897.3 的 35%。
        **它没有被加进上面几格**，理由不是钉不住跨度（这里钉住了），
        而是口径：主干那侧的分母也是线性项、不含注意力，
        把 encoder 的注意力算进分子而分母不算，两侧就不是一套口径了。
        要连注意力一起比，两侧都得重算，那是独立一轮的事
      derivation: >-
        encoder 线性项 = 2 × 2304 × (patch_embed 677,376 + 27 层 ×
        每层 15,224,832 = 411,070,464) = 2 × 2304 × 411,747,840
        = 1,897,335,951,360。每层 15,224,832 = wqkv 3 × 1152² + wo 1152²
        + fc0 4304 × 1152 + fc1 1152 × 4304，与清单里 108 个 blocks
        线性张量的求和逐位相同。
        projector 线性项 = 2 × 576 × (4608² + 7168 × 4608) = 62,511,906,816。
        主干分母 = 2 × (active_params.total 31,687,095,808 −
        active_params.lm_head 1,174,405,120) = 61,025,381,376 ——
        **不能用 derived 里的 flops.linear_per_token 63,374,191,616**，
        那一项含 lm_head（decode 口径，每步对全词表做 GEMM），
        prefill 只在最后一个位置算 logits。
        换算 = 576 + 1,959,847,858,176 / 61,025,381,376 = 576 + 32.1 = 608。
        即一张图的 prefill 成本 94.7% 来自它占的 576 个位置、
        只有 5.3% 来自视觉塔。
        **和同塔的 kimi-vl-a3b 对照**：那边 vision_tower 与本档逐张量相同，
        但主干只有 4.49 GFLOPs/token，于是塔值 431 个位置当量、占比 43%。
        同一座塔占比差 7.7 倍，差的全是主干
    separability:
      weight_prefix: >-
        vision_tower.（329 个张量）与 mm_projector.（6 个），共 335 个；
        主干在 language_model.。两个前缀不相交
      shard_isolation: dedicated
      shard_note: >-
        实测 index 的 weight_map：64 个分片里**最后两个是纯视觉分片**——
        model-00063-of-000064 装 6 个 mm_projector. 张量、
        model-00064-of-000064 装 329 个 vision_tower. 张量，
        两片的非视觉张量都是 **0 个**，且 335 个视觉张量全在这两片里。
        即只读这两个文件就能单独加载整座塔加 projector，不必按前缀筛。
        **这是发布习惯的代际变化**：上一代 kimi-vl-a3b 把 335 个视觉张量
        塞在第 1 个分片里、同片还有 583 个主干张量（mixed）。
        本仓 12 份 vlm 里只有 kimi-k2.5 / kimi-k3 / step-5-preview 三份
        做到了 dedicated
      cross_prefix_sharing: >-
        weight_map 的 208,550 个名字里没有任何一个同时匹配 vision_tower. /
        mm_projector. 与 language_model.，即没有重名共享；
        而且两侧连分片都不重合，所以也排除了「同片内共享缓冲区」这类
        加载期耦合。落盘层面的 tied weights 仍要看 safetensors 头的
        数据偏移是否重合，weight_map 答不了，本轮没读偏移

precision:
  weights_release: [INT4, BF16, FP32]
  weights_release_scope:
    INT4:
      measured: true
      container: INT32
      note: 逻辑精度 INT4 落盘时装在 INT32 容器里，清单里看到的是容器 dtype，不是声明错
    BF16: { measured: true }
    FP32: { measured: true }
  quantization:
    method: compressed-tensors（pack-quantized，weight-only）
    expert_dtype: INT4
    packing_note: >-
      与 kimi-k2-thinking 同一套：8 个 INT4 装一个 I32 容器（weight_packed 末维是逻辑维的 1/8），
      scale 是 BF16 的独立张量（每 32 个元素一个），另有 I32 [2] 的 weight_shape 元数据。
      参数量按 ×8 还原，字节不还原
    per_subsystem:
      expert: INT4
      shared_expert: BF16
      attention: BF16
      dense_ffn: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      vision: BF16
    per_subsystem_scale:
      expert: BF16
    per_subsystem_block:
      expert: '[1,32]'
    block_size_note: >-
      实测与 kimi-k2-thinking 逐张量相同：gate_proj / up_proj 的 weight_scale [2048, 224]
      对逻辑 [2048, 7168]，down_proj 的 [7168, 64] 对逻辑 [7168, 2048]，
      都是逐输出行、沿 K 每 32 个一个 scale（按 [out, in] 轴序即 [1, 32]）
    subsystem_method: >-
      对完整清单 208,550 条穷举（不是抽样）：专家的 weight_packed / weight_shape 全 I32、
      weight_scale 全 BF16 无例外；视觉塔、projector、注意力、共享专家、稠密 FFN、
      embed / lm_head / norm 全 BF16；F32 只有 60 个 e_score_correction_bias（23,040 个元素）。
      量化覆盖面的一手依据是 config 的 ignore 列表（本代新增 vision_tower 与 mm_projector），
      清单上也只有 experts.* 带 weight_packed
  qat: true

bottlenecks:
  - dimension: weight-bandwidth
    finding: >-
      与 kimi-k2-thinking 同一形态：权重存储 554.27 GiB（含视觉塔的 0.88 GiB），
      但每 token 搬运的字节里非专家那一半比专家大 —— 视觉塔不在每 token 主路径上，
      所以它改变的是 prefill 与常驻显存，不是 decode 带宽
    quantified: >-
      decode 侧与 kimi-k2-thinking 几乎逐项相同（专家 570.761 GB × 8/384 = 11.891 GB/token，
      非专家 21.096 GB/token，合计 32.987 GB/token）——
      唯一的差是 attention 一项少 15,616 B（61 个 inv_freq × 128 × 2 B），舍入后相同；视觉塔 471.14M 参数 BF16
      约 0.94 GB，只在有图像/视频输入的 prefill 里搬运一次，不随 token 数增长
    visibility: public
  - dimension: kv-capacity
    finding: >-
      KV 侧与前两代逐张量相同：61 层 MLA、每层 576 个元素，INT4 没有碰 KV
      （kv_cache_scheme 为 null）。视觉 token 与文本 token 共用同一套 KV，
      所以图像输入直接按它展开成的 token 数计费
    quantified: >-
      35,136 元素/token（576 × 61），BF16 兜底 70,272 B/token，满 256K 17.16 GiB/序列。
      与 kimi-k2-thinking / kimi-k2-0905 同口径（dtype_fallback），三代零变化
    visibility: public

infra_signals:
  - text: >-
      视觉前端在这一代被整段复用：MoonViT 与 2025 年 4 月的 kimi-vl-a3b 逐张量相同，
      变的只有 projector 的出口维。所以「旗舰变成多模态」这件事在算子侧的增量
      只有两个 GEMM 的形状，视觉塔的变长打包注意力、2D RoPE 与插值位置编码
      都是已经适配过的东西 —— 真正的换代在 K3（MoonViT-V2：hidden 1024、12 头、
      RMSNorm、无 bias、qkv_hidden_size 1536 与 hidden 解耦）
    evidence: derived
    horizon: now
