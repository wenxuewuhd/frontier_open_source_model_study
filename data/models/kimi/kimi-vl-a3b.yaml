  repo: moonshotai/Kimi-VL-A3B-Instruct
  sha: 398eede0903cd983a2bfa0cc634e9ac1d843f375
  last_modified: '2026-01-30T04:51:04.000Z'
  pipeline_tag: image-text-to-text
  gated: false

lineage:
  track: side
  predecessor: kimi-moonlight-16b
  changed_from_predecessor:
    - axis: modality
      text: >-
        同一个文本主干外挂 MoonViT 视觉塔（27 层、hidden 1152、patch 14、
        wqkv [3456, 1152] 融合投影、416.87M 参数）与一个 2×2 patch merge 的 MLP projector
        （LayerNorm [1152] → linear_1 [4608, 4608] → GELU → linear_2 [2048, 4608]，30.68M），
        合计 447.55M
      benefit: >-
        文本侧**零改动**：剥掉 language_model. 前缀后，5344 个张量与 Moonlight 名字集合
        逐个相同、形状与 dtype 零差异 —— 已支持 Moonlight 的推理栈只需加视觉前端。
        视觉塔是原生分辨率的：按 cu_seqlens 做变长打包注意力（参考实现走
        flash_attn_varlen_func），位置编码是 [64, 64, 1152] 的学习式绝对位置做 **bicubic**
        插值再叠 2D RoPE（bicubic 是参考实现 Learnable2DInterpPosEmb 的默认值，
        config 里没有这个键；到 K3 才在 config 里出现 pos_emb_interpolation_mode: bilinear），
        所以没有固定输入尺寸、也不靠 padding 对齐。
        代价是 prefill 侧多一条变长 kernel 路径，且图像 token 数随分辨率变化、
        不可预先定容
    - axis: context
      text: >-
        8192 → 131072，靠 rope_theta 50000 → 800000 原生支持，
        **没有 rope_scaling**（config 里该键为 null）
      benefit: >-
        与 K2 线靠 YaRN 外推 32 倍不是同一种工程形态：这一版没有部署期的外推旋钮，
        128K 是训出来的。代价是满上下文的 MLA 缓存 3.80 GiB/序列
        （15,552 元素/token × 2 B × 131072，BF16 兜底），而前代 8K 只有 243 MiB

params:
  total: 16407657776.0
  breakdown:
    expert: 14394851328.0
    shared_expert: 449839104.0
    vision: 447545840.0
    attention: 371590848.0
    embed: 335544320.0
    lm_head: 335544320.0
    dense_ffn: 69206016.0
    router: 3409536.0
    norm: 126464.0
  counting_note: >-
    total 与 breakdown 都是本仓按完整清单（5679 个张量）逐项求和的实测值；外部核对是 HF 的
    safetensors tally，与实测 16,407,657,776 逐位相同。全清单 BF16，无 scale 容器、无打包。
    vision 一项 447,545,840 = vision_tower 416,866,032 + multi_modal_projector 30,679,808，
    数值上对得上模型卡的「VT 0.4B」，但口径不同：卡那个 0.4B 出现在
    「# Act. Params (LLM+VT) 2.8B+0.4B」里，是**激活**口径，而本仓这一项是**总量**，
    并且 derive.py 把视觉塔**排除在激活之外**；两者数值相同是因为有图像输入时整座塔都激活，
    不是因为口径相同。
    复算 attention 分项时注意 kv_a_layernorm [512] 按本仓归类在 norm 而不在 attention
    （自己按名字算进去会多 27 × 512 = 13,824 个元素），每层还有一个
    rotary_emb.inv_freq [64] 遗留 buffer（27 层共 1,728 个元素、不被加载，
    见 kimi-moonlight-16b 的 counting_note）。
    文本侧与 kimi-moonlight-16b 的分项逐位相同
    （expert / shared_expert / attention / embed / lm_head / dense_ffn / router / norm 八项），
    差额恰是视觉这一项。
    厂商的「16B」是取整标签（实测 16.41B，+2.5%）。**激活参数对不上**：
    实测带宽口径 2.58B（含 lm_head、不含输入词表）、含输入词表 2.91B，
    而模型卡写 LLM 侧 2.8B —— 两个口径都复现不出这个值，见 open_questions。
    视觉塔不计入激活（不在每 token 的主路径上，按 derive.py 的口径排除）

context:
  max: 131072
  extension_method: >-
    无部署期外推。config 的 rope_scaling 为 null，靠 rope_theta 800000（前代 50000）
    与长上下文训练拿到 128K

arch:
  layers: 27
  hidden: 2048
  vocab: 163840
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: SwiGLU（text_config hidden_act silu）
  position: >-
    文本侧 RoPE theta 800000，无 scaling；视觉侧 2D RoPE 叠学习式绝对位置
    （[64, 64, 1152] 插值到实际 patch 网格）

  attention:
    type: MLA
    num_heads: 16
    num_kv_heads: 16
    head_dim: 192
    v_head_dim: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    head_dim_note: >-
      与 kimi-moonlight-16b 逐张量相同：缓存是 kv_a_proj_with_mqa [576, 2048] 的 576 维/层
      （按 2 × 16 × 192 = 6144 折算高估 10.7 倍），o_proj [2048, 2048] 按 v_head_dim 128
      展开（按 head_dim 192 推会高 50%），q 侧单段 q_proj [3072, 2048]、无 q_lora_rank
    layer_pattern: 27/27 层都是 MLA；视觉塔内部是 27 层标准 MHA（head_dim 72），两套注意力互不共享权重

  ffn:
    type: moe
    layer_pattern: L0 稠密（mlp.gate_proj [11264, 2048]），L1–L26 共 26 层 MoE

  moe:
    routed_experts: 64
    shared_experts: 2
    top_k: 6
    intermediate: 1408
    dense_intermediate: 11264
    first_k_dense: 1
    expert_groups: 1
    routing: sigmoid 打分、noaux_tc 选路，routed_scaling_factor 2.446，n_group / topk_group 均为 1（分组未启用）
    balance: e_score_correction_bias（每 MoE 层一个 [64] BF16，与前代一致）
    storage_note: 逐专家独立张量；两个共享专家合并成一个 MLP（shared_experts.gate_proj [2816, 2048] = 2 × 1408）

  decoding:
    mtp_layers: 0
    mtp_layers_note: text_config 没有 num_nextn_predict_layers，清单里也没有草稿块

  vision:
    encoder: >-
      MoonViT（vision_tower.encoder.blocks，实测 416,866,032 参数 / 329 个张量）。
      HF 上另有独立仓 moonshotai/MoonViT-SO-400M，本轮没取它的清单、没做张量比对，
      所以不写「就是那一个」
    layers: 27
    hidden: 1152
    num_heads: 16
    patch_size: 14
    intermediate: 4304
    spatial_merge_size: 2
    out_hidden: 2048
    params: 447545840.0
    fusion: >-
      2×2 patch merge 后两层 MLP：pre_norm 是 **LayerNorm**（[1152] 带 bias，eps 1e-5，
      不是主干用的 RMSNorm）→ linear_1 [4608, 4608]（4608 = 4 × 1152）→ GELU →
      linear_2 [2048, 4608]，两层都带 bias。
      视觉塔内部也带 bias（wqkv.bias [3456]、fc0.bias [4304]、norm0/norm1 带 bias），
      与无 bias 的语言主干不是一套算子配置

    tokens:
      reference_resolution: 672x672
      patch_grid: 48x48
      encoder_tokens: 2304
      llm_tokens: 576
      compression_ratio: 4
      compression_stage: >-
        projector 入口一步到位：2×2 相邻 patch 在通道维拼接
        （linear_1 的输入维 4608 = 4 × 1152 就是这个拼接），
        **压缩在两层 MLP 之前**，所以 projector 的两个 GEMM 只跑 576 次
        而不是 2304 次。config 的 merge_kernel_size [2, 2] 是同一件事
      dynamic_resolution: true
      derivation: >-
        两个因子：
        (1) patch 14 —— config.vision_config.patch_size，并由
        vision_tower.patch_embed.proj.weight [1152, 3, 14, 14] 的后两维印证。
        **这是 Conv2d、没有时间维**（对比 Qwen / MiniMax 的 Conv3d），
        所以静态图不需要补帧，一张图就是一层 patch 网格；
        (2) 2×2 空间合并 —— config 的 merge_kernel_size [2, 2]，
        并由 multi_modal_projector.linear_1.weight 的输入维 4608 = 1152 × 4 印证。
        于是 672 / 14 = 48，48² = 2304 个 encoder token；
        48 / 2 = 24，24² = 576 个主干 token。
        位置编码是学习式的 [64, 64, 1152]（config 的 init_pos_emb_height /
        _width 都是 64），48×48 的网格落在 64×64 内，按
        pos_emb_interpolation_mode 插值取用 —— 所以 64 不是分辨率上限，
        而是插值的基准网格。
        672×672 是本仓为跨模型比较选的参考分辨率（能被 14/16/28/32/42/48 整除），
        不是厂商默认值：本模型按原生分辨率走，没有 max_image_tokens
      scope_note: >-
        只覆盖单张静态图。本代**没有视频路径**（config 里没有
        video_attn_type、也没有 init_pos_emb_time，那两项是下一代
        kimi-k2.5 才有的），所以这里不涉及帧数折算
    prefill:
      encoder_linear_gflops: 1897.3
      projector_linear_gflops: 35.33
      backbone_token_budget: 576
      backbone_linear_gflops_per_token: 4.49
      image_as_text_tokens: 1007
      attention_excluded: >-
        被排除的是 encoder 自注意力的 QK^T 与 AV，形式
        4 × n² × hidden × layers。跨度没有一手来源：vision_config 里没有
        window_size 一类的键，本代的参考实现本轮没读
        （下一代 kimi-k2.5 的读过，那边是按 t×h×w 切 cu_seqlens 的整段注意力，
        但**不能把下一代的实现当本代的依据**）。
        按整图一段取 n = 2304 约 2304² × 4 × 1152 × 27 = 660 GFLOPs ——
        注意这一项在本档不可忽略，它是线性项 1897.3 的 35%，
        而本档的主干又特别小，所以它会把下面那个换算再推高一截。
        正因为影响不小又钉不住跨度，prefill 下面每一格都只装线性项
      derivation: >-
        encoder 线性项 = 2 × 2304 × (patch_embed 677,376 + 27 层 ×
        每层 15,224,832 = 411,070,464) = 2 × 2304 × 411,747,840
        = 1,897,335,951,360。每层 15,224,832 逐因子核过：
        wqkv 3 × 1152² + wo 1152² + fc0 4304 × 1152 + fc1 1152 × 4304，
        四项相加与清单里 108 个 blocks 线性张量的求和逐位相同。
        projector 线性项 = 2 × 576 × (4608² + 2048 × 4608) = 35,332,816,896。
        主干分母 = 2 × (active_params.total 2,579,233,600 −
        active_params.lm_head 335,544,320) = 4,487,378,560 ——
        **不能用 derived 里的 flops.linear_per_token 5,158,467,200**，
        那一项含 lm_head（decode 口径）。
        换算 = 576 + 1,932,668,768,256 / 4,487,378,560 = 576 + 431 = 1007。
        **这是本仓 12 份 vlm 里塔开销占比最高的 MoE 档**（1007 / 576 = 1.75）：
        视觉塔 4.5 亿参数，而 A3B 主干每 token 只有 4.5 GFLOPs 线性，
        于是塔自己就值 431 个 token 的位置当量 —— 一张图的 prefill 成本
        有 43% 花在视觉塔上，不是在主干。
        这正是 encoder 分离部署最划算的一档：塔和主干的负载比接近 1:1.3，
        放在同一张卡上会让两段互相排队。
        **对比同塔的 kimi-k2.5**（塔逐张量相同、主干 61.0 GFLOPs/token）：
        那边塔只值 32 个位置当量、占比 5.6% —— 同一座塔，占比差 7.7 倍，
        差的全是主干
    separability:
      weight_prefix: >-
        vision_tower.（329 个张量）与 multi_modal_projector.（6 个），
        共 335 个；主干在 language_model.。两个前缀不相交
      shard_isolation: mixed
      shard_note: >-
        实测 index 的 weight_map：335 个视觉张量全部落在**第 1 个分片**
        model-00001-of-00007，而同一个分片里还有 583 个非视觉张量
        （language_model.model.embed_tokens 与前若干层）。
        7 个分片里只有这一个含视觉张量，但它同时装着主干的头部 ——
        没有纯视觉分片。
        **下一代改了发布习惯**：kimi-k2.5 把 335 个视觉张量放进最后两个分片
        （第 63 片放 6 个 projector、第 64 片放 329 个塔），
        两片都是**零非视觉张量**，于是成了 dedicated。
        同一支族系从 mixed 变 dedicated，分离加载的工程成本差别很大
      cross_prefix_sharing: >-
        weight_map 的 5679 个名字里没有任何一个同时匹配 vision_tower. /
        multi_modal_projector. 与 language_model.，即没有重名共享。
        落盘层面的 tied weights 要看 safetensors 头的数据偏移是否重合，
        weight_map 答不了，本轮没读偏移

precision:
  weights_release: [BF16]
  weights_release_scope:
    BF16: { measured: true }
  quantization:
    per_subsystem:
      expert: BF16
      shared_expert: BF16
      attention: BF16
      dense_ffn: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      vision: BF16
    subsystem_method: >-
      对完整清单 5679 条穷举（不是抽样）：全部 BF16，零例外，没有 scale 容器也没有 FP32 张量 ——
      视觉塔与 projector 同样是 BF16

infra_signals:
  - text: >-
      视觉塔在本代定型后被原样复用了很久：Kimi-K2.5 的 vision_tower 与本代**逐张量相同**
      （各 329 条，名字集合相同、形状与 dtype 零差异，各 416,866,032 参数）。
      **算子形状**上 projector 也只差出口维（2048 → 7168）、层序同构；
      但**张量名换了一套**：multi_modal_projector.{pre_norm, linear_1, linear_2}
      → mm_projector.{pre_norm, proj.0, proj.2}，权重加载要改名，
      按名字匹配的工具不能直接复用。
      算子适配做一次能管两代，直到 K3 换成 MoonViT-V2（hidden 1024、12 头、RMSNorm、
      无 bias、qkv_hidden_size 1536 与 hidden 解耦）才需要重做
    evidence: derived
    horizon: settled
    axis: modality
  - text: >-
      原生分辨率 + 变长打包意味着 prefill 的图像 token 数不可预先定容，
      显存峰值随输入分辨率走；而语言主干是 A3B 的小模型，
      所以这一代的 prefill 压力主要来自视觉前端而不是主干
    evidence: judgement
    horizon: settled
    axis: modality

