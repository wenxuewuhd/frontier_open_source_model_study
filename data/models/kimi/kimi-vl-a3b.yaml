  - id: R4
    field: infra_signals
    severity: imprecise
    claim: 「K2.5 的 vision_tower 与本代逐张量相同，**变的只有 projector 的出口维**（2048 → 7168）」
    finding: >-
      vision_tower 那一半成立（各 329 条，名字集合相同、形状与 dtype 零差异）。
      但 projector 不是「只换出口维」：张量名整套换了 ——
      multi_modal_projector.{pre_norm, linear_1, linear_2} → mm_projector.{pre_norm, proj.0, proj.2}。
      算子形状不变（LayerNorm 1152 → 4608×4608 → GELU → 出口×4608），所以 infra 结论
      （适配管两代）站得住；但本仓别处正是把「名字集合双向差集为空」当成免做算子评估的硬判据，
      这里说「只变出口维」会让人以为权重可以直接加载
    resolution: corrected
    changed_to: 分开说「算子形状不变」与「张量名换了一套、权重加载要改名」
  - id: R5
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: 「位置编码……做双线性/双三次插值」
    finding: >-
      本代参考实现只有一种：Learnable2DInterpPosEmb 的默认 interpolation_mode = "bicubic"，
      实例化时不传这个参数，config 里也没有这个键。
      「双线性」是**下一代**的事：K3 的 vision_config 里才出现 pos_emb_interpolation_mode: bilinear。
      按 skill 规则 5，这类规律写进记录要钉代际
    resolution: corrected
    changed_to: 改成 bicubic（并注明是参考实现默认值、config 无此键、K3 起改成 bilinear）
  - id: R6
    field: arch.vision.encoder
    severity: miscategorized
    claim: 「MoonViT（vision_tower.encoder.blocks，SO-400M 级，实测 416.87M）」，口径 derived
    finding: >-
      「实测 416.87M」与路径都成立（329 条求和 416,866,032），但「SO-400M 级」是血统主张：
      config 的 vision_config 里没有任何 SigLIP / SO400M 字样，模型卡也没写，
      它只能来自技术报告（arXiv 2504.07491），而本轮没有读那篇、也没有拉
      moonshotai/MoonViT-SO-400M 的清单做张量比对。标 derived 等于把二手说法算成了实测
    resolution: corrected
    changed_to: 删掉「SO-400M 级」这个限定，改成「HF 上另有独立仓 MoonViT-SO-400M，本轮没做张量比对」
  - id: R7
    field: params.counting_note
    severity: imprecise
    claim: 「vision 一项 447,545,840 …… 对得上模型卡的「VT 0.4B」」
    finding: >-
      数值对得上，但口径不同：卡里的 0.4B 出现在「# Act. Params (LLM+VT) 2.8B+0.4B」，
      是**激活**口径；本仓这一项是**总量**，而且 derive.py 明确把视觉塔排除在激活之外
      （active_params.excluded.vision = 447,545,840）。
      两个数相同只是因为有图像输入时整座塔都被激活 —— 拿总量去对激活，是本仓反复栽过的那类口径错
    resolution: corrected
    changed_to: counting_note 写明两侧口径与「数值相同但不是同一个量」的原因
  - id: R8
    field: notes
    severity: unsupported
    claim: 「同一天发布的 Kimi-VL-A3B-Thinking 与 2506 刷新版本仓不单独立记录：……张量名集合逐个相同」
    finding: >-
      2506 那一半有依据（本轮取过 names.json，5679 : 5679 双向差集为空，config 逐键相同）；
      但**非 2506 的 Kimi-VL-A3B-Thinking 本轮根本没取数**，那句话把两个版本的判据合在一起说，
      等于给没验过的那个也发了证明
    resolution: corrected
    changed_to: 拆开写：2506 的判据列出来，非 2506 的注明「没有取数，只按共用 config 文件族推断，不作为依据」

  - id: R9
    field: arch.vision.prefill.image_as_text_tokens
    severity: missing
    claim: >-
      视觉塔的结构侧填得很深（逐张量的 bias 配置、LayerNorm 与 RMSNorm 的差别
      都写了），但 infra 那一维一格都没有：一张图几个 token、encoder 多少 FLOPs、
      能不能分离部署，三件事都答不上来
    finding: >-
      补 arch.vision 下 tokens / prefill / separability 三组，逐因子核过。
      本档是整批 12 份里**最该做 encoder 分离部署的一档**：
      一张 672² 的图相当于 1007 个文本 token，而它只占 576 个位置 ——
      也就是说一张图的 prefill 成本有 43% 花在视觉塔上、不在主干。
      根因是两边严重不对称：塔 4.5 亿参数跑 2304 个 token，
      而 A3B 主干扣掉 lm_head 后每 token 只有 4.49 GFLOPs。
      **和同塔的 kimi-k2.5 对照最能说明问题**：那边的 vision_tower
      与本档逐张量相同（记录里原有的结论），但主干是 61.0 GFLOPs/token，
      于是塔只值 32 个位置当量、占比 5.6%。同一座塔，占比差 7.7 倍，
      差的全是主干 —— 所以「视觉塔要不要拆出去」不是塔的属性。
      两件**没能钉住**的事都写进了 open_questions：
      (1) encoder 注意力跨度没有一手来源，而本档它不可忽略 ——
      按整图一段算约 660 GFLOPs、是线性项的 35%，会把 1007 再推高约 147，
      所以 1007 是下界。下一代 kimi-k2.5 的参考实现读过（整段注意力），
      但那是下一代的实现，不能回填本代；
      (2) 落盘层面的 tied weights 没查，weight_map 只能排除重名。
      分片上本档是 mixed（335 个视觉张量全在第 1 片，同片另有 583 个主干张量），
      而下一代 kimi-k2.5 改成了最后两片**零非视觉张量**的 dedicated ——
      同一支族系的发布习惯变了，这件事写进了 separability.shard_note
    resolution: corrected
    changed_to: >-
      新增 arch.vision.tokens（672² 下 2304 → 576，压缩比 4；并写明
      patch_embed 是 Conv2d 无时间维、学习式位置表 [64,64,1152] 是插值基准
      而非分辨率上限）、arch.vision.prefill（encoder 线性 1897.3 GFLOPs、
      一张图 ≈ 1007 个文本 token，并与同塔的 kimi-k2.5 对照）、
      arch.vision.separability（mixed，并记下一代改为 dedicated）；
      evidence 加八条，四格判断类进 Gate C；
      注意力跨度、参考分辨率、落盘 tied weights 三件事进 open_questions

notes: >-
  Kimi 的视觉线起点，本仓按支线收录（track: side）：它的档位比同期旗舰小，
  但**它定义了这个家族的视觉前端**，而那套前端一直用到 K2.5，K3 才换代。
  收录的另一个理由是它给出了一个干净的对照：文本主干与 Moonlight 逐张量相同，
  所以「加视觉」这件事的全部代价都落在 vision 这一项里，可以单独读出来。
  Kimi-VL-A3B-Thinking-2506 本仓不单独立记录，判据取过数：与本版 config 拍平后键集相同、
  零个值不同，张量名集合逐个相同（5679 : 5679，双向差集为空），差异全在权重数值与后训练。
  同一天发布的 Kimi-VL-A3B-Thinking（非 2506）**没有取数**，只是按它与 Instruct 共用
  同一套 config 文件族推断同架构 —— 这条不作为依据。
  released 取 HF 仓的 createdAt 2025-04-09。

open_questions:
  - >-
    模型卡的「LLM 侧激活 2.8B」复现不出来。逐项求和（每层 attention 13.76M × 27 = 371.59M、
    专家 6/64 → 1,349,517,312、共享专家 449.84M、L0 稠密 69.21M、router 3.41M、norm 0.13M）
    之后试过的组合：含 lm_head 不含输入词表 2.58B（本仓带宽口径）、两张词表都含 2.91B、
    两张词表都不含 2.24B（前代 Moonlight 论文表格的口径）、再加上 projector 的 30.68M
    2.61B —— 没有一种得到 2.8B，厂商也没写算法。跨代比激活参数时不要引这个数；
    本仓自己的三个口径由 derive.py 给出，可复算
  - >-
    KV cache 与视觉塔激活的实际存储精度都未披露，KV 按模型 dtype（BF16）兜底，
    bytes_basis 是 dtype_fallback
  - >-
    视觉塔的 max_image_tokens / 单图上限不在 config 里（原生分辨率，按 patch 网格走），
    prefill 的显存峰值因此只能按实际输入折算，本仓没有可引的上限值
  - >-
    **视觉塔自注意力的跨度没有来源，而本档它不可忽略。** vision_config 里
    没有 window_size 一类的键，本代参考实现本轮没读。按整图一段算
    （n = 2304）那一项约 660 GFLOPs，是线性项 1897.3 的 35%；
    本档主干又只有 4.49 GFLOPs/token，所以这一项会把
    image_as_text_tokens 从 1007 再推高约 147 个 token 当量。
    **下一代 kimi-k2.5 的参考实现读过（整段注意力），但不能当本代的依据。**
    arch.vision.prefill 因此只装线性项，1007 是下界
  - >-
    **「一张图」的参考分辨率是本仓选的，不是厂商默认。** 本模型按原生分辨率
    走、config 里没有 max_image_tokens，arch.vision.tokens 因此钉在
    672×672 上，只能和同样钉在 672 的其它记录比，
    不是部署时的实际单图 token 数
  - >-
    视觉塔与主干**落盘层面**是否有 tied weights 未查。weight_map 的 5679 个
    名字里两个前缀不重名，这只排除了重名；存储共享要看 safetensors 头的
    数据偏移，本轮没读偏移
