reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 本会话逐字段复算 + 一个独立核查代理
  method: >-
    按 .claude/skills/model-audit 的顺序对 facts/kimi-vl-a3b 逐字段核：config（含 text_config /
    vision_config 两段）、完整清单 5679 个张量、repoinfo 的 tally，以及 derived 的分项。
    本会话独立复算的：与 kimi-moonlight-16b 的文本主干同一性（剥掉 language_model. 前缀后
    名字集合双向差集为空、5344 : 5344、形状与 dtype 零差异）、视觉两段求和
    （vision_tower 416,866,032 + multi_modal_projector 30,679,808 = 447,545,840）、
    与 kimi-k2.5 的 vision_tower 逐张量相同、KV 15,552 元素/token、
    128K 满上下文 3.80 GiB，以及厂商「2.8B」的四种口径尝试（都复现不出）。
    projector 的层序与视觉塔的变长打包注意力取自参考实现 modeling_kimi_vl.py（已列入 sources）。
    另派一个独立核查代理做对抗式复核（它重算了全部分项、视觉两段、与 Moonlight / K2.5
    的两组同一性，并逐张量核了 MoonViT 的结构与 bias 分布），五条发现见 R4–R8。
review:
  - id: R1
    field: params.counting_note
    severity: imprecise
    claim: 「激活参数 2.58B / 2.91B，厂商称 2.8B」
    finding: >-
      厂商的 2.8B **用本仓定义过的任何口径都复现不出**，而原文只写了「对不上」没写试过什么。
      逐项求和是确定的（每层 attention 13,762,560 × 27、专家 6/64 = 1,349,517,312、
      共享专家 449,839,104、L0 稠密 69,206,016、router 3,409,536、norm 126,464），
      组合起来只有三个值：含 lm_head 不含输入词表 2.58B、两张词表都含 2.91B、
      两张词表都不含 2.24B（= 前代 Moonlight 论文表格的口径）；再加 projector 30,679,808
      是 2.61B。2.8B 不等于其中任何一个，厂商也没写算法
    resolution: corrected
    changed_to: >-
      counting_note 与 open_questions 都写明试过哪几种口径、各自的值，并写明不要引这个数；
      记录自己的三个口径由 derive.py 给出、可复算
  - id: R2
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: 「文本侧零改动：5344 个张量与 Moonlight 名字集合逐个相同、形状与 dtype 零差异」
    finding: >-
      自己重算过：剥掉 language_model. 前缀后两边各 5344 条，双向差集都为空，
      交集里 shape 或 dtype 不同的有 **0 条**。所以「加视觉」的全部代价确实落在 vision 这一项
      （447,545,840），文本八个分项与 kimi-moonlight-16b 逐位相同。
      顺带核了参数总量：16,407,657,776 与 HF tally 逐位相同
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R3
    field: infra_signals
    severity: imprecise
    claim: 「Kimi-K2.5 的 vision_tower 与本代逐张量相同，变的只有 projector 的出口维」
    finding: >-
      自己重算过：两边 vision_tower.* 的名字集合相同、交集里形状与 dtype 零差异，
      各 416,866,032 参数。projector 侧 30,679,808（出口 2048）vs 54,277,888（出口 7168），
      层序同构（LayerNorm [1152] → 4608×4608 → GELU → 出口×4608，两层都带 bias），
      只是 K2.5 把张量名从 multi_modal_projector.linear_* 改成 mm_projector.proj.*。
      这条跨了 9 个月与两个档位（A3B → 1T），所以作用域要写清楚：**到 K3 为止**，
      K3 换成了 MoonViT-V2（1024 / 12 头 / RMSNorm / 无 bias / qkv_hidden_size 1536）
    resolution: confirmed
