# 手写记录。与 kimi-k2 的差异来自两份完整清单的逐条比对（张量名集合逐个相同，
# 只有一个 buffer 的长度不同）与两份 config 的逐字段比对。
id: kimi-k2-0905
family: kimi
kind: llm
display_name: Kimi-K2-Instruct-0905
released: '2025-09-03'
license: other
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/moonshotai/Kimi-K2-Instruct-0905
    locator: config.json / README.md @ ac6c49f04883
    accessed: '2026-10-30'
    note: >-
      block-fp8 发布，62 分片、139644 个张量，逐分片读头取全，无读失败分片。
      模型卡自述「context window has been increased from 128k to 256k tokens」，
      规格表仍是 1T / 32B

