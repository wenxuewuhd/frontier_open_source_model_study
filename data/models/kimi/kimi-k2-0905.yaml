reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 本会话逐字段复算 + 一个独立核查代理
  method: >-
    这一版的全部结论都是「与 kimi-k2 比」，所以核查方式就是两份事实的逐条比对：
    两份 config 全部键（差异只有 max_position_embeddings、rope_scaling.factor、
    rms_norm_eps 三项，其余是 transformers 的默认键补全）、两份完整清单各 139,644 个张量
    （名字集合双向差集为空，交集里形状/dtype 不同的只有 rotary_emb.inv_freq 一类）、
    两份 repoinfo 的 tally。本会话独立复算：差额 4,392 = 61 × (128 − 56)、
    scale 元素 62,495,192 的分项、满 256K 的 17.16 GiB（70,272 B/token × 262,144）。
    YaRN 的斜坡与温度补偿结论引自 kimi-k2 的同一字段（那边按参考实现的公式算过）。
    另派一个独立核查代理做对抗式复核（它在本版清单上重跑了量化块、ceil 一致性与
    唯一非整除张量的检查，并逐张量确认 61 处差异只有 inv_freq 一类），两条发现见 R4–R5。
review:
  - id: R1
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: 「结构零变化……差 4,392 个元素，全部来自 rotary_emb.inv_freq 从 [56] 变成 [128]（61 × 72）」
    finding: >-
      自己重算过，逐项闭合：两份清单各 139,644 条、名字集合双向差集为空；
      交集里 shape 或 dtype 不同的**只有 61 个 rotary_emb.inv_freq**（[56] BF16 → [128] BF16），
      61 × (128 − 56) = 4,392，而两份 HF tally 的差 1,026,408,240,256 − 1,026,408,235,864
      = 4,392 逐位吻合。参数分项里也只有 attention 一项变（6,168,448,344 → 6,168,452,736）。
      顺带核实：这个 buffer 在参考实现里是 persistent=False、长度按 qk_rope_head_dim/2 = 32 算，
      与落盘的 56 / 128 都不相等，即它既不被加载也不参与计算
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R2
    field: params.counting_note
    severity: wrong
    claim: 「两边都排了 61,931,520 + 592,672 = 62,495,192 个 weight_scale_inv 元素」
    finding: >-
      加数写错了：62,495,192 − 61,931,520 = **563,672**（= attention 378,200 +
      shared_expert 161,280 + dense_ffn 24,192），不是 592,672。总数与 derived 的
      scale_elements 62,495,192 一致，所以是这个中间项抄错，不影响其它结论 ——
      但「一个乘式逐因子验」这条规则同样适用于加式，分项写错了下游就没法复核
    resolution: corrected
    changed_to: 改成「61,931,520 个专家 scale 加 563,672 个其余子系统的 scale」
  - id: R3
    field: notes
    severity: imprecise
    claim: 这一版为什么不按「零结构差异的刷新」删掉
    finding: >-
      判据要写明，否则下一轮刷新时无从照办。本仓删过的五份 DeepSeek 记录是
      **一个规格字段都没动**（config 逐字段相同或只差元字段）；本版动了两个会出现在
      规格对照与变化矩阵里的字段（context.max 131072 → 262144、norm_eps 1e-6 → 1e-5）。
      若把它折进 kimi-k2，这两条变化就会错挂到 kimi-k2-thinking 身上，
      而那一代真正改的是量化 —— 这正是本仓「和 predecessor 比、不和时间前一个比」要防的事
    resolution: corrected
    changed_to: notes 里写明留它的判据与折叠后会出的错

  - id: R4
    field: lineage.changed_from_predecessor
    severity: missing
    claim: 「上下文翻倍，不动任何结构……本版只动了 factor 这一个标量」
    finding: >-
      「一个标量」对，「只改上下文」不对：参考实现的 softmax_scale 里乘着
      yarn_get_mscale(factor, mscale_all_dim)²，factor 32 → 64 让这个因子从 1.8133
      变成 2.0047（+10.6%），即注意力温度跟着变。
      算子与权重结构仍是零变化（这一半成立），但「只动了一个标量」在数值行为上
      不等于「只改了上下文」—— 对齐评测或复现时这件事会显形。
      根因与 kimi-k2 的 R7 是同一处实现误读
    resolution: corrected
    changed_to: lineage 与 extension_method 都写出 factor 的第二个作用点与两个因子值
  - id: R5
    field: open_questions
    severity: missing
    claim: 只有两条（KV 精度、YaRN 外推质量）
    finding: >-
      缺了 kimi-k2 有的那一条：模型卡同样写 "Our model checkpoints are stored in the
      block-fp8 format"，那是落盘格式不是训练精度，本记录也没填 precision.training。
      不补的话「训练精度未知」这件事只在 K2 身上留痕，读 0905 的人会以为它有来源。
      顺带 arch.activation 的口径：两份卡的 Model Summary 表都写 SwiGLU，
      kimi-k2 标 official 而本记录标 derived，同样的一手证据被标成两个口径
    resolution: corrected
    changed_to: 补一条 open question（落盘格式 ≠ 训练精度）；arch.activation 改标 official 并在字段里点明卡的来源

notes: >-
  K2 的权重刷新 + 上下文扩展版。本仓对「零结构差异的刷新」原则上不单独立记录
  （DeepSeek 线为此删过五份），这一版留着的理由是它**有规格变化**：
  context 131072 → 262144、rms_norm_eps 1e-6 → 1e-5，两项都会出现在规格对照与变化矩阵里；
  若把它折进 kimi-k2，这两条变化就会错挂到 K2-Thinking 身上（那一代真正改的是量化）。
  released 取 HF 仓的 createdAt 2025-09-03。

open_questions:
  - >-
    KV cache 的实际存储精度未披露，按模型 dtype（BF16）兜底，bytes_basis 是 dtype_fallback
  - >-
    YaRN factor 从 32 调到 64 之后外推段的质量只有模型卡的定性说法，
    没有一手的长上下文评测数据可引
  - >-
    预训练数值格式没有一手声明。模型卡（与 kimi-k2 的那份一样）只说 checkpoint
    存成 block-fp8，那是落盘格式、不等于训练精度，precision.training 不填
