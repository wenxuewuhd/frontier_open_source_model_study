  pipeline_tag: text-generation
  gated: false

lineage:
  track: historical
  predecessor: kimi-k2
  successor: kimi-k2-thinking
  changed_from_predecessor:
    - axis: context
      text: >-
        131072 → 262144，YaRN 的 factor 从 32.0 调到 64.0（原生长度仍是 4096，
        mscale 与 beta 都不变）
      benefit: >-
        上下文翻倍，不动任何结构：张量名集合与前代逐个相同（139644 : 139644，双向差集为空），
        逐张量形状也只有一处不同（见下）。代价全在容量：满上下文的 MLA 缓存
        从 8.58 GiB 涨到 17.16 GiB（70,272 B/token × 262144，BF16 兜底口径）。
        **但这个标量不只改上下文**：参考实现的 softmax_scale 里乘着
        yarn_get_mscale(factor, mscale_all_dim)²，factor 32 → 64 让这个因子
        从 1.8133 变成 2.0047（+10.6%），即注意力温度跟着变了 ——
        「只动了一个标量」在数值行为上不等于「只改了上下文」。
        外推倍数从 32 倍变成 64 倍，外推段质量只能靠评测看
    - axis: precision
      text: rms_norm_eps 1e-6 → 1e-5（回到 Moonlight 那一代的取值），量化方案与块大小一字未改
      benefit: >-
        与数值稳定性有关的唯一改动。量化侧零变化：block-fp8、[128,128]、FP32 scale、
        被量化的四个子系统与各自的 dtype 全部与前代一致（两份清单逐条对过）
    - axis: scale
      text: >-
        结构零变化。实测参数总量 1,026,408,235,864 → 1,026,408,240,256，
        差 4,392 个元素，全部来自每层那个 rotary_emb.inv_freq 遗留 buffer 从 [56] 变成 [128]
        （61 × 72 = 4,392）
      benefit: >-
        **算子侧什么都不用做**：已经支持 K2 的平台支持本版不需要任何算子工作，
        差异只有 YaRN 的一个标量与一个不被加载的 buffer 长度。
        能力变化全部来自后训练与权重刷新 —— 这一版留在本仓，是因为「上下文 128K → 256K」
        这条规格变化要挂在它身上，而不是挂在 K2 或 K2-Thinking 上

params:
  total: 1026408240256.0
  breakdown:
    expert: 1014686023680.0
    attention: 6168452736.0
    shared_expert: 2642411520.0
    embed: 1174405120.0
    lm_head: 1174405120.0
    dense_ffn: 396361728.0
    router: 165173760.0
    norm: 1006592.0
  counting_note: >-
    total 与 breakdown 是本仓按完整清单（139644 条）逐项求和的实测值；外部核对是 HF 的
    safetensors tally，与实测 1,026,408,240,256 逐位相同（两边都排了 61,931,520 个专家 scale 加 563,672 个其余子系统的 scale
    = 62,495,192 个 weight_scale_inv 元素）。复算 attention 分项时注意
    kv_a_layernorm [512] 与 q_a_layernorm [1536] 按本仓归类在 norm 而不在 attention
    （自己按名字算进去会多 61 × 2048 = 124,928 个元素）。
    与 kimi-k2 的唯一分项差异在 attention：
    6,168,448,344 → 6,168,452,736，差 4,392，就是 inv_freq buffer 从 [56] 变 [128]。
    厂商声明仍是「1T / 32B」取整标签：实测总量 1.026T（+2.6%），
    激活（带宽口径）31.69B（−1.0%），含输入词表 32.86B

context:
  max: 262144
  train_native: 4096
  extension_method: >-
    YaRN（type yarn、factor 64.0、original_max_position_embeddings 4096、
    mscale 与 mscale_all_dim 1.0、beta_fast 与 beta_slow 1.0）。
    本版只动了 factor 这一个标量，但它同时作用在两处：插值频率与
    softmax_scale 里的 yarn_get_mscale(factor, mscale_all_dim)²（1.8133 → 2.0047）。
    斜坡仍是退化的（beta_fast = beta_slow = 1 → low 19 / high 20，
    在 32 个频率维的第 20 维处硬切）；cos/sin 侧不被额外缩放（mscale 与 mscale_all_dim 相等，
    那个比值恒为 1）—— 两处的算式见 kimi-k2 的同一字段

arch:
  layers: 61
  hidden: 7168
  vocab: 163840
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: SwiGLU（config hidden_act silu；模型卡 Model Summary 表也写 SwiGLU）
  position: RoPE theta 50000 + YaRN 外推（factor 64）

  attention:
    type: MLA
    num_heads: 64
    num_kv_heads: 64
    head_dim: 192
    v_head_dim: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim_note: >-
      与 kimi-k2 逐张量相同：缓存是 kv_a_proj_with_mqa [576, 7168] 的 576 维/层
      （按 2 × 64 × 192 = 24576 折算高估 42.7 倍），o_proj [7168, 8192] 按 v_head_dim 128
      而不是 head_dim 192 展开。Q 侧两段 q_a_proj [1536, 7168] / q_b_proj [12288, 1536]
    layer_pattern: 61/61 层都是 MLA

  ffn:
    type: moe
    layer_pattern: L0 稠密（mlp.gate_proj [18432, 7168]），L1–L60 共 60 层 MoE

  moe:
    routed_experts: 384
    shared_experts: 1
    top_k: 8
    intermediate: 2048
    dense_intermediate: 18432
    first_k_dense: 1
    expert_groups: 1
    routing: sigmoid 打分、noaux_tc 选路，routed_scaling_factor 2.827，n_group / topk_group 均为 1（分组未启用）
    balance: e_score_correction_bias（每 MoE 层一个 [384] FP32）
    storage_note: 逐专家独立张量，与前代逐条相同

  decoding:
    mtp_layers: 0
    mtp_layers_note: config num_nextn_predict_layers 0，清单里没有草稿块

precision:
  weights_release: [FP8_E4M3, BF16, FP32]
  weights_release_scope:
    FP8_E4M3: { manifest_taken: true, in_precision_table: true }
    BF16: { manifest_taken: true, in_precision_table: true }
    FP32: { manifest_taken: true, in_precision_table: true }
  quantization:
    method: fp8（block-wise）
    activation_scheme: dynamic
    weight_block_size: [128, 128]
    weight_format: e4m3
    expert_dtype: FP8_E4M3
    per_subsystem:
      expert: FP8_E4M3
      shared_expert: FP8_E4M3
      dense_ffn: FP8_E4M3
      attention: FP8_E4M3
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    per_subsystem_scale:
      expert: FP32
      shared_expert: FP32
      dense_ffn: FP32
      attention: FP32
    per_subsystem_block:
      expert: '[128,128]'
      shared_expert: '[128,128]'
      dense_ffn: '[128,128]'
      attention: '[128,128]'
    block_size_note: >-
      与 kimi-k2 逐张量相同，包括 kv_a_proj_with_mqa [576, 7168] ÷ [5, 56] 那个不整除的边界
      （576 / 128 = 4.5，scale 5 行、末块不满）
    subsystem_method: >-
      对完整清单 139,644 条穷举，并与 kimi-k2 的清单逐条比对：
      张量名集合双向差集为空，逐子系统的权重 dtype 与 scale dtype 全部一致
  qat: false

infra_signals:
  - text: >-
      上下文翻倍只改了 YaRN 的一个标量，算子与权重结构零变化 ——
      这类版本的 infra 成本不在适配而在容量：满 256K 的 MLA 缓存 17.16 GiB/序列
      （BF16 兜底），并发度按它折算会直接减半
    evidence: derived
    horizon: settled
    axis: context

