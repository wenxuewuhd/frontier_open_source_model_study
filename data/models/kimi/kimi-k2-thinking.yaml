# 手写记录。量化形态（容器、还原因子、块大小、scale 精度）与参数分项都来自完整权重清单
# （facts/kimi-k2-thinking/shapes.json，208276 个张量，62/62 分片无读失败），
# 并与 kimi-k2-0905 的清单逐条比对。
# 注意：本记录的 params 是**还原打包后**的参数量，而 derive.py 当前少算 8 倍 —— 见 review R1。
id: kimi-k2-thinking
family: kimi
kind: llm
display_name: Kimi-K2-Thinking
released: '2025-11-04'
license: other
visibility: public

sources:
  - kind: modelcard
    url: https://huggingface.co/moonshotai/Kimi-K2-Thinking
    locator: config.json / README.md @ a51ccc050d73
    accessed: '2026-10-30'
    note: >-
      compressed-tensors（pack-quantized）发布，62 分片、208276 个张量，逐分片读头取全，
      无读失败分片。模型卡第 4 节「Native INT4 Quantization」：后训练阶段用 QAT
      做 INT4 **weight-only** 量化、只量化 MoE 部分，自称约 2 倍生成加速；
      规格表仍是 1T / 32B，上下文 256K

hf:
  repo: moonshotai/Kimi-K2-Thinking
  sha: a51ccc050d73dab088bf7b0e2dd9b30ae85a4e55
  last_modified: '2026-01-30T04:49:39.000Z'
  pipeline_tag: text-generation
  gated: false

lineage:
  track: historical
  predecessor: kimi-k2-0905
  successor: kimi-k2.5
  changed_from_predecessor:
    - axis: precision
      text: >-
        量化方案整换：block-fp8（FP8_E4M3 权重 + 每 [128,128] 一个 FP32 scale，
        quant_method fp8）改成 compressed-tensors 的 **pack-quantized INT4**
        （num_bits 4、type int、strategy group、group_size 32、symmetric true），
        且**只量化路由专家** —— config 的 ignore 列表排掉 lm_head、self_attn、
        shared_experts 与稠密 mlp，清单上也只有 experts.* 带 weight_packed。
        模型卡说这是后训练阶段的 QAT（quantization-aware training），不是发布后量化
      benefit: >-
        权重存储从 958.49 GiB 降到 553.40 GiB（1.73 倍）：专家从 FP8 的 1 B/参数降到
        INT4 的 0.5 B/参数，但 scale 换成了 **BF16**，group 32 下每参数多 0.0625 B，
        所以专家侧实际是 0.5625 B/参数。
        代价有三处：(1) 反量化路径整换 —— 从「FP8 + [128,128] FP32 scale」变成
        「8 个 INT4 装在一个 I32 容器里 + 每 32 个元素一个 BF16 scale」，两套 kernel 不通用；
        (2) 注意力、共享专家、稠密 FFN 从 FP8 **回到 BF16**，这三项的权重字节翻倍
        （9.21B 参数从约 1 B/参数变 2 B/参数），把专家省下的量几乎全抵掉了 ——
        每 token 搬运的字节 33.035 → 32.987 GB，只差 0.15%（逐项算式见 bottlenecks）。
        **省的是容量不是带宽**；(3) scale 本身 31.7G 个元素、63.42 GB，
        是专家数据体积（507.34 GB）的 12.5% —— K3 改用 E8M0（U8）后这一项才减半
    - axis: scale
      text: >-
        逻辑结构零变化：参数量还原打包后是 1,026,408,240,256，与 kimi-k2-0905 **逐位相同**；
        61 层、384 专家、top-8、hidden 7168、MLA 形状全部不变
      benefit: >-
        算子侧除反量化之外不需要新工作，层结构、注意力与路由都不变。
        清单上的差异只有三类张量名（weight → weight_packed / weight_scale / weight_shape）
        与它们的容器形状

params:
  total: 1026408240256.0
  breakdown:
    expert: 1014686023680.0
    attention: 6168452736.0
    shared_expert: 2642411520.0
    embed: 1174405120.0
    lm_head: 1174405120.0
    dense_ffn: 396361728.0
    router: 165173760.0
    norm: 1006592.0
  counting_note: >-
    **本记录的 total 与 breakdown 是本仓按完整清单（208276 条）逐项求和、并把 INT4 打包
    还原（×8）之后的值；derive.py 当前算不出这个数**：lib/dtypes.py 的打包还原只认
    INT8 / UINT8 容器，不认 INT32，于是专家一项按容器数记成 126,835,891,200，
    参数总量少算 8 倍。因此 data/derived/kimi-k2-thinking.json 里的
    参数总量、按子系统分项与激活参数都偏小，Gate B 的「参数总量」与「外部参数量对账」
    两项都报 MISMATCH —— 这是工具缺口，不是数据分歧，留痕见 review R1，
    需要的脚本改动已交主会话统一处理。字节口径不受影响（容器就是真实存储）。
    还原因子 ×8 有**五条独立机制、六处闭合**（(1)(2) 与 (3) 是同两个机制换方向再做一遍，
    不是第三个机制）：
    (1) experts gate_proj weight_packed [2048, 896] I32，而逻辑输入维是 hidden 7168 = 896 × 8；
    (2) 同一张量的 weight_scale [2048, 224] 配 group_size 32 → 224 × 32 = 7168，
    独立给出同一个逻辑维；
    (3) down_proj 另一方向同样闭合：weight_packed [7168, 256] → 256 × 8 = 2048 = moe_intermediate，
    weight_scale [7168, 64] → 64 × 32 = 2048；
    (4) config 的 num_bits 4 / format pack-quantized → 32 / 4 = 8 个逻辑值一个 I32 容器；
    (5) HF 的 safetensors tally 报 I32 一项为 1,014,686,023,680，恰等于
    (126,835,752,960 − 0) × 8，即它也还原了打包、且把 60 × 384 × 3 × 2 = 138,240 个
    weight_shape 元数据元素排除在外；
    (6) 前代 kimi-k2-0905 的同一批专家按 FP8 落盘，实测 1,014,686,023,680 个元素，
    与本代还原后的数逐位相同 —— 同一结构的两种落盘格式互为对照。
    scale 不计入参数（31,708,938,240 个 BF16 元素），只计入权重存储；weight_shape
    是 compressed-tensors 的元数据（每张量一个 I32 [2]），本仓也排除在参数之外。
    厂商声明「1T / 32B」是取整标签：还原后总量 1.026T（+2.6%），
    激活（带宽口径）31.69B，与 kimi-k2-0905 相同

context:
  max: 262144
  train_native: 4096
  extension_method: >-
    YaRN（type yarn、factor 64.0、original 4096、mscale 与 mscale_all_dim 1.0、
    beta_fast 与 beta_slow 1.0），与 kimi-k2-0905 逐字段一致：斜坡退化（low 19 / high 20）、
    温度补偿不生效，算式见 kimi-k2 的同一字段

arch:
  layers: 61
  hidden: 7168
  vocab: 163840
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: SwiGLU（config hidden_act silu）
  position: RoPE theta 50000 + YaRN 外推（factor 64）

  attention:
    type: MLA
    num_heads: 64
    num_kv_heads: 64
    head_dim: 192
    v_head_dim: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim_note: >-
      与 kimi-k2-0905 逐张量相同（包括 inv_freq [128] 这个遗留 buffer），只是 dtype 从
      FP8_E4M3 变回 BF16：缓存是 kv_a_proj_with_mqa [576, 7168] 的 576 维/层
      （按 2 × 64 × 192 = 24576 折算高估 42.7 倍），o_proj [7168, 8192] 按 v_head_dim 128
      展开，Q 侧两段 q_a_proj [1536, 7168] / q_b_proj [12288, 1536]
    layer_pattern: 61/61 层都是 MLA

  ffn:
    type: moe
    layer_pattern: L0 稠密（mlp.gate_proj [18432, 7168]，BF16 未量化），L1–L60 共 60 层 MoE

  moe:
    routed_experts: 384
    shared_experts: 1
    top_k: 8
    intermediate: 2048
    dense_intermediate: 18432
    first_k_dense: 1
    expert_groups: 1
    routing: sigmoid 打分、noaux_tc 选路，routed_scaling_factor 2.827，n_group / topk_group 均为 1（分组未启用）
    balance: e_score_correction_bias（每 MoE 层一个 [384] FP32）
    storage_note: >-
      逐专家独立张量，但每个专家的每个投影现在是三个张量：weight_packed（I32 容器，
      8 个 INT4 一个）、weight_scale（BF16，每 32 个元素一个）、weight_shape（I32 [2] 元数据）。
      按「一个投影一个张量」数专家或求参数量的工具在这一代会同时数错和算错

  decoding:
    mtp_layers: 0
    mtp_layers_note: config num_nextn_predict_layers 0，清单里没有草稿块

precision:
  weights_release: [INT4, BF16, FP32]
  quantization:
    method: compressed-tensors（pack-quantized，weight-only）
    expert_dtype: INT4
    packing_note: >-
      路由专家的 INT4 权重 8 个装进一个 I32 容器（weight_packed 的末维是逻辑维的 1/8），
      scale 是独立的 BF16 张量（weight_scale），另有一个 I32 [2] 的 weight_shape 元数据。
      参数量按 ×8 还原，字节不还原。**与 K3 的 MXFP4 不是一套**：K3 是 2 个 FP4
      装进一个 U8 容器、scale 也是 U8（E8M0），两代的解包位宽、容器类型与 scale 精度全不同
    per_subsystem:
      expert: INT4
      shared_expert: BF16
      attention: BF16
      dense_ffn: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    per_subsystem_scale:
      expert: BF16
    per_subsystem_block:
      expert: '[1,32]'
    block_size_note: >-
      实测：gate_proj / up_proj 的 weight_scale [2048, 224] 对逻辑 [2048, 7168]
      （7168 / 224 = 32），down_proj 的 [7168, 64] 对逻辑 [7168, 2048]（2048 / 64 = 32），
      即**逐输出行、沿 K 每 32 个一个 scale**，按 [out, in] 轴序是 [1, 32]，
      与 config 的 strategy group / group_size 32 一致。
      前代是 config 声明且实测一致的 [128, 128] —— 块从二维方块变成一维沿 K 的微缩放，
      反量化的访存形态随之改变
    subsystem_method: >-
      对完整清单 208,276 条穷举（不是抽样）：专家的 weight_packed / weight_shape 全是 I32、
      weight_scale 全是 BF16，无例外；其余子系统除 60 个 e_score_correction_bias（F32，
      共 23,040 个元素）外全是 BF16。
      量化只覆盖路由专家，一手依据是 config 的 ignore 列表
      ["lm_head", "re:.*self_attn.*", "re:.*shared_experts.*", "re:.*mlp\\.(gate|up|gate_up|down)_proj.*"]，
      清单上也只有 experts.* 带 weight_packed —— 与 K3 的 ignore 列表是同一套写法
  qat: true

bottlenecks:
  - dimension: weight-bandwidth
    finding: >-
      **INT4 省的是容量，不是 decode 带宽。** 权重存储降 1.73 倍
      （958.49 → 553.40 GiB），但每 token 搬运的字节几乎不变：专家降下来的量，
      被注意力 / 共享专家 / 稠密 FFN 从 FP8 退回 BF16 的增量抵掉了。
      按「非专家全量搬运 + 专家按 top_k/experts 折算」的口径逐项算，两代相差 0.15%
    quantified: >-
      逐子系统用实测字节折算（字节口径不受打包还原影响，见 counting_note）：
      本代专家 570.761 GB × 8/384 = 11.891 GB/token，非专家
      （注意力 12.337 + 共享专家 5.285 + lm_head 2.349 + 稠密 FFN 0.793 + router 0.330
      + norm 0.002）= 21.096 GB/token，合计 **32.987 GB/token**；
      前代 kimi-k2-0905 同口径是专家 1014.934 × 8/384 = 21.144 加非专家 11.891，
      合计 **33.035 GB/token**。两个数差 −0.15%，而两半的大小恰好对调。
      所以模型卡的「约 2 倍生成加速」不可能来自每 token 字节数 ——
      它要么来自 INT4 的计算 kernel、要么来自卡数减少后的并行配置变化，本仓没有依据选一个。
      注意 derive.py 的 decode_weight_bytes_per_token 与算术强度对本记录不可用：
      它按「激活参数 / 总参数」等比例折算，而 derived 里的 params_total 本身少算 8 倍
      （见 review R1），且等比例折算对混合精度模型本来就不成立（kimi-k3 的 R1 同一回事）
    visibility: public
  - dimension: kv-capacity
    finding: >-
      KV 侧与前代逐张量相同、一字未改：61 层 MLA，每层 576 个元素。
      INT4 没有碰 KV（config 的 kv_cache_scheme 是 null），所以长上下文的容量账
      与 kimi-k2-0905 完全一样
    quantified: >-
      35,136 元素/token（576 × 61），BF16 兜底 70,272 B/token，
      满 256K 上下文 17.16 GiB/序列。两代同口径（都是 dtype_fallback），可直接比：零变化
    visibility: public

infra_signals:
  - text: >-
      这一代定下了后面两代都在用的量化形态：**只量化路由专家、从后训练阶段做 QAT、
      其余子系统留 BF16**。K2.5 / K2.6 / K2.7 沿用同一套（ignore 列表只多了视觉），
      K3 换成 MXFP4 但这三条原则一字不改。
      所以「发布即量化」在 Kimi 线上的形态是：反量化路径是必需的，BF16 主权重并不存在
    evidence: judgement
    horizon: now
    axis: precision
  - text: >-
      INT4 的 scale 是 BF16，group 32 下每参数多 0.0625 B，全模型 63.42 GB ——
      占专家数据体积的 12.5%。K3 改用 U8（E8M0）后同样的 group 32 只多 0.03125 B/参数。
      规划显存时 scale 不是可忽略项，而它在「4 bit 权重」这个说法里看不见
    evidence: derived
    horizon: now
    axis: precision
  - text: >-
      本仓的工具链在这一代露了一个缺口：lib/dtypes.py 的打包还原只认 INT8 / UINT8 容器，
      I32 容器里的 INT4 不会被还原，参数量静默少算 8 倍。
      接住它的是 Gate B 的外部参数量对账（HF 的 safetensors tally 不依赖本仓代码）——
      这正是那一项当初被加进去的用途
    evidence: derived
    horizon: now
    axis: precision

