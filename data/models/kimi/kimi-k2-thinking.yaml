reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 本会话逐字段复算 + 一个独立核查代理
  method: >-
    按 .claude/skills/model-audit 的顺序对 facts/kimi-k2-thinking 逐字段核：config 全部键
    （含 quantization_config 的 config_groups 与 ignore 列表）、完整清单 208,276 个张量
    （逐张量形状与 dtype、weight_packed / weight_scale / weight_shape 三类的层与专家覆盖、
    每个被量化张量与同名 scale 的形状比）、repoinfo 的 tally，并与 facts/kimi-k2-0905
    的清单逐条比对。本会话独立复算：×8 还原的六条证据、还原后总量与 HF tally 逐位相同、
    decode 每 token 的逐子系统字节折算（两代各一遍）、权重存储 553.40 GiB 的 dtype 构成、
    KV 35,136 元素/token 与满 256K 的 17.16 GiB。
    YaRN 的两条结论引自 kimi-k2 的同一字段（那边的实现误读已在 R7 修正）。
    另派一个独立核查代理做对抗式复核（它独立验了 ×8 还原的四个方向、
    与 HF tally 的逐位相同、两代 decode 字节的同口径折算，并读了 lib/dtypes.py
    确认 packing_factor 的写法本身也要改），一条发现见 R5
review:
  - id: R1
    field: params
    severity: wrong
    claim: derive.py 的 shapes 路给出参数总量 138,558,107,776（专家按 I32 容器数计）
    finding: >-
      **这是工具缺口，不是本模型的数据分歧。** compressed-tensors 的 pack-quantized
      把 8 个 INT4 装进一个 I32 容器，而 lib/dtypes.py 的 _CONTAINERS 只有 INT8 / UINT8，
      packing_factor() 因此返回 1，专家参数量少算 8 倍；packing_suspect 那条提示也只在
      INT8 / UINT8 容器上触发，所以它连警告都不会给。
      还原因子 ×8 有六条互相独立的证据（逐条写在 counting_note 里），其中两条不依赖本仓代码：
      HF 的 safetensors tally 报 I32 一项为 1,014,686,023,680 = 126,835,752,960 × 8，
      而前代 kimi-k2-0905 的同一批专家按 FP8 落盘、实测元素数与它逐位相同。
      还原后总量 1,026,408,240,256 与 tally 逐位相同。
      **接住它的是 Gate B 的外部参数量对账** —— 这一项当初加进来就是为了这种情况；
      两条 MISMATCH（参数总量、外部对账）都来自同一个根因，也因此连带让 derived 里的
      按子系统分项、激活参数与算术强度偏小
    resolution: corrected
    changed_to: >-
      本记录的 params.total 与 breakdown 填**还原后**的值；脚本缺口随后由主会话修掉：
      lib/dtypes.py 的 _CONTAINERS 从集合改成「容器 -> 位宽」的映射并纳入 INT32，
      packing_factor() 的还原因子改成「容器位宽 / 逻辑位宽」（这里 32 / 4 = 8），
      新增 is_metadata_tensor() 把 weight_shape 这类格式元数据排除在参数量之外
      （字节照算），packing_suspect 的提示面也跟着扩到所有容器类型。
      修完 derive.py 的 shapes 路直接给出 1,026,408,240,256，与 YAML 声明和 HF tally
      三方逐位相同，两条 MISMATCH 都报 delta_pct=0.0；全仓另外 45 份记录的推导摘要
      逐字未变（改动前后各跑一遍比对过）
  - id: R2
    field: bottlenecks
    severity: wrong
    claim: 「按子系统逐项折算……所以这一代 decode 侧实际省了约 26%」
    finding: >-
      26% 是把前代的非专家部分按 BF16 算出来的，而前代（kimi-k2-0905）的注意力、
      共享专家、稠密 FFN 都是 **FP8**。用两份 derived 的 weight_bytes_by_subsystem
      同口径重算（专家按 top_k/experts 折算、非专家全量、排 embed）：
      本代专家 570.761 GB × 8/384 = 11.891 加非专家 21.096 = **32.987 GB/token**；
      前代专家 1014.934 × 8/384 = 21.144 加非专家 11.891 = **33.035 GB/token**。
      差 −0.15%，**不是省 26%**：专家降下来的量几乎正好被非专家从 FP8 退回 BF16 的增量抵掉
      （两半的大小恰好对调）。所以 INT4 在这一代省的是容量（958.49 → 553.40 GiB，1.73 倍），
      不是 decode 带宽；模型卡的「约 2 倍生成加速」不可能来自每 token 字节数
    resolution: corrected
    changed_to: >-
      bottlenecks 的 weight-bandwidth 一项改写成「省的是容量不是带宽」并给出两代的逐项算式，
      点明那个 2 倍加速另有来源（本仓没有依据选一个）；lineage 的 precision 一条同步改
  - id: R3
    field: precision.quantization.per_subsystem
    severity: imprecise
    claim: 「只量化路由专家，其余 BF16」
    finding: >-
      成立且是全量穷举（208,276 条逐条带 dtype）：专家的 weight_packed / weight_shape 全 I32、
      weight_scale 全 BF16，无例外；其余子系统除 60 个 e_score_correction_bias（F32、
      共 23,040 个元素，与 tally 的 F32 一项逐位相同）外全 BF16。
      一手依据是 config 的 ignore 列表（lm_head / self_attn / shared_experts / 稠密 mlp）。
      **顺带一个方向相反的事实**：注意力、共享专家、稠密 FFN 在前代是 FP8，本代回到 BF16 ——
      「只量化专家」在这一代同时意味着「其余子系统升回去了」，R2 的结论就建立在这上面
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R4
    field: precision.quantization.per_subsystem_block
    severity: imprecise
    claim: expert 的块是 '[1,32]'
    finding: >-
      实测闭合：gate_proj / up_proj 的 weight_scale [2048, 224] 对逻辑 [2048, 7168]
      （7168 / 224 = 32）、down_proj 的 [7168, 64] 对逻辑 [7168, 2048]（2048 / 64 = 32），
      两个方向都整除，与 config 的 strategy group / group_size 32 一致，
      按 [out, in] 轴序即 [1, 32]。前代 config 声明且实测一致的是 [128, 128]，
      两种形状的块访存形态不同 —— 这件事只能实测，不能抄 config（本仓在 DeepSeek V4 一代栽过）
    resolution: confirmed
    changed_to: 原值成立，不改

  - id: R5
    field: params.counting_note
    severity: imprecise
    claim: 「还原因子 ×8 有六条互相独立的证据」
    finding: >-
      六处闭合是真的，但不是六条独立机制：(1) packed 末维 896 × 8 = 7168 与
      (2) 同张量 scale 末维 224 × 32 = 7168 是两个机制，而 (3)（down_proj 方向）
      是把同样两个机制换个方向再做一遍。所以是**五条独立机制、六处闭合**。
      核查代理另外确认了**没有一条是循环论证**：(5) 的 HF tally 来自 repoinfo.json、
      不经本仓任何代码，(6) 的前代 FP8 元素数来自另一份权重清单，两条都真正外部。
      顺带它指出一件记录没写清的事：即便把 INT32 加进 _CONTAINERS，
      packing_factor 现在的写法 `max(8 // bits, 1)` 也只会得到 2 ——
      所以「按容器位宽 / 逻辑位宽算」这半句不是可选项，是必需的
      （也正解释了 K3 的 MXFP4 装在 U8 里为什么现在算对：8 // 4 = 2）
    resolution: corrected
    changed_to: 改成「五条独立机制、六处闭合」并点明哪两处是同机制换方向；R1 的 changed_to 已写明还原因子要按位宽比算

  - id: R6
    field: bottlenecks 的 weight-bandwidth 一项
    severity: wrong
    claim: >-
      「模型卡的『约 2 倍生成加速』不可能来自每 token 字节数 —— 它要么来自 INT4 的计算 kernel、
      要么来自卡数减少后的并行配置变化，本仓没有依据选一个」
    finding: >-
      基线搞错了。原先拿**前代 FP8 发布**（kimi-k2-0905）当基线，得 −0.15%，于是判定那个
      2 倍另有来源。但模型卡从没说基线是前代 —— 它说的是 INT4 对未量化权重，而 K2-Thinking
      没有发布过 BF16 版本，所以这个基线只存在于算式里。按 BF16 基线同口径复算：
      专家 1,014,687,129,600 × 2 B × 8/384 = 42.278 加非专家 21.096 = 63.374 GB/token，
      对实际 32.987 = **1.92 倍**，与卡上 roughly 2x 闭合。
      专家的逻辑参数量有两条独立路径对账：I32 容器 × 8 得 1,014,687,129,600、
      BF16 scale × 32 得 1,014,686,023,680，差 1,105,920（group 32 的补齐余数）。
      卡上还限定了档位，Key Features 原话「lossless 2x speed-up in low-latency mode」——
      low-latency 就是小 batch，而小 batch 恰是非专家占比最高的一档，所以这个 2 倍同时
      说明了天花板在哪：若非专家一起 INT4 则是 3.56 倍。
      顺带把 lossless 标清楚：卡与官方博客都没给未量化侧的评测分，博客只说
      「All benchmark results are reported under INT4 precision」——**无基准**，不可引用
    resolution: corrected
    changed_to: >-
      weight-bandwidth 改写：保留两代 −0.15% 的结论（它回答的是「跨代省不省带宽」这个问题），
      补上「2 倍是对 BF16 基线、且限定 low-latency mode」的复算与 1.92 倍闭合，
      并点明若非专家一起量化则是 3.56 倍。原先「本仓没有依据选一个来源」那句撤掉

  - id: R7
    field: precision.quantization.expert_dtype
    severity: imprecise
    claim: 专家精度记 INT4，与本仓其余 4 bit 记录（FP4 / MXFP4 / NVFP4）并排在同一列里
    finding: >-
      名字一侧核过没问题，且这一格与那三个的差别比名字更深。名字出自模型卡第 4 节标题
      「Native INT4 Quantization」（sources 已引），config 的 weights 段另写 num_bits 4 /
      type int / group_size 32 / symmetric true（2026-10-30 重读卡与 config 核过）。
      **关键区别：FP4 / MXFP4 / NVFP4 的元素都是 E2M1 浮点，本代 type 是 int** ——
      本仓同一列里既有元素格式（FP4）、又有块格式（MXFP4 / NVFP4）、又有本代这种
      另一类元素格式（INT4），三种粒度混在一格。混着不是错（每个名字都来自各自的一手来源），
      但读这一列时不能按「同一个签名的不同叫法」去归并。
      scale 一格顺带核了：BF16 是清单字面的落盘 dtype，与其余记录同口径；
      config 的 weights 段没有 scale_dtype 键，所以这一格纯实测、无声明可引
    resolution: confirmed
    changed_to: 原值保留；expert_dtype 与 per_subsystem_scale 上方各补一条注释，写明名字出处、元素格式是整数而非 E2M1、以及 scale 这一格的口径

  - id: R8
    field: precision.quantization（group_size / group_strategy / activation_scheme）
    severity: missing
    claim: >-
      「量化块（config 声明）」与「激活量化」两格渲染成「未录」，说本仓没查过 config
    finding: >-
      查过了，是**没有字段可填**。这两列原先读的是 FP8 式 config 的键名
      （weight_block_size / activation_scheme），而 compressed-tensors 声明的是
      config_groups.group_0.weights.group_size 32 与 strategy group（block_structure 明写 null），
      激活侧是 config_groups.group_0.input_activations 为 null。
      schema 本轮新增了 group_size / group_strategy 两个字段、activation_scheme 加了 none，
      这三格才有地方落。
      **本代的 none 有两个来源互相印证**：config 的 input_activations 是 null，
      而模型卡第 4 节原话就是 INT4 **weight-only** quantization —— 卡与 config 一致，
      不像 K3 那边卡声明 MXFP8 激活、与 config 矛盾（见 kimi-k3 的 open_questions）。
      顺带记一个定位：input_activations 在 config_groups.group_0 下，不在 quantization_config 顶层；
      而本代的 quantization_config 是在**顶层**的（纯文本模型），从 k2.5 起因为是 VLM 才
      嵌到 text_config 下 —— 这正是取数脚本只读顶层时漏掉 k2.5/k3 而没漏本代的原因
    resolution: corrected
    changed_to: 补 group_size 32 / group_strategy group / activation_scheme none，三格从「未声明」变真值

notes: >-
  K2 线的精度拐点：结构与 kimi-k2-0905 逐位相同（还原打包后参数量一字不差），
  变的只有量化形态 —— INT4 weight-only、group 32、只覆盖路由专家、从 SFT 之后做 QAT。
  这三条原则一直沿用到 K3（K3 换的是格式：INT4 → MXFP4、scale BF16 → U8/E8M0）。
  本记录在 Gate B 上有两项 MISMATCH，根因是 lib/dtypes.py 不认 I32 容器的打包还原，
  不是数据分歧，详见 counting_note 与 review R1。
  released 取 HF 仓的 createdAt 2025-11-04。

