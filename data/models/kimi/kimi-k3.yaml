    visibility: public

bottlenecks:
  - dimension: kv-capacity
    finding: >-
      混合结构，两个分量要分开建模：24 个 MLA 层的 latent KV 随上下文线性增长，
      69 个 KDA 层的递归状态每序列固定。按厂商参考实现的缓存写法（解压后的 K/V）去规划
      会高估 53 倍，要按 latent 存
    quantified: >-
      逐因子。per-token：每 MLA 层 576 元素（kv_a_proj_with_mqa 输出 576 = kv_a_layernorm [512]
      + k_rot 64），× 24 层 = 13824 元素/token，BF16 兜底 27648 B/token、1M 上下文 27.0 GiB。
      per-sequence：每 KDA 层矩阵状态 96 × 128 × 128 = 1,572,864 元素，加 conv 状态
      4 × 36864 = 147,456 元素，合计 1,720,320，× 69 层，BF16 兜底 226.41 MiB/序列。
      两边精度都是 dtype_fallback（config dtype bfloat16）；fla 的递归状态常以 FP32 保存，
      若如此矩阵状态那一项翻倍（见 open_questions）。参考实现的解压缓存是每层
      96×192 + 96×128 = 30720 元素，30720 / 576 = 53.3 倍
    visibility: public
  - dimension: operator-gap
    finding: >-
      三种本仓此前没有的算子同时出现：KDA（fla 的 chunk_kda / fused_recurrent_kda，逐通道衰减
      而非逐头标量衰减），AttnRes（每子层一次块表示打分与加权组合，替代残差相加），
      latent MoE（专家前后各一个 7168↔3584 的稠密投影加一个 norm）。
      latent 投影每 MoE 层常驻 51.4M 参数，92 层共 4.73B，是激活参数里不随 top-k 变的一块
    visibility: public
  - dimension: ep-comm
    finding: >-
      latent MoE 让 dispatch / combine 发生在 3584 维而不是 7168 维上（down_proj 在路由之前、
      up_proj 在合并之后），all-to-all 载荷减半。derive.py 的 ep_communication 按 hidden
      7168 算，是这个模型的上界
    visibility: public

infra_signals:
  - text: >-
      本代（K3）把 MXFP4 当成训练产物而非部署后量化（模型卡称从 SFT 起 QAT），
      且只量化路由专家。按「BF16 发布、部署时自己量化」写的流程在这里要倒过来：
      反量化路径是必需的，BF16 主权重并不存在
    evidence: judgement
    horizon: now
    axis: precision
  - text: >-
      厂商参考实现的 MLA 缓存存的是解压后的 K/V。引擎若照参考实现搭缓存，
      1M 上下文的 MLA 部分会从 27 GiB 涨到约 1.4 TiB（BF16 兜底）；容量规划要按 latent 算
    evidence: judgement
    horizon: now
    axis: attention

