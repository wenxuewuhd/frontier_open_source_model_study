reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 本会话逐字段复算 + 一个独立核查代理
  method: >-
    按 .claude/skills/model-audit 的顺序对 facts/kimi-moonlight-16b 逐字段核：config 全部键、
    完整清单 5344 个张量（dtype 计数、层号 0–26、每层投影形状）、repoinfo 的 tags / cardData /
    createdAt / safetensors tally，以及 data/derived/kimi-moonlight-16b.json 的分项与 KV 公式路。
    本会话独立复算的乘式：MLA 缓存 576/层 × 27 层 = 15,552 元素/token（kv_a_proj_with_mqa
    [576, 2048] 的输出维，不是 2 × 16 × 192 = 6144）、o_proj 入口 16 × v_head_dim 128 = 2048
    （实测 [2048, 2048]）、激活 = 专家 14,394,851,328 × 6/64 + 常驻 1,229,716,288、
    厂商两个声明值的扣除项、all-to-all 2 × 6 × 2048 × 2 B × 26 层。
    结构同源判断另取了 DeepSeek-V2-Lite 的 config 做逐字段比对（来源已列入 sources）。
    另派一个独立核查代理做对抗式复核（它自己写分类正则、不调用 lib/subsystems.py，
    对 5344 条重算了参数分项、KV 七问、两套厂商口径与全部层集合），
    它的三条发现见 R5–R7；它报的计数本会话复算过（含 inv_freq 在四个版本上的长度）。
review:
  - id: R1
    field: hf.sha
    severity: wrong
    claim: sha 写作 4e735b07a89f0d4b73b0f5bde4c88d6318b66cb1
    finding: >-
      这个值是**按 12 位前缀编出来的**，不是真 sha —— 起草时把取数日志里的短 sha 补齐成了
      40 位。真值在 facts/kimi-moonlight-16b/repoinfo.json 与 fetched.json 里，
      是 4e735b07a89f73647dfab71ab91b840f362ede5b（两处一致）。
      同一处错误在 kimi-k2 的 R1 上也发生了一次。编出来的 sha 不影响本仓任何计算，
      但它让记录**不可复现**：按它去 resolve 会 404，而读者无从判断是哪个版本
    resolution: corrected
    changed_to: 取 repoinfo.json 的 sha 原值；另两份新记录逐个核对了 sha 与 fetched.rev 一致
  - id: R2
    field: infra_signals
    severity: overreach
    claim: 「本代就是 DeepSeek-V3 架构的一次换参复现……已经支持 DeepSeek-V2/V3 的平台支持它不需要新算子」
    finding: >-
      方向对、对象错。拿 DeepSeek-V2-Lite 的 config 逐字段比：hidden 2048、27 层、16 头、
      kv_lora_rank 512、q_lora_rank null、qk_nope 128 / qk_rope 64 / v_head_dim 128、
      64 专家 top-6、2 共享、专家中间维 1408、first_k_dense 1、n_group 1、aux_loss_alpha 0.001
      **全部相同**，而 DeepSeek-V3 是 61 层 / hidden 7168 / 256 专家 / q_lora_rank 1536 /
      n_group 8 / first_k_dense 3 —— 形状集来自 V2-Lite 而不是 V3。
      真正来自 V3 的是**路由**：softmax + greedy → sigmoid + noaux_tc（也正是 model_type
      deepseek_v3 与类名 DeepseekV3ForCausalLM 的来源）。
      旁证：模型卡的对照表把 DSV2-Lite 与本代的参数量都写成 2.24B / 15.29B，
      两者实际只差稠密层中间维 10944 → 11264（3 × 2048 × 320 = 1,966,080 参数，取整后看不出来）
    resolution: corrected
    changed_to: >-
      infra_signals 第一条改写成「形状集 = V2-Lite、路由 = V3 式」并列出全部相同项与全部不同项，
      证据口径从 judgement 改成 derived；notes 同步改；sources 增列被比的那份 config
  - id: R3
    field: params.counting_note
    severity: imprecise
    claim: total 15,960,111,936 是实测值，厂商称 16B / A3B
    finding: >-
      原值成立，但漏掉了一件能钉死口径的事：模型卡规格表的 15.29B 与 2.24B
      **两个数都恰好等于「扣掉 embed 与 lm_head」之后的实测值**，各自独立闭合 ——
      15,960,111,936 − 335,544,320 × 2 = 15,289,023,296；
      (14,394,851,328 × 6/64 + 1,229,716,288) − 335,544,320 = 2,243,689,280。
      脚注原文「reported parameter counts exclude the embedding parameters」说的就是这件事，
      而「16B / A3B」这两个名字里的数对应的是含词表口径（15.96B / 2.91B）。
      一份记录里同时有两套口径而不写明，下游跨代比激活参数就会错 —— 而 Kimi-K2 的 32B
      恰恰是另一套口径（见 kimi-k2 的 counting_note）
    resolution: corrected
    changed_to: counting_note 写出两套口径的扣除项与各自的闭合算式，并点明跨代比较前要对齐
  - id: R4
    field: params.total
    severity: imprecise
    claim: 参数总量与权重存储按完整清单求和
    finding: >-
      外部对账成立：HF 的 safetensors tally 与实测 15,960,111,936 **逐位相同**，
      且 tally 只有一个 dtype（BF16），与清单穷举一致 —— 这一版没有 scale 容器、
      没有低位打包，两种口径不会分叉。层号 0–26 连续，无缺分片（fetched.json 的 failed_shards 为空）
    resolution: confirmed
    changed_to: 原值成立，不改

  - id: R5
    field: sources
    severity: imprecise
    claim: 「模型卡的规格表给 Activated Param 2.24B / Total Params 15.29B」
    finding: >-
      出处写串了：这两个数在模型卡 **Performance 一节的横向对照表**里（与 Llama3.2-3B /
      Qwen2.5-3B / DeepSeek-V2-Lite 并列），脚注是
      "The reported parameter counts exclude the embedding parameters"；
      卡里真正的下载/规格表给的是另一套口径的「16B / 3B / 8K」。
      一份卡里两套口径，指错表会让下游去那张表里找不到这个数
    resolution: corrected
    changed_to: sources.note 写明是 Performance 一节的对照表，并把下载表那一套也列出来
  - id: R6
    field: params.counting_note
    severity: missing
    claim: 「清单全是 BF16 权重张量……条目数即张量数、numel 即参数数」
    finding: >-
      字面不成立：每层有一个 self_attn.rotary_emb.inv_freq [64]（27 层共 1,728 个元素），
      它是 buffer 不是权重，参考实现里 persistent=False、长度按 qk_rope_head_dim/2 = 32 算，
      与落盘的 64 既不相等也不会被加载。
      **而且这是整条线的现象**：本代 [64]、Kimi-VL [64]、K2 [56]、K2-0905 与 K2-Thinking [128]，
      没有一个等于 32 —— 按 skill 规则 3 的反面读，「被测量跟着版本变」说明它不由结构决定。
      kimi-k2 那份记录单独点了 [56] 这一个数，却没发现源头在本代、也没发现它每版都变
    resolution: corrected
    changed_to: >-
      counting_note 写明这一类不是权重、列出全线五个长度与参考实现应得的 32，
      并补一条 open question（为什么进 checkpoint、为什么每版变，未查）；
      同时写明 kv_a_layernorm 按本仓归类在 norm 而不在 attention（独立复算会差 13,824 个元素）
  - id: R7
    field: arch.moe.routing
    severity: unsupported
    claim: 「与同期 DeepSeek-V3 的 8 组取 4 不同」
    finding: >-
      「8 组」在仓里有来源（ds-v3 记录的 expert_groups: 8），但**「取 4」没有** ——
      topk_group 这个量本仓没有字段，核查代理在 worktree 的 facts/ 里只看到 kimi 的目录，
      因此报它无来源。本会话到主 checkout 的 facts/ds-v3/cfg.json 里核过：
      n_group 8 / topk_group 4，值成立；但记录里不写出处，下一个人同样找不到
    resolution: corrected
    changed_to: 同一句里补上出处（facts/ds-v3/cfg.json），并点明 ds-v3 的记录只存了 expert_groups 这一半

notes: >-
  Kimi 家族的开源起点，也是本仓这条线的根：月之暗面公开权重的第一个模型（HF 仓创建
  2025-02-22）。config 的 model_type 是 deepseek_v3，而**形状集其实是 DeepSeek-V2-Lite 的**
  （逐字段相同，见 infra_signals 第一条），路由换成了 V3 式的 sigmoid + noaux_tc；
  自己的东西是 Muon 优化器、163840 的词表与位置设置。
  模型卡的对照表把 DSV2-Lite 与本代的参数量都写成 2.24B / 15.29B，也印证了这件事
  （两者只差稠密层中间维 10944 → 11264，约 2M 参数，取整后看不出来）。往后分三支：旗舰线 Kimi-K2 把它放大到 1T（61 层 / hidden 7168 / 384 专家），
  视觉线 Kimi-VL 在同一主干上挂 MoonViT，而混合注意力线 Kimi-Linear 复用的是本代的
  「q 侧不降维」MLA 写法而不是 K2 的两段式。
  released 取 HF 仓的 createdAt（2025-02-22）；lastModified 2026-01-30 只是后来的仓库维护。

open_questions:
  - >-
    KV cache 的实际存储精度未披露，derive.py 按模型 dtype（BF16）兜底，
    bytes_basis 是 dtype_fallback，不能和别家的精确计数比倍数
