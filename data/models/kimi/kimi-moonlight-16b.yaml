params:
  total: 15960111936.0
  breakdown:
    expert: 14394851328.0
    shared_expert: 449839104.0
    attention: 371590848.0
    embed: 335544320.0
    lm_head: 335544320.0
    dense_ffn: 69206016.0
    router: 3409536.0
    norm: 126464.0
  counting_note: >-
    total 与 breakdown 都是本仓按完整清单（5344 个张量）逐项求和的实测值，不是厂商声明值 ——
    所以 Gate B 的参数总量一项（delta 0.0）是实测比实测；真正的外部核对是 HF 的 safetensors
    tally，与实测 15,960,111,936 逐位相同。清单全是 BF16：没有量化 scale 容器、没有低位打包，
    所以 numel 即参数数。**严格说有一类不是权重**：每层一个
    self_attn.rotary_emb.inv_freq [64]（27 层共 1,728 个元素），参考实现里它是
    persistent=False、长度按 qk_rope_head_dim/2 = 32 算，与落盘的 64 既不相等也不会被加载。
    整条 Kimi 线都在存这个 buffer 且长度每版都变（本代 64、Kimi-VL 64、K2 56、
    K2-0905 与 K2-Thinking 128，没有一个等于 32），两侧 tally 都算了它、不影响对账 ——
    但「清单全是权重」这句话字面不成立。另外复算 attention 分项时注意
    kv_a_layernorm [512] 按本仓归类在 norm 而不在 attention（自己按名字算进去会多
    27 × 512 = 13,824 个元素）。没有 MTP 草稿块（config
    num_nextn_predict_layers 0，层号止于 26），所以没有 excludes。
    **厂商的两个声明值都不含两张词表矩阵**，各自独立闭合：15,960,111,936 − embed 335,544,320
    − lm_head 335,544,320 = 15,289,023,296，对上模型卡的 15.29B；激活侧
    专家 14,394,851,328 × 6/64 = 1,349,517,312 加常驻 1,229,716,288 得 2,579,233,600，
    再扣 lm_head 得 2,243,689,280，对上模型卡的 2.24B（脚注「reported parameter counts
    exclude the embedding parameters」）。名字里的「16B / A3B」则是含词表口径的取整
    （15.96B / 2.91B）。两套口径差 lm_head 一项，比较时要对齐

context:
  max: 8192
  extension_method: >-
    无。config 没有 rope_scaling，RoPE theta 50000 原生 8K ——
    本代是全族系上下文最短的一版，长上下文从下一代（Kimi-VL 的 128K）才开始

arch:
  layers: 27
  hidden: 2048
  vocab: 163840
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: SwiGLU（config hidden_act silu，gate/up/down 三件套）
  position: RoPE theta 50000，无外推

  attention:
    type: MLA
    num_heads: 16
    num_kv_heads: 16
    head_dim: 192
    v_head_dim: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    head_dim_note: >-
      num_kv_heads 16 是 query 侧可见的头数，不是缓存宽度：落盘缓存是
      kv_a_proj_with_mqa [576, 2048] 的输出维 576（latent 512 经 kv_a_layernorm [512]
      + 解耦 rope 64），按 2 × 16 × 192 = 6144 折算会高估 10.7 倍。
      head_dim 192 不是 config 字段，是 qk_nope 128 + qk_rope 64，只管 QK 路径；
      V 的每头维度是 v_head_dim 128，所以 o_proj 入口宽度是 16 × 128 = 2048
      （实测 [2048, 2048]），按 192 推会得到 3072 —— 高 50%。
      **本代 Q 侧没有降维**：q_lora_rank 为 null，q_proj 是 [3072, 2048] 的单段投影，
      27/27 层零例外。q_a_proj / q_b_proj 的两段式从 Kimi-K2 才出现
    layer_pattern: 27/27 层都是 MLA，没有线性注意力层，也没有滑窗或稀疏选块

  ffn:
    type: moe
    layer_pattern: >-
      L0 稠密（mlp.gate_proj [11264, 2048]），L1–L26 共 26 层 MoE。
      稠密层的中间维 11264 是单个专家（1408）的 8 倍

  moe:
    routed_experts: 64
    shared_experts: 2
    top_k: 6
    intermediate: 1408
    dense_intermediate: 11264
    first_k_dense: 1
    expert_groups: 1
    routing: >-
      sigmoid 打分、noaux_tc 选路（topk_method），routed_scaling_factor 2.446，
      norm_topk_prob true。n_group 与 topk_group 都是 1，**分组路由实际未启用** ——
      与同期 DeepSeek-V3 的 8 组取 4 不同（n_group 8 / topk_group 4 取自同仓
      facts/ds-v3/cfg.json；ds-v3 的记录里只存了 expert_groups 8 这一半），
      本代一个 token 的专家可以落在任意设备上
    balance: >-
      e_score_correction_bias（每 MoE 层一个 [64]，与 aux_loss_alpha 0.001 / seq_aux 并存）。
      注意这一版的 bias 张量落盘是 **BF16**，到 Kimi-K2 才改成 FP32
    storage_note: >-
      逐专家独立张量（experts.N.{gate,up,down}_proj），不是堆叠的 3 维权重，
      grouped GEMM 因此吃 2 维权重列表。两个共享专家在清单里合并成一个 MLP
      （shared_experts.gate_proj [2816, 2048]，2816 = 2 × 1408）

  decoding:
    mtp_layers: 0
    mtp_layers_note: config num_nextn_predict_layers 0，清单里也没有任何草稿块

precision:
  weights_release: [BF16]
  quantization:
    per_subsystem:
      expert: BF16
      shared_expert: BF16
      attention: BF16
      dense_ffn: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
    subsystem_method: >-
      对完整清单 5344 条穷举（不是抽样）：**全部 BF16，零例外**，没有一个 scale 容器、
      没有一个 FP32 张量。所以这一代的「权重精度」只有一个值，量化线从下一代才开始分叉

infra_signals:
  - text: >-
      结构不是自研的：**形状集与 DeepSeek-V2-Lite 逐字段相同** —— hidden 2048、27 层、
      16 头、kv_lora_rank 512、q_lora_rank null、qk_nope 128 / qk_rope 64 / v_head_dim 128、
      64 专家 top-6、2 共享、专家中间维 1408、first_k_dense 1、n_group 1 全部一致
      （两份 config 逐字段比过）；换掉的是**路由**（softmax + greedy → sigmoid + noaux_tc，
      即 V3 式，对应 model_type deepseek_v3 与类名 DeepseekV3ForCausalLM）、
      词表（102400 → 163840）、稠密层中间维（10944 → 11264）与位置设置
      （theta 10000 + YaRN → theta 50000、无 scaling、8K）。
      所以算子侧：已经支持 DeepSeek-V2-Lite 形状的平台跑本代不需要新算子，
      唯一的增量是 sigmoid + noaux_tc 的打分路径。论文的贡献在优化器（Muon），不在结构
    evidence: derived
    horizon: settled
    axis: training
  - text: >-
      MLA 把每层每 token 的缓存压到 576 个元素，27 层合计 15,552 元素/token；
      但本代上下文只有 8K，满上下文的注意力显存不到 0.25 GiB —— 这一代的瓶颈
      不在 KV，而在 14.4B 的专家权重带宽（全量 15.96B 里 90.2%）
    evidence: derived
    horizon: settled
    axis: attention

