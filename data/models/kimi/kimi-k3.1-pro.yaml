reviewed:
  date: '2026-11-18'
  scope: [official, derived, judgement]
  reviewer: 本会话复算（p1-kimi），差分口径
  method: >-
    这份记录的主线是与 kimi-k3 的差分，所以复核也按差分做，**先用最省力的判据**
    （model-audit skill 取数顺序第 1 条）：张量名族集合。
    归一化层号与专家号后 K3 59 族、本代 64 族，**K3 独有 0 族**、新增 5 族全在
    self_attn.indexer 下；条目数 497,220 → 497,340 恰好 +120 = 24 × 5。
    再按全名逐条比：497,220 个共有张量的**形状与 dtype 零差异**——
    所以凡与 K3 相同的格子，判据是「同一份形状」，不是重新推导。
    本会话自己复算的是：
    (1) 参数量四条独立闭合（本仓清单求和 / HF tally 的 BF16 项差额 / 逐层 7,438,592 × 24 /
    index.json 的 total_size 差额 357,052,416 B），与 HF tally 差 +0；
    (2) 逐桶对比 —— 只有 indexer（新）与 norm（+6,144）两桶变化，其余 9 桶逐位相同；
    (3) indexer 五族在**全部 24 层**的形状与 dtype 取值（各只有一种），
    不是只读一个分片的头；
    (4) DSA 层集合三路印证（config 1 起计的 dsa_layers 减 1、清单里 indexer.wk 的层、
    清单里 kv_a_proj_with_mqa 的层，三者完全相同；且与 69 个 q_conv1d 层不相交）；
    (5) 索引缓存宽度取 wk 输出维 128，并算出按头数乘积会高估 32 倍；
    (6) ignore 作用域按**模块名**比（剥参数后缀），确认本代新增两条生效 92/92、
    三类 _res_proj 两代都是 0 覆盖；
    (7) 视觉塔的主干分母重算（激活参数变了），换算仍是 585。
    **没有复核的**：Tech Blog 正文（JS 渲染，未读）；索引 K 的实际缓存行为与
    index_skip_topk_offset 的语义（本代无参考实现，形状判不出来）。
    本轮没有派独立核查代理 —— 差分口径下 97% 的格子由「形状零差异」直接继承，
    新增部分只有 5 个张量族，自己逐族读过形状与 dtype

review:
  - id: R1
    field: params.total
    severity: wrong
    claim: 调研阶段报的是推算值 2,780,110,363,392（K3 实测 + 24 × 7,438,592）
    finding: >-
      调研那一轮只实读了 layer 3 一个分片的头，其余 23 层按「名族相同」推。
      **推算值不能进 params.total** —— 本仓最贵的那类错正是「验了一个因子就报出去」。
      本轮取了全量清单（96 分片 497,340 条目）实测，结果与推算值相同，
      但现在它是实测值且有四条闭合，其中两条是外部锚（HF tally 的分 dtype 计数、
      index.json 的 total_size）。顺带确认推算成立的前提也是真的：
      497,220 个共有张量形状与 dtype 零差异、indexer 五族在全部 24 层形状取值各只有一种
    resolution: corrected
    changed_to: >-
      params.total 2780110363392 为**实测**（本仓清单求和，与 HF tally 差 +0），
      counting_note 写明四条闭合
  - id: R2
    field: arch.attention.sparse.index_kv_dim
    severity: missing
    claim: 若只填 index_n_heads 32 与 index_head_dim 128，derive.py 会按乘积 4096 算索引缓存
    finding: >-
      derive.py 的 indexer 分量在缺 index_kv_dim 时按 index_n_heads × index_head_dim
      算宽度，并把状态降级成 partial、给元素数打 elements_upper_bound。
      本代那个乘积是 4096 而实测宽度是 128（indexer.wk 的输出维），**高估 32 倍**——
      1M 上下文下索引缓存会从 6.00 GiB 报成 192 GiB。
      skill 的缓存提问第 2 条点名的就是这个错，本代的因子恰好是 32
    resolution: corrected
    changed_to: >-
      填 index_kv_dim 128 并在 index_kv_source 写明取自哪个张量的哪一维、
      以及乘积是 32 倍上界；同时填 kv_sharing.index_kv_source_layers（24 个层号，实测），
      让 derive.py 走 index_kv_source_layers 这一路而不是「全部层」上界
  - id: R3
    field: bottlenecks（kv-capacity）与 lineage 的 benefit
    severity: imprecise
    claim: 初稿把 DSA 的收益写成「长上下文更省」
    finding: >-
      方向说反了一半。读取量确实降（每 query 从全部历史降到 2048 个条目），
      但**容量是涨的**：多存一条 128 维索引键，per-token 13,824 → 16,896 元素，
      1M 上下文 27.00 → 33.00 GiB（两侧同为 dtype_fallback，可比）。
      而且索引打分本身是稠密的、随上下文线性增长，所以长上下文下真正没被降下来的是索引那一路。
      派生页会照着这句话说，写反一次会传播
    resolution: corrected
    changed_to: >-
      kv-capacity 与 long-context 两条 bottleneck 都写成两路分记，
      lineage 的 benefit 明写「省的是读带宽与注意力算力，不是容量」
  - id: R4
    field: arch 里继承自 kimi-k3 的若干 note
    severity: imprecise
    claim: 初稿把 K3 记录里取自参考实现的结论（KDA 状态布局、AttnRes 数据流、MoE 打分精度）原样搬了过来
    finding: >-
      这些张量两代逐位相同，但**那些结论的来源是 K3 随仓的 modeling_*.py，
      而本代仓里一个 modeling 文件都没有**。按 skill 规则 12，形状判得出来的照搬成立
      （有哪些张量、什么形状、块大小 12、A_log 首维是 head_dim），
      形状判不出来的（状态在内存里怎么排、AttnRes 的加权组合发生在哪一步、
      打分是否转 FP32）在本代没有实现作证，证据强度比 K3 低一档。
      **「权重相同」不等于「上一代读实现得到的结论自动继承」** —— 实现可能换了，
      而本代没有东西能证明它没换
    resolution: corrected
    changed_to: >-
      三处分别改写：state_layout_note 与 residual.note 写明「本代无参考实现、不回填」，
      moe.routing 去掉 FP32 打分那半句；evidence 里
      arch.attention.linear_state.state_layout_note 从 derived 降为 judgement

notes: >-
  Kimi 家族的新旗舰，model_type kimi_k31（语言主干仍是 kimi_linear），原生多模态。
  与 kimi-k3 的关系是**后训练延续加一处机制替换**：卡自述「Post-trained from Kimi K3」、
  「the first model in the K3.1 series」，而权重上 497,220 个共有张量零差异、
  新增的只有 24 个全注意力层上的索引器。HF 上没有非 Pro 的 Kimi-K3.1，
  这是 K3.1 线唯一的发布（扫过 moonshotai 全部 20 个仓）。
  旗舰从 K3 换到本代的判据是三条而**不是日期新**：新机制、名族严格超集（K3 独有 0 族）、
  厂商自述后训练延续。对照本仓 ds-v4-pro 判 side 的理由恰好相反 ——
  那一份的名族集合与 V4-Flash 完全相同、无新增算子类型，是同代大号版本。
  **「Pro」这个词在两家含义不同，不能按词判。**
  released 取 HF 的 createdAt 2026-11-02；lastModified 2026-11-05 是改动不是发布，
  与本仓 deepseek 那条同一判法

open_questions:
  - >-
    **激活精度三方不一致，这本身是结论。** 卡的规格表 Quantization 行声明
    「MXFP4 weights / MXFP8 activations (quantization-aware training)」；
    config 声明不量化激活（text_config.quantization_config.config_groups.group_0 的
    input_activations 是 null，顶层 kv_cache_scheme 也是 null，两个键不在同一层）；
    落盘清单里没有任何激活 scale 张量。字段 activation_scheme 填的是 config 说的那个值
    none，三方的差异放在这里。与 kimi-k3 同一形态，本代无技术报告可判
  - >-
    索引 K 是否真的被缓存，本代判不出来。本仓 derive.py 按「缓存」算（沿用 GLM-5.3 的处置，
    索引 K 要与全部历史比较，重算的代价是每步重跑 wk），但这条**没有一手来源**：
    本代没有技术报告、仓里也没有 modeling_*.py。若实现选择重算，
    per-token 容量就回到 K3 的 27,648 B 而读带宽另算 —— 这一格直接决定 22.2% 那个结论
  - >-
    index_topk_freq 1 与 index_skip_topk_offset 1 的确切语义未核。freq 1 按字面是
    每个 DSA 层各算一次 top-k（实测 24 层都有完整的 indexer 五族，与此一致）；
    offset 1 判不出来。GLM-5.3 那边 freq 4 / offset 3 与实际层集合的对应关系
    也在它自己的 open_questions 里
  - >-
    KV 与索引 K、递归状态的落盘精度都未披露，三个分量都按 config dtype bfloat16 兜底。
    旁证偏向 FP32 的只有 KDA 那一路（A_log / dt_bias / o_norm / q,k,v_conv1d 在清单里是 F32）。
    索引 K 这一路连旁证都没有
  - >-
    预训练数值格式无一手声明，precision.training 不填。卡的
    「quantization-aware training」说的是 SFT 之后，不能当预训练精度。
    本代**没有技术报告**，所以 K3 那份报告 §4.1.4 关于量化作用域与 QAT 覆盖
    SFT+RL 的说法**不往本代回填** —— 作用域本代可以从 config 的 ignore 列表读，
    「从 SFT 起 QAT」只有卡上一句
  - >-
    Tech Blog（www.kimi.ai/blog/kimi-k3-1-pro）本轮未读（JS 渲染）。
    它可能带 DSA 的机制描述或部署建议；读了之后若与本记录的形状结论冲突，
    按本仓源优先级，形状赢
