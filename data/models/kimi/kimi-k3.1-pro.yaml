      **本轮未读**（JS 渲染，curl 取不到正文），登记它存在以免下一轮重复找。
      本记录没有任何字段依赖它

hf:
  repo: moonshotai/Kimi-K3.1-Pro
  sha: d9e99b0792a5e93b78ea9bea62a68167e36ddd9e
  last_modified: '2026-11-05T07:11:43.000Z'
  pipeline_tag: image-text-to-text
  gated: false

lineage:
  track: main
  predecessor: kimi-k3
  changed_from_predecessor:
    - axis: attention
      text: >-
        **唯一的结构变化**：那 24 个全注意力层从 Gated MLA 换成 Gated DSA，即在 MLA 之上
        加一个稀疏索引器。69 个 KDA 层一字未动，24 个 DSA 层的 MLA 部分也一字未动
        （kv_a_proj_with_mqa / kv_b_proj / q_a_proj / q_b_proj / o_proj / g_proj 形状与 dtype
        与 K3 逐位相同），新增的只有 self_attn.indexer 五族：
        wk [128, 7168]、wq_b [4096, 1536]、weights_proj [32, 7168]、
        k_norm.weight [128] 与 k_norm.bias [128]，全部 BF16。
        config 新增 dsa_config（index_topk 2048、index_head_dim 128、index_num_heads 32、
        index_rope_dim 0、index_k_norm_type layernorm、index_topk_freq 1、
        index_skip_topk_offset 1）。
        厂商在规格表脚注 `*` 自述了这一条：「Compared with Kimi K3, we replace the
        full-attention Gated MLA layers with Gated DeepSeek Sparse Attention (Gated DSA)
        layers for more efficient long-context modeling」。
        **「Gated」不是新东西** —— K3 的 mla_use_output_gate 本来就是 true，
        g_proj [12288, 7168] 在本代 DSA 层上仍然在；新增的只有 indexer
      benefit: >-
        每 query 的注意力读取量从「全部历史」降到 index_topk 2048（1M 上下文下从最多
        1,048,576 个条目降下来）。
        **但容量是涨的，方向与「稀疏省显存」相反**：多存一条 128 维索引键，
        per-token 从 13,824 元素涨到 16,896（+22.2%），1M 上下文 BF16 兜底口径
        27.00 GiB → 33.00 GiB（两侧同为 dtype_fallback，可比）。
        省的是读带宽与注意力算力，不是容量。
        而且索引打分本身是稠密的：每 query 要对全部历史的 128 维索引键打分，这一路不随 top-k 降
    - axis: scale
      text: >-
        总参数 2,779,931,837,184 → 2,780,110,363,392（+178,526,208，+0.0064%），
        全部来自 indexer；激活参数（带宽口径）104,188,274,432 → 104,368,141,056
        （+178,526,208，增量**全部常驻**）。层数、hidden、专家数、top-k、共享专家、
        latent 维、上下文长度、视觉塔**全部未变**
      benefit: >-
        规格上这一代几乎没有放大 —— 参数只多 0.0064%，而机制换了一处。
        **厂商声明值分辨不出这两代**：卡上 2.8T / 104B 与 K3 卡上逐字相同
        （实测 2.7799T → 2.7801T 都取整到 2.8T，104.19B → 104.37B 都取整到 104B），
        只有权重清单能分辨

params:
  total: 2780110363392.0
  breakdown:
    expert: 2722740830208.0
    attention: 36190737024.0
    shared_expert: 12155092992.0
    dense_ffn: 5453643776.0
    lm_head: 1174405120.0
    embed: 1174405120.0
    router: 590955008.0
    vision: 447358976.0
    indexer: 178520064.0
    norm: 3074688.0
    residual: 1340416.0
  counting_note: >-
    按完整权重清单（96 分片 497,340 条目）逐项统计。497,340 里 247,296 条是路由专家的
    weight_scale（U8 容器，MX 的逐 32 元素 scale）—— 不计入参数、只计入权重存储；
    真权重张量 250,044 条。路由专家的 weight_packed 是 U8 容器、每字节两个 FP4，
    参数量按 2 还原，字节不还原（同 K3）。
    total 是本仓按清单求和的**实测值**，含视觉塔与投影（0.45B），与 HF 平台的 safetensors
    tally 2,780,110,363,392 **逐位相同**（差 +0）—— HF 那边同样还原了打包、同样排了 scale。
    **本代新增那 178,526,208 有四条互相独立的闭合**，任一因子错都会错开：
    (1) 本仓按清单求和 2,780,110,363,392；
    (2) HF tally 的 BF16 一项 57,179,884,544 → 57,358,410,752，差恰为 178,526,208，
    而 U8 项（2,722,740,830,208）与 F32 项（11,122,432）两代**逐位未变**；
    (3) 逐层 128×7168 + 4096×1536 + 32×7168 + 128 + 128 = 7,438,592，× 24 层 = 178,526,208；
    (4) model.safetensors.index.json 的 total_size 1,561,217,377,280 − K3 的
    1,560,860,324,864 = 357,052,416 B = 178,526,208 × 2 B（全 BF16）。
    这一处同时证了五个张量的形状、层数 24、以及精度就是 BF16。
    注意 breakdown 的 indexer 一栏是 178,520,064 而不是 178,526,208：两个 k_norm [128]
    按本仓「带 norm 的就是归一化，没有例外」归到 norm 桶（+6,144），两栏相加才是 178,526,208。
    除这两栏外，其余 9 个桶与 kimi-k3 **逐位相同**（expert / attention / shared_expert /
    dense_ffn / lm_head / embed / router / vision / residual 全部 +0）。
    归类上 block_sparse_moe.routed_expert_{down,up}_proj 仍记在 dense_ffn，口径与 K3 一致
    （理由见那份记录的同一字段）。
    厂商声明值：卡原文「2.8T」总参数、「104B」激活、视觉编码器「401M」——
    实测总量比 2.8T 低 0.71%（取整）；视觉 447.36M = 编码器 401.2M + mm_projector 46.1M，
    与 401M 对得上编码器那一半（视觉塔与 K3 逐张量相同，这一条照搬）。
    「3T-class」是卡正文的宣传措辞，不是口径，没有进任何字段。
    **激活参数（带宽口径：含 lm_head、不含输入词表、不含视觉塔，路由专家按 16/896 折算、
    其余按常驻）实测 104,368,141,056**；与 K3 同口径的 104,188,274,432 相差 178,526,208，
    就是 indexer —— **它全部常驻**：24 个 DSA 层每 token 必过，wk / wq_b / weights_proj
    三个投影都不随 top_k 变，top_k 只决定 MLA 读多少条目、不决定索引算多少。
    再含输入词表是 105,542,546,176（取整 106B）。与 kimi-k3 一样不填 params.active_decode，
    激活值由 derive.py 从清单与 top_k 算，两代同一条路径才可比

context:
  max: 1048576
  extension_method: >-
    无。全模型 NoPE —— config 里没有 rope_theta、没有 rope_scaling，MLA 层仍是
    mla_use_nope=true，本代新增的索引路也不旋转（dsa_config.index_rope_dim 0）。
    1M 是原生训练长度，部署期没有 YaRN / NTK 这类外推旋钮

arch:
  layers: 93
  hidden: 7168
  vocab: 163840
  norm: RMSNorm
  norm_eps: 1.0e-05
  activation: >-
    SiTU-GLU（config hidden_act situ，卡上写 SiTU-GLU）：activation_situ_beta 4.0、
    activation_situ_linear_beta 25.0，与 K3 的两个 β 逐位相同。
    本代没有参考实现可读，所以不重复 K3 记录里那条取自 SituAndMul 的算式细节
  position: >-
    MLA 层不用位置编码（mla_use_nope=true）；KDA 层靠短卷积与递归状态携带位置信息；
    本代新增的索引路同样不旋转（index_rope_dim 0）。三路都没有 RoPE

  attention:
    type: hybrid
    num_heads: 96
    num_kv_heads: 96
    head_dim: 192
    v_head_dim: 128
    qk_rope_head_dim: 64
    qk_nope_head_dim: 128
    kv_lora_rank: 512
    q_lora_rank: 1536
    head_dim_note: >-
      MLA 部分与 K3 逐张量相同：每头 QK 192（nope 128 + 名为 rope 的 64，本代同样不旋转）、
      V 128。q_b_proj [18432, 1536] = 96×192，kv_b_proj [24576, 512] = 96×(K-nope 128 + V 128)，
      o_proj [7168, 12288] = 96×128；按 head_dim 192 推 o_proj 入口会高 50%。
      num_kv_heads=96 是 query 侧可见的头数，不是缓存宽度：最小缓存是
      kv_a_proj_with_mqa [576, 7168] 的输出 —— 512 维 latent 经 kv_a_layernorm [512]、
      加 64 维 k_rot，每层 576。
      KDA 层：q/k/v_proj 都是 [12288, 7168] = 96 头 × 128，o_proj 同上。
      **本代多一路索引**，宽度另算，见 sparse
    layer_pattern: >-
      69 KDA + 24 Gated DSA。DSA 层在 L3, L7, …, L87, L91, L92（0 起计，每 4 层一个、
      最后两层连续），其余 69 层是 KDA。层集合**三路互相印证**：
      config 的 dsa_config.dsa_layers 与 linear_attn_config.full_attn_layers 都是
      [4, 8, …, 92, 93]（**1 起计**，减 1 后与实测一致）；清单里 indexer.wk 恰在这 24 层、
      kv_a_proj_with_mqa 也恰在这 24 层、两个集合**完全相同**；q_conv1d 恰在其余 69 层、
      与前者不相交。按 0 起计读 config 会得到一个不存在的 L93 并把 L3 认成 KDA
    sparse:
      mechanism: >-
        Gated DSA：在 24 个全注意力层的 MLA 之上加一个稀疏索引器，每 query 只读
        index_topk 2048 个条目。index_topk_freq 1 ⇒ **24 层各自算一次 top-k，没有跨层复用**
        （对照 GLM-5.3：那边 freq 4、21/78 层产出、57 层复用上游的选择结果）。
        index_skip_topk_offset 1 的确切语义本代判不出来（无参考实现），见 open_questions。
        索引 Q 逐头：wq_b [4096, 1536] = 32 头 × 128，从 q_a 的 1536 维 latent 出，不缓存。
        逐头打分权重走 weights_proj [32, 7168]（输出 32 = index_num_heads）。
        index K 过一个**真 LayerNorm**（k_norm 带 bias [128]，不是 RMSNorm，
        与 config 的 index_k_norm_type layernorm 一致 —— 本仓其余几份 DSA 记录没有这一条，
        钉在本代）
      index_n_heads: 32
      index_head_dim: 128
      index_topk: 2048
      index_kv_dim: 128
      index_kv_source: >-
        language_model.model.layers.N.self_attn.indexer.wk.weight [128, 7168]，输出维 128。
        **index_n_heads × index_head_dim = 32 × 128 = 4096 是 32 倍的上界**：
        index K 在 32 个 index 头之间共享（MQA 式），不是逐头。
        这一代的高估因子恰好是 32，按乘积算每 token 会得到 98,304 元素而不是 3,072
    kv_sharing:
      index_kv_source_layers: [3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43, 47, 51, 55, 59, 63, 67, 71, 75, 79, 83, 87, 91, 92]
      layer_coverage: >-
        三类缓存的覆盖面各不相同，不能统称「逐层」。层号都是 0 起、主干口径（0–92）：
        MLA latent 在 24 层（上列那 24 个，每层 kv_a_proj_with_mqa [576, 7168]，无跨层共享）；
        **索引 K 在同样那 24 层**（每层 indexer.wk [128, 7168]，按全名正则穷举过、不是抽样，
        与 MLA 层集合完全相同 —— 本代没有「只重打分、不产出 index K」的层，
        因为 index_topk_freq 是 1）；KDA 递归状态在其余 69 层，每序列固定。
        无 MTP 块，主干口径就是全部口径
    output_gate:
      enabled: true
      type: >-
        93/93 层都有 self_attn.g_proj [12288, 7168]：DSA 层是 sigmoid 输出门
        （mla_use_output_gate，即卡上「Gated DSA」的 Gated），KDA 层是满秩门，两者同形不同义。
        与 K3 逐张量相同
    hybrid:
      layer_types_count:
        linear: 69
        full: 24
      note: >-
        24 个 DSA 层累积**两份** per-token 缓存（MLA latent 576 + 索引 K 128，共 704 元素/层），
        69 个 KDA 层携带每序列固定的递归状态。无 MTP 块。
        K3 同一栏只有 latent 一份 —— 本代多出来的那一份是容量涨 22.2% 的全部来源
    linear_state:
      mechanism: >-
        Kimi Delta Attention（KDA）：带逐通道衰减门的 delta rule 线性注意力，q/k/v 各自
        先过一个 depthwise 短卷积（kernel 4）。与 K3 逐张量相同
      num_key_heads: 96
      num_value_heads: 96
      key_head_dim: 128
      value_head_dim: 128
      conv_kernel_dim: 4
      state_layout_note: >-
        KDA 这一路的张量与 K3 **逐位相同**（69 层 q/k/v_conv1d 都是 [12288, 1, 4]，
        A_log [128]、dt_bias [12288]、o_norm [128]、f_a_proj [128, 7168]、
        f_b_proj [12288, 128]、b_proj [96, 7168]），所以 K3 记录里那套判据原样成立：
        A_log 首维 128 是 **head_dim** 不是头数，头数走 b_proj 的 96，
        逐 (头, 通道) 的量走 12288 = 96×128；衰减标度逐通道、在 96 头间广播。
        **不能照 Qwen3.8 那条「A_log 首维 = 状态头数」的推断读本代。**
        状态布局（每层 [96, 128, 128] 加三份 conv 状态）在 K3 上是从参考实现读的，
        **本代没有参考实现可读** —— 布局本身按形状判不出来，所以这一条的证据强度
        比 K3 那份低一档，见 open_questions

  ffn:
    type: moe
    layer_pattern: >-
      L0 稠密（mlp.gate_proj [33792, 7168]），L1–L92 共 92 层 MoE，latent 式：
      路由专家在 3584 维上算（routed_expert_down_proj [3584, 7168] 先把 hidden 降到 3584，
      经专家后 routed_expert_norm [3584] 再由 routed_expert_up_proj [7168, 3584] 升回）；
      共享专家不走 latent，直接吃 7168 维 hidden。与 K3 逐张量相同

  moe:
    routed_experts: 896
    shared_experts: 2
    top_k: 16
    intermediate: 3072
    first_k_dense: 1
    dense_intermediate: 33792
    routing: >-
      sigmoid 打分、noaux_tc 选路，routed_scaling_factor 1.0，moe_renormalize；
      num_expert_group 1 / topk_group 1，分组路由实际未启用。gate.weight 落盘是 BF16。
      与 K3 的 config 逐键相同；K3 记录里「参考实现把 hidden 与 gate 权重转 FP32 再打分」
      那一条取自参考实现，**本代无实现可读，不回填**
    balance: e_score_correction_bias（每 MoE 层一个 [896] FP32）
    storage_note: >-
      逐专家独立张量（experts.N.w1/w2/w3，各带 weight_packed 与 weight_scale），不是堆叠的
      3 维权重。专家形状是 latent 维的：w1/w3 逻辑 [3072, 3584]、w2 [3584, 3072]。
      两个共享专家在清单里合并成一个 MLP（shared_experts.gate_proj [6144, 7168]，
      6144 = 2 × 3072）。与 K3 逐位相同（expert 桶两代参数量差 0）

  residual:
    type: AttnRes（Attention Residuals，厂商命名；块大小由 attn_res_block_size=12 给出）
    coef_proj: >-
      每层 self_attention_res_proj 与 mlp_res_proj 各一个 [1, 7168]，另有模型级
      output_attn_res_proj [1, 7168]；对应的 *_res_norm [7168] 是 RMSNorm。
      187 个模块，与 K3 逐位相同
    note: >-
      attn_res_block_size 12，与 K3 相同。本代**没有参考实现可读**，所以 K3 记录里那套
      数据流结论（块边界累加、softmax 加权、替代的是块边界而非残差相加本身）
      **不往本代回填** —— 形状判得出来的只有「有这些系数张量、块大小 12」。
      decode 侧的保活量按形状可算：每 token 最多 8 × 7168（BF16 114,688 B = 112 KiB），
      8 是 93 层里 layer_idx % 12 == 0 的层数（L0/12/24/36/48/60/72/84）

  decoding:
    mtp_layers: 0
    mtp_layers_note: >-
      config num_nextn_predict_layers 0，清单里也没有任何草稿块
      （mtp / draft / eagle / eh_proj / enorm / hnorm / shared_head 全名正则穷举，两代都是 0 个）

  vision:
    encoder: MoonViT-V2（vision_tower.encoder.blocks），模型卡称 401M
    layers: 27
    hidden: 1024
    num_heads: 12
    patch_size: 14
    intermediate: 4096
    out_hidden: 7168
    params: 447358976.0
    fusion: >-
      mm_projector（patchmergerv2，merge_type sd2_tpool）：proj.0 [4096, 4096]、
      proj.2 [7168, 4096]，即先把 2×2 相邻 patch 拼成 4096 维、两层 MLP 投到 7168；
      另有 post_norm [7168]。wqkv [4608, 1024] = 3 × 1536（qkv_hidden_size 1536，比 hidden 1024 宽）
    spatial_merge_size: 2
    tokens:
      reference_resolution: 672x672
      patch_grid: 48x48
      encoder_tokens: 2304
      llm_tokens: 576
      compression_ratio: 4
      compression_stage: >-
        projector 入口一步到位：2×2 相邻 patch 在通道维拼接（proj.0 的输入维
        4096 = 4 × 1024 就是这个拼接，config 的 merge_kernel_size [2, 2] 是同一件事），
        压缩在两层 MLP 之前，所以 projector 的两个 GEMM 只跑 576 次而不是 2304 次
      dynamic_resolution: true
      derivation: >-
        **视觉塔与 kimi-k3 逐张量相同**：vision_config 逐键相同，168 个视觉张量的形状与
        dtype 零差异。所以 patch 14（由 patch_embed.proj.weight [1024, 3, 14, 14] 的后两维印证）、
        2×2 空间合并（由 proj.0 输入维 4096 = 4 × 1024 印证）、672/14 = 48、48² = 2304、
        24² = 576 这条链原样成立。
        注意 4096 = 4 × 1024 而不是 4 × 1152 —— 塔 hidden 是 1024（kimi-k2.5 是 1152）
      scope_note: >-
        上面的数覆盖单张静态图。vision_config 带 init_pos_emb_time 4 与 merge_type sd2_tpool，
        时间池化的机制在；但本代**既没有 video_attn_type 这个键、也没有任何参考实现**，
        所以视频的 token 账留空，k2.5 上那条「视频主干 token 数与帧数无关」不回填
    prefill:
      encoder_linear_gflops: 1829.2
      projector_linear_gflops: 53.15
      backbone_token_budget: 576
      backbone_linear_gflops_per_token: 206.39
      image_as_text_tokens: 585
      attention_excluded: >-
        被排除的是 encoder 自注意力的 QK^T 与 AV。wqkv [4608, 1024] = 3 × 1536，
        所以那两个 matmul 按 1536 而不是 1024 算（按 hidden 1024 算会低估 1/3）。
        跨度没有一手来源，按整图一段取 n = 2304 约 880 GFLOPs，没有加进上面几格
      derivation: >-
        塔侧两项与 kimi-k3 相同（同一批张量）：encoder 线性项
        2 × 2304 × 396,963,840 = 1,829,213,368,320，每层 14,680,064 的四个因子
        （wqkv 3 × 1536 × 1024、wo 1024 × 1536、fc0 4096 × 1024、fc1 1024 × 4096）
        与清单里 108 个 blocks 线性张量求和逐位相同；projector 线性项
        2 × 576 × (4096² + 7168 × 4096) = 53,150,220,288。
        **主干分母本代重算过**（激活参数变了）：
        2 × (104,368,141,056 − 1,174,405,120) = 206,387,471,872，
        换算 = 576 + 1,882,363,588,608 / 206,387,471,872 = 576 + 9.1 = 585，
        塔开销占比 1.0158（K3 是 1.016）。结论不变：**这一档做 encoder 分离部署
        几乎没有收益**，一张图的 prefill 成本 98.4% 来自它占的 576 个位置
    separability:
      weight_prefix: >-
        vision_tower.（165 个张量）与 mm_projector.（3 个），共 168 个；主干在 language_model.。
        两个前缀不相交
      shard_isolation: dedicated
      shard_note: >-
        实测 index 的 weight_map：96 个分片里最后两个是纯视觉分片
        （model-00095 装 3 个 mm_projector. 张量、model-00096 装 165 个 vision_tower. 张量，
        两片的非视觉张量都是 0 个）。与 kimi-k2.5 / kimi-k3 同一个做法 ——
        **这条发布习惯在 Kimi 这一支连续三代成立**，但只到本代为止，不往后推
      cross_prefix_sharing: >-
        weight_map 的 497,340 个名字里没有任何一个同时匹配 vision_tower. / mm_projector.
        与 language_model.，即没有重名共享；两侧连分片都不重合。
        落盘层面的 tied weights 要看 safetensors 头的数据偏移，本轮没读

precision:
  weights_release: [MXFP4, BF16, FP32]
  weights_release_scope:
    MXFP4:
      manifest_taken: true
      in_precision_table: true
      container: UINT8
      note: 逻辑精度 MXFP4 落盘时装在 UINT8 容器里，清单里看到的是容器 dtype，不是声明错
    BF16: { manifest_taken: true, in_precision_table: true }
    FP32: { manifest_taken: true, in_precision_table: true }
  quantization:
    method: compressed-tensors（mxfp4-pack-quantized）
    group_size: 32
    group_strategy: group
    activation_scheme: none
    scale_format: torch.uint8
    expert_dtype: MXFP4
    packing_note: >-
      路由专家的 FP4 权重两个一字节装进 U8 容器（weight_packed 末维是逻辑维的一半），
      scale 同样是 U8 容器（weight_scale）。参数量按 per_subsystem 的 MXFP4 还原，字节不还原
    per_subsystem:
      expert: MXFP4
      shared_expert: BF16
      attention: BF16
      indexer: BF16
      dense_ffn: BF16
      router: BF16
      embed: BF16
      lm_head: BF16
      norm: BF16
      residual: BF16
      vision: BF16
    per_subsystem_scale:
      expert: UINT8
    per_subsystem_block:
      expert: '[1,32]'
    block_size_note: >-
      与 kimi-k3 相同：逐输出行、沿 K 每 32 个一个 scale，与 config 的 group_size 32 /
      strategy group 一致（block_structure 明写 null，所以 weight_block_size 这一格没有值，
      粒度记在 group_size / group_strategy）。scale 容器 dtype 是 U8；
      按 MX 规范它承载 E8M0 指数，但那是格式声明（config scale_dtype torch.uint8），
      形状与 dtype 区分不了
    subsystem_method: >-
      per_subsystem 的每一格都对**完整清单穷举**过（497,340 条，逐条带 dtype），不是抽样：
      专家 247,296 对 weight_packed / weight_scale 全是 U8 无例外，其余子系统除 FP32 七类外全 BF16。
      **本代新增的 indexer 一栏实测全 BF16**（24 层 × wk / wq_b / weights_proj 共 72 个张量，
      形状取值各只有一种），它被 ignore 的 re:.*self_attn.* 覆盖（模块名层面 24/24），
      所以不量化。两个 indexer.k_norm 按本仓归类进 norm 桶，不在 indexer 桶里。
      量化作用域：config 的 ignore 列表排除 self_attn / shared_experts /
      mlp.(gate|up|gate_up|down)_proj / **block_sparse_moe.gate$** /
      **block_sparse_moe.routed_expert_(up|down)_proj** / lm_head / vision_tower / mm_projector。
      **后两条是本代新增的** —— kimi-k3 的列表没有它们，而那两类在 K3 上同样未被量化，
      即 K3 的 ignore 列表欠描述、本代补齐了两条（见 kimi-k3 的 R21 与 R26）。
      仍未列入的是三类 _res_proj（mlp_res_proj 93 + self_attention_res_proj 93 +
      output_attn_res_proj 1，共 187 个模块，模块名层面覆盖数 0）——
      **两代都没列，而它们两代都是未量化的 BF16**。
      比对 ignore 作用域要按**模块名**（剥掉 .weight / .bias / .weight_packed / .weight_scale /
      .weight_shape 后缀）：本代新增的 block_sparse_moe.gate$ 带 $ 锚，
      拿张量名比会得出「没生效」的假结论。
      模型卡称 MXFP4 权重是从 SFT 起做量化感知训练得到的，同一句还声明激活走 MXFP8
      （规格表 Quantization 行），而 config 的 input_activations 与 kv_cache_scheme 都是 null、
      落盘里没有任何激活 scale —— 三者不一致，见 open_questions
  qat: true

