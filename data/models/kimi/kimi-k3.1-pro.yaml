      MXFP4 发布（compressed-tensors，mxfp4-pack-quantized），96 分片。权重清单逐分片读头取全，
      497,340 个张量，无读失败分片。license_name kimi-k3.1-pro。
      规格表（Model Summary）给 Total Parameters「2.8T」、Activated Parameters「104B」、
      Attention-Layer Composition「69 KDA + 24 Gated DSA」、DSA Index Head Dimension 128 /
      Number of Heads 32 / Top-K 2048、Vision Encoder「MoonViT-V2」「401M」、
      Quantization「MXFP4 weights / MXFP8 activations (quantization-aware training)」。
      正文第一段自述「Post-trained from Kimi K3 ... it is the first model in the K3.1 series」。
      **全卡没有任何带数字的效率倍数**，唯一的效率声明是规格表脚注 `*` 的定性一句
      （见 lineage 的 attention 一条引了原文）
