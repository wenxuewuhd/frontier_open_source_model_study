# 手写记录。与 kimi-k3 的差分是本记录的主线：**唯一的结构变化是那 24 个全注意力层
# 从 MLA 换成 Gated DSA**，其余逐张量相同（497,220 个共有张量的形状与 dtype 零差异）。
# 所以凡是与 K3 相同的那些格子，判据是「同一份形状」而不是「重新推了一遍」；
# 本代独有的 indexer 五族逐层核过形状与精度。
#
# 两件要先说的证据限制（见 open_questions 与 reviewed.method）：
#   1. **本代没有技术报告** —— 模型卡里 7 处 report/pdf 命中全是别家报告与评测名
#      （GDP.pdf / CharXiv），卡自己只链一篇 Tech Blog（本轮未读，JS 渲染）。
#      K3 那份 47 页报告的结论**不往本代回填**。
#   2. **仓里一个 modeling_*.py 都没有**（K3 有两个），`auto_map` 只剩 AutoConfig，
#      却仍声明 custom_code。所以 skill 规则 12 的「形状判不出来才读实现」在本代
#      没有实现可读 —— 判不出来的只能留 open_question，不要去猜。
