bottlenecks:
  - dimension: kv-capacity
    finding: >-
      **DSA 让读取量降、让容量涨，两件事方向相反。** index_topk 2048 把每 query 的
      注意力读取从「全部历史」降到 2048 个条目，但缓存里多了一条 128 维索引键，
      per-token 容量涨 22.2%。只写「稀疏注意力更省」会把方向说反
    quantified: >-
      per-token 元素：MLA latent 24 × 576 = 13,824（与 K3 相同）加索引 K 24 × 128 = 3,072，
      合计 16,896 元素 ⇒ BF16 兜底 33,792 B/token，对 K3 的 27,648 B/token 是 **+22.2%**。
      1M 上下文 27.00 GiB → **33.00 GiB**；两侧 bytes_basis 都是 dtype_fallback，可比。
      KDA 递归状态 69 层、每序列固定 237,404,160 B（226.41 MiB），与 K3 相同、不随上下文长。
      索引宽度取 indexer.wk 的输出维 128：按 index_n_heads × index_head_dim = 4096 算
      会得到 98,304 元素/token，**高估 32 倍**。
      另一侧：索引打分本身是稠密的，每 query 要对全部历史的 128 维键打分，这一路不随 top-k 降 ——
      所以省下的是 MLA 那一路的读带宽与算力，不是索引那一路
    visibility: public
  - dimension: weight-bandwidth
    finding: >-
      与 kimi-k3 同一个形状：只量化路由专家 ⇒ decode 的权重带宽由 BF16 的非专家部分主导。
      indexer 新增的 178.5M 全部常驻、全是 BF16，所以它按 2 B/参数直接加进非专家那一侧
    quantified: >-
      按子系统逐项折算，非专家侧 111,160,730,624 B（K3 口径，不含 embed 与视觉塔）
      加 indexer 的 357,040,128 B，激活专家 25,844,537,752 B，
      **batch 1 合计约 137.36 GB/token**（K3 是 136.99）。
      **口径：这是 batch 1。** 非专家是常数、专家随 batch 涨到 896 个全触达才饱和，
      交叉点仍在 batch ≈ 5；非专家占比 batch 1 约 81.2%、batch 128 约 7.9%。
      低时延档的瓶颈是非专家 BF16，吞吐档的瓶颈是专家，只报一个档会把结论说反。
      derive.py 的 decode_weight_bytes_per_token 对混合精度模型按参数比例等分，
      仍然不可用（与 kimi-k3 的 R1 / R22 同一回事）
    visibility: public
  - dimension: operator-gap
    finding: >-
      本代新增一整条索引算子路，是 Kimi 这一支第一次出现：索引 Q/K 投影、逐头打分权重、
      索引 K 的 LayerNorm、以及 top-k 选择与按索引的稀疏 gather。
      **按本仓最省力的判据（张量名族集合）：K3 独有 0 族、本代新增 5 族，
      集合不同 ⇒ 不能复用 K3 的算子评估结论**
    quantified: >-
      新增 5 个名族 × 24 层 = 120 个张量。索引侧每 token 每层的线性量：
      wq_b 4096 × 1536 + wk 128 × 7168 + weights_proj 32 × 7168 = 7,438,336 乘加，
      24 层合计 178,520,064 —— 相对主干每 token 206.4 GFLOPs（线性项）是 0.17%，
      算力上微不足道；真正的新成本在 **top-k 选择与稀疏 gather**，那两项不是 GEMM，
      形状上判不出代价，本代也没有参考实现可读
    visibility: public
  - dimension: long-context
    finding: >-
      1M 原生、无外推旋钮（同 K3），但本代长上下文的瓶颈形态变了：
      MLA 那一路的读取量被 top-k 钉在 2048，而索引那一路随上下文线性增长
    quantified: >-
      1M 上下文下：MLA 每 query 每层读 2048 × 576 元素（被 top-k 钉住，不随上下文长），
      索引每 query 每层要对 1,048,576 × 128 元素打分（随上下文线性）。
      所以上下文越长，索引那一路在读带宽里的占比越高 —— 这与「稀疏注意力把长上下文变便宜」
      的直觉相反，长上下文下真正没被降下来的是索引
    visibility: public

infra_signals:
  - text: >-
      稀疏注意力这一代的账要分两路记：选择哪些条目（索引，稠密、随上下文增长）与
      读被选中的条目（MLA，被 top-k 钉住）。按「稀疏 ⇒ 省」一句话规划会同时错两处 ——
      容量实际涨 22.2%，而读带宽只在 MLA 那一路降
    evidence: judgement
    horizon: now
    axis: attention
  - text: >-
      索引缓存的宽度必须取产出张量（indexer.wk）的输出维，不能取
      index_n_heads × index_head_dim。本代这个乘积比实际宽 32 倍，
      而容量规划按它做会直接多买 32 倍的索引缓存
    evidence: derived
    horizon: now
    axis: attention
  - text: >-
      本代把 MXFP4 当训练产物（卡称从 SFT 起 QAT），且只量化路由专家；indexer 也在
      不量化之列。按「BF16 发布、部署时自己量化」写的流程在这里要倒过来：
      反量化路径是必需的，BF16 主权重并不存在
    evidence: judgement
    horizon: now
    axis: precision
  - text: >-
      证据档位比上一代薄两档：没有技术报告、仓里没有任何 modeling_*.py。
      凡是形状判不出来的（索引 K 缓存还是重算、index_skip_topk_offset 的语义、
      KDA 状态布局、AttnRes 数据流）本代都只能留疑 ——
      上一代那些结论来自参考实现，**不随权重一起继承**
    evidence: judgement
    horizon: now
    axis: precision

