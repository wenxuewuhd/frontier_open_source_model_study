reviewed:
  date: '2026-10-30'
  scope: [official, derived, judgement]
  reviewer: 本会话逐字段复算 + 一个独立核查代理
  method: >-
    按 .claude/skills/model-audit 的顺序对 facts/kimi-k2 逐字段核：config 全部键、
    完整清单 139,644 个张量（dtype 计数、层号 0–60、每层投影形状、每个被量化张量与同名
    weight_scale_inv 的形状比）、repoinfo 的 tally，以及 derived 的分项与 KV 公式路。
    本会话独立复算的乘式：缓存 576/层 × 61 = 35,136 元素/token、o_proj 入口 64 × 128 = 8192、
    Q 侧两段 7168×1536 + 1536×12288 = 29,884,416 对单段 88,080,384、
    all-to-all 2 × 8 × 7168 × 2 B × 60 = 13,762,560、激活 = 1,014,686,023,680 × 8/384 + 常驻、
    量化块逐张量（含 kv_a_proj_with_mqa [576, 7168] ÷ [5, 56] 的非整除边界）。
    YaRN 的两条结论（温度补偿比值、插值斜坡 low/high）是按参考实现
    modeling_deepseek.py 的公式代入算的（已列入 sources）；
    与 DeepSeek-V3 的骨架比对用的是同仓 facts/ds-v3 的 config 与清单。
    另派一个独立核查代理做对抗式复核（它重算了全部分项与 KV 七问，并对全部 69,608 个
    FP8 权重逐个查了 128 整除性，确认非整除的只有 kv_a_proj_with_mqa 一类、零其他命中），
    三条发现见 R7–R9；它指出的两处实现误读本会话回源码核过。
review:
  - id: R1
    field: hf.sha
    severity: wrong
    claim: sha 写作 fd1984e2b7a3b4c1b0b4b1b0f9d7b9c6d2e8a5f1
    finding: >-
      与 kimi-moonlight-16b 的 R1 同一个错误：按 12 位前缀编补成 40 位。
      真值是 fd1984e2b7a3350dbf7305fe73a4ede25c14de50（repoinfo.json 与 fetched.json 一致）。
      本轮七份记录的 sha 与 fetched.rev 事后逐个核对过
    resolution: corrected
    changed_to: 取 repoinfo.json 的 sha 原值
  - id: R2
    field: context.extension_method
    severity: overreach
    claim: 「注意 mscale = 1.0 意味着不做注意力温度补偿，与 DeepSeek-V2/V3 的 YaRN 用法不同」
    finding: >-
      前半句对、后半句错，而且错在把一个**普遍情况**说成了本代特点。参考实现算的是
      yarn_get_mscale(factor, mscale) / yarn_get_mscale(factor, mscale_all_dim)，
      两个参数相等时比值恒为 1 —— DeepSeek-V2 的 0.707/0.707、V3 的 1.0/1.0 与本代的 1.0/1.0
      都是这种情况，所以三家都不做温度补偿。
      本代真正特殊的是另一个参数：**beta_fast = beta_slow = 1.0**。
      代入 yarn_find_correction_range（dim = qk_rope_head_dim 64、base = rope_theta 50000、
      原生长度 4096）得 low 19 / high 20，即 32 个频率维上只有 1 维宽的斜坡，
      实际是在第 20 维处硬切；DeepSeek 一代是 32 / 1（low 8 / high 20，12 维宽）。
      K2.5 又把 beta_fast 改回了 32 —— 这条线索原本被那句错话盖住了
    resolution: corrected
    changed_to: >-
      extension_method 改写成两条可复算的结论（温度补偿为何不生效、斜坡为何退化并给出
      low/high），并点明 DeepSeek 与 K2.5 的取值；kimi-k2-0905 / kimi-k2-thinking 的同一字段
      指向这里，kimi-k2.5 的 lineage 里补上 beta_fast 1 → 32 的效果
  - id: R3
    field: infra_signals
    severity: imprecise
    claim: 「kv_a_proj_with_mqa 的 576 维不被 128 整除……产出 KV 的那个投影恰好是全模型唯一的非整除张量」
    finding: >-
      事实成立（实测 scale [5, 56]，576 / 128 = 4.5，末块不满；全模型其余被量化张量都整除），
      但写法暗示这是本代的新发现。**同仓 ds-v3 的同名张量是同一个边界**（[576, 7168] 配
      [5, 56]），README 的案例史里已经记过（本仓记作 128ceil）。两家共用 DeepSeek 的
      block-fp8 写法，就共用这个坑 —— 不写清楚会让读者以为要为 Kimi 单独处理
    resolution: corrected
    changed_to: 同一条里补上「与 ds-v3 的同名张量同一个边界，本仓在那一代已记过」
  - id: R4
    field: lineage.changed_from_predecessor
    severity: imprecise
    claim: 「7168×1536 + 1536×12288 = 29.7M，单段写法是 88.1M，省 67%」
    finding: >-
      两个数都算过头了一点点：11,010,048 + 18,874,368 = 29,884,416（29.9M 不是 29.7M），
      相对 7168 × 12288 = 88,080,384 省 66.1% 不是 67%。乘式本身与结论方向都对，
      但记录里的每个数都会被当成可引用的事实，取整方向错了就会在下游累积
    resolution: corrected
    changed_to: 改成写出两个精确值与「省 66%」
  - id: R5
    field: params.counting_note
    severity: imprecise
    claim: 「与 HF tally 逐位相同，两边都排了 scale」
    finding: >-
      成立并复算过：清单里 62,495,192 个 weight_scale_inv 元素（F32）本仓不计入参数、
      只计入字节；HF 的 tally 报的 F32 只有 23,040 个（恰是 60 个 MoE 层的
      e_score_correction_bias），即它也没把 scale 算进参数 —— 所以这一项是逐位相同而不是
      「差一个 scale 总量」。这与 README 记的 ds-v3.2-exp（tally **含** scale）是两种口径，
      derive.py 的双口径判断在这里命中的是第一种
    resolution: confirmed
    changed_to: 原值成立，不改
  - id: R6
    field: infra_signals
    severity: missing
    claim: 没有与 DeepSeek-V3 的骨架对照，而本代的 model_type 是 kimi_k2、架构类名却是 DeepseekV3ForCausalLM
    finding: >-
      漏了一条能直接减少算子评估工作量的对照。用同仓 facts/ds-v3 逐字段比：61 层、
      hidden 7168、intermediate 18432、moe_intermediate 2048、1 个共享专家、q_lora_rank 1536、
      kv_lora_rank 512、qk_nope 128 / qk_rope 64 / v_head_dim 128 **全部相同**；
      不同的是四处：注意力头数 128 → 64（V3 的 q_b_proj 实测 [24576, 1536]、
      kv_b_proj [32768, 512]、o_proj [7168, 16384]，本代各缩一半）、路由专家 256 → 384 且
      n_group 8 / topk_group 4 → 1 / 1、first_k_dense_replace 3 → 1、
      num_nextn_predict_layers 1 → 0。缓存宽度两边都是 576/层
    resolution: corrected
    changed_to: 新增一条 axis = attention 的 infra_signal，写明相同项、四处不同与它们的算子含义

  - id: R7
    field: context.extension_method
    severity: wrong
    claim: 「注意力温度补偿**没有生效** —— 比值 yarn_get_mscale(factor, mscale) / yarn_get_mscale(factor, mscale_all_dim) 恒为 1」
    finding: >-
      读了参考实现的一处、漏了另一处，结论因此反了。两个 mscale 键作用在两个不同地方：
      (a) DeepseekV3Attention.__init__ 里 `if mscale_all_dim:` 为真时
      softmax_scale = q_head_dim^(-0.5) × yarn_get_mscale(factor, mscale_all_dim)²，
      本代 mscale_all_dim = 1.0 是 truthy，**补偿确实做了**，factor 32 下因子是
      0.1×ln(32)+1 = 1.3466，平方 1.8133；
      (b) _set_cos_sin_cache 里 cos/sin 乘的才是那个比值，mscale == mscale_all_dim 时它恒为 1，
      所以**不被额外缩放的是 cos/sin**，不是注意力温度。
      连带两件事：原句「与 DeepSeek-V2/V3 的用法不同」也不成立（V2 的 0.707/0.707、
      V3 的 1.0/1.0 同样会进那个分支，只是因子不同）；而 kimi-k2-0905 把 factor 32 → 64
      说成「只动了一个标量、只改上下文」，实际那个标量同时把 softmax 因子从 1.8133 推到 2.0047
    resolution: corrected
    changed_to: >-
      extension_method 改写成两处分开讲（softmax_scale 的 mscale_all_dim² 与 cos/sin 的比值），
      删掉与 DeepSeek 比较那半句；kimi-k2-0905 的 lineage 与 extension_method 同步补上
      softmax 温度随 factor 变这件事
  - id: R8
    field: infra_signals
    severity: wrong
    claim: 「all-to-all 是前代的 10.8 倍，而参数量只涨 64 倍、激活涨 12.3 倍 —— 本代起 all-to-all 与权重带宽同阶」
    finding: >-
      两处都反了。(1) 10.8 **小于** 64.3（参数量）也小于 12.29（激活），
      所以 all-to-all 是三个增长率里最慢的，「涨得更凶」「只涨 64 倍」的「只」字把大小关系说倒了。
      (2) 「与权重带宽同阶」差三个量级：derive 给的每 token 权重字节是 31,772,460,474 B，
      all-to-all 是 13,762,560 B，比 **2,309 倍**。
      真正的论据是两者随 batch 的走向相反（权重摊薄、通信线性涨），
      而翻转点取决于互联带宽与并行配置 —— 这两个输入本仓没有，所以这是判断不是推导
    resolution: corrected
    changed_to: >-
      lineage 的 moe 一条与 infra_signals 都改写：写出 10.8 < 12.3 < 64、给出 2,309 倍、
      把结论改成「随 batch 走向相反，大 batch 下互联先封顶」，并把该条 evidence 从 derived 降成 judgement
  - id: R9
    field: precision.quantization.expert_dtype
    severity: miscategorized
    claim: expert_dtype 的值 FP8_E4M3 继承了顶层 precision 的 official 口径
    finding: >-
      config 里没有任何逐子系统的精度声明（只有全局 quant_method fp8 / fmt e4m3），
      而那个全局声明对别的子系统是假的（router / embed / lm_head / norm 实测全 BF16）。
      所以「专家是 FP8_E4M3」的依据是清单穷举，不是官方声明。
      同族的 weights_release / per_subsystem / per_subsystem_scale / block_size_note
      都显式标了 derived，只有这一个漏了，继承成 official
    resolution: corrected
    changed_to: >-
      evidence 里补一行 precision.quantization.expert_dtype 标 derived
      （kimi-k2-0905 / kimi-k2-thinking / kimi-k2.5 同样补上）

notes: >-
  Kimi 家族第一个万亿旗舰，也是「kimi_k2」这个 model_type 的起点（架构类名仍是
  DeepseekV3ForCausalLM，结构上是 Moonlight 的放大版加 Q 侧降维）。
  这一代把三件事同时定下来，后面三代都在沿用：61 层 / hidden 7168 的主干尺寸、
  384 专家 top-8 的 MoE 配置、以及「发布即量化」的做法。
  K3 继承了 hidden 7168 与 q_lora_rank 1536，但层数、专家数、注意力类型与量化格式全换了。
  released 取 HF 仓的 createdAt 2025-07-11；lastModified 2026-04-23 是后来的仓库维护。

